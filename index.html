<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearningHub | Prof. Gurlan Vasile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: #1a1a2e;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d44;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .loading-container {
            text-align: center;
            padding: 2rem;
        }

        .logo-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .manual-link {
            margin-top: 2rem;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0;
            animation: fadeIn 0.5s ease 2s forwards;
        }

        .manual-link:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent-blue);
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 0 0 4px 4px;
            font-size: 0.85rem;
            text-decoration: none;
            z-index: 1000;
            transition: top 0.2s;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Profile check completed state */
        .loading-container.ready .spinner {
            border-color: var(--accent-green);
            border-top-color: var(--accent-green);
            animation: none;
        }

        .loading-container.ready .status {
            color: var(--accent-green);
        }

        /* „Tu esti?" — calculatoarele de laborator se impart intre elevi, iar
           progresul se tine in browser. Fara intrebarea asta, al doilea elev
           care se aseaza mosteneste numele, clasa si progresul primului. */
        .identity-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2rem 1.75rem;
            width: min(420px, calc(100vw - 2rem));
            /* Fix in mijlocul ecranului: `body` e flex, iar creditul din subsol
               e frate in acelasi rand si ar impinge cardul spre stanga. */
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
        }

        .identity-card .who {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0.75rem 0 0.25rem;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .identity-card .who-grade {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .identity-card .resume-line {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
        }

        .identity-card .resume-line strong { color: var(--text-primary); }

        .identity-card .question {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        .identity-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .identity-actions button {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.9rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }

        .identity-actions button:hover { filter: brightness(1.12); }
        .identity-actions button:active { transform: translateY(1px); }
        .identity-actions button:focus-visible {
            outline: 3px solid var(--accent-cyan);
            outline-offset: 2px;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border-color: transparent;
        }

        .btn-no {
            background: transparent;
            color: var(--text-secondary);
        }

        @media (max-width: 420px) {
            .identity-card { padding: 1.5rem 1.1rem; }
            .identity-card .who { font-size: 1.35rem; }
        }
    </style>
    <link rel="stylesheet" href="assets/css/mobile.css">
    <link rel="stylesheet" href="assets/css/mobile-first.css">
    </head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="loading-container">
        <div class="logo-icon">🚀</div>
        <h1>LearningHub</h1>
        <p class="tagline">Invata la ritmul tau</p>
        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Se incarca...</p>
        <a href="hub/index.html" class="manual-link">Click aici daca nu esti redirectionat</a>
    </div>

    <!-- „Tu esti?" — se arata DOAR cand browserul are deja un profil salvat. -->
    <div id="identity-confirm" class="loading-container identity-card"
         data-ux-identity-confirm hidden
         role="dialog" aria-modal="true" aria-labelledby="identity-who">
        <div class="logo-icon" aria-hidden="true">👋</div>
        <p class="question">Bine ai venit inapoi!</p>
        <p class="who" id="identity-who">—</p>
        <p class="who-grade" id="identity-grade"></p>
        <p class="resume-line" id="identity-resume" hidden></p>
        <p class="question"><strong>Tu esti?</strong></p>
        <div class="identity-actions">
            <button type="button" class="btn-yes" id="identity-yes">Da, continua</button>
            <button type="button" class="btn-no" id="identity-no">Nu, sunt alt elev</button>
        </div>
    </div>

    <!-- User System -->
    <script src="assets/js/user-system.js"></script>
    <!-- harta lessonId -> adresa lectiei, pentru „continua de unde ai ramas" -->
    <script src="assets/js/now-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const statusEl = document.getElementById('status');
            const loadingEl = document.getElementById('main-content');

            // Bulletproof redirect — runs no matter what (guards against any
            // exception in the selector callback ever stranding the user here).
            function goToHub() { window.location.replace('hub/index.html'); }

            // Gimnaziul intra in hub, ca pana acum. Clasele adaugate ulterior
            // (liceu, maistri, postliceal) ar ateriza intr-un hub de gimnaziu,
            // asa ca sunt duse direct in sectiunea lor.
            const LANDING = {
                cls5:     'content/tic/cls5/index.html',
                cls6:     'content/tic/cls6/index.html',
                cls7:     'content/tic/cls7/index.html',
                cls8:     'content/tic/cls8/index.html',
                cls9:     'content/liceu/index.html',
                cls10:    'content/liceu/index.html',
                cls11:    'content/liceu/index.html',
                cls12:    'content/liceu/index.html',
                maistri1: 'content/profesional/maistri/an1/index.html',
                sanitar1: 'content/profesional/sanitar/an1-medicina/index.html',
                sanitar2: 'content/profesional/sanitar/an2-farmacie/index.html'
            };

            // Cu profilul de liceu stim EXACT clasa lui, nu doar anul de studiu.
            // Inainte, cls9..cls12 duceau toate in selectorul de profiluri, deci
            // elevul care tocmai spusese cine e mai avea patru clicuri de facut.
            function destinatie(profile) {
                if (!profile) return 'hub/index.html';
                if (profile.track && UserSystem.gradeHasTrack(profile.grade)) {
                    return 'content/liceu/' + profile.track + '/' + profile.grade + '/index.html';
                }
                return LANDING[profile.grade] || 'hub/index.html';
            }

            function welcomeAndGo(profileId) {
                let target = 'hub/index.html';
                try {
                    const profile = UserSystem.getActiveProfileData();
                    statusEl.textContent = `Bine ai venit, ${profile?.name || 'Vizitator'}!`;
                    if (loadingEl) loadingEl.classList.add('ready');
                    target = destinatie(profile);
                } catch (e) { /* ignore — redirect anyway */ }
                setTimeout(function() { window.location.replace(target); }, 700);
            }

            /* „Continua de unde ai ramas": cea mai recenta lectie atinsa de acest
               elev. Cheia de progres nu contine calea lectiei, de-aia exista harta
               generata window.NOW_DATA.lectii (tools/gen_now_data.py). */
            function ultimaLectie(profileId) {
                const harta = (window.NOW_DATA || {}).lectii;
                if (!harta || !profileId) return null;
                const prefix = 'atomic-progress-' + profileId + '-';
                let best = null;
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (!k || k.indexOf(prefix) !== 0) continue;
                    const lid = k.slice(prefix.length);
                    const info = harta[lid];
                    if (!info) continue;
                    let d;
                    try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
                    if (!d || !d.timestamp) continue;
                    if (!best || d.timestamp > best.timestamp) {
                        const sc = d.lessonScore || {};
                        best = {
                            timestamp: d.timestamp,
                            url: info.url,
                            titlu: info.titlu,
                            gata: sc.atomsCompleted || (d.completedAtoms || []).length,
                            total: sc.atomsTotal || 0
                        };
                    }
                }
                return best;
            }

            // Calculatoarele din laborator se impart, iar progresul se tine in
            // browser. Daca sarim peste selector cand exista deja un profil, al
            // doilea elev care se aseaza mosteneste numele, clasa si progresul
            // primului. Deci NU mai sarim: intrebam scurt „tu esti?".
            const confirmEl = document.getElementById('identity-confirm');
            let waitingForAnswer = false;

            function askWhoYouAre(profile) {
                waitingForAnswer = true;
                const grade = (UserSystem.GRADES || []).find(g => g.id === profile.grade);
                document.getElementById('identity-who').textContent = profile.name || 'Vizitator';
                document.getElementById('identity-grade').textContent = grade ? grade.label : '';
                // „Continua de unde ai ramas" — aici e locul lui: chiar in
                // secunda in care elevul spune ca el e. Pana acum, progresul
                // se salva dar nu se vedea pe nicio pagina de intrare.
                const ult = ultimaLectie(UserSystem.getActiveProfile());
                const btnDa = document.getElementById('identity-yes');
                if (ult) {
                    const cat = ult.total ? ` (${ult.gata} din ${ult.total})` : '';
                    document.getElementById('identity-resume').innerHTML =
                        'Ultima data ai lucrat la <strong></strong>';
                    document.querySelector('#identity-resume strong').textContent =
                        ult.titlu + cat;
                    document.getElementById('identity-resume').hidden = false;
                    btnDa.textContent = 'Da, continua lectia';
                    btnDa.dataset.resumeUrl = ult.url;
                }

                if (loadingEl) loadingEl.hidden = true;
                confirmEl.hidden = false;
                // Enter alege „Da" — un elev care chiar e el insusi nu pierde timp.
                btnDa.focus();

                btnDa.addEventListener('click', function () {
                    waitingForAnswer = false;
                    confirmEl.hidden = true;
                    if (loadingEl) loadingEl.hidden = false;
                    const reia = this.dataset.resumeUrl;
                    if (reia) {
                        statusEl.textContent = 'Continuam de unde ai ramas...';
                        if (loadingEl) loadingEl.classList.add('ready');
                        setTimeout(function () { window.location.replace(reia); }, 500);
                        return;
                    }
                    welcomeAndGo(UserSystem.getActiveProfile());
                }, { once: true });

                document.getElementById('identity-no').addEventListener('click', function () {
                    waitingForAnswer = false;
                    confirmEl.hidden = true;
                    if (loadingEl) loadingEl.hidden = false;
                    statusEl.textContent = 'Alege-ti profilul...';
                    // switchProfile sterge profilul activ si deschide selectorul.
                    UserSystem.switchProfile(welcomeAndGo);
                }, { once: true });
            }

            const activeId = UserSystem.getActiveProfile();
            const activeData = activeId ? UserSystem.getActiveProfileData() : null;
            if (activeId && activeData) {
                askWhoYouAre(activeData);
            } else {
                statusEl.textContent = 'Selecteaza profilul tau...';
                setTimeout(() => {
                    UserSystem.showProfileSelector(welcomeAndGo);
                }, 400);
            }

            // Plasa de siguranta: daca dupa 12s tot suntem aici, mergem mai departe.
            // NU se declanseaza cat timp elevul are intrebarea „tu esti?" pe ecran —
            // altfel l-ar duce in profilul altcuiva exact cat se gandeste.
            setTimeout(function() {
                if (waitingForAnswer) return;
                if (document.getElementById('main-content')) goToHub();
            }, 12000);
        });
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

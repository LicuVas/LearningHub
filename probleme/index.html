        ['aleg', 'O problemă pe care o ALEG săptămâna asta:', 'de exemplu: învăț 15 minute pe zi la engleză'],
        ['evit', 'Problema mai urâtă pe care o evit așa:', 'de exemplu: să nu înțeleg nimic la testul de vineri'],
        ['castig', 'Plăcerea pe care o câștig după:', 'de exemplu: un meci cu prietenii sâmbătă']];
      var inp = {};
      campuri.forEach(function (x) {
        var id = 'f-' + x[0];
        var ta = h('textarea', { id: id, rows: '2', maxlength: '160', placeholder: x[2] });
        ta.value = S.fisa[x[0]] || '';
        inp[x[0]] = ta;
        c.appendChild(h('label', { for: id, text: x[1] })); c.appendChild(ta);
      });
      var msg = h('p', { class: 'mesaj', 'aria-live': 'polite' });
      var bF = h('button', { class: 'opt', type: 'button', 'data-ok': '1' }, 'Fă-mi cartonașul');
      var bS = h('button', { class: 'alt', type: 'button', 'data-tip': 'sari' }, 'Sari peste →');
      bS.addEventListener('click', function () { bS.disabled = true; avans(); });
      bF.addEventListener('click', function () {
        var v = {};
        for (var k in inp) v[k] = inp[k].value.trim().slice(0, 160);
        if (!v.aleg) { msg.textContent = 'Scrie măcar prima problemă, pe cea pe care o alegi.'; msg.className = 'mesaj rau'; inp.aleg.focus(); return; }
        S.fisa = v; salveaza();
        bF.disabled = true; bS.parentNode.removeChild(bS);
        msg.textContent = ''; msg.className = 'mesaj';
        var r = raspuns(c, 'info', 'Cartonașul tău', [cartonas(v), 'Fă o captură de ecran dacă vrei să-l păstrezi. Îl regăsești și la final, lângă insignă.']);
        butonNext(c); vezi(r);
      });
      c.appendChild(msg); c.appendChild(h('div', { class: 'rand' }, bF, bS));
      L.appendChild(c);
    }
  };

  /* ---------- o parte ---------- */
  function arataParte(id) {
    var p = gasesteParte(id), st = stare(id);
    var nr = D.parti.indexOf(p) + 1;
    app.innerHTML = '';
    var bara = h('div', { class: 'bara', role: 'progressbar', 'aria-label': 'Cât ai parcurs din partea asta', 'aria-valuemin': '0', 'aria-valuemax': String(totalPasi(p)) }, h('i'));
    var cap = h('div', { class: 'cap-parte' },
      h('span', { class: 'eticheta', text: 'Partea ' + nr + ' din ' + D.parti.length }),
      h('h1', { id: 'titlu-parte', tabindex: '-1' }, h('span', { 'aria-hidden': 'true' }, p.emoji + ' '), p.titlu),
      bara);
    var lucru = h('div', { id: 'lucru' });
    app.appendChild(cap); app.appendChild(lucru);
    ctx = { p: p, st: st, lucru: lucru, bara: bara };
    if (st.gata) sfarsitParte(); else randeaza();
  }
  function actualizeazaBara() {
    if (!ctx) return;
    var t = totalPasi(ctx.p), c = ctx.st.gata ? t : pasCurent(ctx.p, ctx.st);
    ctx.bara.firstChild.style.width = (100 * c / t) + '%';
    ctx.bara.setAttribute('aria-valuenow', String(c));
  }
  function randeaza() {
    var bl = ctx.p.blocuri;
    if (ctx.st.b >= bl.length) return termina();
    if (ctx.st.i >= marimeBloc(bl[ctx.st.b])) { ctx.st.b++; ctx.st.i = 0; return randeaza(); }
    actualizeazaBara();
    ctx.lucru.innerHTML = '';
    var b = bl[ctx.st.b], f = RANDARI[b.tip];
    if (f) f(b, ctx.lucru); else avans();
  }
  function sus() {
    window.scrollTo(0, 0);
    var t = document.getElementById('titlu-parte');
    if (t) try { t.focus({ preventScroll: true }); } catch (e) {}
  }
  function avans() {
    if (!ctx) return;
    var b = ctx.p.blocuri[ctx.st.b];
    ctx.st.i++;
    if (!b || ctx.st.i >= marimeBloc(b)) { ctx.st.b++; ctx.st.i = 0; }
    salveaza();
    if (ctx.st.b >= ctx.p.blocuri.length) return termina();
    randeaza(); sus();
  }
  function termina() {
    ctx.st.gata = true;
    ctx.st.best = puncteParte(ctx.st, ctx.p);
    salveaza(); actualizeazaScor();
    sfarsitParte(); sus();
  }
  function sfarsitParte() {
    var p = ctx.p, st = ctx.st, idx = D.parti.indexOf(p), urm = D.parti[idx + 1];
    actualizeazaBara();
    ctx.lucru.innerHTML = '';
    var cel = puncteParte(st, p), acum = Math.min(st.p || 0, maxParte(p));
    var c = h('section', { class: 'card gata-parte' },
      h('h2', { text: '🎉 Gata, Partea ' + (idx + 1) + '!' }),
      acum < cel
        ? h('p', { text: 'Încercarea asta: ' + acum + ' din ' + cuDe(maxParte(p), 'puncte') + '. Cel mai bun scor al tău aici: ' + cel + '.' })
        : h('p', { text: 'Ai strâns ' + cel + ' din ' + cuDe(maxParte(p), 'puncte') + ' în partea asta.' }));
    (LEGI_PARTE[p.id] || []).forEach(function (k) { if (D.legi && D.legi[k]) c.appendChild(h('p', { class: 'lege', text: D.legi[k] })); });
    ctx.lucru.appendChild(c);
    var rand = h('div', { class: 'rand-v' });
    if (urm && !eGata(urm.id)) {
      var bU = h('button', { class: 'next', type: 'button' }, 'Partea următoare: ' + urm.emoji + ' ' + urm.titlu + ' →');
      bU.addEventListener('click', function () { bU.disabled = true; mergi('#' + urm.id); });
      rand.appendChild(bU);
    } else {
      var rest = D.parti.filter(function (x) { return !eGata(x.id); });
      if (rest.length) {
        var bR = h('button', { class: 'next', type: 'button' }, 'Mai ai: ' + rest[0].emoji + ' ' + rest[0].titlu + ' →');
        bR.addEventListener('click', function () { bR.disabled = true; mergi('#' + rest[0].id); });
        rand.appendChild(bR);
      } else {
        var bI = h('button', { class: 'next', type: 'button' }, '🏅 Vezi insigna →');
        bI.addEventListener('click', function () { bI.disabled = true; mergi('#final'); });
        rand.appendChild(bI);
      }
    }
    var textRef = '↺ Refă partea', armatRef = false, ceasRef = null;
    var bRef = h('button', { class: 'alt', type: 'button' }, textRef);
    bRef.addEventListener('click', function () {
      // două apăsări, ca la „Ia-o de la capăt”: refacerea scoate bifa „gata” până termini iar partea
      if (!armatRef) {
        armatRef = true; bRef.textContent = 'Sigur? Apasă încă o dată ca s-o iei de la începutul părții.';
        ceasRef = setTimeout(function () { armatRef = false; bRef.textContent = textRef; }, 6000);
        return;
      }
      clearTimeout(ceasRef);
      st.b = 0; st.i = 0; st.p = 0; st.dat = {}; st.gata = false; salveaza(); actualizeazaScor(); arataParte(p.id); sus();
    });
    var bM = h('button', { class: 'alt', type: 'button' }, '☰ Înapoi la meniu');
    bM.addEventListener('click', function () { mergi('#meniu'); });
    rand.appendChild(bRef); rand.appendChild(bM);
    ctx.lucru.appendChild(rand);
  }

  /* ---------- meniul ---------- */
  function arataMeniu() {
    app.innerHTML = '';
    var prima = null;
    for (var k = 0; k < D.parti.length; k++) if (!eGata(D.parti[k].id)) { prima = D.parti[k]; break; }
    var hero = h('section', { class: 'hero' },
      h('h1', { text: 'Toată lumea are probleme' }),
      h('p', { class: 'sub', text: '…dar pe unele le poți alege tu.' }),
      h('p', { text: 'Pentru elevii de gimnaziu (clasele V–VIII). La final vei ști de ce nimeni nu trăiește fără probleme, cum alegi problemele mici în locul celor mari și ce legătură au banii și plăcerile cu toate astea.' }),
      h('p', { class: 'mic', text: '8 părți, cam două ore în total, dar nu trebuie să le faci pe toate deodată. Începi cu Partea 1. Ce ai făcut rămâne pe acest dispozitiv.' }));
    var eticheta;
    if (!prima) eticheta = '🏅 Vezi insigna →';
    else if (inceputa(prima.id)) eticheta = 'Continuă: ' + prima.emoji + ' ' + prima.titlu + ' →';
    else if (prima === D.parti[0] && total() === 0) eticheta = 'Începe →';
    else eticheta = 'Continuă cu Partea ' + (D.parti.indexOf(prima) + 1) + ': ' + prima.titlu + ' →';
    var bStart = h('button', { class: 'next', id: 'incepe', type: 'button' }, eticheta);
    bStart.addEventListener('click', function () { mergi(prima ? '#' + prima.id : '#final'); });
    var lista = h('nav', { class: 'lista-parti', 'aria-label': 'Părțile paginii' });
    D.parti.forEach(function (p, k) {
      var st = S.parti[p.id], gata = eGata(p.id);
      var txt = gata ? '✔ gata · ' + puncteParte(st, p) + ' p' : (inceputa(p.id) ? 'în lucru: ' + Math.round(100 * pasCurent(p, st) / totalPasi(p)) + '%' : '');
      var bt = h('button', { class: 'parte-btn' + (gata ? ' gata' : ''), type: 'button' },
        h('span', { class: 'pe', 'aria-hidden': 'true', text: p.emoji }),
        h('span', { class: 'pt' }, h('b', { text: 'Partea ' + (k + 1) + ' · ' + p.titlu }), h('small', { text: p.rezumat }), txt ? h('small', { class: 'stare', text: txt }) : null));
      bt.addEventListener('click', function () { mergi('#' + p.id); });
      lista.appendChild(bt);
    });
    app.appendChild(hero); app.appendChild(bStart); app.appendChild(citatProfesor());
    app.appendChild(h('h2', { text: 'Părțile' })); app.appendChild(lista);
    if (toateGata()) {
      var bIns = h('button', { class: 'alt', type: 'button', style: 'width:100%;margin-top:8px' }, '🏅 Insigna și cele 10 legi');
      bIns.addEventListener('click', function () { mergi('#final'); });
      app.appendChild(bIns);
    }
    app.appendChild(sectiuneProfesor()); app.appendChild(cutieAjutor()); app.appendChild(butonReset());
  }

  /* ---------- finalul ---------- */
  function arataFinal() {
    app.innerHTML = '';
    if (!toateGata()) {
      var rest = D.parti.filter(function (p) { return !eGata(p.id); });
      app.appendChild(h('h1', { text: '🏅 Insigna te așteaptă' }));
      app.appendChild(h('p', { text: 'Mai ai ' + rest.length + (rest.length === 1 ? ' parte' : ' părți') + ' de parcurs:' }));
      var l = h('div', { class: 'lista-parti' });
      rest.forEach(function (p) {
        var bt = h('button', { class: 'parte-btn', type: 'button' }, h('span', { class: 'pe', 'aria-hidden': 'true', text: p.emoji }), h('span', { class: 'pt' }, h('b', { text: 'Partea ' + (D.parti.indexOf(p) + 1) + ' · ' + p.titlu })));
        bt.addEventListener('click', function () { mergi('#' + p.id); });
        l.appendChild(bt);
      });
      app.appendChild(l);
      return;
    }
    var c = h('section', { class: 'card', id: 'final', style: 'text-align:center' });
    c.appendChild(desen('insigna'));
    c.appendChild(h('h1', { text: 'Alegătorul de probleme' }));
    c.appendChild(h('p', { text: 'Ai trecut prin toate cele 8 părți și ai strâns ' + total() + ' din ' + cuDe(maxTotal(), 'puncte') + '.' }));
    app.appendChild(c);
    var legi = h('ol', { class: 'legi' });
    (D.legi || []).forEach(function (t) { legi.appendChild(h('li', { text: t })); });
    app.appendChild(h('section', { class: 'card' }, h('h2', { text: 'Cele 10 legi ale problemelor' }), legi));
    if (S.fisa && S.fisa.aleg) {
      var bSterge = h('button', { class: 'alt mic-buton', type: 'button' }, 'Șterge cartonașul de pe acest dispozitiv');
      var sec = h('section', { class: 'card' }, h('h2', { text: '✍️ Problema ta de săptămâna asta' }), cartonas(S.fisa), bSterge);
      bSterge.addEventListener('click', function () { S.fisa = {}; salveaza(); sec.parentNode.removeChild(sec); });
      app.appendChild(sec);
    }
    app.appendChild(h('section', { class: 'card citat' }, h('p', { text: 'Profesorul vostru a înțeles asta abia la 44 de ani. Voi o știți de acum. Data viitoare când ai o problemă, întreabă-te: „Care e ușa A?”' })));
    var bM = h('button', { class: 'next', type: 'button' }, '☰ Înapoi la meniu');
    bM.addEventListener('click', function () { mergi('#meniu'); });
    app.appendChild(bM); app.appendChild(cutieAjutor()); app.appendChild(butonReset());
  }

  aplicaPref();
  actualizeazaScor();
  ruteaza();
})();
</script>
</body>
</html>

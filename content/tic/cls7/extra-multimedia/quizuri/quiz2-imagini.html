<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Editare imagini | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Editare Multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Editare imagini</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Formate de imagine",
                description: "Invata despre formatele comune de imagini digitale",
                xpReward: 50,
                questions: [
                    {
                        text: "Care format de imagine este cel mai potrivit pentru fotografii?",
                        options: [
                            "GIF - pentru animatii",
                            "JPG/JPEG - comprima bine fotografiile",
                            "TXT - pentru texte",
                            "MP3 - pentru muzica"
                        ],
                        correct: 1,
                        explanation: "JPG (sau JPEG) este formatul ideal pentru fotografii deoarece comprima imaginile reducand marimea fisierului, pastrind calitatea vizuala buna."
                    },
                    {
                        text: "Ce format de imagine pastreaza transparenta (fundal transparent)?",
                        options: [
                            "JPG",
                            "BMP",
                            "PNG",
                            "MP4"
                        ],
                        correct: 2,
                        explanation: "PNG poate avea fundal transparent, ceea ce il face perfect pentru logo-uri, iconite sau imagini care trebuie suprapuse pe alte fundaluri."
                    },
                    {
                        text: "Ce este special la formatul GIF?",
                        options: [
                            "Are cea mai buna calitate",
                            "Poate contine animatii simple (imagini in miscare)",
                            "Este cel mai mic format",
                            "Nu poate fi deschis pe telefon"
                        ],
                        correct: 1,
                        explanation: "GIF este special pentru ca poate contine animatii - mai multe cadre care se repeta, creand imagini in miscare, precum meme-urile animate."
                    }
                ]
            },
            2: {
                title: "Nivel 2: JPG vs PNG",
                description: "Descopera diferentele dintre cele mai populare formate",
                xpReward: 75,
                questions: [
                    {
                        text: "Care este principalul dezavantaj al formatului JPG?",
                        options: [
                            "Nu poate fi deschis",
                            "Pierde din calitate la fiecare salvare (compresie cu pierderi)",
                            "Fisierele sunt prea mari",
                            "Nu accepta culori"
                        ],
                        correct: 1,
                        explanation: "JPG foloseste compresie cu pierderi - de fiecare data cand salvezi, imaginea pierde putin din calitate. Pentru editari multiple, PNG este mai bun."
                    },
                    {
                        text: "Cand este mai bine sa folosesti PNG in loc de JPG?",
                        options: [
                            "Niciodata",
                            "Pentru logo-uri, grafice cu text, sau cand ai nevoie de transparenta",
                            "Doar pentru poze de vacanta",
                            "Cand vrei fisiere mai mici"
                        ],
                        correct: 1,
                        explanation: "PNG este ideal pentru: logo-uri, grafice, capturi de ecran, imagini cu text sau orice are nevoie de transparenta si calitate perfecta."
                    },
                    {
                        text: "Care format produce de obicei fisiere mai mici pentru fotografii?",
                        options: [
                            "PNG - intotdeauna",
                            "JPG - datorita compresiei",
                            "BMP - formatul de baza",
                            "Toate sunt la fel"
                        ],
                        correct: 1,
                        explanation: "JPG comprima fotografiile eficient, rezultand fisiere mult mai mici decat PNG sau BMP, ceea ce e ideal pentru web si stocare."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Redimensionare",
                description: "Invata sa modifici dimensiunea imaginilor",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce inseamna sa redimensionezi o imagine?",
                        options: [
                            "Sa ii schimbi culoarea",
                            "Sa ii schimbi dimensiunea (latimea si inaltimea)",
                            "Sa o stergi",
                            "Sa o copiezi"
                        ],
                        correct: 1,
                        explanation: "Redimensionarea inseamna modificarea latimii si/sau inaltimii unei imagini - o poti face mai mare sau mai mica."
                    },
                    {
                        text: "Ce se intampla daca maresti foarte mult o imagine mica?",
                        options: [
                            "Devine mai clara",
                            "Devine neclara, pixelata (se vad patratele)",
                            "Nu se intampla nimic",
                            "Se sterge automat"
                        ],
                        correct: 1,
                        explanation: "Cand maresti o imagine mica, pixelii (punctele colorate) devin vizibili, facand imaginea neclara si 'pixelata'. E mai bine sa incepi cu o imagine mare."
                    },
                    {
                        text: "Ce inseamna sa pastrezi 'proportiile' sau 'aspect ratio' la redimensionare?",
                        options: [
                            "Sa schimbi culorile proportional",
                            "Sa pastrezi raportul dintre latime si inaltime, ca imaginea sa nu se deformeze",
                            "Sa faci imaginea neagra",
                            "Sa o rotesti"
                        ],
                        correct: 1,
                        explanation: "Pastrarea proportiilor inseamna ca daca modifici latimea, inaltimea se ajusteaza automat (si invers), astfel imaginea nu se intinde sau comprimat ciudat."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Decupare si ajustari",
                description: "Invata tehnici de editare de baza",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce inseamna sa decupezi (crop) o imagine?",
                        options: [
                            "Sa o stergi complet",
                            "Sa tai o portiune si sa pastrezi doar partea dorita",
                            "Sa o faci mai mare",
                            "Sa ii schimbi formatul"
                        ],
                        correct: 1,
                        explanation: "Decuparea (crop) inseamna sa selectezi doar o portiune din imagine si sa elimini restul - util pentru a indeparta elementele nedorite din margini."
                    },
                    {
                        text: "Ce face ajustarea luminozitatii (brightness)?",
                        options: [
                            "Schimba culorile in alb-negru",
                            "Face imaginea mai luminoasa sau mai intunecata",
                            "Mareste imaginea",
                            "Adauga text"
                        ],
                        correct: 1,
                        explanation: "Ajustarea luminozitatii face imaginea mai luminoasa (valori pozitive) sau mai intunecata (valori negative), utila pentru poze subexpuse sau supraexpuse."
                    },
                    {
                        text: "Ce face ajustarea contrastului?",
                        options: [
                            "Roteste imaginea",
                            "Mareste sau micsoreaza diferenta dintre zonele luminoase si cele intunecate",
                            "Adauga culori noi",
                            "Face imaginea mai mare"
                        ],
                        correct: 1,
                        explanation: "Contrastul controleaza diferenta dintre tonurile luminoase si intunecate. Contrast mare = diferente puternice, contrast mic = imagine 'spalta'."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Filtre si efecte",
                description: "Descopera filtrele si efectele speciale",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce este un filtru de imagine?",
                        options: [
                            "Un virus de calculator",
                            "O modificare automata care schimba aspectul imaginii (culori, ton, stil)",
                            "Un program de descarcat",
                            "O carcasa de telefon"
                        ],
                        correct: 1,
                        explanation: "Un filtru aplica modificari automate asupra imaginii - poate schimba culorile, adauga efecte vintage, alb-negru, sepia, blur etc."
                    },
                    {
                        text: "Ce face filtrul 'Blur' (estompare)?",
                        options: [
                            "Face imaginea mai clara",
                            "Face imaginea neclara, estompata, ca si cum ai privi prin sticla mata",
                            "Adauga culori vii",
                            "Roteste imaginea"
                        ],
                        correct: 1,
                        explanation: "Blur estompeaza imaginea, facand-o neclara. E folosit pentru fundaluri, pentru a crea efect de adancime sau pentru a ascunde detalii."
                    },
                    {
                        text: "Ce efect are filtrul 'Sepia'?",
                        options: [
                            "Face imaginea albastra",
                            "Da imaginii un aspect vintage, maro-auriu, ca fotografiile vechi",
                            "Inverseaza culorile",
                            "Face imaginea transparenta"
                        ],
                        correct: 1,
                        explanation: "Filtrul Sepia da imaginilor un aspect vintage, nostalgic, cu tonuri calde maro-aurii, imitand fotografiile vechi din secolul 19."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls7_multimedia_quiz2_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls7_multimedia_quiz2_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-audio.html'">
                                Quiz-ul 3: Fisiere audio
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

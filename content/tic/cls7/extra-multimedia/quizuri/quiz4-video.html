<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Editare Audio | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-green);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-green);
        }

.option:hover {
            border-color: var(--accent-cyan);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin: 1.5rem 0;
        }
    </style>

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Editare Multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Editare Audio</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Track-uri audio",
                description: "Invata ce sunt pistele audio si cum se folosesc",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un track audio intr-un proiect video?",
                        options: [
                            "Un tip de melodie populara",
                            "O pista separata pe timeline care contine sunet",
                            "Un program de editare video",
                            "Un fisier imagine cu sunet"
                        ],
                        correct: 1,
                        explanation: "Un track audio este o pista separata pe timeline-ul editorului video. Poti avea mai multe track-uri suprapuse: muzica de fundal, voce, efecte sonore — toate suna in acelasi timp."
                    },
                    {
                        text: "De ce este util sa ai mai multe track-uri audio in acelasi proiect video?",
                        options: [
                            "Pentru ca ocupa mai mult spatiu pe disc",
                            "Ca sa poti controla independent volumul fiecarui tip de sunet (voce, muzica, efecte)",
                            "Pentru ca editorul nu poate reda un singur track",
                            "Pentru a face fisierul mai mic"
                        ],
                        correct: 1,
                        explanation: "Track-urile separate iti permit sa controlezi fiecare tip de sunet independent: poti reduce muzica de fundal fara sa afectezi vocea, sau sa elimini efectele sonore pastrand muzica."
                    },
                    {
                        text: "Intr-un videoclip tipic, pe care track audio ar trebui sa fie vocea naratorului (voice-over)?",
                        options: [
                            "Pe acelasi track cu muzica de fundal",
                            "Nu trebuie pus pe niciun track",
                            "Pe un track separat, diferit de cel cu muzica de fundal",
                            "Pe track-ul imaginii video"
                        ],
                        correct: 2,
                        explanation: "Vocea naratorului trebuie sa fie pe un track separat de muzica de fundal. Astfel poti ajusta individual volumul fiecaruia — vocea ramane clara chiar daca muzica e mai incet."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Ajustarea volumului",
                description: "Invata cum sa echilibrezi sunetul intre track-uri",
                xpReward: 75,
                questions: [
                    {
                        text: "Care este regula de baza pentru echilibrul volumului intre voce si muzica de fundal?",
                        options: [
                            "Muzica de fundal trebuie sa fie mai tare decat vocea",
                            "Vocea trebuie sa fie mai tare (100%), iar muzica de fundal mai incet (20-40%)",
                            "Amandoua trebuie sa fie la acelasi volum",
                            "Volumul nu conteaza in editare video"
                        ],
                        correct: 1,
                        explanation: "Vocea principala se seteaza la 100% (nivelul maxim clar), iar muzica de fundal la 20-40% — suficient sa se simta, dar fara sa acopere ce spune narratorul. Daca muzica acopera vocea, e prea tare!"
                    },
                    {
                        text: "Ce se intampla daca muzica de fundal este la acelasi volum cu vocea in videoclip?",
                        options: [
                            "Videoclipul suna mai profesional",
                            "Vocea se aude mai clar",
                            "Muzica acopera vocea si spectatorii nu pot intelege ce se spune",
                            "Fisierul devine mai mic"
                        ],
                        correct: 2,
                        explanation: "Cand muzica si vocea sunt la acelasi volum, se suprapun si se anuleaza reciproc — spectatorul nu poate distinge cuvintele. Regula: vocea > muzica de fundal intotdeauna."
                    },
                    {
                        text: "In ce situatie ai reduce volumul muzicii de fundal la aproape zero temporar?",
                        options: [
                            "Cand apare o scena de actiune",
                            "Cand incep sa vorbeasca personajele sau narratorul",
                            "La inceputul videoclipului",
                            "Cand afisezi titluri"
                        ],
                        correct: 1,
                        explanation: "Cand vorbeste cineva important, muzica de fundal trebuie sa scada la minim (ducking) pentru ca dialogul sau naratiunea sa fie perfect intelligibila. Aceasta tehnica se numeste 'audio ducking'."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Fade In si Fade Out",
                description: "Invata cum sa faci tranzitii audio lente si profesionale",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce inseamna 'Fade In' aplicat unui track audio?",
                        options: [
                            "Sunetul se opreste brusc",
                            "Sunetul creste treptat de la zero la volumul normal",
                            "Sunetul se repeta la nesfarsit",
                            "Sunetul sare la jumatate de volum"
                        ],
                        correct: 1,
                        explanation: "Fade In inseamna ca sunetul porneste de la liniste (volum 0) si creste progresiv pana la nivelul normal. Creeaza un inceput lin, fara o intrare brusca a sunetului."
                    },
                    {
                        text: "Unde se aplica de obicei Fade Out intr-un videoclip?",
                        options: [
                            "La inceputul videoclipului",
                            "In mijlocul unei scene de actiune",
                            "La sfarsitul videoclipului sau al unui segment muzical",
                            "In timpul pauzelor"
                        ],
                        correct: 2,
                        explanation: "Fade Out se aplica la sfarsitul videoclipului sau al unui segment muzical — sunetul scade treptat pana la zero in loc sa se opreasca brusc. Creeaza un final profesional si curgator."
                    },
                    {
                        text: "De ce este preferabil sa folosesti Fade Out in loc sa opresti brusc muzica?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Fade Out face fisierul mai mic",
                            "Oprirea brusca a sunetului suna neprofesional; Fade Out creeaza un final lin si placut",
                            "Fade Out mareste volumul sunetului"
                        ],
                        correct: 2,
                        explanation: "O oprire brusca a muzicii suna ca o eroare tehnica si deranjeaza spectatorul. Fade Out de 2-3 secunde creeaza o inchidere naturala, semnalind ca videoclipul se termina in mod intentionat."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Voice-over",
                description: "Invata ce este voice-over si cum se adauga la un video",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este un 'voice-over' intr-un videoclip?",
                        options: [
                            "Un efect de ecou adaugat vocii",
                            "O inregistrare vocala narativa inregistrata separat si adaugata peste imaginea video",
                            "Sunetul original capturat de camera in timpul filmarii",
                            "Un tip de microfon extern"
                        ],
                        correct: 1,
                        explanation: "Voice-over este vocea naratorului inregistrata separat (nu in timpul filmarii) si adaugata pe un track audio dedicat al proiectului. Este folosit pentru a explica, comenta sau nara actiunea din video."
                    },
                    {
                        text: "Care este ordinea corecta pentru a adauga un voice-over la un videoclip?",
                        options: [
                            "Exporti videoclipul final, apoi adaugi vocea",
                            "Inregistrezi vocea, importezi fisierul audio, sincronizezi cu video, ajustezi volumul muzicii",
                            "Scrii textul, apoi calculatorul il citeste automat",
                            "Adaugi vocea inainte sa filmezi"
                        ],
                        correct: 1,
                        explanation: "Pasii corecti: 1) Inregistrezi vocea (telefon sau microfon) 2) Importezi fisierul audio in editor 3) Sincronizezi cu actiunea din video 4) Ajustezi volumul muzicii de fundal sa scada cand vorbesti."
                    },
                    {
                        text: "De ce trebuie sa reduci volumul muzicii de fundal atunci cand voice-over-ul este activ?",
                        options: [
                            "Pentru ca muzica si voice-over-ul nu pot fi pe track-uri diferite",
                            "Pentru ca muzica tare acopera vocea naratorului, facand-o greu de inteles",
                            "Pentru ca voice-over-ul face automat muzica mai tare",
                            "Nu trebuie sa reduci nimic"
                        ],
                        correct: 1,
                        explanation: "Cand vocea naratorului (voice-over) este activa, muzica de fundal trebuie sa fie la 15-25% din volumul normal pentru ca naratiunea sa fie clara. Vocea este intotdeauna mai importanta decat muzica de fundal."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Muzica gratuita pentru proiecte",
                description: "Invata unde gasesti muzica legala si cum sa o folosesti corect",
                xpReward: 150,
                questions: [
                    {
                        text: "De ce trebuie sa folosesti muzica 'copyright-free' (royalty-free) in videoclipurile tale?",
                        options: [
                            "Pentru ca suna mai bine",
                            "Muzica protejata de copyright poate fi stearsa sau penalizata pe platformele online",
                            "Este mai usor de descarcat",
                            "Nu conteaza ce muzica folosesti"
                        ],
                        correct: 1,
                        explanation: "Folosirea muzicii fara permisiunea autorului incalca drepturile de autor (copyright). Pe platforme ca YouTube, videoclipurile pot fi blocate, silentiate sau demonetizate. Muzica royalty-free sau CC0 este legala si gratuita."
                    },
                    {
                        text: "Care dintre urmatoarele este o sursa recomandata de muzica gratuita si legala pentru proiecte scolare?",
                        options: [
                            "Descarci direct de pe YouTube fara permisiune",
                            "Folosesti melodia preferata din telefon",
                            "Pixabay Music (pixabay.com/music) — mii de melodii gratuite, fara atribuire",
                            "Copiezi muzica de pe un CD cumparat"
                        ],
                        correct: 2,
                        explanation: "Pixabay Music ofera mii de melodii gratuite, licenta CC0 — poti folosi fara sa ceri permisiune si fara sa mentionezi autorul. Alte surse bune: Freesound (efecte sonore) si YouTube Audio Library."
                    },
                    {
                        text: "Ce inseamna ca o melodie are licenta 'CC0'?",
                        options: [
                            "Poti asculta melodia dar nu o poti descarca",
                            "Melodia este complet libera de drepturi — o poti folosi, modifica si distribui fara restrictii",
                            "Trebuie sa platesti 0 euro, dar ceri permisiunea autorului",
                            "Melodia expira dupa 0 zile"
                        ],
                        correct: 1,
                        explanation: "CC0 (Creative Commons Zero) inseamna ca autorul a renuntat la toate drepturile — melodia este in domeniu public. O poti folosi liber in orice proiect, inclusiv comercial, fara sa ceri permisiunea sau sa mentionezi autorul."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls7_multimedia_quiz4_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls7_multimedia_quiz4_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz5-proiecte.html'">
                                Quiz-ul 5: Proiecte multimedia
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

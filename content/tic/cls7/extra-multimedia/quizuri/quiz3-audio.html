<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3: Fisiere audio si editare audio-video | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-green);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-green);
        }

.option:hover {
            border-color: var(--accent-cyan);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin: 1.5rem 0;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Editare Multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 3: Fisiere audio si editare audio-video</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Fisiere audio — formate si gestionare",
                description: "Invata tipurile de fisiere audio si cum le gestionezi (OMEN 3393/2017 — interfata; gestionare fisiere)",
                xpReward: 50,
                questions: [
                    {
                        text: "Care dintre urmatoarele NU este un format audio?",
                        options: [
                            "MP3",
                            "WAV",
                            "PNG",
                            "AAC"
                        ],
                        correct: 2,
                        explanation: "PNG este un format de IMAGINE, nu de audio. MP3, WAV si AAC sunt formate audio folosite pentru stocarea sunetului digital."
                    },
                    {
                        text: "Care este principalul avantaj al formatului MP3 fata de WAV?",
                        options: [
                            "MP3 are calitate audio mai buna",
                            "MP3 comprima fisierul (de ~10 ori mai mic), pastrand o calitate acceptabila",
                            "MP3 nu pierde niciodata date audio",
                            "MP3 functioneaza doar pe Windows"
                        ],
                        correct: 1,
                        explanation: "MP3 foloseste compresie cu pierderi: elimina sunete greu perceptibile de urechea umana, reducand dimensiunea fisierului cu ~90% fata de WAV, ideal pentru stocare si streaming."
                    },
                    {
                        text: "Cand este recomandat sa salvezi inregistrarea in format WAV in loc de MP3?",
                        options: [
                            "Niciodata — MP3 este mereu mai bun",
                            "Cand vrei sa ocupe mai mult spatiu pe disc",
                            "Cand editezi profesional si vrei sa pastrezi calitatea originala fara pierderi",
                            "Doar cand asculti muzica pe telefon"
                        ],
                        correct: 2,
                        explanation: "WAV este necomprimat — pastreaza 100% din calitatea audio originala. E preferabil in editarea profesionala sau arhivare, chiar daca un minut poate insemna ~10 MB fata de ~1 MB la MP3."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Track-uri audio si mixare",
                description: "Invata sa lucrezi cu piste audio suprapuse (OMEN 3393/2017 — inregistrare/redare; mixare)",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este un track audio pe timeline-ul unui editor video?",
                        options: [
                            "Un tip de format de fisier audio",
                            "O pista separata care contine sunet — poti avea mai multe suprapuse",
                            "Un program de editare audio",
                            "O melodie descarcata de pe internet"
                        ],
                        correct: 1,
                        explanation: "Track = pista audio. Pe timeline poti adauga mai multe piste simultan: sunetul original filmat, muzica de fundal, voice-over, efecte sonore — toate suna in acelasi timp, ca straturile unui sandwich."
                    },
                    {
                        text: "Ce volum recomandat are muzica de fundal cand cineva vorbeste in video?",
                        options: [
                            "100% — muzica trebuie sa fie la fel de tare ca vocea",
                            "0% — opreste muzica complet cand se vorbeste",
                            "20-40% — muzica discreta sa nu acopere vocea",
                            "50-70% — voce si muzica la fel de prezente"
                        ],
                        correct: 2,
                        explanation: "Regula de baza la mixare: vocea principala sta la 100%, muzica de fundal se coboara la 20-40% cand cineva vorbeste. Daca muzica acopera vocea, mixajul e gresit."
                    },
                    {
                        text: "Ce operatie trebuie sa faci dupa ce importi un fisier audio pe un track nou in editor?",
                        options: [
                            "Il stergi imediat",
                            "Il convertesti in MP3",
                            "Il pozitionezi pe timeline si ajustezi volumul fata de celelalte track-uri",
                            "Il printezi"
                        ],
                        correct: 2,
                        explanation: "Dupa import, pozitionezi track-ul audio la locul dorit pe timeline (sincronizare) si ajustezi volumul individual astfel incat sa fie in echilibru cu celelalte piste — aceasta se numeste mixare."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Fade in/out, taiere si voice-over",
                description: "Invata operatii de editare audio de baza (OMEN 3393/2017 — selectie secvente)",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce face efectul Fade In la inceputul unui track audio?",
                        options: [
                            "Sterge sunetul complet",
                            "Creste volumul treptat de la zero pana la nivelul normal — inceput lin",
                            "Accelereaza sunetul",
                            "Inverseaza sunetul"
                        ],
                        correct: 1,
                        explanation: "Fade In = crestere treptata a volumului de la 0 la normal. Fade Out = scadere treptata spre 0 la sfarsit. Ambele evita taieturile bruste de sunet si fac tranzitia audio profesionala."
                    },
                    {
                        text: "Ce inseamna sa selectezi si sa tai (trim) o secventa audio?",
                        options: [
                            "Sa stergi intregul track",
                            "Sa elimini portiunile nedorite (liniste, greseli) pastrand doar segmentul util",
                            "Sa maresti volumul track-ului",
                            "Sa convertesti fisierul in alt format"
                        ],
                        correct: 1,
                        explanation: "Trimming = selectezi punctele de inceput si sfarsit si elimini ce nu vrei (liniste la inceput, zgomote, greseli). Aceasta este operatia de 'selectie secvente' mentionata in programa."
                    },
                    {
                        text: "Ce este un voice-over in editarea unui videoclip?",
                        options: [
                            "Un efect de ecou aplicat sunetului original",
                            "O inregistrare vocala narativa adaugata pe un track audio separat, peste imaginile video",
                            "Un tip de microfon folosit la filmat",
                            "Un format de fisier audio"
                        ],
                        correct: 1,
                        explanation: "Voice-over = vocea unui narator inregistrata separat si adaugata ca track audio distinct. Se sincronizeaza cu actiunea din video si se mixeaza (muzica mai incet cand narezi)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Suprapuneri audio/text si generice",
                description: "Invata elementele avansate cerute de programa (OMEN 3393/2017 — suprapuneri audio/text; generice)",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este o suprapunere audio (audio overlay) intr-un proiect video?",
                        options: [
                            "Un efect vizual aplicat imaginii",
                            "Un al doilea track audio adaugat deasupra sunetului deja existent pe timeline",
                            "Stergerea sunetului original al clipului filmat",
                            "Un format de export al proiectului"
                        ],
                        correct: 1,
                        explanation: "Suprapunere audio = adaugi un track audio suplimentar (muzica, naratie, efect sonor) deasupra audio-ului original. Programa OMEN 3393/2017 cere explicit lucrul cu 'suprapuneri audio/text' in editarea audio-video."
                    },
                    {
                        text: "Ce este un generic de deschidere (opening credits) al unui videoclip?",
                        options: [
                            "Un efect de culoare aplicat intregului film",
                            "O tranzitie intre doua clipuri",
                            "Secventa animata de titlu la inceputul videoclipului, cu titlul proiectului si autorii",
                            "Muzica de fundal adaugata pe un track separat"
                        ],
                        correct: 2,
                        explanation: "Genericul de deschidere (opening) = secventa text animat la inceputul videoclipului care prezinta titlul si autorii. Genericul de sfarsit (credite finale) prezinta echipa. Programa OMEN 3393/2017 cere explicit 'generice' la editarea audio-video cls7."
                    },
                    {
                        text: "Care este diferenta dintre un text overlay si un generic de sfarsit (credite)?",
                        options: [
                            "Nu exista diferenta, sunt acelasi lucru",
                            "Text overlay apare peste imagine in corpul videoclipului; genericul de sfarsit este o secventa dedicata cu lista contributorilor la finalul videoclipului",
                            "Text overlay se foloseste doar la inceputul videoclipului",
                            "Genericul de sfarsit este un efect audio, nu vizual"
                        ],
                        correct: 1,
                        explanation: "Text overlay = text suprapus peste imagine la orice moment din clip (subtitru, lower third, titlu de sectiune). Genericul de sfarsit = secventa separata la finalul clipului dedicata listei contributorilor (regizor, cameraman etc.), de obicei cu text derulant de jos in sus."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Aplicatie integrata — lucru dupa specificatii",
                description: "Aplica tot ce ai invatat: formate, mixare, fade, suprapuneri, generice (OMEN 3393/2017 — lucru dupa specificatii)",
                xpReward: 150,
                questions: [
                    {
                        text: "Creezi un clip de prezentare scolara. Ce structura audio-video completa respecta cerinta OMEN 3393/2017?",
                        options: [
                            "Doar clipul filmat, fara editare",
                            "Generic de deschidere (titlu animat) + clip cu suprapunere audio (muzica fundal pe track separat) + text overlay + credite finale",
                            "Doar muzica de fundal, fara voce sau text",
                            "Un fisier MP3 exportat separat de video"
                        ],
                        correct: 1,
                        explanation: "Programa OMEN 3393/2017 cere: selectie secvente, tranzitii, suprapuneri audio/text si generice. Un proiect complet include: generic deschidere → continut cu suprapunere audio si text overlay → credite finale."
                    },
                    {
                        text: "In ce format salvezi fisierul audio cand il vei edita ulterior, pentru a pastra calitatea maxima?",
                        options: [
                            "MP3 la 64 kbps — cel mai mic fisier",
                            "WAV — necomprimat, fara pierderi, ideal pentru editare",
                            "PNG — format universal",
                            "AAC la 32 kbps — calitate medie"
                        ],
                        correct: 1,
                        explanation: "Pentru editare, WAV pastreaza calitatea audio originala 100% (fara pierderi). Exporti in MP3 abia la final, pentru distributie. Editarea pe MP3 degradeaza calitatea la fiecare re-salvare."
                    },
                    {
                        text: "Muzica ta de fundal acopera vocea naratorului in videoclip. Ce faci?",
                        options: [
                            "Stergi track-ul de voce",
                            "Maresti si mai mult volumul muzicii",
                            "Cobori volumul track-ului de muzica la 20-30% si adaugi fade out la sfarsitul sectiunii",
                            "Exporti proiectul asa cum este"
                        ],
                        correct: 2,
                        explanation: "Regula de mixare: vocea principala sta la 100%, muzica de fundal se reduce la 20-30% pe durata vorbirii. Poti folosi si ducking (coborare automata a muzicii cand detecteaza voce). Fade out la final pentru o incheiere profesionala."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls7_multimedia_quiz3_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls7_multimedia_quiz3_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-video.html'">
                                Quiz-ul 4: Fisiere video
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Proiecte multimedia | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-green);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-green);
        }

.option:hover {
            border-color: var(--accent-cyan);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin: 1.5rem 0;
        }

.module-complete {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
            border: 2px solid var(--accent-green);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

.module-complete h3 {
            color: var(--accent-green);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Editare Multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Proiecte multimedia</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Planificarea proiectului",
                description: "Invata cum sa planifici un proiect multimedia",
                xpReward: 50,
                questions: [
                    {
                        text: "Care este primul pas in crearea unui proiect multimedia?",
                        options: [
                            "Sa incepi sa adaugi efecte speciale",
                            "Sa definesti scopul si publicul tinta",
                            "Sa descarci cat mai multe imagini",
                            "Sa alegi muzica de fundal"
                        ],
                        correct: 1,
                        explanation: "Inainte de orice, trebuie sa stii CE vrei sa comunici si PENTRU CINE. Scopul clar si publicul tinta ghideaza toate deciziile urmatoare."
                    },
                    {
                        text: "Ce este un 'storyboard' in productia multimedia?",
                        options: [
                            "Un tip de software",
                            "O schita vizuala care arata secventa de scene si continut",
                            "O lista de melodii",
                            "Un format de fisier"
                        ],
                        correct: 1,
                        explanation: "Storyboard-ul este o schita vizuala, ca o banda desenata, care arata ordinea scenelor, ce continut apare in fiecare, si cum curge povestea."
                    },
                    {
                        text: "De ce este importanta planificarea inainte de a incepe lucrul?",
                        options: [
                            "Nu este importanta, poti incepe direct",
                            "Economiseste timp, previne greseli si asigura un rezultat coerent",
                            "Doar pentru proiecte mari",
                            "Pentru a impresiona profesorul"
                        ],
                        correct: 1,
                        explanation: "Planificarea te ajuta sa stii ce materiale ai nevoie, previne munca inutila, si asigura ca proiectul final este coerent si transmite mesajul dorit."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Colectarea materialelor",
                description: "Invata sa aduni si organizezi resursele multimedia",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce tipuri de materiale ai putea colecta pentru un proiect multimedia?",
                        options: [
                            "Doar text",
                            "Texte, imagini, clipuri audio, video, grafice si animatii",
                            "Doar imagini si muzica",
                            "Doar video"
                        ],
                        correct: 1,
                        explanation: "Un proiect multimedia poate include toate tipurile de continut: texte pentru informatii, imagini pentru ilustrare, audio pentru atmosfera, video pentru demonstratii, etc."
                    },
                    {
                        text: "Ce trebuie sa verifici cand folosesti imagini sau muzica gasite online?",
                        options: [
                            "Doar daca iti place",
                            "Drepturile de autor si licenta (daca ai permisiunea sa le folosesti)",
                            "Doar calitatea imaginii",
                            "Doar marimea fisierului"
                        ],
                        correct: 1,
                        explanation: "Drepturile de autor sunt foarte importante! Trebuie sa folosesti resurse libere de drepturi, cu licenta Creative Commons, sau sa ai permisiune de la autor."
                    },
                    {
                        text: "Ce sunt resursele 'royalty-free' sau 'Creative Commons'?",
                        options: [
                            "Resurse ilegale",
                            "Resurse pe care le poti folosi gratuit sau cu credit, conform licentei",
                            "Resurse foarte scumpe",
                            "Resurse de calitate slaba"
                        ],
                        correct: 1,
                        explanation: "Royalty-free si Creative Commons sunt tipuri de licente care permit folosirea gratuita a resurselor, uneori cu conditii (ex: sa mentionezi autorul)."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Combinarea elementelor",
                description: "Invata sa combini diferite tipuri de continut",
                xpReward: 100,
                questions: [
                    {
                        text: "Cand combini mai multe tipuri de media, ce trebuie sa ai grija?",
                        options: [
                            "Sa adaugi cat mai multe efecte",
                            "Sa existe echilibru si armonie - elementele sa se completeze, nu sa se incurce",
                            "Sa folosesti toate tipurile de media obligatoriu",
                            "Sa fie cat mai lung proiectul"
                        ],
                        correct: 1,
                        explanation: "Elementele trebuie sa se completeze armonios: muzica sa se potriveasca cu imaginile, textul sa fie lizibil pe fundal, tranzitiile sa fie fluide."
                    },
                    {
                        text: "Ce inseamna 'sincronizare' in proiectele multimedia?",
                        options: [
                            "Sa salvezi des",
                            "Sa coordonezi elementele in timp (ex: efecte sonore sa coincida cu actiunile vizuale)",
                            "Sa folosesti aceeasi culoare",
                            "Sa copiezi de la altcineva"
                        ],
                        correct: 1,
                        explanation: "Sincronizarea inseamna coordonarea in timp: un efect sonor cand apare ceva pe ecran, muzica sa se intensifice in momentele cheie, etc."
                    },
                    {
                        text: "De ce este important contrastul text-fundal in proiecte?",
                        options: [
                            "Nu este important",
                            "Pentru ca textul sa fie usor de citit - text inchis pe fundal deschis sau invers",
                            "Pentru a face proiectul mai colorat",
                            "Pentru a economisi cerneala"
                        ],
                        correct: 1,
                        explanation: "Textul trebuie sa aiba contrast suficient cu fundalul pentru a fi lizibil. Text negru pe fundal alb sau text alb pe fundal inchis - niciodata culori similare!"
                    }
                ]
            },
            4: {
                title: "Nivel 4: Calitate si optimizare",
                description: "Invata sa optimizezi proiectul pentru diferite utilizari",
                xpReward: 125,
                questions: [
                    {
                        text: "De ce trebuie sa optimizezi marimea fisierelor pentru web?",
                        options: [
                            "Nu trebuie, marimea nu conteaza",
                            "Fisiere mari se incarca greu si consuma date mobile",
                            "Fisierele mici sunt de calitate slaba",
                            "Doar pentru telefoane vechi"
                        ],
                        correct: 1,
                        explanation: "Pe web, fisierele mari se incarca incet, frustreaza utilizatorii si consuma date mobile. Trebuie sa gasesti echilibrul intre calitate si marime."
                    },
                    {
                        text: "Ce rezolutie ar trebui sa aiba imaginile pentru web vs. print?",
                        options: [
                            "Aceeasi rezolutie pentru ambele",
                            "Web: 72-150 dpi, Print: 300 dpi sau mai mult",
                            "Web: 1000 dpi, Print: 10 dpi",
                            "Nu conteaza rezolutia"
                        ],
                        correct: 1,
                        explanation: "Pentru web, 72-150 dpi (dots per inch) este suficient pentru ecrane. Pentru print de calitate, ai nevoie de minim 300 dpi pentru imagini clare."
                    },
                    {
                        text: "Ce verifici inainte de a finaliza un proiect multimedia?",
                        options: [
                            "Doar daca functioneaza pe calculatorul tau",
                            "Toate link-urile, sincronizarea, ortografia, compatibilitatea pe diferite dispozitive",
                            "Doar ortografia",
                            "Nimic, daca arata bine e gata"
                        ],
                        correct: 1,
                        explanation: "Inainte de finalizare, verifici: toate link-urile functioneaza, audio si video sunt sincronizate, textul e corect, si proiectul merge pe diferite dispozitive."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Prezentare si distributie",
                description: "Invata sa prezinti si distribui proiectul final",
                xpReward: 150,
                questions: [
                    {
                        text: "Care sunt metodele comune de distributie a proiectelor multimedia?",
                        options: [
                            "Doar pe CD",
                            "Upload pe web, YouTube, social media, prezentare live, USB/cloud",
                            "Doar prin email",
                            "Doar printat pe hartie"
                        ],
                        correct: 1,
                        explanation: "Proiectele multimedia pot fi distribuite: online (site, YouTube, social media), prezentate live, partajate prin cloud (Google Drive, Dropbox) sau USB."
                    },
                    {
                        text: "Ce format este cel mai potrivit pentru a incarca un video pe YouTube?",
                        options: [
                            "AVI necomprimat",
                            "MP4 cu codec H.264",
                            "WAV audio",
                            "PNG imagine"
                        ],
                        correct: 1,
                        explanation: "YouTube recomanda MP4 cu codec H.264 pentru video - ofera calitate buna la marime rezonabila si este procesat rapid de platforma."
                    },
                    {
                        text: "Ce trebuie sa incluzi cand prezinti un proiect multimedia in fata publicului?",
                        options: [
                            "Doar sa apesi play si sa pleci",
                            "O introducere despre proiect, demonstratie, si timp pentru intrebari",
                            "Doar sa citesti de pe ecran",
                            "Sa te scuzi ca nu e perfect"
                        ],
                        correct: 1,
                        explanation: "O prezentare buna include: introducere (ce este si de ce l-ai creat), demonstratie/vizionare, si timp pentru intrebari si feedback de la public."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls7_multimedia_quiz5_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls7_multimedia_quiz5_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            let moduleCompleteHTML = '';
            if (passed && currentLevel === 5) {
                moduleCompleteHTML = `
                    <div class="module-complete">
                        <h3>🎓 Felicitari! Ai completat Modulul 2: Multimedia!</h3>
                        <p style="color: var(--text-secondary);">Acum stapanesti bazele continutului multimedia: tipuri de media, formate de imagine/audio/video, tehnici de editare si crearea proiectelor.</p>
                    </div>
                `;
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    ${moduleCompleteHTML}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='../index.html'">
                                Inapoi la Editare Multimedia
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Concepte de Baze de Date | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <!-- Styles are defined in quiz-gamified.css — no inline style block. -->

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Baze de date</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Concepte de Baze de Date</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Ce este o baza de date?",
                description: "Descopera ce inseamna o baza de date si de ce avem nevoie de ea",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este o baza de date?",
                        options: [
                            "Un program pentru a desena",
                            "O colectie organizata de informatii stocate electronic",
                            "Un joc pe calculator",
                            "O pagina de internet"
                        ],
                        correct: 1,
                        explanation: "O baza de date este o colectie organizata de informatii (date) stocate electronic, care permite stocarea, accesarea si gestionarea eficienta a datelor."
                    },
                    {
                        text: "Care dintre urmatoarele este un exemplu de baza de date din viata reala?",
                        options: [
                            "Lista de contacte din telefon",
                            "Un desen facut pe calculator",
                            "Un film descarcat",
                            "O melodie MP3"
                        ],
                        correct: 0,
                        explanation: "Lista de contacte din telefon este o baza de date simpla - stocheaza informatii organizate (nume, numere de telefon, adrese) despre persoanele pe care le cunosti."
                    },
                    {
                        text: "De ce folosim baze de date?",
                        options: [
                            "Pentru a face calculatorul mai lent",
                            "Pentru a organiza si gasi rapid informatii mari",
                            "Pentru a sterge toate fisierele",
                            "Pentru a ne juca"
                        ],
                        correct: 1,
                        explanation: "Bazele de date ne ajuta sa organizam cantitati mari de informatii si sa le gasim rapid cand avem nevoie. Imagineaza-ti ca cauti un numar de telefon printre mii de contacte - baza de date face asta instant!"
                    }
                ]
            },
            2: {
                title: "Nivel 2: Unde gasim baze de date?",
                description: "Invata unde sunt folosite bazele de date in lumea reala",
                xpReward: 75,
                questions: [
                    {
                        text: "Unde este folosita o baza de date?",
                        options: [
                            "Intr-o biblioteca pentru a tine evidenta cartilor",
                            "Doar in jocuri video",
                            "Doar pe telefoane vechi",
                            "Nicaieri"
                        ],
                        correct: 0,
                        explanation: "Bibliotecile folosesc baze de date pentru a tine evidenta cartilor, cine le-a imprumutat si cand trebuie returnate. La fel, scolile, spitalele, magazinele - toate folosesc baze de date!"
                    },
                    {
                        text: "Care aplicatie NU foloseste o baza de date?",
                        options: [
                            "Facebook",
                            "Un calculator simplu (aplicatia Calculator)",
                            "Instagram",
                            "YouTube"
                        ],
                        correct: 1,
                        explanation: "Calculatorul simplu doar face calcule matematice, nu stocheaza informatii organizate. Facebook, Instagram si YouTube au nevoie de baze de date uriase pentru a stoca postarile, pozele si videourile utilizatorilor."
                    },
                    {
                        text: "Ce tip de informatii poate stoca o baza de date?",
                        options: [
                            "Doar texte",
                            "Doar numere",
                            "Texte, numere, date calendaristice, imagini si multe altele",
                            "Doar imagini"
                        ],
                        correct: 2,
                        explanation: "Bazele de date pot stoca diverse tipuri de informatii: texte (nume, adrese), numere (varsta, preturi), date (zi de nastere), si chiar referinte catre imagini sau fisiere."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Structura tabelului",
                description: "Exerseaza cunostintele despre randuri, coloane si celule",
                xpReward: 100,
                questions: [
                    {
                        text: "Care este componenta principala a unei baze de date?",
                        options: [
                            "Fisierul video",
                            "Tabelul",
                            "Jocul",
                            "Imaginea"
                        ],
                        correct: 1,
                        explanation: "Tabelul este componenta principala a unei baze de date. Un tabel organizeaza datele in randuri si coloane, similar cu un catalog scolar sau cu un tabel Excel."
                    },
                    {
                        text: "Ce reprezinta o coloana intr-un tabel de baze de date?",
                        options: [
                            "Un tip de informatie (ex: Nume, Varsta, Nota)",
                            "O singura valoare numerica",
                            "O inregistrare completa despre un elev",
                            "Titlul tabelului"
                        ],
                        correct: 0,
                        explanation: "Coloana (numita si camp sau field) reprezinta un tip de informatie. De exemplu, intr-un tabel Elevi, coloanele pot fi: Nume, Prenume, Clasa, Nota. Fiecare coloana stocheaza acelasi tip de date pentru toti elevii."
                    },
                    {
                        text: "Intr-un tabel cu 4 coloane si 6 randuri, cate celule exista?",
                        options: [
                            "10 celule",
                            "24 celule",
                            "4 celule",
                            "6 celule"
                        ],
                        correct: 1,
                        explanation: "Numarul de celule = numarul de coloane x numarul de randuri = 4 x 6 = 24 celule. Fiecare celula este intersectia unui rand cu o coloana si contine o singura valoare."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Avantajele bazelor de date",
                description: "Descopera de ce bazele de date sunt esentiale",
                xpReward: 125,
                questions: [
                    {
                        text: "Care este un avantaj major al bazelor de date fata de documentele simple?",
                        options: [
                            "Sunt mai colorate",
                            "Permit cautarea rapida in milioane de inregistrari",
                            "Ocupa mai mult spatiu",
                            "Sunt mai greu de folosit"
                        ],
                        correct: 1,
                        explanation: "Bazele de date permit cautarea extrem de rapida chiar si in milioane de inregistrari. Imagineaza-ti sa cauti manual printr-un dosar cu 1 milion de fise - ar dura luni! Baza de date o face in fractiuni de secunda."
                    },
                    {
                        text: "Ce inseamna ca datele din baza de date sunt 'consistente'?",
                        options: [
                            "Sunt toate de aceeasi culoare",
                            "Aceleasi informatii nu sunt duplicate si contradictorii",
                            "Sunt toate numere",
                            "Sunt foarte mari"
                        ],
                        correct: 1,
                        explanation: "Consistenta datelor inseamna ca informatiile nu se contrazic. De exemplu, daca adresa unui client se schimba, o modificam intr-un singur loc si peste tot apare corect, nu avem versiuni diferite ale aceleasi adrese."
                    },
                    {
                        text: "Ce permite o baza de date in privinta accesului la date?",
                        options: [
                            "Doar o persoana poate accesa datele",
                            "Mai multi utilizatori pot accesa si modifica datele simultan",
                            "Nimeni nu poate accesa datele",
                            "Datele se sterg automat"
                        ],
                        correct: 1,
                        explanation: "Bazele de date permit accesul simultan - mai multi utilizatori pot lucra cu aceleasi date in acelasi timp, fara sa se incurce unul pe altul. Gandeste-te la o banca unde mii de clienti fac operatiuni simultan!"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Recapitulare — toate conceptele",
                description: "Verifica daca stapanesti toate notiunile invatate despre bazele de date",
                xpReward: 150,
                questions: [
                    {
                        text: "Un profesor vrea sa tina evidenta elevilor. Ce tip de informatie ar trebui sa stocheze campul 'DataNasterii'?",
                        options: [
                            "Text",
                            "Numar",
                            "Data/Ora",
                            "Da/Nu"
                        ],
                        correct: 2,
                        explanation: "Data nasterii este o informatie calendaristica, deci tipul corect este Data/Ora. Daca am stoca-o ca Text ('15/03/2011'), nu am putea calcula automat varsta sau sorta elevii dupa data nasterii."
                    },
                    {
                        text: "Intr-un tabel de elevi exista doua persoane cu numele 'Ionescu Maria'. Ce element rezolva problema identificarii unice?",
                        options: [
                            "Adaugarea unui camp 'Culoare preferata'",
                            "Cheia primara (un ID unic pentru fiecare inregistrare)",
                            "Stergerea uneia dintre ele",
                            "Schimbarea numelui tabelului"
                        ],
                        correct: 1,
                        explanation: "Cheia primara (Primary Key) este un camp cu valori unice si non-nule care identifica fiecare inregistrare. Daca adaugam un camp ID_Elev cu valori 1, 2, 3... putem distinge elevele chiar daca au acelasi nume."
                    },
                    {
                        text: "Care dintre urmatoarele exemple NU este o baza de date?",
                        options: [
                            "Catalogul scolar al unei clase",
                            "Lista de contacte din telefon",
                            "O poza facuta la o excursie",
                            "Inventarul produselor unui magazin"
                        ],
                        correct: 2,
                        explanation: "O poza este un fisier imagine — nu o colectie organizata de informatii structurate. Catalogul, agenda de contacte si inventarul unui magazin sunt toate exemple de baze de date, pentru ca organizeaza date despre mai multe entitati."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('db_quiz1_progress_cls7');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('db_quiz1_progress_cls7', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-tabele.html'">
                                Quiz-ul 2: Tabele si Campuri
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

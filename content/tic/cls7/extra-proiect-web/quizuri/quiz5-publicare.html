<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Publicare Online | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-green);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-green);
        }

.code-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 550px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
        }

.code-mockup .tag {
            color: var(--accent-green);
        }

.code-mockup .attr {
            color: var(--accent-yellow);
        }

.code-mockup .value {
            color: #f472b6;
        }

.code-mockup .comment {
            color: #6b7280;
        }

.url-example {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem auto;
            max-width: 500px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: var(--accent-cyan);
            border: 1px solid var(--border);
        }

.option:hover {
            border-color: var(--accent-cyan);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin: 1.5rem 0;
        }

.quiz-complete-final {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
            border: 2px solid var(--accent-green);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

@media (max-width: 600px) {
            .container { padding: 1rem; }
            .quiz-header { flex-direction: column; gap: 1rem; }
            .level-node { width: 50px; height: 50px; font-size: 1.2rem; }
            .question-text { font-size: 1.1rem; }
            .code-mockup { font-size: 0.75rem; }
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Proiect integrat</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Publicare Online</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce inseamna publicarea?",
                description: "Invata ce inseamna sa pui site-ul online",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce inseamna sa 'publici' un site web?",
                        options: [
                            "Sa-l salvezi pe calculatorul tau",
                            "Sa-l faci accesibil pe internet pentru oricine are link-ul",
                            "Sa-l printezi pe hartie",
                            "Sa-l trimiti pe email"
                        ],
                        correct: 1,
                        explanation: "A publica un site inseamna a-l incarca pe un server web, astfel incat oricine din lume sa-l poata accesa prin intermediul internetului, folosind un URL."
                    },
                    {
                        text: "Ce ai nevoie pentru a publica un site web?",
                        options: [
                            "Doar un calculator",
                            "O imprimanta",
                            "Fisierele site-ului si un serviciu de hosting (gazduire)",
                            "Un telefon mobil"
                        ],
                        correct: 2,
                        explanation: "Ai nevoie de: 1) Fisierele site-ului (HTML, CSS, imagini) si 2) Un serviciu de hosting care sa le gazduiasca online. GitHub Pages este o optiune gratuita perfecta."
                    },
                    {
                        text: "Ce este GitHub Pages?",
                        hasUrlExample: true,
                        urlExample: "https://username.github.io/proiect/",
                        options: [
                            "Un serviciu gratuit de gazduire pentru site-uri web statice",
                            "Un program de editat cod",
                            "O retea sociala",
                            "Un joc online"
                        ],
                        correct: 0,
                        explanation: "GitHub Pages este un serviciu gratuit de la GitHub care iti permite sa publici site-uri web direct din repository-ul tau. Perfect pentru proiecte de scoala!"
                    }
                ]
            },
            2: {
                title: "Nivel 2: Pregatirea pentru publicare",
                description: "Invata sa pregatesti site-ul inainte de publicare",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce trebuie sa verifici inainte de a publica site-ul?",
                        options: [
                            "Nimic, il pui direct online",
                            "Doar culorile",
                            "Doar titlul",
                            "Toate link-urile functioneaza, imaginile se incarca, site-ul arata bine"
                        ],
                        correct: 3,
                        explanation: "Inainte de publicare, verifica: link-urile functioneaza, imaginile se incarca, textul e corect, site-ul arata bine pe mobil si desktop. Testeaza tot!"
                    },
                    {
                        text: "De ce este important fisierul index.html pentru publicare?",
                        hasCodeMockup: true,
                        codeMockup: `📁 repository/
   📄 index.html  <span class="comment">← Pagina principala</span>
   📄 despre.html
   📄 contact.html
   📁 css/
   📁 imagini/`,
                        options: [
                            "Este pagina care se incarca automat cand cineva acceseaza site-ul",
                            "Nu este important",
                            "Este doar pentru decoratie",
                            "Este un fisier optional"
                        ],
                        correct: 0,
                        explanation: "index.html este pagina implicita - se incarca automat cand cineva acceseaza URL-ul site-ului tau. Fara el, vizitatorii vor vedea o eroare sau lista de fisiere."
                    },
                    {
                        text: "Ce trebuie sa faci cu imaginile inainte de publicare?",
                        options: [
                            "Sa le stergi pe toate",
                            "Sa le redenumesti cu caractere speciale",
                            "Sa verifici ca sunt optimizate (nu prea mari) si ca au atributul alt",
                            "Nimic special"
                        ],
                        correct: 2,
                        explanation: "Imaginile trebuie optimizate (comprimate) pentru web ca sa nu incarce lent pagina. Trebuie sa aiba atribut alt pentru accesibilitate si SEO."
                    }
                ]
            },
            3: {
                title: "Nivel 3: GitHub si repository",
                description: "Invata sa folosesti GitHub pentru site-ul tau",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este un 'repository' (repo) pe GitHub?",
                        options: [
                            "Un tip de fisier",
                            "O pagina web",
                            "Un cont de utilizator",
                            "Un folder online unde iti pastrezi proiectul si istoricul modificarilor"
                        ],
                        correct: 3,
                        explanation: "Un repository este ca un folder inteligent care stocheaza proiectul tau si pastreaza istoricul tuturor modificarilor facute. Poti reveni oricand la o versiune anterioara."
                    },
                    {
                        text: "Care este pasul pentru a activa GitHub Pages?",
                        hasCodeMockup: true,
                        codeMockup: `<span class="comment">Pasi pentru GitHub Pages:</span>
1. Mergi la Settings (setari) repository
2. Scroll la sectiunea "Pages"
3. La Source, alege "main" branch
4. Click Save
5. Asteapta cateva minute`,
                        options: [
                            "Mergi la Settings > Pages si selectezi branch-ul source",
                            "Se activeaza automat",
                            "Trimiti un email la GitHub",
                            "Descarci o aplicatie"
                        ],
                        correct: 0,
                        explanation: "In repository, mergi la Settings > Pages, selectezi branch-ul (de obicei 'main') ca sursa, si salvezi. In cateva minute, site-ul tau e online!"
                    },
                    {
                        text: "Cum arata URL-ul unui site publicat pe GitHub Pages?",
                        hasUrlExample: true,
                        urlExample: "https://nume-utilizator.github.io/nume-repository/",
                        options: [
                            "www.github.com/site",
                            "github.pages.com/site",
                            "https://username.github.io/repository-name/",
                            "Nu are URL, e doar local"
                        ],
                        correct: 2,
                        explanation: "URL-ul standard este: https://USERNAME.github.io/REPOSITORY-NAME/. Inlocuieste USERNAME cu numele tau de GitHub si REPOSITORY-NAME cu numele proiectului."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Verificare dupa publicare",
                description: "Invata sa verifici ca site-ul functioneaza corect online",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce trebuie sa verifici dupa ce site-ul e publicat?",
                        options: [
                            "Toate paginile se incarca, link-urile functioneaza, imaginile apar corect",
                            "Nimic, daca s-a publicat e OK",
                            "Doar pagina principala",
                            "Doar pe telefon"
                        ],
                        correct: 0,
                        explanation: "Dupa publicare, testeaza: acceseaza toate paginile, verifica fiecare link, asigura-te ca imaginile apar, testeaza pe mobil si pe diferite browsere."
                    },
                    {
                        text: "Ce faci daca o imagine nu se incarca pe site-ul publicat?",
                        hasCodeMockup: true,
                        codeMockup: `<span class="comment">// Gresit (poate nu functioneaza online):</span>
<span class="tag">&lt;img</span> <span class="attr">src</span>=<span class="value">"C:/Users/Eu/imagini/foto.jpg"</span><span class="tag">&gt;</span>

<span class="comment">// Corect (cale relativa):</span>
<span class="tag">&lt;img</span> <span class="attr">src</span>=<span class="value">"imagini/foto.jpg"</span><span class="tag">&gt;</span>`,
                        options: [
                            "Ignori problema",
                            "Stergi imaginea",
                            "Schimbi browserul",
                            "Verifici calea fisierului - trebuie sa fie relativa, nu absoluta"
                        ],
                        correct: 3,
                        explanation: "Foloseste cai relative (imagini/foto.jpg), nu absolute (C:/Users/...). Verifica si ca numele fisierului se potriveste exact (litere mari/mici conteaza pe server)."
                    },
                    {
                        text: "Cat dureaza de obicei pana se actualizeaza site-ul pe GitHub Pages?",
                        options: [
                            "Instant, imediat",
                            "O saptamana",
                            "Cateva minute (1-5 minute de obicei)",
                            "Nu se actualizeaza niciodata"
                        ],
                        correct: 2,
                        explanation: "GitHub Pages are nevoie de cateva minute sa proceseze si sa publice modificarile. Daca nu vezi schimbarile, asteapta 2-5 minute si actualizeaza pagina (Ctrl+F5)."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Bune practici si intretinere",
                description: "Invata sa intretii si sa imbunatesti site-ul publicat",
                xpReward: 150,
                questions: [
                    {
                        text: "De ce este important atributul 'alt' la imagini?",
                        hasCodeMockup: true,
                        codeMockup: `<span class="tag">&lt;img</span> <span class="attr">src</span>=<span class="value">"imagini/pisica.jpg"</span>
     <span class="attr">alt</span>=<span class="value">"O pisica portocalie dormind pe canapea"</span><span class="tag">&gt;</span>`,
                        options: [
                            "Nu este important",
                            "Face imaginea mai mare",
                            "Schimba culoarea imaginii",
                            "Ajuta nevazatorii sa inteleaga imaginea si imbunatateste SEO"
                        ],
                        correct: 3,
                        explanation: "Atributul 'alt' descrie imaginea pentru: 1) Persoane cu dizabilitati vizuale care folosesc cititoare de ecran, 2) Situatii cand imaginea nu se incarca, 3) Motoare de cautare (SEO)."
                    },
                    {
                        text: "Cum poti impartasi in mod sigur link-ul site-ului tau de scoala cu altii?",
                        hasUrlExample: true,
                        urlExample: "https://elevioan.github.io/proiect-scoala/",
                        options: [
                            "Trimiti URL-ul prin mesaj sau email colegilor, profesorului sau parintilor tai",
                            "Nu se poate impartasi",
                            "Trebuie sa instalezi o aplicatie",
                            "Il pui imediat pe toate retelele sociale fara sa verifici ce contine"
                        ],
                        correct: 0,
                        explanation: "Poti trimite URL-ul prin mesaj sau email colegilor, profesorului sau parintilor. ⚠️ Inainte de a-l distribui mai larg, verifica impreuna cu un parinte sau profesor ca site-ul nu contine date personale (adresa, telefon, poze cu fata ta). Un site de scoala e perfect pentru portofoliu — dar distribuirea publica se face cu acordul unui adult."
                    },
                    {
                        text: "Ce ar trebui sa faci dupa ce termini proiectul?",
                        options: [
                            "Sa-l stergi",
                            "Sa-l ascunzi",
                            "Sa-l pastrezi, sa-l actualizezi periodic si sa-l adaugi in portofoliu",
                            "Sa nu mai intri niciodata"
                        ],
                        correct: 2,
                        explanation: "Un site publicat devine parte din portofoliul tau digital! Pastreaza-l, actualizeaza-l cand inveti lucruri noi, si foloseste-l ca exemplu de munca ta pentru viitor."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls7_quiz5_publicare_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls7_quiz5_publicare_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasUrlExample) {
                questionContent += `<div class="url-example">${q.urlExample}</div>`;
            }

            if (q.hasCodeMockup) {
                questionContent += `<div class="code-mockup">${q.codeMockup}</div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Raspunsul corect era: "${q.options[q.correct]}"</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            let finalMessage = '';
            if (passed && currentLevel === 5) {
                finalMessage = `
                    <div class="quiz-complete-final">
                        <h3 style="color: var(--accent-green); margin-bottom: 1rem;">🎓 Felicitari! Ai terminat toate quiz-urile din Modulul 5!</h3>
                        <p style="color: var(--text-secondary);">Acum stii sa planifici, creezi si publici un site web complet. Esti pregatit sa-ti creezi propriul proiect web!</p>
                    </div>
                `;
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='../index.html'">
                                Inapoi la Modul
                            </button>
                        ` : ''}
                    </div>
                    ${finalMessage}
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

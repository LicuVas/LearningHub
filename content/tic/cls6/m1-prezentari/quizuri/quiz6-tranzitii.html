<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Tranzitii intre Slide-uri | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Accessibility: skip-link (quiz-gamified.css has no skip-link definition) */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 1rem;
            z-index: 9999;
            padding: 0.5rem 1rem;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: top 0.15s;
        }
        .skip-link:focus { top: 1rem; }

        /* Lesson-specific styles */
        .quiz-complete-final {
            text-align: center;
            padding: 2rem;
        }

        .quiz-complete-final h2 {
            color: var(--accent-orange);
            margin-bottom: 1rem;
        }

        .total-xp-final {
            font-size: 2.5rem;
            color: var(--accent-purple);
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 1</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Tranzitii intre Slide-uri</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce sunt tranzitiile?",
                description: "Invata diferenta dintre animatii si tranzitii",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este o tranzitie in PowerPoint?",
                        options: [
                            "Un efect vizual care face un obiect sa apara pe slide",
                            "Un efect vizual care controleaza cum se schimba un slide cu altul",
                            "Un tip de font special",
                            "O culoare de fundal animata"
                        ],
                        correct: 1,
                        explanation: "Tranzitiile controleaza cum SE SCHIMBA un slide cu altul in timpul prezentarii. Ele afecteaza trecerea INTRE slide-uri, nu obiectele individuale de pe un slide."
                    },
                    {
                        text: "In ce tab din PowerPoint gasesti tranzitiile?",
                        options: [
                            "Animations",
                            "Insert",
                            "Transitions",
                            "Home"
                        ],
                        correct: 2,
                        explanation: "Tabul Transitions (intre Animations si Slide Show in ribbon) contine galeria de tranzitii si optiunile pentru durata, sunet si avansarea slide-ului."
                    },
                    {
                        text: "Care este diferenta principala intre animatii si tranzitii?",
                        options: [
                            "Animatiile au durata, tranzitiile nu",
                            "Animatiile sunt pentru obiecte individuale, tranzitiile pentru slide-uri intregi",
                            "Animatiile sunt in PowerPoint, tranzitiile in Word",
                            "Nu poti folosi ambele in aceeasi prezentare"
                        ],
                        correct: 1,
                        explanation: "Animatiile afecteaza obiecte individuale (text, imagini, forme) PE un slide. Tranzitiile afecteaza schimbarea INTRE slide-uri intregi. Poti folosi ambele impreuna."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Categorii de tranzitii",
                description: "Descopera cele 3 categorii de tranzitii din PowerPoint",
                xpReward: 75,
                questions: [
                    {
                        text: "Care categorie de tranzitii este recomandata pentru prezentari profesionale?",
                        options: [
                            "Subtle (Subtile)",
                            "Exciting (Incitante)",
                            "Dynamic Content",
                            "Nu conteaza, orice merge"
                        ],
                        correct: 0,
                        explanation: "Subtle (Subtile) - ex: Fade, Push, Wipe - sunt simple, discrete si profesionale. Nu distrag atentia publicului de la continut. Ideale pentru prezentari de business sau scoala."
                    },
                    {
                        text: "Ce face tranzitia 'Fade'?",
                        options: [
                            "Slide-ul nou impinge pe cel vechi in afara",
                            "Slide-ul vechi dispare treptat, cel nou apare treptat",
                            "Slide-ul se roteste ca o roata",
                            "Slide-ul se rastoarna ca o pagina"
                        ],
                        correct: 1,
                        explanation: "Fade este tranzitia clasica: slide-ul vechi dispare treptat (fade out), cel nou apare treptat (fade in). Este cea mai profesionala si discreta tranzitie."
                    },
                    {
                        text: "Tranzitia 'Morph' face parte din categoria:",
                        options: [
                            "Subtle",
                            "Exciting",
                            "Dynamic Content",
                            "Nu exista in PowerPoint"
                        ],
                        correct: 2,
                        explanation: "Morph este in categoria Dynamic Content. Obiectele comune din slide 1 si slide 2 se transforma fluid. Necesita PowerPoint 2019+ si obiecte similare pe ambele slide-uri."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Duration si Effect Options",
                description: "Invata sa controlezi viteza si directia tranzitiei",
                xpReward: 100,
                questions: [
                    {
                        text: "Care este durata recomandata pentru majoritatea tranzitiilor?",
                        options: [
                            "0.1 secunde",
                            "1-1.5 secunde",
                            "5 secunde",
                            "10 secunde"
                        ],
                        correct: 1,
                        explanation: "1-1.5 secunde este durata implicita si optima - destul de rapid incat sa nu fie plictisitor, dar destul de lent incat sa fie placut vizual."
                    },
                    {
                        text: "Ce controleaza 'Effect Options' pentru o tranzitie de tip 'Push'?",
                        options: [
                            "Culoarea tranzitiei",
                            "Directia din care vine slide-ul nou (dreapta, stanga, sus, jos)",
                            "Numarul de slide-uri afectate",
                            "Sunetul tranzitiei"
                        ],
                        correct: 1,
                        explanation: "Effect Options permite alegerea directiei pentru tranzitii ca Push, Wipe sau Uncover. 'From Right' este cel mai natural (citim stanga-dreapta) pentru prezentari normale."
                    },
                    {
                        text: "Care este setarea recomandata pentru o prezentare scolara profesionala?",
                        options: [
                            "Cube + 5 secunde + sunet",
                            "Push + From Right + 1 secunda + fara sunet",
                            "Zoom + 0.1 secunde + sunet",
                            "Rotate + 3 secunde + sunet"
                        ],
                        correct: 1,
                        explanation: "Push + From Right + ~1 secunda + fara sunet = setarea ideala pentru scoala: discreta, fluida, profesionala, fara distrageri."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Sound si Advance Slide",
                description: "Invata optiunile avansate de tranzitie",
                xpReward: 125,
                questions: [
                    {
                        text: "Cand ar trebui sa folosesti sunete la tranzitii?",
                        options: [
                            "Intotdeauna, pentru efect maxim",
                            "La toate prezentarile importante",
                            "Rareori - doar pentru prezentari casual, pentru copii sau divertisment",
                            "Niciodata, sunetele sunt interzise"
                        ],
                        correct: 2,
                        explanation: "Sunetele sunt potrivite doar pentru prezentari casual, pentru copii sau divertisment. In context profesional sau scolar formal, sunetele distrag atentia si par neprofesionale."
                    },
                    {
                        text: "Ce inseamna setarea 'On Mouse Click' pentru avansarea slide-ului?",
                        options: [
                            "Slide-ul se schimba automat dupa un numar de secunde",
                            "Slide-ul se schimba doar cand faci click sau apesi space/sageata",
                            "Slide-ul se schimba la dublu-click",
                            "Slide-ul nu se mai poate schimba"
                        ],
                        correct: 1,
                        explanation: "On Mouse Click = slide-ul asteapta input manual (click, Space, sageata). Iti da control total asupra ritmului prezentarii - nu avanseaza singur pana nu esti gata."
                    },
                    {
                        text: "Ce face butonul 'Apply To All' din tabul Transitions?",
                        options: [
                            "Sterge toate tranzitiile din prezentare",
                            "Aplica aceeasi tranzitie pe toate slide-urile prezentarii",
                            "Aplica animatii pe toate obiectele",
                            "Porneste prezentarea in mod automat"
                        ],
                        correct: 1,
                        explanation: "Apply To All aplica tranzitia curenta (cu toate setarile: efect, directie, durata, sunet) pe TOATE slide-urile. Uniformitatea tranzitiilor = aspect profesional si consistent."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Aplicare practica si bune practici",
                description: "Consolideaza cunostintele despre tranzitii",
                xpReward: 150,
                questions: [
                    {
                        text: "Cate tipuri de tranzitii diferite ar trebui sa folosesti intr-o prezentare profesionala?",
                        options: [
                            "Cat mai multe, pentru varietate",
                            "Unul singur, aplicat consistent pe toate slide-urile",
                            "Cel putin 5 tipuri diferite",
                            "Unul diferit pentru fiecare slide"
                        ],
                        correct: 1,
                        explanation: "Regula profesionala: Foloseste ACEEASI tranzitie pe toate slide-urile pentru consistenta. A amesteca multe tranzitii diferite arata amatoriceste si distrage publicul."
                    },
                    {
                        text: "Ce combinatie de taste porneste prezentarea de la slide-ul curent (nu de la inceput)?",
                        options: [
                            "F5",
                            "Shift+F5",
                            "Ctrl+F5",
                            "Alt+F5"
                        ],
                        correct: 1,
                        explanation: "Shift+F5 porneste prezentarea de la slide-ul pe care esti pozitionat. F5 porneste mereu de la primul slide. Util pentru a testa tranzitia de pe un anumit slide."
                    },
                    {
                        text: "Tranzitia 'Push' face parte din categoria:",
                        options: [
                            "Exciting (Incitante)",
                            "Dynamic Content",
                            "Subtle (Subtile)",
                            "Nu exista in PowerPoint"
                        ],
                        correct: 2,
                        explanation: "Push este in categoria Subtle: slide-ul nou impinge pe cel vechi afara (smooth, natural). Alaturi de Fade, Wipe si Cut, Push este una dintre tranzitiile profesionale recomandate."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('ppt_quiz6_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('ppt_quiz6_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
            // HTML-escape to prevent < > from breaking option rendering
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            const allCompleted = passed && currentLevel === 5;

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${allCompleted ? `
                            <button class="btn btn-success" onclick="showFinalCongrats()">
                                Felicitari! Vezi Rezultatul Final
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function showFinalCongrats() {
            document.getElementById('quizArea').innerHTML = `
                <div class="quiz-complete-final">
                    <div class="level-complete-icon">&#127882;&#127942;&#127882;</div>
                    <h2>Felicitari! Ai terminat quiz-ul despre tranzitii!</h2>
                    <p style="color: var(--text-secondary); margin: 1rem 0;">
                        Ai completat cu succes toate cele 5 niveluri despre Tranzitii intre Slide-uri!
                    </p>
                    <div class="total-xp-final">Total XP castigat: ${totalXP}</div>
                    <p style="color: var(--accent-green); margin: 1rem 0; font-size: 1.1rem;">
                        Acum stii sa aplici tranzitii profesionale in PowerPoint!
                    </p>
                    <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="window.location.href='quiz5-animatii.html'">
                            Quiz 5: Animatii
                        </button>
                        <button class="btn btn-primary" onclick="window.location.href='../index.html'">
                            Inapoi la Modul
                        </button>
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

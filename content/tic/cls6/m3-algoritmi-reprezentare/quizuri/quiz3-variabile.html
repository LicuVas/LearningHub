<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Operatori Logici (SI, SAU, NU) | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-orange: #ff9500;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #000;
        }

.level-node.active {
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px rgba(255, 149, 0, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent-yellow);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Scratch blocks in questions */
        .scratch-block-display {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem auto;
            max-width: 400px;
            text-align: center;
            border: 2px solid var(--accent-green);
        }

.sb-block {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            margin: 0.25rem;
            color: white;
        }

.sb-control { background: #ffab19; color: #000; }

.sb-sensing { background: #5cb1d6; }

.sb-looks { background: #9966ff; }

.sb-motion { background: #4c97ff; }

.sb-operator { background: #59c059; }

.sb-variable { background: #ff8c1a; }

.sb-data { background: #ff8c1a; }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

.explanation {
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: left;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 149, 0, 0.3);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-yellow);
            margin: 1.5rem 0;
        }
    </style>

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Operatori Logici (SI, SAU, NU)</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        // All content grounded in lectia3-operatori-logici.html (m3-algoritmi-reprezentare)
        const levels = {
            1: {
                title: "Nivel 1: De ce avem nevoie de operatori logici?",
                description: "Intelege rolul operatorilor logici in decizii complexe",
                xpReward: 50,
                questions: [
                    {
                        text: "De ce avem nevoie de operatori logici in programare?",
                        options: [
                            "Pentru a combina mai multe conditii intr-o singura decizie",
                            "Pentru a face calcule matematice cu numere",
                            "Pentru a desena forme pe ecran",
                            "Pentru a redimensiona sprite-urile"
                        ],
                        correct: 0,
                        explanation: "Operatorii logici ne permit sa verificam mai multe lucruri simultan. In loc de o singura conditie (DACA nota >= 5), putem combina doua: DACA nota >= 5 SI ai terminat tema."
                    },
                    {
                        text: "Care dintre urmatoarele este un exemplu de situatie care necesita operator logic SI?",
                        options: [
                            "DACA e luni, mergi la scoala",
                            "DACA e rosu, opreste-te",
                            "DACA e verde, traverseaza strada",
                            "DACA ai terminat tema SI e frumos afara, poti iesi la joaca"
                        ],
                        correct: 3,
                        explanation: "Situatia 'ai terminat tema SI e frumos afara' necesita ambele conditii indeplinite simultan - exact ce face operatorul SI. Celelalte exemple au doar o conditie simpla."
                    },
                    {
                        text: "Cati operatori logici principali exista in Scratch?",
                        options: [
                            "1 (doar SI)",
                            "2 (SI si SAU)",
                            "3 (SI, SAU si NU)",
                            "5 sau mai multi"
                        ],
                        correct: 2,
                        explanation: "In Scratch exista trei operatori logici: SI (AND), SAU (OR) si NU (NOT). Fiecare are un rol diferit: SI cere ambele conditii, SAU cere macar una, NU inverseaza conditia."
                    },
                    {
                        text: "Unde se gasesc blocurile operatorilor logici (SI, SAU, NU) in Scratch?",
                        options: [
                            "Categoria Control (portocaliu)",
                            "Categoria Operatori (verde)",
                            "Categoria Miscare (albastru)",
                            "Categoria Aspect (mov)"
                        ],
                        correct: 1,
                        explanation: "Blocurile SI, SAU si NU se gasesc in categoria Operatori din Scratch, care are culoarea verde. Au forma hexagonala (cu colturi ascutite), la fel ca blocurile de comparatie."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Operatorul SI (AND)",
                description: "Invata cand SI da rezultat ADEVARAT sau FALS",
                xpReward: 75,
                questions: [
                    {
                        text: "Cand este rezultatul operatorului SI ADEVARAT?",
                        options: [
                            "Cand cel putin una din conditii este adevarata",
                            "Cand AMBELE conditii sunt adevarate",
                            "Cand nicio conditie nu este adevarata",
                            "Intotdeauna"
                        ],
                        correct: 1,
                        explanation: "SI este foarte strict: rezultatul este ADEVARAT doar cand AMBELE conditii sunt adevarate. Daca cel putin una este falsa, intregul rezultat este FALS."
                    },
                    {
                        text: "ADEVARAT SI FALS = ?",
                        options: [
                            "ADEVARAT",
                            "NECUNOSCUT",
                            "Depinde de context",
                            "FALS"
                        ],
                        correct: 3,
                        explanation: "ADEVARAT SI FALS = FALS. SI cere ca AMBELE sa fie adevarate. Deoarece a doua conditie este FALS, rezultatul intregii expresii este FALS."
                    },
                    {
                        text: "Pot merge la excursie DACA am permisiunea parintilor SI am platit taxa. Am permisiune dar NU am platit. Ce se intampla?",
                        options: [
                            "Pot merge, pentru ca am permisiune",
                            "Pot merge daca platesc jumatate din taxa",
                            "Nu pot merge, pentru ca SI cere AMBELE conditii indeplinite",
                            "Nu conteaza taxa daca am permisiune"
                        ],
                        correct: 2,
                        explanation: "Cu operatorul SI, ambele conditii trebuie indeplinite simultan. Ai permisiune (ADEVARAT) SI nu ai platit (FALS) = FALS. Nu poti merge la excursie."
                    },
                    {
                        text: "Din 4 combinatii posibile ale operatorului SI, cate dau rezultat ADEVARAT?",
                        options: [
                            "1 combinatie (ADEV SI ADEV)",
                            "0 combinatii",
                            "3 combinatii",
                            "4 combinatii (toate)"
                        ],
                        correct: 0,
                        explanation: "Din cele 4 combinatii (ADEV-ADEV, ADEV-FALS, FALS-ADEV, FALS-FALS), doar una da ADEVARAT: ADEVARAT SI ADEVARAT. In toate celelalte cazuri rezultatul este FALS."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Operatorul SAU (OR)",
                description: "Descopera diferenta dintre SI si SAU",
                xpReward: 100,
                questions: [
                    {
                        text: "Cand este rezultatul operatorului SAU ADEVARAT?",
                        options: [
                            "Doar cand ambele conditii sunt adevarate",
                            "Doar cand ambele conditii sunt false",
                            "Niciodata",
                            "Cand cel putin UNA din conditii este adevarata"
                        ],
                        correct: 3,
                        explanation: "SAU este mai flexibil decat SI: rezultatul este ADEVARAT cand CEL PUTIN UNA din conditii este adevarata. Rezultatul este FALS doar cand AMBELE conditii sunt false."
                    },
                    {
                        text: "FALS SAU ADEVARAT = ?",
                        options: [
                            "FALS",
                            "ADEVARAT",
                            "NECUNOSCUT",
                            "FALS intotdeauna daca prima e FALS"
                        ],
                        correct: 1,
                        explanation: "FALS SAU ADEVARAT = ADEVARAT. Cu SAU, e suficient ca una din conditii sa fie adevarata. Deoarece a doua conditie este ADEVARAT, rezultatul intregii expresii este ADEVARAT."
                    },
                    {
                        text: "Pot ajunge la scoala DACA vine autobuzul SAU ma duce tata. Autobuzul nu vine si nici tata nu ma duce. Ce se intampla?",
                        options: [
                            "Nu ajung la scoala (ambele variante sunt false)",
                            "Ajung la scoala cu autobuzul",
                            "Ajung la scoala cu tata",
                            "Ajung oricum pe jos"
                        ],
                        correct: 0,
                        explanation: "SAU este FALS doar cand AMBELE conditii sunt false. Daca nici autobuzul nu vine (FALS) si nici tata nu ma duce (FALS), atunci FALS SAU FALS = FALS. Nu ajung la scoala."
                    },
                    {
                        text: "Care este diferenta cheie intre SI si SAU?",
                        options: [
                            "Nu exista nicio diferenta intre ele",
                            "SAU cere ambele, SI cere macar una",
                            "SI cere TOTUL (ambele), SAU cere MACAR UNUL",
                            "SI si SAU functioneaza identic in Scratch"
                        ],
                        correct: 2,
                        explanation: "Diferenta fundamentala: SI cere ca AMBELE conditii sa fie adevarate, SAU cere ca MACAR UNA sa fie adevarata. SI este strict, SAU este mai permisiv."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Operatorul NU (NOT)",
                description: "Invata sa inversezi conditii cu operatorul NU",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce face operatorul NU (NOT)?",
                        options: [
                            "Inverseaza rezultatul: adevarat devine fals si invers",
                            "Combina doua conditii la fel ca SI",
                            "Sterge o conditie din program",
                            "Repeta o conditie de mai multe ori"
                        ],
                        correct: 0,
                        explanation: "NU se aplica pe O SINGURA conditie si ii inverseaza rezultatul. Daca conditia era ADEVARATA, devine FALSA. Daca era FALSA, devine ADEVARATA."
                    },
                    {
                        text: "NU ADEVARAT = ?",
                        options: [
                            "ADEVARAT",
                            "FALS",
                            "NECUNOSCUT",
                            "ADEVARAT sau FALS in functie de context"
                        ],
                        correct: 1,
                        explanation: "NU ADEVARAT = FALS. Operatorul NU inverseaza intotdeauna: ADEVARAT devine FALS, FALS devine ADEVARAT."
                    },
                    {
                        text: "DACA NU ploua, mergem la plimbare. Afara ploua. Ce se intampla?",
                        options: [
                            "Mergem la plimbare (ploua = ADEVARAT)",
                            "Mergem daca avem umbrela",
                            "Conditia nu poate fi evaluata",
                            "Nu mergem la plimbare (NU ploua = NU ADEVARAT = FALS)"
                        ],
                        correct: 3,
                        explanation: "Ploua = ADEVARAT. NU ploua = NU ADEVARAT = FALS. Deci conditia DACA NU ploua este FALSA, si nu mergem la plimbare."
                    },
                    {
                        text: "Ce se intampla cu dubla negatie: NU(NU ADEVARAT)?",
                        options: [
                            "Ramane FALS",
                            "Produce o eroare in Scratch",
                            "Rezulta ADEVARAT (dubla negatie se anuleaza)",
                            "Rezulta NECUNOSCUT"
                        ],
                        correct: 2,
                        explanation: "NU(NU ADEVARAT) = NU(FALS) = ADEVARAT. Dubla negatie se anuleaza, ca in matematica. In practica, evita dubla negatie deoarece face codul greu de inteles."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Aplicatii combinate",
                description: "Combina SI, SAU si NU pentru a rezolva probleme complexe",
                xpReward: 150,
                questions: [
                    {
                        text: "Un elev poate participa la concurs DACA nota >= 8 SI absente < 5. Nota = 9, absente = 6. Poate participa?",
                        options: [
                            "Nu, pentru ca absente < 5 este falsa (are 6 absente)",
                            "Da, pentru ca nota >= 8 este adevarata",
                            "Da, pentru ca 9 > 8",
                            "Nu se poate determina"
                        ],
                        correct: 0,
                        explanation: "nota >= 8: 9 >= 8 = ADEVARAT. absente < 5: 6 < 5 = FALS. ADEVARAT SI FALS = FALS. Nu poate participa. SI cere ca AMBELE conditii sa fie adevarate."
                    },
                    {
                        text: "In Scratch, forma blocurilor operatorilor logici (SI, SAU, NU) este:",
                        options: [
                            "Rotunda, ca blocurile de miscare",
                            "Dreptunghiulara, ca blocurile de control",
                            "Hexagonala (cu colturi ascutite), la fel ca blocurile de comparatie",
                            "In forma de C, ca blocurile de bucla"
                        ],
                        correct: 2,
                        explanation: "Blocurile operatorilor logici au FORMA HEXAGONALA in Scratch. Aceasta forma speciala le permite sa fie inserate in spatiul de conditie al blocurilor DACA...ATUNCI sau REPETA PANA CAND."
                    },
                    {
                        text: "Jocul se termina DACA jucatorul atinge inamicul SI are 0 vieti SAU daca atinge iesirea. Jucatorul atinge iesirea cu 2 vieti. Se termina jocul?",
                        options: [
                            "Nu, pentru ca are inca vieti",
                            "Da, pentru ca a atins iesirea (conditia SAU este adevarata)",
                            "Nu se poate determina",
                            "Da, dar numai daca si inamicul e atins"
                        ],
                        correct: 1,
                        explanation: "Conditia este: (atinge inamic SI vieti = 0) SAU (atinge iesire). Jucatorul atinge iesirea = ADEVARAT. Deci una din conditiile SAU este adevarata => jocul se termina (cu victorie)!"
                    },
                    {
                        text: "Vrei sa verifici ca un elev NU a absolvit inca (varsta < 18 sau note incomplete). Care operator simplifca aceasta verificare?",
                        options: [
                            "SI, pentru ca sunt doua conditii",
                            "SAU, pentru ca una e suficienta",
                            "Nu este nevoie de operatori logici",
                            "NU, pentru a inversa conditia 'a absolvit'"
                        ],
                        correct: 3,
                        explanation: "Operatorul NU simplifica exprimarea: in loc de 'varsta < 18 SAU note incomplete', poti scrie 'NU (a absolvit)'. E mai natural sa inversezi conditia 'a absolvit' decat sa enumeri toate cazurile negative."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('scratch_quiz3_operatori_logici_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('scratch_quiz3_operatori_logici_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.scratch && q.scratchBlock) {
                questionContent += `
                    <div class="scratch-block-display">
                        <span class="sb-block sb-operator">${q.scratchBlock}</span>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-evenimente.html'">
                                Quiz-ul 4: Evenimente
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Structuri Repetitive si Reprezentare | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <link rel="stylesheet" href="../../../../../assets/css/scratch-blocks.css">

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 3</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Structuri Repetitive si Reprezentare</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        // Curriculum anchor: OMEN 3393/2017, Clasa VI — domeniu "Algoritmi (structuri repetitive) + reprezentare"
        // Source: curriculum_ro_ict_cs_gimnaziu.json, clasa VI, lines 205-209:
        //   "Structura repetitiva: conditionata anterior / posterior / cu contor"
        //   "Modalitati de reprezentare: schema logica si pseudocod"
        //   "Reguli de notare variabile si indentare"
        // Competente: VI-2.3 (construirea algoritmilor cu structura repetitiva)
        //             VI-3.3 (implementarea in mediu grafic interactiv a algoritmilor cu structura repetitiva)
        const levels = {
            1: {
                title: "Nivel 1: Ce este structura repetitiva?",
                description: "Invata de ce avem nevoie de bucle si ce tipuri exista",
                xpReward: 50,
                questions: [
                    {
                        text: "De ce folosim structura repetitiva intr-un algoritm?",
                        options: [
                            "Pentru a alege intre doua actiuni diferite",
                            "Pentru a repeta un set de instructiuni de mai multe ori",
                            "Pentru a defini variabile noi",
                            "Pentru a desena o schema logica"
                        ],
                        correct: 1,
                        explanation: "Structura repetitiva (bucla) permite executia acelorasi instructiuni de mai multe ori, evitand repetarea manuala a codului."
                    },
                    {
                        text: "Care dintre urmatoarele NU este un tip de structura repetitiva studiata in clasa a VI-a?",
                        options: [
                            "Structura repetitiva conditionata anterior (cat timp ... executa)",
                            "Structura repetitiva conditionata posterior (executa ... cat timp)",
                            "Structura repetitiva cu contor (pentru i de la ... la ... executa)",
                            "Structura alternativa (daca ... atunci ... altfel)"
                        ],
                        correct: 3,
                        explanation: "Structura alternativa (daca...atunci...altfel) este structura de decizie, studiata in clasa a V-a. In clasa a VI-a studiem cele trei tipuri de structuri repetitive."
                    },
                    {
                        text: "Cate tipuri de structuri repetitive sunt prevazute in programa clasei a VI-a?",
                        options: [
                            "Unul (numai cu contor)",
                            "Doua (conditionata anterior si posterior)",
                            "Trei (conditionata anterior, conditionata posterior, cu contor)",
                            "Patru (anterior, posterior, contor si infinita)"
                        ],
                        correct: 2,
                        explanation: "Programa clasei a VI-a prevede trei tipuri: conditionata anterior, conditionata posterior si cu contor."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Structura conditionata anterior",
                description: "Bucla 'cat timp ... executa' — conditia e verificata INAINTE",
                xpReward: 75,
                questions: [
                    {
                        text: "La structura repetitiva conditionata anterior, cand se verifica conditia?",
                        options: [
                            "Dupa executia corpului buclei",
                            "O singura data, la inceput",
                            "Inainte de fiecare executie a corpului buclei",
                            "Niciodata — bucla ruleaza la infinit"
                        ],
                        correct: 2,
                        explanation: "La structura conditionata anterior (cat timp C executa S), conditia C este verificata INAINTE de fiecare repetare. Daca la prima verificare e falsa, corpul S nu se executa deloc."
                    },
                    {
                        text: "Algoritmul: 'cat timp nr > 0 executa: scrie nr; nr <- nr - 1'. Daca nr = 0 la start, ce se intampla?",
                        options: [
                            "Se scrie 0 o data",
                            "Bucla nu se executa deloc",
                            "Apare o eroare",
                            "Se scrie 0 la infinit"
                        ],
                        correct: 1,
                        explanation: "Conditia 'nr > 0' este falsa de la inceput (0 > 0 este fals), deci corpul buclei nu se executa nicio data."
                    },
                    {
                        text: "In pseudocod, structura conditionata anterior se scrie astfel:",
                        options: [
                            "repeta S cat timp C",
                            "pentru i <- 1, n executa S",
                            "cat timp C executa S",
                            "daca C atunci S"
                        ],
                        correct: 2,
                        explanation: "Forma standard in pseudocod pentru structura conditionata anterior este: 'cat timp C executa S', unde C este conditia si S este corpul buclei."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Structura conditionata posterior",
                description: "Bucla 'repeta ... cat timp' — corpul se executa CEL PUTIN O DATA",
                xpReward: 100,
                questions: [
                    {
                        text: "Care este diferenta esentiala intre structura conditionata anterior si cea conditionata posterior?",
                        options: [
                            "Nu exista nicio diferenta",
                            "La cea posterioara, corpul se executa cel putin o data, indiferent de conditie",
                            "La cea posterioara, conditia se verifica de doua ori",
                            "Cea posterioara nu are conditie"
                        ],
                        correct: 1,
                        explanation: "La structura conditionata posterior (repeta S cat timp C), corpul S se executa INTAI, apoi se verifica conditia. Astfel, S se executa cel putin o data, chiar daca conditia e falsa de la inceput."
                    },
                    {
                        text: "In pseudocod, structura conditionata posterior se scrie astfel:",
                        options: [
                            "cat timp C executa S",
                            "pentru i <- 1, n executa S",
                            "repeta S cat timp C",
                            "daca C atunci S altfel T"
                        ],
                        correct: 2,
                        explanation: "Forma standard in pseudocod pentru structura conditionata posterior este: 'repeta S cat timp C', unde S este corpul care se executa prima oara fara verificare."
                    },
                    {
                        text: "Algoritmul: 'repeta: citeste n; cat timp n < 0'. Cand se opreste?",
                        options: [
                            "Imediat, daca n >= 0 de la start",
                            "Dupa ce citeste un numar negativ",
                            "Dupa ce citeste un numar mai mare sau egal cu 0",
                            "Niciodata"
                        ],
                        correct: 2,
                        explanation: "Bucla continua cat timp conditia 'n < 0' este adevarata. Se opreste cand utilizatorul introduce un n >= 0, adica un numar mai mare sau egal cu zero."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Structura repetitiva cu contor",
                description: "Bucla 'pentru i de la ... la ... executa' — numarul de repetari e cunoscut",
                xpReward: 125,
                questions: [
                    {
                        text: "Cand este recomandat sa folosim structura repetitiva cu contor?",
                        options: [
                            "Cand nu stim de cate ori se repeta bucla",
                            "Cand numarul de repetari este cunoscut dinainte",
                            "Cand conditia depinde de datele utilizatorului",
                            "Niciodata — e mai bine sa folosim conditionata anterior"
                        ],
                        correct: 1,
                        explanation: "Structura cu contor se foloseste cand numarul de repetari este cunoscut (fix sau calculat): 'pentru i <- 1, n executa S' repeta exact n ori."
                    },
                    {
                        text: "In pseudocod: 'pentru i <- 1, 5 executa: scrie i'. Ce valori se afiseaza?",
                        options: [
                            "1 2 3 4 (4 valori)",
                            "1 2 3 4 5 (5 valori)",
                            "0 1 2 3 4 (5 valori)",
                            "2 3 4 5 (4 valori)"
                        ],
                        correct: 1,
                        explanation: "Contorul i ia valorile 1, 2, 3, 4, 5 (inclusiv ambele capete), deci se afiseaza 5 valori: 1 2 3 4 5."
                    },
                    {
                        text: "Variabila care numara repetarile intr-o structura repetitiva cu contor se numeste:",
                        options: [
                            "Acumulator",
                            "Contor (variabila de control)",
                            "Indice de conditie",
                            "Variabila booleana"
                        ],
                        correct: 1,
                        explanation: "In structura repetitiva cu contor, variabila care controleaza numarul de repetari se numeste contor sau variabila de control. Ea se incrementeaza automat la fiecare pas."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Reprezentare — Schema logica si Pseudocod",
                description: "Doua modalitati de a reprezenta algoritmii: vizual si textual",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce sunt cele doua modalitati de reprezentare a algoritmilor studiate in clasa a VI-a?",
                        options: [
                            "Diagrama UML si codul sursa",
                            "Schema logica si pseudocodul",
                            "Tabelul de adevar si graficul",
                            "Flowchart si diagramele Gantt"
                        ],
                        correct: 1,
                        explanation: "Programa clasei a VI-a prevede doua modalitati de reprezentare: schema logica (reprezentare grafica cu simboluri standardizate) si pseudocodul (reprezentare textuala, aproape de limbajul natural)."
                    },
                    {
                        text: "In schema logica, simbolul romb (diamant) reprezinta:",
                        options: [
                            "O instructiune de intrare/iesire (citire/scriere)",
                            "Inceputul sau sfarsitul algoritmului",
                            "O decizie sau conditie de verificat",
                            "O operatie de calcul (atribuire)"
                        ],
                        correct: 2,
                        explanation: "In schema logica, rombul (forma de diamant) reprezinta un bloc de decizie — o conditie care are doua iesiri: DA (adevarat) si NU (fals)."
                    },
                    {
                        text: "Ce regula de scriere se aplica in pseudocod pentru instructiunile din interiorul unei bucle?",
                        options: [
                            "Se scriu cu litere mari",
                            "Se scriu cu un rand liber intre ele",
                            "Se indenteza (se scriu mai la dreapta fata de bucla)",
                            "Se numeroteaza cu cifre romane"
                        ],
                        correct: 2,
                        explanation: "O regula esentiala de scriere in pseudocod este indentarea: instructiunile din corpul buclei se scriu mai la dreapta (indentate), pentru a vizualiza clar structura algoritmului."
                    },
                    {
                        text: "In schema logica, forma dreptunghiulara (dreptunghi simplu) reprezinta:",
                        options: [
                            "O conditie de verificat",
                            "O operatie de calcul sau atribuire",
                            "Inceputul sau sfarsitul algoritmului",
                            "O operatie de citire sau scriere"
                        ],
                        correct: 1,
                        explanation: "In schema logica, dreptunghiul simplu reprezinta o operatie de calcul sau atribuire (de exemplu: s <- s + i). Dreptunghiul cu linii duble laterale reprezinta citire/scriere."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('scratch_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('scratch_quiz1_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-bucle.html'">
                                Quiz-ul 2: Bucle
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

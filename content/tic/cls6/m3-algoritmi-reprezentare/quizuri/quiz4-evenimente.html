<script>
        // Quiz data for each level

        // Total 20 intrebari, raspunsuri: 5x0, 5x1, 5x2, 5x3 = distributie uniforma.
        const levels = {
            1: {

                        explanation: "'Repeta pana cand' (Lectia 5) este bucla cu conditie: jocul continua la infinit pana cand o conditie de iesire devine adevarata. Conditia de iesire este: ai ajuns la iesire SAU ai ramas fara vieti."
                    },
                    {
                        text: "La inceputul jocului vrem sa plasam exact 5 monede pe harta. Ce bucla folosim?",
                        options: [
                            "repeta pana cand (monede_plasate = 5)",

                    },
                    {
                        text: "Un inamic patruleaza intr-un cerc pana cand jocul se termina. Ce bucla descrie cel mai bine acest comportament?",
                        options: [
                            "repeta de 10 ori: misca-te in cerc",
                            "repeta pana cand (joc_terminat = adevarat): misca-te in cerc",

                        ],
                        correct: 1,
                        explanation: "Inamicul patruleaza pana cand jocul se termina — conditia de oprire este cunoscuta (joc_terminat), dar numarul de ture nu se stie dinainte. Aceasta e definitia buclei 'repeta pana cand' (Lectia 5)."
                    },
                    {
                        text: "Care este diferenta esentiala intre 'repeta de N ori' (Lectia 4) si 'repeta pana cand' (Lectia 5)?",
                        options: [
                            "'Repeta de N ori' stie dinainte cate repetari face; 'repeta pana cand' se opreste la o conditie",

                            "'Repeta de N ori' e mai rapida"

                        correct: 0,
                        explanation: "Diferenta fundamentala (Lectiile 4-5): 'repeta de N ori' = numar fix de iteratii cunoscut dinainte (contor). 'Repeta pana cand' = numarul de iteratii nu se stie, bucla se opreste cand o conditia devine adevarata."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Variabile si starea jocului",
                description: "Variabilele memoreaza starea jocului: scor, vieti, pozitie",
                xpReward: 100,
                questions: [
                    {
                        text: "In jocul de labirint, variabila 'vieti' incepe cu 3 si scade cu 1 la fiecare coliziune cu un inamic. Ce operatie de atribuire realizeaza scaderea?",

                    {
                        text: "Jucatorul colecteaza monede si scorul creste cu 10 la fiecare moneda. La start, scorul este 0. Dupa 4 monede, cat este scorul?",

                title: "Nivel 5: Maestrul algoritmilor!",

                    },
                    {
                        text: "Care combinatie de structuri descrie cel mai complet un joc de labirint functional in Scratch, conform lectiei 6?",
                        options: [
                            "Doar bucle repeta de N ori pentru toate comportamentele",
                            "Doar conditii daca...atunci, fara bucle",
                            "O singura bucla repeta pana cand cu o conditie simpla",
                            "Conditii daca...atunci si daca...altfel pentru coliziuni si victorie; operatori SI/SAU pentru conditii combinate; repeta de N ori pentru initializare inamici; repeta pana cand pentru bucla principala; variabile pentru scor/vieti/pozitie"
                        ],
                        correct: 3,

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('scratch_quiz4_proiect_integrat_progress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    totalXP = data.totalXP || 0;
                    unlockedLevels = data.unlockedLevels || [1];
                    levelScores = data.levelScores || {};
                    updateXPDisplay();
                    updateLevelMap();
                } catch (e) {
                    console.warn('Progress parse error, resetting.', e);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem('scratch_quiz4_proiect_integrat_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text" style="white-space: pre-line;">${escHtml(q.text)}</p>`;

            if (q.scratch && q.scratchBlock) {
                questionContent += `
                    <div class="scratch-block-display">${escHtml(q.scratchBlock)}</div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz5-clone.html'">
                                Quiz-ul 5: Clone
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

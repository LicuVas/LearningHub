<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>

        <div class="quiz-header">

                <span>XP:</span>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>

            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        // Sursa curriculara: OMEN 3393/2017, clasa VI, domeniu "Algoritmi (structuri repetitive) + reprezentare"
        // Subiecte: pseudocod, schema logica, variabile, indentare, structuri de control reprezentate formal
        const levels = {
            1: {
                title: "Nivel 1: Ce este pseudocodul?",
                description: "Descopera limbajul universal al algoritmilor — pseudocodul",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este pseudocodul?",
                        options: [
                            "Un limbaj de programare real, rulat pe calculator",
                            "O scriere informala a unui algoritm, folosind cuvinte-cheie si reguli simple, fara sintaxa stricta de programare",
                            "Un tip de schema cu casute si sageti",
                            "Un program de calculator pentru desene"
                        ],
                        correct: 1,
                        explanation: "Pseudocodul este un MOD DE A DESCRIE algoritmul in cuvinte structurate — nu e un limbaj de programare real, deci nu-l ruleaza calculatorul. Il scriem pe hartie sau tabla pentru a planifica logica inainte de implementare."
                    },
                    {
                        text: "De ce folosim pseudocodul inainte de a scrie codul intr-un limbaj de programare?",
                        options: [
                            "Pentru ca ruleaza mai repede decat codul real",
                            "Pentru a ne concentra pe logica algoritmului, fara a ne preocupa de sintaxa exacta a unui limbaj",
                            "Pseudocodul este obligatoriu pentru toate calculatoarele",
                            "Pentru ca profesorul cere intotdeauna pseudocod"
                        ],
                        correct: 1,
                        explanation: "Pseudocodul ne ajuta sa GANDIM logica algoritmului — ce pasi, ce conditii, ce bucle — fara sa ne pierdem in detalii de sintaxa (virgule, paranteze, majuscule). Abia dupa ce logica e clara, o implementam in Scratch sau alt limbaj."
                    },
                    {
                        text: "Care dintre urmatoarele este un exemplu corect de pseudocod pentru 'citeste un numar si afiseaza-l dublat'?",
                        options: [
                            "int x; cin >> x; cout << x*2;",
                            "CITESTE x\nSCRIE x * 2",
                            "read(x) print(x+x)",
                            "x := INPUT; DISPLAY x+x"
                        ],
                        correct: 1,
                        explanation: "CITESTE x / SCRIE x * 2 este forma clasica de pseudocod in limba romana, folosita in programa romaneasca. Cuvintele-cheie sunt CITESTE (pentru date de intrare) si SCRIE (pentru date de iesire). Nu e cod C++ sau Python."
                    },
                    {
                        text: "Ce rol au cuvintele-cheie (DACA, REPETA, CAT_TIMP, CITESTE, SCRIE) in pseudocod?",
                        options: [
                            "Sunt optionale — poti folosi orice cuvinte",
                            "Marcheaza structurile algoritmice importante si fac pseudocodul usor de citit si de tradus in orice limbaj de programare",
                            "Sunt comenzi pe care calculatorul le intelege direct",
                            "Se folosesc doar in limba engleza"
                        ],
                        correct: 1,
                        explanation: "Cuvintele-cheie sunt 'scheletul' pseudocodului: DACA marcheaza o decizie, REPETA marcheaza o bucla, CITESTE/SCRIE marcheaza intrarea/iesirea. Un pseudocod cu cuvinte-cheie clare poate fi tradus usor in orice limbaj: Scratch, Python, C++."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Schema logica",
                description: "Invata sa citesti si sa construiesti scheme logice (flowcharts)",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este o schema logica (flowchart)?",
                        options: [
                            "Un tabel cu date despre un program",
                            "O reprezentare grafica a unui algoritm, folosind simboluri geometrice conectate cu sageti",
                            "Un tip de grafic cu bare pentru statistici",
                            "O diagrama a pieselor unui calculator"
                        ],
                        correct: 1,
                        explanation: "Schema logica (flowchart) reprezinta VIZUAL algoritmul: fiecare tip de operatie are un simbol geometric specific (oval, dreptunghi, romb), iar sagetile arata ordinea executiei. Este echivalentul vizual al pseudocodului."
                    },
                    {
                        text: "Ce simbol geometric se foloseste pentru o DECIZIE (conditie) in schema logica?",
                        options: [
                            "Oval (elipsa) — pentru inceput/sfarsit",
                            "Dreptunghi — pentru operatii simple",
                            "Romb (paralelogram inclinat) — pentru decizie DA/NU",
                            "Triunghi — pentru repetare"
                        ],
                        correct: 2,
                        explanation: "ROMBUL (losangul) este simbolul deciziei in schema logica. Are intotdeauna doua iesiri: DA (conditia e adevarata) si NU (conditia e falsa). Dreptunghiul e pentru instructiuni simple; ovalul e pentru START/STOP."
                    },
                    {
                        text: "Ce simbol se foloseste pentru operatii de INTRARE si IESIRE (citire/afisare) in schema logica?",
                        options: [
                            "Dreptunghi cu colturi drepte",
                            "Paralelogram (dreptunghi inclinat)",
                            "Romb",
                            "Oval"
                        ],
                        correct: 1,
                        explanation: "Paralelogramul (dreptunghiul inclinat) reprezinta CITIRE (date intrate de utilizator) sau SCRIERE (date afisate pe ecran). Dreptunghiul cu colturi drepte e pentru calcule si atribuiri (de exemplu: x <- x + 1)."
                    },
                    {
                        text: "Intr-o schema logica, ce marcheaza ovalul?",
                        options: [
                            "O decizie cu doua variante",
                            "O operatie de calcul",
                            "Inceputul (START) sau sfarsitul (STOP) algoritmului",
                            "O bucla repetitiva"
                        ],
                        correct: 2,
                        explanation: "Ovalul (elipsa) marcheaza intotdeauna START sau STOP — punctele terminale ale schemei logice. Orice schema logica corecta incepe cu un oval START si se termina cu un oval STOP."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Structuri de control in pseudocod",
                description: "Recunoaste structurile secventiala, conditionala si repetitiva in pseudocod",
                xpReward: 100,
                questions: [
                    {
                        text: "Care pseudocod reprezinta corect structura conditionala DACA-ALTFEL?",
                        pseudo: true,
                        pseudoLines: [
                            "DACA nota >= 5 ATUNCI",
                            "  SCRIE \"Promovat\"",
                            "ALTFEL",
                            "  SCRIE \"Corigent\"",
                            "SFARSIT_DACA"
                        ],
                        options: [
                            "REPETA / SCRIE \"Promovat\" / PANA_CAND nota >= 5",
                            "DACA nota >= 5 ATUNCI / SCRIE \"Promovat\" / ALTFEL / SCRIE \"Corigent\" / SFARSIT_DACA",
                            "CITESTE nota / nota >= 5 / SCRIE \"Promovat\"",
                            "CAT_TIMP nota >= 5 / SCRIE \"Promovat\" / SFARSIT_CAT_TIMP"
                        ],
                        correct: 1,
                        explanation: "Structura DACA-ALTFEL in pseudocod: DACA (conditie) ATUNCI / (actiuni daca DA) / ALTFEL / (actiuni daca NU) / SFARSIT_DACA. REPETA si CAT_TIMP sunt structuri repetitive, nu conditionale."
                    },
                    {
                        text: "Care pseudocod reprezinta corect o structura repetitiva CU CONTOR (repeta de N ori)?",
                        options: [
                            "DACA i <= 5 ATUNCI / SCRIE i / SFARSIT_DACA",
                            "PENTRU i DE LA 1 LA 5 / SCRIE i / SFARSIT_PENTRU",
                            "CITESTE i / SCRIE i / REPETA",
                            "CAT_TIMP SCRIE i PANA_CAND i = 5"
                        ],
                        correct: 1,
                        explanation: "Bucla cu contor (repeta de N ori) se scrie in pseudocod ca: PENTRU i DE LA 1 LA N / (instructiuni) / SFARSIT_PENTRU. In Scratch este echivalenta cu blocul 'repeta de N ori'. Contorul i creste automat la fiecare iteratie."
                    },
                    {
                        text: "Care structura se potriveste cu pseudocodul: 'CAT_TIMP x > 0 / x <- x - 1 / SFARSIT_CAT_TIMP'?",
                        options: [
                            "Structura secventiala (liniara)",
                            "Structura conditionala simpla (DACA-ATUNCI)",
                            "Structura repetitiva conditionata anterior (testul conditiei la inceput)",
                            "Structura repetitiva conditionata posterior (testul conditiei la sfarsit)"
                        ],
                        correct: 2,
                        explanation: "CAT_TIMP (conditie) EXECUTA ... este structura repetitiva CONDITIONATA ANTERIOR: conditia e verificata INAINTE de fiecare iteratie. Daca x = 0 de la inceput, bucla nu se executa deloc. In Scratch echivalentul este 'repeta pana cand' cu conditia negata."
                    },
                    {
                        text: "Ce inseamna 'indentarea' in pseudocod?",
                        options: [
                            "Scrierea variabilelor cu litere mari",
                            "Adaugarea de spatii sau tab-uri la inceputul liniilor care sunt in interiorul unei structuri, pentru a evidentia ierarhia",
                            "Punerea unui punct la sfarsitul fiecarei linii",
                            "Numerotarea pasilor algoritmului"
                        ],
                        correct: 1,
                        explanation: "Indentarea inseamna DEPLASAREA SPRE DREAPTA a instructiunilor aflate in interiorul unei structuri (DACA, PENTRU, CAT_TIMP). Face codul LIZIBIL: vedem dintr-o privire ce apartine structurii si ce este in afara. Fara indentare, pseudocodul devine greu de citit."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Variabile in algoritmi",
                description: "Intelege rolul variabilelor si regulile de notare",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este o variabila intr-un algoritm?",
                        options: [
                            "Un cuvant-cheie fix, cu valoare mereu aceeasi",
                            "Un spatiu de memorie cu un nume, in care se poate stoca o valoare ce se poate schimba pe parcursul algoritmului",
                            "O formula matematica scrisa in cod",
                            "Un tip de conditie in pseudocod"
                        ],
                        correct: 1,
                        explanation: "Variabila este o 'cutie' cu un NUME (ex: scor, varsta, suma) in care stocam valori ce se pot MODIFICA pe parcurs. In Scratch variabilele se creeaza din categoria 'Variabile'. In pseudocod le atribuim valori cu: variabila <- valoare."
                    },
                    {
                        text: "Care este o regula corecta de notare a numelor de variabile in pseudocod (conform programei romanesti)?",
                        options: [
                            "Numele variabilei poate contine spatii: 'scor final'",
                            "Numele variabilei incepe cu o litera si poate contine litere, cifre sau _ (fara spatii): ex. scor_final, nr1",
                            "Numele variabilei trebuie sa fie un singur caracter: a, b, x",
                            "Numele variabilei se scrie intotdeauna cu litere mari: SCOR"
                        ],
                        correct: 1,
                        explanation: "Conventie standard: numele variabilelor incep cu litera, pot contine litere, cifre si _ (underscore), fara spatii. Exemple valide: scor, nr1, suma_totala. Exemple invalide: 'scor final' (spatiu), '1nr' (incepe cu cifra). Majusculele sunt optionale ca stil."
                    },
                    {
                        text: "Ce inseamna operatia de ATRIBUIRE in pseudocod (ex: suma <- suma + nr)?",
                        options: [
                            "Comparam suma cu suma + nr si vedem daca sunt egale",
                            "Calculam suma + nr si stocam rezultatul in variabila suma, inlocuind valoarea anterioara",
                            "Stergem variabila suma din memorie",
                            "Afisam valoarea suma + nr pe ecran"
                        ],
                        correct: 1,
                        explanation: "Atribuirea suma <- suma + nr inseamna: 1) calculeaza suma + nr, 2) pune rezultatul in variabila suma. Valoarea veche a lui suma se PIERDE. De exemplu, daca suma era 10 si nr e 5, dupa atribuire suma devine 15. Semnul <- nu e egal, e 'primeste valoarea'."
                    },
                    {
                        text: "Care pseudocod calculeaza corect suma numerelor de la 1 la 5?",
                        options: [
                            "CITESTE suma / SCRIE suma",
                            "suma <- 0 / PENTRU i DE LA 1 LA 5 / suma <- suma + i / SFARSIT_PENTRU / SCRIE suma",
                            "DACA i <= 5 ATUNCI / suma <- i / SFARSIT_DACA",
                            "suma <- 1 + 2 + 3 + 4 + 5 (scris manual)"
                        ],
                        correct: 1,
                        explanation: "Algoritmul corect: initializeaza suma cu 0, apoi foloseste o bucla PENTRU de la 1 la 5, adaugand fiecare i la suma. La sfarsit afiseaza suma. Initializarea cu 0 este OBLIGATORIE — altfel variabila poate contine valori reziduale."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Citire si verificare algoritmi",
                description: "Traseaza executia unui algoritm si verifica rezultatele",
                xpReward: 150,
                questions: [
                    {
                        text: "Urmareste pseudocodul: x <- 3 / DACA x > 2 ATUNCI / SCRIE 'Mare' / ALTFEL / SCRIE 'Mic' / SFARSIT_DACA. Ce se afiseaza?",
                        options: [
                            "Mic",
                            "Mare",
                            "Nu se afiseaza nimic",
                            "Mare si Mic"
                        ],
                        correct: 1,
                        explanation: "x = 3, conditia x > 2 este ADEVARATA (3 > 2), deci se executa ramura ATUNCI si se afiseaza 'Mare'. Ramura ALTFEL ('Mic') este ignorata cand conditia e adevarata."
                    },
                    {
                        text: "Traseaza: n <- 0 / PENTRU i DE LA 1 LA 4 / n <- n + 1 / SFARSIT_PENTRU / SCRIE n. Ce valoare are n la final?",
                        options: [
                            "0",
                            "1",
                            "4",
                            "10"
                        ],
                        correct: 2,
                        explanation: "Bucla se executa de 4 ori (i = 1, 2, 3, 4). La fiecare iteratie n creste cu 1: 0->1->2->3->4. La final se afiseaza n = 4. Bucla PENTRU cu contor de la 1 la N executa exact N iteratii."
                    },
                    {
                        text: "Ce se afiseaza dupa: x <- 5 / REPETA / x <- x - 2 / PANA_CAND x <= 1 / SCRIE x?",
                        options: [
                            "5",
                            "3",
                            "1",
                            "-1"
                        ],
                        correct: 2,
                        explanation: "Structura REPETA...PANA_CAND executa intai si testeaza conditia la sfarsit. Iteratia 1: x = 5-2 = 3 (3 <= 1? NU). Iteratia 2: x = 3-2 = 1 (1 <= 1? DA — stop). Se afiseaza x = 1. Obs: testul e la SFARSIT, bucla ruleaza cel putin o data."
                    },
                    {
                        text: "Un elev scrie pseudocodul: 'DACA nota > 9 / SCRIE Excelent / DACA nota > 6 / SCRIE Bine / SCRIE Suficient'. Ce problema are?",
                        options: [
                            "Nu are nicio problema, este corect",
                            "Lipsesc ALTFEL si SFARSIT_DACA — pentru o nota de 10 se vor afisa toate cele trei mesaje",
                            "Conditia trebuie sa fie nota >= 9, nu nota > 9",
                            "Nu poti folosi doua DACA in acelasi pseudocod"
                        ],
                        correct: 1,
                        explanation: "Fara ALTFEL si SFARSIT_DACA, toate cele trei DACA sunt independente si toate se evalueaza. O nota de 10: 10 > 9 (DA) -> 'Excelent', 10 > 6 (DA) -> 'Bine', si 'Suficient' mereu. Structura DACA-ALTFEL-DACA ALTFEL-ALTFEL cu SFARSIT_DACA rezolva problema."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('quiz5_pseudocod_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('quiz5_pseudocod_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
            // HTML-escape to prevent < > from breaking option rendering
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${escHtml(q.text)}</p>`;

            if (q.pseudo && q.pseudoLines) {
                const pseudoHtml = q.pseudoLines.map(line => {
                    const escaped = escHtml(line);
                    const indented = escaped.startsWith('  ') ? '&nbsp;&nbsp;&nbsp;&nbsp;' + escaped.trimStart() : escaped;
                    return `<div>${indented}</div>`;
                }).join('');
                questionContent += `<div class="pseudo-display">${pseudoHtml}</div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            // Check if all quizzes complete
            const allComplete = currentLevel === 5 && passed;

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show ${allComplete ? 'quiz-complete' : ''}">
                    <div class="level-complete-icon">${passed ? (allComplete ? '&#127891;' : '&#127942;') : '&#128218;'}</div>
                    <h2>${allComplete ? 'Quiz Complet!' : (passed ? 'Nivel Completat!' : 'Mai incearca!')}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    ${allComplete ? `
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                            Felicitari! Ai terminat toate quiz-urile despre Pseudocod si Schema Logica!<br>
                            Acum poti reprezenta orice algoritm in pseudocod si schema logica, conform programei OMEN 3393/2017.
                        </p>
                    ` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${allComplete ? `
                            <button class="btn btn-success" onclick="window.location.href='../index.html'">
                                Inapoi la Modul
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

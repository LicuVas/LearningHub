<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Colaborare Online | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 3</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Colaborare Online</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce este colaborarea online?",
                description: "Descopera instrumentele de lucru in echipa",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce inseamna 'colaborare online'?",
                        options: [
                            "Sa lucrezi singur pe calculator",
                            "Sa lucrezi impreuna cu altii folosind internetul",
                            "Sa te joci jocuri online",
                            "Sa te uiti la filme pe internet"
                        ],
                        correct: 1,
                        explanation: "Colaborarea online inseamna sa lucrezi cu alte persoane la distanta, folosind instrumente digitale precum Google Docs, Microsoft Teams, sau platforme de proiecte."
                    },
                    {
                        text: "Care este un exemplu de instrument pentru colaborare online?",
                        options: [
                            "Paint",
                            "Google Docs",
                            "Calculator",
                            "Notepad"
                        ],
                        correct: 1,
                        explanation: "Google Docs permite mai multor persoane sa editeze acelasi document simultan, din locatii diferite. Alte exemple: Microsoft 365, Notion, Canva."
                    },
                    {
                        text: "Care este avantajul principal al colaborarii online?",
                        options: [
                            "Poti lucra cu oricine, de oriunde, oricand",
                            "Nu trebuie sa vorbesti cu nimeni",
                            "Poti copia de la altii",
                            "Nu mai trebuie sa inveti"
                        ],
                        correct: 0,
                        explanation: "Colaborarea online permite echipelor sa lucreze impreuna indiferent de distanta geografica sau fusul orar. Poti lucra la un proiect cu colegi din alta tara!"
                    }
                ]
            },
            2: {
                title: "Nivel 2: Google Docs",
                description: "Invata sa folosesti documente colaborative",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este special la Google Docs comparativ cu Word offline?",
                        options: [
                            "Are mai multe fonturi",
                            "Mai multe persoane pot edita acelasi document in acelasi timp",
                            "Are mai multe culori",
                            "Se deschide mai repede"
                        ],
                        correct: 1,
                        explanation: "Google Docs permite editare colaborativa in timp real - poti vedea ce scriu colegii tai LIVE, cu cursoare colorate diferite pentru fiecare persoana!"
                    },
                    {
                        text: "Cum poti impartasi un document Google Docs cu un coleg?",
                        options: [
                            "Trimiti documentul prin posta",
                            "Folosesti butonul 'Share' si adaugi adresa de email",
                            "Il printezi si i-l dai in mana",
                            "Il salvezi pe un stick USB"
                        ],
                        correct: 1,
                        explanation: "Butonul 'Share' (Partajeaza) iti permite sa trimiti un link sau sa adaugi persoane direct cu adresa lor de email. Poti alege daca pot doar vizualiza sau si edita."
                    },
                    {
                        text: "Ce niveluri de acces poti acorda cand partajezi un document?",
                        options: [
                            "Doar 'poate vedea'",
                            "Vizualizare, Comentare, sau Editare",
                            "Doar 'poate edita'",
                            "Nu exista niveluri de acces"
                        ],
                        correct: 1,
                        explanation: "Poti acorda: Viewer (doar vizualizare), Commenter (poate comenta dar nu edita), Editor (poate modifica documentul). Alege nivelul potrivit pentru fiecare persoana!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Reguli de colaborare",
                description: "Bune practici pentru lucrul in echipa",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce trebuie sa faci inainte de a edita o sectiune la care lucreaza altcineva?",
                        options: [
                            "Editezi direct peste ce a scris",
                            "Comunici cu persoana si te coordonezi",
                            "Stergi tot ce a facut si incepi de la zero",
                            "Ignori sectiunea lor"
                        ],
                        correct: 1,
                        explanation: "Comunicarea este cheia! Inainte de a edita munca altcuiva, discuta cu persoana respectiva. Poti folosi comentarii sau chat-ul integrat pentru coordonare."
                    },
                    {
                        text: "Ce faci cand vezi ca un coleg a facut o greseala in documentul comun?",
                        options: [
                            "O stergi fara sa spui nimic",
                            "Ii spui politicos, poate prin comentariu, si oferi ajutor",
                            "Razi de el in fata celorlalti",
                            "Ignori greseala"
                        ],
                        correct: 1,
                        explanation: "Foloseste comentarii pentru a sugera modificari politicos: 'Cred ca aici ar trebui...' sau 'Ai vrea sa verificam aceasta informatie?'. Critica constructiv, nu jignitor!"
                    },
                    {
                        text: "Care este regula de baza pentru colaborarea eficienta?",
                        options: [
                            "Fiecare lucreaza cand vrea, fara plan",
                            "Stabiliti roluri clare si termene limita",
                            "O singura persoana face tot",
                            "Nu vorbiti deloc intre voi"
                        ],
                        correct: 1,
                        explanation: "Colaborarea eficienta necesita: roluri clare (cine ce face), termene limita, comunicare regulata, si respectarea muncii celorlalti."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Partajare si permisiuni",
                description: "Gestioneaza accesul la documentele tale",
                xpReward: 125,
                questions: [
                    {
                        text: "De ce este important sa nu partajezi un document cu setarea 'Oricine de pe internet'?",
                        options: [
                            "Se incarca mai greu",
                            "Orice persoana, inclusiv necunoscuti, poate accesa documentul",
                            "Documentul devine mai mare",
                            "Se schimba culoarea"
                        ],
                        correct: 1,
                        explanation: "Setarea 'Oricine de pe internet' face documentul PUBLIC. Orice persoana care gaseste link-ul il poate accesa. Foloseste partajarea cu persoane specifice pentru documente private!"
                    },
                    {
                        text: "Ce este 'Istoricul versiunilor' (Version History) si de ce e util?",
                        options: [
                            "O lista de filme despre document",
                            "Permite sa vezi si sa restaurezi versiuni anterioare ale documentului",
                            "Arata cine a citit documentul",
                            "Schimba fontul documentului"
                        ],
                        correct: 1,
                        explanation: "Istoricul versiunilor salveaza automat toate modificarile. Daca cineva sterge accidental ceva sau vrei sa revii la o versiune mai veche, poti restaura!"
                    },
                    {
                        text: "Ce ar trebui sa faci cand un proiect colaborativ se termina?",
                        options: [
                            "Lasi totul asa cum este",
                            "Verifici permisiunile si stergi accesul persoanelor care nu mai au nevoie",
                            "Stergi tot documentul",
                            "Faci documentul public"
                        ],
                        correct: 1,
                        explanation: "Dupa finalizarea unui proiect, revizuieste permisiunile: elimina accesul persoanelor care nu mai au nevoie si pastreaza documentul in siguranta pentru referinte viitoare."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Colaborare avansata si siguranta",
                description: "Tehnici avansate si securitate",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce sunt 'comentariile' intr-un document colaborativ si cum le folosesti?",
                        options: [
                            "Sunt mesaje care sterg textul",
                            "Permit sa lasi note si sugestii fara a modifica textul original",
                            "Sunt decoratiuni pentru document",
                            "Sunt erori de sistem"
                        ],
                        correct: 1,
                        explanation: "Comentariile sunt note atasate textului. Selectezi textul, adaugi comentariu cu sugestii sau intrebari. Colegii pot raspunde sau rezolva comentariul cand problema e rezolvata."
                    },
                    {
                        text: "Ce faci daca primesti un link de document colaborativ de la o sursa necunoscuta?",
                        options: [
                            "Deschizi imediat sa vezi ce contine",
                            "Verifici sursa si fii precaut inainte de a deschide",
                            "Distribui link-ul prietenilor",
                            "Adaugi informatii personale in document"
                        ],
                        correct: 1,
                        explanation: "Link-urile nesolicitate pot fi tentative de phishing sau pot contine continut nesigur. Verifica intotdeauna cine ti-a trimis si de ce inainte de a accesa documente necunoscute."
                    },
                    {
                        text: "Care este beneficiul principal al colaborarii online pentru proiectele scolare?",
                        options: [
                            "Poti copia mai usor de la colegi",
                            "Permite lucrul in echipa eficient, chiar daca nu sunteti in acelasi loc",
                            "Nu mai trebuie sa inveti nimic",
                            "Profesorul nu poate vedea cine a contribuit"
                        ],
                        correct: 1,
                        explanation: "Colaborarea online faciliteaza proiectele de echipa: puteti lucra de acasa, vedeti contributia fiecaruia, comunicati usor, si istoricul arata cine a facut ce!"
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_colaborare_quiz_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_colaborare_quiz_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            let completionBanner = '';
            if (passed && currentLevel === 5) {
                completionBanner = `
                    <div class="module-complete-banner">
                        <h3>Felicitari! Ai completat toate quiz-urile din Modulul 3!</h3>
                        <p>Acum esti un expert in Comunicare Digitala!</p>
                    </div>
                `;
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    ${completionBanner}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='../index.html'">
                                Inapoi la Modulul 3
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

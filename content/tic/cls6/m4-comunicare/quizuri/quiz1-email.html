<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Comunicare prin Email | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Email UI mockup */
        .email-ui-mockup {
            background: #2d2d4a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 500px;
            text-align: left;
            border: 2px solid var(--border);
        }

.email-toolbar {
            background: #1e1e3a;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

.email-btn {
            padding: 0.3rem 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

.email-btn.highlight {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
        }

.email-field {
            background: #1e1e3a;
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

.email-field label {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

.email-body {
            background: #fff;
            color: #000;
            padding: 1rem;
            border-radius: 4px;
            min-height: 80px;
            font-family: 'Arial', sans-serif;
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 3</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Comunicare prin Email</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        // NOTE: correct answers are deliberately spread across all four positions (0-3)
        // to prevent pattern-guessing. Each question's correct index is set independently.
        const levels = {
            1: {
                title: "Nivel 1: Ce este email-ul?",
                description: "Invata bazele comunicarii prin email",
                xpReward: 50,
                questions: [
                    {
                        // correct at index 1
                        text: "Ce este email-ul (posta electronica)?",
                        options: [
                            "Un serviciu de livrare pachete",
                            "O metoda de a trimite mesaje prin internet",
                            "Un tip de retea sociala",
                            "Un program de editat poze"
                        ],
                        correct: 1,
                        explanation: "Email-ul (electronic mail) este o metoda de a trimite si primi mesaje electronice prin internet. Este ca o scrisoare, dar digitala si instantanee!"
                    },
                    {
                        // correct at index 0
                        text: "Care este avantajul principal al email-ului fata de o scrisoare postala?",
                        options: [
                            "Ajunge instantaneu, oriunde in lume",
                            "Este mai colorat",
                            "Este mai greu de trimis",
                            "Trebuie sa platesti timbru"
                        ],
                        correct: 0,
                        explanation: "Email-ul ajunge in cateva secunde, indiferent de distanta. O scrisoare postala poate dura zile sau saptamani!"
                    },
                    {
                        // correct at index 3
                        text: "Ce iti trebuie pentru a trimite un email?",
                        options: [
                            "Doar un telefon fara internet",
                            "Doar o imprimanta",
                            "Un calculator fara acces la internet",
                            "O adresa de email si acces la internet"
                        ],
                        correct: 3,
                        explanation: "Pentru email ai nevoie de o adresa de email (contul tau) si acces la internet. Poti folosi calculator, telefon sau tableta."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Adresa de email",
                description: "Invata sa intelegi structura unei adrese de email",
                xpReward: 75,
                questions: [
                    {
                        // correct at index 2
                        text: "Care este structura corecta a unei adrese de email?",
                        options: [
                            "nume.prenume.gmail.com",
                            "www.email.com/nume",
                            "nume@domeniu.extensie (ex: ion@gmail.com)",
                            "email://nume.prenume"
                        ],
                        correct: 2,
                        explanation: "O adresa de email are formatul: nume@domeniu.extensie. Simbolul @ (at/arond) separa numele utilizatorului de domeniu (serviciul de email)."
                    },
                    {
                        // correct at index 0
                        text: "Ce semnificatie are simbolul @ in adresa de email?",
                        options: [
                            "Separa numele utilizatorului de domeniu",
                            "Inseamna 'si'",
                            "Este doar decorativ",
                            "Inseamna 'important'"
                        ],
                        correct: 0,
                        explanation: "Simbolul @ (citit 'at' sau 'arond') separa numele tau de utilizator de domeniul serviciului (gmail.com, yahoo.com etc.)."
                    },
                    {
                        // correct at index 2 (kept from original, factual)
                        text: "Care dintre urmatoarele este o adresa de email corecta?",
                        options: [
                            "maria.ionescu",
                            "maria ionescu@gmail.com",
                            "maria.ionescu@gmail.com",
                            "maria@ionescu@gmail.com"
                        ],
                        correct: 2,
                        explanation: "maria.ionescu@gmail.com este corecta. Nu pot fi spatii in adresa de email si poate exista un singur @."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Compunerea unui email",
                description: "Invata sa scrii un email corect",
                xpReward: 100,
                questions: [
                    {
                        // correct at index 3
                        text: "Ce trebuie sa completezi in campul 'To' (Catre)?",
                        options: [
                            "Subiectul mesajului",
                            "Textul mesajului",
                            "Numele tau",
                            "Adresa de email a destinatarului"
                        ],
                        correct: 3,
                        explanation: "In campul 'To' (Catre) scrii adresa de email a persoanei careia ii trimiti mesajul."
                    },
                    {
                        // correct at index 1
                        text: "La ce foloseste campul 'Subject' (Subiect)?",
                        options: [
                            "Pentru a scrie mesajul principal",
                            "Pentru a descrie pe scurt despre ce este email-ul",
                            "Pentru a adauga fisiere",
                            "Pentru a pune parola"
                        ],
                        correct: 1,
                        explanation: "Subiectul este un titlu scurt care spune despre ce este email-ul. Ajuta destinatarul sa inteleaga rapid continutul inainte de a-l deschide."
                    },
                    {
                        // correct at index 0
                        text: "Ce este un email profesional bine scris?",
                        options: [
                            "Un email cu salut, mesaj clar si semnatura",
                            "Un email cu multe emoticoane si prescurtari",
                            "Un email scris doar cu majuscule",
                            "Un email fara subiect"
                        ],
                        correct: 0,
                        explanation: "Un email profesional contine: salut (Buna ziua), mesaj clar si la obiect, si semnatura (numele tau). Evita prescurtarile si scrisul cu majuscule (pare ca strigi)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: CC si BCC",
                description: "Invata despre copii si copii ascunse",
                xpReward: 125,
                questions: [
                    {
                        // correct at index 2
                        text: "Ce inseamna CC (Carbon Copy)?",
                        options: [
                            "Cancel Copy - anuleaza email-ul",
                            "Creezi un calendar cu evenimente",
                            "Trimiti o copie a email-ului altor persoane, vizibil pentru toti",
                            "Comprimi continutul email-ului"
                        ],
                        correct: 2,
                        explanation: "CC (Carbon Copy) iti permite sa trimiti o copie a email-ului si altor persoane. Toti destinatarii vad cine a primit email-ul."
                    },
                    {
                        // correct at index 3
                        text: "Care este diferenta intre CC si BCC?",
                        options: [
                            "Nu exista nicio diferenta",
                            "BCC este folosit pentru fisiere mari",
                            "CC este mai rapid decat BCC",
                            "La BCC, destinatarii nu vad ceilalti destinatari din BCC"
                        ],
                        correct: 3,
                        explanation: "BCC (Blind Carbon Copy) = Copie Ascunsa. Persoanele din BCC primesc email-ul, dar ceilalti destinatari NU vad ca acestia l-au primit."
                    },
                    {
                        // correct at index 1
                        text: "Cand este util sa folosesti BCC?",
                        options: [
                            "Cand trimiti un email personal unui prieten",
                            "Cand trimiti un email catre multi oameni si vrei sa protejezi adresele lor",
                            "Cand nu ai subiect",
                            "Cand vrei sa stergi email-ul"
                        ],
                        correct: 1,
                        explanation: "BCC este util pentru newsletter-uri sau mesaje catre grupuri mari - protejezi confidentialitatea adreselor de email ale destinatarilor."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Atasamente",
                description: "Invata sa trimiti fisiere prin email",
                xpReward: 150,
                questions: [
                    {
                        // correct at index 0
                        text: "Ce este un atasament (attachment)?",
                        options: [
                            "Un fisier trimis impreuna cu email-ul",
                            "Un virus de calculator",
                            "O semnatura electronica",
                            "Un link catre o pagina web"
                        ],
                        correct: 0,
                        explanation: "Un atasament este un fisier (document, poza, arhiva etc.) pe care il trimiti impreuna cu mesajul de email."
                    },
                    {
                        // correct at index 3
                        text: "Care este pictograma uzuala pentru adaugarea unui atasament?",
                        options: [
                            "O stea",
                            "Un creion",
                            "O inima",
                            "O agrafa de hartie (clips)"
                        ],
                        correct: 3,
                        explanation: "Agrafa de hartie (clips-ul) este simbolul universal pentru atasamente in majoritatea serviciilor de email, pentru ca 'atasezi' fisierul de email."
                    },
                    {
                        // correct at index 2
                        text: "Ce trebuie sa verifici inainte de a deschide un atasament?",
                        options: [
                            "Daca email-ul are subiect",
                            "Daca email-ul este lung",
                            "Daca stii expeditorul si daca fisierul pare sigur",
                            "Daca ai trimis tu email-ul"
                        ],
                        correct: 2,
                        explanation: "Atentie la atasamente! Deschide doar fisiere de la persoane cunoscute. Atasamentele suspecte pot contine virusi. Daca nu asteptai un fisier, intreaba expeditorul inainte."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('cls6_email_quiz_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_email_quiz_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-mesagerie.html'">
                                Quiz-ul 2: Netiquette si Comunicare Online
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

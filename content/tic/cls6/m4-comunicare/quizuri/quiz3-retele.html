<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3: Stocare in Cloud | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 3: Stocare in Cloud</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce este cloud-ul?",
                description: "Descopera cum functioneaza stocarea in cloud",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce inseamna 'stocare in cloud'?",
                        options: [
                            "Salvarea fisierelor pe un stick USB",
                            "Salvarea fisierelor pe servere conectate la internet, accesibile de pe orice dispozitiv",
                            "Salvarea fisierelor direct pe hard disk-ul calculatorului",
                            "Tipărirea documentelor si pastrarea lor fizica"
                        ],
                        correct: 1,
                        explanation: "Cloud = 'nor' in engleza. Stocarea in cloud inseamna ca fisierele tale sunt salvate pe servere din internet (nu pe calculatorul tau), si le poti accesa de pe orice dispozitiv (laptop, telefon, tableta) cu o conexiune la internet."
                    },
                    {
                        text: "Care dintre urmatoarele este un serviciu de stocare in cloud?",
                        options: [
                            "Recycle Bin (Cosul de reciclare)",
                            "Google Drive",
                            "Windows Explorer",
                            "Notepad"
                        ],
                        correct: 1,
                        explanation: "Google Drive este un serviciu de stocare in cloud oferit de Google. Alte exemple populare: OneDrive (Microsoft), Dropbox, iCloud (Apple). Acestea iti permit sa stochezi si sa accesezi fisierele online."
                    },
                    {
                        text: "Care este un avantaj al stocarii in cloud fata de salvarea pe calculator?",
                        options: [
                            "Fisierele sunt mai greu de accesat",
                            "Poti accesa fisierele de pe orice dispozitiv cu internet, oricand",
                            "Nu ai nevoie de internet niciodata",
                            "Fisierele ocupa mai mult spatiu pe calculator"
                        ],
                        correct: 1,
                        explanation: "Principalul avantaj al cloud-ului: accesibilitate. Daca ai fisierul in Google Drive, il poti deschide de acasa, de la scoala, de pe telefon — oriunde ai internet. Daca il ai doar pe calculatorul de acasa, nu il poti accesa de la scoala."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Google Drive — spatiu si organizare",
                description: "Invata cum se organizeaza fisierele in cloud",
                xpReward: 75,
                questions: [
                    {
                        text: "Cat spatiu gratuit ofera Google Drive unui utilizator nou?",
                        options: [
                            "1 GB",
                            "5 GB",
                            "15 GB",
                            "100 GB"
                        ],
                        correct: 2,
                        explanation: "Google ofera 15 GB spatiu gratuit in Google Drive (spatiul este impartit intre Drive, Gmail si Google Photos). 15 GB este suficient pentru mii de documente, prezentari si imagini."
                    },
                    {
                        text: "Cum poti organiza fisierele in Google Drive?",
                        options: [
                            "Nu poti organiza fisierele, ele stau toate la un loc",
                            "Poti crea dosare (foldere), le poti numi si muta fisierele in ele",
                            "Trebuie sa platesti pentru a crea dosare",
                            "Fisierele se organizeaza automat dupa culoare"
                        ],
                        correct: 1,
                        explanation: "In Google Drive poti crea dosare (click dreapta → New folder / Dosar nou), le poti denumi si muta fisiere in ele, exact ca pe calculatorul tau — dar totul e salvat in cloud. Poti avea dosare in interiorul altor dosare."
                    },
                    {
                        text: "Ce se intampla cu fisierele din Google Drive daca calculatorul tau se strica?",
                        options: [
                            "Fisierele se pierd impreuna cu calculatorul",
                            "Fisierele raman salvate in cloud si le poti accesa de pe alt dispozitiv",
                            "Fisierele se sterg automat dupa 24 de ore",
                            "Fisierele se transfera automat pe un stick USB"
                        ],
                        correct: 1,
                        explanation: "Acesta este unul dintre cele mai importante avantaje ale cloud-ului! Daca calculatorul se strica, iti cade in apa sau este furat, fisierele din Google Drive sunt in siguranta pe serverele Google. Le poti accesa imediat de pe alt dispozitiv."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Partajare si colaborare in cloud",
                description: "Invata cum imparti fisierele cu altii",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce inseamna sa 'partajezi' un fisier din Google Drive cu un coleg?",
                        options: [
                            "Sa trimiti fisierul prin posta",
                            "Sa ii oferi acces la fisier direct din cloud, fara sa ii trimiti o copie",
                            "Sa stergi fisierul de pe calculatorul tau",
                            "Sa descarci fisierul si sa i-l trimiti pe email"
                        ],
                        correct: 1,
                        explanation: "Partajarea in cloud = oferi acces direct la fisier fara a trimite o copie. Colegul tau deschide acelasi fisier din cloud. Daca faci modificari, el le vede imediat. Nu exista problema 'versiunilor multiple' cum se intampla cand trimiti fisierul pe email."
                    },
                    {
                        text: "Care sunt nivelurile de acces cand partajezi un document Google Docs?",
                        options: [
                            "Admin si User",
                            "Viewer (vizualizator), Commenter (comentator) si Editor",
                            "Public si Privat",
                            "Cititor si Scriitor"
                        ],
                        correct: 1,
                        explanation: "Google Drive ofera 3 niveluri de acces: Viewer (poate doar citi), Commenter (poate citi si lasa comentarii, dar nu modifica textul), Editor (poate modifica documentul direct). Alegi nivelul potrivit in functie de ce vrei sa poata face persoana cu documentul."
                    },
                    {
                        text: "Un coleg ti-a partajat un document Google Docs cu acces 'Viewer'. Ce poti face?",
                        options: [
                            "Poti modifica textul documentului",
                            "Poti sterge documentul",
                            "Poti doar citi documentul, fara sa il modifici",
                            "Poti partaja documentul cu oricine doresti"
                        ],
                        correct: 2,
                        explanation: "Accesul Viewer (vizualizator) iti permite doar sa citesti documentul. Nu poti modifica textul, nu poti sterge si nu poti partaja cu altii. Daca ai nevoie sa editezi, trebuie sa ceri colegului sa iti ofere acces Editor."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Tipuri de fisiere si sincronizare",
                description: "Descopera ce tipuri de fisiere poti stoca in cloud",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce tipuri de fisiere poti stoca in Google Drive?",
                        options: [
                            "Doar documente text (.doc, .txt)",
                            "Doar fotografii si videoclipuri",
                            "Orice tip de fisier: documente, imagini, videoclipuri, PDF-uri, prezentari, cod etc.",
                            "Doar fisierele create cu aplicatiile Google"
                        ],
                        correct: 2,
                        explanation: "Google Drive accepta orice tip de fisier! Poti incarca: documente Word, Excel, PDF-uri, fotografii JPEG/PNG, videoclipuri MP4, arhive ZIP, fisiere de cod — practic orice. Fisierele create cu Google (Docs, Sheets, Slides) nu ocupa spatiu din cei 15 GB."
                    },
                    {
                        text: "Ce inseamna 'sincronizare' in contextul stocarii in cloud?",
                        options: [
                            "Modificarea culorii unui fisier",
                            "Actualizarea automata a fisierelor pe toate dispozitivele tale cand faci o modificare",
                            "Stergerea fisierelor vechi",
                            "Comprimarea fisierelor pentru a ocupa mai putin spatiu"
                        ],
                        correct: 1,
                        explanation: "Sincronizarea = daca modifici un fisier pe laptop, modificarea apare automat si pe telefon si pe tableta (si invers). Nu trebuie sa copiezi manual fisierul de pe un dispozitiv pe altul. Aplicatia Google Drive (instalata pe dispozitiv) face sincronizarea automat."
                    },
                    {
                        text: "Care este diferenta intre Google Docs si Microsoft Word?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Google Docs functioneaza in browser si salveaza automat in cloud; Word se instaleaza pe calculator si salveaza local (implicit)",
                            "Word este gratuit, Google Docs este platit",
                            "Google Docs poate crea doar imagini, nu documente text"
                        ],
                        correct: 1,
                        explanation: "Google Docs = aplicatie web (functioneaza in browser, nu se instaleaza), salveaza automat in Google Drive (cloud), colaborare in timp real, gratuit. Microsoft Word = aplicatie instalata, salveaza pe calculator (implicit), necesita licenta (sau abonament Microsoft 365). Ambele pot deschide formatul .docx."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Siguranta si bune practici in cloud",
                description: "Protejeaza-ti datele stocate in cloud",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce ar trebui sa faci pentru a-ti proteja contul Google Drive?",
                        options: [
                            "Sa folosesti parola: '123456' pentru ca e usor de retinut",
                            "Sa folosesti o parola puternica si sa activezi verificarea in doi pasi (2-Step Verification)",
                            "Sa imparti parola cu toti prietenii pentru a putea colabora mai usor",
                            "Sa nu pui parola la cont ca sa il accesezi mai repede"
                        ],
                        correct: 1,
                        explanation: "Pentru siguranta contului Google Drive: 1) Parola puternica (minim 8 caractere, litere mari+mici+cifre+simboluri), 2) Verificare in doi pasi (2FA) — chiar daca cineva afla parola, nu poate intra fara codul trimis pe telefon, 3) Nu imparti parola cu nimeni (nici cu prietenii)."
                    },
                    {
                        text: "Ai partajat accidental un document important cu link public ('oricine cu link-ul poate accesa'). Ce faci?",
                        options: [
                            "Nu faci nimic, nu e o problema",
                            "Stergi documentul complet",
                            "Mergi la setarile de partajare ale documentului si schimbi accesul din 'Oricine cu link-ul' in 'Persoane specifice' sau 'Privat'",
                            "Creezi un document nou cu acelasi continut"
                        ],
                        correct: 2,
                        explanation: "In Google Drive, la orice document poti schimba permisiunile oricand: click pe butonul Share (Partajare) → modifica setarile → salveaza. Schimba din 'Oricine cu link-ul' in 'Persoane specifice' (si adauga doar persoanele de incredere) sau in 'Privat' (doar tu). Documentul nu trebuie sters."
                    },
                    {
                        text: "Ce se intampla cu fisierele sterse din Google Drive?",
                        options: [
                            "Sunt sterse definitiv imediat si nu pot fi recuperate",
                            "Merg in Trash (Cos de gunoi) si pot fi recuperate timp de 30 de zile",
                            "Se trimit automat pe email",
                            "Raman in Drive, dar devin invizibile"
                        ],
                        correct: 1,
                        explanation: "Cand stergi un fisier din Google Drive, el nu dispare imediat — merge in Trash (Cos de gunoi). Ai 30 de zile sa il recuperezi: click pe Trash in meniu stanga → gasesti fisierul → click dreapta → Restore (Restaureaza). Dupa 30 de zile, fisierele din Trash se sterg definitiv."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_cloud_quiz_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_cloud_quiz_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-eticheta.html'">
                                Quiz-ul 4: Eticheta Digitala
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Aplicatii de Mesagerie | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
    </head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 3</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Aplicatii de Mesagerie</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>

    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        const levels = {
            1: {
                title: "Nivel 1: Ce sunt aplicatiile de mesagerie?",
                description: "Descopera lumea mesageriei instantanee",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este o aplicatie de mesagerie instantanee?",
                        options: [
                            "Un program pentru editat fotografii",
                            "O aplicatie care permite trimiterea mesajelor in timp real",
                            "Un joc video multiplayer",
                            "Un program pentru desenat"
                        ],
                        correct: 1,
                        explanation: "Aplicatiile de mesagerie instantanee (WhatsApp, Messenger, etc.) permit trimiterea si primirea mesajelor in timp real, aproape instantaneu."
                    },
                    {
                        text: "Care dintre urmatoarele este o aplicatie de mesagerie?",
                        options: [
                            "Microsoft Word",
                            "WhatsApp",
                            "Calculator",
                            "Paint"
                        ],
                        correct: 1,
                        explanation: "WhatsApp este una dintre cele mai populare aplicatii de mesagerie din lume. Alte exemple: Messenger, Telegram, Viber, Signal."
                    },
                    {
                        text: "Ce poti trimite prin aplicatiile de mesagerie moderne?",
                        options: [
                            "Doar texte simple",
                            "Texte, poze, videoclipuri, mesaje vocale si documente",
                            "Doar poze",
                            "Doar mesaje vocale"
                        ],
                        correct: 1,
                        explanation: "Aplicatiile moderne de mesagerie permit trimiterea de texte, poze, videoclipuri, mesaje vocale, documente, locatii si chiar apeluri video!"
                    }
                ]
            },
            2: {
                title: "Nivel 2: Utilizare responsabila",
                description: "Invata sa folosesti mesageria in mod responsabil",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce inseamna bifele albastre pe WhatsApp?",
                        options: [
                            "Mesajul nu a fost trimis",
                            "Mesajul a fost citit de destinatar",
                            "Mesajul a fost sters",
                            "Mesajul contine un virus"
                        ],
                        correct: 1,
                        explanation: "Pe WhatsApp: o bifa gri = trimis, doua bife gri = livrat, doua bife albastre = citit de destinatar."
                    },
                    {
                        text: "Ce ar trebui sa faci daca primesti un mesaj de la un necunoscut?",
                        options: [
                            "Sa raspunzi imediat cu datele tale personale",
                            "Sa fii precaut si sa nu dai informatii personale",
                            "Sa trimiti poze cu tine",
                            "Sa-i dai numarul de telefon al prietenilor"
                        ],
                        correct: 1,
                        explanation: "Nu raspunde la mesaje de la necunoscuti cu informatii personale! Daca cineva necunoscut te contacteaza, spune unui adult de incredere."
                    },
                    {
                        text: "La ce ora este nepotrivit sa trimiti mesaje?",
                        options: [
                            "La pranz",
                            "Noaptea tarziu sau dimineata foarte devreme",
                            "Dupa-amiaza",
                            "In weekend"
                        ],
                        correct: 1,
                        explanation: "Evita sa trimiti mesaje noaptea tarziu sau dimineata foarte devreme - poti deranja oamenii. Respecta orele de odihna ale celorlalti!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Grupuri de mesagerie",
                description: "Regulile comunicarii in grupuri",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este un grup de mesagerie?",
                        options: [
                            "O conversatie privata intre doi oameni",
                            "O conversatie cu mai multe persoane simultan",
                            "Un tip de joc video",
                            "O lista de contacte"
                        ],
                        correct: 1,
                        explanation: "Un grup de mesagerie permite mai multor persoane sa comunice intr-o singura conversatie. Toti membrii vad mesajele trimise in grup."
                    },
                    {
                        text: "Ce regula importanta trebuie respectata in grupuri?",
                        options: [
                            "Sa trimiti cat mai multe mesaje pe zi",
                            "Sa respecti subiectul grupului si sa nu faci spam",
                            "Sa trimiti doar poze amuzante",
                            "Sa raspunzi la fiecare mesaj cu emoticoane"
                        ],
                        correct: 1,
                        explanation: "In grupuri: respecta subiectul, nu trimite mesaje irelevante (spam), nu trimite foarte multe mesaje intr-un timp scurt, si gandeste-te ca toti vad ce scrii."
                    },
                    {
                        text: "Ce faci daca cineva te deranjeaza intr-un grup?",
                        options: [
                            "Il insulti inapoi",
                            "Raportezi comportamentul si vorbesti cu un adult",
                            "Parasesti toate grupurile",
                            "Trimiti mai multe mesaje decat el"
                        ],
                        correct: 1,
                        explanation: "Daca cineva te deranjeaza, nu raspunde cu acelasi comportament. Poti raporta persoana, poti parasi grupul, sau poti vorbi cu un adult de incredere."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Siguranta in mesagerie",
                description: "Protejeaza-te in mediul online",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce informatii NU trebuie sa trimiti niciodata prin mesagerie?",
                        options: [
                            "Salutul si numele tau de familie",
                            "Parole, adresa completa si poze personale necunoscutilor",
                            "Temele de la scoala",
                            "Orarul tau de cursuri"
                        ],
                        correct: 1,
                        explanation: "NU trimite niciodata: parole, adresa ta completa, poze personale necunoscutilor, numarul cardului parintilor sau informatii despre cand nu esti acasa."
                    },
                    {
                        text: "Ce este phishing-ul in mesagerie?",
                        options: [
                            "Un joc de pescuit virtual",
                            "Mesaje false care incearca sa-ti fure datele personale",
                            "O functie de cautare",
                            "Un tip de emoticon"
                        ],
                        correct: 1,
                        explanation: "Phishing = mesaje false care par de la persoane/companii de incredere, dar vor sa-ti fure datele. Nu da click pe link-uri suspecte si nu trimite informatii personale!"
                    },
                    {
                        text: "Ce faci daca primesti un link suspect de la un prieten?",
                        options: [
                            "Dai click imediat ca e de la un prieten",
                            "Intrebi prietenul (prin alt canal) daca el l-a trimis",
                            "Il trimiti altor prieteni",
                            "Ignori complet"
                        ],
                        correct: 1,
                        explanation: "Conturile pot fi sparte! Daca un prieten trimite un link ciudat, intreaba-l direct (telefon, fata in fata) daca el l-a trimis. Contul sau poate fi compromis."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Bune practici",
                description: "Devino un utilizator responsabil de mesagerie",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este lungimea ideala a unui mesaj intr-o conversatie normala?",
                        options: [
                            "Cat mai lung posibil, cu toate detaliile",
                            "Scurt si la obiect, usor de citit",
                            "Un singur cuvant mereu",
                            "Doar emoticoane"
                        ],
                        correct: 1,
                        explanation: "Mesajele scurte si clare sunt mai usor de citit si de inteles. Daca ai multe de spus, imparte in paragrafe sau considera un apel telefonic."
                    },
                    {
                        text: "De ce este important sa verifici mesajul inainte de a-l trimite?",
                        options: [
                            "Nu este important",
                            "Pentru a evita greseli, confuzii sau trimiterea catre persoana gresita",
                            "Pentru ca mesajul sa fie mai lung",
                            "Pentru a adauga mai multe emoticoane"
                        ],
                        correct: 1,
                        explanation: "Verifica mereu: 1) Cui trimiti (destinatar corect), 2) Ce scrii (fara greseli), 3) Ce atasezi (fisierul potrivit). Mesajele trimise gresit pot crea situatii neplacute!"
                    },
                    {
                        text: "Ce ar trebui sa faci daca vezi ca cineva este victima cyberbullying-ului?",
                        options: [
                            "Sa ignori complet situatia",
                            "Sa te alaturi agresorilor",
                            "Sa raportezi si sa oferi sprijin victimei",
                            "Sa distribui mesajele mai departe"
                        ],
                        correct: 2,
                        explanation: "Daca vezi cyberbullying: NU participa, ofera sprijin victimei, raporteaza comportamentul, si spune unui adult de incredere. A fi martor pasiv nu ajuta pe nimeni."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_mesagerie_quiz_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_mesagerie_quiz_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-retele.html'">
                                Quiz-ul 3: Retele Sociale
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

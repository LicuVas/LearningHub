<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Netiquette si Comunicare Online | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul Comunicare</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Netiquette si Comunicare Online</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce este netiquette-ul?",
                description: "Regulile de bune maniere in comunicarea online",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce inseamna cuvantul \"netiquette\"?",
                        options: [
                            "Un program de navigare pe internet",
                            "Regulile de bune maniere in comunicarea online",
                            "O retea sociala noua",
                            "Viteza de conectare la internet"
                        ],
                        correct: 1,
                        explanation: "Netiquette = net (internet) + etiquette (bune maniere). Sunt regulile de comportament politicos in comunicarea online: email, chat, forumuri, retele sociale."
                    },
                    {
                        text: "Ce inseamna cand cineva scrie cu CAPS LOCK (LITERE MARI TOTALE) intr-un mesaj?",
                        options: [
                            "Ca scrie foarte formal",
                            "Ca este fericit",
                            "Ca tipa/striga la tine — este nepoliticos",
                            "Ca pune o intrebare importanta"
                        ],
                        correct: 2,
                        explanation: "A scrie cu CAPS LOCK inseamna ca TIPI/STRIGI la cealalta persoana. Este considerat foarte nepoliticos si agresiv! Foloseste litere mari doar la inceputul propozitiilor si la nume proprii."
                    },
                    {
                        text: "Care este regula de aur a netiquette-ului?",
                        options: [
                            "Sa scrii cat mai repede posibil",
                            "Sa folosesti mereu emoticoane",
                            "Sa comunici online exact cum ai face fata in fata cu persoana",
                            "Sa poti spune orice pentru ca nu te vede nimeni"
                        ],
                        correct: 2,
                        explanation: "Regula de aur: Comunica online exact cum ai face fata in fata! Daca nu ai spune ceva in ochii cuiva, nu o spune nici pe internet."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Formule de adresare",
                description: "Cum te adresezi corect in functie de destinatar",
                xpReward: 75,
                questions: [
                    {
                        text: "Care este formula corecta de adresare intr-un email catre profesorul tau?",
                        options: [
                            "\"Buna!\"",
                            "\"Stimate Domnule Profesor,\"",
                            "\"Hei profu!\"",
                            "\"da-mi nota repede\""
                        ],
                        correct: 1,
                        explanation: "Catre profesor se foloseste: \"Stimate Domnule Profesor,\" sau \"Stimata Doamna Profesoara,\" — formula formala, cu virgula dupa. \"Buna\" sau \"Hei\" sunt prea informale pentru un adult cu autoritate."
                    },
                    {
                        text: "Cu ce formula inchei corect un email formal catre o institutie?",
                        options: [
                            "\"Pa!\"",
                            "\"Ne auzim!\"",
                            "\"Cu respect, [Numele tau complet]\"",
                            "Fara formula — opresti mesajul brusc"
                        ],
                        correct: 2,
                        explanation: "Emailurile formale se incheie cu \"Cu respect,\" sau \"Cu stima,\" urmate de numele tau complet. Lipsa formulei de incheiere este considerata nepoliticoasa in comunicarea formala."
                    },
                    {
                        text: "Ce formula de salut este potrivita intr-un mesaj catre un adult necunoscut?",
                        options: [
                            "\"Salut!\"",
                            "\"Buna ziua,\"",
                            "\"Hei!\"",
                            "Nicio formula — incepi direct cu intrebarea"
                        ],
                        correct: 1,
                        explanation: "Catre adulti necunoscuti se foloseste \"Buna ziua,\" sau \"Stimate domn / Stimata doamna,\" — formule respectuoase si neutre. \"Salut\" si \"Hei\" sunt rezervate pentru prieteni si colegi."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Reguli de scriere online",
                description: "Cum sa scrii mesaje clare si politicoase",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce trebuie sa faci INAINTE de a trimite un mesaj important?",
                        options: [
                            "Sa il trimit cat mai repede",
                            "Sa recitesc mesajul si sa verific ortografia, tonul si continutul",
                            "Sa adaug cat mai multe emoji-uri",
                            "Sa il trimit la mai multi oameni sa il verifice"
                        ],
                        correct: 1,
                        explanation: "Inainte sa trimiti: (1) Reciteste mesajul, (2) Verifica ortografia si punctuatia, (3) Asigura-te ca tonul este potrivit pentru destinatar, (4) Intreaba-te: E adevarat? E necesar? E politicos?"
                    },
                    {
                        text: "Cat de multe emoticoane (emoji-uri) sunt potrivite intr-un mesaj catre profesor?",
                        options: [
                            "Cat mai multe, ca sa fie prietenos",
                            "In fiecare propozitie",
                            "Maxim 1-2, discreti, de preferat la sfarsit",
                            "Deloc, niciodata"
                        ],
                        correct: 2,
                        explanation: "In mesaje formale (catre profesori, parinti, persoane necunoscute) foloseste maxim 1-2 emoji-uri discrete, de preferat la sfarsit. Exagerarea cu emoji-uri intr-un mesaj formal este nepotrivita."
                    },
                    {
                        text: "Care mesaj respecta regulile de scriere online cand scrii unui profesor?",
                        options: [
                            "\"da-mi nota repede\"",
                            "\"VREAU SA STIU NOTA!!!\"",
                            "\"Buna ziua! As dori sa aflu nota de la test. Multumesc!\"",
                            "\"nota??? hellooo????\""
                        ],
                        correct: 2,
                        explanation: "Mesajul corect are: salut formal (Buna ziua!), formulare politicoasa (As dori), cerere clara, multumire. Celelalte variante folosesc CAPS LOCK, ton agresiv sau lipsa de politete."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Comportamente inacceptabile online",
                description: "Recunoaste si evita comportamentele inacceptabile",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este cyberbullying-ul?",
                        options: [
                            "Trimiterea de mesaje publicitare nedorite",
                            "Hartuirea sau jignirea cuiva online in mod repetat",
                            "A purta o conversatie online lunga",
                            "A lucra impreuna la un proiect prin internet"
                        ],
                        correct: 1,
                        explanation: "Cyberbullying-ul este hartuirea, jignirea sau intimidarea cuiva in mod repetat folosind tehnologia. Include insulte, batjocura, excludere din grupuri si raspandire de zvonuri false."
                    },
                    {
                        text: "Ce ar trebui sa faci daca vezi pe cineva hartuind o alta persoana intr-un grup online?",
                        options: [
                            "Sa particip si eu, ca sa fiu acceptat de grup",
                            "Sa distribui mesajele ca sa vada toata lumea",
                            "Sa raportez situatia si sa sprijin victima",
                            "Sa ignor total si sa nu ma implic"
                        ],
                        correct: 2,
                        explanation: "Nu participa la cyberbullying! Sprijina victima (trimite-i mesaj privat de sustinere), raporteaza comportamentul administratorului/profesorului si informeaza un adult de incredere. Fii parte din solutie!"
                    },
                    {
                        text: "Ce este \"spam\"-ul in comunicarea online?",
                        options: [
                            "Un tip de emoticon popular",
                            "Trimiterea de mesaje nedorite, repetitive sau irelevante",
                            "O metoda de a organiza emailurile",
                            "Un program de videoconferinta"
                        ],
                        correct: 1,
                        explanation: "Spam-ul reprezinta mesaje nedorite, repetitive sau irelevante. Nu trimite acelasi mesaj de mai multe ori, nu inunda grupurile cu mesaje inutile si nu trimite reclame nedorite."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Contextul conteaza",
                description: "Adapteaza tonul in functie de situatie",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum adapteaza un elev tonul mesajului in functie de destinatar?",
                        options: [
                            "Foloseste acelasi ton cu toata lumea",
                            "Scrie mereu informal, ca sa fie prietenos",
                            "Formal pentru profesori si institutii, informal pentru prieteni si colegi",
                            "Scrie mereu formal, ca sa fie sigur"
                        ],
                        correct: 2,
                        explanation: "Regula de baza: adapteaza tonul contextului. Formal si respectuos catre profesori, directori, adulti necunoscuti. Prietenos si relaxat catre colegi si prieteni apropiati."
                    },
                    {
                        text: "Care dintre urmatoarele este o regula corecta de netiquette in comunicarea cu profesorii?",
                        options: [
                            "Poti spune orice in online pentru ca nu te vede nimeni",
                            "Folosesti aceleasi formule ca si cu prietenii",
                            "Incepi cu formula de adresare formala si inchei cu semnatura",
                            "Trimiti mesaje oricat de tarziu in noapte"
                        ],
                        correct: 2,
                        explanation: "In comunicarea cu profesorii: incepi cu formula formala (Stimate Domnule Profesor,), scrii clar si politicos, si inchei cu formula de ramas-bun (Cu respect, + numele complet)."
                    },
                    {
                        text: "De ce este important sa nu distribuiti informatii private ale altora in mediul online?",
                        options: [
                            "Nu este important, informatiile sunt publice oricum",
                            "Pentru ca poate fi interesant pentru altii",
                            "Din respect pentru intimitatea persoanei si pentru a preveni daune",
                            "Doar daca persoana este un prieten"
                        ],
                        correct: 2,
                        explanation: "Nu distribui conversatii private, poze sau informatii personale ale altora fara acordul lor! Respecta intimitatea tuturor. Odata publicat pe internet, continutul poate ramane acolo pentru totdeauna."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_netiquette_quiz2_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_netiquette_quiz2_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-retele.html'">
                                Quiz-ul 3: Retele Sociale
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

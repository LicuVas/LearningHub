<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Comunicare prin Internet | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Comunicare prin Internet</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        // Quiz data — conforme cu programa OMEN 3393/2017, domeniu "Comunicare prin Internet" cls. VI
        const levels = {
            1: {
                title: "Nivel 1: Masuri de siguranta si protectia datelor personale",
                description: "Ce informatii sunt date personale si cum le protejam online",
                xpReward: 50,
                questions: [
                    {
                        text: "Care dintre urmatoarele este un exemplu de date personale pe care NU trebuie sa le share-uiesti cu persoane necunoscute online?",
                        options: [
                            "Culoarea ta preferata",
                            "Adresa de acasa si numarul de telefon",
                            "Genul de muzica preferat",
                            "Echipa de fotbal preferata"
                        ],
                        correct: 1,
                        explanation: "Adresa de acasa si numarul de telefon sunt date personale sensibile. Impreuna cu alte date (numele, scoala, ora cand esti singur acasa), pot fi folosite abuziv de persoane rau intentionate. Culoarea preferata sau echipa de fotbal nu sunt date sensibile."
                    },
                    {
                        text: "Ce trebuie sa faci daca un utilizator necunoscut iti cere sa va intalniti in persoana dupa ce ati vorbit online?",
                        options: [
                            "Refuzi si informezi imediat un adult (parinte, profesor)",
                            "Accepti imediat — e probabil o persoana prietenoasa",
                            "Ii dai adresa de acasa",
                            "Ii trimiti o poza cu tine"
                        ],
                        correct: 0,
                        explanation: "Persoanele cunoscute doar online pot sa nu fie cine pretind ca sunt. Regula de aur: refuzi orice intalnire cu necunoscuti si informezi imediat un adult de incredere (parinte sau profesor)."
                    },
                    {
                        text: "Ce este o parola puternica (sigura)?",
                        options: [
                            "Prenumele tau sau data nasterii",
                            "Cuvantul 'parola' sau '1234'",
                            "Numele animalului tau de companie",
                            "Un sir de cel putin 8 caractere cu litere mari, litere mici, cifre si simboluri"
                        ],
                        correct: 3,
                        explanation: "O parola puternica are minim 8 caractere si combina litere mari (A-Z), litere mici (a-z), cifre (0-9) si simboluri (!@#$). Evita informatii personale evidente (prenume, data nasterii, 1234) care pot fi ghicite usor."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Email — cont, adresa, mesaj, dosare si agenda",
                description: "Structura unui cont de email si organizarea mesajelor",
                xpReward: 75,
                questions: [
                    {
                        text: "Care este structura corecta a unei adrese de email?",
                        options: [
                            "utilizator@domeniu.extensie (ex: ion.popescu@gmail.com)",
                            "www.numedomeniu.ro",
                            "utilizator//domeniu.com",
                            "http://utilizator.domeniu"
                        ],
                        correct: 0,
                        explanation: "O adresa de email are doua parti separate de simbolul @ (at): partea din stanga este numele utilizatorului (ion.popescu), partea din dreapta este domeniul furnizorului (gmail.com, yahoo.com, outlook.com etc.)."
                    },
                    {
                        text: "Unde ajung mesajele de email primite (nespeciale, necomendate)?",
                        options: [
                            "In dosarul Sent (Trimise)",
                            "In dosarul Drafts (Ciorne)",
                            "In Inbox (Primite)",
                            "In dosarul Trash (Cos de gunoi)"
                        ],
                        correct: 2,
                        explanation: "Inbox (Primite) este dosarul principal unde ajung mesajele primite. Sent (Trimise) pastreaza mesajele trimise de tine. Drafts (Ciorne) pastreaza mesajele incepute dar netrimise. Spam / Junk pastreaza mesajele suspecte filtrate automat."
                    },
                    {
                        text: "Ce este Agenda de contacte (Address Book) dintr-un client de email?",
                        options: [
                            "Un dosar unde se salveaza fisierele atasate",
                            "O lista in care salvezi adresele de email ale persoanelor cunoscute pentru a le gasi rapid",
                            "Un jurnal al mesajelor sterse",
                            "Un fisier cu configuratia contului de email"
                        ],
                        correct: 1,
                        explanation: "Agenda de contacte (Address Book / Contacts) stocheaza adresele de email si alte informatii (telefon, nume) ale persoanelor cu care comunici. Cand compui un mesaj, poti cauta rapid contactul in agenda in loc sa tastezi adresa de fiecare data."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Operatii cu email (compunere, trimitere, raspuns, redirectionare, atasare)",
                description: "Cum scriem, trimitem si gestionam mesajele email",
                xpReward: 100,
                questions: [
                    {
                        text: "Care este diferenta dintre 'Reply' (Raspunde) si 'Reply All' (Raspunde tuturor)?",
                        options: [
                            "Nu exista diferenta",
                            "Reply All trimite mesajul la toti contactele din agenda",
                            "Reply sterge mesajul original; Reply All il pastreaza",
                            "Reply trimite raspunsul doar expeditorului; Reply All trimite raspunsul expeditorului SI tuturor destinatarilor din mesajul original"
                        ],
                        correct: 3,
                        explanation: "Reply (Raspunde) trimite mesajul tau de raspuns NUMAI expeditorului. Reply All (Raspunde tuturor) trimite raspunsul atat expeditorului, cat si tuturor celorlalti care erau la 'To' sau 'CC' in mesajul original. Foloseste Reply All cu atentie — nu toti trebuie sa vada raspunsul tau!"
                    },
                    {
                        text: "Ce inseamna 'Forward' (Redirectionare) la un email?",
                        options: [
                            "Stergi mesajul primit",
                            "Trimiti mai departe mesajul primit (cu tot cu continut) catre alta persoana",
                            "Marchezi mesajul ca important",
                            "Muti mesajul intr-un dosar"
                        ],
                        correct: 1,
                        explanation: "Forward (Redirectionare / Redirijare) iti permite sa trimiti unui tert un mesaj pe care l-ai primit tu, impreuna cu continutul original. Util cand vrei sa arati cuiva o informatie primita prin email."
                    },
                    {
                        text: "Cum adaugi un fisier (document, imagine) la un email pe care il compui?",
                        options: [
                            "Copiezi continutul fisierului in corpul mesajului",
                            "Scrii numele fisierului in campul Subject",
                            "Folosesti butonul 'Attach' / 'Ataseaza' (pictograma agrafa) si alegi fisierul de pe disc",
                            "Nu se pot trimite fisiere prin email"
                        ],
                        correct: 2,
                        explanation: "Butonul 'Attach file' (Ataseaza fisier), reprezentat de obicei printr-o agrafa, deschide fereastra de navigare prin care alegi fisierul de pe disc. Fisierul atasat va fi trimis impreuna cu mesajul. Destinatarul il poate descarca separat."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Neticheta — formule de adresare si reguli de scriere",
                description: "Comunicarea civilizata si corecta in mediul online",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este 'neticheta' (netichet-a)?",
                        options: [
                            "Un program antivirus",
                            "Un tip de retea de calculatoare",
                            "Codul de bune maniere si comportament politicos in comunicarea online (email, forumuri, retele sociale)",
                            "Un format de fisier"
                        ],
                        correct: 2,
                        explanation: "Neticheta (din 'net' + 'eticheta') reprezinta regulile de comportament civilizat pe Internet: cum scrii mesaje respectuoase, cum te adresezi politicos, ce eviti sa faci. Este echivalentul manierelor bune din viata reala, aplicat in mediul digital."
                    },
                    {
                        text: "De ce trebuie evitata scrierea unui email (sau a unui mesaj online) NUMAI CU MAJUSCULE?",
                        options: [
                            "In neticheta, scrierea cu majuscule inseamna ca TIPETI — este considerata agresiva si nepoliticoasa",
                            "Majusculele consuma mai multa baterie",
                            "Majusculele nu se pot tipari",
                            "Nu exista nicio regula despre majuscule"
                        ],
                        correct: 0,
                        explanation: "Conform netichetei, un text scris INTEGRAL CU MAJUSCULE este echivalentul TIPETELOR in comunicarea orala. Este considerat agresiv si nepoliticos. Scrie normal, cu majuscula doar la inceputul propozitiei si la nume proprii."
                    },
                    {
                        text: "Ce formula de adresare este potrivita la inceputul unui email formal (ex: catre un profesor)?",
                        options: [
                            "Hei! sau Salut,",
                            "Buna seara!, sau La multi ani!",
                            "Nu este necesar niciun salut",
                            "Stimate/Stimata [Titlu Nume] (ex: Stimata doamna profesor Ionescu,)"
                        ],
                        correct: 3,
                        explanation: "Un email formal (catre profesor, director, institutie) incepe cu 'Stimate domnule / Stimata doamna [titlu si nume]' sau 'Va adresez aceasta cerere...'. Formulele informale (Hei, Salut) sunt acceptabile doar la prieteni apropiati."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Siguranta online — recapitulare completa",
                description: "Combina toate cunostintele despre comunicarea sigura prin Internet",
                xpReward: 150,
                questions: [
                    {
                        text: "Primesti un email de la o adresa necunoscuta cu mesajul: 'Felicitari! Ai castigat un telefon! Click aici pentru a-l ridica!'. Ce faci?",
                        options: [
                            "Apesi imediat pe link",
                            "Raspunzi cu datele tale personale",
                            "Ignori si stergi mesajul — este probabil spam sau phishing (inselatorie)",
                            "Il redirectionezi tuturor prietenilor"
                        ],
                        correct: 2,
                        explanation: "Mesajele care promit premii neasteptate de la expeditori necunoscuti sunt de obicei spam sau phishing — tentative de inselatorie care incearca sa obtina datele tale personale sau sa instaleze programe malware. Nu apasa niciodata pe linkuri suspecte si nu da informatii personale."
                    },
                    {
                        text: "Ce camp al unui email contine adresele destinatarilor care primesc o copie a mesajului (fara a fi destinatarii principali)?",
                        options: [
                            "Subject (Subiect)",
                            "CC (Carbon Copy) — copie la",
                            "To (Catre) — campul principal",
                            "BCC (Blind Carbon Copy) — copie ascunsa"
                        ],
                        correct: 1,
                        explanation: "CC (Carbon Copy / Copie la) permite trimiterea unui mesaj si altor persoane interesate, pe langa destinatarul principal din To. Toti destinatarii pot vedea adresele din CC. BCC (Blind Carbon Copy) functioneaza similar, dar destinatarii din BCC nu sunt vizibili celorlalti."
                    },
                    {
                        text: "Care dintre urmatoarele reprezinta un comportament corect (de neticheta) intr-un grup de discutii online sau pe un forum scolar?",
                        options: [
                            "Sa insulti pe cineva care greseste",
                            "Sa postezi acelasi mesaj de mai multe ori ca sa fie citit",
                            "Sa scrii mesaje lungi cu text copiat de pe Wikipedia fara sa mentionezi sursa",
                            "Sa raspunzi la subiect, sa folosesti un limbaj respectuos si sa verifici informatia inainte de a o posta"
                        ],
                        correct: 3,
                        explanation: "Comportamentul corect online include: respectarea subiectului discutiei, limbaj politicos fara insulte, verificarea informatiilor inainte de postare si citarea sursei. Trollingul, spam-ul (mesaje repetate) si plagiatul sunt incalcari ale netichetei."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_m5_quiz4_comunicare_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_m5_quiz4_comunicare_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>
            `;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }
            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });
            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) { options[q.correct].classList.add('correct'); }
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }
            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;
            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;
            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';
            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) { totalXP += earnedXP; }
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }
                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }
            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz5-finalizare.html'">Quiz-ul 5: Evaluare Finala</button>` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

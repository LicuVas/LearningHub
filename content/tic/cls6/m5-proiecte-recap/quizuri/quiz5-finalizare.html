<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5: Evaluare Finala | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
.module-complete {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 16px;
            margin-top: 1rem;
        }

.module-complete h3 {
            font-size: 1.5rem;
            color: var(--accent-orange);
            margin-bottom: 0.5rem;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 5: Evaluare Finala — Clasa a VI-a</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Prezentari",
                description: "Interfata, diapozitive, animatii si tranzitii",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un diapozitiv (slide) intr-o prezentare?",
                        options: [
                            "Un fisier separat salvat pe calculator",
                            "O pagina individuala dintr-o prezentare, care poate contine text, imagini si obiecte",
                            "Un efect de animatie",
                            "O imprimanta speciala"
                        ],
                        correct: 1,
                        explanation: "Un diapozitiv este o pagina dintr-o prezentare. Prezentarile sunt formate din mai multe diapozitive, fiecare putand contine text, imagini, forme si alte obiecte multimedia."
                    },
                    {
                        text: "Care este diferenta dintre 'tranzitie' si 'animatie' intr-o prezentare?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Tranzitia este efectul de trecere intre diapozitive; animatia este efectul aplicat unui obiect dintr-un diapozitiv",
                            "Tranzitia se aplica textului, animatia se aplica imaginilor",
                            "Animatia inseamna sa muti manual cursorul"
                        ],
                        correct: 1,
                        explanation: "Tranzitia controleaza cum treci de la un slide la altul (ex: fading, glisare). Animatia controleaza cum apar sau dispar obiectele INTR-UN slide (ex: text care apare litera cu litera)."
                    },
                    {
                        text: "Care este o regula elementara pentru o prezentare lizibila?",
                        options: [
                            "Sa scrii cat mai mult text posibil pe fiecare slide",
                            "Sa folosesti cat mai multe fonturi diferite",
                            "Sa limitezi textul la idei cheie si sa folosesti imagini pentru explicatii",
                            "Sa nu folosesti deloc culori"
                        ],
                        correct: 2,
                        explanation: "O prezentare buna are putine cuvinte pe slide — ideile-cheie, nu paragrafe intregi. Imaginile si graficele explica mai bine decat textul lung. Publicul asculta vorbitorul, nu citeste slide-urile."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Animatii grafice",
                description: "Cadre, obiecte, efecte de miscare si control prin structuri",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce reprezinta un 'cadru' (frame) intr-o animatie?",
                        options: [
                            "Rama unui tablou",
                            "O imagine unica dintr-o secventa; schimbarea rapida a cadrelor creeaza iluzia de miscare",
                            "Un tip special de obiect Scratch",
                            "Dimensiunea ecranului"
                        ],
                        correct: 1,
                        explanation: "Un cadru este o imagine statica. Intr-o animatie, zeci sau sute de cadre sunt afisate rapid (ex: 24 cadre/secunda), creand iluzia de miscare — la fel ca intr-un flipbook."
                    },
                    {
                        text: "Ce operatie aplici unui obiect intr-o animatie pentru a-i schimba marimea pe ecran?",
                        options: [
                            "Rotire",
                            "Transparenta",
                            "Dimensionare (scalare)",
                            "Pozitionare"
                        ],
                        correct: 2,
                        explanation: "Dimensionarea (scalarea) modifica marimea obiectului pe ecran — mai mare sau mai mic. Rotirea schimba unghiul, transparenta face obiectul vizibil/invizibil, pozitionarea il muta."
                    },
                    {
                        text: "Cum controlezi o animatie prin tastatura in Scratch?",
                        options: [
                            "Nu se poate controla prin tastatura",
                            "Folosind blocul 'when [key] pressed' pentru a declansa actiuni la apasarea unei taste",
                            "Prin meniul File",
                            "Prin modificarea culorii obiectului"
                        ],
                        correct: 1,
                        explanation: "Blocul 'when [key] pressed' porneste un script cand utilizatorul apasa o tasta. Astfel poti controla directia de miscare, animatia activa sau alte actiuni ale personajului."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Algoritmi — Structuri repetitive",
                description: "Structura repetitiva: conditionata anterior/posterior/cu contor; schema logica; pseudocod",
                xpReward: 100,
                questions: [
                    {
                        text: "Care structura repetitiva verifica conditia INAINTE de a executa corpul buclei?",
                        options: [
                            "Structura repetitiva cu contor (for)",
                            "Structura repetitiva conditionata posterior (do-while / repeat-until)",
                            "Structura repetitiva conditionata anterior (while / cat timp)",
                            "Secventa simpla"
                        ],
                        correct: 2,
                        explanation: "Structura 'cat timp' (while) verifica conditia INAINTE: daca conditia e falsa de la inceput, corpul nu se executa deloc. Structura 'do-while' verifica dupa — corpul se executa cel putin o data."
                    },
                    {
                        text: "Un elev scrie pseudocod: 'pentru i de la 1 la 5 executa | afiseaza i'. De cate ori se afiseaza ceva?",
                        options: [
                            "0 ori",
                            "1 ora",
                            "4 ori",
                            "5 ori"
                        ],
                        correct: 3,
                        explanation: "Structura cu contor parcurge valorile 1, 2, 3, 4, 5 — adica 5 pasi. La fiecare pas se afiseaza valoarea lui i. Deci se afiseaza: 1, 2, 3, 4, 5 — in total 5 afisari."
                    },
                    {
                        text: "In schema logica, ce simbol reprezinta o conditie (decizie)?",
                        options: [
                            "Dreptunghiul",
                            "Ovalul / capsula (start/stop)",
                            "Rombul (losangul)",
                            "Paralelogramul (intrare/iesire)"
                        ],
                        correct: 2,
                        explanation: "In schema logica: rombul = decizie (conditie, cu doua ramuri: DA si NU); dreptunghiul = actiune/instructiune; ovalul = start/stop; paralelogramul = citire/afisare (intrare/iesire)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Comunicare prin Internet",
                description: "Siguranta online, email si neticheta",
                xpReward: 125,
                questions: [
                    {
                        text: "Care dintre urmatoarele este o masura de siguranta corecta pe Internet?",
                        options: [
                            "Sa impartasesti parola cu prietenii apropiati",
                            "Sa folosesti aceeasi parola simpla pentru toate conturile",
                            "Sa nu dai datele personale (adresa, telefon, scoala) unor persoane necunoscute online",
                            "Sa accepti toate cererile de prietenie de la necunoscuti"
                        ],
                        correct: 2,
                        explanation: "Protectia datelor personale este esentiala: nu dai niciodata adresa, numarul de telefon, scoala sau alte date persoanelor necunoscute online. Parola trebuie sa fie unica si complexa pentru fiecare cont."
                    },
                    {
                        text: "Care este structura corecta a unei adrese de email?",
                        options: [
                            "nume#domeniu.ro",
                            "numedomeniu.ro",
                            "nume@domeniu.ro",
                            "www.nume.domeniu"
                        ],
                        correct: 2,
                        explanation: "O adresa de email are forma: utilizator@domeniu.extensie (ex: ion.popescu@gmail.com). Simbolul @ (at / 'la') separa numele utilizatorului de domeniu. Fara @ nu este o adresa valida."
                    },
                    {
                        text: "Ce regula de NETICHETA trebuie respectata in emailurile formale?",
                        options: [
                            "Sa scrii TOTUL CU MAJUSCULE pentru a sublinia importanta",
                            "Sa folosesti formule de adresare corespunzatoare ('Stimate/a ...') si sa te semnezi",
                            "Sa trimiti acelasi email de mai multe ori daca nu primesti raspuns rapid",
                            "Sa folosesti emoticoane in loc de cuvinte"
                        ],
                        correct: 1,
                        explanation: "Neticheta (eticheta online) cere: formule de adresare corecte ('Stimate domnule profesor...'), semnatura, ton respectuos. Majusculele = tipa online. Emailurile repetate = spam. Emoticonurile nu sunt potrivite in mesaje formale."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Recapitulare generala",
                description: "Intrebari din toate cele 4 domenii ale clasei a VI-a",
                xpReward: 150,
                questions: [
                    {
                        text: "Ionut vrea sa adauge un efect prin care textul 'zboara' pe slide cand acesta apare. Ce tip de efect foloseste?",
                        options: [
                            "Tranzitie de slide",
                            "Animatie de obiect",
                            "Schimbare de tema",
                            "Formatare font"
                        ],
                        correct: 1,
                        explanation: "Efectul aplicat unui OBIECT de pe un slide (text, imagine, forma) se numeste animatie de obiect. Tranzitia se aplica slidului in intregime, cand treci de la un slide la altul."
                    },
                    {
                        text: "Maria are o bucla 'cat timp scor < 10 executa | scor = scor + 1'. Dupa cate repetari se opreste bucla?",
                        options: [
                            "Niciodata — bucla infinita",
                            "Dupa 9 repetari",
                            "Dupa 10 repetari",
                            "Dupa 11 repetari"
                        ],
                        correct: 2,
                        explanation: "Scorul incepe la 0 (presupunem). La fiecare pas creste cu 1: 0,1,2,...,9. Cand scorul devine 10, conditia 'scor < 10' devine falsa si bucla se opreste. S-au executat 10 repetari (pentru valorile 0 pana la 9)."
                    },
                    {
                        text: "Un elev primeste un email de la un necunoscut care ii cere parola contului Scratch 'pentru a repara proiectul'. Ce ar trebui sa faca?",
                        options: [
                            "Sa trimita parola — probabil e un ajutor oficial",
                            "Sa ignore emailul si sa nu trimita niciodata parola — nicio platforma legitima nu cere parola prin email",
                            "Sa trimita parola, dar sa o schimbe dupa",
                            "Sa raspunda si sa ceara mai multe informatii"
                        ],
                        correct: 1,
                        explanation: "Nicio platforma legitima (Scratch, Google, Facebook) nu iti cere parola prin email. Acesta este un atac de tip 'phishing'. Regula: nu trimite NICIODATA parola prin email, indiferent de motiv."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_m5_quiz5_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_m5_quiz5_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            let moduleComplete = '';
            if (passed && currentLevel === 5) {
                moduleComplete = `
                    <div class="module-complete">
                        <h3>Felicitari! Ai completat Modulul 5!</h3>
                        <p>Acum stii sa planifici, creezi, testezi si sa publici un joc in Scratch!</p>
                        <p style="margin-top: 1rem; color: var(--accent-purple);">Esti pregatit sa creezi propriul tau joc de la zero!</p>
                    </div>
                `;
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    ${moduleComplete}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='../index.html'">
                                Inapoi la Modulul 5
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

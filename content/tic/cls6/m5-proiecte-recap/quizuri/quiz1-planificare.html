<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Prezentari (PowerPoint/Impress) | Clasa a VI-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Prezentari (PowerPoint / Impress)</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        // Quiz data — conforme cu programa OMEN 3393/2017, domeniu "Prezentari" cls. VI
        const levels = {
            1: {
                title: "Nivel 1: Interfata aplicatiei de prezentare",
                description: "Recapitulam elementele ferestrei PowerPoint / LibreOffice Impress",
                xpReward: 50,
                questions: [
                    {
                        text: "Care zona a ferestrei PowerPoint afiseaza diapozitivul curent in marime mare, pentru editare?",
                        options: [
                            "Zona de editare centrala (panoul principal)",
                            "Panoul de diapozitive (stanga)",
                            "Bara de meniu (sus)",
                            "Bara de stare (jos)"
                        ],
                        correct: 0,
                        explanation: "Zona de editare centrala (panoul principal) afiseaza diapozitivul selectat la dimensiune reala si permite editarea directa a continutului: text, imagini, forme, animatii."
                    },
                    {
                        text: "Ce rol are panoul de diapozitive (coloana din stanga in PowerPoint)?",
                        options: [
                            "Afiseaza efectele de animatie disponibile",
                            "Afiseaza meniul de fisiere",
                            "Permite tiparirea prezentarii",
                            "Afiseaza miniaturi ale tuturor diapozitivelor si permite reordonarea lor"
                        ],
                        correct: 3,
                        explanation: "Panoul de diapozitive din stanga afiseaza miniaturi (imagini mici) ale tuturor diapozitivelor. Poti face clic pe o miniatura pentru a o selecta, sau o poti trage pentru a schimba ordinea."
                    },
                    {
                        text: "Cum se numeste bara cu butoane de formatare rapida (Acasa / Home) din PowerPoint?",
                        options: [
                            "Bara de titlu",
                            "Bara de defilare",
                            "Panglica (Ribbon)",
                            "Bara de stare"
                        ],
                        correct: 2,
                        explanation: "Panglica (Ribbon) este zona de butoane si comenzi organizate pe taburi (File, Home, Insert, Design, Animations, Slide Show etc.). Contine toate instrumentele de formatare si inserare."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Gestionarea prezentarilor si a diapozitivelor",
                description: "Cum creezi, adaugi, stergi si reordonezi diapozitive",
                xpReward: 75,
                questions: [
                    {
                        text: "Cum adaugi un diapozitiv nou dupa diapozitivul curent in PowerPoint?",
                        options: [
                            "File → Save As",
                            "Edit → Copy",
                            "View → Normal",
                            "Insert → New Slide (sau Ctrl+M)"
                        ],
                        correct: 3,
                        explanation: "Insert → New Slide (sau scurtatura Ctrl+M) adauga un diapozitiv nou dupa cel selectat. Poti alege si un layout (aspect): Title Slide, Title and Content, Blank etc."
                    },
                    {
                        text: "Cum schimbi ordinea diapozitivelor intr-o prezentare?",
                        options: [
                            "Tragi (drag and drop) miniaturile in panoul de diapozitive",
                            "Le stergi si le rescrii in ordine noua",
                            "Dai File → Reorder",
                            "Inchizi si redeschizi fisierul"
                        ],
                        correct: 0,
                        explanation: "Cel mai simplu: tragi (drag and drop) miniatura diapozitivului in panoul din stanga pana la pozitia dorita. Poti si decupa (Ctrl+X) si lipi (Ctrl+V) un diapozitiv la alta pozitie."
                    },
                    {
                        text: "Ce extensie are fisierul salvat implicit in PowerPoint (format modern)?",
                        options: [
                            ".docx",
                            ".xlsx",
                            ".pptx",
                            ".pdf"
                        ],
                        correct: 2,
                        explanation: ".pptx este formatul implicit al Microsoft PowerPoint (versiunile 2007 si mai noi). LibreOffice Impress salveaza implicit in .odp, dar poate deschide si salva si .pptx."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Text, obiecte si formatare",
                description: "Inserare si formatare text, imagini, forme pe un diapozitiv",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este un 'placeholder' (casuta punctata) pe un diapozitiv?",
                        options: [
                            "Un tip de animatie",
                            "Un fundal decorativ",
                            "Un buton de tranzitie",
                            "O zona rezervata unde poti adauga text sau obiecte"
                        ],
                        correct: 3,
                        explanation: "Placeholder-ul este o zona delimitata (casuta cu chenarul punctat) rezervata pentru text sau obiecte (titlu, subtitlu, continut). Dai clic pe ea si incepi sa scrii sau inserezi un obiect."
                    },
                    {
                        text: "Cum inserezi o imagine intr-un diapozitiv PowerPoint?",
                        options: [
                            "Insert → Pictures (alegi fisierul de pe disc)",
                            "Home → Font → Image",
                            "Design → Themes → Insert",
                            "File → New → Image"
                        ],
                        correct: 0,
                        explanation: "Insert → Pictures (Pictures from File in versiuni mai vechi) deschide fereastra de navigare prin care alegi imaginea de pe disc. Imaginea este inserata pe diapozitiv si poate fi redimensionata si mutata."
                    },
                    {
                        text: "Ce inseamna 'layout-ul' (aspectul) unui diapozitiv?",
                        options: [
                            "Culoarea de fundal a prezentarii",
                            "Aranjamentul predefinit al placeholder-elor pe diapozitiv",
                            "Fontul folosit pentru titlu",
                            "Numarul de diapozitive din prezentare"
                        ],
                        correct: 1,
                        explanation: "Layout-ul defineste unde se afla placeholder-ele pe diapozitiv: un layout 'Title Slide' are titlul mare centrat, altul 'Two Content' are doua coloane, altul 'Blank' nu are niciun placeholder. Schimbi layout-ul din Home → Layout."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Animatii si tranzitii",
                description: "Cum se animeaza obiectele si se creeaza tranzitii intre diapozitive",
                xpReward: 125,
                questions: [
                    {
                        text: "Care este diferenta dintre 'animatie' si 'tranzitie' intr-o prezentare?",
                        options: [
                            "Animatia se aplica obiectelor de pe diapozitiv; tranzitia se aplica trecerii dintre diapozitive",
                            "Nu exista diferenta — sunt acelasi lucru",
                            "Animatia se aplica tranzitiei dintre diapozitive; tranzitia animeaza obiectele",
                            "Amandoua se aplica numai textului"
                        ],
                        correct: 0,
                        explanation: "Animatia (din tab-ul Animations) controleaza cum apar/dispar sau se misca obiectele pe acelasi diapozitiv (ex: textul zboard de la stanga). Tranzitia (tab Transitions) controleaza efectul vizual la trecerea DE LA un diapozitiv LA altul (ex: Fade, Push, Wipe)."
                    },
                    {
                        text: "Din ce tab al Ribbon-ului adaugi un efect de animatie unui text sau imagini?",
                        options: [
                            "Design",
                            "Insert",
                            "View",
                            "Animations"
                        ],
                        correct: 3,
                        explanation: "Tab-ul 'Animations' contine toate efectele de animatie: Entrance (aparitie), Emphasis (accent), Exit (disparitie) si Motion Paths (traiectorie de miscare). Selectezi obiectul si apoi alegi efectul dorit."
                    },
                    {
                        text: "Ce optiune folosesti ca o tranzitie sau animatie sa porneasca automat (fara clic)?",
                        options: [
                            "Nu se poate seta declansatorul",
                            "After Previous — porneste automat dupa actiunea anterioara, sau With Previous — simultan",
                            "On Click — dupa clic de mouse",
                            "Delay 0 secunde"
                        ],
                        correct: 1,
                        explanation: "In panoul Timing din Animations poti alege Start: 'After Previous' (porneste automat dupa ce termina efectul anterior) sau 'With Previous' (porneste simultan cu efectul anterior). 'On Click' este implicit si necesita clic de mouse."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Reguli elementare de sustinere a unei prezentari",
                description: "Bune practici pentru prezentarea in fata clasei sau a unui public",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este regula de baza privind cantitatea de text pe un diapozitiv?",
                        options: [
                            "Pune tot textul pe un singur diapozitiv ca sa nu dai clic mult",
                            "Scrie cat mai mic ca sa incapa mai mult",
                            "Maxim 5-7 randuri de text pe un diapozitiv; evita blocuri mari de text",
                            "Nu pune deloc text — doar imagini"
                        ],
                        correct: 2,
                        explanation: "Regula '5x5' sau '5x7': maxim 5-7 randuri per diapozitiv, maxim 5-7 cuvinte pe rand. Diapozitivul este un suport vizual, nu un dictare — vorbitorul explica, diapozitivul sustine vizual."
                    },
                    {
                        text: "Ce trebuie sa faci cu privirea cand sustii o prezentare in fata clasei?",
                        options: [
                            "Sa mentii contactul vizual cu publicul, nu sa citesti de pe diapozitiv",
                            "Sa citesti de pe ecran sau de pe foaia de hartie tot timpul",
                            "Sa te uiti la plafon ca sa nu iti fie frica",
                            "Sa stai cu spatele la public si sa arati pe ecran"
                        ],
                        correct: 0,
                        explanation: "Contactul vizual cu publicul este esential: te conectezi cu ascultatorii, pari mai sigur si mai convingator. Diapozitivele trebuie memorate/intelese, nu citite cu voce tare."
                    },
                    {
                        text: "De ce este importanta repetarea (repetitia) prezentarii inainte de a o sustine?",
                        options: [
                            "Nu este importanta — improvizatia e mai buna",
                            "Ca sa memorezi exact cuvintele de pe diapozitiv",
                            "Sa verifici ca prezentarea se deschide pe calculator",
                            "Te ajuta sa respecti limita de timp, sa cunosti continutul si sa te simti mai increzator"
                        ],
                        correct: 3,
                        explanation: "Repetitia iti permite: sa verifici ca te incadrezi in timpul alocat, sa cunosti fluxul prezentarii fara sa citesti, sa identifici partile neclare si sa iti controlezi ritmul vocii. Cel putin o repetitie inainte de prezentare este o regula profesionala."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls6_m5_quiz1_prezentari_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls6_m5_quiz1_prezentari_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>
            `;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }
            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });
            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) { options[q.correct].classList.add('correct'); }
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }
            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;
            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;
            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';
            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) { totalXP += earnedXP; }
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }
                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }
            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz2-personaje.html'">Quiz-ul 2: Recapitulare Scratch</button>` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

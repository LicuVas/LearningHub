<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Schema Logica | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Schema Logica (Flowchart)</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer><strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a></footer>

    <script>
        const levels = {
            1: { title: "Nivel 1: Simboluri de baza", description: "Invata simbolurile folosite in schemele logice", xpReward: 50, questions: [
                { text: "Ce forma geometrica reprezinta START si STOP intr-o schema logica?", options: ["Dreptunghi", "Romb", "Oval (dreptunghi cu colturi rotunjite)", "Triunghi"], correct: 2, explanation: "Ovalul (sau dreptunghiul cu colturi rotunjite) reprezinta inceputul (START) si sfarsitul (STOP) algoritmului. Fiecare schema logica trebuie sa aiba exact un START si cel putin un STOP." },
                { text: "Ce forma geometrica reprezinta o operatie de prelucrare (calcul)?", options: ["Romb", "Dreptunghi", "Paralelogram", "Cerc"], correct: 1, explanation: "Dreptunghiul reprezinta o operatie de prelucrare - un calcul sau o actiune. De exemplu: 'suma = a + b' sau 'x = x + 1'. Este cea mai folosita forma in schemele logice." },
                { text: "Ce forma geometrica reprezinta o decizie (conditie)?", options: ["Dreptunghi", "Oval", "Romb (rombul)", "Paralelogram"], correct: 2, explanation: "Rombul reprezinta o decizie (conditie) in schema logica. In interior se scrie o intrebare la care raspunsul este DA sau NU. Din romb pleaca doua sageti: una pentru DA si una pentru NU." }
            ]},
            2: { title: "Nivel 2: Citire si scriere", description: "Invata simbolurile pentru input si output", xpReward: 75, questions: [
                { text: "Ce forma geometrica reprezinta citirea (input) si scrierea (output) in schema logica?", options: ["Dreptunghi", "Romb", "Paralelogram", "Oval"], correct: 2, explanation: "Paralelogramul reprezinta operatiile de citire (input) si scriere (output). Cand vezi un paralelogram cu 'Citeste x', inseamna ca algoritmul asteapta o valoare de la utilizator. Cand vezi 'Scrie x', algoritmul afiseaza rezultatul." },
                { text: "Ce conecteaza simbolurile intre ele in schema logica?", options: ["Linii punctate", "Sageti (care arata directia de executie)", "Linii ondulate", "Nimic, sunt doar asezate in ordine"], correct: 1, explanation: "Sagetile conecteaza simbolurile si arata directia in care se executa algoritmul. Urmaresti sagetile de la START pana la STOP pentru a intelege ordinea pasilor. Directia sagetii conteaza!" },
                { text: "Intr-o schema logica, cate sageti pot intra intr-un simbol?", options: ["Exact una singura", "Una sau mai multe", "Doar doua", "Niciuna"], correct: 1, explanation: "Intr-un simbol pot intra una sau mai multe sageti (de exemplu, cand doua ramuri ale unei decizii se reunesc). Dar dintr-un dreptunghi sau paralelogram pleaca exact o sageata, iar dintr-un romb pleaca exact doua (DA si NU)." }
            ]},
            3: { title: "Nivel 3: Structura secventiala", description: "Invata schema logica a executiei secventiale", xpReward: 100, questions: [
                { text: "O schema logica secventiala (fara decizii) arata ca:", options: ["O retea cu multe ramificatii", "O linie dreapta de simboluri de sus in jos, conectate prin sageti", "Un cerc de simboluri", "Un singur simbol mare"], correct: 1, explanation: "Schema logica secventiala este cea mai simpla: simbolurile sunt asezate de sus in jos (sau de la stanga la dreapta) si conectate prin sageti, fara ramificatii. START -> Citire -> Prelucrare -> Scriere -> STOP." },
                { text: "Construieste mental schema logica: START -> Citeste a,b -> suma=a+b -> Scrie suma -> STOP. Cate simboluri are?", options: ["3 simboluri", "4 simboluri", "5 simboluri", "6 simboluri"], correct: 2, explanation: "Schema are 5 simboluri: 1) START (oval), 2) Citeste a,b (paralelogram), 3) suma=a+b (dreptunghi), 4) Scrie suma (paralelogram), 5) STOP (oval). Fiecare operatie are simbolul ei dedicat." },
                { text: "In ce ordine se citeste o schema logica?", options: ["De jos in sus", "De la dreapta la stanga", "Urmand sagetile, de obicei de sus in jos", "In orice ordine doresti"], correct: 2, explanation: "O schema logica se citeste urmand sagetile, de obicei de sus in jos. Incepi de la simbolul START si urmezi sagetile pana ajungi la STOP. Sagetile iti arata exact in ce ordine se executa operatiile." }
            ]},
            4: { title: "Nivel 4: Structura alternativa", description: "Invata ramificarea in schemele logice", xpReward: 125, questions: [
                { text: "Cand schema logica ajunge la un romb (decizie), ce se intampla?", options: ["Algoritmul se opreste", "Se verifica conditia si se merge pe ramura DA sau NU", "Se executa ambele ramuri", "Se sare peste romb"], correct: 1, explanation: "La un romb, se verifica conditia scrisa in interior. Daca conditia este adevarata, se merge pe ramura DA. Daca este falsa, se merge pe ramura NU. Se executa DOAR o singura ramura, nu ambele!" },
                { text: "Cate sageti ies din simbolul romb (decizie)?", options: ["Una singura", "Exact doua: una pentru DA si una pentru NU", "Trei", "Depinde de conditie"], correct: 1, explanation: "Din romb ies intotdeauna exact DOUA sageti: una marcata cu DA (True) si una cu NU (False). Aceasta este regula fundamentala a simbolului de decizie. Fiecare sageata duce la un alt grup de operatii." },
                { text: "Schema: START -> Citeste nota -> [nota >= 5?] -> DA: Scrie 'Promovat' / NU: Scrie 'Nepromovat' -> STOP. Daca nota=7, ce afiseaza?", options: ["Nepromovat", "Promovat", "Eroare", "Nimic"], correct: 1, explanation: "Urmarim schema: nota=7, verificam conditia: 7 >= 5? DA! Deci mergem pe ramura DA si afisam 'Promovat'. Daca nota ar fi fost 3, am fi mers pe ramura NU si am fi afisat 'Nepromovat'." }
            ]},
            5: { title: "Nivel 5: Scheme logice complexe", description: "Testeaza-ti cunostintele avansate", xpReward: 150, questions: [
                { text: "Ce simbol se foloseste pentru a arata ca un proces se repeta (bucla)?", options: ["Doar dreptunghiuri", "O sageata care se intoarce inapoi la un romb (decizie)", "Un triunghi", "Nu exista bucle in schemele logice"], correct: 1, explanation: "O bucla (repetitie) se reprezinta prin sagetile care se intorc inapoi la un romb de decizie. Cat timp conditia din romb este DA, se executa corpul buclei si sageata duce inapoi la verificarea conditiei. Cand conditia devine NU, se iese din bucla." },
                { text: "De ce este schema logica mai utila decat pseudocodul pentru vizualizarea unui algoritm?", options: ["Nu e mai utila", "Permite vizualizarea grafica a fluxului si ramificatiilor, fiind mai intuitiva", "Este mai scurta de scris", "Se poate rula direct pe calculator"], correct: 1, explanation: "Schema logica ofera o reprezentare VIZUALA a algoritmului - poti vedea dintr-o privire cum 'curge' executia, unde se fac decizii si unde sunt buclele. Este ca o harta a algoritmului, mult mai intuitiva decat textul." },
                { text: "Schema: START -> Citeste n -> [n > 0?] -> DA: Scrie 'Pozitiv' -> STOP / NU: [n < 0?] -> DA: Scrie 'Negativ' -> STOP / NU: Scrie 'Zero' -> STOP. Daca n=0, ce afiseaza?", options: ["Pozitiv", "Negativ", "Zero", "Nu afiseaza nimic"], correct: 2, explanation: "Urmarim: n=0. Prima decizie: 0 > 0? NU. Mergem pe ramura NU. A doua decizie: 0 < 0? NU. Mergem pe ramura NU. Ajungem la Scrie 'Zero'. Aceasta schema clasifica un numar in pozitiv, negativ sau zero folosind doua decizii inlantuite." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m3_quiz4_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m3_quiz4_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz5-variabile.html'">Quiz-ul 5: Variabile</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

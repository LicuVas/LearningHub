<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Ce Este un Algoritm | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header">
            <div class="quiz-title">Quiz: Ce Este un Algoritm</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Definitia algoritmului",
                description: "Invata ce este un algoritm si unde il intalnesti",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un algoritm?",
                        options: [
                            "Un program de calculator foarte complex",
                            "O succesiune finita de pasi clari pentru rezolvarea unei probleme",
                            "Un tip de robot",
                            "O formula matematica secreta"
                        ],
                        correct: 1,
                        explanation: "Un algoritm este o succesiune finita (cu numar limitat) de pasi clari si bine definiti, care rezolva o problema. Este ca o reteta: urmezi pasii in ordine si ajungi la rezultat."
                    },
                    {
                        text: "Care dintre urmatoarele este un exemplu de algoritm din viata de zi cu zi?",
                        options: [
                            "A visa la vacanta",
                            "A urma o reteta de prajitura pas cu pas",
                            "A privi pe fereastra",
                            "A asculta muzica"
                        ],
                        correct: 1,
                        explanation: "O reteta de prajitura este un exemplu perfect de algoritm: are pasi clari (amesteca faina cu ouale, pune la cuptor 30 minute etc.), are un inceput si un sfarsit, si daca urmezi pasii obtii rezultatul dorit."
                    },
                    {
                        text: "De ce sunt importanti algoritmii in informatica?",
                        options: [
                            "Nu sunt importanti, sunt doar teorie",
                            "Calculatorul nu poate rezolva probleme fara instructiuni clare (algoritmi)",
                            "Sunt importanti doar pentru hackeri",
                            "Servesc doar la jocuri video"
                        ],
                        correct: 1,
                        explanation: "Calculatorul nu gandeste singur - are nevoie de instructiuni exacte si clare (algoritmi) pentru a rezolva orice problema. Fiecare program, aplicatie sau joc se bazeaza pe algoritmi care spun calculatorului CE sa faca si CUM."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Proprietatile algoritmilor",
                description: "Descopera ce face un algoritm sa fie corect",
                xpReward: 75,
                questions: [
                    {
                        text: "Un algoritm trebuie sa fie 'finit'. Ce inseamna asta?",
                        options: [
                            "Trebuie sa fie foarte lung",
                            "Trebuie sa se termine dupa un numar limitat de pasi",
                            "Trebuie sa contina numere",
                            "Trebuie sa fie scris pe hartie"
                        ],
                        correct: 1,
                        explanation: "Finit inseamna ca algoritmul trebuie sa se termine! Nu poate rula la infinit. Dupa un numar determinat de pasi, trebuie sa ajunga la o concluzie (rezultat). Un algoritm care nu se termina niciodata nu este un algoritm corect."
                    },
                    {
                        text: "Ce inseamna ca un algoritm trebuie sa fie 'clar' (neambiguu)?",
                        options: [
                            "Trebuie scris cu litere mari",
                            "Fiecare pas trebuie sa aiba un singur inteles, fara confuzie",
                            "Trebuie sa fie simplu",
                            "Trebuie sa fie in limba romana"
                        ],
                        correct: 1,
                        explanation: "Claritatea (neambiguitatea) inseamna ca fiecare pas al algoritmului trebuie sa aiba un singur inteles posibil. Cel care executa algoritmul trebuie sa stie exact ce sa faca la fiecare pas, fara sa aiba dubii."
                    },
                    {
                        text: "Ce proprietate a unui algoritm asigura ca functioneaza pentru orice date de intrare valide?",
                        options: [
                            "Finititudinea",
                            "Generalitatea",
                            "Claritatea",
                            "Lungimea"
                        ],
                        correct: 1,
                        explanation: "Generalitatea inseamna ca algoritmul trebuie sa functioneze pentru o clasa intreaga de probleme similare, nu doar pentru un singur caz. De exemplu, un algoritm de adunare trebuie sa functioneze pentru ORICE doua numere, nu doar pentru 2+3."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Exemple de algoritmi",
                description: "Recunoaste algoritmi din viata de zi cu zi",
                xpReward: 100,
                questions: [
                    {
                        text: "Care dintre urmatoarele NU este un exemplu de algoritm?",
                        options: [
                            "Instructiunile de preparare de pe o cutie de cereale",
                            "Un vis pe care l-ai avut noaptea trecuta",
                            "Regulile unui joc de societate",
                            "Pasii pentru a traversa strada"
                        ],
                        correct: 1,
                        explanation: "Un vis NU este un algoritm - nu are pasi clari, nu are un scop definit si nu produce un rezultat previzibil. Instructiunile de preparare, regulile unui joc si pasii de traversare au toti pasi clari cu un scop definit."
                    },
                    {
                        text: "Algoritmul pentru a face un sandwich ar fi:",
                        options: [
                            "Mananca sandwich-ul",
                            "1. Ia doua felii de paine. 2. Pune unt pe o felie. 3. Pune sunca si cascaval. 4. Pune a doua felie deasupra.",
                            "Cumpara paine de la magazin",
                            "Gandeste-te la un sandwich"
                        ],
                        correct: 1,
                        explanation: "Un algoritm corect descrie TOTI pasii necesari, in ordine: ia feliile de paine, pune ingredientele, asambleaza sandwich-ul. Fiecare pas este clar si in ordinea corecta. 'Mananca sandwich-ul' sau 'gandeste-te la sandwich' nu sunt algoritmi completi."
                    },
                    {
                        text: "Ce se intampla daca schimbi ordinea pasilor intr-un algoritm?",
                        options: [
                            "Nu se intampla nimic, ordinea nu conteaza",
                            "Poti obtine un rezultat gresit sau algoritmul poate sa nu functioneze",
                            "Algoritmul devine mai rapid",
                            "Algoritmul devine mai usor de inteles"
                        ],
                        correct: 1,
                        explanation: "Ordinea pasilor este foarte importanta! Daca pui acoperisul casei inainte de pereti, sau pui prajitura in cuptor inainte de a amesteca ingredientele, rezultatul va fi gresit. Algoritmii functioneaza corect doar daca pasii sunt in ordinea corecta."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Algoritmi si calculatoare",
                description: "Intelege relatia dintre algoritmi si programe",
                xpReward: 125,
                questions: [
                    {
                        text: "Care este relatia dintre un algoritm si un program de calculator?",
                        options: [
                            "Sunt exact acelasi lucru",
                            "Un program este un algoritm scris intr-un limbaj de programare pe care calculatorul il intelege",
                            "Algoritmii sunt doar pe hartie, programele doar pe calculator",
                            "Nu exista nicio legatura"
                        ],
                        correct: 1,
                        explanation: "Un program de calculator este un algoritm scris (implementat) intr-un limbaj de programare (ca Python, Scratch, C++). Algoritmul este ideea/planul, iar programul este implementarea practica pe care calculatorul o poate executa."
                    },
                    {
                        text: "Inainte de a scrie un program, de ce este important sa gandesti mai intai algoritmul?",
                        options: [
                            "Nu e important, scrii direct codul",
                            "Te ajuta sa planifici solutia si sa eviti greseli",
                            "E doar o cerinta a profesorului",
                            "Algoritmul se scrie automat"
                        ],
                        correct: 1,
                        explanation: "Gandirea algoritmului inainte de a scrie codul este ca un plan de constructie inainte de a ridica o casa. Te ajuta sa intelegi problema, sa planifici solutia pas cu pas si sa eviti greseli costisitoare. Programatorii profesionisti fac intotdeauna asta!"
                    },
                    {
                        text: "Ce este un 'bug' intr-un program?",
                        options: [
                            "O functie noua",
                            "O greseala (eroare) in algoritm sau in codul programului",
                            "Un tip de virus",
                            "O caracteristica speciala"
                        ],
                        correct: 1,
                        explanation: "Un 'bug' (insecta, in engleza) este o greseala in program - poate fi un pas gresit in algoritm sau o eroare in scrierea codului. Termenul vine din 1947, cand o insecta reala a cauzat defectarea unui calculator. 'Debugging' inseamna gasirea si repararea bug-urilor."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Gandirea algoritmica",
                description: "Testeaza-ti capacitatea de a gandi in pasi",
                xpReward: 150,
                questions: [
                    {
                        text: "Cati pasi minimin sunt necesari pentru a gasi cel mai mare numar dintr-o lista de 3 numere?",
                        options: [
                            "1 pas",
                            "2 pasi (doua comparatii)",
                            "3 pasi",
                            "10 pasi"
                        ],
                        correct: 1,
                        explanation: "Ai nevoie de minimum 2 comparatii: 1) Compara primul numar cu al doilea si retine-l pe cel mai mare. 2) Compara rezultatul cu al treilea numar. Cel care ramane este cel mai mare din lista!"
                    },
                    {
                        text: "Ce este 'datele de intrare' (input) ale unui algoritm?",
                        options: [
                            "Rezultatul final",
                            "Informatiile pe care le primeste algoritmul la inceput pentru a le prelucra",
                            "Numele algoritmului",
                            "Culoarea interfetei"
                        ],
                        correct: 1,
                        explanation: "Datele de intrare (input) sunt informatiile pe care algoritmul le primeste pentru a le prelucra. De exemplu, la un algoritm de adunare, input-ul sunt cele doua numere care trebuie adunate. Fara input, algoritmul nu stie cu ce sa lucreze."
                    },
                    {
                        text: "Ce este 'datele de iesire' (output) ale unui algoritm?",
                        options: [
                            "Informatiile initiale",
                            "Rezultatul produs de algoritm dupa executarea tuturor pasilor",
                            "Pasii intermediari",
                            "Erorile din program"
                        ],
                        correct: 1,
                        explanation: "Datele de iesire (output) sunt rezultatul final pe care algoritmul il produce dupa ce a prelucrat datele de intrare. La adunarea numerelor 3 si 5, output-ul este 8. Output-ul este raspunsul la problema pe care algoritmul o rezolva."
                    }
                ]
            }
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];
        function loadProgress() { const s = localStorage.getItem('cls5_m3_quiz1_progress'); if (s) { const d = JSON.parse(s); totalXP = d.totalXP || 0; unlockedLevels = d.unlockedLevels || [1]; levelScores = d.levelScores || {}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m3_quiz1_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((n, i) => { const l = i+1; n.classList.remove('locked','active','completed'); if (levelScores[l] !== undefined) n.classList.add('completed'); else if (unlockedLevels.includes(l)) { if (l === Math.max(...unlockedLevels.filter(x => levelScores[x] === undefined))) n.classList.add('active'); } else n.classList.add('locked'); }); document.querySelectorAll('.level-connector').forEach((c, i) => { if (levelScores[i+1] !== undefined) c.classList.add('completed'); else c.classList.remove('completed'); }); }
        function selectLevel(level) { if (!unlockedLevels.includes(level)) return; currentLevel = level; currentQuestion = 0; score = 0; showLevelIntro(); }
        function showLevelIntro() { const l = levels[currentLevel]; document.getElementById('quizArea').innerHTML = `<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`; }
        function startLevel() { showQuestion(); }
        function showQuestion() { function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } const l = levels[currentLevel]; const q = l.questions[currentQuestion]; let dots = ''; for (let i = 0; i < l.questions.length; i++) dots += `<div class="progress-dot${i === currentQuestion ? ' current' : ''}"></div>`; let opts = ''; q.options.forEach((o, i) => { opts += `<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`; }); document.getElementById('quizArea').innerHTML = `<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`; }
        function selectAnswer(index) { const l = levels[currentLevel]; const q = l.questions[currentQuestion]; const opts = document.querySelectorAll('.option'); const fb = document.getElementById('feedback'); const nb = document.getElementById('nextBtn'); opts.forEach(o => o.style.pointerEvents = 'none'); opts[index].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index !== q.correct) opts[q.correct].classList.add('correct'); const d = document.querySelectorAll('.progress-dot'); d[currentQuestion].classList.remove('current'); d[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index === q.correct) { score++; fb.className = 'feedback-box show correct'; fb.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`; } else { fb.className = 'feedback-box show wrong'; fb.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`; } nb.style.display = 'inline-flex'; nb.textContent = currentQuestion < l.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul'; }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete(); else showQuestion(); }
        function showLevelComplete() { const l = levels[currentLevel]; const pct = Math.round((score / l.questions.length) * 100); const passed = pct >= 66; let stars = pct >= 100 ? '&#11088;&#11088;&#11088;' : pct >= 80 ? '&#11088;&#11088;' : pct >= 66 ? '&#11088;' : '&#128170;'; let earnedXP = 0; if (passed) { earnedXP = l.xpReward; if (pct === 100) earnedXP = Math.round(earnedXP * 1.5); if (!levelScores[currentLevel] || levelScores[currentLevel] < pct) { if (!levelScores[currentLevel]) totalXP += earnedXP; levelScores[currentLevel] = pct; } if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1); saveProgress(); updateXPDisplay(); updateLevelMap(); } document.getElementById('quizArea').innerHTML = `<div class="level-complete show"><div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div><h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz2-pasi.html'">Quiz-ul 2: Pasi</button>` : ''}</div></div>`; }
        loadProgress(); showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Reprezentarea Algoritmilor | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-secondary); border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border); }
        .quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }
        .level-map { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .level-node { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: all 0.3s; position: relative; border: 3px solid var(--border); background: var(--bg-card); }
        .level-node.locked { opacity: 0.5; cursor: not-allowed; } .level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }
        .level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }
        .level-node.completed { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); border-color: var(--accent-green); } .level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .level-connector { width: 30px; height: 3px; background: var(--border); align-self: center; } .level-connector.completed { background: var(--accent-green); }
        .quiz-area { background: var(--bg-secondary); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); min-height: 400px; }
        .level-intro { text-align: center; padding: 2rem; } .level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); } .level-intro p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; } .level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }
        .question-container { display: none; } .question-container.active { display: block; animation: slideIn 0.5s ease; } @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .question-progress { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; } .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); } .progress-dot.current { background: var(--accent-blue); } .progress-dot.correct { background: var(--accent-green); } .progress-dot.wrong { background: var(--accent-red); }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }
        .options-grid { display: grid; gap: 1rem; margin-top: 1.5rem; } .option { padding: 1.2rem 1.5rem; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; } .option:hover { border-color: var(--accent-purple); transform: translateX(5px); } .option.correct { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.2); } .option.wrong { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }
        .feedback-box { display: none; padding: 1.5rem; border-radius: 12px; margin-top: 1.5rem; text-align: center; } .feedback-box.show { display: block; animation: fadeIn 0.3s ease; } .feedback-box.correct { background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); } .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--accent-red); } .feedback-icon { font-size: 3rem; margin-bottom: 0.5rem; } .feedback-text { font-size: 1.1rem; margin-bottom: 1rem; } .explanation { font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-top: 1rem; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; } .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; } .btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); } .btn-success { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; } .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); } .btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .level-complete { display: none; text-align: center; padding: 3rem; } .level-complete.show { display: block; animation: celebrate 0.5s ease; } @keyframes celebrate { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } } .level-complete-icon { font-size: 5rem; margin-bottom: 1rem; } .level-complete h2 { font-size: 2rem; color: var(--accent-green); margin-bottom: 1rem; } .xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; } .score-display { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; } .stars { font-size: 3rem; margin: 1rem 0; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-size: 0.9rem; } .back-link:hover { color: var(--accent-cyan); }
        @media (max-width: 600px) { .container { padding: 1rem; } .quiz-header { flex-direction: column; gap: 1rem; } .level-node { width: 50px; height: 50px; font-size: 1.2rem; } .question-text { font-size: 1.1rem; } }
        footer { margin-top: 3rem; padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Reprezentarea Algoritmilor</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer><strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a></footer>

    <script>
        const levels = {
            1: { title: "Nivel 1: Limbajul natural", description: "Invata sa descrii algoritmi in cuvinte", xpReward: 50, questions: [
                { text: "Ce inseamna reprezentarea unui algoritm in limbaj natural?", options: ["Scrierea in cod de programare", "Descrierea pasilor in cuvinte obisnuite, ca o compunere", "Desenarea unor figuri geometrice", "Folosirea doar a numerelor"], correct: 1, explanation: "Reprezentarea in limbaj natural inseamna descrierea algoritmului in cuvinte obisnuite, pe care oricine le poate intelege. De exemplu: 'Pasul 1: Citeste doua numere. Pasul 2: Aduna cele doua numere. Pasul 3: Afiseaza rezultatul.'" },
                { text: "Care este avantajul principal al reprezentarii in limbaj natural?", options: ["Este foarte precisa", "Este usor de inteles de oricine, chiar daca nu stie programare", "Se poate rula direct pe calculator", "Este cea mai scurta metoda"], correct: 1, explanation: "Limbajul natural este usor de inteles de oricine - nu ai nevoie de cunostinte speciale de informatica. Orice persoana poate citi si intelege pasii. Este ideal pentru a explica algoritmul cuiva care nu stie programare." },
                { text: "Care este un dezavantaj al limbajului natural pentru algoritmi?", options: ["E prea greu de scris", "Poate fi ambiguu (un cuvant poate avea mai multe sensuri)", "Nu se poate folosi pentru probleme matematice", "Ocupa prea mult spatiu pe hartie"], correct: 1, explanation: "Limbajul natural poate fi ambiguu - un cuvant sau o propozitie poate fi interpretata in mai multe feluri. De exemplu, 'imparte numerele' poate insemna 'imparte un numar la altul' sau 'distribuie numerele in grupe'. De aceea exista si alte metode mai precise." }
            ]},
            2: { title: "Nivel 2: Pseudocodul", description: "Descopera pseudocodul ca metoda de reprezentare", xpReward: 75, questions: [
                { text: "Ce este pseudocodul?", options: ["Un limbaj de programare real", "O metoda de scriere a algoritmilor folosind cuvinte cheie standardizate (Citeste, Scrie, Daca, etc.)", "Un tip de cod secret", "Un program de calculator"], correct: 1, explanation: "Pseudocodul este o metoda intermediara intre limbajul natural si codul de programare. Foloseste cuvinte cheie standard (Citeste, Scrie, Calculeaza, Daca-Atunci, Cat timp, etc.) care sunt clare si neambigue, dar nu sunt legate de un limbaj de programare anume." },
                { text: "Care este un exemplu corect de pseudocod?", options: ["Fa niste calcule cu numerele", "Citeste a, b; Calculeaza suma = a + b; Scrie suma", "print('hello world')", "SELECT * FROM numere"], correct: 1, explanation: "'Citeste a, b; Calculeaza suma = a + b; Scrie suma' este un exemplu de pseudocod clar: Citeste (input), Calculeaza (prelucrare), Scrie (output). Nu este legat de un limbaj de programare specific, dar este precis si structurat." },
                { text: "De ce este pseudocodul mai bun decat limbajul natural pentru algoritmi?", options: ["Este mai frumos vizual", "Este mai precis si mai structurat, eliminand ambiguitatile", "Se poate rula direct pe calculator", "Este mai scurt de scris"], correct: 1, explanation: "Pseudocodul elimina ambiguitatile limbajului natural prin folosirea cuvintelor cheie standard. Fiecare cuvant cheie are un singur inteles: 'Citeste' inseamna intotdeauna input, 'Scrie' inseamna intotdeauna output, 'Daca' inseamna intotdeauna o conditie." }
            ]},
            3: { title: "Nivel 3: Moduri de reprezentare", description: "Compara diferitele moduri de a scrie algoritmi", xpReward: 100, questions: [
                { text: "Care sunt cele trei moduri principale de a reprezenta un algoritm?", options: ["Doar in limbaj natural", "Limbaj natural, pseudocod si schema logica (flowchart)", "Doar in cod de programare", "Doar prin desen"], correct: 1, explanation: "Cele trei moduri principale sunt: 1) Limbaj natural (in cuvinte obisnuite), 2) Pseudocod (cu cuvinte cheie standardizate), 3) Schema logica / Flowchart (cu forme geometrice si sageti). Fiecare are avantajele si dezavantajele sale." },
                { text: "Care metoda de reprezentare poate fi rulata direct pe calculator?", options: ["Limbajul natural", "Pseudocodul", "Schema logica", "Niciuna - trebuie transformat in cod de programare"], correct: 3, explanation: "Niciuna dintre cele trei metode de reprezentare nu poate fi rulata direct pe calculator! Toate trebuie transformate (traduse) intr-un limbaj de programare (Python, Scratch, C++ etc.) pentru ca un calculator sa le poata executa." },
                { text: "Cand e mai util sa folosesti limbajul natural in loc de pseudocod?", options: ["Intotdeauna", "Cand explici algoritmul cuiva care nu stie informatica", "Cand algoritmul este foarte complex", "Niciodata"], correct: 1, explanation: "Limbajul natural este ideal cand explici un algoritm cuiva care nu are cunostinte de informatica (de exemplu, unui coleg care nu a facut programare). Pseudocodul si schemele logice sunt mai utile pentru cei care inteleg aceste conventii." }
            ]},
            4: { title: "Nivel 4: Scrierea algoritmilor", description: "Exerseaza scrierea in pseudocod", xpReward: 125, questions: [
                { text: "Scrie in pseudocod algoritmul care calculeaza aria unui patrat. Care varianta este corecta?", options: ["Aria = latura * latura", "Citeste latura; Calculeaza aria = latura * latura; Scrie aria", "Scrie latura; Citeste aria", "latura = aria * aria"], correct: 1, explanation: "Pseudocodul corect: 1) Citeste latura (primesti valoarea de la utilizator), 2) Calculeaza aria = latura * latura (aplici formula), 3) Scrie aria (afisezi rezultatul). Toate cele trei etape (input, prelucrare, output) sunt necesare." },
                { text: "In pseudocod, 'Daca conditie Atunci actiune' este un exemplu de:", options: ["Instructiune de citire", "Instructiune de decizie (alternativa)", "Instructiune de scriere", "Instructiune de atribuire"], correct: 1, explanation: "'Daca...Atunci' este o instructiune de decizie (alternativa). Algoritmul verifica o conditie si executa actiunea DOAR daca acea conditie este adevarata. De exemplu: 'Daca nota >= 5 Atunci Scrie Promovat'." },
                { text: "Ce face instructiunea 'Cat timp conditie Executa actiune'?", options: ["Executa actiunea o singura data", "Repeta actiunea cat timp conditia este adevarata", "Nu face nimic", "Afiseaza conditia"], correct: 1, explanation: "'Cat timp...Executa' este o instructiune de repetitie (bucla). Repeta actiunea DIN NOU si DIN NOU cat timp conditia ramane adevarata. Cand conditia devine falsa, se opreste. Exemplu: 'Cat timp nu ai terminat temele, Executa urmatorul exercitiu'." }
            ]},
            5: { title: "Nivel 5: Transformari", description: "Transforma algoritmi intre diferite reprezentari", xpReward: 150, questions: [
                { text: "Transforma in pseudocod: 'Citeste un numar. Daca numarul este mai mare decat zero, scrie Pozitiv. Altfel, scrie Negativ sau zero.'", options: ["Citeste n; Scrie Pozitiv sau Negativ", "Citeste n; Daca n > 0 Atunci Scrie 'Pozitiv' Altfel Scrie 'Negativ sau zero'", "Scrie n; Daca pozitiv Atunci citeste", "n = pozitiv; Scrie n"], correct: 1, explanation: "Pseudocodul corect foloseste structura Daca-Atunci-Altfel: Citeste n (input); Daca n > 0 Atunci Scrie 'Pozitiv' Altfel Scrie 'Negativ sau zero' (decizie + output). Aceasta structura permite doua cai diferite in functie de valoarea lui n." },
                { text: "Ce format de reprezentare foloseste forme geometrice (dreptunghiuri, romburi, paralelgrame)?", options: ["Pseudocodul", "Limbajul natural", "Schema logica (flowchart)", "Codul de programare"], correct: 2, explanation: "Schema logica (flowchart) foloseste forme geometrice standardizate: dreptunghiuri pentru prelucrare, romburi pentru decizii, paralelgrame pentru citire/scriere, si ovaluri/dreptunghiuri rotunjite pentru Start/Stop. Formele sunt conectate prin sageti." },
                { text: "De ce este important sa stii mai multe moduri de a reprezenta un algoritm?", options: ["Nu e important, un singur mod e suficient", "Fiecare mod are avantaje diferite si te ajuta sa comunici solutia in contexte diferite", "Pentru a-ti impresiona profesorul", "Pentru a scrie mai mult la teste"], correct: 1, explanation: "Fiecare reprezentare are rolul ei: limbajul natural e bun pentru comunicare generala, pseudocodul pentru planificarea precisa, schema logica pentru vizualizarea fluxului. Un programator bun stie sa le foloseasca pe toate, alegand-o pe cea potrivita contextului." }
            ]}
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];
        function loadProgress() { const s = localStorage.getItem('cls5_m3_quiz3_progress'); if (s) { const d = JSON.parse(s); totalXP = d.totalXP||0; unlockedLevels = d.unlockedLevels||[1]; levelScores = d.levelScores||{}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m3_quiz3_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');}); }
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz4-schema-logica.html'">Quiz-ul 4: Schema Logica</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Descrierea Algoritmilor in Limbaj Natural | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Descrierea Algoritmilor in Limbaj Natural</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: { title: "Nivel 1: Limbajul natural", description: "Invata sa descrii algoritmi in cuvinte", xpReward: 50, questions: [
                { text: "Ce inseamna reprezentarea unui algoritm in limbaj natural?", options: ["Descrierea pasilor in cuvinte obisnuite, ca o compunere", "Scrierea in cod de programare", "Desenarea unor figuri geometrice", "Folosirea doar a numerelor"], correct: 0, explanation: "Reprezentarea in limbaj natural inseamna descrierea algoritmului in cuvinte obisnuite, pe care oricine le poate intelege. De exemplu: 'Pasul 1: Citeste doua numere. Pasul 2: Aduna cele doua numere. Pasul 3: Afiseaza rezultatul.'" },
                { text: "Care este avantajul principal al reprezentarii in limbaj natural?", options: ["Este foarte precisa", "Este usor de inteles de oricine, chiar daca nu stie programare", "Se poate rula direct pe calculator", "Este cea mai scurta metoda"], correct: 1, explanation: "Limbajul natural este usor de inteles de oricine - nu ai nevoie de cunostinte speciale de informatica. Orice persoana poate citi si intelege pasii. Este ideal pentru a explica algoritmul cuiva care nu stie programare." },
                { text: "Care este un dezavantaj al limbajului natural pentru algoritmi?", options: ["E prea greu de scris", "Nu se poate folosi pentru probleme matematice", "Poate fi ambiguu (un cuvant poate avea mai multe sensuri)", "Ocupa prea mult spatiu pe hartie"], correct: 2, explanation: "Limbajul natural poate fi ambiguu - un cuvant sau o propozitie poate fi interpretata in mai multe feluri. De exemplu, 'imparte numerele' poate insemna 'imparte un numar la altul' sau 'distribuie numerele in grupe'. De aceea exista si alte metode mai precise." }
            ]},
            2: { title: "Nivel 2: Descrierea pas cu pas", description: "Invata sa descrii algoritmi in mod ordonat si complet", xpReward: 75, questions: [
                { text: "Ce trebuie sa contina o descriere corecta a unui algoritm in limbaj natural?", options: ["Doar rezultatul final", "Numai operatiile matematice", "Doar conditiile", "Pasii IN ORDINE, fiecare pas clar si fara ambiguitate"], correct: 3, explanation: "O descriere corecta in limbaj natural contine pasii IN ORDINE, fiecare pas formulat clar astfel incat orice persoana sa il inteleaga. De exemplu: 'Pasul 1: Citeste lungimea si latimea dreptunghiului. Pasul 2: Calculeaza aria = lungime x latime. Pasul 3: Scrie aria calculata.'" },
                { text: "Care dintre urmatoarele este o descriere corecta in limbaj natural a unui algoritm de adunare?", options: ["Aduna si gata", "Pasul 1: Citeste doua numere a si b. Pasul 2: Calculeaza suma = a + b. Pasul 3: Scrie suma.", "a + b = suma", "Fa calculul"], correct: 1, explanation: "Descrierea corecta contine trei etape clare: citirea datelor de intrare (a si b), prelucrarea (calculul sumei) si afisarea rezultatului (scrierea sumei). Fiecare pas este explicit si in ordine." },
                { text: "De ce trebuie sa evitam cuvintele cu mai multe intelesuri intr-un algoritm in limbaj natural?", options: ["Deoarece ambiguitatea poate duce la executarea gresita a algoritmului", "Pentru ca sunt prea lungi", "Nu conteaza, orice cuvant e bun", "Pentru ca e mai greu de scris"], correct: 0, explanation: "Ambiguitatea (cuvintele cu mai multe intelesuri) poate cauza executarea gresita a algoritmului. De exemplu, 'imparte numerele' poate insemna 'imparte un numar la altul' SAU 'distribuie numerele in grupe'. Un algoritm corect trebuie sa fie neambiguu - fiecare pas are un singur inteles." }
            ]},
            3: { title: "Nivel 3: Algoritmi in limbaj natural", description: "Aplica descrierea in limbaj natural la situatii concrete", xpReward: 100, questions: [
                { text: "La clasa a V-a, care este modul principal de a descrie un algoritm?", options: ["Codul sursa intr-un limbaj de programare", "Ecuatii matematice complexe", "Descrierea in limbaj natural (in cuvinte obisnuite)", "Diagrame electronice"], correct: 2, explanation: "La clasa a V-a se studiaza descrierea algoritmilor in limbaj natural (in cuvinte obisnuite, pe intelesul tuturor). Aceasta este competenta V-2.1 din programa: 'Descrierea in limbaj natural a unor algoritmi pentru rezolvarea unor situatii din viata cotidiana'." },
                { text: "Poate fi rulata direct pe calculator o descriere in limbaj natural a unui algoritm?", options: ["Da, calculatorul intelege limbajul natural", "Nu, descrierea in limbaj natural trebuie transformata intr-un limbaj de programare (ex: Scratch, Python)", "Depinde de calculator", "Da, daca scriem pasii corect"], correct: 1, explanation: "Descrierea in limbaj natural NU poate fi rulata direct pe calculator. Calculatorul intelege doar limbajele de programare formale (Scratch, Python, C++ etc.). Limbajul natural este util pentru planificarea si comunicarea algoritmului, dar nu pentru executia lui de catre calculator." },
                { text: "Cand este cea mai utila descrierea algoritmului in limbaj natural?", options: ["Niciodata - e prea imprecisa", "Numai la examen", "Doar cand algoritmul are mai putin de 3 pasi", "Cand explici algoritmul cuiva care nu cunoaste informatica, sau cand planifici primii pasi ai solutiei"], correct: 3, explanation: "Limbajul natural este cel mai util atunci cand: (1) explici algoritmul cuiva fara cunostinte de informatica (parinti, colegi din alte clase), (2) planifici si schitezi primii pasi ai solutiei inainte de a implementa in Scratch sau alt mediu. Este punctul de plecare natural al oricarui algoritm." }
            ]},
            4: { title: "Nivel 4: Scrierea algoritmilor", description: "Exerseaza descrierea algoritmilor in limbaj natural", xpReward: 125, questions: [
                { text: "Descrie in limbaj natural algoritmul care calculeaza aria unui patrat. Care varianta este corecta?", options: ["Pasul 1: Citeste latura. Pasul 2: Calculeaza aria = latura x latura. Pasul 3: Afiseaza aria.", "Aria este latura la patrat", "Scrie latura, apoi citeste aria", "Latura este egala cu aria impartita la ea insasi"], correct: 0, explanation: "Descrierea corecta in limbaj natural contine toate cele trei etape: Pasul 1 - citirea datei de intrare (latura), Pasul 2 - prelucrarea (calculul ariei cu formula latura x latura), Pasul 3 - afisarea rezultatului. Fiecare pas este clar si in ordine." },
                { text: "In algoritmica de clasa a V-a, 'Daca conditie Atunci actiune' este un exemplu de:", options: ["Structura secventiala", "Structura alternativa (decizionala)", "Structura repetitiva", "Formula matematica"], correct: 1, explanation: "'Daca...Atunci' este structura alternativa (decizionala). Algoritmul verifica o conditie si executa actiunea DOAR daca acea conditie este adevarata. De exemplu: 'Daca temperatura > 30 grade, atunci imbracati-va subtire'. Structura alternativa este studiata la clasa a V-a (competenta V-2.4)." },
                { text: "Care dintre urmatoarele structuri se studiaza la clasa a V-a?", options: ["Structura repetitiva (Cat timp... Executa)", "Recursivitatea", "Numai structura secventiala si cea alternativa (Daca-Atunci)", "Subprogramele"], correct: 2, explanation: "La clasa a V-a se studiaza structura secventiala (V-2.3) si structura alternativa / decizionala (V-2.4). Structura repetitiva ('Cat timp... Executa', bucla) este materie de clasa a VI-a. Aceasta progresie asigura o invatare graduala." }
            ]},
            5: { title: "Nivel 5: Algoritmi complecsi", description: "Descrie algoritmi cu structuri secventiale si alternative", xpReward: 150, questions: [
                { text: "Descrie in limbaj natural: 'Citeste un numar. Daca numarul este mai mare decat zero, afiseaza Pozitiv. Altfel, afiseaza Negativ sau zero.' Care varianta este corecta?", options: ["Afiseaza Pozitiv sau Negativ", "Pasul 1: Citeste numarul n. Pasul 2: Daca n este mai mare decat 0, afiseaza 'Pozitiv'. Altfel, afiseaza 'Negativ sau zero'.", "Scrie n, daca e pozitiv citeste altfel nu", "n este pozitiv sau negativ"], correct: 1, explanation: "Descrierea corecta in limbaj natural contine: citirea datei de intrare (n), o decizie clara (daca n > 0) cu doua ramuri (Pozitiv sau Negativ/zero). Aceasta este structura alternativa (V-2.4): algoritmul ia decizii in functie de date." },
                { text: "Ce format vizual foloseste forme geometrice (dreptunghiuri, romburi) pentru a reprezenta un algoritm?", options: ["Descrierea in limbaj natural", "Ecuatiile matematice", "Schema logica (flowchart)", "Codul sursa"], correct: 2, explanation: "Schema logica (flowchart) foloseste forme geometrice: dreptunghiuri pentru prelucrare, romburi pentru decizii, paralelgrame pentru citire/scriere si ovaluri pentru Start/Stop. Aceasta metoda de reprezentare vizuala este studiata la clasa a VI-a (conform programei: 'Modalitati de reprezentare: schema logica si pseudocod'). La clasa a V-a, algoritmii se reprezinta in limbaj natural si se implementeaza in mediul grafic interactiv (Scratch)." },
                { text: "Care este avantajul descrierii algoritmului in limbaj natural fata de alte metode?", options: ["Se poate rula direct pe calculator", "Este usor de inteles de oricine, fara cunostinte specializate de informatica", "Este cel mai precis mod de reprezentare", "Elimina complet ambiguitatea"], correct: 1, explanation: "Limbajul natural este accesibil tuturor: nu ai nevoie de cunostinte speciale de informatica pentru a intelege pasii. Este ideal pentru a explica un algoritm oricarei persoane. Dezavantajul sau este posibilitatea de ambiguitate, dar pentru comunicare generala ramane cel mai util la clasa a V-a." }
            ]}
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];
        function loadProgress() { const s = localStorage.getItem('cls5_m3_quiz3_progress'); if (s) { const d = JSON.parse(s); totalXP = d.totalXP||0; unlockedLevels = d.unlockedLevels||[1]; levelScores = d.levelScores||{}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m3_quiz3_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');}); }
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz4-schema-logica.html'">Quiz-ul 4: Schema Logica</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

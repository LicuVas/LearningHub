<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Variabile si Expresii | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Variabile si Expresii</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: { title: "Nivel 1: Ce este o variabila?", description: "Invata conceptul de variabila in algoritmi", xpReward: 50, questions: [
                { text: "Ce este o variabila in informatica?", options: ["Un numar fix care nu se schimba niciodata", "O 'cutie' cu un nume in care stocam o valoare care se poate schimba", "Un tip de calculator", "Un program de calculator"], correct: 1, explanation: "O variabila este ca o cutie etichetata in care poti pune o valoare. Cutia are un NUME (eticheta) si un CONTINUT (valoarea). De exemplu, variabila 'varsta' poate contine valoarea 11. Poti schimba continutul oricand!" },
                { text: "Daca avem variabila x = 5, ce contine variabila x?", options: ["Litera x", "Numarul 5", "Semnul =", "Nimic"], correct: 1, explanation: "Variabila cu numele 'x' contine valoarea 5. Gandeste-te ca 'x' este numele cutiei, iar '5' este ce se afla inauntru. Cand folosesti 'x' intr-un calcul, se foloseste valoarea din cutie, adica 5." },
                { text: "De ce se numeste 'variabila'?", options: ["Pentru ca se scrie cu litere variabile", "Pentru ca valoarea ei se poate schimba (varia) in timpul executiei algoritmului", "Pentru ca nu e importanta", "Pentru ca e mereu aceeasi"], correct: 1, explanation: "Se numeste 'variabila' pentru ca valoarea ei poate VARIA (se poate schimba). De exemplu: x = 5, apoi x = x + 1 face ca x sa devina 6. Valoarea s-a schimbat! O constanta, in schimb, nu se schimba niciodata." }
            ]},
            2: { title: "Nivel 2: Nume si valori", description: "Invata cum se numesc si folosesc variabilele", xpReward: 75, questions: [
                { text: "Care este un nume bun pentru o variabila care stocheaza varsta cuiva?", options: ["x", "varsta", "abc123", "variabila1"], correct: 1, explanation: "Un nume bun de variabila este descriptiv - spune ce contine. 'varsta' este perfect pentru ca stii imediat ce stocheaza. 'x' sau 'abc123' nu spun nimic despre continut. Alege intotdeauna nume clare!" },
                { text: "Ce este o constanta?", options: ["O variabila care se schimba des", "O valoare care NU se schimba niciodata in timpul executiei algoritmului", "Un tip de eroare", "Un alt nume pentru variabila"], correct: 1, explanation: "O constanta este o valoare fixa care nu se schimba niciodata. Exemple: PI = 3.14159, numarul de zile ale saptamanii = 7. Spre deosebire de variabile, constantele raman la aceeasi valoare pe tot parcursul algoritmului." },
                { text: "Ce tipuri de valori poate stoca o variabila?", options: ["Doar numere", "Numere intregi, numere cu virgula, text (siruri de caractere) si valori logice (adevarat/fals)", "Doar text", "Doar valori logice"], correct: 1, explanation: "Variabilele pot stoca diverse tipuri de date: numere intregi (5, -3, 100), numere cu virgula (3.14, 2.5), text/siruri de caractere ('Ana', 'Salut'), si valori logice (Adevarat/Fals). Tipul depinde de ce vrei sa stochezi." }
            ]},
            3: { title: "Nivel 3: Atribuirea valorilor", description: "Invata cum se dau valori variabilelor", xpReward: 100, questions: [
                { text: "Ce face instructiunea 'a = 10'?", options: ["Verifica daca a este egal cu 10", "Pune (atribuie) valoarea 10 in variabila a", "Sterge variabila a", "Afiseaza 10 pe ecran"], correct: 1, explanation: "In algoritmi, 'a = 10' inseamna ATRIBUIRE: pune valoarea 10 in cutia numita 'a'. NU este o verificare de egalitate! Semnul '=' in programare inseamna 'primeste valoarea', nu 'este egal cu' (ca in matematica)." },
                { text: "Daca a = 5, apoi a = a + 3, cat este a la final?", options: ["5", "3", "8", "Eroare - nu poti scrie a = a + 3"], correct: 2, explanation: "Pas cu pas: 1) a = 5 (a contine 5). 2) a = a + 3 inseamna: ia valoarea veche a lui a (5), aduna 3 (5+3=8), pune rezultatul 8 inapoi in a. La final a = 8. Aceasta constructie (a = a + ceva) este foarte frecventa in programare!" },
                { text: "Daca x = 10 si y = 20, apoi z = x + y, cat este z?", options: ["10", "20", "30", "xy"], correct: 2, explanation: "x contine 10, y contine 20. z = x + y inseamna: ia valoarea lui x (10), aduna valoarea lui y (20), pune rezultatul (30) in z. Deci z = 30. Variabilele x si y raman neschimbate (tot 10 si 20)." }
            ]},
            4: { title: "Nivel 4: Expresii", description: "Invata despre expresii si operatii", xpReward: 125, questions: [
                { text: "Ce este o expresie in informatica?", options: ["Un cuvant sau o propozitie", "O combinatie de variabile, constante si operatori care produce o valoare", "Un tip de variabila", "O instructiune de afisare"], correct: 1, explanation: "O expresie este o combinatie de variabile, constante si operatori (+, -, *, /) care produce un rezultat. Exemple: 'a + b', '2 * x + 1', 'nota1 + nota2) / 2'. Expresiile sunt 'calculele' din algoritm." },
                { text: "Care sunt operatorii aritmetici de baza?", options: ["Doar + si -", "Adunare (+), scadere (-), inmultire (*), impartire (/)", "Doar inmultirea", "Doar comparatiile"], correct: 1, explanation: "Operatorii aritmetici de baza sunt: + (adunare), - (scadere), * (inmultire), / (impartire). In unele limbaje exista si % sau MOD (restul impartirii). Acesti operatori lucreaza cu numere si produc numere." },
                { text: "In expresia '2 * (a + b)', in ce ordine se fac calculele?", options: ["Inmultirea apoi adunarea", "Mai intai a + b (paranteza), apoi rezultatul se inmulteste cu 2", "Nu conteaza ordinea", "Se citeste de la dreapta la stanga"], correct: 1, explanation: "La fel ca in matematica, parantezele au prioritate! Mai intai se calculeaza ce e in paranteza (a + b), apoi rezultatul se inmulteste cu 2. Daca a=3 si b=4: mai intai 3+4=7, apoi 2*7=14." }
            ]},
            5: { title: "Nivel 5: Probleme cu variabile", description: "Testeaza-ti cunostintele complete", xpReward: 150, questions: [
                { text: "Cum interschimbi valorile a doua variabile a=5 si b=3 (a sa devina 3 si b sa devina 5)?", options: ["a = b apoi b = a", "Folosesti o variabila auxiliara: temp=a, a=b, b=temp", "Nu se poate face interschimbarea", "b = a apoi a = b"], correct: 1, explanation: "Ai nevoie de o variabila auxiliara (temp)! Pasii: 1) temp = a (temp=5), 2) a = b (a=3), 3) b = temp (b=5). Fara temp, daca faci direct a=b, pierzi valoarea veche a lui a. Este ca si cum ai muta apa din doua pahare - ai nevoie de un al treilea pahar!" },
                { text: "Daca a=2, b=3, c=4, cat este rezultatul expresiei: a * b + c?", options: ["10", "14", "24", "9"], correct: 0, explanation: "Aplicam regulile de prioritate (ca in matematica): mai intai inmultirea, apoi adunarea. a * b = 2 * 3 = 6. Apoi 6 + c = 6 + 4 = 10. Daca am fi vrut (b + c) mai intai, trebuia sa scriem a * (b + c) = 2 * 7 = 14." },
                { text: "Ce tip de variabila ai folosi pentru a stoca numele unui elev?", options: ["Numar intreg", "Numar cu virgula", "Sir de caractere (text)", "Valoare logica (adevarat/fals)"], correct: 2, explanation: "Numele unui elev (de exemplu 'Maria Ionescu') este un text, deci folosim o variabila de tip sir de caractere (string). Numerele intregi sunt pentru valori ca varsta (11), numerele cu virgula pentru note (9.50), iar valorile logice pentru da/nu." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m3_quiz5_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m3_quiz5_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='../index.html'">Inapoi la Modul</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

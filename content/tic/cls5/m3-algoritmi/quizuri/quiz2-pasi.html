<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Pasii Algoritmului | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 3</a>
        <div class="quiz-header">
            <div class="quiz-title">Quiz: Pasii Algoritmului</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: { title: "Nivel 1: Secventa de pasi", description: "Invata cum se organizeaza pasii unui algoritm", xpReward: 50, questions: [
                { text: "Ce inseamna 'executie secventiala' a pasilor unui algoritm?", options: ["Pasii se executa in ordine aleatoare", "Pasii se executa unul dupa altul, in ordinea scrisa", "Toti pasii se executa in acelasi timp", "Se executa doar ultimul pas"], correct: 1, explanation: "Executia secventiala inseamna ca pasii se executa unul dupa altul, in ordinea in care sunt scrisi. Pasul 1 se termina, apoi incepe Pasul 2, apoi Pasul 3, si asa mai departe. Este ca cititul unei carti - pagina cu pagina." },
                { text: "Intr-un algoritm, ce vine prima data?", options: ["Prelucrarea datelor", "Citirea (introducerea) datelor de intrare", "Afisarea rezultatului", "Verificarea solutiei"], correct: 1, explanation: "De obicei, un algoritm incepe prin citirea (primirea) datelor de intrare - informatiile cu care va lucra. Este ca la o reteta: mai intai aduni ingredientele (input), apoi le prelucrezi (gatesti), apoi servesti (output)." },
                { text: "Care este ordinea corecta a unui algoritm simplu de adunare?", options: ["Afiseaza suma, citeste numerele, calculeaza suma", "Citeste cele doua numere, calculeaza suma lor, afiseaza rezultatul", "Calculeaza suma, afiseaza, citeste numerele", "Nu conteaza ordinea"], correct: 1, explanation: "Ordinea corecta este: 1) Citeste cele doua numere (input), 2) Calculeaza suma lor (prelucrare), 3) Afiseaza rezultatul (output). Aceasta structura INPUT -> PRELUCRARE -> OUTPUT este fundamentala in algoritmi." }
            ]},
            2: { title: "Nivel 2: Input si Output", description: "Intelege datele de intrare si de iesire", xpReward: 75, questions: [
                { text: "In algoritmul 'calculeaza perimetrul unui dreptunghi', care sunt datele de intrare?", options: ["Perimetrul", "Lungimea si latimea dreptunghiului", "Formula perimetrului", "Numele dreptunghiului"], correct: 1, explanation: "Datele de intrare (input) sunt informatiile de care algoritmul are nevoie: lungimea si latimea dreptunghiului. Cu aceste valori poate calcula perimetrul folosind formula P = 2 * (L + l)." },
                { text: "In acelasi algoritm, care este data de iesire?", options: ["Lungimea", "Latimea", "Perimetrul calculat", "Formula"], correct: 2, explanation: "Data de iesire (output) este rezultatul calculului: perimetrul. Algoritmul primeste lungimea si latimea (input), aplica formula (prelucrare) si produce perimetrul (output)." },
                { text: "Ce este 'prelucrarea' intr-un algoritm?", options: ["Citirea datelor", "Operatiile si calculele efectuate asupra datelor de intrare", "Afisarea rezultatelor", "Introducerea parolei"], correct: 1, explanation: "Prelucrarea este partea din mijloc a algoritmului unde se fac calculele si operatiile asupra datelor de intrare. De exemplu: adunarea, inmultirea, compararea, sortarea. Este 'munca' propriu-zisa a algoritmului." }
            ]},
            3: { title: "Nivel 3: Tipuri de pasi", description: "Invata diferite tipuri de instructiuni", xpReward: 100, questions: [
                { text: "Ce este o 'instructiune de citire' intr-un algoritm?", options: ["O instructiune care afiseaza text pe ecran", "O instructiune care primeste date de la utilizator", "O instructiune care sterge date", "O instructiune care inchide programul"], correct: 1, explanation: "Instructiunea de citire (Read/Input) primeste date de la utilizator. De exemplu: 'Citeste numarul a' inseamna ca utilizatorul introduce o valoare care va fi stocata in variabila 'a'. Este modul prin care algoritmul 'asculta'." },
                { text: "Ce este o 'instructiune de scriere/afisare'?", options: ["O instructiune care citeste de la tastatura", "O instructiune care arata rezultatul pe ecran", "O instructiune care calculeaza", "O instructiune care asteapta"], correct: 1, explanation: "Instructiunea de scriere/afisare (Write/Print/Output) arata rezultatul pe ecran sau il trimite la un dispozitiv de iesire. De exemplu: 'Scrie suma' afiseaza valoarea sumei calculate." },
                { text: "Ce este o 'instructiune de atribuire'?", options: ["O instructiune care sterge o variabila", "O instructiune care da o valoare unei variabile (de exemplu: suma = a + b)", "O instructiune care citeste de la tastatura", "O instructiune care afiseaza pe ecran"], correct: 1, explanation: "Instructiunea de atribuire da o valoare unei variabile. De exemplu: 'suma = a + b' calculeaza a + b si stocheaza rezultatul in variabila 'suma'. Semnul '=' inseamna 'primeste valoarea', nu egalitate matematica." }
            ]},
            4: { title: "Nivel 4: Urmarirea algoritmilor", description: "Invata sa urmaresti executia pas cu pas", xpReward: 125, questions: [
                { text: "Algoritmul: Citeste a=5, b=3. Calculeaza suma=a+b. Scrie suma. Ce afiseaza?", options: ["5", "3", "8", "53"], correct: 2, explanation: "Urmarim pas cu pas: 1) a primeste valoarea 5, b primeste valoarea 3. 2) suma = a + b = 5 + 3 = 8. 3) Se afiseaza suma, adica 8. Urmarirea pas cu pas se numeste 'trace' si este foarte utila pentru verificarea algoritmilor." },
                { text: "Algoritmul: Citeste x=10. Calculeaza x=x+5. Scrie x. Ce afiseaza?", options: ["10", "5", "15", "Eroare"], correct: 2, explanation: "Urmarim: 1) x primeste valoarea 10. 2) x = x + 5 inseamna: ia valoarea veche a lui x (10), aduna 5, si pune rezultatul (15) inapoi in x. 3) Se afiseaza x, care acum este 15. Variabila x si-a schimbat valoarea!" },
                { text: "Algoritmul: Citeste a=7, b=2. Calculeaza c=a-b. Calculeaza d=a+b. Scrie c si d. Ce afiseaza?", options: ["7 si 2", "2 si 7", "5 si 9", "9 si 5"], correct: 2, explanation: "Urmarim: a=7, b=2. c = a - b = 7 - 2 = 5. d = a + b = 7 + 2 = 9. Se afiseaza c=5 si d=9. Observa ca a si b nu s-au schimbat - au fost doar folosite in calcule, nu modificate." }
            ]},
            5: { title: "Nivel 5: Probleme cu algoritmi", description: "Rezolva probleme folosind gandirea algoritmica", xpReward: 150, questions: [
                { text: "Vrei sa scrii un algoritm care calculeaza media a doua note. Care sunt pasii corecti?", options: ["Afiseaza media, citeste notele, calculeaza media", "Citeste nota1 si nota2, calculeaza media=(nota1+nota2)/2, afiseaza media", "Calculeaza media, citeste notele, afiseaza notele", "Citeste media, afiseaza nota1 si nota2"], correct: 1, explanation: "Ordinea corecta: 1) Citeste nota1 si nota2 (input). 2) Calculeaza media = (nota1 + nota2) / 2 (prelucrare). 3) Afiseaza media (output). Intotdeauna: mai intai primesti datele, apoi le prelucrezi, apoi afisezi rezultatul." },
                { text: "Algoritmul: Citeste a=12, b=4. Calculeaza rest = a - (a/b)*b. Scrie rest. Ce afiseaza?", options: ["3", "0", "4", "8"], correct: 1, explanation: "Calculam: a/b = 12/4 = 3 (12 se imparte exact la 4, fara rest fractionar). (a/b)*b = 3*4 = 12. rest = a - (a/b)*b = 12 - 12 = 0. Se afiseaza 0. Acest algoritm calculeaza restul impartirii lui 12 la 4 — care este 0, deoarece 4 intra exact de 3 ori in 12." },
                { text: "De ce este important sa testezi un algoritm cu mai multe seturi de date?", options: ["Nu este important, un singur test e suficient", "Pentru a te asigura ca functioneaza corect in toate cazurile, nu doar intr-unul", "Pentru a-l face mai lung", "Pentru ca asa cere profesorul"], correct: 1, explanation: "Testarea cu mai multe date verifica daca algoritmul functioneaza corect in diverse situatii: numere mari, numere mici, zero, numere negative etc. Un algoritm care functioneaza doar pentru un set de date nu este un algoritm bun (nu respecta proprietatea de generalitate)." }
            ]}
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];
        function loadProgress() { const s = localStorage.getItem('cls5_m3_quiz2_progress'); if (s) { const d = JSON.parse(s); totalXP = d.totalXP || 0; unlockedLevels = d.unlockedLevels || [1]; levelScores = d.levelScores || {}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m3_quiz2_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((n, i) => { const l = i+1; n.classList.remove('locked','active','completed'); if (levelScores[l] !== undefined) n.classList.add('completed'); else if (unlockedLevels.includes(l)) { if (l === Math.max(...unlockedLevels.filter(x => levelScores[x] === undefined))) n.classList.add('active'); } else n.classList.add('locked'); }); document.querySelectorAll('.level-connector').forEach((c, i) => { if (levelScores[i+1] !== undefined) c.classList.add('completed'); else c.classList.remove('completed'); }); }
        function selectLevel(level) { if (!unlockedLevels.includes(level)) return; currentLevel = level; currentQuestion = 0; score = 0; showLevelIntro(); }
        function showLevelIntro() { const l = levels[currentLevel]; document.getElementById('quizArea').innerHTML = `<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`; }
        function startLevel() { showQuestion(); }
        function showQuestion() { function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } const l = levels[currentLevel]; const q = l.questions[currentQuestion]; let dots = ''; for (let i = 0; i < l.questions.length; i++) dots += `<div class="progress-dot${i === currentQuestion ? ' current' : ''}"></div>`; let opts = ''; q.options.forEach((o, i) => { opts += `<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`; }); document.getElementById('quizArea').innerHTML = `<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`; }
        function selectAnswer(index) { const l = levels[currentLevel]; const q = l.questions[currentQuestion]; const opts = document.querySelectorAll('.option'); const fb = document.getElementById('feedback'); const nb = document.getElementById('nextBtn'); opts.forEach(o => o.style.pointerEvents = 'none'); opts[index].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index !== q.correct) opts[q.correct].classList.add('correct'); const d = document.querySelectorAll('.progress-dot'); d[currentQuestion].classList.remove('current'); d[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index === q.correct) { score++; fb.className = 'feedback-box show correct'; fb.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`; } else { fb.className = 'feedback-box show wrong'; fb.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`; } nb.style.display = 'inline-flex'; nb.textContent = currentQuestion < l.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul'; }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete(); else showQuestion(); }
        function showLevelComplete() { const l = levels[currentLevel]; const pct = Math.round((score / l.questions.length) * 100); const passed = pct >= 66; let stars = pct >= 100 ? '&#11088;&#11088;&#11088;' : pct >= 80 ? '&#11088;&#11088;' : pct >= 66 ? '&#11088;' : '&#128170;'; let earnedXP = 0; if (passed) { earnedXP = l.xpReward; if (pct === 100) earnedXP = Math.round(earnedXP * 1.5); if (!levelScores[currentLevel] || levelScores[currentLevel] < pct) { if (!levelScores[currentLevel]) totalXP += earnedXP; levelScores[currentLevel] = pct; } if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1); saveProgress(); updateXPDisplay(); updateLevelMap(); } document.getElementById('quizArea').innerHTML = `<div class="level-complete show"><div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div><h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz3-reprezentare.html'">Quiz-ul 3: Reprezentare</button>` : ''}</div></div>`; }
        loadProgress(); showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

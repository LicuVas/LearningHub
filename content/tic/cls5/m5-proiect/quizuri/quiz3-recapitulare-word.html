<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Sisteme de Operare | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }
    </style>

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Sisteme de Operare</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        // Quiz 3 - Recapitulare Sisteme de Operare
        // Ancorat in programa OMEN 3393/2017, clasa a V-a:
        // Domeniu: "Sisteme de operare" - Rolul unui sistem de operare,
        // Elemente de interfata, Organizarea datelor pe suport extern,
        // Operatii cu fisiere si directoare.
        // Competente: V-1.1 (hardware eficient), V-1.2 (software eficient).

        const levels = {
            1: {
                title: "Nivel 1: Ce este sistemul de operare?",
                description: "Rolul si importanta sistemului de operare",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un sistem de operare?",
                        options: [
                            "Un program pentru desenat",
                            "Software-ul de baza care gestioneaza resursele calculatorului si permite rularea altor programe",
                            "Un dispozitiv hardware de stocare",
                            "Un browser de internet"
                        ],
                        correct: 1,
                        explanation: "Sistemul de operare (SO) este software-ul fundamental care controleaza hardware-ul calculatorului si ofera un mediu in care pot rula celelalte programe. Fara SO, calculatorul nu poate fi folosit. Exemple: Windows, Linux, macOS."
                    },
                    {
                        text: "Care dintre urmatoarele este un exemplu de sistem de operare?",
                        options: [
                            "Microsoft Word",
                            "Paint",
                            "Windows 10",
                            "Mozilla Firefox"
                        ],
                        correct: 2,
                        explanation: "Windows 10 este un sistem de operare dezvoltat de Microsoft. Word, Paint si Firefox sunt programe de aplicatii care ruleaza PE sistemul de operare, nu sunt ele insele sisteme de operare."
                    },
                    {
                        text: "Care este ROLUL principal al unui sistem de operare?",
                        options: [
                            "Sa editeze fotografii",
                            "Sa gestioneze resursele hardware si sa permita rularea programelor",
                            "Sa navigheze pe internet",
                            "Sa salveze documente"
                        ],
                        correct: 1,
                        explanation: "Rolul principal al SO este sa gestioneze toate resursele calculatorului (procesor, memorie, dispozitive) si sa ofere un mediu controlat in care programele pot rula in siguranta."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Interfata sistemului de operare",
                description: "Elementele vizuale ale sistemului de operare",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este Desktop-ul (ecranul de start) in Windows?",
                        options: [
                            "Un program de calcul",
                            "Suprafata de lucru principala afisata dupa pornirea calculatorului",
                            "Un tip de fisier",
                            "O componenta hardware"
                        ],
                        correct: 1,
                        explanation: "Desktop-ul este suprafata de lucru principala a sistemului de operare, afisata dupa pornire. Pe el gasesti pictograme (icoane) ale programelor si fisierelor, bara de activitati (taskbar) si butonul Start."
                    },
                    {
                        text: "Ce este bara de activitati (taskbar) in Windows?",
                        options: [
                            "Un sertar fizic al calculatorului",
                            "Bara orizontala (de obicei jos) care arata programele deschise si butonul Start",
                            "Un folder special pentru fisiere",
                            "Un program de editare"
                        ],
                        correct: 1,
                        explanation: "Taskbar-ul este bara orizontala din josul ecranului (implicit) care contine: butonul Start (pentru meniuri), pictogramele programelor fixate, lista programelor deschise si ceasul/notificarile in dreapta."
                    },
                    {
                        text: "Ce reprezinta o pictograma (icoana) pe Desktop?",
                        options: [
                            "Un virus informatic",
                            "O imagine decorativa fara functie",
                            "Un simbol vizual care reprezinta un program, fisier sau folder",
                            "Un buton fizic al calculatorului"
                        ],
                        correct: 2,
                        explanation: "O pictograma (icoana) este un simbol grafic mic care reprezinta un program, fisier, folder sau shortcut. Dublu-click pe pictograma deschide elementul respectiv."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Organizarea datelor - fisiere si directoare",
                description: "Cum sunt organizate datele pe calculator",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este un fisier (file) pe calculator?",
                        options: [
                            "Un sertar fizic",
                            "O colectie de date stocate sub un nume, pe un suport de stocare",
                            "Un program de calculat",
                            "O piesa hardware"
                        ],
                        correct: 1,
                        explanation: "Un fisier este o colectie de informatii (date) salvate impreuna sub un singur nume, pe un suport de stocare (HDD, SSD, USB etc.). Fisierele pot contine texte, imagini, muzica, programe etc."
                    },
                    {
                        text: "Ce este un dosar (folder/director)?",
                        options: [
                            "Un fisier foarte mare",
                            "Un container virtual care poate contine fisiere si alte dosare, pentru organizare",
                            "Un program de sistem",
                            "O unitate de masura a memoriei"
                        ],
                        correct: 1,
                        explanation: "Un dosar (folder sau director) este un container logic care grupeaza fisiere si alte dosare. Ajuta la organizarea datelor - ca un sertar intr-un dulap. De exemplu: dosarul 'Poze' contine fisierele cu imagini."
                    },
                    {
                        text: "Ce este extensia unui fisier (de exemplu .jpg, .mp3)?",
                        options: [
                            "Numele complet al fisierului",
                            "Sufixul de dupa punct care indica tipul si formatul fisierului",
                            "Dimensiunea fisierului",
                            "Locul unde e salvat fisierul"
                        ],
                        correct: 1,
                        explanation: "Extensia este sufixul de la sfarsitul numelui fisierului, dupa punct. Indica tipul de continut: .jpg/.png = imagine, .mp3/.wav = audio, .txt = text simplu, .exe = program executabil. SO foloseste extensia ca sa stie ce program sa deschida fisierul."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Operatii cu fisiere si directoare",
                description: "Cum gestionezi fisierele si dosarele",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce face operatia de COPIERE a unui fisier?",
                        options: [
                            "Muta fisierul in alta locatie si il sterge din locatia originala",
                            "Creeaza un duplicat al fisierului in alta locatie, originalul ramane",
                            "Sterge fisierul definitiv",
                            "Redenumeste fisierul"
                        ],
                        correct: 1,
                        explanation: "Copierea (Copy - Ctrl+C, Paste - Ctrl+V) creeaza o copie identica a fisierului in alta locatie. Fisierul original ramane neatins. Dupa copiere, exista doua fisiere identice in locatii diferite."
                    },
                    {
                        text: "Ce face operatia de MUTARE (Move) a unui fisier?",
                        options: [
                            "Creeaza o copie in alta locatie, originalul ramane",
                            "Transfera fisierul in alta locatie, din locatia originala disparand",
                            "Sterge fisierul",
                            "Comprima fisierul"
                        ],
                        correct: 1,
                        explanation: "Mutarea (Cut - Ctrl+X, Paste - Ctrl+V) transfera fisierul dintr-o locatie in alta. Spre deosebire de copiere, fisierul NU mai ramane in locatia originala. Dupa mutare, fisierul exista doar in noua locatie."
                    },
                    {
                        text: "Cum redenumesti un fisier sau dosar in Windows?",
                        options: [
                            "Il stergi si recreezi cu alt nume",
                            "Click dreapta pe fisier > Rename (Redenumire), sau selectezi si apesi F2",
                            "Il deschizi si salvezi cu alt nume",
                            "Nu se poate redenumi"
                        ],
                        correct: 1,
                        explanation: "Redenumirea: click dreapta pe fisier/dosar si alege 'Rename' (sau selecteaza si apasa F2), tastezi noul nume, confirmi cu Enter. Atentie: nu schimba extensia daca nu stii ce faci!"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Organizarea eficienta a datelor",
                description: "Strategii si bune practici de organizare",
                xpReward: 150,
                questions: [
                    {
                        text: "De ce este important sa organizezi fisierele in dosare (foldere)?",
                        options: [
                            "Nu este important, calculatorul le gaseste oricum",
                            "Pentru a gasi rapid fisierele, a evita dezordinea si a proteja datele importante",
                            "Doar pentru a ocupa mai putin spatiu",
                            "Dosarele incetinesc calculatorul"
                        ],
                        correct: 1,
                        explanation: "Organizarea in dosare este esentiala: gasesti rapid ce cauti (nu trebuie sa rascolesti sute de fisiere), mentii ordinea pe disc, faci backup mai usor si eviti stergerea accidentala a fisierelor importante."
                    },
                    {
                        text: "Care este o conventie buna pentru denumirea fisierelor?",
                        options: [
                            "Foloseste spatii multe si caractere speciale (@ # $ %)",
                            "Lasa fisierele fara nume (doar extensie)",
                            "Foloseste nume clare, descriptive, fara spatii sau caractere speciale (ex: tema_geografie_cls5.jpg)",
                            "Pune doar data in nume (ex: 2025)"
                        ],
                        correct: 2,
                        explanation: "Conventii bune: nume descriptiv (sa stii ce contine), fara spatii (foloseste _ sau -), fara caractere speciale (@ # $ &), extensia corecta. Exemplu bun: referat_ecosisteme_cls5_2025.txt. Evita: 'fisier1.jpg', 'asdf.png'."
                    },
                    {
                        text: "Ce se intampla cu un fisier sters (mutat in Cos de Reciclare / Recycle Bin)?",
                        options: [
                            "Este sters definitiv si nu mai poate fi recuperat",
                            "Este mutat temporar in Cosul de Reciclare si poate fi restaurat inainte de golirea cosului",
                            "Este copiat automat pe internet",
                            "Este comprimat si pastrat pe disc"
                        ],
                        correct: 1,
                        explanation: "Cand stergi un fisier (tasta Delete), acesta nu dispare imediat, ci este mutat in Cosul de Reciclare (Recycle Bin). De acolo il poti restaura (click dreapta > Restore) sau sterge definitiv (golind cosul). Stergerea definitiva (Shift+Delete) sare peste cos."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('m5_quiz3_os_progress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    totalXP = data.totalXP || 0;
                    unlockedLevels = data.unlockedLevels || [1];
                    levelScores = data.levelScores || {};
                    updateXPDisplay();
                    updateLevelMap();
                } catch (e) {
                    console.warn('Eroare la incarcarea progresului salvat:', e);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem('m5_quiz3_os_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect! Foarte bine!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar... Iata raspunsul:</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-recapitulare-internet.html'">
                                Quiz-ul 4: Recapitulare Internet
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

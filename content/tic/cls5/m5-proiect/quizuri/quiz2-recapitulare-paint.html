<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Paint | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Paint</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Introducere in Paint",
                description: "Ce este Paint si cum il deschidem",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este Microsoft Paint?",
                        options: [
                            "Un program pentru scris texte",
                            "Un program pentru desenat si editat imagini",
                            "Un browser de internet",
                            "Un joc pe calculator"
                        ],
                        correct: 1,
                        explanation: "Microsoft Paint este un program simplu de grafica pentru desenat si editat imagini. Vine instalat gratuit cu Windows si e perfect pentru incepatori!"
                    },
                    {
                        text: "Cum poti deschide Paint pe Windows?",
                        options: [
                            "Apesi pe orice fisier",
                            "Cauti 'Paint' in bara de cautare din Start",
                            "Inchizi calculatorul",
                            "Apesi tasta Enter"
                        ],
                        correct: 1,
                        explanation: "Cel mai simplu: apasa butonul Start, scrie 'Paint' in casuta de cautare si apasa Enter. Paint se va deschide imediat!"
                    },
                    {
                        text: "Ce vezi cand deschizi Paint?",
                        options: [
                            "O pagina cu multe texte",
                            "O panza alba si instrumente de desenat",
                            "Un film",
                            "Un joc"
                        ],
                        correct: 1,
                        explanation: "Paint se deschide cu o panza alba (canvas) unde poti desena, si o bara cu instrumente (pensule, forme, culori) in partea de sus."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Instrumentele de baza",
                description: "Pensula, creionul si radiera",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce instrument folosesti pentru a desena linii libere in Paint?",
                        options: [
                            "Instrumentul Text",
                            "Pensula sau Creionul",
                            "Instrumentul Selectare",
                            "Galeata cu vopsea"
                        ],
                        correct: 1,
                        explanation: "Pensula si Creionul sunt pentru desenat linii libere. Creionul face linii subtiri, pensula poate avea diferite grosimi si forme."
                    },
                    {
                        text: "Ce face instrumentul 'Radiera' (Eraser)?",
                        options: [
                            "Coloreaza tot ecranul",
                            "Sterge parti din desen",
                            "Adauga text",
                            "Salveaza imaginea"
                        ],
                        correct: 1,
                        explanation: "Radiera (Eraser) sterge parti din desen. Functioneaza ca o radiera adevarata - treci peste ce vrei sa stergi si dispare!"
                    },
                    {
                        text: "Cum poti schimba grosimea pensulei?",
                        options: [
                            "Nu se poate schimba",
                            "Din optiunile 'Size' (Marime) din bara de instrumente",
                            "Apasand tasta Enter",
                            "Inchizand si redeschizand Paint"
                        ],
                        correct: 1,
                        explanation: "In bara de instrumente gasesti optiunea 'Size' (Marime) unde poti alege grosimea pensulei - de la foarte subtire la foarte groasa."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Forme si culori",
                description: "Deseneaza forme perfecte si alege culori",
                xpReward: 100,
                questions: [
                    {
                        text: "Cum desenezi un cerc perfect in Paint?",
                        options: [
                            "Desenezi de mana libera",
                            "Selectezi forma 'Oval' si tii apasat Shift",
                            "Apesi tasta C",
                            "Nu se poate desena cerc"
                        ],
                        correct: 1,
                        explanation: "Selecteaza forma Oval din bara de instrumente, apoi tine apasat tasta Shift in timp ce tragi. Shift face ca ovalul sa devina un cerc perfect!"
                    },
                    {
                        text: "Cum umpli o forma cu culoare?",
                        options: [
                            "Colorezi cu pensula pe interior",
                            "Folosesti instrumentul 'Fill with color' (Galeata)",
                            "Apesi tasta F",
                            "Selectezi forma si apesi Delete"
                        ],
                        correct: 1,
                        explanation: "Instrumentul 'Fill with color' (galeata cu vopsea) umple instantaneu o zona inchisa cu culoarea selectata. Click in interiorul formei!"
                    },
                    {
                        text: "Unde gasesti paleta de culori in Paint?",
                        options: [
                            "In meniul File",
                            "In partea dreapta a barei de instrumente",
                            "Nu exista paleta de culori",
                            "Trebuie descarcata separat"
                        ],
                        correct: 1,
                        explanation: "Paleta de culori este in partea dreapta a barei de instrumente. Click pe o culoare pentru a o selecta, sau foloseste 'Edit colors' pentru culori personalizate."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Selectare si editare",
                description: "Muta, copiaza si modifica parti din desen",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce face instrumentul 'Select' (Selectare)?",
                        options: [
                            "Sterge totul",
                            "Permite sa selectezi o parte din desen pentru a o muta sau copia",
                            "Schimba culoarea",
                            "Salveaza fisierul"
                        ],
                        correct: 1,
                        explanation: "Select iti permite sa incadrezi o zona din desen. Apoi poti muta, copia, taia sau sterge doar acea zona, fara sa afectezi restul."
                    },
                    {
                        text: "Cum copiezi o parte din desen?",
                        options: [
                            "Apesi Ctrl + C dupa ce ai selectat zona",
                            "Apesi tasta Delete",
                            "Inchizi Paint",
                            "Desenezi din nou"
                        ],
                        correct: 0,
                        explanation: "Dupa ce selectezi zona: Ctrl + C (Copy) copiaza, apoi Ctrl + V (Paste) lipeste o copie. Poti muta copia oriunde in desen!"
                    },
                    {
                        text: "Ce combinatie de taste anuleaza ultima actiune (Undo)?",
                        options: [
                            "Ctrl + S",
                            "Ctrl + Z",
                            "Ctrl + P",
                            "Ctrl + N"
                        ],
                        correct: 1,
                        explanation: "Ctrl + Z este Undo - anuleaza ultima actiune. Foarte util cand faci o greseala! Poti apasa de mai multe ori pentru a anula mai multe actiuni."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Salvare si formate",
                description: "Salveaza-ti creatiile corect",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este cel mai bun format pentru o poza cu multe culori?",
                        options: [
                            ".txt",
                            ".png sau .jpg",
                            ".doc",
                            ".mp3"
                        ],
                        correct: 1,
                        explanation: "PNG si JPG sunt formate de imagine. PNG pastreaza calitatea perfecta, JPG e mai mic ca marime. Ambele sunt potrivite pentru desene colorate."
                    },
                    {
                        text: "Cum salvezi un desen in Paint?",
                        options: [
                            "Inchizi Paint direct",
                            "File > Save sau Ctrl + S",
                            "Apesi tasta Delete",
                            "Desenezi mai mult"
                        ],
                        correct: 1,
                        explanation: "File > Save (sau Ctrl + S) salveaza desenul. Prima data vei alege un nume si o locatie. Apoi, Ctrl + S salveaza modificarile in acelasi fisier."
                    },
                    {
                        text: "Ce se intampla daca inchizi Paint fara sa salvezi?",
                        options: [
                            "Desenul se salveaza automat",
                            "Pierzi tot ce ai desenat",
                            "Se trimite pe email",
                            "Se printeaza automat"
                        ],
                        correct: 1,
                        explanation: "Daca inchizi fara sa salvezi, pierzi munca! Paint te intreaba daca vrei sa salvezi - alege 'Save' pentru a pastra desenul tau."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('m5_quiz2_paint_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('m5_quiz2_paint_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Iata explicatia:</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-recapitulare-word.html'">
                                Quiz-ul 3: Recapitulare Word
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

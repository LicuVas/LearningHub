<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Calculator | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
    </head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Calculator</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>

    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Componentele calculatorului",
                description: "Recapitulare despre partile principale ale unui calculator",
                xpReward: 50,
                questions: [
                    {
                        text: "Care este 'creierul' calculatorului care proceseaza toate informatiile?",
                        options: [
                            "Monitorul",
                            "Procesorul (CPU)",
                            "Tastatura",
                            "Boxele"
                        ],
                        correct: 1,
                        explanation: "Procesorul (CPU - Central Processing Unit) este creierul calculatorului. El proceseaza toate datele si instructiunile, facand calculatorul sa functioneze."
                    },
                    {
                        text: "Ce componenta afiseaza imaginile pe ecran?",
                        options: [
                            "Tastatura",
                            "Mouse-ul",
                            "Monitorul",
                            "Imprimanta"
                        ],
                        correct: 2,
                        explanation: "Monitorul este dispozitivul de iesire care afiseaza imagini, text si video. Fara monitor, nu am putea vedea ce face calculatorul."
                    },
                    {
                        text: "Care dispozitiv este folosit pentru a introduce text in calculator?",
                        options: [
                            "Tastatura",
                            "Monitorul",
                            "Boxele",
                            "Camera web"
                        ],
                        correct: 0,
                        explanation: "Tastatura este dispozitivul principal pentru introducerea textului. Are taste pentru litere, cifre, simboluri si comenzi speciale."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Hardware vs Software",
                description: "Diferenta dintre componentele fizice si programele de calculator",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este HARDWARE-ul?",
                        options: [
                            "Programele instalate pe calculator",
                            "Partile fizice ale calculatorului pe care le poti atinge",
                            "Jocurile de pe calculator",
                            "Fisierele salvate"
                        ],
                        correct: 1,
                        explanation: "Hardware-ul reprezinta toate componentele fizice ale calculatorului: monitor, tastatura, mouse, procesor, etc. Sunt lucruri pe care le poti vedea si atinge."
                    },
                    {
                        text: "Ce este SOFTWARE-ul?",
                        options: [
                            "Cablurile calculatorului",
                            "Carcasa calculatorului",
                            "Programele si aplicatiile care ruleaza pe calculator",
                            "Bateria laptopului"
                        ],
                        correct: 2,
                        explanation: "Software-ul cuprinde toate programele si aplicatiile: Windows, Word, jocuri, browsere. Nu le poti atinge, dar fac calculatorul util."
                    },
                    {
                        text: "Microsoft Word este un exemplu de:",
                        options: [
                            "Hardware",
                            "Software",
                            "Dispozitiv de intrare",
                            "Cablu"
                        ],
                        correct: 1,
                        explanation: "Microsoft Word este un program (software) pentru editarea documentelor. Nu este o componenta fizica, ci o aplicatie care ruleaza pe calculator."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Dispozitive de intrare si iesire",
                description: "Invatam despre dispozitivele INPUT si OUTPUT",
                xpReward: 100,
                questions: [
                    {
                        text: "Care dintre urmatoarele este un dispozitiv de INTRARE (INPUT)?",
                        options: [
                            "Monitorul",
                            "Imprimanta",
                            "Mouse-ul",
                            "Boxele"
                        ],
                        correct: 2,
                        explanation: "Mouse-ul este dispozitiv de intrare - trimite informatii CATRE calculator. Dispozitivele de intrare ne permit sa comunicam cu calculatorul."
                    },
                    {
                        text: "Care dintre urmatoarele este un dispozitiv de IESIRE (OUTPUT)?",
                        options: [
                            "Tastatura",
                            "Microfonul",
                            "Scanner-ul",
                            "Imprimanta"
                        ],
                        correct: 3,
                        explanation: "Imprimanta este dispozitiv de iesire - primeste informatii DE LA calculator si le printeaza pe hartie. Dispozitivele de iesire ne arata rezultatele."
                    },
                    {
                        text: "Camera web este un dispozitiv de:",
                        options: [
                            "Iesire (Output)",
                            "Intrare (Input)",
                            "Stocare",
                            "Procesare"
                        ],
                        correct: 1,
                        explanation: "Camera web este dispozitiv de intrare - capteaza imagini video si le trimite catre calculator pentru a fi procesate sau transmise."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Memoria si stocarea",
                description: "Unde pastreaza calculatorul informatiile",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este memoria RAM?",
                        options: [
                            "Memoria permanenta unde salvezi fisierele",
                            "Memoria temporara folosita cand calculatorul este pornit",
                            "Un tip de hard disk",
                            "O placa video"
                        ],
                        correct: 1,
                        explanation: "RAM (Random Access Memory) este memoria temporara. Pastreaza datele programelor care ruleaza, dar se sterge cand opresti calculatorul."
                    },
                    {
                        text: "Unde sunt salvate permanent fisierele tale (poze, documente)?",
                        options: [
                            "In memoria RAM",
                            "In procesor",
                            "Pe hard disk (HDD) sau SSD",
                            "In monitor"
                        ],
                        correct: 2,
                        explanation: "Hard disk-ul (HDD) sau SSD-ul este memoria permanenta. Aici sunt salvate Windows, programele si toate fisierele tale, chiar si cand calculatorul este oprit."
                    },
                    {
                        text: "Un stick USB este folosit pentru:",
                        options: [
                            "A conecta monitorul",
                            "A stoca si transporta fisiere",
                            "A alimenta calculatorul cu curent",
                            "A conecta la internet"
                        ],
                        correct: 1,
                        explanation: "Stick-ul USB este un dispozitiv portabil de stocare. Poti salva fisiere pe el si le poti duce la alt calculator - foarte util pentru teme si proiecte!"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Sistemul de operare",
                description: "Programul care face calculatorul sa functioneze",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce este sistemul de operare?",
                        options: [
                            "Un joc pe calculator",
                            "Programul principal care controleaza tot calculatorul",
                            "O imprimanta",
                            "Un tip de memorie"
                        ],
                        correct: 1,
                        explanation: "Sistemul de operare (ex: Windows) este programul principal care porneste primul si controleaza toate celelalte programe si componentele calculatorului."
                    },
                    {
                        text: "Care dintre urmatoarele este un sistem de operare?",
                        options: [
                            "Microsoft Word",
                            "Google Chrome",
                            "Windows 11",
                            "Paint"
                        ],
                        correct: 2,
                        explanation: "Windows 11 este un sistem de operare. Alte exemple: Windows 10, macOS (pentru Mac), Linux. Word, Chrome si Paint sunt aplicatii care ruleaza PE sistemul de operare."
                    },
                    {
                        text: "Ce se intampla cand pornesti calculatorul?",
                        options: [
                            "Se deschide direct Word",
                            "Se incarca sistemul de operare (Windows)",
                            "Se printeaza o pagina",
                            "Se conecteaza la televizor"
                        ],
                        correct: 1,
                        explanation: "La pornire, calculatorul incarca sistemul de operare (Windows) in memoria RAM. Dupa ce Windows porneste, poti deschide programele tale preferate."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('m5_quiz1_pc_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('m5_quiz1_pc_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Bravo!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Hai sa invatam!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-recapitulare-paint.html'">
                                Quiz-ul 2: Recapitulare Paint
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

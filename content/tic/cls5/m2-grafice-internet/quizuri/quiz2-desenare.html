<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Instrumente de Desenare | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-secondary); border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border); }
        .quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

        .level-map { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .level-node { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: all 0.3s; position: relative; border: 3px solid var(--border); background: var(--bg-card); }
        .level-node.locked { opacity: 0.5; cursor: not-allowed; }
        .level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }
        .level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }
        .level-node.completed { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); border-color: var(--accent-green); }
        .level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .level-connector { width: 30px; height: 3px; background: var(--border); align-self: center; }
        .level-connector.completed { background: var(--accent-green); }

        .quiz-area { background: var(--bg-secondary); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); min-height: 400px; }
        .level-intro { text-align: center; padding: 2rem; }
        .level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }
        .level-intro p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; }
        .level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

        .question-container { display: none; }
        .question-container.active { display: block; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        .question-progress { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
        .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
        .progress-dot.current { background: var(--accent-blue); }
        .progress-dot.correct { background: var(--accent-green); }
        .progress-dot.wrong { background: var(--accent-red); }

        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }

        .options-grid { display: grid; gap: 1rem; margin-top: 1.5rem; }
        .option { padding: 1.2rem 1.5rem; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; }
        .option:hover { border-color: var(--accent-purple); transform: translateX(5px); }
        .option.selected { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); }
        .option.correct { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.2); }
        .option.wrong { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }

        .feedback-box { display: none; padding: 1.5rem; border-radius: 12px; margin-top: 1.5rem; text-align: center; }
        .feedback-box.show { display: block; animation: fadeIn 0.3s ease; }
        .feedback-box.correct { background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); }
        .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--accent-red); }
        .feedback-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .feedback-text { font-size: 1.1rem; margin-bottom: 1rem; }
        .explanation { font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-top: 1rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .btn-success { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .level-complete { display: none; text-align: center; padding: 3rem; }
        .level-complete.show { display: block; animation: celebrate 0.5s ease; }
        @keyframes celebrate { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        .level-complete-icon { font-size: 5rem; margin-bottom: 1rem; }
        .level-complete h2 { font-size: 2rem; color: var(--accent-green); margin-bottom: 1rem; }
        .xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
        .score-display { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
        .stars { font-size: 3rem; margin: 1rem 0; }

        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-cyan); }

        @media (max-width: 600px) { .container { padding: 1rem; } .quiz-header { flex-direction: column; gap: 1rem; } .level-node { width: 50px; height: 50px; font-size: 1.2rem; } .question-text { font-size: 1.1rem; } }

        footer { margin-top: 3rem; padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 2</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Instrumente de Desenare</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>

    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        const levels = {
            1: {
                title: "Nivel 1: Creionul si pensula",
                description: "Invata despre instrumentele de baza pentru desenare",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce face instrumentul 'Pencil' (Creion) in Paint?",
                        options: [
                            "Sterge parti din desen",
                            "Deseneaza linii subtiri cu mana libera",
                            "Coloreaza zone mari",
                            "Insereaza text"
                        ],
                        correct: 1,
                        explanation: "Creionul (Pencil) deseneaza linii subtiri cu mana libera. Tii apasat butonul stang al mouse-ului si misti cursorul pentru a desena. Este cel mai simplu instrument de desenare."
                    },
                    {
                        text: "Care este diferenta principala dintre Creion si Pensula (Brush)?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Pensula poate avea diferite forme si grosimi, creionul face doar linii subtiri",
                            "Creionul e colorat, pensula e alb-negru",
                            "Pensula functioneaza doar cu click dreapta"
                        ],
                        correct: 1,
                        explanation: "Pensula (Brush) poate avea diferite forme (rotunda, patrata, diagonala) si grosimi, creand efecte artistice variate. Creionul face doar linii subtiri de 1 pixel."
                    },
                    {
                        text: "Cum schimbi grosimea pensulei in Paint?",
                        options: [
                            "Nu se poate schimba",
                            "Din optiunea 'Size' (Dimensiune) din bara de instrumente",
                            "Apasand tasta G",
                            "Dand dublu-click pe pensula"
                        ],
                        correct: 1,
                        explanation: "Grosimea pensulei se schimba din optiunea 'Size' (Dimensiune) din bara de instrumente. Poti alege intre mai multe grosimi predefinite."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Forme geometrice",
                description: "Descopera cum desenezi forme in Paint",
                xpReward: 75,
                questions: [
                    {
                        text: "Cum desenezi un dreptunghi in Paint?",
                        options: [
                            "Il desenezi cu creionul, punct cu punct",
                            "Selectezi instrumentul Rectangle, apoi tragi cu mouse-ul pe canvas",
                            "Scrii comanda 'rectangle' in bara de cautare",
                            "Apesi tasta R de doua ori"
                        ],
                        correct: 1,
                        explanation: "Selectezi instrumentul Rectangle (Dreptunghi) din sectiunea Shapes (Forme), apoi faci click si tragi pe suprafata de desenare. Se creeaza automat un dreptunghi."
                    },
                    {
                        text: "Cum desenezi un patrat perfect (nu un dreptunghi) in Paint?",
                        options: [
                            "Folosesti un instrument special pentru patrat",
                            "Tii apasata tasta Shift in timp ce desenezi un dreptunghi",
                            "Desenezi cu ochiul liber",
                            "Nu se poate desena un patrat perfect"
                        ],
                        correct: 1,
                        explanation: "Tinand apasata tasta Shift in timp ce desenezi un dreptunghi, forma devine un patrat perfect. Acelasi truc functioneaza si pentru cerc (Shift + Oval)."
                    },
                    {
                        text: "Ce tipuri de contur poti alege pentru o forma in Paint?",
                        options: [
                            "Doar contur simplu",
                            "Fara contur, doar contur, contur cu umplere, sau doar umplere",
                            "Doar cu umplere",
                            "Doar punctat"
                        ],
                        correct: 1,
                        explanation: "In Paint poti alege mai multe stiluri pentru forme: fara contur, doar contur (Outline), contur cu umplere (Outline + Fill), sau doar umplere fara contur. Le gasesti in optiunea 'Outline' si 'Fill'."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Linii si curbe",
                description: "Invata sa desenezi linii si curbe precise",
                xpReward: 100,
                questions: [
                    {
                        text: "Cum desenezi o linie dreapta in Paint?",
                        options: [
                            "Cu instrumentul Pencil",
                            "Selectezi instrumentul Line, faci click si tragi",
                            "Apesi tasta L",
                            "Desenezi cu Brush pe o rigla"
                        ],
                        correct: 1,
                        explanation: "Instrumentul Line (Linie) iti permite sa desenezi linii drepte. Faci click pe punctul de start, tii apasat si tragi pana la punctul final. Cu Shift apasata, linia va fi orizontala, verticala sau la 45 de grade."
                    },
                    {
                        text: "Ce face instrumentul 'Curve' (Curba) in Paint?",
                        options: [
                            "Deseneaza cercuri",
                            "Deseneaza o linie pe care o poti curba tragand cu mouse-ul",
                            "Roteste imaginea",
                            "Deseneaza spirale automat"
                        ],
                        correct: 1,
                        explanation: "Instrumentul Curve (Curba) iti permite sa desenezi o linie si apoi sa o curbezi. Mai intai desenezi linia, apoi faci click si tragi pentru a o indoi. Poti face doua curbari."
                    },
                    {
                        text: "Cum desenezi o linie perfect orizontala cu instrumentul Line?",
                        options: [
                            "Desenezi cu grija, cu mana foarte stabila",
                            "Tii apasata tasta Shift in timp ce tragi linia",
                            "Apesi tasta H inainte",
                            "Folosesti instrumentul Ruler"
                        ],
                        correct: 1,
                        explanation: "Tinand apasata tasta Shift in timp ce desenezi o linie, aceasta devine perfect orizontala, verticala, sau la un unghi de 45 de grade. Este un truc foarte util!"
                    }
                ]
            },
            4: {
                title: "Nivel 4: Umplerea si stergerea",
                description: "Invata despre Fill si Eraser",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce face instrumentul 'Fill with color' (Umplere cu culoare)?",
                        options: [
                            "Coloreaza tot desenul intr-o singura culoare",
                            "Umple o zona inchisa cu culoarea selectata",
                            "Schimba culoarea pensulei",
                            "Amesteca doua culori"
                        ],
                        correct: 1,
                        explanation: "Instrumentul Fill (Galeata de culoare) umple o zona inchisa cu culoarea selectata (Color 1). Zona trebuie sa fie complet inchisa, altfel culoarea se va scurge in afara!"
                    },
                    {
                        text: "Ce se intampla daca folosesti Fill pe o zona care nu este complet inchisa?",
                        options: [
                            "Nu se intampla nimic",
                            "Culoarea se raspandeste in toata imaginea prin spatiul deschis",
                            "Paint inchide automat zona",
                            "Apare un mesaj de eroare"
                        ],
                        correct: 1,
                        explanation: "Daca zona nu este complet inchisa (are o mica deschidere), culoarea 'se scurge' prin acea deschidere si coloreaza si zonele din jur. De aceea este important sa inchizi bine contururile!"
                    },
                    {
                        text: "Ce face instrumentul 'Eraser' (Radiera)?",
                        options: [
                            "Sterge tot desenul",
                            "Sterge parti din desen, inlocuindu-le cu culoarea de fundal (Color 2)",
                            "Anuleaza ultima actiune",
                            "Sterge doar contururile"
                        ],
                        correct: 1,
                        explanation: "Radiera (Eraser) sterge parti din desen inlocuindu-le cu culoarea de fundal (Color 2, de obicei alb). Poti schimba dimensiunea radierei din optiunea Size."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Combinatii si tehnici",
                description: "Testeaza-ti cunostintele avansate de desenare",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este ordinea corecta pentru a desena o casa colorata in Paint?",
                        options: [
                            "Colorezi, apoi desenezi conturul",
                            "Desenezi conturul (forme + linii), apoi colorezi cu Fill",
                            "Folosesti doar pensula",
                            "Importi o imagine de casa"
                        ],
                        correct: 1,
                        explanation: "Ordinea corecta este: mai intai desenezi conturul (peretii cu Rectangle, acoperisul cu Line/Triangle), apoi colorezi cu Fill. Asa te asiguri ca zonele sunt inchise si culorile nu se amesteca."
                    },
                    {
                        text: "Ce instrument folosesti pentru a adauga text pe un desen?",
                        options: [
                            "Pencil (Creion)",
                            "Text tool (instrumentul Text - litera A)",
                            "Brush (Pensula)",
                            "Fill (Umplere)"
                        ],
                        correct: 1,
                        explanation: "Instrumentul Text (reprezentat de litera A) iti permite sa scrii text pe desen. Faci click pe canvas, apare o caseta de text unde poti scrie si alege fontul, dimensiunea si culoarea."
                    },
                    {
                        text: "Cum selectezi o parte din desen pentru a o muta?",
                        options: [
                            "Tragi cu mouse-ul direct",
                            "Folosesti instrumentul Select (Selectare) si apoi tragi zona selectata",
                            "Apesi Ctrl + M",
                            "Nu poti muta parti din desen"
                        ],
                        correct: 1,
                        explanation: "Instrumentul Select (Selectare) iti permite sa selectezi o zona dreptunghiulara din desen. Apoi poti muta, copia (Ctrl+C), taia (Ctrl+X) sau sterge acea zona. Exista si selectare libera (Free-form)."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls5_m2_quiz2_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5_m2_quiz2_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) { node.classList.add('completed'); }
                else if (unlockedLevels.includes(level)) { if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) { node.classList.add('active'); } }
                else { node.classList.add('locked'); }
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) { conn.classList.add('completed'); } else { conn.classList.remove('completed'); }
            });
        }

        function selectLevel(level) { if (!unlockedLevels.includes(level)) return; currentLevel = level; currentQuestion = 0; score = 0; showLevelIntro(); }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `<div class="level-intro"><h2>${levelData.title}</h2><p>${levelData.description}</p><div class="xp-reward">+${levelData.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) { let dotClass = 'progress-dot'; if (i === currentQuestion) dotClass += ' current'; progressDots += `<div class="${dotClass}"></div>`; }
            let optionsHTML = '';
            q.options.forEach((opt, i) => { optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`; });
            document.getElementById('quizArea').innerHTML = `<div class="question-container active"><div class="question-progress">${progressDots}</div><p class="question-text">${q.text}</p><div class="options-grid">${optionsHTML}</div><div class="feedback-box" id="feedback"></div><div style="text-align: center; margin-top: 1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Urmatoarea Intrebare</button></div></div>`;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel]; const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option'); const feedback = document.getElementById('feedback'); const nextBtn = document.getElementById('nextBtn');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) { options[q.correct].classList.add('correct'); }
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index === q.correct) { score++; feedback.className = 'feedback-box show correct'; feedback.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`; }
            else { feedback.className = 'feedback-box show wrong'; feedback.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`; }
            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() { const levelData = levels[currentLevel]; currentQuestion++; if (currentQuestion >= levelData.questions.length) { showLevelComplete(); } else { showQuestion(); } }

        function showLevelComplete() {
            const levelData = levels[currentLevel]; const percentage = Math.round((score / levelData.questions.length) * 100); const passed = percentage >= 66;
            let stars = ''; if (percentage >= 100) stars = '&#11088;&#11088;&#11088;'; else if (percentage >= 80) stars = '&#11088;&#11088;'; else if (percentage >= 66) stars = '&#11088;'; else stars = '&#128170;';
            let earnedXP = 0;
            if (passed) { earnedXP = levelData.xpReward; if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) { if (!levelScores[currentLevel]) { totalXP += earnedXP; } levelScores[currentLevel] = percentage; }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) { unlockedLevels.push(currentLevel + 1); }
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }
            document.getElementById('quizArea').innerHTML = `<div class="level-complete show"><div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div><h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}<div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz3-culori.html'">Quiz-ul 3: Culori</button>` : ''}</div></div>`;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

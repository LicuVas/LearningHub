<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Siguranta Online | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 2</a>
        <div class="quiz-header">
            <div class="quiz-title">Quiz: Siguranta Online</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        const levels = {
            1: {
                title: "Nivel 1: Parole sigure",
                description: "Invata cum sa iti protejezi conturile cu parole bune",
                xpReward: 50,
                questions: [
                    {
                        text: "Care dintre urmatoarele este o parola sigura?",
                        options: [
                            "123456",
                            "Caine!Albastru7#Munte",
                            "parola",
                            "ion2015"
                        ],
                        correct: 1,
                        explanation: "O parola sigura combina litere mari si mici, cifre si simboluri speciale, si are cel putin 8-12 caractere. 'Caine!Albastru7#Munte' este greu de ghicit dar usor de retinut. Parolele simple ca '123456' sau 'parola' sunt foarte nesigure."
                    },
                    {
                        text: "Cu cine trebuie sa impartasesti parola ta?",
                        options: [
                            "Cu cel mai bun prieten",
                            "Cu nimeni, doar cu parintii tai",
                            "Cu toti colegii de clasa",
                            "Cu oricine te intreaba"
                        ],
                        correct: 1,
                        explanation: "Parola trebuie sa ramana secreta! O poti spune doar parintilor tai (sau unui adult de incredere). Nu o impartasi cu prietenii, colegii sau straini, chiar daca insista."
                    },
                    {
                        text: "De ce nu ar trebui sa folosesti aceeasi parola pentru toate conturile?",
                        options: [
                            "Pentru ca e greu de tastat",
                            "Daca cineva afla o parola, are acces la toate conturile tale",
                            "Pentru ca e prea usor de retinut",
                            "Nu conteaza, poti folosi aceeasi parola"
                        ],
                        correct: 1,
                        explanation: "Daca folosesti aceeasi parola peste tot si cineva o afla (sau un site este spart), persoana respectiva va putea accesa TOATE conturile tale. Foloseste parole diferite pentru conturi diferite!"
                    }
                ]
            },
            2: {
                title: "Nivel 2: Date personale",
                description: "Invata ce informatii sa nu le dai niciodata online",
                xpReward: 75,
                questions: [
                    {
                        text: "Care dintre urmatoarele informatii NU trebuie sa le dai pe Internet unor necunoscuti?",
                        options: [
                            "Culoarea ta preferata",
                            "Adresa de acasa, numarul de telefon sau numele scolii",
                            "Ce materie iti place la scoala",
                            "Ce muzica asculti"
                        ],
                        correct: 1,
                        explanation: "Niciodata nu da pe Internet informatii personale precum: adresa de acasa, numarul de telefon, numele scolii, CNP-ul sau fotografii cu locatia ta. Aceste date pot fi folosite de persoane rau-intentionate."
                    },
                    {
                        text: "Un necunoscut pe un joc online iti cere sa ii trimiti o poza cu tine. Ce faci?",
                        options: [
                            "Ii trimiti poza, pare dragut",
                            "Refuzi politicos si spui unui parinte/adult de incredere",
                            "Ii trimiti poza unui prieten in loc de a ta",
                            "Ii ceri intai poza lui si apoi o trimiti pe a ta"
                        ],
                        correct: 1,
                        explanation: "Nu trimite niciodata fotografii personale unor necunoscuti online! Spune intotdeauna unui parinte sau adult de incredere cand cineva iti cere informatii personale sau poze. Necunoscutii de pe Internet pot fi oricine."
                    },
                    {
                        text: "Ce sunt 'datele personale'?",
                        options: [
                            "Doar CNP-ul",
                            "Orice informatii care te pot identifica: nume, adresa, telefon, poze, scoala",
                            "Doar parola de la calculator",
                            "Doar adresa de email"
                        ],
                        correct: 1,
                        explanation: "Datele personale includ TOATE informatiile care te pot identifica: numele complet, adresa, telefonul, CNP-ul, fotografiile tale, numele scolii, locatia etc. Protejeaza-le ca pe un obiect de valoare!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Netiquette - Comportamentul online",
                description: "Invata regulile de buna purtare pe Internet",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce inseamna 'netiquette'?",
                        options: [
                            "Un tip de retea internet",
                            "Regulile de buna purtare pe Internet (etichetea pe net)",
                            "Un program antivirus",
                            "Un tip de parola"
                        ],
                        correct: 1,
                        explanation: "Netiquette vine de la 'net' (internet) + 'etiquette' (bune maniere). Sunt regulile de comportament politicos si respectuos pe Internet. La fel cum ne purtam frumos in viata reala, trebuie sa ne purtam frumos si online."
                    },
                    {
                        text: "Este corect sa scrii TOTUL CU MAJUSCULE intr-un mesaj online?",
                        options: [
                            "Da, se citeste mai usor",
                            "Nu, scrierea cu majuscule inseamna ca TIPI si este considerata nepoliticoasa",
                            "Da, arata mai profesional",
                            "Nu conteaza cum scrii"
                        ],
                        correct: 1,
                        explanation: "Scrierea cu TOATE LITERELE MARI pe Internet este echivalentul tipatului. Este considerata nepoliticoasa si agresiva. Foloseste majuscule doar la inceputul propozitiei si pentru nume, ca in scrisul normal."
                    },
                    {
                        text: "Ce este cyberbullying-ul (hartuirea online)?",
                        options: [
                            "Un joc video popular",
                            "Folosirea Internetului pentru a rani, ameninta sau umili pe cineva in mod repetat",
                            "Un tip de virus",
                            "Trimiterea de mesaje prietenilor"
                        ],
                        correct: 1,
                        explanation: "Cyberbullying-ul (hartuirea online) inseamna folosirea Internetului, retelelor sociale sau mesajelor pentru a rani, insulta, ameninta sau umili pe cineva. Daca esti victima sau martor, spune imediat unui adult de incredere!"
                    }
                ]
            },
            4: {
                title: "Nivel 4: Pericole online",
                description: "Invata sa recunosti pericolele de pe Internet",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce ar trebui sa faci daca primesti un email de la cineva necunoscut care iti cere sa dai click pe un link?",
                        options: [
                            "Dai click imediat, poate e ceva interesant",
                            "Nu dai click si spui unui parinte/adult de incredere",
                            "Raspunzi la email cerandu-i sa se prezinte",
                            "Trimiti link-ul prietenilor"
                        ],
                        correct: 1,
                        explanation: "Nu da niciodata click pe link-uri din emailuri suspecte! Pot fi incercari de phishing (inselaciune) care pot instala virusi sau fura date personale. Spune intotdeauna unui adult de incredere."
                    },
                    {
                        text: "Ce inseamna 'phishing'?",
                        options: [
                            "Un joc de pescuit online",
                            "O inselaciune prin care cineva incearca sa iti fure datele personale pretinzand ca e altcineva",
                            "Un tip de browser",
                            "O metoda de cautare pe Google"
                        ],
                        correct: 1,
                        explanation: "Phishing-ul este o inselaciune in care atacatorul se preface ca e cineva de incredere (o banca, un joc, o companie) si incearca sa te pacaleasca sa ii dai parola, datele personale sau bani. Verifica intotdeauna sursa!"
                    },
                    {
                        text: "Un site web iti promite un telefon gratuit daca iti introduci datele personale. Ce faci?",
                        options: [
                            "Introduci datele rapid, sa nu pierzi oferta",
                            "Nu introduci datele - este foarte probabil o inselaciune",
                            "Introduci date false",
                            "Trimiti link-ul prietenilor"
                        ],
                        correct: 1,
                        explanation: "Ofertele prea bune ca sa fie adevarate sunt de obicei inselaciuni! Nimeni nu ofera gratuit telefoane sau premii de valoare. Scopul este sa iti colecteze datele personale. Nu introduce niciodata informatii pe site-uri suspecte."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Reguli de aur ale sigurantei online",
                description: "Testeaza-ti cunostintele despre siguranta pe Internet",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este prima persoana pe care trebuie sa o anunti daca intalnesti ceva neplacut online?",
                        options: [
                            "Cel mai bun prieten",
                            "Un parinte sau un adult de incredere (profesor, bunic)",
                            "Un coleg de clasa",
                            "Nimeni, rezolvi singur"
                        ],
                        correct: 1,
                        explanation: "Intotdeauna spune unui parinte sau adult de incredere (profesor, bunic) daca intalnesti ceva care te sperie, te face sa te simti inconfortabil sau daca cineva te deranjeaza online. Adultii te pot ajuta si proteja."
                    },
                    {
                        text: "De ce este important sa nu te intalnesti in persoana cu cineva cunoscut doar pe Internet?",
                        options: [
                            "Nu este nimic gresit in asta",
                            "Persoanele de pe Internet pot minti despre cine sunt si poate fi periculos",
                            "Pentru ca nu ai timp",
                            "Pentru ca e prea departe"
                        ],
                        correct: 1,
                        explanation: "Persoanele de pe Internet pot pretinde ca sunt altcineva. Un 'copil de 12 ani' din jocul online poate fi in realitate un adult cu intentii rele. Nu te intalni niciodata in persoana cu necunoscuti de pe Internet fara un adult!"
                    },
                    {
                        text: "Care este cea mai importanta regula de siguranta pe Internet?",
                        options: [
                            "Sa ai cel mai rapid internet",
                            "Sa gandesti inainte de a posta, da click sau trimite - si sa ceri ajutorul adultilor cand ai dubii",
                            "Sa petreci cat mai mult timp online",
                            "Sa ai cat mai multi prieteni online"
                        ],
                        correct: 1,
                        explanation: "Cea mai importanta regula: gandeste inainte de a actiona online! Inainte sa postezi, sa dai click sau sa trimiti ceva, intreaba-te: 'E sigur? E potrivit? Ar fi de acord parintii mei?' Cand ai dubii, cere ajutorul unui adult."
                    }
                ]
            }
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];
        function loadProgress() { const s = localStorage.getItem('cls5_m2_quiz5_progress'); if (s) { const d = JSON.parse(s); totalXP = d.totalXP || 0; unlockedLevels = d.unlockedLevels || [1]; levelScores = d.levelScores || {}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m2_quiz5_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((node, i) => { const l = i + 1; node.classList.remove('locked', 'active', 'completed'); if (levelScores[l] !== undefined) node.classList.add('completed'); else if (unlockedLevels.includes(l)) { if (l === Math.max(...unlockedLevels.filter(x => levelScores[x] === undefined))) node.classList.add('active'); } else node.classList.add('locked'); }); document.querySelectorAll('.level-connector').forEach((c, i) => { if (levelScores[i + 1] !== undefined) c.classList.add('completed'); else c.classList.remove('completed'); }); }
        function selectLevel(level) { if (!unlockedLevels.includes(level)) return; currentLevel = level; currentQuestion = 0; score = 0; showLevelIntro(); }
        function showLevelIntro() { const l = levels[currentLevel]; document.getElementById('quizArea').innerHTML = `<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`; }
        function startLevel() { showQuestion(); }
        function showQuestion() { function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } const l = levels[currentLevel]; const q = l.questions[currentQuestion]; let dots = ''; for (let i = 0; i < l.questions.length; i++) dots += `<div class="progress-dot${i === currentQuestion ? ' current' : ''}"></div>`; let opts = ''; q.options.forEach((o, i) => { opts += `<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`; }); document.getElementById('quizArea').innerHTML = `<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`; }
        function selectAnswer(index) { const l = levels[currentLevel]; const q = l.questions[currentQuestion]; const opts = document.querySelectorAll('.option'); const fb = document.getElementById('feedback'); const nb = document.getElementById('nextBtn'); opts.forEach(o => o.style.pointerEvents = 'none'); opts[index].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index !== q.correct) opts[q.correct].classList.add('correct'); const d = document.querySelectorAll('.progress-dot'); d[currentQuestion].classList.remove('current'); d[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index === q.correct) { score++; fb.className = 'feedback-box show correct'; fb.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`; } else { fb.className = 'feedback-box show wrong'; fb.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`; } nb.style.display = 'inline-flex'; nb.textContent = currentQuestion < l.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul'; }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete(); else showQuestion(); }
        function showLevelComplete() { const l = levels[currentLevel]; const pct = Math.round((score / l.questions.length) * 100); const passed = pct >= 66; let stars = pct >= 100 ? '&#11088;&#11088;&#11088;' : pct >= 80 ? '&#11088;&#11088;' : pct >= 66 ? '&#11088;' : '&#128170;'; let earnedXP = 0; if (passed) { earnedXP = l.xpReward; if (pct === 100) earnedXP = Math.round(earnedXP * 1.5); if (!levelScores[currentLevel] || levelScores[currentLevel] < pct) { if (!levelScores[currentLevel]) totalXP += earnedXP; levelScores[currentLevel] = pct; } if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1); saveProgress(); updateXPDisplay(); updateLevelMap(); } document.getElementById('quizArea').innerHTML = `<div class="level-complete show"><div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div><h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='../index.html'">Inapoi la Modul</button>` : ''}</div></div>`; }
        loadProgress(); showLevelIntro();
    </script>
</body>
</html>

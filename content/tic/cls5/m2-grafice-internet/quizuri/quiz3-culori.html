<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Culori si Selectare | Clasa 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-secondary); border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border); }
        .quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }
        .level-map { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .level-node { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: all 0.3s; position: relative; border: 3px solid var(--border); background: var(--bg-card); }
        .level-node.locked { opacity: 0.5; cursor: not-allowed; }
        .level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }
        .level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }
        .level-node.completed { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); border-color: var(--accent-green); }
        .level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .level-connector { width: 30px; height: 3px; background: var(--border); align-self: center; }
        .level-connector.completed { background: var(--accent-green); }
        .quiz-area { background: var(--bg-secondary); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); min-height: 400px; }
        .level-intro { text-align: center; padding: 2rem; }
        .level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }
        .level-intro p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; }
        .level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }
        .question-container { display: none; }
        .question-container.active { display: block; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .question-progress { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
        .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
        .progress-dot.current { background: var(--accent-blue); }
        .progress-dot.correct { background: var(--accent-green); }
        .progress-dot.wrong { background: var(--accent-red); }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }
        .options-grid { display: grid; gap: 1rem; margin-top: 1.5rem; }
        .option { padding: 1.2rem 1.5rem; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; }
        .option:hover { border-color: var(--accent-purple); transform: translateX(5px); }
        .option.correct { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.2); }
        .option.wrong { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }
        .feedback-box { display: none; padding: 1.5rem; border-radius: 12px; margin-top: 1.5rem; text-align: center; }
        .feedback-box.show { display: block; animation: fadeIn 0.3s ease; }
        .feedback-box.correct { background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); }
        .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--accent-red); }
        .feedback-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .feedback-text { font-size: 1.1rem; margin-bottom: 1rem; }
        .explanation { font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-top: 1rem; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
        .btn-success { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .level-complete { display: none; text-align: center; padding: 3rem; }
        .level-complete.show { display: block; animation: celebrate 0.5s ease; }
        @keyframes celebrate { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        .level-complete-icon { font-size: 5rem; margin-bottom: 1rem; }
        .level-complete h2 { font-size: 2rem; color: var(--accent-green); margin-bottom: 1rem; }
        .xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
        .score-display { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
        .stars { font-size: 3rem; margin: 1rem 0; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-size: 0.9rem; }
        .back-link:hover { color: var(--accent-cyan); }
        @media (max-width: 600px) { .container { padding: 1rem; } .quiz-header { flex-direction: column; gap: 1rem; } .level-node { width: 50px; height: 50px; font-size: 1.2rem; } .question-text { font-size: 1.1rem; } }
        footer { margin-top: 3rem; padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 2</a>
        <div class="quiz-header">
            <div class="quiz-title">Quiz: Culori si Selectare</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        const levels = {
            1: {
                title: "Nivel 1: Culorile primare",
                description: "Invata despre culorile de baza si cum le folosesti",
                xpReward: 50,
                questions: [
                    {
                        text: "Care sunt cele trei culori primare in lumea digitala (pe ecran)?",
                        options: [
                            "Galben, albastru, verde",
                            "Rosu, verde, albastru (RGB)",
                            "Rosu, galben, albastru",
                            "Alb, negru, gri"
                        ],
                        correct: 1,
                        explanation: "In lumea digitala, culorile primare sunt Rosu (Red), Verde (Green) si Albastru (Blue) - prescurtat RGB. Toate culorile de pe ecran sunt combinatii ale acestor trei culori."
                    },
                    {
                        text: "Ce culoare obtii daca amesteci toate cele trei culori primare digitale la intensitate maxima?",
                        options: [
                            "Negru",
                            "Alb",
                            "Maro",
                            "Gri"
                        ],
                        correct: 1,
                        explanation: "In sistemul RGB (pe ecran), amestecul tuturor culorilor la intensitate maxima produce ALB. Este diferit de pictura, unde amestecul culorilor produce o culoare inchisa."
                    },
                    {
                        text: "Cate culori rapide (predefinite) sunt disponibile in paleta Paint?",
                        options: [
                            "Exact 5 culori",
                            "Aproximativ 20 de culori",
                            "Exact 100 de culori",
                            "Doar alb si negru"
                        ],
                        correct: 1,
                        explanation: "Paleta de culori rapide din Paint contine aproximativ 20 de culori predefinite (rosu, verde, albastru, galben, portocaliu, roz, maro, negru, alb, gri etc.). Pentru mai multe, folosesti Edit Colors."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Color Picker si culori personalizate",
                description: "Descopera cum alegi culori exacte",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce face instrumentul 'Color Picker' (Pipeta) in Paint?",
                        options: [
                            "Amesteca doua culori",
                            "Preia (copiaza) o culoare din desen pentru a o folosi",
                            "Sterge culoarea dintr-o zona",
                            "Inverseaza culorile"
                        ],
                        correct: 1,
                        explanation: "Color Picker (Pipeta) iti permite sa preiei o culoare exact de pe desen. Faci click pe orice punct din imagine si culoarea acelui punct devine culoarea ta activa (Color 1)."
                    },
                    {
                        text: "De ce este util instrumentul Color Picker?",
                        options: [
                            "Ajuta la stergerea desenului",
                            "Te ajuta sa folosesti exact aceeasi culoare in diferite parti ale desenului",
                            "Mareste imaginea",
                            "Salveaza fisierul"
                        ],
                        correct: 1,
                        explanation: "Color Picker este foarte util cand vrei sa folosesti exact aceeasi nuanta de culoare in mai multe locuri din desen, fara sa o cauti manual in paleta."
                    },
                    {
                        text: "In fereastra 'Edit Colors', cum poti crea o culoare personalizata?",
                        options: [
                            "Scrii numele culorii in engleza",
                            "Alegi din spectrul de culori sau introduci valori numerice (RGB)",
                            "Desenezi culoarea cu mouse-ul",
                            "Importi culoarea dintr-un fisier"
                        ],
                        correct: 1,
                        explanation: "In fereastra Edit Colors poti alege culoarea din spectrul vizual (facand click pe zona colorata) sau introducand valori exacte pentru Red, Green si Blue (de la 0 la 255 fiecare)."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Selectarea zonelor",
                description: "Invata sa selectezi si sa lucrezi cu parti din desen",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce tipuri de selectare exista in Paint?",
                        options: [
                            "Doar selectare circulara",
                            "Selectare dreptunghiulara si selectare libera (free-form)",
                            "Doar selectare cu dublu-click",
                            "Selectare automata"
                        ],
                        correct: 1,
                        explanation: "Paint ofera doua tipuri de selectare: Rectangular Selection (selectare dreptunghiulara - selectezi o zona dreptunghiulara) si Free-form Selection (selectare libera - desenezi conturul zonei dorite)."
                    },
                    {
                        text: "Ce poti face cu o zona selectata in Paint?",
                        options: [
                            "Doar sa o stergi",
                            "Sa o muti, copiezi, decupezi, rotesti sau redimensionezi",
                            "Doar sa o colorezi",
                            "Doar sa o maresti"
                        ],
                        correct: 1,
                        explanation: "O zona selectata poate fi mutata (drag), copiata (Ctrl+C), decupata (Ctrl+X), stearsa (Delete), rotita sau redimensionata (tragand de colturi). Este foarte versatila!"
                    },
                    {
                        text: "Ce inseamna optiunea 'Transparent selection' in Paint?",
                        options: [
                            "Face toata imaginea transparenta",
                            "Cand muti o selectie, fundalul alb al selectiei devine transparent",
                            "Sterge selectia",
                            "Face textul invizibil"
                        ],
                        correct: 1,
                        explanation: "Transparent Selection face ca fundalul alb din selectie sa nu fie mutat odata cu obiectul. Asa poti muta doar desenul, fara dreptunghiul alb din jurul lui."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Copiere si lipire",
                description: "Stapaneste operatiile cu clipboard",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce combinatie de taste copiaza o zona selectata?",
                        options: [
                            "Ctrl + X",
                            "Ctrl + C",
                            "Ctrl + V",
                            "Ctrl + Z"
                        ],
                        correct: 1,
                        explanation: "Ctrl + C (Copy) copiaza zona selectata in clipboard (memorie temporara). Originalul ramane pe loc. Apoi poti lipi copia cu Ctrl + V."
                    },
                    {
                        text: "Care este diferenta dintre Ctrl+C (Copy) si Ctrl+X (Cut)?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Copy pastreaza originalul, Cut sterge originalul dupa copiere",
                            "Copy functioneaza doar cu text",
                            "Cut functioneaza doar cu forme"
                        ],
                        correct: 1,
                        explanation: "Copy (Ctrl+C) copiaza selectia lasand originalul intact. Cut (Ctrl+X) decupeaza selectia - o sterge din locul initial si o pune in clipboard. Ambele pot fi apoi lipite cu Ctrl+V."
                    },
                    {
                        text: "Ce face Ctrl + V (Paste) in Paint?",
                        options: [
                            "Salveaza fisierul",
                            "Lipeste continutul copiat anterior in coltul din stanga-sus",
                            "Selecteaza tot desenul",
                            "Deschide un fisier nou"
                        ],
                        correct: 1,
                        explanation: "Ctrl + V (Paste/Lipire) lipeste continutul copiat sau decupat anterior. In Paint, elementul lipit apare in coltul din stanga-sus si poate fi mutat in pozitia dorita."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Tehnici avansate cu culori",
                description: "Testeaza-ti cunostintele avansate",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum poti inversa culorile unei imagini in Paint?",
                        options: [
                            "Apesi tasta I",
                            "Selectezi zona si alegi 'Invert color' din meniul Select",
                            "Folosesti instrumentul Eraser",
                            "Nu se poate inversa culorile in Paint"
                        ],
                        correct: 1,
                        explanation: "Poti inversa culorile selectand zona dorita si alegand 'Invert color' din meniul care apare. Inversarea transforma fiecare culoare in complementara ei (alb devine negru, rosu devine cyan etc.)."
                    },
                    {
                        text: "Ce rezolutie (dimensiune in pixeli) poti seta pentru o imagine noua in Paint?",
                        options: [
                            "Doar dimensiuni fixe: mic, mediu, mare",
                            "Orice dimensiune dorita, prin Resize sau tragand marginile canvas-ului",
                            "Doar 1920x1080",
                            "Nu poti schimba dimensiunea"
                        ],
                        correct: 1,
                        explanation: "Poti seta orice dimensiune dorita. Folosesti Resize (Ctrl+W) pentru a introduce dimensiuni exacte in pixeli sau procente, sau tragi marginile canvas-ului cu mouse-ul."
                    },
                    {
                        text: "Ce se intampla cand redimensionezi (Resize) o imagine si bifezi 'Maintain aspect ratio'?",
                        options: [
                            "Imaginea devine alb-negru",
                            "Proportiile imaginii se pastreaza (nu se deformeaza)",
                            "Imaginea se roteste",
                            "Calitatea creste automat"
                        ],
                        correct: 1,
                        explanation: "Maintain aspect ratio (Pastreaza proportiile) face ca imaginea sa nu se deformeze cand o redimensionezi. Daca schimbi latimea, inaltimea se ajusteaza automat pentru a pastra aceleasi proportii."
                    }
                ]
            }
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];

        function loadProgress() { const saved = localStorage.getItem('cls5_m2_quiz3_progress'); if (saved) { const data = JSON.parse(saved); totalXP = data.totalXP || 0; unlockedLevels = data.unlockedLevels || [1]; levelScores = data.levelScores || {}; updateXPDisplay(); updateLevelMap(); } }
        function saveProgress() { localStorage.setItem('cls5_m2_quiz3_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores })); }
        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }
        function updateLevelMap() { document.querySelectorAll('.level-node').forEach((node, index) => { const level = index + 1; node.classList.remove('locked', 'active', 'completed'); if (levelScores[level] !== undefined) { node.classList.add('completed'); } else if (unlockedLevels.includes(level)) { if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) { node.classList.add('active'); } } else { node.classList.add('locked'); } }); document.querySelectorAll('.level-connector').forEach((conn, index) => { if (levelScores[index + 1] !== undefined) { conn.classList.add('completed'); } else { conn.classList.remove('completed'); } }); }
        function selectLevel(level) { if (!unlockedLevels.includes(level)) return; currentLevel = level; currentQuestion = 0; score = 0; showLevelIntro(); }
        function showLevelIntro() { const l = levels[currentLevel]; document.getElementById('quizArea').innerHTML = `<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`; }
        function startLevel() { showQuestion(); }
        function showQuestion() { function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } const l = levels[currentLevel]; const q = l.questions[currentQuestion]; let dots = ''; for (let i = 0; i < l.questions.length; i++) { dots += `<div class="progress-dot${i === currentQuestion ? ' current' : ''}"></div>`; } let opts = ''; q.options.forEach((o, i) => { opts += `<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`; }); document.getElementById('quizArea').innerHTML = `<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`; }
        function selectAnswer(index) { const l = levels[currentLevel]; const q = l.questions[currentQuestion]; const options = document.querySelectorAll('.option'); const feedback = document.getElementById('feedback'); const nextBtn = document.getElementById('nextBtn'); options.forEach(o => o.style.pointerEvents = 'none'); options[index].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index !== q.correct) options[q.correct].classList.add('correct'); const d = document.querySelectorAll('.progress-dot'); d[currentQuestion].classList.remove('current'); d[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong'); if (index === q.correct) { score++; feedback.className = 'feedback-box show correct'; feedback.innerHTML = `<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`; } else { feedback.className = 'feedback-box show wrong'; feedback.innerHTML = `<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`; } nextBtn.style.display = 'inline-flex'; nextBtn.textContent = currentQuestion < l.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul'; }
        function nextQuestion() { currentQuestion++; if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete(); else showQuestion(); }
        function showLevelComplete() { const l = levels[currentLevel]; const pct = Math.round((score / l.questions.length) * 100); const passed = pct >= 66; let stars = pct >= 100 ? '&#11088;&#11088;&#11088;' : pct >= 80 ? '&#11088;&#11088;' : pct >= 66 ? '&#11088;' : '&#128170;'; let earnedXP = 0; if (passed) { earnedXP = l.xpReward; if (pct === 100) earnedXP = Math.round(earnedXP * 1.5); if (!levelScores[currentLevel] || levelScores[currentLevel] < pct) { if (!levelScores[currentLevel]) totalXP += earnedXP; levelScores[currentLevel] = pct; } if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1); saveProgress(); updateXPDisplay(); updateLevelMap(); } document.getElementById('quizArea').innerHTML = `<div class="level-complete show"><div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div><h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz4-internet.html'">Quiz-ul 4: Internet</button>` : ''}</div></div>`; }

        loadProgress(); showLevelIntro();
    </script>
</body>

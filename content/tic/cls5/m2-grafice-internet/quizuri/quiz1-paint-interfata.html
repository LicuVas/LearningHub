<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Interfata Paint | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.locked::after {
            content: '\U0001F512';
            position: absolute;
            font-size: 1rem;
            bottom: -5px;
            right: -5px;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-node.completed::after {
            content: '\2713';
            position: absolute;
            font-size: 0.8rem;
            bottom: -5px;
            right: -5px;
            background: var(--accent-green);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Visual mockup */
        .visual-mockup {
            background: #2d2d4a;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem auto;
            max-width: 500px;
            text-align: center;
            border: 2px solid var(--border);
        }

.visual-mockup .component-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
    </head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 2</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Interfata Paint</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>

    <footer>
        <strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>
        Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a>
    </footer>

    <script>
        // Quiz data for each level - cls5-m2-quiz1
        const levels = {
            1: {
                title: "Nivel 1: Fereastra Paint",
                description: "Invata despre elementele principale ale ferestrei Paint",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este aplicatia Paint?",
                        options: [
                            "Un program de navigare pe internet",
                            "Un editor grafic simplu inclus in Windows",
                            "Un program de calcul tabelar",
                            "Un program de editare video"
                        ],
                        correct: 1,
                        explanation: "Paint este un editor grafic simplu, inclus gratuit in sistemul de operare Windows. Cu el poti crea si modifica desene si imagini."
                    },
                    {
                        text: "Cum poti deschide aplicatia Paint?",
                        options: [
                            "Doar din linia de comanda",
                            "Din meniul Start sau cautand 'Paint' in bara de cautare",
                            "Doar de pe internet",
                            "Doar prin dublu-click pe desktop"
                        ],
                        correct: 1,
                        explanation: "Paint se poate deschide din meniul Start, cautand 'Paint' in bara de cautare Windows, sau din lista de aplicatii. Este o aplicatie preinstalata in Windows."
                    },
                    {
                        text: "Care este zona mare alba din centrul ferestrei Paint?",
                        options: [
                            "Bara de instrumente",
                            "Paleta de culori",
                            "Suprafata de desenare (canvas)",
                            "Bara de stare"
                        ],
                        correct: 2,
                        explanation: "Suprafata de desenare (canvas) este zona alba mare din centrul ferestrei Paint. Aici creezi desenele tale, ca pe o foaie de hartie virtuala."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Bara de instrumente",
                description: "Descopera instrumentele disponibile in Paint",
                xpReward: 75,
                questions: [
                    {
                        text: "Unde gasesti instrumentele de desenare in Paint?",
                        options: [
                            "In bara de stare, jos",
                            "In bara de instrumente (ribbon), in partea de sus",
                            "In meniul contextual (click dreapta)",
                            "In bara de titlu"
                        ],
                        correct: 1,
                        explanation: "Bara de instrumente (ribbon) se afla in partea de sus a ferestrei Paint. Aici gasesti toate instrumentele de desenare: creion, pensula, forme, text si altele."
                    },
                    {
                        text: "Ce tab-uri principale gasesti in bara de instrumente Paint?",
                        options: [
                            "Doar tab-ul 'File'",
                            "Tab-urile 'File' si 'Home' (Fisier si Pornire)",
                            "Tab-urile 'Insert' si 'Design'",
                            "Nu exista tab-uri in Paint"
                        ],
                        correct: 1,
                        explanation: "Paint are doua tab-uri principale: 'File' (Fisier) pentru operatii cu fisiere (salvare, deschidere) si 'Home' (Pornire) unde gasesti instrumentele de desenare."
                    },
                    {
                        text: "Ce afiseaza bara de stare din partea de jos a ferestrei Paint?",
                        options: [
                            "Culoarea selectata",
                            "Pozitia cursorului si dimensiunea imaginii",
                            "Numele fisierului",
                            "Lista instrumentelor"
                        ],
                        correct: 1,
                        explanation: "Bara de stare din partea de jos afiseaza informatii utile: pozitia cursorului (coordonatele x, y), dimensiunea imaginii in pixeli si nivelul de zoom."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Paleta de culori",
                description: "Invata sa lucrezi cu culorile in Paint",
                xpReward: 100,
                questions: [
                    {
                        text: "Unde se afla paleta de culori in Paint?",
                        options: [
                            "In partea stanga a ecranului",
                            "In bara de instrumente, sectiunea 'Colors' (Culori)",
                            "In bara de stare",
                            "Intr-o fereastra separata"
                        ],
                        correct: 1,
                        explanation: "Paleta de culori se afla in bara de instrumente (ribbon), in sectiunea 'Colors' (Culori). Aici poti alege rapid culori pentru desenare."
                    },
                    {
                        text: "Ce sunt 'Color 1' si 'Color 2' in Paint?",
                        options: [
                            "Doua nuante de gri",
                            "Culoarea de prim-plan (click stanga) si culoarea de fundal (click dreapta)",
                            "Culorile pentru text",
                            "Culorile pentru conturul formelor"
                        ],
                        correct: 1,
                        explanation: "Color 1 (culoarea de prim-plan) se foloseste cand desenezi cu click stanga. Color 2 (culoarea de fundal) se foloseste cu click dreapta si pentru fundalul formelor."
                    },
                    {
                        text: "Cum poti obtine mai multe culori decat cele afisate in paleta?",
                        options: [
                            "Nu se poate, Paint are doar culorile afisate",
                            "Apasand butonul 'Edit Colors' (Editare culori)",
                            "Instaland un plugin",
                            "Schimband tema Windows"
                        ],
                        correct: 1,
                        explanation: "Butonul 'Edit Colors' (Editare culori) deschide o fereastra cu un spectru complet de culori, de unde poti alege orice culoare doresti sau introduce valori exacte."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Operatii cu fisiere",
                description: "Invata sa salvezi si sa deschizi lucrari in Paint",
                xpReward: 125,
                questions: [
                    {
                        text: "Cum salvezi un desen nou in Paint?",
                        options: [
                            "Inchizi programul si se salveaza automat",
                            "Folosesti File > Save As (Fisier > Salvare ca) si alegi locatia",
                            "Apesi tasta Enter",
                            "Dai click dreapta pe desen"
                        ],
                        correct: 1,
                        explanation: "Pentru a salva un desen nou, mergi la File > Save As (sau Ctrl+S prima data). Alegi locatia, numele fisierului si formatul (PNG, JPEG, BMP etc.)."
                    },
                    {
                        text: "Ce combinatie de taste folosesti pentru a salva rapid?",
                        options: [
                            "Ctrl + P",
                            "Ctrl + S",
                            "Ctrl + D",
                            "Alt + S"
                        ],
                        correct: 1,
                        explanation: "Ctrl + S este scurtatura universala pentru salvare (Save). Functioneaza in Paint si in aproape toate programele. Este important sa salvezi des pentru a nu pierde munca!"
                    },
                    {
                        text: "In ce format salveaza Paint implicit imaginile?",
                        options: [
                            "JPEG",
                            "PNG",
                            "BMP",
                            "GIF"
                        ],
                        correct: 1,
                        explanation: "Paint salveaza implicit in format PNG, care pastreaza calitatea imaginii fara pierderi. PNG este un format bun pentru desene si capturi de ecran."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Navigare si zoom",
                description: "Stapaneste navigarea in fereastra Paint",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum poti mari vizualizarea desenului (zoom in) in Paint?",
                        options: [
                            "Apasand tasta Space",
                            "Folosind Ctrl + rotita mouse-ului sau bara de zoom din bara de stare",
                            "Apasand tasta F5",
                            "Dand dublu-click pe desen"
                        ],
                        correct: 1,
                        explanation: "Poti face zoom in/out cu Ctrl + rotita mouse-ului sau folosind bara de zoom din coltul din dreapta-jos (bara de stare). Zoom-ul te ajuta sa lucrezi la detalii fine."
                    },
                    {
                        text: "Ce se intampla daca inchizi Paint fara sa salvezi?",
                        options: [
                            "Desenul se salveaza automat",
                            "Paint te intreaba daca vrei sa salvezi modificarile",
                            "Desenul se pierde fara avertisment",
                            "Paint nu se poate inchide fara salvare"
                        ],
                        correct: 1,
                        explanation: "Paint afiseaza un mesaj de avertizare care te intreaba daca vrei sa salvezi modificarile. Ai trei optiuni: Save (Salveaza), Don't Save (Nu salva) si Cancel (Anuleaza)."
                    },
                    {
                        text: "Ce face combinatia de taste Ctrl + Z in Paint?",
                        options: [
                            "Inchide programul",
                            "Anuleaza ultima actiune (Undo)",
                            "Salveaza fisierul",
                            "Selecteaza totul"
                        ],
                        correct: 1,
                        explanation: "Ctrl + Z este scurtatura pentru Undo (Anulare). Anuleaza ultima actiune facuta. Poti apasa de mai multe ori pentru a anula mai multi pasi. Este foarte util cand gresesti!"
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('cls5_m2_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5_m2_quiz1_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#127881;</div>
                    <div class="feedback-text">Corect! Foarte bine!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">&#128517;</div>
                    <div class="feedback-text">Nu chiar... Hai sa invatam!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '&#11088;&#11088;&#11088;';
            else if (percentage >= 80) stars = '&#11088;&#11088;';
            else if (percentage >= 66) stars = '&#11088;';
            else stars = '&#128170;';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '&#127942;' : '&#128218;'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-desenare.html'">
                                Quiz-ul 2: Desenare
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

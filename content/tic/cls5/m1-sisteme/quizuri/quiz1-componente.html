<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Componentele Calculatorului | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 1</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Componentele Calculatorului</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Ce este calculatorul?",
                description: "Invata ce este un calculator si care sunt partile lui principale",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un calculator?",
                        options: [
                            "Un aparat care face doar calcule matematice",
                            "O masina electronica care prelucreaza informatii",
                            "Un televizor special",
                            "Un telefon mare"
                        ],
                        correct: 1,
                        explanation: "Calculatorul este o masina electronica care poate primi, stoca si prelucra informatii. El poate face mult mai mult decat calcule matematice - poate rula programe, reda filme, permite navigarea pe internet si multe altele!"
                    },
                    {
                        text: "Care sunt cele doua mari categorii de componente ale unui calculator?",
                        options: [
                            "Albe si negre",
                            "Hardware si Software",
                            "Mari si mici",
                            "Vechi si noi"
                        ],
                        correct: 1,
                        explanation: "Calculatorul are doua tipuri de componente: HARDWARE (partile fizice pe care le poti atinge, ca monitorul sau tastatura) si SOFTWARE (programele care ruleaza pe calculator, ca Windows sau jocurile)."
                    },
                    {
                        text: "Ce inseamna 'hardware'?",
                        options: [
                            "Programele de calculator",
                            "Partile fizice ale calculatorului, pe care le poti atinge",
                            "Jocurile video",
                            "Internetul"
                        ],
                        correct: 1,
                        explanation: "Hardware-ul include toate componentele fizice pe care le poti vedea si atinge: monitorul, tastatura, mouse-ul, unitatea centrala, boxele, imprimanta etc."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Dispozitivele de intrare",
                description: "Descopera cum introducem informatii in calculator",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este un dispozitiv de intrare?",
                        options: [
                            "Un dispozitiv care afiseaza informatii",
                            "Un dispozitiv prin care introducem date in calculator",
                            "Un dispozitiv care stocheaza date",
                            "Un dispozitiv care tipareste"
                        ],
                        correct: 1,
                        explanation: "Dispozitivele de intrare (INPUT) sunt cele prin care trimitem informatii CATRE calculator. Prin ele 'vorbim' cu calculatorul - ii spunem ce sa faca."
                    },
                    {
                        text: "Care dintre urmatoarele este un dispozitiv de intrare?",
                        options: [
                            "Monitorul",
                            "Tastatura",
                            "Boxele",
                            "Imprimanta"
                        ],
                        correct: 1,
                        explanation: "Tastatura este un dispozitiv de INTRARE - prin ea introducem text si comenzi in calculator. Monitorul, boxele si imprimanta sunt dispozitive de IESIRE - ele ne arata sau ne dau informatii de la calculator."
                    },
                    {
                        text: "Mouse-ul este folosit pentru:",
                        options: [
                            "A asculta muzica",
                            "A indica, selecta si da comenzi pe ecran",
                            "A tipari documente",
                            "A vorbi cu alte persoane"
                        ],
                        correct: 1,
                        explanation: "Mouse-ul este un dispozitiv de intrare care ne permite sa mutam cursorul pe ecran, sa selectam obiecte (cu click stanga) si sa accesam meniuri (cu click dreapta)."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Dispozitivele de iesire",
                description: "Invata cum ne arata calculatorul rezultatele",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este un dispozitiv de iesire?",
                        options: [
                            "Un dispozitiv prin care introducem date",
                            "Un dispozitiv care ne arata rezultatele prelucrate de calculator",
                            "Un dispozitiv de stocare",
                            "Un cablu de alimentare"
                        ],
                        correct: 1,
                        explanation: "Dispozitivele de iesire (OUTPUT) sunt cele prin care calculatorul ne arata sau ne transmite rezultatele. Prin ele calculatorul 'ne raspunde' - ne arata ce a facut."
                    },
                    {
                        text: "Monitorul afiseaza:",
                        options: [
                            "Sunete",
                            "Imagini, text si video",
                            "Documente tiparite",
                            "Nimic"
                        ],
                        correct: 1,
                        explanation: "Monitorul (ecranul) este principalul dispozitiv de iesire vizual. Pe el vedem tot ce face calculatorul: texte, imagini, filme, jocuri, site-uri web etc."
                    },
                    {
                        text: "Imprimanta este un dispozitiv care:",
                        options: [
                            "Introduce date in calculator",
                            "Scaneaza documente",
                            "Tipareste pe hartie documentele de pe calculator",
                            "Reda sunete"
                        ],
                        correct: 2,
                        explanation: "Imprimanta este un dispozitiv de IESIRE care transforma documentele digitale in documente fizice pe hartie. Practic, 'scoate' informatia din calculator pe hartie."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Unitatea centrala",
                description: "Descopera 'creierul' calculatorului",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce este unitatea centrala?",
                        options: [
                            "Monitorul calculatorului",
                            "Cutia care contine componentele principale ale calculatorului",
                            "Tastatura",
                            "Mouse-ul"
                        ],
                        correct: 1,
                        explanation: "Unitatea centrala (carcasa sau 'tower') este cutia care contine cele mai importante componente: procesorul (CPU), memoria RAM, placa de baza, hard disk-ul etc. Este 'inima' calculatorului."
                    },
                    {
                        text: "Procesorul (CPU) este:",
                        options: [
                            "Un tip de monitor",
                            "'Creierul' calculatorului care executa instructiunile",
                            "O imprimanta speciala",
                            "Un tip de mouse"
                        ],
                        correct: 1,
                        explanation: "Procesorul (CPU - Central Processing Unit) este 'creierul' calculatorului. El executa toate calculele si instructiunile din programe. Cu cat procesorul e mai rapid, cu atat calculatorul lucreaza mai repede."
                    },
                    {
                        text: "Unde sunt stocate fisierele tale permanent (poze, jocuri, documente)?",
                        options: [
                            "Pe monitor",
                            "Pe hard disk (HDD) sau SSD",
                            "In tastatura",
                            "In mouse"
                        ],
                        correct: 1,
                        explanation: "Hard disk-ul (HDD) sau SSD-ul este dispozitivul de stocare permanenta. Aici raman salvate toate fisierele tale chiar si cand inchizi calculatorul: poze, muzica, jocuri, documente etc."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Recunoaste componentele",
                description: "Testeaza-ti cunostintele despre toate componentele",
                xpReward: 150,
                questions: [
                    {
                        text: "Identifica dispozitivele de INTRARE din lista urmatoare:",
                        options: [
                            "Monitor, boxe, imprimanta",
                            "Tastatura, mouse, microfon, scanner",
                            "Monitor, imprimanta, casti",
                            "Boxe, imprimanta, monitor"
                        ],
                        correct: 1,
                        explanation: "Dispozitivele de INTRARE sunt: tastatura (pentru text), mouse (pentru comenzi), microfon (pentru voce), scanner (pentru documente). Toate acestea TRIMIT informatii catre calculator."
                    },
                    {
                        text: "Ce componenta permite calculatorului sa se conecteze la internet fara fir?",
                        options: [
                            "Imprimanta",
                            "Placa de retea Wi-Fi",
                            "Monitor",
                            "Tastatura"
                        ],
                        correct: 1,
                        explanation: "Placa de retea Wi-Fi (sau adaptorul wireless) permite calculatorului sa se conecteze la internet fara sa foloseasca cabluri. Capteaza semnalul Wi-Fi de la router."
                    },
                    {
                        text: "Un calculator are nevoie de energie electrica pentru a functiona. Ce componenta transforma curentul din priza intr-un curent potrivit pentru calculator?",
                        options: [
                            "Monitorul",
                            "Sursa de alimentare (PSU)",
                            "Mouse-ul",
                            "Tastatura"
                        ],
                        correct: 1,
                        explanation: "Sursa de alimentare (PSU - Power Supply Unit) este componenta din unitatea centrala care transforma curentul electric din priza (220V) in curent de voltaj mai mic, potrivit pentru componentele calculatorului."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('sisteme_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('sisteme_quiz1_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Foarte bine!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar... Hai sa invatam!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-software.html'">
                                Quiz-ul 2: Software
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

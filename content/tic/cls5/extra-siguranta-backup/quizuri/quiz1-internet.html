<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Ce este Internetul | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">



</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Siguranta digitala si multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Ce este Internetul</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Ce este Internetul?",
                description: "Invata ce este internetul si cum functioneaza",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este Internetul?",
                        options: [
                            "Un program de calculator",
                            "O retea mondiala care conecteaza calculatoare din toata lumea",
                            "Un joc video",
                            "Un tip de televizor"
                        ],
                        correct: 1,
                        explanation: "Internetul este o retea mondiala uriasa care conecteaza milioane de calculatoare, telefoane si alte dispozitive din toata lumea, permitandu-le sa comunice intre ele."
                    },
                    {
                        text: "Ce ai nevoie ca sa te conectezi la Internet?",
                        options: [
                            "Doar un calculator",
                            "Un dispozitiv (calculator/telefon) si o conexiune la Internet (Wi-Fi sau cablu)",
                            "Doar un televizor",
                            "Doar o imprimanta"
                        ],
                        correct: 1,
                        explanation: "Pentru a te conecta la Internet ai nevoie de un dispozitiv (calculator, telefon, tableta) si o conexiune la Internet, fie prin Wi-Fi (wireless), fie prin cablu."
                    },
                    {
                        text: "Ce inseamna 'a fi online'?",
                        options: [
                            "A sta la coada",
                            "A fi conectat la Internet",
                            "A desena linii",
                            "A fi la scoala"
                        ],
                        correct: 1,
                        explanation: "Cand esti 'online' inseamna ca dispozitivul tau este conectat la Internet si poti accesa site-uri web, trimite mesaje sau folosi aplicatii care necesita Internet."
                    }
                ]
            },
            2: {
                title: "Nivel 2: La ce foloseste Internetul?",
                description: "Descopera ce poti face pe Internet",
                xpReward: 75,
                questions: [
                    {
                        text: "Care dintre urmatoarele NU poti face pe Internet?",
                        options: [
                            "Sa cauti informatii pentru teme",
                            "Sa trimiti un email",
                            "Sa simti mirosul florilor",
                            "Sa vizionezi videoclipuri educative"
                        ],
                        correct: 2,
                        explanation: "Internetul ne permite sa facem multe lucruri: cautam informatii, trimitem mesaje, vizionam video. Dar nu poate transmite mirosuri sau gusturi - acestea necesita simturile noastre fizice!"
                    },
                    {
                        text: "Ce este un site web (website)?",
                        options: [
                            "Un paianjen pe Internet",
                            "O pagina sau un grup de pagini pe Internet unde gasesti informatii",
                            "Un tip de calculator",
                            "O retea de telefonie"
                        ],
                        correct: 1,
                        explanation: "Un site web este o colectie de pagini pe Internet care contin informatii, imagini, video. De exemplu, Wikipedia, YouTube sau site-ul scolii tale sunt site-uri web."
                    },
                    {
                        text: "De ce este util Internetul pentru elevi?",
                        options: [
                            "Doar pentru jocuri",
                            "Pentru a cauta informatii, a invata lucruri noi si a comunica cu colegii",
                            "Nu este util deloc",
                            "Doar pentru a asculta muzica"
                        ],
                        correct: 1,
                        explanation: "Internetul este foarte util pentru elevi: poti gasi informatii pentru referate, invata prin videoclipuri educative, comunica cu profesorii si colegii, si multe altele!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Aplica ce stii (scenarii reale)",
                description: "Foloseste cunostintele despre Internet in situatii concrete",
                xpReward: 100,
                questions: [
                    {
                        text: "Maria vrea sa gaseasca informatii pentru un referat despre delfini. Care este ordinea corecta de pasi pe care ar trebui sa o urmeze?",
                        options: [
                            "Deschide un joc, cauta delfini, copiaza tot textul in caiet",
                            "Deschide browserul, scrie 'delfini' in motorul de cautare, citeste si selecteaza informatii din surse de incredere",
                            "Trimite un email unui prieten si asteapta raspuns",
                            "Porneste televizorul si cauta un documentar"
                        ],
                        correct: 1,
                        explanation: "Cautarea eficienta pe web (World Wide Web) inseamna: deschizi browserul, folosesti un motor de cautare (ex. Google), evaluezi sursele (enciclopedii, site-uri educationale) si selectezi informatiile relevante. Aceasta face parte din competenta V-1.3 din programa."
                    },
                    {
                        text: "Andrei vrea sa trimita tema unui coleg, dar nu se pot intalni. Ce serviciu al Internetului este cel mai potrivit?",
                        options: [
                            "Sa printeze tema si sa o lase la usa",
                            "Email - trimite fisierul ca atasament",
                            "Sa sune la un post de radio",
                            "Sa caute tema pe un site web"
                        ],
                        correct: 1,
                        explanation: "Emailul este un serviciu al retelei Internet care permite transmiterea de mesaje si fisiere (atasamente) rapid, oriunde in lume. Este unul dintre serviciile de baza ale Internetului studiate la clasa a V-a."
                    },
                    {
                        text: "Ioana gaseste pe un site informatia 'Pamantul este plat'. Ce ar trebui sa faca inainte sa foloseasca aceasta informatie?",
                        options: [
                            "Sa o copieze imediat in referat, pentru ca e pe Internet",
                            "Sa verifice informatia pe mai multe surse de incredere (enciclopedii, site-uri stiintifice)",
                            "Sa o trimita tuturor colegilor",
                            "Sa inchida browserul, nu conteaza"
                        ],
                        correct: 1,
                        explanation: "Nu orice informatie de pe Internet este corecta! Cautarea si salvarea de informatii de incredere (World Wide Web: navigare, cautare, salvare informatii) inseamna sa verifici mai multe surse serioase. Aceasta este o competenta cheie din programa clasei a V-a."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Analizeaza si compara",
                description: "Compara servicii si situatii, identifica diferente importante",
                xpReward: 125,
                questions: [
                    {
                        text: "Care este diferenta principala dintre un site web (.edu) si un site (.com) atunci cand cauti informatii pentru scoala?",
                        options: [
                            "Nu exista nicio diferenta, toate site-urile sunt la fel de corecte",
                            "Site-urile .edu sunt de obicei create de institutii educationale si au informatii mai verificate stiintific; .com poate fi orice firma",
                            "Site-urile .com sunt intotdeauna mai corecte",
                            "Extensia domeniului nu are legatura cu continutul"
                        ],
                        correct: 1,
                        explanation: "Extensia domeniului da un indiciu despre tipul organizatiei: .edu = educational (universitati, scoli), .org = organizatii, .com = comercial. Pentru teme si referate, sursele .edu sau .org recunoscute sunt in general mai de incredere. Evaluarea surselor este parte din navigarea sigura pe web (programa V, domeniul Internet)."
                    },
                    {
                        text: "Compara cele doua situatii: (A) Trimiti un email cu tema unui profesor. (B) Postezi tema pe un forum public. Care diferenta este cea mai importanta din punct de vedere al sigurantei?",
                        options: [
                            "Emailul este mai lent decat un forum",
                            "La forum oricine poate vedea datele tale personale si munca ta; emailul ajunge doar la destinatar",
                            "Forumul este intotdeauna mai sigur pentru teme",
                            "Nu exista nicio diferenta importanta"
                        ],
                        correct: 1,
                        explanation: "Siguranta pe Internet (tema din programa clasei a V-a) inseamna sa stii unde ajung informatiile tale. Un email ajunge doar la destinatarul ales; un forum public expune informatia oricui. Aceasta este o diferenta esentiala intre serviciile Internetului."
                    },
                    {
                        text: "Ana vrea sa salveze un articol de pe Internet pentru referat. Are trei variante: (1) copiaza tot textul fara sa mentioneze sursa; (2) salveaza linkul si citeaza autorul; (3) descarca imaginile si le prezinta ca ale ei. Care varianta respecta drepturile de autor?",
                        options: [
                            "Varianta 1 - copiaza tot",
                            "Varianta 2 - salveaza linkul si citeaza autorul",
                            "Varianta 3 - descarca imaginile",
                            "Toate variantele sunt la fel"
                        ],
                        correct: 1,
                        explanation: "Drepturile de autor (copyright) sunt parte explicita a programei clasei a V-a (domeniul Internet). Cand folosesti informatii de pe web trebuie sa mentionezi sursa si autorul. A copia fara sa citezi sau a prezenta imaginile altcuiva ca ale tale incalca drepturile de autor."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Gandire critica si sinteza",
                description: "Evalueaza situatii complexe si argumenteaza decizii despre Internet",
                xpReward: 150,
                questions: [
                    {
                        text: "Un elev primeste un email de la o adresa necunoscuta care ii cere parola contului de scoala, spunand ca altfel contul va fi sters. Ce ar trebui sa faca si DE CE?",
                        options: [
                            "Sa trimita parola imediat, ca sa nu piarda contul",
                            "Sa ignore emailul si sa anunte un parinte sau profesor - nicio institutie serioasa nu cere parola prin email; acesta este un atac de tip phishing",
                            "Sa raspunda la email cu intrebari suplimentare",
                            "Sa trimita emailul mai departe la toti colegii"
                        ],
                        correct: 1,
                        explanation: "Siguranta pe Internet (programa V-1.3) inseamna sa recunosti tentativele de inselaciune. Cererile de parola prin email sunt atacuri de tip phishing - nimeni legitim nu iti cere parola astfel. Regula: nu dai niciodata parola, anunti un adult de incredere. Aceasta este o aplicatie directa a competentei de utilizare sigura a Internetului."
                    },
                    {
                        text: "Ionut a gasit un articol excelent pentru referat. El vrea sa foloseasca trei paragrafe din el. Evalueaza care dintre urmatoarele actiuni este cea mai corecta si completa:",
                        options: [
                            "Copiaza paragrafele exact, fara modificari, fara sa mentioneze sursa",
                            "Rescrie ideile cu cuvintele lui, mentionand la sfarsit titlul articolului si adresa web (URL) unde l-a gasit",
                            "Copiaza paragrafele si scrie la sfarsit doar 'de pe Internet'",
                            "Nu foloseste deloc informatii de pe Internet, ca sa fie sigur"
                        ],
                        correct: 1,
                        explanation: "Respectarea drepturilor de autor si utilizarea corecta a informatiilor de pe web (programa clasa V, domeniul Internet) inseamna: reformulezi ideile cu propriile cuvinte SI citezi sursa complet (titlu, autor daca e disponibil, URL). 'De pe Internet' nu este o citare corecta. Copierea mot-a-mot fara citat este plagiat."
                    },
                    {
                        text: "Clasa a V-a B dezbate: 'Internetul face mai mult rau decat bine elevilor.' Colegul tau sustine ca DA, pentru ca exista jocuri si reclame. Tu trebuie sa construiesti argumentul CONTRA, bazat pe serviciile Internetului studiate. Care este cel mai solid argument?",
                        options: [
                            "Internetul e mereu bun pentru ca e modern",
                            "Internetul ofera acces la informatii educative, comunicare cu profesorii prin email, resurse de invatare - beneficiile depind de modul in care il folosim, nu de existenta lui",
                            "Internetul e rau pentru ca are reclame",
                            "Nu exista niciun argument contra, colegul are dreptate"
                        ],
                        correct: 1,
                        explanation: "Sinteza competentelor din programa clasei a V-a: Internetul ofera servicii esentiale (cautare informatii, email, resurse educationale - WWW) care sprijina invatarea. Riscurile (jocuri excesive, reclame) tin de modul de utilizare, nu de tehnologie in sine. Utilizarea eficienta si in siguranta (competenta V-1.3) este raspunsul: nu 'fara Internet', ci 'Internet responsabil'."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('siguranta_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('siguranta_quiz1_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Foarte bine!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu este corect. Hai sa vedem de ce!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-browser.html'">
                                Quiz-ul 2: Navigarea pe Internet
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

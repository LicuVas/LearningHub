<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Reguli de siguranta online | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }

/* Scenario box */
        .scenario-box {
            background: var(--bg-card);
            border: 2px solid var(--accent-yellow);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem auto;
            max-width: 500px;
        }

.scenario-box .scenario-label {
            color: var(--accent-yellow);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

.scenario-box .scenario-text {
            color: var(--text-primary);
            font-style: italic;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Siguranta digitala si multimedia</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Reguli de siguranta online</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Nu vorbi cu necunoscutii online",
                description: "Invata de ce nu trebuie sa vorbesti cu straini pe Internet",
                xpReward: 50,
                questions: [
                    {
                        text: "De ce este periculos sa vorbesti cu necunoscuti pe Internet?",
                        options: [
                            "Nu este periculos deloc",
                            "Pentru ca nu stii cine este cu adevarat persoana din spatele ecranului",
                            "Pentru ca vorbitul online costa bani",
                            "Pentru ca se strica calculatorul"
                        ],
                        correct: 1,
                        explanation: "Pe Internet, oricine poate pretinde ca este altcineva. Un 'copil de varsta ta' poate fi de fapt un adult cu intentii rele. Nu stii niciodata cine este cu adevarat!"
                    },
                    {
                        text: "Cineva pe care nu-l cunosti online iti cere sa fiti prieteni. Ce faci?",
                        hasScenario: true,
                        scenario: "Un necunoscut iti trimite: 'Buna! Ai vrea sa fim prieteni? Parem sa avem aceleasi hobby-uri!'",
                        options: [
                            "Accept imediat, pare dragut",
                            "Nu accept si spun unui adult de incredere",
                            "Ii dau numarul meu de telefon",
                            "Ii spun unde locuiesc"
                        ],
                        correct: 1,
                        explanation: "Cand cineva necunoscut te contacteaza online, cea mai sigura optiune este sa NU accepti si sa spui unui parinte sau adult de incredere. Ei te pot ajuta sa verifici situatia."
                    },
                    {
                        text: "Care este regula de aur cand vine vorba de straini pe Internet?",
                        options: [
                            "Sa vorbesc cu cat mai multi straini",
                            "Sa nu vorbesc niciodata cu straini si sa spun unui adult daca cineva necunoscut ma contacteaza",
                            "Sa accept toti prietenii noi",
                            "Sa dau informatii personale ca sa fac prieteni"
                        ],
                        correct: 1,
                        explanation: "Regula de aur: NU vorbi cu straini online si SPUNE MEREU unui adult de incredere daca cineva necunoscut incearca sa te contacteze sau iti cere informatii."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Nu da informatii personale",
                description: "Invata ce informatii trebuie sa pastrezi private",
                xpReward: 75,
                questions: [
                    {
                        text: "Care dintre urmatoarele sunt informatii personale pe care NU trebuie sa le dai online?",
                        options: [
                            "Culoarea ta preferata",
                            "Numele complet, adresa, scoala, numarul de telefon",
                            "Ce sport iti place",
                            "Ce muzica asculti"
                        ],
                        correct: 1,
                        explanation: "Informatiile personale includ: numele complet, adresa, scoala, numarul de telefon, varsta exacta, poze cu tine. Acestea nu trebuie date niciodata strainilor online!"
                    },
                    {
                        text: "Cineva online iti cere adresa 'ca sa-ti trimita un cadou'. Ce faci?",
                        hasScenario: true,
                        scenario: "Un 'prieten' online: 'Am un cadou super pentru tine! Trimite-mi adresa ta ca sa ti-l pot trimite!'",
                        options: [
                            "Ii dau adresa, vreau cadoul!",
                            "NU ii dau adresa si spun unui adult - aceasta este o capcana periculoasa",
                            "Ii dau adresa unui prieten in loc",
                            "Ii dau doar orasul, nu toata adresa"
                        ],
                        correct: 1,
                        explanation: "Aceasta este o tactica folosita de persoane rau intentionate! NICIODATA nu da adresa ta unui strain online, indiferent de motivul pe care il ofera. Spune imediat unui adult!"
                    },
                    {
                        text: "De ce este periculos sa publici poze cu tine online?",
                        options: [
                            "Nu este periculos",
                            "Pentru ca strainii pot vedea cum arati si te pot recunoaste in viata reala",
                            "Pentru ca pozele ocupa mult spatiu",
                            "Pentru ca pozele se strica"
                        ],
                        correct: 1,
                        explanation: "Pozele tale pot fi vazute de oricine si pot fi folosite de persoane rau intentionate. Odata postate, nu mai ai control asupra lor. Cere permisiunea parintilor inainte de a posta poze!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Recunoaste pericolele online",
                description: "Invata sa identifici situatiile periculoase",
                xpReward: 100,
                questions: [
                    {
                        text: "Care dintre urmatoarele mesaje ar trebui sa te alarmeze?",
                        options: [
                            "'Iti recomand aceasta carte, e foarte buna!'",
                            "'Nu spune nimanui de conversatia noastra, e secretul nostru'",
                            "'Ai vazut ultimul episod din serialul acela?'",
                            "'Ce ai facut la scoala azi?'"
                        ],
                        correct: 1,
                        explanation: "Cand cineva iti cere sa pastrezi un secret fata de parinti sau profesori, este un semnal de alarma MAJOR! Adultii de incredere nu cer copiilor sa aiba secrete fata de parintii lor."
                    },
                    {
                        text: "Ce este 'phishing' (pescuit de date)?",
                        options: [
                            "Un joc de pescuit online",
                            "O incercare de a te pacali sa dai informatii personale sau parole",
                            "Un tip de peste",
                            "Un program de calculator"
                        ],
                        correct: 1,
                        explanation: "Phishing este cand cineva incearca sa te pacaleasca (prin email, mesaje sau site-uri false) sa dai parole, informatii bancare sau alte date personale. Verifica mereu sursa!"
                    },
                    {
                        text: "Primesti un email care spune 'Ai castigat un premiu! Click aici!'. Ce faci?",
                        hasScenario: true,
                        scenario: "Email: 'FELICITARI! Ai castigat un iPhone 15! Click pe link pentru a-l revendica ACUM!'",
                        options: [
                            "Dau click imediat, vreau premiul!",
                            "Nu dau click, este probabil o inselaciune, si spun unui adult",
                            "Dau click doar daca pare real",
                            "Trimit email-ul la toti prietenii"
                        ],
                        correct: 1,
                        explanation: "Astfel de email-uri sunt aproape intotdeauna inselaciuni (scam)! Nimeni nu da premii random. NU da click pe astfel de link-uri si informeaza un adult."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Ce faci cand ceva e in neregula",
                description: "Invata cum sa reactionezi in situatii periculoase",
                xpReward: 125,
                questions: [
                    {
                        text: "Daca vezi ceva online care te sperie sau te face sa te simti inconfortabil, ce faci?",
                        options: [
                            "Continui sa ma uit, poate devine mai bine",
                            "Inchid pagina si spun unui adult de incredere",
                            "Trimit link-ul prietenilor",
                            "Nu spun nimanui, ma descurc singur"
                        ],
                        correct: 1,
                        explanation: "Daca ceva online te sperie sau te face sa te simti ciudat, opreste-te, inchide pagina si vorbeste cu un parinte, profesor sau alt adult de incredere. Nu esti niciodata in necaz daca ceri ajutor!"
                    },
                    {
                        text: "Cineva online te roaga sa va intalniti in viata reala. Ce faci?",
                        hasScenario: true,
                        scenario: "Mesaj: 'Hai sa ne intalnim in parcul din centru maine! O sa fie distractiv!'",
                        options: [
                            "Ma duc singur la intalnire",
                            "NICIODATA nu ma intalnesc cu straini de pe Internet si spun imediat unui parinte",
                            "Ma duc dar iau un prieten cu mine",
                            "Il intreb daca poate veni la mine acasa"
                        ],
                        correct: 1,
                        explanation: "NICIODATA, NICIODATA nu te intalni cu cineva pe care l-ai cunoscut online! Aceasta este extrem de periculos. Spune IMEDIAT unui parinte daca cineva iti cere acest lucru!"
                    },
                    {
                        text: "Cui trebuie sa spui daca ceva nepotrivit se intampla online?",
                        options: [
                            "Nimanui, e treaba mea",
                            "Unui parinte, profesor sau alt adult de incredere",
                            "Doar prietenilor de aceeasi varsta",
                            "Strainului care mi-a trimis mesajul"
                        ],
                        correct: 1,
                        explanation: "Spune MEREU unui adult de incredere (parinte, profesor, bunic, etc.) daca ceva te ingrijoreaza online. Ei sunt acolo sa te ajute si sa te protejeze!"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Gandeste inainte sa dai click",
                description: "Invata sa fii precaut online",
                xpReward: 150,
                questions: [
                    {
                        text: "Inainte de a da click pe un link, ce ar trebui sa te gandesti?",
                        options: [
                            "Nu trebuie sa ma gandesc la nimic",
                            "De la cine vine? Pare de incredere? Asteptam acest mesaj?",
                            "Daca are culori frumoase",
                            "Daca link-ul e lung sau scurt"
                        ],
                        correct: 1,
                        explanation: "Inainte de a da click, intreaba-te: Cine mi-a trimis asta? Este o persoana/sursa de incredere? Asteptam acest link? Daca ceva pare ciudat, nu da click!"
                    },
                    {
                        text: "Ce faci daca un site iti cere sa instalezi ceva pentru a 'castiga un joc'?",
                        hasScenario: true,
                        scenario: "Pop-up: 'Instaleaza acest program GRATUIT ca sa deblochezi toate nivelurile!'",
                        options: [
                            "Instalez imediat, vreau jocul!",
                            "NU instalez nimic fara permisiunea parintilor - poate fi un virus",
                            "Instalez doar daca pare real",
                            "Intreb pe chat daca altcineva a instalat"
                        ],
                        correct: 1,
                        explanation: "NU instala NICIODATA programe fara permisiunea parintilor! Multe astfel de pop-up-uri contin virusi sau programe daunatoare. Cere mereu ajutorul unui adult."
                    },
                    {
                        text: "Care este cel mai important lucru de retinut despre siguranta online?",
                        options: [
                            "Internetul e sigur, nu trebuie sa fii atent",
                            "Gandeste inainte sa actionezi si cere ajutorul adultilor cand ceva pare gresit",
                            "Sa petreci cat mai mult timp online",
                            "Sa accepti toti prietenii noi"
                        ],
                        correct: 1,
                        explanation: "Cel mai important lucru: GANDESTE inainte sa dai click sau sa raspunzi, si CERE AJUTOR de la un adult de incredere cand ceva nu pare in regula. Siguranta ta este prioritatea!"
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('siguranta_quiz3_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('siguranta_quiz3_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add scenario box if present
            if (q.hasScenario && q.scenario) {
                questionContent += `
                    <div class="scenario-box">
                        <div class="scenario-label">SITUATIE:</div>
                        <div class="scenario-text">${q.scenario}</div>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Gandesti ca un expert in siguranta online!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">⚠️</div>
                    <div class="feedback-text">Atentie! Este important sa stii raspunsul corect:</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🛡️' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai exerseaza!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-parole.html'">
                                Quiz-ul 4: Parole si date personale
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

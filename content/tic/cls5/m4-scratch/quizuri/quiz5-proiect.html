<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Planificarea Proiectului | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Planificarea Proiectului</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: { title: "Nivel 1: Ideea proiectului", description: "Invata cum sa planifici un proiect Scratch", xpReward: 50, questions: [
                { text: "Care este primul pas cand vrei sa creezi un proiect in Scratch?", options: ["Incepi sa tragi blocuri imediat", "Gandesti si planifici: ce va face proiectul, cine sunt personajele, ce se intampla", "Cauti un proiect gata facut sa il copiezi", "Alegi culorile frumoase"], correct: 1, explanation: "Inainte de a scrie cod, planifici! Gandeste-te: Ce va face proiectul? (joc, animatie, poveste) Care sunt personajele? Ce se intampla pas cu pas? Planificarea te ajuta sa nu te pierzi si sa nu uiti nimic important." },
                { text: "Ce tipuri de proiecte poti crea in Scratch?", options: ["Doar jocuri", "Jocuri, animatii, povesti interactive, simulari, prezentari, instrumente muzicale si multe altele", "Doar animatii", "Doar prezentari"], correct: 1, explanation: "Scratch este foarte versatil! Poti crea: jocuri (platformer, labirint, quiz), animatii si desene animate, povesti interactive, simulari stiintifice, instrumente muzicale, prezentari interactive, tutoriale si multe altele. Imaginatia este singura limita!" },
                { text: "Ce este un 'storyboard' pentru un proiect Scratch?", options: ["Un tip de bloc Scratch", "Un plan vizual care arata, cadru cu cadru, ce se intampla in proiect", "Un fundal special", "O lista de sprite-uri"], correct: 1, explanation: "Un storyboard este un plan vizual - o serie de schite/desene care arata ce se intampla in fiecare scena/moment al proiectului. Ca la un film, desenezi pe hartie scenele principale inainte de a le crea in Scratch. Te ajuta sa organizezi ideile." }
            ]},
            2: { title: "Nivel 2: Sprite-uri si fundaluri", description: "Planifica elementele vizuale ale proiectului", xpReward: 75, questions: [
                { text: "Cum alegi sprite-urile potrivite pentru proiectul tau?", options: ["Alegi la intamplare", "Te gandesti la ce personaje si obiecte ai nevoie si le alegi sau le creezi in functie de tema", "Folosesti doar pisica Scratch", "Pui cat mai multe sprite-uri"], correct: 1, explanation: "Alege sprite-urile in functie de tema proiectului: pentru un joc cu spatiu ai nevoie de o racheta si asteroizi, pentru o poveste cu animale ai nevoie de personajele respective. Poti folosi sprite-uri din biblioteca, le poti desena sau importa imagini." },
                { text: "De cate fundaluri ai nevoie pentru o poveste cu 3 scene diferite?", options: ["Un singur fundal", "Cel putin 3 fundaluri, cate unul pentru fiecare scena", "10 fundaluri", "Nu ai nevoie de fundaluri"], correct: 1, explanation: "Pentru 3 scene diferite ai nevoie de cel putin 3 fundaluri diferite. De exemplu: scena 1 - o padure, scena 2 - un castel, scena 3 - o camera. Fundalul se schimba cu blocul 'schimba fundalul cu...' pentru a crea tranzitii intre scene." },
                { text: "Ce sunt 'costumele' in contextul planificarii unui proiect?", options: ["Haine pentru programator", "Diferitele infatisari ale sprite-urilor, necesare pentru animatii si stari diferite", "Culori pentru fundal", "Tipuri de blocuri"], correct: 1, explanation: "Cand planifici, gandeste-te ce costume are nevoie fiecare sprite: costume de mers (pentru animatia de deplasare), costume de expresii (bucurie, tristete), costume de actiuni (salt, cadere). Un sprite bine planificat are toate costumele necesare." }
            ]},
            3: { title: "Nivel 3: Algoritmul proiectului", description: "Planifica logica si comportamentul", xpReward: 100, questions: [
                { text: "Cum planifici comportamentul unui personaj intr-un joc?", options: ["Nu planifici, improvizezi", "Descrii pas cu pas ce face personajul: cum se misca, ce se intampla la coliziuni, cum castigi/pierzi", "Copiezi de la altcineva", "Pui toate blocurile si vezi ce se intampla"], correct: 1, explanation: "Planifica comportamentul detaliat: Cum se controleaza personajul? (taste/mouse) Ce se intampla cand atinge un inamic? (pierde viata) Cand castigi? (scor = 100 sau ajungi la final) Ce animatii are? Un plan bun face programarea mult mai usoara." },
                { text: "Ce elemente trebuie sa planifici pentru un joc simplu?", options: ["Doar personajul principal", "Personaje, reguli (cum castigi/pierzi), scor, nivele, sunete si grafice", "Doar scorul", "Doar fundalul"], correct: 1, explanation: "Un joc complet are nevoie de: personaje (jucator + inamici/obstacole), reguli clare (cum castigi, cum pierzi, vieti), sistem de scor (puncte, bonusuri), feedback vizual/sonor (sunete, efecte), si optional nivele crescande in dificultate." },
                { text: "De ce este important sa imparti proiectul in parti mai mici?", options: ["Nu e important", "Fiecare parte e mai usor de creat, testat si reparat decat totul deodata", "Pentru a face proiectul mai lung", "Pentru ca asa cere profesorul"], correct: 1, explanation: "Impartirea in parti mici (decomposition) face proiectul managabil: mai intai faci miscarea personajului, testezi. Apoi adaugi inamicii, testezi. Apoi scorul, apoi sunetele. Daca ceva nu merge, stii exact unde e problema si o repari usor." }
            ]},
            4: { title: "Nivel 4: Testarea si imbunatatirea", description: "Invata sa testezi si sa imbunatatesti proiectul", xpReward: 125, questions: [
                { text: "De ce este important sa testezi proiectul in timpul dezvoltarii?", options: ["Nu e important, testezi doar la final", "Gasesti si repari erorile devreme, cand sunt usor de reparat", "Testarea incetineste munca", "Doar profesorul trebuie sa testeze"], correct: 1, explanation: "Testarea continua (dupa fiecare functionalitate adaugata) te ajuta sa gasesti erorile (bug-uri) devreme, cand sunt usor de reparat. Daca astepti pana la final si ceva nu merge, este mult mai greu sa gasesti problema intr-un proiect mare." },
                { text: "Ce faci cand gasesti un bug (o eroare) in proiectul tau?", options: ["Renunti la proiect", "Incerci sa gasesti cauza, o repari si testezi din nou", "Ignori eroarea", "Stergi tot si o iei de la inceput"], correct: 1, explanation: "Procesul de debugging (gasirea si repararea erorilor) este: 1) Identifica problema (ce nu merge?), 2) Gaseste cauza (de ce nu merge? - verifica blocurile), 3) Repara (modifica blocurile), 4) Testeaza din nou. Toti programatorii fac debugging - este o parte normala a programarii!" },
                { text: "Cum poti imbunatati un proiect dupa ce functioneaza corect?", options: ["Nu il mai schimbi niciodata", "Adaugi efecte sonore, grafice mai bune, nivele suplimentare sau optimizezi codul", "Il stergi si faci altul", "Adaugi cat mai multe sprite-uri inutile"], correct: 1, explanation: "Dupa ce proiectul functioneaza, il poti imbunatati: adauga efecte sonore si vizuale, imbunatateste grafica, adauga nivele noi, fa-l mai intuitiv pentru utilizator, optimizeaza codul (simplifica scripturile). Un proiect bun se imbunatateste continuu!" }
            ]},
            5: { title: "Nivel 5: Concepte combinate", description: "Testeaza-ti cunostintele complete de Scratch", xpReward: 150, questions: [
                { text: "Ce concepte de programare ai invatat in Scratch?", options: ["Doar desenarea", "Secventa, repetitia (bucle), decizia (daca/altfel), variabile, evenimente si paralelism", "Doar miscarea sprite-urilor", "Doar sunetele"], correct: 1, explanation: "In Scratch ai invatat concepte fundamentale de programare: secventa (blocuri in ordine), repetitia (repeta/la infinit), decizia (daca/daca-altfel), variabile (scor, vieti), evenimente (steag verde, taste) si paralelism (mai multe scripturi simultan). Aceste concepte exista in TOATE limbajele de programare!" },
                { text: "Cum impartasesti proiectul tau Scratch cu altii?", options: ["Trimiti calculatorul cuiva", "Il publici pe site-ul Scratch (scratch.mit.edu) unde oricine il poate vedea si remixui", "Il tiparesti pe hartie", "Nu poti impartasi proiecte Scratch"], correct: 1, explanation: "Pe scratch.mit.edu poti publica (Share) proiectul. Alti utilizatori il pot vedea, juca, comenta si chiar 'remixa' (modifica si crea propria versiune). Comunitatea Scratch are milioane de proiecte create de copii din toata lumea!" },
                { text: "Ce este cel mai important lucru pe care l-ai invatat despre programare?", options: ["Programarea e doar pentru genii", "Gandirea logica si rezolvarea problemelor pas cu pas - abilitati utile in orice domeniu", "Programarea e doar despre calculatoare", "Doar limbajul Scratch conteaza"], correct: 1, explanation: "Cel mai important lucru nu e limbajul Scratch in sine, ci GANDIREA COMPUTATIONALA: descompunerea problemelor in parti mici, recunoasterea pattern-urilor, abstractizarea si crearea de algoritmi. Aceste abilitati te ajuta in matematica, stiinte, limba romana - in orice domeniu al vietii!" }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m4_quiz5_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m4_quiz5_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='../index.html'">Inapoi la Modul</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Structuri de Decizie in Scratch | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Structuri de Decizie in Scratch</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer><strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a></footer>

    <script>
        const levels = {
            1: { title: "Nivel 1: Blocul Daca (If)", description: "Invata structura de decizie simpla", xpReward: 50, questions: [
                { text: "Ce face blocul 'daca...atunci' (if...then) in Scratch?", options: ["Repeta blocurile din interior", "Verifica o conditie si executa blocurile din interior DOAR daca conditia este adevarata", "Opreste programul", "Schimba culoarea sprite-ului"], correct: 1, explanation: "Blocul 'daca...atunci' verifica o conditie. Daca conditia este adevarata (true), se executa blocurile din interior. Daca este falsa (false), se sare peste ele. Este ca in viata reala: 'Daca ploua, atunci iau umbrela'." },
                { text: "Ce forma au conditiile (blocurile de detectie) in Scratch?", options: ["Dreptunghiulara", "Hexagonala (cu varfuri ascutite laterale)", "Rotunda", "Triunghiulara"], correct: 1, explanation: "Conditiile in Scratch au forma hexagonala (scut cu doua varfuri laterale). Aceasta forma speciala se potriveste exact in spatiul de conditie al blocurilor 'daca' si 'repeta pana cand'. Exemplu: 'atingi marginea?', 'tasta space apasata?'." },
                { text: "Ce se intampla daca conditia din blocul 'daca' este falsa?", options: ["Programul se opreste", "Blocurile din interior nu se executa, programul continua cu urmatorul bloc de dupa 'daca'", "Se executa blocurile de doua ori", "Apare o eroare"], correct: 1, explanation: "Daca conditia este falsa, blocurile din interior sunt sarite complet si programul continua normal cu urmatorul bloc de dupa structura 'daca'. Nu se intampla nimic rau - pur si simplu acea parte de cod nu se executa." }
            ]},
            2: { title: "Nivel 2: Blocul Daca-Altfel (If-Else)", description: "Invata decizia cu doua ramuri", xpReward: 75, questions: [
                { text: "Ce face blocul 'daca...atunci...altfel' (if...then...else)?", options: ["Executa ambele ramuri", "Verifica conditia: daca e adevarata executa prima ramura, daca e falsa executa a doua ramura", "Repeta conditia de doua ori", "Opreste si reporneste programul"], correct: 1, explanation: "Blocul 'daca...atunci...altfel' ofera doua cai: daca conditia e adevarata, executa prima ramura (atunci). Daca e falsa, executa a doua ramura (altfel). Intotdeauna se executa exact UNA din cele doua ramuri, niciodata ambele!" },
                { text: "Exemplu: 'daca <atingi culoarea rosie> atunci [spune Ai pierdut!] altfel [spune Continua!]'. Ce se intampla cand sprite-ul atinge ceva rosu?", options: ["Spune 'Continua!'", "Spune 'Ai pierdut!'", "Nu face nimic", "Spune ambele mesaje"], correct: 1, explanation: "Cand sprite-ul atinge culoarea rosie, conditia este adevarata, deci se executa prima ramura: 'spune Ai pierdut!'. Daca NU ar atinge rosu, s-ar executa ramura 'altfel': 'spune Continua!'. Acest mecanism e perfect pentru jocuri!" },
                { text: "Care este diferenta dintre 'daca' si 'daca-altfel'?", options: ["Nu exista nicio diferenta", "'daca' face ceva DOAR cand conditia e adevarata; 'daca-altfel' face ceva si cand e adevarata SI cand e falsa", "'daca-altfel' e mai rapid", "'daca' e pentru numere, 'daca-altfel' pentru text"], correct: 1, explanation: "Blocul 'daca' simplu executa cod DOAR cand conditia e adevarata (altfel nu face nimic extra). Blocul 'daca-altfel' are doua ramuri: face ceva cand conditia e adevarata si ALTCEVA cand e falsa. 'Daca-altfel' acopera ambele situatii." }
            ]},
            3: { title: "Nivel 3: Conditii cu tastatura", description: "Detecteaza apasarea tastelor", xpReward: 100, questions: [
                { text: "Cum detectezi daca o tasta este apasata in Scratch?", options: ["Folosesti blocul 'mergi'", "Folosesti blocul 'tasta [space] apasata?' din categoria Detectie", "Asculti sunetul tastaturii", "Verifici mouse-ul"], correct: 1, explanation: "Blocul 'tasta [...] apasata?' (key ... pressed?) din categoria Detectie returneaza adevarat cat timp tasta specificata este tinuta apasata. Il pui in conditia unui bloc 'daca' pentru a reactiona la apasarea tastelor." },
                { text: "Script: [la infinit] [daca <tasta sageata dreapta apasata> atunci] [mergi 10 pasi]. Ce face?", options: ["Sprite-ul se misca automat tot timpul", "Sprite-ul se misca la dreapta DOAR cand tii apasata sageata dreapta", "Sprite-ul se roteste", "Sprite-ul dispare"], correct: 1, explanation: "Bucla 'la infinit' verifica constant. In fiecare iteratie, 'daca tasta sageata dreapta e apasata' verifica tastatura. Doar cand tii apasata sageata dreapta, sprite-ul se misca 10 pasi. Cand eliberezi tasta, se opreste. Acesta este modul clasic de control in jocuri!" },
                { text: "Cum faci un sprite sa se miste in sus, jos, stanga si dreapta cu sagetile?", options: ["Folosesti un singur bloc 'daca' cu toate conditiile", "Folosesti 4 blocuri 'daca' separate, cate unul pentru fiecare sageata", "Folosesti un singur bloc 'mergi'", "Nu se poate controla cu 4 directii"], correct: 1, explanation: "Folosesti 4 blocuri 'daca' separate intr-o bucla 'la infinit': daca sageata sus -> schimba y cu 5, daca sageata jos -> schimba y cu -5, daca sageata dreapta -> schimba x cu 5, daca sageata stanga -> schimba x cu -5. Fiecare tasta controleaza o directie." }
            ]},
            4: { title: "Nivel 4: Conditii cu detectia", description: "Detecteaza atingeri si culori", xpReward: 125, questions: [
                { text: "Ce face blocul 'atingi [sprite2]?' (touching sprite2?)?", options: ["Muta sprite-ul langa sprite2", "Returneaza adevarat daca sprite-ul tau se suprapune cu sprite2", "Sterge sprite2", "Schimba culoarea sprite2"], correct: 1, explanation: "Blocul 'atingi [sprite2]?' returneaza adevarat (true) cand cele doua sprite-uri se ating (se suprapun). Este esential in jocuri: detectezi coliziuni cu obstacole, prinderea obiectelor, atingerea inamicilor etc." },
                { text: "In jocuri, cum folosesti detectia de atingere pentru 'game over'?", options: ["Verifici manual cu ochii", "Intr-o bucla: 'daca <atingi [inamic]> atunci [spune Game Over] [opreste tot]'", "Apesi un buton de game over", "Nu exista game over in Scratch"], correct: 1, explanation: "Intr-o bucla 'la infinit' verifici constant: 'daca atingi inamicul atunci spune Game Over si opreste tot'. Programul verifica in fiecare cadru daca personajul tau s-a atins de inamic. Cand se intampla, jocul se opreste." },
                { text: "Ce face blocul 'atingi culoarea [verde]?'?", options: ["Schimba culoarea sprite-ului in verde", "Returneaza adevarat daca sprite-ul atinge ceva de culoarea verde pe scena", "Coloreaza scena in verde", "Cauta pixeli verzi"], correct: 1, explanation: "Blocul 'atingi culoarea [verde]?' returneaza adevarat daca orice parte a sprite-ului se suprapune cu ceva de culoarea specificata (din fundal sau alte sprite-uri). Util pentru: detectarea drumului, a apei, a obstacolelor colorate etc." }
            ]},
            5: { title: "Nivel 5: Decizii in practica", description: "Aplica deciziile in scenarii reale", xpReward: 150, questions: [
                { text: "Cum faci un joc simplu in care sprite-ul colecteaza monede?", options: ["Desenezi monedele si le stergi manual", "Cand sprite-ul atinge o moneda: ascunde moneda, creste scorul, reda un sunet", "Pui toate monedele intr-un folder", "Importi un joc gata facut"], correct: 1, explanation: "Fiecare moneda (sprite separat) are un script: 'la infinit: daca <atingi [jucator]> atunci [ascunde] [schimba scor cu 1] [reda sunet ding]'. Cand jucatorul atinge moneda, aceasta dispare si scorul creste. Combinatie de detectie + decizie + variabila!" },
                { text: "Cum faci un sprite sa reactioneze diferit in functie de raspunsul utilizatorului?", options: ["Nu se poate in Scratch", "Folosesti blocul 'intreaba si asteapta' apoi 'daca <raspuns = ...> atunci...'", "Citesti gandurile utilizatorului", "Folosesti doar taste"], correct: 1, explanation: "Blocul 'intreaba...si asteapta' (ask...and wait) afiseaza o intrebare si asteapta ca utilizatorul sa scrie un raspuns. Apoi verifici raspunsul cu 'daca <raspuns = da> atunci... altfel...'. Raspunsul se stocheaza in variabila speciala 'raspuns' (answer)." },
                { text: "Cum poti verifica doua conditii in acelasi timp in Scratch?", options: ["Nu poti verifica doua conditii", "Folosesti operatorul 'si' (and) sau 'sau' (or) din categoria Operatori", "Pui doua blocuri 'daca' unul langa altul", "Scrii ambele conditii in acelasi bloc"], correct: 1, explanation: "Operatorii logici din categoria Operatori permit combinarea conditiilor: 'si' (and) - ambele conditii trebuie adevarate, 'sau' (or) - cel putin una adevarata, 'nu' (not) - inverseaza conditia. Exemplu: 'daca <tasta space apasata> si <atingi sol> atunci sari'." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m4_quiz3_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m4_quiz3_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz4-decizii.html'">Quiz-ul 4: Decizii Avansate</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

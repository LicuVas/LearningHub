<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Decizii Avansate in Scratch | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
    <style>
        /* Lesson-specific styles */
:root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Decizii Avansate</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer><strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a></footer>

    <script>
        const levels = {
            1: { title: "Nivel 1: Operatori de comparatie", description: "Invata sa compari valori in Scratch", xpReward: 50, questions: [
                { text: "Ce operatori de comparatie exista in Scratch?", options: ["Doar egal (=)", "Mai mare (>), mai mic (<) si egal (=)", "Doar plus si minus", "Nu exista comparatii in Scratch"], correct: 1, explanation: "Scratch ofera trei operatori de comparatie: mai mare decat (>), mai mic decat (<) si egal cu (=). Acestia compara doua valori si returneaza adevarat sau fals. Se gasesc in categoria Operatori (verde)." },
                { text: "Ce returneaza conditia '5 > 3' ?", options: ["Numarul 5", "Adevarat (true)", "Fals (false)", "Numarul 3"], correct: 1, explanation: "5 > 3 (5 este mai mare decat 3) este ADEVARAT. Operatorii de comparatie nu returneaza numere, ci valori logice: adevarat (true) sau fals (false). Aceste valori se folosesc in blocurile 'daca' si 'repeta pana cand'." },
                { text: "Cum verifici daca scorul este mai mare sau egal cu 10 in Scratch?", options: ["Folosesti blocul 'scor >= 10' direct", "Folosesti 'nu (scor < 10)' sau combini cu 'sau': '(scor > 10) sau (scor = 10)'", "Nu se poate verifica mai mare sau egal", "Folosesti blocul 'scor == 10'"], correct: 1, explanation: "Scratch nu are operator '>=' direct, dar poti obtine acelasi efect: fie cu 'nu (scor < 10)' (negarea lui 'mai mic decat 10' da 'mai mare sau egal cu 10'), fie combinand '(scor > 10) sau (scor = 10)' cu operatorul 'sau'." }
            ]},
            2: { title: "Nivel 2: Operatori logici", description: "Combina conditii cu si/sau/nu", xpReward: 75, questions: [
                { text: "Ce face operatorul 'si' (and) in Scratch?", options: ["Aduna doua numere", "Returneaza adevarat DOAR daca ambele conditii sunt adevarate", "Returneaza adevarat daca cel putin una e adevarata", "Neaga o conditie"], correct: 1, explanation: "Operatorul 'si' (and) returneaza adevarat DOAR cand AMBELE conditii sunt adevarate. Daca una sau ambele sunt false, rezultatul este fals. Exemplu: 'tasta space apasata SI atingi sol' = adevarat doar daca ambele se intampla simultan." },
                { text: "Ce face operatorul 'sau' (or)?", options: ["Returneaza adevarat doar daca ambele conditii sunt adevarate", "Returneaza adevarat daca CEL PUTIN una dintre conditii este adevarata", "Returneaza intotdeauna fals", "Neaga ambele conditii"], correct: 1, explanation: "Operatorul 'sau' (or) returneaza adevarat daca CEL PUTIN una dintre conditii este adevarata. Este fals DOAR daca ambele sunt false. Exemplu: 'atingi [moneda1] sau atingi [moneda2]' = adevarat daca atingi oricare moneda." },
                { text: "Ce face operatorul 'nu' (not)?", options: ["Sterge o conditie", "Inverseaza o conditie: adevarat devine fals si fals devine adevarat", "Dubleaza o conditie", "Nu face nimic"], correct: 1, explanation: "Operatorul 'nu' (not) inverseaza conditia: daca era adevarata, devine falsa si invers. Exemplu: 'nu (atingi marginea)' este adevarat cand sprite-ul NU atinge marginea. Este util pentru a verifica daca ceva NU se intampla." }
            ]},
            3: { title: "Nivel 3: Variabile in conditii", description: "Foloseste variabile in decizii", xpReward: 100, questions: [
                { text: "Cum creezi o variabila in Scratch?", options: ["Scrii numele variabilei in bara de cautare", "Din categoria 'Variabile', apesi 'Creeaza o variabila' si ii dai un nume", "Variabilele se creeaza automat", "Importi variabile dintr-un fisier"], correct: 1, explanation: "In Scratch, mergi la categoria 'Variabile' (portocaliu inchis) si apesi butonul 'Creeaza o variabila' (Make a Variable). Dai un nume descriptiv (ex: 'scor', 'vieti', 'nivel') si alegi daca e pentru toate sprite-urile sau doar pentru cel curent." },
                { text: "Script: [daca <vieti = 0> atunci] [spune Game Over!] [opreste tot]. Ce face?", options: ["Adauga o viata", "Verifica daca jucatorul a ramas fara vieti si incheie jocul", "Seteaza vietile la 0", "Afiseaza numarul de vieti"], correct: 1, explanation: "Acest script verifica daca variabila 'vieti' a ajuns la 0. Daca da, sprite-ul spune 'Game Over!' si opreste tot programul. Este un mecanism clasic de sfarsit de joc: cand pierzi toate vietile, jocul se termina." },
                { text: "Cum incrementezi (cresti cu 1) o variabila in Scratch?", options: ["Scrii variabila + 1", "Folosesti blocul 'schimba [scor] cu 1' (change [scor] by 1)", "Apesi tasta +", "Dai dublu-click pe variabila"], correct: 1, explanation: "Blocul 'schimba [variabila] cu 1' adauga 1 la valoarea curenta a variabilei. Daca scor era 5, devine 6. Poti schimba cu orice numar: cu 10 pentru bonus mare, cu -1 pentru a scadea. Este modul standard de a actualiza scoruri, vieti, nivele." }
            ]},
            4: { title: "Nivel 4: Decizii inlantuite", description: "Invata decizii multiple si complexe", xpReward: 125, questions: [
                { text: "Cum verifici daca un numar este intre 1 si 10 in Scratch?", options: ["Folosesti blocul 'intre 1 si 10'", "Folosesti '(numar > 0) si (numar < 11)' cu operatorul 'si'", "Compari cu fiecare numar individual", "Nu se poate verifica intervale"], correct: 1, explanation: "Combinand doua comparatii cu 'si': '(numar > 0) si (numar < 11)' verifica daca numarul este mai mare decat 0 SI mai mic decat 11, adica intre 1 si 10. Ambele conditii trebuie sa fie adevarate simultan." },
                { text: "Cum faci un sistem de nivele: daca scor >= 100 nivel 3, daca scor >= 50 nivel 2, altfel nivel 1?", options: ["Pui totul intr-un singur bloc 'daca'", "Folosesti blocuri 'daca-altfel' imbricate (unul in interiorul altuia)", "Nu se poate face nivele in Scratch", "Folosesti 10 blocuri 'daca' separate"], correct: 1, explanation: "Folosesti 'daca-altfel' imbricate: 'daca scor >= 100 atunci nivel=3, altfel [daca scor >= 50 atunci nivel=2, altfel nivel=1]'. Cel de-al doilea 'daca-altfel' este in ramura 'altfel' a primului. Asa verifici conditiile in ordine." },
                { text: "Ce este un 'broadcast' (mesaj) in Scratch si cum ajuta la decizii?", options: ["Este un email trimis profesorului", "Un mesaj trimis intre sprite-uri pentru a coordona actiunile lor", "Un tip de variabila", "Un sunet special"], correct: 1, explanation: "Broadcast (transmite mesaj) permite unui sprite sa trimita un mesaj pe care alte sprite-uri il pot 'auzi' si reactiona. De exemplu, cand jucatorul pierde, sprite-ul principal transmite mesajul 'game_over' si toate sprite-urile reactioneaza ascunzandu-se sau schimbandu-si comportamentul." }
            ]},
            5: { title: "Nivel 5: Provocari cu decizii", description: "Rezolva probleme complexe cu decizii", xpReward: 150, questions: [
                { text: "Intr-un joc, cum faci un inamic sa urmareasca jucatorul?", options: ["Inamicul se misca aleatoriu", "Inamicul verifica pozitia jucatorului si se misca spre el: 'indreapta-te spre [jucator]' + 'mergi pasi'", "Programezi manual fiecare miscare", "Inamicii nu se pot misca in Scratch"], correct: 1, explanation: "Blocul 'indreapta-te spre [sprite]' (point towards) orienteaza inamicul spre jucator. Apoi 'mergi X pasi' il muta in acea directie. Intr-o bucla 'la infinit', inamicul urmareste constant jucatorul. Poti adauga 'daca <distanta pana la [jucator]> < 50' pentru actiuni speciale cand e aproape." },
                { text: "Cum faci un numar aleatoriu in Scratch si il folosesti intr-o decizie?", options: ["Scratch nu poate genera numere aleatorii", "Folosesti blocul 'alege aleatoriu intre 1 si 10' in conditia unui 'daca'", "Ghicesti un numar", "Folosesti cronometrul"], correct: 1, explanation: "Blocul 'alege aleatoriu intre [1] si [10]' (pick random) genereaza un numar aleatoriu. Il poti folosi in decizii: 'daca <alege aleatoriu intre 1 si 3> = 1 atunci [schimba directia]' - astfel inamicul are o sansa din 3 sa schimbe directia, creand comportament imprevizibil." },
                { text: "Ce este mai important cand creezi decizii complexe intr-un proiect Scratch?", options: ["Sa folosesti cat mai multe blocuri 'daca'", "Sa planifici logic: ce conditii verifici, in ce ordine, si ce se intampla pe fiecare ramura", "Sa faci totul cat mai colorat", "Sa nu folosesti variabile"], correct: 1, explanation: "Planificarea logica este cea mai importanta! Inainte de a construi, gandeste: ce trebuie sa se intample? ce conditii verifici? in ce ordine? ce se intampla pe fiecare ramura? Un plan bun (algoritm) face codul mai clar, mai usor de inteles si cu mai putine erori." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m4_quiz4_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m4_quiz4_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz5-proiect.html'">Quiz-ul 5: Proiect</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

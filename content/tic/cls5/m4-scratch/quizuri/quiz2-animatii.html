<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Animatii in Scratch | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Animatii in Scratch</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: { title: "Nivel 1: Costume si animatii", description: "Invata cum functioneaza animatiile in Scratch", xpReward: 50, questions: [
                { text: "Ce sunt 'costumele' (costumes) unui sprite in Scratch?", options: ["Haine pe care le cumperi online", "Diferite imagini/infatisari ale aceluiasi sprite", "Culori pentru fundal", "Tipuri de blocuri"], correct: 1, explanation: "Costumele sunt diferite imagini ale aceluiasi sprite. Pisica Scratch are doua costume: cu picioarele in pozitii diferite. Alternand rapid intre costume, creezi iluzia de miscare - exact ca la un desen animat!" },
                { text: "Cum creezi o animatie simpla de mers in Scratch?", options: ["Folosesti un singur bloc magic", "Alternezi intre costume diferite folosind 'costume urmator' intr-o bucla cu 'asteapta'", "Importi un GIF animat", "Desenezi fiecare cadru manual pe scena"], correct: 1, explanation: "Animatia de mers se creeaza alternand costumele in bucla: 'la infinit: costume urmator + asteapta 0.2 secunde + mergi 5 pasi'. Schimbarea rapida a costumelor creeaza iluzia de miscare, la fel ca un desen animat (30 cadre pe secunda)." },
                { text: "Ce face blocul 'costume urmator' (next costume)?", options: ["Sterge costumul actual", "Schimba sprite-ul la urmatorul costum din lista de costume", "Adauga un costum nou", "Roteste sprite-ul"], correct: 1, explanation: "Blocul 'costume urmator' schimba infatisarea sprite-ului la urmatorul costum din lista. Daca este la ultimul costum, revine la primul. Folosit intr-o bucla, creeaza animatii fluide." }
            ]},
            2: { title: "Nivel 2: Blocul repeta", description: "Invata sa repeti actiuni pentru animatii fluide", xpReward: 75, questions: [
                { text: "Ce face blocul 'repeta de 10 ori' (repeat 10)?", options: ["Executa blocurile din interior de exact 10 ori", "Asteapta 10 secunde", "Sare 10 blocuri", "Repeta tot programul"], correct: 0, explanation: "Blocul 'repeta de 10 ori' executa blocurile din interior (din 'gura' blocului) de exact 10 ori. Poti schimba numarul. Este foarte util pentru animatii: de exemplu, 'repeta de 10 ori: mergi 10 pasi + costume urmator + asteapta 0.1s'." },
                { text: "Ce face blocul 'la infinit' (forever)?", options: ["Ruleaza o singura data", "Repeta blocurile din interior fara oprire, pana cand opresti programul", "Asteapta la infinit", "Nu face nimic"], correct: 1, explanation: "Blocul 'la infinit' (forever) repeta blocurile din interior CONTINUU, fara sa se opreasca niciodata singur. Se opreste doar cand apesi butonul rosu de stop. Este ideal pentru animatii continue, miscari permanente sau verificari constante." },
                { text: "De ce este important blocul 'asteapta' intr-o animatie?", options: ["Nu este important", "Controleaza viteza animatiei - fara el, schimbarile ar fi prea rapide de vazut", "Opreste animatia", "Salveaza animatia"], correct: 1, explanation: "Fara 'asteapta', costumele s-ar schimba instant (de milioane de ori pe secunda) si nu ai vedea animatia. Blocul 'asteapta' creeaza o pauza mica (de exemplu 0.1 secunde) intre cadre, facand animatia vizibila si controlabila." }
            ]},
            3: { title: "Nivel 3: Efecte vizuale", description: "Invata sa adaugi efecte spectaculoase", xpReward: 100, questions: [
                { text: "Ce efecte vizuale poti aplica unui sprite in Scratch?", options: ["Doar schimbarea culorii", "Culoare, ochi de peste, vartej, pixelare, mozaic, luminozitate, spectru", "Doar marirea si micsorarea", "Nu exista efecte vizuale"], correct: 1, explanation: "Scratch ofera 7 efecte vizuale: Culoare (schimba nuanta), Ochi de peste (distorsiune), Vartej (rotire), Pixelare (blocuri mari), Mozaic (multiplicare), Luminozitate (mai luminos/inchis) si Spectru (transparent). Le gasesti in categoria Aparenta." },
                { text: "Ce face blocul 'schimba efectul culoare cu 25'?", options: ["Schimba culoarea fundalului", "Modifica nuanta culorii sprite-ului, trecand prin spectrul de culori", "Sterge sprite-ul", "Pune sprite-ul pe culoarea 25"], correct: 1, explanation: "Blocul 'schimba efectul culoare cu 25' modifica nuanta sprite-ului. Valoarea merge de la 0 la 200. Folosit intr-o bucla, creeaza un efect de curcubeu continuu - sprite-ul isi schimba culoarea treptat prin toate nuantele." },
                { text: "Cum faci un sprite sa se mareasca treptat?", options: ["Il desenezi mai mare", "Folosesti 'schimba marimea cu 10' intr-o bucla", "Apesi Ctrl + Plus", "Nu se poate in Scratch"], correct: 1, explanation: "Blocul 'schimba marimea cu 10' mareste sprite-ul cu 10% de fiecare data. Intr-o bucla, creeaza un efect de crestere treptata. Poti folosi valori negative (-10) pentru a-l micsora. Blocul 'seteaza marimea la 100%' il readuce la marimea originala." }
            ]},
            4: { title: "Nivel 4: Fundaluri si scene", description: "Invata sa creezi scene si sa schimbi fundalul", xpReward: 125, questions: [
                { text: "Cum schimbi fundalul (backdrop) in Scratch?", options: ["Colorezi scena cu mouse-ul", "Folosesti blocul 'schimba fundalul cu' din scriptul scenei sau al sprite-ului", "Importi un video", "Nu se poate schimba fundalul"], correct: 1, explanation: "Fundalul se schimba cu blocul 'schimba fundalul cu...' (switch backdrop to). Scena poate avea mai multe fundaluri, la fel cum un sprite are mai multe costume. Poti adauga fundaluri din biblioteca, le poti desena sau importa." },
                { text: "Ce este diferenta dintre un fundal si un sprite?", options: ["Nu exista nicio diferenta", "Fundalul este imaginea de fundal a scenei, sprite-ul este un personaj care se misca", "Fundalul se misca, sprite-ul sta pe loc", "Sprite-ul este fundalul"], correct: 1, explanation: "Fundalul (backdrop) este imaginea de fundal a scenei - sta in spate, in spatele tuturor sprite-urilor. Sprite-urile sunt personajele si obiectele care se misca PE scena, in fata fundalului. Fundalul nu se poate muta, sprite-urile da." },
                { text: "Cum faci o animatie in care personajul merge pe un drum si fundalul se schimba?", options: ["Nu se poate", "Schimbi fundalul cand sprite-ul ajunge la marginea scenei", "Desenezi totul pe un singur fundal", "Folosesti doar miscarea sprite-ului"], correct: 1, explanation: "Poti programa: cand sprite-ul atinge marginea scenei, schimbi fundalul cu urmatoarea scena si muti sprite-ul la inceputul noii scene. Acest efect creeaza iluzia ca personajul calatoreste prin mai multe locatii." }
            ]},
            5: { title: "Nivel 5: Animatii avansate", description: "Testeaza-ti cunostintele de animatie", xpReward: 150, questions: [
                { text: "Cum faci un sprite sa se miste lin de la un punct la altul?", options: ["Il muti instant cu 'mergi la x: y:'", "Folosesti blocul 'gliseaza in 1 secunde la x: y:' (glide)", "Il tragi cu mouse-ul in timpul rularii", "Nu se poate face miscare lina"], correct: 1, explanation: "Blocul 'gliseaza in X secunde la x: y:' (glide) muta sprite-ul LIN de la pozitia curenta la pozitia specificata in timpul dat. Miscarea este fluida, nu instantanee. Este ideal pentru animatii de zbor, alunecare sau plutire." },
                { text: "Cum faci un sprite sa sara (efect de salt)?", options: ["Folosesti blocul 'sari'", "Schimbi y-ul in sus (mergi in sus), astepti, apoi schimbi y-ul in jos (mergi in jos)", "Apesi tasta Space de pe tastatura", "Importi o animatie de salt"], correct: 1, explanation: "Saritura se simuleaza schimband coordonata y: cresti y (sprite-ul urca), astepti putin la varful saltului, apoi scazi y (sprite-ul coboara). Intr-o bucla 'repeta de 10 ori: schimba y cu 5' urmat de 'repeta de 10 ori: schimba y cu -5' creeaza un salt frumos." },
                { text: "Ce face blocul 'daca atingi marginea, ricoseaza' (if on edge, bounce)?", options: ["Sterge sprite-ul", "Cand sprite-ul ajunge la marginea scenei, se intoarce si merge in directia opusa", "Opreste programul", "Mareste scena"], correct: 1, explanation: "Blocul 'daca atingi marginea, ricoseaza' face sprite-ul sa se intoarca automat cand atinge oricare margine a scenei. Combinat cu 'mergi X pasi' intr-o bucla 'la infinit', creeaza un efect de minge care ricozeaza intre pereti." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m4_quiz2_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m4_quiz2_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz3-alternativ.html'">Quiz-ul 3: Decizii</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Executia Secventiala in Scratch | Clasa 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0f0f1a; --bg-secondary: #1a1a2e; --bg-card: #252540; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; --accent-green: #10b981; --accent-cyan: #06b6d4; --accent-red: #ef4444; --accent-yellow: #fbbf24; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --border: #3d3d5c; }
        * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-secondary); border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--border); } .quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }
        .level-map { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; } .level-node { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; cursor: pointer; transition: all 0.3s; position: relative; border: 3px solid var(--border); background: var(--bg-card); } .level-node.locked { opacity: 0.5; cursor: not-allowed; } .level-node.locked::after { content: '\U0001F512'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; } .level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; } .level-node.completed { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); border-color: var(--accent-green); } .level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; } @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .level-connector { width: 30px; height: 3px; background: var(--border); align-self: center; } .level-connector.completed { background: var(--accent-green); }
        .quiz-area { background: var(--bg-secondary); border-radius: 20px; padding: 2rem; border: 1px solid var(--border); min-height: 400px; } .level-intro { text-align: center; padding: 2rem; } .level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); } .level-intro p { color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem; } .level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }
        .question-container { display: none; } .question-container.active { display: block; animation: slideIn 0.5s ease; } @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .question-progress { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; } .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); } .progress-dot.current { background: var(--accent-blue); } .progress-dot.correct { background: var(--accent-green); } .progress-dot.wrong { background: var(--accent-red); }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }
        .options-grid { display: grid; gap: 1rem; margin-top: 1.5rem; } .option { padding: 1.2rem 1.5rem; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; text-align: left; } .option:hover { border-color: var(--accent-purple); transform: translateX(5px); } .option.correct { border-color: var(--accent-green); background: rgba(16, 185, 129, 0.2); } .option.wrong { border-color: var(--accent-red); background: rgba(239, 68, 68, 0.2); }
        .feedback-box { display: none; padding: 1.5rem; border-radius: 12px; margin-top: 1.5rem; text-align: center; } .feedback-box.show { display: block; animation: fadeIn 0.3s ease; } .feedback-box.correct { background: rgba(16, 185, 129, 0.2); border: 2px solid var(--accent-green); } .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); border: 2px solid var(--accent-red); } .feedback-icon { font-size: 3rem; margin-bottom: 0.5rem; } .feedback-text { font-size: 1.1rem; margin-bottom: 1rem; } .explanation { font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-top: 1rem; } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 1rem 2rem; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; border: none; transition: all 0.3s; } .btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; } .btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); } .btn-success { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); color: white; } .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-secondary); } .btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .level-complete { display: none; text-align: center; padding: 3rem; } .level-complete.show { display: block; animation: celebrate 0.5s ease; } @keyframes celebrate { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } } .level-complete-icon { font-size: 5rem; margin-bottom: 1rem; } .level-complete h2 { font-size: 2rem; color: var(--accent-green); margin-bottom: 1rem; } .xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; } .score-display { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; } .stars { font-size: 3rem; margin: 1rem 0; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 1rem; font-size: 0.9rem; } .back-link:hover { color: var(--accent-cyan); }
        @media (max-width: 600px) { .container { padding: 1rem; } .quiz-header { flex-direction: column; gap: 1rem; } .level-node { width: 50px; height: 50px; font-size: 1.2rem; } .question-text { font-size: 1.1rem; } }
        footer { margin-top: 3rem; padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); }
    </style>
    <link rel="stylesheet" href="../../../../../assets/css/mobile.css">
    <link rel="stylesheet" href="../../../../../assets/css/mobile-first.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&#8592; Inapoi la Modulul 4</a>
        <div class="quiz-header"><div class="quiz-title">Quiz: Executia Secventiala in Scratch</div><div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div></div>
        <div class="level-map"><div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div><div class="level-connector"></div><div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div><div class="level-connector"></div><div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div><div class="level-connector"></div><div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div><div class="level-connector"></div><div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div></div>
        <div class="quiz-area" id="quizArea"></div>
    </div>
    <footer><strong>&copy; 2026 Prof. Gurlan Vasile</strong><br>Informatica si TIC | <a href="mailto:grlnvasile@gmail.com" style="color: var(--accent-cyan);">grlnvasile@gmail.com</a></footer>

    <script>
        const levels = {
            1: { title: "Nivel 1: Ce este Scratch?", description: "Descopera mediul de programare Scratch", xpReward: 50, questions: [
                { text: "Ce este Scratch?", options: ["Un joc video", "Un limbaj de programare vizual in care construiesti programe din blocuri colorate", "Un program de desenare", "Un motor de cautare"], correct: 1, explanation: "Scratch este un limbaj de programare vizual creat de MIT (Massachusetts Institute of Technology). In loc sa scrii cod, tragi si conectezi blocuri colorate ca piesele unui puzzle. Este ideal pentru incepatori!" },
                { text: "Ce este un 'sprite' in Scratch?", options: ["Un tip de bloc", "Un personaj sau obiect care poate fi programat pe scena", "O culoare", "Un sunet"], correct: 1, explanation: "Un sprite este un personaj sau obiect pe care il programezi in Scratch. Sprite-ul implicit este pisica Scratch. Poti adauga mai multe sprite-uri, le poti desena sau importa din biblioteca Scratch." },
                { text: "Ce este 'scena' (Stage) in Scratch?", options: ["Lista de blocuri disponibile", "Zona de fundal unde sprite-urile se misca si interactioneaza", "Editorul de cod", "Meniul de salvare"], correct: 1, explanation: "Scena (Stage) este zona din dreapta ecranului unde sprite-urile se misca, vorbesc si interactioneaza. Este ca o scena de teatru pe care se desfasoara actiunea programului tau. Scena are un fundal (backdrop) care poate fi schimbat." }
            ]},
            2: { title: "Nivel 2: Blocurile de baza", description: "Invata despre categoriile de blocuri", xpReward: 75, questions: [
                { text: "Cum sunt organizate blocurile in Scratch?", options: ["Alfabetic", "Pe categorii colorate: Miscare (albastru), Aparenta (mov), Sunet (roz), Evenimente (galben) etc.", "La intamplare", "Pe dimensiune"], correct: 1, explanation: "Blocurile Scratch sunt organizate pe categorii, fiecare cu o culoare distincta: Miscare (albastru), Aparenta (mov), Sunet (roz), Evenimente (galben), Control (portocaliu), Detectie (cyan), Operatori (verde), Variabile (portocaliu inchis)." },
                { text: "Ce bloc folosesti pentru a porni un program in Scratch?", options: ["Blocul 'mergi 10 pasi'", "Blocul 'cand se apasa steagul verde' (when green flag clicked)", "Blocul 'spune Hello'", "Blocul 'asteapta 1 secunda'"], correct: 1, explanation: "Blocul 'cand se apasa steagul verde' (when green flag clicked) este blocul de start principal. Cand apesi steagul verde de deasupra scenei, toate scripturile care incep cu acest bloc se executa. Este ca butonul START al programului." },
                { text: "Cum conectezi blocurile in Scratch?", options: ["Le lipesti cu lipici virtual", "Le tragi si le imbini ca piesele de puzzle, unul sub altul", "Le scrii intr-un fisier text", "Le numeri si le aranjezi"], correct: 1, explanation: "Blocurile se conecteaza prin tragere (drag & drop) - le tragi unul sub altul si se imbina ca piesele de puzzle. Forma blocurilor te ajuta: daca se pot conecta, se vor 'lipi' automat. Un sir de blocuri conectate formeaza un 'script'." }
            ]},
            3: { title: "Nivel 3: Miscarea sprite-urilor", description: "Invata sa misti personajele pe scena", xpReward: 100, questions: [
                { text: "Ce face blocul 'mergi 10 pasi' (move 10 steps)?", options: ["Roteste sprite-ul", "Muta sprite-ul 10 pasi in directia in care este orientat", "Schimba culoarea sprite-ului", "Mareste sprite-ul de 10 ori"], correct: 1, explanation: "Blocul 'mergi 10 pasi' muta sprite-ul inainte cu 10 pasi in directia in care este orientat. Numarul 10 poate fi schimbat - poti pune 50 pentru a merge mai departe sau -10 pentru a merge inapoi." },
                { text: "Ce face blocul 'intoarce-te 90 grade' (turn 90 degrees)?", options: ["Muta sprite-ul 90 de pasi", "Roteste sprite-ul cu 90 de grade (un sfert de rotatie)", "Schimba marimea sprite-ului", "Asteapta 90 de secunde"], correct: 1, explanation: "Blocul 'intoarce-te 90 grade' roteste sprite-ul cu 90 de grade (un sfert de cerc). 90 grade = dreapta sau stanga. 180 grade = intoarcere completa. 360 grade = o rotatie completa (revine la pozitia initiala)." },
                { text: "Ce face blocul 'mergi la x: 0 y: 0' (go to x:0 y:0)?", options: ["Sterge sprite-ul", "Muta sprite-ul exact in centrul scenei", "Roteste sprite-ul", "Schimba fundalul"], correct: 1, explanation: "Blocul 'mergi la x:0 y:0' muta sprite-ul la coordonatele specificate. In Scratch, centrul scenei este x=0, y=0. Coordonata x merge de la -240 (stanga) la 240 (dreapta), iar y de la -180 (jos) la 180 (sus)." }
            ]},
            4: { title: "Nivel 4: Aparenta si sunete", description: "Invata sa schimbi cum arata si suna sprite-urile", xpReward: 125, questions: [
                { text: "Ce face blocul 'spune Hello timp de 2 secunde' (say Hello for 2 secs)?", options: ["Reproduce sunetul 'Hello'", "Afiseaza un balon de dialog cu textul 'Hello' langa sprite timp de 2 secunde", "Schimba numele sprite-ului", "Trimite un mesaj altui sprite"], correct: 1, explanation: "Blocul 'spune...timp de...secunde' afiseaza un balon de dialog (ca in benzile desenate) langa sprite cu textul specificat. Dupa timpul stabilit, balonul dispare. Este modul prin care sprite-ul 'vorbeste'." },
                { text: "Ce face blocul 'reda sunetul Meow' (play sound Meow)?", options: ["Afiseaza textul 'Meow'", "Reda sunetul 'Meow' si continua cu urmatorul bloc fara sa astepte", "Opreste toate sunetele", "Inregistreaza un sunet"], correct: 1, explanation: "Blocul 'reda sunetul' (play sound) porneste sunetul si trece IMEDIAT la urmatorul bloc, fara sa astepte terminarea sunetului. Daca vrei sa astepte, folosesti 'reda sunetul...pana la terminare' (play sound...until done)." },
                { text: "Ce face blocul 'asteapta 1 secunda' (wait 1 second)?", options: ["Opreste programul definitiv", "Face o pauza de 1 secunda inainte de a continua cu urmatorul bloc", "Sare peste urmatorul bloc", "Reseteaza cronometrul"], correct: 1, explanation: "Blocul 'asteapta 1 secunda' face o pauza in executia scriptului. Programul se opreste temporar, asteapta timpul specificat, apoi continua cu urmatorul bloc. Este foarte util pentru a crea temporizari si animatii." }
            ]},
            5: { title: "Nivel 5: Scripturi secventiale", description: "Construieste secvente complete de blocuri", xpReward: 150, questions: [
                { text: "Ce va face acest script: [steag verde] -> [spune 'Salut!' 2s] -> [mergi 100 pasi] -> [spune 'Am ajuns!' 2s]?", options: ["Totul se intampla in acelasi timp", "Sprite-ul spune 'Salut!', apoi merge 100 pasi, apoi spune 'Am ajuns!'", "Doar se misca, fara sa vorbeasca", "Nu face nimic"], correct: 1, explanation: "Blocurile se executa secvential (in ordine): 1) Sprite-ul spune 'Salut!' timp de 2 secunde, 2) Se muta 100 de pasi inainte, 3) Spune 'Am ajuns!' timp de 2 secunde. Fiecare bloc se termina inainte ca urmatorul sa inceapa." },
                { text: "Cum faci un sprite sa se miste in patrat?", options: ["Folosesti un singur bloc 'mergi in patrat'", "Repeti de 4 ori: mergi inainte + intoarce-te 90 grade", "Pui sprite-ul in forma de patrat", "Nu se poate face un patrat in Scratch"], correct: 1, explanation: "Pentru un patrat, repeti de 4 ori: 'mergi X pasi' + 'intoarce-te 90 grade'. Un patrat are 4 laturi egale si 4 unghiuri de 90 grade. Poti folosi blocul 'repeta de 4 ori' pentru a nu scrie aceleasi blocuri de 4 ori." },
                { text: "Ce este un 'script' in Scratch?", options: ["Un singur bloc", "Un grup de blocuri conectate care formeaza un program", "O imagine", "Un sunet"], correct: 1, explanation: "Un script este un grup de blocuri conectate intre ele care formeaza un program complet (sau o parte din program). Un sprite poate avea mai multe scripturi, fiecare incepand cu un bloc de eveniment (steag verde, tasta apasata etc.)." }
            ]}
        };

        let currentLevel=1,currentQuestion=0,score=0,totalXP=0,levelScores={},unlockedLevels=[1];
        function loadProgress(){const s=localStorage.getItem('cls5_m4_quiz1_progress');if(s){const d=JSON.parse(s);totalXP=d.totalXP||0;unlockedLevels=d.unlockedLevels||[1];levelScores=d.levelScores||{};updateXPDisplay();updateLevelMap();}}
        function saveProgress(){localStorage.setItem('cls5_m4_quiz1_progress',JSON.stringify({totalXP,unlockedLevels,levelScores}));}
        function updateXPDisplay(){document.getElementById('totalXP').textContent=totalXP;}
        function updateLevelMap(){document.querySelectorAll('.level-node').forEach((n,i)=>{const l=i+1;n.classList.remove('locked','active','completed');if(levelScores[l]!==undefined)n.classList.add('completed');else if(unlockedLevels.includes(l)){if(l===Math.max(...unlockedLevels.filter(x=>levelScores[x]===undefined)))n.classList.add('active');}else n.classList.add('locked');});document.querySelectorAll('.level-connector').forEach((c,i)=>{if(levelScores[i+1]!==undefined)c.classList.add('completed');else c.classList.remove('completed');});}
        function selectLevel(level){if(!unlockedLevels.includes(level))return;currentLevel=level;currentQuestion=0;score=0;showLevelIntro();}
        function showLevelIntro(){const l=levels[currentLevel];document.getElementById('quizArea').innerHTML=`<div class="level-intro"><h2>${l.title}</h2><p>${l.description}</p><div class="xp-reward">+${l.xpReward} XP</div><button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button></div>`;}
        function startLevel(){showQuestion();}
        function showQuestion(){function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}const l=levels[currentLevel];const q=l.questions[currentQuestion];let dots='';for(let i=0;i<l.questions.length;i++)dots+=`<div class="progress-dot${i===currentQuestion?' current':''}"></div>`;let opts='';q.options.forEach((o,i)=>{opts+=`<div class="option" onclick="selectAnswer(${i})">${escHtml(o)}</div>`;});document.getElementById('quizArea').innerHTML=`<div class="question-container active"><div class="question-progress">${dots}</div><p class="question-text">${q.text}</p><div class="options-grid">${opts}</div><div class="feedback-box" id="feedback"></div><div style="text-align:center;margin-top:1.5rem;"><button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Urmatoarea Intrebare</button></div></div>`;}
        function selectAnswer(index){const l=levels[currentLevel];const q=l.questions[currentQuestion];const opts=document.querySelectorAll('.option');const fb=document.getElementById('feedback');const nb=document.getElementById('nextBtn');opts.forEach(o=>o.style.pointerEvents='none');opts[index].classList.add(index===q.correct?'correct':'wrong');if(index!==q.correct)opts[q.correct].classList.add('correct');const d=document.querySelectorAll('.progress-dot');d[currentQuestion].classList.remove('current');d[currentQuestion].classList.add(index===q.correct?'correct':'wrong');if(index===q.correct){score++;fb.className='feedback-box show correct';fb.innerHTML=`<div class="feedback-icon">&#127881;</div><div class="feedback-text">Corect! Foarte bine!</div><div class="explanation">${q.explanation}</div>`;}else{fb.className='feedback-box show wrong';fb.innerHTML=`<div class="feedback-icon">&#128517;</div><div class="feedback-text">Nu chiar... Hai sa invatam!</div><div class="explanation">${q.explanation}</div>`;}nb.style.display='inline-flex';nb.textContent=currentQuestion<l.questions.length-1?'Urmatoarea Intrebare':'Vezi Rezultatul';}
        function nextQuestion(){currentQuestion++;if(currentQuestion>=levels[currentLevel].questions.length)showLevelComplete();else showQuestion();}
        function showLevelComplete(){const l=levels[currentLevel];const pct=Math.round((score/l.questions.length)*100);const passed=pct>=66;let stars=pct>=100?'&#11088;&#11088;&#11088;':pct>=80?'&#11088;&#11088;':pct>=66?'&#11088;':'&#128170;';let earnedXP=0;if(passed){earnedXP=l.xpReward;if(pct===100)earnedXP=Math.round(earnedXP*1.5);if(!levelScores[currentLevel]||levelScores[currentLevel]<pct){if(!levelScores[currentLevel])totalXP+=earnedXP;levelScores[currentLevel]=pct;}if(currentLevel<5&&!unlockedLevels.includes(currentLevel+1))unlockedLevels.push(currentLevel+1);saveProgress();updateXPDisplay();updateLevelMap();}document.getElementById('quizArea').innerHTML=`<div class="level-complete show"><div class="level-complete-icon">${passed?'&#127942;':'&#128218;'}</div><h2>${passed?'Nivel Completat!':'Mai incearca!'}</h2><div class="stars">${stars}</div><div class="score-display">${score}/${l.questions.length} raspunsuri corecte (${pct}%)</div>${passed?`<div class="xp-earned">+${earnedXP} XP</div>`:''}<div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;"><button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>${passed&&currentLevel<5?`<button class="btn btn-primary" onclick="selectLevel(${currentLevel+1})">Nivelul Urmator</button>`:''}${passed&&currentLevel===5?`<button class="btn btn-success" onclick="window.location.href='quiz2-animatii.html'">Quiz-ul 2: Animatii</button>`:''}</div></div>`;}
        loadProgress();showLevelIntro();
    </script>
</body>
</html>

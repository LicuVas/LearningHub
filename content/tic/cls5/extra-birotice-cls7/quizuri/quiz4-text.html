<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Imagini in Word | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\uD83D\uDD12'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

.word-ui-mockup { background: #2d2d4a; border-radius: 12px; padding: 1rem; margin: 1rem auto; max-width: 500px; text-align: left; border: 2px solid var(--border); }

.word-toolbar { background: #1e1e3a; padding: 0.5rem; border-radius: 8px; margin-bottom: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

.word-btn { padding: 0.3rem 0.6rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 0.85rem; }

.word-btn.highlight { background: var(--accent-blue); border-color: var(--accent-blue); }

.word-document { background: #fff; color: #000; padding: 1rem; border-radius: 4px; min-height: 100px; font-family: 'Times New Roman', serif; }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&larr; Inapoi la modul</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 4: Imagini in Word</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        // Quiz ID: cls5-extra-birotice-quiz4
        const levels = {
            1: {
                title: "Nivel 1: Inserarea imaginilor",
                description: "Invata cum adaugi imagini intr-un document Word",
                xpReward: 50,
                questions: [
                    {
                        text: "Din ce tab inserezi o imagine in Word?",
                        options: [
                            "Home",
                            "View",
                            "Insert (Inserare)",
                            "File"
                        ],
                        correct: 2,
                        explanation: "Tab-ul Insert contine butonul Pictures (Imagini). Apesi Insert > Pictures pentru a alege o imagine de pe calculator."
                    },
                    {
                        text: "Ce tipuri de imagini poti insera in Word?",
                        options: [
                            "Doar fisiere .txt",
                            "Fotografii (.jpg, .png), clipart-uri si forme",
                            "Doar fisiere .mp3",
                            "Doar fisiere .docx"
                        ],
                        correct: 1,
                        explanation: "Word suporta multe formate de imagine: JPG, PNG, GIF, BMP. Poti insera si forme (Shapes), pictograme (Icons) sau imagini online."
                    },
                    {
                        text: "Ce se intampla cand inserezi o imagine in document?",
                        options: [
                            "Imaginea inlocuieste tot textul",
                            "Imaginea apare in document la pozitia cursorului",
                            "Documentul se sterge",
                            "Word se inchide"
                        ],
                        correct: 1,
                        explanation: "Imaginea este inserata exact unde se afla cursorul in document. Apoi o poti muta si redimensiona dupa nevoie."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Redimensionarea imaginilor",
                description: "Invata sa ajustezi dimensiunea imaginilor",
                xpReward: 75,
                questions: [
                    {
                        text: "Cum maresti sau micsorezi o imagine in Word?",
                        options: [
                            "Apesi tasta Delete",
                            "Tragi de colturile sau marginile imaginii cu mouse-ul",
                            "Scrii dimensiunea pe tastatura",
                            "Nu se poate redimensiona"
                        ],
                        correct: 1,
                        explanation: "Click pe imagine pentru a o selecta, apoi trage de cercurelele (punctele de prindere) din colturi sau de pe margini pentru a redimensiona."
                    },
                    {
                        text: "De ce este mai bine sa tragi de COLT decat de MARGINE cand redimensionezi?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Tragand de colt pastrezi proportiile imaginii (nu se deformeaza)",
                            "Tragand de margine imaginea se sterge",
                            "Tragand de colt imaginea se coloreaza"
                        ],
                        correct: 1,
                        explanation: "Tragand de un colt, imaginea isi pastreaza proportiile originale (nu se intinde urat). Tragand de o margine laterala, imaginea se poate deforma."
                    },
                    {
                        text: "Ce apare cand dai click pe o imagine in Word?",
                        hasVisual: true,
                        visualType: "image-selected",
                        options: [
                            "Nimic special",
                            "Puncte de prindere (cercurete) pe margini si colturi, plus tab-ul Picture Format",
                            "Imaginea dispare",
                            "Un mesaj de eroare"
                        ],
                        correct: 1,
                        explanation: "Cand selectezi o imagine, apar puncte de prindere (cercurete) pe margini si colturi pentru redimensionare, plus un tab nou 'Picture Format' cu instrumente speciale."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Pozitionarea imaginii",
                description: "Invata cum se comporta imaginea in raport cu textul",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce inseamna 'Text Wrapping' (Inconjurare text)?",
                        options: [
                            "Stergerea textului din jurul imaginii",
                            "Modul in care textul curge in jurul imaginii",
                            "Colorarea textului",
                            "Copierea textului"
                        ],
                        correct: 1,
                        explanation: "Text Wrapping (Inconjurare text) controleaza cum se comporta textul in jurul imaginii: poate fi deasupra, in jurul, in spatele sau in fata imaginii."
                    },
                    {
                        text: "Ce face optiunea 'In Line with Text' (In linie cu textul)?",
                        options: [
                            "Imaginea pluteste peste text",
                            "Imaginea se comporta ca un caracter mare in textul tau",
                            "Imaginea dispare",
                            "Textul dispare"
                        ],
                        correct: 1,
                        explanation: "'In Line with Text' face ca imaginea sa se comporte ca o litera mare - se misca odata cu textul si nu poti trage imaginea liber pe pagina."
                    },
                    {
                        text: "Ce optiune de Text Wrapping folosesti ca textul sa curga in jurul imaginii?",
                        options: [
                            "In Line with Text",
                            "Behind Text",
                            "Square (Patrat) sau Tight (Strans)",
                            "In Front of Text"
                        ],
                        correct: 2,
                        explanation: "Square face textul sa curga in jurul imaginii intr-un patrat. Tight face textul sa se lipeasca strans de conturul imaginii."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Editarea imaginilor",
                description: "Invata sa editezi imaginile direct in Word",
                xpReward: 125,
                questions: [
                    {
                        text: "Unde gasesti instrumentele de editare a imaginilor in Word?",
                        options: [
                            "In tab-ul Home",
                            "In tab-ul Picture Format (apare cand selectezi o imagine)",
                            "In tab-ul File",
                            "Nu exista instrumente de editare"
                        ],
                        correct: 1,
                        explanation: "Tab-ul Picture Format apare automat cand selectezi o imagine. Contine instrumente pentru culoare, efecte, borduri si decupare."
                    },
                    {
                        text: "Ce face butonul Crop (Decupare)?",
                        options: [
                            "Sterge imaginea",
                            "Taie (decupeaza) parti din imagine pe care nu le vrei",
                            "Mareste imaginea",
                            "Roteste imaginea"
                        ],
                        correct: 1,
                        explanation: "Crop (Decupare) iti permite sa tai margini din imagine, pastrand doar partea care te intereseaza. Foarte util cand vrei doar o portiune din fotografie."
                    },
                    {
                        text: "Cum adaugi o bordura (chenar) in jurul imaginii?",
                        options: [
                            "Desenezi manual cu creionul",
                            "Din Picture Format > Picture Border alegi culoarea si grosimea bordurii",
                            "Apesi tasta Enter",
                            "Nu se pot adauga borduri"
                        ],
                        correct: 1,
                        explanation: "In tab-ul Picture Format, butonul Picture Border iti permite sa alegi culoarea, grosimea si stilul bordurii (continua, punctata etc.)."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Sfaturi avansate",
                description: "Invata trucuri utile pentru lucrul cu imagini in Word",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum adaugi un text descriptiv (Alt Text) la o imagine?",
                        options: [
                            "Scrii textul deasupra imaginii",
                            "Click dreapta pe imagine > Edit Alt Text",
                            "Apesi Ctrl + Z",
                            "Nu se poate adauga text descriptiv"
                        ],
                        correct: 1,
                        explanation: "Alt Text (text alternativ) descrie imaginea pentru persoanele care nu o pot vedea. Click dreapta pe imagine > Edit Alt Text si scrii o descriere scurta."
                    },
                    {
                        text: "Ce format de imagine este recomandat pentru fotografii in Word?",
                        options: [
                            ".txt",
                            ".jpg sau .png",
                            ".mp3",
                            ".exe"
                        ],
                        correct: 1,
                        explanation: "JPG este ideal pentru fotografii (fisiere mai mici). PNG este bun cand ai nevoie de fundal transparent sau imagini cu text clar."
                    },
                    {
                        text: "De ce este important sa nu pui prea multe imagini de dimensiuni mari intr-un document?",
                        options: [
                            "Word nu permite mai mult de 2 imagini",
                            "Documentul devine foarte mare (MB) si se poate deschide greu",
                            "Imaginile se sterg automat",
                            "Nu exista nicio problema"
                        ],
                        correct: 1,
                        explanation: "Imaginile mari cresc dimensiunea fisierului .docx. Un document cu multe poze de rezolutie inalta poate deveni foarte mare si greu de trimis pe email. Comprima imaginile daca este necesar!"
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls5-extra-birotice-quiz4');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5-extra-birotice-quiz4', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) conn.classList.add('completed');
                else conn.classList.remove('completed');
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>`;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasVisual && q.visualType === 'image-selected') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn">Insert</span>
                            <span class="word-btn highlight">Picture Format</span>
                        </div>
                        <div class="word-document" style="text-align: center;">
                            <div style="display: inline-block; border: 2px dashed #3b82f6; padding: 4px; position: relative;">
                                <div style="width: 120px; height: 80px; background: linear-gradient(135deg, #87CEEB, #228B22); display: flex; align-items: center; justify-content: center; font-size: 0.8em; color: #fff;">Imagine</div>
                                <div style="position:absolute;top:-4px;left:-4px;width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>
                                <div style="position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>
                                <div style="position:absolute;bottom:-4px;left:-4px;width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>
                                <div style="position:absolute;bottom:-4px;right:-4px;width:8px;height:8px;background:#3b82f6;border-radius:50%;"></div>
                            </div>
                        </div>
                    </div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Urmatoarea Intrebare</button>
                    </div>
                </div>`;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz5-proiecte.html'">Quiz-ul 5: Salvarea Documentelor</button>` : ''}
                    </div>
                </div>`;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

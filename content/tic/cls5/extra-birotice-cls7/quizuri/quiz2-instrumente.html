<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Formatare Word | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\uD83D\uDD12'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

.word-ui-mockup { background: #2d2d4a; border-radius: 12px; padding: 1rem; margin: 1rem auto; max-width: 500px; text-align: left; border: 2px solid var(--border); }

.word-toolbar { background: #1e1e3a; padding: 0.5rem; border-radius: 8px; margin-bottom: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

.word-btn { padding: 0.3rem 0.6rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 0.85rem; }

.word-btn.highlight { background: var(--accent-blue); border-color: var(--accent-blue); }

.word-document { background: #fff; color: #000; padding: 1rem; border-radius: 4px; min-height: 100px; font-family: 'Times New Roman', serif; }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&larr; Inapoi la modul</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 2: Formatarea Textului in Word</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        // Quiz ID: cls5-extra-birotice-quiz2
        const levels = {
            1: {
                title: "Nivel 1: Bold, Italic, Underline",
                description: "Invata cele trei formatari de baza ale textului",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce scurtatura de taste face textul Bold (ingrosit)?",
                        options: [
                            "Ctrl + I",
                            "Ctrl + U",
                            "Ctrl + B",
                            "Ctrl + P"
                        ],
                        correct: 2,
                        explanation: "Ctrl + B activeaza formatul Bold (B de la Bold). Textul selectat va deveni ingrosit."
                    },
                    {
                        text: "Ce inseamna formatul Italic?",
                        options: [
                            "Textul devine mai mare",
                            "Textul devine aplecat (inclinat) spre dreapta",
                            "Textul devine subliniat",
                            "Textul devine rosu"
                        ],
                        correct: 1,
                        explanation: "Italic face textul inclinat (aplecat) spre dreapta. Se foloseste adesea pentru titluri de carti sau cuvinte in alte limbi."
                    },
                    {
                        text: "Care este scurtatura pentru Underline (subliniere)?",
                        options: [
                            "Ctrl + U",
                            "Ctrl + S",
                            "Ctrl + B",
                            "Ctrl + N"
                        ],
                        correct: 0,
                        explanation: "Ctrl + U activeaza sublinierea (U de la Underline). Textul selectat va avea o linie dedesubt."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Fontul si dimensiunea",
                description: "Schimba tipul de font si marimea textului",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este un font?",
                        options: [
                            "O culoare pentru text",
                            "Stilul vizual al literelor (cum arata literele)",
                            "O imagine inserata in text",
                            "Un tip de paragraf"
                        ],
                        correct: 1,
                        explanation: "Un font (sau tip de litera) este stilul vizual al textului. Exemple: Arial arata diferit de Times New Roman sau Comic Sans."
                    },
                    {
                        text: "Unde schimbi dimensiunea fontului in Word?",
                        hasVisual: true,
                        visualType: "fontsize",
                        options: [
                            "In meniul File",
                            "In casuta cu numarul din tab-ul Home (langa numele fontului)",
                            "In tab-ul View",
                            "In bara de stare de jos"
                        ],
                        correct: 1,
                        explanation: "Dimensiunea fontului se schimba din casuta cu numarul din tab-ul Home. Numere mai mari = text mai mare (ex: 12 este normal, 24 este titlu mare)."
                    },
                    {
                        text: "Ce trebuie sa faci INAINTE de a formata un text existent?",
                        options: [
                            "Sa salvezi documentul",
                            "Sa selectezi (sa evidentiezi) textul pe care vrei sa-l formatezi",
                            "Sa inchizi documentul",
                            "Sa stergi textul"
                        ],
                        correct: 1,
                        explanation: "Trebuie intai sa selectezi textul (cu mouse-ul sau tastatura), apoi sa aplici formatarea dorita. Altfel, formatarea se va aplica doar textului pe care il vei scrie in continuare."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Culoarea textului",
                description: "Invata sa schimbi culoarea textului si a fundalului",
                xpReward: 100,
                questions: [
                    {
                        text: "Unde gasesti butonul pentru culoarea textului in Word?",
                        options: [
                            "In tab-ul Insert",
                            "In tab-ul Home, sectiunea Font - butonul cu litera A colorata",
                            "In tab-ul View",
                            "In tab-ul Layout"
                        ],
                        correct: 1,
                        explanation: "Butonul pentru culoarea textului se afla in tab-ul Home, in grupul Font. Are o litera 'A' cu o linie colorata dedesubt."
                    },
                    {
                        text: "Ce face butonul Text Highlight Color (culoare de evidentiare)?",
                        options: [
                            "Schimba culoarea literelor",
                            "Pune o culoare de fundal in spatele textului, ca un marker",
                            "Sterge textul",
                            "Face textul invizibil"
                        ],
                        correct: 1,
                        explanation: "Text Highlight simuleaza un marker (evidentator): pune o culoare de fundal in spatele textului selectat, ca si cum ai marca cu un marker fluorescent."
                    },
                    {
                        text: "Cum faci ca un titlu sa fie rosu si ingrosit?",
                        options: [
                            "Selectezi titlul, apesi Bold, apoi alegi culoarea rosie din Font Color",
                            "Scrii titlul cu Caps Lock",
                            "Apesi doar Enter",
                            "Nu se poate face in Word"
                        ],
                        correct: 0,
                        explanation: "Pasii sunt: 1) Selectezi textul titlului, 2) Apesi Bold (Ctrl+B), 3) Alegi culoarea rosie din butonul Font Color. Poti combina mai multe formatari!"
                    }
                ]
            },
            4: {
                title: "Nivel 4: Alinierea textului",
                description: "Invata sa aliniezi textul: stanga, centru, dreapta, justified",
                xpReward: 125,
                questions: [
                    {
                        text: "Cate tipuri de aliniere a textului exista in Word?",
                        options: [
                            "2 tipuri",
                            "3 tipuri",
                            "4 tipuri: stanga, centru, dreapta si justify",
                            "1 singur tip"
                        ],
                        correct: 2,
                        explanation: "Word ofera 4 tipuri de aliniere: Left (stanga), Center (centru), Right (dreapta) si Justify (aliniere la ambele margini)."
                    },
                    {
                        text: "Ce scurtatura folosesti pentru a centra textul?",
                        options: [
                            "Ctrl + L",
                            "Ctrl + R",
                            "Ctrl + E",
                            "Ctrl + J"
                        ],
                        correct: 2,
                        explanation: "Ctrl + E centreaza textul. Ctrl + L = stanga (Left), Ctrl + R = dreapta (Right), Ctrl + J = justify (aliniere la ambele margini)."
                    },
                    {
                        text: "Ce inseamna alinierea 'Justify'?",
                        options: [
                            "Textul este centrat",
                            "Textul este aliniat la ambele margini (stanga si dreapta), ca in carti",
                            "Textul este aliniat doar la dreapta",
                            "Textul este sters"
                        ],
                        correct: 1,
                        explanation: "Justify aliniaza textul la ambele margini - stanga si dreapta. Word adauga spatiu intre cuvinte pentru ca fiecare rand sa ajunga pana la marginea dreapta, ca in carti si ziare."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Liste si spatiere",
                description: "Invata sa creezi liste si sa ajustezi spatierea",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum creezi o lista cu buline (bullets) in Word?",
                        options: [
                            "Apesi tasta Tab",
                            "Din tab-ul Home, apesi butonul Bullets (cel cu puncte)",
                            "Scrii manual puncte la inceputul fiecarui rand",
                            "Din tab-ul File"
                        ],
                        correct: 1,
                        explanation: "Din tab-ul Home, grupul Paragraph, apesi butonul Bullets pentru a crea automat o lista cu buline. Fiecare Enter creeaza un nou punct in lista."
                    },
                    {
                        text: "Care este diferenta intre o lista cu buline si una numerotata?",
                        options: [
                            "Nu exista nicio diferenta",
                            "Lista cu buline foloseste puncte/simboluri, cea numerotata foloseste numere (1, 2, 3...)",
                            "Lista numerotata nu se poate crea in Word",
                            "Lista cu buline este colorata"
                        ],
                        correct: 1,
                        explanation: "Lista cu buline (bullets) foloseste simboluri (punct, patrat etc.), iar lista numerotata (numbered) foloseste numere secventiale (1, 2, 3...)."
                    },
                    {
                        text: "Ce face optiunea 'Line Spacing' (spatiere intre randuri)?",
                        options: [
                            "Schimba culoarea textului",
                            "Modifica distanta dintre randurile de text",
                            "Adauga imagini intre randuri",
                            "Sterge randuri goale"
                        ],
                        correct: 1,
                        explanation: "Line Spacing controleaza cat spatiu liber este intre randuri. Valoarea 1.0 = fara spatiu extra, 1.5 = spatiu si jumatate, 2.0 = spatiu dublu (recomandat pentru teme)."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls5-extra-birotice-quiz2');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5-extra-birotice-quiz2', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) conn.classList.add('completed');
                else conn.classList.remove('completed');
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>`;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasVisual && q.visualType === 'fontsize') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn">Calibri</span>
                            <span class="word-btn highlight">12</span>
                            <span class="word-btn"><b>B</b></span>
                            <span class="word-btn"><i>I</i></span>
                            <span class="word-btn" style="text-decoration:underline;">U</span>
                        </div>
                        <div class="word-document">
                            <p>Text normal cu dimensiunea 12</p>
                            <p style="font-size: 1.5em;"><b>Titlu mare cu dimensiunea 24</b></p>
                        </div>
                    </div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Urmatoarea Intrebare</button>
                    </div>
                </div>`;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz3-forme.html'">Quiz-ul 3: Tabele in Word</button>` : ''}
                    </div>
                </div>`;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

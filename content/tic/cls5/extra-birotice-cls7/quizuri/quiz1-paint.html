<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Documente Word | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.locked::after {
            content: '\uD83D\uDD12';
            position: absolute;
            font-size: 1rem;
            bottom: -5px;
            right: -5px;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-node.completed::after {
            content: '\2713';
            position: absolute;
            font-size: 0.8rem;
            bottom: -5px;
            right: -5px;
            background: var(--accent-green);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Word UI mockup */
        .word-ui-mockup {
            background: #2d2d4a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 500px;
            text-align: left;
            border: 2px solid var(--border);
        }

.word-toolbar {
            background: #1e1e3a;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

.word-btn {
            padding: 0.3rem 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

.word-btn.highlight {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

.word-document {
            background: #fff;
            color: #000;
            padding: 1rem;
            border-radius: 4px;
            min-height: 100px;
            font-family: 'Times New Roman', serif;
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&larr; Inapoi la modul</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 1: Crearea Documentelor Word</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz ID: cls5-extra-birotice-quiz1
        const levels = {
            1: {
                title: "Nivel 1: Ce este Microsoft Word?",
                description: "Invata ce este Word si la ce folosim documentele",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este Microsoft Word?",
                        options: [
                            "Un program pentru desenat imagini",
                            "Un program pentru creat si editat documente text",
                            "Un program pentru ascultat muzica",
                            "Un browser de internet"
                        ],
                        correct: 1,
                        explanation: "Microsoft Word este un procesor de texte - un program folosit pentru a crea, edita si formata documente scrise."
                    },
                    {
                        text: "Care dintre urmatoarele NU este un tip de document pe care il poti crea in Word?",
                        options: [
                            "Referat",
                            "Scrisoare",
                            "Joc video",
                            "CV (Curriculum Vitae)"
                        ],
                        correct: 2,
                        explanation: "In Word poti crea referate, scrisori, CV-uri, rapoarte si multe alte documente scrise. Jocurile video se fac cu alte programe specializate."
                    },
                    {
                        text: "Cum deschizi Microsoft Word pe calculator?",
                        options: [
                            "Cauti 'Word' in bara de cautare din Start",
                            "Apesi tasta Delete",
                            "Deschizi un browser web",
                            "Apesi butonul de oprire al calculatorului"
                        ],
                        correct: 0,
                        explanation: "Cel mai simplu mod: apasa butonul Start, scrie 'Word' in bara de cautare si apasa Enter."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Crearea unui document nou",
                description: "Invata pasii pentru a crea un document Word de la zero",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce vezi cand deschizi Word pentru prima data?",
                        options: [
                            "O pagina goala direct",
                            "Un joc",
                            "Ecranul de start cu optiunea 'Blank document' si sabloane",
                            "O pagina cu fotografii"
                        ],
                        correct: 2,
                        explanation: "La deschidere, Word iti arata ecranul de start unde poti alege 'Blank document' (document gol) sau un sablon pregatit."
                    },
                    {
                        text: "Ce inseamna 'Blank document'?",
                        options: [
                            "Un document cu erori",
                            "Un document care nu se poate edita",
                            "O pagina alba, goala, gata pentru a scrie",
                            "Un document protejat cu parola"
                        ],
                        correct: 2,
                        explanation: "'Blank document' inseamna o pagina alba, curata, unde poti incepe sa scrii orice doresti."
                    },
                    {
                        text: "Care este scurtatura de taste pentru a crea un document nou?",
                        hasVisual: true,
                        visualType: "toolbar",
                        options: [
                            "Ctrl + S",
                            "Ctrl + N",
                            "Ctrl + P",
                            "Ctrl + Z"
                        ],
                        correct: 1,
                        explanation: "Ctrl + N (N de la New) creeaza un document nou in Word. Este o scurtatura foarte utila!"
                    }
                ]
            },
            3: {
                title: "Nivel 3: Interfata Word",
                description: "Descopera elementele principale ale ferestrei Word",
                xpReward: 100,
                questions: [
                    {
                        text: "Cum se numeste bara cu butoane din partea de sus a ferestrei Word?",
                        options: [
                            "Bara de stare",
                            "Bara de titlu",
                            "Ribbon (Panglica)",
                            "Bara de derulare"
                        ],
                        correct: 2,
                        explanation: "Ribbon-ul (Panglica) este bara mare din partea de sus care contine toate instrumentele organizate pe tab-uri: Home, Insert, Layout etc."
                    },
                    {
                        text: "Ce este cursorul (liniuta care clipeste) in Word?",
                        hasVisual: true,
                        visualType: "cursor",
                        options: [
                            "O eroare a programului",
                            "Indica locul unde va aparea textul pe care il scrii",
                            "Un element decorativ",
                            "Butonul de salvare"
                        ],
                        correct: 1,
                        explanation: "Cursorul (liniuta verticala care clipeste) iti arata exact unde va aparea urmatoarea litera pe care o tastezi."
                    },
                    {
                        text: "Ce tab din Ribbon contine butoanele Bold, Italic si Underline?",
                        options: [
                            "Insert",
                            "View",
                            "Home",
                            "Layout"
                        ],
                        correct: 2,
                        explanation: "Tab-ul Home contine cele mai folosite instrumente de formatare: Bold, Italic, Underline, dimensiunea fontului, culoarea textului."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Scrierea si editarea textului",
                description: "Invata sa scrii si sa editezi text in Word",
                xpReward: 125,
                questions: [
                    {
                        text: "Cum treci pe un rand nou in Word?",
                        options: [
                            "Apesi tasta Spatiu de mai multe ori",
                            "Apesi tasta Tab",
                            "Apesi tasta Enter",
                            "Apesi tasta Escape"
                        ],
                        correct: 2,
                        explanation: "Tasta Enter te duce pe un rand nou (creeaza un paragraf nou). Este la fel ca la masina de scris!"
                    },
                    {
                        text: "Ce face tasta Backspace?",
                        options: [
                            "Salveaza documentul",
                            "Sterge litera din stanga cursorului",
                            "Adauga un spatiu",
                            "Inchide documentul"
                        ],
                        correct: 1,
                        explanation: "Backspace sterge caracterul aflat in stanga cursorului. Delete sterge caracterul din dreapta cursorului."
                    },
                    {
                        text: "Cum selectezi un cuvant intreg in Word?",
                        options: [
                            "Apesi tasta Enter",
                            "Dai dublu-click pe cuvant",
                            "Apesi tasta Delete",
                            "Dai click dreapta pe ecran"
                        ],
                        correct: 1,
                        explanation: "Dublu-click pe un cuvant il selecteaza complet. Triplu-click selecteaza un paragraf intreg!"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Structura documentului",
                description: "Invata despre paginile si structura unui document Word",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce se intampla cand scrii mai mult text decat incape pe o pagina?",
                        options: [
                            "Textul dispare",
                            "Word creeaza automat o pagina noua",
                            "Programul se blocheaza",
                            "Textul se micsoreaza singur"
                        ],
                        correct: 1,
                        explanation: "Word adauga automat o pagina noua cand textul depaseste pagina curenta. Nu trebuie sa faci nimic special!"
                    },
                    {
                        text: "Care este extensia (terminatia) unui fisier Word modern?",
                        options: [
                            ".mp3",
                            ".jpg",
                            ".docx",
                            ".exe"
                        ],
                        correct: 2,
                        explanation: "Documentele Word moderne au extensia .docx (sau .doc pentru versiuni mai vechi). Exemplu: 'Referat.docx'"
                    },
                    {
                        text: "Ce este un sablon (template) in Word?",
                        options: [
                            "Un document gol",
                            "Un model pregatit cu design si structura pe care il poti folosi",
                            "O eroare de program",
                            "Un fisier sters"
                        ],
                        correct: 1,
                        explanation: "Un sablon este un model pregatit (ex: sablon de CV, scrisoare, raport) care iti ofera un design gata facut pe care doar il completezi."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('cls5-extra-birotice-quiz1');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5-extra-birotice-quiz1', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add visual mockup if needed
            if (q.hasVisual && q.visualType === 'cursor') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn">Insert</span>
                        </div>
                        <div class="word-document">
                            Buna ziua!<span style="border-left: 2px solid #000; animation: blink 1s infinite;">|</span>
                        </div>
                    </div>
                    <style>
                        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
                    </style>
                `;
            }

            if (q.hasVisual && q.visualType === 'toolbar') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn highlight">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn">Insert</span>
                            <span class="word-btn">Layout</span>
                        </div>
                        <div class="word-document" style="text-align: center; color: #999;">
                            Document nou...
                        </div>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-instrumente.html'">
                                Quiz-ul 2: Formatarea Textului
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

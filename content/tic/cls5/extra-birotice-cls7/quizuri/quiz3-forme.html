<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Tabele in Word | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&larr; Inapoi la modul</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 3: Tabele in Word</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        // Quiz ID: cls5-extra-birotice-quiz3
        const levels = {
            1: {
                title: "Nivel 1: Ce este un tabel?",
                description: "Invata ce sunt tabelele si cand le folosim in Word",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este un tabel in Word?",
                        options: [
                            "O imagine cu linii",
                            "O structura formata din randuri si coloane pentru organizarea informatiilor",
                            "Un tip de font special",
                            "O lista cu buline"
                        ],
                        correct: 1,
                        explanation: "Un tabel este o structura cu randuri (linii orizontale) si coloane (linii verticale) care creeaza celule. Este perfect pentru a organiza date clar."
                    },
                    {
                        text: "Cand este util sa folosesti un tabel?",
                        options: [
                            "Cand vrei sa scrii un poem",
                            "Cand vrei sa organizezi informatii in categorii (ex: orar, note, comparatii)",
                            "Cand vrei sa desenezi",
                            "Cand vrei sa asculti muzica"
                        ],
                        correct: 1,
                        explanation: "Tabelele sunt ideale pentru orare, liste de note, comparatii, inventare - orice informatii care au nevoie de structura clara pe categorii."
                    },
                    {
                        text: "Cum se numeste fiecare casuta dintr-un tabel?",
                        options: [
                            "Paragraf",
                            "Celula",
                            "Pagina",
                            "Rand"
                        ],
                        correct: 1,
                        explanation: "Fiecare casuta dintr-un tabel se numeste celula. O celula se afla la intersectia unui rand cu o coloana."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Inserarea unui tabel",
                description: "Invata cum sa adaugi un tabel in documentul tau",
                xpReward: 75,
                questions: [
                    {
                        text: "Din ce tab inserezi un tabel in Word?",
                        hasVisual: true,
                        visualType: "table-insert",
                        options: [
                            "Home",
                            "Insert (Inserare)",
                            "View",
                            "File"
                        ],
                        correct: 1,
                        explanation: "Tab-ul Insert contine butonul Table. Apesi Insert > Table si alegi numarul de randuri si coloane dorit."
                    },
                    {
                        text: "Cum alegi dimensiunea tabelului (numar de randuri si coloane)?",
                        options: [
                            "Scrii numarul pe tastatura",
                            "Treci cu mouse-ul peste grila si selectezi cate randuri si coloane vrei",
                            "Apesi tasta Enter",
                            "Nu poti alege dimensiunea"
                        ],
                        correct: 1,
                        explanation: "Cand apesi butonul Table, apare o grila vizuala. Treci cu mouse-ul peste ea pentru a selecta cate coloane si randuri vrei (ex: 3x4 = 3 coloane, 4 randuri)."
                    },
                    {
                        text: "Ce se intampla dupa ce inserezi un tabel?",
                        options: [
                            "Word se inchide",
                            "Apare tabelul in document si poti incepe sa scrii in celule",
                            "Documentul se sterge",
                            "Apare o imagine"
                        ],
                        correct: 1,
                        explanation: "Tabelul apare in document cu celule goale. Dai click in orice celula si incepi sa scrii. Cu Tab treci la celula urmatoare."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Navigarea in tabel",
                description: "Invata sa te deplasezi eficient intr-un tabel",
                xpReward: 100,
                questions: [
                    {
                        text: "Cum treci de la o celula la urmatoarea celula din dreapta?",
                        options: [
                            "Apesi Enter",
                            "Apesi tasta Tab",
                            "Apesi Escape",
                            "Apesi Delete"
                        ],
                        correct: 1,
                        explanation: "Tasta Tab te muta la urmatoarea celula din dreapta. Daca esti in ultima celula a randului, Tab te duce la prima celula a randului urmator."
                    },
                    {
                        text: "Ce se intampla daca apesi Tab in ultima celula a tabelului?",
                        options: [
                            "Tabelul se sterge",
                            "Se adauga automat un rand nou la sfarsitul tabelului",
                            "Cursorul iese din tabel",
                            "Nu se intampla nimic"
                        ],
                        correct: 1,
                        explanation: "Daca apesi Tab in ultima celula (coltul din dreapta jos), Word adauga automat un rand nou. Este o metoda rapida de a extinde tabelul!"
                    },
                    {
                        text: "Cum selectezi un rand intreg dintr-un tabel?",
                        options: [
                            "Dai click in mijlocul randului",
                            "Pozitionezi mouse-ul in stanga randului (langa tabel) si dai click",
                            "Apesi tasta Spatiu",
                            "Apesi Delete"
                        ],
                        correct: 1,
                        explanation: "Pentru a selecta un rand intreg, pozitionezi mouse-ul in stanga tabelului, langa randul dorit. Cursorul se transforma intr-o sageata, apoi dai click."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Modificarea tabelului",
                description: "Invata sa adaugi si sa stergi randuri si coloane",
                xpReward: 125,
                questions: [
                    {
                        text: "Cum adaugi un rand nou in mijlocul tabelului?",
                        options: [
                            "Click dreapta pe rand > Insert > Insert Rows Above/Below",
                            "Apesi tasta Enter",
                            "Stergi o celula",
                            "Nu se poate adauga"
                        ],
                        correct: 0,
                        explanation: "Click dreapta pe un rand existent, apoi Insert > 'Insert Rows Above' (deasupra) sau 'Insert Rows Below' (dedesubt) pentru a adauga un rand nou."
                    },
                    {
                        text: "Cum stergi o coloana dintr-un tabel?",
                        options: [
                            "Apesi tasta Backspace",
                            "Selectezi coloana, click dreapta > Delete Columns",
                            "Apesi tasta Escape",
                            "Inchizi documentul"
                        ],
                        correct: 1,
                        explanation: "Selectezi intreaga coloana (click pe marginea de sus), apoi click dreapta > Delete Columns. Coloana dispare impreuna cu tot continutul."
                    },
                    {
                        text: "Cum poti redimensiona (mari sau micsora) o coloana?",
                        options: [
                            "Apesi tasta Tab",
                            "Tragi de marginea coloanei cu mouse-ul",
                            "Apesi Ctrl + Z",
                            "Scrii mai mult text"
                        ],
                        correct: 1,
                        explanation: "Pozitionezi mouse-ul pe marginea dintre doua coloane (cursorul se schimba intr-o sageata dubla), apoi tragi spre stanga sau dreapta."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Formatarea tabelului",
                description: "Invata sa faci tabelul sa arate profesional",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce sunt 'Table Styles' (Stiluri de tabel) in Word?",
                        options: [
                            "Tipuri de fonturi pentru tabel",
                            "Modele predefinite de design care coloreaza si formateaza tabelul automat",
                            "Tipuri de documente",
                            "Stiluri de paragraf"
                        ],
                        correct: 1,
                        explanation: "Table Styles sunt sabloane de design pregatite care aplica automat culori, borduri si formatare tabelului. Le gasesti in tab-ul Table Design."
                    },
                    {
                        text: "Cum faci ca primul rand al tabelului (antetul) sa arate diferit?",
                        options: [
                            "Il stergi si il rescrii",
                            "Activezi optiunea 'Header Row' din Table Design si formatezi cu Bold/culori",
                            "Nu se poate face",
                            "Apesi tasta Delete"
                        ],
                        correct: 1,
                        explanation: "In tab-ul Table Design, bifezi 'Header Row' pentru ca primul rand sa fie formatat diferit (mai inchis, bold). Apoi poti adauga Bold si culoare manual."
                    },
                    {
                        text: "Cum imbini (unesti) doua celule intr-una singura?",
                        options: [
                            "Stergi textul din ele",
                            "Selectezi celulele dorite, click dreapta > Merge Cells",
                            "Apesi tasta Tab",
                            "Le copiezi"
                        ],
                        correct: 1,
                        explanation: "Selectezi celulele pe care vrei sa le unesti, click dreapta > Merge Cells (Imbina celulele). Cele doua celule devin una singura, mai mare."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls5-extra-birotice-quiz3');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5-extra-birotice-quiz3', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) conn.classList.add('completed');
                else conn.classList.remove('completed');
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>`;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasVisual && q.visualType === 'table-insert') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn highlight">Insert</span>
                            <span class="word-btn">Layout</span>
                        </div>
                        <div class="word-document">
                            <table style="border-collapse: collapse; width: 100%;">
                                <tr><td style="border: 1px solid #999; padding: 6px;">Nume</td><td style="border: 1px solid #999; padding: 6px;">Nota</td><td style="border: 1px solid #999; padding: 6px;">Materie</td></tr>
                                <tr><td style="border: 1px solid #999; padding: 6px;">Ana</td><td style="border: 1px solid #999; padding: 6px;">10</td><td style="border: 1px solid #999; padding: 6px;">TIC</td></tr>
                                <tr><td style="border: 1px solid #999; padding: 6px;">Ion</td><td style="border: 1px solid #999; padding: 6px;">9</td><td style="border: 1px solid #999; padding: 6px;">TIC</td></tr>
                            </table>
                        </div>
                    </div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Urmatoarea Intrebare</button>
                    </div>
                </div>`;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz4-text.html'">Quiz-ul 4: Imagini in Word</button>` : ''}
                    </div>
                </div>`;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

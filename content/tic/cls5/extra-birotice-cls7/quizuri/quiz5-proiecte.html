<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Salvarea Documentelor Word | Clasa a V-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #fff; }

.level-node.locked::after { content: '\uD83D\uDD12'; position: absolute; font-size: 1rem; bottom: -5px; right: -5px; }

.level-node.active { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); animation: pulse 2s infinite; }

.level-node.completed::after { content: '\2713'; position: absolute; font-size: 0.8rem; bottom: -5px; right: -5px; background: var(--accent-green); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-blue); }

.level-intro .xp-reward { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-blue); }

.word-ui-mockup { background: #2d2d4a; border-radius: 12px; padding: 1rem; margin: 1rem auto; max-width: 500px; text-align: left; border: 2px solid var(--border); }

.word-toolbar { background: #1e1e3a; padding: 0.5rem; border-radius: 8px; margin-bottom: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

.word-btn { padding: 0.3rem 0.6rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 0.85rem; }

.word-btn.highlight { background: var(--accent-blue); border-color: var(--accent-blue); }

.word-document { background: #fff; color: #000; padding: 1rem; border-radius: 4px; min-height: 100px; font-family: 'Times New Roman', serif; }

.btn-primary { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }

.btn-outline:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

.xp-earned { font-size: 2rem; color: var(--accent-blue); margin: 1.5rem 0; }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">&larr; Inapoi la modul</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 5: Salvarea si Exportul Documentelor</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        // Quiz ID: cls5-extra-birotice-quiz5
        const levels = {
            1: {
                title: "Nivel 1: Salvarea de baza",
                description: "Invata cum sa salvezi un document Word corect",
                xpReward: 50,
                questions: [
                    {
                        text: "Care este scurtatura de taste pentru salvare rapida in Word?",
                        options: [
                            "Ctrl + C",
                            "Ctrl + V",
                            "Ctrl + S",
                            "Ctrl + Z"
                        ],
                        correct: 2,
                        explanation: "Ctrl + S (S de la Save) salveaza documentul rapid. Este cea mai importanta scurtatura - foloseste-o des!"
                    },
                    {
                        text: "De ce este important sa salvezi des documentul?",
                        options: [
                            "Ca sa arate mai frumos",
                            "Ca sa nu pierzi munca daca se inchide Word sau se opreste curentul",
                            "Ca sa se deschida mai repede",
                            "Nu este important"
                        ],
                        correct: 1,
                        explanation: "Daca nu salvezi si se intampla ceva (se opreste curentul, se blocheaza calculatorul), pierzi tot ce ai scris de la ultima salvare. Salveaza la fiecare 5 minute!"
                    },
                    {
                        text: "Unde gasesti butonul Save in Word?",
                        hasVisual: true,
                        visualType: "save-menu",
                        options: [
                            "In tab-ul Home",
                            "In meniul File > Save sau pictograma dischetei din bara de acces rapid",
                            "In tab-ul View",
                            "In tab-ul Insert"
                        ],
                        correct: 1,
                        explanation: "Poti salva din: 1) File > Save, 2) Pictograma dischetei din bara de acces rapid (coltul stanga sus), sau 3) Scurtatura Ctrl + S."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Save vs Save As",
                description: "Invata diferenta dintre Save si Save As",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce face comanda 'Save As' (Salvare ca)?",
                        options: [
                            "Sterge documentul",
                            "Iti permite sa alegi un nume nou si o locatie noua pentru document",
                            "Inchide Word",
                            "Printeaza documentul"
                        ],
                        correct: 1,
                        explanation: "'Save As' creeaza o copie a documentului cu un nume nou sau intr-o locatie noua. Documentul original ramane neschimbat."
                    },
                    {
                        text: "Cand ar trebui sa folosesti 'Save As' in loc de 'Save'?",
                        options: [
                            "Niciodata",
                            "Cand vrei sa faci o copie a documentului sau sa-l salvezi in alt format (ex: PDF)",
                            "Cand vrei sa stergi documentul",
                            "Cand vrei sa printezi"
                        ],
                        correct: 1,
                        explanation: "Save As este util cand: 1) Vrei o copie cu alt nume, 2) Vrei sa salvezi in alt folder, 3) Vrei sa exporti in alt format (PDF, .doc vechi etc.)."
                    },
                    {
                        text: "Care este scurtatura pentru Save As?",
                        options: [
                            "Ctrl + S",
                            "F12 sau Ctrl + Shift + S",
                            "Ctrl + N",
                            "Ctrl + P"
                        ],
                        correct: 1,
                        explanation: "F12 deschide direct fereastra Save As. Alternativ, poti folosi Ctrl + Shift + S sau mergi la File > Save As."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Formate de fisier",
                description: "Invata despre diferitele formate in care poti salva",
                xpReward: 100,
                questions: [
                    {
                        text: "Care este formatul implicit (standard) pentru documentele Word?",
                        options: [
                            ".pdf",
                            ".txt",
                            ".docx",
                            ".jpg"
                        ],
                        correct: 2,
                        explanation: "Formatul .docx este formatul standard al Word. Pastreaza toata formatarea, imaginile, tabelele si structura documentului."
                    },
                    {
                        text: "Ce este formatul PDF si de ce este util?",
                        options: [
                            "Un format de muzica",
                            "Un format care pastreaza aspectul documentului exact la fel pe orice calculator",
                            "Un format de video",
                            "Un format care sterge formatarea"
                        ],
                        correct: 1,
                        explanation: "PDF (Portable Document Format) pastreaza aspectul exact al documentului indiferent de calculator sau program. Este ideal pentru a trimite documente altora."
                    },
                    {
                        text: "Cum salvezi un document Word ca PDF?",
                        options: [
                            "Redenumesti fisierul .docx in .pdf",
                            "File > Save As > alegi PDF din lista de formate, sau File > Export > Create PDF",
                            "Apesi Ctrl + P",
                            "Nu se poate salva ca PDF"
                        ],
                        correct: 1,
                        explanation: "Mergi la File > Save As, apoi in casuta 'Save as type' alegi 'PDF'. Alternativ: File > Export > Create PDF/XPS Document."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Locatii de salvare",
                description: "Invata unde si cum sa organizezi documentele salvate",
                xpReward: 125,
                questions: [
                    {
                        text: "Care sunt locatiile obisnuite unde poti salva un document?",
                        options: [
                            "Doar pe Desktop",
                            "Desktop, Documents, OneDrive, USB, sau orice alt folder",
                            "Doar in Word",
                            "Doar pe internet"
                        ],
                        correct: 1,
                        explanation: "Poti salva oriunde: Desktop, folderul Documents, OneDrive (cloud), un stick USB, sau orice alt folder de pe calculator."
                    },
                    {
                        text: "Ce este OneDrive in contextul salvarii documentelor Word?",
                        options: [
                            "Un program de desenat",
                            "Un serviciu de stocare in cloud (online) integrat cu Word",
                            "Un tip de font",
                            "Un browser de internet"
                        ],
                        correct: 1,
                        explanation: "OneDrive este serviciul Microsoft de stocare in cloud. Documentele salvate pe OneDrive sunt accesibile de pe orice dispozitiv si se pot partaja usor."
                    },
                    {
                        text: "De ce este bine sa dai un nume clar documentului?",
                        options: [
                            "Nu conteaza numele",
                            "Ca sa-l gasesti usor mai tarziu (ex: 'Referat_Istorie_Daci.docx' nu 'Document1.docx')",
                            "Ca sa fie mai mic",
                            "Ca sa se deschida mai repede"
                        ],
                        correct: 1,
                        explanation: "Un nume descriptiv te ajuta sa gasesti documentul rapid. 'Referat_Istorie_Clasa5.docx' este mult mai clar decat 'Document1.docx' sau 'fara titlu.docx'."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Printare si partajare",
                description: "Invata sa printezi si sa partajezi documentele Word",
                xpReward: 150,
                questions: [
                    {
                        text: "Care este scurtatura pentru a printa (tipari) un document?",
                        options: [
                            "Ctrl + S",
                            "Ctrl + N",
                            "Ctrl + P",
                            "Ctrl + Z"
                        ],
                        correct: 2,
                        explanation: "Ctrl + P (P de la Print) deschide fereastra de printare unde poti alege imprimanta, numarul de copii si paginile de printat."
                    },
                    {
                        text: "Ce poti seta in fereastra de printare inainte de a tipari?",
                        options: [
                            "Doar culoarea textului",
                            "Imprimanta, numarul de copii, paginile de printat si orientarea (portrait/landscape)",
                            "Doar numele documentului",
                            "Nimic, se printeaza direct"
                        ],
                        correct: 1,
                        explanation: "In fereastra Print poti alege: imprimanta, cate copii, ce pagini (toate sau anumite), orientarea (portrait = vertical, landscape = orizontal), si mai multe."
                    },
                    {
                        text: "Cum poti trimite documentul cuiva prin email direct din Word?",
                        options: [
                            "Apesi tasta Delete",
                            "File > Share sau salvezi ca PDF si il atasezi la email",
                            "Apesi Ctrl + Z",
                            "Nu se poate trimite din Word"
                        ],
                        correct: 1,
                        explanation: "Poti folosi File > Share pentru a trimite direct, sau salvezi documentul ca PDF (File > Export > PDF) si apoi il atasezi la un email. PDF-ul este preferabil pentru ca arata la fel pe orice calculator."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls5-extra-birotice-quiz5');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls5-extra-birotice-quiz5', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) conn.classList.add('completed');
                else conn.classList.remove('completed');
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>`;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
            function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasVisual && q.visualType === 'save-menu') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn highlight">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn">Insert</span>
                            <span class="word-btn">Layout</span>
                        </div>
                        <div style="background: #1e1e3a; padding: 0.8rem; border-radius: 4px; margin-top: 0.5rem;">
                            <div style="padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer;">New</div>
                            <div style="padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer;">Open</div>
                            <div style="padding: 0.4rem 0.8rem; background: var(--accent-blue); color: #fff; border-radius: 4px; cursor: pointer;"><b>Save</b></div>
                            <div style="padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer;">Save As</div>
                            <div style="padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer;">Export</div>
                            <div style="padding: 0.4rem 0.8rem; color: var(--text-primary); cursor: pointer;">Print</div>
                        </div>
                    </div>`;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">Urmatoarea Intrebare</button>
                    </div>
                </div>`;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= levels[currentLevel].questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Toate Quiz-urile Completate!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='../index.html'">Inapoi la Modul</button>` : ''}
                    </div>
                </div>`;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

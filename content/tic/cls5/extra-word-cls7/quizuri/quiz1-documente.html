<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Documente Word | Clasa a VII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #ef4444;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-blue);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-blue);
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Word UI mockup */
        .word-ui-mockup {
            background: #2d2d4a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 500px;
            text-align: left;
            border: 2px solid var(--border);
        }

.word-toolbar {
            background: #1e1e3a;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

.word-btn {
            padding: 0.3rem 0.6rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

.word-btn.highlight {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

.word-document {
            background: #fff;
            color: #000;
            padding: 1rem;
            border-radius: 4px;
            min-height: 100px;
            font-family: 'Times New Roman', serif;
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-blue);
            margin: 1.5rem 0;
        }

/* Accessible skip-link — hidden until focused */
.skip-link {
    position: absolute;
    top: -100%;
    left: 0;
    padding: 0.5rem 1rem;
    background: var(--accent-blue);
    color: #fff;
    font-size: 0.875rem;
    font-weight: 600;
    border-radius: 0 0 4px 0;
    z-index: 9999;
    text-decoration: none;
    transition: top 0.15s;
}
.skip-link:focus {
    top: 0;
}
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Procesare Text</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Documente Word - Bazele</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Ce este un document?",
                description: "Invata ce este un document si la ce folosim Word",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este Microsoft Word?",
                        options: [
                            "Un joc pe calculator",
                            "Un program pentru scris si editat texte",
                            "Un program pentru facut calcule",
                            "Un browser de internet"
                        ],
                        correct: 1,
                        explanation: "Microsoft Word este un procesor de text - un program special facut pentru a scrie, edita si formata documente."
                    },
                    {
                        text: "Ce poti face intr-un document Word?",
                        options: [
                            "Doar sa scrii litere",
                            "Sa scrii texte, sa adaugi poze si tabele",
                            "Doar sa desenezi",
                            "Sa joci jocuri"
                        ],
                        correct: 1,
                        explanation: "In Word poti scrie texte, adauga imagini, crea tabele, formata textul cu diferite culori si fonturi - aproape orice ai nevoie pentru un document frumos!"
                    },
                    {
                        text: "Cand ai nevoie sa folosesti Word?",
                        options: [
                            "Cand vrei sa faci un referat sau o compunere",
                            "Cand vrei sa asculti muzica",
                            "Cand vrei sa te joci",
                            "Cand vrei sa vezi filme"
                        ],
                        correct: 0,
                        explanation: "Word este perfect pentru referate, compuneri, scrisori, CV-uri sau orice alt document scris."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Deschiderea Word",
                description: "Invata cum pornesti programul Microsoft Word",
                xpReward: 75,
                questions: [
                    {
                        text: "Care este cea mai usoara metoda de a deschide Word pe Windows?",
                        options: [
                            "Inchizi calculatorul",
                            "Cauti 'Word' in bara de cautare din Start",
                            "Apesi pe orice pictograma",
                            "Deconectezi internetul"
                        ],
                        correct: 1,
                        explanation: "Cel mai simplu: apasa butonul Start, scrie 'Word' in casuta de cautare si apasa Enter. Word se va deschide imediat!"
                    },
                    {
                        text: "Ce vezi cand deschizi Word prima data?",
                        options: [
                            "Un joc",
                            "O pagina alba sau ecranul de start cu sabloane",
                            "Un film",
                            "Nimic"
                        ],
                        correct: 1,
                        explanation: "La deschidere, Word iti arata ecranul de start unde poti alege un document gol (Blank document) sau un sablon pregatit."
                    },
                    {
                        text: "Ce inseamna 'Blank document' (Document gol)?",
                        options: [
                            "Un document care nu functioneaza",
                            "O pagina alba, goala, unde poti incepe sa scrii",
                            "Un document cu multe poze",
                            "Un document cu erori"
                        ],
                        correct: 1,
                        explanation: "'Blank document' inseamna o pagina alba, curata, gata pentru tine sa incepi sa scrii ce doresti."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Scrierea textului",
                description: "Invata sa scrii text in Word",
                xpReward: 100,
                questions: [
                    {
                        text: "Unde apare textul cand scrii in Word?",
                        hasVisual: true,
                        visualType: "cursor",
                        options: [
                            "Oriunde pe ecran",
                            "Acolo unde este cursorul (liniuta care clipeste)",
                            "Doar in colt",
                            "In bara de sus"
                        ],
                        correct: 1,
                        explanation: "Textul apare exact unde este cursorul - acea liniuta verticala care clipeste pe pagina. Cursorul iti arata unde va aparea urmatoarea litera."
                    },
                    {
                        text: "Cum treci pe randul urmator (rand nou)?",
                        options: [
                            "Apesi tasta Spatiu de multe ori",
                            "Apesi tasta Enter",
                            "Apesi tasta Delete",
                            "Inchizi Word si il redeschizi"
                        ],
                        correct: 1,
                        explanation: "Tasta Enter incheie paragraful curent si deschide unul nou. Daca apesi Enter la mijlocul unei fraze, tot ce urmeaza dupa cursor sare pe randul urmator — la fel cum treci la un rand nou intr-un chat sau intr-un mesaj text."
                    },
                    {
                        text: "Cum stergi o litera gresita care este IN FATA cursorului?",
                        options: [
                            "Apesi tasta Delete",
                            "Apesi tasta Backspace",
                            "Apesi tasta Enter",
                            "Apesi tasta Spatiu"
                        ],
                        correct: 0,
                        explanation: "Delete sterge litera din fata cursorului (spre dreapta). Backspace sterge litera din spatele cursorului (spre stanga)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Salvarea documentelor",
                description: "Invata sa salvezi munca ta - foarte important!",
                xpReward: 125,
                questions: [
                    {
                        text: "De ce este important sa salvezi documentul?",
                        options: [
                            "Nu este important",
                            "Ca sa nu pierzi tot ce ai scris daca se inchide Word",
                            "Ca sa arate mai frumos",
                            "Ca sa se deschida mai repede"
                        ],
                        correct: 1,
                        explanation: "Salvarea este FOARTE importanta! Daca nu salvezi si se inchide Word (sau se opreste curentul), pierzi tot ce ai scris. Salveaza des!"
                    },
                    {
                        text: "Care este combinatia de taste pentru salvare rapida?",
                        options: [
                            "Ctrl + P",
                            "Ctrl + S",
                            "Ctrl + Z",
                            "Ctrl + C"
                        ],
                        correct: 1,
                        explanation: "Ctrl + S este comanda rapida pentru Save (Salvare). Tine minte: S de la Save! Apasa Ctrl + S des cand lucrezi."
                    },
                    {
                        text: "Unde gasesti butonul Save (Salvare) in Word?",
                        options: [
                            "Nu exista buton Save",
                            "In meniul File (Fisier) sau pictograma discului in bara de sus",
                            "In meniul Help",
                            "In bara de jos"
                        ],
                        correct: 1,
                        explanation: "Poti salva din File > Save sau apasand pictograma mica de disc (discheta) din coltul stanga sus, sau folosind Ctrl + S."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Aplica in situatii reale",
                description: "Rezolva scenarii practice legate de gestionarea documentelor — asa cum cere programa cls. a VII-a",
                xpReward: 150,
                questions: [
                    {
                        text: "Ai scris jumatate dintr-un referat si se intrerupe curentul. Ce se pierde?",
                        options: [
                            "Nimic — Word salveaza automat tot timpul",
                            "Tot ce ai scris dupa ultima salvare manuala (Ctrl+S) sau auto-salvare",
                            "Doar ultima litera tastata",
                            "Nimic — fisierul e pe hard disk"
                        ],
                        correct: 1,
                        explanation: "Word pastreaza in memorie (RAM) modificarile nesalvate. Daca se opreste curentul inainte de salvare, se pierde tot ce ai adaugat de la ultima salvare. De aceea salvezi des cu Ctrl+S sau activezi AutoSave. Conform programei cls. VII (VII-1.1): gestionarea corecta a documentului include salvarea regulata."
                    },
                    {
                        text: "Ai salvat referatul ca 'Referat.docx'. Vrei sa trimiti profesorului o versiune finala fara a suprascrie ciorna. Ce faci?",
                        options: [
                            "Apesi Ctrl+S — documentul se salveaza cu alt nume automat",
                            "Folosesti File > Save As si dai un nume nou (ex: Referat_final.docx)",
                            "Inchizi Word si redeschizi — Word creeaza o copie singur",
                            "Stergi fisierul vechi si rescrii totul"
                        ],
                        correct: 1,
                        explanation: "File > Save As (Salvare ca) iti permite sa salvezi o copie cu alt nume sau in alta locatie, pastrandu-l pe cel original. Util cand vrei versiuni separate: ciorna, versiune finala, versiune profesor."
                    },
                    {
                        text: "Colegul tau ti-a trimis un fisier 'tema.doc'. Tu ai Word 2019. Ce te poti astepta?",
                        options: [
                            "Fisierul nu se poate deschide deloc — extensia e gresita",
                            "Word 2019 poate deschide .doc (format mai vechi), dar la salvare recomanda conversia in .docx",
                            "Fisierul se deschide, dar toate imaginile dispar",
                            "Word 2019 il transforma automat in .pdf"
                        ],
                        correct: 1,
                        explanation: ".doc este formatul vechi (Word 97-2003), .docx este formatul modern. Word 2019 poate citi ambele, dar lucreaza nativ cu .docx. La deschiderea unui .doc apare modul de compatibilitate, iar Word sugereaza conversia la .docx pentru a folosi toate functiile noi."
                    },
                    {
                        text: "Ai lucrat la referat si inchizi Word cu butonul X, fara a apasa Ctrl+S inainte. Ce se intampla?",
                        options: [
                            "Word inchide imediat, fara sa intrebe nimic",
                            "Word afiseaza o fereastra care te intreaba daca vrei sa salvezi modificarile",
                            "Documentul se salveaza automat cu un alt nume",
                            "Word sterge fisierul de pe disc"
                        ],
                        correct: 1,
                        explanation: "Cand inchizi un document cu modificari nesalvate, Word afiseaza o fereastra de dialog cu optiunile: Save (Salvare), Don't Save (Nu salva) si Cancel (Anulare). Daca alegi Don't Save, modificarile se pierd. Aceasta este gestionarea standard a documentului la inchidere — parte din competenta VII-1.1 (gestionare document: creare, salvare)."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('word_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('word_quiz1_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add visual mockup if needed
            if (q.hasVisual && q.visualType === 'cursor') {
                questionContent += `
                    <div class="word-ui-mockup">
                        <div class="word-toolbar">
                            <span class="word-btn">File</span>
                            <span class="word-btn">Home</span>
                            <span class="word-btn">Insert</span>
                        </div>
                        <div class="word-document">
                            Buna ziua!<span style="border-left: 2px solid #000; animation: blink 1s infinite;">|</span>
                        </div>
                    </div>
                    <style>
                        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
                    </style>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu chiar...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-formatare.html'">
                                Quiz-ul 2: Formatarea Textului
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

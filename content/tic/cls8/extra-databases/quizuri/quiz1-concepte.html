<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Concepte Baze de Date | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-card: #1a1a2e;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-orange: #f59e0b;
            --accent-yellow: #fbbf24;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #2d2d44;
        }

body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

.quiz-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent-red), var(--accent-rose)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.xp-display { display: flex; align-items: center; gap: 0.5rem; background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange)); padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; color: #000; }

.level-node.active { border-color: var(--accent-red); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); animation: pulse 2s infinite; }

.level-node.completed { background: linear-gradient(135deg, var(--accent-red), var(--accent-rose)); border-color: var(--accent-red); }

.level-connector.completed { background: var(--accent-red); }

.level-intro h2 { font-size: 2rem; margin-bottom: 1rem; color: var(--accent-red); }

.level-intro .xp-reward { display: inline-block; background: rgba(251, 191, 36, 0.2); color: var(--accent-yellow); padding: 0.5rem 1rem; border-radius: 20px; margin-bottom: 2rem; }

.progress-dot.current { background: var(--accent-red); }

.question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }

.table-display {
            background: white; border-radius: 12px; padding: 1rem;
            margin: 1rem auto; max-width: 500px; overflow-x: auto;
        }

.demo-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #1a1a2e; }

.demo-table th { background: #3b82f6; color: white; padding: 0.6rem; text-align: left; }

.demo-table th.pk { background: #ef4444; }

.demo-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid #e5e7eb; }

.demo-table tr:nth-child(even) { background: #f8fafc; }

.demo-table tr.highlight { background: #fef3c7 !important; }

.option:hover { border-color: var(--accent-red); transform: translateX(5px); }

.explanation { font-size: 0.95rem; color: var(--text-secondary); background: var(--bg-card); padding: 1rem; border-radius: 8px; margin-top: 1rem; text-align: left; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.btn-primary { background: linear-gradient(135deg, var(--accent-red), var(--accent-rose)); color: white; }

.btn-primary:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3); }

.btn-outline:hover { border-color: var(--accent-red); color: var(--accent-red); }

.xp-earned { font-size: 2rem; color: var(--accent-yellow); margin: 1.5rem 0; }

@media (max-width: 600px) {
            .container { padding: 1rem; }
            .quiz-header { flex-direction: column; gap: 1rem; }
            .level-node { width: 50px; height: 50px; font-size: 1.2rem; }
            .question-text { font-size: 1rem; }
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Baze de Date</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Concepte Baze de Date</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce sunt bazele de date?",
                description: "Invata conceptele de baza despre organizarea datelor",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este o baza de date?",
                        options: [
                            "Un document Word cu text",
                            "O colectie organizata de informatii stocata pe calculator",
                            "Un folder cu poze",
                            "O pagina web"
                        ],
                        correct: 1,
                        explanation: "O baza de date e o colectie ORGANIZATA de date, stocata electronic, care permite cautari si actualizari rapide."
                    },
                    {
                        text: "Care dintre urmatoarele NU foloseste o baza de date?",
                        options: [
                            "O poza printata pe hartie",
                            "Facebook (utilizatori, postari)",
                            "Netflix (filme, preferinte)",
                            "Catalogul electronic al scolii"
                        ],
                        correct: 0,
                        explanation: "O poza printata e un obiect fizic, nu date electronice organizate. Toate celelalte folosesc baze de date."
                    },
                    {
                        text: "Ce este un SGBD?",
                        options: [
                            "Un tip de calculator",
                            "Un limbaj de programare",
                            "O retea de internet",
                            "Un sistem de gestiune a bazelor de date (program pentru a lucra cu BD)"
                        ],
                        correct: 3,
                        explanation: "SGBD = Sistem de Gestiune a Bazelor de Date. Exemple: Microsoft Access, MySQL, Oracle."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Tabele si Structura",
                description: "Intelege cum sunt organizate datele in tabele",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este un TABEL intr-o baza de date?",
                        options: [
                            "O imagine cu date",
                            "Un fisier text",
                            "O formula matematica",
                            "O structura cu randuri si coloane care stocheaza un tip de date"
                        ],
                        correct: 3,
                        explanation: "Un tabel organizeaza datele in randuri (inregistrari) si coloane (campuri). Ex: tabel Elevi, tabel Profesori."
                    },
                    {
                        text: "Cum se numeste o COLOANA dintr-un tabel?",
                        showTable: true,
                        options: [
                            "Camp (Field)",
                            "Inregistrare",
                            "Cheie primara",
                            "Index"
                        ],
                        correct: 0,
                        explanation: "Coloana = Camp (Field). Fiecare camp reprezinta o caracteristica: Nume, Varsta, Clasa etc."
                    },
                    {
                        text: "Cum se numeste un RAND complet dintr-un tabel?",
                        showTable: true,
                        options: [
                            "Camp",
                            "Coloana",
                            "Inregistrare (Record)",
                            "Tabel"
                        ],
                        correct: 2,
                        explanation: "Rand = Inregistrare (Record). O inregistrare contine toate datele despre un element (ex: un elev)."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Cheia Primara",
                description: "De ce avem nevoie de identificatori unici",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce este CHEIA PRIMARA (Primary Key)?",
                        options: [
                            "Campul care identifica UNIC fiecare inregistrare",
                            "Prima coloana din tabel",
                            "Parola pentru baza de date",
                            "Primul rand din tabel"
                        ],
                        correct: 0,
                        explanation: "Cheia primara e un camp cu valori UNICE pentru fiecare rand. Doua inregistrari nu pot avea aceeasi cheie primara."
                    },
                    {
                        text: "De ce avem nevoie de cheie primara?",
                        options: [
                            "Pentru a face tabelul mai frumos",
                            "Pentru a identifica unic fiecare inregistrare (pot exista 2 elevi 'Popescu Maria'!)",
                            "Pentru a sterge date",
                            "Pentru a adauga imagini"
                        ],
                        correct: 1,
                        explanation: "Fara cheie primara, cum distingi 2 elevi cu acelasi nume? Cu ID-ul unic, fiecare e identificabil!"
                    },
                    {
                        text: "Care ar fi cea mai buna cheie primara pentru un tabel 'Elevi'?",
                        options: [
                            "Numele elevului",
                            "Varsta elevului",
                            "ID (numar unic automat)",
                            "Clasa elevului"
                        ],
                        correct: 2,
                        explanation: "ID numeric automat e ideal: e unic, nu se schimba, nu depinde de date care pot fi duplicate (nume) sau se pot schimba (clasa)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Tipuri de Date",
                description: "Alege tipul corect pentru fiecare camp",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce tip de date folosesti pentru NUME?",
                        options: [
                            "Numar (Number)",
                            "Data/Ora (Date/Time)",
                            "Da/Nu (Yes/No)",
                            "Text / Short Text"
                        ],
                        correct: 3,
                        explanation: "Numele e TEXT. Tipul Number e pentru numere, Date/Time pentru date calendaristice."
                    },
                    {
                        text: "Ce tip de date folosesti pentru VARSTA?",
                        options: [
                            "Text",
                            "Number (numar intreg)",
                            "Date/Time",
                            "Memo"
                        ],
                        correct: 1,
                        explanation: "Varsta e un numar (14, 15, etc.). Cu Number poti face calcule (media varstelor)."
                    },
                    {
                        text: "Ce tip de date folosesti pentru DATA NASTERII?",
                        options: [
                            "Text",
                            "Number",
                            "Date/Time",
                            "Currency"
                        ],
                        correct: 2,
                        explanation: "Date/Time e special pentru date calendaristice. Permite calcule cu date (ani trecuti, diferente)."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Relatii si Design",
                description: "Cum conectam tabelele intre ele",
                xpReward: 150,
                questions: [
                    {
                        text: "De ce NU punem toate datele intr-un singur tabel imens?",
                        options: [
                            "Pentru ca e mai greu de citit",
                            "Nu exista niciun motiv",
                            "Pentru ca Access nu permite tabele mari",
                            "Pentru a evita DUPLICAREA datelor si inconsistentele"
                        ],
                        correct: 3,
                        explanation: "Intr-un singur tabel, ai repeta aceleasi date (ex: numele profesorului pentru fiecare elev). Tabelele separate + relatii = eficienta!"
                    },
                    {
                        text: "Ce este o CHEIE STRAINA (Foreign Key)?",
                        options: [
                            "O cheie din alta tara",
                            "Un camp care face legatura cu cheia primara din ALT tabel",
                            "O cheie primara duplicata",
                            "Un tip de parola"
                        ],
                        correct: 1,
                        explanation: "Cheia straina conecteaza tabele. Ex: in tabel Note, ID_Elev e cheie straina care refera ID_Elev din tabel Elevi."
                    },
                    {
                        text: "Ai tabelele: Elevi(ID, Nume, ClasaID) si Clase(ID, NumeClasa). Ce relatie exista?",
                        options: [
                            "ClasaID din Elevi refera ID din Clase (multi elevi -> o clasa)",
                            "Nicio relatie",
                            "ID din Elevi refera ID din Clase",
                            "NumeClasa refera Nume"
                        ],
                        correct: 0,
                        explanation: "ClasaID din Elevi = cheie straina. Mai multi elevi pot fi in aceeasi clasa. Asta e relatie 'multi-la-unu'."
                    },
                    {
                        text: "Ce program vom folosi pentru a crea baze de date?",
                        options: [
                            "Microsoft Access",
                            "Microsoft Word",
                            "Microsoft Excel",
                            "Microsoft PowerPoint"
                        ],
                        correct: 0,
                        explanation: "Microsoft Access e SGBD-ul inclus in Microsoft Office, perfect pentru a invata bazele de date."
                    }
                ]
            }
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('db_quiz1_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('db_quiz1_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                conn.classList.toggle('completed', levelScores[index + 1] !== undefined);
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>
            `;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = levelData.questions.map((_, i) =>
                `<div class="progress-dot ${i === currentQuestion ? 'current' : ''}"></div>`
            ).join('');

            let tableHTML = '';
            if (q.showTable) {
                tableHTML = `
                    <div class="table-display">
                        <table class="demo-table">
                            <tr><th class="pk">ID</th><th>Nume</th><th>Varsta</th><th>Clasa</th></tr>
                            <tr><td>1</td><td>Popescu Maria</td><td>14</td><td>8A</td></tr>
                            <tr><td>2</td><td>Ionescu Andrei</td><td>13</td><td>8A</td></tr>
                            <tr><td>3</td><td>Popa Elena</td><td>14</td><td>8B</td></tr>
                        </table>
                    </div>
                `;
            }

            let optionsHTML = q.options.map((opt, i) =>
                `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`
            ).join('');

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    ${tableHTML}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;
            if (currentQuestion >= levelData.questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = percentage >= 100 ? '⭐⭐⭐' : percentage >= 80 ? '⭐⭐' : percentage >= 66 ? '⭐' : '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='quiz2-sql.html'">Quiz-ul 2: SQL</button>` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

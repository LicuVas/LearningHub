<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: SQL si Interogari | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Baze de Date</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: SQL si Interogari</div>
            <div class="xp-display"><span>XP:</span><span id="totalXP">0</span></div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea"></div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Ce este SQL?",
                description: "Invata bazele limbajului de interogare",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce inseamna SQL?",
                        options: [
                            "Super Query Language",
                            "Structured Query Language",
                            "Simple Question Logic",
                            "System Quality Level"
                        ],
                        correct: 1,
                        explanation: "SQL = Structured Query Language (Limbaj Structurat de Interogare). E standardul pentru lucrul cu baze de date."
                    },
                    {
                        text: "La ce folosim SQL?",
                        options: [
                            "Sa desenam grafice",
                            "Sa interogam (punem intrebari) bazele de date",
                            "Sa cream pagini web",
                            "Sa editam poze"
                        ],
                        correct: 1,
                        explanation: "SQL ne permite sa INTREBAM baza de date: 'Arata-mi toti elevii din clasa 8A' sau 'Cate produse costa peste 100 lei?'"
                    },
                    {
                        text: "Care comanda SQL selecteaza date dintr-un tabel?",
                        options: [
                            "GET",
                            "FIND",
                            "SELECT",
                            "SHOW"
                        ],
                        correct: 2,
                        explanation: "SELECT e comanda principala pentru a extrage date. SELECT * FROM Elevi afiseaza tot din tabelul Elevi."
                    }
                ]
            },
            2: {
                title: "Nivel 2: SELECT si FROM",
                description: "Primele tale interogari SQL",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce face aceasta interogare?",
                        sql: "SELECT * FROM Elevi",
                        options: [
                            "Sterge toti elevii",
                            "Selecteaza TOATE coloanele din tabelul Elevi",
                            "Creeaza tabelul Elevi",
                            "Numara elevii"
                        ],
                        correct: 1,
                        explanation: "* (asterisc) inseamna 'toate coloanele'. SELECT * FROM Elevi = Afiseaza tot din tabelul Elevi."
                    },
                    {
                        text: "Vrei DOAR numele si varsta elevilor. Care interogare?",
                        options: [
                            "SELECT * FROM Elevi",
                            "SELECT Nume, Varsta FROM Elevi",
                            "SELECT ALL FROM Elevi",
                            "GET Nume, Varsta FROM Elevi"
                        ],
                        correct: 1,
                        explanation: "Specificam coloanele dorite: SELECT Nume, Varsta FROM Elevi. Fara *, doar coloanele cerute."
                    },
                    {
                        text: "Care e ordinea corecta intr-o interogare SELECT simpla?",
                        options: [
                            "FROM tabel SELECT coloane",
                            "SELECT coloane FROM tabel",
                            "tabel SELECT coloane FROM",
                            "SELECT FROM tabel coloane"
                        ],
                        correct: 1,
                        explanation: "Ordinea standard: SELECT ce_vrei FROM de_unde. SELECT Nume FROM Elevi."
                    }
                ]
            },
            3: {
                title: "Nivel 3: WHERE - Filtrarea",
                description: "Selecteaza doar datele care te intereseaza",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce face clauza WHERE?",
                        sql: "SELECT * FROM Elevi WHERE Clasa = '8A'",
                        options: [
                            "Sorteaza elevii dupa clasa",
                            "Filtreaza - arata DOAR elevii din clasa 8A",
                            "Grupeaza elevii pe clase",
                            "Sterge elevii care nu sunt in 8A"
                        ],
                        correct: 1,
                        explanation: "WHERE filtreaza rezultatele. Doar randurile care indeplinesc conditia (Clasa = '8A') sunt afisate."
                    },
                    {
                        text: "Vrei elevii cu varsta MAI MARE de 13 ani. Care conditie?",
                        options: [
                            "WHERE Varsta = 13",
                            "WHERE Varsta > 13",
                            "WHERE Varsta < 13",
                            "WHERE Varsta >= 13"
                        ],
                        correct: 1,
                        explanation: "> inseamna 'mai mare'. Varsta > 13 = elevi cu 14, 15, 16... ani (nu si cei de 13)."
                    },
                    {
                        text: "Vrei elevii din clasa 8A SAU 8B. Care interogare?",
                        options: [
                            "WHERE Clasa = '8A' AND Clasa = '8B'",
                            "WHERE Clasa = '8A' OR Clasa = '8B'",
                            "WHERE Clasa = '8A', '8B'",
                            "WHERE Clasa = '8A' + '8B'"
                        ],
                        correct: 1,
                        explanation: "OR = SAU. Un elev poate fi in 8A SAU in 8B (nu amandoua simultan). AND ar cere AMBELE conditii (imposibil aici)."
                    }
                ]
            },
            4: {
                title: "Nivel 4: ORDER BY - Sortarea",
                description: "Ordoneaza rezultatele cum vrei tu",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce face ORDER BY?",
                        sql: "SELECT * FROM Elevi ORDER BY Nume",
                        options: [
                            "Grupeaza elevii dupa nume",
                            "Sorteaza elevii alfabetic dupa Nume",
                            "Filtreaza elevii cu anumite nume",
                            "Sterge duplicatele de nume"
                        ],
                        correct: 1,
                        explanation: "ORDER BY ordoneaza rezultatele. Implicit e crescator (A-Z pentru text, mic-mare pentru numere)."
                    },
                    {
                        text: "Vrei elevii sortati de la cel mai mare la cel mai mic dupa varsta. Ce adaugi?",
                        options: [
                            "ORDER BY Varsta ASC",
                            "ORDER BY Varsta DESC",
                            "ORDER BY Varsta REVERSE",
                            "ORDER BY Varsta DOWN"
                        ],
                        correct: 1,
                        explanation: "DESC = descrescator (mare la mic). ASC = ascendent (mic la mare, e implicit)."
                    },
                    {
                        text: "Sorteaza dupa clasa, apoi dupa nume in cadrul fiecarei clase:",
                        options: [
                            "ORDER BY Clasa AND Nume",
                            "ORDER BY Clasa, Nume",
                            "ORDER BY Clasa + Nume",
                            "ORDER BY (Clasa, Nume)"
                        ],
                        correct: 1,
                        explanation: "Pentru sortare multipla, separam cu virgula: ORDER BY Clasa, Nume. Prima e prioritara."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Functii si Agregare",
                description: "Calcule si statistici cu SQL",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce returneaza COUNT(*)?",
                        sql: "SELECT COUNT(*) FROM Elevi",
                        options: [
                            "Suma varstelor tuturor elevilor",
                            "Numarul total de elevi (randuri) din tabel",
                            "Media notelor",
                            "Primul elev"
                        ],
                        correct: 1,
                        explanation: "COUNT(*) numara cate randuri exista. Daca sunt 30 de elevi, returneaza 30."
                    },
                    {
                        text: "Ce face AVG(Varsta)?",
                        options: [
                            "Gaseste varsta maxima",
                            "Calculeaza MEDIA varstelor",
                            "Numara cate varste diferite sunt",
                            "Aduna toate varstele"
                        ],
                        correct: 1,
                        explanation: "AVG = Average (medie). AVG(Varsta) = suma varstelor / numar elevi."
                    },
                    {
                        text: "Care interogare afiseaza cati elevi sunt in FIECARE clasa?",
                        options: [
                            "SELECT COUNT(*) FROM Elevi",
                            "SELECT Clasa, COUNT(*) FROM Elevi GROUP BY Clasa",
                            "SELECT Clasa FROM Elevi ORDER BY COUNT",
                            "SELECT ALL Clasa, COUNT FROM Elevi"
                        ],
                        correct: 1,
                        explanation: "GROUP BY grupeaza randurile dupa o coloana. COUNT(*) numara pentru FIECARE grup (clasa)."
                    },
                    {
                        text: "Interogarea finala! Ce afiseaza acest cod?",
                        sql: "SELECT Clasa, AVG(Varsta) AS MediaVarsta\nFROM Elevi\nWHERE Varsta >= 13\nGROUP BY Clasa\nORDER BY MediaVarsta DESC",
                        options: [
                            "Toti elevii sortati dupa varsta",
                            "Media varstelor pe clase (doar elevi 13+ ani), sortata descrescator",
                            "Elevii cu varsta peste medie",
                            "Clasele fara elevi de 13 ani"
                        ],
                        correct: 1,
                        explanation: "Combina tot: filtreaza (WHERE), grupeaza (GROUP BY), calculeaza media (AVG), si sorteaza (ORDER BY DESC)!"
                    }
                ]
            }
        };

        let currentLevel = 1, currentQuestion = 0, score = 0, totalXP = 0, levelScores = {}, unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('db_quiz2_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay(); updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('db_quiz2_progress', JSON.stringify({ totalXP, unlockedLevels, levelScores }));
        }

        function updateXPDisplay() { document.getElementById('totalXP').textContent = totalXP; }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');
                if (levelScores[level] !== undefined) node.classList.add('completed');
                else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) node.classList.add('active');
                } else node.classList.add('locked');
            });
            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                conn.classList.toggle('completed', levelScores[index + 1] !== undefined);
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level; currentQuestion = 0; score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">Incepe Nivelul</button>
                </div>
            `;
        }

        function startLevel() { showQuestion(); }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = levelData.questions.map((_, i) =>
                `<div class="progress-dot ${i === currentQuestion ? 'current' : ''}"></div>`
            ).join('');

            let sqlBlock = '';
            if (q.sql) {
                sqlBlock = `<div class="sql-block"><pre>${q.sql}</pre></div>`;
            }

            let optionsHTML = q.options.map((opt, i) =>
                `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`
            ).join('');

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    <p class="question-text">${q.text}</p>
                    ${sqlBlock}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) options[q.correct].classList.add('correct');

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `<div class="feedback-icon">🎉</div><div class="feedback-text">Corect!</div><div class="explanation">${q.explanation}</div>`;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `<div class="feedback-icon">😅</div><div class="feedback-text">Nu chiar...</div><div class="explanation">${q.explanation}</div>`;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ? 'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;
            if (currentQuestion >= levelData.questions.length) showLevelComplete();
            else showQuestion();
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = percentage >= 100 ? '⭐⭐⭐' : percentage >= 80 ? '⭐⭐' : percentage >= 66 ? '⭐' : '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);
                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) totalXP += earnedXP;
                    levelScores[currentLevel] = percentage;
                }
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) unlockedLevels.push(currentLevel + 1);
                saveProgress(); updateXPDisplay(); updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">Reincearca</button>
                        ${passed && currentLevel < 5 ? `<button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">Nivelul Urmator</button>` : ''}
                        ${passed && currentLevel === 5 ? `<button class="btn btn-success" onclick="window.location.href='../index.html'">Inapoi la Lectii</button>` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

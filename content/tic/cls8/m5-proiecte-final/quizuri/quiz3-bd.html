<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Baze de Date | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-red);
        }

.sql-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 550px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }

.sql-mockup .keyword { color: #569cd6; }

.sql-mockup .table-name { color: #4ec9b0; }

.sql-mockup .column { color: #9cdcfe; }

.sql-mockup .string { color: #ce9178; }

.sql-mockup .number { color: #b5cea8; }

.sql-mockup .operator { color: #d4d4d4; }

.table-visual {
            margin: 1rem auto;
            max-width: 500px;
            overflow-x: auto;
        }

.table-visual table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

.table-visual th {
            background: var(--accent-red);
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
        }

.table-visual td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

.table-visual tr:last-child td {
            border-bottom: none;
        }

.option:hover {
            border-color: var(--accent-rose);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Baze de Date</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Concepte de Baza",
                description: "Recapitulare fundamentele bazelor de date",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este o baza de date?",
                        options: [
                            "Un program de desenat",
                            "O colectie organizata de date stocate electronic",
                            "Un tip de site web",
                            "Un limbaj de programare"
                        ],
                        correct: 1,
                        explanation: "O baza de date este o colectie organizata de informatii (date) stocate electronic intr-un sistem informatic. Permite stocarea, cautarea si gestionarea eficienta a datelor."
                    },
                    {
                        text: "Ce reprezinta un TABEL intr-o baza de date?",
                        hasVisual: true,
                        visualType: "table",
                        options: [
                            "O imagine decorativa",
                            "O structura cu randuri si coloane care stocheaza date despre o entitate",
                            "O formula matematica",
                            "Un tip de grafic"
                        ],
                        correct: 1,
                        explanation: "Un tabel organizeaza datele in randuri (inregistrari/records) si coloane (campuri/fields). Ex: tabelul 'Elevi' are coloane pentru Nume, Prenume, Clasa si randuri pentru fiecare elev."
                    },
                    {
                        text: "Ce este un CAMP (field) intr-un tabel?",
                        options: [
                            "Un rand din tabel",
                            "O coloana care stocheaza un anumit tip de informatie",
                            "Intregul tabel",
                            "O legatura intre tabele"
                        ],
                        correct: 1,
                        explanation: "Un camp (field) este o coloana din tabel care stocheaza un anumit tip de date. Ex: campul 'Nume' stocheaza numele, campul 'Varsta' stocheaza varsta. Fiecare camp are un tip de date specific."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Chei si Relatii",
                description: "Recapitulare chei primare si relatii intre tabele",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce este o CHEIE PRIMARA (Primary Key)?",
                        options: [
                            "Primul camp din tabel",
                            "Un camp sau combinatie de campuri care identifica UNIC fiecare inregistrare",
                            "Parola bazei de date",
                            "Cel mai important rand"
                        ],
                        correct: 1,
                        explanation: "Cheia primara identifica in mod unic fiecare rand din tabel. Ex: CNP-ul sau un ID auto-generat. NU pot exista doua randuri cu aceeasi valoare pentru cheia primara."
                    },
                    {
                        text: "Ce este o CHEIE EXTERNA (Foreign Key)?",
                        options: [
                            "O cheie importata din alta tara",
                            "Un camp care face referire la cheia primara a altui tabel",
                            "O cheie care nu functioneaza",
                            "Primul camp din tabel"
                        ],
                        correct: 1,
                        explanation: "Cheia externa creeaza o legatura intre tabele. Ex: in tabelul 'Comenzi', campul 'IDClient' este cheie externa care se refera la 'ID' din tabelul 'Clienti', legand comanda de client."
                    },
                    {
                        text: "Ce tip de relatie exista cand un profesor preda la mai multe clase?",
                        options: [
                            "Unu-la-unu (1:1)",
                            "Unu-la-multi (1:N)",
                            "Multi-la-multi (M:N)",
                            "Nu exista relatie"
                        ],
                        correct: 1,
                        explanation: "Este o relatie 1:N (unu-la-multi): UN profesor poate preda la MAI MULTE clase. In schimb, o clasa poate avea mai multi profesori, facand relatia completa M:N pentru materii diferite."
                    }
                ]
            },
            3: {
                title: "Nivel 3: SQL SELECT de Baza",
                description: "Recapitulare interogari simple de selectie",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce face comanda SQL: SELECT * FROM Elevi;",
                        options: [
                            "Sterge toti elevii",
                            "Selecteaza TOATE coloanele si TOATE randurile din tabelul Elevi",
                            "Adauga un elev nou",
                            "Creeaza tabelul Elevi"
                        ],
                        correct: 1,
                        explanation: "SELECT * selecteaza toate coloanele (*=wildcard). FROM Elevi specifica tabelul. Rezultatul: toate datele din tabelul Elevi - toate coloanele pentru toti elevii."
                    },
                    {
                        text: "Care comanda selecteaza DOAR numele si nota elevilor?",
                        options: [
                            "SELECT * FROM Elevi;",
                            "SELECT Nume, Nota FROM Elevi;",
                            "GET Nume, Nota FROM Elevi;",
                            "SHOW Nume AND Nota;"
                        ],
                        correct: 1,
                        explanation: "SELECT Nume, Nota specifica exact care coloane dorim (nu toate). Rezultatul va avea doar 2 coloane: Nume si Nota pentru fiecare elev din tabel."
                    },
                    {
                        text: "Ce clauza folosim pentru a FILTRA rezultatele in SQL?",
                        options: [
                            "FILTER",
                            "WHERE",
                            "IF",
                            "HAVING"
                        ],
                        correct: 1,
                        explanation: "WHERE filtreaza randurile dupa o conditie. Ex: SELECT * FROM Elevi WHERE Nota > 8 returneaza doar elevii cu nota mai mare ca 8."
                    }
                ]
            },
            4: {
                title: "Nivel 4: WHERE si Conditii",
                description: "Recapitulare filtrare avansata cu WHERE",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce returneaza: SELECT Nume FROM Elevi WHERE Clasa = '8A' AND Nota >= 9;",
                        options: [
                            "Toti elevii din clasa 8A",
                            "Numele elevilor din 8A care au nota >= 9",
                            "Toti elevii cu nota >= 9",
                            "Eroare de sintaxa"
                        ],
                        correct: 1,
                        explanation: "AND combina doua conditii - AMBELE trebuie indeplinite. Rezultat: doar numele elevilor care sunt SI in clasa 8A SI au nota >= 9."
                    },
                    {
                        text: "Care este diferenta intre AND si OR in SQL?",
                        options: [
                            "Nu exista diferenta",
                            "AND - ambele conditii adevarate, OR - cel putin una adevarata",
                            "AND e pentru numere, OR pentru text",
                            "OR functioneaza doar cu SELECT *"
                        ],
                        correct: 1,
                        explanation: "AND: returneaza randul doar daca TOATE conditiile sunt adevarate. OR: returneaza randul daca CEL PUTIN UNA dintre conditii este adevarata."
                    },
                    {
                        text: "Ce face operatorul LIKE in: SELECT * FROM Elevi WHERE Nume LIKE 'Pop%';",
                        options: [
                            "Selecteaza elevul exact cu numele 'Pop%'",
                            "Selecteaza elevii al caror nume INCEPE cu 'Pop'",
                            "Selecteaza toti elevii",
                            "Genereaza o eroare"
                        ],
                        correct: 1,
                        explanation: "LIKE permite cautare cu pattern. % inseamna 'orice caractere'. 'Pop%' = incepe cu Pop (Popescu, Popa, Pop). '%pop%' = contine 'pop' oriunde."
                    }
                ]
            },
            5: {
                title: "Nivel 5: ORDER BY si Functii",
                description: "Recapitulare sortare si functii agregate",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce face ORDER BY in: SELECT * FROM Elevi ORDER BY Nota DESC;",
                        options: [
                            "Ordoneaza elevii dupa nota CRESCATOR",
                            "Ordoneaza elevii dupa nota DESCRESCATOR (de la mare la mic)",
                            "Grupeaza elevii dupa nota",
                            "Sterge elevii cu nota mica"
                        ],
                        correct: 1,
                        explanation: "ORDER BY sorteaza rezultatele. DESC = descending (descrescator, de la mare la mic). ASC (sau fara specificare) = ascending (crescator, de la mic la mare)."
                    },
                    {
                        text: "Ce rezultat da: SELECT COUNT(*) FROM Elevi WHERE Clasa = '8B';",
                        options: [
                            "Lista tuturor elevilor din 8B",
                            "NUMARUL de elevi din clasa 8B",
                            "Media notelor din 8B",
                            "Primul elev din 8B"
                        ],
                        correct: 1,
                        explanation: "COUNT(*) este o functie agregata care numara cate randuri indeplinesc conditia. Rezultatul este un singur numar: cati elevi sunt in clasa 8B."
                    },
                    {
                        text: "Care functie SQL calculeaza MEDIA valorilor dintr-o coloana?",
                        options: [
                            "SUM()",
                            "COUNT()",
                            "AVG()",
                            "MAX()"
                        ],
                        correct: 2,
                        explanation: "AVG() (average = medie) calculeaza media aritmetica. Ex: SELECT AVG(Nota) FROM Elevi returneaza media notelor. SUM = suma, COUNT = numar, MAX = maxim."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls8_quiz_bd_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('cls8_quiz_bd_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add table visual if needed
            if (q.hasVisual && q.visualType === 'table') {
                questionContent += `
                    <div class="table-visual">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nume</th>
                                    <th>Clasa</th>
                                    <th>Nota</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>1</td><td>Popescu Ana</td><td>8A</td><td>9</td></tr>
                                <tr><td>2</td><td>Ionescu Mihai</td><td>8B</td><td>8</td></tr>
                                <tr><td>3</td><td>Popa Maria</td><td>8A</td><td>10</td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">💡</div>
                    <div class="feedback-text">Nu este raspunsul corect. Iata explicatia:</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-web.html'">
                                Quiz-ul 4: Web (HTML/CSS)
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

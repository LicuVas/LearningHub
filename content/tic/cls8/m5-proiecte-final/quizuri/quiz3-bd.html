<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare Calcul Tabelar | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-red);
        }

.cell-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 550px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }

.cell-mockup .formula { color: #569cd6; }
.cell-mockup .cell-ref { color: #4ec9b0; }
.cell-mockup .func-name { color: #fbbf24; }
.cell-mockup .value { color: #b5cea8; }

.table-visual {
            margin: 1rem auto;
            max-width: 500px;
            overflow-x: auto;
        }

.table-visual table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

.table-visual th {
            background: var(--accent-red);
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
        }

.table-visual td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

.table-visual tr:last-child td {
            border-bottom: none;
        }

.option:hover {
            border-color: var(--accent-rose);
            transform: translateX(5px);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }
    </style>

</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 5</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare Calcul Tabelar</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        // Quiz 3 — Recapitulare Calcul Tabelar
        // Continut conform OMEN 3393/2017 cls. VIII, domeniu: Calcul tabelar
        // Distribuție răspunsuri corecte (index 0): 1,2,0,3,1,2,0,3,1,2,0,3,1,2,0
        // Verificare: 0→5, 1→4, 2→4, 3→3 — echilibrat, niciun index >33%
        const levels = {
            1: {
                title: "Nivel 1: Interfata si Registru",
                description: "Recapitulare elementele de baza ale foii de calcul",
                xpReward: 50,
                questions: [
                    {
                        // correct: 1 (B)
                        text: "Cum se numeste fisierul principal de lucru intr-un program de calcul tabelar?",
                        options: [
                            "Document",
                            "Registru (workbook)",
                            "Prezentare",
                            "Baza de date"
                        ],
                        correct: 1,
                        explanation: "In calcul tabelar, fisierul se numeste REGISTRU (workbook). Un registru poate contine una sau mai multe foi de calcul (sheets). Exemplu: in Excel, un fisier .xlsx este un registru."
                    },
                    {
                        // correct: 2 (C)
                        text: "Ce reprezinta adresa B3 intr-o foaie de calcul?",
                        options: [
                            "Al treilea registru din foaia B",
                            "Coloana 3, randul B",
                            "Coloana B, randul 3",
                            "A treia foaie din registru"
                        ],
                        correct: 2,
                        explanation: "In calcul tabelar, adresa unei celule este formata din LITERA coloanei urmata de NUMARUL randului. Deci B3 = coloana B, randul 3. Aceasta adresa se numeste referinta de celula."
                    },
                    {
                        // correct: 0 (A)
                        text: "Ce operatie efectuezi pentru a adauga o foaie noua intr-un registru de calcul?",
                        options: [
                            "Click pe butonul '+' (adauga foaie) din bara foilor",
                            "Deschizi un fisier nou",
                            "Insertezi un tabel",
                            "Apesi tasta F5"
                        ],
                        correct: 0,
                        explanation: "O foaie noua se adauga folosind butonul '+' (Insert Sheet) din bara de jos a registrului, sau prin meniul Insert > Sheet. Un registru poate contine mai multe foi organizate cu tab-uri."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Tipuri de Date si Formatare",
                description: "Recapitulare tipuri de date si operatii de editare",
                xpReward: 75,
                questions: [
                    {
                        // correct: 3 (D)
                        text: "Care dintre urmatoarele este un tip de data NUMERIC intr-o foaie de calcul?",
                        options: [
                            "\"Popescu Ana\"",
                            "\"Clasa 8A\"",
                            "\"Adevarat\"",
                            "1547.50"
                        ],
                        correct: 3,
                        explanation: "Tipul NUMERIC include numere intregi si zecimale (ex: 1547.50). Textul este tip sir de caractere, iar datele calendaristice si valorile logice (Adevarat/Fals) sunt tipuri separate. Programul de calcul aliniaza numerele la dreapta si textul la stanga."
                    },
                    {
                        // correct: 1 (B)
                        text: "Ce se intampla daca introduci '15/06/2026' intr-o celula a unei foi de calcul?",
                        options: [
                            "Programul afiseaza o eroare",
                            "Programul recunoaste automat tipul DATA CALENDARISTICA",
                            "Este stocat ca text obisnuit",
                            "Este convertit intr-un numar zecimal"
                        ],
                        correct: 1,
                        explanation: "Programele de calcul tabelar recunosc automat formatele de data calendaristica (ex: 15/06/2026, 15-iun-2026). Data este stocata intern ca numar, dar afisata in format lizibil. Aceasta permite calcule cu date (ex: diferenta in zile)."
                    },
                    {
                        // correct: 2 (C)
                        text: "Ce efect are operatia de SORTARE pe un tabel de date intr-o foaie de calcul?",
                        options: [
                            "Sterge randurile duplicate",
                            "Filtreaza randurile dupa o conditie",
                            "Reordoneaza randurile dupa valorile dintr-o coloana aleasa",
                            "Copiaza tabelul intr-o foaie noua"
                        ],
                        correct: 2,
                        explanation: "SORTAREA reordoneaza randurile tabelului dupa valorile dintr-o coloana (criteriu de sortare), in ordine crescatoare sau descrescatoare. Ex: sortarea unui catalog de elevi dupa coloana 'Nota' pune cel mai bun elev primul (descrescator)."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Formule de Baza",
                description: "Recapitulare formule cu operatii aritmetice",
                xpReward: 100,
                questions: [
                    {
                        // correct: 0 (A)
                        text: "Cu ce simbol incep TOATE formulele intr-o foaie de calcul?",
                        options: [
                            "= (semnul egal)",
                            "+ (plusul)",
                            "# (diez)",
                            "@ (at)"
                        ],
                        correct: 0,
                        explanation: "Orice formula intr-o foaie de calcul TREBUIE sa inceapa cu = (semnul egal). Acesta ii semnaleaza programului ca trebuie sa calculeze o valoare, nu sa afiseze text. Ex: =A1+B1 aduna valorile din celulele A1 si B1."
                    },
                    {
                        // correct: 3 (D)
                        text: "Ce calculeaza formula =C2*D2 daca C2=5 si D2=8?",
                        options: [
                            "13 (suma)",
                            "3 (diferenta)",
                            "0.625 (impartirea)",
                            "40 (produsul)"
                        ],
                        correct: 3,
                        explanation: "Operatorul * reprezinta INMULTIREA in calcul tabelar. Deci =C2*D2 = 5 * 8 = 40. Operatorii de baza sunt: + (adunare), - (scadere), * (inmultire), / (impartire)."
                    },
                    {
                        // correct: 1 (B)
                        text: "Care este avantajul principal al folosirii referintelor de celula (ex: =A1+B1) in loc de numere directe (ex: =5+8)?",
                        options: [
                            "Formula se calculeaza mai repede",
                            "Formula se actualizeaza automat cand valorile din celule se schimba",
                            "Permite afisarea mai multor zecimale",
                            "Previne erorile de sintaxa"
                        ],
                        correct: 1,
                        explanation: "Referintele de celula (A1, B2 etc.) fac formulele DINAMICE: daca schimbi valoarea din celula A1, toate formulele care o folosesc se recalculeaza automat. Aceasta este puterea calculului tabelar — modifici o data, rezultatele se actualizeaza instantaneu."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Functii (SUMA, MAX, MIN, MEDIE, DACA)",
                description: "Recapitulare functii predefinite esentiale",
                xpReward: 125,
                questions: [
                    {
                        // correct: 2 (C)
                        text: "Ce calculeaza functia =SUMA(B2:B6) ?",
                        hasVisual: true,
                        visualType: "table",
                        options: [
                            "Media valorilor din celulele B2 pana la B6",
                            "Cea mai mare valoare din B2:B6",
                            "Suma tuturor valorilor din celulele B2 pana la B6",
                            "Numarul de celule din intervalul B2:B6"
                        ],
                        correct: 2,
                        explanation: "Functia SUMA aduna toate valorile dintr-un interval de celule. =SUMA(B2:B6) calculeaza B2+B3+B4+B5+B6. Intervalul B2:B6 se citeste 'de la B2 pana la B6'. Este una dintre cele mai folosite functii in calcul tabelar."
                    },
                    {
                        // correct: 0 (A)
                        text: "Ce functie folosesti pentru a gasi nota MAXIMA dintr-un sir de note ale clasei?",
                        options: [
                            "=MAX(A2:A30)",
                            "=SUMA(A2:A30)",
                            "=MEDIE(A2:A30)",
                            "=MIN(A2:A30)"
                        ],
                        correct: 0,
                        explanation: "Functia MAX returneaza cea mai MARE valoare dintr-un interval. =MAX(A2:A30) gaseste nota maxima din intervalul A2 la A30. Similar, MIN returneaza cea mai mica valoare, MEDIE calculeaza media aritmetica."
                    },
                    {
                        // correct: 3 (D)
                        text: "Ce face functia DACA (IF)? Ex: =DACA(C2>=5; \"Promovat\"; \"Corigent\")",
                        options: [
                            "Calculeaza media valorilor dintr-un interval",
                            "Sorteaza datele in ordine crescatoare",
                            "Numara celulele care indeplinesc o conditie",
                            "Verifica o conditie si returneaza valori diferite pentru Adevarat sau Fals"
                        ],
                        correct: 3,
                        explanation: "DACA(IF) este o functie de DECIZIE: verifica o conditie logica si returneaza o valoare daca e adevarata, alta daca e falsa. Ex: =DACA(C2>=5; \"Promovat\"; \"Corigent\") — daca nota din C2 e cel putin 5, afiseaza 'Promovat', altfel 'Corigent'."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Grafice si Proiecte",
                description: "Recapitulare grafice si aplicatii practice",
                xpReward: 150,
                questions: [
                    {
                        // correct: 1 (B)
                        text: "Ce tip de grafic este cel mai potrivit pentru a compara valorile din mai multe categorii (ex: notele medii ale mai multor clase)?",
                        options: [
                            "Grafic liniar (Line Chart)",
                            "Grafic cu bare / coloana (Bar/Column Chart)",
                            "Grafic circular (Pie Chart)",
                            "Grafic Scatter (XY)"
                        ],
                        correct: 1,
                        explanation: "Graficul cu bare sau coloane este ideal pentru COMPARAREA categoriilor distincte (ex: 8A vs 8B vs 8C). Graficul liniar arata evolutia in timp, graficul circular arata proportii dintr-un intreg, Scatter arata corelatii intre variabile."
                    },
                    {
                        // correct: 2 (C)
                        text: "Ce sunt 'seriile de date' (data series) intr-un grafic?",
                        options: [
                            "Culorile folosite in grafic",
                            "Titlul si legenda graficului",
                            "Multimile de valori reprezentate grafic, de obicei din coloanele tabelului",
                            "Dimensiunea in pixeli a graficului"
                        ],
                        correct: 2,
                        explanation: "Seriile de date sunt multimile de valori reprezentate vizual in grafic, preluate de obicei din coloanele sau randurile unui tabel. Ex: daca graficul arata notele la 3 materii, fiecare materie este o serie de date distincta, reprezentata cu o culoare separata."
                    },
                    {
                        // correct: 0 (A)
                        text: "La elaborarea unui PRODUS INFORMATIC cu foaie de calcul (ex: buget de clasa), care este primul pas corect?",
                        options: [
                            "Definirea structurii tabelului: ce coloane sunt necesare si ce tip de date va contine fiecare",
                            "Inserarea imediata a unui grafic",
                            "Formatarea celulelor cu culori si fonturi",
                            "Salvarea fisierului cu un alt nume"
                        ],
                        correct: 0,
                        explanation: "Elaborarea unui produs informatic incepe MEREU cu planificarea structurii: ce date avem nevoie, cum le organizam in coloane si randuri, ce calcule sunt necesare. Abia dupa structurarea datelor se introduc valorile, formulele, functiile si in final graficele si formatarea."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('cls8_quiz_calcultabelar_progress');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    totalXP = data.totalXP || 0;
                    unlockedLevels = data.unlockedLevels || [1];
                    levelScores = data.levelScores || {};
                    updateXPDisplay();
                    updateLevelMap();
                } catch (e) {
                    console.error('Progress load error:', e);
                }
            }
        }

        function saveProgress() {
            localStorage.setItem('cls8_quiz_calcultabelar_progress', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
            function escHtml(s) {
                return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add table visual for level 4, question 1 (SUMA demonstration)
            if (q.hasVisual && q.visualType === 'table') {
                questionContent += `
                    <div class="table-visual">
                        <table>
                            <thead>
                                <tr>
                                    <th>Elev</th>
                                    <th>Nota (B)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td>Popescu Ana</td><td>9</td></tr>
                                <tr><td>Ionescu Mihai</td><td>8</td></tr>
                                <tr><td>Popa Maria</td><td>10</td></tr>
                                <tr><td>Stan Ion</td><td>7</td></tr>
                                <tr><td>Dumitrescu Ela</td><td>9</td></tr>
                                <tr><td style="font-weight:600; color: var(--accent-yellow);">=SUMA(B2:B6)</td><td style="font-weight:600; color: var(--accent-yellow);">?</td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">💡</div>
                    <div class="feedback-text">Nu este raspunsul corect. Iata explicatia:</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz4-web.html'">
                                Quiz-ul 4: Web (HTML/CSS)
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

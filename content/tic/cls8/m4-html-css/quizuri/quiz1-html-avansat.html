<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: HTML - Liste, Imagini, Tabele, Legaturi | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-red);
        }

.progress-dot.wrong {
            background: var(--accent-rose);
        }

.question-image {
            text-align: center;
            margin-bottom: 1.5rem;
        }

.question-image img {
            max-width: 100%;
            border-radius: 12px;
        }

/* Code mockup */
        .code-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }

.code-mockup .tag { color: #f43f5e; }

.code-mockup .attr { color: #fbbf24; }

.code-mockup .value { color: #10b981; }

.code-mockup .text { color: #94a3b8; }

.option:hover {
            border-color: var(--accent-rose);
            transform: translateX(5px);
        }

.option.selected {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

.option.wrong {
            border-color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.2);
        }

.feedback-box.wrong {
            background: rgba(244, 63, 94, 0.2);
            border: 2px solid var(--accent-rose);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }

/* Responsive */
        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .quiz-header { flex-direction: column; gap: 1rem; }
            .level-node { width: 50px; height: 50px; font-size: 1.2rem; }
            .question-text { font-size: 1.1rem; }
            .code-mockup { font-size: 0.8rem; padding: 0.75rem; }
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 4</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: HTML - Elemente de continut</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <!-- Level Map -->
        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-area" id="quizArea">
            <!-- Level intro will be shown here -->
        </div>
    </div>
<script>
        // Quiz data for each level
        const levels = {
            1: {
                title: "Nivel 1: Elementele div si span",
                description: "Invata despre containerele generice din HTML",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce este elementul &lt;div&gt; in HTML?",
                        options: [
                            "Un element pentru a afisa imagini",
                            "Un container generic de tip bloc pentru gruparea continutului",
                            "Un element pentru crearea linkurilor",
                            "Un element pentru tabele"
                        ],
                        correct: 1,
                        explanation: "Elementul <div> (division) este un container generic de tip bloc folosit pentru a grupa alte elemente HTML. Este foarte util pentru structurarea paginii si aplicarea stilurilor CSS."
                    },
                    {
                        text: "Care este diferenta principala dintre &lt;div&gt; si &lt;span&gt;?",
                        options: [
                            "Nu exista nicio diferenta",
                            "&lt;span&gt; este mai mare decat &lt;div&gt;",
                            "&lt;div&gt; este bloc (ocupa tot randul), &lt;span&gt; este inline (sta pe acelasi rand)",
                            "&lt;div&gt; se foloseste doar pentru text"
                        ],
                        correct: 2,
                        explanation: "<div> este un element de tip bloc - ocupa intreaga latime disponibila si incepe pe un rand nou. <span> este inline - sta pe acelasi rand cu alte elemente, ocupand doar spatiul necesar."
                    },
                    {
                        text: "Cand folosim elementul &lt;span&gt;?",
                        options: [
                            "Pentru a stiliza o portiune mica de text in interiorul unui paragraf",
                            "Pentru a crea sectiuni mari ale paginii",
                            "Pentru a crea tabele",
                            "Pentru a adauga imagini"
                        ],
                        correct: 0,
                        explanation: "<span> este perfect pentru a aplica stiluri CSS pe o portiune mica de text, fara a intrerupe fluxul textului. De exemplu, pentru a colora un cuvant diferit intr-un paragraf."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Liste si legaturi",
                description: "Invata sa creezi liste si linkuri in HTML",
                xpReward: 75,
                questions: [
                    {
                        text: "Care element HTML se foloseste pentru o lista NEORDONATA (cu puncte)?",
                        options: [
                            "&lt;ol&gt;",
                            "&lt;list&gt;",
                            "&lt;li&gt;",
                            "&lt;ul&gt;"
                        ],
                        correct: 3,
                        explanation: "Elementul <ul> (unordered list) creeaza o lista neordonata, afisata cu marcatori (puncte). Fiecare element al listei se pune in <li>. Exemplu: <ul><li>Mere</li><li>Pere</li></ul>"
                    },
                    {
                        text: "Care atribut al elementului &lt;a&gt; specifica adresa linkului?",
                        options: [
                            "href",
                            "src",
                            "link",
                            "url"
                        ],
                        correct: 0,
                        explanation: "Atributul href (hypertext reference) specifica destinatia linkului. Exemplu: <a href=\"https://www.google.com\">Google</a>. Fara href, elementul <a> nu functioneaza ca legatura."
                    },
                    {
                        text: "Ce diferenta este intre &lt;ul&gt; si &lt;ol&gt;?",
                        options: [
                            "Nu exista nicio diferenta",
                            "&lt;ol&gt; are puncte, &lt;ul&gt; are numere",
                            "&lt;ul&gt; este pentru linkuri, &lt;ol&gt; pentru imagini",
                            "&lt;ul&gt; are puncte (neordonata), &lt;ol&gt; are numere (ordonata)"
                        ],
                        correct: 3,
                        explanation: "<ul> (unordered list) afiseaza elementele cu marcatori (puncte, patrate). <ol> (ordered list) afiseaza elementele numerotate (1, 2, 3...). In ambele cazuri, fiecare element al listei se marcheaza cu <li>."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Imagini si tabele",
                description: "Adauga imagini si organizeaza date in tabele",
                xpReward: 100,
                questions: [
                    {
                        text: "Care atribut al elementului &lt;img&gt; specifica sursa imaginii?",
                        options: [
                            "href",
                            "link",
                            "src",
                            "path"
                        ],
                        correct: 2,
                        explanation: "Atributul src (source) specifica locatia fisierului imagine. Exemplu: <img src=\"foto.jpg\" alt=\"Descriere\">. Atributul alt este obligatoriu pentru accesibilitate si descrie imaginea in text."
                    },
                    {
                        text: "Care este structura corecta a unui tabel HTML cu un rand si doua celule?",
                        hasCode: true,
                        codeContent: "A: &lt;table&gt;&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\nB: &lt;table&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/table&gt;\nC: &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;/tr&gt;\nD: &lt;table&gt;&lt;row&gt;&lt;cell&gt;1&lt;/cell&gt;&lt;/row&gt;&lt;/table&gt;",
                        options: [
                            "Varianta A",
                            "Varianta B",
                            "Varianta C",
                            "Varianta D"
                        ],
                        correct: 0,
                        explanation: "Structura corecta a unui tabel: <table> contine randuri <tr> (table row), iar fiecare rand contine celule <td> (table data). Daca vrem antet, folosim <th> in loc de <td> pentru celulele de titlu."
                    },
                    {
                        text: "Ce reprezinta elementul &lt;th&gt; intr-un tabel HTML?",
                        options: [
                            "O celula obisnuita de date",
                            "Un rand de tabel",
                            "Chenarul tabelului",
                            "O celula de antet (titlu) - text bold si centrat implicit"
                        ],
                        correct: 3,
                        explanation: "<th> (table header) este o celula speciala de antet: textul este afisat bold si centrat implicit. Se foloseste pentru a marca titlurile coloanelor sau randurilor din tabel, ajutand la intelegerea datelor."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Formatarea textului",
                description: "Aplica stiluri pe text si paragrafe",
                xpReward: 125,
                questions: [
                    {
                        text: "Care element HTML face textul sa apara INGROSАТ (bold)?",
                        options: [
                            "&lt;b&gt;",
                            "&lt;i&gt;",
                            "&lt;u&gt;",
                            "&lt;em&gt;"
                        ],
                        correct: 0,
                        explanation: "Elementul <b> (bold) face textul ingrosat. Exemplu: <b>Acesta este bold</b>. Exista si <strong> care face acelasi lucru vizual, dar indica si importanta semantica a textului."
                    },
                    {
                        text: "Cum adaugam o linie orizontala (separator) intr-o pagina HTML?",
                        options: [
                            "&lt;line&gt;",
                            "&lt;br&gt;",
                            "&lt;separator&gt;",
                            "&lt;hr&gt;"
                        ],
                        correct: 3,
                        explanation: "<hr> (horizontal rule) adauga o linie orizontala ca separator vizual intre sectiuni. Este un element fara eticheta de inchidere. <br> este diferit - face un rand nou (line break) in interiorul textului."
                    },
                    {
                        text: "Ce face atributul 'align' in elementul &lt;p align=\"center\"&gt;?",
                        options: [
                            "Coloreaza paragraful",
                            "Mareste fontul paragrafului",
                            "Aliniaza textul paragrafului la centru",
                            "Adauga chenar la paragraf"
                        ],
                        correct: 2,
                        explanation: "Atributul align specifica alinierea textului: center (centrat), left (stanga - implicit), right (dreapta), justify (aliniat pe ambele margini). Exemplu: <p align=\"center\">Text centrat</p>"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Formatare si fundal",
                description: "Stilizeaza pagina cu culori si fonturi",
                xpReward: 150,
                questions: [
                    {
                        text: "Cum se specifica culoarea de fundal a paginii in tag-ul &lt;body&gt;?",
                        options: [
                            "&lt;body color=\"blue\"&gt;",
                            "&lt;body background-color=\"blue\"&gt;",
                            "&lt;body fill=\"blue\"&gt;",
                            "&lt;body bgcolor=\"blue\"&gt;"
                        ],
                        correct: 3,
                        explanation: "Atributul bgcolor al elementului <body> seteaza culoarea de fundal a paginii. Exemplu: <body bgcolor=\"yellow\"> sau <body bgcolor=\"#ffff00\">. Culorile se pot specifica ca nume (red, blue) sau ca valori hexazecimale (#rrggbb)."
                    },
                    {
                        text: "Care element HTML se foloseste pentru a afisa text cu font specific, marime si culoare in HTML clasic?",
                        options: [
                            "&lt;text&gt;",
                            "&lt;style&gt;",
                            "&lt;font&gt;",
                            "&lt;format&gt;"
                        ],
                        correct: 2,
                        explanation: "Elementul <font> permite setarea fontului, marimii si culorii textului. Exemplu: <font face=\"Arial\" size=\"4\" color=\"red\">Text</font>. Atributul face specifica fontul, size marimea (1-7), color culoarea."
                    },
                    {
                        text: "Care varianta HTML adauga corect o imagine cu text alternativ si un link pe aceeasi pagina?",
                        hasCode: true,
                        codeContent: "A: &lt;img src=\"foto.jpg\" alt=\"Peisaj\"&gt; si &lt;a href=\"pagina.html\"&gt;Acasa&lt;/a&gt;\nB: &lt;image src=\"foto.jpg\"&gt; si &lt;link&gt;Acasa&lt;/link&gt;\nC: &lt;img href=\"foto.jpg\"&gt; si &lt;a src=\"pagina.html\"&gt;Acasa&lt;/a&gt;\nD: &lt;picture alt=\"foto.jpg\"&gt; si &lt;url&gt;pagina.html&lt;/url&gt;",
                        options: [
                            "Varianta A",
                            "Varianta B",
                            "Varianta C",
                            "Varianta D"
                        ],
                        correct: 0,
                        explanation: "Varianta A este corecta: <img src=\"foto.jpg\" alt=\"Peisaj\"> foloseste atributul src pentru sursa imaginii si alt pentru descrierea alternativa. <a href=\"pagina.html\"> foloseste atributul href pentru adresa linkului. Acestea sunt elementele si atributele standard HTML."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        // Load saved progress
        function loadProgress() {
            const saved = localStorage.getItem('web_quiz1_progress_cls8');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('web_quiz1_progress_cls8', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            // Add code mockup if needed
            if (q.hasCode) {
                questionContent += `
                    <div class="code-mockup">
                        <pre>${q.codeContent}</pre>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Show correct/wrong
            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            // Update progress dots
            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            // Show feedback
            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu e chiar asa...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                // Unlock next level
                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz2-formulare.html'">
                                Quiz-ul 2: Formulare HTML
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize
        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

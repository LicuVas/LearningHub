<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Text si Imagini HTML | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-red);
        }

.progress-dot.wrong {
            background: var(--accent-rose);
        }

.code-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }

.code-mockup .tag { color: #f43f5e; }

.code-mockup .attr { color: #fbbf24; }

.code-mockup .value { color: #10b981; }

.form-mockup {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem auto;
            max-width: 400px;
            border: 2px solid var(--border);
        }

.form-mockup label {
            display: block;
            color: #333;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

.form-mockup input, .form-mockup select, .form-mockup textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

.form-mockup button {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

.option:hover {
            border-color: var(--accent-rose);
            transform: translateX(5px);
        }

.option.wrong {
            border-color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.2);
        }

.feedback-box.wrong {
            background: rgba(244, 63, 94, 0.2);
            border: 2px solid var(--accent-rose);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 4</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Text si Imagini HTML</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Titluri HTML",
                description: "Testeaza cunostintele despre elementele de titlu h1-h6",
                xpReward: 50,
                questions: [
                    {
                        text: "Care element HTML creaza cel mai important titlu al paginii?",
                        options: [
                            "&lt;h6&gt;",
                            "&lt;title&gt;",
                            "&lt;h1&gt;",
                            "&lt;header&gt;"
                        ],
                        correct: 2,
                        explanation: "Elementul &lt;h1&gt; este cel mai important titlu (heading 1). Titlurile merg de la h1 (cel mai mare) la h6 (cel mai mic), creand o ierarhie de subtitluri pe pagina."
                    },
                    {
                        text: "Cate nivele de titluri (headings) exista in HTML?",
                        options: [
                            "3 nivele (h1, h2, h3)",
                            "6 nivele (h1 pana la h6)",
                            "9 nivele (h1 pana la h9)",
                            "Doar unul (h1)"
                        ],
                        correct: 1,
                        explanation: "HTML ofera 6 nivele de titluri: h1 (cel mai mare si important) pana la h6 (cel mai mic). h1 se foloseste o singura data pe pagina pentru titlul principal, h2-h6 pentru subtitluri."
                    },
                    {
                        text: "Care este ordinea corecta pentru titluri pe o pagina web?",
                        options: [
                            "h3, h1, h2 — oricare ordine e valida",
                            "h1 pentru titlul principal, h2 pentru sectiuni, h3 pentru subsectiuni",
                            "Intotdeauna h6 pentru titlul principal deoarece e cel mai vizibil",
                            "Titlurile nu au importanta in HTML"
                        ],
                        correct: 1,
                        explanation: "Titlurile trebuie folosite ierarhic: h1 o singura data (titlul paginii), h2 pentru sectiunile principale, h3 pentru subsectiunile lor etc. Ordinea conteaza pentru accesibilitate si SEO."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Paragrafe si formatare text",
                description: "Testeaza cunostintele despre p, strong, em, br, hr",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce element HTML folosim pentru a crea un paragraf?",
                        options: [
                            "&lt;para&gt;",
                            "&lt;p&gt;",
                            "&lt;text&gt;",
                            "&lt;par&gt;"
                        ],
                        correct: 1,
                        explanation: "Elementul &lt;p&gt; creaza un paragraf. Browserul adauga automat spatiu deasupra si dedesubtul fiecarui paragraf pentru a le separa vizual."
                    },
                    {
                        text: "Ce element face textul ingrosat (bold) cu semnificatie importanta?",
                        options: [
                            "&lt;bold&gt;",
                            "&lt;b&gt; — intotdeauna",
                            "&lt;strong&gt;",
                            "&lt;important&gt;"
                        ],
                        correct: 2,
                        explanation: "&lt;strong&gt; marcheaza text important si il afiseaza ingrosat. Spre deosebire de &lt;b&gt; (pur vizual), &lt;strong&gt; transmite si semnificatie semantica — este recomandat pentru continut cu adevarat important."
                    },
                    {
                        text: "Ce element HTML insereaza o linie de separare orizontala pe pagina?",
                        options: [
                            "&lt;line&gt;",
                            "&lt;br&gt;",
                            "&lt;hr&gt;",
                            "&lt;separator&gt;"
                        ],
                        correct: 2,
                        explanation: "&lt;hr&gt; (horizontal rule) insereaza o linie orizontala de separare. &lt;br&gt; este diferit: insereaza un rand nou (line break) fara a incheia paragraful."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Liste HTML",
                description: "Testeaza cunostintele despre ul, ol si li",
                xpReward: 100,
                questions: [
                    {
                        text: "Ce element HTML creaza o lista cu marcatori (buline)?",
                        options: [
                            "&lt;ol&gt; — lista ordonata",
                            "&lt;ul&gt; — lista neordonata",
                            "&lt;list&gt;",
                            "&lt;bl&gt; — bulleted list"
                        ],
                        correct: 1,
                        explanation: "&lt;ul&gt; (unordered list) creaza o lista cu buline/marcatori. &lt;ol&gt; (ordered list) creaza o lista numerotata. Fiecare element din lista se defineste cu &lt;li&gt;."
                    },
                    {
                        text: "Ce element defineste un element dintr-o lista HTML?",
                        options: [
                            "&lt;item&gt;",
                            "&lt;li&gt;",
                            "&lt;element&gt;",
                            "&lt;point&gt;"
                        ],
                        correct: 1,
                        explanation: "&lt;li&gt; (list item) defineste fiecare element al unei liste, fie ea &lt;ul&gt; sau &lt;ol&gt;. Elementele &lt;li&gt; se plaseaza intotdeauna INTRE tagurile listei parinte."
                    },
                    {
                        text: "Care este diferenta dintre &lt;ul&gt; si &lt;ol&gt;?",
                        options: [
                            "Nu exista diferenta, sunt sinonime",
                            "&lt;ul&gt; are marcatori (buline), &lt;ol&gt; are numere/litere (ordonata)",
                            "&lt;ul&gt; este pentru liste lungi, &lt;ol&gt; pentru liste scurte",
                            "&lt;ol&gt; afiseaza lista pe orizontala"
                        ],
                        correct: 1,
                        explanation: "&lt;ul&gt; (unordered) foloseste marcatori (buline) — bun pentru iteme fara ordine importanta. &lt;ol&gt; (ordered) numeroteaza elementele automat — bun pentru pasi, instrucituni, clasamente."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Imagini HTML",
                description: "Testeaza cunostintele despre elementul img si atributele sale",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce element HTML insereaza o imagine pe pagina?",
                        options: [
                            "&lt;picture&gt;",
                            "&lt;image&gt;",
                            "&lt;img&gt;",
                            "&lt;photo&gt;"
                        ],
                        correct: 2,
                        explanation: "Elementul &lt;img&gt; insereaza o imagine. Este un element fara tag de inchidere (self-closing). Atributele obligatorii sunt src (sursa imaginii) si alt (descrierea alternativa)."
                    },
                    {
                        text: "Ce atribut al elementului &lt;img&gt; specifica fisierul imaginii?",
                        options: [
                            "href",
                            "url",
                            "source",
                            "src"
                        ],
                        correct: 3,
                        explanation: "Atributul src (source = sursa) specifica calea catre fisierul imaginii. Ex: &lt;img src=\"poza.jpg\"&gt;. Calea poate fi relativa (poza.jpg) sau absoluta (https://site.com/poza.jpg)."
                    },
                    {
                        text: "De ce este important atributul alt la elementul &lt;img&gt;?",
                        options: [
                            "Stabileste dimensiunea imaginii",
                            "Afiseaza text alternativ daca imaginea nu se incarca si ajuta persoanele cu deficiente de vedere",
                            "Este obligatoriu pentru ca imaginea sa apara",
                            "Schimba culoarea imaginii"
                        ],
                        correct: 1,
                        explanation: "Atributul alt ofera o descriere textuala a imaginii. Daca imaginea nu se incarca, se afiseaza acest text. Cititoarele de ecran (pentru persoane nevazatoare) citesc textul alt. Este buna practica sa fie intotdeauna prezent."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Recapitulare text si imagini",
                description: "Combina toate cunostintele despre text si imagini HTML",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce element face textul inclinat (italic) cu semnificatie de accentuare?",
                        options: [
                            "&lt;italic&gt;",
                            "&lt;i&gt; — intotdeauna",
                            "&lt;em&gt;",
                            "&lt;slant&gt;"
                        ],
                        correct: 2,
                        explanation: "&lt;em&gt; (emphasis = accentuare) face textul inclinat si transmite semnificatie semantica de accent. &lt;i&gt; face textul inclinat pur vizual. Pentru continut cu accent real, &lt;em&gt; este recomandat."
                    },
                    {
                        text: "Care este structura corecta pentru o lista neordonata cu doua elemente?",
                        hasCode: true,
                        codeContent: "A: &lt;ul&gt;&lt;li&gt;Mere&lt;/li&gt;&lt;li&gt;Pere&lt;/li&gt;&lt;/ul&gt;\n\nB: &lt;li&gt;Mere&lt;/li&gt;&lt;li&gt;Pere&lt;/li&gt;\n\nC: &lt;ul&gt;&lt;item&gt;Mere&lt;/item&gt;&lt;item&gt;Pere&lt;/item&gt;&lt;/ul&gt;",
                        options: [
                            "Varianta B — fara &lt;ul&gt; e mai simplu",
                            "Varianta A — &lt;ul&gt; cu &lt;li&gt; in interior",
                            "Varianta C — &lt;item&gt; e echivalent cu &lt;li&gt;",
                            "Toate variantele sunt corecte"
                        ],
                        correct: 1,
                        explanation: "Varianta A este corecta: &lt;ul&gt; este containerul listei, iar fiecare element este &lt;li&gt;. Elementele &lt;li&gt; NU pot sta singure fara lista parinte. &lt;item&gt; nu este un element HTML valid."
                    },
                    {
                        text: "Care element insereaza un rand nou in HTML fara a incepe un paragraf nou?",
                        options: [
                            "&lt;newline&gt;",
                            "&lt;nl&gt;",
                            "&lt;hr&gt;",
                            "&lt;br&gt;"
                        ],
                        correct: 3,
                        explanation: "&lt;br&gt; (break) insereaza un rand nou (line break) in interiorul unui bloc de text, fara a crea un nou paragraf. &lt;hr&gt; este diferit — deseneaza o linie orizontala de separare."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('web_quiz2_text_imagini_progress_cls8');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('web_quiz2_text_imagini_progress_cls8', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasCode) {
                questionContent += `
                    <div class="code-mockup">
                        <pre>${q.codeContent}</pre>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu e chiar asa...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-css-avansat.html'">
                                Quiz-ul 3: CSS Avansat
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
<script src="/assets/js/site-credit.js" defer></script>
</body>
</html>

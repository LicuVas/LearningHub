<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Formulare HTML | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 4</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Formulare HTML</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Elementul form",
                description: "Invata bazele formularelor HTML",
                xpReward: 50,
                questions: [
                    {
                        text: "Ce element HTML folosim pentru a crea un formular?",
                        options: [
                            "<input>",
                            "<form>",
                            "<button>",
                            "<div>"
                        ],
                        correct: 1,
                        explanation: "Elementul <form> este containerul principal pentru toate elementele unui formular. Fara el, datele nu pot fi trimise corect catre server."
                    },
                    {
                        text: "Ce face atributul 'action' al unui formular?",
                        options: [
                            "Schimba culoarea formularului",
                            "Specifica unde se trimit datele formularului",
                            "Adauga animatii",
                            "Face formularul mai mare"
                        ],
                        correct: 1,
                        explanation: "Atributul 'action' specifica URL-ul catre care se trimit datele formularului cand utilizatorul apasa butonul de trimitere. Ex: action=\"/procesare.php\""
                    },
                    {
                        text: "Care sunt cele doua valori principale pentru atributul 'method'?",
                        options: [
                            "start si stop",
                            "GET si POST",
                            "send si receive",
                            "open si close"
                        ],
                        correct: 1,
                        explanation: "GET trimite datele vizibil in URL (pentru cautari), iar POST le trimite ascuns in corpul cererii (pentru date sensibile ca parole). POST este mai sigur pentru date importante."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Tipuri de input",
                description: "Descopera diversele tipuri de campuri input",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce tip de input folosim pentru o parola?",
                        options: [
                            "type=\"text\"",
                            "type=\"password\"",
                            "type=\"hidden\"",
                            "type=\"secret\""
                        ],
                        correct: 1,
                        explanation: "type=\"password\" ascunde caracterele tastate afisand puncte sau asteriscuri. Astfel, nimeni nu poate vedea parola pe ecran cand o tastezi."
                    },
                    {
                        text: "Ce tip de input afiseaza un selector de data (calendar)?",
                        options: [
                            "type=\"calendar\"",
                            "type=\"date\"",
                            "type=\"time\"",
                            "type=\"datetime\""
                        ],
                        correct: 1,
                        explanation: "type=\"date\" afiseaza un calendar din care utilizatorul poate selecta o data. Browserul ofera automat interfata de selectie a datei."
                    },
                    {
                        text: "Ce tip de input este special pentru adrese de email?",
                        options: [
                            "type=\"text\"",
                            "type=\"email\"",
                            "type=\"mail\"",
                            "type=\"address\""
                        ],
                        correct: 1,
                        explanation: "type=\"email\" valideaza automat ca textul introdus este o adresa de email valida (contine @ si domeniu). Pe telefon afiseaza tastatura cu @ vizibil."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Label si accesibilitate",
                description: "Invata sa creezi formulare accesibile",
                xpReward: 100,
                questions: [
                    {
                        text: "De ce folosim elementul &lt;label&gt; pentru campurile de formular?",
                        options: [
                            "Face campul mai colorat",
                            "Descrie campul si permite click pe text pentru a selecta campul",
                            "Este obligatoriu pentru ca formularul sa functioneze",
                            "Face campul mai mare"
                        ],
                        correct: 1,
                        explanation: "<label> ofera o descriere clara a campului. Cand e conectat corect, click pe eticheta selecteaza campul. Ajuta si persoanele care folosesc cititoare de ecran."
                    },
                    {
                        text: "Cum conectam un &lt;label&gt; la un &lt;input&gt;?",
                        hasCode: true,
                        codeContent: "<label for=\"nume\">Numele tau:</label>\n<input type=\"text\" id=\"nume\">",
                        options: [
                            "Prin atributul 'name'",
                            "Prin atributele 'for' si 'id' care trebuie sa fie identice",
                            "Automat, fara atribute",
                            "Prin atributul 'class'"
                        ],
                        correct: 1,
                        explanation: "Label foloseste 'for' iar input foloseste 'id' - cele doua valori trebuie sa fie IDENTICE. Astfel browserul stie ca eticheta apartine acelui camp."
                    },
                    {
                        text: "Ce atribut face un camp obligatoriu de completat?",
                        options: [
                            "important",
                            "required",
                            "mandatory",
                            "needed"
                        ],
                        correct: 1,
                        explanation: "Atributul 'required' face ca formularul sa nu poata fi trimis daca acel camp este gol. Browserul afiseaza automat un mesaj de eroare."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Butoane si selectii",
                description: "Invata despre butoane, checkbox si radio",
                xpReward: 125,
                questions: [
                    {
                        text: "Care este diferenta dintre checkbox si radio buttons?",
                        options: [
                            "Nu exista diferenta",
                            "Checkbox permite selectii multiple, radio permite o singura selectie",
                            "Radio permite selectii multiple, checkbox una singura",
                            "Checkbox este rotund, radio este patrat"
                        ],
                        correct: 1,
                        explanation: "Checkbox (patrat) permite selectarea mai multor optiuni simultan. Radio buttons (rotunde) permit selectarea unei SINGURE optiuni dintr-un grup - selectand una o deselecteaza pe cea anterioara."
                    },
                    {
                        text: "Ce tip de buton trimite datele formularului?",
                        options: [
                            "type=\"button\"",
                            "type=\"submit\"",
                            "type=\"send\"",
                            "type=\"post\""
                        ],
                        correct: 1,
                        explanation: "type=\"submit\" creeaza un buton care trimite formularul. type=\"button\" creeaza un buton simplu care nu face nimic fara JavaScript. type=\"reset\" sterge toate campurile."
                    },
                    {
                        text: "Cum cream un meniu dropdown (lista de optiuni)?",
                        options: [
                            "Cu <input type=\"dropdown\">",
                            "Cu <select> si <option>",
                            "Cu <list> si <item>",
                            "Cu <menu> si <choice>"
                        ],
                        correct: 1,
                        explanation: "<select> creeaza meniul dropdown, iar <option> defineste fiecare optiune din lista. Ex: <select><option>Opt 1</option><option>Opt 2</option></select>"
                    }
                ]
            },
            5: {
                title: "Nivel 5: Formulare complete",
                description: "Creeaza si analizeaza formulare complexe",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce atribut folosim pentru a da un text sugestiv in interiorul unui camp?",
                        options: [
                            "hint",
                            "placeholder",
                            "suggestion",
                            "example"
                        ],
                        correct: 1,
                        explanation: "placeholder=\"Text exemplu\" afiseaza un text gri in camp care dispare cand utilizatorul incepe sa scrie. Ofera indicii despre ce trebuie completat."
                    },
                    {
                        text: "Ce element folosim pentru un camp de text pe mai multe randuri?",
                        options: [
                            "<input type=\"multiline\">",
                            "<textarea>",
                            "<text>",
                            "<input type=\"area\">"
                        ],
                        correct: 1,
                        explanation: "<textarea> creeaza un camp de text care poate avea mai multe randuri. Are atributele 'rows' si 'cols' pentru dimensiune. Ideal pentru comentarii sau mesaje lungi."
                    },
                    {
                        text: "Care structura de formular este corecta?",
                        hasCode: true,
                        codeContent: "A: <form><label for=\"e\">Email:</label><input type=\"email\" id=\"e\" required><button type=\"submit\">Trimite</button></form>\n\nB: <input><button>Trimite</button>\n\nC: <form><input></form><button>",
                        options: [
                            "Varianta B - simplu si eficient",
                            "Varianta A - formular complet cu toate elementele",
                            "Varianta C - butonul e separat",
                            "Toate sunt corecte"
                        ],
                        correct: 1,
                        explanation: "Varianta A este corecta: formular cu <form>, label conectat prin for/id, input cu tip specific si required, si buton submit IN INTERIORUL formularului. B nu are form, C are butonul in afara."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('web_quiz2_progress_cls8');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('web_quiz2_progress_cls8', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasCode) {
                questionContent += `
                    <div class="code-mockup">
                        <pre>${q.codeContent}</pre>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu e chiar asa...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${passed && currentLevel < 5 ? `
                            <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                                Nivelul Urmator
                            </button>
                        ` : ''}
                        ${passed && currentLevel === 5 ? `
                            <button class="btn btn-success" onclick="window.location.href='quiz3-css-avansat.html'">
                                Quiz-ul 3: CSS Avansat
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Recapitulare HTML si CSS | Clasa a VIII-a</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../../../assets/css/quiz-gamified.css">

    <style>
        /* Lesson-specific styles */
:root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #252540;
            --accent-red: #ef4444;
            --accent-rose: #f43f5e;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-yellow: #fbbf24;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #3d3d5c;
        }

.quiz-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.xp-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 700;
            color: #fff;
        }

.level-node.active {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

.level-intro h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-red);
        }

.level-intro .xp-reward {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }

.progress-dot.current {
            background: var(--accent-red);
        }

.progress-dot.wrong {
            background: var(--accent-rose);
        }

.code-mockup {
            background: #1e1e3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
            text-align: left;
            border: 2px solid var(--border);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
        }

.device-mockup {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

.device {
            background: #1e1e3a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
        }

.device-screen {
            background: #fff;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

.device.phone .device-screen {
            width: 60px;
            height: 100px;
        }

.device.tablet .device-screen {
            width: 100px;
            height: 75px;
        }

.device.desktop .device-screen {
            width: 140px;
            height: 80px;
        }

.device-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

.option:hover {
            border-color: var(--accent-rose);
            transform: translateX(5px);
        }

.option.wrong {
            border-color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.2);
        }

.feedback-box.wrong {
            background: rgba(244, 63, 94, 0.2);
            border: 2px solid var(--accent-rose);
        }

@keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

.btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-rose));
            color: white;
        }

.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

.btn-outline:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

.xp-earned {
            font-size: 2rem;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }

.quiz-complete-trophy {
            font-size: 6rem;
            margin-bottom: 1rem;
        }
    </style>
    
</head>
<body>
    <a href="#main-content" class="skip-link">Sari la continut</a>
    <div id="main-content" class="container">
        <a href="../index.html" class="back-link">← Inapoi la Modulul 4</a>

        <div class="quiz-header">
            <div class="quiz-title">Quiz: Recapitulare HTML si CSS</div>
            <div class="xp-display">
                <span>XP:</span>
                <span id="totalXP">0</span>
            </div>
        </div>

        <div class="level-map">
            <div class="level-node active" data-level="1" onclick="selectLevel(1)">1</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="2" onclick="selectLevel(2)">2</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="3" onclick="selectLevel(3)">3</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="4" onclick="selectLevel(4)">4</div>
            <div class="level-connector"></div>
            <div class="level-node locked" data-level="5" onclick="selectLevel(5)">5</div>
        </div>

        <div class="quiz-area" id="quizArea">
        </div>
    </div>
<script>
        const levels = {
            1: {
                title: "Nivel 1: Structura paginii web",
                description: "Invata cum este organizata o pagina HTML: antet, titlu, corp",
                xpReward: 50,
                questions: [
                    {
                        text: "Care tag HTML defineste titlul documentului (afisat in bara de titlu a browserului)?",
                        hasCode: true,
                        codeContent: "<head>\n  <title>Pagina mea</title>\n</head>",
                        options: [
                            "&lt;header&gt;",
                            "&lt;title&gt;",
                            "&lt;h1&gt;",
                            "&lt;name&gt;"
                        ],
                        correct: 1,
                        explanation: "Tag-ul <title> se plaseaza in sectiunea <head> si defineste titlul documentului — textul afisat in tabul/bara de titlu a browserului. Nu apare in corpul paginii."
                    },
                    {
                        text: "Care este structura corecta a unui document HTML de baza?",
                        hasCode: true,
                        codeContent: "<!DOCTYPE html>\n<html>\n  <head>...</head>\n  <body>...</body>\n</html>",
                        options: [
                            "&lt;body&gt; contine &lt;head&gt;",
                            "&lt;html&gt; contine &lt;head&gt; si &lt;body&gt;",
                            "&lt;head&gt; contine &lt;body&gt;",
                            "Ordinea nu conteaza"
                        ],
                        correct: 1,
                        explanation: "Structura HTML de baza: <!DOCTYPE html> declara tipul documentului, <html> este radacina, <head> contine informatii despre pagina (titlu, meta), iar <body> contine continutul vizibil."
                    },
                    {
                        text: "Ce sectiune a paginii HTML contine continutul vizibil (text, imagini, legaturi)?",
                        options: [
                            "&lt;head&gt;",
                            "&lt;title&gt;",
                            "&lt;body&gt;",
                            "&lt;meta&gt;"
                        ],
                        correct: 2,
                        explanation: "<body> contine tot ceea ce vede utilizatorul pe pagina: texte, imagini, tabele, liste, legaturi. Sectiunea <head> contine doar informatii despre document, invizibile in pagina."
                    }
                ]
            },
            2: {
                title: "Nivel 2: Editare continut — paragrafe, liste, legaturi",
                description: "Exerseaza tag-urile de baza pentru continut",
                xpReward: 75,
                questions: [
                    {
                        text: "Ce tag se foloseste pentru a crea un paragraf in HTML?",
                        hasCode: true,
                        codeContent: "<p>Acesta este un paragraf de text.</p>",
                        options: [
                            "&lt;paragraph&gt;",
                            "&lt;text&gt;",
                            "&lt;p&gt;",
                            "&lt;div&gt;"
                        ],
                        correct: 2,
                        explanation: "Tag-ul <p> (paragraph) defineste un paragraf de text. Browserul adauga automat spatiu deasupra si dedesubtul fiecarui paragraf pentru a-l separa de restul continutului."
                    },
                    {
                        text: "Care este diferenta dintre &lt;ul&gt; si &lt;ol&gt; in HTML?",
                        options: [
                            "Nu exista diferenta",
                            "&lt;ul&gt; creeaza o lista nebifata; &lt;ol&gt; creeaza o lista ordonata (numerotata)",
                            "&lt;ol&gt; este pentru imagini; &lt;ul&gt; pentru text",
                            "&lt;ul&gt; este mai vechi si nu se mai foloseste"
                        ],
                        correct: 1,
                        explanation: "<ul> (unordered list) afiseaza o lista cu puncte/buline. <ol> (ordered list) afiseaza o lista numerotata. Fiecare element din lista se marcheaza cu <li> in ambele cazuri."
                    },
                    {
                        text: "Cum se creeaza o legatura (link) catre un alt site in HTML?",
                        hasCode: true,
                        codeContent: "<a href=\"https://www.google.com\">Mergi la Google</a>",
                        options: [
                            "&lt;link&gt;text&lt;/link&gt;",
                            "&lt;a href=\"URL\"&gt;text&lt;/a&gt;",
                            "&lt;url&gt;text&lt;/url&gt;",
                            "&lt;go href=\"URL\"&gt;text&lt;/go&gt;"
                        ],
                        correct: 1,
                        explanation: "Tag-ul <a> (anchor) creeaza o legatura. Atributul href specifica adresa destinatiei. Textul dintre taguri este textul afisat pe care utilizatorul da click."
                    }
                ]
            },
            3: {
                title: "Nivel 3: Imagini si tabele",
                description: "Adauga imagini si organizeaza date in tabele",
                xpReward: 100,
                questions: [
                    {
                        text: "Care atribut al tag-ului &lt;img&gt; specifica adresa imaginii?",
                        hasCode: true,
                        codeContent: "<img src=\"poza.jpg\" alt=\"O poza\">",
                        options: [
                            "alt",
                            "href",
                            "src",
                            "link"
                        ],
                        correct: 2,
                        explanation: "Atributul src (source = sursa) specifica calea sau adresa imaginii. Atributul alt ofera un text alternativ afisat daca imaginea nu se incarca si ajuta persoanele cu dizabilitati vizuale."
                    },
                    {
                        text: "Care tag defineste un rand intr-un tabel HTML?",
                        hasCode: true,
                        codeContent: "<table>\n  <tr>\n    <td>Date</td>\n  </tr>\n</table>",
                        options: [
                            "&lt;table&gt;",
                            "&lt;tr&gt;",
                            "&lt;td&gt;",
                            "&lt;th&gt;"
                        ],
                        correct: 1,
                        explanation: "<tr> (table row) defineste un rand in tabel. <td> (table data) defineste o celula obisnuita. <th> (table header) defineste o celula de antet. Impreuna formeaza structura tabelului."
                    },
                    {
                        text: "Ce atribut al tag-ului &lt;img&gt; ofera text alternativ la imagine?",
                        options: [
                            "src",
                            "title",
                            "alt",
                            "name"
                        ],
                        correct: 2,
                        explanation: "Atributul alt (alternative text) descrie imaginea in cuvinte. Este afisat daca imaginea nu se incarca si este citit de programele de citire a ecranului pentru persoanele cu vederea slaba."
                    }
                ]
            },
            4: {
                title: "Nivel 4: Formatare text si paragraf",
                description: "Controleaza aspectul textului cu CSS",
                xpReward: 125,
                questions: [
                    {
                        text: "Ce proprietate CSS controleaza culoarea textului?",
                        hasCode: true,
                        codeContent: "p {\n  color: blue;\n}",
                        options: [
                            "background-color",
                            "text-color",
                            "color",
                            "font-color"
                        ],
                        correct: 2,
                        explanation: "Proprietatea CSS color seteaza culoarea textului. Valoarea poate fi un cuvant cheie (red, blue, green), un cod hex (#ff0000) sau o valoare rgb(255, 0, 0)."
                    },
                    {
                        text: "Ce proprietate CSS seteaza culoarea de fundal a unui element?",
                        hasCode: true,
                        codeContent: "body {\n  background-color: #f0f0f0;\n}",
                        options: [
                            "color",
                            "background-color",
                            "bg-color",
                            "fill"
                        ],
                        correct: 1,
                        explanation: "background-color seteaza culoarea de fundal a unui element. Poate fi aplicata pe orice element HTML — body pentru fundal pagina, div, p, h1 etc."
                    },
                    {
                        text: "Ce proprietate CSS controleaza marimea textului?",
                        options: [
                            "text-size",
                            "font-size",
                            "letter-size",
                            "size"
                        ],
                        correct: 1,
                        explanation: "font-size controleaza marimea caracterelor. Se poate specifica in pixeli (16px), puncte (12pt) sau procente (100%). Valoarea implicita in browsere este de obicei 16px."
                    }
                ]
            },
            5: {
                title: "Nivel 5: Formatare avansata — font, aliniere, spatiere",
                description: "Finiseaza aspectul paginii cu proprietati CSS esentiale",
                xpReward: 150,
                questions: [
                    {
                        text: "Ce proprietate CSS aliniaza textul la centrul paginii?",
                        hasCode: true,
                        codeContent: "h1 {\n  text-align: center;\n}",
                        options: [
                            "text-position: center;",
                            "align: center;",
                            "text-align: center;",
                            "center: true;"
                        ],
                        correct: 2,
                        explanation: "text-align controleaza alinierea orizontala a textului: left (stanga, implicit), right (dreapta), center (centru), justify (aliniere pe ambele margini)."
                    },
                    {
                        text: "Ce proprietate CSS seteaza tipul de font (familia de caractere)?",
                        hasCode: true,
                        codeContent: "body {\n  font-family: Arial, sans-serif;\n}",
                        options: [
                            "font-style",
                            "font-type",
                            "text-font",
                            "font-family"
                        ],
                        correct: 3,
                        explanation: "font-family specifica fontul de afisat. Se pot lista mai multe fonturi separate de virgula — browserul va folosi primul disponibil. sans-serif este o categorie generica de rezerva."
                    },
                    {
                        text: "Ce proprietate CSS face textul aldin (bold)?",
                        options: [
                            "text-style: bold;",
                            "font-weight: bold;",
                            "text-bold: true;",
                            "bold: yes;"
                        ],
                        correct: 1,
                        explanation: "font-weight controleaza grosimea caracterelor. Valori posibile: normal, bold, sau valori numerice (100-900). bold este echivalent cu 700 si face textul mai gros/mai ingrosat."
                    }
                ]
            }
        };

        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let totalXP = 0;
        let levelScores = {};
        let unlockedLevels = [1];

        function loadProgress() {
            const saved = localStorage.getItem('web_quiz5_recap_cls8');
            if (saved) {
                const data = JSON.parse(saved);
                totalXP = data.totalXP || 0;
                unlockedLevels = data.unlockedLevels || [1];
                levelScores = data.levelScores || {};
                updateXPDisplay();
                updateLevelMap();
            }
        }

        function saveProgress() {
            localStorage.setItem('web_quiz5_recap_cls8', JSON.stringify({
                totalXP,
                unlockedLevels,
                levelScores
            }));
        }

        function updateXPDisplay() {
            document.getElementById('totalXP').textContent = totalXP;
        }

        function updateLevelMap() {
            document.querySelectorAll('.level-node').forEach((node, index) => {
                const level = index + 1;
                node.classList.remove('locked', 'active', 'completed');

                if (levelScores[level] !== undefined) {
                    node.classList.add('completed');
                } else if (unlockedLevels.includes(level)) {
                    if (level === Math.max(...unlockedLevels.filter(l => levelScores[l] === undefined))) {
                        node.classList.add('active');
                    }
                } else {
                    node.classList.add('locked');
                }
            });

            document.querySelectorAll('.level-connector').forEach((conn, index) => {
                if (levelScores[index + 1] !== undefined) {
                    conn.classList.add('completed');
                } else {
                    conn.classList.remove('completed');
                }
            });
        }

        function selectLevel(level) {
            if (!unlockedLevels.includes(level)) return;
            currentLevel = level;
            currentQuestion = 0;
            score = 0;
            showLevelIntro();
        }

        function showLevelIntro() {
            const levelData = levels[currentLevel];
            document.getElementById('quizArea').innerHTML = `
                <div class="level-intro">
                    <h2>${levelData.title}</h2>
                    <p>${levelData.description}</p>
                    <div class="xp-reward">+${levelData.xpReward} XP</div>
                    <button class="btn btn-primary" onclick="startLevel()">
                        Incepe Nivelul
                    </button>
                </div>
            `;
        }

        function startLevel() {
            showQuestion();
        }

        function showQuestion() {
        // HTML-escape to prevent < > from breaking option rendering
        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];

            let progressDots = '';
            for (let i = 0; i < levelData.questions.length; i++) {
                let dotClass = 'progress-dot';
                if (i === currentQuestion) dotClass += ' current';
                progressDots += `<div class="${dotClass}"></div>`;
            }

            let questionContent = `<p class="question-text">${q.text}</p>`;

            if (q.hasCode) {
                questionContent += `
                    <div class="code-mockup">
                        <pre>${q.codeContent}</pre>
                    </div>
                `;
            }

            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `<div class="option" onclick="selectAnswer(${i})">${escHtml(opt)}</div>`;
            });

            document.getElementById('quizArea').innerHTML = `
                <div class="question-container active">
                    <div class="question-progress">${progressDots}</div>
                    ${questionContent}
                    <div class="options-grid">${optionsHTML}</div>
                    <div class="feedback-box" id="feedback"></div>
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            Urmatoarea Intrebare
                        </button>
                    </div>
                </div>
            `;
        }

        function selectAnswer(index) {
            const levelData = levels[currentLevel];
            const q = levelData.questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');

            options.forEach(opt => opt.style.pointerEvents = 'none');

            options[index].classList.add(index === q.correct ? 'correct' : 'wrong');
            if (index !== q.correct) {
                options[q.correct].classList.add('correct');
            }

            const dots = document.querySelectorAll('.progress-dot');
            dots[currentQuestion].classList.remove('current');
            dots[currentQuestion].classList.add(index === q.correct ? 'correct' : 'wrong');

            if (index === q.correct) {
                score++;
                feedback.className = 'feedback-box show correct';
                feedback.innerHTML = `
                    <div class="feedback-icon">🎉</div>
                    <div class="feedback-text">Corect! Excelent!</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback-box show wrong';
                feedback.innerHTML = `
                    <div class="feedback-icon">😅</div>
                    <div class="feedback-text">Nu e chiar asa...</div>
                    <div class="explanation">${q.explanation}</div>
                `;
            }

            nextBtn.style.display = 'inline-flex';
            nextBtn.textContent = currentQuestion < levelData.questions.length - 1 ?
                'Urmatoarea Intrebare' : 'Vezi Rezultatul';
        }

        function nextQuestion() {
            const levelData = levels[currentLevel];
            currentQuestion++;

            if (currentQuestion >= levelData.questions.length) {
                showLevelComplete();
            } else {
                showQuestion();
            }
        }

        function showLevelComplete() {
            const levelData = levels[currentLevel];
            const percentage = Math.round((score / levelData.questions.length) * 100);
            const passed = percentage >= 66;

            let stars = '';
            if (percentage >= 100) stars = '⭐⭐⭐';
            else if (percentage >= 80) stars = '⭐⭐';
            else if (percentage >= 66) stars = '⭐';
            else stars = '💪';

            let earnedXP = 0;
            if (passed) {
                earnedXP = levelData.xpReward;
                if (percentage === 100) earnedXP = Math.round(earnedXP * 1.5);

                if (!levelScores[currentLevel] || levelScores[currentLevel] < percentage) {
                    if (!levelScores[currentLevel]) {
                        totalXP += earnedXP;
                    }
                    levelScores[currentLevel] = percentage;
                }

                if (currentLevel < 5 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }

                saveProgress();
                updateXPDisplay();
                updateLevelMap();
            }

            let nextButton = '';
            if (passed && currentLevel < 5) {
                nextButton = `
                    <button class="btn btn-primary" onclick="selectLevel(${currentLevel + 1})">
                        Nivelul Urmator
                    </button>
                `;
            } else if (passed && currentLevel === 5) {
                nextButton = `
                    <button class="btn btn-success" onclick="window.location.href='../index.html'">
                        Inapoi la Modulul 4
                    </button>
                `;
            }

            let completionMessage = '';
            if (passed && currentLevel === 5) {
                completionMessage = `
                    <div style="background: rgba(16, 185, 129, 0.1); border: 2px solid var(--accent-green); border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem;">
                        <div class="quiz-complete-trophy">🏆</div>
                        <h3 style="color: var(--accent-green); margin-bottom: 0.5rem;">Felicitari!</h3>
                        <p style="color: var(--text-secondary);">Ai completat recapitularea HTML si CSS din Modulul 4!</p>
                    </div>
                `;
            }

            document.getElementById('quizArea').innerHTML = `
                <div class="level-complete show">
                    <div class="level-complete-icon">${passed ? '🏆' : '📚'}</div>
                    <h2>${passed ? 'Nivel Completat!' : 'Mai incearca!'}</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display">${score}/${levelData.questions.length} raspunsuri corecte (${percentage}%)</div>
                    ${passed ? `<div class="xp-earned">+${earnedXP} XP</div>` : ''}
                    ${completionMessage}
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem;">
                        <button class="btn btn-outline" onclick="selectLevel(${currentLevel})">
                            Reincearca
                        </button>
                        ${nextButton}
                    </div>
                </div>
            `;
        }

        loadProgress();
        showLevelIntro();
    </script>
</body>
</html>

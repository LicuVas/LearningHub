<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D5: Internet si Comunicare | Clasa XII | LearningHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #0a0a12; --bg-secondary: #12121f; --bg-card: #1a1a2e; --accent: #06b6d4; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b; --border: #2d2d44; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.7; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; text-align: center; }
        .nav-back { color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; font-size: 0.9rem; }
        .nav-back:hover { color: var(--accent); }
        .card { background: var(--bg-secondary); border: 2px solid var(--accent); border-radius: 24px; padding: 3rem 2rem; position: relative; overflow: hidden; }
        .card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        .badge { display: inline-block; background: var(--accent); color: white; padding: 0.25rem 1rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; }
        h1 { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.75rem; }
        .desc { color: var(--text-secondary); font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.6; }
        .week { color: var(--text-muted); font-size: 0.9rem; background: var(--bg-card); display: inline-block; padding: 0.4rem 1rem; border-radius: 10px; }
        .coming { color: var(--accent); font-weight: 600; font-size: 1.1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="nav-back">&#8592; Inapoi la Clasa XII</a>
        <div class="card">
            <span class="badge">Proba D</span>
            <div class="icon">&#127760;</div>
            <h1>D5: Internet si Comunicare</h1>
            <p class="desc">Navigare, email, securitate, drepturi de autor. Prezenta online pe platforme muzicale.</p>
            <span class="week">&#128197; Saptamana 8</span>
            <p class="coming">&#9888; In pregatire</p>
        </div>
    </div>
</body>
</html>

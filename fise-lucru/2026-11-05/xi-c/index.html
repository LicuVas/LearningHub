  if(fel==='padure')return /hectar/i.test(t)||/(^|[^a-zăâîșț])ha([^a-zăâîșț]|$)/i.test(t)||/km\s*(²|2|\^2|p)/i.test(t)||/kilometri\s+p/i.test(t)||/%|procent/i.test(t);
  if(fel==='aer')return /indic|index|aqi/i.test(t)||/(µ|μ|u|micro)\s*g\s*\/\s*m\s*(³|3|c|\^3)/i.test(t)||/mg\s*\/\s*m\s*(³|3|c|\^3)/i.test(t)||/microgram/i.test(t);
  if(fel==='euro')return /euro\s*-?\s*(6|7|vii|vi)([^0-9]|$)/i.test(t)||(/regulament|directiv/i.test(t)&&/\d+\s*\/\s*\d+/.test(t));
  return false;
}
function cuvinte(t){return String(t||'').trim().split(/\s+/).filter(function(w){return /[0-9A-Za-zÀ-ɏ]/.test(w)}).length}
function normF(v){return String(v||'').replace(/\s+/g,'').replace(/[−–—]/g,'-').toUpperCase()}
function formulaOk(v){var f=normF(v);return /^=\(?B4-\$B\$3\)?$/.test(f)||/^=\+B4-\$B\$3$/.test(f)}
function formulaHint(v){
  var f=normF(v);
  if(!f)return 'Scrie formula exact cum ai scris-o în C4.';
  if(f.charAt(0)!=='=')return 'Orice formulă începe cu semnul =.';
  if(/^=\(?\$?B\$?3-/.test(f))return 'Diferența față de sursa oficială = valoarea sursei MINUS valoarea oficială: întâi celula sursei.';
  if(/B\$?3|\$B3/.test(f)&&!/\$B\$3/.test(f))return 'Adresa sursei oficiale trebuie fixată de tot, și coloana, și rândul, cu $ (tasta F4).';
  return 'Verifică celulele: rândul 4 comparat cu sursa oficială de pe rândul 3, fixată cu $.';
}
function lista(a){return a.join(', ')}

function teste(){
  var T=[],g=grupa();
  /* Partea I: un test pe fiecare tip de sursă; se aprind după ce TOATE exemplele au primit un răspuns */
  var toate=D.p1.every(function(it){return !!S.p1[it.id]});
  D.tipuri.forEach(function(tp){
    var its=D.p1.filter(function(it){return it.tip===tp.id});
    var ok=toate&&its.every(function(it){return S.p1[it.id]===tp.id});
    T.push({id:'p1-'+tp.id,parte:'I',nume:its.length>1?tp.tn:tp.t1,ok:ok,
      hint:toate?tp.hint+' Mai gândește-te la exemplele marcate cu roșu.':'Încadrează întâi toate cele '+D.p1.length+' exemple.'});
  });
  /* Partea a II-a */
  var hs=S.s.map(function(x){return host(x.url)});
  var faraUrl=[];hs.forEach(function(h,i){if(!h)faraUrl.push(i+1)});
  var nuG='Alege întâi grupa (sus, în partea a II-a).';
  T.push({id:'url',parte:'II',nume:'Fiecare sursă are adresa completă (http:// sau https:// + domeniu)',ok:!!g&&!faraUrl.length,
    hint:!g?nuG:'Copiază adresa din bara browserului (clic în bară, Ctrl+C): începe cu https://. Lipsește sau e incompletă la sursa: '+lista(faraUrl)+'.'});
  var dm=hs.map(function(h){return h?dom(h):null}),dubl=[];
  for(var i=0;i<3;i++)for(var j=i+1;j<3;j++)if(dm[i]&&dm[i]===dm[j])dubl.push('sursele '+(i+1)+' și '+(j+1)+' sunt pe același site ('+dm[i]+')');
  T.push({id:'domenii',parte:'II',nume:'Cele trei surse sunt pe site-uri (domenii) diferite',ok:!!g&&!faraUrl.length&&!dubl.length,
    hint:!g?nuG:(faraUrl.length?'Întâi scrie corect toate cele trei adrese.':'Ai '+lista(dubl)+'. Caută una dintre ele pe alt site.')});
  T.push({id:'oficial',parte:'II',nume:'Cel puțin o sursă este oficială'+(g?' ('+g.oficialeText+')':''),ok:!!g&&hs.some(function(h){return oficial(h,g)}),
    hint:!g?nuG:'Una dintre surse trebuie să fie a instituției care răspunde de date: '+g.oficialeText+'.'});
  var faraAn=[];S.s.forEach(function(x,i){if(!areAn(x.an))faraAn.push(i+1)});
  T.push({id:'an',parte:'II',nume:'Fiecare sursă are anul (1990–2026) sau data datelor',ok:!!g&&!faraAn.length,
    hint:!g?nuG:'Scrie anul (4 cifre) sau data la care se referă cifra. Lipsește la sursa: '+lista(faraAn)+'.'});
  var faraVal=[];S.s.forEach(function(x,i){if(!g||!valOk(x.val,g.val))faraVal.push(i+1)});
  T.push({id:'valoare',parte:'II',nume:g?g.valTest:'Fiecare valoare are un număr și o unitate',ok:!!g&&!faraVal.length,
    hint:!g?nuG:g.valHint+' Lipsește la sursa: '+lista(faraVal)+'.'});
  var lips=[];
  S.s.forEach(function(x,i){
    var l=[];if(!x.tip)l.push('tipul');if(String(x.cine||'').trim().length<2)l.push('cine publică');
    if(!x.primara)l.push('sursa primară DA/NU');if(!String(x.timp||'').trim())l.push('cât timp');if(!x.gratuit)l.push('acces gratuit DA/NU');
    if(l.length)lips.push('sursa '+(i+1)+': '+lista(l));
  });
  T.push({id:'rubrici',parte:'II',nume:'Tabelul e completat pe toate rubricile (tip, cine publică, sursa primară, timp, acces)',ok:!!g&&!lips.length,
    hint:!g?nuG:'Mai ai de completat — '+lips.join('; ')+'.'});
  var nc=cuvinte(S.argument);
  T.push({id:'alegere',parte:'II',nume:'Ai ales sursa cea mai credibilă și ai scris argumentul (cel puțin 12 cuvinte)',ok:!!g&&/^[123]$/.test(String(S.alegere))&&nc>=12,
    hint:!g?nuG:(!/^[123]$/.test(String(S.alegere))?'Alege sursa (1, 2 sau 3) în care ai cea mai mare încredere. ':'')+(nc<12?'În argument spune cine publică, din ce an sunt datele și dacă citează sursa primară (ai '+nc+' cuvinte, trebuie cel puțin 12).':'')});
  /* Remediere */
  var R=D.rem;
  if(R.formula)T.push({id:'formula',parte:'R',nume:R.formula.test,ok:formulaOk(S.rem.formula),hint:formulaHint(S.rem.formula)});
  R.q.forEach(function(q){T.push({id:'rem-'+q.id,parte:'R',nume:q.test,ok:String(S.rem[q.id])===String(q.corect),hint:q.hint})});
  return T;
}

function umple(){
  $$('[data-f]').forEach(function(el){
    var v=getP(el.getAttribute('data-f'));
    if(el.type==='radio')el.checked=(v!=null&&String(v)===el.value);
    else el.value=v==null?'':v;
  });
}

function aratGrupa(){
  var g=grupa();
  $('#p2-fara').classList.toggle('ascuns',!!g);
  $('#p2-corp').classList.toggle('ascuns',!g);
  if(!g)return;
  $('#intrebare').textContent=(D.grupe.length>1?'Grupa '+g.nume.toUpperCase()+': ':'Întrebarea: ')+g.intrebare;
  $('#pornire').innerHTML=g.surse.map(function(s){return '<li><b>'+esc(s[0])+':</b> '+legaturi(esc(s[1]))+'</li>'}).join('')+
    '<li><em>Puteți folosi și alte surse.</em></li>';
  $$('.val-et').forEach(function(e){e.textContent=g.valEt});
  $$('.val-in').forEach(function(e){e.placeholder=g.valPh});
}
/* numele de domeniu din sursele de pornire devin legături (se deschid doar la clic, în filă nouă) */
function legaturi(t){return t.replace(/\b((?:[a-z0-9-]+\.)+(?:ro|eu))\b/g,function(m){return '<a href="https://'+m+'" target="_blank" rel="noopener">'+m+'</a>'})}

function semneP1(){
  var gr=(S.verif&&S.verif.gresite)||[];
  $$('.item').forEach(function(li){
    var r=gr.indexOf(li.getAttribute('data-id'))>=0;
    li.classList.toggle('gresit',r);$('.semn',li).classList.toggle('ascuns',!r);
  });
}

function evalueaza(){
  var T=teste(),nr=0;
  T.forEach(function(t){
    var li=$('li.t[data-t="'+t.id+'"]');if(!li)return;
    li.classList.toggle('ok',t.ok);$('.nume',li).textContent=t.nume;
    var ind=$('.ind',li),arata=!t.ok&&S.verif&&S.verif.hint&&S.verif.hint[t.id];
    ind.textContent=arata?t.hint:'';ind.classList.toggle('ascuns',!arata);
    if(t.ok)nr++;
  });
  var raspunse=D.p1.filter(function(it){return !!S.p1[it.id]}).length;
  $('#p1-stare').textContent='Ai încadrat '+raspunse+' din '+D.p1.length+' exemple.';
  $('#nrcuv').textContent='Argumentul are '+cuvinte(S.argument)+' cuvinte (cel puțin 12).';
  var remOk=T.filter(function(t){return t.parte==='R'}).every(function(t){return t.ok});
  $('#rem-bun').classList.toggle('ascuns',!remOk);
  $('#pastila').textContent='Teste: '+nr+' din '+T.length;
  scorLaProfesor(nr,T.length);
  var tot=nr===T.length;
  $('#gata').classList.toggle('vizibil',tot);
  if(tot&&!S.gata){S.gata=true;save();anunta(false)}
  return T;
}

/* SCORUL ȘI FĂRĂ FINAL (05.11.2026, el: „să permită vizualizarea scorului și dacă nu termină”): testele bifate pleacă la
   profesor ca NOTĂ pe pagina fișei (Prezenta.nota, ca la lecții: pleacă doar când nota se schimbă; detaliile „atomic N/M” =
   teste bifate din total). Nota = 1 din oficiu + 9 × bifate/total. Nimic până la primul test bifat. Vezi _unelte/scor_partial.py */
function scorLaProfesor(ok,tot){
  try{ if(!(window.Prezenta&&window.Prezenta.nota)||!(tot>0)||!(ok>0))return;
    window.Prezenta.nota({grade:Math.max(1,Math.min(10,Math.round(1+9*ok/tot))),atomicCorrect:ok,atomicTotal:tot,practiceStarted:false});
  }catch(e){}
}
/* anunțarea terminării: ca în jocuri/_motor/motor.js (raporteaza -> window.Prezenta.eveniment, tip 'joc-gata') */
function anunta(sinc){
  try{
    if(!(window.Prezenta&&window.Prezenta.eveniment))return;
    var n=teste().length,e={tip:'joc-gata',joc:D.joc,titlu:D.titluRaport,din:n,stele:S.prima?S.prima.ok:n,max:n};
    if(sinc)e.sinc=1;
    window.Prezenta.eveniment(e);
  }catch(x){}
}

function verifica(){
  var T=teste(),bune=T.filter(function(t){return t.ok}),rele=T.filter(function(t){return !t.ok});
  var hint={};rele.forEach(function(t){hint[t.id]=1});
  var gresite=[];D.p1.forEach(function(it){if(S.p1[it.id]&&S.p1[it.id]!==it.tip)gresite.push(it.id)});
  S.verif={cand:new Date().toISOString(),hint:hint,gresite:gresite};
  if(!S.prima)S.prima={ok:bune.length,total:T.length,cand:S.verif.cand,lipsa:rele.map(function(t){return t.id})};
  save();semneP1();evalueaza();arataDiag(T);
}
function ora(iso){try{var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}catch(e){return ''}}
function arataDiag(T){
  T=T||teste();
  var bune=T.filter(function(t){return t.ok}).length,rele=T.filter(function(t){return !t.ok});
  var d=$('#diag');
  if(S.verif){
    d.textContent=rele.length?'Ai '+bune+' din '+T.length+'; mai ai de refăcut: '+rele.map(function(t){return t.nume}).join('; ')+'.':'Ai '+bune+' din '+T.length+'. Fișa e gata — bravo!';
    d.classList.toggle('tot',!rele.length);
  }else{d.textContent='';d.classList.remove('tot')}
  $('#prima').textContent=S.prima?'Prima încercare (ora '+ora(S.prima.cand)+'): '+S.prima.ok+' din '+S.prima.total+'.':'';
}

function leaga(){
  var f=$('#fisa');
  function la(e){
    var el=e.target;if(!el||!el.getAttribute)return;var p=el.getAttribute('data-f');if(!p)return;
    if(el.type==='radio'){if(!el.checked)return;setP(p,el.value)}else setP(p,el.value);
    if(p.indexOf('p1.')===0&&S.verif&&S.verif.gresite){var id=p.slice(3);S.verif.gresite=S.verif.gresite.filter(function(x){return x!==id});semneP1()}
    if(p==='grupa')aratGrupa();
    save();evalueaza();
  }
  f.addEventListener('input',la);f.addEventListener('change',la);
  $('#verifica').addEventListener('click',verifica);
  $('#sterge').addEventListener('click',function(){
    if(!window.confirm('Ștergi toate răspunsurile de pe această fișă?'))return;
    S=blank();try{localStorage.removeItem(KEY)}catch(e){}
    umple();aratGrupa();semneP1();evalueaza();arataDiag();
  });
}

desen();umple();aratGrupa();semneP1();leaga();evalueaza();arataDiag();
/* fișa terminată înainte ca elevul să spună cine e: retrimitem (serverul păstrează maximul), ca în motor.js (sinc:1) */
window.addEventListener('prezenta',function(){if(S.gata&&teste().every(function(t){return t.ok}))anunta(true)});
window.addEventListener('load',function(){setTimeout(function(){if(S.gata&&teste().every(function(t){return t.ok}))anunta(true)},800)});
/* scorul de pe fișă după ce prezenta.js știe cine e elevul (vezi scorLaProfesor) */
function scorAcum(){var T=teste();scorLaProfesor(T.filter(function(t){return t.ok}).length,T.length)}
window.addEventListener('prezenta',scorAcum);window.addEventListener('load',function(){setTimeout(scorAcum,1500)});
})();

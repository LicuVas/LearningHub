<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poligonul aplicațiilor</title>
<style>:root{--paper:#fff;--ink:#111}html,body{margin:0;background:#fff;color:#111;font:14px system-ui,sans-serif}</style>
</head>
<body>
<!-- Pagina-poligon a bibliotecii centrale (api_biblioteca.md §1): încarcă biblioteca și are un singur loc rezervat.
     Oracolele O4/O5/O9 o deschid și cheamă singure LH.aplicatii.deschide(...). Pentru om: poligon.html?aplicatie=word
     (opțional &profil=word2007); poligon.html?aplicatie=excel = Excel cu o foaie mică de probă;
     poligon.html?aplicatie=powerpoint = PowerPoint cu o prezentare mică de probă (3 diapozitive). -->
<div data-lh-aplicatie-loc></div>
<script src="aplicatii.js"></script>
<script>
(function(){const q=new URLSearchParams(location.search),a=q.get('aplicatie');/* conținutul de probă pentru Excel: o foaie mică de clasa a VIII-a (media notelor), ca în lecțiile de Excel */const P={excel:{celule:{A1:'Elev',B1:'Nota 1',C1:'Nota 2',D1:'Media',A2:'Ana',B2:9,C2:10,A3:'Bogdan',B3:7,C3:8,A4:'Dan',B4:8,C4:6},selectie:'D2'},/* PowerPoint: o prezentare mică de clasa a VI-a (Vulcanii, ca în lecțiile vi/m1-l02…m2-l10) */powerpoint:{diapozitive:[{aspect:'Title Slide',texte:['Vulcanii','Clasa a VI-a']},{aspect:'Title and Content',texte:['Ce sunt vulcanii','Munți prin care iese lava din adâncul Pământului']},{aspect:'Title Only',texte:['Întrebări?']}]}};if(a)LH.aplicatii.deschide(a,{profil:q.get('profil')||undefined,continut:P[a],focus:true})})();
</script>
</body>
</html>

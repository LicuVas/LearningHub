# Lecția 4 — primul grafic: coloane din nume + note.
titlu: Un grafic cu coloane
clasa: VIII
final: Ai făcut un grafic cu coloane din tabel. Dacă schimbi o notă, coloana se schimbă singură.

pregatire:
  A1: Elev
  B1: Nota
  A2: Ana
  B2: 8
  A3: Bogdan
  B3: 5
  A4: Carmen
  B4: 10
  A5: Dan
  B5: 7

pasi:
  - titlu: Selectează tabelul
    text: Selectează tot tabelul, de la A1 până la B5 (trage cu mouse-ul).
    tinta: A1:B5
    gata: {selectie: A1:B5}
    proba: {selecteaza: A1:B5}

  - titlu: Graficul
    text: |
      Pe fila Inserare (Insert), apasă butonul cu coloane (Insert Column or Bar Chart)
      și alege prima imagine din listă.
    tinta: {buton: ChartTypeColumnInsertGallery, fila: Inserare}
    gata: {grafic: true}
    proba: {grafic: A1:B5}

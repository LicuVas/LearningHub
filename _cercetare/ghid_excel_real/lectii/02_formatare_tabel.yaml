# Lecția 2 — un tabel care arată bine: titlu îmbinat, cap de tabel aldin și colorat.
titlu: Formatarea unui tabel
clasa: VIII
final: Tabelul are acum titlu, cap de tabel aldin și colorat. Așa arată un tabel îngrijit.

pregatire:
  A1: Catalogul clasei
  A2: Elev
  B2: Nota 1
  C2: Nota 2
  A3: Ana
  B3: 8
  C3: 9
  A4: Bogdan
  B4: 5
  C4: 6
  A5: Carmen
  B5: 10
  C5: 9

pasi:
  - titlu: Selectează capul de tabel
    text: |
      Apasă pe A2 și, ținând butonul mouse-ului apăsat, trage până la C2.
      Cele trei celule se colorează — sunt selectate.
    tinta: A2:C2
    gata: {selectie: A2:C2}
    proba: {selecteaza: A2:C2}

  - titlu: Aldin pe capul de tabel
    text: Apasă butonul Aldin (Bold, B) din fila Pornire (Home).
    tinta: {buton: Bold, fila: Pornire}
    gata: {aldin: [A2, B2, C2]}
    proba: {aldin: [A2, B2, C2]}

  - titlu: Culoare de umplere
    text: |
      Cu A2:C2 tot selectate, apasă găletușa Culoare de umplere (Fill Color).
      Orice culoare e bună.
    tinta: {buton: CellFillColorPicker, fila: Pornire}
    gata: {umplere: [A2, B2, C2]}
    proba: {umple: [A2, B2, C2]}

  - titlu: Selectează rândul titlului
    text: Selectează celulele A1 până la C1 (trage cu mouse-ul de la A1 la C1).
    tinta: A1:C1
    gata: {selectie: A1:C1}
    proba: {selecteaza: A1:C1}

  - titlu: Îmbinare și centrare
    text: |
      Apasă Îmbinare și centrare (Merge & Center).
      Titlul se așază pe mijlocul tabelului.
    tinta: {buton: MergeCenter, fila: Pornire}
    gata: {imbinat: A1:C1}
    proba: {imbina: A1:C1}

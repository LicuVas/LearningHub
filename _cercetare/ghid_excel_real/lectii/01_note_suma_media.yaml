# Lecția 1 — primul tabel: note, sumă, medie, aldin.
# Formatul e descris în lectie.py (sus). „proba” = ce face elevul simulat la  ghid_excel --verifica
titlu: Note, sumă și medie
clasa: VIII
final: Ai făcut tabelul cu suma și media — în Excel-ul adevărat.

pasi:
  - titlu: Capul de tabel
    text: Dă clic în celula A1, scrie  Nota  și apasă Enter.
    tinta: A1
    gata: {are_text: A1}
    proba: {scrie: {A1: Nota}}

  - titlu: Notele
    text: |
      Scrie 5 note (de la 1 la 10) în celulele A2 … A6.
      După fiecare notă apasă Enter — Excel coboară singur.
    tinta: A2:A6
    gata: {numere: {zona: A2:A6, intre: [1, 10]}}
    proba: {scrie: {A2: [9, 7, 10, 8, 6]}}

  - titlu: Unde punem suma
    text: Dă clic în celula A7. Acolo va apărea suma notelor.
    tinta: A7
    gata: {celula_activa: A7}
    proba: {selecteaza: A7}

  - titlu: Butonul AutoSum
    text: |
      Pe fila Pornire (Home), apasă butonul Σ AutoSum.
      Excel încercuiește notele — apasă Enter.
    tinta: {buton: AutoSum, fila: Pornire}
    gata: {formula: {A7: SUM}}
    proba: {scrie: {A7: "=SUM(A2:A6)"}}

  - titlu: Media, scrisă de mână
    text: |
      Dă clic în B7 și scrie formula mediei, apoi Enter:
         =AVERAGE(A2:A6)
      (dacă Excel cere ; sau , între părți — aici nu e cazul, e o singură zonă)
    tinta: B7
    gata: {formula: {B7: AVERAGE}}
    proba: {scrie: {B7: "=AVERAGE(A2:A6)"}}

  - titlu: Aldin
    text: Dă clic pe A1 și apasă butonul Aldin (Bold, B) din fila Pornire (Home).
    tinta: {buton: Bold, fila: Pornire}
    gata: {aldin: A1}
    proba: {aldin: A1}

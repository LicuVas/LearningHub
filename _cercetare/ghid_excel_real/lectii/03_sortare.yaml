# Lecția 3 — sortare: clasamentul după medie, cu rândurile întregi mutate împreună.
titlu: Sortarea după medie
clasa: VIII
final: |
  Carmen e prima, Dan ultimul — și fiecare nume a rămas lângă media lui.
  Excel mută rândul întreg, nu doar coloana.

pregatire:
  A1: Elev
  B1: Media
  A2: Ana
  B2: 8.5
  A3: Bogdan
  B3: 5.5
  A4: Carmen
  B4: 9.5
  A5: Dan
  B5: 5
  A6: Elena
  B6: 7

pasi:
  - titlu: Alege coloana după care sortezi
    text: Dă clic pe o singură celulă din coloana Media — de exemplu B2. Nu selecta toată coloana.
    tinta: B2:B6
    gata: {celula_activa: B2:B6}
    proba: {selecteaza: B4}

  - titlu: Fila Date
    text: |
      Deschide fila Date (Data) și apasă Sortare de la Z la A (Sort Z to A)
      — cea mai mare medie urcă sus.
    tinta: {buton: SortDescendingExcel, fila: Date}
    gata:
      sortat: {zona: B2:B6, ordine: desc}
      text: {A2: Carmen, A6: Dan}
    proba: {sorteaza: {zona: A1:B6, dupa: B1, ordine: desc}}

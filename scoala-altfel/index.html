<style>
:root { --fond:#f6f7fb; --card:#ffffff; --text:#14181f; --gri:#5b6575; --linie:#d5dae3; --acc:#2563eb;

body { margin:0; background:var(--fond); color:var(--text); font:17px/1.45 system-ui, 'Segoe UI', Roboto, Arial, sans-serif; }

h1 { font-size:1.45rem; margin:.3em 0 .4em; line-height:1.2; } h2 { font-size:1.15rem; margin:.9em 0 .4em; }

button.alt { background:var(--card); color:var(--text); border:2px solid var(--linie); }
button:disabled { opacity:.45; }

.mare { display:block; width:100%; text-align:left; margin:10px 0; padding:16px; }

.bara i { display:block; height:100%; background:var(--acc); }
.sus { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sus a { color:var(--acc); text-decoration:none; font-size:.95rem; }
ol.reguli li { margin:.35em 0; }
/* robot */

.harta .et { font-size:.7rem; color:var(--gri); display:flex; align-items:center; justify-content:center; }
.harta .c { aspect-ratio:1; border:1.5px solid var(--linie); border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:1.35rem; background:var(--card); }
.harta .c.copac { background:var(--copac); } .harta .c.urma { background:var(--urma); }
.harta .c.stea { color:var(--stea); font-size:1.6rem; }

input.cuv { font:inherit; width:100%; padding:10px; border-radius:10px; border:2px solid var(--linie); background:var(--card); color:var(--text); }

.mock .buton { text-align:center; padding-bottom:12px; } .mock .buton .p { display:inline-block; background:var(--acc); color:#fff; border-radius:10px; padding:6px 18px; font-weight:700; }
.mock svg { display:block; width:100%; height:auto; }
.b { cursor:pointer; border-radius:5px; padding:1px 2px; }
.b.gasit { background:#fde68a; color:#1f1600; box-shadow:0 0 0 2px #f59e0b; }
.b.aratat { outline:2px dashed #f59e0b; outline-offset:1px; }
.b.nimic { opacity:.5; text-decoration:line-through; }

svg [data-k] { cursor:pointer; }
#toast { position:fixed; left:12px; right:12px; bottom:14px; z-index:9; max-width:536px; margin:0 auto; padding:12px 14px; border-radius:12px;
  font-weight:600; box-shadow:0 6px 24px rgba(0,0,0,.25); transform:translateY(180%); transition:transform .25s; background:var(--card); color:var(--text); }
#toast.vazut { transform:none; } #toast.bun { background:var(--bunf); border:2px solid var(--bun); } #toast.rau { background:var(--rauf); border:2px solid var(--rau); }
.metru { height:14px; border-radius:7px; background:var(--linie); overflow:hidden; margin:6px 0; } .metru i { display:block; height:100%; transition:width .2s, background .2s; }
.lista-ok { list-style:none; padding:0; margin:.4em 0 0; } .lista-ok li { margin:.2em 0; }
table.dosar { width:100%; border-collapse:collapse; font-size:.95rem; } table.dosar td { padding:6px 4px; border-bottom:1px solid var(--linie); }
table.dosar td:last-child { text-align:right; white-space:nowrap; font-weight:600; }

];
// trasee: rand 0 = sus; d: 0 sus, 1 dreapta, 2 jos, 3 stanga; min = cel mai scurt posibil (calculat de generator)
const TRASEE = {
  A: {s: [5, 0], d: 0, g: [0, 5], c: [[3, 0], [3, 1], [1, 3], [1, 4], [4, 4]], min: 12},
  B: {s: [5, 5], d: 0, g: [0, 0], c: [[3, 5], [3, 4], [1, 2], [1, 1], [4, 1]], min: 12},
  C: {s: [0, 2], d: 2, g: [5, 3], c: [[2, 1], [2, 2], [2, 3], [4, 3], [4, 4], [3, 5], [1, 4]], min: 13},

};
const GRESIT = "↑ ⟳ ↑ ↑ ↑ ⟳ ↑ ↑ ⟳ ↑ ↑ ⟲ ↑ ↑".split(" ");   // traseul A, pasul 6 e gresit
const COL = "ABCDEF", DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];
const CUVINTE = ["Pisica", "Tractor", "Lalea", "Cometa", "Ciorap", "Dragon", "Clatita", "Vulcan", "Pinguin", "Trompeta", "Castravete",

// ---------------------------------------------------------------- mic ajutor
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function sus(titlu, inapoi = "#") {
  return `<div class="sus"><a href="${inapoi}">← Înapoi</a><span class="mic">${esc(titlu)}</span></div>`;
}
function bara(i, n) { return `<div class="bara"><i style="width:${Math.round(100 * i / n)}%"></i></div>`; }

// ---------------------------------------------------------------- acasa
function acasa() {
  app.innerHTML = `<h1>Școala altfel</h1><p class="mic">Izvoare · Informatică și T.I.C. · marți 20 octombrie 2026 · EU Code Week</p>
  <button class="mare" onclick="location.hash='vii'">Clasa a VII-a<small>Detectivii digitali: adevărat sau fals?</small></button>
  <button class="mare" onclick="location.hash='viii'">Clasa a VIII-a<small>Inteligența artificială: mit sau realitate? · 6 părți, cu „Om sau AI?”</small></button>
  <button class="mare" onclick="location.hash='vi'">Clasa a VI-a<small>Robotul ascultător: 15 provocări cu săgeți, mere, labirinturi și greșeli</small></button>
  <p class="mic">Nu ai nevoie de cont. Nimic din ce apeși aici nu se trimite nicăieri.</p>`;
}

// ---------------------------------------------------------------- un joc de tip „alege raspunsul”
function quiz(o) {
  // o: {titlu, inapoi, intro, intrebari:[{eticheta, text, corect, explicatie, optiuni?, dece?, mono?}], optiuni:{cheie: eticheta}, final(scor, n), gata()}
  // q.optiuni inlocuieste o.optiuni la o intrebare; q.dece[cheie] = de ce e gresita varianta aleasa
  let i = -1, scor = 0, ales = null;
  function pas() {
    if (i < 0) { app.innerHTML = sus(o.titlu, o.inapoi) + o.intro + `<button class="mare" id="start" style="text-align:center">Începe</button>`;
      document.getElementById("start").onclick = () => { i = 0; pas(); }; window.scrollTo(0, 0); return; }
    if (i >= o.intrebari.length) { app.innerHTML = sus(o.titlu, o.inapoi) + o.final(scor, o.intrebari.length); if (o.gata) o.gata(); window.scrollTo(0, 0); return; }
    const q = o.intrebari[i], opt = q.optiuni || o.optiuni;
    let h = sus(o.titlu, o.inapoi) + bara(i, o.intrebari.length) + `<div class="mic">${i + 1} din ${o.intrebari.length} · scor ${scor}</div>`
      + `<div class="card"><span class="eticheta">${esc(q.eticheta)}</span><div class="text">${esc(q.text)}</div></div>`;
    if (ales === null) {
      const lung = Object.values(opt).some(v => v.length > 22);
      h += `<div class="${lung ? "stiva" : "rand"}">` + Object.entries(opt).map(([k, v]) => `<button class="alt${q.mono ? " mono" : ""}" data-k="${k}">${esc(v)}</button>`).join("") + `</div>`;
    } else {
      const ok = ales === q.corect, dece = !ok && q.dece && q.dece[ales] ? esc(q.dece[ales]) + "<br>" : "";
      h += `<div class="raspuns ${ok ? "bun" : "rau"}"><b class="${ok ? "bun" : "rau"}">${ok ? "Corect!" : "Nu chiar."}</b> Răspunsul: <b>${esc(opt[q.corect])}</b><br>${dece}${esc(q.explicatie)}</div>`
        + `<p><button class="mare" id="urm" style="text-align:center">${i + 1 < o.intrebari.length ? "Următorul →" : "Vezi scorul"}</button></p>`;
    }
    app.innerHTML = h;
    app.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { ales = b.dataset.k; if (ales === q.corect) scor++; pas(); });
    const u = document.getElementById("urm"); if (u) u.onclick = () => { i++; ales = null; pas(); window.scrollTo(0, 0); };
  }
  pas();
}

// ---------------------------------------------------------------- VII: Detectivii digitali, 6 misiuni (20.10.2026, dupa ora VII A: „subtire rau”)
// Misiunea 1 = cele 12 cartonase de pe foile tiparite; 2-6 sunt doar aici. Punctele stau doar in telefonul elevului (localStorage).
const CHEIE_VII = "altfel-vii-2026-10";
let DOSAR = {};
try { DOSAR = JSON.parse(localStorage.getItem(CHEIE_VII)) || {}; } catch (e) { DOSAR = {}; }
function pastreaza() { try { localStorage.setItem(CHEIE_VII, JSON.stringify(DOSAR)); } catch (e) {} }
function salveaza(m, p, max) { DOSAR[m] = {p, max}; pastreaza(); }
function toast(t, cls) {
  let d = document.getElementById("toast");
  if (!d) { d = document.createElement("div"); d.id = "toast"; d.setAttribute("role", "status"); document.body.appendChild(d); }
  d.textContent = t; d.className = cls + " vazut"; clearTimeout(toast.t); toast.t = setTimeout(() => d.classList.remove("vazut"), 3200);
}
function cuvinte4() {
  const a = [...CUVINTE].sort(() => Math.random() - .5).slice(0, 4);
  return a.join("-") + Math.floor(Math.random() * 10) + "!?#"[Math.floor(Math.random() * 3)];
}
document.addEventListener("click", ev => {
  if (!ev.target || ev.target.id !== "gen") return;
  const pw = document.getElementById("pw"), s = cuvinte4();
  if (pw) { pw.value = s; pw.dispatchEvent(new Event("input")); } else { const o = document.getElementById("parola"); if (o) o.textContent = s; }
});

// cazurile cu indicii: rand = [clasa, ...bucati]; bucata = "text" (atingere gresita), ["text", "de ce e indiciu"], {t: "text"} (nu se atinge)
function textCaz(d) {
  const bucati = {};
  d.rows.forEach((row, r) => row.slice(1).forEach((s, j) => {
    if (!(s && s.t !== undefined)) bucati[r + "-" + j] = Array.isArray(s) ? [true, s[1]] : [false, ""];
  }));
  return Object.assign({}, d, {bucati, html(g, w, predat) {
    return `<div class="mock">` + d.rows.map((row, r) => `<div class="r ${row[0]}">` + row.slice(1).map((s, j) => {
      if (s && s.t !== undefined) return `<span class="p">${esc(s.t)}</span>`;
      const k = r + "-" + j, n = g.indexOf(k), txt = Array.isArray(s) ? s[0] : s;
      const cls = n >= 0 ? " gasit" : predat && bucati[k][0] ? " aratat" : w.has(k) ? " nimic" : "";
      return `<span class="b${cls}" data-k="${k}">${esc(txt)}${n >= 0 ? `<sup>${n + 1}</sup>` : ""}</span>`;
    }).join(" ") + `</div>`).join("") + `</div>`;

const COMUNE = ["parola", "password", "qwerty", "azerty", "123456", "iloveyou", "fotbal", "iubire", "abc123", "111111", "admin", "dragoste"];
const NUME = ["maria", "andrei", "ana", "ion", "elena", "alex", "david", "ioana", "mihai", "denisa", "darius", "bianca", "vasile", "gabriel"];
function forta(p) {
  const lit = p.toLowerCase(), probleme = [];
  let set = 0;
  if (/[a-zăâîșț]/.test(p)) set += 26;
  if (/[A-ZĂÂÎȘȚ]/.test(p)) set += 26;
  if (/\d/.test(p)) set += 10;
  if (/[^a-zA-Z0-9ăâîșțĂÂÎȘȚ]/.test(p)) set += 33;
  let biti = p.length * Math.log2(Math.max(set, 1));
  if (COMUNE.some(w => lit.includes(w))) { probleme.push("are o parolă foarte folosită („parola”, „qwerty”, „123456”…)"); biti = Math.min(biti, 18); }
  if (NUME.some(n => lit.includes(n))) { probleme.push("are un nume: e primul lucru încercat de cine te cunoaște"); biti -= 14; }
  if (/(19[5-9]\d|20[0-3]\d)/.test(p)) { probleme.push("are un an (ex. anul nașterii)"); biti -= 10; }
  if (/(012|123|234|345|456|567|678|789|abc|qwe|asd)/i.test(p)) { probleme.push("are un șir la rând („123”, „abc”, „qwe”)"); biti -= 10; }
  if (/(.)\1\1/.test(p)) { probleme.push("are același caracter de 3 ori la rând"); biti -= 8; }
  if (p.length && p.length < 12) probleme.push("e scurtă: sub 12 caractere");
  biti = Math.max(0, biti);
  const sec = Math.pow(2, biti) / 2 / 1e10;   // jumatate din incercari, la 10 miliarde de incercari pe secunda
  const timp = sec < 1 ? "pe loc" : sec < 60 ? "în câteva secunde" : sec < 3600 ? "în câteva minute" : sec < 86400 ? "în câteva ore"
    : sec < 86400 * 30 ? "în câteva zile" : sec < 86400 * 365 ? "în câteva luni" : sec < 86400 * 365 * 100 ? "în câțiva ani" : "în peste 100 de ani";
  const fort = sec >= 86400 * 365 * 100 && p.length >= 14 && !probleme.length && set >= 62;
  const nivel = !p.length ? ["", 0, "var(--linie)"] : fort ? ["🏰 Fortăreață", 100, "#15803d"] : sec >= 86400 * 365 * 100 ? ["🟢 Bună", 80, "#22c55e"]
    : sec >= 86400 * 30 ? ["🟡 Medie", 55, "#eab308"] : sec >= 1 ? ["🟠 Slabă", 30, "#f97316"] : ["🔴 Foarte slabă", 12, "#dc2626"];
  return {nivel, timp, probleme, fort, set,
    lista: [[p.length >= 14, "cel puțin 14 caractere (acum: " + p.length + ")"], [/[a-zăâîșț]/.test(p) && /[A-ZĂÂÎȘȚ]/.test(p), "litere mari și mici"],
      [/\d/.test(p), "o cifră"], [/[^a-zA-Z0-9ăâîșțĂÂÎȘȚ]/.test(p), "un semn (- ! ? # …)"], [p.length > 0 && !probleme.filter(x => x.indexOf("scurtă") < 0).length, "fără nume, ani, „123”, „parola”"]]};
}

    else { cheie = id; prog = []; }
    start(); desen(); window.scrollTo(0, 0);
  }
  function start() { const t = TRASEE[cheie]; stare = {r: t.s[0], c: t.s[1], d: t.d}; urma = [[t.s[0], t.s[1]]]; }
  function harta() {
    const t = TRASEE[cheie], cop = new Set(t.c.map(x => x.join(","))), u = new Set(urma.map(x => x.join(",")));
    const mere = new Set((t.m || []).map(x => x.join(",")));
    let h = `<div class="harta"><span></span>` + [...COL].map(x => `<span class="et">${x}</span>`).join("");
    for (let r = 0; r < 6; r++) {
      h += `<span class="et">${r + 1}</span>`;
      for (let c = 0; c < 6; c++) {
        const k = r + "," + c;
        if (stare.r === r && stare.c === c) h += `<div class="c urma"><span class="robo" style="transform:rotate(${stare.d * 90}deg)">▲</span></div>`;
        else if (cop.has(k)) h += `<div class="c copac">🌲</div>`;
        else if (t.g[0] === r && t.g[1] === c) h += `<div class="c stea">★</div>`;
        else if (mere.has(k) && !u.has(k)) h += `<div class="c">🍎</div>`;
        else h += `<div class="c${u.has(k) ? " urma" : ""}"></div>`;
      }
    }
    return h + `</div>`;
  }
  function text() {
    const t = TRASEE[cheie];
    if (tip() === "bug") return `<b>Vânătoarea de greșeli:</b> echipa „${BUGURI[sel].cine}” a scris algoritmul de mai jos pentru traseul ${cheie}, dar robotul nu ajunge. Pornește-l, găsește pasul greșit și apasă pe el ca să-l schimbi.`;
    if (tip() === "prezic") return `<b>Unde ajunge robotul?</b> Robotul primește algoritmul de mai jos. Urmăriți-l cu degetul pe hartă, pas cu pas, și alegeți unde se oprește. Abia apoi îl porniți, să vedeți dacă ați avut dreptate.`;
    return `Traseul ${cheie}: du robotul (cercul albastru; vârful arată încotro se uită) ${t.m ? "prin <b>toate merele 🍎</b>, apoi " : ""}la ★, fără să intri în copaci și fără să ieși de pe hartă.`;
  }
  function desen(mesaj, cls, acum, gata) {
    const pr = tip() === "prezic", n = ORDINE.filter(id => rezolvate[id]).length, urm = ORDINE[ORDINE.indexOf(sel) + 1];
    let h = sus("VI · Robotul ascultător") + `<h1>Robotul ascultător</h1>
      <select id="nivel" class="cuv" aria-label="Alege nivelul">${GRUPE_VI.map(([g, ids]) => `<optgroup label="${esc(g)}">`
        + ids.map(id => `<option value="${id}"${id === sel ? " selected" : ""}>${esc(etichetaVi(id))}${rezolvate[id] ? " ✓" : ""}</option>`).join("") + `</optgroup>`).join("")}</select>
      <div class="mic" style="margin:6px 0">Rezolvate: <b>${n} din ${ORDINE.length}</b> · alegeți nivelul din listă</div>
      <p class="mic">${text()}</p>${harta()}
      <div class="mesaj ${cls || ""}">${mesaj || "&nbsp;"}</div>
      <div class="mic">${pr ? "Algoritmul" : "Algoritmul tău"} (${prog.length} cartonașe)${pr ? ":" : " — apasă pe un pas ca să-l schimbi:"}</div>
      <div class="prog">${prog.map((p, k) => `<span data-i="${k}" class="${k === acum ? "acum" : ""}">${p}<small>${k + 1}</small></span>`).join("") || '<span class="mic" style="background:none">gol — adaugă săgeți</span>'}</div>`;
    if (pr) {
      const q = PREZIC[sel];
      h += ales === null ? `<div class="rand">` + q.opt.map((o, j) => `<button class="alt" data-p="${j}">${esc(o)}</button>`).join("") + `</div>`
        : gata ? "" : `<p class="mic">Ați ales: <b>${esc(q.opt[ales])}</b></p><div class="rand"><button id="run">▶ Verifică: pornește robotul</button></div>`;
    } else {
      h += `<div class="rand comenzi"><button class="alt" data-c="↑" title="un pas înainte">↑</button><button class="alt" data-c="⟲" title="rotire la stânga">⟲</button>
        <button class="alt" data-c="⟳" title="rotire la dreapta">⟳</button><button class="alt" data-c="del" title="șterge ultimul">⌫</button></div>
      <div class="mic" style="margin:4px 0 8px">↑ un pas înainte · ⟲ se rotește la stânga, pe loc · ⟳ se rotește la dreapta, pe loc</div>
      <div class="rand"><button id="run">▶ Pornește robotul</button><button class="alt" id="gol">Golește</button></div>`;
    }
    if (gata && pr && !rezolvate[sel]) h += `<p><button class="alt" id="iar" style="width:100%">↺ Mai încercați o dată</button></p>`;
    if (gata && urm) h += `<p><button class="mare" id="urmator" style="text-align:center">Următorul: ${esc(etichetaVi(urm))} →</button></p>`;
    if (gata && !urm) h += `<div class="raspuns bun"><b class="bun">Ați terminat tot!</b> Provocare: alegeți un traseu și scrieți-l cu cât mai puține cartonașe.</div>`;
    app.innerHTML = h;
    document.getElementById("nivel").onchange = ev => { if (!ruleaza) alege(ev.target.value); };
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { if (ruleaza) return; start();
      if (b.dataset.c === "del") prog.pop(); else if (prog.length < 40) prog.push(b.dataset.c); desen(); });
    if (!pr) app.querySelectorAll(".prog span[data-i]").forEach(s => s.onclick = () => { if (ruleaza) return; start();
      const k = +s.dataset.i, ciclu = ["↑", "⟲", "⟳"]; prog[k] = ciclu[(ciclu.indexOf(prog[k]) + 1) % 3]; desen(); });
    app.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { ales = +b.dataset.p; desen("Acum porniți robotul și vedeți dacă ați avut dreptate."); });
    const g = document.getElementById("gol"); if (g) g.onclick = () => { if (ruleaza) return; prog = []; start(); desen(); };
    const r = document.getElementById("run"); if (r) r.onclick = porneste;
    const u = document.getElementById("urmator"); if (u) u.onclick = () => alege(urm);
    const i2 = document.getElementById("iar"); if (i2) i2.onclick = () => alege(sel);
  }
  function sfarsit(rez) {   // rez: {fel: "iese"|"copac"|"stop", k, loc}
    ruleaza = false;
    const t = TRASEE[cheie], q = PREZIC[sel];
    if (q) {
      const real = rez.fel === "copac" ? q.opt.find(o => o.startsWith("Intră")) || "copac" : rez.loc, ok = q.opt[ales] === real;
      if (ok) bifeaza();
      const unde = rez.fel === "copac" ? `la pasul ${rez.k} intră în copac` : rez.fel === "iese" ? `la pasul ${rez.k} iese de pe hartă` : `se oprește în ${rez.loc}`;
      return desen(ok ? `🔮 Ați ghicit! Robotul ${unde}.` : `Robotul ${unde}, nu „${q.opt[ales]}”. Urmăriți încă o dată pe hartă unde ați greșit.`, ok ? "bun" : "rau", -1, true);
    }
    if (rez.fel !== "stop") return desen(`Pasul ${rez.k}: robotul ${rez.fel === "iese" ? "iese de pe hartă" : "intră în copac (" + rez.loc + ")"}! Găsește pasul greșit.`, "rau", rez.k - 1);
    const u = new Set(urma.map(x => x.join(","))), mere = (t.m || []).filter(x => u.has(x.join(","))).length, toate = (t.m || []).length;
    if (stare.r === t.g[0] && stare.c === t.g[1] && mere === toate) {
      bifeaza();
      return desen(`★ A ajuns! ${prog.length} cartonașe.` + (BUGURI[sel] ? ` Ați reparat algoritmul „${BUGURI[sel].cine}”!` :
        prog.length > t.min ? ` Provocare: se poate și cu ${t.min}.` : " Mai scurt nu se poate — bravo!"), "bun", -1, true);
    }
    if (stare.r === t.g[0] && stare.c === t.g[1]) return desen(`Robotul e la ★, dar a cules doar ${mere} din ${toate} mere 🍎. Schimbați drumul ca să treacă pe la toate.`, "rau", -1);
    desen(`Robotul s-a oprit în ${COL[stare.c]}${stare.r + 1}, nu la stea${toate ? ` (mere culese: ${mere} din ${toate})` : ""}. Mai adaugă pași sau schimbă unul.`, "rau", -1);
  }
  function porneste() {
    if (ruleaza || !prog.length) return;
    ruleaza = true; start(); desen("Pornim…", "", -1);
    const t = TRASEE[cheie], cop = new Set(t.c.map(x => x.join(",")));
    let k = 0;
    (function pas() {
      if (k >= prog.length) return sfarsit({fel: "stop", loc: COL[stare.c] + (stare.r + 1)});
      const p = prog[k];
      if (p === "⟲") stare.d = (stare.d + 3) % 4;
      else if (p === "⟳") stare.d = (stare.d + 1) % 4;
      else {
        const r = stare.r + DIRS[stare.d][0], c = stare.c + DIRS[stare.d][1];
        if (r < 0 || r > 5 || c < 0 || c > 5) return sfarsit({fel: "iese", k: k + 1});
        if (cop.has(r + "," + c)) return sfarsit({fel: "copac", k: k + 1, loc: COL[c] + (r + 1)});
        stare.r = r; stare.c = c; urma.push([r, c]);
      }
      desen(`Pasul ${k + 1}: ${p}`, "", k);
      k++; setTimeout(pas, 550);
    })();
  }
  start(); desen();
}

// ---------------------------------------------------------------- rutare
function ruta() {
  const [h, sub] = location.hash.replace("#", "").split("/");
  ({vii, viii, vi}[h] || acasa)(sub);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", ruta);
ruta();
</script>
<script src="../assets/js/prezenta.js" id="lh-prezenta" defer></script>

<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Școala altfel · Izvoare</title>
<!-- Scoala altfel, Izvoare (Dumbrava Rosie), marti 20.10.2026 — pe telefonul elevului.
     Aceleasi date ca foile tiparite: _DOSARE_SCOLI\2026-ACUM_DumbravaRosie\2026-2027\08_Manuale_si_materiale\
     Scoala_altfel_2026-10-20\_generator_materiale_scoala_altfel.py (cartonase, texte, trasee). -->
<style>
:root { --fond:#f6f7fb; --card:#ffffff; --text:#14181f; --gri:#5b6575; --linie:#d5dae3; --acc:#2563eb;
  --bun:#15803d; --bunf:#dcfce7; --rau:#b91c1c; --rauf:#fee2e2; --copac:#c9d3c4; --stea:#f59e0b; --urma:#dbeafe; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond:#0f141b; --card:#18202b; --text:#eef1f5;
  --gri:#9aa6b6; --linie:#2c3746; --acc:#60a5fa; --bun:#4ade80; --bunf:#12321f; --rau:#f87171; --rauf:#3a1717;
  --copac:#2f4030; --urma:#1e3354; } }
:root[data-theme="dark"] { --fond:#0f141b; --card:#18202b; --text:#eef1f5; --gri:#9aa6b6; --linie:#2c3746; --acc:#60a5fa;
  --bun:#4ade80; --bunf:#12321f; --rau:#f87171; --rauf:#3a1717; --copac:#2f4030; --urma:#1e3354; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; background:var(--fond); color:var(--text); font:17px/1.45 system-ui, 'Segoe UI', Roboto, Arial, sans-serif; }
main { max-width:560px; margin:0 auto; padding:14px 16px 40px; }
h1 { font-size:1.45rem; margin:.3em 0 .4em; line-height:1.2; } h2 { font-size:1.15rem; margin:.9em 0 .4em; }
.mic { font-size:.88rem; color:var(--gri); }
.card { background:var(--card); border:1px solid var(--linie); border-radius:14px; padding:14px 16px; margin:12px 0; }
button { font:inherit; border:0; border-radius:12px; padding:13px 14px; min-height:48px; cursor:pointer; background:var(--acc); color:#fff; font-weight:600; }
button.alt { background:var(--card); color:var(--text); border:2px solid var(--linie); }
button:disabled { opacity:.45; }
.rand { display:flex; gap:8px; flex-wrap:wrap; } .rand > button { flex:1 1 0; }
.mare { display:block; width:100%; text-align:left; margin:10px 0; padding:16px; }
.mare small { display:block; font-weight:400; opacity:.85; }
.eticheta { display:inline-block; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gri); }
.text { font-size:1.12rem; white-space:pre-line; margin:.4em 0; }
.raspuns { border-radius:12px; padding:10px 12px; margin-top:10px; }
.raspuns.bun { background:var(--bunf); } .raspuns.rau { background:var(--rauf); }
.raspuns b.bun { color:var(--bun); } .raspuns b.rau { color:var(--rau); }
.bara { height:6px; background:var(--linie); border-radius:3px; overflow:hidden; margin:6px 0 2px; }
.bara i { display:block; height:100%; background:var(--acc); }
.sus { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sus a { color:var(--acc); text-decoration:none; font-size:.95rem; }
ol.reguli li { margin:.35em 0; }
/* robot */
.harta { display:grid; grid-template-columns:18px repeat(6, 1fr); gap:3px; margin:8px 0; }
.harta .et { font-size:.7rem; color:var(--gri); display:flex; align-items:center; justify-content:center; }
.harta .c { aspect-ratio:1; border:1.5px solid var(--linie); border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:1.35rem; background:var(--card); }
.harta .c.copac { background:var(--copac); } .harta .c.urma { background:var(--urma); }
.harta .c.stea { color:var(--stea); font-size:1.6rem; }
.robo { display:inline-flex; width:80%; height:80%; border-radius:50%; background:var(--acc); color:#fff; align-items:center; justify-content:center;
  font-size:1.1rem; transition:transform .25s; }
.prog { display:flex; flex-wrap:wrap; gap:5px; min-height:46px; padding:6px; border:2px dashed var(--linie); border-radius:12px; margin:8px 0; }
.prog span { display:inline-flex; flex-direction:column; align-items:center; min-width:38px; padding:3px 4px 2px; border-radius:8px; background:var(--urma);
  font-size:1.25rem; line-height:1; cursor:pointer; user-select:none; }
.prog span small { font-size:.62rem; color:var(--gri); margin-top:2px; }
.prog span.acum { outline:3px solid var(--stea); }
.prog span.gresit { background:var(--rauf); }
.comenzi button { font-size:1.6rem; padding:8px; }
.mesaj { min-height:1.5em; font-weight:600; margin:6px 0; }
.mesaj.bun { color:var(--bun); } .mesaj.rau { color:var(--rau); }
.traseu-btn button.ales { outline:3px solid var(--stea); }
input.cuv { font:inherit; width:100%; padding:10px; border-radius:10px; border:2px solid var(--linie); background:var(--card); color:var(--text); }
</style>
</head>
<body>
<main id="app"></main>
<script>

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function sus(titlu) {
  return `<div class="sus"><a href="#">← Înapoi</a><span class="mic">${esc(titlu)}</span></div>`;

function bara(i, n) { return `<div class="bara"><i style="width:${Math.round(100 * i / n)}%"></i></div>`; }

// ---------------------------------------------------------------- acasa

// ---------------------------------------------------------------- un joc de tip „alege raspunsul”
function quiz(o) {
  // o: {titlu, intro, intrebari:[{eticheta, text, corect, explicatie}], optiuni:{cheie: eticheta}, final(scor, n)}
  let i = -1, scor = 0, ales = null;
  function pas() {
    if (i < 0) { app.innerHTML = sus(o.titlu) + o.intro + `<button class="mare" id="start" style="text-align:center">Începe</button>`;
      document.getElementById("start").onclick = () => { i = 0; pas(); }; window.scrollTo(0, 0); return; }
    if (i >= o.intrebari.length) { app.innerHTML = sus(o.titlu) + o.final(scor, o.intrebari.length); window.scrollTo(0, 0); return; }
    const q = o.intrebari[i];
    let h = sus(o.titlu) + bara(i, o.intrebari.length) + `<div class="mic">${i + 1} din ${o.intrebari.length} · scor ${scor}</div>`
      + `<div class="card"><span class="eticheta">${esc(q.eticheta)}</span><div class="text">${esc(q.text)}</div></div>`;
    if (ales === null) {
      h += `<div class="rand">` + Object.entries(o.optiuni).map(([k, v]) => `<button class="alt" data-k="${k}">${esc(v)}</button>`).join("") + `</div>`;
    } else {
      const ok = ales === q.corect;
      h += `<div class="raspuns ${ok ? "bun" : "rau"}"><b class="${ok ? "bun" : "rau"}">${ok ? "Corect!" : "Nu chiar."}</b> Răspunsul: <b>${esc(o.optiuni[q.corect])}</b><br>${esc(q.explicatie)}</div>`
        + `<p><button class="mare" id="urm" style="text-align:center">${i + 1 < o.intrebari.length ? "Următorul →" : "Vezi scorul"}</button></p>`;
    }
    app.innerHTML = h;
    app.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { ales = b.dataset.k; if (ales === q.corect) scor++; pas(); });
    const u = document.getElementById("urm"); if (u) u.onclick = () => { i++; ales = null; pas(); window.scrollTo(0, 0); };
  }
  pas();
}

// ---------------------------------------------------------------- VII: Detectivii digitali
function vii() {

      <div class="card"><b>Cele 3 întrebări ale detectivului</b><ol class="reguli"><li>Cine spune asta? (sursa)</li>
      <li>Mă grăbește, mă sperie sau îmi promite prea mult?</li><li>Se potrivesc detaliile? (adresa site-ului, mâinile, textul, buzele)</li></ol></div>
      <p class="mic">12 cartonașe. Alege răspunsul, apoi citește indiciul. Discutați în echipă!</p>`,
    intrebari: CARTONASE.map(([t, x, r, ind]) => ({eticheta: t, text: x, corect: r, explicatie: ind})),
    optiuni: {A: "ADEVĂRAT", F: "FALS", M: "MOMEALĂ"},
    final: (s, n) => `<h1>Ai ${s} din ${n}!</h1>
      <div class="card"><b>De ținut minte</b><ul><li>Imaginile și video-urile false se fac ușor cu AI: uită-te la mâini, la textul din fundal, la buze.</li>
      <li>Ce te grăbește sau îți promite un premiu pe care nu l-ai cerut e aproape mereu momeală.</li>
      <li>Codul primit prin SMS și parola nu se dau nimănui.</li><li>Când nu ești sigur: nu dai share, întrebi un adult.</li></ul></div>
      <h2>Parola-poveste</h2>
      <div class="card">Alege <b>4 cuvinte</b> care nu au legătură între ele, fă din ele o poveste scurtă, adaugă o cifră și un semn.<br>
      <span class="mic">NU folosi: numele tău, data nașterii, numele animalului, „123456”.</span>
      <p><button class="alt" id="gen" style="width:100%">Dă-mi 4 cuvinte, ca idee</button></p><div class="text" id="parola"></div>
      <p class="mic">Asta e doar un exercițiu: parola ta adevărată ți-o inventezi singur, pe ciornă, și n-o spui nimănui.</p></div>
      <h2>Biletul de ieșire</h2><div class="card">Scrie pe bilet (sau spune) <b>un sfat de siguranță online</b> pe care l-ai da unui prieten.</div>
      <p><button class="alt" onclick="location.reload()" style="width:100%">Joacă din nou</button></p>`,
  });
  document.addEventListener("click", function gen(ev) {

      const a = [...CUVINTE].sort(() => Math.random() - .5).slice(0, 4);
      document.getElementById("parola").textContent = a.join("-") + "-" + Math.floor(Math.random() * 10) + "!?#"[Math.floor(Math.random() * 3)];
    }
  });
}

      recomandările de pe YouTube / TikTok… aproape sigur, da.</span></div>

    final: (s, n) => `<h1>${s} din ${n} la mituri</h1><p>Acum, concursul: <b>Om sau AI?</b> 10 texte — le-a scris un om sau o inteligență artificială?</p>

}

      <li><b>Verifici</b> ce spune: poate greși și poate inventa.</li><li><b>Spui</b> când l-ai folosit.</li>

window.omSauAi = omSauAi;

// ---------------------------------------------------------------- VI: robotul ascultator
function vi() {
  let cheie = "A", prog = [], ruleaza = false, urma = [], stare = null, bug = false;
  function start() { const t = TRASEE[cheie]; stare = {r: t.s[0], c: t.s[1], d: t.d}; urma = [[t.s[0], t.s[1]]]; }
  function harta() {
    const t = TRASEE[cheie], cop = new Set(t.c.map(x => x.join(","))), u = new Set(urma.map(x => x.join(",")));
    let h = `<div class="harta"><span></span>` + [...COL].map(x => `<span class="et">${x}</span>`).join("");
    for (let r = 0; r < 6; r++) {
      h += `<span class="et">${r + 1}</span>`;
      for (let c = 0; c < 6; c++) {
        const k = r + "," + c;
        if (stare.r === r && stare.c === c) h += `<div class="c urma"><span class="robo" style="transform:rotate(${stare.d * 90}deg)">▲</span></div>`;
        else if (cop.has(k)) h += `<div class="c copac">🌲</div>`;
        else if (t.g[0] === r && t.g[1] === c) h += `<div class="c stea">★</div>`;
        else h += `<div class="c${u.has(k) ? " urma" : ""}"></div>`;
      }
    }
    return h + `</div>`;
  }
  function desen(mesaj, cls, acum) {
    const t = TRASEE[cheie];
    app.innerHTML = sus("VI · Robotul ascultător") + `<h1>Robotul ascultător</h1>
      <div class="rand traseu-btn">${Object.keys(TRASEE).map(k => `<button class="alt${k === cheie && !bug ? " ales" : ""}" data-t="${k}">${k}</button>`).join("")}
        <button class="alt${bug ? " ales" : ""}" data-t="bug">🐞</button></div>
      <p class="mic">${bug ? "<b>Vânătoarea de greșeli:</b> echipa „Grăbiții” a scris algoritmul de mai jos pentru traseul A, dar robotul nu ajunge. Pornește-l, găsește pasul greșit și apasă pe el ca să-l schimbi."
        : `Traseul ${cheie}: du robotul (cercul albastru, vârful arată încotro se uită) la ★, fără să intri în copaci și fără să ieși de pe hartă.`}</p>
      ${harta()}
      <div class="mesaj ${cls || ""}">${mesaj || "&nbsp;"}</div>
      <div class="mic">Algoritmul tău (${prog.length} cartonașe) — apasă pe un pas ca să-l schimbi:</div>
      <div class="prog">${prog.map((p, k) => `<span data-i="${k}" class="${k === acum ? "acum" : ""}">${p}<small>${k + 1}</small></span>`).join("") || '<span class="mic" style="background:none">gol — adaugă săgeți</span>'}</div>
      <div class="rand comenzi"><button class="alt" data-c="↑" title="un pas înainte">↑</button><button class="alt" data-c="⟲" title="rotire la stânga">⟲</button>
        <button class="alt" data-c="⟳" title="rotire la dreapta">⟳</button><button class="alt" data-c="del" title="șterge ultimul">⌫</button></div>
      <div class="mic" style="margin:4px 0 8px">↑ un pas înainte · ⟲ se rotește la stânga, pe loc · ⟳ se rotește la dreapta, pe loc</div>
      <div class="rand"><button id="run">▶ Pornește robotul</button><button class="alt" id="gol">Golește</button></div>`;
    app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (ruleaza) return;
      bug = b.dataset.t === "bug"; cheie = bug ? "A" : b.dataset.t; prog = bug ? [...GRESIT] : []; start(); desen(); });
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { if (ruleaza) return; start();
      if (b.dataset.c === "del") prog.pop(); else if (prog.length < 30) prog.push(b.dataset.c); desen(); });
    app.querySelectorAll(".prog span[data-i]").forEach(s => s.onclick = () => { if (ruleaza) return; start();
      const k = +s.dataset.i, ciclu = ["↑", "⟲", "⟳"]; prog[k] = ciclu[(ciclu.indexOf(prog[k]) + 1) % 3]; desen(); });
    document.getElementById("gol").onclick = () => { if (ruleaza) return; prog = []; start(); desen(); };
    document.getElementById("run").onclick = porneste;
  }
  function porneste() {
    if (ruleaza || !prog.length) return;
    ruleaza = true; start(); desen("Pornim…", "", -1);
    const t = TRASEE[cheie], cop = new Set(t.c.map(x => x.join(",")));
    let k = 0;
    (function pas() {
      if (k >= prog.length) {
        ruleaza = false;
        if (stare.r === t.g[0] && stare.c === t.g[1]) {
          desen(`★ A ajuns! ${prog.length} cartonașe.` + (bug ? " Ai reparat algoritmul „Grăbiților”!" :
            prog.length > t.min ? ` Provocare: se poate și cu ${t.min}.` : " Mai scurt nu se poate — bravo!"), "bun", -1);
        } else desen(`Robotul s-a oprit în ${COL[stare.c]}${stare.r + 1}, nu la stea. Mai adaugă pași sau schimbă unul.`, "rau", -1);
        return;
      }
      const p = prog[k];
      if (p === "⟲") stare.d = (stare.d + 3) % 4;
      else if (p === "⟳") stare.d = (stare.d + 1) % 4;
      else {
        const r = stare.r + DIRS[stare.d][0], c = stare.c + DIRS[stare.d][1];
        if (r < 0 || r > 5 || c < 0 || c > 5) { ruleaza = false; desen(`Pasul ${k + 1}: robotul iese de pe hartă! Găsește pasul greșit.`, "rau", k); return; }
        if (cop.has(r + "," + c)) { ruleaza = false; desen(`Pasul ${k + 1}: robotul intră în copac (${COL[c]}${r + 1})! Găsește pasul greșit.`, "rau", k); return; }
        stare.r = r; stare.c = c; urma.push([r, c]);
      }
      desen(`Pasul ${k + 1}: ${p}`, "", k);
      k++; setTimeout(pas, 550);
    })();
  }
  start(); desen();
}

// ---------------------------------------------------------------- rutare
function ruta() {
  const h = location.hash.replace("#", "");
  ({vii, viii, vi}[h] || acasa)();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>

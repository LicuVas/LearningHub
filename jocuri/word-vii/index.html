<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Tehnoredactor</title>
<meta name="description" content="Lecție-joc pentru clasa a VII-a: Word pas cu pas, de la fereastra aplicației la cursor, selecție, copiere și mutare, formatarea caracterelor și a paragrafelor, reguli de tehnoredactare și afișul clasei.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
/* TEMA: foaie Word cu riglă (păstrată din jocul vechi); tot restul aspectului vine din motor.css */
:root{
  --desk:#E3E7EE; --paper:#FFFFFF; --paper2:#F4F6FA; --line:#CCD3DE;
  --ink:#18202E; --ink2:#586377; --accent:#2F55D4; --accentInk:#FFFFFF; --sel:#C9D8FF;
  --mark:#FFE45C; --markInk:#18202E; --ok:#1C8A4B; --okbg:#E2F4E9; --bad:#CC3434; --badbg:#FBE6E6;
  --fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --fb:"Literata",Georgia,"Times New Roman",serif;
  --fm:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0E1219; --paper:#1A2029; --paper2:#222936; --line:#323B4B;
  --ink:#E6E9F0; --ink2:#9CA6B8; --accent:#86A0FF; --accentInk:#0E1219; --sel:#2C3F78;
  --mark:#F2D23A; --markInk:#18202E; --ok:#52C98B; --okbg:#163324; --bad:#FF7272; --badbg:#3B1D20;
}}
:root[data-theme="dark"]{
  --desk:#0E1219; --paper:#1A2029; --paper2:#222936; --line:#323B4B;
  --ink:#E6E9F0; --ink2:#9CA6B8; --accent:#86A0FF; --accentInk:#0E1219; --sel:#2C3F78;
  --mark:#F2D23A; --markInk:#18202E; --ok:#52C98B; --okbg:#163324; --bad:#FF7272; --badbg:#3B1D20;
}
/* banda = rigla din Word: gradații mari la 1 cm, mici la jumătate, marginile paginii hașurate */
.banda{min-height:24px;padding:0;display:grid;grid-template-columns:7% 1fr 7%}
.banda .mz{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 6px)}
.banda .rg{background:
  repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 38px) 0 100%/100% 9px no-repeat,
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 19px) 0 100%/100% 5px no-repeat,var(--paper);
  position:relative}
.banda .rg::before{content:"";position:absolute;left:-5px;bottom:0;border:5px solid transparent;border-bottom:7px solid var(--accent)}
.banda .rg::after{content:"";position:absolute;right:-5px;bottom:0;border:5px solid transparent;border-bottom:7px solid var(--accent)}
h1{font-size:clamp(1.9rem,7vw,3.2rem);font-weight:800}
.caret,.car{display:inline-block;width:2px;height:.95em;background:var(--accent);margin:0 1px;vertical-align:-.1em;animation:clipeste 1.05s steps(1) infinite}
@keyframes clipeste{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret,.car{animation:none}}
.pil{color:var(--ink2)}
/* „Uite cum”: o bucată de foaie Word, desenată cu text (nu imagine) */
.mini-doc{border:1px solid var(--line);border-radius:6px;background:#fff;color:#111;padding:8px 14px;margin:8px 0;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:1rem;line-height:1.45;overflow-wrap:anywhere}
.mini-doc p{margin:.3em 0}
.mini-doc .pm{color:#6B7A99}
.mini-doc .sel{background:#C9D8FF}
.mini-doc .gr{background:#FBE6E6;text-decoration:underline wavy #CC3434;text-underline-offset:4px}
.mono{font-family:var(--fm);font-size:.95em;font-variant-ligatures:none}

/* SIMULATORUL „editor” (Word): bara de butoane + foaia; și „corectura”: text adevărat, cu cursor adevărat */
.wd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.wd-tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;background:var(--paper2);border:1px solid var(--line);border-radius:8px 8px 0 0}
.wd-tb button{min-width:38px;height:38px;border:1px solid transparent;border-radius:5px;background:none;font-family:var(--fm);font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;padding:0 7px;color:var(--ink)}
.wd-tb button:hover{border-color:var(--line);background:var(--paper)}
.wd-tb button.act,.wd-tb button[aria-pressed="true"]{background:var(--sel);border-color:var(--accent)}
.wd-tb .sep{width:1px;height:24px;background:var(--line);margin:0 3px}
.wd-tb .size{font-family:var(--fm);font-size:.82rem;min-width:50px;text-align:center;font-variant-numeric:tabular-nums}
.wd-al{display:inline-block;width:16px;height:12px;background:
  linear-gradient(currentColor 0 0) var(--p1) 0/var(--w1) 2px no-repeat,
  linear-gradient(currentColor 0 0) var(--p2) 5px/var(--w2) 2px no-repeat,
  linear-gradient(currentColor 0 0) var(--p1) 10px/var(--w1) 2px no-repeat}
.wd-doc{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:14px 16px;background:#fff;color:#111;min-height:110px;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}
.wd-doc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wd-doc.model{border-top:1px solid var(--line);border-radius:8px;background:#F4F6FA;pointer-events:none}
.wd-doc p{margin:0 0 .5em;line-height:1.45}
.wd-w{border-radius:2px;cursor:pointer}
.wd-w.on{background:#C9D8FF;box-shadow:0 0 0 2px #C9D8FF}
.wd-pm{color:#6B7A99;font-family:var(--fb);cursor:pointer;font-size:14px;padding:0 4px;border-radius:3px;background:none;border:0;vertical-align:baseline}
.wd-pm:hover{background:#E4EAF8}
.wd-gap{display:inline-block;width:.6em;height:1.15em;margin:0;padding:0;border:0;vertical-align:-.2em;cursor:text;
  background:linear-gradient(#C3CCDC,#C3CCDC) 50% 50%/1px 60% no-repeat}
.wd-gap.cur{background:linear-gradient(#2F55D4,#2F55D4) 50% 50%/2px 100% no-repeat;animation:clipeste 1.05s steps(1) infinite}
.wd-ta{display:block;width:100%;min-height:5.2em;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:12px 14px;background:#fff;color:#111;
  font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;resize:vertical}
.wd-ta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wd-pil .wd-doc{border-top:1px solid var(--line);border-radius:8px;min-height:0;margin-top:4px}
.wd-pil .dot{color:#6B7A99}
.wd-cor .wd-tb .hint{margin-left:4px}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script>
/* MISIUNEA TEHNOREDACTOR, portată pe motorul comun și rescrisă PE PAȘI (26.09.2026).
   Profesorul: „informația e prea condensată — nu e beginner friendly — e mai mult test decât asistență de învățare”;
   misiunea îl duce pe elev de la novice la expert: pași mici (o idee, „Uite cum”, „Explică-mi altfel”, exercițiu cu
   indiciu și „Încă un exercițiu”), ATELIER (Word simulat: selecție, Ctrl+X/C/V, B I U, mărime, aliniere, ¶ — verificat
   pe starea documentului), apoi verificarea, doar pe ce s-a predat. Cheia de progres e cea VECHE (elevii au progres
   salvat sub ea): 'misiunea_tehnoredactor_vii'. Nivelurile sunt aceleași 7, în aceeași ordine. */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../word-vii/img/${f}" target="_blank"><img src="../word-vii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const foaie=h=>`<div class="mini-doc" aria-label="Așa arată în Word">${h}</div>`;
const CAR='<span class="car" aria-hidden="true"></span>';
const PM='<span class="pm">¶</span>';

/* conținuturile programei (OMEN 3393/2017), textul EXACT din curriculum.json (cu ş/ţ vechi acolo unde le are programa) */
const P={
  interfata:'Interfaţa unei aplicaţii de realizare a documentelor',
  instrumente:'Instrumente de bază ale unei aplicații de realizare a documentelor',
  gestiune:'Operații pentru gestionarea unui document: creare, deschidere, vizualizare, salvare, închidere',
  editare:'Operaţii de editare într-un document: copiere, mutare, ștergere',
  formatare:'Operaţii de formatare a unui document: text, imagine, tabel, pagină',
  reguli:'Reguli generale de tehnoredactare şi estetică a paginii tipărite',
  specificatii:'Reguli de lucru în realizarea unui document conform unor specificații (dimensiune pagină, dimensiune font, dimensiune imagine, format tabel)'
};

/* ================= SIMULATORUL WORD ================= */
const SIZES=[11,14,18,24];
const AL={left:'la stânga',center:'centrat',right:'la dreapta',justify:'stânga-dreapta'};
const mkDoc=paras=>paras.map(p=>({al:'left',w:p.split(' ').filter(x=>x!=='').map(x=>({x,b:0,i:0,u:0,s:11}))}));
const clone=d=>JSON.parse(JSON.stringify(d));
function tintaDoc(Q){const g=mkDoc(Q.tinta||Q.start);if(Q.goal)Q.goal(g);return g}
function alIcon(a){const v={left:['0','0','100%','60%'],center:['50%','50%','100%','60%'],right:['100%','100%','100%','60%'],justify:['0','0','100%','100%']}[a];
  return `<span class="wd-al" style="--p1:${v[0]};--p2:${v[1]};--w1:${v[2]};--w2:${v[3]}"></span>`}
const stil=w=>`font-size:${(w.s*1.35).toFixed(1)}px;${w.b?'font-weight:700;':''}${w.i?'font-style:italic;':''}${w.u?'text-decoration:underline;':''}`;
/* desenează documentul; cu `ui` (sel, cur, clip) cuvintele devin clicabile, ¶ selectează paragraful, iar între cuvinte sunt locurile cursorului */
function renderDoc(doc,ui){
  return doc.map((p,pi)=>{
    let h='';
    const gap=i=>`<button type="button" class="wd-gap${ui.cur&&ui.cur.p===pi&&ui.cur.i===i?' cur':''}" data-gp="${pi}" data-gi="${i}" aria-label="Pune cursorul aici"></button>`;
    p.w.forEach((w,wi)=>{
      if(ui.clip)h+=gap(wi);else if(wi)h+=' ';
      h+=ui.sel?`<span class="wd-w${ui.sel.has(pi+':'+wi)?' on':''}" data-p="${pi}" data-w="${wi}" style="${stil(w)}">${esc(w.x)}</span>`:`<span style="${stil(w)}">${esc(w.x)}</span>`;
    });
    if(ui.clip)h+=gap(p.w.length);
    if(ui.sel)h+=` <button type="button" class="wd-pm" data-pp="${pi}" title="Selectează tot paragraful" aria-label="Selectează tot paragraful ${pi+1}">¶</button>`;
    return `<p style="text-align:${p.al}">${h||'&nbsp;'}</p>`;
  }).join('');
}
/* ce diferă între documentul elevului și țintă: întâi textul (cuvinte în plus / lipsă / ordine), apoi formatarea */
function diffs(doc,goal){
  const txt=d=>d.map(p=>p.w.map(w=>w.x).join(' '));
  const a=txt(doc),g=txt(goal);
  if(a.join('\n')!==g.join('\n')){
    const cnt=arr=>{const m={};arr.join(' ').split(' ').filter(Boolean).forEach(x=>m[x]=(m[x]||0)+1);return m};
    const ma=cnt(a),mg=cnt(g),plus=[],lipsa=[];
    for(const k in ma)if(ma[k]>(mg[k]||0))plus.push(k);
    for(const k in mg)if(mg[k]>(ma[k]||0))lipsa.push(k);
    const out=[];
    if(plus.length)out.push(`Ai în plus: „${plus.map(esc).join(' ')}”.`);
    if(lipsa.length)out.push(`Lipsește: „${lipsa.map(esc).join(' ')}”.`);
    if(!out.length)out.push(a.length!==g.length?`Documentul trebuie să aibă ${g.length} ${g.length===1?'paragraf':'paragrafe'} (acum are ${a.length}).`:'Cuvintele sunt toate, dar nu în ordinea cerută. Uită-te la model.');
    return out;
  }
  const out=[];
  doc.forEach((p,pi)=>{
    const q=goal[pi],name=p.w.slice(0,3).map(w=>w.x).join(' ')+(p.w.length>3?'…':'');
    if(p.al!==q.al)out.push(`Paragraful „${esc(name)}” trebuie aliniat ${AL[q.al]}.`);
    p.w.forEach((w,wi)=>{const gw=q.w[wi];
      [['b','aldin'],['i','cursiv'],['u','subliniat']].forEach(([c,n])=>{if(!!w[c]!==!!gw[c])out.push(`„${esc(w.x)}” ${gw[c]?'trebuie să fie':'nu trebuie să fie'} ${n}.`)});
      if(w.s!==gw.s)out.push(`„${esc(w.x)}” trebuie să aibă ${gw.s} pt (acum are ${w.s} pt).`);
    });
  });
  return out;
}
const TipEditor={
  render(Q,body,api){
    const U=Q.unelte||['font','aliniere'],fontOn=U.includes('font'),alOn=U.includes('aliniere'),clipOn=U.includes('clip');
    const doc=mkDoc(Q.start),goal=tintaDoc(Q),sel=new Set(),ist=[];
    let cur=null,clip=null;
    const B=(attr,title,html)=>`<button type="button" ${attr} title="${title}" aria-label="${title}">${html}</button>`;
    let tb='';
    if(fontOn)tb+=B('data-c="b"','Aldin (Ctrl+B)','<b>B</b>')+B('data-c="i"','Cursiv (Ctrl+I)','<i>I</i>')+B('data-c="u"','Subliniat (Ctrl+U)','<u>U</u>')
      +'<span class="sep"></span>'+B('data-c="dn"','Micșorează fontul','A−')+'<span class="size" data-sz>— pt</span>'+B('data-c="up"','Mărește fontul','A+')+'<span class="sep"></span>';
    if(alOn)tb+=['left','center','right','justify'].map(a=>B(`data-a="${a}"`,'Aliniere '+AL[a],alIcon(a))).join('')+'<span class="sep"></span>';
    if(clipOn)tb+=B('data-k="x"','Decupează (Ctrl+X)','Ctrl+X')+B('data-k="c"','Copiază (Ctrl+C)','Ctrl+C')+B('data-k="v"','Lipește (Ctrl+V)','Ctrl+V')+B('data-k="del"','Șterge selecția (Delete)','Delete')+'<span class="sep"></span>';
    tb+=B('data-k="z"','Anulează ultima acțiune (Ctrl+Z)','↶');
    const hint='Atinge un cuvânt ca să-l selectezi (atinge-l iar ca să-l deselectezi). ¶ selectează tot paragraful.'
      +(clipOn?' Liniuța subțire dintre cuvinte pune cursorul acolo.':'')+(fontOn?' Mărimi: 11 · 14 · 18 · 24 pt.':'');
    body.innerHTML=`<div class="wd-two">
      <div class="wd-ed"><div class="lbl">Documentul tău</div>
        <div class="wd-tb" role="toolbar" aria-label="Butoanele din Word">${tb}</div>
        <div class="wd-doc" tabindex="0" aria-label="Documentul tău"></div>
        <div class="toast" aria-live="polite"></div>
        <p class="hint" style="margin:0">${hint}</p></div>
      <div><div class="lbl">Modelul</div><div class="wd-doc model">${renderDoc(goal,{})}</div></div>
    </div>`;
    const ed=body.querySelector('.wd-ed'),docEl=ed.querySelector('.wd-doc'),toast=ed.querySelector('.toast'),sz=ed.querySelector('[data-sz]');
    const keys=()=>[...sel].map(k=>k.split(':').map(Number)).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const selWords=()=>keys().map(([p,w])=>doc[p].w[w]);
    const push=()=>{ist.push(JSON.stringify(doc));if(ist.length>60)ist.shift()};
    const inlocuieste=d=>{doc.length=0;clone(d).forEach(p=>doc.push(p))};
    function paint(){
      docEl.innerHTML=renderDoc(doc,{sel,cur,clip:clipOn});
      const ws=selWords();
      ed.querySelectorAll('[data-c]').forEach(b=>{const c=b.dataset.c;if('biu'.includes(c))b.classList.toggle('act',ws.length>0&&ws.every(w=>w[c]))});
      const paras=new Set(keys().map(k=>k[0]));if(!paras.size&&cur)paras.add(cur.p);
      ed.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('act',paras.size>0&&[...paras].every(p=>doc[p]&&doc[p].al===b.dataset.a)));
      if(sz){const s=[...new Set(ws.map(w=>w.s))];sz.textContent=ws.length?(s.length===1?s[0]+' pt':'mixt'):'— pt'}
    }
    /* șterge cuvintele selectate; întoarce locul unde rămâne cursorul. Un paragraf golit dispare (ca la triplu-clic + Delete). */
    function stergeSel(){
      const ks=keys();if(!ks.length)return cur;
      let pos={p:ks[0][0],i:ks[0][1]};
      for(let j=ks.length-1;j>=0;j--)doc[ks[j][0]].w.splice(ks[j][1],1);
      sel.clear();
      for(let p=doc.length-1;p>=0;p--){
        if(doc[p].w.length||doc.length<=1)continue;
        doc.splice(p,1);
        if(pos.p>p)pos.p--;
        else if(pos.p===p)pos=p<doc.length?{p,i:0}:{p:p-1,i:doc[p-1].w.length};
      }
      return pos;
    }
    const spune=t=>{toast.textContent=t};
    function comanda(k){
      if(api.done())return;spune('');
      if(k==='z'){if(!ist.length){spune('Nu ai nimic de anulat.');return}inlocuieste(JSON.parse(ist.pop()));sel.clear();cur=null;paint();return}
      if(k==='x'||k==='c'){
        if(!sel.size){spune('Selectează întâi textul: Ctrl+X și Ctrl+C lucrează doar cu textul selectat.');return}
        clip=clone(selWords());
        if(k==='x'){push();cur=stergeSel()}
        else spune('Copiat. Originalul a rămas. Pune cursorul unde vrei și apasă Ctrl+V.');
        paint();return}
      if(k==='v'){
        if(!clip){spune('Nu ai nimic de lipit: întâi Ctrl+C (copiezi) sau Ctrl+X (decupezi).');return}
        if(!sel.size&&!cur){spune('Pune întâi cursorul: atinge liniuța subțire dintre două cuvinte.');return}
        push();if(sel.size)cur=stergeSel();
        doc[cur.p].w.splice(cur.i,0,...clone(clip));cur={p:cur.p,i:cur.i+clip.length};paint();return}
      if(k==='del'){
        if(!sel.size){spune('Selectează întâi ce vrei să ștergi. (În joc lucrăm cu cuvinte întregi; în Word, Delete fără selecție șterge o literă.)');return}
        push();cur=stergeSel();paint();return}
    }
    function formateaza(c,a){
      if(api.done())return;spune('');
      if(a){ // alinierea e a paragrafului: ajunge cursorul în el sau o selecție în el
        const paras=new Set(keys().map(k=>k[0]));if(!paras.size&&cur)paras.add(cur.p);
        if(!paras.size){spune('Arată-i lui Word paragraful: selectează un cuvânt din el (sau pune cursorul în el).');return}
        push();paras.forEach(p=>doc[p].al=a);paint();return}
      if(!sel.size){spune('Nimic selectat. În Word, formatarea caracterelor se aplică textului pe care l-ai selectat.');return}
      push();const ws=selWords();
      if('biu'.includes(c)){const v=ws.every(w=>w[c])?0:1;ws.forEach(w=>w[c]=v)}
      else ws.forEach(w=>{const i=SIZES.indexOf(w.s)+(c==='up'?1:-1);w.s=SIZES[Math.max(0,Math.min(SIZES.length-1,i))]});
      paint();
    }
    docEl.addEventListener('click',e=>{
      if(api.done())return;spune('');
      const w=e.target.closest('.wd-w'),pm=e.target.closest('.wd-pm'),g=e.target.closest('.wd-gap');
      if(w){const k=w.dataset.p+':'+w.dataset.w;sel.has(k)?sel.delete(k):sel.add(k);cur=null}
      else if(pm){const p=+pm.dataset.pp,ks=doc[p].w.map((_,i)=>p+':'+i),all=ks.every(k=>sel.has(k));ks.forEach(k=>all?sel.delete(k):sel.add(k));cur=null}
      else if(g){sel.clear();cur={p:+g.dataset.gp,i:+g.dataset.gi}}
      else return;
      paint();
    });
    ed.querySelector('.wd-tb').addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.k)comanda(b.dataset.k);else formateaza(b.dataset.c,b.dataset.a);
    });
    /* pe calculator merg și scurtăturile adevărate, cât timp documentul e activ */
    ed.addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if(e.ctrlKey||e.metaKey){
        if('biu'.includes(k)&&fontOn){e.preventDefault();formateaza(k)}
        else if('xcv'.includes(k)&&clipOn){e.preventDefault();comanda(k)}
        else if(k==='z'){e.preventDefault();comanda('z')}
      }else if((k==='delete'||k==='backspace')&&clipOn&&sel.size){e.preventDefault();comanda('del')}
    });
    const nav=api.checkButton(()=>{
      const d=diffs(doc,goal);
      if(!d.length){sel.clear();cur=null;paint();nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`Mai ${d.length===1?'e o diferență':'sunt '+d.length+' diferențe'} față de model. ${d.slice(0,2).join(' ')}`);
        api.revealButton(()=>{inlocuieste(goal);sel.clear();cur=null;paint();nav.innerHTML='';api.giveUp('documentul arată acum ca modelul. Uită-te ce s-a schimbat.')})}
    });
    const ds=document.createElement('button');ds.type='button';ds.className='btn ghost';ds.textContent='Deselectează tot';
    ds.onclick=()=>{if(api.done())return;sel.clear();paint()};nav.appendChild(ds);
    body._ed={set:d=>{inlocuieste(d);sel.clear();cur=null;paint()}};
    paint();
  },
  rezolva(Q,body){body._ed.set(tintaDoc(Q))},
  /* greșeala tipică a copilului (Q.tipic): text = listă de paragrafe, formatare = funcție pe documentul de start */
  gresit(Q,body){let g;if(Array.isArray(Q.tipic))g=mkDoc(Q.tipic);else{g=mkDoc(Q.start);if(Q.tipic)Q.tipic(g)}body._ed.set(g)}
};

/* CORECTURA: o casetă de text adevărată (cursor, săgeți, Backspace, Delete, Ctrl+Z ale sistemului), cu butonul ¶
   care arată spațiile ca puncte. Verificarea: textul final e EXACT cel cerut. */
const TipCorectura={
  render(Q,body,api){
    body.innerHTML=`<div class="wd-cor">
      <div class="wd-tb" role="toolbar" aria-label="Butoanele din Word">${Q.faraPil?'<span class="hint">Corectezi cu tastele, ca în Word</span>':'<button type="button" data-pil aria-pressed="false" title="Afișare/ascundere ¶ (Show/Hide ¶)" aria-label="Afișare/ascundere ¶">¶</button><span class="hint">Afișare/ascundere ¶</span>'}</div>
      <textarea class="wd-ta" rows="${Q.randuri||3}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Textul de corectat"></textarea>
      <div class="wd-pil" hidden><div class="lbl">Cu ¶ pornit, textul tău arată așa</div><div class="wd-doc"></div></div>
      <p class="hint" style="margin:6px 0 0">Atinge textul ca să pui cursorul, apoi corectează ca în Word. Pe telefon nu există tasta Delete: folosești ⌫ (Backspace).</p></div>`;
    const ta=body.querySelector('textarea'),box=body.querySelector('.wd-pil'),pv=box.querySelector('.wd-doc'),bp=body.querySelector('[data-pil]');
    ta.value=Q.start;
    const upd=()=>{pv.innerHTML=ta.value.split('\n').map(r=>esc(r).replace(/ /g,'<span class="dot">·</span>')+'<span class="dot">¶</span>').join('<br>')};
    const arata=on=>{box.hidden=!on;if(bp)bp.setAttribute('aria-pressed',String(on));upd()};
    if(bp)bp.onclick=()=>arata(box.hidden);
    ta.addEventListener('input',upd);
    if(Q.pil)arata(true);
    const nav=api.checkButton(()=>{
      const v=ta.value.replace(/\r\n/g,'\n');
      if(v===Q.tinta){ta.readOnly=true;nav.innerHTML='';api.resolve(true);return}
      let i=0;while(i<v.length&&v[i]===Q.tinta[i])i++;
      const a=Math.max(0,i-12),buc=v.slice(a,i+12);
      api.resolve(false,`Textul nu e încă cel cerut. Primul loc diferit e aici: <span class="mono">${a?'…':''}${esc(buc).replace(/ /g,'·')}${i+12<v.length?'…':''}</span> (fiecare · e un spațiu).`);
      api.revealButton(()=>{ta.value=Q.tinta;upd();ta.readOnly=true;nav.innerHTML='';api.giveUp(`<span class="mono">${esc(Q.tinta).replace(/ /g,'·')}</span> (fiecare · e un spațiu)`)});
    });
    body._ta=ta;body._upd=upd;
  },
  rezolva(Q,body){body._ta.value=Q.tinta;body._upd()},
  gresit(Q,body){body._ta.value=Q.tipic||Q.start;body._upd()}
};

   incearca:{t:'choice',q:'Ai șters din greșeală un paragraf întreg. Ce apeși?',o:['Ctrl+Z','Ctrl+Y','Ctrl+N','Enter'],ok:0,ajutor:'Care scurtătură anulează ultima acțiune?',why:'Ctrl+Z anulează ștergerea. Ctrl+Y ar reface doar ceva ce ai anulat deja.'},
   inca:[
    {t:'tf',q:'Ctrl+Y reface o acțiune pe care tocmai ai anulat-o cu Ctrl+Z.',ok:true,ajutor:'Ctrl+Y merge „înainte”.',why:'Adevărat. Ctrl+Z merge înapoi, Ctrl+Y înainte.'}
   ]},
  {t:'Linia roșie ondulată',
   text:`<p>O <strong>linie roșie ondulată</strong> sub un cuvânt înseamnă că Word <em>crede</em> că e scris greșit.</p>
<p>Word nu știe toate cuvintele. Nume de localități, de persoane sau cuvinte noi apar des subliniate, deși sunt corecte.</p>
<p>Așa că verifici singur: e scris corect? Îl lași așa. E o greșeală de tastare? O corectezi.</p>
${fig('cursor-corectura.webp',870,80,'Text în Word: numele Pipirig subliniat cu o linie roșie ondulată, deși e scris corect','Numele <b>Pipirig</b> are <b>linie roșie ondulată</b>: Word nu cunoaște cuvântul, dar el e scris corect.')}`,
   exemplu:foaie(`<p>Am fost la <span class="gr">Pipirig</span> și am văzut o <span class="gr">cascda</span>.</p>`)+`<p>„Pipirig” e corect (Word nu-l cunoaște). „cascda” e o greșeală de tastare: corect e „cascada”.</p>`,
   incearca:{t:'tf',q:'Numele „Pipirig” e subliniat cu roșu, deci sigur e scris greșit.',ok:false,ajutor:'Word cunoaște toate numele de localități?',why:'Fals. Linia roșie arată doar că Word nu recunoaște cuvântul. Numele proprii apar des așa.'},
   inca:[
    {t:'choice',q:'Word subliniază cu roșu „Tarcău”, un nume de localitate scris corect. Ce faci?',o:['Îl lași așa: e scris corect','Îl ștergi din text','Îl scrii fără diacritice','Îi schimbi fontul'],ok:0,ajutor:'Verifici singur: e o greșeală de tastare?',why:'Dacă e scris corect, linia roșie nu contează; nu se vede nici la tipărire.'}
   ]}
 ],
 atelier:{t:'corectura',titlu:'Corectează ca în Word',faraPil:true,
  intro:`<p>Mai jos e o casetă cu text adevărat: are cursor adevărat, iar <kbd>Backspace</kbd>, <kbd>Delete</kbd>, săgețile și ${K('Ctrl+Z')} merg ca în Word. <strong>Sarcina:</strong> atinge textul ca să pui cursorul lângă greșeală, corecteaz-o, apoi apasă <b>Verifică</b>.</p>`,
  q:'Două cuvinte au câte o literă în plus: „mergemm” și „muzeuu”. Șterge literele în plus.',
  start:'Mâine mergemm la muzeuu de istorie.',tinta:'Mâine mergem la muzeu de istorie.',tipic:'Mâine mergemm la muzeu de istorie.',
  ajutor:'Pune cursorul imediat după litera în plus și apasă o dată Backspace.',
  why:'Ai pus cursorul lângă greșeală și ai șters exact o literă, nu tot cuvântul.',
  inca:[
   {t:'corectura',faraPil:true,q:'Lipsește o literă din „Vinri”. Pune cursorul la locul ei și scrie-o, ca să obții „Vineri”.',start:'Vinri avem ora de desen.',tinta:'Vineri avem ora de desen.',tipic:'Vinrie avem ora de desen.',
    ajutor:'Litera „e” lipsește între „n” și „r”. Pune cursorul acolo și tasteaz-o.',why:'Litera apare acolo unde e cursorul, de aceea l-ai pus întâi în locul potrivit.'},
   {t:'corectura',faraPil:true,q:'Cuvântul „avem” e scris de două ori. Șterge unul dintre ele, împreună cu spațiul lui.',start:'Luni avem avem lucrare la TIC.',tinta:'Luni avem lucrare la TIC.',tipic:'Luni avem  lucrare la TIC.',
    ajutor:'Pune cursorul imediat după al doilea „avem” și apasă Backspace de 5 ori: 4 litere și un spațiu. Între „Luni avem” și „lucrare” trebuie să rămână un singur spațiu.',why:'Ai șters cuvântul și un spațiu: între cuvinte a rămas exact un spațiu.'}
  ]},
 qs:[
  {t:'choice',q:'Cursorul stă aici: „tabl|a”. Apeși o dată Backspace. Ce rămâne?',o:['taba','tabl','tabla','tala'],ok:0,ajutor:'Care literă e în STÂNGA liniuței?',why:'Backspace șterge „l”, din stânga cursorului: rămâne „tab” + „a”.'},
  {t:'choice',q:'Cursorul stă aici: „caie|t”. Apeși o dată Delete. Ce rămâne?',o:['caie','cait','caiet','cat'],ok:0,ajutor:'Care literă e în DREAPTA liniuței?',why:'Delete șterge „t”, din dreapta cursorului: rămâne „caie”.'},
  {t:'tf',q:'Scrii o compunere lungă. Word trece singur pe rândul următor când rândul se umple.',ok:true,why:'Adevărat. Enter îl apeși doar pentru un paragraf nou.'},
  {t:'choice',q:'Ai apăsat Ctrl+Z de două ori și ai anulat prea mult. Cum refaci ultima anulare?',o:['Ctrl+Y','Ctrl+Z','Ctrl+N','Backspace'],ok:0,why:'Ctrl+Y reface ce ai anulat. Încă un Ctrl+Z ar anula și mai mult.'},
  {t:'corectura',faraPil:true,q:'Corectează textul: un cuvânt are o literă în plus.',start:'Ne vedemm la poarta școlii.',tinta:'Ne vedem la poarta școlii.',tipic:'Ne vede la poarta școlii.',ajutor:'Caută litera dublată și șterge doar una dintre ele.',why:'Ai șters doar litera în plus; restul textului a rămas neatins.'}
 ]},

/* ================= 3. Selectez ca un pro (lecția 5) ================= */
{t:'Selectez ca un pro',lectii:[5],continuturi:[P.editare],
 obiectiv:'selectezi exact textul de care ai nevoie și îl copiezi, îl muți sau îl ștergi.',
 pasi:[
  {t:'Selecția: îi arăți lui Word textul',
   text:`<p>Înainte să faci ceva cu un text — să-l muți, să-l ștergi, să-l îngroși — îi arăți lui Word <strong>care</strong> text: îl <mark>selectezi</mark>. Textul selectat apare pe un fundal colorat.</p>
<ul><li><strong>dublu-clic</strong> pe un cuvânt → selectezi cuvântul;</li>
<li><strong>triplu-clic</strong> într-un paragraf → selectezi tot paragraful;</li>
<li><strong>clic și tragi</strong> cu mouse-ul → selectezi cât vrei.</li></ul>
${fig('selectie-paragraf.webp',870,80,'Un paragraf întreg selectat în Word: tot textul lui stă pe un fundal gri-albastru','Un <b>paragraf întreg selectat</b> (aici cu triplu-clic): fundalul colorat acoperă tot textul.')}`,
   exemplu:foaie(`<p>Mâine avem <span class="sel">lucrare</span> la TIC.</p>`)+`<p>Dublu-clic pe „lucrare” → doar cuvântul acesta e selectat.</p>`,
   incearca:{t:'choice',q:'Cum selectezi repede un singur cuvânt?',o:['Dublu-clic pe el','Triplu-clic pe el','Un singur clic','Apeși Enter'],ok:0,ajutor:'Recitește lista: câte clicuri pentru un cuvânt?',why:'Dublu-clicul ia exact cuvântul; triplu-clicul ia tot paragraful.'},
   inca:[
    {t:'choice',q:'Vrei să selectezi tot paragraful despre excursie. Ce faci?',o:['Triplu-clic în paragraf','Dublu-clic pe un cuvânt','Apeși Enter de trei ori','Un clic la final'],ok:0,ajutor:'Paragraf întreg = cu un clic mai mult decât la cuvânt.',why:'Triplu-clicul selectează tot paragraful.'}
   ]},
  {t:'Selecția de la tastatură',
   text:`<p>Poți selecta și fără mouse. Ții apăsată tasta <kbd>Shift</kbd> și apeși o <strong>săgeată</strong>: selecția crește literă cu literă, în direcția săgeții.</p>
<p>Ai selectat prea mult? Ții tot <kbd>Shift</kbd> și apeși săgeata în partea cealaltă: selecția scade.</p>
<p>Un clic oriunde în text (fără <kbd>Shift</kbd>) <strong>anulează selecția</strong>: fundalul colorat dispare.</p>`,
   exemplu:`<p>Cursorul e înainte de „mare”: <span class="mono">la |mare</span>. Ții <kbd>Shift</kbd> și apeși de 4 ori săgeata spre dreapta → e selectat „mare”.</p>`,
   incearca:{t:'tf',q:'Cu Shift ținut apăsat, săgeata spre dreapta mărește selecția spre dreapta.',ok:true,ajutor:'Recitește prima propoziție a pasului.',why:'Adevărat. Shift + săgeți selectează literă cu literă.'},
   inca:[
    {t:'choice',q:'Ai un cuvânt selectat și dai un clic simplu în alt loc din text. Ce se întâmplă?',o:['Selecția dispare','Cuvântul se șterge','Cuvântul se copiază','Nu se întâmplă nimic'],ok:0,ajutor:'Ultimul paragraf al pasului.',why:'Un clic simplu anulează selecția și mută cursorul acolo.'}
   ]},
  {t:'Copiez sau mut: Ctrl+C, Ctrl+X, Ctrl+V',
   text:`<p>Cu textul selectat:</p>
<ul><li>${K('Ctrl+C')} <strong>copiază</strong> — originalul rămâne pe loc;</li>
<li>${K('Ctrl+X')} <strong>decupează</strong> — textul dispare și așteaptă să fie lipit;</li>
<li>${K('Ctrl+V')} <strong>lipește</strong> textul acolo unde e cursorul.</li></ul>
<p>Deci: <mark>copiere</mark> = ${K('Ctrl+C')}, apoi ${K('Ctrl+V')}; <mark>mutare</mark> = ${K('Ctrl+X')}, apoi ${K('Ctrl+V')}. Pe fila Pornire (Home) ai și butoane pentru ele: <em>Cut</em>, <em>Copy</em>, <em>Paste</em>.</p>`,
   exemplu:`<p>Vrei să muți „Plecăm luni.” la început:</p>`+foaie(`<p>Aduceți apă. <span class="sel">Plecăm luni.</span></p>`)+`<p>${K('Ctrl+X')} → dai clic înainte de „Aduceți” → ${K('Ctrl+V')}:</p>`+foaie(`<p>Plecăm luni. Aduceți apă.</p>`),
   altfel:`<p>Copierea e ca o fotocopie: foaia ta rămâne, iar tu mai primești una. Mutarea e ca atunci când iei foaia dintr-un dosar și o pui în altul: din primul dosar dispare.</p>`,
   incearca:{t:'classify',q:'Originalul rămâne sau dispare?',cats:['Originalul rămâne','Originalul dispare'],items:[['Ctrl+C',0],['Ctrl+X',1],['copiere',0],['mutare',1]],ajutor:'X = foarfeca: taie textul de acolo.',why:'La copiere (Ctrl+C) originalul rămâne; la mutare (Ctrl+X) dispare de unde era.'},
   inca:[
    {t:'order',q:'Vrei să muți ultima propoziție la începutul textului. Pune pașii în ordine.',items:['Selectezi propoziția','Apeși Ctrl+X','Dai clic la începutul textului','Apeși Ctrl+V'],ajutor:'Întâi arăți textul, apoi îl decupezi, apoi alegi locul nou.',why:'Selectezi → decupezi → pui cursorul unde vrei → lipești.'}
   ]},
  {t:'Ștergi un text întreg',
   text:`<p>Ca să ștergi un cuvânt sau o propoziție întreagă, nu apeși <kbd>Backspace</kbd> de 30 de ori. O <strong>selectezi</strong> și apeși o singură dată <kbd>Delete</kbd> (sau <kbd>Backspace</kbd>): dispare tot ce era selectat.</p>
<p>Atenție: dacă ai ceva selectat și tastezi o literă, litera <strong>ia locul</strong> textului selectat. Dacă s-a întâmplat din greșeală, ${K('Ctrl+Z')}.</p>`,
   exemplu:foaie(`<p>Mâine vine <span class="sel">vine</span> și echipa de la Bicaz.</p>`)+`<p>Al doilea „vine” e selectat → <kbd>Delete</kbd>:</p>`+foaie(`<p>Mâine vine și echipa de la Bicaz.</p>`),
   incearca:{t:'choice',q:'Vrei să ștergi o propoziție întreagă. Cel mai repede:',o:['O selectezi și apeși Delete','Apeși Backspace pentru fiecare literă','O selectezi și apeși Ctrl+C','Apeși Enter la finalul ei'],ok:0,ajutor:'Întâi selecția, apoi o singură tastă.',why:'Selecția plus o apăsare de Delete șterge tot textul selectat.'},
   inca:[
    {t:'tf',q:'Dacă textul e selectat și tastezi o literă, litera ia locul textului selectat.',ok:true,ajutor:'Recitește „Atenție” din pas.',why:'Adevărat. De aceea te uiți dacă ai ceva selectat înainte să tastezi.'}
   ]}
 ],
 atelier:{t:'editor',titlu:'Mută, copiază, șterge',unelte:['clip'],
  intro:`<p><b>Cum lucrezi aici:</b> atinge un cuvânt ca să-l selectezi (în Word: dublu-clic sau clic și tragi). Liniuța subțire dintre cuvinte pune <b>cursorul</b> acolo (în Word: un clic). Butoanele ${K('Ctrl+X')}, ${K('Ctrl+C')}, ${K('Ctrl+V')}, <kbd>Delete</kbd> fac ce fac tastele; pe calculator merg și tastele. Aici lucrăm cu cuvinte întregi.</p>
<p><strong>Sarcina:</strong> fă documentul tău să arate ca modelul, apoi apasă <b>Verifică</b>.</p>`,
  q:'Mută propoziția „Plecăm luni la ora 8.” la începutul paragrafului.',
  start:['Aduceți apă și un sandviș. Plecăm luni la ora 8.'],tinta:['Plecăm luni la ora 8. Aduceți apă și un sandviș.'],
  tipic:['Plecăm luni la ora 8. Aduceți apă și un sandviș. Plecăm luni la ora 8.'],
  ajutor:'Selectează cele 5 cuvinte ale propoziției, apasă Ctrl+X, atinge liniuța dinaintea lui „Aduceți”, apoi Ctrl+V.',
  why:'Ai mutat propoziția: decupare (Ctrl+X), cursorul la locul nou, lipire (Ctrl+V). Originalul nu a mai rămas și la final.',
  inca:[
   {t:'editor',unelte:['clip'],q:'Copiază „Bravo!” și la sfârșitul celui de-al doilea paragraf. În primul paragraf trebuie să rămână.',
    start:['Bravo! Ai terminat primul nivel.','Ai terminat și al doilea nivel.'],tinta:['Bravo! Ai terminat primul nivel.','Ai terminat și al doilea nivel. Bravo!'],
    tipic:['Ai terminat primul nivel.','Ai terminat și al doilea nivel. Bravo!'],
    ajutor:'Copiere = Ctrl+C (originalul rămâne). Cursorul îl pui pe ultima liniuță din al doilea paragraf.',why:'Cu Ctrl+C originalul a rămas, iar Ctrl+V a pus copia la locul nou.'},
   {t:'editor',unelte:['clip'],q:'Cuvântul „vine” apare de două ori. Șterge-l pe al doilea.',
    start:['Mâine vine vine și echipa de la Bicaz.'],tinta:['Mâine vine și echipa de la Bicaz.'],
    tipic:['Mâine și echipa de la Bicaz.'],
    ajutor:'Selectează doar al doilea „vine” și apasă Delete.',why:'Ai selectat exact cuvântul în plus și l-ai șters cu o singură apăsare.'}
  ]},
 qs:[
  {t:'choice',q:'Dai triplu-clic în mijlocul unui paragraf. Ce se selectează?',o:['Tot paragraful','Un singur cuvânt','O singură literă','Tot documentul'],ok:0,why:'Triplu-clicul selectează paragraful în care ai dat clic.'},
  {t:'choice',q:'Vrei aceeași propoziție și la începutul, și la sfârșitul textului. Ce folosești?',o:['Ctrl+C, apoi Ctrl+V','Ctrl+X, apoi Ctrl+V','Delete, apoi Ctrl+V','Ctrl+V, apoi Ctrl+C'],ok:0,ajutor:'Originalul trebuie să rămână: copiere sau mutare?',why:'Copierea (Ctrl+C) lasă originalul pe loc, iar Ctrl+V pune încă o dată textul.'},
  {t:'order',q:'Vrei să muți un cuvânt la finalul propoziției. Pune pașii în ordine.',items:['Dai dublu-clic pe cuvânt','Apeși Ctrl+X','Dai clic la finalul propoziției','Apeși Ctrl+V'],why:'Selectezi cuvântul, îl decupezi, alegi locul nou cu un clic, apoi lipești.'},
  {t:'tf',q:'Ai selectat un cuvânt întreg și apeși o dată Delete: dispare tot cuvântul, nu doar o literă.',ok:true,why:'Adevărat. Cu selecție, Delete șterge tot textul selectat.'},
  {t:'editor',unelte:['clip'],q:'Mută propoziția „La final, salvați lucrarea.” la începutul paragrafului.',
   start:['Închideți calculatoarele. La final, salvați lucrarea.'],tinta:['La final, salvați lucrarea. Închideți calculatoarele.'],
   tipic:['La final, salvați lucrarea. Închideți calculatoarele. La final, salvați lucrarea.'],
   ajutor:'Mutare = Ctrl+X, apoi Ctrl+V la locul nou.',why:'Decupare, cursorul la început, lipire: propoziția e acum o singură dată, la început.'}
 ]},

/* ================= 4. Caractere (lecția 6) ================= */
{t:'Caractere',lectii:[6],continuturi:[P.instrumente,P.formatare],
 obiectiv:'schimbi cum arată literele — mărime, aldin, cursiv, subliniat — doar pe textul selectat.',
 pasi:[
  {t:'Grupul Font',
   text:`<p>Formatarea <strong>caracterelor</strong> schimbă cum arată literele. Uneltele stau pe fila <strong>Pornire (Home)</strong>, în grupul <mark>Font</mark>:</p>
<ul><li>caseta cu <strong>numele fontului</strong> (tipul de literă): Calibri, Arial, Times New Roman;</li>
<li>caseta cu <strong>mărimea</strong> literelor;</li>
<li>butoanele <strong>B</strong>, <em>I</em> și <u>U</u>.</li></ul>
<p>Ține mouse-ul deasupra unui buton: Word îți arată numele lui și scurtătura.</p>
${fig('grup-font.webp',308,90,'Grupul Font din panglica Word, cu butoanele B, I și U încadrate, plus caseta de font Calibri și caseta de mărime 20','Grupul <b>Font</b> de pe fila <b>Pornire (Home)</b>: caseta cu numele fontului (Calibri), caseta cu mărimea (20) și butoanele <b>B</b>, <b>I</b>, <b>U</b>, încadrate.')}`,
   incearca:{t:'match',q:'Potrivește unealta din grupul Font cu ce face.',pairs:[['Caseta cu numele fontului','Tipul de literă, de exemplu Arial'],['Caseta cu mărimea','Cât de mari sunt literele'],['Butoanele B, I, U','Aldin, cursiv, subliniat']],ajutor:'Recitește lista din pas, în ordine.',why:'Fontul = tipul de literă; mărimea = cât de mari; B, I, U = aldin, cursiv, subliniat.'},
   inca:[
    {t:'choice',q:'Cum afli numele unui buton pe care nu-l cunoști?',o:['Ții mouse-ul deasupra lui','Apeși pe el de trei ori','Cauți pe bara de stare','Închizi documentul'],ok:0,ajutor:'Ultima propoziție a pasului.',why:'Word îți arată numele butonului și scurtătura când ții mouse-ul pe el.'}
   ]},
  {t:'Mărimea, în puncte',
   text:`<p>Mărimea literelor se măsoară în <mark>puncte (pt)</mark>. Cu cât numărul e <strong>mai mare</strong>, cu atât literele sunt <strong>mai mari</strong>.</p>
<p>Textul obișnuit al unei compuneri are de obicei 11 sau 12 pt. Un titlu are mai mult, de exemplu 18 sau 24 pt.</p>
<p>Mărimea o alegi din caseta cu numere a grupului Font, după ce ai selectat textul.</p>`,
   exemplu:foaie(`<p style="font-size:11pt;margin:0">Text de 11 pt</p><p style="font-size:14pt;margin:0">Text de 14 pt</p><p style="font-size:18pt;margin:0">Text de 18 pt</p><p style="font-size:24pt;margin:0">Text de 24 pt</p>`),
   incearca:{t:'choice',q:'Care mărime face literele cele mai mari?',o:['24 pt','11 pt','14 pt','18 pt'],ok:0,ajutor:'Număr mai mare = litere mai mari.',why:'24 e cel mai mare număr, deci cele mai mari litere.'},
   inca:[
    {t:'choice',q:'În ce se măsoară mărimea literelor în Word?',o:['În puncte (pt)','În centimetri','În procente','În kilobyți'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Mărimea fontului se dă în puncte: 11 pt, 14 pt, 24 pt…'}
   ]},
  {t:'B, I, U: aldin, cursiv, subliniat',
   text:`<ul><li><strong>Aldin</strong> (<em>Bold</em>): butonul <b>B</b> sau ${K('Ctrl+B')} — literele se îngroașă;</li>
<li><em>Cursiv</em> (<em>Italic</em>): butonul <i>I</i> sau ${K('Ctrl+I')} — literele se înclină;</li>
<li><u>Subliniat</u> (<em>Underline</em>): butonul <u>U</u> sau ${K('Ctrl+U')} — apare o linie dedesubt.</li></ul>
<p>Același buton apăsat <strong>încă o dată</strong> pe același text scoate formatarea.</p>
${fig('text-formatat.webp',870,80,'Un rând de text în Word cu trei cuvinte încadrate: unul aldin, unul cursiv și unul subliniat','Același rând, cu trei formatări: <b>sâmbătă</b> e aldin, <em>Cetatea Neamțului</em> e cursiv, iar <u>ora opt</u> e subliniat.')}`,
   altfel:`<p>Literele vin de la numele în engleză: <b>B</b> de la <em>Bold</em> (îngroșat), <b>I</b> de la <em>Italic</em> (înclinat), <b>U</b> de la <em>Underline</em> (linie dedesubt). Scurtăturile folosesc aceleași litere.</p>`,
   incearca:{t:'choice',q:`Ce face butonul <em>I</em>?${fig('buton-biu.webp',88,34,'Butoanele B, I și U din grupul Font al panglicii Word','Butoanele <b>B</b>, <b>I</b> și <b>U</b> din grupul Font.')}`,o:['Scrie cursiv (înclinat)','Scrie aldin (îngroșat)','Subliniază textul','Inserează o imagine'],ok:0,ajutor:'I vine de la Italic.',why:'I = Italic, adică scris cursiv (înclinat).'},
   inca:[
    {t:'tf',q:'Dacă apeși încă o dată B pe un cuvânt aldin, cuvântul nu mai e aldin.',ok:true,ajutor:'Ultima propoziție de sub listă.',why:'Adevărat. Butonul pornește și oprește formatarea.'},
    {t:'match',q:'Potrivește scurtătura cu formatarea.',pairs:[['Ctrl+B','Aldin'],['Ctrl+I','Cursiv'],['Ctrl+U','Subliniat']],ajutor:'Aceleași litere ca pe butoane.',why:'B = Bold (aldin), I = Italic (cursiv), U = Underline (subliniat).'}
   ]},
  {t:'Regula de aur: selectezi, apoi formatezi',
   text:`<p>Formatarea caracterelor se aplică <strong>doar textului selectat</strong>. De aceea: <mark>întâi selectezi, apoi formatezi</mark>.</p>
<ol><li>selectezi exact textul din cerință (dublu-clic pe cuvânt);</li>
<li>apeși butonul sau scurtătura;</li>
<li>dai clic în altă parte și te uiți la rezultat.</li></ol>
<p>Greșeala tipică: selectezi tot rândul când cerința cerea un singur cuvânt. Atunci se îngroașă tot rândul.</p>`,
   exemplu:`<p>Cerința: „Atenție!” aldin.</p>`+foaie(`<p><span class="sel">Atenție!</span> Mâine avem lucrare.</p>`)+`<p>Dublu-clic pe „Atenție!” → ${K('Ctrl+B')} → clic în altă parte:</p>`+foaie(`<p><b>Atenție!</b> Mâine avem lucrare.</p>`),
   incearca:{t:'order',q:'Vrei ca un cuvânt să fie subliniat. Pune pașii în ordine.',items:['Selectezi cuvântul','Apeși butonul U','Dai clic în altă parte și verifici'],ajutor:'Regula de aur: ce vine întâi?',why:'Întâi selectezi, apoi formatezi, apoi verifici.'},

/* ================= 5. Paragrafe (lecția 6) ================= */
{t:'Paragrafe',lectii:[6],continuturi:[P.formatare],
 obiectiv:'vezi unde se termină fiecare paragraf, îl aliniezi și alegi lista potrivită.',
 pasi:[
  {t:'Ce e un paragraf; butonul ¶',
   text:`<p>Un <mark>paragraf</mark> e tot textul scris până apeși <kbd>Enter</kbd>. Poate fi un rând de titlu sau zece rânduri de compunere.</p>
<p>Butonul <strong>Afișare/ascundere ¶</strong> (<em>Show/Hide ¶</em>), din grupul Paragraf (Paragraph), pune semnul <span class="pil">¶</span> la capătul fiecărui paragraf. Așa vezi unde ai apăsat <kbd>Enter</kbd>. Semnul apare doar pe ecran, nu și la tipărire.</p>
${fig('buton-pilcrow.webp',74,36,'Butonul ¶ din grupul Paragraph al panglicii Word, încadrat cu roșu','Butonul <b>¶</b> — Afișare/ascundere ¶ (Show/Hide ¶).')}`,
   exemplu:foaie(`<p>Excursie la Bicaz${PM}</p><p>Plecăm luni la ora 8, din fața școlii. Ne întoarcem seara, cu autocarul.${PM}</p><p>Aduceți apă.${PM}</p>`)+`<p>Trei semne ¶ → trei paragrafe, deși al doilea are două propoziții.</p>`,
   incearca:{t:'choice',q:`Câte paragrafe are textul acesta?${foaie(`<p>Lista de cumpărături${PM}</p><p>Pâine, lapte și mere pentru toată săptămâna, plus două caiete.${PM}</p>`)}`,o:['2','1','3','4'],ok:0,ajutor:'Numără semnele ¶.',why:'Fiecare ¶ închide un paragraf: aici sunt două.'},
   inca:[
    {t:'tf',q:'Semnul ¶ apare pe ecran, dar nu se tipărește.',ok:true,ajutor:'Ultima propoziție a pasului.',why:'Adevărat. Semnele de formatare te ajută doar pe ecran.'}
   ]},
  {t:'Alinierea paragrafului',
   text:`<p>În grupul Paragraf ai patru butoane de <mark>aliniere</mark>:</p>
<ul><li><strong>la stânga</strong> (<em>Align Left</em>) — cum scrii de obicei;</li>
<li><strong>centrat</strong> (<em>Center</em>) — pentru titluri;</li>
<li><strong>la dreapta</strong> (<em>Align Right</em>) — de exemplu pentru dată sau semnătură;</li>
<li><strong>stânga-dreapta</strong> (<em>Justify</em>) — ambele margini drepte, ca în cărți.</li></ul>
<p>Alinierea se aplică <strong>întregului paragraf</strong>: ajunge să fie cursorul în el (sau un cuvânt din el selectat).</p>
${fig('grup-paragraf.webp',302,90,'Grupul Paragraph din panglica Word, cu butoanele de liste încadrate sus și cele patru butoane de aliniere încadrate jos','Grupul <b>Paragraf (Paragraph)</b>: jos, cele patru <b>alinieri</b> — stânga, centrat, dreapta, stânga-dreapta.')}`,
   exemplu:foaie(`<p style="text-align:left">La stânga.</p><p style="text-align:center">Centrat.</p><p style="text-align:right">La dreapta.</p><p style="text-align:justify">Stânga-dreapta: rândurile lungi se întind de la o margine la alta, iar marginea din dreapta iese dreaptă, ca în paginile cărților tale.</p>`),
   incearca:{t:'choice',q:'Ce aliniere face ca textul să aibă ambele margini drepte?',o:['Stânga-dreapta (Justify)','Centrat (Center)','La stânga (Align Left)','La dreapta (Align Right)'],ok:0,ajutor:'„Ca în cărți”.',why:'Stânga-dreapta (Justify) întinde rândurile până la ambele margini.'},
   inca:[
    {t:'tf',q:'Alinierea se aplică întregului paragraf, nu unui singur cuvânt.',ok:true,ajutor:'Ultima propoziție de sub listă.',why:'Adevărat. Alinierea e o formatare de paragraf.'}
   ]},
  {t:'Titlul se centrează cu butonul',
   text:`<p>Un titlu se aduce la mijloc cu butonul <strong>Centrat</strong>, nu apăsând bara de spațiu de multe ori.</p>
<p>De ce? Spațiile puse de mână se strică imediat ce schimbi fontul sau mărimea: titlul fuge într-o parte. Butonul Centrat ține titlul la mijloc orice ai schimba.</p>
<p>Pași: pui cursorul în titlu (sau îl selectezi) și apeși Centrat.</p>`,
   altfel:`<p>E ca atunci când vrei să pui o poză la mijlocul peretelui: poți număra pașii de la colț (spațiile) sau poți măsura mijlocul peretelui (butonul). Dacă muți mobila, numărătoarea nu mai e bună; mijlocul rămâne mijloc.</p>`,
   incearca:{t:'tf',q:'Ca să centrezi un titlu, apeși bara de spațiu până ajunge la mijloc.',ok:false,ajutor:'Ce se întâmplă cu spațiile când schimbi mărimea?',why:'Fals. Folosești butonul Centrat; spațiile se strică imediat ce schimbi fontul sau mărimea.'},
   inca:[
    {t:'choice',q:'Titlul tău e la stânga. Cum îl aduci la mijloc?',o:['Pui cursorul în titlu și apeși Centrat','Apeși bara de spațiu de 20 de ori','Apeși Enter înaintea lui','Îl scrii cu litere mari'],ok:0,ajutor:'Ultimul paragraf al pasului.',why:'Cursorul în titlu, apoi butonul Centrat.'}
   ]},
  {t:'Liste: cu marcatori sau numerotate',
   text:`<p>Tot în grupul Paragraf, sus, sunt butoanele de <mark>liste</mark> (vezi captura de la pasul 2):</p>
<ul><li>listă cu <strong>marcatori</strong> (•) — când <strong>ordinea nu contează</strong>: ce iei în excursie, culorile preferate;</li>
<li>listă <strong>numerotată</strong> (1, 2, 3) — când <strong>ordinea contează</strong>: pașii unei rețete, pașii unui experiment.</li></ul>
<p>Întrebarea de pus: „Contează ce vine întâi?” Dacă da, numerotată.</p>`,
   exemplu:foaie(`<p><b>În rucsac:</b></p><p>• apă<br>• sandviș<br>• pelerină</p><p><b>Clătite:</b></p><p>1. Bați ouăle cu laptele.<br>2. Adaugi făina.<br>3. Prăjești în tigaie.</p>`),
   incearca:{t:'classify',q:'Ce fel de listă folosești?',cats:['Cu marcatori (•)','Numerotată (1, 2, 3)'],items:[['Ce iei în excursie',0],['Pașii unui experiment',1],['Culorile tale preferate',0],['Pașii de pornire a unui aparat',1]],ajutor:'Întreabă-te: contează ce vine întâi?',why:'Unde ordinea contează, numerotată; unde nu, cu marcatori.'},
   inca:[
    {t:'choice',q:'Scrii pașii unei rețete de clătite. Ce listă folosești?',o:['Numerotată (1, 2, 3)','Cu marcatori (•)','Nicio listă, doar spații','Un titlu centrat'],ok:0,ajutor:'La rețetă, ordinea pașilor contează?',why:'La o rețetă ordinea contează, deci listă numerotată.'}
   ]}
 ],

 qs:[
  {t:'choice',q:'Vrei ca textul unei compuneri să aibă marginea din stânga și cea din dreapta drepte, ca într-o carte. Ce aliniere alegi?',o:['Stânga-dreapta (Justify)','Centrat (Center)','La dreapta (Align Right)','La stânga (Align Left)'],ok:0,why:'Stânga-dreapta întinde rândurile până la ambele margini.'},

  {t:'editor',unelte:['font','aliniere'],q:'Titlul: centrat și 18 pt. Paragraful: stânga-dreapta.',

/* ================= 6. Vânătoarea de greșeli (lecția 8) ================= */
{t:'Vânătoarea de greșeli',lectii:[8],continuturi:[P.reguli],
 obiectiv:'găsești și repari greșelile de tehnoredactare: spații duble, spații lângă punctuație și paranteze.',
 pasi:[
  {t:'Un singur spațiu între cuvinte',
   text:`<p>Un document arată îngrijit când respecți regulile de <mark>tehnoredactare</mark>. Prima regulă: între două cuvinte pui <strong>un singur spațiu</strong>.</p>
<p>Două spații la rând nu se văd ușor pe ecran. De aceea pornești butonul <span class="pil">¶</span>: fiecare spațiu apare ca un <strong>punct mic</strong> (·), deci două puncte la rând = spațiu dublu.</p>
${fig('semne-formatare.webp',870,150,'Text în Word cu butonul ¶ pornit: între cuvinte apar puncte mici, iar la capătul fiecărui paragraf apare semnul ¶','Cu butonul <b>¶</b> pornit: fiecare spațiu e un <b>punct mic</b>, iar la capătul paragrafului stă <b>¶</b>. Semnele nu se tipăresc.')}`,
   exemplu:`<p>Cu ¶ pornit:</p>${foaie('<p>Luni<span class="pm">··</span>mergem<span class="pm">·</span>la<span class="pm">·</span>teatru.<span class="pm">¶</span></p>')}<p>Între „Luni” și „mergem” sunt <b>două</b> puncte: un spațiu e în plus.</p>`,
   incearca:{t:'hunt',spatii:true,q:'Butonul ¶ e pornit: fiecare spațiu apare ca un punct (·). Apasă pe spațiul dublu, apoi verifică.',src:'Mâine[[  |Două spații în loc de unul.]]mergem la teatru.',ajutor:'Caută două puncte lipite.',why:'Între „Mâine” și „mergem” erau două spații.'},
   inca:[
    {t:'hunt',spatii:true,q:'Aici sunt 2 spații duble. Apasă pe ele, apoi verifică.',src:'Avem[[  |Două spații în loc de unul.]]ora de sport în sala[[  |Două spații în loc de unul.]]mare.',ajutor:'Uită-te după fiecare cuvânt: unul sau două puncte?',why:'Fiecare spațiu dublu devine un singur spațiu.'}
   ]},
  {t:'Punctuația se lipește de cuvântul dinainte',
   text:`<p>A doua regulă: semnele de punctuație — virgula, punctul, două puncte, „!” și „?” — se <strong>lipesc</strong> de cuvântul dinaintea lor:</p>
<ul><li><strong>fără spațiu înainte</strong> de semn;</li>
<li><strong>un spațiu după</strong> semn, dacă mai urmează text.</li></ul>
<p>Greșelile des întâlnite: un spațiu înainte de virgulă sau lipsa spațiului după ea.</p>`,
   exemplu:`<p>Greșit: <span class="mono">mere·,·pere·.</span> și <span class="mono">mere,pere.</span><br>Corect: <span class="mono">mere,·pere.</span></p>`,
   altfel:`<p>Gândește-te la virgulă ca la un vagon lipit de locomotiva din fața lui: nu lași loc între ele. După vagon lași o distanță (un spațiu) până la următorul cuvânt.</p>`,
   incearca:{t:'choice',q:'Care variantă e scrisă corect?',o:['Am cumpărat mere, pere și prune.','Am cumpărat mere , pere și prune .','Am cumpărat mere ,pere și prune.','Am cumpărat mere,pere și prune.'],ok:0,ajutor:'Nimic înainte de semn, un spațiu după.',why:'Virgula și punctul se lipesc de cuvântul dinainte, iar după virgulă urmează un spațiu.'},
   inca:[
    {t:'hunt',spatii:true,q:'Apasă pe cele 2 greșeli, apoi verifică.',src:'Vii la film[[ |Spațiu înainte de „?”.]]? Începe la ora[[ 5,iar |După virgulă trebuie un spațiu: „5, iar”.]] noi plecăm la 4.',ajutor:'Uită-te în jurul semnelor „?” și „,”.',why:'Nu pui spațiu înainte de „?”, dar pui unul după virgulă.'}
   ]},
  {t:'Parantezele se lipesc de textul din ele',
   text:`<p>A treia regulă: <strong>parantezele</strong> se lipesc de textul din interior.</p>
<ul><li>corect: <span class="mono">(două ore)</span>;</li>
<li>greșit: <span class="mono">( două ore )</span>.</li></ul>
<p>În afara parantezelor pui spații normale: <span class="mono">Durează·(două·ore)·și·e·gratuit.</span></p>`,
   incearca:{t:'choice',q:'Care variantă respectă regula parantezelor?',o:['(2 ore)','( 2 ore )','( 2 ore)','(2 ore )'],ok:0,ajutor:'Nimic între paranteză și text.',why:'Paranteza se lipește de textul din interior, în ambele părți.'},
   inca:[
    {t:'tf',q:'„Aduceți o geacă ( poate plouă).” e scris corect.',ok:false,ajutor:'Uită-te imediat după paranteza deschisă.',why:'Fals. După „(” nu pui spațiu: corect e „(poate plouă)”.'}
   ]},
  {t:'Strategia vânătorului',
   text:`<p>Când verifici un text, nu-l citești o dată „din ochi”. Folosești o <mark>strategie</mark>, pas cu pas:</p>
<ol><li>pornești butonul <span class="pil">¶</span>;</li>
<li>cauți două puncte la rând (spații duble);</li>
<li>te uiți la fiecare semn de punctuație: nimic înainte, un spațiu după;</li>
<li>verifici parantezele și diacriticele: ă, â, î, ș, ț.</li></ol>
<p>Scrisul fără diacritice („scoala” în loc de „școala”) e tot o greșeală de tehnoredactare.</p>`,
   incearca:{t:'hunt',spatii:true,q:'Folosește strategia: sunt 3 greșeli. Apasă pe ele, apoi verifică.',src:'Tabăra începe[[  |Două spații în loc de unul.]]luni[[ |Spațiu înainte de virgulă.]], la munte. Aduceți saci de dormit ([[ |Spațiu lipit în interiorul parantezei.]]nu pături).',ajutor:'Pasul 2: puncte duble. Pasul 3: virgula. Pasul 4: paranteza.',why:'Spațiul dublu, spațiul dinaintea virgulei și spațiul din paranteză.'},
   inca:[
    {t:'tf',q:'„Mergem la scoala.” are o greșeală de tehnoredactare: lipsește o diacritică.',ok:true,ajutor:'Pasul 4 al strategiei.',why:'Adevărat. Corect e „școala”, cu ș.'}
   ]}
 ],
 atelier:{t:'corectura',titlu:'Repară textul, cu ¶ pornit',pil:true,

/* ================= 7. Afișul clasei (lecțiile 6, 9) — FINAL ================= */
{t:'Afișul clasei',final:true,lectii:[6,9],continuturi:[P.formatare,P.specificatii],
 obiectiv:'faci un afiș după o listă de cerințe (specificații), folosind tot ce ai învățat, și îl salvezi cu un nume clar.',
 pasi:[
  {t:'Lucrul după cerințe',
   text:`<p>Un document „după <mark>specificații</mark>” înseamnă că primești o listă de cerințe: ce mărime are titlul, cum e aliniat, ce cuvânt e aldin.</p>
<p>Strategia, pas cu pas:</p>
<ol><li>citești <strong>toate</strong> cerințele o dată;</li>
<li>iei <strong>prima</strong> cerință: selectezi exact textul ei;</li>
<li>aplici formatarea cerută;</li>
<li>treci la cerința următoare; la final recitești lista și compari cu documentul.</li></ol>`,
   altfel:`<p>E ca o rețetă: nu pui toate ingredientele deodată. Citești rețeta, apoi faci pașii unul câte unul și bifezi ce ai făcut.</p>`,
   incearca:{t:'order',q:'Pune pașii lucrului după cerințe în ordine.',items:['Citești toate cerințele','Selectezi textul primei cerințe','Aplici formatarea cerută','Treci la cerința următoare'],ajutor:'Întâi citești tot, apoi lucrezi cerință cu cerință.',why:'Citești tot, apoi fiecare cerință: selectezi, formatezi, treci mai departe.'},
   inca:[
    {t:'tf',q:'La final recitești cerințele și compari documentul cu ele.',ok:true,ajutor:'Pasul 4.',why:'Adevărat. Așa prinzi cerința uitată.'}
   ]},
  {t:'Caractere sau paragraf?',
   text:`<p>Fiecare cerință e de unul din două feluri:</p>
<ul><li><strong>formatare de caractere</strong>: aldin, cursiv, subliniat, mărimea. Se aplică doar textului <strong>selectat</strong>;</li>
<li><strong>formatare de paragraf</strong>: alinierea (la stânga, centrat, la dreapta, stânga-dreapta). Se aplică <strong>întregului paragraf</strong>.</li></ul>
<p>Când știi felul cerinței, știi ce trebuie să selectezi: un cuvânt anume sau doar paragraful.</p>`,
   exemplu:`<p>„Titlul aldin, 24 pt, centrat”:</p><ul><li>aldin, 24 pt → caractere: selectezi <b>tot</b> titlul;</li><li>centrat → paragraf: ajunge cursorul în titlu.</li></ul>`,
   incearca:{t:'classify',q:'Formatare de caractere sau de paragraf?',cats:['De caractere','De paragraf'],items:[['Aldin',0],['24 pt',0],['Centrat',1],['Stânga-dreapta',1],['Subliniat',0]],ajutor:'Alinierile sunt ale paragrafului.',why:'Aldin, subliniat și mărimea sunt ale caracterelor; alinierile sunt ale paragrafului.'},
   inca:[
    {t:'tf',q:'Centrarea titlului e o formatare de paragraf.',ok:true,ajutor:'Centrat e o aliniere.',why:'Adevărat. Toate alinierile sunt formatări de paragraf.'}
   ]},
  {t:'Modelul afișului',
   text:`<p>Afișul serbării are trei paragrafe și cinci cerințe:</p>
<ul><li><strong>titlul</strong>: aldin, 24 pt, centrat;</li>
<li><strong>paragraful lung</strong>: aliniat stânga-dreapta, iar „Vineri,” aldin;</li>
<li><strong>ultimul rând</strong>: cuvântul „joi.” subliniat.</li></ul>
<p>Uită-te cum arată gata, în Word:</p>
${fig('afis-model.webp',900,209,'Afișul model în Word: titlul Serbarea de iarnă aldin și centrat, paragraful aliniat pe ambele margini cu Vineri aldin, iar joi subliniat','Afișul gata: <b>titlul</b> aldin, 24 pt și centrat; <b>paragraful</b> stânga-dreapta, cu „Vineri,” aldin; „joi.” subliniat.')}`,
   incearca:{t:'choice',q:'Ce selectezi înainte să apeși butonul U, pentru ultima cerință?',o:['Doar cuvântul „joi.”','Tot ultimul rând','Titlul','Tot documentul'],ok:0,ajutor:'Sublinierea e o formatare de caractere.',why:'Formatarea de caractere se aplică doar textului selectat: aici, doar „joi.”.'},
   inca:[
    {t:'choice',q:'Câte cuvinte faci aldine în paragraful lung?',o:['Unul: „Vineri,”','Toate','Niciunul','Primele trei'],ok:0,ajutor:'Recitește a doua cerință.',why:'Doar „Vineri,” e aldin; restul paragrafului rămâne normal.'}
   ]},
  {t:'Salvezi cu un nume clar',
   text:`<p>Afișul e gata? Îl <strong>salvezi</strong> cu ${K('Ctrl+S')}. Prima dată Word te întreabă numele și locul.</p>
<ul><li><strong>numele</strong>: clar, fără spații, de forma <code>Nume_Prenume_afis.docx</code> (de exemplu <code>Popescu_Ana_afis.docx</code>);</li>
<li><strong>locul</strong>: folderul clasei, ca să-l găsească profesorul.</li></ul>
<p>Un nume ca „Document1” sau „asdf” nu spune nimic: peste o săptămână nici tu nu mai știi ce e în el.</p>`,
   incearca:{t:'choice',q:'Ce nume e cel mai clar pentru afișul tău?',o:['Popescu_Ana_afis.docx','Document1.docx','afis final nou 2.docx','asdf.docx'],ok:0,ajutor:'Nume_Prenume_afis.',why:'Numele spune cine l-a făcut și ce e, fără spații.'},
   inca:[
    {t:'tf',q:'La prima salvare cu Ctrl+S, Word te întreabă numele și locul fișierului.',ok:true,ajutor:'Prima propoziție a pasului.',why:'Adevărat. După aceea, Ctrl+S salvează peste același fișier.'}
   ]}
 ],

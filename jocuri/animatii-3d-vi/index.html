/* ================= 6. Controlez animația (lecția 32) ================= */
{t:'Controlez animația',lectii:[32],continuturi:['Controlul animației prin structuri de control sau de la tastatură'],
 obiectiv:'miști un personaj cu săgețile de la tastatură și alegi între repetă, la infinit și dacă … atunci.',
 pasi:[
  {t:'Evenimentele: blocurile care încep cu „când”',
   text:`<p>Un script pornește doar când se întâmplă ceva: un <mark>eveniment</mark>. Blocurile-eveniment sunt în categoria <strong>Evenimente</strong> (galben), încep cu „când” și au capul rotunjit, ca o pălărie: nimic nu se pune deasupra lor.</p>
<ul><li><em>când se dă click pe steag</em>: pornește la steagul verde;</li>
<li><em>când tasta spațiu este apăsată</em>: pornește la fiecare apăsare a tastei alese. Tasta o schimbi din lista din bloc: spațiu, săgeată dreapta, săgeată stânga, o literă…</li></ul>`,
   exemplu:`${pre('când tasta spațiu este apăsată\nspune Hop! pentru 1 secunde')}<p>De fiecare dată când apeși <kbd>Spațiu</kbd>, pisica spune „Hop!”.</p>`,
   incearca:{t:'choice',q:'Ce bloc pornește un script când apeși săgeata stânga?',o:['când tasta săgeată stânga este apăsată','când se dă click pe steag','repetă 10','modifică x cu -10'],ok:0,ajutor:'Blocurile-eveniment încep cu „când”.',why:'Blocurile „când …” pornesc scripturile. Celelalte doar fac ceva după ce scriptul a pornit.'},
   inca:[
    {t:'tf',q:'Poți pune un bloc deasupra lui „când se dă click pe steag”.',ok:false,ajutor:'Forma de pălărie.',why:'Fals. Blocurile-eveniment stau mereu primele: au capul rotunjit tocmai ca să nu se pună nimic deasupra.'}
   ]},
  {t:'Săgețile mută personajul',
   text:`<p>Ca să muți un personaj de la tastatură, faci câte un script pentru fiecare tastă. <strong>Strategia</strong>, pentru fiecare tastă:</p>
<ol><li>Pui evenimentul: <em>când tasta săgeată … este apăsată</em>.</li>
<li>Alegi <strong>axa</strong>: stânga-dreapta = <strong>x</strong>, sus-jos = <strong>y</strong>.</li>
<li>Alegi <strong>semnul</strong>: dreapta și sus = plus; stânga și jos = minus.</li>
<li>Sub eveniment pui <em>modifică x cu …</em> sau <em>modifică y cu …</em>.</li></ol>
${fig('scratch-tastatura-control.webp',760,408,'Scripturi Scratch: când tasta săgeată dreapta este apăsată modifică x cu 10, când tasta săgeată stânga este apăsată modifică x cu -10, și la infinit cu dacă atinge marginea? atunci','Săgețile mută pisica: <em>modifică x cu 10</em> spre dreapta, <em>cu -10</em> spre stânga.')}`,
   exemplu:`${pre('când tasta săgeată dreapta este apăsată\nmodifică x cu 10\n\ncând tasta săgeată stânga este apăsată\nmodifică x cu -10')}<p>Două scripturi separate, câte unul pe tastă.</p>`,
   altfel:`<p>E ca o telecomandă cu butoane: fiecare buton (tastă) are treaba lui. Butonul „dreapta” adună 10 la x, butonul „stânga” scade 10.</p>`,
   incearca:{t:'choice',q:'Sub <em>când tasta săgeată stânga este apăsată</em>, ce pui ca personajul să meargă spre stânga?',o:['modifică x cu -10','modifică x cu 10','modifică y cu 10','modifică y cu -10'],ok:0,ajutor:'Strategia: axa (stânga-dreapta = x), apoi semnul (stânga = minus).',why:'Stânga-dreapta e axa x; spre stânga x scade, deci adaugi un număr negativ.'},
   inca:[
    {t:'choice',q:'Ce pui sub <em>când tasta săgeată sus este apăsată</em>?',o:['modifică y cu 10','modifică y cu -10','modifică x cu 10','modifică x cu -10'],ok:0,ajutor:'Sus-jos = y; sus = plus.',why:'Spre sus y crește, deci modifici y cu un număr pozitiv.'}
   ]},
  {t:'Repetă și la infinit',
   text:`<p><mark>Structurile de control</mark> (categoria Control) spun de câte ori se fac blocurile din interiorul lor:</p>
<ul><li><em>repetă 10</em> le face de <strong>exact 10</strong> ori, apoi scriptul merge mai departe;</li>
<li><em>la infinit</em> le face <strong>mereu</strong>, fără oprire, până apeși <strong>Stop</strong>.</li></ul>
<p>Întrebarea: <strong>știu de câte ori?</strong> Da → <em>repetă</em>. Mereu → <em>la infinit</em>.</p>`,
   exemplu:`<p>O stea care clipește de 5 ori: <em>repetă 5</em>. Norii care plutesc tot timpul: <em>la infinit</em>.</p>`,
   incearca:{t:'tf',q:'Blocul „la infinit” oprește singur animația după 10 repetări.',ok:false,ajutor:'Cine îl oprește?',why:'Fals. „la infinit” nu se oprește singur; îl oprești cu Stop. Pentru un număr fix folosești „repetă”.'}},
  {t:'dacă … atunci: doar uneori',
   text:`<p><em>dacă … atunci</em> face blocurile din interiorul lui <strong>doar când condiția e adevărată</strong>. Condiția e un bloc cu colțuri ascuțite, de exemplu <em>atinge marginea?</em> (categoria Detectare).</p>
<p>Ca să verifice condiția tot timpul, pui <em>dacă … atunci</em> în interiorul lui <em>la infinit</em>: la fiecare repetare, Scratch se uită din nou.</p>
<p>Acum ai trei întrebări pentru orice structură: <strong>de câte ori știu?</strong> (repetă) · <strong>mereu?</strong> (la infinit) · <strong>doar uneori, când ceva e adevărat?</strong> (dacă … atunci).</p>`,
   exemplu:`${pre('când se dă click pe steag\nla infinit\n  mergi 10 pași\n  dacă atinge marginea? atunci\n    rotește-te 180 grade')}<p>Pisica merge mereu; doar când atinge marginea, se întoarce.</p>`,
   incearca:{t:'classify',q:'Ce structură de control potrivești?',cats:['repetă …','la infinit','dacă … atunci'],items:[['pisica sare de exact 3 ori',0],['morișca se învârte tot timpul',1],['mingea ricoșează doar când atinge marginea',2],['steaua clipește de 5 ori',0]],ajutor:'Cele trei întrebări din pas.',why:'Știi de câte ori? „repetă”. Mereu? „la infinit”. Doar uneori? „dacă … atunci”.'},
   inca:[
    {t:'choice',q:'De ce pui <em>dacă atinge marginea? atunci</em> în interiorul lui <em>la infinit</em>?',o:['Ca Scratch să verifice condiția tot timpul','Ca scriptul să se oprească imediat','Ca personajul să devină invizibil','Ca să nu mai trebuiască steagul verde'],ok:0,ajutor:'A doua propoziție din pas.',why:'Singur, „dacă” verifică o singură dată. În „la infinit” verifică la fiecare repetare.'}
   ]}
 ],
 atelier:{t:'script',titlu:'Telecomanda: pisica pe săgeți',
  intro:`<p><strong>Sarcina:</strong> fă două scripturi: la <b>săgeata dreapta</b> pisica merge 10 pixeli spre dreapta, la <b>săgeata stânga</b> 10 spre stânga. Pune evenimentul, apoi blocul de sub el, apoi al doilea eveniment și blocul lui. Probează cu butoanele <b>Săgeata →</b> și <b>Săgeata ←</b>, apoi <b>Rulează testele</b>.</p>`,
  q:'Fă scripturile pentru săgeata dreapta și săgeata stânga.',stare:{x:0,y:0},
  paleta:['dreapta','stanga','x10','xm10','y10','ym10'],start:[],
  solutie:[['dreapta',0],['x10',0],['stanga',0],['xm10',0]],
  gresit:[['dreapta',0],['xm10',0],['stanga',0],['x10',0]],
  checks:[{hat:'dreapta',ce:'Există scriptul „când tasta săgeată dreapta este apăsată”'},{hat:'stanga',ce:'Există scriptul „când tasta săgeată stânga este apăsată”'},{dupa:'dreapta',dx:'+',dy:0,ce:'Săgeata dreapta o mută spre dreapta'},{dupa:'stanga',dx:'-',dy:0,ce:'Săgeata stânga o mută spre stânga'},{curat:true,ce:'Niciun bloc nu stă liber'}],
  ajutor:'Strategia: evenimentul, axa x, semnul (dreapta = plus, stânga = minus).',why:'Fiecare tastă are scriptul ei; axa x și semnul hotărăsc direcția.',
  inca:[{t:'script',q:'Încă una: acum <b>sus</b> și <b>jos</b>, cu câte 10 pixeli.',stare:{x:0,y:0},paleta:['sus','jos','x10','xm10','y10','ym10'],start:[],
   solutie:[['sus',0],['y10',0],['jos',0],['ym10',0]],gresit:[['sus',0],['x10',0],['jos',0],['xm10',0]],
   checks:[{dupa:'sus',dy:'+',dx:0,ce:'Săgeata sus o urcă'},{dupa:'jos',dy:'-',dx:0,ce:'Săgeata jos o coboară'},{curat:true,ce:'Niciun bloc nu stă liber'}],
   ajutor:'Sus-jos = axa y. Sus = plus, jos = minus.',why:'Pentru sus și jos schimbi y, nu x.'}]},
 qs:[
  {t:'choice',q:'Ce bloc pornește un script când apeși tasta spațiu?',o:['când tasta spațiu este apăsată','când se dă click pe steag','la infinit','repetă 10'],ok:0,why:'Blocurile care încep cu „când” sunt evenimente: pornesc scriptul. „la infinit” și „repetă” doar repetă ce e în ele.'},
  {t:'choice',q:'Sub „când tasta săgeată stânga este apăsată” ce pui ca personajul să meargă spre stânga?',o:['modifică x cu -10','modifică x cu 10','modifică y cu 10','modifică y cu -10'],ok:0,why:'Stânga-dreapta e axa x. Spre stânga x scade, deci adaugi un număr negativ. y ar muta personajul în sus sau în jos.'},
  {t:'classify',q:'Ce structură de control potrivești?',cats:['repetă …','la infinit','dacă … atunci'],items:[['iepurele sare de exact 4 ori',0],['elicea se învârte tot timpul',1],['se aude „Au!” doar când liliacul atinge pisica',2],['becul clipește de 3 ori',0],['norii plutesc până apeși Stop',1],['pisica se întoarce doar când atinge marginea',2]],ajutor:'De câte ori știu? Mereu? Doar uneori?',why:'Știi de câte ori? „repetă”. Mereu? „la infinit”. Doar uneori, când ceva e adevărat? „dacă … atunci”.'},
  {t:'tf',q:'„la infinit” se oprește doar când apeși Stop.',ok:true,why:'Adevărat. „la infinit” nu se oprește singur. Pentru un număr fix de repetări folosești „repetă”.'},
  {t:'choice',q:'Ce pui sub „când tasta săgeată jos este apăsată”?',o:['modifică y cu -10','modifică y cu 10','modifică x cu -10','modifică x cu 10'],ok:0,ajutor:'Sus-jos = y; jos = minus.',why:'Spre jos y scade, deci modifici y cu un număr negativ.'}
 ]},

/* ================= 7. Modele 3D (lecția 33) ================= */
{t:'Modele 3D',lectii:[33],continuturi:['Forme geometrice tridimensionale','Text tridimensional','Operații specifice modelării 3D disponibile în aplicațiile pentru copii'],
 obiectiv:'deosebești 2D de 3D, știi axele X, Y, Z și construiești din corpuri simple un obiect, cu copiere, gaură și grupare.',
 pasi:[
  {t:'2D și 3D: adâncimea',
   text:`<p>Scena din Scratch e <mark>2D</mark> (două dimensiuni): are lățime și înălțime, ca o foaie.</p>
<p>Un model <mark>3D</mark> (trei dimensiuni) are în plus <mark>adâncime</mark>. De aceea îl poți <strong>roti</strong> și privi din toate părțile, și din spate, ca pe o jucărie ținută în mână.</p>
<p>Formele 2D sunt plane: pătrat, cerc, triunghi. Corpurile 3D au volum: cub, sferă, piramidă.</p>`,
   exemplu:`<p>Un <b>pătrat</b> desenat pe foaie e 2D. Un <b>zar</b> e un cub, 3D: îl întorci și vezi alte fețe. Un <b>cerc</b> e 2D; o <b>minge</b> e o sferă, 3D.</p>`,
   altfel:`<p>O fotografie cu o minge e 2D: oricum ai întoarce foaia, nu vezi spatele mingii. Mingea adevărată e 3D: o întorci și vezi partea cealaltă.</p>`,
   incearca:{t:'choice',q:'Ce are în plus un model 3D față de un desen 2D?',o:['Adâncime','Culoare','Sunet','Mai mulți pixeli'],ok:0,ajutor:'A treia dimensiune.',why:'Și un desen 2D are culori și pixeli. Adâncimea îți permite să rotești obiectul și să-l vezi din spate.'},
   inca:[
    {t:'classify',q:'Formă plană (2D) sau corp (3D)?',cats:['2D','3D'],items:[['pătrat',0],['cub',1],['cerc',0],['sferă',1]],ajutor:'Are volum? Atunci e 3D.',why:'Cubul e „pătratul cu adâncime”, sfera e „cercul cu adâncime”.'},
    {t:'tf',q:'În Scratch poți face un model 3D pe care să-l rotești ca să-l vezi din spate.',ok:false,ajutor:'Scena din Scratch e ca o foaie.',why:'Fals. Scena din Scratch e 2D. Pentru modele 3D îți trebuie o aplicație 3D.'}
   ]},
  {t:'Axele X, Y, Z',
   text:`<p>Într-o aplicație 3D, fiecare punct are <strong>trei</strong> numere, câte unul pe fiecare <mark>axă</mark>: <strong>X</strong>, <strong>Y</strong> și <strong>Z</strong>.</p>
<ul><li>X și Y sunt pe „podea”, pe planul de lucru: stânga-dreapta și față-spate;</li>
<li><strong>Z</strong> este <strong>înălțimea</strong>: cât de sus e obiectul.</li></ul>
<p>Așa e în <strong>Tinkercad</strong> și în <strong>Blender</strong>. Săgețile axelor au culori: X roșu, Y verde, Z albastru.</p>
${fig('blender-axe-xyz.webp',1000,494,'Un cub într-o aplicație 3D, cu săgeata roșie X, săgeata verde Y și săgeata albastră Z în sus; în panoul Transform scrie Location X 0 m, Y 0 m, Z 1 m','În <b>Blender</b> (gratuit, în engleză): săgeata albastră <b>Z</b> urcă în sus. În panoul <b>Transform</b> scrie <b>Location Z = 1 m</b>.')}`,
   exemplu:`<p>Cubul din captură stă cu centrul la <b>Z = 1 m</b>, adică la un metru deasupra podelei. Dacă îl ridici, crește Z; X și Y rămân la fel.</p>`,
   incearca:{t:'choice',q:'În Tinkercad ridici o formă mai sus. Care coordonată se schimbă?',o:['Z','X','Y','Niciuna'],ok:0,ajutor:'Care axă e înălțimea?',why:'X și Y sunt pe planul de lucru, iar Z este înălțimea. Când ridici forma, crește Z.'}},
  {t:'Aplicațiile și corpurile de bază',
   text:`<p>Pentru modele 3D folosim o <strong>aplicație 3D</strong>:</p>
<ul><li><strong>Tinkercad</strong> merge în browser (tinkercad.com), cu un cont gratuit; la clasă îl faci împreună cu profesorul;</li>
<li><strong>Blender</strong> se instalează, e gratuit, dar e pentru avansați.</li>
<li><strong>Paint 3D</strong>, din manualele mai vechi, <strong>nu se mai poate descărca</strong> din Microsoft Store din noiembrie 2024.</li></ul>
<p>Construiești din <mark>corpuri de bază</mark>: <strong>cub, cilindru, sferă, con, piramidă</strong>. Tragi corpul din panoul de forme pe planul de lucru.</p>
${fig('paint3d-forme.webp',1000,365,'Cinci corpuri 3D colorate, așezate unul lângă altul și etichetate cub, sferă, cilindru, con și piramidă','Corpurile de bază (făcute în <b>Paint 3D</b>): cub, sferă, cilindru, con, piramidă.')}`,
   exemplu:`<p>Un <b>om de zăpadă</b>: trei sfere, una peste alta (fiecare mai sus pe Z), plus un con portocaliu pentru nas.</p>`,
   incearca:{t:'choice',q:'Un manual mai vechi îți cere să instalezi Paint 3D din Microsoft Store. Ce e adevărat?',o:['A fost scos din Store în 2024; folosești altă aplicație 3D','E cea mai nouă aplicație 3D, primită cu fiecare Windows','Face parte din Scratch și se deschide din fila Costume','E doar alt nume pentru Paint-ul obișnuit din Windows'],ok:0,ajutor:'Ultima liniuță din listă.',why:'Microsoft a scos Paint 3D din Microsoft Store în noiembrie 2024. Folosim acum Tinkercad.'},
   inca:[
    {t:'match',q:'Din ce corp de bază faci obiectul?',pairs:[['zarul','cub'],['mingea','sferă'],['un creion ascuțit (vârful)','con'],['o conservă','cilindru']],ajutor:'Uită-te la captura cu cele cinci corpuri.',why:'Obiectele din jur seamănă cu corpurile de bază; de aceea construiești din ele.'}
   ]},
  {t:'Text 3D',
   text:`<p>Pe lângă corpuri, aplicațiile 3D au o formă <mark>Text</mark>: scrii un cuvânt, iar literele primesc <strong>grosime</strong>, ca niște litere tăiate din lemn.</p>
<p>Textul 3D se mută, se rotește și se mărește la fel ca orice corp. Când îl rotești, vezi partea laterală a literelor: acolo se vede că sunt 3D.</p>
${fig('paint3d-text3d.webp',900,310,'Cuvintele TEXT 3D scrise cu litere groase, rotite, așa încât se vede partea laterală a fiecărei litere','Text 3D (în <b>Paint 3D</b>), rotit: se vede <b>grosimea</b> literelor.')}`,
   exemplu:`<p>Faci o plăcuță pentru ușa clasei: un cub turtit (lat și subțire) și, deasupra lui, textul „6B” cu litere în relief.</p>`,
   incearca:{t:'tf',q:'Literele unui text 3D au grosime, deci le vezi și din lateral când le rotești.',ok:true,ajutor:'Uită-te la captură.',why:'Adevărat. Asta îl deosebește de textul scris pe o foaie, care e plat.'}},
  {t:'Mânere, copiere, gaură, grupare',
   text:`<p>O formă selectată are <strong>pătrățele albe</strong> (mânere) cu care o mărești sau o micșorezi și inele cu care o rotești.</p>
<p>În Tinkercad:</p>
<ul><li><kbd>Ctrl</kbd>+<kbd>D</kbd> <strong>duplică</strong> forma;</li>
<li>o formă trecută pe <mark>gaură</mark> (<em>Hole</em>) <strong>decupează</strong> din forma cu care o grupezi;</li>
<li><kbd>Ctrl</kbd>+<kbd>G</kbd> <strong>grupează</strong> formele selectate într-un singur obiect.</li></ul>
<p><strong>Strategia</strong> pentru un obiect cu gol (o cană): 1) corpul plin; 2) <kbd>Ctrl</kbd>+<kbd>D</kbd>, apoi micșorezi copia; 3) tragi copia exact în mijlocul corpului plin, ca pereții să iasă la fel de groși peste tot; 4) copia devine gaură și o ridici puțin pe Z, ca să rămână fundul; 5) le selectezi pe amândouă și <kbd>Ctrl</kbd>+<kbd>G</kbd>.</p>
${fig('paint3d-manere.webp',1000,369,'Obiect 3D selectat: pătrățele albe în colțuri, marcate ca mânere de redimensionare, și inele rotunde marcate ca inele de rotire','Obiect selectat (în <b>Paint 3D</b>): pătrățelele albe schimbă mărimea, inelele rotesc.')}`,
   altfel:`<p>Gaura e ca un tăietor de fursecuri: îl apeși în aluat (grupezi) și scoate exact forma lui. Dacă îl ridici puțin, nu taie până jos, și rămâne fundul.</p>`,
   incearca:{t:'match',q:'Leagă operația din Tinkercad de rezultatul ei.',pairs:[['Ctrl+D','face o copie a formei'],['Ctrl+G','unește formele selectate într-un grup'],['Gaură (Hole)','decupează din forma cu care e grupată'],['pătrățelele albe','schimbă mărimea formei']],ajutor:'D de la duplică, G de la grupează.',why:'Cu forme de bază, copii, găuri și grupări construiești aproape orice.'},
   inca:[
    {t:'choice',q:'Ai un cilindru-gaură în interiorul unui cilindru plin, dar nu s-a decupat nimic. Ce ai uitat?',o:['Să le grupezi cu Ctrl+G','Să apeși Ctrl+D','Să le colorezi la fel','Să le rotești'],ok:0,ajutor:'Gaura decupează doar din forma cu care e…',why:'Gaura decupează abia după ce o grupezi cu forma plină.'}
   ]}
 ],

 qs:[
  {t:'choice',q:'Ai o fotografie a unui zar și un model 3D al aceluiași zar. Ce poți face doar cu modelul 3D?',o:['Să-l rotești și să-i vezi spatele','Să vezi ce culoare are','Să-l arăți pe ecran colegilor','Să numeri punctele de pe fața din față'],ok:0,ajutor:'Care are adâncime?',why:'Fotografia e 2D: are doar lățime și înălțime. Modelul 3D are și adâncime, deci îl rotești și vezi și fețele din spate. Culoarea și fața din față le vezi la amândouă.'},
  {t:'classify',q:'Formă plană (2D) sau corp (3D)?',cats:['2D','3D'],items:[['pătrat',0],['cub',1],['cerc',0],['sferă',1],['triunghi',0],['piramidă',1]],why:'Cubul e „pătratul cu adâncime”, sfera e „cercul cu adâncime”, piramida are fețe triunghiulare.'},

  {t:'choice',q:'În Tinkercad cobori o sferă până se așază pe planul de lucru. Care coordonată se schimbă?',o:['Z','X','Y','Niciuna'],ok:0,ajutor:'Care axă e înălțimea?',why:'Z este înălțimea. Când cobori sfera, Z scade; X și Y, adică locul ei pe planul de lucru, rămân la fel.'}

/* ================= 8. Mini-proiect (lecția 34) ================= */
{t:'Mini-proiect: De la floare la fruct',final:true,lectii:[34],continuturi:['Scenariul unei animații: compoziție, cadre, obiecte animate','Operații specifice de realizare a unei animații: efecte de mișcare, temporizare, efecte sonore','Controlul animației prin structuri de control sau de la tastatură'],
 obiectiv:'planifici, construiești și testezi o animație completă, „De la floare la fruct”, pentru colegii de clasa a V-a.',
 pasi:[
  {t:'Scenariul proiectului',
   text:`<p>Faci pentru colegii de clasa a V-a o animație în Scratch: <mark>„De la floare la fruct”</mark>. Întâi scenariul, după strategia din nivelul 3:</p>
<ol><li><strong>Cine:</strong> personajul „Pom”, cu 4 costume (cadre): boboc, floare, floare cu albină, măr; și o albină.</li>
<li><strong>Unde:</strong> un decor cu iarbă și cer.</li>
<li><strong>Ce se întâmplă:</strong> între costume e o pauză de 2 secunde; albina glisează spre floare.</li>
<li><strong>Ce se aude:</strong> un sunet când apare mărul.</li></ol>
<p><strong>Controlul:</strong> tasta spațiu pornește din nou povestea.</p>
${fig('scratch-pom-costume.webp',470,440,'Fila Costume din Scratch: personajul Pom cu 4 costume, boboc, floare, floare cu albină și măr, încadrate ca 4 cadre','Personajul „Pom” cu cele 4 costume (cadre).')}`,
   incearca:{t:'choice',q:'Ce bloc face pauza de 2 secunde între boboc și floare?',o:['așteaptă 2 secunde','glisează în 2 secunde','mergi 2 pași','repetă 2'],ok:0,ajutor:'Pauza e temporizare.',why:'Pauza e „așteaptă”. „glisează” ar muta Pomul, iar „repetă 2” ar face de două ori aceiași pași.'}},
  {t:'Scriptul Pomului',
   text:`<p>Pomul are 4 costume, deci trece de <strong>3</strong> ori la costumul următor: boboc → floare → floare cu albină → măr. De aici <em>repetă 3</em>.</p>
<ol><li><em>schimbă costumul la boboc</em>: la fiecare pornire, povestea începe de la primul cadru, chiar dacă data trecută s-a oprit la măr.</li>
<li><em>repetă 3</em>, cu <em>așteaptă 2 secunde</em> și <em>costumul următor</em> în interior.</li>
<li><em>redă sunetul pop până la final</em>, după repetă: se aude când a apărut mărul.</li></ol>
${fig('scratch-pom-scripturi.webp',760,559,'Scripturile Pomului: când se dă click pe steag și când tasta spațiu este apăsată, schimbă costumul la boboc, repetă 3 cu așteaptă 2 secunde și costumul următor, redă sunetul pop; pe scenă mărul','Steagul verde și tasta <b>spațiu</b> pornesc povestea: de 3 ori <em>așteaptă 2 secunde</em> și <em>costumul următor</em>, apoi sunetul.')}`,
   exemplu:`${pre('când se dă click pe steag\nschimbă costumul la boboc\nrepetă 3\n  așteaptă 2 secunde\n  costumul următor\nredă sunetul pop până la final')}`,
   altfel:`<p>Ca la numărătoarea pe degete: între 4 degete sunt doar 3 spații. Între 4 cadre sunt 3 schimbări, deci <em>repetă 3</em>, nu <em>repetă 4</em>.</p>`,
   incearca:{t:'choice',q:'De ce scriptul Pomului începe cu <em>schimbă costumul la boboc</em>?',o:['Ca povestea să înceapă mereu de la primul cadru','Ca Pomul să se mute în mijlocul scenei','Ca să se audă sunetul','Ca Pomul să devină invizibil'],ok:0,ajutor:'Punctul 1 din pas.',why:'Fără el, a doua oară povestea ar porni de la măr, unde se oprise.'},
   inca:[
    {t:'choice',q:'Pomul are 4 costume. De câte ori trebuie să se repete <em>costumul următor</em> ca să ajungi de la boboc la măr?',o:['3','4','2','5'],ok:0,ajutor:'Numără schimbările, nu cadrele.',why:'Între 4 cadre sunt 3 schimbări: boboc → floare → floare cu albină → măr.'}
   ]},
  {t:'Albina și tasta spațiu',
   text:`<p><strong>Albina</strong> e un personaj separat, pentru că se mișcă (obiect animat). Scriptul ei: <em>când se dă click pe steag</em>, apoi <em>glisează în 2 secunde la x: … y: …</em>, cu x și y ale florii (le citești sub scenă, cu Pomul selectat).</p>
<p><strong>Tasta spațiu</strong>: faci încă un script la Pom, identic, dar care începe cu <em>când tasta spațiu este apăsată</em>. Cel mai rapid: clic dreapta pe <strong>primul bloc de sub steag</strong> (<em>schimbă costumul la boboc</em>) → <strong>duplică</strong>: se copiază el și tot ce e sub el, fără steag. Lipești copia sub <em>când tasta spațiu este apăsată</em>. (Dacă duplici chiar blocul cu steagul, copia are și ea steagul, iar deasupra unui „când…” nu se poate pune nimic.)</p>
<p>Bonus: mărul poate apărea încet, cu efectul fantomă pornit de la 100 și scăzut treptat.</p>`,
   exemplu:`${pre('când tasta spațiu este apăsată\nschimbă costumul la boboc\nrepetă 3\n  așteaptă 2 secunde\n  costumul următor\nredă sunetul pop până la final')}`,
   incearca:{t:'choice',q:'Cu ce bloc începi scriptul „tasta spațiu pornește din nou povestea”?',o:['când tasta spațiu este apăsată','când se dă click pe steag','repetă 3','așteaptă 2 secunde'],ok:0,ajutor:'Evenimentele încep cu „când”.',why:'E un eveniment de la tastatură, deci un bloc „când tasta … este apăsată”, cu tasta spațiu aleasă din listă.'},
   inca:[
    {t:'tf',q:'Ca mărul să apară încet, poți porni cu efectul fantomă la 100 și să-l scazi treptat până la 0.',ok:true,ajutor:'Fantomă 100 = nu se vede.',why:'Adevărat. La 100 mărul nu se vede; scăzând puțin câte puțin devine vizibil treptat.'}
   ]},
  {t:'Lista de control și predarea',
   text:`<p>Înainte să-l arăți, treci proiectul prin <strong>lista de control</strong>:</p>
<ol><li>Apeși steagul verde: apar toate cele 4 cadre, cu pauze, iar sunetul vine la măr?</li>
<li>Albina ajunge la floare?</li>
<li>Apeși <kbd>Spațiu</kbd>: povestea pornește iar de la boboc?</li>
<li>Ceva nu merge? Depanezi: ce e greșit, care bloc, citești, repari, testezi iar.</li>
<li><strong>Fișier › Salvează pe calculatorul tău</strong>, cu numele <code>Nume_Prenume_floare.sb3</code>.</li>
<li>Îl arăți colegilor pe <strong>ecran complet</strong>.</li></ol>`,
   incearca:{t:'order',q:'Pune în ordine etapele mini-proiectului.',items:['Scrii scenariul','Pregătești decorul și personajele','Construiești scripturile','Testezi și repari','Salvezi .sb3 și prezinți pe ecran complet'],ajutor:'Planul e primul, prezentarea ultima.',why:'Planul vine primul, prezentarea la urmă. Nu prezinți o animație netestată.'}}
 ],

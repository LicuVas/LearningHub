 qs:[
  {t:'choice',q:'Ce înseamnă o sortare descrescătoare după notă?',o:['De la nota cea mai mare la cea mai mică','De la nota cea mai mică la cea mai mare','În ordinea alfabetică a numelor','Notele se șterg'],ok:0,why:'Descrescător = de la mare la mic.'},
  {t:'order',q:'Tabelul e sortat întâi după Clasa (A→Z), apoi după Nota (descrescător). Pune rândurile în ordinea rezultată.',items:['8A · Ioana · 10','8A · Radu · 7','8B · Maria · 9','8B · Dan · 6'],ajutor:'Întâi toată clasa 8A.',why:'Întâi toate rândurile din 8A, apoi din 8B. În fiecare clasă, nota mai mare vine prima.'},
  {t:'order',q:'Faci sortarea după două criterii. Pune pașii în ordine.',items:['Faci clic într-o celulă a tabelului','Deschizi fila Date → Sortare','Alegi primul criteriu: Clasa, A→Z','Adaugi un nivel: Nota, descrescător','Apeși OK'],why:'Primul criteriu decide grupele mari. Nivelul adăugat ordonează în interiorul fiecărei grupe.'},
  {t:'choice',q:'Doi elevi au aceeași medie, 9. Cum stabilești cine apare primul?',o:['Adaugi un al doilea criteriu, de exemplu numele','Sortezi încă o dată doar coloana Media','Îi muți la întâmplare cu mouse-ul','Ștergi rândul unuia dintre ei'],ok:0,why:'Al doilea criteriu contează exact la valorile egale ale primului.'},
  {t:'tf',q:'Poți sorta doar coloana Nota: numele rămân lângă notele lor.',ok:false,ajutor:'Ce face avertismentul de sortare?',why:'Fals. Dacă sortezi o singură coloană, notele se mută, iar numele rămân pe loc. Rândurile se desperechează.'},
  {t:'choice',q:'După sortare, capul de tabel a coborât printre date. Ce faci întâi?',o:['Ctrl+Z, ca să anulezi sortarea','Ctrl+S, ca să salvezi','Delete pe capul de tabel','Nimic, așa rămâne'],ok:0,ajutor:'Recitește ultima propoziție de la pasul 2.',why:'Ctrl+Z anulează sortarea greșită; apoi o refaci dintr-o celulă a tabelului.'}
 ]},

/* ================= 8. Grafice + misiunea finală (lecțiile 11-12) ================= */
{t:'Experimentul cu plante',lectii:[11,12],continuturi:[P.grafice,P.serii,P.formule,P.functii],final:true,
 obiectiv:'alegi graficul potrivit, îl faci din datele selectate cu etichete și tragi o concluzie din date cu formule.',
 pasi:[
  {t:'Graficul potrivit pentru întrebare',
   text:`<p>Un <mark>grafic</mark> face datele ușor de înțeles dintr-o privire. Tipul îl alegi după <strong>întrebarea</strong> la care vrei să răspunzi:</p>
<ul><li><strong>coloane</strong> → <strong>compari</strong> valori (cine a citit mai multe cărți?);</li>
<li><strong>linie</strong> → urmărești o <strong>evoluție în timp</strong> (cum a crescut planta, săptămână de săptămână?);</li>
<li><strong>radial</strong> (plăcinta) → <strong>părți dintr-un întreg</strong> (ce parte din clasă preferă fiecare sport?).</li></ul>`,
   exemplu:`<p>„Care plantă e cea mai înaltă acum?” → <b>coloane</b>. „Cum a crescut planta de la lumină?” → <b>linie</b>. „Din 20 de elevi, câți aleg fotbal, baschet, înot?” → <b>radial</b>.</p>`,
   incearca:{t:'choice',q:'Vrei să compari câte cărți a citit fiecare elev luna asta. Ce grafic alegi?',o:['Coloane','Linie','Radial','Niciunul'],ok:0,ajutor:'Compari valori între ele.',why:'Coloanele pun valorile una lângă alta, ca să le compari.'},
   inca:[
    {t:'classify',q:'Ce grafic se potrivește fiecărei întrebări?',cats:['Coloane','Linie','Radial'],items:[['Cine a strâns mai mulți bani la târg?',0],['Cum a variat temperatura în fiecare zi a săptămânii?',1],['Ce parte din buget merge pe mâncare?',2],['Ce clasă are mai mulți elevi?',0]],ajutor:'Compari → coloane; în timp → linie; parte din întreg → radial.',why:'Compararea merge pe coloane, evoluția pe linie, părțile unui întreg pe radial.'}
   ]},
  {t:'Seria de date și legenda',
   text:`<p>O <mark>serie de date</mark> e un șir de valori care merg împreună, de obicei un rând sau o coloană din tabel: de exemplu înălțimile unei plante, săptămână de săptămână (B3:D3 pentru planta „La umbră”).</p>
<p>Fiecare serie primește în grafic o <strong>culoare</strong> și un <strong>nume</strong> în <mark>legendă</mark>. Numele vine din eticheta de lângă valori (A3: „La umbră”). Trei plante = trei serii = trei nume în legendă.</p>

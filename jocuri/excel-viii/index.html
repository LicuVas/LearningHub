<script>
const LEVELS=[
{t:'Registrul și celula',text:`
<p><strong>Excel</strong> este o aplicație de <mark>calcul tabelar</mark>. Un fișier Excel se numește <mark>registru</mark> (în engleză <em>workbook</em>) și se salvează cu extensia <strong>.xlsx</strong>.</p>
<p>Un registru are una sau mai multe <strong>foi de calcul</strong>. Filele lor sunt jos, iar numele unei foi îl schimbi cu <strong>dublu-clic</strong> pe el.</p>
<p>Foaia e o grilă: <strong>coloanele</strong> au litere (A, B, C…), <strong>rândurile</strong> au numere (1, 2, 3…). Unde se întâlnesc o coloană și un rând stă o <mark>celulă</mark>.</p>
<p><strong>Adresa</strong> celulei = litera coloanei + numărul rândului, în ordinea asta: <code>B3</code>. Adresa celulei în care ești apare în stânga barei de formule, în <strong>caseta de nume</strong>.</p>`,
qs:[
 {t:'pick',q:'Apasă pe celula <code>C5</code>, apoi verifică.',cols:5,rows:6,ans:'C5',why:'Întâi coloana (litera C), apoi rândul (5).'},
 {t:'choice',q:'Cum se numește un fișier Excel?',o:['Document','Registru','Prezentare','Carnet'],ok:1,why:'Fișierul Excel e un registru. Un registru conține foi de calcul.'},
 {t:'choice',q:'Care adresă e scrisă corect?',o:['5C','C5','C-5','coloana C rândul 5'],ok:1,why:'Litera coloanei, lipită de numărul rândului: C5.'},
 {t:'tf',q:'Un registru poate avea mai multe foi de calcul.',ok:true,why:'Da. Filele foilor sunt în partea de jos a ferestrei.'},
 {t:'choice',q:'Vrei ca foaia să se numească „Note”. Ce faci?',o:['Dublu-clic pe numele foii, jos','Scrii „Note” în celula A1','Salvare ca…','Ștergi foaia și faci alta'],ok:0,why:'Numele foii se schimbă din fila ei, cu dublu-clic.'}
]},
{t:'Tipuri de date',text:`
<p>În celule scrii trei tipuri de date: <mark>numere</mark> (12, 250), <mark>text</mark> (Ana, clasa a VIII-a) și <mark>date calendaristice</mark> (de exemplu 15.09.2026, dacă așa scrie data calculatorul tău).</p>
<p>Cum le deosebești dintr-o privire? Dacă nu schimbi tu alinierea, Excel pune <strong>numerele și datele la dreapta</strong>, iar <strong>textul la stânga</strong>.</p>
<p>Un număr aliniat la stânga e un semn de alarmă: probabil Excel îl vede ca <strong>text</strong> și nu va calcula cu el.</p>
<p>O celulă cu număr care arată <code>#####</code> nu e stricată: <strong>coloana e prea îngustă</strong>. O lărgești și numărul apare.</p>`,
qs:[
 {t:'classify',q:'Ce tip de date e fiecare valoare?',cats:['Număr','Text','Dată'],items:[['250',0],['Ana',1],['15.09.2026',2],['7B',1],['-4',0],['3 mere',1]],why:'Tot ce conține litere e text. „7B” și „3 mere” sunt text, deși încep cu o cifră.'},
 {t:'choice',q:'Scrii <code>12</code> în A1 și <code>Ana</code> în A2, fără nicio formatare. Cum apar?',o:['12 la dreapta, Ana la stânga','Amândouă la stânga','Amândouă centrate','12 la stânga, Ana la dreapta'],ok:0,why:'Numerele se aliniază la dreapta, textul la stânga.'},
 {t:'choice',q:'O celulă cu un număr mare arată <code>#####</code>. Ce faci?',o:['Scrii numărul din nou','Lărgești coloana','Pui numărul pe aldin','Închizi registrul'],ok:1,why:'##### înseamnă doar că numărul nu încape în lățimea coloanei.'},
 {t:'tf',q:'Un număr aliniat la stânga poate fi semn că Excel îl vede ca text.',ok:true,why:'Adevărat. Cu un astfel de „număr” formulele nu vor calcula corect.'}
]},
{t:'Zone și formatare',text:`
<p>O <mark>zonă</mark> de celule se scrie cu <strong>două puncte</strong> între colțurile ei: <code>B2:D4</code> înseamnă dreptunghiul de la B2 până la D4. O selectezi cu <strong>clic și tragere</strong>.</p>
<p><strong>Clic pe litera</strong> unei coloane selectează toată coloana. <strong>Clic pe numărul</strong> unui rând selectează tot rândul.</p>
<p>Lățimea unei coloane se schimbă trăgând marginea din dreapta literei ei. <strong>Dublu-clic</strong> pe acea margine o potrivește după conținut.</p>
<p>Pe fila <strong>Pornire</strong> găsești formatările celulelor: <strong>alinierea</strong> conținutului, <strong>bordurile</strong>, <strong>culoarea de umplere</strong> și <strong>stilurile predefinite</strong>. Liniile gri ale grilei, de obicei, <strong>nu se tipăresc</strong>. Dacă vrei linii pe hârtie, pui borduri.</p>
<p>Ca în Word: <mark>întâi selectezi, apoi formatezi</mark>.</p>`,
qs:[
 {t:'pick',q:'Selectează zona <code>B2:C4</code>: apasă pe un colț, apoi pe colțul opus.',cols:5,rows:6,range:true,ans:'B2:C4',why:'B2:C4 are colțurile B2 (stânga-sus) și C4 (dreapta-jos).'},
 {t:'choice',q:'Câte celule are zona <code>B2:D4</code>?',o:['6','8','9','12'],ok:2,why:'3 coloane (B, C, D) × 3 rânduri (2, 3, 4) = 9 celule.'},
 {t:'choice',q:'Cum selectezi toată coloana C?',o:['Clic pe litera C din capul coloanei','Dublu-clic în C1','Clic pe numărul 3','Tragi din A1 până în C1'],ok:0,why:'Litera din capul coloanei selectează coloana întreagă.'},
 {t:'choice',q:'Tabelul trebuie să aibă linii când îl tipărești. Ce aplici?',o:['Borduri','Culoare de umplere','Aldin','O coloană mai lată'],ok:0,why:'Grila gri nu se tipărește de obicei. Bordurile se tipăresc.'}
]},
{t:'Formule',text:`
<p>O <mark>formulă</mark> începe <strong>întotdeauna</strong> cu semnul <code>=</code>. Folosește operatorii <code>+</code> <code>-</code> <code>*</code> <code>/</code> (înmulțirea e steluța, împărțirea e bara) și <strong>adresele celulelor</strong>: <code>=B2*C2</code>, nu <code>=3*5</code>.</p>
<p>De ce adrese? Când schimbi un număr din tabel, rezultatul <strong>se recalculează singur</strong>.</p>
<p>Ordinea operațiilor e cea de la matematică: întâi <code>*</code> și <code>/</code>, apoi <code>+</code> și <code>-</code>. Parantezele schimbă ordinea.</p>
<p>În celulă vezi <strong>rezultatul</strong>, iar formula o vezi în <strong>bara de formule</strong> (<em>fx</em>).</p>
<p>Pătrățelul din colțul celulei selectate e <mark>mânerul de umplere</mark>. Dacă îl tragi în jos, formula se copiază, iar adresele coboară și ele: <code>=B2*C2</code> devine <code>=B3*C3</code>.</p>`,
qs:[
 {t:'choice',q:'Cantitatea e în B2, prețul în C2. Ce scrii în D2 pentru total?',o:['B2*C2','=B2*C2','=B2xC2','=3*5'],ok:1,why:'Fără = Excel vede text. „x” nu e operator. Cu numere scrise de mână, rezultatul nu se mai recalculează.'},
 {t:'choice',q:'Ce rezultat dă <code>=2+3*4</code>?',o:['20','14','24','9'],ok:1,why:'Întâi 3*4 = 12, apoi 2+12 = 14.'},
 {t:'choice',q:'Copiezi <code>=B2*C2</code> din D2 în D3, cu mânerul de umplere. Ce formulă apare în D3?',o:['=B2*C2','=B3*C3','=B2*C3','=C3*D3'],ok:1,why:'Formula coboară un rând, deci și adresele coboară un rând.'},
 {t:'foaie',q:'Completează coloana Total (D2, D3, D4) și totalul general din D5. Apasă pe o celulă cu chenar, scrie formula în bara fx, apoi Enter.',
  cells:{A1:'Produs',B1:'Cantitate',C1:'Preț (lei)',D1:'Total',A2:'Caiet',B2:3,C2:5,A3:'Pix',B3:2,C3:4,A4:'Riglă',B4:1,C4:7,A5:'Total general'},
  cols:4,rows:5,targets:{D2:'=B2*C2',D3:'=B3*C3',D4:'=B4*C4',D5:'=D2+D3+D4'},
  why:'Formulele folosesc adrese, deci se recalculează dacă se schimbă prețurile.'}
]},
{t:'Funcții',text:`
<p>O <mark>funcție</mark> e o formulă gata făcută. Cele mai folosite sunt:</p>
<ul>
<li><code>SUM</code>: suma;</li>
<li><code>AVERAGE</code>: media aritmetică;</li>
<li><code>MAX</code>: cea mai mare valoare;</li>
<li><code>MIN</code>: cea mai mică valoare.</li>
</ul>
<p>Le scrii cu <code>=</code> în față, iar între paranteze pui <strong>zona</strong>: <code>=AVERAGE(B2:B6)</code>.</p>
<p>Atenție: și în Excel-ul în limba română, numele funcțiilor sunt <strong>în engleză</strong>. Dacă scrii <code>=SUMA(B2:B6)</code>, Excel nu recunoaște funcția și afișează o eroare.</p>
<p>Pentru o sumă rapidă, pe fila <strong>Pornire</strong> există butonul <strong>Σ</strong> (<em>AutoSum</em>). Când începi să scrii numele unei funcții, Excel îți arată sub celulă cum se completează. Citește acel ajutor.</p>`,
qs:[
 {t:'choice',q:'Ce funcție găsește cea mai mare notă din zona B2:B20?',o:['SUM','AVERAGE','MAX','MIN'],ok:2,why:'MAX = maximul, adică cea mai mare valoare.'},
 {t:'choice',q:'În B2:B4 sunt notele 6, 8 și 10. Ce afișează <code>=AVERAGE(B2:B4)</code>?',o:['24','8','10','3'],ok:1,why:'(6 + 8 + 10) : 3 = 8.'},
 {t:'tf',q:'În Excel-ul în limba română, suma se scrie <code>=SUMA(B2:B6)</code>.',ok:false,why:'Fals. Numele funcțiilor rămân în engleză: =SUM(B2:B6).'},
 {t:'foaie',q:'Calculează media clasei (B7), nota maximă (B8) și nota minimă (B9), cu funcții.',
  cells:{A1:'Elev',B1:'Nota',A2:'Ana',B2:9,A3:'Bogdan',B3:7,A4:'Cristi',B4:10,A5:'Dana',B5:6,A6:'Elena',B6:8,A7:'Media',A8:'Nota maximă',A9:'Nota minimă'},
  cols:2,rows:9,targets:{B7:'=AVERAGE(B2:B6)',B8:'=MAX(B2:B6)',B9:'=MIN(B2:B6)'},
  why:'AVERAGE, MAX și MIN pe aceeași zonă, B2:B6.'}
]},
{t:'Decizie și sortare',text:`
<p>Funcția <code>IF</code> alege între două rezultate: <code>=IF(B2&gt;=5;"promovat";"corigent")</code>. Citește-o așa: <em>dacă</em> B2 e cel puțin 5, scrie „promovat”, <em>altfel</em> scrie „corigent”. Textul stă între <strong>ghilimele</strong>.</p>
<p>Comparații: <code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code>, egal <code>=</code>, diferit <code>&lt;&gt;</code>. Între părțile funcției pui <code>;</code> sau <code>,</code>, după setările calculatorului. Excel îți arată semnul corect în ajutorul de sub celulă.</p>
<p><mark>Sortarea</mark> aranjează rândurile <strong>crescător</strong> (A→Z, 1→10) sau <strong>descrescător</strong>. Selectezi <strong>tot tabelul</strong>, apoi fila <strong>Date</strong> → <strong>Sortare</strong>.</p>
<p>Poți sorta după mai multe criterii: întâi după medie, descrescător, apoi, la medii egale, după nume.</p>
<p><strong>Nu sorta o singură coloană</strong>: rândurile se amestecă și mediile ajung la alți elevi.</p>`,
qs:[
 {t:'choice',q:'B2 conține 4,50. Ce afișează <code>=IF(B2&gt;=5;"promovat";"corigent")</code>?',o:['promovat','corigent','4,50','nimic'],ok:1,why:'4,50 nu e ≥ 5, deci IF alege a doua variantă.'},
 {t:'choice',q:'Ce înseamnă <code>&lt;&gt;</code> într-o comparație?',o:['mai mic sau egal','diferit','egal','mai mare'],ok:1,why:'<> înseamnă „diferit de”.'},
 {t:'order',q:'Faci clasamentul clasei după medie, de la cea mai mare. Pune pașii în ordine.',items:['Selectezi tot tabelul, cu tot cu capul de tabel','Deschizi fila Date → Sortare','Alegi coloana Media și ordinea descrescătoare','Apeși OK'],why:'Selecția întreagă păstrează fiecare medie lângă elevul ei.'},
 {t:'foaie',q:'Scrie în C2 și C3 situația fiecărui elev, cu IF: „promovat” de la media 5 în sus, altfel „corigent”.',
  cells:{A1:'Elev',B1:'Media',C1:'Situația',A2:'Ana',B2:7.25,A3:'Bogdan',B3:4.5},
  cols:3,rows:3,targets:{C2:'=IF(B2>=5;"promovat";"corigent")',C3:'=IF(B3>=5;"promovat";"corigent")'},
  variants:[{B2:4,B3:9},{B2:5,B3:4.99}],
  why:'Formula verifică media din celulă, deci merge și după ce se schimbă notele. Jocul a testat-o și cu media 5 fix.'}
]},
{t:'Experimentul cu plante',final:true,text:`
<p>Un <mark>grafic</mark> face datele ușor de înțeles dintr-o privire. Alegi tipul după întrebarea la care răspunde:</p>
<ul>
<li><strong>coloane</strong> → <strong>compari</strong> valori (care plantă a crescut mai mult?);</li>
<li><strong>linie</strong> → urmărești o <strong>evoluție în timp</strong> (cum a crescut, săptămână de săptămână?);</li>
<li><strong>radial</strong> (plăcinta, <em>Pie</em>) → <strong>părți dintr-un întreg</strong> (ce parte din clasă a ales fiecare sport?).</li>
</ul>
<p>O <mark>serie de date</mark> e un șir de valori care merg împreună, de exemplu înălțimile unei plante în fiecare săptămână.</p>
<p>Graficul îl creezi așa: selectezi datele <strong>cu tot cu etichete</strong>, apoi fila <strong>Inserare</strong> → tipul de grafic. Adaugi un <strong>titlu</strong> și verifici <strong>legenda</strong>.</p>
<p><strong>Misiunea finală:</strong> trei plante, crescute la lumină, la umbră și fără apă, măsurate trei săptămâni.</p>`,
qs:[
 {t:'choice',q:'Vrei să arăți cum a crescut o plantă de la o săptămână la alta. Ce grafic alegi?',o:['Coloane','Linie','Radial','Niciunul'],ok:1,why:'Evoluția în timp se vede cel mai bine pe o linie.'},
 {t:'choice',q:'Ce grafic arată cel mai bine ce parte din clasă a ales fiecare sport?',o:['Linie','Coloane','Radial','Tabel'],ok:2,why:'Radialul (plăcinta) arată părțile unui întreg.'},
 {t:'foaie',q:'Calculează creșterea fiecărei plante (E2:E4 = săptămâna 3 minus săptămâna 1) și creșterea maximă în E5.',
  cells:{A1:'Planta',B1:'Săpt. 1',C1:'Săpt. 2',D1:'Săpt. 3',E1:'Creștere (cm)',A2:'La lumină',B2:2,C2:5,D2:9,A3:'La umbră',B3:2,C3:3,D3:5,A4:'Fără apă',B4:2,C4:2,D4:1,A5:'Creșterea maximă'},
  cols:5,rows:5,targets:{E2:'=D2-B2',E3:'=D3-B3',E4:'=D4-B4',E5:'=MAX(E2:E4)'},
  why:'Planta fără apă a „crescut” cu −1 cm: s-a ofilit. Asta e o concluzie trasă din date.'},
 {t:'choice',q:'Selectezi datele pentru graficul plantelor. Ce incluzi?',o:['Doar numerele','Numerele cu tot cu etichetele (plantele și săptămânile)','Doar titlul tabelului','Și celulele goale de sub tabel'],ok:1,why:'Din etichete Excel scrie legenda și axele.'}
]}
];

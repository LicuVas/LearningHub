<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Analist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --desk:#EDF0ED; --paper:#FFFFFF; --paper2:#F3F6F3; --head:#E6EAE6; --grid:#D3D9D3;
  --ink:#18221B; --ink2:#59655C; --accent:#1B7443; --accentInk:#FFFFFF; --sel:#D9EEE1;
  --mark:#FFE36B; --markInk:#18221B;
  --ok:#177245; --okbg:#E1F3E7; --bad:#C63A33; --badbg:#FAE6E4;
  --shadow:0 1px 2px rgba(16,36,24,.08),0 10px 28px rgba(16,36,24,.09);
  --fd:"Archivo","Segoe UI",system-ui,sans-serif;
  --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --fm:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1411; --paper:#18201B; --paper2:#1E2822; --head:#243028; --grid:#2F3B33;
  --ink:#E4EBE6; --ink2:#9AA89F; --accent:#5CCB8E; --accentInk:#0F1411; --sel:#1E4430;
  --mark:#F2D24E; --markInk:#18221B;
  --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --desk:#0F1411; --paper:#18201B; --paper2:#1E2822; --head:#243028; --grid:#2F3B33;
  --ink:#E4EBE6; --ink2:#9AA89F; --accent:#5CCB8E; --accentInk:#0F1411; --sel:#1E4430;
  --mark:#F2D24E; --markInk:#18221B;
  --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--fb);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--fm);font-size:.78em;background:var(--paper2);border:1px solid var(--grid);border-bottom-width:2px;border-radius:4px;padding:.05em .4em;white-space:nowrap}
code,.code{font-family:var(--fm);font-size:.86em;background:var(--paper2);border:1px solid var(--grid);border-radius:4px;padding:.05em .35em;white-space:nowrap}
mark{background:var(--mark);color:var(--markInk);padding:0 .15em;border-radius:2px}

/* bara de sus = caseta de nume + bara de formule */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--desk) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--grid)}
.hud-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{font-family:var(--fd);font-weight:800;font-stretch:112%;font-size:1rem;background:none;border:0;padding:0;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.fbar{display:flex;align-items:stretch;flex:1 1 280px;min-width:0;border:1px solid var(--grid);border-radius:6px;background:var(--paper);font-family:var(--fm);font-size:.78rem;overflow:hidden}
.fbar .nb{padding:3px 10px;border-right:1px solid var(--grid);background:var(--head);min-width:3.4em;text-align:center;font-weight:600}
.fbar .fx{padding:3px 8px;color:var(--ink2);font-style:italic;border-right:1px solid var(--grid)}
.fbar .fv{padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.fbar .fv .hot{background:var(--mark);color:var(--markInk);border-radius:3px;padding:0 5px}
.pulldown{display:none;background:none;border:0;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink2);border-radius:6px}

main{max-width:820px;margin:22px auto 0}
.book{background:var(--paper);box-shadow:var(--shadow);border-radius:4px;overflow:hidden}
.colhead{display:grid;grid-template-columns:36px repeat(8,1fr);background:var(--head);border-bottom:1px solid var(--grid);font-family:var(--fm);font-size:.7rem;color:var(--ink2)}
.colhead span{text-align:center;padding:3px 0;border-left:1px solid var(--grid)}
.colhead span:first-child{border-left:0}
.sheet{padding:26px clamp(18px,5.5vw,56px) 34px;background:
  linear-gradient(90deg,var(--head) 0 36px,transparent 36px) 0 0/100% 100% no-repeat,var(--paper);padding-left:calc(36px + clamp(16px,5vw,48px))}
@media (max-width:600px){.sheet{background:var(--paper);padding-left:18px}.colhead{grid-template-columns:repeat(8,1fr)}.colhead span:first-child{display:none}}
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--head);border-top:1px solid var(--grid);overflow-x:auto;font-family:var(--fm);font-size:.78rem}
.tabs span{padding:6px 14px;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent}
.tabs span.done{color:var(--ok)}
.tabs span.now{background:var(--paper);color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.eyebrow{font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
h1,h2,h3{font-family:var(--fd);text-wrap:balance;line-height:1.05;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:850;font-stretch:118%}
h1 .eq{color:var(--accent);font-weight:500;font-stretch:80%}
h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;font-stretch:112%}
h3{font-size:1.2rem;font-weight:700}
.lede{max-width:60ch;color:var(--ink2);margin:14px 0 0}
.stack{display:flex;flex-direction:column;gap:18px}
.reading{max-width:64ch}
.reading p{margin:0 0 .8em}
.reading ul{margin:0 0 .8em;padding-left:1.2em}
.reading li{margin:.25em 0}
.hint{font-size:.9rem;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.namerow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.namerow label{font-family:var(--fm);font-size:.8rem;color:var(--ink2)}
.namerow input{font-size:1rem;padding:8px 12px;border:1px solid var(--grid);border-radius:6px;background:var(--paper2);min-width:0;flex:1 1 220px;max-width:340px}

/* cuprinsul ca tabel */
.xl{border-collapse:collapse;width:100%;font-size:1rem}
.xl th{background:var(--head);font-family:var(--fm);font-size:.72rem;font-weight:500;color:var(--ink2);border:1px solid var(--grid);padding:2px 6px}
.xl td{border:1px solid var(--grid);padding:0}
.xl td.rn{background:var(--head);font-family:var(--fm);font-size:.72rem;color:var(--ink2);text-align:center;width:36px}
.lvl{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:10px 10px;min-height:46px}
.lvl:hover:not([disabled]){background:var(--sel)}
.lvl[disabled]{opacity:.5;cursor:not-allowed}
.lvl .t{font-weight:600;flex:1}
.lvl .s{font-family:var(--fm);font-size:.82rem;color:var(--ink2);white-space:nowrap}
.lvl .s .on{color:var(--accent)}

.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:10px 18px;border:1px solid var(--grid);background:var(--paper);font-family:var(--fd);font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accentInk);border-color:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 12px;font-size:.85rem}

.q{font-size:1.18rem;font-weight:700;max-width:60ch;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{text-align:left;padding:12px 14px;border-radius:6px;border:1px solid var(--grid);background:var(--paper2);line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.opt[disabled]{cursor:default}

.fb{border-radius:6px;padding:12px 14px;line-height:1.5}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:4px solid var(--bad)}
.fb strong{font-family:var(--fd)}
.peek{border:1px dashed var(--grid);border-radius:6px;padding:12px 16px;background:var(--paper2);font-size:.97rem}

.pool,.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--grid);border-radius:6px;min-height:46px;color:var(--ink2)}
.slot.full{border-style:solid;color:var(--ink);background:var(--paper2)}
.slot b{font-family:var(--fm);font-size:.8rem;color:var(--accent)}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.lbl{font-family:var(--fm);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}

/* clasificare */
.cls{display:flex;flex-direction:column;gap:8px}
.cls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cls-row .val{font-family:var(--fm);min-width:8.5em;padding:6px 10px;border:1px solid var(--grid);background:var(--paper)}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--paper2);padding:6px 12px;font-size:.92rem;border-left:1px solid var(--grid)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.cls-row.wrong .val{border-color:var(--bad);background:var(--badbg)}
.cls-row.right .val{border-color:var(--ok);background:var(--okbg)}

/* grila de foaie de calcul */
.gridwrap{overflow-x:auto;border:1px solid var(--grid);border-radius:6px;background:var(--paper)}
.g{border-collapse:collapse;font-family:var(--fm);font-size:.9rem;min-width:100%}
.g th{background:var(--head);color:var(--ink2);font-weight:500;font-size:.72rem;border:1px solid var(--grid);padding:3px 6px;min-width:30px}
.g td{border:1px solid var(--grid);padding:0;height:36px;min-width:72px}
.g td>button,.g td>div{display:block;width:100%;height:100%;min-height:36px;border:0;background:none;padding:6px 8px;text-align:left;font-family:var(--fm);font-size:.9rem;white-space:nowrap}
.g td .num{text-align:right;font-variant-numeric:tabular-nums}
.g td .hdr{font-weight:600}
@media (max-width:600px){
  .g{font-size:.8rem;width:100%}
  .g th{min-width:0;padding:2px 1px;width:20px}
  .g td{min-width:0;height:auto}
  .g td>button,.g td>div{white-space:normal;overflow-wrap:break-word;hyphens:manual;padding:5px 3px;font-size:.82rem;min-height:40px;line-height:1.2}
  .g td span:not(.num){font-family:var(--fb)}
  .g td.tgt{min-width:3.2em}
}
.g td.pick{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.g td.inr{background:var(--sel)}
.g td.tgt>button{box-shadow:inset 0 0 0 1.5px var(--accent);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--accent) 9%,transparent) 6px 12px)}
.g td.tgt.filled>button{background:var(--paper)}
.g td.tgt.act>button{box-shadow:inset 0 0 0 3px var(--accent);background:var(--sel)}
.g td.err>button{color:var(--bad)}
.fxrow{display:flex;align-items:stretch;border:1px solid var(--grid);border-radius:6px;overflow:hidden;background:var(--paper);font-family:var(--fm)}
.fxrow .nb{padding:8px 10px;background:var(--head);border-right:1px solid var(--grid);min-width:3.6em;text-align:center;font-weight:600}
.fxrow .fx{padding:8px;color:var(--ink2);font-style:italic;border-right:1px solid var(--grid)}
.fxrow input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px;font-family:var(--fm);font-size:1rem}
.fxrow input:disabled{color:var(--ink2)}
.fxrow button{border:0;border-left:1px solid var(--grid);background:var(--accent);color:var(--accentInk);padding:0 14px;font-family:var(--fd);font-weight:700}
.toast{font-family:var(--fm);font-size:.82rem;color:var(--bad);min-height:1.3em}

.end-stars{font-size:3rem;letter-spacing:.1em;color:var(--accent);line-height:1}
.end-stars .off{color:var(--grid)}
.diploma{border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:5px;padding:28px 22px;text-align:center;margin:10px}
.diploma .nm{font-family:var(--fd);font-stretch:115%;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:850;margin:10px 0}
.facts{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;font-family:var(--fm);font-size:.9rem;font-variant-numeric:tabular-nums}
.check li{margin:.35em 0}

@media (max-width:600px){
  body{font-size:17px}
  .hud{padding-block:6px}
  .brand{font-size:.92rem}
  .fbar{font-size:.7rem}
  body.hdr-collapsed .hud{padding-block:3px}
  body.hdr-collapsed .brand{display:none}
  body.hdr-collapsed .hud-in{flex-wrap:nowrap;touch-action:none}
  body.hdr-collapsed .pulldown{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="hud"><div class="hud-in">
  <button class="brand" id="go-home" type="button">Misiunea <b>Analist</b></button>
  <div class="fbar" id="hud" aria-live="polite"></div>
  <button class="pulldown" id="hdr-pull" type="button" aria-label="Arată bara de sus" title="Arată bara de sus">▾</button>
</div></header>
<main id="app"></main>

<script>
(function(){
const KEY='misiunea_analist_viii';

/* ================= conținut ================= */
const LEVELS=[
{t:'Registrul și celula',text:`
<p><strong>Excel</strong> este o aplicație de <mark>calcul tabelar</mark>. Un fișier Excel se numește <mark>registru</mark> (în engleză <em>workbook</em>) și se salvează cu extensia <strong>.xlsx</strong>.</p>
<p>Un registru are una sau mai multe <strong>foi de calcul</strong>. Filele lor sunt jos, iar numele unei foi îl schimbi cu <strong>dublu-clic</strong> pe el.</p>
<p>Foaia e o grilă: <strong>coloanele</strong> au litere (A, B, C…), <strong>rândurile</strong> au numere (1, 2, 3…). Unde se întâlnesc o coloană și un rând stă o <mark>celulă</mark>.</p>
<p><strong>Adresa</strong> celulei = litera coloanei + numărul rândului, în ordinea asta: <code>B3</code>. Adresa celulei în care ești apare în stânga barei de formule, în <strong>caseta de nume</strong>.</p>`,
qs:[
 {t:'pick',q:'Apasă pe celula <code>C5</code>, apoi verifică.',cols:5,rows:6,ans:'C5',why:'Întâi coloana (litera C), apoi rândul (5).'},
 {t:'choice',q:'Cum se numește un fișier Excel?',o:['Document','Registru','Prezentare','Carnet'],ok:1,why:'Fișierul Excel e un registru. Un registru conține foi de calcul.'},
 {t:'choice',q:'Care adresă e scrisă corect?',o:['5C','C5','C-5','coloana C rândul 5'],ok:1,why:'Litera coloanei, lipită de numărul rândului: C5.'},
 {t:'tf',q:'Un registru poate avea mai multe foi de calcul.',ok:true,why:'Da. Filele foilor sunt în partea de jos a ferestrei.'},
 {t:'choice',q:'Vrei ca foaia să se numească „Note”. Ce faci?',o:['Dublu-clic pe numele foii, jos','Scrii „Note” în celula A1','Salvare ca…','Ștergi foaia și faci alta'],ok:0,why:'Numele foii se schimbă din fila ei, cu dublu-clic.'}
]},
{t:'Tipuri de date',text:`
<p>În celule scrii trei tipuri de date: <mark>numere</mark> (12, 250), <mark>text</mark> (Ana, clasa a VIII-a) și <mark>date calendaristice</mark> (de exemplu 15.09.2026, dacă așa scrie data calculatorul tău).</p>
<p>Cum le deosebești dintr-o privire? Dacă nu schimbi tu alinierea, Excel pune <strong>numerele și datele la dreapta</strong>, iar <strong>textul la stânga</strong>.</p>
<p>Un număr aliniat la stânga e un semn de alarmă: probabil Excel îl vede ca <strong>text</strong> și nu va calcula cu el.</p>
<p>O celulă cu număr care arată <code>#####</code> nu e stricată: <strong>coloana e prea îngustă</strong>. O lărgești și numărul apare.</p>`,
qs:[
 {t:'classify',q:'Ce tip de date e fiecare valoare?',cats:['Număr','Text','Dată'],items:[['250',0],['Ana',1],['15.09.2026',2],['7B',1],['-4',0],['3 mere',1]],why:'Tot ce conține litere e text. „7B” și „3 mere” sunt text, deși încep cu o cifră.'},
 {t:'choice',q:'Scrii <code>12</code> în A1 și <code>Ana</code> în A2, fără nicio formatare. Cum apar?',o:['12 la dreapta, Ana la stânga','Amândouă la stânga','Amândouă centrate','12 la stânga, Ana la dreapta'],ok:0,why:'Numerele se aliniază la dreapta, textul la stânga.'},
 {t:'choice',q:'O celulă cu un număr mare arată <code>#####</code>. Ce faci?',o:['Scrii numărul din nou','Lărgești coloana','Pui numărul pe aldin','Închizi registrul'],ok:1,why:'##### înseamnă doar că numărul nu încape în lățimea coloanei.'},
 {t:'tf',q:'Un număr aliniat la stânga poate fi semn că Excel îl vede ca text.',ok:true,why:'Adevărat. Cu un astfel de „număr” formulele nu vor calcula corect.'}
]},
{t:'Zone și formatare',text:`
<p>O <mark>zonă</mark> de celule se scrie cu <strong>două puncte</strong> între colțurile ei: <code>B2:D4</code> înseamnă dreptunghiul de la B2 până la D4. O selectezi cu <strong>clic și tragere</strong>.</p>
<p><strong>Clic pe litera</strong> unei coloane selectează toată coloana. <strong>Clic pe numărul</strong> unui rând selectează tot rândul.</p>
<p>Lățimea unei coloane se schimbă trăgând marginea din dreapta literei ei. <strong>Dublu-clic</strong> pe acea margine o potrivește după conținut.</p>
<p>Pe fila <strong>Pornire</strong> găsești formatările celulelor: <strong>alinierea</strong> conținutului, <strong>bordurile</strong>, <strong>culoarea de umplere</strong> și <strong>stilurile predefinite</strong>. Liniile gri ale grilei, de obicei, <strong>nu se tipăresc</strong>. Dacă vrei linii pe hârtie, pui borduri.</p>
<p>Ca în Word: <mark>întâi selectezi, apoi formatezi</mark>.</p>`,
qs:[
 {t:'pick',q:'Selectează zona <code>B2:C4</code>: apasă pe un colț, apoi pe colțul opus.',cols:5,rows:6,range:true,ans:'B2:C4',why:'B2:C4 are colțurile B2 (stânga-sus) și C4 (dreapta-jos).'},
 {t:'choice',q:'Câte celule are zona <code>B2:D4</code>?',o:['6','8','9','12'],ok:2,why:'3 coloane (B, C, D) × 3 rânduri (2, 3, 4) = 9 celule.'},
 {t:'choice',q:'Cum selectezi toată coloana C?',o:['Clic pe litera C din capul coloanei','Dublu-clic în C1','Clic pe numărul 3','Tragi din A1 până în C1'],ok:0,why:'Litera din capul coloanei selectează coloana întreagă.'},
 {t:'choice',q:'Tabelul trebuie să aibă linii când îl tipărești. Ce aplici?',o:['Borduri','Culoare de umplere','Aldin','O coloană mai lată'],ok:0,why:'Grila gri nu se tipărește de obicei. Bordurile se tipăresc.'}
]},
{t:'Formule',text:`
<p>O <mark>formulă</mark> începe <strong>întotdeauna</strong> cu semnul <code>=</code>. Folosește operatorii <code>+</code> <code>-</code> <code>*</code> <code>/</code> (înmulțirea e steluța, împărțirea e bara) și <strong>adresele celulelor</strong>: <code>=B2*C2</code>, nu <code>=3*5</code>.</p>
<p>De ce adrese? Când schimbi un număr din tabel, rezultatul <strong>se recalculează singur</strong>.</p>
<p>Ordinea operațiilor e cea de la matematică: întâi <code>*</code> și <code>/</code>, apoi <code>+</code> și <code>-</code>. Parantezele schimbă ordinea.</p>
<p>În celulă vezi <strong>rezultatul</strong>, iar formula o vezi în <strong>bara de formule</strong> (<em>fx</em>).</p>
<p>Pătrățelul din colțul celulei selectate e <mark>mânerul de umplere</mark>. Dacă îl tragi în jos, formula se copiază, iar adresele coboară și ele: <code>=B2*C2</code> devine <code>=B3*C3</code>.</p>`,
qs:[

/* ================= motorul de formule ================= */
const RO_NAMES={SUMA:'SUM',MEDIE:'AVERAGE',MEDIA:'AVERAGE',DACA:'IF','DACĂ':'IF',MAXIM:'MAX',MINIM:'MIN'};
function FErr(msg,show){const e=new Error(msg);e.show=show||'#EROARE';return e}
function tokenize(src){
  const t=[];let i=0;
  while(i<src.length){
    const c=src[i],rest=src.slice(i);let m;
    if(/\s/.test(c)){i++;continue}
    if(c==='"'||c==='„'||c==='”'){
      const close=src.slice(i+1).search(/["”“]/);
      if(close<0)throw FErr('Lipsește ghilimeaua de închidere.');
      t.push({k:'str',v:src.slice(i+1,i+1+close)});i+=close+2;continue;
    }
    if((m=rest.match(/^\d+(\.\d+)?/))){t.push({k:'num',v:parseFloat(m[0])});i+=m[0].length;continue}
    if((m=rest.match(/^([A-Za-zĂÂÎȘȚăâîșț]+)(\d+)?/))){
      if(m[2])t.push({k:'ref',v:(m[1]+m[2]).toUpperCase()});else t.push({k:'name',v:m[1].toUpperCase()});
      i+=m[0].length;continue;
    }
    if((m=rest.match(/^(<=|>=|<>|[-+*\/=<>(),;:])/))){t.push({k:'op',v:m[0]});i+=m[0].length;continue}
    throw FErr(`Excel nu înțelege semnul „${c}”.`);
  }
  return t;
}
function colIdx(L){return L.charCodeAt(0)-64}
function splitRef(r){const m=r.match(/^([A-Z]+)(\d+)$/);return[m[1],+m[2]]}
function expandRange(a,b){
  const[ca,ra]=splitRef(a),[cb,rb]=splitRef(b),out=[];
  if(ca.length>1||cb.length>1)throw FErr('Zona e prea mare pentru joc.');
  for(let c=Math.min(colIdx(ca),colIdx(cb));c<=Math.max(colIdx(ca),colIdx(cb));c++)
    for(let r=Math.min(ra,rb);r<=Math.max(ra,rb);r++)out.push(String.fromCharCode(64+c)+r);
  return out;
}
function evaluate(formula,get){
  if(typeof formula!=='string'||!formula.startsWith('='))throw FErr('Formula trebuie să înceapă cu =.');
  const T=tokenize(formula.slice(1));let p=0;
  if(!T.length)throw FErr('După = nu ai scris nimic.');
  const peek=()=>T[p],isOp=v=>T[p]&&T[p].k==='op'&&T[p].v===v;
  const num=v=>{if(typeof v==='number')return v;if(v===''||v==null)return 0;if(typeof v==='boolean')return v?1:0;
    throw FErr('Formula calculează cu un text ca și cum ar fi număr.','#VALOARE')};
  function cmp(){
    const a=add(),t=peek();
    if(t&&t.k==='op'&&['=','<>','<','>','<=','>='].includes(t.v)){
      p++;const b=add();
      let x=a,y=b;if(typeof x==='string'||typeof y==='string'){x=String(x??'').toLowerCase();y=String(y??'').toLowerCase()}else{x=num(x);y=num(y)}
      return {'=':x===y,'<>':x!==y,'<':x<y,'>':x>y,'<=':x<=y,'>=':x>=y}[t.v];
    }
    return a;
  }
  function add(){let a=mul();while(isOp('+')||isOp('-')){const o=T[p++].v,b=mul();a=o==='+'?num(a)+num(b):num(a)-num(b)}return a}
  function mul(){let a=un();while(isOp('*')||isOp('/')){const o=T[p++].v,b=un();if(o==='/'){if(num(b)===0)throw FErr('Împărțire la zero.','#DIV/0!');a=num(a)/num(b)}else a=num(a)*num(b)}return a}
  function un(){if(isOp('-')){p++;return -num(un())}if(isOp('+')){p++;return num(un())}return prim()}
  function prim(){
    const t=T[p];
    if(!t)throw FErr('Formula se termină prea devreme.');
    if(t.k==='num'){p++;return t.v}
    if(t.k==='str'){p++;return t.v}
    if(t.k==='ref'){p++;if(isOp(':')){p++;const b=T[p];if(!b||b.k!=='ref')throw FErr('După „:” trebuie adresa celuilalt colț.');p++;return{range:expandRange(t.v,b.v)}}return get(t.v)}
    if(t.k==='name'){
      p++;if(!isOp('('))throw FErr(`„${t.v}” nu e o adresă de celulă și nici o funcție urmată de paranteză.`);
      p++;const args=[];
      if(!isOp(')')){for(;;){args.push(cmp());if(isOp(';')||isOp(',')){p++;continue}break}}
      if(!isOp(')'))throw FErr('Lipsește paranteza de închidere.');
      p++;return call(t.v,args);
    }
    if(isOp('(')){p++;const v=cmp();if(!isOp(')'))throw FErr('Lipsește paranteza de închidere.');p++;return v}
    throw FErr(`Nu mă așteptam la „${t.v}” aici.`);
  }
  function nums(args){const out=[];args.forEach(a=>{if(a&&a.range)a.range.forEach(r=>{const v=get(r);if(typeof v==='number')out.push(v)});else out.push(num(a))});return out}
  function call(name,args){
    if(args.some(a=>a&&a.range)&&name==='IF')throw FErr('IF nu primește o zonă, ci o comparație.');
    switch(name){
      case 'SUM':return nums(args).reduce((s,x)=>s+x,0);
      case 'AVERAGE':{const n=nums(args);if(!n.length)throw FErr('Media unei zone fără numere nu se poate calcula.','#DIV/0!');return n.reduce((s,x)=>s+x,0)/n.length}
      case 'MAX':{const n=nums(args);return n.length?Math.max(...n):0}
      case 'MIN':{const n=nums(args);return n.length?Math.min(...n):0}
      case 'IF':{if(args.length<2)throw FErr('IF are nevoie de condiție și de cel puțin un rezultat.');const c=args[0];const yes=typeof c==='string'?c!=='':!!num(c);return yes?args[1]:(args.length>2?args[2]:false)}
    }
    const ro=RO_NAMES[name];
    throw FErr(`Excel nu cunoaște funcția ${name}.${ro?` Numele funcțiilor sunt în engleză: ${ro}.`:''}`,'#NUME?');
  }
  const v=cmp();
  if(p<T.length){
    if(T[p].k==='op'&&(T[p].v===';'||T[p].v===','))throw FErr('Semnul „;” sau „,” se folosește doar în interiorul unei funcții.');
    throw FErr(`Nu mă așteptam la „${T[p].v}” aici.`);
  }
  if(v&&v.range)throw FErr('O zonă singură nu e un rezultat. Pune-o într-o funcție, de exemplu SUM(…).');
  return v;
}
const fmt=v=>typeof v==='number'?(Number.isInteger(v)?String(v):v.toLocaleString('ro-RO',{maximumFractionDigits:2})):typeof v==='boolean'?(v?'adevărat':'fals'):String(v??'');
const same=(a,b)=>typeof a==='number'&&typeof b==='number'?Math.abs(a-b)<1e-6:String(a).trim().toLowerCase()===String(b).trim().toLowerCase();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function totals(){let st=0,xp=0;for(const k in S.lv){st+=S.lv[k].stars||0;xp+=S.lv[k].xp||0}return{st,xp}}
const unlocked=i=>i===0||!!S.lv[i-1];

    hud.innerHTML=`<span class="nb">${addr}</span><span class="fx">fx</span><span class="fv">${txt}${R.streak>=2?` <span class="hot">serie ×${R.streak}</span>`:''}</span>`;
  }else{
    hud.innerHTML=`<span class="nb">TOTAL</span><span class="fx">fx</span><span class="fv">=★ ${t.st}/${LEVELS.length*3} · ${t.xp} XP</span>`;
  }
}
function shell(inner,tabs){

  setHud();window.scrollTo({top:0});
}

function startLevel(i){R={li:i,qi:0,xp:0,first:0,streak:0,phase:'read'};readPage()}
function readPage(){
  const L=LEVELS[R.li];
  shell(`
    <div class="eyebrow">${L.boss?'Nivelul final':'Nivelul '+(R.li+1)} · pagina de citit</div>

  document.getElementById('go').onclick=()=>{R.phase='q';question()};
}
function question(){
  const L=LEVELS[R.li],Q=L.qs[R.qi];R.att=0;R.done=false;
  shell(`
    <div class="row" style="justify-content:space-between"><div class="eyebrow">${esc(L.t)}</div>
    <button class="btn ghost sm" id="peekb" type="button" aria-expanded="false">Recitește pagina</button></div>

    <div class="stack" style="margin-top:14px">

      <div id="body"></div>
      <div id="fb" aria-live="polite"></div>
      <div class="row" id="nav"></div>
    </div>`,tabsFor());
  const pb=document.getElementById('peekb'),pk=document.getElementById('peek');
  pb.onclick=()=>{pk.hidden=!pk.hidden;pb.setAttribute('aria-expanded',String(!pk.hidden));pb.textContent=pk.hidden?'Recitește pagina':'Ascunde pagina'};
  ({choice:qChoice,tf:qTF,order:qOrder,classify:qClassify,pick:qPick,sheet:qSheet})[Q.t](Q,document.getElementById('body'));
}
function feedback(kind,html){document.getElementById('fb').innerHTML=`<div class="fb ${kind}">${html}</div>`}
function resolve(correct,msg){
  const Q=LEVELS[R.li].qs[R.qi];
  if(correct){
    let pts=R.att===0?10:4;
    if(R.att===0){R.first++;R.streak++;if(R.streak>=3)pts+=2}else R.streak=0;
    R.xp+=pts;R.done=true;
    feedback('ok',`<strong>Corect! +${pts} XP${R.att===0&&R.streak>=3?' (cu bonus de serie)':''}</strong><br>${Q.why}`);
    showNext();
  }else{R.att++;R.streak=0;feedback('bad',`<strong>Nu încă.</strong> ${msg||''}`)}
  setHud();
}
function giveUp(html){const Q=LEVELS[R.li].qs[R.qi];R.done=true;R.streak=0;feedback('bad',`<strong>Răspunsul corect:</strong> ${html}<br>${Q.why}`);showNext();setHud()}
function showNext(){
  const last=R.qi===LEVELS[R.li].qs.length-1;
  document.getElementById('nav').innerHTML=`<button class="btn primary" id="next" type="button">${last?'Termină nivelul':'Mai departe →'}</button>`;
  const n=document.getElementById('next');n.focus({preventScroll:true});
  n.onclick=()=>{if(last)endLevel();else{R.qi++;question()}};
}
function revealButton(fn){
  const nav=document.getElementById('nav');
  if(R.att>=2&&!R.done&&!document.getElementById('reveal')){
    const b=document.createElement('button');b.className='btn ghost';b.id='reveal';b.type='button';b.textContent='Arată-mi răspunsul';b.onclick=fn;nav.appendChild(b);
  }
}

/* alegere / adevărat-fals */
function qChoice(Q,body){
  body.innerHTML=`<div class="opts">${Q.o.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  const bs=[...body.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{
    if(R.done)return;const k=+b.dataset.k;
    if(k===Q.ok){b.classList.add('ok');bs.forEach(x=>x.disabled=true);resolve(true)}
    else{b.classList.add('bad');b.disabled=true;resolve(false,'Mai încearcă. Dacă ai nevoie, recitește pagina.');
      if(R.att>=2){bs.forEach(x=>x.disabled=true);bs[Q.ok].classList.add('ok');giveUp(esc(Q.o[Q.ok]))}}
  });
}
function qTF(Q,body){qChoice({...Q,o:['Adevărat','Fals'],ok:Q.ok?0:1},body)}

/* ordonare */
function qOrder(Q,body){
  const n=Q.items.length;let pool=Q.items.map((_,k)=>k);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  if(pool.every((v,k)=>v===k))pool.reverse();
  let picked=[];
  function draw(){
    body.innerHTML=`<div class="twocol">
      <div><div class="lbl">Pașii amestecați · apasă-i în ordine</div><div class="pool">${pool.filter(k=>!picked.includes(k)).map(k=>`<button class="opt" type="button" data-k="${k}">${esc(Q.items[k])}</button>`).join('')||'<span class="hint">Ai folosit toți pașii.</span>'}</div></div>
      <div><div class="lbl">Ordinea ta</div><div class="slots">${Array.from({length:n},(_,i)=>`<div class="slot ${picked[i]!==undefined?'full':''}"><b>${i+1}</b>${picked[i]!==undefined?esc(Q.items[picked[i]]):'—'}</div>`).join('')}</div></div>
    </div>`;
    body.querySelectorAll('.pool .opt').forEach(b=>b.onclick=()=>{if(R.done)return;picked.push(+b.dataset.k);draw()});
    if(!R.done){
      const nav=document.getElementById('nav');
      nav.innerHTML=`<button class="btn primary" id="chk" type="button" ${picked.length<n?'disabled':''}>Verifică</button><button class="btn ghost" id="clr" type="button">Golește</button>`;
      document.getElementById('clr').onclick=()=>{picked=[];draw()};
      document.getElementById('chk').onclick=()=>{
        const good=picked.filter((v,i)=>v===i).length;
        if(good===n)resolve(true);
        else{resolve(false,`${good} din ${n} pași sunt la locul lor.`);picked=[];draw()}
      };
      revealButton(()=>{picked=Q.items.map((_,k)=>k);giveUp(Q.items.map(esc).join(' → '));draw()});
    }
  }
  draw();
}

/* clasificare */
function qClassify(Q,body){
  const choice=Q.items.map(()=>null);
  body.innerHTML=`<div class="cls">${Q.items.map((it,k)=>`<div class="cls-row" data-k="${k}"><span class="val">${esc(it[0])}</span><span class="seg" role="group" aria-label="Tipul pentru ${esc(it[0])}">${Q.cats.map((c,ci)=>`<button type="button" data-c="${ci}" aria-pressed="false">${esc(c)}</button>`).join('')}</span></div>`).join('')}</div>`;
  body.querySelectorAll('.cls-row').forEach(row=>{
    const k=+row.dataset.k;
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(R.done)return;choice[k]=+b.dataset.c;
      row.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});
      row.classList.remove('wrong','right');
    });
  });
  const nav=document.getElementById('nav');
  nav.innerHTML=`<button class="btn primary" id="chk" type="button">Verifică</button>`;
  document.getElementById('chk').onclick=()=>{
    if(R.done)return;
    if(choice.some(c=>c===null)){feedback('bad','<strong>Mai ai valori fără tip.</strong> Alege un tip pentru fiecare rând.');return}
    let bad=0;
    body.querySelectorAll('.cls-row').forEach(row=>{const k=+row.dataset.k,ok=choice[k]===Q.items[k][1];row.classList.toggle('wrong',!ok);row.classList.toggle('right',ok);if(!ok)bad++});
    if(!bad){nav.innerHTML='';resolve(true)}
    else{resolve(false,`${bad} ${bad===1?'valoare are':'valori au'} tipul greșit (marcate cu roșu).`);
      revealButton(()=>{body.querySelectorAll('.cls-row').forEach(row=>{const k=+row.dataset.k;row.classList.remove('wrong');row.classList.add('right');row.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.c===Q.items[k][1]))});nav.innerHTML='';giveUp('tipurile corecte sunt marcate acum.')})}
  };
}

/* alegere de celulă / zonă */
function qPick(Q,body){
  let a=null,b=null;
  const L=i=>String.fromCharCode(65+i);
  function inSel(addr){if(!a)return false;if(!b)return addr===a;return expandRange(a,b).includes(addr)}
  function label(){if(!a)return '—';if(!Q.range||!b)return a;const r=expandRange(a,b);return r[0]+':'+r[r.length-1]}
  function draw(){
    let h=`<div class="fxrow" style="margin-bottom:8px"><span class="nb">${label()}</span><span class="fx">fx</span><input id="pickfx" type="text" disabled value="" aria-label="Bara de formule"></div><div class="gridwrap"><table class="g"><thead><tr><th></th>`;
    for(let c=0;c<Q.cols;c++)h+=`<th>${L(c)}</th>`;
    h+='</tr></thead><tbody>';
    for(let r=1;r<=Q.rows;r++){h+=`<tr><th>${r}</th>`;for(let c=0;c<Q.cols;c++){const ad=L(c)+r;h+=`<td class="${inSel(ad)?(ad===a&&!b?'pick':'inr'):''}"><button type="button" data-a="${ad}" aria-label="Celula ${ad}"></button></td>`}h+='</tr>'}
    body.innerHTML=h+'</tbody></table></div>'+(Q.range?'<p class="hint" style="margin:6px 0 0">Primul clic = un colț, al doilea = colțul opus. Al treilea clic o ia de la capăt.</p>':'');
    body.querySelectorAll('.g button').forEach(x=>x.onclick=()=>{
      if(R.done)return;const ad=x.dataset.a;
      if(!Q.range){a=ad;b=null}else if(!a||b){a=ad;b=null}else b=ad;
      draw();
    });
  }
  draw();
  const nav=document.getElementById('nav');
  nav.innerHTML=`<button class="btn primary" id="chk" type="button">Verifică</button>`;
  document.getElementById('chk').onclick=()=>{
    if(R.done)return;
    const got=label();
    if(got===Q.ans){nav.innerHTML='';resolve(true)}
    else{resolve(false,got==='—'?'Nu ai ales nimic încă.':`Ai ales ${got}. ${Q.range?'Uită-te la literele de sus și la numerele din stânga pentru ambele colțuri.':'Caută întâi coloana (litera de sus), apoi rândul (numărul din stânga).'}`);
      revealButton(()=>{const p=Q.ans.split(':');a=p[0];b=p[1]||null;draw();nav.innerHTML='';giveUp(Q.ans)})}
  };
}

/* foaia de calcul cu formule adevărate */
function qSheet(Q,body){
  const F={};Object.keys(Q.targets).forEach(k=>F[k]='');
  let act=Object.keys(Q.targets)[0];
  const L=i=>String.fromCharCode(65+i);
  function getter(formulas,data){
    const memo={},stack=new Set();
    const get=addr=>{
      if(addr in memo)return memo[addr];
      if(addr in formulas){
        const f=formulas[addr];if(f===''){return ''}
        if(stack.has(addr))throw FErr('Formula trimite la ea însăși.','#CIRC');
        stack.add(addr);
        try{const v=f.startsWith('=')?evaluate(f,get):f;memo[addr]=v;return v}finally{stack.delete(addr)}
      }
      return addr in data?data[addr]:'';
    };
    return get;
  }
  function shown(addr){
    if(!(addr in F))return {txt:fmt(Q.cells[addr]??''),num:typeof Q.cells[addr]==='number'};
    const f=F[addr];if(f==='')return {txt:'',num:false};
    if(!f.startsWith('='))return {txt:f,num:false};
    try{const v=getter(F,Q.cells)(addr);return {txt:fmt(v),num:typeof v==='number'}}catch(e){return {txt:e.show,num:false,err:true}}
  }
  function draw(){
    let h=`<div class="fxrow" style="margin-bottom:8px"><span class="nb" id="nb">${act}</span><span class="fx">fx</span>
      <input id="fxin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Bara de formule" value="${esc(F[act]??'')}" placeholder="scrie formula, de ex. =B2*C2">
      <button type="button" id="put" aria-label="Pune formula în celulă">↵</button></div>
      <div class="gridwrap"><table class="g"><thead><tr><th></th>`;
    for(let c=0;c<Q.cols;c++)h+=`<th>${L(c)}</th>`;
    h+='</tr></thead><tbody>';
    for(let r=1;r<=Q.rows;r++){
      h+=`<tr><th>${r}</th>`;
      for(let c=0;c<Q.cols;c++){
        const ad=L(c)+r,tg=ad in F,s=shown(ad);
        const cls=[tg?'tgt':'',tg&&F[ad]!==''?'filled':'',ad===act?'act':'',s.err?'err':''].join(' ');
        const inner=`<span class="${s.num?'num':''} ${r===1?'hdr':''}" style="display:block">${esc(s.txt)}</span>`;
        h+=tg?`<td class="${cls}"><button type="button" data-a="${ad}" aria-label="Celula ${ad} de completat">${inner}</button></td>`:`<td><div data-a="${ad}">${inner}</div></td>`;
      }
      h+='</tr>';
    }
    body.innerHTML=h+`</tbody></table></div><div class="toast" id="toast" aria-live="polite"></div>
      <p class="hint" style="margin:0">Celulele cu chenar sunt ale tale. Funcțiile se scriu în engleză. Între părțile lui IF merge și <code>;</code>, și <code>,</code>.</p>`;
    const inp=body.querySelector('#fxin');
    body.querySelectorAll('.g td>button').forEach(x=>x.onclick=()=>{if(R.done)return;commit(false);act=x.dataset.a;draw();body.querySelector('#fxin').focus()});
    body.querySelectorAll('.g td>div').forEach(x=>x.onclick=()=>{body.querySelector('#nb').textContent=x.dataset.a;body.querySelector('#toast').textContent=`${x.dataset.a} are datele tabelului. Tu scrii doar în celulele cu chenar.`});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit(true)}});
    body.querySelector('#put').onclick=()=>commit(true);
  }
  function commit(advance){
    const inp=body.querySelector('#fxin');if(!inp||R.done)return;
    F[act]=inp.value.trim();
    if(advance){
      const keys=Object.keys(F),i=keys.indexOf(act),nxt=keys.slice(i+1).concat(keys.slice(0,i)).find(k=>F[k]==='');
      const s=shown(act);
      draw();
      const t=body.querySelector('#toast');
      if(F[act]!==''&&!F[act].startsWith('='))t.textContent=`În ${act} ai scris text, nu formulă: formula începe cu =.`;
      else if(s.err){try{getter(F,Q.cells)(act)}catch(e){t.textContent=`${act}: ${e.message}`}}
      else if(nxt){act=nxt;draw();body.querySelector('#fxin').focus()}
    }
  }
  function problems(){
    const out=[];
    const variants=(Q.variants||[]).slice();
    const auto={};Object.entries(Q.cells).forEach(([k,v],i)=>{if(typeof v==='number')auto[k]=v+(i%3+1)*3});
    variants.push(auto);
    for(const ad of Object.keys(F)){
      const f=F[ad];
      if(f===''){out.push(`${ad} e goală.`);continue}
      if(!f.startsWith('=')){out.push(`În ${ad} ai scris text, nu formulă: formula începe cu =.`);continue}
      let toks;try{toks=tokenize(f.slice(1))}catch(e){out.push(`${ad}: ${e.message}`);continue}
      if(!toks.some(t=>t.k==='ref')){out.push(`${ad} are doar numere scrise de mână. Folosește adresele celulelor, ca rezultatul să se recalculeze.`);continue}
      let got,exp;
      try{got=getter(F,Q.cells)(ad)}catch(e){out.push(`${ad}: ${e.message}`);continue}
      exp=getter(Q.targets,Q.cells)(ad);
      if(!same(got,exp)){out.push(`${ad} dă ${fmt(got)||'nimic'}, dar ar trebui să dea ${fmt(exp)}.`);continue}
      for(const v of variants){
        const data={...Q.cells,...v};
        let g2;try{g2=getter(F,data)(ad)}catch(e){g2='#'}
        const e2=getter(Q.targets,data)(ad);
        if(!same(g2,e2)){out.push(`${ad} dă rezultatul bun acum, dar greșește când se schimbă datele din tabel. Verifică adresele și comparația.`);break}
      }
    }
    return out;
  }
  draw();
  const nav=document.getElementById('nav');
  nav.innerHTML=`<button class="btn primary" id="chk" type="button">Verifică</button>`;
  document.getElementById('chk').onclick=()=>{
    if(R.done)return;commit(false);const pr=problems();draw();
    if(!pr.length){nav.innerHTML='';resolve(true)}
    else{resolve(false,pr.slice(0,2).join(' ')+(pr.length>2?` (încă ${pr.length-2})`:''));
      revealButton(()=>{Object.assign(F,Q.targets);draw();nav.innerHTML='';giveUp('formulele corecte sunt acum în celule. Apasă pe ele și citește-le în bara fx.')})}
  };
}

/* ================= final de nivel + diplomă ================= */
function endLevel(){
  const L=LEVELS[R.li],n=L.qs.length,ratio=R.first/n,stars=ratio===1?3:ratio>=.6?2:1;
  const prev=S.lv[R.li];
  S.lv[R.li]={stars:Math.max(stars,prev?prev.stars:0),xp:Math.max(R.xp,prev?prev.xp:0)};
  save();R.phase='end';
  const next=R.li+1<LEVELS.length;
  shell(`
    <div class="eyebrow">${esc(L.t)} · nivel terminat</div>
    <div class="end-stars" style="margin:14px 0 6px" aria-label="${stars} stele din 3">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <h2>${stars===3?'Perfect, toate din prima!':stars===2?'Foarte bine!':'Nivel trecut. Poți lua mai multe stele.'}</h2>
    <p class="lede">${R.first} din ${n} răspunsuri corecte din prima · ${R.xp} XP.${stars<3?' Recitește pagina și reia nivelul pentru 3 stele.':''}</p>
    <div class="row" style="margin-top:20px">
      ${next?'<button class="btn primary" id="nx" type="button">Nivelul următor →</button>':'<button class="btn primary" id="dp" type="button">Vezi diploma</button>'}
      <button class="btn" id="again" type="button">Reia nivelul</button>
      <button class="btn ghost" id="toc" type="button">Cuprins</button>
    </div>`,tabsFor());
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>startLevel(R.li+1);
  const dp=document.getElementById('dp');if(dp)dp.onclick=diploma;
  document.getElementById('again').onclick=()=>startLevel(R.li);
  document.getElementById('toc').onclick=home;
}
function diploma(){
  R=null;const t=totals(),d=new Date();
  const data=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  shell(`
    <div class="diploma">
      <div class="eyebrow">Diplomă</div>
      <h2 style="margin-top:6px">Analist de date</h2>
      <div class="nm">${esc(S.nume||'Elevul fără nume')}</div>
      <p style="margin:0 auto 14px;max-width:46ch">a trecut toate cele ${LEVELS.length} niveluri ale Misiunii Analist: celule, tipuri de date, formule, funcții, IF, sortare și grafice.</p>
      <div class="facts"><span>★ ${t.st}/${LEVELS.length*3}</span><span>${t.xp} XP</span><span>${data}</span></div>
    </div>
    <h3 style="margin-top:28px">Provocarea din Excel-ul adevărat</h3>
    <p class="hint" style="margin:4px 0 10px">Arată-i profesorului diploma, apoi deschide Excel și fă experimentul pe bune:</p>
    <ol class="check">
      <li>Copiază tabelul plantelor (3 plante × 3 săptămâni) într-o foaie numită „Plante”.</li>
      <li>Calculează creșterea fiecărei plante cu o formulă și creșterea maximă cu MAX.</li>
      <li>Adaugă o coloană „Verdict” cu IF: „crește bine” de la 5 cm în sus, altfel „nu crește”.</li>
      <li>Pune borduri tabelului și fă un grafic linie cu titlu.</li>
      <li>Salvează ca <code>Nume_Prenume_plante.xlsx</code> în folderul clasei.</li>
    </ol>
    <div class="row" style="margin-top:16px"><button class="btn" id="toc" type="button">Înapoi la cuprins</button></div>`);
  document.getElementById('toc').onclick=home;
}

document.getElementById('go-home').onclick=home;

/* bara de sus se restrânge la derularea în jos (doar ecrane înguste); revenire DOAR manuală */
(function(){
  const narrow=matchMedia('(max-width:600px)'),bar=document.querySelector('.hud-in'),cls=document.body.classList;
  let last=window.scrollY,acc=0;
  window.addEventListener('scroll',()=>{const y=window.scrollY,d=y-last;last=y;if(!narrow.matches||d<=0){acc=0;return}acc+=d;if(acc>24&&y>80)cls.add('hdr-collapsed')},{passive:true});
  document.getElementById('hdr-pull').onclick=()=>cls.remove('hdr-collapsed');
  let startY=null,captured=false;
  bar.addEventListener('pointerdown',e=>{if(cls.contains('hdr-collapsed')){startY=e.clientY;captured=false}});
  bar.addEventListener('pointermove',e=>{if(startY===null)return;const dy=e.clientY-startY;if(!captured&&dy>10){try{bar.setPointerCapture(e.pointerId)}catch(_){}captured=true}if(dy>28){cls.remove('hdr-collapsed');startY=null}});
  bar.addEventListener('pointerup',()=>{startY=null});
  bar.addEventListener('pointercancel',()=>{startY=null});
})();

window.__misiune={evaluate,LEVELS};
home();
})();

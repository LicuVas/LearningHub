<style>

  --desk:#E8EEF6; --paper:#FFFFFF; --paper2:#F3F6FB; --line:#C9D4E4;
  --ink:#152033; --ink2:#5A6A80; --accent:#1B4FD8; --accentInk:#FFFFFF; --sel:#D6E4FF;
  --mark:#FFE08A; --markInk:#152033; --ok:#1F6E3E; --okbg:#E2F1E6; --bad:#B42318; --badbg:#FBE4E1;
  --fd:"Outfit","Segoe UI",system-ui,sans-serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",Consolas,monospace;
  --bar:#1C2330; --barInk:#D5DEEA;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0E1218; --paper:#171D27; --paper2:#1E2531; --line:#2E3848;

  --mark:#E9C75A; --markInk:#1C1A0E; --ok:#74CF95; --okbg:#16301F; --bad:#FF8A7E; --badbg:#3A1D19;

}
/* tema: bara de activități Windows — Start, câteva aplicații, ceasul */
.banda{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;white-space:nowrap;overflow:hidden;
  background:var(--bar);border-bottom:2px solid var(--accent);color:var(--barInk)}
.banda .win{width:14px;height:14px;flex:none;background:var(--accent);
  clip-path:polygon(0 0,46% 0,46% 46%,0 46%,0 54%,46% 54%,46% 100%,0 100%,52% 0,100% 0,100% 46%,54% 46%,54% 54%,100% 54%,100% 100%,52% 100%)}
.banda .app{width:18px;height:18px;border-radius:3px;background:#2E3A4C;box-shadow:inset 0 -2px 0 var(--accent)}
.banda .clock{margin-left:auto;font:600 .68rem/1 var(--fm);letter-spacing:.04em}

<script src="../_motor/motor.js"></script>
<script>
/* Acoperirea programei (OMEN 3393/2017, clasa a V-a, CS.1.2), textul EXACT din curriculum.json. */
const PROG={
  rol:'Rolul unui sistem de operare',
  interfata:'Elemente de interfață ale unui sistem de operare',
  organizare:'Organizarea datelor pe suport extern',
  operatii:'Operații cu fișiere și directoare'
};

/* Întrebările sunt cele din testele de la clasă (18.09.2026):
   Test TIC — Hardware, Windows, sisteme de operare (15 itemi)
   Test TIC — Windows, fișiere, foldere, clasa a XII-a (15 itemi)
   Unificate, fără dubluri. La itemii cu mai multe variante bune, elevul sortează fiecare variantă. */

const BAZA=[
 {t:'choice',lectii:[8],q:'Care dintre următoarele componente face parte din hardware-ul unui calculator?',
  o:['Sistemul de operare','Placa de bază','Programul de antivirus','Software-ul de procesare a textelor'],ok:1,
  why:'Placa de bază e o piesă fizică, deci hardware. Sistemul de operare, antivirusul și programul de texte sunt programe (software).'},
 {t:'choice',lectii:[8],q:'Care dintre următoarele este un sistem de operare?',
  o:['Windows 10','Google Chrome','Microsoft Word','Adobe Photoshop'],ok:0,
  why:'Windows 10 pornește calculatorul și rulează celelalte programe. Chrome, Word și Photoshop sunt aplicații, nu sisteme de operare.'},
 {t:'choice',lectii:[8],q:'În Windows, ce face tasta <kbd>Alt</kbd> + <kbd>Tab</kbd>?',
  o:['Deschide managerul de fișiere Explorer','Permite schimbarea între aplicațiile deschise','Închide toate aplicațiile deschise','Deschide meniul Start din Windows'],ok:1,
  why:'Ții Alt și apeși Tab: treci de la o fereastră deschisă la alta. Managerul de fișiere e Explorer, Start e tasta Windows, iar Alt+F4 închide fereastra.'},
 {t:'choice',lectii:[8],q:'Ce reprezintă termenul „driver” într-un sistem de operare?',
  o:['Un tip de program care controlează un dispozitiv hardware','O aplicație care îmbunătățește performanțele unui calculator','Un program care îți permite să navighezi pe internet','Un program care îți protejează sistemul de viruși'],ok:0,
  why:'Driverul e translatorul dintre sistemul de operare și o piesă (imprimantă, placă video, stick). Fără el, Windows nu știe cum să vorbească cu dispozitivul.'},
 {t:'choice',lectii:[9],q:'Ce este un folder?',
  o:['Un fișier audio salvat pe disc','Un program antivirus instalat','Un spațiu virtual pentru organizarea fișierelor','Un alt nume folosit pentru tastatură'],ok:2,
  why:'Folderul (directorul) e un raft: pune la un loc fișiere și alte foldere. El însuși nu e melodia, nici programul, nici o piesă hardware.'},
 {t:'choice',lectii:[9],q:'Care este extensia unui fișier text creat cu Notepad?',
  o:['.docx','.txt','.xlsx','.pdf'],ok:1,
  why:'Notepad salvează text simplu, cu extensia .txt. .docx e Word, .xlsx e Excel, .pdf e un document gata de tipar.'},
 {t:'choice',lectii:[10],q:'Ce combinație de taste se folosește pentru a copia un fișier?',
  o:['Ctrl + X','Ctrl + C','Ctrl + V','Alt + F4'],ok:1,
  why:'Ctrl+C copiază. Ctrl+X taie (mută), Ctrl+V lipește, Alt+F4 închide fereastra.'},
 {t:'choice',lectii:[10],q:'Ce face combinația <kbd>Ctrl</kbd> + <kbd>V</kbd>?',
  o:['Copiază fișierul selectat','Taie fișierul selectat','Lipește fișierul copiat sau tăiat','Șterge fișierul selectat'],ok:2,
  why:'V vine de la „paste” (lipire). Întâi copiez sau tai, apoi Ctrl+V pune copia (sau originalul tăiat) la locul nou.'},
 {t:'choice',lectii:[9],q:'Unde putem găsi „Coșul de reciclare” (Recycle Bin) în Windows?',
  o:['În bara de activități','În bara de adrese','Pe desktop','În BIOS'],ok:2,
  why:'Coșul stă, de regulă, pe desktop. Bara de adrese e din Explorer, BIOS-ul e meniul de dinaintea pornirii Windows, nu un loc pentru fișiere.'},
 {t:'choice',lectii:[9],q:'Ce simbol are, de regulă, un folder în Windows?',
  o:['Un ceas de perete sau de mână','O icoană albastră de program','O pictogramă galbenă în formă de dosar','O roată dințată de la setări'],ok:2,
  why:'Folderul e desenat ca un dosar galben de birou. Ceasul e pentru oră, roata dințată e pentru setări.'}
];

const CONSOLIDAT=[
 {t:'choice',lectii:[8],q:'Ce rol are memoria RAM într-un calculator?',
  o:['Stochează datele permanent','Stochează temporar datele pentru procesare','Permite accesul rapid la datele de pe hard disk','Controlează funcționarea monitorului'],ok:1,
  why:'RAM-ul ține ce lucrezi acum. La oprire se golește. Ce vrei să rămână trebuie salvat pe disc (HDD sau SSD).'},
 {t:'choice',lectii:[8],q:'În Windows, ce se află în bara de activități?',
  o:['Doar aplicațiile deschise','Doar aplicațiile minimizate','Aplicațiile deschise și aplicațiile fixate','Doar pictogramele aplicațiilor instalate'],ok:2,
  why:'Jos pe ecran vezi atât ferestrele deschise, cât și icoanele pe care le-ai fixat (chiar dacă programul e închis).'},
 {t:'choice',lectii:[8],q:'Ce se întâmplă atunci când un sistem de operare este „bootat”?',
  o:['Sistemul de operare este instalat pe hard disk','Calculatorul este pornit și se încarcă sistemul de operare','Se creează un cont de utilizator pe calculator','Se restabilește sistemul de operare dintr-un backup'],ok:1,
  why:'Boot = pornire: calculatorul se aprinde și încarcă Windows (sau alt sistem) de pe disc, până ajungi la desktop.'},
 {t:'choice',lectii:[8],q:'În Windows, care este scopul „Panoului de control”?',
  o:['Permite instalarea de aplicații','Permite configurarea setărilor sistemului','Permite redimensionarea ferestrelor','Permite rularea programelor antivirus'],ok:1,
  why:'Din Panoul de control schimbi setările calculatorului (sunet, afișare, conturi, dispozitive). Nu e magazinul de aplicații și nu trage de colțul ferestrei.'},
 {t:'choice',lectii:[9],q:'Ce tipuri de fișiere pot fi deschise cu aplicația „Notepad” din Windows?',
  o:['Fișiere .txt','Fișiere .jpg','Fișiere .html','Fișiere .exe'],ok:0,
  why:'Notepad e pentru text simplu (.txt). O poză .jpg și un program .exe nu se citesc ca text util; .html se poate deschide ca text, dar nu e treaba lui Notepad la clasă.'},
 {t:'classify',lectii:[8],q:'Ce este sistemul de operare Windows? Sortează fiecare variantă.',
  cats:['Adevărat','Fals'],
  items:[['Un program de editare foto',1],['Un sistem de operare cu interfață grafică',0],['Un tip de imprimantă',1],['Un software care gestionează resursele calculatorului',0]],
  why:'Windows e programul care pornește calculatorul, arată ferestrele și împarte memoria și discul între aplicații. Nu e un editor foto și nu e o imprimantă.'},
 {t:'classify',lectii:[9],q:'Care dintre următoarele sunt fișiere? Sortează fiecare variantă.',
  cats:['Este fișier','Nu este fișier'],
  items:[['tema.docx',0],['muzica',1],['film.mp4',0],['C:\\Program Files',1]],
  why:'Un fișier are, de regulă, nume + extensie: tema.docx, film.mp4. „muzica” fără extensie e ambiguu. C:\\Program Files e un folder, nu un fișier.'},
 {t:'classify',lectii:[10],q:'Ce operații se pot face cu fișiere și foldere în Windows? Sortează fiecare variantă.',
  cats:['Se poate','Nu se poate'],
  items:[['Creare',0],['Ștergere',0],['Mutare',0],['Tipărire directă din BIOS',1]],
  why:'În Windows creezi, ștergi și muți fișiere din Explorer. BIOS-ul e meniul de dinaintea pornirii Windows: de acolo nu tipărești fișiere.'},
 {t:'classify',lectii:[10],q:'Cum redenumim un fișier în Windows? Sortează fiecare variantă.',
  cats:['Merge','Nu merge'],
  items:[['Click dreapta → Rename',0],['Selectăm fișierul și apăsăm F2',0],['Ctrl + R',1],['Click dublu lent și edităm numele',0]],
  why:'Redenumirea se face din meniul dreapta, cu F2, sau cu un al doilea clic lent pe nume. Ctrl+R nu redenumește (în browser reîncarcă pagina).'},
 {t:'classify',lectii:[10],q:'Ce se întâmplă când ștergem un fișier în Windows? Sortează fiecare variantă.',
  cats:['Adevărat','Fals'],
  items:[['Este trimis în Recycle Bin',0],['Este șters definitiv din BIOS',1],['Se salvează automat pe stick',1],['Poate fi restaurat dacă nu a fost golit Recycle Bin-ul',0]],
  why:'Delete trimite fișierul în Coș. De acolo îl poți aduce înapoi, dacă n-ai golit coșul. BIOS-ul și stickul n-au treabă cu ștergerea obișnuită.'},
 {t:'choice',lectii:[9],q:'Ce înseamnă extensia unui fișier?',
  o:['Numele fișierului','Locația fișierului','Indică tipul fișierului și aplicația cu care se deschide','Este opțională și nu influențează deschiderea'],ok:2,
  why:'După punct, .docx spune „deschide cu Word”, .jpg „deschide cu un program de imagini”. Numele e înainte de punct, calea e folderul în care stă.'},
 {t:'choice',lectii:[8],q:'Ce este bara de activități (Taskbar)?',
  o:['Spațiul unde apar aplicațiile deschise','Un dosar special pentru filme','Un meniu secret din Windows','Locul unde se află ora și data'],ok:0,
  why:'Bara de jos arată programele deschise (și pe cele fixate). Ora e doar un colț al ei, nu definiția. Nu e un folder de filme.'}
];

const AVANSAT=[
 {t:'classify',lectii:[8],q:'Care dintre următoarele afirmații sunt adevărate despre sistemele de operare Windows? Sortează fiecare variantă.',
  cats:['Adevărată','Falsă'],
  items:[['Windows permite utilizatorilor să creeze și să gestioneze conturi de utilizator',0],['Windows nu suportă aplicații de terță parte',1],['Windows 10 este un sistem de operare pe 32 de biți',1],['Windows are interfață grafică (GUI)',0]],
  why:'Ai conturi și o interfață cu ferestre. Windows rulează și programe făcute de alții. La clasă, Windows 10 e pe 64 de biți; afirmația „e pe 32 de biți” nu descrie ce folosim.'},
 {t:'classify',lectii:[9],q:'Care dintre următoarele tipuri de hard disk sunt folosite pentru stocarea permanentă a datelor într-un calculator? Sortează fiecare variantă.',
  cats:['Stocare permanentă pe disc','Nu e un disc de stocare permanentă'],
  items:[['SSD (Solid State Drive)',0],['HDD (Hard Disk Drive)',0],['RAM',1],['USB',1]],
  why:'HDD și SSD păstrează fișierele și după oprire. RAM-ul se golește la oprire. USB e un conector (un stick USB e alt dispozitiv, nu un tip de hard disk).'},
 {t:'classify',lectii:[8],q:'Care dintre următoarele caracteristici se regăsesc la un sistem de operare UNIX? Sortează fiecare variantă.',
  cats:['Da, e caracteristic','Nu e caracteristic'],
  items:[['Permite utilizarea mai multor utilizatori simultan',0],['Are o interfață grafică de utilizator (GUI) intuitivă',1],['Este utilizat în principal pe servere',0],['Se folosește doar pe calculatoare personale',1]],
  why:'UNIX e multi-utilizator și trăiește mai ales pe servere. Interfața lui clasică e în linie de comandă, nu un desktop „intuitiv” ca Windows, și nu e doar pentru calculatoare personale.'},
 {t:'choice',lectii:[9],q:'Ce înseamnă „formatizarea unui hard disk”?',
  o:['Împărțirea hard disk-ului în partiții','Ștergerea completă a tuturor datelor de pe hard disk','Instalarea unui sistem de operare pe hard disk','Crearea unui cont de utilizator pe hard disk'],ok:1,
  why:'Formatarea pregătește discul și șterge ce era pe el. Împărțirea în felii e partiționarea. Instalarea Windows vine după, nu e ea formatarea.'},
 {t:'classify',lectii:[8],q:'Care dintre următoarele sisteme de operare sunt utilizate pe telefoane mobile? Sortează fiecare variantă.',
  cats:['Da, pe telefoane','Nu e SO de telefon'],
  items:[['Android',0],['iOS',0],['Linux',1],['Windows 10',1]],
  why:'Telefoanele de azi rulează Android sau iOS. Linux e nucleul din Android, dar ca sistem cu acest nume stă pe calculatoare. Windows 10 e pentru PC.'},
 {t:'classify',lectii:[8],q:'Care sunt funcțiile principale ale unui sistem de operare? Sortează fiecare variantă.',
  cats:['E treaba sistemului de operare','E treaba unei aplicații'],
  items:[['Gestionarea hardware-ului și software-ului calculatorului',0],['Permite rularea aplicațiilor și interacțiunea cu utilizatorul',0],['Crearea de documente și fișiere',1],['Permite utilizarea internetului',1]],
  why:'Sistemul de operare gestionează piesele, memoria și pornește programele. Documentele le scrii în Word, internetul îl folosești din browser — astea sunt aplicații.'},
 {t:'classify',lectii:[11],q:'Care sunt locații uzuale pentru salvarea fișierelor? Sortează fiecare variantă.',
  cats:['Locație uzuală','Nu e loc de salvare'],
  items:[['Desktop',0],['Documente (Documents)',0],['Panoul de control',1],['Descărcări (Downloads)',0]],
  why:'Desktop, Documente și Descărcări sunt folderele obișnuite de lucru. Panoul de control e pentru setări, nu un sertar de fișiere.'},
 {t:'classify',lectii:[11],q:'Care sunt avantajele utilizării folderelor? Sortează fiecare variantă.',
  cats:['Este un avantaj','Nu e un avantaj al folderelor'],
  items:[['Organizare mai bună a fișierelor',0],['Creșterea vitezei procesorului',1],['Găsirea rapidă a documentelor',0],['Gruparea logică a informațiilor',0]],
  why:'Folderele pun ordine și te ajută să găsești. Procesorul nu aleargă mai tare pentru că ai făcut un folder galben.'}
];

JocMotor.porneste({
  mod:'antrenament',
  cheie:'joc_sistem_operare_v',
  titlu:'Test: Sistemul de operare',
  marca:'Test: <b>Sistemul de operare</b>',
  h1:'Test: <em>Sistemul de operare</em>',
  clasa:'a V-a',
  unitate:'V-U2',
  unitateTitlu:'Sistemul de operare. Ordinea în fișierele mele',
  competente:['CS.1.2'],
  lectii:'8–11',
  intro:'Antrenament pe întrebările de test despre Windows, fișiere și foldere. Trei runde: De bază, Consolidat, Avansat. La unele itemi trebuie judecată fiecare variantă, nu doar una. Reia o rundă: vin alte întrebări, pe aceleași lucruri.',
  banda:'<span class="win" aria-hidden="true"></span><span class="app" aria-hidden="true"></span><span class="app" aria-hidden="true"></span><span class="app" aria-hidden="true"></span><span class="clock">SO · FIȘIERE</span>',
  nivele:[
    {t:'De bază',descriptor:'De bază',cate:5,bazin:BAZA,lectii:[8,9,10],
     continuturi:[PROG.rol,PROG.interfata,PROG.organizare,PROG.operatii],
     text:'<p>Windows e <mark>sistemul de operare</mark>: pornește calculatorul și arată ferestrele. Fișierele stau în <mark>foldere</mark>. Copierea e <kbd>Ctrl</kbd>+<kbd>C</kbd>, lipirea e <kbd>Ctrl</kbd>+<kbd>V</kbd>.</p>'},
    {t:'Consolidat',descriptor:'Consolidat',cate:5,bazin:CONSOLIDAT,lectii:[8,9,10],
     continuturi:[PROG.rol,PROG.interfata,PROG.organizare,PROG.operatii],
     text:'<p>Bara de jos e <mark>bara de activități</mark>. Ștergerea trimite în <mark>Coș</mark>. Extensia (după punct) spune cu ce se deschide fișierul.</p>'},
    {t:'Avansat',descriptor:'Avansat',final:true,cate:4,bazin:AVANSAT,lectii:[8,9,11],
     continuturi:[PROG.rol,PROG.interfata,PROG.organizare,PROG.operatii],
     text:'<p>Un sistem de operare <mark>gestionează</mark> hardware-ul și programele. Formatarea unui disc <mark>șterge datele</mark>. Folderele pun ordine, nu grăbesc procesorul.</p>'}
  ],
  diploma:{
    titlu:'Ordinea în fișierele mele',
    rezumat:'trei runde de test despre sistemul de operare: rolul Windows, interfața, fișierele, folderele și operațiile cu ele',
    aplicatie:'Explorer-ul adevărat din Windows',
    provocare:[
      'Pe desktop, creează un folder cu numele tău de familie.',
      'Deschide Notepad, scrie două rânduri și salvează fișierul în acel folder, cu extensia <code>.txt</code>.',
      'Copiază fișierul cu <kbd>Ctrl</kbd>+<kbd>C</kbd> și lipește-l în folderul Documente.',
      'Redenumește copia cu <kbd>F2</kbd>, apoi șterge-o (ajunge în Coș) și restaureaz-o din Coș.',
      'Arată-i profesorului folderul și cele două fișiere, apoi golește doar copia de test din Coș.'
    ]
  }
});
</script>
</body>
</html>

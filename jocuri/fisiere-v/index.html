<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Ordine</title>
<meta name="description" content="Lecție-joc pentru clasa a V-a: rolul sistemului de operare, elementele de interfață, fișiere și directoare, operații cu fișiere și ordinea în resursele digitale personale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Cousine:wght@400;700&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#EEF2F7; --paper:#FFFFFF; --paper2:#F2F6FB; --line:#D2DBE6;
  --ink:#172233; --ink2:#566476; --accent:#0B5CAD; --accentInk:#FFFFFF; --sel:#CCE4FF;
  --mark:#FFE08A; --markInk:#172233; --ok:#23784A; --okbg:#E0F2E7; --bad:#B83A30; --badbg:#FBE6E3;
  --fd:"Rubik","Segoe UI",system-ui,sans-serif; --fb:"Noto Sans","Segoe UI",system-ui,sans-serif; --fm:"Cousine",Consolas,monospace;
  --folder:#F2C14E; --folder2:#E0A92E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F141C; --paper:#171E29; --paper2:#1F2835; --line:#2F3B4C;
  --ink:#E5ECF5; --ink2:#A1AFC2; --accent:#7DB8F5; --accentInk:#0F141C; --sel:#1E3A5C;
  --mark:#EDCB63; --markInk:#172233; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
  --folder:#E8B846; --folder2:#C99422;
}}
:root[data-theme="dark"]{
  --desk:#0F141C; --paper:#171E29; --paper2:#1F2835; --line:#2F3B4C;
  --ink:#E5ECF5; --ink2:#A1AFC2; --accent:#7DB8F5; --accentInk:#0F141C; --sel:#1E3A5C;
  --mark:#EDCB63; --markInk:#172233; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
  --folder:#E8B846; --folder2:#C99422;
}
/* tema jocului: bara de adresă din Explorer, cu dosarul galben și calea până la folderul elevului */
.banda{display:flex;align-items:center;gap:8px;padding:7px 12px;white-space:nowrap;overflow:hidden}
.dosar{flex:none;position:relative;width:20px;height:14px;background:var(--folder);border-radius:1px 3px 3px 3px;margin-top:3px}
.dosar::before{content:"";position:absolute;left:0;top:-4px;width:9px;height:5px;background:var(--folder2);border-radius:2px 2px 0 0}
.cale{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--fm);font-size:.74rem;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:2px 10px}
.cale b{color:var(--ink);font-weight:700}
.cale i{font-style:normal;color:var(--accent);padding:0 4px}
h1 .fol{display:inline-block;width:.62em;height:.42em;background:var(--folder);border-radius:1px 3px 3px 3px;margin-left:.2em;vertical-align:.06em;position:relative}
.hunt .tk{text-align:left}
/* ===== simulatoarele jocului: ecranul Windows (ecran) și Explorer (explorer) ===== */
.sim-teste{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.sim-teste ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.sim-teste li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.sim-teste li .s{flex:none;width:1.4em;text-align:center;font-weight:700;color:var(--ink2)}
.sim-teste li.ok .s{color:var(--ok)}
.sim-cum{margin:0 0 8px;font-size:.86rem;color:var(--ink2)}
.ex{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:.86rem;overflow:hidden;outline:none;color:var(--ink)}
.ex:focus-visible{box-shadow:0 0 0 3px var(--sel)}
.ex-bara{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--paper2);border-bottom:1px solid var(--line)}
.ex-bara button,.ex-sus{font:inherit;font-size:.8rem;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);cursor:pointer}
.ex-bara button:disabled{opacity:.4;cursor:default}
.ex-bara kbd{font-size:.68rem;margin-left:3px;opacity:.8}
.ex-adr{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-bottom:1px solid var(--line)}
.ex-cale{flex:1 1 170px;min-width:0;font-family:var(--fm);font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper)}
.ex-caut{flex:1 1 130px;min-width:0;font:inherit;font-size:.82rem;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
.ex-corp{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);min-height:190px}
.ex-nav{border-right:1px solid var(--line);padding:4px;overflow:auto;background:var(--paper2);max-height:260px}
.ex-nav button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;font:inherit;font-size:.8rem;padding:3px 4px;border:0;background:none;color:var(--ink);border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden}
.ex-nav button span.n{overflow:hidden;text-overflow:ellipsis}
.ex-nav button.on{background:var(--sel)}
.ex-lista{padding:4px;overflow:auto;min-width:0;max-height:260px}
.ex-cap{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,40%);gap:6px;padding:2px 6px;font-size:.72rem;color:var(--ink2);border-bottom:1px solid var(--line)}
.ex-rand{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,40%);gap:6px;align-items:center;width:100%;text-align:left;font:inherit;padding:5px 6px;border:1px solid transparent;border-radius:4px;background:none;color:var(--ink);cursor:pointer}
.ex-rand.on{background:var(--sel);border-color:var(--accent)}
.ex-rand .ex-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-rand .ex-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-size:.74rem}
.ex-gol{padding:14px 8px;color:var(--ink2);font-style:italic}
.ex-ic{flex:none;display:inline-block;position:relative;width:18px;height:13px;margin-top:2px}
.ex-ic.d{background:var(--folder);border-radius:1px 3px 3px 3px}
.ex-ic.d::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:4px;background:var(--folder2);border-radius:2px 2px 0 0}
.ex-ic.f{width:13px;height:16px;margin-top:0;border:1.5px solid var(--ink2);border-radius:2px 5px 2px 2px;background:var(--paper)}
.ex-ic.r{width:16px;height:12px;border:1.5px solid var(--ink2);border-radius:2px;background:var(--paper2)}
.ex-ic.c{width:13px;height:15px;border:1.5px solid var(--ink2);border-top-width:3px;border-radius:0 0 3px 3px}
.ex-ren{font:inherit;width:100%;min-width:0;padding:1px 4px;border:1px solid var(--accent);border-radius:3px;background:var(--paper);color:var(--ink)}
.ex-stare{padding:5px 8px;border-top:1px solid var(--line);background:var(--paper2);font-size:.8rem;color:var(--ink2);min-height:1.7em}
.ex-stare.av{color:var(--bad);font-weight:600}
.ex-meniu{position:absolute;z-index:5;min-width:170px;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px}
.ex-meniu button{display:flex;justify-content:space-between;gap:12px;width:100%;font:inherit;font-size:.82rem;padding:5px 8px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;border-radius:4px}
.ex-meniu button:hover,.ex-meniu button:focus{background:var(--sel)}
.ex-meniu hr{border:0;border-top:1px solid var(--line);margin:3px 0}
@media (max-width:560px){.ex-corp{grid-template-columns:minmax(0,1fr)}.ex-nav{max-height:120px;border-right:0;border-bottom:1px solid var(--line)}}
/* ecranul Windows simulat: culorile imită Windows 11 (luminos), în ambele teme ale jocului */
.ec{position:relative;height:310px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#1d5fa8,#3b8ad9 60%,#8cc3f0);font-size:.76rem;user-select:none;color:#1b1b1b;font-family:"Segoe UI",var(--fb)}
.ec-desk{position:absolute;left:0;right:0;top:0;bottom:38px}
.ec-icd{position:absolute;left:8px;top:8px;width:64px;text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-size:.7rem;background:none;border:0;padding:2px;cursor:default}
.ec-icd i{display:block;margin:0 auto 3px;width:22px;height:26px;border:2px solid #fff;border-top-width:5px;border-radius:0 0 5px 5px;opacity:.9}
.ec-bar{position:absolute;left:0;right:0;bottom:0;height:38px;background:rgba(243,246,251,.94);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;border-top:1px solid #c8d0da}
.ec-bar button{height:30px;min-width:34px;padding:0 7px;border:1px solid transparent;border-radius:5px;background:none;color:#1b1b1b;font:inherit;font-size:.72rem;cursor:pointer;position:relative}
.ec-bar button:hover{background:#e3e9f1}
.ec-bar button.dsc::after{content:"";position:absolute;left:30%;right:30%;bottom:2px;height:3px;border-radius:2px;background:#8a96a6}
.ec-bar button.act::after{background:#0067c0;left:22%;right:22%}
.ec-sigla{display:inline-grid;grid-template-columns:7px 7px;gap:1.5px;vertical-align:middle}
.ec-sigla b{width:7px;height:7px;background:#0078d4;display:block}
.ec-start{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;width:min(290px,92%);background:#f3f3f3;border:1px solid #c8d0da;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:10px;z-index:30}
.ec-start .h{font-weight:700;margin:0 0 6px}
.ec-start .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ec-start .g button{padding:8px 2px;border:1px solid #d9dee5;border-radius:6px;background:#fff;color:#1b1b1b;font:inherit;font-size:.72rem;cursor:pointer}
.ec-start .g button:hover{background:#e9eef5}
.ec-win{position:absolute;left:6%;top:6%;width:74%;height:66%;background:#fff;border:1px solid #8c97a5;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.ec-win.max{left:0;top:0;width:100%;height:100%;border-radius:0}
.ec-win.w2{left:18%;top:14%}
.ec-tit{flex:none;display:flex;align-items:center;height:26px;background:#eef1f5;border-bottom:1px solid #d5dbe3}
.ec-tit .n{flex:1;padding-left:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-tit button{flex:none;width:32px;height:26px;border:0;background:none;color:#1b1b1b;font-size:.85rem;cursor:pointer;line-height:1}
.ec-tit button:hover{background:#dde3ea}
.ec-tit button.x:hover{background:#c42b1c;color:#fff}
.ec-cont{flex:1;overflow:auto;padding:6px;min-height:0}
.ec-paint{height:100%;display:flex;flex-direction:column;gap:4px}
.ec-paint .tb{height:18px;background:#f3f5f8;border:1px solid #e1e5ea;border-radius:3px}
.ec-paint .pz{flex:1;background:#fff;border:1px dashed #b9c2cc}
.ec-set{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:6px;height:100%}
.ec-set button{display:block;width:100%;text-align:left;padding:4px 6px;margin-bottom:2px;border:0;border-radius:4px;background:none;color:#1b1b1b;font:inherit;font-size:.72rem;cursor:pointer}
.ec-set button:hover,.ec-set button.on{background:#e5ecf6}
.ec-set .dr{border-left:1px solid #e1e5ea;padding-left:6px;min-width:0}
.ec-set .dr h4{margin:2px 0 6px;font-size:.8rem}
.ec-set .spec{border:1px solid #e1e5ea;border-radius:5px;padding:6px}
.ec-set .spec div{display:flex;gap:8px;flex-wrap:wrap}
.ec-rasp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.ec-rasp input{flex:1 1 160px;min-width:0;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script src="../_ghiduri/cont-drive/pasi.js"></script>
<script>
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../fisiere-v/img/${f}" target="_blank"><img src="../fisiere-v/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

/* =====================================================================
   SIMULATORUL 1: „ecran” = un Windows mic: butonul Start, bara de activități,
   ferestre cu minimizare / maximizare / închidere, Setări › Sistem › Despre.
   Q: {t:'ecran', q, checks:[{ev|vizibil|inchis|rasp, ce}], intrebare?, solutie:[operații], gresit?:[operații]}
   ===================================================================== */
const EC_APPS=['Paint','Notepad','Setări'];
function ecStare(){return {start:false,ap:{},z:[],ev:new Set(),set:'acasa',rasp:''}}
const EC={
  start(s){s.start=!s.start;if(s.start)s.ev.add('start')},
  app(s,n){s.start=false;
    if(!s.ap[n]){s.ap[n]={st:'n'};s.ev.add('deschis:'+n)}
    else if(s.ap[n].st==='min'){s.ap[n].st=s.ap[n].prev||'n';s.ev.add('revenit:'+n)}
    s.z=s.z.filter(x=>x!==n).concat(n)},
  btn(s,n,b){const a=s.ap[n];if(!a)return;
    if(b==='min'){a.prev=a.st;a.st='min';s.ev.add('min:'+n)}
    else if(b==='max'){a.st=a.st==='max'?'n':'max';if(a.st==='max')s.ev.add('max:'+n);else s.ev.add('restr:'+n)}
    else{delete s.ap[n];s.z=s.z.filter(x=>x!==n);s.ev.add('inchis:'+n);if(n==='Setări')s.set='acasa'}},
  bara(s,n){const a=s.ap[n];if(!a)return;
    if(a.st==='min'){a.st=a.prev||'n';s.ev.add('revenit:'+n);s.z=s.z.filter(x=>x!==n).concat(n)}
    else if(s.z[s.z.length-1]===n){a.prev=a.st;a.st='min';s.ev.add('min:'+n)}
    else s.z=s.z.filter(x=>x!==n).concat(n)},
  setari(s,p){s.set=p;s.ev.add(p)},
  rasp(s,t){s.rasp=t}
};
const ecNorm=x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
function ecTest(s,c){
  if(c.ev)return s.ev.has(c.ev);
  if(c.vizibil)return !!s.ap[c.vizibil]&&s.ap[c.vizibil].st!=='min';
  if(c.inchis)return !s.ap[c.inchis];
  if(c.rasp)return ecNorm(s.rasp).includes(ecNorm(c.rasp));
  return false;
}
function ecAplica(s,ops){(ops||[]).forEach(o=>EC[o[0]](s,...o.slice(1)))}
function ecDesen(Q,body,api,s){
  const E=api.esc;
  const sus=s.z.filter(n=>s.ap[n]&&s.ap[n].st!=='min'),top=sus[sus.length-1];
  const fer=s.z.filter(n=>s.ap[n]).map((n,i)=>{const a=s.ap[n];if(a.st==='min')return '';
    let cont='';
    if(n==='Paint')cont=`<div class="ec-paint"><div class="tb"></div><div class="pz"></div></div>`;
    else if(n==='Notepad')cont=`<div style="font-family:Consolas,monospace">|</div>`;
    else{const st=['Sistem','Bluetooth și dispozitive','Rețea și internet','Personalizare','Aplicații'];
      const dr=s.set==='acasa'?`<h4>Setări</h4><p>Alege din stânga o categorie.</p>`
        :s.set==='sistem'?`<h4>Sistem</h4>${['Afișaj','Sunet','Notificări','Stocare'].map(x=>`<button type="button" data-set="nimic">${x}</button>`).join('')}<button type="button" data-set="despre">Despre</button>`
        :`<h4>Sistem › Despre</h4><div class="spec"><b>Specificații Windows</b><div><span>Ediție</span><b>Windows 11 Pro</b></div></div>`;
      cont=`<div class="ec-set"><div>${st.map(x=>`<button type="button" data-set="${x==='Sistem'?'sistem':'nimic'}" class="${x==='Sistem'&&s.set!=='acasa'?'on':''}">${x}</button>`).join('')}</div><div class="dr">${dr}</div></div>`}
    return `<div class="ec-win ${a.st==='max'?'max':''} ${i%2?'w2':''}" data-app="${n}" style="z-index:${10+s.z.indexOf(n)}">
      <div class="ec-tit"><span class="n">${n}</span><button type="button" data-b="min" title="Minimizare">—</button><button type="button" data-b="max" title="${a.st==='max'?'Restaurare jos':'Maximizare'}">☐</button><button type="button" class="x" data-b="x" title="Închidere">✕</button></div>
      <div class="ec-cont">${cont}</div></div>`}).join('');
  const bara=s.z.filter(n=>s.ap[n]).map(n=>`<button type="button" data-bara="${n}" class="dsc ${n===top?'act':''}" title="${n}">${n}</button>`).join('');
  const teste=(Q.checks||[]).map(c=>ecTest(s,c));
  body.innerHTML=`<p class="sim-cum">Clic pe <b>Start</b> (pătratele albastre, jos). Butoanele ferestrei sunt sus, în dreapta: — ☐ ✕.</p>
  <div class="ec" role="application" aria-label="Ecran Windows simulat">
    <div class="ec-desk"><button type="button" class="ec-icd" tabindex="-1"><i></i>Coșul de reciclare</button>${fer}</div>
    ${s.start?`<div class="ec-start"><p class="h">Fixate</p><div class="g">${EC_APPS.map(n=>`<button type="button" data-app-start="${n}">${n}</button>`).join('')}</div></div>`:''}
    <div class="ec-bar"><button type="button" data-startb="1" title="Start" aria-label="Start"><span class="ec-sigla"><b></b><b></b><b></b><b></b></span></button>${bara}</div>
  </div>
  ${Q.intrebare?`<div class="ec-rasp"><label for="ec-r">${Q.intrebare}</label><input id="ec-r" type="text" autocomplete="off" value="${E(s.rasp)}"></div>`:''}
  ${teste.length?`<div class="sim-teste"><div class="lbl">Testele sarcinii · ${teste.filter(Boolean).length} din ${teste.length} trec</div><ol>${Q.checks.map((c,i)=>`<li class="${teste[i]?'ok':''}"><span class="s">${teste[i]?'✓':'○'}</span><span>${c.ce}</span></li>`).join('')}</ol></div>`:''}`;
  const re=()=>ecDesen(Q,body,api,s);
  body.querySelector('[data-startb]').onclick=()=>{EC.start(s);re()};
  body.querySelectorAll('[data-app-start]').forEach(b=>b.onclick=()=>{EC.app(s,b.dataset.appStart);re()});
  body.querySelectorAll('[data-bara]').forEach(b=>b.onclick=()=>{EC.bara(s,b.dataset.bara);re()});
  body.querySelectorAll('.ec-win').forEach(w=>{const n=w.dataset.app;
    w.querySelectorAll('[data-b]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();EC.btn(s,n,b.dataset.b);re()});
    w.querySelectorAll('[data-set]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();if(b.dataset.set!=='nimic')EC.setari(s,b.dataset.set);re()});
    w.addEventListener('mousedown',()=>{if(s.z[s.z.length-1]===n)return;s.z=s.z.filter(x=>x!==n).concat(n);
      body.querySelectorAll('.ec-win').forEach(x=>x.style.zIndex=10+s.z.indexOf(x.dataset.app))})});
  body.querySelector('.ec-desk').addEventListener('click',ev=>{if(s.start&&ev.target.classList.contains('ec-desk')){s.start=false;re()}});
  const inp=body.querySelector('#ec-r');if(inp)inp.oninput=()=>{s.rasp=inp.value;
    const t=(Q.checks||[]).map(c=>ecTest(s,c));body.querySelectorAll('.sim-teste li').forEach((li,i)=>{li.className=t[i]?'ok':'';li.querySelector('.s').textContent=t[i]?'✓':'○'});
    const l=body.querySelector('.sim-teste .lbl');if(l)l.textContent=`Testele sarcinii · ${t.filter(Boolean).length} din ${t.length} trec`};
  body._ec={s,re};
}
const TIP_ECRAN={
  render(Q,body,api){
    const s=ecStare();ecDesen(Q,body,api,s);
    api.checkButton(()=>{const st=body._ec.s,rez=(Q.checks||[]).map(c=>ecTest(st,c)),k=rez.indexOf(false);
      if(k<0)api.resolve(true);
      else{api.resolve(false,'Mai ai de făcut: '+Q.checks[k].ce+'.');
        api.revealButton(()=>{const n=ecStare();ecAplica(n,Q.solutie);ecDesen(Q,body,api,n);api.giveUp('pașii sunt făcuți acum pe ecran: '+(Q.solutieText||'uită-te la teste.'))})}});
  },
  rezolva(Q,body,api){const n=ecStare();ecAplica(n,Q.solutie);ecDesen(Q,body,api,n)},
  gresit(Q,body,api){const n=ecStare();ecAplica(n,Q.gresit||[]);ecDesen(Q,body,api,n)}
};

/* =====================================================================
   SIMULATORUL 2: „explorer” = un Explorer mic: arborele din stânga, bara de adresă,
   căutare, Folder nou, Redenumire (F2), Copiere/Decupare/Lipire (Ctrl+C/X/V),

  return p.replace(/\/$/,'').split('/').join('\\')};

const EXO={
  cd(s,d){if(!s.f.has(d))return 'Folderul nu există.';s.cur=d;s.sel=null;s.caut=null;s.cosV=false;s.ren=null;return ''},
  sel(s,n){s.sel=exCopii(s,s.cur).find(p=>exNume(p)===n)||null;return s.sel?'':'Nu găsesc „'+n+'” aici.'},
  nou(s,d,nume){d=d||s.cur;const n=exLiber(s,d,'Folder nou');s.f.add(d+n+'/');s.sel=d+n+'/';

  ren(s,p,nou){nou=String(nou||'').trim();s.av=false;

  decupeaza(s,p){s.clip={p,mut:true};s.msg='Decupat: '+exNume(p)+'. Intră în folderul dorit și alege Lipire (Ctrl+V).';return ''},
  lipeste(s,d){d=d||s.cur;if(!s.clip)return 'N-ai copiat sau decupat nimic încă.';const {p,mut}=s.clip;

function exTest(s,c){

<p>Ca să lucreze împreună, au nevoie de un program-șef. Acesta este <mark>sistemul de operare</mark>. El pornește <strong>primul</strong>, imediat după ce apeși butonul de pornire, și rămâne pornit tot timpul cât lucrezi.</p>`,
   exemplu:`<p>Ce se întâmplă când apeși butonul de pornire:</p><ol><li>Piesele primesc curent.</li><li>Pornește sistemul de operare: pe ecran apare sigla lui (la noi, sigla Windows).</li><li>Apare <strong>desktopul</strong>. Abia acum poți porni un joc sau un program de desen.</li></ol>`,
   altfel:`<p>Gândește-te la o orchestră. Fiecare muzician (o piesă a calculatorului) știe să cânte, dar fără <strong>dirijor</strong> fiecare ar cânta ce vrea. Sistemul de operare e dirijorul: le spune tuturor când și ce să facă.</p>`,
   incearca:{t:'tf',q:'Sistemul de operare pornește primul, imediat după ce apeși butonul de pornire.',ok:true,ajutor:'Uită-te la lista „Uite cum”: ce apare pe ecran înainte de desktop?',why:'Adevărat. Întâi pornește sistemul de operare, apoi poți deschide celelalte programe.'},
   inca:[
    {t:'choice',q:'Cum se numesc toate părțile calculatorului pe care le poți atinge (ecran, tastatură, disc)?',o:['Hardware','Sistem de operare','Aplicații','Fișiere'],ok:0,ajutor:'E cuvântul marcat în primul paragraf.',why:'Piesele care se pot atinge formează hardware-ul. Sistemul de operare e un program care le conduce.'}
   ]},
  {t:'Ce face sistemul de operare',
   text:`<p>Sistemul de operare stă la mijloc, între tine, programe și piese. Are patru treburi mari:</p>
<ul><li><strong>deschide și închide aplicațiile</strong> (programele);</li>
<li><strong>păstrează fișierele în ordine pe disc</strong>;</li>
<li><strong>face piesele să lucreze</strong>: tastatura, mouse-ul, ecranul, imprimanta;</li>
<li><strong>primește comenzile tale</strong> prin ferestre și pictograme.</li></ul>`,
   exemplu:`<p>Scrii litera <b>A</b> într-o compunere:</p><ol><li>Apeși tasta A.</li><li>Sistemul de operare primește apăsarea de la tastatură.</li><li>O dă programului în care scrii.</li><li>Programul îi cere să afișeze litera pe ecran.</li></ol><p>Tu vezi doar litera. Munca din mijloc o face sistemul de operare.</p>`,
   incearca:{t:'choice',q:'Apeși o tastă. Cine duce apăsarea de la tastatură până la programul în care scrii?',o:['Sistemul de operare','Ecranul','Imprimanta','Coșul de reciclare'],ok:0,ajutor:'Recitește exemplul „Uite cum”, pasul 2.',why:'Sistemul de operare stă la mijloc: primește apăsarea de la tastatură și o dă programului.'},
   inca:[
    {t:'classify',q:'E o treabă a sistemului de operare?',cats:['Da, e treaba lui','Nu, e altceva'],items:[['Deschide și închide aplicațiile',0],['Păstrează fișierele pe disc',0],['Face imprimanta să lucreze',0],['Scrie compunerea în locul tău',1],['Desenează un peisaj singur',1]],ajutor:'Sunt patru treburi în listă. Scrisul și desenul le faci tu, cu o aplicație.',why:'Sistemul de operare conduce: aplicații, fișiere, piese, comenzi. Compunerea și desenul le faci tu.'}
   ]},
  {t:'Sisteme de operare pe care le întâlnești',
   text:`<p>Există mai multe sisteme de operare:</p>
<ul><li>pe calculatoare: <strong>Windows</strong>, <strong>macOS</strong> și <strong>Linux</strong>;</li>
<li>pe telefoane și tablete: <strong>Android</strong> și <strong>iOS</strong> (pe iPhone și iPad).</li></ul>
<p>Ca să afli ce sistem de operare are calculatorul, îl întrebi chiar pe el, în <strong>Setări</strong>.</p>
${fig('sistem-despre.webp',800,490,'Fereastra Setări din Windows, pagina Sistem › Despre, cu rândul Ediție care arată Windows 11 Pro încadrat cu roșu','<b>Setări → Sistem → Despre</b>. La rândul <b>Ediție</b> scrie <b>Windows 11 Pro</b>.')}`,
   exemplu:`<p><b>Strategia: cum afli ce sistem de operare ai</b></p><ol><li>Apeși butonul <strong>Start</strong> (jos, pe bara de pe ecran).</li><li>Alegi <strong>Setări</strong>.</li><li>În stânga alegi <strong>Sistem</strong>.</li><li>Cobori și alegi <strong>Despre</strong>. Citești rândul <strong>Ediție</strong>.</li></ol>`,
   incearca:{t:'tf',q:'iOS este sistemul de operare al telefoanelor iPhone.',ok:true,ajutor:'Recitește a doua linie din listă: ce e scris în paranteză?',why:'Adevărat. iOS pornește și conduce iPhone-ul, cum face Android pe alte telefoane.'},
   inca:[
    {t:'classify',q:'Unde îl întâlnești de obicei?',cats:['Pe calculator','Pe telefon sau tabletă'],items:[['Windows',0],['macOS',0],['Linux',0],['Android',1],['iOS',1]],ajutor:'Lista din pas are două rânduri: calculatoare și telefoane.',why:'Windows, macOS și Linux sunt pentru calculatoare. Android și iOS sunt pentru telefoane și tablete.'},
    {t:'order',q:'Afli ce sistem de operare are calculatorul. Pune pașii în ordine.',items:['Apeși butonul Start','Alegi Setări','Alegi Sistem','Alegi Despre și citești rândul Ediție'],ajutor:'E strategia din „Uite cum”, cu pașii 1-4.',why:'Start deschide lista, Setări are categoriile, iar Sistem › Despre arată ediția.'}
   ]},
  {t:'Aplicațiile lucrează peste sistemul de operare',
   text:`<p>Word, Paint sau un joc sunt <mark>aplicații</mark>. Fiecare face un singur fel de treabă: scris, desen, joc.</p>
<p>O aplicație nu poate porni singură. Are nevoie de sistemul de operare ca să apară pe ecran, să primească literele de la tastatură și să-și salveze fișierele.</p>
${fig('aplicatie-peste-desktop.webp',1000,500,'Desktopul Windows cu pictograme în stânga și, deasupra lui, fereastra aplicației Paint, amândouă încadrate cu roșu','Dedesubt e <b>sistemul de operare</b> (desktopul Windows). Deasupra lui s-a deschis o <b>aplicație</b>: Paint.')}`,
   exemplu:`<p>Calculatorul e ca un turn cu trei etaje:</p><pre>  sus:     aplicațiile (Word, Paint, jocuri)
  mijloc:  sistemul de operare (Windows)
  jos:     hardware (ecran, tastatură, disc)</pre><p>Fiecare etaj stă pe cel de dedesubt. Fără etajul din mijloc, aplicațiile n-au pe ce sta.</p>`,
   altfel:`<p>Sistemul de operare e ca <strong>școala</strong>: clădirea, clopoțelul, orarul. Aplicațiile sunt ca <strong>orele</strong>: matematică, desen, sport. O oră nu se poate ține dacă școala e închisă.</p>`,
   incearca:{t:'tf',q:'Paint, aplicația de desen, pornește calculatorul și le conduce pe toate celelalte programe.',ok:false,ajutor:'Paint face un singur fel de treabă. Care?',why:'Fals. Paint este o aplicație pentru desen. Ea funcționează peste Windows, care este sistemul de operare.'},
   inca:[
    {t:'choice',q:'Care dintre acestea este o aplicație?',o:['Paint','Windows','Android','Linux'],ok:0,ajutor:'Trei dintre ele sunt în lista sistemelor de operare din pasul anterior.',why:'Paint face un singur lucru: desen. Windows, Android și Linux sunt sisteme de operare.'}
   ]}
 ],
 atelier:{t:'ecran',titlu:'Află ce sistem de operare are calculatorul',
  intro:`<p>Mai jos e un ecran de Windows, simulat. <strong>Sarcina:</strong> folosește strategia din pasul 3 (Start → Setări → Sistem → Despre), citește rândul <b>Ediție</b> și scrie-l în casetă. Testele se bifează singure; la final apasă <b>Verifică</b>.</p>`,
  q:'Află ediția de Windows și scrie-o în casetă.',
  intrebare:'Ce scrie la Ediție?',
  ajutor:'Clic pe Start (pătratele albastre), apoi pe Setări. În fereastră: Sistem, apoi Despre.',
  checks:[{ev:'start',ce:'Ai deschis meniul Start'},{ev:'deschis:Setări',ce:'Ai deschis Setări'},{ev:'despre',ce:'Ai ajuns la Sistem › Despre'},{rasp:'Windows 11 Pro',ce:'Ai scris ediția găsită: Windows 11 Pro'}],
  solutie:[['start'],['app','Setări'],['setari','sistem'],['setari','despre'],['rasp','Windows 11 Pro']],
  solutieText:'Start → Setări → Sistem → Despre; la Ediție scrie Windows 11 Pro.',
  why:'Ai aflat singur sistemul de operare: pe calculatorul din laborator faci exact aceiași pași.',
  inca:[{t:'ecran',q:'Încă una: pornește aplicația Paint din meniul Start.',ajutor:'Start, apoi Paint din lista Fixate.',
   checks:[{ev:'deschis:Paint',ce:'Paint s-a deschis într-o fereastră'},{vizibil:'Paint',ce:'Fereastra Paint se vede pe ecran'}],
   solutie:[['start'],['app','Paint']],solutieText:'Start → Paint.',why:'Sistemul de operare a deschis aplicația Paint într-o fereastră, peste desktop.'}]},
 qs:[
  {t:'choice',q:'Ce se întâmplă cu Word dacă de pe calculator lipsește sistemul de operare?',o:['Word nu poate porni','Word pornește mai repede','Word funcționează la fel','Word devine sistem de operare'],ok:0,ajutor:'Gândește-te la turnul cu trei etaje din pasul 4.',why:'Word folosește sistemul de operare ca să deschidă fișiere, să afișeze pe ecran și să primească literele de la tastatură. Fără el nu are cum să pornească.'},
  {t:'classify',q:'Cine conduce tot dispozitivul și cine face un singur fel de treabă?',cats:['Sistem de operare','Aplicație'],items:[['Windows',0],['Android',0],['Linux',0],['Paint',1],['Word',1],['Minecraft',1]],ajutor:'Sistemele de operare sunt în lista din pasul 3. Restul sunt aplicații.',why:'Sistemul de operare conduce tot dispozitivul. Aplicațiile fac un singur fel de treabă (desen, text, joc) și au nevoie de el ca să pornească.'},
  {t:'match',q:'Leagă fiecare lucru de ce face sistemul de operare cu el.',pairs:[['Aplicațiile','le deschide și le închide'],['Fișierele','le păstrează în ordine pe disc'],['Mouse-ul și imprimanta','le face să lucreze cu calculatorul'],['Tu, utilizatorul','primește comenzile tale prin ferestre și pictograme']],ajutor:'Sunt exact cele patru treburi din pasul 2.',why:'Sistemul de operare stă la mijloc: între tine, programe și piesele calculatorului.'},
  {t:'choice',q:'Telefonul Ioanei are Android. Ce este Android?',o:['Sistemul de operare al telefonului','O aplicație de jocuri','O aplicație de desen','O piesă a telefonului (hardware)'],ok:0,ajutor:'Android e în lista din pasul 3.',why:'Android pornește telefonul și le conduce pe toate celelalte programe, la fel cum face Windows pe calculator.'},
  {t:'order',q:'Vrei să afli ce sistem de operare are un calculator. Pune pașii în ordine.',items:['Apeși butonul Start','Deschizi Setări','Alegi Sistem','Alegi Despre','Citești rândul Ediție'],ajutor:'E strategia pe care ai folosit-o în atelier.',why:'Din Start ajungi la Setări, iar pagina Sistem › Despre spune ce ediție de Windows ai.'}
 ]},

/* ================= 2. Elemente de interfață (lecția 8) ================= */
{t:'Ce vezi pe ecran',lectii:[8],continuturi:['Elemente de interfață ale unui sistem de operare'],
 obiectiv:'recunoști desktopul, pictogramele, butonul Start, bara de activități și ferestrele, și știi să minimizezi, să maximizezi și să închizi o fereastră.',
 pasi:[
  {t:'Desktopul și pictogramele',
   text:`<p>Tot ce vezi pe ecran după pornire este <mark>interfața</mark> sistemului de operare: locul prin care „vorbești” cu el.</p>
<p>Suprafața mare de lucru se numește <mark>desktop</mark>. Pe ea stau <mark>pictograme</mark>: imagini mici pentru programe, fișiere și foldere. Dublu-clic pe o pictogramă o deschide.</p>
<p>Una dintre pictograme este <strong>Coșul de reciclare</strong>: acolo ajung fișierele pe care le ștergi.</p>
${fig('desktop-pictograme.webp',545,600,'Colțul din stânga sus al desktopului Windows 11, cu pictograma Coșului de reciclare încadrată și alte pictograme de programe','Desktopul, cu <b>pictograme</b>. Prima din colț e <b>Coșul de reciclare</b>.')}`,
   exemplu:`<p>Vrei să deschizi Coșul de reciclare:</p><ol><li>Găsești pictograma lui pe desktop (de obicei în colțul din stânga sus).</li><li>Dai <b>dublu-clic</b> pe ea: două clicuri repezi cu butonul din stânga.</li><li>Coșul se deschide într-o fereastră.</li></ol>`,
   incearca:{t:'choice',q:'Ce este o pictogramă?',o:['O imagine mică pentru un program, un fișier sau un folder','Programul-șef care pornește tot calculatorul','Butonul din colț care închide o fereastră','O piesă a calculatorului, ca tastatura'],ok:0,ajutor:'Recitește paragraful al doilea: „imagini mici pentru…”.',why:'Pictograma e o imagine mică. Dublu-clic pe ea deschide programul, fișierul sau folderul.'},
   inca:[
    {t:'tf',q:'În Coșul de reciclare ajung fișierele pe care le ștergi.',ok:true,ajutor:'Ultimul paragraf din pas.',why:'Adevărat. De aceea Coșul e ca un coș de hârtii: poți scoate înapoi ce ai aruncat din greșeală.'}
   ]},
  {t:'Butonul Start și bara de activități',
   text:`<p>Jos pe ecran e o bară lungă: <mark>bara de activități</mark>. Pe ea vezi <strong>programele deschise</strong> și câteva programe fixate.</p>
<p>La începutul ei e <mark>butonul Start</mark> (sigla Windows, patru pătrate). De aici pornești aplicațiile: apeși Start și se deschide o listă cu ele.</p>
${fig('bara-activitati.webp',780,98,'Bara de activități din Windows 11, cu butonul Start încadrat, caseta Căutare și pictogramele programelor','Jos stă <b>bara de activități</b>, iar la începutul ei e <b>butonul Start</b>.')}`,
   exemplu:`<p><b>Strategia: cum pornești o aplicație (de exemplu Paint)</b></p><ol><li>Apeși butonul <strong>Start</strong>.</li><li>Cauți <strong>Paint</strong> în lista de aplicații (sau scrii „paint” de la tastatură).</li><li>Dai clic pe Paint.</li><li>Paint se deschide într-o fereastră, iar pictograma lui apare pe bara de activități.</li></ol>`,
   incearca:{t:'order',q:'Pornești aplicația Paint. Pune pașii în ordine.',items:['Apeși butonul Start','Cauți Paint în lista de aplicații','Dai clic pe Paint','Paint se deschide într-o fereastră'],ajutor:'E strategia din „Uite cum”.',why:'Start e ușa spre aplicații. Găsești aplicația, o alegi, iar sistemul de operare o deschide într-o fereastră.'},
   inca:[
    {t:'choice',q:'Ce vezi pe bara de activități?',o:['Programele deschise acum','Fișierele șterse','Numai ceasul','Toate pozele de pe disc'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Bara de activități arată programele deschise. Fișierele șterse sunt în Coșul de reciclare.'}
   ]},
  {t:'Fereastra și cele trei butoane',
   text:`<p>Fiecare program se deschide într-o <mark>fereastră</mark>. Sus, în dreapta, fereastra are trei butoane:</p>
<ul><li><strong>minimizare</strong> (—): ascunde fereastra în bara de activități; programul merge mai departe;</li>
<li><strong>maximizare</strong> (☐): face fereastra cât tot ecranul;</li>
<li><strong>închidere</strong> (✕): închide fereastra și oprește programul.</li></ul>
${fig('butoane-fereastra.webp',1000,226,'Colțul din dreapta sus al ferestrei Paint, cu cele trei butoane încadrate și etichetate minimizare, maximizare și închidere','Cele trei butoane, în colțul din dreapta sus al oricărei ferestre.')}`,
   exemplu:`<p>Ai minimizat Paint și vrei să-l vezi din nou:</p><ol><li>Te uiți pe bara de activități: pictograma lui Paint e tot acolo.</li><li>Dai clic pe ea.</li><li>Fereastra revine exact cum era, cu desenul neatins.</li></ol>`,
   altfel:`<p>Minimizarea e ca atunci când pui caietul deschis în bancă: nu-l mai vezi, dar e tot la pagina ta. Închiderea e ca atunci când îl pui în ghiozdan.</p>`,
   incearca:{t:'choice',q:'Vrei ca fereastra cu Paint să ocupe tot ecranul. Ce buton apeși?'+fig('butoane-fereastra-fara-nume.webp',175,53,'Colțul din dreapta sus al ferestrei Paint: trei butoane încadrate cu roșu, cu o liniuță, un pătrat și un X','Butoanele ferestrei, așa cum le vezi pe ecran.'),o:['Maximizare','Minimizare','Închidere'],ok:0,ajutor:'Care buton face fereastra „cât tot ecranul”?',why:'Maximizarea mărește fereastra cât tot ecranul. Minimizarea o ascunde, iar închiderea oprește programul.'},
   inca:[
    {t:'match',q:'Leagă semnul de ce face butonul.',pairs:[['—','ascunde fereastra în bara de activități'],['☐','face fereastra cât tot ecranul'],['✕','închide fereastra și oprește programul']],ajutor:'Lista din pas are câte un rând pentru fiecare semn.',why:'Liniuța minimizează, pătratul maximizează, X-ul închide.'},
    {t:'tf',q:'După ce minimizezi o fereastră, o aduci înapoi cu un clic pe pictograma ei din bara de activități.',ok:true,ajutor:'Recitește exemplul „Uite cum”.',why:'Adevărat. Programul a rămas pornit, iar pictograma din bară îl readuce.'}
   ]}
 ],
 atelier:{t:'ecran',titlu:'Pornește, mărește, ascunde, adu înapoi',
  intro:`<p><strong>Sarcina:</strong> pornește Paint din Start, fă fereastra cât tot ecranul, apoi ascunde-o în bara de activități și adu-o înapoi. Fiecare lucru făcut se bifează în teste.</p>`,
  q:'Paint: pornește → maximizează → minimizează → adu înapoi.',
  ajutor:'Butoanele sunt sus, în dreapta ferestrei: ☐ maximizează, — minimizează. Paint revine cu un clic pe numele lui din bara de jos.',
  checks:[{ev:'deschis:Paint',ce:'Ai pornit Paint din Start'},{ev:'max:Paint',ce:'Ai maximizat fereastra (☐)'},{ev:'min:Paint',ce:'Ai minimizat fereastra (—)'},{ev:'revenit:Paint',ce:'Ai adus-o înapoi din bara de activități'},{vizibil:'Paint',ce:'La final, Paint se vede pe ecran'}],
  solutie:[['start'],['app','Paint'],['btn','Paint','max'],['btn','Paint','min'],['bara','Paint']],
  solutieText:'Start → Paint; ☐; —; clic pe Paint în bara de activități.',
  gresit:[['start'],['app','Paint'],['btn','Paint','max'],['btn','Paint','x']],
  why:'Ai folosit cele trei butoane ale ferestrei și bara de activități, exact ca pe calculatorul adevărat.',
  inca:[{t:'ecran',q:'Încă una: deschide Paint și Notepad, apoi închide doar Notepad.',ajutor:'Amândouă sunt în Start. Notepad se închide cu ✕ din fereastra lui.',
   checks:[{ev:'deschis:Paint',ce:'Paint e deschis'},{ev:'deschis:Notepad',ce:'Notepad a fost deschis'},{inchis:'Notepad',ce:'Notepad e închis (✕)'},{vizibil:'Paint',ce:'Paint a rămas deschis pe ecran'}],
   solutie:[['start'],['app','Paint'],['start'],['app','Notepad'],['btn','Notepad','x']],solutieText:'Start → Paint; Start → Notepad; ✕ pe Notepad.',
   why:'Fiecare fereastră are butoanele ei: închizi doar programul de care nu mai ai nevoie.'}]},
 qs:[
  {t:'tf',q:'Butonul de minimizare închide programul, iar ce ai lucrat se pierde.'+fig('butoane-fereastra-fara-nume.webp',175,53,'Colțul din dreapta sus al unei ferestre Windows: trei butoane încadrate cu roșu, cu o liniuță, un pătrat și un X','Cele trei butoane din colțul din dreapta sus al ferestrei.'),ok:false,ajutor:'Recitește ce face liniuța (—) în pasul 3.',why:'Fals. Minimizarea doar ascunde fereastra în bara de activități. Programul merge mai departe. Dai clic pe el în bară și fereastra revine.'},
  {t:'match',q:'Leagă fiecare element de rolul lui.',pairs:[['Butonul Start','de aici pornești aplicațiile'],['Bara de activități','arată programele deschise'],['Pictograma','o imagine mică pentru un program sau un fișier'],['Coșul de reciclare','aici ajung fișierele șterse']],why:'Acestea sunt „butoanele” prin care vorbești cu sistemul de operare.'},
  {t:'classify',q:'Unde găsești fiecare lucru?',cats:['Pe desktop','În bara de activități','Sus, pe fereastră'],items:[['Pictograma Coșului de reciclare',0],['Pictogramele fișierelor salvate pe desktop',0],['Butonul Start',1],['Programele deschise acum',1],['Butonul de închidere ✕',2],['Butonul de minimizare —',2]],ajutor:'Start e la începutul barei de jos; cele trei butoane stau pe fiecare fereastră.',why:'Desktopul ține pictograme. Bara de activități ține Start și programele pornite. Butoanele unei ferestre stau pe fereastra ei.'},
  {t:'choice',q:'Ai minimizat fereastra Paint. Cum o aduci înapoi?',o:['Dai clic pe Paint în bara de activități','Apeși butonul ✕ al altei ferestre','Deschizi Coșul de reciclare','Repornești calculatorul'],ok:0,why:'Paint a rămas pornit; pictograma lui din bara de activități îl readuce pe ecran.'},
  {t:'tf',q:'Butonul ✕ închide fereastra și oprește programul.',ok:true,why:'Adevărat. După închidere, programul nu mai apare nici pe bara de activități.'}
 ]},

/* ================= 3. Fișiere, foldere, cale (lecția 9) ================= */
{t:'Fișiere și foldere',lectii:[9],continuturi:['Organizarea datelor pe suport extern'],
 obiectiv:'citești numele și extensia unui fișier, înțelegi arborele de foldere și ajungi singur la un fișier după calea lui.',
 pasi:[
  {t:'Unde stau datele: suportul de stocare',
   text:`<p>Tot ce salvezi (o temă, o poză, un cântec) stă pe un <mark>suport de stocare</mark>. Exemple:</p>
<ul><li><strong>discul</strong> calculatorului (în Windows se numește de obicei <strong>C:</strong>);</li>
<li>un <strong>stick USB</strong>, pe care îl duci cu tine;</li>
<li>un <strong>card</strong> de memorie, din telefon sau din aparatul foto.</li></ul>
<p>Pe suport, informațiile stau în <mark>fișiere</mark>. Un fișier = o temă, o poză sau un cântec.</p>`,
   exemplu:`<p>Salvezi tema pe <b>stick</b> la școală. Acasă pui stick-ul în calculator și tema e acolo, pentru că a stat tot timpul pe stick, nu în calculatorul școlii.</p>`,
   incearca:{t:'choice',q:'Care dintre acestea este un suport de stocare?',o:['Un stick USB','Mouse-ul','Butonul Start','Paint'],ok:0,ajutor:'Caută în listă ceva pe care se pot păstra fișiere.',why:'Stick-ul păstrează fișiere. Mouse-ul e o piesă de comandă, Start e un buton, Paint e o aplicație.'},
   inca:[
    {t:'tf',q:'Pe un card de memorie se pot păstra fișiere.',ok:true,ajutor:'Cardul e în lista din pas.',why:'Adevărat. Cardul e un suport de stocare, ca discul și stick-ul.'}
   ]},
  {t:'Fișierul: nume și extensie',
   text:`<p>Un fișier are un <mark>nume</mark> și, după punct, o <mark>extensie</mark>: <code>tema.docx</code>, <code>pisica.jpg</code>, <code>cantec.mp3</code>. Extensia arată <strong>tipul</strong> fișierului și cu ce aplicație se deschide.</p>
${fig('explorer-fisiere.webp',934,307,'Fereastra Explorer cu fișierele cantec.mp3, notite.txt, pisica.jpg și tema.docx, cu numele și extensiile încadrate și coloana Tip alături','Patru fișiere în folderul TIC. După punct e <b>extensia</b>, iar coloana <b>Tip</b> spune același lucru în cuvinte.')}`,
   exemplu:`<p>Extensiile pe care le vei întâlni cel mai des:</p><pre>  .docx  .txt   →  document (text)
  .jpg   .png   →  imagine (poză, desen)
  .mp3   .wav   →  sunet</pre><p>Citești <b>după punct</b>: <code>vacanta.jpg</code> e o imagine, <code>melodie.mp3</code> e un sunet.</p>`,
   incearca:{t:'choice',q:'Ce arată extensia <code>.jpg</code> din numele <code>pisica.jpg</code>?',o:['Că fișierul este o imagine','Că fișierul e un cântec','Că pisica are un an','Că fișierul este un folder'],ok:0,ajutor:'Caută .jpg în tabelul din „Uite cum”.',why:'.jpg înseamnă imagine, deci se deschide cu un program de văzut poze.'},
   inca:[
    {t:'classify',q:'Ce fel de fișier este?',cats:['Document text','Imagine','Sunet'],items:[['referat.docx',0],['notite.txt',0],['vacanta.jpg',1],['desen.png',1],['melodie.mp3',2],['inregistrare.wav',2]],ajutor:'Te uiți doar după punct și cauți extensia în tabel.',why:'.docx și .txt sunt texte, .jpg și .png sunt imagini, .mp3 și .wav sunt sunete.'},
    {t:'tf',q:'În fișierul <code>tema.docx</code>, partea <code>docx</code> este extensia.',ok:true,ajutor:'Extensia e ce vine după punct.',why:'Adevărat. „tema” e numele, „docx” e extensia: un document.'}
   ]},
  {t:'Folderele și arborele',
   text:`<p>Fișierele se pun în <mark>directoare</mark>, numite și <strong>foldere</strong> sau dosare. Pictograma unui folder e un dosar galben.</p>
<p>Un folder poate avea în el fișiere <strong>și alte foldere</strong>. Folder în folder: așa se formează un <mark>arbore</mark>. În partea stângă a ferestrei Explorer vezi arborele de foldere.</p>
${fig('explorer-arbore.webp',474,252,'Panoul din stânga al ferestrei Explorer, cu arborele de foldere Scoala, în el Clasa_5, iar în el Matematica, Romana și TIC','<b>Arborele</b> din stânga ferestrei Explorer: folder în folder.')}`,
   exemplu:`<p>Arborele din imagine, scris pe rânduri (fiecare nivel e mutat puțin spre dreapta):</p><pre>Scoala
  Clasa_5
    Matematica
    Romana
    TIC
      tema.docx</pre><p>Scoala conține Clasa_5. Clasa_5 conține trei foldere. În TIC stă fișierul <code>tema.docx</code>.</p>`,
   altfel:`<p>Gândește-te la un dulap. Dulapul (Scoala) are sertare (Clasa_5). În sertar ai dosare pe materii (Matematica, Romana, TIC). În dosar stau foile (fișierele). Ca să găsești o foaie, deschizi dulapul, sertarul, apoi dosarul.</p>`,
   incearca:{t:'tf',q:'Un folder poate conține fișiere și, în același timp, alte foldere.',ok:true,ajutor:'Uită-te la Clasa_5 din exemplu: ce are în el?',why:'Adevărat. Folderele se pot pune unele în altele. Așa se face arborele.'},
   inca:[
    {t:'choice',q:'În arborele din exemplu, ce folder conține direct folderul TIC?',o:['Clasa_5','Scoala','Matematica','tema.docx'],ok:0,ajutor:'TIC e mutat spre dreapta sub un folder. Care?',why:'TIC stă în Clasa_5, iar Clasa_5 stă în Scoala.'}
   ]},
  {t:'Calea: drumul până la fișier',
   text:`<p>Drumul până la un fișier se numește <mark>cale</mark>. Se scrie pe un rând, cu bara <code>\\</code> între părți:</p>
<p><code>C:\\Scoala\\Clasa_5\\TIC\\tema.docx</code></p>
<p><code>C:</code> este discul, apoi vin folderele, de la cel mai mare la cel mai mic, iar la final fișierul.</p>
${fig('cale-text.webp',900,78,'Bara de adresă din Explorer care arată calea scrisă ca text: C:\\Scoala\\Clasa_5\\TIC','Aceeași cale, scrisă ca text în <b>bara de adresă</b> din Explorer.')}`,
   exemplu:`<p><b>Strategia: cum citești o cale</b></p><ol><li>Începutul (<code>C:</code>) îți spune discul.</li><li>Fiecare bară <code>\\</code> înseamnă „intri în folderul următor”.</li><li>Ultima parte, cu extensie, e fișierul.</li><li>Folderul scris <b>chiar înaintea</b> fișierului e locul în care stă.</li></ol><pre>C:  →  Scoala  →  Clasa_5  →  TIC  →  tema.docx</pre><p>Încă o cale: <code>C:\\Scoala\\Clasa_5\\Romana\\compunere_toamna.docx</code>. Fișierul <code>compunere_toamna.docx</code> stă în folderul Romana.</p>`,
   incearca:{t:'choice',q:'În calea <code>C:\\Scoala\\Clasa_5\\Romana\\compunere.docx</code>, ce înseamnă <code>C:</code>?',o:['Discul calculatorului','Primul folder','Numele fișierului','Clasa a C-a'],ok:0,ajutor:'Strategia, pasul 1.',why:'Calea începe mereu cu suportul: C: e discul calculatorului.'},
   inca:[
    {t:'order',q:'Pune în ordine părțile căii, de la disc până la fișier.',items:['C:','Scoala','Clasa_5','TIC','tema.docx'],ajutor:'De la mare la mic: discul, folderele, fișierul.',why:'Calea pornește de la disc, trece prin fiecare folder, de la cel mai mare la cel mai mic, și se termină cu fișierul.'}
   ]}
 ],

    fs:['C:/Scoala/Clasa_5/Matematica/exercitii_fractii.docx','C:/Scoala/Clasa_5/Romana/compunere_toamna.docx','C:/Scoala/Clasa_5/TIC/tema.docx','Desktop/notite.txt'],start:'Desktop/',

  {t:'order',q:'Pune în ordine părțile căii fișierului <code>compunere_toamna.docx</code>, care stă în folderul Romana din Clasa_5, din Scoala, pe discul C:.',items:['C:','Scoala','Clasa_5','Romana','compunere_toamna.docx'],ajutor:'Discul întâi, fișierul la final, folderele de la mare la mic.',why:'Calea e C:\\Scoala\\Clasa_5\\Romana\\compunere_toamna.docx.'},

/* ================= 4. Creare și redenumire (lecția 10) ================= */
{t:'Creez și redenumesc',lectii:[10],continuturi:['Operații cu fișiere și directoare'],
 obiectiv:'deschizi Explorer, creezi un folder nou, redenumești un fișier cu F2 și alegi nume bune, fără semne interzise și fără să schimbi extensia.',
 pasi:[
  {t:'Explorer, programul cu folderele',
   text:`<p>Cu fișierele și folderele lucrezi în <mark>Explorer</mark> (în engleză <em>File Explorer</em>), programul din Windows care îți arată folderele.</p>
<p>Îl deschizi cu pictograma dosarului galben de pe bara de activități. În fereastra lui ai: <strong>arborele</strong> în stânga, <strong>bara de adresă</strong> și <strong>caseta de căutare</strong> sus, iar în dreapta conținutul folderului în care ești.</p>
<p>Atenție: pe multe calculatoare, Explorer <strong>ascunde extensiile</strong> (vezi <code>tema</code> în loc de <code>tema.docx</code>). Ca să le vezi, alegi sus <strong>Vizualizare</strong> → <strong>Afișare</strong> → <strong>Extensii nume fișiere</strong>.</p>`,
   exemplu:`<p>Intri într-un folder:</p><ol><li>Deschizi Explorer.</li><li>Dai <b>dublu-clic</b> pe folder în dreapta, sau un clic pe numele lui în arbore.</li><li>Bara de adresă arată acum drumul până acolo.</li></ol>`,
   incearca:{t:'choice',q:'În ce program din Windows lucrezi cu fișierele și folderele?',o:['Explorer','Paint','Setări','Coșul de reciclare'],ok:0,ajutor:'Primul cuvânt marcat din pas.',why:'Explorer (File Explorer) arată folderele și fișierele și te lasă să lucrezi cu ele.'},
   inca:[
    {t:'match',q:'Leagă partea din Explorer de rolul ei.',pairs:[['Arborele','folderele, în stânga, unul în altul'],['Bara de adresă','drumul până la folderul în care ești'],['Caseta de căutare','găsești un fișier după nume']],ajutor:'Al doilea paragraf din pas le numește pe toate.',why:'Arborele te duce oriunde, bara de adresă îți spune unde ești, căutarea găsește fișierul.'}
   ]},
  {t:'Folder nou',
   text:`<p>Un <mark>folder nou</mark> se face acolo unde ești în Explorer.</p>
<p>Cu mouse-ul: clic dreapta pe un <strong>loc gol</strong> din fereastră, apoi <strong>Nou</strong> și <strong>Folder</strong>. Apare „Folder nou”, cu numele gata de scris.</p>
<p>Cu tastele: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>.</p>
${fig('meniu-nou-folder.webp',715,700,'Meniul de clic dreapta din Explorer, cu comanda Nou încadrată și submeniul deschis în care prima opțiune, Folder, e și ea încadrată','Clic dreapta pe un loc gol → <b>Nou</b> → <b>Folder</b>.')}`,
   exemplu:`<p><b>Strategia: folderul „Proiect_TIC” în Documente</b></p><ol><li>Intri în Documente.</li><li>Clic dreapta pe un loc gol (nu pe un fișier!).</li><li>Alegi <b>Nou</b> → <b>Folder</b>.</li><li>Scrii <code>Proiect_TIC</code> peste „Folder nou” și apeși <kbd>Enter</kbd>.</li></ol>`,
   altfel:`<p>E ca atunci când pui un dosar nou în sertar: întâi deschizi sertarul potrivit (folderul în care ești), apoi pui dosarul și îi scrii eticheta (numele).</p>`,
   incearca:{t:'choice',q:'Unde dai clic dreapta ca să faci un folder nou?',o:['Pe un loc gol din fereastră','Pe un fișier','Pe butonul Start','Pe Coșul de reciclare'],ok:0,ajutor:'Strategia, pasul 2.',why:'Clic dreapta pe un loc gol deschide meniul cu Nou. Pe un fișier apar comenzi pentru fișierul acela.'},
   inca:[
    {t:'order',q:'Creezi cu mouse-ul folderul „Proiect_TIC”. Pune pașii în ordine.',items:['Deschizi Explorer și intri în folderul potrivit','Dai clic dreapta pe un loc gol','Alegi Nou, apoi Folder','Scrii „Proiect_TIC” și apeși Enter'],ajutor:'Întâi locul, apoi meniul, la final numele.',why:'Întâi alegi locul, apoi ceri folderul nou din meniu, iar la final îi dai numele.'}
   ]},
  {t:'Redenumirea cu F2',
   text:`<p><mark>Redenumire</mark> înseamnă că schimbi numele unui fișier sau folder.</p>
<p>Selectezi fișierul (un clic pe el), apeși <kbd>F2</kbd> (sau clic dreapta și <strong>Redenumire</strong>), scrii numele nou și apeși <kbd>Enter</kbd>. Te-ai răzgândit? Apeși <kbd>Esc</kbd> și numele rămâne cel vechi.</p>
${fig('redenumire-f2.webp',695,230,'Folderul Proiect_TIC din Explorer, cu numele într-o casetă de scris după apăsarea tastei F2','După <kbd>F2</kbd>, numele intră într-o casetă și se poate scrie peste el.')}`,
   exemplu:`<p>Fișierul <code>document1.docx</code> devine <code>Popescu_Ana_tema1.docx</code>:</p><ol><li>Clic pe <code>document1.docx</code>.</li><li><kbd>F2</kbd>: Windows selectează doar partea dinaintea punctului.</li><li>Scrii <code>Popescu_Ana_tema1</code>.</li><li><kbd>Enter</kbd>. Extensia <code>.docx</code> a rămas neatinsă.</li></ol>`,
   incearca:{t:'order',q:'Redenumești un fișier. Pune pașii în ordine.',items:['Dai clic pe fișier, ca să-l selectezi','Apeși F2','Scrii numele nou','Apeși Enter'],ajutor:'Exemplul „Uite cum”, pașii 1-4.',why:'Selectezi, F2, scrii, Enter. Fără selecție, F2 nu știe ce să redenumească.'},
   inca:[
    {t:'choice',q:'Ai apăsat F2, dar te-ai răzgândit. Ce tastă apeși ca numele să rămână cel vechi?',o:['Esc','Enter','Delete','F5'],ok:0,ajutor:'Ultima propoziție din text.',why:'Esc renunță la redenumire. Enter ar păstra ce ai scris, iar Delete ar șterge fișierul.'}
   ]},
  {t:'Nume bune și semne interzise',
   text:`<p>Un nume bun e scurt și spune ce e în fișier: cine, ce materie, a câta temă. De exemplu <code>Popescu_Ana_tema1.docx</code>.</p>
<p>În nume <strong>nu</strong> ai voie să folosești semnele <code>\\ / : * ? " &lt; &gt; |</code>. Spațiul, liniuța <code>-</code> și linia de jos <code>_</code> sunt permise. În același folder nu pot sta două fișiere cu exact același nume.</p>
${fig('nume-interzis.webp',695,160,'Mesajul din Explorer: Numele unui fișier nu poate să conțină niciunul dintre următoarele caractere, urmat de lista backslash slash două puncte asterisc semnul întrebării ghilimele mai mic mai mare bară verticală','Dacă scrii un semn interzis, Windows te oprește chiar atunci și îți arată lista.')}`,
   exemplu:`<pre>  rău:   Document Microsoft Word (3).docx
  rău:   tema?.docx          (are semnul ?)
  bun:   Ionescu_Maria_romana_tema2.docx</pre><p>Numele bun îți spune, și peste o lună, al cui e și ce e în el.</p>`,
   incearca:{t:'classify',q:'Nume permis sau nepermis în Windows?',cats:['Permis','Nepermis'],items:[['tema_1.docx',0],['Excursie 2027.jpg',0],['Ana-Maria_proiect.pptx',0],['tema?.docx',1],['mate/geo.txt',1],['desen:final.png',1]],ajutor:'Caută în fiecare nume unul dintre semnele interzise: \\ / : * ? " < > |',why:'Spațiul, liniuța și linia de jos sunt permise. Semnele ? / și : sunt interzise, fiindcă Windows le folosește la altceva, de exemplu : apare în căi, după litera discului (C:).'},
   inca:[
    {t:'choice',q:'Care nume e cel mai bun pentru tema a treia la matematică a lui Andrei Pop?',o:['Pop_Andrei_mate_tema3.docx','Document nou.docx','tema_finala_final2.docx','andrei.docx'],ok:0,ajutor:'Numele bun spune cine, ce materie, a câta temă.',why:'Doar primul nume spune tot: al cui, ce materie, a câta temă.'},
    {t:'tf',q:'În același folder pot sta două fișiere cu exact același nume.',ok:false,ajutor:'Ultima propoziție a textului.',why:'Fals. Windows nu te lasă: ar fi imposibil de știut care e care.'}
   ]},
  {t:'Nu schimbi extensia',
   text:`<p>Când redenumești, schimbi <strong>doar partea dinaintea punctului</strong>. Extensia rămâne aceeași.</p>
<p>Dacă scrii <code>tema.jpg</code> în loc de <code>tema.docx</code>, fișierul <mark>nu devine imagine</mark>. Conținutul lui rămâne un document, doar eticheta se schimbă. Calculatorul încearcă apoi să-l deschidă cu un program de poze și s-ar putea să nu se mai deschidă deloc.</p>`,
   exemplu:`<pre>  tema.docx  →  Pop_Ana_tema1.docx   bine: extensia a rămas
  tema.docx  →  tema.jpg             rău: a devenit „imagine” doar cu numele</pre>`,
   altfel:`<p>Dacă lipești pe o cutie de lapte eticheta „suc de portocale”, în cutie tot lapte e. Doar că acum te păcălește eticheta.</p>`,
   incearca:{t:'tf',q:'Dacă redenumești <code>poza.jpg</code> în <code>poza.mp3</code>, poza devine un cântec.',ok:false,ajutor:'Se schimbă conținutul sau doar eticheta?',why:'Fals. Conținutul fișierului rămâne tot o imagine. Se schimbă doar eticheta, iar calculatorul încearcă să-l deschidă cu un program greșit.'},
   inca:[
    {t:'choice',q:'Redenumești <code>tema.docx</code>. Ce parte a numelui schimbi?',o:['Doar partea dinaintea punctului','Doar extensia','Tot numele, cu extensie cu tot','Nimic, numele nu se poate schimba'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Extensia rămâne .docx; schimbi doar numele dinaintea punctului.'}
   ]}
 ],
 atelier:{t:'explorer',titlu:'Folder nou și un nume bun',
  intro:`<p><strong>Sarcina</strong>, în Explorerul simulat (ești deja în Documente):</p><ol><li>Creează folderul <code>Proiect_TIC</code> (butonul <b>Folder nou</b> sau clic dreapta pe un loc gol → Nou › Folder; scrii numele, <kbd>Enter</kbd>).</li><li>Redenumește <code>document1.docx</code> în <code>Ionescu_Maria_tema1.docx</code> (selectezi, <b>Redenumire</b> sau <kbd>F2</kbd>, scrii, <kbd>Enter</kbd>).</li></ol>`,
  q:'Folderul Proiect_TIC + redenumirea lui document1.docx.',

/* ================= 5. Copiere, mutare, ștergere, căutare (lecția 10) ================= */
{t:'Copiez, mut, șterg, caut',lectii:[10],continuturi:['Operații cu fișiere și directoare'],
 obiectiv:'copiezi și muți fișiere, le ștergi fără să le pierzi (și le restaurezi din Coș) și găsești un fișier cu căutarea.',
 pasi:[
  {t:'Copierea: două exemplare',
   text:`<p>La <mark>copiere</mark> apare încă un exemplar al fișierului, iar <strong>originalul rămâne pe loc</strong>.</p>
<p>Selectezi fișierul și apeși <kbd>Ctrl</kbd>+<kbd>C</kbd> (copiere). Intri în folderul unde vrei exemplarul și apeși <kbd>Ctrl</kbd>+<kbd>V</kbd> (lipire). Aceleași comenzi le ai și în meniul de clic dreapta: <strong>Copiere</strong> și <strong>Lipire</strong>.</p>`,
   exemplu:`<pre>Înainte:   Desktop\\tema.docx
           Stick USB (E:)   (gol)

Ctrl+C pe tema.docx, intri în E:, Ctrl+V

După:      Desktop\\tema.docx     (a rămas)
           E:\\tema.docx          (exemplarul nou)</pre>`,
   incearca:{t:'choice',q:'Vrei să duci tema acasă pe stick, dar să rămână și pe calculatorul școlii. Ce operație faci?',o:['Copiere','Mutare','Ștergere','Redenumire'],ok:0,ajutor:'Care operație lasă originalul pe loc?',why:'Doar copierea lasă fișierul în ambele locuri. La mutare ar dispărea de pe calculatorul școlii.'},
   inca:[
    {t:'choice',q:'Ai copiat un fișier cu Ctrl+C și l-ai lipit în alt folder cu Ctrl+V. Câte exemplare ai acum?',o:['Două','Unul','Niciunul','Trei'],ok:0,ajutor:'Uită-te la „După” din exemplu.',why:'Originalul a rămas, iar în folderul nou a apărut încă un exemplar: două.'}
   ]},
  {t:'Mutarea: fișierul se mută',
   text:`<p>La <mark>mutare</mark>, fișierul <strong>pleacă</strong> din locul vechi și ajunge în folderul nou. Rămâne un singur exemplar.</p>
<p>Selectezi fișierul și apeși <kbd>Ctrl</kbd>+<kbd>X</kbd> (decupare). Intri în folderul nou și apeși <kbd>Ctrl</kbd>+<kbd>V</kbd> (lipire). În meniul de clic dreapta: <strong>Decupare</strong>, apoi <strong>Lipire</strong>.</p>`,
   exemplu:`<pre>Înainte:   Desktop\\poza.jpg
           Desktop\\Poze\\     (gol)

Ctrl+X pe poza.jpg, intri în Poze, Ctrl+V

După:      Desktop\\Poze\\poza.jpg   (pe Desktop nu mai e)</pre>`,
   altfel:`<p>Copierea e ca la xerox: foaia ta rămâne la tine și mai ai una. Mutarea e ca atunci când iei cartea de pe un raft și o pui pe altul: e tot o singură carte, dar în alt loc.</p>`,
   incearca:{t:'tf',q:'După <kbd>Ctrl</kbd>+<kbd>X</kbd> și <kbd>Ctrl</kbd>+<kbd>V</kbd>, fișierul rămâne și în folderul vechi.',ok:false,ajutor:'X = decupare = mutare. Ce s-a întâmplat cu Desktopul în exemplu?',why:'Fals. Așa se face mutarea: fișierul pleacă din locul vechi. Rămâne în ambele locuri doar la copiere (Ctrl+C).'},
   inca:[
    {t:'order',q:'Muți <code>poza.jpg</code> în folderul Poze. Pune pașii în ordine.',items:['Selectezi poza.jpg','Apeși Ctrl+X','Intri în folderul Poze','Apeși Ctrl+V'],ajutor:'Întâi spui CE muți, apoi UNDE.',why:'Decupezi fișierul, mergi în locul nou, lipești.'}
   ]},
  {t:'Ștergerea și Coșul de reciclare',
   text:`<p><mark>Ștergerea</mark> cu tasta <kbd>Delete</kbd> trimite fișierul în <strong>Coșul de reciclare</strong>. De acolo îl poți <strong>restaura</strong> (pune înapoi).</p>
<p><kbd>Shift</kbd>+<kbd>Delete</kbd> șterge <strong>definitiv</strong>, fără Coș. Atenție: și ce ștergi de pe un <strong>stick USB</strong> nu trece prin Coș, se pierde definitiv.</p>
${fig('cos-restaurare.webp',700,360,'Coșul de reciclare cu fișierul șters notite.txt, coloana Locație inițială și meniul de clic dreapta în care comanda Restaurare e încadrată','În Coș, fișierul își ține minte <b>locația inițială</b>. Clic dreapta → <b>Restaurare</b> îl pune înapoi acolo.')}`,
   exemplu:`<p><b>Strategia: ai șters din greșeală o temă</b></p><ol><li>Deschizi <b>Coșul de reciclare</b> (pictograma de pe desktop).</li><li>Cauți fișierul; coloana „Locație inițială” îți spune de unde a venit.</li><li>Clic dreapta pe el → <b>Restaurare</b>.</li><li>Fișierul e din nou în folderul lui.</li></ol>`,
   incearca:{t:'choice',q:'Ai șters din greșeală, cu tasta Delete, tema de pe desktop. Ce faci?',o:['O cauți în Coșul de reciclare și o restaurezi','Apeși Shift+Delete, ca s-o aduci înapoi','Golești Coșul de reciclare și o cauți din nou','Repornești calculatorul și aștepți să reapară'],ok:0,ajutor:'Strategia din „Uite cum”.',why:'Delete a trimis tema în Coș. Restaurarea o pune înapoi unde era. Golirea Coșului ar șterge-o definitiv.'},
   inca:[
    {t:'classify',q:'Fișierul se mai poate lua înapoi din Coș?',cats:['Da, e în Coș','Nu, s-a șters definitiv'],items:[['Șters cu Delete de pe Desktop',0],['Șters cu Delete din Documente',0],['Șters cu Shift+Delete',1],['Șters cu Delete de pe stick-ul USB',1]],ajutor:'Doar Delete, și doar de pe calculator, trimite în Coș.',why:'Shift+Delete și ștergerea de pe stick nu trec prin Coș.'},
    {t:'tf',q:'Un fișier șters cu Delete de pe un stick USB poate fi luat înapoi din Coșul de reciclare.',ok:false,ajutor:'Ultima propoziție din text.',why:'Fals. De pe stick, Windows șterge definitiv, fără Coș. De aceea citești de două ori mesajul înainte să confirmi.'}
   ]},
  {t:'Căutarea',
   text:`<p>Nu mai știi unde e un fișier? Îl găsești cu <mark>căutarea</mark> din Explorer: caseta din dreapta sus, lângă bara de adresă.</p>
<p>Scrii <strong>o parte din nume</strong> și Explorer caută în folderul în care ești <strong>și în toate folderele din el</strong>. De aceea e bine să pornești căutarea dintr-un folder mare, de exemplu Documente.</p>
${fig('cautare-explorer.webp',934,202,'Caseta de căutare din Explorer cu cuvântul compunere și singurul rezultat găsit, fișierul compunere_toamna.docx','Ajunge o parte din nume: <code>compunere</code> a găsit fișierul.')}`,
   exemplu:`<p><b>Strategia de căutare</b></p><ol><li>Intri într-un folder mare (Documente, sau discul C:).</li><li>Scrii în caseta de căutare un cuvânt din nume: <code>compunere</code>.</li><li>Apeși <kbd>Enter</kbd> și aștepți lista de rezultate.</li><li>Dai clic pe rezultat. Numele clare se găsesc ușor; „document1” nu îți spune ce cauți.</li></ol>`,
   incearca:{t:'choice',q:'Cauți <code>compunere_toamna.docx</code>. Ce scrii în caseta de căutare?',o:['compunere','docx','toamna_compunere_final','Nimic, deschid fiecare folder'],ok:0,ajutor:'Ajunge o parte clară din nume.',why:'„compunere” e o parte din nume. „docx” ar găsi toate documentele.'},
   inca:[
    {t:'tf',q:'Căutarea din Explorer caută și în folderele aflate în folderul în care ești.',ok:true,ajutor:'Al doilea paragraf.',why:'Adevărat. De aceea pornești căutarea dintr-un folder mare.'}
   ]}
 ],

/* ================= 6. Nivelul final: ordinea lui Matei (lecția 11) ================= */
{t:'Ordine în fișierele lui Matei',final:true,lectii:[11],continuturi:['Organizarea datelor pe suport extern','Operații cu fișiere și directoare'],
 obiectiv:'faci ordine într-un desktop plin, după un plan: foldere, nume clare, mutare, ștergere atentă și o copie de siguranță pe stick.',
 pasi:[
  {t:'Planul: întâi folderele',
   text:`<p><strong>Misiunea finală.</strong> Pe desktopul lui Matei sunt fișiere amestecate: teme, poze din excursie. Nu mai găsește nimic.</p>
<p>Ordinea se face după un <mark>plan</mark>. Întâi construiești „dulapul”: un folder principal, <code>Matei_Clasa5</code>, iar în el câte un folder pe materie și unul pentru poze. Abia apoi muți fișierele: un fișier nu poate fi mutat într-un folder care încă nu există.</p>
${fig('structura-matei.webp',1000,307,'Explorer cu structura finală: folderul Matei_Clasa5 încadrat, cu Matematica, Poze și Romana în el, iar în dreapta fișierele compunere_toamna.docx și rezumat_basm.docx','Așa arată ordinea la final: un folder principal, trei foldere în el și fișiere cu nume care spun ce sunt.')}`,
   exemplu:`<p><b>Planul lui Matei, în 5 pași</b></p><ol><li>Creează folderul principal <code>Matei_Clasa5</code> (în Documente).</li><li>Intră în el și creează <code>Matematica</code>, <code>Romana</code>, <code>Poze</code>.</li><li>Redenumește fișierele cu nume neclare.</li><li>Mută fiecare fișier în folderul lui.</li><li>Verifică desktopul și fă o copie de siguranță pe stick.</li></ol><pre>Matei_Clasa5
  Matematica
  Poze
  Romana</pre>`,
   incearca:{t:'order',q:'Pune în ordine pașii lui Matei.',items:['Creează folderul principal Matei_Clasa5','Intră în el și creează folderele Matematica, Romana și Poze','Mută fiecare fișier în folderul lui','Verifică dacă pe desktop a mai rămas ceva'],ajutor:'Planul din „Uite cum”.',why:'Un fișier nu poate fi mutat într-un folder care încă nu există. Verificarea de la final îți arată ce ai uitat.'},
   inca:[
    {t:'classify',q:'În ce folder muți fiecare fișier?',cats:['Matematica','Romana','Poze'],items:[['exercitii_fractii.docx',0],['problema_perimetru.docx',0],['compunere_toamna.docx',1],['rezumat_basm.docx',1],['excursie_Bicaz_1.jpg',2],['excursie_Bicaz_2.jpg',2]],ajutor:'Numele îți spune materia; .jpg înseamnă poză.',why:'Numele clare îți spun singure unde merge fișierul. De aceea redenumirea ajută la ordine.'}
   ]},
  {t:'Întâi numele, apoi mutarea',
   text:`<p>Un fișier numit <code>document1.docx</code> nu spune unde trebuie mutat. De aceea, <strong>înainte să-l muți</strong>, îl deschizi, vezi ce e în el și îi dai un nume clar, cu <kbd>F2</kbd>.</p>
<p>Apoi îl muți cu <kbd>Ctrl</kbd>+<kbd>X</kbd> și <kbd>Ctrl</kbd>+<kbd>V</kbd>. Nu schimbi extensia: o compunere rămâne <code>.docx</code>, chiar dacă o pui lângă poze.</p>`,
   exemplu:`<pre>document1.docx  (în el: tema cu fracții)
   F2  →  fractii_tema1.docx
   Ctrl+X, intri în Matematica, Ctrl+V
Rezultat: Matei_Clasa5\\Matematica\\fractii_tema1.docx</pre>`,
   incearca:{t:'choice',q:'Matei are fișierul <code>document1.docx</code> cu tema la fracții. Ce face întâi?',o:['Îl redenumește în fractii_tema1.docx','Îl șterge cu Shift+Delete','Îi schimbă extensia în .jpg','Îl lasă așa, pe desktop'],ok:0,ajutor:'Titlul pasului: întâi numele…',why:'Un nume clar spune ce e în fișier și unde trebuie mutat.'},
   inca:[
    {t:'tf',q:'Ca să țină compunerea lângă poze, Matei îi schimbă extensia din .docx în .jpg.',ok:false,ajutor:'Recitește ultima propoziție a textului.',why:'Fals. Extensia nu se schimbă: fișierul nu devine imagine și s-ar putea să nu se mai deschidă.'}
   ]},
  {t:'Ștergi doar ce ai verificat. Copia de siguranță',

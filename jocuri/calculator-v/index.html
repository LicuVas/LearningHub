  --fd:"Chakra Petch","Segoe UI",system-ui,sans-serif; --fb:"Nunito Sans","Segoe UI",system-ui,sans-serif; --fm:"Red Hat Mono",Consolas,monospace;

}}

  --mark:#F0CF55; --markInk:#231C18; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF8078; --badbg:#3B1E1E;
  --pcb:#16201D; --trace:#B7773A;
}
/* tema jocului: spatele unui calculator — o placă verde-închis cu trasee de cupru și un șir de porturi */
.banda{display:flex;align-items:center;gap:14px;padding:7px 14px;white-space:nowrap;
  background:
    repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--trace) 35%,transparent) 22px 23px),
    var(--pcb);
  border-bottom:2px solid var(--trace)}
.banda span{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:.62rem;letter-spacing:.06em;color:#D9CFC6}
.banda i{display:block;flex:none;background:#0B0F0E;border:2px solid #9AA3A0}
.banda .usb{width:20px;height:9px;border-radius:2px;box-shadow:inset 0 -3px 0 #3E78C9}
.banda .hdmi{width:26px;height:10px;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);border:0;background:#9AA3A0;position:relative}
.banda .hdmi::after{content:"";position:absolute;inset:2px 4px;background:#0B0F0E;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.banda .lan{width:15px;height:13px;border-radius:1px;box-shadow:inset 0 -4px 0 #0B0F0E,inset 0 3px 0 #C9A13B}
.banda .jack{width:10px;height:10px;border-radius:50%}
.banda .jack.g{border-color:#6DBF6B}.banda .jack.r{border-color:#E07BA5}
h1,h2{font-weight:700;letter-spacing:0}
h1 .led{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--ok);vertical-align:.35em;margin-right:.25em;box-shadow:0 0 .35em var(--ok)}
</style>
</head>

<script src="../_motor/motor.js"></script>
<script>
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../calculator-v/img/${f}" target="_blank"><img src="../calculator-v/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CC0='<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.ro" target="_blank" rel="noopener">CC0</a>',
  BYSA3='<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 3.0</a>',
  BYSA4='<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 4.0</a>',
  MONTAJ=`Fotografiile au fost decupate și puse de noi într-un montaj, cu etichete scrise în română; montajul se dă mai departe sub ${BYSA4}.`;
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;

const IMG={
 inchidere:fig('inchidere-corecta.webp',200,218,'Meniul care se deschide din butonul Alimentare al meniului Start, cu opțiunile Blocare, Repaus, Închidere și Repornire; Închidere este încadrată','Așa oprești calculatorul <b>corect</b>: meniul <b>Start</b> → butonul <b>Alimentare (Power)</b> → <b>Închidere (Shut down)</b>. Niciodată de la priză.'),
 pozitie:fig('pozitia-corecta.webp',1000,994,'Desen cu o persoană așezată corect la birou; etichetele stau pe marginile albe și arată cu săgeți: ochii la 50-70 cm de ecran, marginea de sus a ecranului cam la nivelul ochilor, spatele sprijinit de spătar, coatele și genunchii la aproximativ 90 de grade, masa la 60-70 cm și tălpile pe podea',`Poziția corectă, pe scurt. Fiecare etichetă stă pe marginea albă și arată cu săgeata locul ei. <small>Desen: Yamavu, ${wc('Computer_Workstation_Variables_cleanup.png','Wikimedia Commons')}, licență ${CC0}. Modificat de noi: am scos textul în engleză de pe desen și am scris etichetele în română pe margini.</small>`),
 sisteme:fig('sisteme-de-calcul.webp',904,692,'Patru fotografii: ENIAC dintr-o sală întreagă, un calculator personal din anii 1980, un telefon inteligent și un ceas inteligent',`Patru sisteme de calcul, la distanță de zeci de ani: <b>ENIAC</b> (cât o cameră), <b>PC-ul</b> anilor 1980, <b>telefonul</b> și <b>ceasul inteligent</b>. <small>Foto, Wikimedia Commons: ${wc('Glen_Beck_and_Betty_Snyder_program_the_ENIAC_in_building_328_at_the_Ballistic_Research_Laboratory.jpg','ENIAC')} — autor necunoscut, domeniu public; ${wc('Ibm_pc_5150.jpg','IBM PC')} — Ruben de Rijcke, ${BYSA3}; ${wc('Smartphone_display_screen.jpg','telefon')} — Skitterphoto, ${CC0}; ${wc('Huawei_Smartwatch_(Band_4).jpg','ceas')} — TheArchivistMan, ${CC0}. ${MONTAJ}</small>`),
 componente:fig('componente.webp',962,552,'Șase fotografii cu componentele unui calculator: procesor, memorie RAM, placă de bază, SSD, sursă de alimentare și placă video',`<b>Hardware-ul</b>, pe bucăți. <small>Foto, Wikimedia Commons: ${wc('Intel_CPU_Celeron_G3930_Kaby_Lake_perspective.jpg','procesor')} — Eric Gaba, ${BYSA4}; ${wc('2*8Go_DDR4_Corsair_-_2018-05-08.jpg','RAM')} — Bretwa, ${BYSA4}; ${wc('2023_P%C5%82yta_g%C5%82%C3%B3wna_ASRock_A320M-DVS.jpg','placă de bază')} — Jacek Halicki, ${BYSA4}; ${wc('Crucial_CT256M4SSD2_rear_20120123.jpg','SSD')} — Djsumdog, ${BYSA3}; ${wc('ATX_Computer_power_supply_unit.jpg','sursă')} — Dmitry Makeev, ${BYSA4}; ${wc('MSI_GeForce_GT_1030_2G_LP_OC_Graphics_Card_20200604-001.jpg','placă video')} — Gary Houston, ${CC0}. ${MONTAJ}</small>`),
 manager:fig('manager-performanta.webp',220,480,'Lista din fila Performanță a Managerului de activități: CPU 4,07 GHz, Memorie 15,5/39,7 GB, Disc 0 SSD, Disc 1 USB, Disc 2 HDD, Wi-Fi și GPU','<b>Manager de activități (Task Manager)</b> → <b>Performanță (Performance)</b>: procesorul (CPU), memoria și fiecare disc, scrise de calculator.'),
 memorie:fig('memorie-40gb.webp',517,102,'Antetul filei Memorie din Managerul de activități, cu 40,0 GB DDR4 încadrat cu roșu','Apeși pe <b>Memorie</b>: sus, în dreapta, scrie <b>câtă memorie RAM</b> are calculatorul — aici <b>40,0 GB DDR4</b> (încadrat).'),
 periferice:fig('periferice.webp',962,522,'Șase fotografii de periferice: tastatură, mouse și cameră web marcate ca intrare, monitor, boxe și imprimantă marcate ca ieșire',`Sus, trei periferice de <b>intrare</b>; jos, trei de <b>ieșire</b>. <small>Foto, Wikimedia Commons: ${wc('QWERTY_keyboard.jpg','tastatură')} — MichaelMaggs, ${BYSA3}; ${wc('Computer_mouse_1_2015-02-28.JPG','mouse')} — FASTILY, ${BYSA4}; ${wc('USB_webcam_for_PC.jpg','cameră web')} — WrS.tm.pl, ${CC0}; ${wc('Computer_monitor.jpg','monitor')} — Zzubnik, domeniu public; ${wc('Bose_Computer_MusicMonitor.jpg','boxe')} — Ben Stassen's, <a href="https://creativecommons.org/licenses/by/2.0/deed.ro" target="_blank" rel="noopener">CC BY 2.0</a>; ${wc('Epson-inkjet-printer.jpg','imprimantă')} — „Somebody in the WWW”, ${BYSA3}. ${MONTAJ}</small>`),
 acestpc:fig('acest-pc-capacitati.webp',330,334,'Trei rânduri din fereastra Acest PC, unul sub altul: Disc local C: 198 GB liber din 475 GB, Volum nou W: 3,37 GB liber din 5,00 GB și My Passport P: 858 GB liber din 1,81 TB; capacitatea totală e scrisă mare, cu roșu','<b>Acest PC (This PC)</b>: sub fiecare unitate scrie „<b>… liber din …</b>”. Numărul mare cu roșu e capacitatea totală; bara albastră arată cât e ocupat.'),
 dimensiune:fig('dimensiune-fisier.webp',552,500,'Fereastra Proprietăți a unui fișier video, unde scrie Dimensiune 3,50 GB, adică 3.758.096.384 baiți','Clic dreapta pe un fișier → <b>Proprietăți (Properties)</b>: la <b>Dimensiune (Size)</b> scrie <b>3,50 GB</b>, adică <b>3.758.096.384</b> de baiți (octeți).'),
 incape:fig('incape-sau-nu.webp',340,240,'Două decupaje din același ecran: Dimensiune 3,50 GB la Proprietățile filmului și 3,37 GB liber din 5,00 GB pe Volum nou (W:), cu concluzia scrisă cu roșu: 3,50 GB mai mare decât 3,37 GB, filmul nu încape','Comparația pe calculatorul real: <b>cât ocupă filmul</b> (3,50 GB) și <b>cât loc LIBER</b> mai e pe unitate (3,37 GB). Filmul nu încape.')
};

const LEVELS=[
/* ================= 1. Laboratorul în siguranță (lecția 2) ================= */
{t:'Laboratorul în siguranță',lectii:[2],continuturi:['Normele de securitate și protecție a muncii în laboratorul de informatică'],
 obiectiv:'știi regulile laboratorului, ce faci când ceva nu e în regulă și cum oprești corect calculatorul.',
 pasi:[
  {t:'De ce are laboratorul reguli',
   text:`<p>În laboratorul de informatică sunt multe calculatoare, cabluri și prize. Prin ele trece <strong>curent electric</strong>.</p>
<p>De aceea laboratorul are <mark>norme de securitate</mark>: reguli care te apără pe tine, pe colegi și calculatoarele. Nu sunt capriciile profesorului.</p>
<p>Prima regulă: intri în laborator <strong>numai cu profesorul</strong>. Te așezi la locul tău și verifici din priviri: cablurile sunt întregi? Masa e uscată și curată?</p>`,
   exemplu:`<p>Primele două minute din ora de informatică:</p><ol><li>Aștepți profesorul la ușă.</li><li>Intri și te așezi la locul tău.</li><li>Te uiți: cablul mouse-ului e întreg? Nu e nimic vărsat pe masă?</li><li>Dacă vezi ceva stricat, îi spui profesorului <strong>înainte</strong> să pornești calculatorul.</li></ol>`,
   altfel:`<p>E ca la piscină: acolo e apă adâncă, aici e curent electric. La piscină nu intri fără salvamar și nu alergi pe margine. În laborator nu intri fără profesor și nu umbli la cabluri.</p>`,
   incearca:{t:'tf',q:'Ușa laboratorului e deschisă, dar profesorul încă n-a venit. Am voie să intru și să pornesc calculatorul.',ok:false,ajutor:'Recitește „prima regulă” din pas.',why:'Fals. Intri numai cu profesorul. Fără el, nimeni nu vede dacă ceva e stricat sau periculos.'},
   inca:[
    {t:'choice',q:'Te așezi la locul tău și vezi un cablu cu izolația ruptă. Ce faci?',o:['Nu îl atingi și îi spui profesorului','Îl înfășori singur cu bandă adezivă','Îl muți mai încolo și pornești calculatorul','Nu spui nimic, poate nu e grav'],ok:0,ajutor:'Uită-te la pasul 4 din exemplu.',why:'Un cablu rupt poate da curent. Nu îl atingi; profesorul știe cum se repară în siguranță.'},
    {t:'choice',q:'Pe cine apără normele de securitate din laborator?',o:['Pe tine, pe colegi și calculatoarele','Doar calculatoarele școlii','Doar pe profesor','Pe nimeni, sunt doar obiceiuri'],ok:0,ajutor:'Pasul spune trei lucruri.',why:'Regulile te feresc pe tine și pe colegi de curent, iar aparatele de stricăciuni.'}
   ]},
  {t:'Mâncarea, lichidele și cablurile',
   text:`<p><strong>Nu</strong> aduci mâncare sau băuturi lângă tastatură. Un singur strop de suc poate intra în tastatură sau ajunge la un cablu, iar <mark>lichidul și curentul electric</mark> sunt periculoase împreună. Firimiturile intră între taste și le blochează.</p>
<p><strong>Nu</strong> atingi cablurile, prizele sau spatele calculatorului. Acolo sunt legăturile cu curent. Nu le muți, nu le scoți, nu le bagi la loc.</p>
<p>Mâncarea și apa rămân în ghiozdan. Le folosești în pauză, <strong>afară</strong> din laborator.</p>`,
   altfel:`<p>Gândește-te la un uscător de păr lângă cadă: nimeni nu-l folosește acolo. Apa și curentul nu se împacă nicăieri — nici la baie, nici lângă tastatură.</p>`,
   incearca:{t:'classify',q:'Este voie sau nu este voie în laborator?',cats:['Este voie','Nu este voie'],items:[['Sticla de apă ținută în ghiozdan',0],['Un pachet de biscuiți lângă mouse',1],['Să muți un cablu din spatele calculatorului',1],['Să bei apă afară, în pauză',0]],ajutor:'Ce e aproape de tastatură și de cabluri e periculos.',why:'Ce e închis în ghiozdan sau afară din laborator nu face rău. Mâncarea lângă tastatură și mâinile la cabluri, da.'},
   inca:[
    {t:'tf',q:'Dacă sticla are dop, pot s-o țin pe masă, lângă tastatură.',ok:false,ajutor:'Pasul spune unde rămân mâncarea și apa.',why:'Fals. O sticlă se poate răsturna și deschide. Rămâne în ghiozdan.'}
   ]},
  {t:'Programele și fișierele altora',
   text:`<p>Calculatoarele școlii sunt folosite de multe clase. De aceea:</p>
<ul><li><strong>nu instalezi</strong> și <strong>nu ștergi</strong> programe fără să-l întrebi pe profesor;</li>
<li><strong>fișierele colegilor sunt ale lor</strong>: nu le deschizi, nu le schimbi și nu le ștergi;</li>
<li>lucrezi doar în locul arătat de profesor.</li></ul>
<p>Un program străin poate aduce un virus. Un fișier șters din greșeală poate fi munca de o lună a unui coleg.</p>`,
   exemplu:`<p>Situație: găsești pe calculator un joc care îți place și vrei să-l instalezi. <strong>Corect:</strong> întrebi profesorul. <strong>Greșit:</strong> îl instalezi „repede, că nu vede nimeni”.</p>`,
   incearca:{t:'choice',q:'Pe calculator găsești folderul unui coleg din altă clasă. Ce faci?',o:['Nu îl deschid și nu îl șterg','Îl deschid, doar ca să văd ce e','Îl șterg, ca să fie loc mai mult','Îl mut în folderul meu'],ok:0,ajutor:'Al cui e fișierul?',why:'Fișierele colegului sunt munca lui. Nu umbli la ele fără acordul lui.'},
   inca:[
    {t:'tf',q:'Pot instala un program pe calculatorul școlii dacă îl găsesc gratuit pe internet.',ok:false,ajutor:'Pe cine întrebi înainte?',why:'Fals. Gratuit nu înseamnă sigur. Instalezi doar cu acordul profesorului.'}
   ]},
  {t:'Când ceva nu e în regulă',
   text:`<p>Uneori calculatorul are o problemă: <strong>miroase a ars</strong>, vezi <strong>scântei</strong> sau fum, ecranul se stinge, mouse-ul nu mai merge.</p>
<p>Regula e una singură: <mark>anunți imediat profesorul</mark>. Nu repari singur. Nu scoți ștecherul, nu deschizi carcasa. Te poți electrocuta.</p>
<p><strong>Ce faci, pe rând:</strong></p>
<ol><li>Iei mâinile de pe tastatură și mouse.</li><li>Te dai puțin înapoi de la masă.</li><li>Ridici mâna și chemi profesorul.</li><li>Îi spui exact ce ai văzut sau ai simțit.</li></ol>`,
   altfel:`<p>La un accident de mașină, oamenii nu se apucă singuri să repare motorul: sună la 112 și spun ce au văzut. În laborator, „112” este profesorul.</p>`,
   incearca:{t:'order',q:'Ecranul tău scoate un fir de fum. Pune pașii în ordine.',items:['Iei mâinile de pe tastatură și mouse','Te dai puțin înapoi de la masă','Chemi profesorul','Îi spui ce ai văzut'],ajutor:'Urmează lista numerotată din pas.',why:'Întâi te ferești tu, apoi anunți, apoi explici. Profesorul oprește curentul în siguranță.'},
   inca:[
    {t:'choice',q:'Mouse-ul tău nu mai mișcă săgeata. Ce faci?',o:['Îi spun profesorului','Scot cablul și îl bag în altă parte','Deschid carcasa calculatorului','Iau mouse-ul colegului'],ok:0,ajutor:'Și o problemă mică se anunță.',why:'Orice defecțiune se anunță, nu se repară singur și nu se ascunde.'},
    {t:'tf',q:'Dacă simt miros de ars, scot repede ștecherul din priză.',ok:false,ajutor:'Recitește a doua propoziție din pas.',why:'Fals. Umblând la priză te poți electrocuta. Anunți imediat profesorul.'}
   ]},
  {t:'Oprirea corectă a calculatorului',
   text:`<p>Calculatorul e condus de un program principal: <mark>sistemul de operare</mark> (în laborator, Windows). El îl și oprește.</p>
<p>La finalul orei: întâi <strong>salvezi</strong> ce ai lucrat și <strong>închizi programele</strong>. Apoi: <strong>Start</strong> → butonul <strong>Alimentare (Power)</strong> → <strong>Închidere (Shut down)</strong>.</p>
<p><strong>Niciodată de la priză.</strong> Scos din priză, calculatorul se oprește brusc: programele nu apucă să se închidă, iar ce nu era salvat se pierde.</p>
${IMG.inchidere}`,
   exemplu:`<p>În captură, butonul Alimentare deschide patru variante: <b>Blocare</b>, <b>Repaus</b>, <b>Închidere</b> și <b>Repornire</b>. Pentru oprire alegi <b>Închidere</b>, cea încadrată. <b>Repornire</b> îl oprește și îl pornește la loc.</p>`,
   incearca:{t:'order',q:'Pune în ordine clicurile pentru oprirea corectă.',items:['Start','Alimentare (Power)','Închidere (Shut down)'],ajutor:'Uită-te la legenda capturii.',why:'Din meniul Start, butonul Alimentare, apoi Închidere: sistemul de operare închide totul în ordine.'},
   inca:[
    {t:'choice',q:'Ce faci ÎNAINTE să apeși Start → Alimentare → Închidere?',o:['Salvezi lucrul și închizi programele','Scoți stickul din calculator cu forța','Stingi monitorul de la buton','Nimic, se salvează singur'],ok:0,ajutor:'Pasul spune ce faci „întâi”.',why:'Salvezi și închizi programele, ca să nu pierzi nimic.'}
   ]}
 ],
 atelier:{t:'order',titlu:'Ora ta în laborator, de la ușă la ieșire',
  intro:`<p><strong>Sarcina:</strong> pune în ordine tot ce faci într-o oră de informatică, de la intrare până pleci. Folosește pașii învățați: intrarea, verificarea locului, lucrul, oprirea corectă.</p>`,
  q:'Pune în ordine ce faci în ora de informatică.',items:['Intri în laborator odată cu profesorul','Te așezi și verifici cablurile și masa','Pornești calculatorul și lucrezi','Salvezi ce ai lucrat','Închizi programele','Start → Alimentare → Închidere'],
  ajutor:'Începutul e din pasul 1, sfârșitul din pasul 5.',why:'Asta e ora unui elev atent: intră în siguranță, lucrează, salvează și oprește calculatorul din sistemul de operare.',
  inca:[
   {t:'hunt',q:'Mihai își povestește ora. Apasă pe cele 3 greșeli.',src:'Am intrat [[înaintea profesorului|intri numai cu profesorul]] și m-am așezat. Am verificat cablul mouse-ului: era întreg. Am lucrat la desen și [[mi-am mâncat sandvișul lângă tastatură|mâncarea rămâne în ghiozdan, afară din laborator]]. La final am salvat desenul și [[am scos calculatorul din priză|oprești din Start → Alimentare → Închidere]].',indiciu:'Verifică intrarea, mâncarea și oprirea.',why:'Mihai a verificat cablul și a salvat desenul: astea au fost bune. Celelalte trei încalcă regulile din pași.'},
   {t:'classify',q:'Rezolvi singur sau anunți profesorul?',cats:['Fac eu','Anunț profesorul'],items:[['Salvez lucrul înainte de final',0],['Miroase a ars',1],['Ecranul s-a stins brusc',1],['Închid programele la final',0],['Un cablu are izolația ruptă',1]],ajutor:'Ce e defect sau periculos se anunță.',why:'Salvarea și închiderea programelor sunt treaba ta. Defecțiunile și pericolele le rezolvă profesorul.'}
  ]},
 qs:[
  {t:'tf',q:'Pot să beau suc lângă tastatură, dacă am grijă.',ok:false,why:'Fals. Un singur strop poate intra în tastatură sau ajunge la un cablu. Lichidul și curentul electric sunt periculoase împreună, oricâtă grijă ai avea.'},
  {t:'choice',q:'Simți miros de ars la calculatorul tău. Ce faci?',o:['Anunți imediat profesorul','Scoți singur ștecherul din priză','Deschizi carcasa să vezi ce arde','Continui să lucrezi, poate trece'],ok:0,ajutor:'Pasul „Când ceva nu e în regulă” are o singură regulă.',why:'Mirosul de ars poate fi o problemă electrică. Dacă umbli singur la priză sau la carcasă, te poți electrocuta. Profesorul știe cum se oprește curentul în siguranță.'},
  {t:'classify',q:'E corect sau greșit în laborator?',cats:['Corect','Greșit'],items:[['Intru în laborator cu profesorul',0],['Mănânc un covrig la tastatură',1],['Opresc calculatorul din sistemul de operare',0],['Mut cablurile din spatele calculatorului',1],['Instalez un joc fără să întreb',1],['Spun profesorului că mouse-ul nu merge',0]],why:'Regulile au un scop: fără firimituri și lichide în aparate, fără mâini la cabluri și prize, fără programe străine pe calculatoarele școlii. O defecțiune se anunță, nu se ascunde.'},
  {t:'choice',q:'De ce nu oprești calculatorul direct de la priză?',o:['Programele nu apucă să se închidă și lucrul nesalvat se pierde','Pentru că priza e prea departe de scaun și cablul se rupe','Nu contează cum îl oprești, programele se salvează singure','Ca să nu se stingă lumina și celelalte calculatoare din laborator'],ok:0,ajutor:'Recitește ultimul paragraf din pasul 5.',why:'Oprirea din sistemul de operare închide programele pe rând, în ordine. Scos din priză, calculatorul se oprește brusc, iar ce nu era salvat se pierde.'},
  {t:'tf',q:'Colegul meu lipsește azi, așa că am voie să lucrez în fișierele lui.',ok:false,why:'Fals. Fișierele lui sunt munca lui. Fără acordul lui le poți strica sau șterge din greșeală, iar el nu mai are cum să le recupereze.'}
 ]},

/* ================= 2. Poziția corectă (lecția 2) ================= */
{t:'Poziția corectă',lectii:[2],continuturi:['Poziția corectă a corpului la stația de lucru'],
 obiectiv:'îți verifici singur poziția la calculator, parte cu parte, și știi cum îți odihnești ochii.',
 pasi:[
  {t:'Verificarea de sus în jos',
   text:`<p>Stai mult la calculator? Corpul tău simte. Dacă stai strâmb, apar dureri de spate, de ceafă sau ochi obosiți. De aceea contează <mark>poziția corectă</mark>.</p>
<p>O verifici <strong>de sus în jos</strong>, pe patru părți ale corpului:</p>
<ol><li><strong>ochii</strong> (și ecranul),</li><li><strong>spatele</strong>,</li><li><strong>brațele</strong>,</li><li><strong>picioarele</strong>.</li></ol>
<p>Desenul arată toată poziția. În pașii următori o luăm pe rând.</p>
${IMG.pozitie}`,
   incearca:{t:'order',q:'În ce ordine verifici poziția, de sus în jos?',items:['Ochii','Spatele','Brațele','Picioarele'],ajutor:'Pornești de la cap și cobori.',why:'De sus în jos nu sari nimic: ochii, spatele, brațele, picioarele.'},
   inca:[
    {t:'choice',q:'Ce pățești dacă stai strâmb ore în șir?',o:['Dureri de spate și de ceafă','Calculatorul merge mai încet','Nu se întâmplă nimic','Ți se strică tastatura'],ok:0,ajutor:'Primul paragraf din pas.',why:'Poziția strâmbă apasă mult timp pe spate și pe ceafă.'}
   ]},
  {t:'Ochii și ecranul',
   text:`<p>Ecranul stă la <mark>50–70 cm</mark> de ochi. Cam cât brațul tău întins.</p>
<p><strong>Marginea de sus</strong> a monitorului e cam la nivelul ochilor. Așa privești puțin în jos, fără să ridici bărbia.</p>
<p>Prea aproape, ochii obosesc repede și încep să usture.</p>`,
   exemplu:`<p>Cum măsori fără riglă: te așezi, întinzi brațul spre ecran. Vârfurile degetelor ating ecranul sau aproape? Distanța e bună. Cotul rămâne îndoit și ajungi ușor la ecran? Ești prea aproape: te dai înapoi cu scaunul.</p>`,
   incearca:{t:'choice',q:'Cum verifici repede dacă ecranul e la distanța bună?',o:['Întinzi brațul: degetele ajung cam la ecran','Te apleci până atingi ecranul cu nasul','Măsori cu pasul distanța până la ușă','Mărești literele până se văd'],ok:0,ajutor:'Uită-te la exemplul „Uite cum”.',why:'Brațul întins are cam 50–70 cm, exact distanța bună.'},
   inca:[
    {t:'tf',q:'Marginea de sus a ecranului stă cam la nivelul ochilor.',ok:true,ajutor:'Al doilea paragraf din pas.',why:'Adevărat. Așa privești puțin în jos, cu gâtul relaxat.'}
   ]},
  {t:'Spatele și brațele',
   text:`<p><strong>Spatele</strong> stă drept, sprijinit de spătar. Umerii sunt relaxați, nu ridicați spre urechi.</p>
<p><strong>Brațele:</strong> coatele sunt îndoite cam în <mark>unghi drept</mark>, ca litera L. <strong>Încheieturile</strong> stau drepte, nu îndoite în sus pe tastatură. Îndoite ore întregi, îți amorțesc palma și degetele.</p>`,
   altfel:`<p>Gândește-te la un scaun: are spătar ca să-l folosești. Dacă stai pe margine, aplecat spre ecran, spatele ține singur tot corpul și obosește repede.</p>`,
   incearca:{t:'match',q:'Leagă fiecare parte a corpului de poziția ei corectă.',pairs:[['Spatele','drept, sprijinit de spătar'],['Umerii','relaxați'],['Coatele','îndoite ca litera L'],['Încheieturile','drepte pe tastatură']],ajutor:'Recitește pasul: fiecare rând începe cu partea corpului.',why:'Fiecare parte are poziția ei; împreună, corpul nu obosește.'},
   inca:[
    {t:'choice',q:'Încheietura ta e îndoită mult în sus când scrii. Ce pățești după ore întregi?',o:['Amorțeli în palmă și în degete','Dureri de ochi','Nimic, e poziția bună','Dureri de genunchi'],ok:0,ajutor:'Durerea apare exact unde e îndoitura.',why:'Încheietura îndoită apasă pe palmă și degete. De aceea o ții dreaptă.'}
   ]},
  {t:'Picioarele',
   text:`<p><strong>Tălpile</strong> stau pe podea, iar genunchii sunt îndoiți cam în unghi drept.</p>
<p>Scaunul e prea înalt și picioarele atârnă? Pui <mark>un suport</mark> sub tălpi: o cutie sau un taburet mic. Contează ca tălpile să stea <strong>sprijinite</strong>.</p>
<p>Nu ții picioarele încrucișate sub scaun sau strânse sub tine.</p>`,
   incearca:{t:'tf',q:'Pot să stau cu picioarele încrucișate sub scaun, dacă așa îmi place.',ok:false,ajutor:'Ultima propoziție din pas.',why:'Fals. Tălpile stau sprijinite pe podea sau pe un suport.'},
   inca:[
    {t:'choice',q:'Picioarele tale nu ajung la podea. Ce faci?',o:['Pui un suport sub tălpi','Stai pe marginea scaunului','Îți ții picioarele în aer','Stai în picioare'],ok:0,ajutor:'Al doilea paragraf din pas.',why:'Suportul ține tălpile sprijinite, ca podeaua.'}
   ]},
  {t:'Pauzele pentru ochi: regula 20–20–20',
   text:`<p>Când privești mult aproape, mușchii ochiului stau încordați. Au nevoie de pauze.</p>
<p><mark>Regula 20–20–20</mark>: la fiecare <strong>20 de minute</strong>, privești <strong>20 de secunde</strong> ceva aflat departe, la cel puțin <strong>6 metri</strong>.</p>
<p>Și încă ceva: prea mult timp la jocuri, mai ales seara, strică <strong>somnul</strong> și <strong>atenția</strong> de a doua zi.</p>`,
   exemplu:`<p>Lucrezi la un desen de la 10:00. La 10:20 te uiți pe geam, la un copac din curte, și numeri în gând până la 20. Apoi lucrezi mai departe. La 10:40, din nou.</p>`,
   altfel:`<p>E ca atunci când ții o sticlă strânsă în pumn: după un timp mâna obosește și trebuie să o deschizi. Privitul departe e „mâna deschisă” a ochiului.</p>`,
   incearca:{t:'choice',q:'Ai lucrat 20 de minute. Ce faci după regula 20–20–20?',o:['Privești 20 de secunde ceva aflat departe','Închizi calculatorul 20 de minute','Te apropii de ecran','Faci 20 de genuflexiuni'],ok:0,ajutor:'Cele trei numere: minute, secunde, metri.',why:'Privitul departe relaxează mușchii ochiului.'},
   inca:[
    {t:'choice',q:'Cât de departe e bine să privești în pauza de 20 de secunde?',o:['La cel puțin 6 metri','La 20 cm','La tastatură','La 1 metru'],ok:0,ajutor:'Al treilea număr din regulă.',why:'La cel puțin 6 metri, ochiul se relaxează. Tastatura e tot aproape.'}
   ]}
 ],
 atelier:{t:'hunt',titlu:'Verifică-i poziția Mariei',
  intro:`<p><strong>Sarcina:</strong> Maria își descrie cum stă la calculator. Verifică-i poziția <strong>de sus în jos</strong>, ca în pasul 1: ochii, spatele, brațele, picioarele, apoi pauzele. Apasă pe fiecare greșeală.</p>`,
  q:'Maria descrie cum stă la calculator. Apasă pe cele 4 greșeli.',src:'Ecranul e la [[30 cm|ecranul stă la 50–70 cm, cam cât brațul întins]] de ochi. Stau cu spatele sprijinit de spătar și cu umerii relaxați. Coatele sunt îndoite ca litera L, dar [[încheieturile le țin îndoite în sus|încheieturile stau drepte]]. Scaunul e prea înalt, așa că [[picioarele îmi atârnă|tălpile stau sprijinite, pe podea sau pe un suport]]. Lucrez [[o oră fără să ridic ochii|la fiecare 20 de minute privești 20 de secunde departe]].',
  indiciu:'Ia pe rând: ochii, spatele, brațele, picioarele, pauzele.',
  why:'Spatele și coatele Mariei sunt bine. Ecranul, încheieturile, picioarele și pauzele trebuie reparate.',
  inca:[
   {t:'hunt',q:'Și Radu își descrie poziția. Apasă pe cele 2 greșeli.',src:'Am ecranul cam la un braț distanță. Stau [[pe marginea scaunului, aplecat spre ecran|spatele stă sprijinit de spătar]]. Coatele sunt îndoite ca litera L. Am tălpile pe un suport. Seara [[mă joc până după miezul nopții|prea mult timp la jocuri strică somnul și atenția]].',indiciu:'Unul e la spate, altul la obiceiurile de seară.',why:'Spatele sprijinit și somnul bun contează la fel de mult ca distanța de ecran.'}
  ]},
 qs:[
  {t:'choice',q:'La ce distanță stă ecranul față de ochi?',o:['20–30 cm','50–70 cm','2 metri','Nu contează'],ok:1,amesteca:false,why:'Prea aproape, ochii obosesc repede și încep să usture. La 50–70 cm, cam cât brațul întins, ochii obosesc mai greu, iar textul se vede încă bine.'},
  {t:'match',q:'Leagă fiecare greșeală de ce pățești din cauza ei.',pairs:[['Ecranul prea aproape','ochi obosiți care ustură'],['Spatele încovoiat ore în șir','dureri de spate și de ceafă'],['Încheietura îndoită pe tastatură','amorțeli în palmă și în degete'],['Ore multe de joc seara','somn stricat și atenție scăzută']],ajutor:'Durerea apare exact acolo unde e greșeala.',why:'Fiecare greșeală apasă mult timp pe aceeași parte a corpului. De aceea durerea apare exact acolo.'},
  {t:'choice',q:'Ce spune regula 20–20–20?',o:['La 20 de minute privești 20 de secunde ceva aflat departe','La 20 de minute faci 20 de genuflexiuni','Lucrezi 20 de minute, apoi închizi ochii 20 de minute','La 20 de minute te apropii cu 20 cm de ecran'],ok:0,why:'Când privești mult aproape, mușchii ochiului stau încordați. Privind departe, ei se relaxează.'},
  {t:'hunt',q:'Andrei își descrie poziția la calculator. Apasă pe cele 3 greșeli.',src:'Stau cu ecranul la [[20 cm|ecranul stă la 50–70 cm de ochi]] ca să văd bine. Țin spatele [[aplecat|spatele stă drept, sprijinit de spătar]] în față. Picioarele le țin [[încrucișate sub scaun|tălpile stau pe podea sau pe un suport]], iar la fiecare 20 de minute privesc departe.',indiciu:'Verifică pe rând ochii, spatele și picioarele.',ajutor:'Folosește verificarea de sus în jos: ochii, spatele, brațele, picioarele.',why:'Poziția corectă se verifică pe părți ale corpului: ochii, spatele, brațele, picioarele. Ultima parte a lui Andrei e bună: el respectă regula 20–20–20.'},
  {t:'tf',q:'Scaunul e prea înalt și tălpile nu ajung la podea. Poți pune un suport sub picioare.',ok:true,why:'Adevărat. Regula cere ca tălpile să stea sprijinite. O cutie sau un suport le sprijină la fel ca podeaua.'}
 ]},

/* ================= 3. Sisteme de calcul (lecția 3) ================= */
{t:'Sisteme de calcul în jurul meu',lectii:[3],continuturi:['Sisteme de calcul și de comunicații întâlnite în viața cotidiană','Momente principale în evoluția sistemelor de calcul'],
 obiectiv:'recunoști un sistem de calcul după ce face, nu după cum arată, și povestești pe scurt cum au evoluat calculatoarele.',
 pasi:[
  {t:'Ce face un sistem de calcul',
   text:`<p>Un <mark>sistem de calcul</mark> face mereu trei lucruri, în ordinea asta:</p>
<ol><li>primește <strong>date</strong> (de la tine sau de la un senzor);</li>
<li>le <strong>prelucrează</strong>, adică lucrează cu ele după un <strong>program</strong>;</li>
<li>dă un <strong>rezultat</strong>.</li></ol>
<p>Calculatorul din laborator e un sistem de calcul. Dar nu e singurul.</p>`,
   exemplu:`<p>Calculatorul de buzunar: apeși <b>2 + 3</b> (datele), el socotește (prelucrarea), pe ecran apare <b>5</b> (rezultatul).</p>`,
   altfel:`<p>E ca la bucătărie: pui ingredientele (datele), bucătarul le gătește după rețetă (prelucrarea după program), iar la final ai mâncarea (rezultatul).</p>`,
   incearca:{t:'order',q:'La bancomat: pune în ordine ce face el.',items:['Primește cardul și codul PIN (date)','Verifică datele după programul lui (prelucrare)','Îți dă banii (rezultat)'],ajutor:'Date, prelucrare, rezultat.',why:'Bancomatul face aceiași trei pași ca orice sistem de calcul.'},
   inca:[
    {t:'choice',q:'Ce face orice sistem de calcul?',o:['Primește date, le prelucrează și dă un rezultat','Are neapărat tastatură, mouse și monitor','Merge doar când e legat la internet','Scrie documente și le tipărește pe hârtie'],ok:0,ajutor:'Lista numerotată din pas.',why:'Cei trei pași definesc un sistem de calcul, nu forma lui.'}
   ]},
  {t:'Cum recunoști un sistem de calcul',
   text:`<p>Un sistem de calcul <strong>nu are neapărat</strong> tastatură și monitor. Telefonul, bancomatul, ceasul inteligent și casa de marcat din magazin sunt tot sisteme de calcul.</p>
<p><strong>Metoda de detectiv</strong>, pentru orice obiect:</p>
<ol><li>Primește date?</li><li>Le prelucrează după un program?</li><li>Dă un rezultat?</li></ol>
<p>Trei de „da” → este sistem de calcul. Un întrerupător care aprinde becul <strong>nu este</strong>: el doar închide curentul, nu prelucrează nimic.</p>`,
   exemplu:`<p>Casa de marcat: primește codurile produselor (da), adună prețurile după programul ei (da), tipărește bonul cu totalul (da). Deci este sistem de calcul.</p>`,
   incearca:{t:'classify',q:'Folosește metoda de detectiv. Este sau nu este sistem de calcul?',cats:['Este','Nu este'],items:[['Telefonul',0],['Întrerupătorul de la bec',1],['Ceasul inteligent',0],['O riglă',1]],ajutor:'Pune cele 3 întrebări fiecărui obiect.',why:'Telefonul și ceasul primesc date, le prelucrează și dau rezultate. Întrerupătorul și rigla nu prelucrează nimic.'},
   inca:[
    {t:'tf',q:'Un sistem de calcul are mereu tastatură și monitor.',ok:false,ajutor:'Prima propoziție din pas.',why:'Fals. Bancomatul sau ceasul inteligent n-au tastatură obișnuită, dar sunt sisteme de calcul.'}
   ]},
  {t:'Cum au evoluat calculatoarele',
   text:`<p>Calculatoarele n-au arătat mereu ca azi. Patru momente mari:</p>
<ol><li><strong>mașini mecanice</strong> cu roți dințate, pentru socoteli simple;</li>
<li>primele <strong>calculatoare electronice</strong>, în anii 1940–1950 (ENIAC ocupa o cameră întreagă);</li>
<li><strong>calculatorul personal</strong> (PC), în case și școli, în anii 1980–1990;</li>
<li><strong>telefonul inteligent</strong>, răspândit după 2007.</li></ol>
${IMG.sisteme}`,
   incearca:{t:'order',q:'Pune în ordine, de la cel mai vechi.',items:['Mașina mecanică cu roți dințate','ENIAC','Calculatorul personal (PC)','Telefonul inteligent'],ajutor:'Lista numerotată din pas.',why:'Din cameră întreagă, pe birou, apoi în buzunar.'},
   inca:[
    {t:'choice',q:'Cam când au apărut primele calculatoare electronice?',o:['În anii 1940–1950','În anii 1980–1990','După 2007','Acum 500 de ani'],ok:0,ajutor:'Al doilea moment din listă.',why:'ENIAC și primele calculatoare electronice sunt din anii 1940–1950.'}
   ]},
  {t:'Mai mici, mai rapide, conectate',
   text:`<p>De la un pas la altul, calculatoarele au devenit <mark>mai mici, mai rapide și conectate între ele</mark>.</p>
<p>Legătura dintre ele e partea de <strong>comunicații</strong>: dispozitivele schimbă date între ele. Telefonul tău trimite un mesaj altui telefon doar pentru că sunt conectate, prin rețea.</p>`,
   incearca:{t:'choice',q:'Ce înseamnă „comunicații” la sistemele de calcul?',o:['Dispozitivele schimbă date între ele','Calculatorul are boxe','Calculatorul e mai ieftin','Calculatorul vorbește singur'],ok:0,ajutor:'A doua propoziție din pas.',why:'Comunicația = schimb de date între dispozitive conectate.'},
   inca:[
    {t:'tf',q:'Calculatoarele de azi sunt mai mari și mai lente decât ENIAC.',ok:false,ajutor:'Cele trei cuvinte marcate din pas.',why:'Fals. Au devenit mai mici, mai rapide și conectate.'}
   ]}
 ],
 atelier:{t:'classify',titlu:'Detectivul de sisteme de calcul',
  intro:`<p><strong>Sarcina:</strong> uită-te prin casă și prin oraș. Pentru fiecare obiect, pune cele trei întrebări ale detectivului: <b>primește date? le prelucrează? dă un rezultat?</b> Apoi sortează-l.</p>`,
  q:'Sortează obiectele: sunt sau nu sisteme de calcul?',cats:['Sistem de calcul','Nu e sistem de calcul'],items:[['Bancomatul',0],['Casa de marcat',0],['Tableta',0],['Consola de jocuri',0],['Creionul',1],['Întrerupătorul de la bec',1],['Un scaun',1],['O carte tipărită',1]],
  ajutor:'Un obiect care doar stă sau doar închide curentul nu prelucrează date.',why:'Bancomatul, casa de marcat, tableta și consola primesc date, le prelucrează și dau rezultate. Creionul, întrerupătorul, scaunul și cartea nu prelucrează nimic.',
  inca:[
   {t:'match',q:'Ce date primește fiecare sistem de calcul?',pairs:[['Bancomatul','cardul și codul PIN'],['Casa de marcat','codurile produselor'],['Calculatorul de buzunar','numerele apăsate'],['Telefonul','atingerile pe ecran']],ajutor:'Gândește-te ce îi dai tu fiecăruia.',why:'Fiecare sistem primește alte date, dar toate le prelucrează și dau un rezultat.'},
   {t:'order',q:'Pune în ordine, de la cel mai vechi la cel mai nou.',items:['Mașini mecanice cu roți dințate','Calculatoare electronice cât o cameră','Calculatoare personale pe birou','Telefoane inteligente în buzunar'],ajutor:'Au devenit tot mai mici.',why:'Evoluția merge spre dispozitive tot mai mici, mai rapide și conectate.'}
  ]},
 qs:[
  {t:'choice',q:'Ce face orice sistem de calcul?',o:['Primește date, le prelucrează și dă un rezultat','Are mereu tastatură, mouse și monitor legate la el','Funcționează doar când e conectat la internet','Se folosește doar la birou, pentru scris documente'],ok:0,why:'Nu aspectul contează, ci ce face. Un bancomat nu arată ca un calculator, dar primește datele cardului, le prelucrează și îți dă banii.'},
  {t:'classify',q:'Este sau nu este un sistem de calcul?',cats:['Sistem de calcul','Nu e sistem de calcul'],items:[['Bancomatul',0],['Ceasul inteligent',0],['Telefonul',0],['Întrerupătorul de la bec',1],['Un creion',1],['Casa de marcat din magazin',0]],ajutor:'Metoda de detectiv: date? prelucrare? rezultat?',why:'Întrerupătorul doar închide sau deschide curentul, fără nicio prelucrare. Creionul nu primește date. Celelalte primesc date, le prelucrează și dau un rezultat.'},
  {t:'order',q:'Pune în ordine momentele din evoluția calculatoarelor, de la cel mai vechi.',items:['Mașini mecanice de calcul, cu roți dințate','Primele calculatoare electronice (ENIAC)','Calculatorul personal (PC) ajunge în case','Telefonul inteligent'],why:'Mașinile mecanice încăpeau pe masă, dar făceau doar socoteli simple. ENIAC socotea mult mai repede, însă ocupa o cameră întreagă. De atunci, fiecare pas l-a făcut mai mic: la un birou, apoi în buzunar.'},
  {t:'tf',q:'ENIAC, unul dintre primele calculatoare electronice, încăpea pe un birou.',ok:false,why:'Fals. Piesele lui erau mari, așa că ENIAC ocupa o cameră întreagă. Abia mai târziu piesele s-au micșorat.'},
  {t:'choice',q:'Ce înseamnă partea de „comunicații”?',o:['Dispozitivele sunt conectate între ele','Calculatorul vorbește cu voce','Calculatorul are boxe','Dispozitivele au devenit mai ieftine'],ok:0,why:'Comunicația înseamnă schimb de date între dispozitive. Telefonul trimite un mesaj altui telefon doar pentru că sunt conectate.'}
 ]},

/* ================= 4. Hardware și software (lecția 4) ================= */
{t:'Hardware și software',lectii:[4],continuturi:['Structura generală a unui sistem de calcul','Rolul componentelor hardware ale unui sistem de calcul'],
 obiectiv:'deosebești hardware de software, știi rolul fiecărei componente și le găsești scrise în Managerul de activități.',
 pasi:[
  {t:'Două jumătăți: hardware și software',
   text:`<p>Calculatorul are două jumătăți:</p>
<ul><li><mark>hardware</mark> = părțile pe care le poți <strong>atinge</strong>: tastatura, procesorul, placa de bază;</li>
<li><mark>software</mark> = <strong>programele</strong>: sistemul de operare, un joc, aplicația de desen.</li></ul>
<p>Unul fără celălalt nu face nimic. Hardware-ul fără programe e o cutie. Programele fără hardware n-au unde să ruleze.</p>
<p><strong>Întrebarea-cheie:</strong> pot să-l ating? Da → hardware. Nu → software.</p>`,
   altfel:`<p>Gândește-te la un pian și la o melodie. Pianul îl atingi: el e hardware-ul. Melodia n-o poți atinge, dar fără ea pianul tace: ea e software-ul.</p>`,
   incearca:{t:'classify',q:'Pot să-l ating? Hardware sau software?',cats:['Hardware','Software'],items:[['Mouse-ul',0],['Un joc',1],['Monitorul',0],['Aplicația de desen',1]],ajutor:'Folosește întrebarea-cheie din pas.',why:'Mouse-ul și monitorul se ating: hardware. Jocul și aplicația sunt programe: software.'},
   inca:[
    {t:'tf',q:'Sistemul de operare (Windows) este software.',ok:true,ajutor:'Îl poți atinge?',why:'Adevărat. E un program, deci software.'}
   ]},
  {t:'Procesorul și memoria RAM',
   text:`<p><mark>Procesorul</mark> (CPU) execută instrucțiunile programelor și face calculele. E „creierul” calculatorului.</p>
<p><mark>Memoria RAM</mark> ține datele <strong>cât timp lucrezi</strong>: textul pe care îl scrii, desenul deschis. Când calculatorul se oprește, RAM-ul <strong>se golește</strong>.</p>
<p>De aceea salvăm des: salvarea scrie lucrul pe disc, unde rămâne.</p>`,
   altfel:`<p>RAM-ul e ca masa ta de lucru: pe ea stau caietele cât lucrezi. Seara, masa se strânge. Ce n-ai pus în ghiozdan (pe disc) nu mai găsești dimineața.</p>`,
   incearca:{t:'choice',q:'Ce se întâmplă cu memoria RAM când oprești calculatorul?',o:['Se golește','Păstrează tot','Se mută pe monitor','Se face mai mare'],ok:0,ajutor:'Al doilea paragraf din pas.',why:'RAM-ul ține datele doar cât calculatorul e pornit.'},
   inca:[
    {t:'choice',q:'Care componentă face calculele?',o:['Procesorul (CPU)','Memoria RAM','Monitorul','Tastatura'],ok:0,ajutor:'Cel numit „creierul”.',why:'Procesorul execută instrucțiunile și face calculele.'}
   ]},
  {t:'Discul, placa de bază, sursa, placa video',
   text:`<p>Alte patru componente importante:</p>
<ul><li><strong>hard diskul</strong> sau <strong>SSD-ul</strong> păstrează fișierele și <strong>după oprire</strong>;</li>
<li><strong>placa de bază</strong> leagă toate componentele între ele;</li>
<li><strong>sursa de alimentare</strong> transformă curentul din priză pentru componente;</li>
<li><strong>placa video</strong> construiește imaginea pentru monitor.</li></ul>
${IMG.componente}`,
   incearca:{t:'match',q:'Leagă componenta de rolul ei.',pairs:[['Placa de bază','leagă toate componentele'],['Sursa de alimentare','transformă curentul din priză'],['Placa video','construiește imaginea pentru monitor'],['SSD-ul','păstrează fișierele după oprire']],ajutor:'Recitește lista: fiecare rând începe cu numele componentei.',why:'Fiecare componentă are o treabă principală.'},
   inca:[
    {t:'choice',q:'Unde rămân fișierele salvate după ce oprești calculatorul?',o:['Pe hard disk sau SSD','În memoria RAM','În placa video','În sursa de alimentare'],ok:0,ajutor:'Care componentă păstrează „și după oprire”?',why:'Discul (HDD sau SSD) păstrează fișierele; RAM-ul se golește.'}
   ]},
  {t:'Drumul datelor: intrare → prelucrare → ieșire',
   text:`<p>Datele fac prin calculator mereu același drum: <mark>intrare → prelucrare → ieșire</mark>.</p>
<ul><li><strong>intrare</strong>: datele intră (apeși o tastă);</li>
<li><strong>prelucrare</strong>: procesorul lucrează cu ele, folosind memoria RAM;</li>
<li><strong>ieșire</strong>: rezultatul apare (pe monitor, în boxe).</li></ul>`,
   exemplu:`<p>Apeși tasta <b>A</b> → tastatura trimite semnalul → procesorul îl prelucrează, cu ajutorul RAM-ului → litera <b>A</b> apare pe monitor.</p>`,
   incearca:{t:'order',q:'Faci clic pe butonul Play al unui cântec. Pune pașii în ordine.',items:['Faci clic cu mouse-ul','Mouse-ul trimite semnalul spre calculator','Procesorul pornește cântecul','Cântecul se aude în boxe'],ajutor:'Intrare, prelucrare, ieșire.',why:'Intră prin mouse, e prelucrat de procesor, iese prin boxe.'},
   inca:[
    {t:'classify',q:'Ce parte a drumului este?',cats:['Intrare','Prelucrare','Ieșire'],items:[['Apeși o tastă',0],['Procesorul calculează',1],['Litera apare pe ecran',2],['Vorbești în microfon',0],['Se aude sunetul în boxe',2]],ajutor:'Datele intră, sunt lucrate, apoi ies.',why:'Intrarea vine de la tine, prelucrarea o face procesorul, ieșirea ajunge la tine.'}
   ]},
  {t:'Calculatorul își arată piesele',
   text:`<p>Software-ul „vede” hardware-ul. Un program din Windows îți arată ce piese are calculatorul: <mark>Managerul de activități</mark> (Task Manager).</p>
<p><strong>Cum îl deschizi:</strong></p>
<ol><li>Apeși deodată <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Esc</kbd>.</li>
<li>Alegi <strong>Performanță (Performance)</strong>. Pe Windows 11 e în bara din stânga; pe Windows 10 e o filă sus. Dacă fereastra e mică și arată doar o listă de programe, apeși întâi <strong>Mai multe detalii (More details)</strong>, jos.</li>
<li>Citești pe rând: <strong>CPU</strong> (procesorul), <strong>Memorie (Memory)</strong>, fiecare <strong>Disc (Disk)</strong>.</li></ol>
${IMG.manager}
${IMG.memorie}`,
   exemplu:`<p>În prima captură: <b>Disc 0</b> e un <b>SSD</b>, <b>Disc 2</b> e un <b>HDD</b>. Dacă apeși pe <b>Memorie</b>, sus scrie cât RAM are calculatorul: <b>40,0 GB</b>.</p>`,
   incearca:{t:'choice',q:'Ce taste apeși deodată ca să deschizi Managerul de activități?',o:['Ctrl + Shift + Esc','Ctrl + C','Alt + F4','Shift + A'],ok:0,ajutor:'Pasul 1 din listă.',why:'Ctrl + Shift + Esc deschide direct Managerul de activități.'},
   inca:[
    {t:'choice',q:'În Managerul de activități, unde vezi piesele calculatorului?',o:['La Performanță (Performance)','În meniul Start','La Alimentare (Power)','În fereastra de desen'],ok:0,ajutor:'Pasul 2 din listă.',why:'Performanță arată procesorul, memoria și discurile.'}
   ]}
 ],
 atelier:{t:'choice',titlu:'Citește piesele din Managerul de activități',
  intro:`<p><strong>Sarcina:</strong> ai deschis Managerul de activități cu <b>Ctrl + Shift + Esc</b> și ai ales <b>Performanță</b>. Citește captura de mai jos, rând cu rând, ca un tehnician.</p>${IMG.manager}`,
  q:'Ce fel de disc este <b>Disc 0</b> din captură?',o:['SSD','HDD','USB','Memorie RAM'],ok:0,
  ajutor:'Sub „Disc 0 (G: C:)” scrie tipul, cu litere mici.',why:'Sub Disc 0 scrie SSD (NVMe): e discul rapid pe care stă Windows.',
  inca:[
   {t:'choice',q:'Câtă memorie RAM are calculatorul din captura cu Memorie (vezi pasul 5)?',o:['40,0 GB','4,07 GB','15,5 GB','2 GB'],ok:0,ajutor:'Uită-te la numărul încadrat cu roșu.',why:'Sus în dreapta scrie 40,0 GB DDR4. 15,5 GB e doar cât e folosit acum, iar 4,07 GHz e viteza procesorului.'},
   {t:'choice',q:'Ce fel de disc este <b>Disc 2</b>?',o:['HDD','SSD','USB','GPU'],ok:0,ajutor:'Citește rândul de sub „Disc 2 (A:)”.',why:'Sub Disc 2 scrie HDD: un hard disk clasic.'},
   {t:'order',q:'Pune în ordine pașii ca să afli câtă memorie are calculatorul.',items:['Apeși Ctrl + Shift + Esc','Alegi Performanță','Apeși pe Memorie','Citești numărul de sus, în dreapta'],ajutor:'Lista din pasul 5, plus un clic.',why:'Deschizi, alegi Performanță, apoi Memorie: sus scrie cât RAM are calculatorul.'}
  ]},
 qs:[
  {t:'tf',q:'Sistemul de operare este hardware.',ok:false,why:'Fals. Sistemul de operare nu îl poți atinge: e un program. Programele sunt software.'},
  {t:'match',q:'Leagă fiecare componentă de rolul ei.',pairs:[['Procesorul','execută instrucțiunile și face calculele'],['Memoria RAM','ține datele cât timp lucrezi'],['Hard diskul sau SSD-ul','păstrează fișierele după oprire'],['Placa de bază','leagă toate componentele'],['Placa video','construiește imaginea pentru monitor']],ajutor:'Pașii 2 și 3 au câte o listă cu rolurile.',why:'Fiecare componentă are o singură treabă principală. Împreună formează calculatorul.'},
  {t:'choice',q:'Scrii o compunere și se ia curentul înainte să salvezi. Unde era textul?',o:['În memoria RAM','Pe hard disk','În placa video','În sursa de alimentare'],ok:0,ajutor:'Ce componentă ține datele „cât timp lucrezi”?',why:'Textul nesalvat stă doar în RAM, iar RAM-ul se golește fără curent. Salvarea îl scrie pe disc, unde rămâne. De aceea salvăm des.'},
  {t:'classify',q:'Hardware sau software?',cats:['Hardware','Software'],items:[['Tastatura',0],['Procesorul',0],['Sistemul de operare',1],['Un joc',1],['Placa de bază',0],['Aplicația de desen',1]],why:'Întreabă-te: pot să-l ating? Tastatura, procesorul și placa de bază se ating, deci sunt hardware. Programele nu se ating, deci sunt software.'},
  {t:'order',q:'Apeși tasta A și litera apare pe ecran. Pune pașii în ordine.',items:['Apeși tasta A','Tastatura trimite semnalul spre calculator','Procesorul îl prelucrează, folosind memoria RAM','Litera A apare pe monitor'],why:'Datele fac mereu același drum: intrare → prelucrare → ieșire. Aici intră prin tastatură, sunt prelucrate de procesor și ies pe monitor.'},
  {t:'choice',q:'Vrei să afli câtă memorie RAM are calculatorul tău. Unde te uiți?',o:['Managerul de activități → Performanță → Memorie','Meniul Start → Alimentare → Repornire','Pe eticheta de pe spatele monitorului','În aplicația de desen, la Proprietăți'],ok:0,ajutor:'Programul din pasul 5.',why:'Managerul de activități, la Performanță, arată memoria scrisă de calculator.'}
 ]},

/* ================= 5. Periferice (lecția 5) ================= */
{t:'Intrare, ieșire, intrare-ieșire',lectii:[5],continuturi:['Dispozitive de intrare: exemple, rol, mod de utilizare','Dispozitive de ieșire: exemple, rol, mod de utilizare','Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare'],
 obiectiv:'împarți perifericele în intrare, ieșire și intrare-ieșire după drumul informației și știi cum se folosește fiecare.',
 pasi:[
  {t:'Periferice de intrare',
   text:`<p>Dispozitivele care leagă calculatorul de lumea din jur se numesc <mark>periferice</mark>. Le împărțim după <strong>direcția</strong> în care circulă informația.</p>
<p>Perifericele de <mark>intrare</mark> duc informația <strong>de la tine spre calculator</strong>: tastatura, mouse-ul, microfonul, camera web, scanerul.</p>
${IMG.periferice}`,
   exemplu:`<p>Scanerul: pui o foaie cu un desen pe el, iar desenul <strong>intră</strong> în calculator ca imagine. Informația merge spre calculator → intrare.</p>`,
   incearca:{t:'choice',q:'Care dintre acestea este un periferic de intrare?',o:['Camera web','Monitorul','Boxele','Imprimanta'],ok:0,ajutor:'Care trimite ceva spre calculator?',why:'Camera web trimite imaginea ta în calculator.'},
   inca:[
    {t:'tf',q:'Microfonul este periferic de intrare.',ok:true,ajutor:'Vocea ta merge spre calculator sau vine de la el?',why:'Adevărat. Vocea ta intră în calculator prin microfon.'}
   ]},
  {t:'Periferice de ieșire',
   text:`<p>Perifericele de <mark>ieșire</mark> duc informația <strong>de la calculator spre tine</strong>: monitorul, boxele, căștile, imprimanta, videoproiectorul.</p>
<p>Ele îți <strong>arată</strong>, îți <strong>fac să auzi</strong> sau îți <strong>tipăresc</strong> ce e în calculator.</p>`,
   exemplu:`<p>Imprimanta face drumul invers față de scaner: documentul din calculator <strong>iese</strong> pe hârtie. Informația vine spre tine → ieșire.</p>`,
   incearca:{t:'classify',q:'Intrare sau ieșire?',cats:['Intrare','Ieșire'],items:[['Tastatura',0],['Boxele',1],['Scanerul',0],['Videoproiectorul',1]],ajutor:'Spre calculator = intrare; spre tine = ieșire.',why:'Tastatura și scanerul trimit spre calculator; boxele și videoproiectorul aduc spre tine.'},
   inca:[
    {t:'choice',q:'Căștile (fără microfon) sunt periferic de:',o:['ieșire','intrare','intrare-ieșire'],ok:0,amesteca:false,ajutor:'Sunetul vine din calculator spre urechile tale.',why:'Prin căști doar auzi: informația iese din calculator.'}
   ]},
  {t:'Periferice de intrare-ieșire',
   text:`<p>Unele periferice lucrează <strong>în ambele sensuri</strong>. Se numesc de <mark>intrare-ieșire</mark>:</p>
<ul><li><strong>ecranul tactil</strong>: îți arată imaginea (ieșire) și primește atingerea ta (intrare);</li>
<li><strong>imprimanta multifuncțională</strong>: scanează (intrare) și tipărește (ieșire);</li>
<li><strong>căștile cu microfon</strong>: auzi prin căști (ieșire), vorbești în microfon (intrare).</li></ul>`,
   altfel:`<p>E ca un drum cu două benzi: pe una mașinile vin, pe cealaltă pleacă. Un periferic de intrare-ieșire are „două benzi” pentru informație.</p>`,
   incearca:{t:'choice',q:'De ce ecranul tactil este de intrare-ieșire?',o:['Îți arată imaginea și primește atingerea ta','Pentru că are un cablu lung','Pentru că e mai mare decât un monitor','Pentru că e mai scump'],ok:0,ajutor:'Caută cele două sensuri în pas.',why:'Arată (ieșire) și primește atingeri (intrare).'},
   inca:[
    {t:'tf',q:'Imprimanta multifuncțională este de intrare-ieșire, pentru că scanează și tipărește.',ok:true,ajutor:'Scanarea e intrare, tipărirea e ieșire.',why:'Adevărat. Face amândouă drumurile.'}
   ]},
  {t:'Strategia: cine dă, cine primește?',
   text:`<p>Când nu știi în ce categorie e un periferic, urmezi pașii:</p>
<ol><li>Întreabă-te: <strong>ce face</strong> cu el omul?</li>
<li><strong>Cine dă</strong> informația și <strong>cine o primește</strong>?</li>
<li>Omul dă → <strong>intrare</strong>. Calculatorul dă → <strong>ieșire</strong>. Amândoi → <strong>intrare-ieșire</strong>.</li></ol>
<p><strong>Capcana cablului:</strong> și monitorul are un cablu băgat în calculator. Contează drumul <strong>datelor</strong>, nu al cablului.</p>`,
   exemplu:`<p>Monitorul: ce face omul? Se uită. Cine dă informația? Calculatorul. → <b>ieșire</b>, chiar dacă cablul lui intră în calculator.</p>`,
   incearca:{t:'tf',q:'Monitorul obișnuit e de intrare, pentru că are un cablu băgat în calculator.',ok:false,ajutor:'Capcana cablului.',why:'Fals. Datele merg de la calculator spre tine, deci e de ieșire.'},
   inca:[
    {t:'choice',q:'Un creion digital cu care desenezi pe tabletă e periferic de:',o:['intrare','ieșire','intrare-ieșire'],ok:0,amesteca:false,ajutor:'Cine dă informația: omul sau calculatorul?',why:'Omul desenează, desenul intră în tabletă: intrare.'}
   ]},
  {t:'Cum se folosește fiecare',
   text:`<p>Fiecare periferic are <mark>modul lui de utilizare</mark>:</p>
<ul><li>cu <strong>tastatura</strong> scrii texte și comenzi;</li>
<li>cu <strong>mouse-ul</strong> indici și selectezi pe ecran;</li>
<li>în <strong>microfon</strong> vorbești sau înregistrezi sunet;</li>
<li><strong>imprimanta</strong> scoate pe hârtie ce e în calculator;</li>
<li><strong>ecranul tactil</strong> îl atingi cu degetul.</li></ul>`,
   incearca:{t:'match',q:'Ce folosești pentru fiecare sarcină?',pairs:[['Scrii o compunere','tastatura'],['Alegi un buton de pe ecran','mouse-ul'],['Înregistrezi o poezie','microfonul'],['Tipărești o fișă','imprimanta']],ajutor:'Lista din pas.',why:'Fiecare sarcină are perifericul ei.'},
   inca:[
    {t:'choice',q:'Cu ce indici și selectezi pe ecran?',o:['Mouse-ul','Boxele','Imprimanta','Microfonul'],ok:0,ajutor:'Al doilea rând din listă.',why:'Mouse-ul mișcă săgeata și selectează.'}
   ]}
 ],
 atelier:{t:'classify',titlu:'Inventarul stației tale de lucru',
  intro:`<p><strong>Sarcina:</strong> tehnicianul face lista perifericelor din laborator. Pentru fiecare, folosește strategia: <b>ce face omul? cine dă, cine primește?</b> Apoi sortează.</p>`,
  q:'Sortează perifericele din laborator.',cats:['Intrare','Ieșire','Intrare-ieșire'],items:[['Tastatura',0],['Mouse-ul',0],['Camera web',0],['Monitorul',1],['Boxele',1],['Imprimanta',1],['Ecranul tactil',2],['Căștile cu microfon',2],['Imprimanta multifuncțională',2]],
  ajutor:'Omul dă → intrare; calculatorul dă → ieșire; amândoi → intrare-ieșire.',why:'Asta e lista completă a unei stații de lucru, sortată după drumul informației.',
  inca:[
   {t:'match',q:'Ce periferic alegi pentru fiecare situație?',pairs:[['Faci o poză cu tine pentru o temă','camera web'],['Profesorul arată o lecție pe perete','videoproiectorul'],['Pui în calculator un desen de pe hârtie','scanerul'],['Asculți muzică fără să-i deranjezi pe colegi','căștile']],ajutor:'Gândește-te încotro merge informația în fiecare situație.',why:'Camera și scanerul aduc informația în calculator; videoproiectorul și căștile o duc spre oameni.'}
  ]},
 qs:[
  {t:'choice',q:'Scanerul este un dispozitiv de:',o:['intrare','ieșire','intrare-ieșire'],ok:0,amesteca:false,why:'Scanerul aduce desenul de pe hârtie în calculator. Informația intră, deci e dispozitiv de intrare. Imprimanta face drumul invers.'},
  {t:'classify',q:'Sortează dispozitivele după direcția informației.',cats:['Intrare','Ieșire','Intrare-ieșire'],items:[['Tastatura',0],['Microfonul',0],['Boxele',1],['Videoproiectorul',1],['Ecranul tactil',2],['Imprimanta multifuncțională',2]],ajutor:'Cine dă, cine primește?',why:'Ecranul tactil îți arată imaginea și primește atingerea ta. Multifuncționala scanează și tipărește. Amândouă lucrează în ambele sensuri.'},
  {t:'match',q:'Cum folosești fiecare dispozitiv?',pairs:[['Tastatura','scrii texte și comenzi'],['Mouse-ul','indici și selectezi pe ecran'],['Microfonul','vorbești sau înregistrezi sunet'],['Imprimanta','scoți pe hârtie ce e în calculator'],['Ecranul tactil','atingi cu degetul ce vezi']],why:'Modul de utilizare arată și direcția: prin tastatură, mouse și microfon tu dai informația. Imprimanta ți-o dă ție. Pe ecranul tactil faci amândouă: vezi și atingi.'},
  {t:'tf',q:'Un monitor obișnuit este dispozitiv de intrare-ieșire.',ok:false,why:'Fals. Monitorul obișnuit doar îți arată ceva, deci e de ieșire. Cablul lui intră în calculator, dar datele merg spre tine. Ecranul tactil e altă poveste.'},
  {t:'match',q:'Ce dispozitiv folosești pentru fiecare sarcină?',pairs:[['Trimiți profesorului o temă scrisă pe hârtie','scanerul'],['Asculți o lecție fără să-i deranjezi pe ceilalți','căștile'],['Vorbești într-un apel video','microfonul'],['Arăți prezentarea întregii clase','videoproiectorul']],why:'Tema de pe hârtie trebuie să intre în calculator: scaner. Sunetul doar pentru tine iese prin căști. Vocea ta intră prin microfon. Imaginea mare pentru toți iese prin videoproiector.'},
  {t:'choice',q:'De ce căștile cu microfon sunt dispozitiv de intrare-ieșire?',o:['Prin căști auzi (ieșire), iar prin microfon vorbești (intrare)','Pentru că au un cablu lung și se leagă la calculator','Pentru că se pun pe cap și acoperă ambele urechi','Pentru că sunt mai scumpe decât căștile fără microfon'],ok:0,why:'Categoria se stabilește după direcția informației, nu după formă sau preț. Aici informația merge în ambele sensuri.'}
 ]},

/* ================= 6. Stocare (lecția 6) ================= */
{t:'Stocare: cât încape?',lectii:[6],continuturi:['Dispozitive de stocare a datelor:','- exemple de dispozitive de stocare a datelor','- unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.)','- comparație între dispozitivele de stocare în funcție de capacitate'],
 obiectiv:'numești dispozitivele de stocare, ordonezi unitățile de măsură, compari capacități aducându-le la aceeași unitate și le citești pe calculatorul real.',
 pasi:[
  {t:'Dispozitivele de stocare',
   text:`<p><mark>Dispozitivele de stocare</mark> păstrează datele <strong>și după oprire</strong>. Exemple:</p>
<ul><li><strong>stickul</strong> (memoria USB) și <strong>cardul de memorie</strong>;</li>
<li><strong>hard diskul</strong> (HDD) și <strong>SSD-ul</strong>, din calculator;</li>
<li><strong>CD-ul</strong> și <strong>DVD-ul</strong>;</li>
<li><strong>„norul”</strong> (cloud): spațiu pe internet.</li></ul>
<p>Memoria RAM <strong>nu</strong> e dispozitiv de stocare: se golește la oprire.</p>`,
   altfel:`<p>RAM-ul e masa de lucru, stocarea e dulapul. Ce e în dulap rămâne și peste noapte.</p>`,
   incearca:{t:'classify',q:'Păstrează datele după oprire?',cats:['Păstrează','Se golește'],items:[['Stickul',0],['Memoria RAM',1],['DVD-ul',0],['Hard diskul',0]],ajutor:'Ultima propoziție din pas.',why:'Stickul, DVD-ul și hard diskul sunt dispozitive de stocare. RAM-ul se golește.'},
   inca:[

  {t:'Bitul și byte-ul',

   text:`<p>Unitățile, de la mică la mare:</p>

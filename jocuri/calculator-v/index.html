<script>
const LEVELS=[
{t:'Laboratorul în siguranță',lectii:[2],continuturi:['Normele de securitate și protecție a muncii în laboratorul de informatică'],text:`
<p>Laboratorul de informatică are <mark>norme de securitate</mark>. Nu sunt capriciile profesorului. Ele te apără pe tine, pe colegi și calculatoarele.</p>
<p>Intri în laborator <strong>numai cu profesorul</strong>. Te așezi la locul tău și verifici din priviri: cabluri întregi, nimic vărsat pe masă.</p>
<p><strong>Nu</strong> aduci mâncare sau băuturi lângă tastatură. <strong>Nu</strong> atingi cablurile, prizele sau spatele calculatorului. <strong>Nu</strong> instalezi și nu ștergi nimic fără să întrebi. Fișierele colegilor sunt ale lor.</p>
<p>Oprești calculatorul <strong>corect</strong>, din sistemul de operare (programul principal care conduce calculatorul), nu de la priză.</p>
<p>Miroase a ars? Vezi scântei? <mark>Anunți imediat profesorul.</mark> Nu repari singur.</p>`,
qs:[
 {t:'tf',q:'Pot să beau suc lângă tastatură, dacă am grijă.',ok:false,why:'Fals. Un singur strop poate intra în tastatură sau ajunge la un cablu. Lichidul și curentul electric sunt periculoase împreună, oricâtă grijă ai avea.'},
 {t:'choice',q:'Simți miros de ars la calculatorul tău. Ce faci?',o:['Anunți imediat profesorul','Scoți singur ștecherul din priză','Deschizi carcasa să vezi ce arde','Continui să lucrezi, poate trece'],ok:0,why:'Mirosul de ars poate fi o problemă electrică. Dacă umbli singur la priză sau la carcasă, te poți electrocuta. Profesorul știe cum se oprește curentul în siguranță.'},
 {t:'classify',q:'E corect sau greșit în laborator?',cats:['Corect','Greșit'],items:[['Intru în laborator cu profesorul',0],['Mănânc un covrig la tastatură',1],['Opresc calculatorul din sistemul de operare',0],['Mut cablurile din spatele calculatorului',1],['Instalez un joc fără să întreb',1],['Spun profesorului că mouse-ul nu merge',0]],why:'Regulile au un scop: fără firimituri și lichide în aparate, fără mâini la cabluri și prize, fără programe străine pe calculatoarele școlii. O defecțiune se anunță, nu se ascunde.'},
 {t:'choice',q:'De ce nu oprești calculatorul direct de la priză?',o:['Programele nu apucă să se închidă și lucrul nesalvat se pierde','Pentru că priza e prea departe de scaun și cablul se rupe','Nu contează cum îl oprești, programele se salvează singure','Ca să nu se stingă lumina și celelalte calculatoare din laborator'],ok:0,why:'Oprirea din sistemul de operare închide programele pe rând, în ordine. Scos din priză, calculatorul se oprește brusc, iar ce nu era salvat se pierde.'},
 {t:'tf',q:'Colegul meu lipsește azi, așa că am voie să lucrez în fișierele lui.',ok:false,why:'Fals. Fișierele lui sunt munca lui. Fără acordul lui le poți strica sau șterge din greșeală, iar el nu mai are cum să le recupereze.'}
]},
{t:'Poziția corectă',lectii:[2],continuturi:['Poziția corectă a corpului la stația de lucru'],text:`
<p>Stai mult la calculator? Corpul tău simte. De aceea contează <mark>poziția corectă</mark>.</p>
<ul>
<li><strong>Ochii:</strong> la 50–70 cm de ecran, cam cât brațul întins. Marginea de sus a monitorului e cam la nivelul ochilor.</li>
<li><strong>Spatele:</strong> drept, sprijinit de spătar. Umerii relaxați.</li>
<li><strong>Brațele:</strong> coatele îndoite, cam în unghi drept. Încheieturile drepte.</li>
<li><strong>Picioarele:</strong> tălpile pe podea sau pe un suport.</li>
</ul>
<p>Ochii au nevoie de pauze. <mark>Regula 20–20–20</mark>: la fiecare 20 de minute, privești 20 de secunde ceva aflat departe, la cel puțin 6 metri.</p>
<p>Prea mult timp la jocuri strică somnul și atenția.</p>`,
qs:[
 {t:'choice',q:'La ce distanță stă ecranul față de ochi?',o:['20–30 cm','50–70 cm','2 metri','Nu contează'],ok:1,why:'Prea aproape, ochii obosesc repede și încep să usture. La 50–70 cm, cam cât brațul întins, ochii obosesc mai greu, iar textul se vede încă bine.'},
 {t:'match',q:'Leagă fiecare greșeală de ce pățești din cauza ei.',pairs:[['Ecranul prea aproape','ochi uscați și dureri de cap'],['Spatele încovoiat ore în șir','dureri de spate și de ceafă'],['Încheietura îndoită pe tastatură','amorțeli în palmă și în degete'],['Ore multe de joc seara','somn stricat și atenție scăzută']],why:'Fiecare greșeală apasă mult timp pe aceeași parte a corpului. De aceea durerea apare exact acolo.'},
 {t:'choice',q:'Ce spune regula 20–20–20?',o:['La 20 de minute privești 20 de secunde ceva aflat departe','La 20 de minute faci 20 de genuflexiuni','Lucrezi 20 de minute, apoi închizi ochii 20 de minute','La 20 de minute te apropii cu 20 cm de ecran'],ok:0,why:'Când privești mult aproape, mușchii ochiului stau încordați. Privind departe, ei se relaxează.'},
 {t:'hunt',q:'Andrei își descrie poziția la calculator. Apasă pe cele 3 greșeli.',src:'Stau cu ecranul la [[20 cm|ecranul stă la 50–70 cm de ochi]] ca să văd bine. Țin spatele [[aplecat|spatele stă drept, sprijinit de spătar]] în față. Picioarele le țin [[încrucișate sub scaun|tălpile stau pe podea sau pe un suport]], iar la fiecare 20 de minute privesc departe.',indiciu:'Verifică pe rând ochii, spatele și picioarele.',why:'Poziția corectă se verifică pe părți ale corpului: ochii, spatele, brațele, picioarele. Ultima parte a lui Andrei e bună: el respectă regula 20–20–20.'},
 {t:'tf',q:'Scaunul e prea înalt și tălpile nu ajung la podea. Poți pune un suport sub picioare.',ok:true,why:'Adevărat. Regula cere ca tălpile să stea sprijinite. O cutie sau un suport le sprijină la fel ca podeaua.'}
]},
{t:'Sisteme de calcul în jurul meu',lectii:[3],continuturi:['Sisteme de calcul și de comunicații întâlnite în viața cotidiană','Momente principale în evoluția sistemelor de calcul'],text:`
<p>Un <mark>sistem de calcul</mark> primește <strong>date</strong>, le <strong>prelucrează</strong> după un program și dă un <strong>rezultat</strong>.</p>
<p>Nu are neapărat tastatură și monitor. Telefonul, bancomatul și ceasul inteligent sunt tot sisteme de calcul. Un întrerupător care aprinde becul nu este: el nu prelucrează nimic.</p>
<p>Evoluția, pe scurt: <strong>mașini mecanice</strong> cu roți dințate → primele <strong>calculatoare electronice</strong>, în anii 1940–1950 (ENIAC, cât o cameră) → <strong>calculatorul personal</strong> (PC), în case și școli, în anii 1980–1990 → <strong>telefonul inteligent</strong>, răspândit după 2007.</p>
<p>Au devenit <mark>mai mici, mai rapide și conectate între ele</mark>. Legătura dintre ele e partea de „comunicații”.</p>`,
qs:[
 {t:'choice',q:'Ce face orice sistem de calcul?',o:['Primește date, le prelucrează și dă un rezultat','Are mereu tastatură, mouse și monitor legate la el','Funcționează doar când e conectat la internet','Se folosește doar la birou, pentru scris documente'],ok:0,why:'Nu aspectul contează, ci ce face. Un bancomat nu arată ca un calculator, dar primește datele cardului, le prelucrează și îți dă banii.'},
 {t:'classify',q:'Este sau nu este un sistem de calcul?',cats:['Sistem de calcul','Nu e sistem de calcul'],items:[['Bancomatul',0],['Ceasul inteligent',0],['Telefonul',0],['Întrerupătorul de la bec',1],['Un creion',1],['Casa de marcat din magazin',0]],why:'Întrerupătorul doar închide sau deschide curentul, fără nicio prelucrare. Creionul nu primește date. Celelalte primesc date, le prelucrează și dau un rezultat.'},
 {t:'order',q:'Pune în ordine momentele din evoluția calculatoarelor, de la cel mai vechi.',items:['Mașini mecanice de calcul, cu roți dințate','Primele calculatoare electronice (ENIAC)','Calculatorul personal (PC) ajunge în case','Telefonul inteligent'],why:'Mașinile mecanice încăpeau pe masă, dar făceau doar socoteli simple. ENIAC socotea mult mai repede, însă ocupa o cameră întreagă. De atunci, fiecare pas l-a făcut mai mic: la un birou, apoi în buzunar.'},
 {t:'tf',q:'ENIAC, unul dintre primele calculatoare electronice, încăpea pe un birou.',ok:false,why:'Fals. Piesele lui erau mari, așa că ENIAC ocupa o cameră întreagă. Abia mai târziu piesele s-au micșorat.'},
 {t:'choice',q:'Ce înseamnă partea de „comunicații”?',o:['Dispozitivele sunt conectate între ele','Calculatorul vorbește cu voce','Calculatorul are boxe','Dispozitivele au devenit mai ieftine'],ok:0,why:'Comunicația înseamnă schimb de date între dispozitive. Telefonul trimite un mesaj altui telefon doar pentru că sunt conectate.'}
]},
{t:'Hardware și software',lectii:[4],continuturi:['Structura generală a unui sistem de calcul','Rolul componentelor hardware ale unui sistem de calcul'],text:`
<p>Calculatorul are două jumătăți. <mark>Hardware</mark> = părțile pe care le poți atinge. <mark>Software</mark> = programele. Unul fără celălalt nu face nimic.</p>
<p>Componentele principale:</p>
<ul>
<li><strong>procesorul</strong> (CPU) execută instrucțiunile și face calculele;</li>
<li><strong>memoria RAM</strong> ține datele cât timp lucrezi și se golește la oprire;</li>
<li><strong>hard diskul</strong> sau <strong>SSD-ul</strong> păstrează fișierele și după oprire;</li>
<li><strong>placa de bază</strong> leagă toate componentele;</li>
<li><strong>sursa de alimentare</strong> transformă curentul din priză pentru componente;</li>
<li><strong>placa video</strong> construiește imaginea pentru monitor.</li>
</ul>
<p>Drumul datelor: <mark>intrare → prelucrare → ieșire</mark>.</p>`,
qs:[
 {t:'tf',q:'Sistemul de operare este hardware.',ok:false,why:'Fals. Sistemul de operare nu îl poți atinge: e un program. Programele sunt software.'},
 {t:'match',q:'Leagă fiecare componentă de rolul ei.',pairs:[['Procesorul','execută instrucțiunile și face calculele'],['Memoria RAM','ține datele cât timp lucrezi'],['Hard diskul sau SSD-ul','păstrează fișierele după oprire'],['Placa de bază','leagă toate componentele'],['Placa video','construiește imaginea pentru monitor']],why:'Fiecare componentă are o singură treabă principală. Împreună formează calculatorul.'},
 {t:'choice',q:'Scrii o compunere și se ia curentul înainte să salvezi. Unde era textul?',o:['În memoria RAM','Pe hard disk','În placa video','În sursa de alimentare'],ok:0,why:'Textul nesalvat stă doar în RAM, iar RAM-ul se golește fără curent. Salvarea îl scrie pe disc, unde rămâne. De aceea salvăm des.'},
 {t:'classify',q:'Hardware sau software?',cats:['Hardware','Software'],items:[['Tastatura',0],['Procesorul',0],['Sistemul de operare',1],['Un joc',1],['Placa de bază',0],['Aplicația de desen',1]],why:'Întreabă-te: pot să-l ating? Tastatura, procesorul și placa de bază se ating, deci sunt hardware. Programele nu se ating, deci sunt software.'},
 {t:'order',q:'Apeși tasta A și litera apare pe ecran. Pune pașii în ordine.',items:['Apeși tasta A','Tastatura trimite semnalul spre calculator','Procesorul îl prelucrează, folosind memoria RAM','Litera A apare pe monitor'],why:'Datele fac mereu același drum: intrare → prelucrare → ieșire. Aici intră prin tastatură, sunt prelucrate de procesor și ies pe monitor.'}
]},
{t:'Intrare, ieșire, intrare-ieșire',lectii:[5],continuturi:['Dispozitive de intrare: exemple, rol, mod de utilizare','Dispozitive de ieșire: exemple, rol, mod de utilizare','Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare'],text:`
<p>Dispozitivele care leagă calculatorul de lumea din jur se numesc <mark>periferice</mark>. Le împărțim după <strong>direcția în care circulă informația</strong>.</p>
<ul>
<li><mark>Intrare</mark>: de la tine spre calculator. Tastatura, mouse-ul, microfonul, camera web, scanerul.</li>
<li><mark>Ieșire</mark>: de la calculator spre tine. Monitorul, boxele, căștile, imprimanta, videoproiectorul.</li>
<li><mark>Intrare-ieșire</mark>: în ambele sensuri. Ecranul tactil, imprimanta multifuncțională, căștile cu microfon.</li>
</ul>
<p>Întreabă-te: <strong>cine dă informația și cine o primește?</strong></p>
<p>Atenție: și monitorul are un cablu băgat în calculator. Contează drumul <strong>datelor</strong>, nu al cablului.</p>
<p>Fiecare are <mark>modul lui de utilizare</mark>. Cu tastatura scrii texte și comenzi. Cu mouse-ul indici și selectezi pe ecran. În microfon vorbești sau înregistrezi sunet. Imprimanta tipărește pe hârtie. Ecranul tactil îl atingi cu degetul.</p>`,
qs:[
 {t:'choice',q:'Scanerul este un dispozitiv de:',o:['intrare','ieșire','intrare-ieșire'],ok:0,amesteca:false,why:'Scanerul aduce desenul de pe hârtie în calculator. Informația intră, deci e dispozitiv de intrare. Imprimanta face drumul invers.'},
 {t:'classify',q:'Sortează dispozitivele după direcția informației.',cats:['Intrare','Ieșire','Intrare-ieșire'],items:[['Tastatura',0],['Microfonul',0],['Boxele',1],['Videoproiectorul',1],['Ecranul tactil',2],['Imprimanta multifuncțională',2]],why:'Ecranul tactil îți arată imaginea și primește atingerea ta. Multifuncționala scanează și tipărește. Amândouă lucrează în ambele sensuri.'},
 {t:'match',q:'Cum folosești fiecare dispozitiv?',pairs:[['Tastatura','scrii texte și comenzi'],['Mouse-ul','indici și selectezi pe ecran'],['Microfonul','vorbești sau înregistrezi sunet'],['Imprimanta','scoți pe hârtie ce e în calculator'],['Ecranul tactil','atingi cu degetul ce vezi']],why:'Modul de utilizare arată și direcția: prin tastatură, mouse și microfon tu dai informația. Imprimanta ți-o dă ție. Pe ecranul tactil faci amândouă: vezi și atingi.'},
 {t:'tf',q:'Un monitor obișnuit este dispozitiv de intrare-ieșire.',ok:false,why:'Fals. Monitorul obișnuit doar îți arată ceva, deci e de ieșire. Cablul lui intră în calculator, dar datele merg spre tine. Ecranul tactil e altă poveste.'},
 {t:'match',q:'Ce dispozitiv folosești pentru fiecare sarcină?',pairs:[['Trimiți profesorului o temă scrisă pe hârtie','scanerul'],['Asculți o lecție fără să-i deranjezi pe ceilalți','căștile'],['Vorbești într-un apel video','microfonul'],['Arăți prezentarea întregii clase','videoproiectorul']],why:'Tema de pe hârtie trebuie să intre în calculator: scaner. Sunetul doar pentru tine iese prin căști. Vocea ta intră prin microfon. Imaginea mare pentru toți iese prin videoproiector.'},
 {t:'choice',q:'De ce căștile cu microfon sunt dispozitiv de intrare-ieșire?',o:['Prin căști auzi (ieșire), iar prin microfon vorbești (intrare)','Pentru că au un cablu lung și se leagă la calculator','Pentru că se pun pe cap și acoperă ambele urechi','Pentru că sunt mai scumpe decât căștile fără microfon'],ok:0,why:'Categoria se stabilește după direcția informației, nu după formă sau preț. Aici informația merge în ambele sensuri.'}
]},
{t:'Stocare: cât încape?',lectii:[6],continuturi:['Dispozitive de stocare a datelor:','- exemple de dispozitive de stocare a datelor','- unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.)','- comparație între dispozitivele de stocare în funcție de capacitate'],text:`
<p><mark>Dispozitivele de stocare</mark> păstrează datele și după oprire: stickul (memoria USB), cardul de memorie, hard diskul (HDD), SSD-ul, CD-ul, DVD-ul și „norul” (cloud).</p>
<p>Cea mai mică unitate e <mark>bitul</mark>: 0 sau 1. Un <mark>byte</mark> (octet) are <strong>8 biți</strong>.</p>
<p>Ordinea crescătoare: <strong>bit → byte → KB → MB → GB → TB → PB</strong> (petabyte). De la byte în sus, la clasă socotim fiecare treaptă de <strong>1024 de ori</strong> mai mare: 1 KB = 1024 B, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB, 1 PB = 1024 TB.</p>
<p>Le comparăm după <mark>capacitate</mark> (cât încape), în aceeași unitate: CD 700&nbsp;MB, DVD 4,7&nbsp;GB, stick 16–256&nbsp;GB, hard disk 500&nbsp;GB–4&nbsp;TB. SSD-ul e mai rapid, HDD-ul mai ieftin, cloud-ul cere internet.</p>`,
qs:[
 {t:'choice',q:'Câți biți are un byte?',o:['2','8','10','1024'],ok:1,amesteca:false,why:'Un byte e un grup de 8 biți. 1024 apare abia la trecerea de la o unitate la următoarea, de exemplu de la B la KB.'},
 {t:'order',q:'Ordonează unitățile de la cea mai mică la cea mai mare.',items:['bit','byte','KB','MB','GB','TB','PB'],why:'Bitul e cea mai mică unitate. Byte-ul are 8 biți. De la KB în sus, fiecare treaptă e de 1024 de ori mai mare, până la petabyte: 1 PB = 1024 TB.'},
 {t:'tf',q:'1 GB este mai mare decât 1 TB.',ok:false,why:'Fals. În ordinea unităților, TB vine după GB: 1 TB = 1024 GB.'},
 {t:'choice',q:'O fotografie are 4 MB. Cam câte fotografii încap pe un stick de 16 GB?',o:['4','64','400','4096'],ok:3,amesteca:false,why:'Întâi aduci totul la aceeași unitate: 16 GB = 16 × 1024 MB = 16384 MB. Apoi împarți: 16384 : 4 = 4096. Pe un stick adevărat încap ceva mai puține, de aceea spunem „cam”.'},
 {t:'classify',q:'Ce se întâmplă cu datele când oprești calculatorul?',cats:['Rămân păstrate','Se pierd'],items:[['SSD-ul',0],['Memoria RAM',1],['Stickul',0],['Hard diskul',0],['Cardul de memorie',0]],why:'Dispozitivele de stocare sunt făcute să păstreze datele. RAM-ul e doar spațiul de lucru și se golește fără curent.'},

<script>
const LEVELS=[
{t:'Ce face un editor grafic',lectii:[18],continuturi:['Rolul unui editor grafic','Elemente de interfață specifice'],text:`
<p>Un <mark>editor grafic</mark> este o aplicație cu care creezi desene și modifici imagini. Exemple: Paint, care vine cu Windows, sau GIMP, care e gratuit.</p>
<p>O imagine de pe calculator e făcută din <mark>pixeli</mark>: pătrățele mici, fiecare de o singură culoare.</p>
<p>Fereastra editorului are câteva părți:</p>
<ul>
<li><strong>bara de titlu</strong>, sus, cu numele fișierului;</li>
<li><strong>bara cu instrumente</strong>: creion, pensule, forme, text;</li>
<li><strong>paleta de culori</strong>;</li>
<li><strong>zona de desen</strong>, în mijloc;</li>
<li><strong>bara de stare</strong>, jos: mărimea imaginii în pixeli și cât de mult e mărită vederea.</li>
</ul>
<p>Nu știi ce face un buton? Ține mouse-ul pe el și citește eticheta.</p>`,
qs:[
 {t:'choice',q:'La ce folosește un editor grafic?',o:['Creezi desene și modifici imagini','Scrii și formatezi un referat lung','Navighezi pe paginile web','Faci calcule în tabele'],ok:0,why:'Editorul grafic lucrează cu imagini. Pentru referat folosești un editor de text, pentru pagini web un browser, iar pentru tabele cu calcule o foaie de calcul.'},
 {t:'match',q:'Leagă fiecare parte a ferestrei de ce găsești în ea.',pairs:[['Bara de titlu','numele fișierului'],['Bara cu instrumente','creionul, pensulele, formele'],['Paleta de culori','culorile din care alegi'],['Bara de stare','mărimea imaginii în pixeli']],why:'Fiecare parte are rolul ei: sus afli ce fișier ai deschis, în bara cu instrumente alegi ce faci, în paletă alegi culoarea, iar jos citești măsurile.'},
 {t:'tf',q:'O imagine de pe calculator este formată din pixeli, adică pătrățele mici, fiecare de o singură culoare.',ok:true,why:'Adevărat. Dacă mărești foarte mult vederea, pixelii se văd ca niște pătrățele.'},
 {t:'choice',q:'Nu știi ce face un buton din bara cu instrumente. Ce faci întâi?',o:['Țin mouse-ul pe el și citesc eticheta','Apăs pe toate butoanele la rând','Închid aplicația și o deschid din nou','Șterg desenul ca să încerc'],ok:0,why:'Eticheta care apare spune numele butonului, fără să schimbi nimic în desen. Așa înveți interfața în siguranță.'}
]},
{t:'Creez, deschid, salvez',lectii:[18],continuturi:['Crearea, deschiderea şi salvarea fişierelor grafice'],text:`
<p>Din meniul <strong>Fișier</strong> (<em>File</em>) faci trei lucruri de bază:</p>
<ul>
<li><mark>Nou</mark> (<kbd>Ctrl</kbd>+<kbd>N</kbd>): o imagine albă, nouă;</li>
<li><mark>Deschidere</mark> (<kbd>Ctrl</kbd>+<kbd>O</kbd>): o imagine care există deja;</li>
<li><mark>Salvare</mark> (<kbd>Ctrl</kbd>+<kbd>S</kbd>). Prima dată alegi locul, numele și formatul. <strong>Salvare ca</strong> (<em>Save as</em>) face o copie cu alt nume sau alt format.</li>
</ul>
<p>Formatele cele mai folosite:</p>
<ul>
<li><strong>PNG</strong>: bun pentru desene, nu pierde nimic din calitate;</li>
<li><strong>JPEG</strong> (<code>.jpg</code>): bun pentru fotografii, fișier mic, dar pierde puțin din calitate;</li>
<li><strong>BMP</strong>: de obicei nu comprimă, deci fișierul e foarte mare.</li>
</ul>`,
qs:[
 {t:'tf',q:'Când salvezi pentru prima dată, alegi locul, numele și formatul fișierului.',ok:true,why:'Adevărat. La prima salvare aplicația nu știe încă unde și cum să păstreze desenul, așa că te întreabă. Apoi Ctrl+S salvează peste același fișier.'},
 {t:'match',q:'Leagă fiecare comandă de ce face.',pairs:[['Nou','începi o imagine albă'],['Deschidere','aduci o imagine care există deja'],['Salvare','păstrezi modificările în același fișier'],['Salvare ca','faci o copie cu alt nume sau alt format']],why:'Nou și Deschidere aduc o imagine în editor. Salvare și Salvare ca o păstrează pe disc: una în același fișier, cealaltă într-unul nou.'},
 {t:'choice',q:'Ai desenat un logo pentru clasă, cu forme și litere. În ce format îl salvezi?',o:['PNG','JPEG','BMP'],ok:0,amesteca:false,why:'PNG păstrează marginile clare ale formelor și literelor, iar fișierul nu iese mare. JPEG ar strica puțin marginile, iar BMP ar face un fișier foarte mare.'},
 {t:'classify',q:'Ce format se potrivește?',cats:['PNG','JPEG'],items:[['Un desen cu contururi și text',0],['O fotografie de la excursie',1],['O schemă pentru ora de științe',0],['Poze de vacanță de trimis pe e-mail, cât mai mici',1]],why:'Fotografiile au mii de nuanțe și rămân frumoase și în JPEG, care face fișiere mici. Desenele cu margini clare și textul arată cel mai bine în PNG.'},
 {t:'tf',q:'Dacă apeși Ctrl+N, desenul la care lucrai se salvează singur.',ok:false,why:'Fals. Ctrl+N începe o imagine nouă și nu salvează nimic. Dacă ai modificări nesalvate, aplicația te întreabă ce faci cu ele: citește mesajul înainte să apeși.'}
]},
{t:'Instrumente de desenare',lectii:[19],continuturi:['Instrumente de desenare'],text:`
<p>Fiecare <mark>instrument</mark> face altceva:</p>
<ul>
<li><strong>creionul</strong>: linii subțiri, pentru detalii;</li>
<li><strong>pensulele</strong>: linii mai groase, în stiluri diferite;</li>
<li><strong>formele</strong>: linie, dreptunghi, elipsă, triunghi, stea…;</li>
<li><strong>radiera</strong>: șterge o parte din desen;</li>
<li><strong>umplerea cu culoare</strong> (găleata): colorează o zonă închisă.</li>
</ul>
<p>Ții apăsat <kbd>Shift</kbd> când desenezi o formă, iar dreptunghiul iese <mark>pătrat</mark>, iar elipsa iese <mark>cerc</mark>. Grosimea liniei o alegi din <strong>dimensiune</strong>.</p>
<p>Găleata umple până la margini. Dacă în contur e o gaură, culoarea „curge” afară. Atunci apeși <kbd>Ctrl</kbd>+<kbd>Z</kbd>, adică anulezi.</p>`,
qs:[
 {t:'choice',q:'Vrei un cerc perfect, nu un ou turtit. Ce faci?',o:['Aleg elipsa și țin apăsat Shift','Aleg elipsa și țin apăsat Ctrl','Desenez cercul cu creionul','Aleg dreptunghiul și țin apăsat Shift'],ok:0,why:'Shift păstrează lățimea egală cu înălțimea. La elipsă iese un cerc, iar la dreptunghi iese un pătrat.'},
 {t:'match',q:'Leagă fiecare instrument de ce face.',pairs:[['Creionul','linii subțiri, pentru detalii'],['Pensula','linii mai groase, în stiluri diferite'],['Radiera','șterge o parte din desen'],['Găleata','colorează o zonă închisă']],why:'Alegi instrumentul după gest: detaliu, linie groasă, ștergere sau colorarea unei zone întregi.'},
 {t:'choice',q:'Ai colorat cu găleata interiorul unei case, dar s-a colorat tot fundalul. De ce?',o:['Conturul casei avea o gaură','Culoarea aleasă era prea deschisă','Găleata colorează mereu tot desenul','Imaginea nu era salvată'],ok:0,why:'Găleata umple zona până la marginile ei. Printr-o gaură în contur, culoarea trece afară. Anulezi cu Ctrl+Z, închizi conturul și umpli din nou.'},
 {t:'tf',q:'Ctrl+Z anulează ultima acțiune, iar dacă îl apeși de mai multe ori, anulează și acțiunile de dinainte.',ok:true,why:'Adevărat. Fiecare apăsare te duce cu un pas înapoi. De aceea nu-ți fie frică să încerci.'},
 {t:'classify',q:'Ce instrument folosești?',cats:['Forme','Creion','Găleată'],items:[['Un pătrat pentru fereastra casei',0],['O stea pe cer',0],['Mustățile unei pisici',1],['Semnătura ta mică în colț',1],['Cerul albastru din spatele casei',2],['Acoperișul colorat în roșu, după ce l-ai desenat',2]],why:'Formele gata făcute ies drepte și egale. Creionul e pentru detalii mici. Găleata colorează repede o zonă închisă.'}
]},
{t:'Selectez, copiez, mut, șterg',lectii:[19],continuturi:['Comenzi pentru selectare, copiere, mutare, ştergere'],text:`
<p>Ca să lucrezi cu o parte din desen, întâi o <mark>selectezi</mark>:</p>
<ul>
<li><strong>selecția dreptunghiulară</strong>: tragi un dreptunghi peste zonă;</li>
<li><strong>selecția cu formă liberă</strong>: desenezi conturul zonei cu mouse-ul;</li>
<li><kbd>Ctrl</kbd>+<kbd>A</kbd>: selectezi tot desenul.</li>
</ul>
<p>Cu zona selectată:</p>
<ul>
<li><mark>mutare</mark>: tragi selecția cu mouse-ul în alt loc;</li>
<li><mark>copiere</mark>: <kbd>Ctrl</kbd>+<kbd>C</kbd>, apoi lipire cu <kbd>Ctrl</kbd>+<kbd>V</kbd>. Originalul rămâne pe loc;</li>
<li><mark>decupare</mark> (tăiere): <kbd>Ctrl</kbd>+<kbd>X</kbd>. Zona dispare de pe loc, dar o poți lipi în altă parte;</li>
<li><mark>ștergere</mark>: <kbd>Delete</kbd>. Zona rămâne goală, de obicei albă.</li>
</ul>`,
qs:[
 {t:'choice',q:'Ai desenat un copac și vrei încă doi la fel. Ce faci după ce îl selectezi?',o:['Ctrl+C, apoi Ctrl+V de două ori','Ctrl+X, apoi Ctrl+V o dată','Delete, apoi îl desenez din nou','Ctrl+A, apoi Delete'],ok:0,why:'Copierea păstrează originalul, iar fiecare lipire adaugă un copac nou. Ctrl+X ar lua copacul de pe loc, iar Delete l-ar șterge.'},
 {t:'tf',q:'După Ctrl+C, zona selectată dispare din desen.',ok:false,why:'Fals. Ctrl+C doar copiază în memorie și originalul rămâne. Zona dispare la Ctrl+X (decupare) sau la Delete (ștergere).'},
 {t:'match',q:'Leagă fiecare comandă de ce se întâmplă cu zona selectată.',pairs:[['Ctrl+C','rămâne pe loc și o copie merge în memorie'],['Ctrl+X','dispare de pe loc și merge în memorie'],['Ctrl+V','apare în desen ce era în memorie'],['Delete','dispare și nu merge în memorie']],why:'Diferența stă în două întrebări: rămâne originalul pe loc? Ajunge zona în memorie, ca s-o poți lipi?'},
 {t:'order',q:'Mută soarele din colțul din stânga în colțul din dreapta. Pune pașii în ordine.',items:['Alegi instrumentul de selecție','Tragi un dreptunghi peste soare','Tragi zona selectată spre dreapta','Dai clic în afara selecției'],why:'Întâi alegi unealta, apoi prinzi soarele, îl duci la locul nou și abia la final îl lași jos, dând clic în afara lui.'},
 {t:'choice',q:'Vrei să selectezi doar o pisică cu forma neregulată, fără iarba din jur. Ce folosești?',o:['Selecția cu formă liberă','Selecția dreptunghiulară','Ctrl+A','Găleata'],ok:0,why:'Cu forma liberă urmărești conturul pisicii. Dreptunghiul ar prinde și iarbă, iar Ctrl+A ar prinde tot desenul.'}
]},
{t:'Mărime, tăiere, rotire, panoramare',lectii:[20],continuturi:['Redimensionarea, trunchierea, rotaţia unei imagini','Panoramare imagine'],text:`
<ul>
<li><mark>Redimensionarea</mark> (<em>Resize</em>) schimbă mărimea reală a imaginii, în pixeli sau în procente. Bifezi păstrarea proporțiilor, ca desenul să nu se turtească.</li>
<li><mark>Trunchierea</mark> (<em>Crop</em>): selectezi partea care rămâne, iar restul se taie. În Paint în română butonul poate avea alt nume, așa că ține mouse-ul pe butoane și citește eticheta.</li>
<li><mark>Rotirea</mark> (<em>Rotate</em>) întoarce imaginea cu 90° la dreapta sau la stânga ori cu 180°.</li>
<li><mark>Panoramarea</mark> (<em>Zoom</em>) mărește sau micșorează doar <strong>vederea</strong>. Imaginea rămâne la fel. Folosești <kbd>Ctrl</kbd> + rotița mouse-ului sau glisorul din bara de stare.</li>
</ul>
<p>Atenție: o imagine mică, mărită mult prin redimensionare, devine <mark>neclară</mark>. Pixelii se văd ca niște pătrățele.</p>`,
qs:[
 {t:'tf',q:'Panoramarea la 200% face ca imaginea salvată să aibă de două ori mai mulți pixeli.',ok:false,why:'Fals. Panoramarea schimbă doar cât de aproape te uiți. Mărimea reală o schimbă redimensionarea.'},
 {t:'choice',q:'O fotografie are 800 × 600 pixeli. O rotești cu 90° la dreapta. Ce mărime are acum?',o:['600 × 800 pixeli','800 × 600 pixeli','400 × 300 pixeli','1600 × 1200 pixeli'],ok:0,why:'La o rotire cu 90°, lățimea devine înălțime și invers. Pixelii sunt aceiași, doar așezați altfel.'},
 {t:'choice',q:'Redimensionezi o imagine de 800 × 600 pixeli la 50%, cu proporțiile păstrate. Ce mărime are?',o:['400 × 300 pixeli','800 × 300 pixeli','400 × 600 pixeli','1600 × 1200 pixeli'],ok:0,why:'50% înseamnă jumătate. Cu proporțiile păstrate, se înjumătățesc ambele: 800 : 2 = 400 și 600 : 2 = 300.'},
 {t:'classify',q:'Ce operație folosești?',cats:['Redimensionare','Trunchiere','Rotire','Panoramare'],items:[['Poza e prea mare pentru e-mail, vreau mai puțini pixeli',0],['Vreau să scot marginea cu masa din poză',1],['Poza e culcată pe o parte',2],['Vreau să văd de aproape ochii pisicii',3]],why:'Mai puțini pixeli = redimensionare. Tai o margine = trunchiere. Îndrepți poza = rotire. Doar te uiți mai de aproape = panoramare.'},
 {t:'choice',q:'Ai mărit prin redimensionare o iconiță mică la mărimea unui afiș. Ce observi?',o:['Imaginea devine neclară, cu pătrățele','Imaginea devine mai clară','Imaginea nu se schimbă deloc','Fișierul devine mai mic'],ok:0,why:'Pixelii care lipseau nu pot fi inventați corect. Editorul întinde pixelii existenți, așa că se văd pătrățele sau contururi încețoșate.'}
]},
{t:'Culori și umplere',lectii:[21],continuturi:['Utilizarea culorilor în prelucrarea imaginilor; crearea culorilor personalizate','Stiluri de umplere'],text:`
<p>În Paint lucrezi cu două culori alese: <mark>Culoare 1</mark> (<em>Color 1</em>) pentru linii și contururi și <mark>Culoare 2</mark> (<em>Color 2</em>) pentru interiorul formelor. Numele pot diferi puțin de la o versiune la alta, iar în Paint-ul nou apar doar ca două cercuri colorate.</p>
<p>Nu găsești nuanța în paletă? Deschizi <strong>Editare culori</strong> (<em>Edit colors</em>) și îți faci o <mark>culoare personalizată</mark>. Poți scrie cât roșu, verde și albastru are (<strong>RGB</strong>), fiecare de la 0 la 255.</p>
<p><strong>Selectorul de culori</strong> (pipeta) ia o culoare chiar din imagine.</p>
<p>La o formă alegi <mark>stilul</mark> conturului și al umplerii: fără umplere, culoare solidă sau, în unele versiuni, o textură (de exemplu acuarelă).</p>
<p>Textul închis pe fundal deschis se citește ușor. Asta înseamnă <mark>contrast</mark>.</p>`,
qs:[
 {t:'choice',q:'Ce culoare iese din RGB 255, 0, 0?',o:['Roșu','Verde','Albastru','Alb'],ok:0,amesteca:false,why:'Primul număr e roșul, la maximum (255). Verdele și albastrul sunt 0, deci iese un roșu curat.'},
 {t:'match',q:'Leagă valorile RGB de culoare.',pairs:[['0, 0, 0','negru'],['255, 255, 255','alb'],['0, 0, 255','albastru'],['255, 255, 0','galben']],why:'0 înseamnă „deloc”, iar 255 înseamnă „cât se poate de mult”. Nicio lumină dă negru, toată lumina dă alb. Roșul amestecat cu verdele, ca lumini, dă galben.'},
 {t:'choice',q:'Vrei exact culoarea cerului dintr-o fotografie. Ce instrument folosești?',o:['Selectorul de culori (pipeta)','Găleata','Radiera','Selecția dreptunghiulară'],ok:0,why:'Pipeta citește culoarea unui pixel din imagine și o pune în paletă. Apoi o poți folosi la desen.'},
 {t:'tf',q:'O formă desenată cu stilul „fără umplere” are doar contur, iar interiorul rămâne cum era.',ok:true,why:'Adevărat. Umplerea colorează interiorul. Fără ea, se vede doar marginea formei.'},
 {t:'choice',q:'Pe afiș vrei un titlu ușor de citit. Care combinație are cel mai bun contrast?',o:['Albastru închis pe galben deschis','Galben pe alb','Gri deschis pe alb','Roșu închis pe maro'],ok:0,why:'Contrastul mare apare între o culoare închisă și una deschisă. Galbenul pe alb sau griul pe alb aproape dispar, iar roșul închis pe maro se amestecă.'}
]},
{t:'Felicitarea clasei',final:true,lectii:[22],continuturi:['Inserarea şi formatarea textului','Crearea, deschiderea şi salvarea fişierelor grafice'],text:`
<p><strong>Misiunea finală.</strong> Faci o <mark>felicitare</mark> pentru ziua școlii.</p>
<p>Cu instrumentul <strong>Text</strong> (litera A) tragi o casetă și scrii. Înainte să ieși din casetă, alegi <mark>fontul</mark>, <mark>dimensiunea</mark>, culoarea și stilul: aldin, cursiv, subliniat. Fundalul casetei poate fi transparent sau opac.</p>
<p>Atenție: în Paint, după ce dai clic în afara casetei, textul devine pixeli. Nu-l mai poți corecta ca text, ci doar șterge și scrie din nou.</p>
<p>La final salvezi felicitarea, cu un nume clar, într-un format bun pentru desene.</p>`,
qs:[
 {t:'tf',q:'În Paint, după ce ai dat clic în afara casetei de text, poți corecta oricând o literă ca într-un editor de texte.',ok:false,why:'Fals. Textul a devenit pixeli, ca restul desenului. De aceea verifici textul și aspectul lui cât ești încă în casetă.'},
 {t:'hunt',q:'Planul Anei pentru felicitare are 3 greșeli. Apasă pe ele.',src:'Scriu titlul „La mulți ani, școala mea!” cu un font mare. Aleg [[galben pe fundal alb|culorile apropiate se citesc greu; e nevoie de contrast]] ca să fie vesel. Corectez o literă greșită [[după ce ies din casetă|după ce ieși din casetă, textul e pixeli; corectezi cât ești în casetă]]. La final salvez felicitarea ca [[imagine1.bmp|un nume clar și formatul PNG: fișier mic și margini clare]].',indiciu:'Gândește-te la contrast, la casetă și la salvare.',why:'Titlul mare e o idee bună. Restul planului pierde contrastul, textul și spațiul pe disc.'},
 {t:'order',q:'Pune în ordine pașii pentru titlul felicitării.',items:['Alegi instrumentul Text','Tragi caseta pe felicitare','Scrii titlul','Dai clic în afara casetei'],why:'Fără casetă nu ai unde scrie, iar clicul în afară fixează textul. Fontul și dimensiunea le schimbi cât caseta e încă activă.'},

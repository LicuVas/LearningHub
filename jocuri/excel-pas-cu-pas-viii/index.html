<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel pas cu pas</title>
<meta name="description" content="Excel pas cu pas: de la prima celulă la grafice, pe pași mici, cu exemple, exerciții și o foaie care se poartă ca Excel-ul adevărat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#EDF0ED; --paper:#FFFFFF; --paper2:#EEF2EE; --line:#D3D9D3;
  --ink:#18221B; --ink2:#59655C; --accent:#1B7443; --accentInk:#FFFFFF; --sel:#D9EEE1;
  --mark:#FFE36B; --markInk:#18221B; --ok:#177245; --okbg:#E1F3E7; --bad:#C63A33; --badbg:#FAE6E4;
  --fd:"Archivo","Segoe UI",system-ui,sans-serif; --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1411; --paper:#18201B; --paper2:#222C25; --line:#2F3B33;
  --ink:#E4EBE6; --ink2:#9AA89F; --accent:#5CCB8E; --accentInk:#0F1411; --sel:#1E4430;
  --mark:#F2D24E; --markInk:#18221B; --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
}}
:root[data-theme="dark"]{
  --desk:#0F1411; --paper:#18201B; --paper2:#222C25; --line:#2F3B33;
  --ink:#E4EBE6; --ink2:#9AA89F; --accent:#5CCB8E; --accentInk:#0F1411; --sel:#1E4430;
  --mark:#F2D24E; --markInk:#18221B; --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
}
/* tema jocului: capul de coloane al foii de calcul și un titlu lat, ca pe o foaie Excel */
.banda{display:grid;grid-template-columns:repeat(8,1fr);font-family:var(--fm);font-size:.7rem;color:var(--ink2)}
.banda span{text-align:center;padding:3px 0;border-left:1px solid var(--line)}
.banda span:first-child{border-left:0}
h1,h2{font-stretch:115%}
h1 .eq{color:var(--accent);font-weight:500;font-stretch:80%}
/* mini-foaie desenată în exemple („Uite cum”): cap de coloane, numere de rând, celula aleasă */
.gw{max-width:100%;overflow-x:auto;margin:.5em 0}
.fxb{display:flex;max-width:26em;border:1px solid var(--line);border-bottom:0;background:var(--paper);font:500 .85rem var(--fm)}
.fxb span{padding:3px 8px;border-right:1px solid var(--line);color:var(--ink2)}
.fxb span:last-child{border-right:0;color:var(--ink)}
table.gr{border-collapse:collapse;font:500 .85rem var(--fm)}
table.gr th{background:var(--paper2);color:var(--ink2);font-weight:500;padding:2px 8px;border:1px solid var(--line)}
table.gr td{border:1px solid var(--line);padding:2px 8px;min-width:2.6em;background:var(--paper);color:var(--ink);white-space:nowrap}
table.gr td.n{text-align:right}
table.gr td.s{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel)}
table.gr th.s{background:var(--sel);color:var(--ink)}
</style>
</head>

<body>
<script src="../_motor/motor.js"></script>
<script src="../_motor/tip-foaie.js"></script>
<script src="../_motor/tip-excel.js"></script>
<script>
/* Excel pas cu pas (25.09.2026; rescris PE PAȘI 26.09.2026, după cererea profesorului: „de la novice la expertiză”).
   Fiecare nivel: obiectiv → pași (o idee, exemplu, „explică-mi altfel”, exercițiu mic, variante la cerere)
   → atelier în foaia care se poartă ca Excel (tip-excel.js) → verificare DOAR pe ce s-a predat.
   Capturile sunt din Excel-ul real (copiate din excel-viii/img, cu proveniența în img/SURSE.json). */
const P={
  interfata:'Elemente de interfaţă ale unei aplicaţii de calcul tabelar',
  structura:'Structura unui registru de calcul (foaie de calcul, coloană, rând, celulă, adresă de celulă)',
  editare:'Operaţii de editare (selectare, copiere, mutare, ştergere)',
  tipuri:'Tipuri de date: numeric, text, dată calendaristică',
  formule:'Formule de calcul care utilizează operatori aritmetici (+, -,*, /)',
  functii:'Funcții specifice aplicaţiei de calcul tabelar pentru sumă, maxim, minim, medie aritmetică şi decizie',
  randuri:'Operații de formatare a rândurilor/coloanelor',
  celule:'Operații de formatare a celulelor (aliniere conținut, borduri, culori de umplere, stiluri predefinite)',
  sortare:'Sortarea crescătoare/descrescătoare a datelor dintr-un tabel după unul sau mai multe criterii',
  grafice:'Grafice: tipuri de grafice',
  serii:'Serii de date'
};
const CLASA={A1:'Elev',B1:'Clasa',C1:'Media',A2:'Dan',B2:'VIII A',C2:7.5,A3:'Ana',B3:'VIII B',C3:9.25,A4:'Elena',B4:'VIII A',C4:8.5,A5:'Bogdan',B5:'VIII B',C5:6.75,A6:'Carmen',B6:'VIII A',C6:9.25};
const TEMP={A1:'Ziua',B1:'Grade',A2:'Luni',B2:14,A3:'Marți',B3:17,A4:'Miercuri',B4:12,A5:'Joi',B5:19,A6:'Vineri',B6:21,A7:'Sâmbătă',B7:18};
const BANI={A1:'Cheltuială',B1:'Lei',A2:'Mâncare',B2:40,A3:'Transport',B3:15,A4:'Rechizite',B4:25,A5:'Distracție',B5:20};
const NOTE={A1:'Elev',B1:'Nota 1',C1:'Nota 2',A2:'Ana',B2:8,C2:9,A3:'Bogdan',B3:5,C3:6,A4:'Carmen',B4:10,C4:9,A5:'Dan',B5:7,C5:4,A6:'Elena',B6:6,C6:8};
const MAG={A1:'Produs',B1:'Preț',C1:'Bucăți',D1:'Total',A2:'Caiet',B2:4,C2:3,A3:'Pix',B3:2,C3:5,A4:'Riglă',B4:6,C4:2,A5:'Gumă',B5:1,C5:4};
const TVA={A1:'Produs',B1:'Preț',C1:'TVA',E1:'Cota TVA',F1:0.19,A2:'Caiet',B2:4,A3:'Pix',B3:2,A4:'Riglă',B4:6,A5:'Gumă',B5:1};

/* capturi din Excel-ul real (README §6b): calea mereu ../<slug>/img/ */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../excel-pas-cu-pas-viii/img/${f}" target="_blank"><img src="../excel-pas-cu-pas-viii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* mini-foaie pentru „Uite cum”: rows = [[A,B,C…],…] de la rândul 1; sel = adresele încadrate; fx = [caseta de nume, bara fx] */
const grila=(rows,o={})=>{const L='ABCDEFGH',sel=o.sel||[],nc=Math.max(...rows.map(r=>r.length));
  const colSel=new Set(sel.map(a=>a[0])),rowSel=new Set(sel.map(a=>a.slice(1)));
  let h=o.fx?`<div class="fxb"><span>${o.fx[0]}</span><span>fx</span><span>${o.fx[1]}</span></div>`:'';
  h+='<table class="gr"><thead><tr><th></th>'+[...Array(nc)].map((_,i)=>`<th class="${colSel.has(L[i])?'s':''}">${L[i]}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach((r,ri)=>{h+=`<tr><th class="${rowSel.has(String(ri+1))?'s':''}">${ri+1}</th>`;
    for(let ci=0;ci<nc;ci++){const v=r[ci]==null?'':String(r[ci]),a=L[ci]+(ri+1);
      const num=/^[-\d][\d,.]*%?$|^#/.test(v)&&!/\.\d/.test(v)||(o.dreapta||[]).includes(a);
      h+=`<td class="${num?'n':''}${sel.includes(a)?' s':''}">${v}</td>`}
    h+='</tr>'});
  return `<div class="gw">${h}</tbody></table></div>`};

const LEVELS=[
/* ================= 1. Foaia, celula și adresa (lecția 2) ================= */
{t:'Foaia, celula și adresa',lectii:[2],continuturi:[P.interfata,P.structura],
 obiectiv:'recunoști părțile ferestrei Excel, găsești orice celulă după adresa ei și selectezi o zonă trăgând cu mouse-ul.',
 pasi:[
  {t:'Ce vezi când deschizi Excel',
   text:`<p><strong>Excel</strong> e o aplicație de <mark>calcul tabelar</mark>: ține date într-un tabel și face singură calculele.</p>
<ul><li>Fișierul se numește <strong>registru</strong> (workbook). În el sunt una sau mai multe <strong>foi de calcul</strong>, cu filele lor jos: <em>Sheet1</em>, <em>Sheet2</em>…</li>
<li>Sus e <strong>panglica</strong>, cu filele <strong>Pornire (Home)</strong>, <strong>Inserare (Insert)</strong>, <strong>Date (Data)</strong>.</li>
<li>Sub panglică: <mark>caseta de nume</mark> (Name Box), în stânga, și <mark>bara de formule</mark>, cu semnul <em>fx</em>.</li></ul>
${fig('interfata.webp',1000,460,'Fereastra Excel: filele panglicii sus, caseta de nume cu B3, bara de formule fx și celula B3 aleasă','Sus panglica; dedesubt caseta de nume (B3) și bara <em>fx</em>.')}
${fig('file-foi.webp',480,42,'Filele foilor de calcul din partea de jos a ferestrei Excel și butonul plus pentru o foaie nouă','Jos, filele foilor. Cu <b>+</b> adaugi o foaie nouă.')}`,
   altfel:`<p>Gândește-te la un caiet de matematică cu pătrățele. Tot caietul e <b>registrul</b>, fiecare pagină e o <b>foaie</b>, iar fiecare pătrățel e o <b>celulă</b> în care scrii ceva.</p>`,
   incearca:{t:'match',q:'Potrivește fiecare parte a ferestrei cu rolul ei.',pairs:[['Registrul','Tot fișierul Excel'],['Foaia de calcul','O pagină din registru, cu fila ei jos'],['Caseta de nume','Arată adresa celulei alese'],['Bara de formule','Arată ce e scris de fapt în celulă']],ajutor:'Recitește lista din pas, rând cu rând.',why:'Registrul are foi; în foaie alegi celule; caseta de nume îți spune unde ești, bara fx ce e în celulă.'},
   inca:[
    {t:'choice',q:'Unde vezi foile unui registru (Sheet1, Sheet2…)?',o:['Jos, pe filele de sub tabel','Sus, pe panglică','În caseta de nume','În bara de formule'],ok:0,ajutor:'Uită-te la a doua imagine din pas.',why:'Filele foilor stau jos. Cu butonul + adaugi o foaie nouă.'},
    {t:'tf',q:'Un registru Excel poate avea mai multe foi de calcul.',ok:true,ajutor:'Registrul e caietul, foaia e pagina.',why:'Adevărat. Fiecare foaie are fila ei jos, iar registrul le ține pe toate într-un singur fișier.'}
   ]},
  {t:'Coloane, rânduri și adresa celulei',
   text:`<p>Foaia e o grilă. <mark>Coloanele</mark> au <strong>litere</strong> (A, B, C…), scrise sus. <mark>Rândurile</mark> au <strong>numere</strong> (1, 2, 3…), scrise în stânga.</p>
<p>Un pătrățel de la întâlnirea unei coloane cu un rând e o <strong>celulă</strong>. Numele ei e <mark>adresa</mark>: <strong>întâi litera coloanei, apoi numărul rândului</strong>. Celula din coloana C și rândul 4 are adresa <code>C4</code>. Niciodată invers: „4C” nu e o adresă.</p>`,
   exemplu:`<p>Celula încadrată e în coloana <b>C</b> și pe rândul <b>4</b>. Caseta de nume scrie <code>C4</code>, iar literele C și 4 din capete se colorează.</p>${grila([['Elev','Nota 1','Nota 2'],['Ana','8','9'],['Bogdan','5','6'],['Carmen','10','9']],{sel:['C4'],fx:['C4','9']})}`,
   altfel:`<p>E ca la jocul „Vapoare”: spui „B5” și toată lumea știe exact pătrățelul. Litera arată coloana (pe orizontală), cifra arată rândul (pe verticală).</p>`,
   incearca:{t:'excel',q:'Alege celula <b>C4</b>: apasă pe ea. Uită-te apoi în caseta de nume din stânga.',cols:5,rows:6,cells:NOTE,verifica:{sel:'C4'},ajutor:'Coloana C e a treia literă de sus; rândul 4 e al patrulea număr din stânga.',why:'Coloana C, rândul 4. Caseta de nume arată mereu unde ești: C4.'},
   inca:[
    {t:'excel',q:'Alege celula de la întâlnirea <b>coloanei B</b> cu <b>rândul 6</b>.',cols:5,rows:6,cells:NOTE,verifica:{sel:'B6'},ajutor:'Litera coloanei vine prima, apoi numărul rândului.',why:'B6: litera coloanei, apoi numărul rândului.'},
    {t:'choice',q:'Care este scrierea corectă a unei adrese de celulă?',o:['D2','2D','D-2','Rândul 2 D'],ok:0,ajutor:'Ce vine întâi: litera sau cifra?',why:'Adresa e litera coloanei urmată de numărul rândului: D2.'}
   ]},
  {t:'Cum găsești o celulă (strategie)',
   text:`<p>Când ți se cere „alege celula D5”, lucrezi în <strong>patru pași</strong>, fără grabă:</p>
<ol><li>Citești <strong>litera</strong> (D) și o cauți în capul de coloane, sus.</li>
<li>Citești <strong>numărul</strong> (5) și îl cauți în stânga.</li>
<li>Cobori pe coloana D până ajungi în dreptul rândului 5 și <strong>apeși</strong> acolo.</li>
<li><strong>Verifici</strong> în caseta de nume: trebuie să scrie <code>D5</code>. Dacă scrie altceva, mai încerci o dată.</li></ol>
<p>Pasul 4 e cel care te scapă de greșeli: caseta de nume nu minte.</p>`,
   altfel:`<p>E ca atunci când cauți un loc la cinema: întâi găsești rândul, apoi numărul scaunului, și la final te uiți pe bilet să verifici.</p>`,
   incearca:{t:'excel',q:'Folosește cei patru pași și alege celula <b>D5</b>. La final verifică în caseta de nume.',cols:5,rows:6,cells:NOTE,verifica:{sel:'D5'},ajutor:'Coloana D e goală în tabelul ăsta; asta nu contează, celula există.',why:'D5: coloana D, rândul 5. Caseta de nume confirmă.'},
   inca:[
    {t:'choice',q:'Caseta de nume arată <b>B3</b>. Unde ești?',o:['În coloana B, pe rândul 3','În coloana 3, pe rândul B','Pe foaia a treia','În bara de formule'],ok:0,ajutor:'Litera e coloana, numărul e rândul.',why:'B3 înseamnă coloana B, rândul 3.'}
   ]},
  {t:'Zona: mai multe celule deodată',
   text:`<p>Ca să alegi mai multe celule odată, <mark>apeși pe prima și tragi</mark> până la ultima, fără să ridici degetul de pe mouse.</p>
<p>O zonă se scrie cu <strong>două puncte</strong> între primul și ultimul colț: <code>B2:D2</code> înseamnă „de la B2 până la D2”.</p>
<p>Cât tragi, caseta de nume arată mărimea zonei, de exemplu <code>1R x 3C</code> (1 rând, 3 coloane). După ce ridici degetul, arată doar <strong>celula activă</strong>: cea din care ai pornit, rămasă albă în zonă.</p>`,
   exemplu:`<p>Zona <code>B2:C4</code> are 3 rânduri și 2 coloane. Jos, pe <mark>bara de stare</mark>, Excel îți arată singur <strong>Sumă</strong> (Sum), <strong>Medie</strong> (Average) și <strong>Număr</strong> (Count) pentru celulele alese.</p>${grila([['Elev','Nota 1','Nota 2'],['Ana','8','9'],['Bogdan','5','6'],['Carmen','10','9']],{sel:['B2','C2','B3','C3','B4','C4'],fx:['B2','8']})}`,
   incearca:{t:'excel',q:'Selectează cele două note ale Anei: apasă pe <b>B2</b> și trage până la <b>C2</b>. Privește bara de jos: ce sumă arată?',cols:5,rows:6,cells:NOTE,verifica:{zona:'B2:C2'},ajutor:'Apeși pe B2, ții apăsat și muți mouse-ul pe C2, apoi ridici degetul.',why:'Zona B2:C2. Bara de stare arată singură suma notelor (17) și media lor.'},
   inca:[
    {t:'excel',q:'Selectează toate notele lui <b>Bogdan</b> și ale Carmenei: de la <b>B3</b> până la <b>C4</b>.',cols:5,rows:6,cells:NOTE,verifica:{zona:'B3:C4'},ajutor:'Pornești din colțul de sus-stânga (B3) și tragi până în colțul de jos-dreapta (C4).',why:'B3:C4 are 2 rânduri și 2 coloane: 4 note.'},
    {t:'excel',q:'Încearcă: selectează de la <b>B2</b> până la <b>C4</b>. Ce arată caseta de nume <b>după</b> ce ridici degetul?',cols:5,rows:6,cells:NOTE,o:['B2','B2:C4','C4','3R x 2C'],ok:0,ajutor:'Recitește ultima propoziție a pasului: celula activă.',why:'După selectare, caseta de nume arată celula activă, B2 (cea din care ai pornit). Cât tragi, arată 3R x 2C.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Găsește și selectează',
  intro:`<p>Foaia de mai jos se poartă ca Excel-ul adevărat. <strong>Sarcina:</strong> selectează <strong>toate notele 1</strong> ale clasei, de la <b>B2</b> până la <b>B6</b>. Apoi citește jos, pe bara de stare, suma lor.</p>`,
  q:'Selectează zona <b>B2:B6</b> (toate notele 1).',cols:5,rows:7,cells:NOTE,verifica:{zona:'B2:B6'},ajutor:'Apeși pe B2 și tragi în jos până la B6.',why:'Zona B2:B6 are 5 celule. Bara de stare arată suma lor: 36.',
  inca:[
   {t:'excel',q:'Încă una: selectează tot rândul cu datele lui <b>Dan</b>, de la <b>A5</b> până la <b>C5</b>.',cols:5,rows:7,cells:NOTE,verifica:{zona:'A5:C5'},ajutor:'Dan e pe rândul 5. Pornești din A5 și tragi la dreapta.',why:'A5:C5: numele și cele două note ale lui Dan.'},
   {t:'excel',q:'Și una fără tragere: alege celula cu nota 2 a Elenei.',cols:5,rows:7,cells:NOTE,verifica:{sel:'C6'},ajutor:'Elena e pe rândul 6; Nota 2 e în coloana C.',why:'C6: coloana Nota 2, rândul Elenei.'}
  ]},
 qs:[
  {t:'choice',q:'Care e adresa celulei din coloana <b>C</b> și rândul <b>4</b>?',o:['C4','4C','C:4','Rândul 4'],ok:0,why:'Întâi litera coloanei, apoi numărul rândului: C4.'},
  {t:'excel',q:'Alege celula de la întâlnirea <b>coloanei A</b> cu <b>rândul 3</b>.',cols:5,rows:6,cells:NOTE,verifica:{sel:'A3'},ajutor:'Folosește strategia: litera sus, numărul în stânga, apoi verifici în caseta de nume.',why:'A3: coloana A, rândul 3.'},
  {t:'choice',q:'Ce înseamnă zona <code>B2:D2</code>?',o:['Toate celulele de la B2 până la D2','Doar celulele B2 și D2','Celula B2 împărțită la D2','Coloanele de la B la D, întregi'],ok:0,ajutor:'Cum se citesc cele două puncte?',why:'Două puncte înseamnă „până la”: B2, C2 și D2.'},
  {t:'match',q:'Potrivește fiecare parte a ferestrei cu ce îți arată.',pairs:[['Caseta de nume','Adresa celulei alese'],['Bara de formule','Ce e scris în celulă'],['Bara de stare','Suma și media celulelor alese'],['Filele de jos','Foile registrului']],why:'Fiecare parte a ferestrei îți spune altceva: unde ești, ce e scris, cât fac numerele alese, pe ce foaie lucrezi.'},
  {t:'excel',q:'Selectează de la <b>A2</b> până la <b>C3</b>. Ce arată caseta de nume <b>după</b> ce ridici degetul?',cols:5,rows:6,cells:NOTE,o:['A2','A2:C3','C3','2R x 3C'],ok:0,ajutor:'Celula activă e cea din care ai pornit.',why:'După selectare, caseta de nume arată celula activă: A2.'}
 ]},

/* ================= 2. Scriu și modific date (lecțiile 4, 5) ================= */
{t:'Scriu și modific date',lectii:[4,5],continuturi:[P.editare,P.tipuri],
 obiectiv:'scrii text și numere în celule, te muți cu Enter și Tab, corectezi și ștergi, și știi după aliniere dacă Excel a înțeles un număr.',
 pasi:[
  {t:'Scrii direct în celulă',
   text:`<p>Alegi celula și <mark>începi direct să scrii</mark>. Nu trebuie să apeși întâi în bara de formule.</p>
<p>Ce scrii apare în celulă și, în același timp, în bara <em>fx</em>. Jos, bara de stare arată <strong>Introducere</strong> (Enter): Excel așteaptă să termini.</p>
<ul><li><kbd>Enter</kbd> pune ce ai scris și te duce <strong>în jos</strong>;</li>
<li><kbd>Tab</kbd> pune ce ai scris și te duce <strong>la dreapta</strong>;</li>
<li><kbd>Esc</kbd> renunță la ce ai scris;</li>
<li>săgețile te mută în orice direcție.</li></ul>`,
   exemplu:`<p>Scrii <b>Elev</b> în A1, apeși <kbd>Tab</kbd>, scrii <b>Nota</b>, apeși <kbd>Enter</kbd>. Rezultatul:</p>${grila([['Elev','Nota'],['','']],{fx:['A2','']})}`,
   altfel:`<p>E ca într-un formular de pe telefon: scrii în căsuță și treci la următoarea. Tab te duce la căsuța din dreapta, Enter la cea de dedesubt.</p>`,
   incearca:{t:'excel',q:'Scrie capul de tabel: în <b>A1</b> scrie <code>Elev</code>, apasă <kbd>Tab</kbd>, apoi în <b>B1</b> scrie <code>Nota</code> și <kbd>Enter</kbd>. Începe direct să tastezi pe celulă.',cols:4,rows:4,cells:{},verifica:{valori:{A1:'Elev',B1:'Nota'},gest:['tastat-in-celula']},ajutor:'Apasă o dată pe A1 și scrie, fără să mai apeși în bara fx.',why:'Alegi celula și tastezi. Tab trece la dreapta, Enter în jos.'},
   inca:[
    {t:'tf',q:'<kbd>Enter</kbd> te duce în celula din dreapta.',ok:false,ajutor:'Recitește lista: ce face Enter și ce face Tab?',why:'Fals. Enter te duce în jos, Tab la dreapta.'},
    {t:'excel',q:'Scrie numele a doi elevi unul sub altul: <code>Ana</code> în <b>A2</b> și <code>Dan</code> în <b>A3</b>. Folosește <kbd>Enter</kbd> ca să cobori.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota'},verifica:{valori:{A2:'Ana',A3:'Dan'}},ajutor:'Alege A2, scrie Ana, Enter: ajungi singur în A3.',why:'Enter pune textul și te duce în celula de dedesubt.'}
   ]},
  {t:'Numere și text: Excel le recunoaște',
   text:`<p>Excel își dă seama singur ce ai scris. Tipurile de date sunt:</p>
<ul><li><strong>numeric</strong> (număr): stă <mark>la dreapta</mark> în celulă și se poate folosi în calcule;</li>
<li><strong>text</strong>: stă <mark>la stânga</mark>;</li>
<li><strong>dată calendaristică</strong>: stă tot la dreapta, pentru că pentru Excel o dată e tot un număr.</li></ul>
<p>Deci alinierea îți spune dintr-o privire dacă Excel a înțeles un număr. Un număr care stă la stânga e, de fapt, text și nu intră corect în calcule.</p>
${fig('tipuri-date.webp',967,428,'Excel: număr aliniat la dreapta, text la stânga, dată la dreapta, iar 250 văzut ca text stă la stânga cu un triunghi verde în colț','Numărul și data stau la dreapta, textul la stânga. „250” din B5 a rămas text: stă la stânga și are un triunghi verde.')}`,
   incearca:{t:'classify',q:'Unde se așază în celulă, după ce apeși Enter?',cats:['La dreapta (număr)','La stânga (text)'],items:[['9',0],['Ana',1],['VIII A',1],['125',0]],ajutor:'Numerele stau la dreapta, textul la stânga.',why:'9 și 125 sunt numere, deci stau la dreapta. Ana și VIII A sunt text.'},
   inca:[
    {t:'choice',q:'Ai scris un număr, dar el stă la stânga celulei. Ce înseamnă?',o:['Excel l-a luat ca text','E un număr foarte mare','E o dată calendaristică','Celula e aldin'],ok:0,ajutor:'Ce tip de date stă la stânga?',why:'La stânga stă textul. Un număr văzut ca text nu intră corect în calcule.'}
   ]},
  {t:'Zecimalele: 7,5 cu virgulă',
   text:`<p>Pe calculatoarele cu <strong>setări românești</strong>, zecimalele se scriu cu <mark>virgulă</mark>: <code>7,5</code>. Excel îl înțelege ca număr și îl pune la dreapta.</p>
<p>Dacă scrii cu punct, <code>7.5</code>, pe un calculator cu setări românești Excel <strong>nu mai vede nota 7,5</strong>. Pe setări românești punctul e semnul din <strong>date calendaristice</strong> (07.05.2026), așa că Excel transformă <code>7.5</code> într-o dată: în celulă apare <code>07.mai</code>. Nota ta s-a pierdut.</p>
<p>(Pe calculatoarele cu setări în engleză e invers: zecimalele se scriu cu punct. O să vezi la nivelul cu bula de ajutor cum afli ce setări are calculatorul.)</p>`,
   exemplu:`<p>Setări românești: în B2 s-a scris <b>7,5</b>, în B3 s-a scris <b>7.5</b>. Uită-te ce a păstrat Excel:</p>${grila([['Elev','Nota'],['Ana','7,5'],['Bogdan','07.mai']],{dreapta:['B3']})}<p>B2 e nota 7,5. În B3 Excel a pus data de 7 mai: nu mai e o notă.</p>`,
   altfel:`<p>E ca atunci când scrii un preț pe bon: în România scriem „7,50 lei”, cu virgulă. Excel-ul cu setări românești citește la fel ca noi.</p>`,
   incearca:{t:'excel',q:'Setările sunt <b>RO</b>. Scrie nota <b>9</b> în B2 și nota <b>7,5</b> în B3 (cu virgulă!).',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A2:'Ana',A3:'Bogdan'},mod:'ro',verifica:{valori:{B2:9,B3:7.5}},ajutor:'Pe setări românești zecimala se scrie cu virgulă: 7,5.',why:'Pe setări românești, 7,5 cu virgulă e număr și stă la dreapta.'},
   inca:[
    {t:'choice',q:'Pe un calculator cu setări românești ai scris <code>7.5</code>, iar în celulă a apărut <code>07.mai</code>. Ce s-a întâmplat?',o:['Excel l-a luat drept dată calendaristică (7 mai)','Excel l-a rotunjit la 8','Excel l-a lăsat nota 7,5, doar că o arată altfel','Celula e prea îngustă'],ok:0,ajutor:'Pe setări românești, unde se folosește punctul?',why:'Pe setări românești punctul e semnul din date (07.05.2026). Zecimalele se scriu cu virgulă: 7,5.'}
   ]},
  {t:'Corectezi, ștergi, anulezi',
   text:`<p>Ai greșit? Ai trei căi:</p>
<ol><li><strong>Scrii peste</strong>: alegi celula și tastezi. Ce era acolo dispare, rămâne ce ai scris acum.</li>
<li><strong>Modifici doar o parte</strong>: apeși <kbd>F2</kbd> (sau dublu-clic pe celulă). Bara de stare arată <strong>Editare</strong> (Edit), iar săgețile te mută prin text, literă cu literă.</li>
<li><strong>Golești celula</strong>: o alegi și apeși <kbd>Delete</kbd>. Celelalte celule rămân pe loc.</li></ol>
<p>Și dacă ai stricat ceva: <kbd>Ctrl</kbd>+<kbd>Z</kbd> <mark>anulează</mark> ultima operație (săgeata ↶ de sus face același lucru).</p>`,
   altfel:`<p>Scrisul peste e ca radiera trecută pe tot cuvântul. F2 e ca un creion cu care corectezi o singură literă. Delete e buretele care curăță căsuța.</p>`,
   incearca:{t:'excel',q:'Nota lui Bogdan e greșită: în <b>B3</b> scrie <b>8</b> peste ce e acolo.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A2:'Ana',B2:9,A3:'Bogdan',B3:3},verifica:{valori:{B3:8}},ajutor:'Alege B3 și tastează 8, apoi Enter.',why:'Alegi celula și scrii peste: vechea valoare dispare.'},
   inca:[
    {t:'excel',q:'În <b>C3</b> a rămas un cuvânt scris din greșeală. Golește celula: alege-o și apasă <kbd>Delete</kbd>.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A3:'Bogdan',B3:8,C3:'greșit'},verifica:{gol:['C3']},ajutor:'Un clic pe C3, apoi tasta Delete.',why:'Delete golește celulele alese, fără să le mute pe celelalte.'},
    {t:'choice',q:'Ce tastă te lasă să modifici doar o literă din celulă, fără să rescrii tot?',o:['F2','Delete','Tab','Esc'],ok:0,ajutor:'Căutați tasta care duce bara de stare în „Editare”.',why:'F2 (sau dublu-clic) intră în Editare: săgețile se mută prin text.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Primul tău tabel',
  intro:`<p><strong>Sarcina:</strong> scrie un tabel mic, cu setări <b>RO</b>. În <b>A1</b> <code>Elev</code>, în <b>B1</b> <code>Nota</code>; dedesubt, <code>Ana</code> cu nota <b>9</b> și <code>Bogdan</code> cu nota <b>7,5</b>. Folosește <kbd>Tab</kbd> ca să treci la dreapta și <kbd>Enter</kbd> ca să cobori.</p>`,
  q:'Scrie tabelul: Elev / Nota, Ana 9, Bogdan 7,5.',cols:4,rows:4,cells:{},mod:'ro',verifica:{valori:{A1:'Elev',B1:'Nota',A2:'Ana',B2:9,A3:'Bogdan',B3:7.5}},ajutor:'Rândul 1: Elev, Tab, Nota. Rândul 2: Ana, Tab, 9. Rândul 3: Bogdan, Tab, 7,5.',why:'Numele stau la stânga (text), notele la dreapta (numere). 7,5 cu virgulă e număr pe setări românești.',
  inca:[
   {t:'excel',q:'Încă una: tabelul are două greșeli. În <b>B2</b> scrie <b>10</b> peste 1, iar <b>C2</b> golește-o.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A2:'Carmen',B2:1,C2:'xx'},verifica:{valori:{B2:10},gol:['C2']},ajutor:'Scrii peste B2; pe C2 apeși Delete.',why:'Scrisul peste înlocuiește, Delete golește.'}
  ]},
 qs:[
  {t:'choice',q:'Calculatorul are setări românești. Cum scrii nota șapte și jumătate, ca Excel s-o păstreze ca număr?',o:['7,5','7.5','7 și 5','7:5'],ok:0,ajutor:'Pe setări românești zecimala se scrie cu virgulă.',why:'Pe setări românești zecimala e virgula: 7,5. Cu punct, 7.5 devine data 07.mai.'},
  {t:'tf',q:'<kbd>Tab</kbd> pune ce ai scris și te duce în celula din dreapta.',ok:true,why:'Adevărat. Tab la dreapta, Enter în jos.'},
  {t:'excel',q:'Scrie <code>Nota</code> în <b>B1</b> și nota <b>8</b> în <b>B2</b>.',cols:4,rows:3,cells:{A1:'Elev',A2:'Ana'},verifica:{valori:{B1:'Nota',B2:8}},why:'Alegi celula și tastezi; Enter te coboară singur în B2.'},
  {t:'classify',q:'Număr sau text?',cats:['Număr (la dreapta)','Text (la stânga)'],items:[['10',0],['Bogdan',1],['7,5 pe setări RO',0],['VIII A',1]],ajutor:'Numele și clasa sunt cuvinte; notele sunt numere.',why:'Numerele (10, 7,5 cu virgulă) stau la dreapta; numele și clasa sunt text, la stânga.'},
  {t:'choice',q:'Vrei să golești celula C3, fără să muți nimic. Ce faci?',o:['O alegi și apeși Delete','Apeși Enter','Apeși Tab','Scrii un spațiu în C3'],ok:0,why:'Delete golește celula aleasă. Un spațiu ar lăsa în celulă un caracter invizibil.'}
 ]},

/* ================= 3. Formatarea (lecția 6) ================= */
{t:'Tabelul arată bine: formatarea',lectii:[6],continuturi:[P.celule,P.randuri],
 obiectiv:'faci un tabel să arate ca unul adevărat: cap de tabel aldin și colorat, borduri, aliniere, procente, un titlu îmbinat și coloane destul de late.',
 pasi:[
  {t:'Întâi selectezi, apoi apeși butonul',
   text:`<p>Formatarea schimbă <strong>cum arată</strong> celulele, nu ce e în ele. Regula are trei pași:</p>
<ol><li><mark>selectezi</mark> celulele (o celulă sau o zonă trasă cu mouse-ul);</li>
<li>deschizi fila <strong>Pornire (Home)</strong> a panglicii;</li>
<li>apeși butonul. Se schimbă doar celulele selectate.</li></ol>
${fig('pornire-formatare.webp',860,165,'Fila Home (Pornire) din Excel cu butoanele Borders (Borduri), Fill Color (Culoare de umplere) și grupul Alignment (Aliniere)','Fila <b>Pornire (Home)</b>: fontul, bordurile, culoarea de umplere și alinierea.')}`,
   altfel:`<p>E ca la vopsit: întâi alegi ce vopsești (lipești banda pe margini), abia apoi dai cu pensula. Dacă nu alegi nimic, vopseaua ajunge unde nu trebuie.</p>`,
   incearca:{t:'excel',q:'Fă capul de tabel <b>A1:C1</b> <b>aldin</b>: selectează-l trăgând, apoi fila Pornire → butonul <b>B</b>.',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C1':{b:true}}},ajutor:'Apasă pe A1 și trage până la C1, apoi B.',why:'Selectezi, apoi apeși butonul: doar capul de tabel devine aldin.'},
   inca:[
    {t:'tf',q:'Dacă faci o notă aldin, valoarea ei se schimbă.',ok:false,ajutor:'Formatarea schimbă cum arată sau ce e în celulă?',why:'Fals. Formatarea schimbă doar aspectul; valoarea rămâne aceeași.'}
   ]},
  {t:'Aldin, culoare, borduri, aliniere',
   text:`<p>Butoanele cele mai folosite din fila Pornire (Home):</p>
<ul><li><strong>B</strong> = <mark>aldin</mark> (Bold), și din tastatură <kbd>Ctrl</kbd>+<kbd>B</kbd>;</li>
<li><strong>Culoare de umplere</strong> (Fill Color): colorează fundalul celulei;</li>
<li><strong>Borduri</strong> (Borders) → <strong>Toate bordurile</strong> (All Borders): desenează liniile tabelului, care altfel nu apar la tipărire;</li>
<li><strong>Aliniere</strong> la stânga, la centru (Center), la dreapta: așază conținutul în celulă;</li>
<li><strong>Stiluri de celulă</strong> (Cell Styles): culori și fonturi gata potrivite, puse dintr-un singur clic.</li></ul>
${fig('tabel-formatat.webp',520,245,'Tabel în Excel cu capul de tabel colorat și aldin, borduri pe tot tabelul și notele centrate','Rezultatul: cap de tabel aldin și colorat, borduri, note centrate.')}
${fig('stiluri-celula.webp',245,125,'Butonul Cell Styles din grupul Styles al filei Home în Excel','<b>Cell Styles</b>: stiluri predefinite, tot în fila Pornire (Home).')}`,
   incearca:{t:'excel',q:'Pune borduri pe tot tabelul <b>A1:C6</b>: selectează-l și alege ▦ Borduri → Toate bordurile (All Borders).',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C6':{bd:'all'}}},ajutor:'Tragi de la A1 până la C6, apoi deschizi meniul Borduri.',why:'Toate bordurile desenează liniile fiecărei celule din zonă.'},
   inca:[
    {t:'excel',q:'Centrează notele din <b>B2:C6</b> (butonul ≡ de centrare).',cols:4,rows:7,cells:NOTE,verifica:{format:{'B2:C6':{al:'center'}}},ajutor:'Doar notele: de la B2 la C6.',why:'Alinierea se pune doar pe zona selectată.'},
    {t:'excel',q:'Pune o <b>culoare de umplere</b> pe capul de tabel <b>A1:C1</b> (🪣 Umplere).',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C1':{fill:true}}},ajutor:'Selectezi A1:C1, apoi deschizi meniul de umplere și alegi o culoare.',why:'Culoarea de umplere colorează fundalul celulelor alese.'}
   ]},
  {t:'Formatul numerelor: procent, monedă, zecimale',
   text:`<p>Formatul numerelor schimbă doar <strong>afișarea</strong>, nu valoarea:</p>
<ul><li><strong>Procent</strong> (Percentage): <code>0,19</code> apare ca <code>19%</code>;</li>
<li><strong>Monedă</strong> (Currency): <code>0,19</code> apare cu semnul monedei;</li>
<li>butoanele <code>.0→.00</code> și <code>.00→.0</code> adaugă sau scot zecimale de pe ecran.</li></ul>
<p>Valoarea adevărată o vezi mereu în bara <em>fx</em>. Excel calculează cu ea, nu cu ce se vede.</p>`,
   exemplu:`<p>Celula C2 afișează <b>19%</b>, dar bara fx arată valoarea: 0,19.</p>${grila([['Produs','Preț','Cota TVA'],['Caiet','4','19%']],{sel:['C2'],fx:['C2','0,19']})}`,
   altfel:`<p>E ca ora pe un ceas: „14:30” și „2:30 PM” arată diferit, dar e aceeași oră. Formatul schimbă cum e scris, nu cât e.</p>`,
   incearca:{t:'excel',q:'Cotele de TVA din <b>C2:C4</b> sunt scrise ca zecimale (0,19). Fă-le să apară ca <b>procente</b>, fără zecimale.',cols:4,rows:5,cells:{A1:'Produs',B1:'Preț',C1:'Cota TVA',A2:'Caiet',B2:4,C2:0.19,A3:'Pâine',B3:3,C3:0.09,A4:'Carte',B4:30,C4:0.05},verifica:{format:{'C2:C4':{nf:'percent',dec:0}}},ajutor:'Selectezi C2:C4 și alegi Procent (Percentage) din lista de formate.',why:'Procentul înmulțește doar afișarea cu 100: 0,19 apare 19%. Valoarea rămâne 0,19.'},
   inca:[
    {t:'excel',q:'Încearcă: alege <b>D2</b> (media 8,5) și apasă de câteva ori <code>.00→.0</code>, apoi <code>.0→.00</code>. Uită-te și în bara fx. Ce se schimbă?',cols:5,rows:4,cells:{A1:'Elev',B1:'Nota 1',C1:'Nota 2',D1:'Media',A2:'Ana',B2:8,C2:9,D2:8.5,A3:'Bogdan',B3:5,C3:6,D3:5.5},o:['Doar afișarea; valoarea rămâne 8,5','Valoarea se rotunjește de-adevăratelea','Media se șterge','Nu se schimbă nimic'],ok:0,ajutor:'Compară ce vezi în celulă cu ce scrie în bara fx.',why:'Butoanele de zecimale schimbă doar cum arată numărul. Excel calculează tot cu 8,5.'}
   ]},
  {t:'Un titlu deasupra tabelului: Îmbină și centrează',
   text:`<p>Titlul unui tabel stă de obicei în <code>A1</code>, deasupra capului de tabel. Ca să stea <strong>la mijloc, peste toate coloanele</strong>:</p>
<ol><li>selectezi celulele de sub el, pe tot tabelul: <code>A1:C1</code>;</li>
<li>apeși <strong>Îmbină și centrează</strong> (Merge &amp; Center), în fila Pornire (Home).</li></ol>
<p>Cele trei celule devin <mark>una singură</mark>, iar titlul se așază la mijloc.</p>`,
   altfel:`<p>E ca atunci când lipești trei foi una lângă alta ca să scrii un afiș mare: titlul se scrie o singură dată, pe mijlocul tuturor.</p>`,
   incearca:{t:'excel',q:'Titlul din <b>A1</b> trebuie să stea deasupra întregului tabel: îmbină și centrează <b>A1:C1</b>.',cols:4,rows:6,cells:{A1:'Situația la informatică',A2:'Elev',B2:'Nota 1',C2:'Nota 2',A3:'Ana',B3:8,C3:9,A4:'Bogdan',B4:5,C4:6},verifica:{imbinat:'A1:C1'},ajutor:'Selectezi A1:C1, apoi butonul ⇔ Îmbină și centrează.',why:'Merge & Center unește A1:C1 într-o singură celulă și pune titlul la mijloc.'}},
  {t:'Coloana prea îngustă: #####',
   text:`<p>Dacă într-o celulă cu un număr vezi <code>#####</code>, numărul <strong>nu e greșit</strong>: doar <mark>nu încape</mark> în coloană.</p>
<ol><li>în capul de coloane, sus, pui mouse-ul pe <strong>linia dintre două litere</strong> (de exemplu între B și C); cursorul devine o săgeată dublă ↔;</li>
<li>tragi spre dreapta, ca să lățești coloana B; sau dai <strong>dublu-clic</strong> pe linie, iar coloana se potrivește singură după conținut.</li></ol>
<p>La fel faci și un rând mai înalt: tragi de linia dintre numerele rândurilor, în stânga.</p>`,
   altfel:`<p>E ca o poză prea mare pentru ramă: poza e bună, rama e mică. Nu schimbi poza, mărești rama.</p>`,
   incearca:{t:'choice',q:'Într-o celulă cu un număr vezi <code>#####</code>. Ce faci?',o:['Lățești coloana, trăgând de marginea ei','Ștergi numărul și îl scrii din nou','Faci numărul aldin, ca să se vadă','Schimbi formatul în Procent'],ok:0,ajutor:'Semnele ##### apar când numărul nu încape.',why:'Coloana e prea îngustă. Tragi de linia din dreapta literei coloanei sau dai dublu-clic pe ea.'},
   inca:[
    {t:'choice',q:'De unde tragi ca să lățești coloana <b>B</b>?',o:['De linia dintre literele B și C, din capul de coloane','De marginea celulei B2, din mijlocul tabelului','De bara de formule','De caseta de nume'],ok:0,ajutor:'Recitește primul punct din pas: unde pui mouse-ul?',why:'Lățimea se schimbă din capul de coloane, de linia din dreapta literei B.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Tabelul notelor, gata de tipărit',
  intro:`<p><strong>Sarcina:</strong> fă tabelul să arate ca unul adevărat. (1) Capul de tabel <b>A1:C1</b> aldin și cu o culoare de umplere; (2) borduri pe tot tabelul <b>A1:C6</b>; (3) notele <b>B2:C6</b> centrate. Pentru fiecare: întâi selectezi, apoi apeși butonul.</p>`,
  q:'Formatează tabelul în trei pași.',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C1':{b:true,fill:true},'A1:C6':{bd:'all'},'B2:C6':{al:'center'}}},ajutor:'Selectează A1:C1 → B și 🪣 Umplere. Apoi A1:C6 → ▦ Borduri → Toate bordurile. Apoi B2:C6 → ≡.',why:'Trei selecții, trei butoane. Tabelul arată acum ca în captura din pas.',
  inca:[
   {t:'excel',q:'Încă una: capul de tabel <b>A1:C1</b> aldin, iar notele <b>B2:C6</b> aliniate la dreapta (≡⯈).',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C1':{b:true},'B2:C6':{al:'right'}}},ajutor:'Două selecții, două butoane.',why:'Fiecare format se aplică doar zonei selectate.'}
  ]},
 qs:[
  {t:'choice',q:'Ce schimbă formatarea unei celule?',o:['Doar cum arată celula','Valoarea din celulă','Formula din celulă','Adresa celulei'],ok:0,why:'Formatarea schimbă aspectul; valoarea și formula rămân aceleași.'},
  {t:'order',q:'Pune în ordine pașii ca să faci capul de tabel aldin.',items:['Selectezi celulele capului de tabel','Deschizi fila Pornire (Home)','Apeși butonul B (aldin)'],ajutor:'Regula: întâi selectezi.',why:'Întâi alegi ce formatezi, apoi butonul.'},

/* ================= 4. Prima formulă (lecția 7) ================= */
{t:'Prima formulă',lectii:[7],continuturi:[P.formule],
 obiectiv:'scrii formule cu adrese și operatorii + - * /, puse cu mouse-ul, și le verifici în bara de formule.',
 pasi:[
  {t:'O formulă începe cu =',
   text:`<p>O <mark>formulă</mark> e un calcul pe care îl face Excel. Începe <strong>mereu</strong> cu semnul <code>=</code>.</p>
<p>În celulă vezi <strong>rezultatul</strong>. Formula însăși o vezi în bara <em>fx</em>, când alegi celula.</p>
<p>Fără <code>=</code> la început, Excel crede că ai scris un text și nu calculează nimic.</p>`,
   exemplu:`<p>În D2 s-a scris <code>=B2+C2</code>. Celula arată 17, bara fx arată formula:</p>${grila([['Elev','Nota 1','Nota 2','Suma'],['Ana','8','9','17']],{sel:['D2'],fx:['D2','=B2+C2']})}`,
   incearca:{t:'choice',q:'Care dintre acestea e o formulă?',o:['=B2+C2','B2+C2','Suma notelor','17'],ok:0,ajutor:'Cu ce semn începe orice formulă?',why:'Doar ce începe cu = e formulă. B2+C2 fără = e un simplu text.'},
   inca:[
    {t:'tf',q:'Într-o celulă cu formulă vezi rezultatul, iar formula o vezi în bara fx.',ok:true,ajutor:'Uită-te la exemplul „Uite cum”.',why:'Adevărat. Celula arată 17, bara fx arată =B2+C2.'}
   ]},
  {t:'Semnele de calcul',
   text:`<p>Operatorii aritmetici din Excel:</p>
<ul><li><code>+</code> adunare, <code>-</code> scădere;</li>
<li><code>*</code> (steluța) <mark>înmulțire</mark>, <strong>nu</strong> litera x;</li>
<li><code>/</code> (bara) <mark>împărțire</mark>, nu două puncte.</li></ul>
<p>Ca la matematică, înmulțirea și împărțirea se fac <strong>înaintea</strong> adunării. Dacă vrei întâi adunarea, pui <strong>paranteze</strong>: media a două note e <code>=(B2+C2)/2</code>. Fără paranteze, <code>=B2+C2/2</code> ar împărți doar C2 la 2.</p>`,
   exemplu:`<p>La magazinul clasei, totalul e preț × bucăți: <code>=B2*C2</code>.</p>${grila([['Produs','Preț','Bucăți','Total'],['Caiet','4','3','12']],{sel:['D2'],fx:['D2','=B2*C2']})}`,
   altfel:`<p>Pe tastatură nu există semnele × și ÷ ca la matematică. Excel folosește ce găsește pe tastatură: steluța pentru „ori” și bara pentru „împărțit”.</p>`,
   incearca:{t:'match',q:'Potrivește semnul cu operația.',pairs:[['+','Adunare'],['-','Scădere'],['*','Înmulțire'],['/','Împărțire']],ajutor:'Înmulțirea e steluța, împărțirea e bara.',why:'Steluța înmulțește, bara împarte.'},
   inca:[
    {t:'choice',q:'Care formulă calculează <b>media</b> notelor din B2 și C2?',o:['=(B2+C2)/2','=B2+C2/2','=B2+C2*2','=(B2+C2)*2'],ok:0,ajutor:'Întâi aduni, apoi împarți. Ce trebuie pus ca adunarea să fie prima?',why:'Parantezele fac întâi adunarea; apoi împarți la 2.'}
   ]},
  {t:'Adrese, nu numere',
   text:`<p>O formulă bună folosește <mark>adresele</mark> celulelor, nu numerele din ele: <code>=B2+C2</code>, nu <code>=8+9</code>.</p>
<p>De ce? Pentru că atunci când schimbi o notă, formula cu adrese <strong>se recalculează singură</strong>. <code>=8+9</code> rămâne 17 orice ar fi scris în B2 și C2.</p>
${fig('formula-maner.webp',900,240,'Excel: celula D2 arată rezultatul 15, iar bara de formule arată =B2*C2','În Excel: D2 arată 15, bara fx arată formula cu adrese, <code>=B2*C2</code>.')}`,
   altfel:`<p>E diferența dintre „dă-mi cartea de pe raftul 3” și „dă-mi cartea roșie”. Dacă pui altă carte pe raftul 3, prima cerere o găsește pe cea nouă. Adresa spune <b>unde</b> să caute, nu <b>ce</b> să găsească.</p>`,
   incearca:{t:'choice',q:'Care dintre acestea se recalculează singură când schimbi nota din B2?',o:['=B2+C2','=8+9','B2+C2','17'],ok:0,ajutor:'Care are și =, și adrese?',why:'Doar formula cu = și cu adrese se refac singură.'},
   inca:[
    {t:'excel',q:'În <b>D3</b> calculează cu cât e mai mare Nota 2 decât Nota 1 la Bogdan (Nota 2 minus Nota 1). Folosește adresele.',cols:5,rows:6,cells:{...NOTE,D1:'Diferență'},verifica:{formule:{D3:'=C3-B3'}},ajutor:'Bogdan e pe rândul 3: Nota 2 e în C3, Nota 1 în B3.',why:'=C3-B3: întâi Nota 2, apoi scazi Nota 1.'}
   ]},
  {t:'Cum construiești o formulă (strategie)',
   text:`<p>Ca să nu greșești adresele, <strong>nu le tastezi, le arăți</strong>:</p>
<ol><li>Alegi celula în care vrei <strong>rezultatul</strong>.</li>
<li>Scrii <code>=</code>.</li>
<li><mark>Apeși pe prima celulă</mark>: adresa ei intră singură în formulă (bara de stare scrie <strong>Indicare</strong>, Point).</li>
<li>Scrii semnul: <code>+</code>, <code>-</code>, <code>*</code> sau <code>/</code>.</li>
<li>Apeși pe a doua celulă.</li>
<li><kbd>Enter</kbd>, apoi alegi iar celula și <strong>verifici</strong> formula în bara <em>fx</em>.</li></ol>`,
   incearca:{t:'excel',q:'În <b>D2</b> calculează suma notelor Anei: scrie <code>=</code>, <b>apasă pe B2</b>, scrie <code>+</code>, <b>apasă pe C2</b>, apoi <kbd>Enter</kbd>.',cols:5,rows:6,cells:{...NOTE,D1:'Suma'},verifica:{formule:{D2:'=B2+C2'},gest:['clic-adresa']},ajutor:'După = nu tasta B2: apasă cu mouse-ul pe celula B2.',why:'=B2+C2, cu adresele puse cu mouse-ul: nu poți greși adresa.'},
   inca:[
    {t:'excel',q:'La magazinul clasei: în <b>D2</b> calculează totalul pentru caiete, adică preț × bucăți.',cols:5,rows:6,cells:MAG,verifica:{formule:{D2:'=B2*C2'}},ajutor:'=, apeși pe B2, *, apeși pe C2, Enter.',why:'Înmulțirea se scrie cu steluță: =B2*C2.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Casa de marcat a clasei',
  intro:`<p><strong>Sarcina:</strong> calculează totalul pentru <b>caiete</b> în <b>D2</b> și pentru <b>pixuri</b> în <b>D3</b> (preț × bucăți). Folosește strategia: <code>=</code>, apeși pe preț, <code>*</code>, apeși pe bucăți, <kbd>Enter</kbd>.</p>`,
  q:'Totalul în D2 și în D3.',cols:5,rows:6,cells:MAG,verifica:{formule:{D2:'=B2*C2',D3:'=B3*C3'}},ajutor:'D2: =B2*C2. D3: =B3*C3.',why:'Fiecare total folosește prețul și bucățile de pe rândul lui.',
  inca:[
   {t:'excel',q:'Încă una: în <b>D2</b> calculează <b>media</b> celor două note ale Anei.',cols:5,rows:6,cells:{...NOTE,D1:'Media'},verifica:{formule:{D2:'=(B2+C2)/2'}},ajutor:'Parantezele întâi: =(B2+C2)/2.',why:'Întâi aduni în paranteză, apoi împarți la 2.'}
  ]},
 qs:[
  {t:'choice',q:'Cu ce semn începe orice formulă din Excel?',o:['=','+','fx','#'],ok:0,why:'Fără = la început, Excel ia ce ai scris drept text.'},
  {t:'excel',q:'În <b>D4</b> calculează totalul pentru rigle (preț × bucăți).',cols:5,rows:6,cells:MAG,verifica:{formule:{D4:'=B4*C4'}},ajutor:'Rigla e pe rândul 4.',why:'=B4*C4: prețul ori bucățile de pe rândul riglei.'},
  {t:'choice',q:'De ce scrii <code>=B2+C2</code> și nu <code>=8+9</code>?',o:['Ca rezultatul să se refacă singur când schimbi o notă','Pentru că e mai scurt','Pentru că Excel nu știe să adune numere','Nu contează, e același lucru'],ok:0,ajutor:'Ce se întâmplă când schimbi nota din B2?',why:'Formula cu adrese se recalculează singură; cea cu numere rămâne neschimbată.'},
  {t:'tf',q:'În Excel, înmulțirea se scrie cu litera x, ca în caiet.',ok:false,ajutor:'Ce semn de pe tastatură folosește Excel pentru „ori”?',why:'Fals. Înmulțirea se scrie cu steluța: =B2*C2.'},
  {t:'choice',q:'Care formulă dă media notelor din B2 și C2?',o:['=(B2+C2)/2','=B2+C2/2','=B2*C2/2','=(B2+C2)*2'],ok:0,ajutor:'Parantezele fac ca adunarea să fie prima.',why:'Fără paranteze, doar C2 s-ar împărți la 2.'}
 ]},

/* ================= 5. Copiez formula trăgând de colț (lecțiile 4, 7) ================= */
{t:'Copiez formula trăgând de colț',lectii:[4,7],continuturi:[P.editare,P.formule],
 obiectiv:'scrii o formulă o singură dată și o copiezi pe toată coloana, trăgând de colț sau cu tastatura, și înțelegi cum se mută adresele.',
 pasi:[
  {t:'Pătrățelul din colț (fill handle)',
   text:`<p>Celula aleasă are în colțul din dreapta-jos un <mark>pătrățel verde</mark>. Se numește <strong>mâner de umplere</strong> (fill handle).</p>
<p>Îl apuci cu mouse-ul (cursorul devine o cruciuliță neagră) și <strong>tragi în jos</strong>. Când ridici degetul, formula s-a copiat în toate celulele peste care ai trecut.</p>
<p>Așa calculezi o coloană întreagă scriind o singură formulă.</p>`,
   exemplu:`<p>Captura din Excel: în D2 e formula <code>=B2*C2</code>, iar pătrățelul din colțul celulei D2 e mânerul de umplere.</p>${fig('formula-maner.webp',900,240,'Excel: celula D2 cu formula =B2*C2 și pătrățelul verde din colțul ei din dreapta-jos','Mânerul de umplere: pătrățelul din colțul celulei alese.')}`,
   incearca:{t:'excel',q:'În <b>D2</b> e deja <code>=B2*C2</code>. Alege D2 și <b>trage de pătrățelul verde</b> până la <b>D5</b>.',cols:5,rows:6,cells:{...MAG,D2:'=B2*C2'},verifica:{formule:{D2:'=B2*C2'},umplut:{D2:['D3','D4','D5']},gest:['umple']},ajutor:'Apucă exact pătrățelul din colțul din dreapta-jos al lui D2, nu mijlocul celulei.',why:'O formulă trasă în jos calculează toată coloana.'},
   inca:[
    {t:'tf',q:'Ca să calculezi totalul pentru 30 de produse trebuie să scrii 30 de formule.',ok:false,ajutor:'Ce face mânerul de umplere?',why:'Fals. Scrii una și o tragi în jos.'}
   ]},
  {t:'Adresele se mută singure',
   text:`<p>La copiere, Excel <mark>mută adresele</mark> odată cu formula. <code>=B2*C2</code> din D2 devine <code>=B3*C3</code> în D3, <code>=B4*C4</code> în D4 și tot așa.</p>
<p>Se numesc <strong>adrese relative</strong>: formula ține minte „celulele de pe rândul meu”, nu o celulă anume. De aceea fiecare rând își calculează propriul total.</p>
<p><strong>Cum verifici:</strong> după ce ai tras, alegi ultima celulă și citești bara <em>fx</em>. Adresele trebuie să fie de pe rândul ei.</p>`,
   exemplu:`${fig('formula-copiata.webp',900,240,'Excel: după tragere, celula D3 conține formula =B3*C3, cu adresele coborâte un rând','După tragere, D3 are <code>=B3*C3</code>: adresele au coborât cu un rând.')}${grila([['Produs','Preț','Bucăți','Total'],['Caiet','4','3','=B2*C2'],['Pix','2','5','=B3*C3'],['Riglă','6','2','=B4*C4'],['Gumă','1','4','=B5*C5']],{sel:['D2','D3','D4','D5']})}`,
   altfel:`<p>E ca atunci când spui „ia caietul colegului din stânga ta”. Fiecare elev din bancă ia alt caiet, pentru că fiecare are alt coleg în stânga. Formula spune la fel: „celulele de pe rândul meu”.</p>`,
   incearca:{t:'excel',q:'Încearcă: în D2 e <code>=B2*C2</code>. Trage-o până la D5, apoi alege <b>D5</b> și citește bara de formule. Ce formulă a ajuns acolo?',cols:5,rows:6,cells:{...MAG,D2:'=B2*C2'},o:['=B5*C5','=B2*C2','=B2*C5','=D2*5'],ok:0,ajutor:'Formula coboară din rândul 2 în rândul 5: ce se întâmplă cu cifrele?',why:'Adresele relative coboară cu câte un rând: din rândul 2 în rândul 5.'},
   inca:[
    {t:'choice',q:'<code>=B2*C2</code> din D2 e trasă în jos. Ce formulă ajunge în <b>D4</b>?',o:['=B4*C4','=B2*C2','=B3*C3','=D4*C4'],ok:0,ajutor:'Rândul 4: cifrele din adrese devin 4.',why:'Pe rândul 4, formula folosește B4 și C4.'}
   ]},
  {t:'Altă cale: Ctrl+D și copierea',
   text:`<p>Același lucru se face și din tastatură:</p>
<ol><li>selectezi de la celula cu formula până jos, de exemplu <code>D2:D5</code>;</li>
<li>apeși <kbd>Ctrl</kbd>+<kbd>D</kbd> (D de la <em>Down</em>, „în jos”).</li></ol>
<p>Formula din prima celulă se copiază în toate celelalte. Poți folosi și copierea obișnuită: <kbd>Ctrl</kbd>+<kbd>C</kbd> pe formulă, apoi <kbd>Ctrl</kbd>+<kbd>V</kbd> în altă celulă. Și aici adresele se mută. În jurul zonei copiate apare o margine punctată care se mișcă.</p>
${fig('zona-copiata.webp',760,290,'Excel: zona B2:D4 copiată cu Ctrl+C, înconjurată de o margine punctată animată','Zona copiată cu <kbd>Ctrl</kbd>+<kbd>C</kbd> are o margine punctată.')}`,
   incearca:{t:'excel',q:'Selectează de la <b>D2</b> până la <b>D5</b> (D2 are deja formula) și apasă <kbd>Ctrl</kbd>+<kbd>D</kbd>.',cols:5,rows:6,cells:{...MAG,D2:'=B2*C2'},verifica:{formule:{D2:'=B2*C2'},umplut:{D2:['D3','D4','D5']},gest:['ctrl-d']},ajutor:'Selecția trebuie să înceapă cu celula care are formula.',why:'Ctrl+D copiază primul rând al selecției în toate rândurile de dedesubt.'},
   inca:[
    {t:'choice',q:'Ce face <kbd>Ctrl</kbd>+<kbd>D</kbd> pe zona selectată <code>D2:D5</code>?',o:['Copiază formula din D2 în D3, D4 și D5','Golește toate celulele din zonă','Face toate celulele din zonă aldin','Sortează zona de la mic la mare'],ok:0,ajutor:'D vine de la Down.',why:'Ctrl+D umple în jos cu ce e în prima celulă a selecției.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Media pentru toată clasa',
  intro:`<p>În <b>D2</b> e deja media Anei, <code>=(B2+C2)/2</code>. <strong>Sarcina:</strong> copiaz-o pentru toți elevii: alege D2 și trage de mânerul de umplere până la <b>D6</b>. Apoi verifică pe D6, în bara fx, că formula folosește rândul 6.</p>`,
  q:'Trage media din D2 până la D6.',cols:5,rows:7,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2'},verifica:{formule:{D2:'=(B2+C2)/2'},umplut:{D2:['D3','D4','D5','D6']},gest:['umple']},ajutor:'Apucă pătrățelul din colțul lui D2 și trage până la rândul 6.',why:'Fiecare rând își calculează media lui, pentru că adresele s-au mutat.',
  inca:[
   {t:'excel',q:'Încă una: în <b>D2</b> scrie <code>=B2*C2</code>, apoi copiaz-o până la <b>D5</b> (tragere sau <kbd>Ctrl</kbd>+<kbd>D</kbd>).',cols:5,rows:6,cells:MAG,verifica:{formule:{D2:'=B2*C2'},umplut:{D2:['D3','D4','D5']}},ajutor:'Întâi formula în D2, cu Enter; apoi o copiezi în jos.',why:'O formulă scrisă o dată, copiată pe toată coloana.'}
  ]},
 qs:[
  {t:'choice',q:'<code>=B2*C2</code> din D2 e trasă până la D5. Ce formulă e în D5?',o:['=B5*C5','=B2*C2','=B2*C5','=D2*5'],ok:0,ajutor:'Adresele relative coboară cu formula.',why:'Adresele coboară cu câte un rând: în D5 ajung B5 și C5.'},
  {t:'excel',q:'În <b>D2</b> e deja media Anei. Copiaz-o până la <b>D6</b>.',cols:5,rows:6,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2'},verifica:{formule:{D2:'=(B2+C2)/2'},umplut:{D2:['D3','D4','D5','D6']}},why:'Tragerea (sau Ctrl+D) copiază formula în jos; fiecare rând își calculează media.'},
  {t:'choice',q:'Cum se numește pătrățelul din colțul celulei alese?',o:['Mâner de umplere (fill handle)','Caseta de nume (Name Box)','Bara de stare (Status Bar)','Bordura celulei (Border)'],ok:0,why:'Mânerul de umplere copiază formula când îl tragi.'},
  {t:'choice',q:'Ce faci ca să fii sigur că formula s-a copiat bine?',o:['Alegi ultima celulă și citești formula în bara fx','Te uiți doar dacă apar numere','Scrii formula din nou în fiecare celulă','Apeși Delete'],ok:0,ajutor:'Recitește ultimul paragraf din pasul 2.',why:'Bara fx arată formula: adresele trebuie să fie de pe rândul acelei celule.'},
  {t:'tf',q:'<kbd>Ctrl</kbd>+<kbd>D</kbd> copiază în jos formula din prima celulă a selecției.',ok:true,why:'Adevărat. D vine de la Down.'}
 ]},

/* ================= 6. Funcții (lecția 8) ================= */
{t:'Funcții: SUM, AVERAGE, MIN, MAX',lectii:[8],continuturi:[P.functii],
 obiectiv:'folosești funcțiile SUM, AVERAGE, MIN și MAX pe o zonă selectată cu mouse-ul.',
 pasi:[
  {t:'Ce e o funcție',
   text:`<p>O <mark>funcție</mark> e un calcul gata pregătit, cu nume. Se scrie așa: <code>=</code>, numele, apoi între paranteze <strong>zona</strong> pe care lucrează.</p>
<p><code>=SUM(B2:B6)</code> adună toate celulele de la B2 până la B6. E mult mai scurt decât <code>=B2+B3+B4+B5+B6</code> și nu uiți nicio celulă.</p>
${fig('functie-average.webp',900,340,'Excel: celula B7 afișează 6,85, iar bara de formule arată =AVERAGE(B2:B6)','În Excel: B7 arată media, 6,85; bara fx arată funcția <code>=AVERAGE(B2:B6)</code>.')}`,
   altfel:`<p>O funcție e ca un buton de pe mașina de spălat: apeși „program rapid” și ea știe singură toți pașii. Tu îi dai doar „rufele”, adică zona.</p>`,
   incearca:{t:'choice',q:'Ce face <code>=SUM(B2:B6)</code>?',o:['Adună toate celulele de la B2 la B6','Adună doar celulele B2 și B6','Împarte valoarea din B2 la B6','Numără celulele de la B2 la B6'],ok:0,ajutor:'Cele două puncte înseamnă „până la”.',why:'Zona B2:B6 are cinci celule; SUM le adună pe toate.'},
   inca:[
    {t:'tf',q:'<code>=SUM(B2:B6)</code> dă același rezultat ca <code>=B2+B3+B4+B5+B6</code>.',ok:true,ajutor:'Ce celule sunt în zona B2:B6?',why:'Adevărat, dar funcția e mai scurtă și nu sare nicio celulă.'}
   ]},
  {t:'Patru funcții, cu nume în engleză',
   text:`<p>Cele patru funcții de bază:</p>
<ul><li><code>SUM</code> = <strong>suma</strong>;</li>
<li><code>AVERAGE</code> = <strong>media</strong> aritmetică;</li>
<li><code>MIN</code> = cea mai <strong>mică</strong> valoare;</li>
<li><code>MAX</code> = cea mai <strong>mare</strong> valoare.</li></ul>
<p>Atenție: numele sunt <mark>în engleză</mark>, și pe Excel-ul în română. Dacă scrii un nume românesc, de exemplu <code>=SUMA(B2:B6)</code>, Excel nu-l cunoaște și arată eroarea <code>#NAME?</code>.</p>`,
   incearca:{t:'match',q:'Potrivește funcția cu ce calculează.',pairs:[['SUM','Suma'],['AVERAGE','Media'],['MIN','Cea mai mică valoare'],['MAX','Cea mai mare valoare']],ajutor:'MIN de la „minim”, MAX de la „maxim”.',why:'Patru funcții, patru calcule gata făcute.'},
   inca:[
    {t:'choice',q:'Pe un Excel în limba română scrii <code>=SUMA(B2:B6)</code>. Ce se întâmplă?',o:['Apare eroarea #NAME?','Adună normal','O traduce singur în SUM','Apare 0'],ok:0,ajutor:'În ce limbă sunt numele funcțiilor?',why:'Excel păstrează numele englezești. Un nume necunoscut dă #NAME?.'}
   ]},
  {t:'Cum scrii o funcție (strategie)',
   text:`<ol><li>Alegi celula de <strong>sub</strong> coloana de numere (acolo vrei rezultatul).</li>
<li>Scrii <code>=SUM(</code> (sau alt nume de funcție și paranteza).</li>
<li><mark>Tragi cu mouse-ul</mark> peste celulele cu numere: zona intră singură în formulă.</li>
<li>Scrii <code>)</code> și apeși <kbd>Enter</kbd>.</li>
<li>Verifici în bara <em>fx</em> că zona e cea bună (fără capul de tabel).</li></ol>
<p>Scurtătură pentru sumă: butonul <strong>Σ AutoSum</strong> din fila Pornire (Home). Alegi celula de sub numere, apeși Σ, iar Excel îți propune singur zona. Verifici și apeși <kbd>Enter</kbd>.</p>`,
   incearca:{t:'excel',q:'În <b>B7</b> calculează suma notelor 1: scrie <code>=SUM(</code>, <b>trage cu mouse-ul de la B2 la B6</b>, scrie <code>)</code> și <kbd>Enter</kbd>.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},verifica:{formule:{B7:'=SUM(B2:B6)'},gest:['zona-mouse']},ajutor:'Zona e doar cu note: de la B2 la B6, fără „Nota 1” din B1.',why:'=SUM(B2:B6). Zona trasă cu mouse-ul nu poate fi greșită.'},
   inca:[
    {t:'excel',q:'În <b>B7</b> calculează <b>media</b> notelor 1 ale clasei.',cols:4,rows:8,cells:{...NOTE,A7:'Media'},verifica:{formule:{B7:'=AVERAGE(B2:B6)'}},ajutor:'Media e AVERAGE.',why:'=AVERAGE(B2:B6).'},
    {t:'excel',q:'În <b>C7</b> calculează <b>suma</b> notelor 2 cu butonul <b>Σ AutoSum</b> din fila Pornire.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},verifica:{formule:{C7:'=SUM(C2:C6)'}},ajutor:'Alege C7, apasă Σ AutoSum, verifică zona propusă, Enter.',why:'AutoSum a pus singur =SUM(C2:C6).'}
   ]}
 ],

/* ================= 7. Bula de ajutor și setările (lecțiile 7, 8) ================= */
{t:'Bula de ajutor și setările calculatorului',lectii:[7,8],continuturi:[P.formule,P.functii],
 obiectiv:'lași Excel să-ți completeze funcția, citești bula de ajutor și afli singur dacă un calculator vrea ; sau , între părți.',
 pasi:[
  {t:'Lista de funcții și tasta Tab',
   text:`<p>Când scrii <code>=SU</code>, Excel îți arată o <mark>listă de funcții</mark> care încep așa: SUM, SUMIF… Nu trebuie să știi numele pe de rost.</p>
<ol><li>scrii primele litere, <code>=SU</code>;</li>
<li>cu săgețile alegi funcția din listă;</li>
<li>apeși <kbd>Tab</kbd>: Excel scrie singur <code>=SUM(</code>.</li></ol>
<p>Și dacă uiți paranteza de la final, la <kbd>Enter</kbd> Excel o închide singur.</p>`,
   altfel:`<p>E ca tastatura telefonului care îți ghicește cuvântul: scrii „mul” și îți propune „mulțumesc”. Tab înseamnă „da, pe ăsta îl vreau”.</p>`,
   incearca:{t:'excel',q:'În <b>B7</b> fă suma notelor 1 lăsând Excel să scrie numele funcției: scrie doar <code>=SU</code>, apasă <kbd>Tab</kbd> (apare <code>=SUM(</code>), trage peste B2:B6 și apasă <kbd>Enter</kbd>.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},mod:'ro',verifica:{formule:{B7:'=SUM(B2:B6)'},gest:['autocompletare']},ajutor:'După =SU apare lista; SUM e primul. Tab îl alege.',why:'Tab completează funcția aleasă din listă. La Enter, Excel închide singur paranteza.'},
   inca:[
    {t:'choice',q:'Ai scris <code>=SU</code> și a apărut lista de funcții. Ce tastă scrie funcția aleasă?',o:['Tab','Esc','Delete','F2'],ok:0,ajutor:'Recitește pasul 3 din listă.',why:'Tab completează funcția: =SUM(.'}
   ]},
  {t:'Bula de ajutor',
   text:`<p>După <code>=SUM(</code>, sub bara de formule apare o <mark>bulă de ajutor</mark>: <code>SUM(number1; [number2]; …)</code>.</p>
<ul><li>îți arată <strong>ce părți</strong> are funcția (number1, number2…);</li>
<li>partea pe care o scrii <strong>acum</strong> e îngroșată;</li>
<li>ce e între paranteze drepte <code>[ ]</code> e <strong>opțional</strong>: poți să nu scrii.</li></ul>
<p>Și, cel mai important, bula îți arată <strong>semnul dintre părți</strong>. Aici e <code>;</code>.</p>`,
   exemplu:`<p>Cu mai multe părți, SUM adună mai multe zone deodată: <code>=SUM(B2:B6;C2:C6)</code> adună notele 1 <b>și</b> notele 2. Părțile se despart cu semnul din bulă.</p>`,
   incearca:{t:'excel',q:'Încearcă: alege <b>B7</b> și scrie <code>=SUM(</code>. Citește bula de sub bara de formule. Ce semn desparte părțile pe setările <b>RO</b>?',cols:4,rows:8,cells:NOTE,mod:'ro',o:['; (punct și virgulă)',', (virgulă)','. (punct)',': (două puncte)'],ok:0,ajutor:'Uită-te între number1 și [number2].',why:'Pe setări românești părțile se despart cu ;. Bula ți-o arată de fiecare dată.'},
   inca:[
    {t:'choice',q:'În bulă scrie <code>SUM(number1; [number2]; …)</code>. Ce înseamnă parantezele drepte din jurul lui number2?',o:['Partea asta poate lipsi','Partea asta e obligatorie','Acolo se scrie un text','E o greșeală a Excel-ului'],ok:0,ajutor:'Ce e între [ ] poți să nu scrii.',why:'[number2] e opțional: SUM merge și cu o singură zonă.'}
   ]},
  {t:'Setările calculatorului: ; sau ,',
   text:`<p>Semnul dintre părți depinde de <mark>setările Windows</mark> ale calculatorului:</p>
<ul><li>setări <strong>românești</strong>: <code>;</code> (punct și virgulă), iar zecimalele cu virgulă, <code>7,5</code>;</li>
<li>setări <strong>englezești</strong>: <code>,</code> (virgulă), iar zecimalele cu punct, <code>7.5</code>.</li></ul>
<p>Cu semnul greșit, Excel arată fereastra „There's a problem with this formula”.</p>
<p><strong>Strategia la un calculator nou:</strong> scrii <code>=SUM(</code> și te uiți în bulă. Semnul de acolo e cel bun pentru toată ora.</p>`,
   altfel:`<p>E ca la prize: în România ștecherul are o formă, în Anglia alta. Aparatul e același, dar trebuie să folosești forma potrivită locului. Bula îți spune ce „priză” are calculatorul.</p>`,
   incearca:{t:'choice',q:'Ai ajuns la un calculator nou din laborator. Care e cel mai sigur mod de a afla dacă Excel vrea <code>;</code> sau <code>,</code>?',o:['Scrii =SUM( și citești bula','Încerci la întâmplare','Întrebi colegul de bancă','Te uiți în fila Pornire'],ok:0,ajutor:'Recitește strategia din pas.',why:'Bula care apare după =SUM( arată exact semnul folosit pe acel calculator.'},
   inca:[
    {t:'excel',q:'Calculator cu setări <b>EN</b> (butonul e deja apăsat): în <b>C7</b> calculează <b>media</b> notelor 2. Uită-te în bulă ce semn cere.',cols:4,rows:8,cells:{...NOTE,A7:'Media'},mod:'en',verifica:{formule:{C7:'=AVERAGE(C2:C6)'}},ajutor:'=AVERAGE(C2:C6). O singură parte, deci nu ai nevoie de semn.',why:'Aici e o singură parte; semnul contează abia când sunt mai multe.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Suma a două coloane',
  intro:`<p>Setările sunt <b>RO</b>. <strong>Sarcina:</strong> în <b>B7</b> adună <strong>toate notele</strong>, din ambele coloane, cu o singură funcție în două părți: prima parte <b>B2:B6</b>, a doua parte <b>C2:C6</b>. Scrie <code>=SUM(</code>, citește în bulă ce semn desparte părțile, apoi trage zonele.</p>`,
  q:'În B7: suma zonelor B2:B6 și C2:C6.',cols:4,rows:8,cells:{...NOTE,A7:'Total'},mod:'ro',verifica:{formule:{B7:'=SUM(B2:B6,C2:C6)'}},ajutor:'=SUM(, tragi B2:B6, scrii ; (setări RO), tragi C2:C6, Enter.',why:'Pe setări românești: =SUM(B2:B6;C2:C6). Două părți, despărțite de semnul din bulă.',
  inca:[
   {t:'excel',q:'Încă una, pe setări <b>EN</b>: în <b>B7</b> aceeași sumă a celor două coloane.',cols:4,rows:8,cells:{...NOTE,A7:'Total'},mod:'en',verifica:{formule:{B7:'=SUM(B2:B6,C2:C6)'}},ajutor:'Pe setări EN semnul dintre părți e virgula.',why:'Pe setări englezești: =SUM(B2:B6,C2:C6).'}
  ]},
 qs:[
  {t:'choice',q:'Cum afli repede dacă Excel-ul de pe calculator vrea <code>;</code> sau <code>,</code> între părți?',o:['Scrii =SUM( și citești bula de ajutor','Te uiți la tastatură','Excel scrie singur semnul bun','Deschizi fila Pornire (Home)'],ok:0,why:'Bula de după =SUM( arată semnul folosit pe acel calculator.'},
  {t:'tf',q:'Pe setări românești, părțile unei funcții se despart cu virgulă.',ok:false,ajutor:'Și zecimalele pe setări românești se scriu cu virgulă: atunci ce semn rămâne pentru părți?',why:'Fals. Pe setări românești se despart cu ; (punct și virgulă).'},
  {t:'excel',q:'Scrie doar <code>=SU</code> în <b>C7</b>, apasă <kbd>Tab</kbd>, trage peste C2:C6 și apasă <kbd>Enter</kbd>.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},mod:'ro',verifica:{formule:{C7:'=SUM(C2:C6)'},gest:['autocompletare']},why:'Tab a completat =SUM(, iar la Enter Excel a închis paranteza.'},
  {t:'choice',q:'Ce înseamnă <code>[ ]</code> în bula de ajutor?',o:['Partea dintre ele e opțională','Acolo trebuie scris un număr','Acolo se pune o zonă obligatorie','E un semn de eroare'],ok:0,why:'Ce e între paranteze drepte poate lipsi.'},
  {t:'choice',q:'Ai scris o funcție cu semnul greșit între părți. Ce vezi?',o:['Fereastra „There\'s a problem with this formula”','Rezultatul corect, fără nicio problemă','Eroarea #NAME? scrisă în celulă','Celula se colorează în roșu, fără mesaj'],ok:0,ajutor:'Recitește pasul 3.',why:'Semnul greșit dintre părți dă fereastra cu problema la formulă.'}
 ]},

/* ================= 8. Decizii cu IF (lecția 9) ================= */
{t:'Decizii cu IF și setările calculatorului',lectii:[9],continuturi:[P.functii],
 obiectiv:'scrii o condiție cu semnele de comparație și o funcție IF care alege singură între două rezultate.',
 pasi:[
  {t:'Comparații: adevărat sau fals',
   text:`<p>O <mark>condiție</mark> e o întrebare cu răspuns <strong>da</strong> (TRUE, adevărat) sau <strong>nu</strong> (FALSE, fals). Se scrie cu semnele de comparație:</p>
<ul><li><code>&gt;</code> mai mare, <code>&lt;</code> mai mic;</li>
<li><code>&gt;=</code> mai mare <strong>sau egal</strong> („cel puțin”), <code>&lt;=</code> mai mic sau egal („cel mult”);</li>
<li><code>=</code> egal, <code>&lt;&gt;</code> diferit.</li></ul>
<p><code>B2&gt;=5</code> întreabă: „nota din B2 e cel puțin 5?”. Pentru 5 răspunsul e da, pentru 4 e nu.</p>`,
   altfel:`<p>E ca la intrarea la un carusel: „cel puțin 1,20 m”. Cine are exact 1,20 m intră. Asta e <code>&gt;=</code>: egalul intră și el.</p>`,
   incearca:{t:'match',q:'Potrivește semnul cu înțelesul lui.',pairs:[['>=','Cel puțin'],['<=','Cel mult'],['<>','Diferit'],['>','Strict mai mare']],ajutor:'Semnul = lipit de > sau < înseamnă „sau egal”.',why:'>= e „cel puțin”, <= e „cel mult”, <> e „diferit”.'},
   inca:[
    {t:'tf',q:'Pentru nota 5, condiția <code>B2&gt;=5</code> e adevărată.',ok:true,ajutor:'>= înseamnă mai mare SAU egal.',why:'Adevărat. 5 e egal cu 5, deci condiția e îndeplinită.'}
   ]},
  {t:'IF are trei părți',
   text:`<p><code>IF</code> („dacă”) alege între două rezultate. Are <strong>trei părți</strong>:</p>
<ol><li>condiția: <code>B2&gt;=5</code>;</li>
<li>ce scrie dacă e <strong>adevărat</strong>: <code>"admis"</code>;</li>
<li>ce scrie dacă e <strong>fals</strong>: <code>"respins"</code>.</li></ol>
<p>Pe setări românești: <code>=IF(B2&gt;=5;"admis";"respins")</code>. Textul se pune între <mark>ghilimele drepte</mark> <code>"…"</code>, nu între ghilimele românești „…”. Numele funcției rămâne în engleză: IF.</p>
${fig('functie-if.webp',900,340,'Excel: celula C3 afișează corigent, iar bara de formule arată =IF(B3>=5;"promovat";"corigent")','În Excel (setări RO): C3 arată „corigent”, bara fx arată formula IF cu <code>;</code> între părți.')}`,
   altfel:`<p>E ca o propoziție: „<b>Dacă</b> plouă, iau umbrela, <b>altfel</b> iau șapca.” Condiția e „plouă”, apoi ce faci dacă da, apoi ce faci dacă nu. Aceeași ordine, mereu.</p>`,
   incearca:{t:'order',q:'Pune părțile lui IF în ordine.',items:['Condiția (B2>=5)','Ce scrie dacă e adevărat ("admis")','Ce scrie dacă e fals ("respins")'],ajutor:'Dacă… atunci… altfel.',why:'IF: întâi condiția, apoi rezultatul pentru da, apoi cel pentru nu.'},
   inca:[
    {t:'choice',q:'Calculatorul are setări românești. Care formulă o primește Excel fără eroare?',o:['=IF(B2>=5;"admis";"respins")','=IF(B2>=5,"admis","respins")','=IF(B2>=5;„admis”;„respins”)','=DACA(B2>=5;"admis";"respins")'],ok:0,ajutor:'Trei lucruri: semnul dintre părți, felul ghilimelelor, numele funcției.',why:'Setări românești: ; între părți, ghilimele drepte, numele în engleză (IF).'}
   ]},
  {t:'Cum construiești un IF (strategie)',
   text:`<ol><li>Spune regula <strong>în cuvinte</strong>: „dacă nota e cel puțin 5, scrie admis, altfel respins”.</li>
<li>Transformă „nota e cel puțin 5” în <strong>comparație</strong>, cu adresa primei note: <code>B2&gt;=5</code>.</li>
<li>Scrie <code>=IF(</code>, condiția, semnul din bulă, textul pentru da, semnul, textul pentru nu, <kbd>Enter</kbd>.</li>
<li>Trage formula în jos pentru toți elevii.</li>
<li><strong>Verifică</strong> pe un rând cu nota exact 5 sau sub 5 că apare ce trebuie.</li></ol>`,
   exemplu:`<p>Setări RO, după tragere până la D6:</p>${grila([['Elev','Nota 1','Nota 2','Verdict'],['Ana','8','9','admis'],['Bogdan','5','6','admis'],['Carmen','10','9','admis'],['Dan','7','4','admis'],['Elena','4','8','respins']],{sel:['D6'],fx:['D6','=IF(B6>=5;"admis";"respins")']})}`,
   incearca:{t:'excel',q:'Setările sunt <b>RO</b>. În <b>D2</b> scrie verdictul Anei cu IF: „admis” dacă Nota 1 e cel puțin 5, altfel „respins”.',cols:5,rows:6,cells:{...NOTE,D1:'Verdict'},mod:'ro',verifica:{formule:{D2:'=IF(B2>=5,"admis","respins")'}},ajutor:'=IF(B2>=5;"admis";"respins") — cu ; pe setări RO.',why:'=IF(B2>=5;"admis";"respins"), cu punct și virgulă între părți.'},
   inca:[
    {t:'excel',q:'Același verdict, dar acum trage-l din <b>D2</b> până la <b>D6</b>, pentru toată clasa.',cols:5,rows:6,cells:{...NOTE,D1:'Verdict'},mod:'ro',verifica:{formule:{D2:'=IF(B2>=5,"admis","respins")'},umplut:{D2:['D3','D4','D5','D6']}},ajutor:'Întâi formula în D2, apoi mânerul de umplere până la D6.',why:'O singură formulă IF, trasă în jos, dă verdictul fiecărui elev.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Verdictul pe Nota 2',
  intro:`<p>Setările sunt <b>RO</b>. <strong>Sarcina:</strong> în <b>D2</b> scrie cu IF „trece” dacă <b>Nota 2</b> e cel puțin 5, altfel „nu trece”. Apoi trage până la <b>D6</b>. Urmează strategia: regula în cuvinte, comparația, IF, tragerea, verificarea.</p>`,
  q:'IF pe Nota 2, tras până la D6.',cols:5,rows:6,cells:{...NOTE,D1:'Verdict'},mod:'ro',verifica:{formule:{D2:'=IF(C2>=5,"trece","nu trece")'},umplut:{D2:['D3','D4','D5','D6']}},ajutor:'Nota 2 e în coloana C: =IF(C2>=5;"trece";"nu trece").',why:'Dan are 4 la Nota 2, deci la el apare „nu trece”.',
  inca:[

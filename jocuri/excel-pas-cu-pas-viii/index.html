  ]},
 qs:[
  {t:'choice',q:'Calculatorul din laborator are setări românești. Care formulă o primește Excel fără eroare?',o:['=IF(C2>=5;"trece";"nu trece")','=IF(C2>=5,"trece","nu trece")','=IF(C2>=5;„trece”;„nu trece”)','=DACA(C2>=5;"trece";"nu trece")'],ok:0,ajutor:'Semnul dintre părți, ghilimelele, numele funcției.',why:'Setări românești: ; între părți, ghilimele drepte, IF în engleză.'},
  {t:'excel',q:'Setări <b>RO</b>: în <b>D2</b> scrie cu IF „admis” dacă Nota 1 e cel puțin 5, altfel „respins”, apoi trage până la <b>D6</b>.',cols:5,rows:6,cells:{...NOTE,D1:'Verdict'},mod:'ro',verifica:{formule:{D2:'=IF(B2>=5,"admis","respins")'},umplut:{D2:['D3','D4','D5','D6']}},why:'O formulă trasă în jos dă verdictul fiecărui elev.'},
  {t:'classify',q:'Formula este <code>=IF(B2&gt;=5;"admis";"respins")</code>. Ce apare pentru fiecare notă?',cats:['admis','respins'],items:[['5',0],['4',1],['9',0],['3',1]],ajutor:'5 intră și el: „cel puțin 5”.',why:'Notele de cel puțin 5 dau „admis”, cele sub 5 dau „respins”.'},
  {t:'choice',q:'Ce înseamnă <code>&lt;&gt;</code> într-o condiție?',o:['Diferit','Egal','Mai mare sau egal','Mai mic'],ok:0,why:'<> înseamnă „diferit de”.'},
  {t:'tf',q:'În IF, textul se pune între ghilimele românești „…”.',ok:false,why:'Fals. Excel vrea ghilimele drepte: "admis".'}
 ]},

/* ================= 9. Sortarea (lecția 10) ================= */
{t:'Ordine în tabel: sortarea',lectii:[10],continuturi:[P.sortare],
 obiectiv:'ordonezi un tabel crescător sau descrescător, după una sau două coloane, fără să amesteci datele elevilor.',
 pasi:[
  {t:'Crescător și descrescător',
   text:`<p><mark>Sortarea</mark> pune rândurile tabelului în ordine după o coloană:</p>
<ul><li><strong>crescător</strong> (A→Z): de la A la Z la text, de la mic la mare la numere;</li>
<li><strong>descrescător</strong> (Z→A): de la Z la A, de la mare la mic.</li></ul>
<p>Butoanele sunt în fila <strong>Date (Data)</strong>: <strong>A→Z</strong> și <strong>Z→A</strong>.</p>`,
   altfel:`<p>Când vă aliniați la sport după înălțime, de la cel mai scund la cel mai înalt, e „crescător”. Invers, de la cel mai înalt, e „descrescător”.</p>`,
   incearca:{t:'classify',q:'Crescător sau descrescător?',cats:['Crescător (A→Z)','Descrescător (Z→A)'],items:[['Ana, Bogdan, Carmen',0],['10, 9, 7',1],['4, 6, 8',0],['Dan, Carmen, Ana',1]],ajutor:'Crescător = de la mic la mare, de la A spre Z.',why:'4, 6, 8 și ordinea alfabetică sunt crescătoare; 10, 9, 7 și ordinea inversă sunt descrescătoare.'},
   inca:[
    {t:'choice',q:'Vrei elevii de la <b>cea mai mare medie</b> la cea mai mică. Ce buton?',o:['Z→A (descrescător)','A→Z (crescător)','Borduri','Σ AutoSum'],ok:0,ajutor:'De la mare la mic.',why:'De la mare la mic e descrescător: Z→A.'}
   ]},
  {t:'Regula de aur: rândurile rămân întregi',
   text:`<p>Un rând din tabel e un elev: numele, clasa, media. La sortare, rândul trebuie să se mute <strong>întreg</strong>.</p>
<ol><li><mark>Alegi o singură celulă</mark> din coloana după care sortezi (sau selectezi tot tabelul).</li>
<li>Apeși A→Z sau Z→A. Excel ia singur tot tabelul și mută rândurile întregi.</li></ol>
<p>Dacă selectezi <strong>doar o coloană</strong>, Excel te avertizează (Sort Warning). Fereastra are două butoane:</p>
<ul><li><strong>Extinde selecția</strong> (Expand the selection): Excel ia tot tabelul și mută rândurile întregi. <mark>Pe acesta îl alegi.</mark></li>
<li><strong>Continuă cu selecția curentă</strong> (Continue with the current selection): se mută doar mediile, numele rămân pe loc și fiecare elev primește media altcuiva.</li></ul>`,
   altfel:`<p>E ca la mutatul cu cutii: fiecare cutie are eticheta lipită pe ea. Dacă muți doar etichetele, nu mai știi ce e în cutii.</p>`,
   incearca:{t:'excel',q:'Încearcă ce NU trebuie făcut: selectează doar <b>C2:C6</b> (mediile) și apasă Z→A. În avertisment alege „Continuă cu selecția curentă”. Ce s-a întâmplat?',cols:4,rows:7,cells:CLASA,o:['Mediile s-au mutat, dar numele au rămas pe loc: s-au amestecat','Totul s-a sortat corect','Excel a șters mediile','Nu s-a întâmplat nimic'],ok:0,ajutor:'Uită-te la Dan: ce medie are acum?',why:'Sortând doar o coloană, fiecare elev primește media altcuiva. De aceea alegi „Extinde selecția”.'},
   inca:[
    {t:'choice',q:'Ai selectat doar coloana cu medii și ai apăsat Z→A. Apare avertismentul. Ce alegi?',o:['Extinde selecția (Expand the selection)','Continuă cu selecția curentă','Nu contează','Ștergi coloana'],ok:0,ajutor:'Vrei ca rândurile să rămână întregi.',why:'Extinde selecția mută rândurile întregi, deci fiecare elev rămâne cu media lui.'},
    {t:'excel',q:'Acum corect: ordonează elevii de la <b>cea mai mare medie</b> la cea mai mică. Alege <b>o singură celulă</b> din coloana <b>Media</b> și Date → <b>Z→A</b>.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'C',ord:'desc'}]}},ajutor:'O singură celulă din coloana C, apoi fila Date.',why:'Z→A pe Media, cu o singură celulă aleasă: rândurile se mută întregi.'},
    {t:'excel',q:'Pune elevii în <b>ordine alfabetică</b> (coloana Elev, A→Z).',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'A',ord:'asc'}]}},ajutor:'O celulă din coloana A, apoi A→Z.',why:'Capul de tabel rămâne sus, pentru că Excel vede că e antet.'}
   ]},
  {t:'Două criterii: Sortare particularizată',
   text:`<p>Uneori vrei ordinea după <mark>două coloane</mark>: întâi pe clase, iar în fiecare clasă după medie. Atunci:</p>
<ol><li>alegi o celulă din tabel;</li>
<li>Date (Data) → <strong>Sortare particularizată</strong> (Custom Sort);</li>
<li>la <strong>nivelul 1</strong> alegi coloana Clasa, crescător;</li>
<li>apeși <strong>Adăugare nivel</strong> (Add Level) și la nivelul 2 alegi Media, descrescător;</li>
<li><strong>OK</strong>.</li></ol>
${fig('sortare-doua-criterii.webp',750,344,'Fereastra Sort din Excel cu butonul Add Level și două niveluri: Clasa de la A la Z, apoi Nota de la mare la mic','Fereastra <b>Sortare (Sort)</b> cu două niveluri.')}`,
   exemplu:`${fig('tabel-sortat.webp',600,280,'Tabel în Excel sortat întâi după clasă de la A la Z, apoi după notă descrescător','Rezultatul: întâi o clasă, cu notele de la mare la mic, apoi cealaltă.')}`,
   incearca:{t:'excel',q:'Ordonează tabelul pe clase: întâi <b>Clasa</b> (A→Z), iar în fiecare clasă elevii în <b>ordine alfabetică</b> (Elev, A→Z). Folosește Date → <b>Sortare particularizată</b>, cu două niveluri.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'B',ord:'asc'},{col:'A',ord:'asc'}]},gest:['sortare-dlg']},ajutor:'Nivelul 1: Clasa, A→Z. Apoi Adăugare nivel. Nivelul 2: Elev, A→Z. OK.',why:'Întâi VIII A (Carmen, Dan, Elena), apoi VIII B (Ana, Bogdan).'},
   inca:[
    {t:'choice',q:'În Sortare particularizată, ce face butonul <b>Adăugare nivel</b> (Add Level)?',o:['Adaugă un al doilea criteriu de sortare','Adaugă un rând nou în tabel','Adaugă o foaie nouă în registru','Sortează din nou același criteriu'],ok:0,ajutor:'Recitește pasul 4 din listă.',why:'Fiecare nivel e un criteriu. Al doilea nivel ordonează în interiorul grupelor făcute de primul.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Pe clase, apoi după medie',
  intro:`<p><strong>Sarcina:</strong> ordonează tabelul întâi pe <b>clase</b> (A→Z), iar în fiecare clasă de la <b>media cea mai mare</b>. Folosește <strong>Sortare particularizată (Custom Sort)</strong> cu două niveluri, ca în pasul 3.</p>`,
  q:'Sortare cu două niveluri: Clasa crescător, apoi Media descrescător.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'B',ord:'asc'},{col:'C',ord:'desc'}]},gest:['sortare-dlg']},ajutor:'Date → Sortare particularizată. Nivelul 1: Clasa, A→Z. Adăugare nivel. Nivelul 2: Media, Z→A. OK.',why:'VIII A vine prima, cu elevii ordonați după medie, apoi VIII B.',
  inca:[
   {t:'excel',q:'Încă una: ordonează de la cea mai <b>mică</b> medie la cea mai mare.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'C',ord:'asc'}]}},ajutor:'De la mic la mare: A→Z, pe coloana Media.',why:'Crescător pe Media: Bogdan (6,75) primul.'}
  ]},
 qs:[
  {t:'choice',q:'Pe o coloană cu numere, Z→A pune valorile…',o:['de la cea mai mare la cea mai mică','de la cea mai mică la cea mai mare','în ordine alfabetică','la întâmplare'],ok:0,why:'Z→A e descrescător: de la mare la mic.'},
  {t:'excel',q:'Pune elevii în <b>ordine alfabetică</b> după nume.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'A',ord:'asc'}]}},why:'A→Z pe coloana Elev; rândurile se mută întregi.'},
  {t:'tf',q:'E bine să selectezi doar coloana cu medii și să alegi „Continuă cu selecția curentă”.',ok:false,ajutor:'Ce se întâmplă cu numele elevilor?',why:'Fals. Mediile s-ar muta fără nume: fiecare elev ar primi media altcuiva.'},
  {t:'order',q:'Pune în ordine pașii pentru o sortare după două criterii.',items:['Alegi o celulă din tabel','Date → Sortare particularizată (Custom Sort)','Nivelul 1: prima coloană și ordinea','Adăugare nivel (Add Level) și a doua coloană','OK'],ajutor:'Urmează lista din pasul 3.',why:'Nivelurile se aplică în ordine: întâi primul criteriu, apoi al doilea în interiorul lui.'},
  {t:'choice',q:'Unde găsești butoanele de sortare?',o:['În fila Date (Data)','În fila Inserare (Insert)','În caseta de nume','Pe bara de stare'],ok:0,why:'Sortarea e în fila Date (Data).'}
 ]},

/* ================= 10. Graficul potrivit (lecțiile 11, 12) ================= */
{t:'Graficul potrivit',lectii:[11,12],continuturi:[P.grafice,P.serii],
 obiectiv:'alegi tipul de grafic după întrebare, îl faci din datele cu etichete și îi pui titlu.',
 pasi:[
  {t:'Un grafic se face din date cu etichete',
   text:`<p>Un <mark>grafic</mark> (diagramă, chart) arată numerele ca desen, ca să le compari dintr-o privire. Pașii:</p>
<ol><li>selectezi datele <strong>împreună cu etichetele</strong>: numele și capul de tabel;</li>
<li>fila <strong>Inserare (Insert)</strong>, grupul de diagrame (Charts);</li>
<li>alegi tipul de grafic.</li></ol>
<p>Fără etichete, graficul n-ar ști cum să numească barele.</p>
${fig('inserare-diagrame.webp',1000,160,'Fila Insert (Inserare) din Excel, cu grupul Charts (Diagrame) și butoanele tipurilor de grafic','Fila <b>Inserare (Insert)</b>, grupul de diagrame.')}`,
   incearca:{t:'excel',q:'Fă un grafic <b>cu coloane</b> din notele elevilor: selectează <b>A1:B6</b> și Inserare → Coloane (Column).',cols:4,rows:7,cells:NOTE,verifica:{grafic:{tip:'column',zona:'A1:B6'}},ajutor:'Zona începe cu A1, ca să prindă și numele, și capul de tabel.',why:'Zona A1:B6 are numele (etichetele) și notele.'},
   inca:[
    {t:'choice',q:'Ce selectezi înainte să faci graficul notelor?',o:['Numele și notele, cu capul de tabel','Doar notele, fără nume','Doar capul de tabel','O singură celulă goală'],ok:0,ajutor:'Graficul are nevoie de etichete.',why:'Cu etichetele, graficul știe cui aparține fiecare bară.'}
   ]},
  {t:'Alegi tipul după întrebare (strategie)',
   text:`<p>Înainte să apeși, întreabă-te <strong>ce vrei să arăți</strong>:</p>
<ul><li>„Cine are mai mult?” — compari valori între ele: <mark>coloane</mark> (Column);</li>
<li>„Cum s-a schimbat în timp?” — zile, luni, ani: <mark>linie</mark> (Line);</li>
<li>„Din ce e format întregul?” — părțile unui buget: <mark>radială</mark> (Pie).</li></ul>`,
   altfel:`<p>Coloanele sunt ca niște turnuri puse unul lângă altul: vezi imediat care e mai înalt. Linia e ca drumul pe un munte: urci și cobori în timp. Radiala e ca o pizza tăiată în felii: fiecare felie e o parte din întreg.</p>`,
   incearca:{t:'classify',q:'Ce grafic se potrivește?',cats:['Coloane','Linie','Radială'],items:[['Notele a 5 elevi',0],['Temperatura pe 7 zile',1],['Din ce e format bugetul pe o săptămână',2],['Elevii pe ani, de la 2020 la 2026',1]],ajutor:'Comparație, timp sau părți din întreg?',why:'Comparația = coloane, schimbarea în timp = linie, părțile întregului = radială.'},
   inca:[
    {t:'choice',q:'Vrei să arăți cum a crescut numărul de elevi de la un an la altul, pe 5 ani. Ce grafic alegi?',o:['Linie (Line)','Radială (Pie)','Niciun grafic','Doar un tabel'],ok:0,ajutor:'Anii sunt timp.',why:'Pentru schimbarea în timp alegi linia.'}
   ]},
  {t:'Serii de date și titlul',
   text:`<p>O <mark>serie de date</mark> e un șir de numere din aceeași coloană (sau din același rând). Fiecare serie are <strong>culoarea ei</strong> și apare în <strong>legendă</strong>.</p>
<p>Dacă selectezi două coloane de note, Nota 1 și Nota 2, graficul are <strong>două serii</strong>, cu două culori.</p>
<p>La final, dai clic pe titlul graficului (la început scrie „Chart Title”) și scrii ce arată graficul.</p>
${fig('grafic-plante.webp',1000,389,'Excel: datele a trei plante cu etichete și graficul cu coloane făcut din ele, cu titlu și legendă jos','Trei serii (trei culori), titlu sus, legendă jos.')}`,
   incearca:{t:'excel',q:'Încearcă: selectează <b>A1:C6</b> (două coloane de note) și fă un grafic cu coloane. Câte serii de date (culori în legendă) are?',cols:4,rows:7,cells:NOTE,o:['2','1','5','6'],ok:0,ajutor:'Câte coloane de numere ai selectat?',why:'Fiecare coloană de numere e o serie: Nota 1 și Nota 2.'},
   inca:[
    {t:'excel',q:'Temperatura pe zile: fă un grafic <b>linie</b> din <b>A1:B7</b> și scrie titlul <code>Temperatura pe zile</code>.',cols:4,rows:8,cells:TEMP,verifica:{grafic:{tip:'line',zona:'A1:B7',titlu:'Temperatura pe zile'}},ajutor:'După ce apare graficul, apasă pe titlu și scrie.',why:'Linia arată cum urcă și coboară temperatura de la o zi la alta.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Bugetul pe o săptămână',
  intro:`<p><strong>Sarcina:</strong> arată din ce e format bugetul. Alege tipul potrivit (părți dintr-un întreg), fă graficul din <b>A1:B5</b> și dă-i titlul <code>Cheltuieli</code>.</p>`,
  q:'Grafic radial din A1:B5, cu titlul Cheltuieli.',cols:4,rows:6,cells:BANI,verifica:{grafic:{tip:'pie',zona:'A1:B5',titlu:'Cheltuieli'}},ajutor:'Selectezi A1:B5, Inserare → Radială (Pie), apoi clic pe titlu.',why:'Graficul radial arată cât din întreg înseamnă fiecare cheltuială.',
  inca:[

  ]},
 qs:[
  {t:'choice',q:'Vrei să arăți cum s-a schimbat temperatura în fiecare zi a săptămânii. Ce grafic alegi?',o:['Linie (Line)','Radială (Pie)','Niciun grafic','Doar un tabel'],ok:0,why:'Schimbarea în timp se arată cu linia.'},
  {t:'excel',q:'Fă un grafic <b>cu coloane</b> din <b>A1:C6</b>.',cols:4,rows:7,cells:NOTE,verifica:{grafic:{tip:'column',zona:'A1:C6'}},why:'Coloanele compară notele; zona are și etichetele.'},
  {t:'classify',q:'Ce grafic se potrivește?',cats:['Coloane','Linie','Radială'],items:[['Punctele echipelor la un concurs',0],['Înălțimea unei plante, săptămână de săptămână',1],['Cum își împarte clasa banii strânși',2],['Câte mere a cules fiecare echipă',0]],why:'Comparație = coloane, timp = linie, părți din întreg = radială.'},
  {t:'choice',q:'Ce este o serie de date?',o:['Un șir de numere din aceeași coloană, cu culoarea lui','Titlul scris deasupra graficului','Tipul graficului: coloane, linie sau radială','Fila Inserare (Insert), cu diagramele'],ok:0,why:'Fiecare serie are culoarea ei și apare în legendă.'},

/* ================= 11. Recapitulare (lecțiile 7, 8, 9) ================= */
{t:'Situația clasei (recapitulare)',lectii:[7,8,9],continuturi:[P.formule,P.functii,P.editare],final:true,
 obiectiv:'faci singur, de la cap la coadă, situația clasei: medii, verdict cu IF și statistici sub tabel.',
 pasi:[
  {t:'Planul unui tabel adevărat (strategie)',
   text:`<p>Un tabel ca cel de la dirigenție se face în <strong>cinci pași</strong>, mereu în aceeași ordine:</p>
<ol><li><strong>datele</strong>: nume și note, cu cap de tabel;</li>
<li><strong>formula</strong> pentru primul elev, de exemplu media <code>=(B2+C2)/2</code>, cu adresele puse cu mouse-ul;</li>
<li><mark>trasă în jos</mark> pentru toți elevii;</li>
<li><strong>funcțiile</strong> sub tabel (AVERAGE, MAX…) și <strong>decizia</strong> cu IF;</li>
<li><strong>verificarea</strong>: schimbi o notă și te uiți că totul se refac singur.</li></ol>`,
   incearca:{t:'order',q:'Pune pașii în ordine.',items:['Scrii datele cu cap de tabel','Scrii formula pentru primul elev','O tragi în jos pentru toți','Pui funcțiile și IF','Schimbi o notă și verifici'],ajutor:'Nu poți trage o formulă care nu există încă.',why:'Datele, formula, tragerea, funcțiile, verificarea.'},
   inca:[
    {t:'choice',q:'Schimbi Nota 1 a lui Dan din 7 în 9. Ce se întâmplă cu media lui și cu media clasei?',o:['Se recalculează singure','Trebuie scrise din nou','Se schimbă doar media lui','Nu se schimbă nimic'],ok:0,ajutor:'Sunt formule cu adrese.',why:'Formulele cu adrese se recalculează singure.'}
   ]},
  {t:'Formule care lucrează pe formule',
   text:`<p>O funcție poate lucra pe o coloană care e ea însăși calculată. Media clasei e <code>=AVERAGE(D2:D6)</code>, unde D2:D6 sunt mediile elevilor, făcute cu formule.</p>
<p>La fel, IF poate lua decizia pe medie: <code>=IF(D2&gt;=5;"promovat";"corigent")</code>, pe setări românești.</p>
<p>Totul e legat: schimbi o notă → se schimbă media elevului → verdictul lui → media clasei.</p>`,
   exemplu:`${grila([['Elev','Nota 1','Nota 2','Media','Situația'],['Ana','8','9','8,5','promovat'],['Bogdan','5','6','5,5','promovat'],['Carmen','10','9','9,5','promovat'],['Dan','7','4','5,5','promovat'],['Elena','6','8','7','promovat'],['','','Media clasei','7,2','']],{sel:['D7'],fx:['D7','=AVERAGE(D2:D6)']})}`,
   altfel:`<p>E ca un șir de piese de domino: împingi prima (schimbi o notă) și cad singure toate celelalte (media, verdictul, media clasei).</p>`,
   incearca:{t:'excel',q:'Sub tabel: în <b>D7</b> media clasei, din mediile D2:D6. Selectează zona trăgând.',cols:6,rows:8,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2',D3:'=(B3+C3)/2',D4:'=(B4+C4)/2',D5:'=(B5+C5)/2',D6:'=(B6+C6)/2',C7:'Media clasei'},mod:'ro',verifica:{formule:{D7:'=AVERAGE(D2:D6)'}},ajutor:'=AVERAGE(, tragi de la D2 la D6, Enter.',why:'=AVERAGE(D2:D6) lucrează pe mediile calculate.'},
   inca:[
    {t:'excel',q:'În <b>D8</b> pune cea mai mare medie.',cols:6,rows:9,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2',D3:'=(B3+C3)/2',D4:'=(B4+C4)/2',D5:'=(B5+C5)/2',D6:'=(B6+C6)/2',C8:'Maxim'},mod:'ro',verifica:{formule:{D8:'=MAX(D2:D6)'}},ajutor:'Cea mai mare = MAX.',why:'=MAX(D2:D6): Carmen, 9,5.'}
   ]}
 ],
 atelier:{t:'excel',titlu:'Situația clasei, de la zero',

/* ================= 12. Bonus: adrese fixe (lecțiile 7, 8; în afara programei) ================= */
{t:'Bonus: adrese fixe cu $ și F4 (în afara programei)',lectii:[7,8],continuturi:[P.formule,P.editare],
 obiectiv:'fixezi o adresă cu $ (sau cu F4), ca să nu se mute când tragi formula.',
 pasi:[
  {t:'Când adresa NU trebuie să se mute',
   text:`<p>Știi deja că adresele se mută la tragere. De obicei asta e bine. Dar uneori toate rândurile trebuie să folosească <mark>aceeași celulă</mark>.</p>
<p>Exemplu: cota de TVA stă o singură dată, în <code>F1</code>. Scrii în C2 <code>=B2*F1</code> și tragi în jos. În C3 ajunge <code>=B3*F2</code>: F1 a coborât și el, în F2, care e goală. Rezultatul iese 0.</p>`,
   exemplu:`${grila([['Produs','Preț','TVA','','Cota TVA','0,19'],['Caiet','4','0,76'],['Pix','2','0']],{sel:['C3'],fx:['C3','=B3*F2']})}<p>C3 arată 0: formula caută cota în F2, care e goală.</p>`,
   incearca:{t:'choice',q:'<code>=B2*F1</code> (fără $) din C2 e trasă în jos până la C3. Ce ajunge în C3?',o:['=B3*F2','=B3*F1','=B2*F1','=B3*$F$1'],ok:0,ajutor:'Fără $, ambele adrese coboară cu un rând.',why:'Ambele adrese coboară. F2 e goală, deci TVA-ul iese 0.'},
   inca:[
    {t:'tf',q:'Dacă toate produsele folosesc aceeași cotă din F1, adresa F1 trebuie să rămână pe loc la tragere.',ok:true,why:'Adevărat. Altfel coboară în F2, F3…, care sunt goale.'}
   ]},
  {t:'Semnul $ și tasta F4',
   text:`<p>Semnul <code>$</code> ține adresa pe loc: <code>$F$1</code> e o <strong>adresă absolută</strong>. Dolarul din fața literei fixează coloana, cel din fața cifrei fixează rândul.</p>
<p>Nu trebuie să-l tastezi: după ce ai pus adresa în formulă, apeși <kbd>F4</kbd>. La fiecare apăsare:</p>
<p><code>F1</code> → <code>$F$1</code> → <code>F$1</code> → <code>$F1</code> → iar <code>F1</code>.</p>
<p>Acum <code>=B2*$F$1</code> trasă în jos devine <code>=B3*$F$1</code>: B se mută, F1 rămâne.</p>`,
   altfel:`<p>$ e ca o piuneză: adresa fără piuneză alunecă odată cu formula, adresa cu piuneză rămâne prinsă acolo unde ai pus-o.</p>`,
   incearca:{t:'excel',q:'Încearcă: în <b>C2</b> scrie <code>=B2*F1</code> (fără Enter!) și apasă <kbd>F4</kbd> o dată, cu cursorul lângă F1. Ce apare în bara de formule? (Poți apăsa F4 de mai multe ori să vezi toată rotația, apoi Esc.)',cols:6,rows:4,cells:{A1:'Produs',B1:'Preț',C1:'TVA',E1:'Cota',F1:0.19,A2:'Caiet',B2:4},o:['=B2*$F$1','=B2*F$1','=B2*$F1','=$B$2*F1'],ok:0,ajutor:'Prima apăsare pune $ în ambele locuri.',why:'Prima apăsare pe F4 dă $F$1; următoarele dau F$1, apoi $F1, apoi iar F1.'},
   inca:[
    {t:'choice',q:'Ce ajunge în C5 dacă tragi <code>=B2*$F$1</code> din C2 până la C5?',o:['=B5*$F$1','=B5*$F$4','=B2*$F$1','=B5*F4'],ok:0,ajutor:'Care adresă are $ și care nu?',why:'B2 se mută în B5; $F$1 rămâne pe loc.'}
   ]},
  {t:'Cum lucrezi cu o adresă fixă (strategie)',
   text:`<ol><li>Scrii formula pentru primul rând: <code>=B2*</code>, apoi apeși pe celula fixă, F1.</li>
<li>Imediat apeși <kbd>F4</kbd>: apare <code>$F$1</code>.</li>
<li><kbd>Enter</kbd>, apoi tragi formula în jos.</li>
<li><strong>Verifici</strong> ultima celulă în bara fx: B-ul trebuie să fie de pe rândul ei, iar <code>$F$1</code> neschimbat.</li></ol>`,
   incearca:{t:'excel',q:'În <b>C2</b> calculează TVA-ul caietului: <code>=B2*</code>, apasă pe <b>F1</b>, apasă <kbd>F4</kbd> (apare $F$1), <kbd>Enter</kbd>.',cols:6,rows:6,cells:TVA,verifica:{formule:{C2:'=B2*$F$1'},gest:['f4']},ajutor:'F4 trebuie apăsat imediat după ce ai pus F1 în formulă.',why:'$F$1 va rămâne pe loc când tragi.'}}
 ],

 qs:[

  {t:'excel',q:'Încearcă: în <b>C2</b> scrie <code>=B2*F1</code> (fără Enter!) și apasă <kbd>F4</kbd> o dată. Ce apare în bara de formule?',cols:6,rows:4,cells:{A1:'Produs',B1:'Preț',C1:'TVA',E1:'Cota',F1:0.19,A2:'Caiet',B2:4},o:['=B2*$F$1','=B2*F$1','=B2*$F1','=$B$2*F1'],ok:0,why:'Prima apăsare pe F4 pune $ și la coloană, și la rând: $F$1.'},
  {t:'choice',q:'Care adresă rămâne pe loc oricum ai trage formula?',o:['$F$1','F1','F$1','$F1'],ok:0,ajutor:'Dolar în fața literei ȘI în fața cifrei.',why:'$F$1 are și coloana, și rândul fixate.'},
  {t:'excel',q:'În <b>C2</b>: <code>=B2*$F$1</code> (cu F4), apoi trage până la <b>C5</b>.',cols:6,rows:6,cells:TVA,verifica:{formule:{C2:'=B2*$F$1'},umplut:{C2:['C3','C4','C5']}},why:'Toate produsele folosesc cota din F1.'}
 ]}

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Mesaj Sigur</title>
<meta name="description" content="Lecție-joc pentru clasa a VI-a, pe pași: antivirus, parole și date personale, adresa de e-mail, răspuns și redirecționare, dosare și netichetă, mesajul-capcană — cu o cutie poștală simulată în care exersezi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Code:wght@500;600&display=swap">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#F1EEF3; --paper:#FFFFFF; --paper2:#F4F0F6; --line:#DCD3E0;
  --ink:#231A2A; --ink2:#66596E; --accent:#8A2F6E; --accentInk:#FFFFFF; --sel:#F2DDEA;
  --mark:#FFD9A8; --markInk:#231A2A; --ok:#1F7A4D; --okbg:#E2F3E8; --bad:#C0392B; --badbg:#FBE7E4;
  --fd:"Sora","Segoe UI",system-ui,sans-serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"Fira Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#151118; --paper:#1F1924; --paper2:#2A222F; --line:#3A3040;
  --ink:#EDE6F0; --ink2:#AA9DB2; --accent:#E48AC6; --accentInk:#151118; --sel:#4A2640;
  --mark:#F0B872; --markInk:#231A2A; --ok:#62CF95; --okbg:#16301F; --bad:#FF8177; --badbg:#3B1F1D;
}}
:root[data-theme="dark"]{
  --desk:#151118; --paper:#1F1924; --paper2:#2A222F; --line:#3A3040;
  --ink:#EDE6F0; --ink2:#AA9DB2; --accent:#E48AC6; --accentInk:#151118; --sel:#4A2640;
  --mark:#F0B872; --markInk:#231A2A; --ok:#62CF95; --okbg:#16301F; --bad:#FF8177; --badbg:#3B1F1D;
}
/* tema jocului: bara de adresă a unui browser, cu lacăt desenat doar din CSS */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;font-family:var(--fm);font-size:.72rem;color:var(--ink2)}
.bb-dots{flex:none;display:flex;gap:5px}
.bb-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.bb-dots i:first-child{background:var(--accent)}
.bb-url{flex:1 1 auto;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-url b{color:var(--ink);font-weight:600}
.lacat{display:inline-block;position:relative;width:8px;height:6px;margin:0 7px 0 1px;background:var(--ok);border-radius:1px;vertical-align:-1px}
.lacat::before{content:"";position:absolute;left:1px;bottom:5px;width:4px;height:4px;border:1.5px solid var(--ok);border-bottom:0;border-radius:4px 4px 0 0}
h1 .at{color:var(--accent);font-family:var(--fm);font-weight:600}
.hunt{font-family:var(--fm);font-size:.98rem}
.hunt .tk{text-align:left}

/* ===== simulatorul „cutia poștală” (joc-mail.test) și testerul de parole ===== */
.px{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden;font-size:.95rem}
.px-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--accent);color:var(--accentInk);font-family:var(--fm);font-size:.8rem}
.px-top b{font-weight:600}
.px-msg,.px-comp{padding:10px 12px;border-bottom:1px solid var(--line)}
.px-row{font-size:.88rem;color:var(--ink2);overflow-wrap:anywhere}
.px-row b{color:var(--ink);font-weight:600}
.px-corp{margin:8px 0;padding:8px 10px;background:var(--paper2);border-radius:6px;line-height:1.45;overflow-wrap:anywhere}
.px-h{font-family:var(--fd);font-weight:600;margin:0 0 8px}
.px-act,.px-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.px-b{font:inherit;font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.px-b.on{background:var(--sel);border-color:var(--accent);font-weight:600}
.px-f{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.px-f span{flex:none;width:4.6em;color:var(--ink2);font-size:.88rem}
.px-f input,.px-comp textarea{flex:1 1 auto;min-width:0;width:100%;font:inherit;color:var(--ink);background:transparent;border:0;padding:6px 2px;outline:none}
.px-f input:focus,.px-comp textarea:focus{background:var(--paper2)}
.px-comp textarea{display:block;margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;box-sizing:border-box}
.px-sug{display:flex;flex-direction:column;gap:4px;padding:6px 0}
.px-sug button{font:inherit;font-size:.86rem;text-align:left;padding:6px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--sel);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.px-chip{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper2);font-family:var(--fm);font-size:.8rem;max-width:100%;overflow-wrap:anywhere}
.px-chip button{font:inherit;border:0;background:none;color:var(--bad);cursor:pointer;padding:0 2px}
.px-files{margin-top:8px;padding:8px;border:1px dashed var(--line);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px}
.px-lbl{width:100%;font-size:.8rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.px-file{font-family:var(--fm);font-size:.82rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.px-clip svg{width:14px;height:14px}
.px-muta{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr)}
@media (max-width:560px){.px-muta{grid-template-columns:minmax(0,1fr)}.px-dos{flex-direction:row;flex-wrap:wrap;border-right:0!important;border-bottom:1px solid var(--line)}}
.px-dos{display:flex;flex-direction:column;gap:2px;padding:8px;border-right:1px solid var(--line);background:var(--paper2)}
.px-d{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:5px;font-size:.88rem}
.px-d b{color:var(--accent)}
.px-list{list-style:none;margin:0;padding:0}
.px-it{padding:9px 12px;border-bottom:1px solid var(--line)}
.px-it-h{font-size:.85rem;overflow-wrap:anywhere}
.px-it-s{font-weight:600;margin:2px 0}
.px-it-p{font-size:.86rem;color:var(--ink2);overflow-wrap:anywhere}
.px-mv{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.85rem;color:var(--ink2)}
.px-mv select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.px-teste{padding:10px 12px;background:var(--paper2)}
.px-teste ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.px-teste li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.px-teste li .s{flex:none;width:1.4em;text-align:center;font-weight:700}
.px-teste li.ok .s{color:var(--ok)} .px-teste li.rau .s{color:var(--bad)}
.pw{display:grid;gap:8px}
.pw-warn{margin:0;font-size:.88rem;color:var(--ink2)}
.pw .px-f{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--paper)}
.pw .px-f input{font-family:var(--fm)}
.pw-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pw-bar i{display:block;height:100%;width:0;background:var(--bad);transition:width .2s}
.pw-l{font-size:.9rem;color:var(--ink2)}
.pw-l b{color:var(--ink)}
.pw .px-teste{border:1px solid var(--line);border-radius:8px}
.email-pre{white-space:pre-wrap!important;overflow-wrap:anywhere}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script>
/* MISIUNEA MESAJ SIGUR, rescrisă PE PAȘI (26.09.2026).
   Profesorul: „informația e prea condensată — nu e beginner friendly — e mai mult test decât asistență de învățare”;
   „posibilitatea efectivă a exersării — simulare a aplicației adevărate”; „evaluare neconformă cu ce s-a predat”.
   De aceea: fiecare nivel = pași mici (o idee, „Uite cum”, „Explică-mi altfel”, exercițiu cu indiciu și variante),
   un ATELIER în cutia poștală simulată (joc-mail.test) sau în testerul de parole, cu TESTE bifate, apoi verificarea
   — numai pe ce au spus pașii. Simulatoarele: `posta` (compune / răspunde / redirecționează / mută în dosare) și `parola`. */
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pre=s=>`<pre class="email-pre">${X(s)}</pre>`;
const fig=(f,w,h,alt,cap,dir)=>{const p=`../${dir||'internet-vi'}/img/${f}`;return `<figure class="captura"><a href="${p}" target="_blank"><img src="${p}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`};

/* conținuturile programei, textul exact din curriculum.json */
const P={
  antivirus:'Măsuri de siguranță în utilizarea Internetului (de exemplu, utilizarea programelor de tip antivirus)',
  date:'Protecția datelor personale în comunicarea prin Internet(de exemplu, construcția și protejarea parolelor, identitatea virtuală)',
  email:'Poșta electronică (email): conturi, adresă de poștă electronică, structura unui mesaj transmis prin poșta electronică',
  operatii:'Operații specifice cu mesaje electronice: deschidere, compunere, trimitere, răspuns, redirecționare, atașarea unui fișier',
  dosare:'Dosare cu mesaje, agendă de utilizatori',
  neticheta:'Reguli de comunicare în mediul online (netichetă): formule de adresare, reguli de scriere'
};

/* ================= SIMULATORUL: cutia poștală joc-mail.test ================= */
const CLIP='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>';
const lista=s=>String(s||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
const ADR=a=>/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(a);
const litere=w=>w.replace(/[^A-Za-zĂÂÎȘȚăâîșțŞŢşţ]/g,'');
const striga=t=>String(t).split(/\s+/).some(w=>{const l=litere(w);return l.length>=4&&l===l.toUpperCase()&&l!==l.toLowerCase()});
const TESTE={
  actiune:(s,v)=>s.actiune===v,
  catre:(s,v)=>lista(s.catre).sort().join(',')===lista(v).sort().join(','),
  catreValid:s=>{const l=lista(s.catre);return l.length>0&&l.every(ADR)},
  subiect:(s,v)=>{const t=s.subiect.trim().replace(/^(re|fw|fwd):\s*/i,'');return t.length>=(v||3)},
  incepe:(s,v)=>s.subiect.trim().toLowerCase().startsWith(String(v).toLowerCase()),
  corp:(s,v)=>s.corp.trim().length>=(v||10),
  salut:s=>/^\s*(bună ziua|buna ziua|bună seara|bună|buna|salut|dragă|draga|stimat)/i.test(s.corp),
  incheiere:s=>/(mulțumesc|mulţumesc|multumesc|cu respect|o zi bună|o zi buna|toate cele bune|pe curând|pe curand)/i.test(s.corp),
  calm:s=>!striga(s.subiect+' '+s.corp)&&!/[!?]{3,}/.test(s.subiect+' '+s.corp),
  atas:(s,v)=>s.atas.includes(v),
  faraAtas:s=>s.atas.length===0,
  loc:(s,v)=>s.dosar[v[0]]===v[1]
};
const JocPosta={
  render(Q,body,api){
    const esc=api.esc,st={actiune:null,catre:'',subiect:'',corp:'',atas:[],dosar:{}};
    const muta=Q.mod==='muta',dosare=Q.dosare||['Primite','Spam'];
    let checks=Q.checks||[];
    if(muta){(Q.mesaje||[]).forEach((m,i)=>st.dosar[i]='Primite');
      checks=Q.mesaje.map((m,i)=>({c:'loc',v:[i,m.dosar],ce:`„${esc(m.subiect)}” e în dosarul potrivit`}))}
    let h=`<div class="px"><div class="px-top"><span>https://<b>joc-mail.test</b></span><span>${esc(Q.eu||'tu@joc-mail.test')}</span></div>`;
    if(muta){
      h+=`<div class="px-muta"><div class="px-dos">${dosare.map(d=>`<div class="px-d" data-d="${esc(d)}"><span>${esc(d)}</span><b>0</b></div>`).join('')}</div>
      <ul class="px-list">${Q.mesaje.map((m,i)=>`<li class="px-it"><div class="px-it-h">De la: <b>${esc(m.de)}</b></div><div class="px-it-s">${esc(m.subiect)}</div><div class="px-it-p">${esc(m.text||'')}</div>
      <label class="px-mv">Mută în <select data-i="${i}">${dosare.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}</select></label></li>`).join('')}</ul></div>`;
    }else{
      if(Q.mesaj){const m=Q.mesaj;
        h+=`<div class="px-msg"><div class="px-h">Mesaj primit</div><div class="px-row"><b>De la:</b> ${esc(m.de)}</div><div class="px-row"><b>Către:</b> ${esc(m.catre)}</div><div class="px-row"><b>Subiect:</b> ${esc(m.subiect)}</div>
        <div class="px-corp">${esc(m.corp).replace(/\n/g,'<br>')}</div>${m.atas?`<span class="px-chip">${CLIP} ${esc(m.atas)}</span>`:''}
        <div class="px-act"><button type="button" class="px-b" data-a="raspunde">Răspunde</button><button type="button" class="px-b" data-a="tuturor">Răspunde tuturor</button><button type="button" class="px-b" data-a="redirectioneaza">Redirecționează</button></div></div>`}
      h+=`<div class="px-comp"${Q.mesaj?' hidden':''}><div class="px-h">Mesaj nou</div>
      <label class="px-f"><span>Către</span><input type="text" data-f="catre" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="px-sug" hidden></div>
      <label class="px-f"><span>Subiect</span><input type="text" data-f="subiect" autocomplete="off"></label>
      <textarea data-f="corp" rows="5" aria-label="Textul mesajului" placeholder="Scrie aici textul mesajului…"></textarea>
      <div class="px-atas"></div>
      ${Q.fisiere?`<div class="px-tools"><button type="button" class="px-b px-clip">${CLIP} Atașează</button></div>
      <div class="px-files" hidden><div class="px-lbl">Alege fișierul de pe calculator</div>${Q.fisiere.map(f=>`<button type="button" class="px-file" data-file="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}</div>`}
    h+=`<div class="px-teste"><div class="px-lbl">Testele sarcinii · <span class="nr">0 din ${checks.length} trec</span></div><ol>${checks.map((c,i)=>`<li data-i="${i}"><span class="s">○</span><span>${c.ce}</span></li>`).join('')}</ol></div></div>`;
    body.innerHTML=h;
    const $=s=>body.querySelector(s),comp=$('.px-comp');
    const inp=f=>body.querySelector(`[data-f="${f}"]`);
    function citeste(){if(muta){body.querySelectorAll('select[data-i]').forEach(s=>st.dosar[+s.dataset.i]=s.value);return}
      ['catre','subiect','corp'].forEach(f=>st[f]=inp(f).value)}
    function scrie(){if(muta){body.querySelectorAll('select[data-i]').forEach(s=>s.value=st.dosar[+s.dataset.i]);return}
      ['catre','subiect','corp'].forEach(f=>inp(f).value=st[f]);
      $('.px-atas').innerHTML=st.atas.map((a,k)=>`<span class="px-chip">${CLIP} ${esc(a)} <button type="button" data-k="${k}" aria-label="Scoate atașamentul">×</button></span>`).join('');
      $('.px-atas').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.atas.splice(+b.dataset.k,1);scrie();upd(false)})}
    function upd(arata){citeste();
      if(muta)body.querySelectorAll('.px-d').forEach(d=>d.querySelector('b').textContent=Object.values(st.dosar).filter(x=>x===d.dataset.d).length);
      const rez=checks.map(c=>!!TESTE[c.c](st,c.v));
      rez.forEach((ok,i)=>{const li=body.querySelector(`.px-teste li[data-i="${i}"]`);li.className=ok?'ok':(arata?'rau':'');li.querySelector('.s').textContent=ok?'✓':(arata?'✗':'○')});
      $('.px-teste .nr').textContent=`${rez.filter(Boolean).length} din ${rez.length} trec`;return rez}
    function alege(a){const m=Q.mesaj;st.actiune=a;comp.hidden=false;
      body.querySelectorAll('.px-act .px-b').forEach(b=>b.classList.toggle('on',b.dataset.a===a));
      const eu=String(Q.eu||'').toLowerCase();
      if(a==='raspunde'){st.catre=m.de;st.subiect='Re: '+m.subiect;st.atas=[];comp.querySelector('.px-h').textContent='Răspunzi doar expeditorului'}
      else if(a==='tuturor'){st.catre=[m.de].concat(lista(m.catre).filter(x=>x!==eu)).join(', ');st.subiect='Re: '+m.subiect;st.atas=[];comp.querySelector('.px-h').textContent='Răspunzi tuturor'}
      else{st.catre='';st.subiect='Fw: '+m.subiect;st.atas=m.atas?[m.atas]:[];comp.querySelector('.px-h').textContent='Redirecționezi mesajul'}
      st.corp='';scrie();upd(false)}
    function aplica(sol){
      if(muta){Q.mesaje.forEach((m,i)=>st.dosar[i]=(sol.dosar||{})[i]||'Primite');scrie();return upd(false)}
      if(sol.actiune&&Q.mesaj)alege(sol.actiune);
      ['catre','subiect','corp'].forEach(f=>{if(sol[f]!=null)st[f]=sol[f]});
      if(sol.atas)st.atas=sol.atas.slice();
      scrie();upd(false)}
    body._aplica=aplica;
    if(!muta){
      body.querySelectorAll('.px-act .px-b').forEach(b=>b.onclick=()=>alege(b.dataset.a));
      ['catre','subiect','corp'].forEach(f=>inp(f).addEventListener('input',()=>upd(false)));
      /* agenda: scrii câteva litere în Către și îți propune adresa întreagă */
      const sug=$('.px-sug');
      inp('catre').addEventListener('input',()=>{
        const v=inp('catre').value,parti=v.split(','),ult=parti[parti.length-1].trim().toLowerCase();
        const gasite=ult.length>=2?(Q.agenda||[]).filter(c=>c.nume.toLowerCase().includes(ult)||c.adresa.toLowerCase().startsWith(ult)).filter(c=>c.adresa.toLowerCase()!==ult):[];
        sug.hidden=!gasite.length;
        sug.innerHTML=gasite.map(c=>`<button type="button" data-a="${esc(c.adresa)}">${esc(c.nume)} &lt;${esc(c.adresa)}&gt;</button>`).join('');
        sug.querySelectorAll('button').forEach(b=>b.onclick=()=>{parti[parti.length-1]=(parti.length>1?' ':'')+b.dataset.a;inp('catre').value=parti.join(',');sug.hidden=true;upd(false)})});
      const clip=$('.px-clip');
      if(clip)clip.onclick=()=>{$('.px-files').hidden=!$('.px-files').hidden};
      body.querySelectorAll('.px-file').forEach(b=>b.onclick=()=>{citeste();if(!st.atas.includes(b.dataset.file))st.atas.push(b.dataset.file);$('.px-files').hidden=true;scrie();upd(false)});
    }else body.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>upd(false));
    upd(false);
    const nav=api.checkButton(()=>{
      const rez=upd(true),rau=rez.filter(x=>!x).length;
      if(!rau)api.resolve(true);
      else{api.resolve(false,`${rau===1?'Un test nu trece':rau+' teste nu trec'} (marcate cu ✗ în lista de teste). Repară și apasă din nou.`);
        api.revealButton(()=>{aplica(JocPosta._sol(Q));upd(true);nav.innerHTML='';api.giveUp(muta?'am mutat fiecare mesaj în dosarul lui.':'am completat mesajul corect; citește-l cu atenție mai sus.')})}
    },muta?'Verifică dosarele':'Trimite');
  },
  _sol(Q){if(Q.mod==='muta'){const d={};Q.mesaje.forEach((m,i)=>d[i]=m.dosar);return {dosar:d}}return Q.solutie},
  rezolva(Q,body){body._aplica(JocPosta._sol(Q))},
  gresit(Q,body){
    if(Q.mod==='muta'){body._aplica({dosar:{}});return}           // copilul lasă totul în Primite
    body._aplica(Object.assign({},Q.solutie,Q.gresit||{subiect:''}))
  }
};

/* ================= SIMULATORUL: testerul de parole ================= */
const TPAROLA={
  lung:(p,v)=>p.length>=v,
  mari:p=>/[A-ZĂÂÎȘȚ]/.test(p),
  mici:p=>/[a-zăâîșț]/.test(p),
  cifre:p=>/[0-9]/.test(p),
  simbol:p=>/[^A-Za-z0-9ĂÂÎȘȚăâîșț\s]/.test(p),
  nuContine:(p,v)=>v.every(x=>!p.toLowerCase().includes(String(x).toLowerCase()))
};
const JocParola={
  render(Q,body,api){
    const esc=api.esc,checks=Q.checks;
    body.innerHTML=`<div class="pw"><p class="pw-warn">Inventează o parolă de exersat. <b>Nu scrie aici parola ta adevărată</b> și nu o folosi pe cea din lecție.</p>
    <label class="px-f"><span>Parola</span><input type="text" class="pw-in" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(Q.start||'')}"></label>
    <div class="pw-bar" aria-hidden="true"><i></i></div><div class="pw-l">Tăria: <b>—</b> · <span class="pw-n">0</span> caractere</div>
    <div class="px-teste"><div class="px-lbl">Testele parolei · <span class="nr">0 din ${checks.length} trec</span></div><ol>${checks.map((c,i)=>`<li data-i="${i}"><span class="s">○</span><span>${c.ce}</span></li>`).join('')}</ol></div></div>`;
    const inp=body.querySelector('.pw-in');
    function upd(arata){const p=inp.value,rez=checks.map(c=>!!TPAROLA[c.c](p,c.v)),n=rez.filter(Boolean).length,f=n/rez.length;
      rez.forEach((ok,i)=>{const li=body.querySelector(`.px-teste li[data-i="${i}"]`);li.className=ok?'ok':(arata?'rau':'');li.querySelector('.s').textContent=ok?'✓':(arata?'✗':'○')});
      body.querySelector('.nr').textContent=`${n} din ${rez.length} trec`;body.querySelector('.pw-n').textContent=p.length;
      const bar=body.querySelector('.pw-bar i');bar.style.width=(p?Math.max(8,f*100):0)+'%';bar.style.background=f===1?'var(--ok)':f>=.6?'var(--accent)':'var(--bad)';
      body.querySelector('.pw-l b').textContent=!p?'—':f===1?'puternică':f>=.6?'medie':'slabă';return rez}
    body._pune=v=>{inp.value=v;upd(false)};
    inp.addEventListener('input',()=>upd(false));upd(false);
    const nav=api.checkButton(()=>{const rez=upd(true),rau=rez.filter(x=>!x).length;
      if(!rau)api.resolve(true);
      else{api.resolve(false,`${rau===1?'Un test nu trece':rau+' teste nu trec'} (marcate cu ✗). Schimbă parola și apasă din nou.`);
        api.revealButton(()=>{body._pune(Q.solutie);upd(true);nav.innerHTML='';api.giveUp(`o parolă care trece toate testele: <code>${esc(Q.solutie)}</code>. Fă-ți una a ta, după aceeași rețetă.`)})}
    },'Verifică parola');
  },
  rezolva(Q,body){body._pune(Q.solutie)},
  gresit(Q,body){body._pune(Q.gresit||'ana2014')}
};

/* ================= SIMULATORUL: Securitate Windows (Start → aplicație → pagina de protecție → Scanare rapidă) =================
   Numele din aplicație sunt cele din captura antivirus-scanare.webp; celelalte secțiuni ale aplicației nu sunt inventate. */
const JocScut={
  render(Q,body,api){
    const st={start:false,cauta:'',app:false,pag:false,scan:'nu',nr:''};
    const checks=[
      {c:s=>s.app,ce:'Ai deschis aplicația <b>Securitate Windows</b> din Start'},
      {c:s=>s.pag,ce:'Ai deschis pagina <b>Protecție antivirus și împotriva amenințărilor</b>'},
      {c:s=>s.scan==='gata',ce:'Ai pornit <b>Scanare rapidă</b> și ai așteptat să termine'},
      {c:s=>s.scan==='gata'&&s.nr.trim()==='0',ce:'Ai notat câte amenințări a găsit scanarea'}];
    let tmr=null;
    function ecran(){
      if(!st.app){
        const g=/^(secu|secur|securi|securit|securita|securitat|securitate|security)/i.test(st.cauta.trim())||/securitate w|windows sec/i.test(st.cauta);
        return `<div class="px-comp"><div class="px-h">Desktopul calculatorului</div>
        ${st.start?`<label class="px-f"><span>Caută</span><input type="text" data-f="cauta" autocomplete="off" spellcheck="false" placeholder="scrie numele aplicației" value="${api.esc(st.cauta)}"></label>
        <div class="px-sug"${g?'':' hidden'}><button type="button" data-go="app">🛡 Securitate Windows · Aplicație</button></div>`:'<p class="pw-warn">Meniul Start e închis.</p>'}
        <div class="px-tools"><button type="button" class="px-b${st.start?' on':''}" data-go="start">⊞ Start</button></div></div>`}
      if(!st.pag)return `<div class="px-comp"><div class="px-h">🛡 Securitate Windows</div>
        <p class="pw-warn">Alege secțiunea în care stă antivirusul:</p>
        <div class="px-tools"><button type="button" class="px-b" data-go="pag">🛡 Protecție antivirus și împotriva amenințărilor</button></div></div>`;
      const rez=st.scan==='gata'?`Momentan nu există amenințări.<br>Ultima scanare: acum (scanare rapidă)<br><b>0 amenințări găsite.</b><br>41523 fișiere scanate.`
        :st.scan==='merge'?'Scanare rapidă în curs… așteaptă să termine.':'Momentan nu există amenințări.<br>Ultima scanare: acum 8 zile (scanare rapidă)';
      return `<div class="px-comp"><div class="px-tools"><button type="button" class="px-b" data-go="inapoi" aria-label="Înapoi">←</button></div>
        <div class="px-h">Protecție antivirus și împotriva amenințărilor</div>
        <div class="px-row"><b>Amenințări curente</b></div><div class="px-corp" aria-live="polite">${rez}</div>
        <div class="px-tools"><button type="button" class="px-b" data-go="scan"${st.scan==='merge'?' disabled':''}>Scanare rapidă</button></div>
        <div class="px-row" style="margin-top:8px">Opțiuni de scanare · Amenințări permise · Istoric protecție</div>
        <label class="px-f" style="margin-top:8px"><span>Notează</span><input type="text" data-f="nr" inputmode="numeric" autocomplete="off" placeholder="câte amenințări a găsit?" value="${api.esc(st.nr)}"></label></div>`}
    function desen(){
      body.innerHTML=`<div class="px"><div class="px-top"><span>Calculatorul din laborator</span><span>stickul tău e pus, nimic deschis</span></div><div class="ecr">${ecran()}</div>
      <div class="px-teste"><div class="px-lbl">Testele sarcinii · <span class="nr">0 din ${checks.length} trec</span></div><ol>${checks.map((c,i)=>`<li data-i="${i}"><span class="s">○</span><span>${c.ce}</span></li>`).join('')}</ol></div></div>`;
      body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;
        if(g==='start')st.start=!st.start;else if(g==='app')st.app=true;else if(g==='pag')st.pag=true;else if(g==='inapoi')st.pag=false;
        else if(g==='scan'){st.scan='merge';clearTimeout(tmr);tmr=setTimeout(()=>{st.scan='gata';desen()},1500)}
        desen()});
      const c=body.querySelector('[data-f="cauta"]');
      if(c){c.oninput=()=>{st.cauta=c.value;const p=c.selectionStart;desen();const n=body.querySelector('[data-f="cauta"]');n.focus();n.setSelectionRange(p,p)};if(st.start&&!st.cauta)c.focus()}
      const n=body.querySelector('[data-f="nr"]');if(n)n.oninput=()=>{st.nr=n.value;upd(false)};
      upd(false)}
    function upd(arata){const rez=checks.map(c=>!!c.c(st));
      rez.forEach((ok,i)=>{const li=body.querySelector(`.px-teste li[data-i="${i}"]`);li.className=ok?'ok':(arata?'rau':'');li.querySelector('.s').textContent=ok?'✓':(arata?'✗':'○')});
      body.querySelector('.px-teste .nr').textContent=`${rez.filter(Boolean).length} din ${rez.length} trec`;return rez}
    body._pune=v=>{clearTimeout(tmr);Object.assign(st,v);desen()};
    desen();
    const nav=api.checkButton(()=>{const rez=upd(true),rau=rez.filter(x=>!x).length;
      if(!rau)api.resolve(true);
      else{api.resolve(false,`${rau===1?'Un test nu trece':rau+' teste nu trec'} (marcate cu ✗). Continuă de unde ai rămas și apasă din nou.`);
        api.revealButton(()=>{body._pune(JocScut._sol);upd(true);nav.innerHTML='';api.giveUp('Start → Securitate Windows → Protecție antivirus și împotriva amenințărilor → Scanare rapidă → rezultatul: 0 amenințări găsite.')})}
    },'Am terminat');
  },
  _sol:{start:true,cauta:'Securitate Windows',app:true,pag:true,scan:'gata',nr:'0'},
  rezolva(Q,body){body._pune(JocScut._sol)},
  gresit(Q,body){body._pune({start:true,cauta:'Securitate Windows',app:true,pag:true,scan:'nu',nr:'0'})}  // a notat 0 fără să scaneze
};

  {t:'classify',q:'E un obicei sigur sau riscant?',cats:['Sigur','Riscant'],items:[['Las antivirusul să se actualizeze',0],['Deschid jocul_gratis.exe primit de la un necunoscut',1],['Instalez programe doar cu acordul unui adult',0],['Apăs pe un link trimis de cineva pe care nu-l cunosc',1],['Scanez cu antivirusul un stick adus de acasă',0]],why:'Riscant e tot ce lasă un program necunoscut să pornească: atașamente și linkuri de la necunoscuți. Actualizarea, scanarea și întrebarea unui adult te apără.'},
  {t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['virus','se lipește de fișiere și se răspândește'],['malware','numele tuturor programelor rău-intenționate'],['antivirus','scanează fișierele și oprește pericolele cunoscute'],['actualizare','îi arată antivirusului pericolele noi'],['.exe','fișier care e un program și pornește']],why:'Virusul este un tip de malware. Antivirusul le ține departe doar dacă primește actualizări, iar un .exe de la un necunoscut e periculos pentru că pornește imediat ce îl deschizi.'},
  {t:'choice',q:'În Securitate Windows, unde găsești butonul <b>Scanare rapidă</b>?',o:['În Protecție antivirus și împotriva amenințărilor','În dosarul Spam al cutiei poștale','În coloana Tip din fereastra Explorer','În fișierul joc_gratis.exe, după ce îl deschizi'],ok:0,ajutor:'Pasul 4, al doilea punct din listă.',why:'Butonul Scanare rapidă stă pe pagina Protecție antivirus și împotriva amenințărilor din Securitate Windows.'}
 ]},

/* ================= 2. Parola și urma ta digitală (lecția 12) ================= */
{t:'Parola și urma ta digitală',lectii:[12],continuturi:[P.date],
 obiectiv:'știi ce date personale rămân secrete, construiești o parolă puternică după o rețetă și știi ce urmă lași online.',
 pasi:[
  {t:'Datele personale',
   text:`<p><mark>Datele personale</mark> sunt informațiile după care poți fi recunoscut: numele complet, adresa de acasă, numărul de telefon, CNP-ul (codul numeric personal, cele 13 cifre de pe certificatul de naștere), fotografia ta.</p>
<p>Unele sunt <strong>secrete</strong>: parola, CNP-ul, adresa de acasă și telefonul. Nu le scrii în mesaje, în jocuri sau pe site-uri, nici dacă cineva le cere frumos.</p>
<p>Într-un e-mail pentru școală ajung doar <strong>numele, clasa și școala</strong>, ca profesorul să știe cine îi scrie.</p>`,
   exemplu:`<p>Un mesaj bun către profesor se semnează așa:</p>${pre('Ana Popescu, clasa a VI-a B\nȘcoala Gimnazială nr. 1')}<p>Fără adresă, fără telefon, fără CNP.</p>`,
   incearca:{t:'classify',q:'Rămâne secret sau poate apărea într-un e-mail pentru școală?',cats:['Poate apărea','Rămâne secret'],items:[['clasa și școala',0],['parola contului',1],['CNP-ul',1],['numele și prenumele',0]],ajutor:'Recitește ultimul paragraf: ce trei lucruri ajung într-un e-mail pentru școală?',why:'Numele, clasa și școala te prezintă. Parola și CNP-ul nu se trimit niciodată.'},
   inca:[
    {t:'tf',q:'Adresa de acasă este o dată personală care rămâne secretă.',ok:true,ajutor:'Vezi lista cu datele secrete din pas.',why:'Adevărat. Cine îți știe adresa te poate găsi, de aceea n-o scrii online.'}
   ]},
  {t:'Ce face o parolă slabă',
   text:`<p>O parolă e <strong>slabă</strong> când e scurtă sau ușor de ghicit:</p>
<ul><li>un nume și un an: <code>ana2014</code>;</li><li>cifre la rând: <code>12345678</code>;</li><li>un cuvânt obișnuit, chiar cuvântul <code>parola</code>.</li></ul>
<p>Programele care sparg parole le încearcă întâi exact pe acestea. Uite ce spune o unealtă publică de testat parole:</p>
${fig('parola-slaba.webp',930,270,'Unealtă publică de testat parole: în casetă e scris ana2014, indicatorul arată Very Weak, bara e roșie și aproape goală, iar timpul estimat de spargere este 3 Seconds','Parola <code>ana2014</code>: <b>Very Weak</b> (foarte slabă), spartă în <b>3 secunde</b>. Unealta e în engleză; tu scrii parola, ea o măsoară.')}`,
   incearca:{t:'choice',q:'Care parolă este slabă pentru că e un nume și un an?',o:['ana2014','12345678','parola','Cires3!Albastru#9'],ok:0,ajutor:'Caută un nume urmat de un an.',why:'ana2014 = numele Ana + anul 2014. E printre primele încercate de un program care sparge parole.'},
   inca:[
    {t:'tf',q:'Parola 12345678 e bună pentru că are 8 caractere.',ok:false,ajutor:'Cifrele la rând sunt în lista parolelor slabe din pas.',why:'Fals. Cifrele la rând se ghicesc imediat, oricâte ar fi.'}
   ]},
  {t:'Rețeta unei parole puternice',
   text:`<p>O <mark>parolă puternică</mark> are <strong>cel puțin 15 caractere</strong> și amestecă <strong>litere mari, litere mici, cifre și simboluri</strong> (<code>!</code> <code>#</code> <code>?</code>). Ca s-o și ții minte, o construiești așa:</p>
<ol><li>alegi 2-3 cuvinte fără legătură cu tine (nu numele, nu ziua ta);</li>
<li>le începi cu literă mare;</li>
<li>pui între ele o cifră sau un simbol;</li>
<li>numeri: sunt cel puțin 15 caractere?</li></ol>`,
   exemplu:`${pre('Cires + 3 + ! + Albastru + # + 9\n= Cires3!Albastru#9   (17 caractere)')}
${fig('parola-puternica.webp',930,270,'Aceeași unealtă de testat parole: în casetă e scris Cires3 semnul exclamării Albastru diez 9, indicatorul arată Strong, bara albastră e plină, iar timpul estimat de spargere este Centuries','<code>Cires3!Albastru#9</code> e <b>Strong</b> (puternică): spargerea ar dura <b>secole</b>. Nu o folosi pe aceasta, e publică acum; fă-ți una a ta.')}`,
   altfel:`<p>O parolă scurtă e ca un lacăt cu 3 cifre: încerci toate combinațiile într-o după-amiază. Una lungă și amestecată e ca un lacăt cu 15 rotițe, fiecare cu litere, cifre și semne: nu termini de încercat nici în o sută de ani.</p>`,
   incearca:{t:'choice',q:'Care parolă este cea mai puternică?',o:['Luna7?Pod#Verde42','ana2014','12345678','parola'],ok:0,ajutor:'Caută parola lungă, cu litere mari și mici, cifre și simboluri.',why:'Luna7?Pod#Verde42 are 17 caractere și amestecă toate cele patru feluri de semne. Celelalte sunt pe lista parolelor slabe.'},
   inca:[
    {t:'order',q:'Pune în ordine pașii rețetei.',items:['Alegi 2-3 cuvinte fără legătură cu tine','Le începi cu literă mare','Pui între ele cifre sau simboluri','Numeri: cel puțin 15 caractere'],ajutor:'Întâi cuvintele, la final numărătoarea.',why:'Cuvintele dau lungimea, literele mari, cifrele și simbolurile dau amestecul, iar numărătoarea verifică.'},
    {t:'choice',q:'Câte caractere are cel puțin o parolă puternică, după lecție?',o:['15','4','6','8'],ok:0,ajutor:'Primul rând al pasului.',why:'Cel puțin 15. Cu cât e mai lungă, cu atât se sparge mai greu.'}
   ]},
  {t:'Parola o știi doar tu',
   text:`<p>O parolă bună nu te apără dacă o afli și alții. Trei reguli:</p>
<ol><li><strong>nu o spui colegilor</strong>, nici prietenilor buni; o știu doar părinții tăi;</li>
<li><strong>nu folosești aceeași parolă peste tot</strong>: dacă una e aflată, toate conturile sunt în pericol;</li>
<li>pe un calculator folosit de mai mulți, la final <strong>te deconectezi</strong> (ieși din cont).</li></ol>`,
   exemplu:`<p>Ora s-a terminat în laborator. Înainte să pleci: închizi documentul, <b>te deconectezi</b> din contul de e-mail, abia apoi închizi browserul. Următorul elev nu mai poate scrie în numele tău.</p>`,
   incearca:{t:'choice',q:'Un coleg îți cere parola „doar ca să vadă ceva” în contul tău. Ce faci?',o:['Refuzi politicos: parola nu se spune colegilor','I-o spui, doar e prieten','I-o scrii pe un bilețel','Îi dai parola unui alt cont de-al tău'],ok:0,ajutor:'Regula 1 din pas.',why:'Cine are parola poate intra în cont și poate scrie în numele tău. De aceea o știi doar tu și părinții tăi.'},
   inca:[
    {t:'tf',q:'Pe calculatorul din laborator, la finalul orei, te deconectezi din cont.',ok:true,ajutor:'Regula 3.',why:'Adevărat. Altfel următorul elev intră direct în contul tău.'},
    {t:'tf',q:'E bine să ai aceeași parolă la toate conturile, ca s-o ții minte ușor.',ok:false,ajutor:'Regula 2.',why:'Fals. Dacă cineva o află o dată, intră în toate conturile deodată.'}
   ]},
  {t:'Identitatea virtuală și urma digitală',
   text:`<p>Contul, poza și mesajele tale formează <mark>identitatea virtuală</mark>: așa te văd ceilalți online.</p>
<p>Tot ce faci online lasă o <mark>urmă digitală</mark>. Un mesaj trimis se copiază pe <strong>server</strong> (calculatorul serviciului de e-mail) și la cel care l-a primit. Când spui „l-am șters”, l-ai șters doar de la tine; celelalte copii rămân.</p>`,
   altfel:`<p>E ca atunci când dai unui coleg o foaie fotocopiată. Poți rupe foaia ta, dar copia lui rămâne la el.</p>`,
   incearca:{t:'tf',q:'Dacă șterg un mesaj trimis, el dispare de peste tot.',ok:false,ajutor:'Unde se copiază mesajul trimis?',why:'Mesajul s-a copiat pe drum: pe server și la cel care l-a primit. Ștergerea îl scoate doar din căsuța ta.'},
   inca:[
    {t:'choice',q:'Ce formează identitatea ta virtuală?',o:['Contul, poza și mesajele tale','Doar parola','Doar antivirusul','Calculatorul din laborator'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Identitatea virtuală e felul în care te văd ceilalți online: după cont, poză și mesaje.'}
   ]}
 ],
 atelier:{t:'parola',titlu:'Construiește o parolă puternică',
  intro:`<p><strong>Sarcina:</strong> folosește rețeta din pasul 3 și construiește o parolă care trece toate testele de mai jos. Testele se bifează singure cât scrii. Apoi apasă <b>Verifică parola</b>.</p>`,
  q:'Scrie o parolă inventată, după rețetă.',start:'',checks:PAROLA_TESTE,
  ajutor:'Două-trei cuvinte cu literă mare, cu o cifră și un simbol între ele. Exemplu de formă: Cuvant5?Alt#Cuvant.',
  solutie:'Munte8?Rosu#Nor',gresit:'ana2014',why:'Ai o parolă lungă și amestecată, deci greu de spart. Pe cea adevărată o faci la fel, dar n-o scrii nicăieri online.',
  inca:[
   {t:'parola',q:'Repară parola slabă <code>ana2014</code>: fă din ea una puternică, fără numele Ana și fără anul 2014.',start:'ana2014',
    checks:PAROLA_TESTE.concat([{c:'nuContine',v:['ana','2014'],ce:'Nu mai conține numele „ana” și anul „2014”'}]),
    ajutor:'Șterge tot și pornește de la 2-3 cuvinte noi, fără legătură cu tine.',solutie:'Stea4!Mare#Padure',gresit:'Ana2014!',why:'Numele și anul se ghicesc primele; cuvintele fără legătură cu tine, nu.'}
  ]},
 qs:[
  {t:'tf',q:'Dacă șterg un mesaj trimis, el dispare de peste tot.',ok:false,ajutor:'Pasul 5: unde se copiază mesajul?',why:'Mesajul s-a copiat pe drum: pe server și la cel care l-a primit. Ștergerea îl scoate doar din căsuța ta.'},
  {t:'choice',q:'Care parolă este cea mai puternică?',o:['Cires3!Albastru#9','ana2014','12345678','parola'],ok:0,why:'E lungă și amestecă litere mari și mici, cifre și simboluri. Celelalte sunt ușor de ghicit: un nume cu un an, cifre la rând sau chiar cuvântul „parola”.'},
  {t:'classify',q:'Poți scrie asta într-un e-mail către profesorul de informatică?',cats:['Da, dacă e nevoie','Nu, rămâne secret'],items:[['numele și prenumele',0],['clasa și școala',0],['parola contului',1],['CNP-ul',1],['adresa de acasă',1],['numărul de telefon',1]],ajutor:'Pasul 1: ce trei lucruri ajung într-un e-mail pentru școală?',why:'Numele, clasa și școala îl ajută pe profesor să știe cine scrie. Parola, CNP-ul, adresa și telefonul nu se trimit prin e-mail, nici măcar când cineva le cere.'},
  {t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['date personale','informații după care poți fi recunoscut'],['urmă digitală','ce rămâne după ce faci ceva online'],['identitate virtuală','cum te văd ceilalți online, după cont, poză și mesaje'],['deconectare','ieșirea din cont pe un calculator comun']],why:'Datele personale și urma digitală spun cine ești, chiar și după mult timp. Deconectarea împiedică pe altcineva să folosească contul tău.'},
  {t:'choice',q:'Ce parte a rețetei lipsește din parola „Munteverdealbastru”?',o:['Cifrele, simbolurile și literele mari din interior','Lungimea: are prea puține caractere','Nu lipsește nimic, e deja puternică','Numele tău și anul nașterii'],ok:0,ajutor:'Numără: e lungă? Apoi caută cifre și simboluri.',why:'E destul de lungă, dar are doar litere, aproape toate mici. Rețeta cere și litere mari, cifre și simboluri.'}
 ]},

/* ================= 3. Contul și adresa de e-mail (lecția 13) ================= */
{t:'Contul și adresa de e-mail',lectii:[13],continuturi:[P.email],
 obiectiv:'citești și scrii corect o adresă de e-mail, recunoști câmpurile unui mesaj și dosarele de bază, și scrii primul mesaj.',
 pasi:[
  {t:'Contul de e-mail',
   text:`<p><mark>Poșta electronică</mark> (<strong>e-mailul</strong>) e ca poșta obișnuită, dar scrisorile merg prin internet, în câteva secunde.</p>
<p>Ca să trimiți și să primești mesaje ai nevoie de un <mark>cont</mark>: o <strong>adresă</strong> (unde îți vin mesajele) și o <strong>parolă</strong> (cheia). Contul îl faci doar cu acordul și ajutorul părinților.</p>
<p>În lecție folosim o cutie poștală-model, pe serviciul inventat <code>joc-mail.test</code>, ca să exersezi fără să trimiți nimic de-adevăratelea.</p>`,
   altfel:`<p>Contul e ca o cutie poștală cu lacăt: adresa e numărul scris pe cutie, ca să știe poștașul unde să lase scrisoarea; parola e cheia, ca doar tu să o deschizi.</p>`,
   incearca:{t:'match',q:'Potrivește fiecare parte a contului cu rolul ei.',pairs:[['adresa','unde îți vin mesajele'],['parola','cheia contului, o știi doar tu'],['contul','adresa împreună cu parola']],ajutor:'Gândește-te la cutia poștală cu lacăt.',why:'Adresa îți spune unde ajung mesajele, parola deschide contul.'},
   inca:[
    {t:'tf',q:'Un copil își face cont de e-mail doar cu acordul părinților.',ok:true,ajutor:'Ultima propoziție din al doilea paragraf.',why:'Adevărat. Părinții te ajută să-l faci și să-l folosești în siguranță.'}
   ]},
  {t:'Adresa are două părți',
   text:`<p>O <mark>adresă de e-mail</mark> are două părți despărțite de semnul <code>@</code> (se citește „at” sau „arond”):</p>
<ul><li>în stânga: <strong>numele de utilizator</strong>, adică al cui e contul;</li>
<li>în dreapta: <strong>domeniul</strong>, adică serviciul de e-mail.</li></ul>
${fig('adresa-email.webp',784,140,'Adresa ana.pop@joc-mail.test scrisă mare, cu numele de utilizator, semnul arond și domeniul încadrate separat și etichetate','Adresa <code>ana.pop@joc-mail.test</code>: nume de utilizator, <code>@</code>, domeniu. (Imaginile de la acest nivel vin din cutia poștală-model.)')}`,
   exemplu:`${pre('radu.ene  @  joc-mail.test\n   ↑      ↑        ↑\n utilizator arond  domeniu')}`,
   incearca:{t:'tf',q:'În adresa <code>ana.pop@joc-mail.test</code>, partea <code>joc-mail.test</code> este numele de utilizator.',ok:false,ajutor:'Care parte stă în stânga lui @?',why:'Numele de utilizator stă în stânga lui @ (ana.pop). În dreapta e domeniul, adică serviciul de e-mail.'},
   inca:[
    {t:'choice',q:'În adresa radu.ene@joc-mail.test, care e numele de utilizator?',o:['radu.ene','joc-mail.test','@','test'],ok:0,ajutor:'Stânga lui @.',why:'radu.ene stă în stânga lui @, deci e numele de utilizator.'}
   ]},
  {t:'Cum verifici o adresă, semn cu semn',
   text:`<p>O singură greșeală și mesajul nu ajunge, sau ajunge la altcineva. Înainte să trimiți, verifici adresa în patru pași:</p>
<ol><li>are <strong>exact un</strong> <code>@</code>, nici zero, nici două;</li>
<li><strong>nu are spații</strong> nicăieri;</li>
<li>are ceva și în stânga, și în dreapta lui <code>@</code>;</li>
<li>domeniul (dreapta) are un <strong>punct</strong>, de exemplu <code>joc-mail.test</code>.</li></ol>`,
   exemplu:`${pre('ioana tanase@joc-mail.test   ✗ are un spațiu\nelena@@joc-mail.test         ✗ are două @\nandrei.joc-mail.test         ✗ nu are @\nsara.mihai@joc-mail.test     ✓ corectă')}`,
   altfel:`<p>E ca la un număr de telefon: o cifră lipsă sau în plus și suni la altcineva. Adresa se verifică semn cu semn, nu „din ochi”.</p>`,
   incearca:{t:'choice',q:'Care adresă de e-mail este scrisă corect?',o:['radu.ene@joc-mail.test','radu ene@joc-mail.test','radu.ene@@joc-mail.test','radu.ene.joc-mail.test'],ok:0,ajutor:'Treci prin cei patru pași: un @, fără spații, ceva de o parte și de alta, punct în domeniu.',why:'O adresă corectă are exact un @ și niciun spațiu. Ultima variantă nu are deloc @, deci nu e o adresă de e-mail.'},
   inca:[
    {t:'hunt',q:'În lista clasei, câteva adrese sunt scrise greșit. Apasă pe cele greșite, apoi verifică.',src:'maria.dobre@joc-mail.test [[ioana tanase@joc-mail.test|are un spațiu în numele de utilizator]] vlad_6b@joc-mail.test [[elena@@joc-mail.test|are două @]] [[andrei.joc-mail.test|lipsește @]] sara.mihai@joc-mail.test',indiciu:'Caută spații, un @ dublu sau un @ lipsă.',ajutor:'Pașii 1 și 2: câte @ are fiecare? Are spațiu?',why:'Un mesaj ajunge doar la o adresă cu exact un @ și fără spații.'},
    {t:'tf',q:'Adresa dan.ion@joc-mailtest este corectă.',ok:false,ajutor:'Pasul 4: are domeniul un punct?',why:'Fals. Domeniul „joc-mailtest” nu are punct; corect ar fi joc-mail.test.'}
   ]},
  {t:'Câmpurile unui mesaj',
   text:`<p>Orice mesaj are aceleași părți, numite <strong>câmpuri</strong>:</p>
<ul><li><strong>De la</strong>: cine trimite (expeditorul); când scrii tu un mesaj, aici apare singură adresa ta;</li>
<li><strong>Către</strong>: cui trimiți (destinatarul);</li>
<li><strong>Subiect</strong>: despre ce e mesajul, în câteva cuvinte;</li>
<li><strong>corpul</strong> mesajului: textul propriu-zis;</li>
<li><strong>atașamente</strong>: fișiere trimise odată cu mesajul (nu toate mesajele au).</li></ul>
${fig('mesaj-campuri.webp',963,499,'Un mesaj deschis în cutia poștală-model, cu cele trei rânduri De la, Către și Subiect încadrate întregi, corpul mesajului cu semnătura încadrat și fișierul atașat încadrat','Un mesaj deschis, cu toate câmpurile lui. Model pentru lecție, nu o aplicație adevărată.')}`,
   incearca:{t:'match',q:'Leagă fiecare câmp al mesajului de rolul lui.',pairs:[['De la','cine a trimis mesajul'],['Către','cui îi trimiți mesajul'],['Subiect','despre ce e mesajul, pe scurt'],['Corp','textul propriu-zis al mesajului'],['Atașament','fișierul trimis odată cu mesajul']],ajutor:'Citește lista din pas: fiecare rând începe cu numele câmpului.',why:'Destinatarul vede întâi expeditorul și subiectul, apoi deschide corpul și atașamentele.'},
   inca:[
    {t:'choice',q:'Când scrii un mesaj nou, în care câmp pui adresa colegului?',o:['Către','De la','Subiect','Atașament'],ok:0,ajutor:'Cui trimiți?',why:'Adresa destinatarului se scrie în Către. De la se completează singur cu adresa ta.'}
   ]},
  {t:'Dosarele de bază',
   text:`<p>Mesajele stau în <strong>dosare</strong>, în stânga cutiei poștale:</p>
<ul><li><strong>Primite</strong>: ce ți-au trimis alții;</li>
<li><strong>Trimise</strong>: ce ai trimis tu;</li>
<li><strong>Ciorne</strong>: mesaje începute, dar netrimise;</li>
<li><strong>Spam</strong>: mesaje nedorite, puse acolo automat.</li></ul>
${fig('dosare-mail.webp',216,212,'Partea stângă a cutiei poștale-model, cu dosarele Primite, Trimise, Ciorne și Spam încadrate','Dosarele stau în stânga; cifra din dreapta arată câte mesaje sunt în ele.')}`,
   incearca:{t:'classify',q:'În ce dosar găsești fiecare mesaj?',cats:['Primite','Trimise','Ciorne','Spam'],items:[['mesajul primit azi de la dirigintă',0],['mesajul trimis ieri de tine profesorului',1],['un mesaj început și netrimis',2],['o reclamă nedorită, mutată automat',3]],ajutor:'Citește lista din pas, rând cu rând.',why:'Primite adună ce vine la tine, Trimise păstrează ce ai trimis, Ciorne ține ce n-ai terminat, iar Spam strânge automat mesajele nedorite.'},
   inca:[
    {t:'choice',q:'Ai început un mesaj și ai închis fereastra fără să-l trimiți. Unde îl cauți?',o:['Ciorne','Trimise','Spam','Primite'],ok:0,ajutor:'Început, dar netrimis.',why:'Ciornele păstrează mesajele începute, ca să le termini mai târziu.'}
   ]}
 ],

/* ================= 4. Trimit, răspund, redirecționez (lecția 14) ================= */
{t:'Trimit, răspund, redirecționez',lectii:[14],continuturi:[P.operatii],
 obiectiv:'deschizi un mesaj, alegi corect între Răspunde, Răspunde tuturor și Redirecționează și trimiți un fișier atașat.',
 pasi:[
  {t:'Deschizi, compui, trimiți',
   text:`<p>Un mesaj primit îl <mark>deschizi</mark> apăsând pe el în dosarul <strong>Primite</strong>.</p>
<p>Un mesaj nou îl <mark>compui</mark> în patru pași:</p>
<ol><li>apeși butonul de mesaj nou (în cutia-model: <b>Mesaj nou</b>);</li>
<li>scrii adresa în <strong>Către</strong>;</li>
<li>scrii un <strong>Subiect</strong> clar și textul;</li>
<li>apeși <strong>Trimite</strong>.</li></ol>
<p>Mesajul trimis ajunge apoi în dosarul Trimise.</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii pentru un mesaj nou.',items:['Apeși butonul de mesaj nou','Scrii adresa în Către','Scrii subiectul și textul','Apeși Trimite'],ajutor:'Trimite e mereu ultimul.',why:'Întâi deschizi fereastra, apoi completezi câmpurile de sus în jos, iar Trimite vine la final.'},
   inca:[
    {t:'choice',q:'Unde găsești mesajul după ce l-ai trimis?',o:['În Trimise','În Ciorne','În Spam','Nicăieri'],ok:0,ajutor:'Ultima propoziție din pas.',why:'Serviciul păstrează o copie a fiecărui mesaj trimis în dosarul Trimise.'}
   ]},
  {t:'Răspunde și Răspunde tuturor',
   text:`<p>Sub un mesaj primit sunt butoanele de răspuns:</p>
<ul><li><mark>Răspunde</mark> (<em>Reply</em>) îi scrie <strong>doar expeditorului</strong>;</li>
<li><strong>Răspunde tuturor</strong> (<em>Reply all</em>) scrie <strong>tuturor</strong> celor din conversație.</li></ul>
<p>La un răspuns, Către se completează singur, iar subiectul primește în față <code>Re:</code>.</p>
${fig('raspunde-butoane.webp',764,372,'Un mesaj primit în cutia poștală-model, cu cele trei butoane Răspunde, Răspunde tuturor și Redirecționează încadrate și explicate dedesubt','Trei butoane, trei destinatari diferiți. Uită-te bine înainte să apeși.')}`,
   exemplu:`<p>Diriginta scrie clasei: „Mâine mergem la muzeu”. Tu apeși <b>Răspunde</b>:</p>${pre('Către:   diriginta@joc-mail.test\nSubiect: Re: Excursie la muzeu')}<p>Doar diriginta îți vede răspunsul.</p>`,
   altfel:`<p>Răspunde = vorbești în șoaptă doar cu cel care ți-a scris. Răspunde tuturor = vorbești tare, în fața clasei. Înainte să apeși, te întrebi: vreau să audă toată lumea?</p>`,
   incearca:{t:'choice',q:'Diriginta trimite un mesaj întregii clase. Vrei să-i spui doar ei că lipsești mâine. Ce apeși?',o:['Răspunde','Răspunde tuturor','Redirecționează','Trimise'],ok:0,ajutor:'Cine trebuie să afle? Doar ea sau toată clasa?',why:'Răspunde ajunge doar la expeditor. Cu „Răspunde tuturor” ar afla toată clasa un lucru care o privește doar pe dirigintă.'},
   inca:[
    {t:'choice',q:'Ce scrie în fața subiectului la un răspuns?',o:['Re:','Fw:','Spam:','Nou:'],ok:0,ajutor:'Ultimul rând al textului din pas.',why:'Re: arată că mesajul e un răspuns.'}
   ]},
  {t:'Redirecționează',
   text:`<p><mark>Redirecționează</mark> (<em>Forward</em>) trimite mesajul primit unei <strong>persoane noi</strong>, care nu era în conversație. Câmpul Către rămâne gol: scrii tu adresa. Subiectul primește în față <code>Fw:</code> sau <code>Fwd:</code>, iar atașamentele merg mai departe odată cu mesajul.</p>
<p>O regulă: mesajele personale ale altora <strong>nu le dai mai departe fără acordul lor</strong>.</p>`,
   exemplu:`<p>Diriginta ți-a trimis programul excursiei. Vrei să-l vadă și mama: apeși <b>Redirecționează</b>.</p>${pre('Către:   mama@joc-mail.test\nSubiect: Fw: Programul excursiei')}`,
   incearca:{t:'choice',q:'Primești un mesaj cu subiectul <code>Fw: Program concurs</code>. Ce înseamnă <code>Fw:</code>?',o:['Mesajul a fost redirecționat','Mesajul este un răspuns','Mesajul este spam','Mesajul este o ciornă'],ok:0,ajutor:'Re: e pentru răspuns. Pentru ce e Fw:?',why:'Fw: (sau Fwd:) apare când cineva îți dă mai departe un mesaj primit de el. La un răspuns ar scrie Re:.'},
   inca:[
    {t:'tf',q:'E în regulă să redirecționezi colegilor mesajul personal pe care ți l-a scris un prieten, fără să-l întrebi.',ok:false,ajutor:'Regula din al doilea paragraf.',why:'Mesajul era scris doar pentru tine. Îl dai mai departe numai cu acordul celui care l-a scris.'}
   ]},
  {t:'Atașezi un fișier: agrafa',
   text:`<p>Un fișier (tema, o poză) îl <mark>atașezi</mark> cu butonul în formă de <strong>agrafă</strong>. Strategia, de fiecare dată:</p>
<ol><li>deschizi mesajul nou sau răspunsul;</li>
<li>apeși agrafa și alegi fișierul de pe calculator;</li>
<li><strong>verifici</strong> că numele fișierului apare în mesaj;</li>
<li>abia apoi apeși <strong>Trimite</strong>.</li></ol>
<p>Butoanele arată puțin diferit de la o aplicație la alta: dacă nu ești sigur, ține mouse-ul pe buton și citește eticheta.</p>
${fig('compune-atasament.webp',692,272,'Fereastra Mesaj nou din cutia poștală-model: câmpurile Către și Subiect cu Re: în față, fișierul atașat, butonul cu agrafă Atașează și butonul Trimite, toate încadrate','Răspunsul în lucru: subiectul are <code>Re:</code>, agrafa a adăugat fișierul, iar <b>Trimite</b> se apasă la final.')}`,
   altfel:`<p>E ca atunci când pui o foaie în plic: te uiți în plic înainte să-l lipești. După ce l-ai trimis, nu mai poți pune foaia în același plic.</p>`,
   incearca:{t:'order',q:'Profesorul așteaptă tema ca fișier atașat, ca răspuns la mesajul lui. Pune pașii în ordine.',items:['Deschizi mesajul primit de la profesor','Apeși Răspunde','Apeși agrafa și alegi fișierul temei','Verifici că fișierul apare în mesaj','Apeși Trimite'],ajutor:'Verificarea vine înainte de Trimite.',why:'Deschizi întâi mesajul profesorului, ca răspunsul să ajungă la el. Verifici atașamentul înainte de Trimite, fiindcă după trimitere e prea târziu.'},
   inca:[
    {t:'choice',q:'Ce faci chiar înainte de Trimite, când ai atașat un fișier?',o:['Verifici că numele fișierului apare în mesaj','Închizi fereastra mesajului fără să salvezi','Ștergi subiectul, ca să fie mai scurt','Apeși Răspunde tuturor, ca să ajungă sigur'],ok:0,ajutor:'Pasul 3 al strategiei.',why:'Dacă fișierul nu apare în mesaj, nu s-a atașat, iar profesorul primește un mesaj gol.'}
   ]},
  {t:'Cum alegi butonul potrivit',
   text:`<p>Înainte să apeși, pui o singură întrebare: <strong>cine trebuie să primească mesajul?</strong></p>
<ol><li>doar cel care ți-a scris → <strong>Răspunde</strong>;</li>
<li>toți cei din conversație, pentru că îi privește pe toți → <strong>Răspunde tuturor</strong>;</li>
<li>cineva nou, care nu era în conversație → <strong>Redirecționează</strong>.</li></ol>`,
   incearca:{t:'classify',q:'Ce operație folosești în fiecare situație?',cats:['Răspunde','Răspunde tuturor','Redirecționează'],items:[['Îi mulțumești doar colegei care ți-a trimis notițele',0],['Anunți tot grupul de proiect, în conversația voastră, că ai terminat partea ta',1],['Îi trimiți mamei mesajul cu programul excursiei, primit de la dirigintă',2],['Îi spui doar expeditorului că nu poți veni',0]],ajutor:'Întrebarea din pas: cine trebuie să primească?',why:'Răspunde = doar expeditorul. Răspunde tuturor = toți din conversație. Redirecționează = o persoană nouă.'},
   inca:[
    {t:'choice',q:'Un coleg a lipsit și n-a primit anunțul profesorului. Tu l-ai primit. Ce apeși?',o:['Redirecționează','Răspunde','Răspunde tuturor','Ciorne'],ok:0,ajutor:'Colegul era în conversație?',why:'Colegul e o persoană nouă pentru acest mesaj, deci îl redirecționezi.'}
   ]}
 ],

/* ================= 5. Dosare, agendă și netichetă (lecția 15) ================= */
{t:'Dosare, agendă și netichetă',lectii:[15],continuturi:[P.dosare,P.neticheta],
 obiectiv:'îți ordonezi mesajele în dosare, folosești agenda și scrii un mesaj politicos, după regulile netichetei.',
 pasi:[
  {t:'Dosarele tale',
   text:`<p>Pe lângă Primite, Trimise, Ciorne și Spam, îți poți face <mark>dosare</mark> proprii, de exemplu „Informatică” sau „Proiect”, și muți mesajele în ele. Unele servicii le numesc <strong>etichete</strong>.</p>
<p>Așa găsești repede tot ce ține de o temă, în loc să cauți printre sute de mesaje.</p>`,
   exemplu:`<p>În Primite ai: tema de la profesorul de informatică, pozele de la Dan pentru proiect, încă un mesaj de la profesor. Le muți așa:</p>${pre('Informatică → tema, mesajul profesorului\nProiect     → pozele de la Dan')}`,
   incearca:{t:'choice',q:'Vrei ca toate mesajele despre proiectul de informatică să fie la un loc. Ce faci?',o:['Faci un dosar „Proiect” și muți mesajele acolo','Le ștergi pe cele vechi','Le lași în Primite, printre celelalte','Le muți în Spam'],ok:0,ajutor:'Pentru ce sunt dosarele proprii?',why:'Un dosar propriu adună mesajele pe o temă. Spam e pentru mesajele nedorite, nu pentru ale tale.'},
   inca:[
    {t:'tf',q:'Unele servicii de e-mail numesc dosarele „etichete”.',ok:true,ajutor:'Ultima propoziție din primul paragraf.',why:'Adevărat. Numele diferă, ideea e aceeași: mesajele pe aceeași temă, la un loc.'}
   ]},
  {t:'Agenda de contacte',
   text:`<p>În <mark>agendă</mark> (lista de contacte) salvezi numele și adresele colegilor și ale profesorilor. Nu mai trebuie să le ții minte.</p>
<p>Când începi să scrii un nume în Către, aplicația caută în agendă și îți <strong>propune adresa întreagă</strong>. Apeși pe propunere și adresa se scrie singură, fără greșeli.</p>
${fig('dosare-agenda.webp',1000,440,'Cutia poștală-model: în stânga dosarele proprii Informatică și Proiect încadrate, la mijloc propunerea de adresă care apare după ce scrii dan în câmpul Către, iar în dreapta agenda de contacte','Dosarele tale stau sub cele obișnuite. Ai scris <code>dan</code> în Către, iar agenda ți-a propus adresa întreagă.')}`,
   incearca:{t:'tf',q:'Când scrii începutul unui nume în Către, agenda îți poate propune adresa întreagă.',ok:true,ajutor:'Uită-te la mijlocul capturii.',why:'Adevărat. Așa eviți greșelile de scriere din adresă.'},
   inca:[
    {t:'choice',q:'La ce folosește agenda?',o:['Păstrează adresele celor cu care comunici','Scanează fișierele primite de la colegi','Mută singură reclamele în dosarul Spam','Construiește parole puternice pentru tine'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Agenda e lista ta de contacte: nume și adrese.'}
   ]},
  {t:'Neticheta: mesajul politicos, pas cu pas',
   text:`<p><mark>Neticheta</mark> înseamnă bunele maniere pe internet. Când scrii unui profesor, urmezi cinci pași:</p>
<ol><li>un <strong>subiect clar</strong>;</li>
<li>un <strong>salut</strong>: „Bună ziua”;</li>
<li>textul, scurt și calm, cu „vă rog”;</li>
<li>o <strong>încheiere</strong>: „Mulțumesc” sau „Cu respect”;</li>
<li>numele tău și clasa.</li></ol>
<p>Nu scrii tot cu MAJUSCULE și nu pui „!!!”: pe internet asta se citește ca un țipăt.</p>`,
   exemplu:`${pre('Subiect: Tema de la informatică\n\nBună ziua,\nVă rog să-mi spuneți dacă tema e pentru joi.\nMulțumesc!\nAna Popescu, clasa a VI-a B')}`,
   altfel:`<p>E ca atunci când intri în cancelarie: bați la ușă (subiectul), saluți, spui calm ce vrei, mulțumești și ieși. N-ai intra strigând.</p>`,
   incearca:{t:'tf',q:'Un mesaj scris numai cu MAJUSCULE e mai clar și mai politicos.',ok:false,ajutor:'Ultima propoziție din pas.',why:'Pe internet, majusculele peste tot se citesc ca un țipăt. Le folosești doar la începutul propozițiilor și la nume.'},
   inca:[
    {t:'hunt',q:'Mesajul lui Tudor către profesor încalcă neticheta. Apasă pe fragmentele nepotrivite.',src:'Subiect: [[(gol)|un subiect clar îi spune profesorului despre ce e vorba]] Mesaj: [[hei|unui profesor îi scrii un salut politicos, de exemplu „Bună ziua”]] [[DE CE NU MI-AȚI PUS NOTA???|majusculele și semnele multe se citesc ca un țipăt]] Am trimis tema luni, vă rog să o verificați. [[pa|la un profesor încheierea potrivită e „Mulțumesc” sau „Cu respect”]] Tudor, clasa a VI-a',indiciu:'Uită-te la subiect, la salut, la ton și la încheiere.',ajutor:'Treci prin cei cinci pași: subiect, salut, text calm, încheiere, nume.',why:'Același conținut, cu subiect, salut, ton calm și încheiere, primește mult mai ușor un răspuns bun.'},
    {t:'order',q:'Pune în ordine părțile unui mesaj politicos către profesor.',items:['Subiect clar','Salutul: „Bună ziua”','Textul, cu „vă rog”','Încheierea: „Mulțumesc”','Numele și clasa'],ajutor:'Cei cinci pași din pas, de sus în jos.',why:'Așa arată un mesaj care primește repede un răspuns bun.'}
   ]},
  {t:'Când cineva e jignit online',
   text:`<p>Dacă cineva jignește sau amenință pe cineva online, e <mark>cyberbullying</mark> (hărțuire pe internet). Ce faci:</p>
<ol><li><strong>nu răspunzi</strong> cu jigniri;</li>
<li><strong>păstrezi dovezile</strong> (o captură de ecran);</li>
<li><strong>blochezi și raportezi</strong> contul care jignește;</li>
<li>îl <strong>sprijini</strong> pe cel jignit;</li>
<li><strong>spui unui adult</strong> de încredere: părinților sau dirigintei.</li></ol>
<p>Asta nu e pârâre, e curaj.</p>`,
   incearca:{t:'classify',q:'Cineva e jignit în grupul clasei. Ce ajută și ce face mai mult rău?',cats:['Ajută','Face rău'],items:[['Salvezi o captură de ecran cu mesajele',0],['Dai mai departe mesajul jignitor',1],['Spui dirigintei sau părinților',0],['Răspunzi și tu cu jigniri',1]],ajutor:'Lista din pas: ce ai de făcut?',why:'Dovezile și un adult opresc hărțuirea. Distribuirea și jignirile o fac mai mare.'},
   inca:[
    {t:'tf',q:'Când spui unui adult că un coleg e jignit online, e pârâre.',ok:false,ajutor:'Ultima propoziție din pas.',why:'Fals. E curaj: îl ajuți pe colegul tău să scape de hărțuire.'}
   ]}
 ],

  {t:'hunt',q:'Mesajul Irinei către dirigintă încalcă neticheta. Apasă pe fragmentele nepotrivite.',src:'Subiect: [[???|subiectul trebuie să spună despre ce e mesajul]] Mesaj: [[yo|dirigintei îi scrii „Bună ziua”]] Vă rog să-mi spuneți când e ședința. [[RĂSPUNDEȚI REPEDE!!!|majusculele și „!!!” se citesc ca un țipăt]] [[bye|încheierea potrivită e „Mulțumesc” sau „Cu respect”]] Irina, clasa a VI-a',indiciu:'Subiect, salut, ton, încheiere.',why:'Cu subiect clar, salut, ton calm și încheiere politicoasă, mesajul arată respect și primește răspuns.'},

/* ================= 6. Mesajul-capcană (final: lecțiile 11-12, în contextul e-mailului) ================= */
{t:'Mesajul-capcană',final:true,lectii:[11,12],continuturi:[P.antivirus,P.date],
 obiectiv:'recunoști un mesaj de tip phishing după cele șase semne și știi exact ce faci cu el, și ce faci dacă ai apăsat deja.',
 pasi:[
  {t:'Ce e phishingul',
   text:`<p><mark>Phishingul</mark> (se citește „fișing”, ca „fishing” = pescuit) e o <mark>înșelătorie</mark> prin mesaj: cineva se preface că e un serviciu cunoscut, ca să-ți „pescuiască” <strong>parola</strong> sau datele personale.</p>
<p>Mesajul e momeala. Dacă muști (apeși, răspunzi, deschizi), înșelătorul intră în contul tău.</p>
${fig('mesaj-capcana-1.webp',640,324,'Mesaj-capcană compus pentru lecție: subiectul „Contul tău de elev se închide azi!” și adresa expeditorului, suport@scrieimpreuna-scoala.example, amândouă încadrate și numite','Un mesaj-capcană: te grăbește și vine de la o adresă care imită una cunoscută. (Exemplu compus pentru lecție, cu adrese inventate.)','colaborare-vii')}`,
   altfel:`<p>Ca la pescuit: pescarul pune o râmă în cârlig. Peștele vede doar râma. Tu vezi doar un mesaj „de la școală”; cârligul e cererea de parolă.</p>`,
   incearca:{t:'choice',q:'Ce este phishingul?',o:['Un mesaj-capcană care vrea să-ți ia parola sau datele','Un program care curăță calculatorul de viruși','Un dosar în care se mută singure mesajele vechi','Un mesaj redirecționat către toată agenda ta'],ok:0,ajutor:'Gândește-te la pescuit: ce vrea să „prindă”?',why:'Ca la pescuit: mesajul e momeala, iar ce vrea să „prindă” sunt parola și datele tale.'},
   inca:[
    {t:'tf',q:'Un mesaj de phishing se preface că vine de la un serviciu cunoscut.',ok:true,ajutor:'Prima propoziție a pasului.',why:'Adevărat. Așa te face să ai încredere și să muști momeala.'}
   ]},
  {t:'Cele șase semne, verificate pe rând',
   text:`<p>Strategia: citești mesajul <strong>de sus în jos</strong> și cauți șase semne:</p>
<ol><li><b>adresa</b> expeditorului: o citești literă cu literă; poate doar să semene: <code>j0c-mail.test</code> (cifra 0 în loc de litera o) sau <code>joc-mai1.test</code> (cifra 1 în loc de litera l);</li>
<li><b>graba</b>: „URGENT”, „în 24 de ore”;</li>
<li><b>salutul</b> general: „Dragă utilizator”, nu numele tău;</li>
<li><b>cererea de parolă</b> sau de date;</li>
<li>un <b>link</b> spre un site cu alt nume; contează finalul numelui: <code>joc-mail.verificare-cont.test</code> se termină cu <code>verificare-cont.test</code>, deci NU e site-ul <code>joc-mail.test</code>;</li>
<li>un <b>atașament</b> ciudat, de exemplu un <code>.exe</code>.</li></ol>
<p>Chiar și un singur semn e motiv să te oprești.</p>`,
   exemplu:`${fig('mesaj-capcana-2.webp',640,310,'Același mesaj-capcană: amenințarea „pana astazi la ora 20:00” și butonul albastru „Confirmă parola acum”, încadrate și numite','Semnele 2 și 4: o oră-limită care te sperie și un buton care îți cere <b>parola</b>.','colaborare-vii')}`,
   incearca:{t:'choice',q:'Mesajul vine de la <code>echipa@j0c-mail.test</code>. Care e semnul?',o:['Adresa doar seamănă: are cifra 0 în loc de litera o','Adresa e în regulă, e chiar joc-mail.test','Adresa are un spațiu în numele de utilizator','Adresa nu are deloc semnul @ în ea'],ok:0,ajutor:'Citește adresa literă cu literă și compar-o cu joc-mail.test.',why:'j0c cu cifra 0 nu e joc. E cel mai viclean semn: adresa imită una cunoscută.'},
   inca:[
    {t:'hunt',q:'Acesta e mesajul primit de Maia. Apasă pe toate semnele de înșelătorie, apoi verifică.',src:'De la: [[echipa@j0c-mail.test|în loc de litera o e cifra 0: adresa doar seamănă cu joc-mail.test]] Subiect: [[URGENT!!!|te grăbește ca să nu mai stai să te gândești]] [[Dragă utilizator,|serviciul tău adevărat îți știe numele]] [[contul tău va fi închis în 24 de ore.|amenințarea cu un termen scurt e un semn de înșelătorie]] [[Trimite-ne parola|niciun serviciu adevărat nu îți cere parola prin e-mail]] sau intră aici: [[joc-mail.verificare-cont.test|linkul duce pe alt site, nu pe joc-mail.test]] Atașament: [[verificare.exe|un .exe e un program și poate fi malware]]',indiciu:'Uită-te la adresă, la grabă, la salut, la ce ți se cere, la link și la atașament.',ajutor:'Treci prin cele șase semne, în ordine. Unele semne sunt în același mesaj de două ori.',why:'Chiar și un singur semn e motiv să te oprești. Aici sunt șapte, deci mesajul e sigur o capcană.'}
   ]},
  {t:'Ce faci cu un mesaj-capcană',
   text:`<p>Serviciile adevărate <strong>nu îți cer niciodată parola prin e-mail</strong>. Când recunoști o capcană:</p>
<ol><li><strong>nu</strong> apeși pe link, <strong>nu</strong> deschizi atașamentul, <strong>nu</strong> răspunzi;</li>
<li><strong>arăți mesajul unui adult</strong> (părinți, dirigintă);</li>
<li>îl <strong>marchezi ca spam</strong> (îl muți în Spam), ca să nu te mai încurce.</li></ol>
<p>Nu îl trimiți colegilor „ca glumă”: i-ai pune și pe ei în pericol.</p>`,
   incearca:{t:'classify',q:'Ce e bine și ce e greșit să facă Maia cu mesajul?',cats:['Bine','Greșit'],items:[['Le arată mesajul părinților sau dirigintei',0],['Apasă pe link „doar ca să vadă”',1],['Marchează mesajul ca spam',0],['Deschide verificare.exe ca să afle ce e',1]],ajutor:'Cei trei pași din pas: ce NU faci, cui arăți, unde îl muți.',why:'Orice gest care ajunge la link, la atașament sau la parolă îi dă înșelătorului ce vrea. Adultul și Spam o apără.'},
   inca:[
    {t:'tf',q:'Serviciul tău adevărat de e-mail îți poate cere parola printr-un mesaj, dacă e ceva urgent.',ok:false,ajutor:'Prima propoziție din pas.',why:'Serviciile adevărate nu cer parola prin e-mail. Oricine o cere așa încearcă să te păcălească.'}
   ]},
  {t:'Dacă ai apăsat deja',
   text:`<p>Se întâmplă și celor mari. Dacă ai apăsat pe link sau ți-ai scris parola acolo, nu te ascunzi. Faci imediat:</p>
<ol><li><strong>spui unui adult</strong>, chiar acum;</li>
<li><strong>schimbați parola împreună</strong>, după rețeta parolei puternice;</li>
<li>o schimbați și pe <strong>orice alt cont</strong> unde era aceeași parolă;</li>
<li>dacă ai deschis un fișier, faceți o <strong>scanare cu antivirusul</strong>.</li></ol>
<p>Cu cât afli mai repede, cu atât înșelătorul are mai puțin timp.</p>`,
   altfel:`<p>E ca atunci când pierzi cheia de la casă: nu aștepți să vezi dacă o găsește cineva, schimbi imediat încuietoarea, împreună cu părinții.</p>`,
   incearca:{t:'choice',q:'Maia apăsase deja pe link și își scrisese parola acolo. Ce e cel mai important acum?',o:['Spune imediat unui adult și schimbă parola împreună cu el','Nu spune nimănui, de rușine','Așteaptă să vadă ce se întâmplă','Își face alt cont și îl uită pe cel vechi'],ok:0,ajutor:'Primul pas din listă.',why:'Cu cât parola e schimbată mai repede, cu atât înșelătorul are mai puțin timp să intre în cont.'},
   inca:[
    {t:'order',q:'Ai deschis un atașament ciudat și ți-ai scris parola pe un site. Pune pașii în ordine.',items:['Spui imediat unui adult','Schimbați parola împreună','O schimbați și pe celelalte conturi cu aceeași parolă','Faceți o scanare cu antivirusul'],ajutor:'Adultul e mereu primul.',why:'Adultul te ajută la toți ceilalți pași; parola se schimbă întâi, apoi verificați calculatorul.'}
   ]}
 ],
 atelier:{t:'posta',mod:'muta',titlu:'Curăță cutia Maiei',
  intro:`<p>În cutia Maiei au venit mesaje amestecate: unele adevărate, altele capcane. <strong>Sarcina:</strong> citește fiecare mesaj și verifică cele șase semne. Mută capcanele în <b>Spam</b>; mesajele adevărate rămân în <b>Primite</b>. Nu apeși pe nimic din ele: aici doar le muți.</p>`,
  q:'Mută capcanele în Spam, lasă mesajele adevărate în Primite.',eu:'maia.radu@joc-mail.test',
  dosare:['Primite','Spam'],
  mesaje:[
   {de:'diriginta@joc-mail.test',subiect:'Ședința cu părinții',text:'Bună ziua, Maia! Ședința e joi la ora 18. Spune-le, te rog, părinților.',dosar:'Primite'},
   {de:'echipa@j0c-mail.test',subiect:'URGENT: contul tău se închide',text:'Dragă utilizator, trimite-ne parola în 24 de ore.',dosar:'Spam'},

   {de:'suport@joc-mail.verificare-cont.test',subiect:'Verifică-ți contul',text:'Intră pe link și scrie parola, altfel pierzi toate mesajele.',dosar:'Spam'}],

  ]},

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Echipa</title>
<meta name="description" content="Lecție-joc pentru clasa a VII-a: aplicații colaborative, conectare, documente și prezentări lucrate în echipă, istoricul versiunilor, etică, hacker și cracker, protecția împotriva fraudei online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,400&family=Inconsolata:wght@500;700&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#F1EFF7; --paper:#FFFFFF; --paper2:#F5F3FA; --line:#DAD5E8;
  --ink:#1E1A2E; --ink2:#5E5873; --accent:#5B3FB8; --accentInk:#FFFFFF; --sel:#E4DCFA;
  --mark:#FFE08A; --markInk:#1E1A2E; --ok:#23784A; --okbg:#E0F2E7; --bad:#B8362E; --badbg:#FBE6E3;
  --fd:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --fb:"Libre Franklin","Segoe UI",system-ui,sans-serif; --fm:"Inconsolata",Consolas,monospace;
  --u1:#D9480F; --u2:#1C7ED6; --u3:#2B8A3E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#121018; --paper:#1B1824; --paper2:#242031; --line:#363049;
  --ink:#ECE8F7; --ink2:#AAA3C0; --accent:#B39CFF; --accentInk:#121018; --sel:#33295A;
  --mark:#EDCB63; --markInk:#1E1A2E; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
  --u1:#FF8A50; --u2:#5AB0FF; --u3:#63D37A;
}}
:root[data-theme="dark"]{
  --desk:#121018; --paper:#1B1824; --paper2:#242031; --line:#363049;
  --ink:#ECE8F7; --ink2:#AAA3C0; --accent:#B39CFF; --accentInk:#121018; --sel:#33295A;
  --mark:#EDCB63; --markInk:#1E1A2E; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
  --u1:#FF8A50; --u2:#5AB0FF; --u3:#63D37A;
}
/* tema jocului: antetul unui document partajat, cu inițialele colegilor conectați și butonul de partajare */
.banda{display:flex;align-items:center;gap:8px;padding:7px 12px;white-space:nowrap;overflow:hidden}
.doc{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--fm);font-size:.78rem;color:var(--ink2)}
.doc b{color:var(--ink)}
.cine{flex:none;display:flex}
.cine i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-left:-5px;border:2px solid var(--paper);font-family:var(--fb);font-size:.62rem;font-weight:700;color:#fff}
.cine i:nth-child(1){background:var(--u1);margin-left:0}
.cine i:nth-child(2){background:var(--u2)}
.cine i:nth-child(3){background:var(--u3)}
.part{flex:none;font-family:var(--fb);font-size:.7rem;font-weight:700;color:var(--accentInk);background:var(--accent);border-radius:999px;padding:2px 10px}
h1 .cur{display:inline-block;width:3px;height:.9em;background:var(--u2);margin-left:.15em;vertical-align:-.1em;position:relative}
.hunt .tk{text-align:left}
/* simulatoarele: fereastra de partajare, sugestiile de pe margine, istoricul versiunilor */
.sim{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden;max-width:100%}
.sim-cap{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper2);border-bottom:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:.95rem;flex-wrap:wrap}
.sim-cap small{font-family:var(--fb);font-weight:400;color:var(--ink2);font-size:.8rem}
.sh-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sh-row:last-child{border-bottom:0}
.sh-av{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:.8rem;background:var(--u2)}
.sh-row:nth-child(3n+1) .sh-av{background:var(--u1)}
.sh-row:nth-child(3n+2) .sh-av{background:var(--u3)}
.sh-nume{flex:1 1 150px;min-width:0}
.sh-nume small{display:block;color:var(--ink2);font-size:.8rem}
.sim select{font:inherit;font-size:.92rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.sh-link{background:var(--paper2)}
.sh-row.right{background:var(--okbg)} .sh-row.wrong{background:var(--badbg)}
.sg-doc{padding:12px}
.sg-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;background:var(--paper)}
.sg-item:last-child{margin-bottom:0}
.sg-text{line-height:1.6}
.sg-text ins{color:var(--u2);text-decoration:underline;text-decoration-thickness:2px}
.sg-text del{color:var(--bad)}
.sg-bal{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--ink2);flex-wrap:wrap}
.sg-bal .sp{flex:1 1 auto}
.sg-bal button{font:inherit;font-weight:700;min-width:44px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
.sg-bal button.on[data-v="1"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.sg-bal button.on[data-v="0"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.sg-item.right{border-color:var(--ok);background:var(--okbg)} .sg-item.wrong{border-color:var(--bad);background:var(--badbg)}
.is-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.is-bar input[type=range]{flex:1 1 140px;accent-color:var(--accent)}
.is-bar button{font:inherit;min-width:40px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
.is-info{padding:8px 12px;font-family:var(--fm);font-size:.9rem;background:var(--sel);color:var(--ink)}
.is-pag{padding:12px 14px;line-height:1.55;min-height:120px}
.is-pag h4{margin:0 0 6px;font-family:var(--fd)}
.is-pag p{margin:0 0 6px}
.cn-tab{display:flex;align-items:center;gap:6px;padding:6px 10px 0;background:var(--paper2)}
.cn-fila{background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:5px 10px;font-size:.85rem;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn-tab button,.cn-bar button,.cn-pag button{font:inherit;min-height:36px;min-width:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
.cn-bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--paper2)}
.cn-bar input{flex:1 1 auto;min-width:0;font:inherit;font-family:var(--fm);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cn-pag{padding:12px 14px;min-height:150px;line-height:1.5}
.cn-pag h4{margin:0 0 8px;font-family:var(--fd)}
.cn-pag label{display:block;margin:0 0 8px}
.cn-pag label input{display:block;width:100%;max-width:280px;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cn-pag .cn-log,.cn-pag .cn-out{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:700;padding:0 14px}
.cn-err{color:var(--bad);margin:6px 0 0}
.cn-gol{color:var(--ink2)}
.cn-cont{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.cn-cont .sp{flex:1 1 auto;font-weight:700}
.cn-pag .cn-av{border-radius:50%;background:var(--u2);color:#fff;font-weight:700;border:0}
.cn-meniu{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:0 0 8px}
.cn-lista{list-style:none;padding:0;margin:0}
.cn-lista li{margin:0 0 6px}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script src="../_ghiduri/cont-drive/pasi.js"></script>
<script src="../_ghiduri/docs/pasi.js"></script>
<script>
/* MISIUNEA ECHIPA, rescrisă pe PAȘI (26.09.2026).
   Profesorul: „informația e prea condensată - nu e beginner friendly - e mai mult test decât asistență de învățare”;
   „să ofere informații și sarcini simple (cu variante reale pentru consolidare - la cerere) și posibilitatea efectivă a exersării - simulare a aplicației adevărate”.
   De aceea: fiecare nivel = pași mici (o idee, un exemplu „Uite cum”, „Explică-mi altfel”, exercițiu cu indiciu și variante),
   atelier (fereastra de partajare, sugestiile de pe margine și istoricul versiunilor, simulate), apoi verificarea — doar pe ce s-a predat.
   Capturile sunt din CryptPad (aplicație colaborativă gratuită, în română); numele din Google Docs / Word pe web sunt date în română și engleză. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../colaborare-vii/img/${f}" target="_blank"><img src="../colaborare-vii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

/* ================= SIMULATOARELE JOCULUI ================= */
const ROLURI=['Editor','Comentator','Cititor'];
const LINK=['Doar persoanele invitate','Oricine are linkul — poate doar citi','Oricine are linkul — poate modifica'];

/* fereastra de partajare: dai fiecărui om rolul potrivit și alegi cine poate deschide linkul */
const SimPartajare={
  render(Q,body,api){
    const esc=api.esc;
    body.innerHTML=`<div class="sim" role="group" aria-label="Fereastra de partajare, simulată">
      <div class="sim-cap">Partajează „${esc(Q.doc)}” <small>(fereastra de partajare, simplificată)</small></div>
      ${Q.persoane.map((p,k)=>`<div class="sh-row" data-k="${k}"><span class="sh-av" aria-hidden="true">${esc(p[0].slice(0,1))}</span>
        <span class="sh-nume"><b>${esc(p[0])}</b><small>${esc(p[2]||'')}</small></span>
        <select aria-label="Rolul lui ${esc(p[0])}"><option value="">alege rolul…</option>${ROLURI.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>`).join('')}
      <div class="sh-row sh-link" data-k="link"><span class="sh-nume"><b>Cine poate deschide linkul</b><small>ceilalți oameni, care nu sunt în listă</small></span>
        <select aria-label="Cine poate deschide linkul">${LINK.map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select></div>
    </div>`;
    const sel=[...body.querySelectorAll('.sh-row')].map(r=>r.querySelector('select'));
    body._pune=(roluri,link)=>{roluri.forEach((r,k)=>sel[k].value=r);sel[sel.length-1].value=String(link);body.querySelectorAll('.sh-row').forEach(r=>r.classList.remove('right','wrong'))};
    sel.forEach(s=>s.addEventListener('change',()=>s.closest('.sh-row').classList.remove('right','wrong')));
    const nav=api.checkButton(()=>{
      if(sel.slice(0,-1).some(s=>!s.value)){api.feedback('bad','<strong>Mai ai oameni fără rol.</strong> Alege un rol pentru fiecare.');return}
      let rau=[];
      Q.persoane.forEach((p,k)=>{const ok=sel[k].value===p[1];sel[k].closest('.sh-row').classList.toggle('right',ok);sel[k].closest('.sh-row').classList.toggle('wrong',!ok);if(!ok)rau.push(p[0])});
      const lk=sel[sel.length-1],okL=+lk.value===Q.link;lk.closest('.sh-row').classList.toggle('right',okL);lk.closest('.sh-row').classList.toggle('wrong',!okL);if(!okL)rau.push('linkul');
      if(!rau.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`Nu e bine încă la: <b>${rau.map(esc).join(', ')}</b> (marcate cu roșu). Recitește sarcina: cine scrie, cine doar corectează, cine doar citește?`);
        api.revealButton(()=>{body._pune(Q.persoane.map(p=>p[1]),Q.link);body.querySelectorAll('.sh-row').forEach(r=>r.classList.add('right'));nav.innerHTML='';
          api.giveUp(Q.persoane.map(p=>`${esc(p[0])} → <b>${p[1]}</b>`).join('; ')+`; linkul → <b>${LINK[Q.link]}</b>.`)})}
    },'Trimite invitațiile');
  },
  rezolva(Q,body){body._pune(Q.persoane.map(p=>p[1]),Q.link)},
  gresit(Q,body){body._pune(Q.persoane.map(()=>'Editor'),2)}      // greșeala tipică: toți Editori, link deschis tuturor
};

/* modul sugestii: autorul acceptă (bifa) sau respinge (X) fiecare sugestie de pe margine */
const SimSugestii={
  render(Q,body,api){
    const esc=api.esc,alegere=Q.items.map(()=>null);
    body.innerHTML=`<div class="sim"><div class="sim-cap">${esc(Q.doc)} <small>· modul sugestii · tu ești ${esc(Q.autor)}</small></div><div class="sg-doc">
      ${Q.items.map((it,k)=>`<div class="sg-item" data-k="${k}"><div class="sg-text">${it.html}</div>
        <div class="sg-bal"><span class="sp">Sugestie de la <b>${esc(it.de)}</b></span>
        <button type="button" data-v="1" aria-pressed="false" aria-label="Acceptă sugestia">✓</button><button type="button" data-v="0" aria-pressed="false" aria-label="Respinge sugestia">✗</button></div></div>`).join('')}
    </div></div>`;
    const draw=()=>body.querySelectorAll('.sg-item').forEach(el=>{const k=+el.dataset.k;el.querySelectorAll('button').forEach(b=>{const on=alegere[k]!==null&&+b.dataset.v===(alegere[k]?1:0);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))})});
    body.querySelectorAll('.sg-item').forEach(el=>{const k=+el.dataset.k;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(api.done())return;alegere[k]=b.dataset.v==='1';el.classList.remove('right','wrong');draw()})});
    body._pune=v=>{v.forEach((x,k)=>alegere[k]=x);body.querySelectorAll('.sg-item').forEach(el=>el.classList.remove('right','wrong'));draw()};
    const nav=api.checkButton(()=>{
      if(alegere.some(a=>a===null)){api.feedback('bad','<strong>Mai ai sugestii fără răspuns.</strong> Apasă ✓ sau ✗ la fiecare.');return}
      let rau=0;body.querySelectorAll('.sg-item').forEach(el=>{const k=+el.dataset.k,ok=alegere[k]===Q.items[k].ok;el.classList.toggle('right',ok);el.classList.toggle('wrong',!ok);if(!ok)rau++});
      if(!rau){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${rau===1?'O sugestie are':rau+' sugestii au'} răspunsul greșit (marcate cu roșu). Întreabă-te: face textul mai bun sau strică munca cuiva?`);
        api.revealButton(()=>{body._pune(Q.items.map(i=>i.ok));body.querySelectorAll('.sg-item').forEach(el=>el.classList.add('right'));nav.innerHTML='';
          api.giveUp(Q.items.map(i=>`${i.ok?'✓ acceptată':'✗ respinsă'}: ${i.de_ce}`).join('<br>'))})}
    },'Gata, am hotărât');
  },
  rezolva(Q,body){body._pune(Q.items.map(i=>i.ok))},
  gresit(Q,body){body._pune(Q.items.map(()=>true))}               // greșeala tipică: accepți tot fără să citești
};

/* istoricul versiunilor: tragi de bară, citești data, ora și autorul, apoi restaurezi varianta bună */
const SimIstoric={
  render(Q,body,api){
    const esc=api.esc,n=Q.versiuni.length;let v=n-1;
    body.innerHTML=`<div class="sim"><div class="sim-cap">Istoricul versiunilor · ${esc(Q.doc)}</div>
      <div class="is-bar"><button type="button" class="is-p" aria-label="Versiunea mai veche">◀</button>
      <input type="range" min="0" max="${n-1}" step="1" value="${n-1}" aria-label="Bara versiunilor"><button type="button" class="is-n" aria-label="Versiunea mai nouă">▶</button></div>
      <div class="is-info" aria-live="polite"></div><div class="is-pag"></div></div>`;
    const rng=body.querySelector('input'),info=body.querySelector('.is-info'),pag=body.querySelector('.is-pag');
    const draw=()=>{const x=Q.versiuni[v];rng.value=v;info.innerHTML=`Versiunea ${v+1} din ${n} · ${esc(x.cand)} · <b>${esc(x.cine)}</b>${v===n-1?' · (acum)':''}`;pag.innerHTML=x.html};
    rng.addEventListener('input',()=>{v=+rng.value;draw()});
    body.querySelector('.is-p').onclick=()=>{if(v>0){v--;draw()}};
    body.querySelector('.is-n').onclick=()=>{if(v<n-1){v++;draw()}};
    body._pune=k=>{v=k;draw()};draw();
    const nav=api.checkButton(()=>{
      if(v===Q.ok){nav.innerHTML='';api.resolve(true)}
      else if(v===n-1)api.resolve(false,'Asta e varianta de acum: ea are deja problema. Mergi înapoi pe bară.');
      else api.resolve(false,`Ai ales varianta de la ${esc(Q.versiuni[v].cand)}. Citește-o toată: are tot ce trebuie? E cea mai nouă variantă bună?`);
      if(v!==Q.ok)api.revealButton(()=>{body._pune(Q.ok);nav.innerHTML='';api.giveUp(`versiunea ${Q.ok+1}, de la ${esc(Q.versiuni[Q.ok].cand)} (${esc(Q.versiuni[Q.ok].cine)}).`)});
    },'Restaurează această versiune');
  },
  rezolva(Q,body){body._pune(Q.ok)},
  gresit(Q,body){body._pune(Q.versiuni.length-1)}                // greșeala tipică: rămâi pe varianta de acum
};

/* conectarea: bara de adresă → pagina de conectare → lista documentelor → documentul → meniul contului → Deconectează-te.
   Capcana: X-ul filei o închide, dar contul rămâne conectat (la redeschidere intri direct în cont). */
const SimConectare={
  render(Q,body,api){
    const esc=api.esc;let st={adresa:false,conectat:false,doc:false,deconectat:false,inchis:false};
    body.innerHTML=`<div class="sim cn" role="group" aria-label="Browserul de pe calculatorul școlii, simulat">
      <div class="sim-cap">Bilețelul tău: <small>adresa <b>${esc(Q.adresa)}</b> · utilizator <b>${esc(Q.user)}</b> · parola <b>${esc(Q.parola)}</b></small></div>
      <div class="cn-tab"><span class="cn-fila">${esc(Q.aplicatie)}</span><button type="button" class="cn-x" aria-label="Închide fila">✕</button></div>
      <form class="cn-bar"><input type="text" class="cn-url" aria-label="Bara de adresă" placeholder="Scrie adresa aici" autocomplete="off" spellcheck="false"><button type="submit">Du-te</button></form>
      <div class="cn-pag" aria-live="polite"></div></div>`;
    const url=body.querySelector('.cn-url'),pag=body.querySelector('.cn-pag');
    const draw=()=>{
      if(st.inchis){pag.innerHTML=`<p><b>Fila e închisă.</b> Dar browserul ține minte contul: dacă următorul elev scrie adresa, intră direct în contul tău. Scrie din nou adresa ca să vezi.</p>`;return}
      if(!st.adresa){pag.innerHTML=`<p class="cn-gol">Pagină goală. Scrie în bara de adresă adresa de pe bilețel și apasă „Du-te”.</p>`;return}
      if(st.deconectat){pag.innerHTML=`<p><b>Te-ai deconectat.</b> Apare iar pagina de conectare: următorul elev nu mai ajunge în contul tău.</p>`;return}
      if(!st.conectat){pag.innerHTML=`<h4>${esc(Q.aplicatie)} · Conectare</h4>
        <label>Nume utilizator <input type="text" class="cn-u" autocomplete="off"></label>
        <label>Parolă <input type="password" class="cn-p" autocomplete="off"></label>
        <button type="button" class="cn-log">Loghează-te</button><p class="cn-err"></p>`;
        pag.querySelector('.cn-log').onclick=()=>{
          const u=pag.querySelector('.cn-u').value.trim().toLowerCase(),p=pag.querySelector('.cn-p').value;
          if(u===Q.user.toLowerCase()&&p===Q.parola){st.conectat=true;draw()}
          else pag.querySelector('.cn-err').textContent='Numele de utilizator sau parola nu sunt bune. Copiază-le exact de pe bilețel.'};return}
      const cont=`<div class="cn-cont"><span class="sp">${st.doc?esc(Q.doc):'Documentele mele'}</span><button type="button" class="cn-av" aria-label="Meniul contului" aria-expanded="false">${esc(Q.user.slice(0,1).toUpperCase())}</button></div><div class="cn-meniu" hidden><b>${esc(Q.user)}</b><button type="button" class="cn-out">Deconectează-te</button></div>`;
      pag.innerHTML=cont+(st.doc?`<p>${esc(Q.text)}</p><p class="cn-gol">Ai lucrat la document. Ora s-a terminat: pleci de la calculator.</p>`
        :`<ul class="cn-lista"><li><button type="button" class="cn-d">📄 ${esc(Q.doc)}</button></li><li class="cn-gol">📄 Tema la română</li></ul>`);
      const av=pag.querySelector('.cn-av'),m=pag.querySelector('.cn-meniu');
      av.onclick=()=>{m.hidden=!m.hidden;av.setAttribute('aria-expanded',String(!m.hidden))};
      pag.querySelector('.cn-out').onclick=()=>{if(!st.doc){api.feedback('bad','Întâi deschide documentul și lucrează în el; deconectarea vine la plecare.');return}st.deconectat=true;draw()};
      const d=pag.querySelector('.cn-d');if(d)d.onclick=()=>{st.doc=true;draw()};
    };
    body.querySelector('.cn-bar').onsubmit=e=>{e.preventDefault();
      if(url.value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/$/,'')===Q.adresa){st.adresa=true;st.inchis=false;draw()}
      else api.feedback('bad','Adresa nu e cea de pe bilețel. Verifică literă cu literă.')};
    body.querySelector('.cn-x').onclick=()=>{st.inchis=true;st.adresa=false;url.value='';draw()};
    body._pune=s=>{st=Object.assign({adresa:false,conectat:false,doc:false,deconectat:false,inchis:false},s);url.value=st.adresa?Q.adresa:'';draw()};
    draw();
    const nav=api.checkButton(()=>{
      if(st.deconectat){nav.innerHTML='';api.resolve(true);return}
      let m;
      if(!st.conectat)m='Nu te-ai conectat încă: scrie adresa, apoi numele de utilizator și parola de pe bilețel și apasă „Loghează-te”.';
      else if(!st.doc)m='Te-ai conectat, dar n-ai deschis documentul echipei din lista ta.';
      else if(st.inchis)m='Ai închis doar fila: contul a rămas conectat în browser. Scrie iar adresa: vei intra direct în cont. Deconectează-te din meniul contului.';
      else m='Contul e încă deschis. Apasă pe cercul cu inițiala ta, sus în dreapta, apoi pe „Deconectează-te”.';
      api.resolve(false,m);
      api.revealButton(()=>{body._pune({adresa:true,conectat:true,doc:true,deconectat:true});nav.innerHTML='';
        api.giveUp('adresa în bara de adresă → numele de utilizator și parola → <b>Loghează-te</b> → documentul din listă → cercul cu inițiala → <b>Deconectează-te</b>.')});
    },'Am terminat ora');
  },
  rezolva(Q,body){body._pune({adresa:true,conectat:true,doc:true,deconectat:true})},
  gresit(Q,body){body._pune({adresa:false,conectat:true,doc:true,inchis:true})}   // greșeala tipică: închizi doar fila
};

<li>la plecare, apasă pe <b>cercul cu inițiala ta</b> (sus în dreapta) și alege <b>Deconectează-te</b>. Nu te baza pe X-ul filei (pasul 4).</li></ol>
<p>La final apasă <b>Am terminat ora</b>.</p>
${fig('conectare.webp',1000,469,'Google Chrome pe un profil nou: pagina de conectare a aplicației CryptPad, cu bara de adresă, casetele Nume utilizator și Parolă și butonul Loghează-te','Așa arată pagina de conectare în aplicația adevărată.')}`,
  q:'Conectează-te, deschide documentul echipei și deconectează-te corect.',adresa:'cryptpad.fr',aplicatie:'CryptPad',user:'ana.7b',parola:'LupulCiteste-Sub3Stele',doc:'Povestea clasei',text:'Pe dealul Cozla, castanii bătrâni păzesc orașul.',
  ajutor:'Adresa, numele și parola le copiezi exact de pe bilețel. La final: cercul cu inițiala → Deconectează-te, nu X-ul filei.',
  why:'Ai intrat în patru pași și ai plecat deconectat, ca următorul elev să nu intre în contul tău.',
  inca:[
   {t:'order',q:'Ordonează ce faci în ora de laborator.',items:['Deschizi browserul','Scrii adresa aplicației în bara de adresă','Te conectezi cu contul de elev','Deschizi documentul echipei','Scrii partea ta în document','Te deconectezi din meniul contului'],ajutor:'Primii patru sunt pașii de intrare. Ultimul e mereu deconectarea, nu închiderea filei.',why:'Intri în patru pași, lucrezi, iar la plecare te deconectezi, ca următorul elev să nu intre în contul tău.'},
   {t:'classify',q:'Bine sau periculos, pe un calculator din laborator?',cats:['Bine','Periculos'],items:[['Mă deconectez la final',0],['Îmi scriu parola fără să se uite cineva',0],['Folosesc contul meu de elev',0],['Salvez parola în browserul școlii',1],['Îmi las contul deschis după oră',1],['Mă conectez cu contul unui coleg',1]],ajutor:'Cine altcineva folosește calculatorul după tine?',why:'Contul tău e cheia spre toate documentele tale. Îl deschizi doar tu și îl închizi când pleci.'},
   {t:'order',q:'Primești pe e-mail invitația lui Radu la documentul lui. Pune pașii în ordine.',items:['Deschizi e-mailul cu invitația de la Radu','Apeși pe invitație','Te conectezi cu contul tău, dacă ți se cere','Scrii în documentul lui Radu'],ajutor:'Invitația te duce la document; aplicația îți cere întâi să spui cine ești.',why:'Invitația te duce la document, iar contul îi spune aplicației cine ești.'}
  ]},
 qs:[
  {t:'choice',q:'Ai terminat ora și pleci de la calculatorul din laborator. Ce faci cu contul tău?',o:['Mă deconectez din cont','Închid doar fila cu documentul','Las contul deschis pentru colegul meu','Sting doar monitorul'],ok:0,why:'Doar deconectarea închide contul. Cu fila închisă sau monitorul stins, următorul elev deschide aplicația și intră direct în contul tău.'},
  {t:'tf',q:'Dacă închid fila documentului, m-am deconectat automat din cont.',ok:false,why:'Fals. Browserul ține minte că ești conectat. Deconectarea se face din aplicație, de obicei de la pictograma contului tău.'},
  {t:'order',q:'Intri în aplicația colaborativă pe calculatorul școlii. Pune pașii în ordine.',items:['Deschizi browserul','Mergi la adresa aplicației','Te conectezi cu adresa de e-mail și parola','Deschizi documentul din lista ta'],why:'Fără browser nu ajungi la aplicație, iar fără conectare aplicația nu știe ale cui documente să-ți arate.'},
  {t:'classify',q:'Bine sau periculos, pe un calculator din laborator?',cats:['Bine','Periculos'],items:[['Mă deconectez la final',0],['Îmi scriu parola fără să se uite cineva',0],['Folosesc contul meu de elev',0],['Salvez parola în browserul școlii',1],['Îmi las contul deschis după oră',1],['Mă conectez cu contul unui coleg',1]],ajutor:'Gândește-te la următorul elev care se așază la calculator.',why:'Contul tău e cheia spre toate documentele tale. Îl deschizi doar tu și îl închizi când pleci.'},
  {t:'choice',q:'Cum ajungi la documentul creat de un coleg?',o:['Prin invitația sau linkul primit de la el','Căutând titlul documentului pe Google','Cerându-i colegului parola contului lui','Copiind documentul de pe stickul lui'],ok:0,why:'Autorul decide cine intră: trimite o invitație sau un link. Parola lui nu se cere, iar un motor de căutare nu găsește documentele private.'}
 ]},

/* ================= 3. Documente și prezentări în echipă (lecția 19) ================= */
{t:'Documente și prezentări în echipă',lectii:[19],continuturi:['Interfaţa aplicaţiei colaborative','Instrumente de lucru: documente, prezentări'],
 obiectiv:'recunoști pe ecran ce e în plus într-un document comun și partajezi un document dând fiecărui coleg rolul potrivit.',
 pasi:[
  {t:'Document sau prezentare',
   text:`<p>Aplicațiile colaborative au două <strong>instrumente</strong> de lucru principale:</p>
<ul><li><mark>documentul</mark> (Google Docs, Word pe web): text lung, citit pagină cu pagină, ca în Word;</li>
<li><mark>prezentarea</mark> (Google Slides, PowerPoint pe web): diapozitive care se proiectează în fața altora, ca în PowerPoint.</li></ul>
<p>Butoanele de scris și formatat seamănă cu cele din Word și PowerPoint. Ce e nou sunt lucrurile pentru echipă, din pașii următori.</p>`,
   exemplu:`<p>Referatul de grup la biologie, cu capitole? <b>Document.</b> Materialul pe care îl arătați clasei, câte o imagine pe ecran? <b>Prezentare.</b></p>`,
   incearca:{t:'classify',q:'Document sau prezentare?',cats:['Document','Prezentare'],items:[['Povestea clasei, scrisă capitol cu capitol',0],['Regulamentul clubului de lectură',0],['Diapozitivele pentru ora de dirigenție',1],['Prezentarea proiectului în fața clasei',1]],ajutor:'Se citește pagină cu pagină sau se proiectează?',why:'Textul lung merge într-un document; ce se proiectează în fața altora merge într-o prezentare.'},
   inca:[
    {t:'tf',q:'Ca să lucreze la aceeași prezentare, toți membrii echipei trebuie să fie în aceeași sală.',ok:false,ajutor:'Unde stă prezentarea? (nivelul 1)',why:'Fals. Prezentarea stă în cloud: fiecare lucrează de unde are Internet.'}
   ]},
  {t:'Cine mai e în document',
   text:`<p>Într-un document comun vezi mereu <strong>cine mai lucrează</strong> acum:</p>
<ul><li>sus (sau într-o listă, în dreapta) apar <strong>pictogramele</strong> celor conectați: inițialele sau pozele lor;</li>
<li>în text, fiecare coleg are <strong>cursorul lui colorat</strong>, cu numele lui.</li></ul>
<p>Așa nu scrieți doi în același loc.</p>
${fig('utilizatori.webp',440,240,'CryptPad: lista Utilizatori, cu doi oameni în document, fiecare cu culoarea lui pe margine','Lista <b>Utilizatori</b> din CryptPad. „An” sunt inițialele Anei; celălalt a intrat fără cont, de aceea scrie <b>Oaspete</b>.')}`,
   incearca:{t:'tf',q:'Un cursor colorat cu numele „Radu” în document arată unde scrie Radu chiar acum.',ok:true,ajutor:'Al doilea punct din listă.',why:'Adevărat. Fiecare coleg conectat are cursorul lui, colorat și cu numele lui.'},
   inca:[
    {t:'choice',q:'În lista de sus vezi pictogramele cu inițialele A, R și M. Ce înseamnă?',o:['Ana, Radu și Mihai sunt acum în document','Ana, Radu și Mihai au șters documentul','Sunt butoanele de formatare','Sunt notele primite de la profesor'],ok:0,ajutor:'Primul punct din listă: ce arată pictogramele?',why:'Pictogramele arată cine e conectat acum la document.'}
   ]},
  {t:'Rolurile: Editor, Comentator, Cititor',
   text:`<p>Când inviți pe cineva, alegi ce <mark>rol</mark> are, adică <strong>cât poate schimba</strong>. În Google Docs sunt trei:</p>
<ul><li><strong>Editor</strong> (engleză <em>Editor</em>): scrie, șterge, formatează;</li>
<li><strong>Comentator</strong> (<em>Commenter</em>): lasă doar comentarii, textul rămâne neschimbat;</li>
<li><strong>Cititor</strong> (<em>Viewer</em>): doar citește.</li></ul>
<p>Alte aplicații au nume puțin diferite. Ține mouse-ul pe opțiune și citește ce face.</p>`,
   exemplu:`<p>Echipa scrie povestea clasei. Ana, Ioana și Mihai scriu capitole: <b>Editor</b>. Radu doar corectează și lasă observații: <b>Comentator</b>. Bunica Anei vrea doar s-o citească: <b>Cititor</b>.</p>`,
   altfel:`<p>Gândește-te la o piesă de teatru a clasei. Actorii joacă și schimbă scena (Editori). Regizorul stă pe margine și dă sfaturi, dar nu urcă pe scenă (Comentator). Publicul doar privește (Cititor).</p>`,
   incearca:{t:'match',q:'Leagă fiecare rol de ce permite.',pairs:[['Editor','scrie, șterge și formatează'],['Comentator','lasă observații, textul rămâne neschimbat'],['Cititor','doar citește documentul']],ajutor:'Lista din pas are exact trei rânduri.',why:'Rolul hotărăște cât poate schimba fiecare.'},
   inca:[
    {t:'choice',q:'Colegul care corectează proiectul trebuie doar să lase observații, fără să schimbe textul. Ce rol îi dai?',o:['Comentator','Editor','Cititor'],ok:0,ajutor:'Care rol lasă textul neschimbat, dar permite observații?',why:'Comentatorul lasă observații, iar textul rămâne cum l-ați scris.'},
    {t:'choice',q:'Ce rol primește colegul care scrie un capitol?',o:['Editor','Comentator','Cititor'],ok:0,ajutor:'Care rol poate scrie în text?',why:'Doar Editorul poate adăuga text.'}
   ]},
  {t:'Strategia: cum partajezi fără greșeli',
   text:`<p>Butonul de <mark>partajare</mark> e de obicei <strong>sus, în dreapta</strong> (în engleză <em>Share</em>; în CryptPad <b>Distribuie</b>). Deschide o fereastră. Lucrezi așa:</p>
<ol><li>Scrii <strong>cine</strong> primește documentul.</li>
<li>La fiecare om întrebi: <strong>scrie?</strong> → Editor. <strong>Doar corectează?</strong> → Comentator. <strong>Doar citește?</strong> → Cititor.</li>
<li>Alegi cine poate deschide <strong>linkul</strong>: de obicei <strong>doar persoanele invitate</strong>. Niciodată „oricine are linkul” ca Editor.</li>
<li><strong>Recitești lista</strong>, apoi trimiți.</li></ol>`,
   exemplu:`${fig('partajare-roluri.webp',800,706,'CryptPad: fereastra Distribuie, cu Drepturi de acces — Vizualizează sau Editează — și linkul documentului, acoperit','Fereastra <b>Distribuie</b> din CryptPad. La <b>Drepturi de acces</b> alegi: doar <b>Vizualizează</b> (ca un Cititor) sau și <b>Editează</b> (ca un Editor). Linkul e acoperit: el deschide chiar documentul.')}`,
   altfel:`<p>E ca atunci când dai chei ale casei: familiei îi dai cheia de la ușă (Editor), vecinului care udă florile îi dai voie doar în grădină (Comentator), iar musafirilor le deschizi tu și doar se uită (Cititor). Nu lași cheia sub preș pentru oricine (linkul deschis tuturor ca Editor).</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii partajării.',items:['Scrii cine primește documentul','Alegi rolul fiecăruia','Alegi cine poate deschide linkul','Recitești lista și trimiți'],ajutor:'Lista numerotată din pas.',why:'Întâi oamenii, apoi rolul fiecăruia, apoi linkul, iar la final o verificare.'},
   inca:[
    {t:'tf',q:'E în regulă să partajezi documentul echipei cu „oricine are linkul”, ca Editor.',ok:false,ajutor:'Pasul 3 din listă.',why:'Fals. Oricine primește linkul, chiar și un străin, ar putea schimba sau șterge munca echipei.'}
   ]}
 ],
 atelier:{t:'partajare',titlu:'Partajează documentul echipei',
  intro:`<p>Ana a creat documentul „Povestea orașului nostru” și acum îl partajează. <strong>Sarcina:</strong> dă fiecărui om rolul potrivit și alege cine poate deschide linkul. Folosește strategia din pasul 4: la fiecare om, întreabă „scrie? doar corectează? doar citește?”.</p>`,
  q:'Ioana și Mihai scriu câte un capitol. Radu doar corectează. Bunica Anei doar citește. Nimeni altcineva nu intră.',
  doc:'Povestea orașului nostru',persoane:[['Ioana','Editor','scrie capitolul 2'],['Mihai','Editor','scrie capitolul 4'],['Radu','Comentator','doar corectează'],['Bunica Anei','Cititor','doar citește']],link:0,
  ajutor:'Scrie → Editor. Doar corectează → Comentator. Doar citește → Cititor. „Nimeni altcineva” → doar persoanele invitate.',
  why:'Fiecare are exact cât îi trebuie: scriitorii scriu, corectorul comentează, bunica citește, iar străinii nu intră.',
  inca:[
   {t:'partajare',q:'Clasa face o prezentare pentru serbare. Luca și Sara fac diapozitivele. Doamna dirigintă doar lasă observații. Părinții, care vor primi linkul, doar o privesc.',
    doc:'Serbarea de iarnă',persoane:[['Luca','Editor','face diapozitive'],['Sara','Editor','face diapozitive'],['Doamna dirigintă','Comentator','lasă observații']],link:1,
    ajutor:'Părinții nu sunt în listă: ei primesc linkul. Ce trebuie să poată face cu el?',why:'Cei din echipă au roluri; părinții primesc un link doar pentru citit, ca nimeni din afară să nu schimbe prezentarea.'},
   {t:'partajare',q:'Tu scrii un referat singur. Profesorul trebuie doar să lase comentarii, iar colegul de bancă doar să-l citească. Nimeni altcineva nu intră.',
    doc:'Referat: Munții Carpați',persoane:[['Profesorul','Comentator','lasă comentarii'],['Colegul de bancă','Cititor','doar citește']],link:0,
    ajutor:'Nimeni în afară de ei doi nu are voie: ce alegi la link?',why:'Profesorul comentează fără să-ți schimbe textul, colegul citește, iar linkul rămâne închis pentru ceilalți.'}
  ]},
 qs:[
  {t:'choice',q:'Colegul care corectează proiectul trebuie doar să lase observații, fără să schimbe textul. Ce rol îi dai?',o:['Comentator','Editor','Cititor'],ok:0,why:'Comentatorul lasă observații pe margine, iar textul rămâne cum l-ați scris. Editorul ar putea schimba textul, iar Cititorul nu poate lăsa nici comentarii.'},
  {t:'match',q:'Leagă fiecare rol sau buton de ce permite.',pairs:[['Editor','scrie, șterge și formatează'],['Comentator','lasă observații, textul rămâne neschimbat'],['Cititor','doar citește documentul'],['Butonul de partajare','inviți colegii în document']],why:'Rolul hotărăște cât poate schimba fiecare. Îl alegi când partajezi.'},
  {t:'tf',q:'Un cursor colorat cu numele „Radu” în document arată unde scrie Radu chiar acum.',ok:true,why:'Adevărat. Fiecare coleg conectat are cursorul lui, colorat și cu numele lui. Așa nu scrieți doi în același loc.'},
  {t:'classify',q:'Document sau prezentare?',cats:['Document','Prezentare'],items:[['Povestea clasei, scrisă capitol cu capitol',0],['Regulamentul clubului de lectură',0],['Referatul de grup la biologie',0],['Diapozitivele pentru ora de dirigenție',1],['Materialul proiectat la serbare, câte o imagine pe diapozitiv',1],['Prezentarea proiectului în fața clasei',1]],why:'Textul lung, citit pagină cu pagină, merge într-un document. Ce se proiectează și se arată în fața altora merge într-o prezentare.'},
  {t:'tf',q:'Ca să lucreze la aceeași prezentare, toți membrii echipei trebuie să fie în aceeași sală.',ok:false,why:'Fals. Prezentarea stă în cloud. Fiecare lucrează de unde are Internet, iar modificările apar la toți.'},
  {t:'choice',q:'Partajezi povestea echipei. Ce alegi la „cine poate deschide linkul”?',o:['Doar persoanele invitate','Oricine are linkul, ca Editor','Oricine are linkul, ca Comentator','Nu contează ce aleg'],ok:0,ajutor:'Pasul 3 din strategia de partajare.',why:'Documentul echipei îl deschid doar cei invitați. Un link deschis tuturor ca Editor lasă pe oricine să strice munca voastră.'}
 ]},

/* ================= 4. Modific, urmăresc, public (lecția 20) ================= */
{t:'Modific, urmăresc, public',lectii:[20],continuturi:['Operații permise în aplicație: publicare, modificare conținuturi în aplicația colaborativă'],
 obiectiv:'schimbi textul fără să strici munca altuia (comentariu, sugestie), găsești în istoric cine a scris ce, restaurezi o variantă și publici materialul gata.',
 pasi:[
  {t:'Modificare directă sau comentariu',
   text:`<p>Cei cu rol de <strong>Editor</strong> pot <mark>modifica</mark> direct textul: scriu, șterg, formatează.</p>
<p>Dar dacă textul e al unui coleg? Nu îl schimbi pe ascuns. Lași un <mark>comentariu</mark>: marchezi cuvântul și scrii părerea ta pe margine. Pe margine apar <strong>numele tău și ora</strong>, iar textul rămâne neatins.</p>
<p>În CryptPad, comentariul îl pui din fila <b>Colaborare</b> → <b>Adaugă comentariu</b>.</p>
${fig('fila-colaborare.webp',700,68,'CryptPad: fila Colaborare, cu butoanele Adaugă comentariu și Urmărirea modificărilor încadrate','Fila <b>Colaborare</b> din CryptPad: <b>Adaugă comentariu</b> și <b>Urmărirea modificărilor</b>.')}`,
   exemplu:`${fig('comentariu.webp',760,190,'CryptPad: cuvântul castan e marcat în text, iar pe margine e caseta de comentariu, cu numele autorului și ora','Un comentariu pe cuvântul marcat: pe margine, numele celui care scrie și ora. Textul rămâne neatins.')}`,
   incearca:{t:'choice',q:'Crezi că un cuvânt din capitolul Ioanei e greșit. Ce faci?',o:['Îl marchezi și lași un comentariu','Îl ștergi și scrii tu altul','Ștergi tot capitolul','Nu spui nimic'],ok:0,ajutor:'Al doilea paragraf al pasului.',why:'Comentariul spune părerea ta, iar Ioana hotărăște. Textul ei rămâne neatins.'},
   inca:[
    {t:'tf',q:'Când lași un comentariu, textul colegului se schimbă.',ok:false,ajutor:'Uită-te la captura cu comentariul.',why:'Fals. Comentariul stă pe margine, cu numele tău și ora; textul rămâne neatins.'}
   ]},
  {t:'Modul sugestii',
   text:`<p>Vrei să schimbi chiar tu textul, dar să hotărască autorul? Scrii în <mark>modul sugestii</mark> (în Google Docs: <em>Sugerare</em>, în engleză <em>Suggesting</em>; în CryptPad: <b>Urmărirea modificărilor</b>).</p>
<p>Ce scrii apare <strong>colorat și subliniat</strong>, iar ce ștergi apare tăiat. Pe margine apare un balon. Autorul:</p>
<ul><li>apasă <strong>bifa ✓</strong> = <strong>acceptă</strong> (schimbarea rămâne);</li>
<li>apasă <strong>X-ul ✗</strong> = <strong>respinge</strong> (textul revine cum era).</li></ul>
${fig('mod-sugestii.webp',800,115,'CryptPad: cu urmărirea modificărilor pornită, textul adăugat apare colorat și subliniat, iar pe margine apare balonul Inserat cu bifa de acceptare și X-ul de respingere','Textul adăugat, <b>colorat și subliniat</b>; pe margine, <b>bifa</b> și <b>X-ul</b>.')}`,
   altfel:`<p>E ca atunci când corectezi cu creionul pe lucrarea unui prieten: el vede corectura și hotărăște dacă o trece cu pixul sau o șterge cu guma.</p>`,
   incearca:{t:'order',q:'Ana propune o schimbare în modul sugestii. Pune în ordine ce se întâmplă.',items:['Ana scrie schimbarea în modul sugestii','Autorul textului vede sugestia marcată','Autorul acceptă sau respinge sugestia','Textul rămâne în varianta hotărâtă'],ajutor:'Sugestia nu schimbă nimic până nu hotărăște autorul.',why:'Sugestia nu schimbă textul până nu hotărăște autorul. De aceea e politicoasă și sigură.'},
   inca:[
    {t:'choice',q:'Autorul apasă X-ul pe o sugestie. Ce se întâmplă?',o:['Textul revine cum era','Sugestia rămâne în text','Se șterge tot documentul','Colegul e scos din document'],ok:0,ajutor:'Lista din pas: ce face X-ul?',why:'X-ul respinge sugestia: textul revine cum îl scrisese autorul.'}
   ]},
  {t:'Istoricul versiunilor',
   text:`<p>Aplicația păstrează <strong>toate variantele</strong> documentului, în <mark>istoricul versiunilor</mark> (engleză <em>Version history</em>; în CryptPad <b>Istoric</b>). La fiecare variantă vezi <strong>cine</strong> a schimbat, <strong>ce</strong> și <strong>când</strong>. Așa se vede <mark>contribuția fiecăruia</mark>.</p>
<p>Dacă ceva s-a șters din greșeală, <strong>restaurezi</strong> o variantă mai veche. Strategia:</p>
<ol><li>Deschizi istoricul.</li>
<li>Mergi <strong>înapoi</strong> pe bară, variantă cu variantă, și citești textul.</li>
<li>Te oprești la <strong>cea mai nouă variantă bună</strong> (citește data, ora și autorul).</li>
<li>Apeși <b>Restaurează</b>.</li></ol>
${fig('istoric-versiuni.webp',405,222,'Trei decupaje din ecranul Istoric al unui document CryptPad: bara versiunilor cu mânerul, rândul cu data și ora versiunii alese, și butonul Restaurează','Istoricul din CryptPad: <b>bara</b>, <b>data și ora</b> variantei alese și butonul <b>Restaurează</b>.')}`,
   exemplu:`<p>Vineri la 11:30, Vlad a șters din greșeală capitolul Ioanei. Mergi înapoi: varianta de la 11:05 (Radu) are toate capitolele. Varianta de la 10:40 are capitolul Ioanei, dar nu și pe al lui Radu. Cea mai nouă variantă bună e cea de la <b>11:05</b>: pe ea o restaurezi.</p>`,
   altfel:`<p>E ca un album cu poze ale documentului, făcute după fiecare schimbare. Dacă azi documentul s-a stricat, răsfoiești înapoi până la ultima poză în care arăta bine și o pui înapoi.</p>`,
   incearca:{t:'order',q:'Un paragraf a dispărut. Pune în ordine pașii restaurării.',items:['Deschizi istoricul versiunilor','Mergi înapoi pe bară și citești fiecare variantă','Te oprești la cea mai nouă variantă bună','Apeși Restaurează'],ajutor:'Lista numerotată din pas.',why:'Cauți întâi varianta bună, apoi o aduci înapoi.'},
   inca:[
    {t:'tf',q:'Din istoricul versiunilor poți afla cine a scris o anumită parte din document.',ok:true,ajutor:'Ce vezi la fiecare variantă?',why:'Adevărat. Fiecare variantă are numele celui care a făcut schimbarea și ora.'},
    {t:'choice',q:'De ce alegi CEA MAI NOUĂ variantă bună, nu una foarte veche?',o:['Ca să nu pierzi munca făcută între timp','Pentru că variantele vechi nu se pot deschide','Pentru că așa cere profesorul','Nu contează pe care o alegi'],ok:0,ajutor:'Uită-te la exemplu: ce lipsea din varianta de la 10:40?',why:'O variantă mai veche nu are ce s-a scris după ea. Cea mai nouă variantă bună păstrează cât mai mult.'}
   ]},
  {t:'Publicarea',
   text:`<p>Când materialul e gata, îl <mark>publici</mark>: îl arăți și altora (părinți, altor clase), <strong>fără să-l poată schimba</strong>.</p>
<p>De obicei îl partajezi cu rolul <strong>Cititor</strong> sau printr-un <strong>link doar pentru citire</strong>. În CryptPad, la <b>Drepturi de acces</b> alegi <b>Vizualizează</b>.</p>
<p>Nu publici niciodată cu link de Editor: oricine l-ar primi ar putea strica munca echipei.</p>`,
   exemplu:`<p>Povestea e gata. Ana deschide fereastra de partajare, alege la link „Oricine are linkul — poate doar citi” și trimite linkul pe grupul părinților. Părinții o citesc; nimeni nu o poate schimba.</p>`,
   incearca:{t:'choice',q:'Echipa vrea ca părinții să vadă povestea, dar să n-o poată schimba. Cum partajați?',o:['Cu rol de Cititor','Oricine are linkul, ca Editor','Le dați parola unui membru','Cu rol de Editor pentru fiecare'],ok:0,ajutor:'Al doilea paragraf al pasului.',why:'Rolul de Cititor lasă doar citirea.'}}
 ],
 atelier:{t:'sugestii',titlu:'Tu ești autorul: acceptă sau respinge',
  intro:`<p>Tu ai scris capitolul 1. Colegii au lăsat sugestii în el, ca în captura de la pasul 2. <strong>Sarcina:</strong> la fiecare sugestie apasă <b>✓</b> (acceptă) sau <b>✗</b> (respinge). Întreabă-te: <em>face textul mai bun sau strică munca cuiva?</em></p>`,
  q:'Hotărăște fiecare sugestie din capitolul tău.',doc:'Povestea orașului nostru · Cap. 1',autor:'Ana',
  items:[
   {html:'Pe dealul Cozla, castanii <del>batrani</del> <ins>bătrâni</ins> păzesc orașul.',de:'Radu',ok:true,de_ce:'corectează diacriticele'},
   {html:'<del>Pe dealul Cozla, castanii bătrâni păzesc orașul.</del>',de:'Vlad',ok:false,de_ce:'ar șterge tot începutul capitolului tău'},
   {html:'Toamna, frunzele lor <ins>ruginii</ins> acoperă aleile.',de:'Ioana',ok:true,de_ce:'adaugă un cuvânt potrivit'},
   {html:'Toamna, frunzele acoperă aleile. <ins>Capitolul ăsta e plictisitor!</ins>',de:'Vlad',ok:false,de_ce:'nu e o îmbunătățire, e o jignire; o părere se spune politicos, într-un comentariu'}],
  ajutor:'Acceptă ce corectează sau îmbunătățește. Respinge ce șterge munca fără motiv sau jignește.',
  why:'Ai lucrat ca un autor adevărat: ai păstrat corecturile bune și ai respins ce strica povestea.',
  inca:[

    versiuni:[{cand:'vineri 10:02',cine:'Ana',html:T0},{cand:'vineri 10:15',cine:'Ana',html:T0+C1},{cand:'vineri 10:40',cine:'Ioana',html:T0+C1+C2},{cand:'vineri 11:05',cine:'Radu',html:T0+C1+C2+C3},{cand:'vineri 11:30',cine:'Vlad',html:T0+C1+C3}],ok:3,
    ajutor:'Varianta de acum (11:30) nu are capitolul 2. Mergi înapoi până îl găsești, dar fără să pierzi capitolul lui Radu.',why:'Varianta de la 11:05 are toate cele trei capitole: e cea mai nouă variantă bună.'},
   {t:'istoric',q:'Cineva a schimbat titlul poveștii în „aaaaa”. Restaurează cea mai nouă variantă cu titlul bun.',doc:'Povestea orașului nostru',
    versiuni:[{cand:'luni 12:10',cine:'Ana',html:T0+C1},{cand:'luni 12:25',cine:'Ioana',html:T0+C1+C2},{cand:'luni 12:31',cine:'Mihai',html:T0+C1+C2+C4},{cand:'luni 12:40',cine:'Oaspete',html:'<h4>aaaaa</h4>'+C1+C2+C4}],ok:2,
    ajutor:'Ultima variantă are titlul stricat. Cea dinaintea ei?',why:'Varianta de la 12:31 are titlul bun și toate capitolele, inclusiv pe al lui Mihai.'},
   {t:'sugestii',q:'Tu ai scris capitolul 3. Hotărăște sugestiile.',doc:'Povestea orașului nostru · Cap. 3',autor:'Radu',
    items:[
     {html:'Seara, pe Strada Mare se <del>aprinde</del> <ins>aprind</ins> luminile.',de:'Ana',ok:true,de_ce:'corectează acordul verbului'},
     {html:'Seara, pe Strada Mare se aprind luminile. <ins>Parola mea e castan2014.</ins>',de:'Oaspete',ok:false,de_ce:'o parolă nu se scrie niciodată într-un document comun'},
     {html:'<ins>Oamenii ies la plimbare.</ins>',de:'Mihai',ok:true,de_ce:'continuă firesc povestea'}],
    ajutor:'Îmbunătățește textul? Sau pune în pericol pe cineva?',why:'Corectura și continuarea sunt bune; parola nu are ce căuta în document.'}
  ]},
 qs:[
  {t:'choice',q:'Vrei să schimbi o frază scrisă de Ana, dar să hotărască ea. Ce folosești?',o:['Modul sugestii sau un comentariu','Ștergi fraza și o scrii tu','Îi ceri Anei parola contului','Faci o copie doar pentru tine'],ok:0,why:'Sugestia și comentariul lasă decizia la autor. Dacă ștergi direct, strici munca Anei fără s-o întrebi.'},
  {t:'tf',q:'Din istoricul versiunilor poți afla cine a scris o anumită parte din document.',ok:true,why:'Adevărat. Istoricul arată fiecare variantă, cu numele celui care a făcut schimbarea și ora. Așa se vede contribuția fiecăruia.'},
  {t:'choice',q:'Un paragraf întreg a dispărut din poveste. Ce faci?',o:['Restaurezi din istoric varianta bună','Scrii paragraful din nou, din memorie','Ștergi documentul și începi altul','Îi scoți pe toți colegii din document'],ok:0,why:'Istoricul versiunilor a păstrat varianta cu paragraful. O restaurezi și nu se pierde nimic.'},
  {t:'classify',q:'Ce folosești?',cats:['Comentariu','Istoricul versiunilor','Partajare cu rol de Cititor'],items:[['Îi spui Mihaelei că un titlu e prea lung',0],['Întrebi echipa dacă păstrați o poză',0],['Afli cine a adăugat ultimul capitol',1],['Aduci înapoi textul de ieri',1],['Arăți povestea părinților, fără s-o poată schimba',2],['Le arăți celorlalte clase prezentarea gata',2]],ajutor:'Discuție → comentariu. Cine/ce/când sau înapoi → istoric. Doar privit → Cititor.',why:'Comentariul e pentru discuție. Istoricul e pentru „cine, ce, când” și pentru a reveni. Rolul de Cititor e pentru publicare fără modificări.'},
  {t:'order',q:'Ana propune o schimbare în modul sugestii. Pune în ordine ce se întâmplă.',items:['Ana scrie schimbarea în modul sugestii','Autorul textului vede sugestia marcată','Autorul acceptă sau respinge sugestia','Textul rămâne în varianta hotărâtă'],why:'Sugestia nu schimbă textul până nu hotărăște autorul. De aceea e politicoasă și sigură.'}
 ]},

/* ================= 5. Hacker sau cracker (lecția 21) ================= */
{t:'Hacker sau cracker',lectii:[21],continuturi:['Noțiuni de etică într-un mediu colaborativ; hacker și cracker'],
 obiectiv:'respecți regulile de etică ale echipei online, găsești greșelile de etică dintr-un mesaj și faci diferența între un hacker etic și un cracker.',
 pasi:[
  {t:'Etica în echipa online',
   text:`<p><mark>Etica</mark> înseamnă regulile de purtare corectă față de ceilalți. Și în echipa online sunt patru reguli:</p>
<ol><li><strong>Nu ștergi munca altuia.</strong> Lași un comentariu sau o sugestie.</li>
<li><strong>Scrii politicos.</strong> Spui ce se poate îmbunătăți, nu jignești.</li>
<li><strong>Treci sursa</strong> textelor și imaginilor luate de la alții.</li>
<li><strong>Nu pui poze sau date ale colegilor</strong> fără acordul lor.</li></ol>`,
   exemplu:`<p>Comentariu nepoliticos: „Capitolul tău e o prostie.” Comentariu politicos: „Mi-ar plăcea să afli mai multe despre turn: poți adăuga când a fost construit?” Același gând, dar al doilea ajută.</p>`,
   incearca:{t:'classify',q:'Respectă regulile echipei?',cats:['Da','Nu'],items:[['Trec sursa sub imaginea luată de pe un site',0],['Las o sugestie în capitolul colegei',0],['Șterg capitolul care nu-mi place',1],['Pun poza unui coleg fără să-l întreb',1]],ajutor:'Ia fiecare rând și caută regula din listă.',why:'Sursa trecută și sugestia respectă echipa. Ștergerea și poza fără acord încalcă regulile 1 și 4.'},
   inca:[
    {t:'choice',q:'Care comentariu e scris politicos?',o:['Poți adăuga și anul în care a fost construit turnul?','Capitolul tău e o prostie, nu merită citit de nimeni.','Nu știi să scrii deloc, mai bine te lași de echipă.','Șterge tot ce ai scris și lasă-mă pe mine să scriu.'],ok:0,ajutor:'Care spune ce se poate îmbunătăți?',why:'Un comentariu politicos spune ce se poate îmbunătăți, fără să jignească.'}
   ]},
  {t:'Hackerul și hackerul etic',
   text:`<p>Un <mark>hacker</mark>, în sensul de la început al cuvântului, este un <strong>pasionat</strong> care înțelege foarte bine cum funcționează calculatoarele și programele.</p>
<p>Un <strong>hacker etic</strong> caută punctele slabe ale unui sistem (un site, o rețea) <strong>cu permisiunea</strong> proprietarului și <strong>le raportează</strong>, ca să fie reparate. Unele firme chiar organizează concursuri legale pentru asta.</p>`,
   altfel:`<p>E ca un lăcătuș pe care proprietarul îl cheamă să verifice dacă ușa casei se poate deschide ușor. Lăcătușul încearcă, apoi îi spune ce trebuie schimbat. Are voie, pentru că a fost chemat.</p>`,
   incearca:{t:'tf',q:'Un hacker etic verifică securitatea unui site doar cu permisiunea proprietarului și raportează ce găsește.',ok:true,ajutor:'Care două cuvinte sunt îngroșate în al doilea paragraf?',why:'Adevărat. Permisiunea face diferența.'}},
  {t:'Crackerul și legea',
   text:`<p>Un <mark>cracker</mark> intră <strong>fără drept</strong> în conturi și sisteme: ghicește sau fură parole, sparge protecția programelor, fură date ori face pagube.</p>
<p>Accesul fără drept la un sistem informatic este <strong>infracțiune</strong>: Codul penal, art. 360. Și „doar m-am uitat” în contul altuia e acces fără drept.</p>
<p>Atenție: în presă, „hacker” e folosit des și pentru crackeri.</p>
${fig('lege-art360.webp',870,320,'Portalul legislativ oficial legislatie.just.ro: Codul penal, Articolul 360, Accesul ilegal la un sistem informatic, cu pedeapsa de la 3 luni la 3 ani sau amendă','Textul legii, pe portalul oficial <b>legislatie.just.ro</b>: <b>art. 360 din Codul penal</b> — „Accesul, fără drept, la un sistem informatic se pedepsește cu închisoare de la 3 luni la 3 ani sau cu amendă”.')}`,
   exemplu:`<p>Aceeași faptă, două situații: Maria testează rețeaua școlii <b>la cererea directorului</b> și îi scrie ce a găsit: hacker etic. Andrei intră în contul unui coleg <b>ghicindu-i parola</b>: cracker, chiar dacă „doar s-a uitat”.</p>`,
   incearca:{t:'choice',q:'Ai aflat din întâmplare parola unui coleg. Ce e corect?',o:['Îi spui s-o schimbe și nu o folosești','Intri o dată în contul lui, doar să vezi','O spui și altora, ca să râdeți','Îi schimbi tu parola, să-l înveți minte'],ok:0,ajutor:'Recitește a doua propoziție din al doilea paragraf.',why:'Să intri în contul altuia fără voia lui e acces fără drept, chiar dacă „doar te uiți”.'},
   inca:[
    {t:'classify',q:'Hacker etic sau cracker?',cats:['Hacker etic','Cracker'],items:[['Ajută școala să-și testeze rețeaua, la cererea ei',0],['Găsește o problemă în site-ul unei firme, cu acordul ei, și o raportează',0],['Intră în contul unui coleg ghicindu-i parola',1],['Fură adresele de e-mail dintr-un site',1]],ajutor:'Are permisiune? Repară sau strică?',why:'Hackerul etic lucrează cu acord și ca să repare. Crackerul intră fără drept.'},
    {t:'choice',q:'Cum se numește cel care intră fără drept în sisteme ca să fure date?',o:['Cracker','Hacker etic','Editor','Comentator'],ok:0,ajutor:'Primul rând al pasului.',why:'Crackerul acționează fără drept și face pagube.'}
   ]},
  {t:'Strategia: cum găsești o greșeală de etică',
   text:`<p>Citești un mesaj sau un capitol al echipei și vrei să vezi dacă e ceva în neregulă. Treci prin el de <strong>patru ori</strong>, câte o întrebare pe rând (sunt cele patru reguli din pasul 1):</p>
<ol><li><strong>Munca altora</strong>: a șters sau a stricat cineva ce a scris altul?</li>
<li><strong>Tonul</strong>: e vreo jignire?</li>
<li><strong>Sursele</strong>: e ceva luat de la alții fără sursă?</li>
<li><strong>Colegii</strong>: apar poze sau date ale cuiva fără acord?</li></ol>`,
   exemplu:`<p>Mesaj: „Am pus imaginea cu castelul și am trecut sursa sub ea.” Întrebarea 3 (sursele): sursa e trecută, deci e <b>în regulă</b>. Mesaj: „Am pus poza cu Mihai adormit în autobuz.” Întrebarea 4 (colegii): poză cu un coleg, fără acord: <b>greșeală</b>.</p>`,
   incearca:{t:'hunt',q:'Mesajul Sarei are 2 greșeli de etică. Apasă pe ele.',src:'Am scris capitolul despre parc. [[Am pus și numărul de telefon al Ioanei, să o sune lumea|datele unui coleg nu se pun fără acordul lui]]. Am luat o poză de pe un site și am trecut sursa. [[Radu, ai scris ca un bebeluș|comentariile se scriu politicos]].',indiciu:'Treci prin cele patru întrebări: munca altora, tonul, sursele, colegii.',why:'Numărul de telefon fără acord și jignirea sunt greșeli. Poza cu sursa trecută e în regulă.'}}
 ],
 atelier:{t:'hunt',titlu:'Verifică comentariile din document',
  intro:`<p>Ești coordonatorul echipei și citești comentariile lăsate pe marginea poveștii. <strong>Sarcina:</strong> treci prin ele cu cele patru întrebări din pasul 4 și apasă pe <b>fiecare</b> greșeală de etică. Atenție: unele comentarii sunt în regulă.</p>
${fig('comentariu.webp',760,190,'CryptPad: cuvântul castan e marcat în text, iar pe margine e caseta de comentariu, cu numele autorului și ora','Așa arată un comentariu pe margine: nume, oră, text.')}`,
  q:'Apasă pe cele 3 greșeli de etică din comentarii.',src:'Ana: Poți scrie și anul în care a fost ridicat turnul? · [[Vlad: Am șters capitolul tău, era prea lung.|nu ștergi munca altuia; spui părerea într-un comentariu sau o sugestie]] · Ioana: Am trecut sursa sub harta orașului. · [[Mihai: Am pus adresa de acasă a lui Radu, ca să știe toți unde stă.|adresa unui coleg nu se publică fără acordul lui]] · [[Oaspete: Ce poveste proastă!|comentariile se scriu politicos și spun ce se poate îmbunătăți]]',
  indiciu:'Patru întrebări: munca altora, tonul, sursele, colegii.',
  why:'Ștergerea muncii altuia, adresa fără acord și jignirea strică echipa. Întrebarea Anei și sursa Ioanei sunt exemple bune.',
  inca:[
   {t:'classify',q:'Hacker etic sau cracker?',cats:['Hacker etic','Cracker'],items:[['Participă la un concurs de securitate organizat legal',0],['Raportează școlii o problemă găsită, la cererea ei',0],['Sparge protecția unui joc ca să-l dea gratis altora',1],['Intră în contul profesorului ca să-și schimbe nota',1]],ajutor:'Are permisiune? Repară sau strică?',why:'Cu permisiune și ca să repare = hacker etic. Fără drept, ca să ia sau să strice = cracker.'}
  ]},
 qs:[
  {t:'tf',q:'Un hacker etic verifică securitatea unui site doar cu permisiunea proprietarului și raportează ce găsește.',ok:true,why:'Adevărat. Permisiunea face diferența. Fără ea, aceeași faptă devine acces fără drept.'},
  {t:'classify',q:'Hacker etic sau cracker?',cats:['Hacker etic','Cracker'],items:[['Găsește o problemă în site-ul unei firme, cu acordul ei, și o raportează',0],['Ajută școala să-și testeze rețeaua, la cererea ei',0],['Participă la un concurs de securitate organizat legal',0],['Intră în contul unui coleg ghicindu-i parola',1],['Sparge protecția unui joc ca să-l dea gratis altora',1],['Fură adresele de e-mail dintr-un site',1]],why:'Hackerul etic lucrează cu acord și ca să repare. Crackerul intră fără drept și ia sau strică ce nu e al lui.'},
  {t:'choice',q:'Ai aflat din întâmplare parola unui coleg. Ce e corect?',o:['Îi spui s-o schimbe și nu o folosești','Intri o dată în contul lui, doar să vezi','O spui și altora, ca să râdeți','Îi schimbi tu parola, să-l înveți minte'],ok:0,why:'Să intri în contul altuia fără voia lui e acces fără drept, chiar dacă „doar te uiți”. Corect e să-l anunți ca să-și schimbe parola.'},
  {t:'hunt',q:'Mesajul lui Vlad în documentul echipei are 3 greșeli de etică. Apasă pe ele.',src:'Am terminat capitolul meu. [[Am șters partea Ioanei, nu-mi plăcea|nu ștergi munca altuia; lași un comentariu sau o sugestie]]. Am pus imaginea cu castelul și am trecut sursa sub ea. [[Am adăugat și poza cu Mihai adormit în autobuz|pozele cu colegii se pun doar cu acordul lor]]. [[Radu, capitolul tău e o prostie|comentariile se scriu politicos și spun ce se poate îmbunătăți]].',indiciu:'Uită-te la munca altora, la poze și la ton.',ajutor:'Cele patru întrebări din pasul 4: munca altora, tonul, sursele, colegii.',why:'Imaginea cu sursă trecută e în regulă. Ștergerea muncii altuia, poza fără acord și jignirea strică echipa.'},
  {t:'choice',q:'Cum se numește cel care intră fără drept în sisteme ca să fure date?',o:['Cracker','Hacker etic','Editor','Comentator'],ok:0,why:'Crackerul acționează fără drept și face pagube. Hackerul etic are permisiune, iar Editor și Comentator sunt roluri într-un document.'}
 ]},

/* ================= 6. Mă feresc de fraude (lecția 21) ================= */
{t:'Mă feresc de fraude',lectii:[21],continuturi:['Protecția împotriva fraudei în mediul colaborativ online'],
 obiectiv:'recunoști un mesaj de phishing după cele patru semne, îți faci o parolă puternică și știi cum îți păzești contul și documentele.',
 pasi:[
  {t:'Ce este phishingul',
   text:`<p>Cea mai des întâlnită fraudă online este <mark>phishingul</mark> (se citește „fișing”, de la „pescuit” în engleză). E un mesaj care <strong>se dă drept cineva de încredere</strong> (școala, profesorul, aplicația) și te trimite spre o <strong>pagină falsă de conectare</strong>, ca să-ți fure parola.</p>
<p>Cu parola ta, crackerul intră în contul tău și în toate documentele echipei.</p>`,
   altfel:`<p>Gândește-te la un pescar: aruncă o momeală și așteaptă să muște cineva. Mesajul-capcană e momeala, iar parola ta e peștele.</p>`,
   incearca:{t:'tf',q:'Un mesaj de phishing se dă drept cineva de încredere, ca să-ți fure parola.',ok:true,ajutor:'Prima propoziție a pasului.',why:'Adevărat. Se preface că e școala sau aplicația, ca să-ți scrii parola pe o pagină falsă.'}},
  {t:'Cele patru semne ale unui mesaj-capcană',
   text:`<p>Când primești un mesaj care îți cere ceva, verifică <strong>patru semne</strong>:</p>
<ol><li><strong>Cine trimite?</strong> Adresa expeditorului e ciudată, nu a școlii sau a aplicației.</li>
<li><strong>Te grăbește?</strong> „Contul se închide azi!”</li>
<li><strong>Te amenință cu o oră-limită?</strong> „până la ora 20:00”</li>
<li><strong>Îți cere parola?</strong> Printr-un buton sau un link.</li></ol>
<p>Un singur semn e destul: nu apeși nimic și întrebi un profesor sau un părinte.</p>
${fig('mesaj-capcana-1.webp',640,324,'Mesaj-capcană compus pentru lecție: subiectul „Contul tău de elev se închide azi!” și adresa expeditorului, suport@scrieimpreuna-scoala.example, amândouă încadrate și numite','Un <b>mesaj-capcană</b> compus pentru lecție: <b>te grăbește</b> și vine de la o <b>adresă ciudată</b>.')}`,
   exemplu:`${fig('mesaj-capcana-2.webp',640,310,'Același mesaj-capcană: amenințarea „pana astazi la ora 20:00” și butonul albastru „Confirmă parola acum”, încadrate și numite','Același mesaj: <b>oră-limită</b> și un buton care îți cere <b>parola</b>. Patru semne din patru.')}`,
   incearca:{t:'classify',q:'Semn de phishing sau mesaj obișnuit?',cats:['Semn de phishing','Mesaj obișnuit'],items:[['Îți cere parola printr-un e-mail',0],['Te amenință că îți închide contul azi',0],['Profesorul anunță la oră că a trimis invitația la document',1],['Invitația vine de la colegul cu care ai vorbit la oră',1]],ajutor:'Caută cele patru semne din listă.',why:'Mesajele cinstite nu-ți cer parola și nu te grăbesc.'},
   inca:[

   ]},
  {t:'O parolă puternică',
   text:`<p>Parola e cheia contului. Una <mark>puternică</mark>:</p>

<li>e <strong>alta pentru fiecare cont</strong>;</li>

   exemplu:`<p>Rețeta: alegi trei cuvinte care nu au legătură între ele și le legi: <b>Lupul</b> + <b>Citește</b> + <b>Sub3Stele!</b> → „LupulCitesteSub3Stele!” (22 de caractere). Nu „MariaIonescu2014”: are nume și an.</p>`,
   incearca:{t:'classify',q:'Parolă puternică sau slabă?',cats:['Puternică','Slabă'],items:[['LupulCitesteSub3Stele!',0],['Toamna-Galbena-la-Bicaz7',0],['MariaIonescu2014',1],['12345678',1]],ajutor:'Numără caracterele și caută nume sau ani.',why:'Parolele puternice sunt lungi și nu au date personale.'},

  {t:'Alte trei protecții',
   text:`<ul><li><mark>Autentificarea în doi pași</mark>: pe lângă parolă, aplicația îți cere un cod sau o confirmare pe telefon. Chiar dacă cineva îți fură parola, fără telefonul tău nu intră.</li>
<li><strong>Partajezi documentul doar cu echipa</strong>, nu cu „oricine are linkul” ca Editor.</li>

/* ================= 7. Povestea cu autor colectiv (final, lecțiile 19-22) ================= */
{t:'Povestea cu autor colectiv',final:true,lectii:[19,20,21,22],continuturi:['Instrumente de lucru: documente, prezentări','Operații permise în aplicație: publicare, modificare conținuturi în aplicația colaborativă','Noțiuni de etică într-un mediu colaborativ; hacker și cracker','Protecția împotriva fraudei în mediul colaborativ online'],
 obiectiv:'organizezi de la cap la coadă un proiect de echipă într-un document comun: creezi, partajezi, scrii, corectezi, verifici contribuția și publici, în siguranță.',
 pasi:[
  {t:'Misiunea și planul echipei',
   text:`<p>Clasa scrie o <mark>poveste cu autor colectiv</mark> despre un loc din orașul vostru. Echipa are patru membri, iar fiecare scrie un capitol <strong>în același document online</strong>.</p>
<p>Planul, în patru etape:</p>
<ol><li>Ana <strong>creează</strong> documentul și îi <strong>invită</strong> pe colegi.</li>
<li>Fiecare <strong>își scrie</strong> capitolul.</li>
<li>Radu citește tot și lasă <strong>comentarii</strong>; autorii corectează.</li>
<li>Povestea se <strong>publică</strong> pentru părinți, doar pentru citit.</li></ol>
${fig('document-echipa.webp',800,258,'CryptPad: documentul echipei, cu titlul Povestea orașului nostru și patru capitole scrise de patru colegi','Documentul echipei: un titlu și câte un capitol de la fiecare. Textul subliniat e o sugestie care încă așteaptă răspunsul autorului.')}`,
   incearca:{t:'order',q:'Pune în ordine pașii echipei.',items:['Ana creează documentul și îi invită pe colegi','Fiecare își scrie capitolul','Radu lasă comentarii, iar autorii corectează','Povestea se partajează cu părinții, doar pentru citit'],ajutor:'Lista numerotată din pas.',why:'Întâi documentul și echipa, apoi textul, apoi corectura, iar publicarea vine la final.'}},
  {t:'Cine ce rol primește',
   text:`<p>La etapa 1, Ana partajează documentul folosind strategia de la nivelul 3: la fiecare om întreabă „scrie? doar corectează? doar citește?”.</p>
<ul><li>Ioana și Mihai scriu capitole → <strong>Editor</strong>.</li>
<li>Radu doar corectează → <strong>Comentator</strong>. (Dacă scrie și el un capitol, are nevoie de <strong>Editor</strong>, iar observațiile le lasă tot prin comentarii și sugestii.)</li>
<li>Linkul: <strong>doar persoanele invitate</strong>, până la publicare.</li></ul>`,
   incearca:{t:'choice',q:'Ce rol primesc colegii care scriu capitole?',o:['Editor','Comentator','Cititor'],ok:0,ajutor:'Care rol poate adăuga text?',why:'Ca să scrie în document, au nevoie de rolul de Editor.'},
   inca:[
    {t:'tf',q:'Până la publicare, linkul poveștii îl poate deschide oricine îl are.',ok:false,ajutor:'Ultimul punct din listă.',why:'Fals. Până la publicare, documentul îl deschid doar persoanele invitate.'}
   ]},
  {t:'Contribuția fiecăruia se vede',
   text:`<p>La final, profesorul deschide <mark>istoricul versiunilor</mark>. Acolo vede, la fiecare variantă, <strong>cine</strong> a scris și <strong>când</strong>. Nota de la evaluare ține cont de <strong>produsul echipei</strong> (povestea) și de <strong>contribuția fiecăruia</strong>.</p>
<p>De aceea, fiecare scrie <strong>cu contul lui</strong>. Dacă Mihai scrie de pe contul Anei, istoricul pune textul pe numele Anei.</p>`,
   exemplu:`<p>În istoric: „10:15 Ana”, „10:40 Ioana”, „11:05 Radu”. Numele lui Mihai nu apare nicăieri. Profesorul știe că Mihai n-a scris încă nimic.</p>`,
   incearca:{t:'tf',q:'Dacă Mihai n-a scris nimic în poveste, profesorul poate vedea asta în istoricul versiunilor.',ok:true,ajutor:'Ce vede profesorul la fiecare variantă?',why:'Adevărat. Numele lui Mihai nu apare la nicio modificare.'},
   inca:[
    {t:'choice',q:'De ce scrie fiecare cu contul lui?',o:['Ca istoricul să arate corect contribuția fiecăruia','Ca documentul să se salveze mai repede','Ca să poată intra fără Internet','Nu contează cu ce cont scrii'],ok:0,ajutor:'Recitește a doua propoziție a pasului.',why:'Istoricul pune fiecare schimbare pe numele contului care a făcut-o.'}
   ]},
  {t:'Lista de siguranță a proiectului',
   text:`<p>Înainte de publicare, echipa trece prin <strong>lista de siguranță</strong>, tot ce ai învățat:</p>
<ol><li><strong>Etica</strong>: sursele sunt trecute, nimeni nu a șters munca altuia, comentariile sunt politicoase.</li>
<li><strong>Datele</strong>: nicio parolă, adresă sau poză cu un coleg fără acord.</li>
<li><strong>Partajarea</strong>: publicarea se face doar pentru citire.</li>
<li><strong>Conturile</strong>: fiecare se deconectează de pe calculatorul școlii; nimeni nu scrie parola la un mesaj care o cere.</li></ol>`,
   altfel:`<p>E ca lista pe care o verifică pilotul înainte de decolare: chiar dacă știe totul pe de rost, bifează fiecare rând.</p>`,
   incearca:{t:'classify',q:'Ce e în regulă în proiectul echipei?',cats:['În regulă','Nu e în regulă'],items:[['Scrii sursa imaginii cu statuia din centru',0],['Te deconectezi la final de pe calculatorul școlii',0],['Îți scrii parola în document, ca s-o știe toți',1],['Partajezi documentul cu „oricine are linkul”, ca Editor',1]],ajutor:'Ia fiecare rând prin lista numerotată.',why:'Sursele și deconectarea respectă echipa; parola scrisă și linkul deschis ca Editor pun proiectul în pericol.'},
   inca:[
    {t:'choice',q:'Un e-mail „de la școală” îi cere Anei să-și scrie parola pe o pagină, ca să nu piardă povestea. Ce face Ana?',o:['Nu scrie parola și îl întreabă pe profesor','Scrie parola repede, să nu piardă povestea','Trimite parola colegilor, ca s-o salveze','Răspunde la e-mail și scrie parola acolo'],ok:0,ajutor:'Rândul 4 din listă.',why:'E phishing: grabă, amenințare și cerere de parolă.'}
   ]}
 ],

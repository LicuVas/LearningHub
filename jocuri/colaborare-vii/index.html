<script>
const LEVELS=[
{t:'Ce este o aplicație colaborativă',lectii:[18],continuturi:['Noțiunea de aplicație colaborativă','Facilități ale aplicațiilor de tip colaborativ'],text:`
<p>O <mark>aplicație colaborativă</mark> îi lasă pe mai mulți oameni să lucreze la același material, fiecare de pe dispozitivul lui, prin Internet. Exemple: Google Docs și Google Slides, Word și PowerPoint pe web (Microsoft 365), Canva, Padlet.</p>
<p>Fișierul nu stă pe un singur calculator, ci <mark>în cloud</mark>, pe serverele aplicației. De aceea îl deschizi de oriunde, cu contul tău.</p>
<p><mark>Facilitățile</mark> pe care le au de obicei:</p>
<ul>
<li><strong>lucrul în același timp</strong>: vezi pe loc ce scrie colegul;</li>
<li><strong>salvarea automată</strong>;</li>
<li><strong>comentariile</strong>;</li>
<li><strong>istoricul versiunilor</strong>: cine a schimbat ce și când.</li>
</ul>`,
qs:[
 {t:'tf',q:'Într-o aplicație colaborativă, doi colegi pot scrie în același document în același timp, fiecare de acasă.',ok:true,why:'Adevărat. Documentul stă pe serverele aplicației, iar fiecare îl deschide prin Internet. Modificările apar pe loc la toți.'},
 {t:'classify',q:'Aplicație colaborativă sau program folosit de unul singur, pe calculatorul lui?',cats:['Colaborativă','Doar pe calculatorul meu'],items:[['Google Docs',0],['Google Slides',0],['Padlet',0],['Notepad',1],['Paint',1],['Calculatorul din Windows',1]],why:'Aplicațiile colaborative țin fișierul în cloud și îi primesc pe mai mulți în el. Notepad, Paint și Calculatorul lucrează doar cu fișierele de pe calculatorul tău.'},
 {t:'choice',q:'De ce poți deschide documentul echipei și de pe telefon, și de pe calculatorul școlii?',o:['Fișierul stă în cloud și intri cu contul tău','Documentul se copiază singur pe toate discurile','Telefonul și calculatorul au același disc','Documentul îți vine pe e-mail după fiecare literă'],ok:0,why:'Documentul e unul singur, pe serverul aplicației. Orice dispozitiv conectat la Internet îl deschide, dacă intri cu contul tău.'},
 {t:'match',q:'Leagă fiecare facilitate de ce te ajută.',pairs:[['Lucrul în același timp','vezi pe loc ce scrie colegul'],['Salvarea automată','nu pierzi textul dacă se închide browserul'],['Comentariile','dai o părere fără să schimbi textul'],['Istoricul versiunilor','afli cine a schimbat ce și când']],why:'Aceste facilități fac din mai mulți oameni o echipă: văd aceeași pagină, nu pierd nimic și pot discuta pe text.'},
 {t:'tf',q:'În Google Docs trebuie să apeși mereu Ctrl+S, altfel pierzi tot ce ai scris.',ok:false,why:'Fals. Google Docs salvează singur pe server, cât timp ai Internet. Ctrl+S nu e nevoie să-l apeși.'}
]},
{t:'Mă conectez',lectii:[18],continuturi:['Accesare/conectare în aplicația colaborativă'],text:`
<p>Ca să intri în aplicație, deschizi browserul, mergi la adresa aplicației și te <mark>conectezi</mark> (te autentifici) cu <strong>contul</strong> tău: adresa de e-mail și parola. Dacă școala ți-a dat un cont de elev, pe acela îl folosești la ore.</p>
<p>La documentul unui coleg ajungi în două feluri: primești o <mark>invitație</mark> pe e-mail sau un <mark>link</mark> de la cel care l-a creat.</p>
<p>Pe un calculator folosit de mai mulți, la final te <mark>deconectezi</mark> (în engleză <em>Sign out</em>). Închiderea filei nu te deconectează. Altfel, următorul elev intră în contul tău și îți vede toate documentele.</p>
<p>Nu salvezi parola în browserul unui calculator care nu e al tău.</p>`,
qs:[
 {t:'choice',q:'Ai terminat ora și pleci de la calculatorul din laborator. Ce faci cu contul tău?',o:['Mă deconectez din cont','Închid doar fila cu documentul','Las contul deschis pentru colegul meu','Sting doar monitorul'],ok:0,why:'Doar deconectarea închide contul. Cu fila închisă sau monitorul stins, următorul elev deschide aplicația și intră direct în contul tău.'},
 {t:'tf',q:'Dacă închid fila documentului, m-am deconectat automat din cont.',ok:false,why:'Fals. Browserul ține minte că ești conectat. Deconectarea se face din aplicație, de obicei de la pictograma contului tău.'},
 {t:'order',q:'Intri în aplicația colaborativă pe calculatorul școlii. Pune pașii în ordine.',items:['Deschizi browserul','Mergi la adresa aplicației','Te conectezi cu adresa de e-mail și parola','Deschizi documentul din lista ta'],why:'Fără browser nu ajungi la aplicație, iar fără conectare aplicația nu știe ale cui documente să-ți arate.'},
 {t:'classify',q:'Bine sau periculos, pe un calculator din laborator?',cats:['Bine','Periculos'],items:[['Mă deconectez la final',0],['Îmi scriu parola fără să se uite cineva',0],['Folosesc contul meu de elev',0],['Salvez parola în browserul școlii',1],['Îmi las contul deschis după oră',1],['Mă conectez cu contul unui coleg',1]],why:'Contul tău e cheia spre toate documentele tale. Îl deschizi doar tu și îl închizi când pleci.'},
 {t:'choice',q:'Cum ajungi la documentul creat de un coleg?',o:['Prin invitația sau linkul primit de la el','Căutând titlul documentului pe Google','Cerându-i colegului parola contului lui','Copiind documentul de pe stickul lui'],ok:0,why:'Autorul decide cine intră: trimite o invitație sau un link. Parola lui nu se cere, iar un motor de căutare nu găsește documentele private.'}
]},
{t:'Documente și prezentări în echipă',lectii:[19],continuturi:['Interfaţa aplicaţiei colaborative','Instrumente de lucru: documente, prezentări'],text:`
<p>Documentele (Google Docs, Word pe web) și prezentările (Google Slides, PowerPoint pe web) seamănă cu Word și PowerPoint. În plus, au lucruri pentru echipă:</p>
<ul>
<li>butonul de <mark>partajare</mark>, sus în dreapta, prin care inviți colegii (în engleză <em>Share</em>; în română numele diferă de la o aplicație la alta);</li>
<li><strong>pictogramele</strong> (inițialele sau pozele) celor care sunt acum în document;</li>
<li><strong>cursorul colorat</strong> al fiecărui coleg, cu numele lui;</li>
<li><strong>comentariile</strong>, pe marginea paginii.</li>
</ul>
<p>La partajare alegi <mark>rolul</mark> fiecăruia. În Google Docs: <strong>Editor</strong> (modifică), <strong>Comentator</strong> (lasă doar comentarii) sau <strong>Cititor</strong> (doar citește); în engleză <em>Editor</em>, <em>Commenter</em>, <em>Viewer</em>. Word pe web are nume puțin diferite: ține mouse-ul pe opțiuni și citește.</p>`,
qs:[
 {t:'choice',q:'Colegul care corectează proiectul trebuie doar să lase observații, fără să schimbe textul. Ce rol îi dai?',o:['Comentator','Editor','Cititor'],ok:0,why:'Comentatorul lasă observații pe margine, iar textul rămâne cum l-ați scris. Editorul ar putea schimba textul, iar Cititorul nu poate lăsa nici comentarii.'},
 {t:'match',q:'Leagă fiecare rol sau buton de ce permite.',pairs:[['Editor','scrie, șterge și formatează'],['Comentator','lasă observații, textul rămâne neschimbat'],['Cititor','doar citește documentul'],['Butonul de partajare','inviți colegii în document']],why:'Rolul hotărăște cât poate schimba fiecare. Îl alegi când partajezi.'},
 {t:'tf',q:'Un cursor colorat cu numele „Radu” în document arată unde scrie Radu chiar acum.',ok:true,why:'Adevărat. Fiecare coleg conectat are cursorul lui, colorat și cu numele lui. Așa nu scrieți doi în același loc.'},
 {t:'classify',q:'Document sau prezentare?',cats:['Document','Prezentare'],items:[['Povestea clasei, scrisă capitol cu capitol',0],['Regulamentul clubului de lectură',0],['Referatul de grup la biologie',0],['Diapozitivele pentru ora de dirigenție',1],['Materialul proiectat la serbare, câte o imagine pe diapozitiv',1],['Prezentarea proiectului în fața clasei',1]],why:'Textul lung, citit pagină cu pagină, merge într-un document. Ce se proiectează și se arată în fața altora merge într-o prezentare.'},
 {t:'tf',q:'Ca să lucreze la aceeași prezentare, toți membrii echipei trebuie să fie în aceeași sală.',ok:false,why:'Fals. Prezentarea stă în cloud. Fiecare lucrează de unde are Internet, iar modificările apar la toți.'}
]},
{t:'Modific, urmăresc, public',lectii:[20],continuturi:['Operații permise în aplicație: publicare, modificare conținuturi în aplicația colaborativă'],text:`
<p><mark>Modificarea:</mark> cei cu rol de Editor schimbă direct textul. Vrei să propui o schimbare fără să strici munca altuia? Lași un <strong>comentariu</strong> sau scrii în <mark>modul sugestii</mark> (în Google Docs: <em>Sugerare</em>, în engleză <em>Suggesting</em>). Autorul acceptă sau respinge sugestia.</p>
<p><mark>Istoricul versiunilor</mark> (în engleză <em>Version history</em>) păstrează variantele documentului. Vezi cine a făcut fiecare schimbare și când, deci se vede <mark>contribuția fiecăruia</mark>. Dacă ceva s-a șters din greșeală, <strong>restaurezi</strong> o variantă mai veche.</p>
<p><mark>Publicarea:</mark> când materialul e gata, îl arăți și altora. De obicei îl partajezi cu rolul Cititor sau printr-un link doar pentru vizualizare.</p>`,
qs:[
 {t:'choice',q:'Vrei să schimbi o frază scrisă de Ana, dar să hotărască ea. Ce folosești?',o:['Modul sugestii sau un comentariu','Ștergi fraza și o scrii tu','Îi ceri Anei parola contului','Faci o copie doar pentru tine'],ok:0,why:'Sugestia și comentariul lasă decizia la autor. Dacă ștergi direct, strici munca Anei fără s-o întrebi.'},
 {t:'tf',q:'Din istoricul versiunilor poți afla cine a scris o anumită parte din document.',ok:true,why:'Adevărat. Istoricul arată fiecare variantă, cu numele celui care a făcut schimbarea și ora. Așa se vede contribuția fiecăruia.'},
 {t:'choice',q:'Un paragraf întreg a dispărut din poveste. Ce faci?',o:['Restaurezi din istoric varianta bună','Scrii paragraful din nou, din memorie','Ștergi documentul și începi altul','Îi scoți pe toți colegii din document'],ok:0,why:'Istoricul versiunilor a păstrat varianta cu paragraful. O restaurezi și nu se pierde nimic.'},
 {t:'classify',q:'Ce folosești?',cats:['Comentariu','Istoricul versiunilor','Partajare cu rol de Cititor'],items:[['Îi spui Mihaelei că un titlu e prea lung',0],['Întrebi echipa dacă păstrați o poză',0],['Afli cine a adăugat ultimul capitol',1],['Aduci înapoi textul de ieri',1],['Arăți povestea părinților, fără s-o poată schimba',2],['Le arăți celorlalte clase prezentarea gata',2]],why:'Comentariul e pentru discuție. Istoricul e pentru „cine, ce, când” și pentru a reveni. Rolul de Cititor e pentru publicare fără modificări.'},
 {t:'order',q:'Ana propune o schimbare în modul sugestii. Pune în ordine ce se întâmplă.',items:['Ana scrie schimbarea în modul sugestii','Autorul textului vede sugestia marcată','Autorul acceptă sau respinge sugestia','Textul rămâne în varianta hotărâtă'],why:'Sugestia nu schimbă textul până nu hotărăște autorul. De aceea e politicoasă și sigură.'}
]},
{t:'Hacker sau cracker',lectii:[21],continuturi:['Noțiuni de etică într-un mediu colaborativ; hacker și cracker'],text:`
<p>Și în echipa online există reguli de <mark>etică</mark>: nu ștergi munca altuia, scrii comentarii politicoase, treci sursa textelor și imaginilor luate de la alții și nu pui poze sau date ale colegilor fără acordul lor.</p>
<p>Un <mark>hacker</mark>, în sensul de la început al cuvântului, este un pasionat care înțelege foarte bine cum funcționează calculatoarele și programele. Un <strong>hacker etic</strong> caută punctele slabe ale unui sistem <strong>cu permisiunea</strong> proprietarului și le raportează, ca să fie reparate.</p>
<p>Un <mark>cracker</mark> intră <strong>fără drept</strong> în conturi și sisteme, sparge parole sau protecția programelor, fură date ori face pagube. Accesul fără drept la un sistem informatic este infracțiune (Codul penal, art. 360).</p>
<p>Atenție: în presă, „hacker” e folosit des și pentru crackeri.</p>`,
qs:[
 {t:'tf',q:'Un hacker etic verifică securitatea unui site doar cu permisiunea proprietarului și raportează ce găsește.',ok:true,why:'Adevărat. Permisiunea face diferența. Fără ea, aceeași faptă devine acces fără drept.'},
 {t:'classify',q:'Hacker etic sau cracker?',cats:['Hacker etic','Cracker'],items:[['Găsește o problemă în site-ul unei firme, cu acordul ei, și o raportează',0],['Ajută școala să-și testeze rețeaua, la cererea ei',0],['Participă la un concurs de securitate organizat legal',0],['Intră în contul unui coleg ghicindu-i parola',1],['Sparge protecția unui joc ca să-l dea gratis altora',1],['Fură adresele de e-mail dintr-un site',1]],why:'Hackerul etic lucrează cu acord și ca să repare. Crackerul intră fără drept și ia sau strică ce nu e al lui.'},
 {t:'choice',q:'Ai aflat din întâmplare parola unui coleg. Ce e corect?',o:['Îi spui s-o schimbe și nu o folosești','Intri o dată în contul lui, doar să vezi','O spui și altora, ca să râdeți','Îi schimbi tu parola, să-l înveți minte'],ok:0,why:'Să intri în contul altuia fără voia lui e acces fără drept, chiar dacă „doar te uiți”. Corect e să-l anunți ca să-și schimbe parola.'},
 {t:'hunt',q:'Mesajul lui Vlad în documentul echipei are 3 greșeli de etică. Apasă pe ele.',src:'Am terminat capitolul meu. [[Am șters partea Ioanei, nu-mi plăcea|nu ștergi munca altuia; lași un comentariu sau o sugestie]]. Am pus imaginea cu castelul și am trecut sursa sub ea. [[Am adăugat și poza cu Mihai adormit în autobuz|pozele cu colegii se pun doar cu acordul lor]]. [[Radu, capitolul tău e o prostie|comentariile se scriu politicos și spun ce se poate îmbunătăți]].',indiciu:'Uită-te la munca altora, la poze și la ton.',why:'Imaginea cu sursă trecută e în regulă. Ștergerea muncii altuia, poza fără acord și jignirea strică echipa.'},
 {t:'choice',q:'Cum se numește cel care intră fără drept în sisteme ca să fure date?',o:['Cracker','Hacker etic','Editor','Comentator'],ok:0,why:'Crackerul acționează fără drept și face pagube. Hackerul etic are permisiune, iar Editor și Comentator sunt roluri într-un document.'}
]},
{t:'Mă feresc de fraude',lectii:[21],continuturi:['Protecția împotriva fraudei în mediul colaborativ online'],text:`
<p>Cea mai des întâlnită fraudă este <mark>phishingul</mark>: un mesaj care se dă drept cineva de încredere (școala, profesorul, aplicația) și te trimite spre o pagină falsă de conectare, ca să-ți fure parola.</p>
<p>Semne de alarmă: te grăbește („contul se închide azi!”), are greșeli, vine de la o adresă ciudată, iar linkul duce la altă adresă decât cea a aplicației.</p>
<p>Cum te protejezi:</p>
<ul>
<li>o <mark>parolă</mark> lungă, de cel puțin 15 caractere (de exemplu trei-patru cuvinte legate), fără numele tău sau anul nașterii, alta pentru fiecare cont;</li>
<li><mark>autentificarea în doi pași</mark>: pe lângă parolă, un cod sau o confirmare pe telefon;</li>
<li>nu spui nimănui parola, nici colegilor;</li>
<li>partajezi documentul doar cu echipa, nu cu „oricine are linkul” ca Editor.</li>
</ul>
<p>Ai dat clic pe un link dubios? Spui imediat unui profesor sau părinte.</p>`,
qs:[
 {t:'tf',q:'Un mesaj care te grăbește să-ți scrii parola „ca să nu-ți pierzi contul azi” poate fi phishing.',ok:true,why:'Adevărat. Graba e momeala: vrea să scrii parola înainte să te gândești. Aplicațiile adevărate nu-ți cer parola printr-un mesaj.'},
 {t:'classify',q:'Semn de phishing sau mesaj obișnuit?',cats:['Semn de phishing','Mesaj obișnuit'],items:[['Linkul duce la o adresă ciudată, nu la cea a aplicației',0],['Îți cere parola printr-un e-mail',0],['Te amenință că îți închide contul azi',0],['Profesorul anunță la oră că a trimis invitația la document',1],['Invitația vine de la colegul din echipă, cu care ai vorbit la oră',1]],why:'Mesajele cinstite nu-ți cer parola și nu te grăbesc. Invitația pe care o aștepți, de la cineva cunoscut, e un mesaj obișnuit.'},
 {t:'classify',q:'Parolă puternică sau slabă?',cats:['Puternică','Slabă'],items:[['LupulCitesteSub3Stele!',0],['Toamna-Galbena-la-Bicaz7',0],['MariaIonescu2014',1],['12345678',1],['parolamea',1]],why:'Parolele puternice au cel puțin 15 caractere și nu conțin numele sau anul tău. Cele scurte sau cu date personale se ghicesc ușor.'},
 {t:'choice',q:'Echipa vrea ca părinții să vadă povestea, dar să n-o poată schimba. Cum partajați?',o:['Cu rol de Cititor','Oricine are linkul, ca Editor','Le dați parola unui membru','Cu rol de Editor pentru fiecare'],ok:0,why:'Rolul de Cititor lasă doar citirea. Editor ar permite schimbări, iar parola nu se dă nimănui.'},
 {t:'match',q:'Leagă fiecare măsură de protecție de ce te ferește.',pairs:[['Parola de cel puțin 15 caractere','e greu de ghicit'],['Autentificarea în doi pași','parola furată singură nu ajunge'],['Deconectarea la final','următorul elev nu intră în contul tău'],['Partajarea doar cu echipa','străinii nu pot modifica documentul']],why:'Fiecare măsură închide o altă ușă prin care cineva ar putea intra în contul sau în documentul tău.'}
]},

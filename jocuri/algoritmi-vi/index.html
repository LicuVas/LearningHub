/* tema jocului: blocurile unei aplicații de exersare a algoritmilor - un bloc „repetă” care cuprinde pașii */

<script>
// pseudocod pe mai multe rânduri; stilul e pus direct pe element, ca să arate la fel și în recapitularea clasei
const P=s=>`<code class="ps" style="display:block;white-space:pre-wrap;line-height:1.55;padding:.45em .7em;margin:.5em 0">${s}</code>`;
const LEVELS=[
{t:'Recapitulez și pornesc aplicația',lectii:[17,18],continuturi:['Elemente de interfață ale unei aplicații de exersare a algoritmilor','Instrumente de bază utilizate în exersarea algoritmilor'],text:`
<p>Un <mark>algoritm</mark> este un șir de pași clari, în ordine, care rezolvă o problemă. Pornește de la <mark>datele de intrare</mark> și ajunge la <mark>rezultat</mark> (datele de ieșire).</p>
<p>Știi deja două structuri: <strong>secvența</strong> (pașii unul după altul) și <strong>decizia</strong> (<em>dacă … atunci … altfel</em>).</p>
<p>Acum le construim într-o <mark>aplicație de exersare a algoritmilor</mark>, de exemplu Scratch:</p>
<ul>
<li><strong>zona cu blocuri</strong>, pe categorii (Mișcare, Control…);</li>
<li><strong>zona de cod</strong>, unde îmbini blocurile;</li>
<li><strong>scena</strong>, unde vezi ce face personajul;</li>
<li><strong>steagul verde</strong> pornește algoritmul, iar <strong>semnul roșu</strong> îl oprește.</li>
</ul>`,
qs:[
 {t:'choice',q:'Ce este un algoritm?',o:['Pași clari, în ordine, care rezolvă o problemă','Orice program instalat pe un calculator','O listă de numere scrise fără nicio ordine','Un desen făcut într-o aplicație grafică'],ok:0,why:'Algoritmul e rețeta: pașii, ordinea lor și un scop. Programul e doar un algoritm scris pentru calculator.'},
 {t:'classify',q:'Secvență sau decizie?',cats:['Secvență','Decizie'],items:[['Pui ghiozdanul în spate, apoi ieși pe ușă',0],['Dacă plouă, iei umbrela, altfel iei șapca',1],['Citești un număr, apoi îl dublezi',0],['Dacă nota e cel puțin 5, scrii „promovat”',1]],why:'Secvența face pașii mereu, unul după altul. Decizia alege un drum după o condiție.'},
 {t:'choice',q:'Problema: „Citește lungimea și lățimea unui dreptunghi și afișează aria.” Care sunt datele de intrare?',o:['Lungimea și lățimea','Aria','Lungimea, lățimea și aria','Doar lungimea'],ok:0,why:'Datele de intrare le primești la început: lungimea și lățimea. Aria e rezultatul, adică data de ieșire.'},
 {t:'match',q:'Leagă fiecare parte a aplicației de rolul ei.',pairs:[['Zona cu blocuri','de aici alegi instrucțiunile, pe categorii'],['Zona de cod','aici îmbini blocurile în algoritm'],['Scena','aici vezi ce face personajul'],['Steagul verde','pornește algoritmul']],why:'Alegi blocuri, le îmbini, pornești și urmărești rezultatul pe scenă. Așa arată orice exercițiu în aplicație.'},
 {t:'choice',q:'Algoritmul pornit în Scratch nu se mai oprește. Ce apeși?',o:['Semnul roșu de oprire','Steagul verde','Încă un bloc de mișcare','Nimic, se oprește singur'],ok:0,why:'Semnul roșu oprește tot ce rulează. Steagul verde l-ar porni din nou de la început.'}
]},
{t:'De ce repetăm',lectii:[19],continuturi:['Etapele unui exercițiu algoritmic utilizând aplicația aleasă'],text:`
<p>Vrei ca personajul să deseneze un <mark>pătrat</mark>. Fără repetiție scrii de 4 ori aceleași două blocuri: <em>mergi 100 de pași</em> și <em>rotește-te 90 de grade</em>. Cu blocul <strong>repetă (4)</strong> le scrii o singură dată.</p>
<p>Un ocol complet are 360°. La un poligon regulat cu <em>n</em> laturi te rotești la fiecare colț cu <mark>360 : n</mark> grade.</p>
<p>Orice exercițiu algoritmic are aceleași <mark>etape</mark>:</p>
<ol>
<li>citești cerința și stabilești datele de intrare și rezultatul;</li>
<li>construiești algoritmul din blocuri;</li>
<li>îl rulezi;</li>
<li>verifici rezultatul pe mai multe exemple și corectezi ce nu merge.</li>
</ol>`,
qs:[
 {t:'choice',q:'Ce se repetă când personajul desenează un pătrat?',o:['Mergi 100 de pași, apoi rotește-te 90 de grade','Doar rotește-te 90 de grade','Doar mergi 400 de pași','Pornește steagul verde de 4 ori'],ok:0,why:'Fiecare latură înseamnă același lucru: mergi, apoi te rotești la colț. Perechea aceasta se repetă de 4 ori.'},
 {t:'choice',q:'Cu ce număr completezi blocul „repetă ( )” ca să iasă un pătrat?',o:['4','90','100','360'],ok:0,why:'Pătratul are 4 laturi, deci perechea „mergi, rotește-te” se repetă de 4 ori. 90 este unghiul, iar 100 este lungimea laturii.'},
 {t:'choice',q:'Pentru un triunghi echilateral, cu câte grade se rotește personajul la fiecare colț?',o:['120','60','90','180'],ok:0,why:'360 : 3 = 120. Unghiul triunghiului e de 60°, dar personajul se întoarce cu unghiul din afara colțului: 180 − 60 = 120.'},
 {t:'order',q:'Pune în ordine etapele unui exercițiu algoritmic.',items:['Citești cerința și stabilești datele și rezultatul','Construiești algoritmul din blocuri','Rulezi algoritmul','Verifici rezultatul și corectezi'],why:'Nu poți construi până nu știi ce ți se cere. Nu poți verifica până nu ai rulat.'},
 {t:'tf',q:'Dacă algoritmul a mers o dată, pe un singur exemplu, sigur e corect.',ok:false,why:'Fals. Un singur exemplu poate ascunde o greșeală. Îl verifici pe mai multe date, și pe unele „ciudate”, de exemplu 0.'}
]},
{t:'Repetiția cu contor',lectii:[20],continuturi:['Structura repetitivă cu contor'],text:`
<p>Când știi dinainte <mark>de câte ori</mark> repeți, folosești structura <mark>cu contor</mark>:</p>
${P('pentru i ← 1, n execută\n   pași\n■')}
<p><mark>Contorul</mark> <code>i</code> ia pe rând valorile 1, 2, 3, …, n. Pentru fiecare valoare, pașii se execută o dată. Deci se execută de <strong>n</strong> ori. Semnul <code>■</code> arată unde se termină pașii repetați.</p>
<p>Exemplu: pornești cu <code>s ← 0</code>, iar la fiecare pas faci <code>s ← s + i</code>. Așa aduni numerele de la 1 la n.</p>
<p>În Scratch, blocul <strong>repetă (10)</strong> face același lucru, dar contorul nu se vede.</p>`,
qs:[
 {t:'tf',q:'Structura cu contor se folosește când știi dinainte de câte ori se repetă pașii.',ok:true,why:'Adevărat. Numărul de repetări e fixat la început, de valoarea inițială și de cea finală ale contorului.'},
 {t:'choice',q:'Ce se afișează?'+P('s ← 0\npentru i ← 1, 4 execută\n   s ← s + i\n■\nscrie s'),o:['10','4','9','15'],ok:0,why:'s crește pe rând: 0 + 1 = 1, 1 + 2 = 3, 3 + 3 = 6, 6 + 4 = 10. Contorul ia valorile 1, 2, 3, 4.'},
 {t:'choice',q:'De câte ori se afișează steluța?'+P('pentru i ← 3, 7 execută\n   scrie \'*\'\n■'),o:['5','4','7','3'],ok:0,why:'Contorul ia valorile 3, 4, 5, 6, 7: sunt 5 valori. Numărul de pași e 7 − 3 + 1, nu 7 − 3.'},
 {t:'match',q:'Leagă fiecare parte a structurii de rolul ei.',pairs:[['pentru … execută','repetă pașii pentru fiecare valoare a contorului'],['i','contorul, care numără trecerile'],['1 și n','valoarea de început și valoarea de final'],['■','sfârșitul pașilor repetați']],why:'Fiecare parte răspunde la o întrebare: ce se repetă, cine numără, de unde până unde și unde se termină.'},
 {t:'choice',q:'În Scratch, ce număr pui în blocul „repetă ( )” ca pașii să se execute la fel ca în „pentru i ← 1, 6 execută”?',o:['6','5','7','1'],ok:0,why:'Contorul ia valorile 1, 2, 3, 4, 5, 6, deci pașii se execută de 6 ori. Blocul „repetă (6)” face la fel, fără contor vizibil.'}
]},
{t:'Cât timp: testul la început',lectii:[21],continuturi:['Structura repetitivă condiționată anterior'],text:`
<p>Uneori nu știi de câte ori repeți, știi doar o <mark>condiție</mark>. Atunci folosești structura <mark>condiționată anterior</mark>:</p>
${P('cât timp condiție execută\n   pași\n■')}
<p>Condiția se verifică <strong>înainte</strong> de fiecare trecere. Cât timp e adevărată, pașii se repetă. Când devine falsă, structura se termină.</p>
<p>Dacă e falsă de la început, pașii nu se execută <mark>niciodată</mark>. Pașii trebuie să schimbe ceva din condiție, altfel repetiția nu se oprește: <mark>buclă infinită</mark>.</p>
<p>În Scratch, blocul <strong>repetă până când</strong> verifică și el condiția înainte, dar se oprește când ea devine <em>adevărată</em>.</p>`,
qs:[
 {t:'tf',q:'La „cât timp”, dacă condiția e falsă de la început, pașii se execută o dată.',ok:false,why:'Fals. Condiția se verifică înainte de pași. Dacă e falsă de la început, se sare direct după ■, iar pașii se execută de 0 ori.'},
 {t:'choice',q:'Ce se afișează?'+P('n ← 17\ncât timp n ≥ 5 execută\n   n ← n - 5\n■\nscrie n'),o:['2','7','0','17'],ok:0,why:'n scade: 17, 12, 7, 2. La 2, condiția 2 ≥ 5 e falsă și repetiția se oprește. Ai scăzut de 3 ori, iar 2 e restul împărțirii lui 17 la 5.'},
 {t:'choice',q:'Ce se afișează?'+P('x ← 1\ncât timp x < 20 execută\n   x ← x * 3\n■\nscrie x'),o:['27','9','20','81'],ok:0,why:'x devine 3, apoi 9, apoi 27. La 27, condiția 27 < 20 e falsă și repetiția se oprește. Se afișează 27, nu ultima valoare mai mică decât 20.'},
 {t:'choice',q:'Care algoritm nu se oprește niciodată?',o:['a ← 5; cât timp a > 0 execută a ← a + 1 ■','a ← 5; cât timp a > 0 execută a ← a - 1 ■','a ← 0; cât timp a > 0 execută a ← a + 1 ■','a ← 5; cât timp a > 9 execută a ← a + 1 ■'],ok:0,why:'Dacă a pornește de la 5 și tot crește, a > 0 rămâne adevărată mereu. În celelalte, a ajunge la 0 sau condiția e falsă de la început.'},
 {t:'match',q:'Leagă fiecare situație de ce se întâmplă.',pairs:[['„cât timp”, condiția adevărată','pașii se execută încă o dată'],['„cât timp”, condiția falsă de la început','pașii nu se execută deloc'],['pașii nu schimbă nimic din condiție','repetiția nu se oprește'],['„repetă până când” din Scratch, condiția adevărată','repetiția se oprește']],why:'Toate se lămuresc cu o întrebare: când se verifică condiția și ce valoare are atunci?'}
]},
{t:'Repetă până când: testul la final',lectii:[22],continuturi:['Structura repetitivă condiționată posterior'],text:`
<p>La structura <mark>condiționată posterior</mark>, pașii vin întâi, iar condiția se verifică <strong>după</strong> ei:</p>
${P('repetă\n   pași\npână când condiție')}
<p>De aceea pașii se execută <mark>cel puțin o dată</mark>. Repetiția continuă cât timp condiția e falsă și se oprește când devine <mark>adevărată</mark>.</p>
<p>E utilă când verifici un răspuns: ceri o notă și o ceri din nou până când e între 1 și 10.</p>
<p>Atenție: Scratch nu are un bloc cu testul la final. Blocul lui <em>repetă până când</em> verifică înainte de pași.</p>`,
qs:[
 {t:'tf',q:'La „repetă … până când”, pașii se execută cel puțin o dată.',ok:true,why:'Adevărat. Condiția se verifică abia după pași, deci prima trecere are loc mereu.'},
 {t:'choice',q:'Ce se afișează?'+P('x ← 1\nrepetă\n   x ← x * 2\npână când x > 20\nscrie x'),o:['32','16','20','64'],ok:0,why:'x devine 2, 4, 8, 16, 32. Abia 32 > 20 e adevărat, deci repetiția se oprește la 32.'},
 {t:'choice',q:'Ce se afișează?'+P('x ← 100\nrepetă\n   x ← x * 2\npână când x > 20\nscrie x'),o:['200','100','20','400'],ok:0,why:'Pașii se execută întâi: x devine 200. Apoi 200 > 20 e adevărat și repetiția se oprește. Condiția era adevărată de la început, dar se verifică abia la final.'},
 {t:'choice',q:'Ceri o notă până când e corectă. Ce scrii după „până când”?',o:['nota ≥ 1 și nota ≤ 10','nota < 1 sau nota > 10','nota = 10','nota ≥ 5'],ok:0,why:'După „până când” scrii condiția de oprire, adică nota bună: între 1 și 10. A doua variantă e condiția de a repeta, bună pentru „cât timp”, nu aici.'},
 {t:'classify',q:'Test la început sau test la final?',cats:['Test la început (cât timp)','Test la final (repetă … până când)'],items:[['Pașii pot să nu se execute deloc',0],['Pașii se execută cel puțin o dată',1],['Se oprește când condiția devine falsă',0],['Se oprește când condiția devine adevărată',1]],why:'Diferențele vin din locul testului și din ce înseamnă condiția: la „cât timp” e condiția de a continua, la „până când” e condiția de oprire.'}
]},
{t:'Trei structuri, o alegere',lectii:[23],continuturi:['Structura repetitivă cu contor','Structura repetitivă condiționată anterior','Structura repetitivă condiționată posterior'],text:`
<p>Ai acum trei <mark>structuri repetitive</mark>:</p>
<ul>
<li><strong>cu contor</strong> (<em>pentru</em>): știi dinainte de câte ori repeți;</li>
<li><strong>condiționată anterior</strong> (<em>cât timp</em>): testul e la început, deci pașii se pot executa de 0 ori;</li>
<li><strong>condiționată posterior</strong> (<em>repetă … până când</em>): testul e la final, deci pașii se execută cel puțin o dată.</li>
</ul>
<p>Aceeași problemă se poate rezolva, de multe ori, cu oricare dintre ele. Alegi structura care se potrivește cel mai <mark>firesc</mark> cu cerința: „de 10 ori”, „cât timp…”, „până când…”.</p>`,
qs:[
 {t:'tf',q:'Aceeași problemă poate fi rezolvată, de multe ori, cu mai multe structuri repetitive.',ok:true,why:'Adevărat. De exemplu, numerele de la 1 la 5 le poți afișa cu „pentru” sau cu „cât timp”, dacă ai grijă de contor.'},
 {t:'classify',q:'Ce structură se potrivește cel mai firesc?',cats:['Cu contor','Condiționată anterior','Condiționată posterior'],items:[['Afișezi de 10 ori „Bravo!”',0],['Aduni notele celor 25 de elevi',0],['Scazi 5 dintr-un număr cât timp mai poți',1],['Mergi înainte cât timp nu e un zid în față',1],['Ceri parola din nou până când e scrisă corect',2],['Arunci zarul până când iese 6',2]],why:'Număr cunoscut = contor. „Cât timp”, poate de 0 ori = test la început. Măcar o dată, apoi „până când” = test la final.'},
 {t:'choice',q:'Care algoritm afișează tot 1 2 3 4 5, ca „pentru i ← 1, 5 execută scrie i ■”?',o:['i ← 1; cât timp i ≤ 5 execută scrie i; i ← i + 1 ■','i ← 1; cât timp i < 5 execută scrie i; i ← i + 1 ■','i ← 0; cât timp i ≤ 5 execută scrie i; i ← i + 1 ■','i ← 1; cât timp i ≤ 5 execută scrie i ■'],ok:0,why:'La „cât timp”, contorul îl pornești, îl verifici și îl crești tu. Cu „&lt;” se oprește la 4, cu pornire de la 0 afișează și 0, iar fără i ← i + 1 nu se mai oprește.'},
 {t:'match',q:'Leagă fiecare structură de ce o deosebește.',pairs:[['pentru','numărul de treceri se știe dinainte'],['cât timp','testul e înaintea pașilor'],['repetă … până când','testul e după pași']],why:'Cu aceste trei deosebiri alegi repede structura potrivită.'},
 {t:'choice',q:'Citești numere până la primul 0, și sigur citești măcar unul. Ce structură folosești?',o:['repetă … până când','pentru i ← 1, 10','dacă … atunci … altfel'],ok:0,why:'Nu știi câte numere vin, dar măcar unul citești: test la final. „Pentru” ar citi fix 10 numere, iar decizia nu repetă nimic.'}
]},
{t:'Repetiția în blocuri grafice',lectii:[24],continuturi:['Modalități de reprezentare a structurilor repetitive prin blocuri grafice'],text:`
<p>Un algoritm se poate desena ca <mark>schemă logică</mark>, din <mark>blocuri grafice</mark> legate cu săgeți:</p>
<ul>
<li><strong>ovalul</strong>: START și STOP;</li>
<li><strong>paralelogramul</strong>: citire sau scriere;</li>
<li><strong>dreptunghiul</strong>: un calcul, o atribuire;</li>
<li><strong>rombul</strong>: o condiție, cu două ieșiri, DA și NU.</li>
</ul>
<p>Repetiția se vede ca o <mark>săgeată care se întoarce</mark> înapoi. La <em>cât timp</em>, rombul stă <strong>înaintea</strong> pașilor repetați. La <em>repetă … până când</em>, rombul stă <strong>după</strong> ei.</p>
<p>Și blocurile din Scratch sunt blocuri grafice: pașii repetați stau în interiorul blocului <strong>repetă</strong>.</p>`,
qs:[
 {t:'match',q:'Leagă fiecare bloc al schemei logice de ce scrii în el.',pairs:[['Ovalul','START sau STOP'],['Paralelogramul','citire sau scriere'],['Dreptunghiul','un calcul, o atribuire'],['Rombul','o condiție, cu DA și NU']],why:'Forma blocului spune ce fel de pas e. Cine citește schema recunoaște repede o întrebare (rombul) sau un calcul (dreptunghiul).'},
 {t:'tf',q:'Într-o schemă logică, condiția unei repetiții se desenează într-un dreptunghi.',ok:false,why:'Fals. Orice condiție stă într-un romb, pentru că are două ieșiri: DA și NU. Dreptunghiul are o singură ieșire.'},

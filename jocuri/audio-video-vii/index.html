${FIG.zone}`,
   exemplu:`<p>Drumul unui clip prin editor:</p><ol><li>îl aduci în <b>bibliotecă</b>;</li><li>îl tragi pe <b>linia de timp</b>;</li><li>îl privești în <b>previzualizare</b>;</li><li>îi pui un titlu din <b>bara de unelte</b>.</li></ol>`,
   altfel:`<p>E ca într-o bucătărie: cămara e <b>biblioteca</b> (acolo stau ingredientele), masa de lucru e <b>linia de timp</b> (acolo le pui în ordine), gustul e <b>previzualizarea</b>, iar cuțitele și tigăile sunt <b>uneltele</b>.</p>`,
   incearca:{t:'match',q:'Leagă fiecare zonă a editorului de rolul ei.',pairs:[['Biblioteca de materiale','Aici stau clipurile și sunetele aduse în proiect'],['Linia de timp','Aici așezi materialele în ordine'],['Previzualizarea','Fereastra în care vezi rezultatul'],['Bara de unelte','Text, tranziții, efecte']],ajutor:'Fiecare rând din listă începe cu numele zonei.',why:'Materialele pleacă din bibliotecă, se așază pe linia de timp și se verifică în previzualizare.'},
   inca:[
    {t:'choice',q:'Ai pus trei clipuri pe linia de timp. Unde te uiți ca să vezi cum arată filmul?',o:['În previzualizare','În bibliotecă','În bara de unelte','În folderul Descărcări'],ok:0,ajutor:'Zona care îți arată rezultatul.',why:'Previzualizarea redă ce e pe linia de timp, exact cum va vedea privitorul.'}
   ]},
  {t:'Timpul curge de la stânga la dreapta',
   text:`<p>Pe linia de timp totul curge <strong>de la stânga la dreapta</strong>: ce e mai în stânga se vede mai devreme.</p>
<p>Linia de timp are mai multe rânduri, numite <mark>piste</mark>, așezate una sub alta:</p>
<ul><li>pe <strong>pista video</strong> pui ce se vede: filmări, poze, titluri;</li>
<li>pe <strong>pista audio</strong> pui ce doar se aude: muzică, voce, aplauze.</li></ul>
<p>Ce stă pe piste diferite, <strong>unul sub altul</strong>, se aude și se vede <strong>în același timp</strong>.</p>`,
   exemplu:`${miniTL([['video',[['Titlu',4],['Interviul',12],['Final',4]]],['audio',[['Muzică de fundal',20,'a']]]])}
<p>Întâi se vede <b>Titlul</b> (e cel mai din stânga), apoi <b>Interviul</b>, apoi <b>Finalul</b>. <b>Muzica</b> e dedesubt, deci se aude tot timpul, sub imagini.</p>`,
   altfel:`<p>Linia de timp e ca un tren văzut de pe peron: locomotiva (stânga) trece prima, vagoanele vin după ea. Pistele sunt ca două trenuri pe linii paralele care merg alături.</p>`,
   incearca:{t:'tf',q:'Pe linia de timp, un clip așezat mai la dreapta se vede mai devreme.',ok:false,ajutor:'În ce direcție curge timpul?',why:'Fals. Timpul curge de la stânga la dreapta, deci ce e mai la dreapta vine mai târziu.'},
   inca:[
    {t:'classify',q:'Pe ce fel de pistă pui fiecare material?',cats:['Pistă video','Pistă audio'],items:[['Filmarea făcută cu telefonul',0],['Muzica de fundal',1],['O fotografie a școlii',0],['Vocea înregistrată la microfon',1],['Un efect sonor de aplauze',1]],ajutor:'Se vede sau doar se aude?',why:'Ce se vede merge pe pista video. Ce doar se aude merge pe o pistă audio, ca să-i poți regla volumul separat.'},
    {t:'choice',q:'Muzica stă pe pista audio, exact sub interviu. Când se aude?',o:['În același timp cu interviul','După ce se termină interviul','Înainte să înceapă interviul','Niciodată, e pe altă pistă'],ok:0,ajutor:'Ce stă unul sub altul se întâmplă…',why:'Pistele merg în paralel: ce stă unul sub altul se aude și se vede în același timp.'}
   ]},
  {t:'Cursorul de redare',
   text:`<p>Pe linia de timp vezi o <strong>linie verticală</strong> care traversează toate pistele. Ea este <mark>cursorul de redare</mark> și arată <strong>momentul în care ești</strong>.</p>
<ul><li>când apeși redarea, filmul pornește <strong>de unde stă cursorul</strong>;</li>
<li>îl muți apăsând pe rigla cu secunde de deasupra pistelor sau trăgându-l cu mouse-ul;</li>
<li>în multe editoare, tot acolo <strong>se taie</strong> un clip în două (vei vedea în nivelul 4).</li></ul>
${FIG.cursor}`,
   exemplu:`<p>Vrei să verifici doar finalul unui film de 20 de secunde: duci cursorul la secunda 16 și apeși redarea. Vezi ultimele 4 secunde, fără să aștepți tot filmul.</p>`,
   incearca:{t:'choice',q:'Vrei să vezi montajul de la secunda 12 încolo. Ce faci întâi?',o:['Duci cursorul de redare la secunda 12','Exporți proiectul','Muți toate clipurile la începutul pistei','Închizi previzualizarea'],ok:0,ajutor:'Redarea pornește de unde stă…',why:'Redarea pornește din locul în care stă cursorul, deci îl duci întâi la momentul dorit.'},
   inca:[
    {t:'tf',q:'Redarea pornește mereu de la începutul filmului, oriunde ar sta cursorul.',ok:false,ajutor:'Recitește primul punct din listă.',why:'Fals. Redarea pornește de unde stă cursorul de redare.'}
   ]}
 ],
 atelier:{t:'montaj',titlu:'Pune clipurile în ordine pe pistă',
  intro:`<p><strong>Sarcina:</strong> scenariul spune: întâi <b>titlul</b>, apoi <b>întrebarea</b> reporterului, apoi <b>răspunsul</b>. Pune cele trei clipuri pe pistă în ordinea asta. „Dubla ratată” nu intră în film.</p>
<ol><li>Apasă un clip din <b>bibliotecă</b>: se pune la capătul pistei.</li><li>Ai greșit ordinea? Apasă clipul de pe pistă, apoi <b>◀ Mai devreme</b> sau <b>Mai târziu ▶</b>.</li><li>Un clip pus din greșeală: apasă-l și alege <b>Scoate de pe pistă</b>.</li><li>Apasă <b>Verifică</b>.</li></ol>
<p class="hint">Butoanele + și − pentru tăiere le folosești abia în nivelul 4.</p>`,
  q:'Pune pe pistă: titlul, întrebarea, răspunsul.',
  ajutor:'Ordinea din scenariu: titlul primul (cel mai din stânga), apoi întrebarea, apoi răspunsul.',
  clipuri:[
   {id:'r',nume:'Răspunsul bibliotecarei',dur:10,bucati:[[0,10,'bibliotecara răspunde','ok']]},
   {id:'rat',nume:'Dubla ratată',dur:5,bucati:[[0,5,'reporterul râde și uită întrebarea','x']]},
   {id:'t',nume:'Titlul „Cartea anului”',dur:4,bucati:[[0,4,'titlul pe ecran','ok']]},
   {id:'i',nume:'Întrebarea reporterului',dur:6,bucati:[[0,6,'„Ce carte se citește cel mai mult?”','ok']]}],
  ordine:['t','i','r'],
  why:'Pe linia de timp ordinea de la stânga la dreapta e ordinea în care privitorul vede filmul.',
  inca:[{t:'montaj',q:'Încă una: colegul a pus clipurile pe pistă, dar în ordinea greșită. Scenariul: <b>sosirea</b> la muzeu, <b>ghidul</b> care explică, <b>plecarea</b> cu autocarul. Mută-le până sunt în ordine.',
   ajutor:'Apasă clipul care trebuie să fie primul și mută-l mai devreme până ajunge în stânga.',
   clipuri:[
    {id:'p',nume:'Plecarea cu autocarul',dur:5,bucati:[[0,5,'autocarul pleacă','ok']]},
    {id:'g',nume:'Ghidul explică',dur:9,bucati:[[0,9,'ghidul vorbește despre dinozauri','ok']]},
    {id:'s',nume:'Sosirea la muzeu',dur:6,bucati:[[0,6,'clasa intră în muzeu','ok']]}],
   ordine:['s','g','p'],pePista:['p','g','s'],
   why:'Ordinea poveștii e ordinea de pe pistă: sosirea, ghidul, plecarea.'}]},
 qs:[
  {t:'choice',q:'Ce arată linia de timp a unui editor audio-video?',o:['Ordinea în timp a clipurilor și a sunetelor','Folderul în care e salvat proiectul','Lista de fonturi','Câte pagini are documentul'],ok:0,why:'Linia de timp așază materialele de la stânga la dreapta, în ordinea în care vor fi văzute și auzite.'},
  {t:'match',q:'Leagă fiecare zonă a editorului de rolul ei.',pairs:[['Biblioteca de materiale','Aici stau clipurile și sunetele aduse în proiect'],['Linia de timp','Banda cu piste pe care așezi materialele în ordine'],['Previzualizarea','Fereastra în care vezi rezultatul'],['Cursorul de redare','Linia verticală care arată momentul curent']],why:'Materialele pleacă din bibliotecă, se așază pe linia de timp și se verifică în previzualizare. Cursorul îți arată în ce secundă ești.'},
  {t:'tf',q:'Două clipuri așezate unul sub altul, pe piste diferite, se văd sau se aud în același timp.',ok:true,ajutor:'Gândește-te la muzica de sub interviu.',why:'Adevărat. Pistele merg în paralel; de aceea muzica de fundal stă sub imagini.'},
  {t:'classify',q:'Pe ce fel de pistă pui fiecare material?',cats:['Pistă video','Pistă audio'],items:[['Titlul scris al filmului',0],['Muzica de la final',1],['Poza cu clasa',0],['Vocea care povestește',1]],why:'Ce se vede (titluri, poze) merge pe pista video; ce doar se aude, pe pista audio.'},
  {t:'choice',q:'Vrei să tai o înregistrare cu vocea colegului (doar sunet). Ce editor deschizi?',o:['Audacity','Clipchamp','Paint','Word'],ok:0,ajutor:'Care dintre editoarele din lecție e pentru sunet?',why:'Audacity e editorul de sunet din lecție; Clipchamp e pentru video.'}
 ]},

/* ================= 2. Proiectul și microfonul (lecția 12) ================= */
{t:'Proiectul și microfonul',lectii:[12],continuturi:[PROG.gestionare,PROG.inregistrare],
 obiectiv:'creezi, salvezi și redeschizi un proiect, înregistrezi vocea cu ● ■ ▶ și citești din forma de undă dacă înregistrarea a ieșit bine.',
 pasi:[
  {t:'Proiectul ține minte munca ta',
   text:`<p>Când începi o lucrare într-un editor, creezi un <mark>proiect</mark>. Proiectul e fișierul tău de lucru și ține minte:</p>
<ul><li>ce ai pus pe fiecare pistă;</li><li>unde ai tăiat;</li><li>cât de tare e fiecare pistă.</li></ul>
<p>Materialele (clipurile, sunetele) nu se strică: proiectul doar notează ce ai făcut cu ele.</p>
${FIG.proiect}`,
   altfel:`<p>E ca salvarea dintr-un joc video: nu e jocul terminat, e locul în care ai rămas. Data viitoare continui de acolo, cu tot ce ai strâns.</p>`,
   incearca:{t:'choice',q:'Ce ține minte proiectul?',o:['Pistele, tăieturile și volumul fiecărei piste','Doar numele tău','Doar filmul terminat, lipit laolaltă','Parola calculatorului'],ok:0,ajutor:'Uită-te la lista cu trei puncte din pas.',why:'Proiectul e fișierul de lucru: păstrează pistele, tăieturile și volumele, ca să poți lucra mai departe.'},
   inca:[
    {t:'tf',q:'Când tai un clip în proiect, se strică și fișierul original de pe disc.',ok:false,ajutor:'Recitește ultima propoziție a pasului.',why:'Fals. Proiectul doar notează unde ai tăiat; fișierul original rămâne întreg.'}
   ]},
  {t:'Meniul Fișier: Nou, Deschide, Salvează',
   text:`<p>Operațiile cu proiectul le găsești în meniul <mark>Fișier (File)</mark>:</p>
<ul><li><strong>Nou</strong>: creezi un proiect gol;</li>
<li><strong>Salvează ca</strong>: prima salvare, îi dai un nume;</li>
<li><strong>Salvează</strong>: salvezi din nou, cu același nume. Fă asta <strong>des</strong>;</li>
<li><strong>Deschide</strong>: data viitoare, redeschizi proiectul și lucrezi mai departe;</li>
<li>la final <strong>închizi</strong> fereastra editorului.</li></ul>
${FIG.fisier}`,
   exemplu:`<p><b>Luni:</b> Fișier → Nou · lucrezi · Fișier → Salvează ca → scrii „interviu” · închizi.<br><b>Marți:</b> deschizi editorul · Fișier → Deschide → alegi „interviu” · lucrezi · Fișier → Salvează.</p>`,
   incearca:{t:'order',q:'Pune în ordine lucrul pe două zile.',items:['Fișier → Nou','Lucrezi la montaj','Fișier → Salvează ca, cu numele „interviu”','Închizi editorul','A doua zi: Fișier → Deschide → „interviu”'],ajutor:'Uită-te la exemplul „Uite cum”: luni, apoi marți.',why:'Creezi, lucrezi, salvezi cu nume, închizi; a doua zi redeschizi exact proiectul salvat.'},
   inca:[
    {t:'choice',q:'Ieri ai salvat proiectul și ai închis editorul. Azi vrei să mai tai din clipuri. Ce faci?',o:['Fișier → Deschide și alegi proiectul de ieri','Fișier → Nou și o iei de la capăt','Deschizi muzica de fundal din folder','Nimic, proiectul se deschide singur'],ok:0,ajutor:'Care operație din listă e pentru „data viitoare”?',why:'Deschide îți aduce proiectul cu tot ce ai lucrat. Un proiect nou te-ar pune s-o iei de la zero.'},
    {t:'choice',q:'Ai salvat o dată proiectul cu numele „interviu”. Ai mai lucrat o oră. Ce apeși ca să nu pierzi munca?',o:['Fișier → Salvează','Fișier → Nou','Fișier → Deschide','Închizi fără să salvezi'],ok:0,ajutor:'Numele există deja; vrei doar să păstrezi schimbările.',why:'Salvează păstrează schimbările în același proiect. „Salvează ca” e pentru prima salvare sau pentru un nume nou.'}
   ]},
  {t:'Proiectul nu e încă filmul: exportul',
   text:`<p>Proiectul se deschide <strong>doar în editor</strong>. Fișierul pe care îl dai altora (un <code>.mp3</code> cu sunet sau un <code>.mp4</code> cu film) apare abia la final, prin <mark>export</mark>. În Audacity, comanda e tot în meniul Fișier: <strong>Exportă audio</strong>.</p>
<p>Diferența contează: în fișierul exportat totul e <strong>lipit laolaltă</strong>. Nu-l mai poți desface pe piste. De aceea <strong>păstrezi proiectul</strong>, chiar după export.</p>`,
   exemplu:`<table class="tabel2"><tr><th></th><th>Proiectul</th><th>Fișierul exportat</th></tr>
<tr><td>Se deschide</td><td>doar în editor</td><td>oriunde: telefon, alt calculator</td></tr>
<tr><td>Are piste separate</td><td>da, poți tăia mai departe</td><td>nu, totul e lipit</td></tr>
<tr><td>Îl folosești ca să</td><td>lucrezi</td><td>arăți altora</td></tr></table>`,
   incearca:{t:'tf',q:'Exportul și salvarea proiectului sunt același lucru.',ok:false,ajutor:'Uită-te la tabelul din „Uite cum”.',why:'Fals. Salvarea păstrează proiectul, care se poate edita. Exportul face fișierul final, care se deschide oriunde, dar nu mai are piste separate.'},
   inca:[
    {t:'choice',q:'Ai lucrat o oră la montaj și vrei să continui mâine. Ce faci?',o:['Salvezi proiectul','Exporți un MP4 și ștergi proiectul','Închizi editorul fără să salvezi','Faci o captură de ecran a liniei de timp'],ok:0,ajutor:'Mâine vrei piste separate, ca să mai poți tăia.',why:'Proiectul păstrează pistele și tăieturile. Un MP4 exportat are totul lipit laolaltă.'}
   ]},
  {t:'Înregistrezi: ●, ■, ▶',
   text:`<p>În Audacity, sus, e bara cu butoanele de înregistrare:</p>
<ul><li>din <strong>Setări audio</strong> alegi microfonul;</li>
<li><strong>●</strong> (cercul roșu) pornește <mark>înregistrarea</mark>;</li>
<li><strong>■</strong> (pătratul) o oprește;</li>
<li><strong>▶</strong> (triunghiul) <mark>redă</mark>: asculți ce ai înregistrat.</li></ul>
<p>Pe pistă apare înregistrarea, desenată ca o <strong>formă de undă</strong>.</p>
${FIG.transport}`,
   exemplu:`<ol><li>Setări audio → alegi microfonul.</li><li>Te așezi într-un loc liniștit.</li><li>Apeși <b>●</b> și vorbești clar.</li><li>Apeși <b>■</b>.</li><li>Apeși <b>▶</b> și asculți.</li></ol>`,
   incearca:{t:'match',q:'Leagă fiecare buton de ce face.',pairs:[['●','Pornește înregistrarea'],['■','Oprește'],['▶','Redă, ca să asculți'],['Setări audio','Alegi microfonul']],ajutor:'Cercul roșu e pentru înregistrare, triunghiul pentru redare.',why:'Cercul roșu înregistrează, pătratul oprește, triunghiul redă; microfonul îl alegi din Setări audio.'},
   inca:[
    {t:'order',q:'Înregistrezi 20 de secunde de voce. Pune pașii în ordine.',items:['Te așezi într-un loc liniștit, cu microfonul pregătit','Apeși butonul de înregistrare (●)','Vorbești clar','Oprești înregistrarea (■)','Redai (▶) și asculți rezultatul'],ajutor:'Uită-te la „Uite cum”: locul liniștit vine înainte de butonul roșu.',why:'Pregătești locul înainte să apeși butonul, altfel prinzi zgomotul. Asculți la final, ca să afli dacă trebuie să reînregistrezi.'}
   ]},
  {t:'Forma de undă îți spune cum a ieșit',
   text:`<p><mark>Forma de undă</mark> e desenul sunetului: unde e <strong>mai înaltă</strong>, sunetul e <strong>mai tare</strong>. Uită-te la ea înainte să asculți:</p>
<ul><li><strong>aproape plată</strong>: ai stat prea departe, microfonul a prins foarte puțin;</li>
<li><strong>vârfurile ating marginile</strong> pistei: ai stat lipit de microfon și vocea sună spart;</li>
<li><strong>vârfuri potrivite</strong>, care nu ating marginile: e bine. Stai cam la o palmă de microfon.</li></ul>
<p>Alege un loc liniștit: zgomotul de fond (ventilatorul, colegii) se înregistrează odată cu vocea și se scoate greu.</p>
${FIG.unda}`,
   exemplu:`<p class="umlbl"><b>Bine</b> · la o palmă de microfon</p>${unda('bun')}
<p class="umlbl"><b>Aproape plată</b> · prea departe</p>${unda('plat')}
<p class="umlbl"><b>Vârfuri tăiate</b> (roșu) · lipit de microfon</p>${unda('taiat')}`,
   altfel:`<p>E ca o poză: dacă stai prea departe, abia te vezi; dacă lipești fața de obiectiv, iese totul neclar. La o palmă distanță, microfonul te „vede” bine.</p>`,
   incearca:{t:'choice',q:'Forma de undă a înregistrării tale e aproape plată de la un capăt la altul. Ce înseamnă, cel mai probabil?',o:['Microfonul a prins foarte puțin sunet','Sunetul e prea tare','Înregistrarea e perfectă','Fișierul e video, nu audio'],ok:0,ajutor:'Înălțimea undei = cât de tare e sunetul.',why:'O undă plată înseamnă aproape liniște: ai stat prea departe sau microfonul greșit e ales.'},
   inca:[
    {t:'choice',q:'Vârfurile undei ating marginile de sus și de jos ale pistei, iar vocea sună spart. Ce faci?',o:['Reînregistrezi, stând cam la o palmă de microfon','Te lipești și mai tare de microfon','Exporți ca MP3','Nu faci nimic, e perfect'],ok:0,ajutor:'Vârfurile tăiate apar când stai prea aproape.',why:'Vârfurile care ating marginile înseamnă că ai stat lipit de microfon. La o palmă distanță, vocea iese curată.'},
    {t:'choice',q:'La redare se aude tare ventilatorul din clasă. Care e cea mai bună soluție?',o:['Reînregistrezi într-un loc liniștit','Pui muzică foarte tare peste','Exporți de două ori','Mărești volumul înregistrării'],ok:0,ajutor:'Zgomotul de fond se scoate greu după.',why:'Dacă mărești volumul, crește și zgomotul. Muzica tare acoperă și vocea.'}
   ]}
 ],
 atelier:{t:'inregistrare',titlu:'Înregistrează-ți vocea',
  intro:`<p><strong>Sarcina:</strong> fă o înregistrare bună de 20 de secunde, ca în Audacity.</p>
<ol><li>Alege cât de departe stai de microfon.</li><li>Apasă <b>●</b>, „vorbește”, apoi <b>■</b>.</li><li>Uită-te la forma de undă și apasă <b>▶</b> ca s-o asculți.</li><li>Nu e bună? <b>Șterge înregistrarea</b> și refă-o. Apoi apasă <b>Verifică</b>.</li></ol>`,
  q:'Înregistrează 20 de secunde de voce, clar, și ascult-o.',
  ajutor:'La o palmă de microfon, apoi ●, ■, ▶.',
  why:'Ai înregistrat de la distanța bună, ai oprit și ai ascultat. Așa lucrezi și în Audacity.',
  inca:[{t:'inregistrare',q:'Încă una: colegul tău a înregistrat deja ceva. Ascultă, uită-te la formă și, dacă nu e bine, refă înregistrarea.',start:{dist:'lipit'},
   ajutor:'Vârfurile roșii ating marginile: a stat lipit. Șterge, alege o palmă distanță, apoi ●, ■, ▶.',
   why:'Ai recunoscut vârfurile tăiate și ai refăcut înregistrarea de la distanța potrivită.'},
   {t:'inregistrare',q:'Încă una: altă înregistrare a colegului. Verific-o și refă-o dacă trebuie.',start:{dist:'departe'},
   ajutor:'O undă aproape plată înseamnă că a stat prea departe.',
   why:'Unda plată înseamnă prea departe; ai refăcut-o mai aproape și ai ascultat-o.'}]},
 qs:[
  {t:'choice',q:'Ce păstrează proiectul, dar NU mai are fișierul exportat?',o:['Pistele separate și tăieturile','Sunetul înregistrat, cu toate vocile','Imaginea filmată, în culori','Numele pe care l-ai dat fișierului'],ok:0,ajutor:'Gândește-te la tabelul din pasul 3.',why:'În fișierul exportat totul e lipit laolaltă. Doar proiectul mai are pistele separate.'},
  {t:'choice',q:'În ce meniu al Audacity găsești Nou, Deschide și Salvează?',o:['Fișier','Editează','Efect','Setări audio'],ok:0,why:'Operațiile cu proiectul (creare, deschidere, salvare) stau în meniul Fișier.'},
  {t:'order',q:'Pune în ordine o înregistrare făcută corect.',items:['Din Setări audio alegi microfonul','Apeși ●','Vorbești clar','Apeși ■','Apeși ▶ și asculți'],why:'Alegi microfonul, înregistrezi, oprești, apoi asculți ca să verifici.'},
  {t:'choice',q:'Forma de undă are vârfurile tăiate, lipite de margini. Ce s-a întâmplat?',o:['Ai stat lipit de microfon','Ai stat prea departe','Ai uitat să apeși ■','Ai salvat proiectul'],ok:0,ajutor:'Care dintre cele trei forme din pasul 5 ating marginile?',why:'Lipit de microfon, sunetul e prea tare și vârfurile se taie. Prea departe, unda iese plată.'},
  {t:'tf',q:'Dacă mărești volumul unei înregistrări cu zgomot de fond, zgomotul dispare.',ok:false,why:'Fals. Crește și vocea, și zgomotul. Soluția e să reînregistrezi într-un loc liniștit.'},
  {t:'choice',q:'Ieri ai salvat proiectul și ai închis editorul. Azi vrei să mai tai din clipuri. Ce deschizi?',o:['Proiectul salvat ieri, din editor','Filmul MP4 exportat ieri','Un proiect nou, gol','Muzica de fundal, din folder'],ok:0,why:'Doar proiectul mai are pistele și tăieturile separate. În MP4 totul e lipit laolaltă.'}
 ]},

/* ================= 3. Formate și comprimare (lecția 12) ================= */
{t:'Formate și comprimare',lectii:[12],continuturi:[PROG.gestionare],
 obiectiv:'recunoști după extensie dacă un fișier e sunet sau film și alegi formatul potrivit: WAV pentru lucru, MP3 pentru trimis, MP4 pentru film.',
 pasi:[
  {t:'Extensia îți spune ce e înăuntru',
   text:`<p>Numele unui fișier se termină cu un punct și câteva litere: <mark>extensia</mark>. Ea spune <strong>formatul</strong>, adică felul în care e păstrat sunetul sau filmul.</p>
<ul><li>doar sunet: <code>.wav</code>, <code>.mp3</code>, <code>.flac</code>;</li>
<li>imagine și sunet (video): <code>.mp4</code>, <code>.mov</code>.</li></ul>
<p>Dacă nu vezi extensia, în Explorer bifează „Extensii nume fișiere” din meniul Vizualizare.</p>`,
   exemplu:`<table class="tabel2"><tr><th>Fișier</th><th>Ce e</th></tr><tr><td>interviu.mp3</td><td>sunet</td></tr><tr><td>serbare.mp4</td><td>film: imagine și sunet</td></tr><tr><td>cor.wav</td><td>sunet</td></tr></table>`,
   incearca:{t:'classify',q:'Ce conține, de obicei, fiecare fișier?',cats:['Doar sunet','Imagine și sunet'],items:[['interviu.mp3',0],['excursie.mp4',1],['voce.wav',0],['filmare.mov',1]],ajutor:'Caută extensia în cele două liste din pas.',why:'MP3, WAV și FLAC sunt formate audio. MP4 și MOV sunt video.'},
   inca:[
    {t:'choice',q:'Care fișier e un film (imagine și sunet)?',o:['clip_scoala.mp4','melodie.flac','voce.wav','podcast.mp3'],ok:0,ajutor:'Doar una dintre extensii e în lista video.',why:'.mp4 e format video. Celelalte trei sunt doar sunet.'}
   ]},
  {t:'WAV: necomprimat, păstrează tot',
   text:`<p>Un fișier <code>.wav</code> e de obicei <mark>necomprimat</mark>: păstrează absolut tot sunetul înregistrat. Prețul: ocupă mult loc. Un minut de muzică stereo are cam <strong>10 MB</strong>.</p>
<p>A <mark>comprima</mark> înseamnă a face fișierul mai mic, ca să ocupe mai puțin și să se trimită mai repede. Există două feluri de comprimare, pe care le vezi în pașii următori.</p>`,
   exemplu:`<p>O melodie de 3 minute, în WAV: 3 × 10 MB = cam <b>30 MB</b>. Pe un stick de 1 GB (cam 1000 MB) încap vreo 33 de melodii.</p>`,
   altfel:`<p>Comprimarea e ca îndesatul hainelor în valiză: aceleași lucruri, în mai puțin loc. Necomprimat e ca și cum ai duce fiecare haină pe umeraș.</p>`,
   incearca:{t:'choice',q:'Cam cât ocupă un minut de muzică stereo în WAV?',o:['Cam 10 MB','Cam 10 KB','Cam 10 GB','Nimic, e doar sunet'],ok:0,ajutor:'Cifra e în prima propoziție a pasului.',why:'WAV păstrează tot, deci ocupă mult: cam 10 MB pe minut.'},
   inca:[
    {t:'tf',q:'A comprima un fișier înseamnă a-l face mai mic.',ok:true,ajutor:'Recitește al doilea paragraf.',why:'Adevărat. Comprimarea micșorează fișierul, ca să ocupe mai puțin și să se trimită mai repede.'}
   ]},
  {t:'MP3: comprimat cu pierderi',
   text:`<p>Un fișier <code>.mp3</code> e <mark>comprimat cu pierderi</mark>: aruncă sunetele pe care urechea le observă greu. La o calitate obișnuită, același minut de muzică are cam <strong>1 MB</strong>, de vreo zece ori mai puțin decât în WAV.</p>
<p>Ce s-a aruncat <strong>nu se mai întoarce</strong>. Dacă iei un MP3 și îl comprimi iar ca MP3, de mai multe ori, sună tot mai rău. Filmele <code>.mp4</code> sunt și ele, de obicei, comprimate cu pierderi.</p>`,
   exemplu:`<p>Aceeași melodie de 3 minute: WAV ≈ <b>30 MB</b>, MP3 ≈ <b>3 MB</b>. Pe telefonul bunicii încap de zece ori mai multe melodii MP3.</p>`,
   altfel:`<p>E ca o fotocopie: arată aproape ca originalul, dar e puțin mai ștearsă. Fă o copie după copie după copie și, la a cincea, abia mai citești ceva.</p>`,
   incearca:{t:'tf',q:'Un fișier MP3 păstrează absolut tot sunetul din înregistrarea originală.',ok:false,ajutor:'Ce înseamnă „cu pierderi”?',why:'Fals. MP3 aruncă sunetele pe care urechea le observă greu. Așa ajunge de vreo zece ori mai mic decât un WAV.'},
   inca:[
    {t:'choice',q:'Un coleg ia un MP3 și îl comprimă din nou ca MP3, de cinci ori la rând. Ce se întâmplă cu sunetul?',o:['Sună tot mai rău, iar calitatea pierdută nu se mai întoarce','Sună exact la fel','Sună mai bine, fiindcă e mai bine împachetat','Redevine WAV'],ok:0,ajutor:'Gândește-te la copia după copie.',why:'Fiecare comprimare cu pierderi mai aruncă ceva. Ce s-a aruncat nu se poate recupera.'},
    {t:'choice',q:'Un minut de muzică are cam 10 MB în WAV. Cam cât are, la o calitate obișnuită, în MP3?',o:['Cam 1 MB','Cam 10 MB','Cam 100 MB','Cam 50 MB'],ok:0,ajutor:'„De vreo zece ori mai puțin.”',why:'MP3 e de vreo zece ori mai mic: cam 1 MB pe minut.'}
   ]},
  {t:'FLAC și ZIP: comprimat fără pierderi',
   text:`<p>Există și comprimare <mark>fără pierderi</mark>: fișierul se micșorează, dar la desfacere iese <strong>identic, bit cu bit</strong>, cu originalul. Nimic nu se aruncă.</p>
<ul><li><code>.flac</code> face asta pentru sunet (ocupă mai mult decât MP3, dar mai puțin decât WAV);</li>
<li>o arhivă <code>.zip</code> face asta pentru orice fișiere.</li></ul>`,
   exemplu:`<table class="tabel2"><tr><th>Fel</th><th>Exemplu</th><th>Ce primești înapoi</th></tr>
<tr><td>necomprimat</td><td>.wav</td><td>tot (n-a fost micșorat)</td></tr>
<tr><td>fără pierderi</td><td>.flac, .zip</td><td>tot, identic</td></tr>
<tr><td>cu pierderi</td><td>.mp3, .mp4</td><td>aproape tot; ce lipsește nu se mai întoarce</td></tr></table>`,
   incearca:{t:'match',q:'Leagă fiecare fel de fișier de ce se întâmplă cu datele lui.',pairs:[['Comprimat fără pierderi','Se desface identic, bit cu bit'],['Comprimat cu pierderi','Pierde detalii greu de observat, care nu se mai întorc'],['Necomprimat','Păstrează tot și ocupă cel mai mult loc']],ajutor:'Uită-te la coloana „Ce primești înapoi”.',why:'Diferența e ce primești înapoi: totul (fără pierderi), aproape totul (cu pierderi) sau totul, nemicșorat (necomprimat).'},
   inca:[
    {t:'tf',q:'După ce dezarhivezi o arhivă .zip, fișierele sunt identice cu cele puse în ea.',ok:true,ajutor:'ZIP e comprimare fără pierderi.',why:'Adevărat. Comprimarea fără pierderi dă înapoi exact originalul.'}
   ]},
  {t:'Ce format alegi, pe scurt',
   text:`<p>Când exporți, editorul te întreabă ce format vrei. Întreabă-te <strong>ce faci mai departe cu fișierul</strong>:</p>
<ol><li><strong>mai lucrezi la el</strong> (îl tai, îl mixezi din nou)? Păstrează-l în <strong>WAV</strong>, ca să nu pierzi calitate;</li>
<li><strong>îl trimiți sau îl pui pe telefon</strong> și e doar sunet? <strong>MP3</strong>, ocupă puțin;</li>
<li>e <strong>film</strong>? <strong>MP4</strong>, se deschide aproape oriunde;</li>
<li>nu comprima din nou un MP3: pornește de la WAV.</li></ol>
${FIG.formate}`,
   incearca:{t:'choice',q:'Păstrezi înregistrarea vocii ca s-o mai editezi de multe ori. În ce format o ții, ca să nu pierzi din calitate?',o:['WAV','MP3','JPG','DOCX'],ok:0,ajutor:'Punctul 1 din listă.',why:'WAV nu aruncă nimic din sunet. JPG e o imagine, iar DOCX e un document Word.'},
   inca:[
    {t:'choice',q:'Trimiți podcastul terminat pe telefonul bunicii, unde are puțin loc. Ce format alegi?',o:['MP3','WAV','MP4','DOCX'],ok:0,ajutor:'E doar sunet și trebuie să ocupe puțin.',why:'MP3 e doar sunet și ocupă de vreo zece ori mai puțin decât WAV.'}
   ]}
 ],
 atelier:{t:'classify',titlu:'Alege formatul la export',
  intro:`<p>În Audacity, <b>Fișier → Exportă audio</b> îți arată lista de formate (ca în captura din pasul 5). În Clipchamp, filmul iese ca MP4. <strong>Sarcina:</strong> pentru fiecare situație, alege formatul potrivit. Folosește cele patru întrebări din pasul 5.</p>`,
  q:'Ce format alegi la export?',cats:['WAV','MP3','MP4'],
  items:[['Păstrezi vocea ca s-o mai editezi',0],['Trimiți melodia pe telefonul bunicii, să ocupe puțin',1],['Interviul filmat, pentru toată clasa',2],['Podcastul terminat, pus pe site-ul școlii',1],['Înregistrarea originală a corului, pentru mai multe montaje',0],['Clipul de la serbare',2]],
  ajutor:'Mai lucrezi la el → WAV. Doar sunet de trimis → MP3. Film → MP4.',
  why:'Formatul se alege după ce faci mai departe: lucru (WAV), trimis sunet (MP3), film (MP4).',
  inca:[{t:'classify',q:'Încă una: cum e păstrat sunetul în fiecare fișier?',cats:['Necomprimat','Comprimat fără pierderi','Comprimat cu pierderi'],items:[['cor.wav',0],['arhiva_proiect.zip',1],['melodie.flac',1],['podcast.mp3',2],['serbare.mp4',2]],ajutor:'Tabelul din pasul 4.',why:'WAV e necomprimat; FLAC și ZIP sunt fără pierderi; MP3 și MP4 sunt cu pierderi.'}]},
 qs:[
  {t:'tf',q:'Un fișier <code>.mp3</code> păstrează absolut tot sunetul din înregistrarea originală.',ok:false,why:'Fals. MP3 comprimă cu pierderi: aruncă sunetele pe care urechea le observă greu.'},
  {t:'classify',q:'Ce conține, de obicei, fiecare fișier?',cats:['Doar sunet','Imagine și sunet'],items:[['stiri.mp3',0],['meci.mp4',1],['pian.wav',0],['clip_clasa.mp4',1],['melodie.flac',0],['vacanta.mov',1]],why:'MP3, WAV și FLAC sunt formate audio. MP4 și MOV sunt video.'},
  {t:'choice',q:'Vrei să mai lucrezi de multe ori la înregistrarea corului. În ce format o păstrezi?',o:['WAV','MP3','MP4','ZIP'],ok:0,ajutor:'Formatul care nu aruncă nimic și e sunet.',why:'WAV nu pierde nimic, deci poți edita și exporta de mai multe ori fără să strici calitatea.'},
  {t:'choice',q:'Un coleg comprimă același MP3 din nou ca MP3, de cinci ori. Ce se întâmplă?',o:['Sună tot mai rău, iar ce s-a pierdut nu se mai întoarce','Sună exact la fel ca originalul','Sună mai bine, fiind mai bine împachetat','Fișierul se transformă singur în WAV'],ok:0,why:'Fiecare comprimare cu pierderi mai aruncă ceva, iar ce s-a aruncat nu se recuperează.'},
  {t:'match',q:'Leagă fiecare fel de fișier de ce se întâmplă cu datele lui.',pairs:[['Comprimat fără pierderi','Se desface identic, bit cu bit'],['Comprimat cu pierderi','Pierde detalii greu de observat, care nu se mai întorc'],['Necomprimat','Păstrează tot și ocupă cel mai mult loc']],why:'Totul înapoi (fără pierderi), aproape totul (cu pierderi) sau totul, nemicșorat (necomprimat).'}
 ]},

/* ================= 4. Tai, șterg, mut (lecția 13) ================= */
{t:'Tai, șterg, mut',lectii:[13],continuturi:[PROG.selectie],
 obiectiv:'selectezi o bucată și o ștergi, o copiezi sau o muți; scurtezi un clip de la capete, îl tai în două și verifici ascultând.',
 pasi:[
  {t:'Întâi selectezi',
   text:`<p>Orice operație începe cu <mark>selecția</mark>: îi arăți editorului pe ce bucată lucrezi.</p>
<ul><li>la <strong>sunet</strong> (Audacity): ții apăsat butonul mouse-ului pe pistă și tragi de la începutul bucății până la sfârșitul ei. Porțiunea aleasă se vede <strong>mai deschisă</strong>;</li>
<li>la <strong>video</strong> (Clipchamp): apeși o dată pe clipul de pe linia de timp și el se încadrează.</li></ul>
${FIG.selectie}`,
   altfel:`<p>E ca în Word: înainte să faci un cuvânt aldin, îl selectezi. Editorul face ce-i ceri doar cu bucata selectată.</p>`,
   incearca:{t:'tf',q:'În Audacity, porțiunea selectată se vede mai deschisă la culoare.',ok:true,ajutor:'Uită-te la captură.',why:'Adevărat. Așa știi exact pe ce bucată vei lucra.'},
   inca:[
    {t:'choice',q:'Vrei să ștergi o tuse din mijlocul înregistrării. Ce faci ÎNTÂI?',o:['Selectezi tusea, trăgând cu mouse-ul pe pistă','Apeși Șterge din meniul Editează','Exporți înregistrarea ca MP3','Salvezi proiectul cu alt nume'],ok:0,ajutor:'Orice operație începe cu…',why:'Fără selecție, editorul nu știe ce bucată să șteargă.'}
   ]},
  {t:'Decupează, copiază, lipește, șterge',
   text:`<p>După selecție, în Audacity deschizi meniul <mark>Editează (Edit)</mark>:</p>
<ul><li><strong>Decupează</strong> (<kbd>Ctrl</kbd>+<kbd>X</kbd>): bucata pleacă și o poți lipi în altă parte. Asta e <strong>mutarea</strong>;</li>
<li><strong>Copiază</strong> (<kbd>Ctrl</kbd>+<kbd>C</kbd>): bucata rămâne pe loc, iar o copie o lipești în altă parte;</li>
<li><strong>Lipește</strong> (<kbd>Ctrl</kbd>+<kbd>V</kbd>): pune bucata acolo unde e cursorul;</li>
<li><strong>Șterge</strong>: bucata dispare.</li></ul>
<p>Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> anulează ultima operație.</p>
${FIG.editare}`,
   exemplu:`<p>Aplauzele sunt la final și le vrei <b>și</b> la început: le selectezi → <b>Copiază</b> → duci cursorul la început → <b>Lipește</b>. Dacă le-ai vrea <b>doar</b> la început: <b>Decupează</b> în loc de Copiază.</p>`,
   altfel:`<p>Copierea e ca o fotocopie: originalul rămâne în dosar. Decuparea e ca atunci când scoți foaia din dosar și o pui în altul.</p>`,
   incearca:{t:'choice',q:'Aplauzele de la finalul clipului trebuie să se audă și la început, dar să rămână și la final. Ce faci cu bucata de aplauze?',o:['O copiezi și o lipești la început','O decupezi și o lipești la început','O ștergi și o înregistrezi din nou','O selectezi și apeși Ctrl+Z'],ok:0,ajutor:'Care operație lasă bucata pe loc?',why:'Copierea lasă bucata pe loc și pune încă una unde vrei. Decuparea ar scoate aplauzele de la final.'},
   inca:[
    {t:'match',q:'Leagă scurtătura de ce face.',pairs:[['Ctrl+X','Decupează: bucata pleacă de pe loc'],['Ctrl+C','Copiază: bucata rămâne pe loc'],['Ctrl+V','Lipește unde e cursorul'],['Ctrl+Z','Anulează ultima operație']],ajutor:'Sunt aceleași ca în Word.',why:'X decupează, C copiază, V lipește, Z anulează.'},
    {t:'tf',q:'Dacă ai șters din greșeală o bucată, Ctrl+Z o aduce înapoi.',ok:true,ajutor:'Recitește ultima propoziție a pasului.',why:'Adevărat. Ctrl+Z anulează ultima operație, inclusiv o ștergere.'}
   ]},
  {t:'Scurtarea de la capete (trim)',
   text:`<p>Cea mai des folosită tăietură: <mark>scurtarea de la capete</mark> (<em>trim</em>). Scoți începutul sau sfârșitul unui clip.</p>
<ol><li>apeși o dată pe clip: la capetele lui apar <mark>mânerele</mark>;</li>
<li>tragi mânerul din stânga spre interior: scoți începutul;</li>
<li>tragi mânerul din dreapta spre interior: scoți sfârșitul.</li></ol>
<p>Fișierul de pe disc nu se strică: dacă tragi mânerul înapoi, bucata revine.</p>
${FIG.scurtare}`,
   exemplu:`<p>Clipul are 12 s: <b>0–3 s</b> pauză, <b>3–10 s</b> răspunsul, <b>10–12 s</b> o întrebare de repetiție. Tragi mânerul stâng până la 3 și mânerul drept până la 10. Rămân 7 secunde, doar răspunsul.</p>
${miniTL([['înainte',[['pauză',3,'g'],['răspunsul',7],['repetiție',2,'g']]],['după',[['răspunsul',7]]]])}`,
   incearca:{t:'choice',q:'Vrei să scoți doar primele 3 secunde dintr-un clip. Ce operație e cea mai simplă?',o:['Scurtarea de la capete, cu mânerul din stânga','Ștergerea întregului clip și filmarea din nou','Copierea clipului în alt loc pe pistă','Exportul proiectului ca fișier video nou'],ok:0,ajutor:'Începutul clipului e în stânga.',why:'Tragi mânerul din stânga spre interior și scoți doar începutul.'},
   inca:[
    {t:'montaj',q:'Încearcă: clipul are 2 secunde în care camera filmează podeaua la final. Scurtează-l de la sfârșit (butonul + de la „Tai de la sfârșit”), apoi verifică.',
     clipuri:[{id:'c',nume:'Colegul prezintă proiectul',dur:10,bucati:[[0,8,'colegul prezintă','ok'],[8,10,'camera filmează podeaua','x']]}],ordine:['c'],pePista:['c'],
     ajutor:'Apasă de două ori + la „Tai de la sfârșit”.',why:'Ai scos exact cele 2 secunde de la final, fără să atingi prezentarea.'}
   ]},
  {t:'Tăierea în două (split)',
   text:`<p>Uneori partea proastă e <strong>la mijloc</strong>. Atunci folosești <mark>tăierea în două</mark> (<em>split</em>):</p>
<ol><li>duci <strong>cursorul de redare</strong> exact unde vrei tăietura;</li>
<li>apeși <strong>butonul-foarfecă</strong> de deasupra liniei de timp.</li></ol>
<p>Clipul devine <strong>două bucăți</strong>. Nimic nu dispare: poți muta, șterge sau scurta fiecare bucată separat.</p>
${FIG.taiere}`,
   exemplu:`<p>Vrei să scoți o strănutătură între secundele 5 și 6: tai în două la 5, tai în două la 6, apeși pe bucățica din mijloc și o ștergi.</p>
${miniTL([['2 tăieri',[['0–5 s',5],['strănut',1,'g'],['6–12 s',6]]],['după',[['0–5 s',5],['6–12 s',6]]]])}`,
   incearca:{t:'tf',q:'Tăierea în două (<em>split</em>) șterge o bucată din clip.',ok:false,ajutor:'Recitește ultima propoziție a pasului.',why:'Fals. Tăierea doar desparte clipul în două. Nimic nu dispare până nu ștergi tu una dintre bucăți.'},
   inca:[
    {t:'order',q:'Scoți o bucată proastă din MIJLOCUL unui clip. Pune pașii în ordine.',items:['Duci cursorul la începutul bucății proaste','Apeși foarfeca','Duci cursorul la sfârșitul bucății proaste','Apeși din nou foarfeca','Apeși pe bucata din mijloc și o ștergi'],ajutor:'Uită-te la „Uite cum”: două tăieri, apoi ștergerea.',why:'Două tăieri izolează bucata proastă; abia apoi o ștergi.'}
   ]},
  {t:'Golul și strategia tăieturii',
   text:`<p>Când ștergi un clip din mijloc, unele editoare lasă un <mark>gol</mark> în locul lui: la redare, acolo e <strong>ecran negru și liniște</strong>. Îl închizi trăgând clipurile de după el spre stânga.</p>
<p>Strategia, de fiecare dată:</p>
<ol><li><strong>redă</strong> și notează de la ce secundă până la ce secundă e partea proastă;</li>
<li><strong>alege unealta</strong>: la capăt → scurtare; la mijloc → două tăieri în două și ștergi bucata; clip întreg ratat → ștergere;</li>
<li><strong>taie</strong>;</li>
<li><strong>redă din nou</strong> ca să verifici. Ai tăiat prea mult? <kbd>Ctrl</kbd>+<kbd>Z</kbd>.</li></ol>`,
   incearca:{t:'classify',q:'Ce operație folosești în fiecare situație?',cats:['Tăiere în două','Scurtare de la capete','Ștergere'],items:[['O tuse la mijlocul clipului, pe care vrei s-o scoți',0],['Clipul începe cu 2 secunde neclare',1],['Un clip întreg a ieșit mișcat și nu-l mai folosești',2],['Clipul se termină cu 3 secunde în care camera filmează podeaua',1]],ajutor:'Punctul 2 al strategiei: la capăt, la mijloc sau clipul întreg?',why:'La mijloc: două tăieri în două, apoi ștergi bucata. La capăt: scurtare. Clipul întreg ratat: ștergere.'},
   inca:[
    {t:'choice',q:'Ștergi un clip din mijlocul pistei, iar în locul lui rămâne un gol. Ce se va vedea acolo, la redare?',o:['Ecran negru și liniște, cât ține golul','Clipul următor, imediat','Clipul șters, fără sunet','O tranziție pusă automat'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Golul e tot timp din film, doar că n-are nimic în el. Îl închizi trăgând clipurile spre stânga.'}
   ]}
 ],
 atelier:{t:'montaj',titlu:'Scurtează răspunsul Mariei',
  intro:`<p><strong>Sarcina:</strong> clipul are o pauză stânjenitoare la început și o întrebare de repetiție la final. Scurtează-l de la capete, ca să rămână doar răspunsul.</p>
<ol><li>Citește lista cu secundele: ce e bun, ce trebuie scos.</li><li>Apasă <b>+</b> la „Tai de la început” până dispare pauza.</li><li>Apasă <b>+</b> la „Tai de la sfârșit” până dispare repetiția.</li><li>Verifică: fiecare rând trebuie să scrie „în montaj” sau „tăiat” unde trebuie.</li></ol>`,
  q:'Scurtează clipul ca să rămână doar răspunsul.',
  ajutor:'Pauza ține 3 secunde (0–3), repetiția 2 secunde (10–12).',
  clipuri:[{id:'r',nume:'Răspunsul Mariei',dur:12,bucati:[[0,3,'liniște, Maria se uită la cameră','x'],[3,10,'Maria răspunde la întrebare','ok'],[10,12,'Maria întreabă: „Mai fac o dată?”','x']]}],
  ordine:['r'],pePista:['r'],
  why:'Ai scos începutul și sfârșitul și ai păstrat tot răspunsul. Jocul a verificat ce ar vedea privitorul, nu ce butoane ai apăsat.',
  inca:[{t:'montaj',q:'Încă una: pe pistă sunt două clipuri. Scoate de tot dubla ratată și taie de la începutul prezentării cele 2 secunde de ezitare.',
   ajutor:'Apasă „Dubla ratată” și „Scoate de pe pistă”; apoi apasă prezentarea și + la „Tai de la început” de două ori.',
   clipuri:[{id:'d',nume:'Dubla ratată',dur:5,bucati:[[0,5,'Ionuț râde și se oprește','x']]},
    {id:'b',nume:'Prezentarea lui Ionuț',dur:11,bucati:[[0,2,'Ionuț ezită: „Ăăă…”','x'],[2,11,'Ionuț prezintă orașul','ok']]}],
   ordine:['b'],pePista:['d','b'],
   why:'Un clip ratat întreg se șterge; un început ratat se scurtează.'}]},
 qs:[
  {t:'choice',q:'Ce faci ÎNAINTE de orice operație (ștergere, copiere, mutare)?',o:['Selectezi bucata pe care lucrezi','Exporți proiectul ca MP4','Apeși Ctrl+Z de două ori','Închizi și redeschizi editorul'],ok:0,why:'Selecția îi arată editorului pe ce bucată lucrezi. Fără ea, operația nu știe ce să ia.'},
  {t:'tf',q:'Tăierea în două (<em>split</em>) desparte clipul în două bucăți, fără să dispară nimic.',ok:true,why:'Adevărat. Abia după ce ștergi o bucată, ea dispare din montaj.'},
  {t:'choice',q:'Vrei ca muzica de la început să se audă DOAR la final. Ce folosești?',o:['Decupezi bucata și o lipești la final','Copiezi bucata și o lipești la final','Tai clipul în două','Ștergi bucata'],ok:0,ajutor:'Care operație scoate bucata de pe loc?',why:'Decuparea (mutarea) scoate bucata de unde era. Copierea ar lăsa-o și la început.'},
  {t:'choice',q:'Ai șters din greșeală răspunsul cel mai bun. Ce apeși imediat?',o:['Ctrl+Z','Ctrl+C','Ctrl+X','Exportă audio'],ok:0,why:'Ctrl+Z anulează ultima operație și aduce bucata înapoi.'},
  {t:'order',q:'Pune în ordine strategia unei tăieturi bune.',items:['Redai și notezi secundele părții proaste','Alegi unealta potrivită','Tai','Redai din nou ca să verifici'],why:'Întâi afli unde e problema, apoi alegi unealta, tai și verifici ascultând.'},
  {t:'classify',q:'Ce operație folosești?',cats:['Tăiere în două','Scurtare de la capete','Ștergere'],items:[['Un strănut la mijlocul clipului, pe care îl vrei scos',0],['Primele 4 secunde sunt negre',1],['Clipul e filmat cu degetul pe obiectiv, tot',2],['Finalul are 2 secunde în care cineva spune „Gata?”',1]],ajutor:'La mijloc, la capăt sau clipul întreg?',why:'La mijloc: tăieri în două. La capăt: scurtare. Clipul întreg ratat: ștergere.'}
 ]},

/* ================= 5. Mixajul (lecția 13) ================= */
{t:'Mixajul',lectii:[13],continuturi:[PROG.mixare],
 obiectiv:'reglezi volumul fiecărei piste ca vocea să se audă clar peste muzică, pui fade in și fade out și alegi muzică pe care ai voie s-o folosești.',
 pasi:[
  {t:'Mai multe piste, un singur sunet',
   text:`<p>Un interviu bun are adesea mai multe surse de sunet, fiecare pe <strong>pista ei</strong>: vocea, muzica de fundal, un efect sonor (aplauze, un clopoțel).</p>
<p><mark>Mixarea</mark> înseamnă să le combini într-un <strong>singur sunet echilibrat</strong>, în care fiecare se aude cât trebuie. La export, toate pistele se lipesc într-una singură.</p>
${FIG.mixaj}`,
   exemplu:`${miniTL([['voce',[['Reporterul',4,'a'],['Bibliotecara',10,'a']]],['muzică',[['Muzică de fundal',14,'a']]],['efect',[['',11,'g'],['aplauze',3,'a']]]])}`,
   incearca:{t:'choice',q:'Ce înseamnă mixarea?',o:['Combini mai multe piste într-un sunet echilibrat','Tai un clip în două, la cursorul de redare','Transformi un MP3 în WAV, ca să sune mai bine','Înregistrezi vocea la microfon, pe o pistă'],ok:0,ajutor:'A doua propoziție a pasului.',why:'Mixarea echilibrează sursele: voce, muzică, efecte.'},
   inca:[
    {t:'tf',q:'Vocea, muzica și aplauzele stau de obicei pe piste separate.',ok:true,ajutor:'Fiecare sursă, pe pista ei.',why:'Adevărat. Așa îi poți regla fiecăreia volumul separat.'}
   ]},
  {t:'Volumul fiecărei piste',
   text:`<p>Fiecare pistă are <strong>glisorul ei de volum</strong>, în panoul din stânga pistei. Îl tragi spre stânga ca să fie mai încet, spre dreapta ca să fie mai tare.</p>
<p>Regula de bază: <strong>vocea se aude clar</strong>, iar muzica stă <strong>mult mai încet</strong>, în fundal. Dacă nu mai înțelegi cuvintele, muzica e prea tare: o dai mai încet, nu ștergi vocea și nu o dai pe ea mai tare până se strică.</p>`,
   exemplu:`<p class="umlbl"><b>Vocea</b>, tare</p>${unda('bun',{vol:9})}<p class="umlbl"><b>Muzica</b>, mult mai încet</p>${unda('muzica',{vol:3})}`,
   altfel:`<p>E ca la o petrecere: dacă muzica e dată la maximum, nu-l mai auzi pe cel de lângă tine. Nu îl pui să țipe, ci dai muzica mai încet.</p>`,
   incearca:{t:'choice',q:'În interviul tău, muzica de fundal acoperă vocea. Ce reglezi?',o:['Scazi volumul pistei cu muzică','Mărești volumul muzicii','Ștergi pista cu vocea','Pui fade in pe voce'],ok:0,ajutor:'Care pistă trebuie să stea în fundal?',why:'Vocea duce mesajul, muzica e decorul. Scazi muzica până se înțeleg clar cuvintele.'},
   inca:[
    {t:'tf',q:'Într-un interviu, muzica de fundal trebuie să fie la fel de tare ca vocea, ca să se audă amândouă.',ok:false,ajutor:'Regula de bază din pas.',why:'Fals. Muzica stă mult mai încet decât vocea; altfel acoperă cuvintele.'}
   ]},
  {t:'Fade in și fade out',
   text:`<p><mark>Fade in</mark>: sunetul pornește din liniște și crește treptat. <mark>Fade out</mark>: sunetul scade treptat, până la liniște.</p>
<p>O muzică oprită brusc, în mijlocul unei note, sună tăiat. Cu un fade out la final, sună îngrijit. În Audacity:</p>
<ol><li>selectezi ultimele câteva secunde ale muzicii;</li>
<li>deschizi meniul <strong>Efect → Atenuare</strong>;</li>
<li>alegi <strong>Fade Out</strong> (sau <strong>Fade In</strong> pentru început).</li></ol>
<p>Fade-ul se pune pe muzică, nu pe voce: ai estompa chiar cuvintele.</p>
${FIG.fade}`,
   exemplu:`<p class="umlbl"><b>Fade in</b> la început</p>${unda('muzica',{fin:true})}<p class="umlbl"><b>Fade out</b> la final</p>${unda('muzica',{fout:true})}`,
   incearca:{t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['Mixare','Combini mai multe piste într-un sunet echilibrat'],['Fade in','Sunetul crește treptat, pornind din liniște'],['Fade out','Sunetul scade treptat, până la liniște']],ajutor:'In = intră (pornește), out = iese (se termină).',why:'Fade in și fade out sunt oglindite: unul pornește din liniște, celălalt ajunge în liniște.'},
   inca:[
    {t:'choice',q:'Clipul se termină, dar muzica se oprește brusc, în mijlocul unei note. Ce aplici?',o:['Fade out la finalul muzicii','Fade in la începutul muzicii','Tăiere în două la mijlocul clipului','Export în WAV'],ok:0,ajutor:'Vrei ca finalul să scadă lin.',why:'Fade out coboară muzica treptat până la liniște.'},
    {t:'order',q:'Pune fade out pe finalul muzicii, în Audacity.',items:['Selectezi ultimele secunde ale muzicii','Deschizi meniul Efect','Intri la Atenuare','Alegi Fade Out'],ajutor:'Selecția vine întotdeauna prima.',why:'Întâi selectezi bucata, apoi aplici efectul din Efect → Atenuare.'}
   ]},
  {t:'Strategia unui mixaj bun',
   text:`<p>Mixajul se face cu urechea, pas cu pas:</p>
<ol><li><strong>ascultă doar vocea</strong> și pune-o destul de tare, clară;</li>
<li><strong>pune muzica foarte încet</strong>, apoi crește-o puțin câte puțin;</li>
<li>oprește-te când muzica se aude, dar <strong>cuvintele rămân clare</strong>;</li>
<li>pune <strong>fade in</strong> și <strong>fade out</strong> pe muzică;</li>
<li><strong>ascultă tot</strong> de la început, cu atenție la început și la final.</li></ol>`,
   exemplu:`<p>Vocea pe <b>8</b> din 10. Muzica: 1 (nu se aude)… 2… <b>3</b> (se aude în fundal, cuvintele sunt clare) … 5 (acoperă cuvintele: prea mult, înapoi la 3).</p>`,
   incearca:{t:'order',q:'Pune în ordine strategia mixajului.',items:['Asculți doar vocea și o faci clară','Pui muzica foarte încet','Crești muzica puțin câte puțin, cât cuvintele rămân clare','Pui fade in și fade out pe muzică','Asculți tot, de la început'],ajutor:'Vocea întâi, ascultarea finală la sfârșit.',why:'Pornești de la voce, adaugi muzica cu grijă, pui fade-urile și verifici ascultând.'},
   inca:[
    {t:'choice',q:'Ai urcat muzica de la 3 la 5 și acum nu mai înțelegi cuvintele. Ce faci?',o:['O cobori înapoi, cam la 3','O urci la 7','Ștergi vocea','Pui fade out pe voce'],ok:0,ajutor:'Punctul 3 al strategiei.',why:'Te oprești la nivelul la care muzica se aude, dar cuvintele rămân clare.'}
   ]},
  {t:'Muzica pe care ai voie s-o folosești',
   text:`<p>O melodie nu e liberă doar pentru că o găsești pe internet sau o poți descărca gratuit. Folosește piese cu <mark>licență liberă</mark> și citește licența fiecăreia:</p>
<ul><li>unele cer să scrii <strong>numele autorului</strong> (în genericul de final);</li>
<li>cele cu licența <strong>CC0</strong> nu cer nimic: autorul a renunțat la drepturi.</li></ul>
<p>Notează de la început titlul piesei, autorul și licența: îți trebuie la generic.</p>`,
   incearca:{t:'tf',q:'Dacă o melodie se poate descărca gratuit, ai voie s-o folosești în clipul tău oricum vrei.',ok:false,ajutor:'„Gratuit” nu înseamnă „fără reguli”.',why:'Fals. Licența spune ce ai voie: unele piese cer autorul, altele nu pot fi folosite deloc în clipuri.'},
   inca:[
    {t:'choice',q:'Ce înseamnă o piesă cu licența CC0?',o:['O folosești fără să ceri voie; autorul nu e obligatoriu','O poți folosi doar dacă îi plătești autorului','O poți asculta, dar n-o poți pune în clipuri','Trebuie neapărat să scrii autorul în generic'],ok:0,ajutor:'Al doilea punct din listă.',why:'La CC0 autorul a renunțat la drepturi. E frumos să-l menționezi, dar nu ești obligat.'}
   ]}
 ],
 atelier:{t:'mixaj',titlu:'Mixează interviul',
  intro:`<p><strong>Sarcina:</strong> acum muzica e la fel de tare ca vocea și se taie brusc la final. Fă mixajul după strategia din pasul 4.</p>
<ol><li>Vocea: destul de tare (cel puțin 6).</li><li>Muzica: cu cel puțin 3 trepte mai încet decât vocea, dar nu pe 0.</li><li>Pe muzică: <b>Fade out</b>. Pe voce: niciun fade.</li><li>Apasă <b>▶ Ascultă mixajul</b>, apoi <b>Verifică</b>.</li></ol>
<p class="hint">În Audacity, volumul e glisorul din panoul pistei, iar fade-ul se pune din Efect → Atenuare.</p>`,
  q:'Fă vocea clară, muzica încet, cu fade out la final.',
  ajutor:'Vocea pe 8, muzica pe 3, apoi apasă „Fade out” pe pista cu muzică.',
  piste:[{id:'v',nume:'Vocea bibliotecarei',tip:'voce',vol:7},{id:'m',nume:'Muzica de fundal',tip:'muzica',vol:7}],
  fout:['m'],
  why:'Vocea se aude clar, muzica stă în fundal și se stinge lin. Așa sună un interviu îngrijit.',
  inca:[{t:'mixaj',q:'Încă una: podcast cu două voci, muzică și aplauze. Muzica trebuie să pornească lin și să se stingă lin; aplauzele să se audă, dar nu mai tare decât vocile.',
   ajutor:'Vocile pe 8, muzica pe 3 cu Fade in și Fade out, aplauzele pe 5.',
   piste:[{id:'a',nume:'Vocea Anei',tip:'voce',vol:5},{id:'b',nume:'Vocea lui Mihai',tip:'voce',vol:8,fout:true},{id:'m',nume:'Muzica de fundal',tip:'muzica',vol:6},{id:'e',nume:'Aplauze',tip:'efect',vol:0}],
   fin:['m'],fout:['m'],
   why:'Ambele voci sunt clare, muzica e în fundal cu fade in și fade out, iar aplauzele se aud fără să acopere pe nimeni.'}]},
 qs:[
  {t:'choice',q:'În interviul tău, muzica de fundal acoperă vocea. Ce reglezi?',o:['Scazi volumul pistei cu muzică','Mărești volumul muzicii','Ștergi pista cu vocea','Pui fade in pe voce'],ok:0,why:'Vocea duce mesajul, muzica e doar decorul. Scazi muzica până se înțeleg clar cuvintele.'},
  {t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['Mixare','Combini mai multe piste într-un sunet echilibrat'],['Fade in','Sunetul crește treptat, pornind din liniște'],['Fade out','Sunetul scade treptat, până la liniște'],['Glisorul de volum','Face o pistă mai încet sau mai tare']],why:'Fade in și fade out sunt oglindite; glisorul reglează fiecare pistă separat.'},
  {t:'tf',q:'Fade out-ul se pune pe pista cu vocea, ca interviul să se termine lin.',ok:false,ajutor:'Ce s-ar întâmpla cu ultimele cuvinte?',why:'Fals. Pe voce, fade-ul ar estompa chiar cuvintele. Fade-ul se pune pe muzică.'},
  {t:'choice',q:'În ce meniu al Audacity găsești Fade In și Fade Out?',o:['Efect → Atenuare','Fișier → Exportă audio','Editează → Copiază','Setări audio'],ok:0,why:'Estomparea e un efect: Efect → Atenuare → Fade In / Fade Out.'},
  {t:'tf',q:'O melodie care se poate descărca gratuit poate fi folosită în orice clip, fără reguli.',ok:false,why:'Fals. Licența spune ce ai voie. La unele trebuie să scrii autorul, altele nu se pot folosi deloc.'},
  {t:'choice',q:'Ce înseamnă o piesă cu licența CC0?',o:['O folosești fără să ceri voie; autorul nu e obligatoriu','O poți folosi doar dacă îi plătești autorului','O poți asculta, dar n-o poți pune în clipuri','Trebuie neapărat să scrii autorul în generic'],ok:0,why:'La CC0 autorul a renunțat la drepturile lui asupra piesei.'}
 ]},

/* ================= 6. Scene, tranziții, generice (lecțiile 14-15) ================= */
{t:'Scene, tranziții, generice',lectii:[14,15],continuturi:[PROG.tranzitii,PROG.coloana,PROG.generice],
 obiectiv:'legi scenele cu tăieturi simple sau cu tranziții puse cu măsură, pui muzica pe pista ei peste scene și scrii generice care se citesc și spun sursele.',
 pasi:[
  {t:'Scena și tăietura simplă',
   text:`<p>O <mark>scenă</mark> e o bucată de film cu același loc sau aceeași idee: „la intrarea în bibliotecă”, „la raftul cu romane”.</p>
<p>Cel mai simplu mod de a trece de la o scenă la alta e <mark>tăietura simplă</mark>: un clip se termină și următorul începe imediat, lipit de el. Filmele adevărate folosesc cel mai des tăietura simplă.</p>`,
   exemplu:`${miniTL([['video',[['Scena 1: intrarea',6],['Scena 2: raftul',8],['Scena 3: interviul',10]]]])}<p>Trei scene, lipite una de alta: între ele sunt tăieturi simple.</p>`,
   incearca:{t:'choice',q:'Ce este o scenă?',o:['O bucată de film cu același loc sau aceeași idee','Un efect de trecere între două clipuri','Textul de la finalul filmului, cu echipa','O pistă audio cu muzica de fundal'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Scena e o unitate a poveștii: același loc sau aceeași idee.'},
   inca:[
    {t:'tf',q:'La tăietura simplă, clipul următor începe imediat după cel dinainte, fără niciun efect.',ok:true,ajutor:'Recitește al doilea paragraf.',why:'Adevărat. E trecerea cea mai des folosită.'}
   ]},
  {t:'Tranzițiile, cu măsură',
   text:`<p>Între două scene poți pune o <mark>tranziție</mark>: un efect de trecere. Cea mai cunoscută e <strong>dizolvarea</strong>: o imagine trece încet în următoarea (în Clipchamp se numește „Estompare încrucișată”).</p>
<p>În Clipchamp, deschizi panoul <strong>Tranziții</strong> și <strong>tragi</strong> tranziția cu mouse-ul <strong>între două clipuri</strong> de pe linia de timp.</p>
<p>Folosește-le <strong>cu măsură</strong>: un efect diferit la fiecare tăietură obosește privitorul și îi ia atenția de la poveste.</p>
${FIG.tranzitii}`,
   altfel:`<p>Tranzițiile sunt ca semnele de exclamare: unul, la momentul potrivit, atrage atenția. Zece pe rând fac textul obositor.</p>`,
   incearca:{t:'choice',q:'Un coleg a pus șase tranziții diferite într-un clip de un minut. Ce îi recomanzi?',o:['Să folosească tranziții cu măsură sau tăieturi simple','Să mai adauge câteva','Să le mute pe pista audio','Nimic: cu cât mai multe, cu atât mai bine'],ok:0,ajutor:'Ultimul paragraf al pasului.',why:'Prea multe efecte iau atenția de la ce se spune.'},
   inca:[
    {t:'choice',q:'În Clipchamp, unde pui o tranziție?',o:['O tragi între două clipuri de pe linia de timp','O scrii ca text, din panoul Text','O pui pe pista audio, sub muzică','O alegi la export, lângă 1080p'],ok:0,ajutor:'Uită-te la îndrumarea de sus din captură.',why:'Tranziția leagă două clipuri, deci stă între ele pe linia de timp.'}
   ]},
  {t:'Coloana sonoră, pe pista ei',
   text:`<p><mark>Coloana sonoră</mark> e sunetul pus peste montaj: de obicei muzica de fundal. O pui pe o <strong>pistă audio separată</strong>, sub pista video, ca să curgă <strong>peste mai multe scene</strong> la rând.</p>
<p>Avantajul: când tai sau muți o scenă, muzica de pe pista ei nu se taie odată cu scena, iar volumul ei îl reglezi separat.</p>`,
   exemplu:`${miniTL([['video',[['Scena 1',6],['Scena 2',8],['Scena 3',10]]],['audio',[['Coloana sonoră, peste toate scenele',24,'a']]]])}`,
   incearca:{t:'tf',q:'Muzica de fundal care curge peste mai multe scene se pune pe o pistă audio separată.',ok:true,ajutor:'Uită-te la desenul din „Uite cum”.',why:'Adevărat. Pe pista ei, muzica nu se taie odată cu clipurile video, iar volumul i se reglează separat.'},
   inca:[
    {t:'choice',q:'De ce pui coloana sonoră pe pista ei, nu lipită de un clip video?',o:['Ca să curgă peste scene, fără să se taie cu ele','Ca fișierul exportat să ocupe mai puțin loc','Ca muzica să se vadă pe ecran, ca text','Ca exportul să iasă în format WAV'],ok:0,ajutor:'Al doilea paragraf.',why:'Pe pista ei, muzica trece peste tăieturi și are volumul ei.'}
   ]},
  {t:'Genericul de început și de final',
   text:`<p><mark>Genericul</mark> e text <strong>suprapus peste imagine</strong>. În Clipchamp îl faci din panoul <strong>Text</strong>: alegi un stil, îl tragi pe linia de timp și scrii.</p>
<ul><li>la <strong>început</strong>: titlul filmului, eventual tema;</li>

${FIG.text}`,

   inca:[
    {t:'choice',q:'Din ce panou al Clipchamp faci un generic?',o:['Text','Tranziții','Export','Setări audio'],ok:0,ajutor:'Genericul e text peste imagine.',why:'Genericul se face din panoul Text; apare peste imagine în previzualizare.'}
   ]},
  {t:'Un generic care se citește și e corect',
   text:`<p>Verifică genericul în patru pași:</p>
<ol><li><strong>contrast</strong>: textul se deosebește clar de fundal (galben pe fundal închis, nu alb pe cer alb);</li>
<li><strong>fiecare rol are un nume</strong>: „Imagine: Mihai”, nu „Imagine: ???”;</li>
<li><strong>fiecare material are sursa precisă</strong>: titlul piesei, autorul și licența. „De pe internet” nu e o sursă;</li>
<li>textul stă pe ecran <strong>destul cât să fie citit</strong> de două ori.</li></ol>`,
   exemplu:`<p>Generic de final bun:<br><i>Reporter: Ana · Imagine: Mihai · Sunet: Ioana · Montaj: Radu<br>Muzica: „Dimineața în parc”, de Autor Inventat, licență CC0<br>Mulțumim doamnei bibliotecare!</i></p>`,
   incearca:{t:'choice',q:'Titlul alb e pus peste o imagine cu cer alb și nu se citește. Ce faci?',o:['Alegi pentru text o culoare care se deosebește clar de imagine','Micșorezi textul ca să ocupe mai puțin','Adaugi o tranziție înainte de imaginea cu cerul','Muți titlul pe pista audio'],ok:0,ajutor:'Punctul 1 din listă.',why:'Textul se citește când contrastează cu fundalul. Un text mai mic ar fi și mai greu de citit.'},
   inca:[

 ],

/* ================= 7. Interviul clasei (lecția 16, final) ================= */
{t:'Interviul clasei',final:true,lectii:[16],continuturi:[PROG.selectie],
 obiectiv:'planifici, filmezi, montezi și exporți un interviu scurt, de la scenariu până la fișierul .mp4, cu acordul celor filmați.',
 pasi:[
  {t:'Scenariul și echipa',
   text:`<p><strong>Misiunea finală:</strong> echipa ta face un <mark>interviu</mark> scurt cu bibliotecara școlii, despre cartea cea mai citită.</p>
<p>Totul începe cu <mark>scenariul</mark>: întrebările, în ordine, și cine ce face. Rolurile:</p>
<ul><li><strong>reporterul</strong> pune întrebările;</li><li><strong>imaginea</strong>: cine filmează;</li><li><strong>sunetul</strong>: cine ține microfonul și ascultă;</li><li><strong>montajul</strong>: cine pune totul cap la cap în editor.</li></ul>`,
   exemplu:`<p><b>Scenariul:</b> 1. Titlul „Cartea anului”. 2. Întrebare: „Ce carte se citește cel mai mult?” 3. Răspunsul bibliotecarei. 4. Genericul de final.<br><b>Echipa:</b> Ana (reporter), Mihai (imagine), Ioana (sunet), Radu (montaj).</p>`,
   incearca:{t:'match',q:'Leagă fiecare rol de ce face.',pairs:[['Reporterul','Pune întrebările'],['Imaginea','Filmează'],['Sunetul','Ține microfonul și ascultă'],['Montajul','Pune totul cap la cap în editor']],ajutor:'Lista din pas.',why:'Fiecare are o treabă clară, iar scenariul le leagă.'},
   inca:[
    {t:'choice',q:'Ce scrieți ÎNAINTE de a filma?',o:['Scenariul: întrebările în ordine și cine ce face','Genericul de final, cu toate numele','Numele fișierului pe care îl exportați','Nimic, improvizați pe loc ce întrebați'],ok:0,ajutor:'„Totul începe cu…”',why:'Fără scenariu nu știi ce filmezi și în ce ordine.'}
   ]},
  {t:'Acordul, înainte de filmare',
   text:`<p>Chipul și vocea unui om sunt ale lui. Înainte să filmezi:</p>
<ol><li>îi spui persoanei <strong>ce filmezi</strong> și <strong>unde va apărea</strong> clipul (în clasă, pe site-ul școlii);</li>
<li>filmezi <strong>doar dacă e de acord</strong>;</li>
<li>pentru un elev care apare într-un clip ce iese din clasă, e nevoie și de <strong>acordul părinților</strong>.</li></ol>
<p>Dacă cineva se răzgândește, nu folosești filmarea cu el.</p>`,
   incearca:{t:'tf',q:'Poți pune interviul pe site-ul școlii fără să întrebi persoana intervievată, pentru că ați filmat la școală.',ok:false,ajutor:'Punctul 1 din listă.',why:'Fals. O întrebi înainte și îi spui unde va apărea clipul.'},
   inca:[
    {t:'choice',q:'Un coleg apare în clip, iar clipul va fi pus pe site-ul școlii. De al cui acord mai e nevoie?',o:['Al părinților lui','Al vecinului de bancă','Al nimănui','Doar al profesorului de muzică'],ok:0,ajutor:'Punctul 3 din listă.',why:'Pentru un elev care apare într-un clip ce iese din clasă, e nevoie și de acordul părinților.'}
   ]},
  {t:'Filmarea și sunetul',
   text:`<p>La filmare folosești ce ai învățat:</p>
<ul><li>un <strong>loc liniștit</strong>, microfonul cam la o palmă de cel care vorbește;</li>
<li>pornești filmarea cu <strong>2-3 secunde înainte</strong> de întrebare și o oprești cu 2-3 secunde după răspuns: îți lasă loc să tai curat la montaj;</li>
<li>dacă cineva greșește, faceți o <strong>dublă</strong> (încă o filmare a aceleiași bucăți); pe cea ratată o lași deoparte la montaj;</li>
<li>după fiecare dublă, <strong>ascultați</strong> o bucată, ca să vedeți dacă se aude bine.</li></ul>`,
   incearca:{t:'choice',q:'De ce pornești filmarea cu câteva secunde înainte de întrebare?',o:['Ca să ai loc să tai curat la montaj','Ca fișierul să fie mai mare','Ca să nu mai fie nevoie de montaj','Ca să se audă ventilatorul'],ok:0,ajutor:'Al doilea punct.',why:'Secundele în plus le scoți la montaj cu scurtarea de la capete; fără ele, riști să tai din întrebare.'},
   inca:[
    {t:'choice',q:'Reporterul a râs și a uitat întrebarea. Ce faceți?',o:['Faceți o dublă, iar pe cea ratată o lăsați deoparte la montaj','Păstrați-o așa, e amuzantă și merge în film','Ștergeți tot ce ați filmat până atunci','Exportați pe loc ce aveți, fără montaj'],ok:0,ajutor:'Al treilea punct.',why:'O dublă nouă, iar la montaj cea ratată nu intră pe pistă.'}
   ]},
  {t:'Montajul, pas cu pas',
   text:`<p>Montajul are o ordine sigură. Ia-o punct cu punct:</p>
<ol><li><strong>salvează</strong> proiectul de la început, apoi des;</li>
<li>pune clipurile pe linia de timp <strong>în ordinea scenariului</strong>;</li>
<li><strong>lasă deoparte</strong> dublele ratate;</li>
<li><strong>scurtează capetele</strong>: secundele de dinainte și de după;</li>
<li>pune <strong>muzica</strong> pe pista ei, mult mai încet decât vocea, cu fade out;</li>
<li>adaugă <strong>genericele</strong>;</li>
<li><strong>redă tot</strong> de la început, ca un spectator.</li></ol>`,
   incearca:{t:'order',q:'Pune în ordine pașii montajului.',items:['Salvezi proiectul','Pui clipurile pe linia de timp în ordinea scenariului','Scurtezi capetele fiecărui clip','Adaugi genericele','Redai tot de la început, ca un spectator'],ajutor:'Urmează lista din pas: salvarea e prima, redarea e ultima.',why:'Salvezi de la început, așezi clipurile, le cureți capetele, pui genericele și verifici la final.'},
   inca:[
    {t:'order',q:'Pune etapele interviului în ordine.',items:['Scrieți scenariul cu întrebările','Filmați și înregistrați interviul','Montați clipurile pe linia de timp','Exportați clipul final'],ajutor:'Scenariu, filmare, montaj, export.',why:'Fără scenariu nu știi ce filmezi, fără filmare n-ai ce monta, iar exportul vine după montaj.'},
    {t:'choice',q:'Ai terminat montajul. Ce faci înainte de export?',o:['Redai tot de la început, ca un spectator','Ștergi proiectul','Închizi editorul fără să salvezi','Pui câte o tranziție la fiecare tăietură'],ok:0,ajutor:'Punctul 7.',why:'Ultima verificare prinde o tăietură ratată sau o muzică prea tare, înainte să ajungă la alții.'}
   ]},
  {t:'Exportul: MP4 și 1080p',
   text:`<p>La final faci <mark>exportul</mark>, într-un format pe care îl deschide orice calculator sau telefon: de obicei <code>.mp4</code>. În Clipchamp, butonul <strong>Export</strong> e sus, în dreapta.</p>
<p>La export alegi și <mark>rezoluția</mark>, adică din câți pixeli e făcută imaginea:</p>
<ul><li><strong>1080p</strong> = 1920×1080 pixeli: imagine clară, fișier mai mare; e o alegere bună pentru un proiect școlar;</li>
<li><strong>720p</strong> = 1280×720 pixeli: mai puține detalii, fișier mai mic.</li></ul>
${FIG.export}`,
   incearca:{t:'choice',q:'În ce format exporți interviul, ca să-l poată deschide oricine?',o:['MP4','WAV','MP3','Fișierul proiectului'],ok:0,ajutor:'Formatul video din nivelul 3.',why:'MP4 ține imaginea și sunetul împreună și se deschide aproape oriunde.'},
   inca:[
    {t:'choice',q:'Care e diferența dintre un export în 1080p și unul în 720p?',o:['1080p are mai mulți pixeli: imagine mai clară, dar fișier mai mare','720p are mai mulți pixeli, deci imaginea e mai clară','Nu e nicio diferență de imagine, doar de nume','Exportul în 1080p păstrează imaginea, dar pierde sunetul'],ok:0,ajutor:'Compară 1920×1080 cu 1280×720.',why:'Mai mulți pixeli dau mai multe detalii, dar și un fișier mai mare.'}
   ]}
 ],

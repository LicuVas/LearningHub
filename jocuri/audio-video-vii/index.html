<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Reporter</title>
<meta name="description" content="Lecție-joc pentru clasa a VII-a, pas cu pas: linia de timp, proiectul și înregistrarea, formatele audio și video, tăierea, mixajul, tranzițiile, genericele și exportul unui interviu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..900&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#EEEBF3; --paper:#FFFFFF; --paper2:#F4F1F9; --line:#DAD3E6;
  --ink:#1D1728; --ink2:#5F5670; --accent:#6B3FD4; --accentInk:#FFFFFF; --sel:#E6DDFB;
  --mark:#FFD86B; --markInk:#1D1728; --ok:#177245; --okbg:#E1F3E7; --bad:#C0352F; --badbg:#FAE6E4;
  --wave:#0E8C83; --rec:#E5484D;
  --fd:"Unbounded","Segoe UI",system-ui,sans-serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#120F18; --paper:#1B1724; --paper2:#252031; --line:#372F46;
  --ink:#ECE8F3; --ink2:#A89FB8; --accent:#A98BFF; --accentInk:#120F18; --sel:#33285A;
  --mark:#F2CD4E; --markInk:#1D1728; --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
  --wave:#4FD1C5; --rec:#FF6B6F;
}}
:root[data-theme="dark"]{
  --desk:#120F18; --paper:#1B1724; --paper2:#252031; --line:#372F46;
  --ink:#ECE8F3; --ink2:#A89FB8; --accent:#A98BFF; --accentInk:#120F18; --sel:#33285A;
  --mark:#F2CD4E; --markInk:#1D1728; --ok:#5CCB8E; --okbg:#15301F; --bad:#FF7B72; --badbg:#3A1E1D;
  --wave:#4FD1C5; --rec:#FF6B6F;
}
/* tema jocului: fâșia de sus e o linie de timp, cu o pistă video (clipuri), o pistă audio (formă de undă) și cursorul de redare */
.banda{padding:6px 10px}
.tl{position:relative;display:grid;gap:3px}
.tl .pv{display:flex;gap:3px;height:13px}
.tl .pv b{border-radius:2px;background:color-mix(in srgb,var(--accent) 65%,var(--paper));border-left:2px solid var(--accent)}
.tl .pa{display:flex;align-items:center;gap:2px;height:18px;overflow:hidden}
.tl .pa i{flex:1 1 2px;min-width:1px;border-radius:1px;background:var(--wave)}
.tl .ph{position:absolute;top:-6px;bottom:-6px;left:38%;width:2px;background:var(--rec)}
.tl .ph::before{content:"";position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:var(--rec)}
h1{font-weight:800;letter-spacing:-.03em}
h2{font-weight:700;letter-spacing:-.02em}
.recdot{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--rec);margin-right:.22em;vertical-align:.18em;box-shadow:0 0 0 .1em color-mix(in srgb,var(--rec) 30%,transparent)}

/* ilustrațiile din pași: o linie de timp în miniatură și forme de undă desenate */
.xtl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;font-size:.8rem;margin:8px 0}
.xtl>b{font-family:var(--fm);font-size:.72rem;color:var(--ink2);font-weight:600}
.xtl .p{display:flex;gap:3px;min-width:0}
.xtl .p span{min-width:0;padding:4px 6px;border-left:3px solid var(--accent);border-radius:4px;background:color-mix(in srgb,var(--accent) 20%,var(--paper));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xtl .p span.a{border-left-color:var(--wave);background:color-mix(in srgb,var(--wave) 20%,var(--paper))}
.xtl .p span.g{background:transparent;border:1px dashed var(--line);color:var(--ink2)}
.um{display:flex;align-items:center;gap:2px;height:46px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);margin:4px 0}
.um i{flex:1 1 2px;min-width:1px;border-radius:1px;background:var(--wave)}
.um i.cl{background:var(--rec)}
.umlbl{font-size:.85rem;margin:8px 0 0}
.tabel2{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}
.tabel2 th,.tabel2 td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tabel2 th{background:var(--paper2)}

/* simulatorul „montaj”: biblioteca, pista video și panoul clipului selectat */
.mbin{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mclip{border:1px solid var(--line);background:var(--paper2);border-radius:6px;padding:7px 10px;font-size:.92rem;text-align:left;line-height:1.25;overflow-wrap:anywhere}
.mclip:hover{border-color:var(--accent)}
.mclip span{font-family:var(--fm);font-size:.76rem;color:var(--ink2);white-space:nowrap}
.mtrack{display:flex;gap:3px;min-height:52px;padding:6px;border:1px solid var(--line);border-radius:6px;align-items:stretch;
  background:repeating-linear-gradient(90deg,var(--paper2) 0 23px,var(--line) 23px 24px)}
.mtrack .hint{align-self:center}
.mtk{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:3px 5px;border:0;border-left:3px solid var(--accent);border-radius:4px;
  background:color-mix(in srgb,var(--accent) 22%,var(--paper));overflow:hidden;text-align:left;font-size:.74rem;line-height:1.2}
.mtk b{font-family:var(--fm)}
.mtk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mtk.on{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.mpanel{margin-top:12px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper2)}
.msrc{position:relative;height:30px;margin:8px 0;border-radius:4px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.msrc i{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--fm);font-size:.72rem;
  border-right:1px solid var(--line);background:color-mix(in srgb,var(--wave) 16%,transparent)}
.msrc u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 50%,transparent) 0 4px,transparent 4px 8px)}
.mlist{margin:0 0 8px;padding-left:1.4em;font-size:.92rem}
.mlist li{margin:.25em 0}
.mlist li.out{color:var(--ink2);text-decoration:line-through}
.mlist .tc{font-family:var(--fm);font-size:.76rem;color:var(--accent);white-space:nowrap}
.mlist em{font-style:normal;font-family:var(--fm);font-size:.72rem;color:var(--ink2);white-space:nowrap}
.mctl{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.mctl>span:first-child{flex:1 1 9em}
.mctl .stp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mctl button{width:42px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-size:1.2rem;font-weight:700}
.mctl output{font-family:var(--fm);min-width:3.2em;text-align:center}
.mmove{margin-top:8px;gap:6px}

/* simulatorul „inregistrare”: distanța față de microfon, butoanele ▶ ■ ● și pista cu forma de undă */
.rdist{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tog{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 11px;font-size:.9rem;text-align:left}
.tog.on{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.rbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper2)}
.tbtn{width:48px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:1.25rem;font-weight:700;line-height:1}
.tbtn.play{color:var(--ok)}
.tbtn.rec{color:var(--rec)}
.rbar .rst{font-family:var(--fm);font-size:.78rem;color:var(--ink2);flex:1 1 8em}
.rbar .rst.on{color:var(--rec);font-weight:600}
.rtrack{height:74px;margin:10px 0 6px}
.rtrack.gol{justify-content:center;color:var(--ink2);font-size:.85rem}
.rmsg{margin:6px 0;padding:8px 10px;border-radius:6px;background:var(--paper2);font-size:.92rem;min-height:1.4em}

/* simulatorul „mixaj”: câte un rând pe pistă, cu forma de undă, volumul și fade-urile */
.mx-row{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper2);margin-bottom:8px}
.mx-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.mx-top .hint{font-size:.8rem}
.mx-f{display:flex;flex-wrap:wrap;gap:6px}
.mx-play{margin:4px 0 8px}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script>
/* Tipul de întrebare „montaj”: o pistă video simulată.
   Întrebare: {t:'montaj', q, clipuri:[{id, nume, dur (secunde), bucati:[[de_la, până_la, 'ce se vede', 'ok'|'x'], …]}],
               ordine:[id-urile din scenariu, în ordine], pePista?:[id-uri deja puse pe pistă], why}
   Verificarea e pe comportament: se calculează ce ar vedea privitorul (ce clipuri, în ce ordine, ce secunde din fiecare)
   și se cere ca toate bucățile „ok” să fie întregi, iar bucățile „x” să lipsească. Orice tăietură care face asta e bună. */
const JocMontaj=(function(){
  let st=null;
  const byId=(Q,id)=>Q.clipuri.find(c=>c.id===id);
  function taieri(c){
    const oks=c.bucati.filter(b=>b[3]==='ok'),a=Math.min(...oks.map(b=>b[0])),z=Math.max(...oks.map(b=>b[1]));
    let s=0,e=0;
    c.bucati.forEach(b=>{if(b[3]==='x'){if(b[1]<=a)s=Math.max(s,b[1]);if(b[0]>=z)e=Math.max(e,c.dur-b[0])}});
    return {s,e};
  }
  const solutie=Q=>Q.ordine.map(id=>({id,...taieri(byId(Q,id))}));
  function problems(Q,esc){
    const out=[],ids=st.pista.map(p=>p.id);
    if(!ids.length)return ['Pista e goală. Apasă clipurile din bibliotecă ca să le pui pe pistă.'];
    ids.filter(id=>!Q.ordine.includes(id)).forEach(id=>out.push(`„${esc(byId(Q,id).nume)}” nu face parte din scenariu. Scoate-l de pe pistă.`));
    Q.ordine.filter(id=>!ids.includes(id)).forEach(id=>out.push(`Lipsește „${esc(byId(Q,id).nume)}”.`));
    const inScenariu=ids.filter(id=>Q.ordine.includes(id));
    if(inScenariu.length===Q.ordine.length&&inScenariu.some((id,i)=>id!==Q.ordine[i]))out.push('Clipurile nu sunt în ordinea din scenariu.');
    st.pista.forEach(p=>{
      if(!Q.ordine.includes(p.id))return;
      const c=byId(Q,p.id),z=c.dur-p.e;
      c.bucati.forEach(b=>{const inn=Math.min(b[1],z)-Math.max(b[0],p.s);
        if(b[3]==='ok'&&inn<b[1]-b[0])out.push(`În „${esc(c.nume)}” ai tăiat și din partea bună: ${esc(b[2])}.`);
        if(b[3]==='x'&&inn>0)out.push(`În „${esc(c.nume)}” încă rămâne: ${esc(b[2])}.`)});
    });
    return out;
  }
  function render(Q,body,api){
    const esc=api.esc;
    st={pista:(Q.pePista||[]).map(id=>({id,s:0,e:0})),sel:(Q.pePista||[]).length?0:-1};
    function draw(){
      const pe=new Set(st.pista.map(p=>p.id)),bin=Q.clipuri.filter(c=>!pe.has(c.id));
      const total=st.pista.reduce((t,p)=>t+byId(Q,p.id).dur-p.s-p.e,0);
      let h='';
      if(Q.clipuri.length>1)h+=`<div class="lbl">Biblioteca de materiale · apasă un clip ca să-l pui la capătul pistei</div>
        <div class="mbin">${bin.map(c=>`<button type="button" class="mclip" data-add="${c.id}">${esc(c.nume)} <span>${c.dur} s</span></button>`).join('')||'<span class="hint">Toate clipurile sunt pe pistă.</span>'}</div>`;
      h+=`<div class="lbl">Linia de timp · pista video · durata montajului: ${total} s</div>
        <div class="mtrack">${st.pista.map((p,i)=>{const c=byId(Q,p.id),k=c.dur-p.s-p.e;
          return `<button type="button" class="mtk${i===st.sel?' on':''}" data-sel="${i}" style="flex:${k} 1 0" aria-label="Clipul ${i+1}: ${esc(c.nume)}, ${k} secunde"><b>${i+1}</b><span>${esc(c.nume)}</span></button>`}).join('')||'<span class="hint">Pista e goală.</span>'}</div>`;
      const p=st.pista[st.sel];
      if(p){
        const c=byId(Q,p.id),z=c.dur-p.e;
        h+=`<div class="mpanel">
          <div><strong>${st.sel+1}. ${esc(c.nume)}</strong> <span class="hint">· păstrezi secundele ${p.s}–${z} din ${c.dur}</span></div>
          <div class="msrc" aria-hidden="true">${c.bucati.map((b,j)=>`<i style="left:${b[0]/c.dur*100}%;width:${(b[1]-b[0])/c.dur*100}%">${j+1}</i>`).join('')}<u style="left:0;width:${p.s/c.dur*100}%"></u><u style="right:0;width:${p.e/c.dur*100}%"></u></div>
          <ol class="mlist">${c.bucati.map(b=>{const inn=Math.min(b[1],z)-Math.max(b[0],p.s),full=b[1]-b[0];
            return `<li class="${inn<=0?'out':''}"><span class="tc">${b[0]}–${b[1]} s</span> ${esc(b[2])} <em>· ${inn<=0?'tăiat':inn<full?'tăiat pe o parte':'în montaj'}</em></li>`}).join('')}</ol>
          <div class="mctl"><span>Tai de la început</span><span class="stp"><button type="button" data-d="s-" aria-label="Taie cu o secundă mai puțin de la început">−</button><output>${p.s} s</output><button type="button" data-d="s+" aria-label="Taie încă o secundă de la început">+</button></span></div>
          <div class="mctl"><span>Tai de la sfârșit</span><span class="stp"><button type="button" data-d="e-" aria-label="Taie cu o secundă mai puțin de la sfârșit">−</button><output>${p.e} s</output><button type="button" data-d="e+" aria-label="Taie încă o secundă de la sfârșit">+</button></span></div>
          ${Q.clipuri.length>1?`<div class="row mmove">
            <button type="button" class="btn sm" data-m="-1" ${st.sel===0?'disabled':''}>◀ Mai devreme</button>
            <button type="button" class="btn sm" data-m="1" ${st.sel===st.pista.length-1?'disabled':''}>Mai târziu ▶</button>
            <button type="button" class="btn sm ghost" data-rm="1">Scoate de pe pistă</button></div>`:''}
        </div>`;
      }else if(st.pista.length)h+='<p class="hint" style="margin:8px 0 0">Apasă un clip de pe pistă ca să-l tai sau să-l muți.</p>';
      body.innerHTML=h;
      body.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(api.done())return;st.pista.push({id:b.dataset.add,s:0,e:0});st.sel=st.pista.length-1;draw()});
      body.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{st.sel=+b.dataset.sel;draw()});
      body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
        if(api.done())return;const q=st.pista[st.sel],c=byId(Q,q.id),k=b.dataset.d[0];
        if(b.dataset.d[1]==='+'){if(c.dur-q.s-q.e>1)q[k]++}else if(q[k]>0)q[k]--;
        draw()});
      body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
        if(api.done())return;const i=st.sel,j=i+(+b.dataset.m);if(j<0||j>=st.pista.length)return;
        [st.pista[i],st.pista[j]]=[st.pista[j],st.pista[i]];st.sel=j;draw()});
      body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
        if(api.done())return;st.pista.splice(st.sel,1);st.sel=Math.min(st.sel,st.pista.length-1);draw()});
    }
    draw();
    const nav=api.checkButton(()=>{
      const pr=problems(Q,esc);
      if(!pr.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,pr.slice(0,2).join(' ')+(pr.length>2?` (încă ${pr.length-2})`:''));
        api.revealButton(()=>{st.pista=solutie(Q);st.sel=0;draw();nav.innerHTML='';
          api.giveUp('montajul corect e acum pe pistă. Apasă pe fiecare clip ca să vezi ce s-a tăiat.')})}
    });
  }
  function rezolva(Q,body){
    const click=s=>{const b=body.querySelector(s);if(!b)throw new Error('lipsește '+s);b.click()};
    for(let i=st.pista.length-1;i>=0;i--)if(!Q.ordine.includes(st.pista[i].id)){click(`[data-sel="${i}"]`);click('[data-rm]')}
    Q.ordine.forEach(id=>{if(!st.pista.some(p=>p.id===id))click(`[data-add="${id}"]`)});
    Q.ordine.forEach((id,i)=>{let j=st.pista.findIndex(p=>p.id===id);click(`[data-sel="${j}"]`);while(j>i){click('[data-m="-1"]');j--}});
    solutie(Q).forEach((t,i)=>{click(`[data-sel="${i}"]`);
      for(let k=0;k<t.s;k++)click('[data-d="s+"]');
      for(let k=0;k<t.e;k++)click('[data-d="e+"]')});
  }
  /* greșeala tipică a copilului: face montajul, dar uită să taie capătul unui clip
     (sfârșitul ratat rămâne în film). Dacă scenariul nu cere nicio tăietură (doar ordine),
     greșeala tipică e ordinea: primele două clipuri inversate. */
  function gresit(Q,body){
    rezolva(Q,body);
    const click=s=>{const b=body.querySelector(s);if(!b)throw new Error('lipsește '+s);b.click()};
    const sol=solutie(Q),i=sol.findIndex(t=>t.e>0),j=i>=0?i:sol.findIndex(t=>t.s>0);
    if(j<0){
      if(Q.ordine.length<2)throw new Error('JocMontaj: scenariul nu are nicio tăietură de uitat și nicio ordine de încurcat');
      click('[data-sel="0"]');click('[data-m="1"]');return;
    }
    const k=i>=0?'e':'s';
    click(`[data-sel="${j}"]`);
    for(let n=0;n<sol[j][k];n++)click(`[data-d="${k}-"]`);
  }
  return {render,rezolva,gresit,problems};
})();

/* O formă de undă desenată (bare verticale), pentru pași și simulatoare.
   fel: 'bun' (voce la o palmă de microfon), 'plat' (departe de microfon), 'taiat' (lipit de microfon: vârfurile ating marginile),
        'muzica' (sunet continuu), 'efect' (o izbucnire la mijloc). vol 0..10 scalează înălțimea; fin/fout = rampă la capete. */
function undaBare(fel,o){
  o=o||{};const n=o.n||44,vol=o.vol==null?10:o.vol;
  return Array.from({length:n},(_,i)=>{
    let h;
    if(fel==='muzica')h=45+30*Math.abs(Math.sin(i*.6)*Math.cos(i*.21));
    else if(fel==='efect')h=(i>n*.35&&i<n*.65)?50+40*Math.abs(Math.sin(i*2.3)):4;
    else h=20+75*Math.abs(Math.sin(i*1.7)*Math.cos(i*.45));
    if(fel==='plat')h=2+h*.06;
    let cl=false;
    if(fel==='taiat'){h=h*1.9;if(h>=100){h=100;cl=true}}
    h=h*vol/10;
    const r=n*.25;
    if(o.fin&&i<r)h*=i/r;
    if(o.fout&&i>n-1-r)h*=(n-1-i)/r;
    return `<i${cl?' class="cl"':''} style="height:${Math.max(2,Math.round(h))}%"></i>`}).join('');
}
const unda=(fel,o)=>`<div class="um" aria-hidden="true">${undaBare(fel,o)}</div>`;
/* o linie de timp în miniatură: rânduri [eticheta, [[text, secunde, 'a'|'g'?], …]] */
const miniTL=rows=>`<div class="xtl" role="img" aria-label="Linie de timp desenată">${rows.map(([l,cl])=>`<b>${l}</b><div class="p">${cl.map(c=>`<span class="${c[2]||''}" style="flex:${c[1]} 1 0">${c[0]}</span>`).join('')}</div>`).join('')}</div>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../audio-video-vii/img/${f}" target="_blank"><img src="../audio-video-vii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

/* Tipul „inregistrare”: bara de înregistrare din Audacity (▶ ■ ●), simulată.
   Întrebare: {t:'inregistrare', q, start?:{dist:'lipit'|'palma'|'departe'} (o înregistrare deja pe pistă), why}
   Verificarea e pe ce a ieșit: pe pistă e o înregistrare făcută la distanța bună, oprită, și ascultată după. */
const JocInreg=(function(){
  let st=null;
  const DIST={lipit:'Lipit de microfon',palma:'La o palmă de microfon (cam 20 cm)',departe:'În capătul clasei (cam 4 m)'};
  const ASCULTI={lipit:'Asculți: vocea sună spart, hârșâit. Vârfurile undei ating marginile pistei.',
    palma:'Asculți: vocea se aude clar și curat.',
    departe:'Asculți: vocea abia se aude; foșnetul din clasă se aude aproape la fel de tare.'};
  function problems(){
    if(st.rec)return ['Încă înregistrezi: apasă ■ ca să oprești.'];
    if(!st.clip)return ['Pe pistă nu e nicio înregistrare. Alege distanța, apasă ●, vorbește, apoi ■.'];
    if(st.clip.dist==='lipit')return ['Unda atinge marginile pistei: ai stat lipit de microfon și vocea iese spartă. Șterge înregistrarea și refă-o de la o palmă distanță.'];
    if(st.clip.dist==='departe')return ['Unda e aproape plată: ai stat prea departe și microfonul a prins foarte puțin. Șterge înregistrarea și refă-o mai aproape.'];
    if(!st.redat)return ['Înregistrarea arată bine, dar n-ai ascultat-o. Apasă ▶ și ascult-o înainte să spui că e gata.'];
    return [];
  }
  function render(Q,body,api){
    const d0=Q.start&&Q.start.dist;
    st={dist:d0||null,rec:false,recDist:null,clip:d0?{dist:d0}:null,redat:false,msg:d0?'Pe pistă e deja o înregistrare. Ascult-o (▶) și uită-te la formă.':''};
    function draw(){
      body.innerHTML=`<div class="lbl">1 · Cât de departe stai de microfon?</div>
        <div class="rdist">${Object.keys(DIST).map(k=>`<button type="button" class="tog${st.dist===k?' on':''}" data-dist="${k}" aria-pressed="${st.dist===k}">${DIST[k]}</button>`).join('')}</div>
        <div class="lbl">2 · Bara de înregistrare, ca în Audacity</div>
        <div class="rbar">
          <button type="button" class="tbtn play" data-t="play" aria-label="Redă">▶</button>
          <button type="button" class="tbtn" data-t="stop" aria-label="Oprește">■</button>
          <button type="button" class="tbtn rec" data-t="rec" aria-label="Înregistrează">●</button>
          <span class="rst${st.rec?' on':''}">${st.rec?'● se înregistrează…':st.clip?'înregistrare de 20 s pe pistă':'pistă goală'}</span>
        </div>
        <div class="lbl" style="margin-top:10px">3 · Pista</div>
        ${st.clip?`<div class="um rtrack" aria-label="Forma de undă a înregistrării">${undaBare(st.clip.dist==='lipit'?'taiat':st.clip.dist==='departe'?'plat':'bun',{n:48})}</div>
          <button type="button" class="btn sm ghost" data-del="1">Șterge înregistrarea</button>`
          :`<div class="um rtrack gol">${st.rec?'… vorbești; forma de undă apare când oprești …':'nimic înregistrat încă'}</div>`}
        <div class="rmsg" aria-live="polite">${st.msg||'&nbsp;'}</div>`;
      body.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{if(api.done())return;
        if(st.rec){st.msg='Nu te muta în timpul înregistrării: oprește întâi (■).'}else{st.dist=b.dataset.dist;st.msg=''}draw()});
      body.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(api.done())return;const t=b.dataset.t;
        if(t==='rec'){
          if(st.rec)st.msg='Deja înregistrezi.';
          else if(st.clip)st.msg='Pe pistă e deja o înregistrare. Dacă vrei s-o refaci, apasă întâi „Șterge înregistrarea”.';
          else if(!st.dist)st.msg='Întâi alege cât de departe stai de microfon (rândul 1).';
          else{st.rec=true;st.recDist=st.dist;st.msg='Se înregistrează… Vorbește, apoi apasă ■.'}
        }else if(t==='stop'){
          if(st.rec){st.rec=false;st.clip={dist:st.recDist};st.redat=false;st.msg='Oprit. Pe pistă a apărut forma de undă. Acum ascult-o cu ▶.'}
          else st.msg='Nu înregistrezi acum, n-ai ce opri.';
        }else{
          if(st.rec)st.msg='Oprește întâi înregistrarea (■), apoi o asculți.';
          else if(!st.clip)st.msg='Pista e goală: n-ai ce reda.';
          else{st.redat=true;st.msg=ASCULTI[st.clip.dist]}
        }
        draw()});
      body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(api.done())return;st.clip=null;st.redat=false;st.msg='Înregistrarea a fost ștearsă. Pista e goală.';draw()});
    }
    draw();
    const nav=api.checkButton(()=>{
      const pr=problems();
      if(!pr.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,pr[0]);
        api.revealButton(()=>{st={dist:'palma',rec:false,recDist:null,clip:{dist:'palma'},redat:true,msg:ASCULTI.palma};draw();nav.innerHTML='';
          api.giveUp('o palmă distanță de microfon, ● ca să pornești, ■ ca să oprești, ▶ ca să asculți.')})}
    });
  }
  const click=(body,s)=>{const b=body.querySelector(s);if(!b)throw new Error('lipsește '+s);b.click()};
  function rezolva(Q,body){
    if(st.rec)click(body,'[data-t="stop"]');
    if(st.clip)click(body,'[data-del]');
    click(body,'[data-dist="palma"]');click(body,'[data-t="rec"]');click(body,'[data-t="stop"]');click(body,'[data-t="play"]');
  }
  /* greșeala tipică: vorbește din capătul clasei, iar înregistrarea iese aproape plată */
  function gresit(Q,body){
    if(st.rec)click(body,'[data-t="stop"]');
    if(st.clip)click(body,'[data-del]');
    click(body,'[data-dist="departe"]');click(body,'[data-t="rec"]');click(body,'[data-t="stop"]');click(body,'[data-t="play"]');
  }
  return {render,rezolva,gresit,problems};
})();

/* Tipul „mixaj”: pistele unui proiect, fiecare cu volumul ei (0-10) și cu fade in / fade out.
   Întrebare: {t:'mixaj', q, piste:[{id, nume, tip:'voce'|'muzica'|'efect', vol, fin?, fout?}], fin?:[id], fout?:[id], why}
   Verificarea e pe ce se aude: vocea ≥ 6, muzica cu cel puțin 3 trepte sub fiecare voce, nimic pe 0,
   fără fade pe voce, fade in / fade out acolo unde cere scenariul. */
const JocMixaj=(function(){
  let st=null;
  const TIP={voce:'voce',muzica:'muzică de fundal',efect:'efect sonor'};
  function problems(Q,esc){
    const out=[],P=Q.piste,voci=P.filter(p=>p.tip==='voce');
    P.forEach(p=>{const s=st[p.id];
      if(p.tip==='voce'){
        if(s.vol<6)out.push(`„${esc(p.nume)}” e prea încet (volum ${s.vol}): vocea trebuie să se audă clar, pune-o cel puțin pe 6.`);
        if(s.fin||s.fout)out.push(`Pe „${esc(p.nume)}” ai pus fade: ai estompa chiar cuvintele. Fade-ul se pune pe muzică.`);
      }else if(s.vol===0)out.push(`„${esc(p.nume)}” are volumul 0 și nu se mai aude deloc. Las-o încet, dar să se audă.`);
      if(p.tip==='muzica')voci.forEach(v=>{if(st[v.id].vol-s.vol<3)out.push(`„${esc(p.nume)}” acoperă „${esc(v.nume)}”: muzica trebuie să fie cu cel puțin 3 trepte mai încet decât vocea.`)});
      if((Q.fin||[]).includes(p.id)&&!s.fin)out.push(`„${esc(p.nume)}” pornește brusc: pune-i fade in.`);
      if((Q.fout||[]).includes(p.id)&&!s.fout)out.push(`„${esc(p.nume)}” se oprește brusc la final: pune-i fade out.`);
    });
    return out;
  }
  function asculta(Q){
    const P=Q.piste,voci=P.filter(p=>p.tip==='voce'),muz=P.filter(p=>p.tip==='muzica');
    const f=[];
    if(voci.some(v=>st[v.id].vol<6))f.push('Vocea e slabă, trebuie să ciulești urechea.');
    else if(muz.some(m=>voci.some(v=>st[v.id].vol-st[m.id].vol<3)))f.push('Muzica acoperă cuvintele: abia înțelegi ce se spune.');
    else f.push('Vocea se aude clar, iar muzica stă în fundal.');
    muz.forEach(m=>{if(st[m.id].vol===0)f.push('Muzica nu se aude deloc.');
      else{f.push(st[m.id].fin?'Muzica pornește lin.':'Muzica pornește brusc.');f.push(st[m.id].fout?'La final muzica scade lin, până la liniște.':'La final muzica se taie brusc.')}});
    if(voci.some(v=>st[v.id].fin||st[v.id].fout))f.push('Primele sau ultimele cuvinte se aud estompat.');
    return f.join(' ');
  }
  function render(Q,body,api){
    const esc=api.esc;
    st={};Q.piste.forEach(p=>st[p.id]={vol:p.vol,fin:!!p.fin,fout:!!p.fout});
    let msg='';
    function draw(){
      body.innerHTML=Q.piste.map(p=>{const s=st[p.id];
        return `<div class="mx-row"><div class="mx-top"><strong>${esc(p.nume)}</strong><span class="hint">${TIP[p.tip]}</span></div>
          ${unda(p.tip==='voce'?'bun':p.tip,{n:40,vol:s.vol,fin:s.fin,fout:s.fout})}
          <div class="mctl"><span>Volum</span><span class="stp"><button type="button" data-id="${p.id}" data-v="-" aria-label="Mai încet: ${esc(p.nume)}">−</button><output>${s.vol}</output><button type="button" data-id="${p.id}" data-v="+" aria-label="Mai tare: ${esc(p.nume)}">+</button></span></div>
          <div class="mx-f"><button type="button" class="tog${s.fin?' on':''}" data-id="${p.id}" data-f="fin" aria-pressed="${s.fin}">Fade in</button><button type="button" class="tog${s.fout?' on':''}" data-id="${p.id}" data-f="fout" aria-pressed="${s.fout}">Fade out</button></div>
        </div>`}).join('')+`<div class="mx-play"><button type="button" class="btn sm" data-play="1">▶ Ascultă mixajul</button></div><div class="rmsg" aria-live="polite">${msg||'&nbsp;'}</div>`;
      body.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(api.done())return;const s=st[b.dataset.id];
        if(b.dataset.v==='+'){if(s.vol<10)s.vol++}else if(s.vol>0)s.vol--;msg='';draw()});
      body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(api.done())return;const s=st[b.dataset.id];s[b.dataset.f]=!s[b.dataset.f];msg='';draw()});
      body.querySelector('[data-play]').onclick=()=>{msg=asculta(Q);draw()};
    }
    draw();
    const nav=api.checkButton(()=>{
      const pr=problems(Q,esc);
      if(!pr.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,pr.slice(0,2).join(' ')+(pr.length>2?` (încă ${pr.length-2})`:''));
        api.revealButton(()=>{const S=solutie(Q);Object.keys(S).forEach(k=>st[k]=S[k]);msg=asculta(Q);draw();nav.innerHTML='';
          api.giveUp('vocea pe 8, muzica pe 3, efectele pe 5, fade acolo unde cere scenariul.')})}
    });
  }
  function solutie(Q){const o={};Q.piste.forEach(p=>o[p.id]={vol:p.tip==='voce'?8:p.tip==='muzica'?3:5,fin:(Q.fin||[]).includes(p.id),fout:(Q.fout||[]).includes(p.id)});return o}
  const click=(body,s)=>{const b=body.querySelector(s);if(!b)throw new Error('lipsește '+s);b.click()};
  function potriveste(body,id,vol){
    while(st[id].vol<vol)click(body,`[data-id="${id}"][data-v="+"]`);
    while(st[id].vol>vol)click(body,`[data-id="${id}"][data-v="-"]`);
  }
  function rezolva(Q,body){
    const S=solutie(Q);
    Q.piste.forEach(p=>{potriveste(body,p.id,S[p.id].vol);
      ['fin','fout'].forEach(f=>{if(st[p.id][f]!==S[p.id][f])click(body,`[data-id="${p.id}"][data-f="${f}"]`)})});
  }
  /* greșeala tipică: pune muzica la fel de tare ca vocea („să se audă și ea”) */
  function gresit(Q,body){
    rezolva(Q,body);
    const m=Q.piste.find(p=>p.tip==='muzica'),v=Q.piste.find(p=>p.tip==='voce');
    if(!m||!v)throw new Error('JocMixaj: scenariul nu are muzică și voce');
    potriveste(body,m.id,st[v.id].vol);
  }
  return {render,rezolva,gresit,problems};
})();

<script>
/* Tipul de întrebare „pagina”: elevul așază o pagină (orientare, margini, încadrarea imaginii, structura tabelului)
   după o specificație și vede foaia pe loc.
   Întrebare: {t:'pagina', q, why, parti:['orientare','margini','imagine','tabel'], imbinare?:true,
               cere:{orientare?, marg?:[min,max], stangaMaiMare?, incadrare?:[moduri acceptate], incadrareCe?,
                     tabel?:{cap:[...], date:[[...]], titlu?, latCol?:cm}}, start?:{...}}
   Verificare pe COMPORTAMENT: lățimea tabelului (coloane × lățimea unei coloane) se compară cu lățimea foii minus
   marginile alese; rândurile necesare se numără din date + antet + rândul îmbinat; marginile se compară cu intervalul.
   Nu există o soluție memorată: rezolvarea automată CAUTĂ o combinație care trece aceeași verificare,
   iar orice combinație care respectă specificația e acceptată. */
const JocPagina=(function(){
'use strict';
const MARG=[1,1.5,2,2.5,3,3.5];
const INC=[['aliniat','În linie cu textul'],['patrat','Pătrat'],['strans','Strâns'],['susjos','Sus și jos'],['spate','În spatele textului']];
const EFECT={aliniat:'imaginea stă în rând, ca o literă',patrat:'textul curge pe lângă imagine',strans:'textul curge pe lângă imagine, lipit de ea',
  susjos:'textul se oprește deasupra imaginii și continuă dedesubt',spate:'imaginea stă sub text, ca un fundal'};
const fmt=x=>String(Math.round(x*100)/100).replace('.',',');
const latime=o=>o==='peisaj'?29.7:21, inaltime=o=>o==='peisaj'?21:29.7;
const numeInc=k=>INC.find(x=>x[0]===k)[1];
const CSS=`.pg-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 14px}
.pg-sheet{position:relative;background:#FDFBFA;border:1px solid var(--line);box-shadow:0 2px 0 var(--line),0 8px 22px rgba(0,0,0,.08);overflow:hidden;container-type:inline-size}
.pg-sheet.portret{width:min(100%,240px);aspect-ratio:21/29.7}
.pg-sheet.peisaj{width:min(100%,400px);aspect-ratio:29.7/21}
.pg-area{position:absolute;outline:1px dashed #A3174F;display:flex;flex-direction:column;gap:2cqw}
.pg-tt{display:block;height:3.2cqw;width:55%;margin:0 auto .8cqw;background:#3A2E33;border-radius:1px;flex:none}
.pg-ln{display:block;height:1.4cqw;background:#BBAFB4;border-radius:1px;flex:none}
.pg-row{display:flex;align-items:center;gap:1.5cqw}
.pg-row .pg-ln{flex:1 1 auto}
.pg-img{display:block;flex:none;width:32%;aspect-ratio:4/3;border:1px solid #C9A3B3;
  background:radial-gradient(circle at 72% 28%,#F5B83D 0 9%,transparent 10%),linear-gradient(155deg,transparent 52%,#B8436F 53%),linear-gradient(205deg,transparent 58%,#7E2A4E 59%),#F6DCE6}
.pg-img.sm{width:8%;aspect-ratio:1}
.pg-img.wide{width:100%;aspect-ratio:3/1}
.pg-side{display:flex;gap:2.4cqw;align-items:flex-start}
.pg-side.strans{gap:.7cqw}
.pg-col{flex:1;display:flex;flex-direction:column;gap:2cqw;min-width:0}
.pg-back{position:relative}
.pg-img.bg{position:absolute;top:0;bottom:0;left:18%;width:64%;aspect-ratio:auto;opacity:.33}
.pg-back .pg-col{position:relative}
.pg-tb{border-collapse:collapse;table-layout:fixed;font:2cqw/1.15 Arial,"Segoe UI",sans-serif;color:#2A2226;flex:none;align-self:flex-start}
.pg-tb td{border:1px solid #6E5F65;padding:.3cqw .5cqw;overflow:hidden;white-space:nowrap;height:3.4cqw}
.pg-tb td.hd{background:#F1D3DF;font-weight:700}
.pg-tb td.mg{text-align:center;font-weight:700;background:#E7BDD0}
.pg-tb.over{outline:2px solid #D92D20}
.pg-cap{font-family:var(--fm);font-size:.72rem;color:var(--ink2);text-align:center;overflow-wrap:anywhere}
.pg-zoom{width:100%;overflow-x:auto;margin:0 0 14px}
.pg-zt{border-collapse:collapse;width:100%;font-size:.86rem;line-height:1.25}
.pg-zt td{border:1px solid var(--ink2);padding:4px 6px;overflow-wrap:anywhere;min-width:2.2em;height:2em}
.pg-zt td.hd{background:var(--sel);font-weight:700}
.pg-zt td.mg{background:var(--sel);font-weight:700;text-align:center;box-shadow:inset 0 -2px 0 var(--accent)}
.pg-zt tr.gol td{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--paper2) 5px 10px)}
.pg-ctl{display:grid;gap:12px}
.pg-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pg-b{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);font-size:.9rem;line-height:1.2;min-height:38px}
.pg-b.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600}
.pg-step{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.pg-step .pg-b{min-width:38px;font-weight:700}
.pg-step output{font-family:var(--fm);min-width:1.4em;text-align:center;font-weight:600}`;

function parti(Q){return Q.parti||[]}
function arataImbinare(Q){const T=Q.cere.tabel;return parti(Q).includes('tabel')&&!!(Q.imbinare||(T&&T.titlu))}
function init(Q){
  const T=Q.cere.tabel,P=parti(Q);
  const s=Object.assign({or:'portret',ms:2,md:2,inc:'aliniat',r:2,c:2,antet:false,imb:false},Q.start||{});
  if(T&&!P.includes('tabel')){s.c=T.cap.length;s.antet=T.antet!==false;s.imb=!!T.titlu;s.r=T.date.length+(s.antet?1:0)+(s.imb?1:0)}
  if(Q.cere.incadrare&&!P.includes('imagine'))s.inc=Q.cere.incadrare[0];
  return s;
}
function problems(Q,s){
  const C=Q.cere,T=C.tabel,out=[];
  if(C.orientare&&s.or!==C.orientare)out.push(`Specificația cere foaia ${C.orientare==='peisaj'?'culcată (vedere)':'în picioare (portret)'}.`);
  if(C.marg){const[a,b]=C.marg;if(s.ms<a||s.ms>b||s.md<a||s.md>b)out.push(`Marginile trebuie să fie între ${fmt(a)} și ${fmt(b)} cm. Acum ai stânga ${fmt(s.ms)} cm și dreapta ${fmt(s.md)} cm.`)}
  if(C.stangaMaiMare&&!(s.ms>s.md))out.push('Lucrarea se îndosariază: marginea din stânga trebuie să fie mai mare decât cea din dreapta, ca găurile să nu prindă textul.');
  if(T&&T.latCol){const need=s.c*T.latCol,avail=latime(s.or)-s.ms-s.md;
    if(need>avail+1e-9)out.push(`Tabelul are nevoie de ${fmt(need)} cm pe lățime, dar între margini au rămas doar ${fmt(avail)} cm (${fmt(latime(s.or))} − ${fmt(s.ms)} − ${fmt(s.md)}). Nimic nu iese în afara marginilor.`)}
  if(C.incadrare&&!C.incadrare.includes(s.inc))out.push(`Acum ${EFECT[s.inc]}. Specificația cere altceva: ${C.incadrareCe}.`);
  if(T){
    if(s.c!==T.cap.length)out.push(`Fiecare rând are ${T.cap.length} informații (${T.cap.join(', ')}), deci tabelul are nevoie de tot atâtea coloane. Acum are ${s.c}.`);
    if(T.antet!==false&&!s.antet)out.push('Lipsește rândul de antet: fără el, cititorul nu știe ce e în fiecare coloană.');
    if(T.titlu&&!s.imb)out.push(`Titlul „${T.titlu}” trebuie să stea deasupra tuturor coloanelor, pe un rând cu celulele îmbinate.`);
    if(!T.titlu&&s.imb)out.push('Ai îmbinat celulele primului rând, dar tabelul nu are un titlu comun.');
    const need=T.date.length+(s.antet?1:0)+(s.imb?1:0);
    if(s.r<need)out.push(`Nu încap toate datele: ${need-s.r===1?'un rând rămâne':(need-s.r)+' rânduri rămân'} pe dinafară.`);
    else if(s.r>need)out.push(`Tabelul are ${s.r-need===1?'un rând gol':(s.r-need)+' rânduri goale'} la final. Un tabel îngrijit nu are rânduri goale.`);
  }
  return out;
}
function solution(Q){
  const P=parti(Q),b=init(Q),has=k=>P.includes(k),M=[2,2.5,3,1.5,3.5,1];
  const dom={or:has('orientare')?['portret','peisaj']:[b.or],ms:has('margini')?M:[b.ms],md:has('margini')?M:[b.md],
    inc:has('imagine')?INC.map(x=>x[0]):[b.inc],r:has('tabel')?[1,2,3,4,5,6,7,8,9]:[b.r],c:has('tabel')?[1,2,3,4,5,6]:[b.c],
    antet:has('tabel')?[true,false]:[b.antet],imb:arataImbinare(Q)?[false,true]:[b.imb]};
  const keys=Object.keys(dom),s={...b};
  function rec(i){if(i===keys.length)return problems(Q,s).length?null:{...s};
    for(const v of dom[keys[i]]){s[keys[i]]=v;const r=rec(i+1);if(r)return r}return null}
  const sol=rec(0);
  if(!sol)throw new Error('JocPagina: specificația nu are nicio soluție');
  return sol;
}
function describe(Q,s){
  const P=parti(Q),T=Q.cere.tabel,parts=[];
  if(P.includes('orientare'))parts.push(`foaia ${s.or}`);
  if(P.includes('margini'))parts.push(`margini de ${fmt(s.ms)} cm în stânga și ${fmt(s.md)} cm în dreapta`);
  if(P.includes('imagine'))parts.push(`încadrarea „${numeInc(s.inc)}”`);
  if(P.includes('tabel')&&T)parts.push(`tabel cu ${s.r} rânduri și ${s.c} coloane, rând de antet${s.imb?' și primul rând cu celulele îmbinate':''}`);
  return 'o variantă bună e acum pe foaie: '+parts.join('; ')+'.';
}

function render(Q,body,api){
  if(!document.getElementById('tip-pagina-css')){const st=document.createElement('style');st.id='tip-pagina-css';st.textContent=CSS;document.head.appendChild(st)}
  const esc=api.esc,P=parti(Q),has=k=>P.includes(k),T=Q.cere.tabel,s=init(Q);
  const showImg=has('imagine')||!!Q.cere.incadrare;
  function randuri(){
    const rows=[];
    if(s.imb)rows.push({mg:T.titlu||''});
    if(s.antet)rows.push({cells:T.cap,hd:true});
    T.date.forEach(d=>rows.push({cells:d}));
    const shown=rows.slice(0,s.r);
    while(shown.length<s.r)shown.push({cells:[],gol:true});
    return shown;
  }
  function tabel(cls,style){
    return `<table class="${cls}" ${style?`style="${style}"`:''}>${randuri().map(r=>r.mg!==undefined
      ?`<tr><td colspan="${s.c}" class="mg">${esc(r.mg)}</td></tr>`
      :`<tr class="${r.gol?'gol':''}">${Array.from({length:s.c},(_,k)=>`<td class="${r.hd?'hd':''}">${esc(r.cells[k]||'')}</td>`).join('')}</tr>`).join('')}</table>`;
  }
  function foaia(){
    const W=latime(s.or),H=inaltime(s.or),top=2/H*100,left=s.ms/W*100,right=s.md/W*100;
    const ln=w=>`<i class="pg-ln" style="width:${w}%"></i>`,lines=n=>Array.from({length:n},(_,k)=>ln([100,93,97,68][k%4])).join('');
    let c='<i class="pg-tt"></i>';
    if(showImg){
      if(s.inc==='aliniat')c+=`<div class="pg-row">${ln(30)}<b class="pg-img sm"></b>${ln(40)}</div>`+lines(3);
      else if(s.inc==='patrat'||s.inc==='strans')c+=`<div class="pg-side ${s.inc}"><b class="pg-img"></b><div class="pg-col">${lines(4)}</div></div>`+lines(1);
      else if(s.inc==='susjos')c+=lines(1)+'<b class="pg-img wide"></b>'+lines(2);
      else c+=`<div class="pg-back"><b class="pg-img bg"></b><div class="pg-col">${lines(5)}</div></div>`;
    }else c+=lines(3);
    if(T){
      const avail=W-s.ms-s.md,pct=T.latCol?s.c*T.latCol/avail*100:100;
      c+=tabel('pg-tb'+(pct>100.01?' over':''),`width:${pct.toFixed(2)}%`);
    }
    return `<div class="pg-wrap"><div class="pg-sheet ${s.or}" role="img" aria-label="Foaia A4 ${s.or}, cu marginea din stânga de ${fmt(s.ms)} cm și cea din dreapta de ${fmt(s.md)} cm">
      <div class="pg-area" style="top:${top.toFixed(2)}%;bottom:${top.toFixed(2)}%;left:${left.toFixed(2)}%;right:${right.toFixed(2)}%">${c}</div></div>
      <div class="pg-cap">A4 ${s.or} · lățime ${fmt(W)} cm · margini: stânga ${fmt(s.ms)}, dreapta ${fmt(s.md)}${T&&T.latCol?` · loc pentru text: ${fmt(W-s.ms-s.md)} cm`:''}</div></div>`;
  }
  const grp=(label,html)=>`<div><div class="lbl">${label}</div><div class="pg-opts">${html}</div></div>`;
  const btn=(key,val,label)=>`<button type="button" class="pg-b ${s[key]===val?'on':''}" data-${key}="${val}" aria-pressed="${s[key]===val}">${label}</button>`;
  const step=(key,label)=>`<span class="pg-step"><span>${label}</span><button type="button" class="pg-b" data-st="${key}" data-d="-1" aria-label="${label}: unul mai puțin">−</button><output data-val="${key}">${s[key]}</output><button type="button" class="pg-b" data-st="${key}" data-d="1" aria-label="${label}: unul în plus">+</button></span>`;
  const tog=(key,label)=>`<button type="button" class="pg-b ${s[key]?'on':''}" data-tg="${key}" aria-pressed="${s[key]}">${label}: ${s[key]?'da':'nu'}</button>`;
  function draw(){
    body.innerHTML=foaia()
      +(has('tabel')?`<div class="lbl">Tabelul, mărit</div><div class="pg-zoom">${tabel('pg-zt')}</div>`:'')
      +`<div class="pg-ctl">
        ${has('orientare')?grp('Orientarea foii',btn('or','portret','Portret')+btn('or','peisaj','Vedere (peisaj)')):''}
        ${has('margini')?grp('Marginea din stânga (cm)',MARG.map(m=>btn('ms',m,fmt(m))).join(''))+grp('Marginea din dreapta (cm)',MARG.map(m=>btn('md',m,fmt(m))).join('')):''}
        ${has('imagine')?grp('Încadrarea textului față de imagine',INC.map(([k,n])=>btn('inc',k,n)).join('')):''}
        ${has('tabel')?grp('Structura tabelului',step('r','Rânduri')+step('c','Coloane'))+grp('Rânduri speciale',tog('antet','Rând de antet')+(arataImbinare(Q)?tog('imb','Primul rând cu celulele îmbinate'):'')):''}
      </div>`;
    body.querySelectorAll('[data-or]').forEach(b=>b.onclick=()=>{if(api.done())return;s.or=b.dataset.or;draw()});
    body.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{if(api.done())return;s.ms=+b.dataset.ms;draw()});
    body.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{if(api.done())return;s.md=+b.dataset.md;draw()});
    body.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{if(api.done())return;s.inc=b.dataset.inc;draw()});
    body.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{if(api.done())return;const k=b.dataset.st,max=k==='r'?9:6;s[k]=Math.min(max,Math.max(1,s[k]+ +b.dataset.d));draw()});
    body.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{if(api.done())return;const k=b.dataset.tg;s[k]=!s[k];draw()});
  }
  draw();
  const nav=api.checkButton(()=>{
    const pr=problems(Q,s);
    if(!pr.length){nav.innerHTML='';api.resolve(true)}
    else{api.resolve(false,pr.slice(0,2).join(' ')+(pr.length>2?` (mai sunt ${pr.length-2})`:''));
      api.revealButton(()=>{Object.assign(s,solution(Q));draw();nav.innerHTML='';api.giveUp(describe(Q,s))})}
  });
}
function rezolva(Q,body){aplica(Q,body,solution(Q))}
/* greșeala tipică a copilului, pornind de la o foaie altfel corectă: uită să numere rândul de antet/titlu,
   lasă foaia pe portret („orientarea obișnuită”) sau pune margini egale la o lucrare de îndosariat.
   Se alege prima greșeală pe care verificarea chiar o respinge (poarta cere apoi „Nu încă”). */
function gresit(Q,body){
  const sol=solution(Q),P=parti(Q),cand=[];
  if(P.includes('tabel'))cand.push({...sol,r:sol.r-1});
  if(P.includes('orientare'))cand.push({...sol,or:'portret'});
  if(P.includes('margini'))cand.push({...sol,ms:2,md:2},{...sol,ms:1,md:1});
  if(P.includes('imagine'))cand.push({...sol,inc:'patrat'});
  const g=cand.find(s=>problems(Q,s).length);
  if(!g)throw new Error('JocPagina: nu am găsit o greșeală tipică pentru această întrebare');
  aplica(Q,body,g);
}
function aplica(Q,body,sol){
  const P=parti(Q),q=sel=>body.querySelector(sel);
  if(P.includes('orientare'))q(`[data-or="${sol.or}"]`).click();
  if(P.includes('margini')){q(`[data-ms="${sol.ms}"]`).click();q(`[data-md="${sol.md}"]`).click()}
  if(P.includes('imagine'))q(`[data-inc="${sol.inc}"]`).click();
  if(P.includes('tabel')){
    ['r','c'].forEach(k=>{for(let i=0;i<20;i++){const cur=+q(`[data-val="${k}"]`).textContent;if(cur===sol[k])break;q(`[data-st="${k}"][data-d="${cur<sol[k]?1:-1}"]`).click()}});
    ['antet','imb'].forEach(k=>{const t=q(`[data-tg="${k}"]`);if(t&&(t.getAttribute('aria-pressed')==='true')!==sol[k])t.click()});
  }
}
return {render,rezolva,gresit,problems,solution};
})();

/* Acoperirea programei (OMEN 3393/2017, domeniul „Editor de texte”), textul EXACT din curriculum.json.

  {t:'Încadrarea textului: cum stă textul lângă imagine',
   text:`<p><mark>Încadrarea textului</mark> spune cum se așază textul față de imagine. Opțiunile, cu numele din Word:</p>

<li><strong>Pătrat</strong> (Square): textul curge pe lângă imagine, lăsând o margine dreaptă în jurul ei;</li>
<li><strong>Strâns</strong> (Tight): tot pe lângă imagine, dar mai <strong>lipit</strong> de ea;</li>
<li><strong>Printre</strong> (Through): ca la Strâns, dar textul intră și în golurile imaginii;</li>

    {t:'choice',q:'Nu vezi butonul Opțiuni aspect lângă imagine. Ce faci?',o:['Dai clic pe imagine, ca s-o selectezi','Închizi Word-ul și îl deschizi iar','Apeși Enter de câteva ori','Ștergi imaginea și o pui din nou'],ok:0,ajutor:'Când apare butonul?',why:'Butonul apare doar lângă o imagine selectată.'}
   ]},
  {t:'Imaginea ca fundal: textul trebuie să se citească',
   text:`<p>La <strong>În spatele textului</strong>, literele stau chiar peste poză. Dacă poza e închisă la culoare sau plină de detalii, textul <strong>nu se mai citește</strong>.</p>
<p>Regula: pentru fundal alegi o imagine <mark>deschisă</mark> la culoare, iar textul îl pui pe o <strong>zonă liniștită</strong> a ei (cer, perete, fără detalii). Nici literele îngroșate (<strong>aldin</strong>, Bold) nu repară singure un fundal încărcat.</p>`,
   exemplu:`<p>Coperta revistei clasei: un cer albastru-deschis ca fundal și titlul negru pe cer → se citește. Aceeași copertă cu o pădure deasă, verde-închis → titlul se pierde printre frunze.</p>`,
   incearca:{t:'choice',q:'Ai pus o poză în spatele textului, dar textul abia se mai citește. Ce ajută cel mai mult?',o:['O imagine mai deschisă, cu textul pe o zonă liniștită','Textul pus pe aldin, cu imaginea neschimbată','Imaginea mărită, până acoperă toată pagina','Încă o imagine, pusă peste prima'],ok:0,ajutor:'Recitește regula din pas.',why:'Textul se citește când se deosebește clar de ce e sub el. Aldinul singur nu repară un fundal încărcat.'}}
 ],

  inca:[

   {t:'pagina',q:'Încă una: sigla școlii e un fundal discret pe foaia de titlu, sub text.',parti:['imagine'],cere:{incadrare:['spate'],incadrareCe:'sigla stă sub text, ca un fundal'},ajutor:'Fundal = imaginea stă în spatele textului.',why:'„În spatele textului” face din imagine un fundal. Alege o siglă deschisă, ca textul să se citească.'},
   {t:'pagina',q:'Încă una: o iconiță mică de telefon stă în mijlocul frazei „Sună la [telefon] pentru detalii”.',parti:['imagine'],start:{inc:'spate'},cere:{incadrare:['aliniat'],incadrareCe:'iconița stă în rând, ca o literă'},ajutor:'Care încadrare ține imaginea în rând, ca o literă?',why:'„În linie cu textul” ține iconița în rând și se mută odată cu textul.'}

 qs:[

  {t:'match',q:'Leagă încadrarea de ce se întâmplă cu textul.',pairs:[['În linie cu textul','imaginea stă în rând, ca o literă'],['Strâns','textul curge pe lângă imagine, lipit de ea'],['Sus și jos','textul se oprește deasupra și continuă dedesubt'],['În fața textului','imaginea acoperă textul']],ajutor:'Gândește-te la pârâul cu piatra din pasul 3.',why:'Numele spun ce face textul: stă în rând, curge pe lângă, sare peste imagine sau e acoperit de ea.'},

/* ================= 3. Tabelul: rânduri, coloane, antet (lecția 4) ================= */
{t:'Tabelul: rânduri, coloane, antet',lectii:[4],continuturi:[PROG.obiecte],
 obiectiv:'numeri singur câte rânduri și coloane îți trebuie și creezi tabelul în Word.',
 pasi:[
  {t:'Rând, coloană, celulă',
   text:`<p>Un <mark>tabel</mark> e făcut din căsuțe așezate în linii:</p>
<ul><li><strong>rândul</strong> merge în lățime, de la stânga la dreapta (orizontal);</li>
<li><strong>coloana</strong> merge în înălțime, de sus în jos (vertical);</li>
<li><strong>celula</strong> e o singură căsuță, acolo unde un rând se întâlnește cu o coloană. În ea scrii.</li></ul>
${fig('tabel-antet.webp',900,172,'Tabel Word cu trei coloane, marcate cu roșu rândul de antet, un rând, o coloană și o celulă','Un <b>rând</b>, o <b>coloană</b> și o <b>celulă</b>, marcate cu roșu.')}`,
   altfel:`<p>Gândește-te la sala de clasă: <strong>rândul</strong> de bănci e de-a latul clasei, <strong>coloana</strong> (șirul) merge de la catedră spre spate, iar <strong>celula</strong> e o singură bancă.</p>`,
   incearca:{t:'match',q:'Leagă fiecare parte de ce este.',pairs:[['Rând','căsuțe de la stânga la dreapta'],['Coloană','căsuțe de sus în jos'],['Celulă','o singură căsuță']],ajutor:'Rândul e ca rândul dintr-un caiet: de-a latul.',why:'Rândul e orizontal, coloana e verticală, iar celula e locul unde se întâlnesc.'},
   inca:[
    {t:'tf',q:'Coloana unui tabel merge de la stânga la dreapta.',ok:false,ajutor:'Coloanele unei clădiri stau în picioare.',why:'Fals. Coloana merge de sus în jos; rândul merge de la stânga la dreapta.'}
   ]},
  {t:'Câte celule are un tabel',
   text:`<p>Fiecare rând are câte o celulă în fiecare coloană. Deci numărul de celule se află cu o <strong>înmulțire</strong>:</p>
<p><mark>celule = coloane × rânduri</mark></p>
<p>Atenție la greșeala des întâlnită: <strong>adunarea</strong> coloanelor cu rândurile nu numără căsuțele, ci doar liniile.</p>`,
   exemplu:`<p>3 coloane și 4 rânduri: 3 × 4 = <strong>12</strong> celule.</p>${tab([['','',''],['','',''],['','',''],['','','']],{antet:false})}<p>Numără-le cu degetul: 3 pe fiecare rând, 4 rânduri, 12 căsuțe. Nu 3 + 4 = 7.</p>`,
   altfel:`<p>E ca la o cutie de ouă cu 2 rânduri a câte 5 locuri: 2 × 5 = 10 ouă, nu 2 + 5 = 7.</p>`,
   incearca:{t:'choice',q:'Un tabel are 2 coloane și 5 rânduri. Câte celule are?',o:['10','7','25','3'],ok:0,ajutor:'Înmulțești, nu aduni.',why:'2 × 5 = 10. Adunarea 2 + 5 = 7 numără doar liniile, nu căsuțele.'},
   inca:[
    {t:'choice',q:'Un tabel are 4 coloane și 3 rânduri. Câte celule are?',o:['12','7','43','16'],ok:0,ajutor:'coloane × rânduri',why:'4 × 3 = 12 celule.'},
    {t:'choice',q:'Un tabel are 5 coloane și 5 rânduri. Câte celule are?',o:['25','10','55','20'],ok:0,ajutor:'5 × 5',why:'5 × 5 = 25 celule.'}
   ]},
  {t:'Rândul de antet',
   text:`<p>Primul rând al tabelului are un rol special: în el scrii <strong>numele coloanelor</strong> (de exemplu Nume, Clasa, Nota). Acest rând se numește <mark>antetul</mark> tabelului.</p>
<p>Fără antet, cititorul vede doar cifre și nu știe ce înseamnă ele: e nota? e vârsta? e numărul din catalog?</p>
<p>Antetul e <strong>un rând în plus</strong> deasupra datelor. Îl numeri și pe el când faci tabelul.</p>`,
   exemplu:`<p>Fără antet:</p>${tab([['Ana','7A','9'],['Bogdan','7B','8']],{antet:false})}<p>Cu antet (rândul colorat):</p>${tab([['Nume','Clasa','Nota'],['Ana','7A','9'],['Bogdan','7B','8']])}`,
   incearca:{t:'tf',q:'Rândul de antet al unui tabel conține numele coloanelor.',ok:true,ajutor:'Uită-te la rândul colorat din exemplu.',why:'Adevărat. Antetul spune ce e în fiecare coloană.'},
   inca:[
    {t:'choice',q:'Un tabel are 5 elevi și rândul de antet. Câte rânduri are?',o:['6','5','4','10'],ok:0,ajutor:'Antetul e un rând în plus.',why:'Câte un rând pentru fiecare elev (5) plus antetul: 6.'}
   ]},
  {t:'Strategia: cum numeri rândurile și coloanele',
   text:`<p>Înainte să faci tabelul, îl numeri. Patru pași:</p>
<ol><li>Scrie ce afli despre <strong>un singur</strong> lucru (un elev: Nume, Clasa, Nota). Fiecare informație = <strong>o coloană</strong>.</li>
<li>Numără câte lucruri ai (câți elevi). Fiecare = <strong>un rând</strong> de date.</li>
<li>Adaugă <strong>un rând</strong> pentru antet.</li>
<li>Verifică: fiecare informație are coloana ei și fiecare elev rândul lui, fără rânduri goale.</li></ol>`,
   exemplu:`<p>6 elevi, fiecare cu Nume, Clasa și Nota:</p><ol><li>3 informații → <strong>3 coloane</strong>;</li><li>6 elevi → 6 rânduri de date;</li><li>+ 1 antet → <strong>7 rânduri</strong>;</li><li>tabel de 3 coloane × 7 rânduri.</li></ol>`,
   incearca:{t:'choice',q:'Treci în tabel 6 elevi, fiecare cu Nume, Clasa și Nota. Ce tabel alegi, cu tot cu antet?',o:['3 coloane și 7 rânduri','6 coloane și 3 rânduri','3 coloane și 6 rânduri','7 coloane și 3 rânduri'],ok:0,ajutor:'Urmează exemplul: informații → coloane, elevi → rânduri, +1.',why:'O coloană pentru fiecare informație (3) și un rând pentru fiecare elev (6), plus rândul de antet: 7 rânduri.'},
   inca:[
    {t:'choice',q:'Faci lista a 4 cărți, fiecare cu Titlu, Autor, An și Pagini. Ce tabel alegi, cu antet?',o:['4 coloane și 5 rânduri','4 coloane și 4 rânduri','5 coloane și 4 rânduri','8 coloane și 1 rând'],ok:0,ajutor:'Câte informații are o carte? Câte cărți sunt? Plus antetul.',why:'4 informații → 4 coloane; 4 cărți + antet → 5 rânduri.'},
    {t:'choice',q:'Orarul pe o zi: 6 ore, fiecare cu Ora și Materia. Ce tabel alegi, cu antet?',o:['2 coloane și 7 rânduri','6 coloane și 2 rânduri','2 coloane și 6 rânduri','7 coloane și 7 rânduri'],ok:0,ajutor:'Informațiile unei ore sunt Ora și Materia.',why:'2 informații → 2 coloane; 6 ore + antet → 7 rânduri.'}
   ]},
  {t:'Faci tabelul în Word',
   text:`<ol><li>Pui cursorul unde vrei tabelul.</li>
<li><strong>Inserare</strong> (Insert) → <strong>Tabel</strong> (Table).</li>
<li>Treci mouse-ul peste grilă. Sus scrie de exemplu „3x4 Table”: <strong>întâi coloanele</strong> (3), apoi rândurile (4). Dai clic.</li>
<li>Scrii în celule. Treci la celula următoare cu <kbd>Tab</kbd>. Apăsat în <strong>ultima celulă</strong>, <kbd>Tab</kbd> adaugă un rând nou.</li></ol>
${fig('inserare-tabel-grila.webp',1000,521,'Meniul Table din fila Insert cu grila de pătrățele: trei coloane și patru rânduri colorate, eticheta 3x4 Table și tabelul gol apărut în document','Grila: <b>3 coloane × 4 rânduri</b> („3x4 Table”), iar tabelul gol se vede deja în document.')}`,
   incearca:{t:'order',q:'Faci un tabel nou. Pune pașii în ordine.',items:['Pui cursorul unde vrei tabelul','Deschizi Inserare → Tabel','Alegi pe grilă coloanele și rândurile','Scrii în celule, trecând mai departe cu Tab'],ajutor:'Locul întâi, conținutul la final.',why:'Tabelul apare unde e cursorul, deci locul îl alegi primul. Abia după ce tabelul există poți scrie în celulele lui.'},
   inca:[
    {t:'choice',q:'Pe grilă scrie „2x5 Table”. Ce tabel primești?',o:['2 coloane și 5 rânduri','5 coloane și 2 rânduri','2 rânduri și 2 coloane','10 coloane'],ok:0,ajutor:'Primul număr sunt coloanele.',why:'Word scrie întâi coloanele, apoi rândurile: 2 coloane, 5 rânduri.'},
    {t:'tf',q:'Dacă apeși Tab în ultima celulă a tabelului, apare un rând nou.',ok:true,ajutor:'Recitește pasul 4 din listă.',why:'Adevărat. Așa lungești tabelul din mers, când mai ai un elev de trecut.'}
   ]}
 ],
 atelier:{t:'pagina',titlu:'Construiește tabelul',
  intro:`<p>Mai jos e un editor de tabel simplificat, ca grila din Word. <strong>Sarcina:</strong> construiește tabelul concursului de șah. Folosește strategia: câte informații are un elev (coloane), câți elevi sunt (rânduri) și încă un rând pentru antet. Datele le așază jocul, singur; tu vezi pe loc dacă încap.</p>`,
  q:'Tabelul concursului de șah: Nume, Clasa, Puncte pentru Ana, Bogdan, Cristi și Dana.',parti:['tabel'],
  cere:{tabel:{cap:['Nume','Clasa','Puncte'],date:[['Ana','7A','7'],['Bogdan','7B','5'],['Cristi','7A','6'],['Dana','7C','4']]}},
  start:{r:2,c:2},ajutor:'3 informații → 3 coloane. 4 elevi + antet → 5 rânduri. Și pornește „Rând de antet”.',
  why:'Ai numărat din date: câte o coloană pentru fiecare informație, câte un rând pentru fiecare elev și încă un rând pentru antet, fără rânduri goale.',
  inca:[
   {t:'pagina',q:'Încă una: tabelul fructelor de la cantină: Fruct, Preț, Cantitate, Furnizor, pentru mere, pere și prune.',parti:['tabel'],
    cere:{tabel:{cap:['Fruct','Preț','Cantitate','Furnizor'],date:[['mere','3 lei','20 kg','Ferma A'],['pere','4 lei','10 kg','Ferma B'],['prune','5 lei','8 kg','Ferma A']]}},start:{r:2,c:2},ajutor:'4 informații, 3 fructe, plus antet.',why:'4 coloane și 3 + 1 = 4 rânduri.'},
   {t:'pagina',q:'Încă una: orarul de luni: Ora și Materia, pentru 5 ore.',parti:['tabel'],
    cere:{tabel:{cap:['Ora','Materia'],date:[['8','Română'],['9','Matematică'],['10','TIC'],['11','Engleză'],['12','Sport']]}},start:{r:3,c:3},ajutor:'2 informații, 5 ore, plus antet.',why:'2 coloane și 5 + 1 = 6 rânduri.'}
  ]},
 qs:[
  {t:'choice',q:'Un tabel are 4 coloane și 5 rânduri. Câte celule are?'+fig('tabel-antet.webp',900,172,'Tabel în Word cu antet, la care sunt marcate cu roșu un rând întreg, o coloană întreagă și o singură celulă','Un <b>rând</b> merge în lățime, o <b>coloană</b> în înălțime, iar căsuța unde se întâlnesc e o <b>celulă</b>. (Tabelul din poză are alte dimensiuni decât cel din întrebare.)'),o:['20','9','45','16'],ok:0,ajutor:'celule = coloane × rânduri',why:'Numărul de celule e coloane × rânduri: 4 × 5 = 20. Adunarea 4 + 5 = 9 numără doar coloanele și rândurile, nu căsuțele.'},
  {t:'choice',q:'Treci în tabel 8 elevi, fiecare cu Nume și Nota. Ce tabel alegi, cu tot cu antet?',o:['2 coloane și 9 rânduri','8 coloane și 2 rânduri','2 coloane și 8 rânduri','9 coloane și 2 rânduri'],ok:0,ajutor:'Strategia din pasul 4: informații → coloane, elevi → rânduri, plus antet.',why:'O coloană pentru fiecare informație (2) și un rând pentru fiecare elev (8), plus antetul: 9 rânduri.'},
  {t:'order',q:'Faci un tabel nou. Pune pașii în ordine.',items:['Pui cursorul unde vrei tabelul','Deschizi Inserare → Tabel','Alegi numărul de rânduri și de coloane','Scrii în celule, trecând mai departe cu Tab'],why:'Tabelul apare unde e cursorul, deci locul îl alegi primul. Abia după ce tabelul există poți scrie în celulele lui.'},
  {t:'choice',q:'Pe grila de la Inserare → Tabel scrie „4x3 Table”. Câte coloane are tabelul?',o:['4','3','7','12'],ok:0,ajutor:'Word scrie întâi coloanele.',why:'Primul număr sunt coloanele (4), al doilea rândurile (3).'},
  {t:'tf',q:'Ai completat toate celulele tabelului cu cărțile citite și îți mai amintești una. Trebuie să faci un tabel nou, cu un rând în plus.',ok:false,why:'Fals. Pui cursorul în ultima celulă și apeși Tab: apare un rând nou. Tabelul se lungește din mers, fără să-l refaci.'}
 ]},

/* ================= 4. Formatez tabelul (lecția 7) ================= */
{t:'Formatez tabelul',lectii:[7],continuturi:[PROG.formatare],
 obiectiv:'faci un tabel ușor de citit: antet care iese în evidență, linii vizibile, coloane potrivite și un titlu pe rând îmbinat.',
 pasi:[
  {t:'Filele tabelului apar doar când ești în el',
   text:`<p>Dai clic într-o celulă a tabelului. Sus, pe panglică, apar <strong>file noi</strong>, doar pentru tabel. Una dintre ele e <mark>Proiectare tabel</mark> (Table Design).</p>
<p>Pe ea găsești:</p>
<ul><li><strong>Stiluri de tabel</strong> (Table Styles): modele gata făcute, care pun dintr-o dată culori și linii;</li>
<li>bifa <strong>Rând antet</strong> (Header Row), în grupul Opțiuni stil tabel (Table Style Options): face ca primul rând să arate altfel, ca antet.</li></ul>
<p>Clic în afara tabelului: filele dispar.</p>
${fig('proiectare-tabel.webp',208,195,'Trei decupaje din aceeași panglică Word, unul sub altul: fila Table Design încadrată, grupul Table Style Options cu bifa Header Row încadrată și o felie din galeria Table Styles','De sus în jos: fila <b>Proiectare tabel</b> (Table Design), bifa <b>Rând antet</b> (Header Row), galeria <b>Stiluri de tabel</b> (Table Styles).')}`,
   incearca:{t:'tf',q:'Fila Proiectare tabel (Table Design) se vede doar când cursorul e în tabel.',ok:true,ajutor:'Ce se întâmplă când dai clic în afara tabelului?',why:'Adevărat. Filele tabelului apar doar când lucrezi în tabel.'},
   inca:[
    {t:'choice',q:'Vrei să pui dintr-o dată culori și linii frumoase pe tot tabelul. Ce folosești?',o:['Un stil de tabel, din Proiectare tabel','Fila Inserare → Tabel, încă o dată','Tasta Tab în ultima celulă','Fila Fișier (File)'],ok:0,ajutor:'Modele gata făcute...',why:'Stilurile de tabel aplică deodată culorile și liniile.'}
   ]},
  {t:'Antetul iese în evidență, liniile se văd',
   text:`<p>Două reglaje care fac tabelul ușor de citit:</p>
<ol><li><strong>Antetul</strong> se deosebește de date. Selectezi primul rând și îl faci cu litere îngroșate (<strong>aldin</strong>, Bold), centrat sau cu fundal colorat. Cel mai repede: bifa <strong>Rând antet</strong> plus un stil de tabel, de pe fila Proiectare tabel.</li>
<li><mark>Bordurile</mark> sunt liniile tabelului care se văd pe hârtie. Le pui tot de pe fila <strong>Proiectare tabel</strong> (Table Design), cu butonul <strong>Borduri</strong> (Borders) → <strong>Toate bordurile</strong> (All Borders). Tot de acolo le poți îngroșa sau colora.</li></ol>`,
   exemplu:`<p>Înainte: antetul arată ca datele și liniile nu se văd. După: antet colorat, aldin, cu borduri pe toate celulele.</p>${tab([['Nume','Nota'],['Ana','10']])}`,
   incearca:{t:'match',q:'Leagă fiecare problemă a tabelului de reparația ei.',pairs:[['Antetul nu iese în evidență','aldin sau fundal pe primul rând'],['Pe hârtie nu se văd liniile','pui borduri'],['Liniile sunt prea subțiri','le îngroși din Borduri (Borders)']],ajutor:'Fiecare punct din listă rezolvă o problemă.',why:'Fiecare reglaj rezolvă o singură problemă. Dacă știi ce nu merge, știi și ce cauți.'},
   inca:[
    {t:'tf',q:'Bordurile sunt liniile tabelului care se văd pe hârtie.',ok:true,ajutor:'Punctul 2 din listă.',why:'Adevărat. Fără borduri, pe hârtie tabelul arată ca niște cuvinte risipite.'}
   ]},
  {t:'Coloana prea îngustă: tragi de linie',
   text:`<p>Un nume lung se rupe pe două rânduri când coloana e prea îngustă. Lățimea unei coloane o schimbi cu mouse-ul:</p>
<ol><li>Duci mouse-ul pe <strong>linia dintre două coloane</strong>, până cursorul devine o săgeată cu două capete (↔).</li>
<li>Ții apăsat și <strong>tragi</strong> spre dreapta (coloana se lățește) sau spre stânga (se îngustează).</li>
<li>Dai drumul și te uiți: încape numele pe un rând?</li></ol>`,
   exemplu:`<p>„Alexandra-Maria” se rupe pe două rânduri. Tragi spre dreapta linia dintre coloana Nume și coloana Nota: prima coloană se lățește și numele încape pe un singur rând.</p>${tab([['Nume','Nota'],['Alexandra-Maria','10']])}`,
   incearca:{t:'choice',q:'Numele „Alexandra-Maria” se rupe pe două rânduri în prima coloană. Ce faci?',o:['Tragi spre dreapta linia dintre coloane','Pui borduri pe toate celulele','Bifezi Rând antet la tabel','Apeși Tab în ultima celulă'],ok:0,ajutor:'Coloana e prea îngustă. Cum o lățești?',why:'Linia dintre coloane, trasă spre dreapta, lățește prima coloană, iar numele încape pe un rând.'},
   inca:[
    {t:'order',q:'Lățești o coloană. Pune pașii în ordine.',items:['Duci mouse-ul pe linia dintre coloane','Aștepți săgeata cu două capete','Ții apăsat și tragi spre dreapta','Te uiți dacă a încăput textul'],ajutor:'Întâi cursorul trebuie să-și schimbe forma.',why:'Săgeata cu două capete arată că poți trage de linie; la final verifici cu ochii tăi.'}
   ]},
  {t:'Titlul peste toate coloanele: celule îmbinate',
   text:`<p>Un titlu comun, de exemplu „Rezultate”, trebuie să stea <strong>deasupra tuturor coloanelor</strong>, într-o singură căsuță lată. Pentru asta <mark>îmbini celulele</mark> unui rând. Pașii:</p>
<ol><li>Când numeri rândurile, pui <strong>încă un rând sus</strong>, pentru titlu, deasupra antetului.</li>
<li>Selectezi toate celulele acelui rând (tragi cu mouse-ul peste ele).</li>
<li>Clic dreapta → <strong>Îmbinare celule</strong> (Merge Cells).</li>
<li>Scrii titlul și îl centrezi.</li></ol>
${fig('imbinare-celule.webp',660,430,'Primul rând al unui tabel selectat și meniul de clic dreapta cu comanda Merge Cells încadrată','Clic dreapta → <b>Îmbinare celule</b> (Merge Cells).')}`,
   exemplu:`${fig('tabel-imbinat.webp',845,135,'Tabel Word cu titlul Creșterea plantei pe un rând îmbinat, deasupra celor trei coloane','Rezultatul: titlul pe un rând îmbinat, <b>deasupra tuturor coloanelor</b>; dedesubt, rândul de antet.')}<p>Tabelul are acum: rândul cu titlul + rândul de antet + rândurile de date.</p>`,
   altfel:`<p>Gândește-te la un zid din cărămizi: trei cărămizi mici puse una lângă alta, înlocuite cu una singură, lungă. Îmbinarea face din mai multe căsuțe una singură.</p>`,
   incearca:{t:'order',q:'Pui titlul „Rezultate” deasupra tabelului. Pune pașii în ordine.',items:['Adaugi un rând sus, deasupra antetului','Selectezi toate celulele acelui rând','Clic dreapta → Îmbinare celule (Merge Cells)','Scrii titlul și îl centrezi'],ajutor:'Nu poți îmbina celule care încă nu există.',why:'Întâi rândul, apoi selecția, îmbinarea, și abia la final titlul.'},
   inca:[
    {t:'tf',q:'După ce îmbini toate celulele unui rând, acel rând are o singură celulă.',ok:true,ajutor:'Gândește-te la cărămizi.',why:'Adevărat. De aceea numele coloanelor stau pe alt rând, dedesubt.'},
    {t:'choice',q:'Tabelul are un rând de titlu îmbinat, un rând de antet și 3 rânduri de date. Câte rânduri are în total?',o:['5','4','3','6'],ok:0,ajutor:'Adună: titlu + antet + date.',why:'1 + 1 + 3 = 5 rânduri.'}
   ]},
  {t:'Tabelul lung: antetul pe fiecare pagină',
   text:`<p>Un tabel lung trece pe pagina 2 sau 3. Acolo cititorul vede doar cifre și trebuie să dea înapoi ca să afle ce e în coloane.</p>
<p>Soluția: <mark>rândul de antet se repetă</mark> sus, pe fiecare pagină. Pașii:</p>
<ol><li>Pui cursorul în rândul de antet.</li>
<li>Când ești în tabel, lângă Proiectare tabel apare a doua filă a tabelului: <strong>Aspect</strong> (Layout, numită uneori Table Layout). O deschizi.</li>
<li>Apeși <strong>Repetare rânduri antet</strong> (Repeat Header Rows). Numele exact poate diferi puțin de la o versiune la alta: ține mouse-ul pe butoane și citește.</li></ol>`,
   incearca:{t:'choice',q:'Tabelul cu notele are 3 pagini. Pe paginile 2 și 3 nu mai știi ce e în fiecare coloană. Ce reglaj ajută?',o:['Rândul de antet repetat pe fiecare pagină','Un font mai mic, ca tabelul să încapă pe o pagină','Borduri mai groase pe toate celulele tabelului','Coloanele puse în altă ordine, pe lățime'],ok:0,ajutor:'Ce lipsește sus, pe pagina 2?',why:'Rândul de antet repetat pune numele coloanelor sus pe fiecare pagină.'}}
 ],

 qs:[

  {t:'match',q:'Leagă fiecare problemă a tabelului de reparația ei.',pairs:[['Antetul nu iese în evidență','aldin sau fundal pe primul rând'],['Pe hârtie nu se văd liniile','pui borduri'],['Un nume lung nu încape','tragi linia dintre coloane'],['Titlul trebuie să acopere toate coloanele','îmbini celulele'],['Pe pagina 3 nu mai știi ce e în coloane','repeți rândul de antet pe fiecare pagină']],ajutor:'Fiecare reparație e într-un pas.',why:'Fiecare reglaj rezolvă o singură problemă. Dacă știi ce nu merge, știi și ce comandă cauți.'},
  {t:'tf',q:'Dacă îmbini toate celulele primului rând, numele coloanelor pot rămâne tot acolo, fiecare deasupra coloanei lui.',ok:false,ajutor:'Câte celule are rândul după îmbinare?',why:'Fals. După îmbinare, rândul acela are o singură celulă. De aceea titlul comun stă pe un rând separat, deasupra antetului.'},
  {t:'choice',q:'Unde apare fila Proiectare tabel (Table Design)?',o:['Pe panglică, doar când cursorul e în tabel','Mereu, lângă fila Pornire (Home)','Doar în fereastra de tipărire','În meniul de clic dreapta al unei imagini'],ok:0,why:'Filele tabelului apar doar când lucrezi în tabel.'},

 ]},

/* ================= 5. Pagina: orientare și margini (lecția 7) ================= */
{t:'Pagina: orientare și margini',lectii:[7],continuturi:[PROG.formatare,PROG.specificatii],
 obiectiv:'alegi orientarea foii și marginile și calculezi dacă un tabel încape între margini.',
 pasi:[
  {t:'Foaia A4 și orientarea',
   text:`<p>În școală tipărim pe hârtie <strong>A4</strong>: <strong>21 × 29,7 cm</strong>.</p>
<p><mark>Orientarea</mark> spune cum stă foaia:</p>
<ul><li><strong>Portret</strong> (Portrait): foaia în picioare, lată de <strong>21 cm</strong>;</li>
<li><strong>Vedere</strong> (Landscape), adică „peisaj”: foaia culcată, lată de <strong>29,7 cm</strong>.</li></ul>
<p>Textul obișnuit merge pe portret. Ce e lat (un tabel cu multe coloane, un pliant în trei) încape mai bine pe foaia culcată.</p>
${fig('orientare.webp',400,225,'Fila Layout din Word cu butonul Orientation deschis și cele două opțiuni: Portrait și Landscape','<b>Orientare</b> (Orientation): <b>Portret</b> (Portrait) sau <b>Vedere</b> (Landscape).')}`,
   altfel:`<p>Ia o foaie de caiet: ținută în picioare, e îngustă și înaltă (portret, ca un tablou cu un om). Întoarsă pe o parte, e lată (peisaj, ca o fotografie cu munți).</p>`,
   incearca:{t:'tf',q:'Pe orientarea portret, o foaie A4 e lată de 21 cm.',ok:true,ajutor:'Portret = în picioare.',why:'Adevărat. În picioare, latura scurtă (21 cm) e lățimea.'},
   inca:[
    {t:'classify',q:'Pe ce orientare se așază mai bine fiecare document?',cats:['Portret','Vedere'],items:[['Compunere de două pagini',0],['Tabel cu 8 coloane late',1],['Scrisoare către un prieten',0],['Pliant împăturit în trei',1]],ajutor:'Ce e lat merge pe foaia culcată.',why:'Textul obișnuit merge în picioare; ce e lat are nevoie de foaia culcată.'}
   ]},
  {t:'Marginile',
   text:`<p><mark>Marginile</mark> sunt spațiul alb din jurul textului, pe cele patru laturi ale foii. De obicei au <strong>2–2,5 cm</strong>. Nimic din document (text, imagine, tabel) nu iese în afara lor.</p>
<p>O lucrare care se <strong>îndosariază</strong> (se pune în dosar cu găuri) are marginea din <strong>stânga mai mare</strong>, ca găurile să nu prindă textul.</p>
${fig('margini.webp',610,580,'Fila Layout din Word cu butonul Margins deschis: lista de margini gata făcute și Custom Margins jos','<b>Margini</b> (Margins): setul <i>Normal</i> are 2,5 cm pe toate laturile; <b>Margini particularizate</b> (Custom Margins), jos, le lasă să fie scrise exact.')}`,
   incearca:{t:'tf',q:'O lucrare care se îndosariază are nevoie de margine mai mare în dreapta.',ok:false,ajutor:'Pe ce parte a foii sunt găurile dosarului?',why:'Fals. Găurile dosarului se fac pe latura din stânga, deci acolo lași mai mult spațiu alb.'},
   inca:[
    {t:'choice',q:'Care margini sunt potrivite pentru un referat pus în dosar?',o:['Stânga 3 cm, dreapta 2 cm','Stânga 2 cm, dreapta 3 cm','Stânga 0,5 cm, dreapta 0,5 cm','Stânga 2 cm, dreapta 2 cm'],ok:0,ajutor:'Stânga mai mare.',why:'La îndosariere, stânga are mai mult loc pentru găuri.'}
   ]},
  {t:'Strategia: încape tabelul între margini?',
   text:`<p>Un tabel nu are voie să iasă din margini. Ca să afli dacă încape, faci patru pași:</p>
<ol><li>Iei <strong>lățimea foii</strong>: 21 cm (portret) sau 29,7 cm (vedere).</li>
<li>Scazi <strong>marginea din stânga</strong> și <strong>marginea din dreapta</strong>. Ce rămâne e <mark>locul pentru text</mark>.</li>
<li>Calculezi <strong>lățimea tabelului</strong>: coloane × lățimea unei coloane.</li>
<li>Compari: dacă tabelul e mai lat decât locul pentru text, schimbi orientarea sau marginile.</li></ol>`,
   exemplu:`<p>Orar cu 6 coloane de câte 3,5 cm → tabelul are 6 × 3,5 = <strong>21 cm</strong>.</p><ul><li>Portret, margini 2,5 și 2: 21 − 2,5 − 2 = <strong>16,5 cm</strong>. 21 &gt; 16,5 → <strong>nu încape</strong>.</li><li>Vedere, aceleași margini: 29,7 − 2,5 − 2 = <strong>25,2 cm</strong>. 21 &lt; 25,2 → <strong>încape</strong>.</li></ul>`,
   altfel:`<p>E ca atunci când muți un dulap: măsori întâi peretele (foaia), scazi locul de lângă ușă și calorifer (marginile), și abia apoi vezi dacă intră dulapul (tabelul).</p>`,
   incearca:{t:'choice',q:'Foaie portret, margine de 3 cm în stânga și de 2 cm în dreapta. Cât loc rămâne pentru text, pe lățime?',o:['16 cm','21 cm','26 cm','19 cm'],ok:0,ajutor:'21 − 3 − 2',why:'Din lățimea foii scazi amândouă marginile: 21 − 3 − 2 = 16 cm.'},
   inca:[
    {t:'choice',q:'Foaie vedere (29,7 cm), margini de 2,5 cm în ambele părți. Cât loc rămâne pentru text?',o:['24,7 cm','27,2 cm','29,7 cm','16 cm'],ok:0,ajutor:'29,7 − 2,5 − 2,5',why:'29,7 − 2,5 − 2,5 = 24,7 cm.'},
    {t:'choice',q:'Un tabel are 5 coloane de câte 4 cm. Foaia e portret, cu margini de 2 cm. Încape?',o:['Nu: tabelul are 20 cm, locul doar 17 cm','Da: tabelul are 20 cm, foaia are 21 cm','Da: tabelul are 9 cm','Nu: tabelul are 45 cm'],ok:0,ajutor:'Tabel: 5 × 4. Loc: 21 − 2 − 2.',why:'5 × 4 = 20 cm, iar între margini sunt 21 − 2 − 2 = 17 cm. Nu încape: treci pe vedere.'}
   ]},
  {t:'Unde le schimbi în Word',
   text:`<p>Orientarea și marginile stau pe fila <mark>Aspect</mark> (Layout):</p>
<ol><li>Deschizi fila <strong>Aspect</strong> (Layout).</li>
<li>Apeși <strong>Orientare</strong> (Orientation) și alegi Portret sau Vedere.</li>
<li>Apeși <strong>Margini</strong> (Margins). Alegi un set gata făcut sau, jos, <strong>Margini particularizate</strong> (Custom Margins), unde scrii exact câți centimetri vrei pe fiecare latură.</li>
<li>Te uiți la pagină: tabelul și textul stau între margini?</li></ol>`,
   incearca:{t:'choice',q:'Pe ce filă găsești butonul Margini (Margins)?',o:['Aspect (Layout)','Inserare (Insert)','Pornire (Home)','Proiectare tabel (Table Design)'],ok:0,ajutor:'Aceeași filă ca Orientare.',why:'Orientarea și marginile, adică „aspectul” paginii, sunt pe fila Aspect (Layout).'},
   inca:[
    {t:'order',q:'Vrei marginea din stânga de exact 3 cm. Pune pașii în ordine.',items:['Deschizi fila Aspect (Layout)','Apeși Margini (Margins)','Alegi Margini particularizate (Custom Margins)','Scrii 3 cm la marginea din stânga'],ajutor:'Un număr exact se scrie în Margini particularizate.',why:'Fila, butonul, varianta particularizată, apoi valoarea exactă.'}
   ]}
 ],
 atelier:{t:'pagina',titlu:'Pune orarul pe foaie',
  intro:`<p><strong>Sarcina:</strong> orarul clasei are 6 coloane de câte 3,5 cm și se pune în dosarul clasei. Alege orientarea și marginile (între 2 și 3 cm, cu stânga mai mare) astfel încât tabelul să încapă între margini. Sub foaie jocul îți arată locul pentru text; tabelul iese cu roșu când nu încape.</p>`,
  q:'Orientarea și marginile pentru orar.',parti:['orientare','margini'],
  cere:{marg:[2,3],stangaMaiMare:true,tabel:{cap:['Ora','Luni','Marți','Mier.','Joi','Vineri'],date:[['8','Mate','Rom.','TIC','Engl.','Ist.'],['9','Rom.','Mate','Bio.','Fiz.','Mate'],['10','Geo.','Sport','Rom.','Mate','Muz.']],latCol:3.5}},
  start:{or:'portret',ms:2,md:2},ajutor:'Tabelul are 21 cm. Pe portret, între margini rămân sub 21 cm. Și stânga trebuie să fie mai mare.',
  why:'Tabelul are 6 × 3,5 = 21 cm. Pe foaia în picioare nu ajunge niciodată, pe cea culcată ajunge.',
  inca:[
   {t:'pagina',q:'Încă una: un referat pentru dosar, fără tabel lat. Alege marginile între 2 și 3 cm, cu stânga mai mare.',parti:['margini'],cere:{marg:[2,3],stangaMaiMare:true},start:{ms:2,md:2},ajutor:'Stânga mai mare decât dreapta, ambele între 2 și 3.',why:'De exemplu 3 cm în stânga și 2 cm în dreapta: găurile nu prind textul.'},
   {t:'pagina',q:'Încă una: un tabel cu 8 coloane de câte 3 cm, pe o foaie cu margini de 2 cm. Alege orientarea.',parti:['orientare'],cere:{tabel:{cap:['A','B','C','D','E','F','G','H'],date:[['1','2','3','4','5','6','7','8']],latCol:3}},start:{or:'portret',ms:2,md:2},ajutor:'8 × 3 = 24 cm. Cât loc e pe portret? Dar pe vedere?',why:'Pe portret sunt 17 cm, pe vedere 25,7 cm; 24 cm încap doar pe vedere.'}
  ]},
 qs:[
  {t:'tf',q:'Pe orientarea vedere (peisaj), o foaie A4 e lată de 29,7 cm.',ok:true,why:'Adevărat. Culcată, latura lungă (29,7 cm) devine lățimea.'},
  {t:'choice',q:'Foaie portret, margine de 2,5 cm în stânga și de 2 cm în dreapta. Cât loc rămâne pentru text, pe lățime?',o:['16,5 cm','21 cm','18,5 cm','25,2 cm'],ok:0,ajutor:'Scazi amândouă marginile din 21.',why:'21 − 2,5 − 2 = 16,5 cm. Dacă scazi doar una, ieși prea mult.'},
  {t:'classify',q:'Pe ce orientare se așază mai bine fiecare document?',cats:['Portret','Vedere'],items:[['Compunere de două pagini',0],['Tabel cu 8 coloane late',1],['Referat pus în dosar',0],['Pliant împăturit în trei, cu trei coloane',1],['Scrisoare către un prieten',0]],why:'Textul obișnuit se citește ușor pe foaia în picioare. Ce e lat are nevoie de foaia culcată.'},
  {t:'tf',q:'Portofoliul tău va fi prins într-un dosar cu găuri. Marginea din stânga trebuie să fie mai mare decât cea din dreapta.',ok:true,why:'Adevărat. Găurile dosarului se fac pe latura din stânga, deci acolo lași mai mult spațiu alb, ca să nu prindă textul.'},
  {t:'choice',q:'Vrei marginile de exact 2,7 cm. Unde le scrii?',o:['Aspect → Margini → Margini particularizate','Aspect → Margini → setul Normal','Inserare → Tabel → grila de pătrățele','Aspect → Orientare → Vedere'],ok:0,ajutor:'Un număr exact, nu un set gata făcut.',why:'Seturile gata făcute au valori fixe; un număr exact îl scrii în Margini particularizate (Custom Margins).'}
 ]},

/* ================= 6. Antet, subsol și verificarea finală (lecțiile 3, 8) ================= */
{t:'Antet, subsol și verificarea finală',lectii:[3,8],continuturi:[PROG.gestionare,PROG.reguli],
 obiectiv:'numerotezi paginile automat, începi o pagină nouă corect, verifici lucrarea în previzualizare și o salvezi și ca PDF.',
 pasi:[
  {t:'Antetul și subsolul paginii',
   text:`<p><mark>Antetul</mark> e zona de <strong>sus</strong> a paginii, iar <mark>subsolul</mark> e zona de <strong>jos</strong>. Ce scrii acolo se <strong>repetă pe fiecare pagină</strong>: titlul lucrării, numele tău, numărul paginii.</p>
<p>Le găsești pe fila <strong>Inserare</strong> (Insert), în grupul Antet și subsol (Header &amp; Footer): <strong>Antet</strong> (Header), <strong>Subsol</strong> (Footer), <strong>Număr de pagină</strong> (Page Number). Numărul paginii se pune <strong>automat</strong> și se schimbă singur.</p>
<p>Atenție: antetul paginii nu e rândul de antet al unui tabel.</p>
${fig('antet-subsol-inserare.webp',520,140,'Grupul Header & Footer din fila Insert, cu butoanele Header, Footer și Page Number încadrate','<b>Antet</b> (Header), <b>Subsol</b> (Footer), <b>Număr de pagină</b> (Page Number).')}`,
   exemplu:`${fig('antet-subsol-pagina.webp',820,795,'Pagină Word în modul de lucru la antet și subsol: sus antetul cu titlul referatului, jos subsolul cu numărul paginii','Sus <b>antetul</b> (titlul referatului și clasa), jos <b>subsolul</b> cu <b>numărul paginii</b> pus automat.')}`,
   altfel:`<p>E ca ștampila de pe fiecare filă a unui caiet de teme: o pui o dată, iar ea apare pe toate paginile.</p>`,
   incearca:{t:'choice',q:'Unde pui numărul paginii, ca să apară singur pe fiecare pagină?',o:['În antet sau în subsol','Scris de mână, la finalul fiecărei pagini','În primul paragraf al lucrării','Într-un tabel, pe ultima pagină'],ok:0,ajutor:'Ce zone se repetă pe fiecare pagină?',why:'Antetul și subsolul se repetă pe fiecare pagină, iar numărul pus acolo se schimbă singur.'},
   inca:[
    {t:'tf',q:'Antetul paginii și rândul de antet al unui tabel sunt același lucru.',ok:false,ajutor:'Recitește ultima propoziție a pasului.',why:'Fals. Antetul paginii e zona de sus a fiecărei pagini; rândul de antet e primul rând al unui tabel.'}
   ]},
  {t:'Pagină nouă: Ctrl + Enter',
   text:`<p>Vrei ca un capitol să înceapă pe o pagină nouă? Pui cursorul înaintea titlului și apeși <kbd>Ctrl</kbd>+<kbd>Enter</kbd>. Word pune un <mark>sfârșit de pagină</mark> care rămâne la locul lui.</p>
<p>Greșeala des întâlnită: apeși <kbd>Enter</kbd> de multe ori, până „sare” pagina. Rândurile goale se mută de îndată ce adaugi sau ștergi text mai sus, iar titlul ajunge la mijlocul paginii.</p>`,
   exemplu:`<p>Cu 10 Enter-uri: adaugi o propoziție pe pagina 1 → titlul „Capitolul 2” coboară și ajunge al doilea rând pe pagina 2. Cu <kbd>Ctrl</kbd>+<kbd>Enter</kbd>: titlul rămâne primul pe pagina 2, orice ai adăuga mai sus.</p>`,
   incearca:{t:'choice',q:'Capitolul 2 trebuie să înceapă pe o pagină nouă. Ce faci?',o:['Ctrl + Enter înaintea titlului','Enter de multe ori, până sare pagina','Ctrl + S înaintea titlului','Spații până la capătul paginii'],ok:0,ajutor:'Care variantă rămâne la locul ei când adaugi text?',why:'Ctrl + Enter pune un sfârșit de pagină care rămâne la locul lui. Enter-urile goale se mută.'}},
  {t:'Previzualizarea: verifici înainte să tipărești',
   text:`<p>Apeși <kbd>Ctrl</kbd>+<kbd>P</kbd>. În dreapta apare <mark>previzualizarea</mark>: paginile exact cum le va vedea cititorul. Nu consumă hârtie: se vede doar pe ecran.</p>
<p>Strategia de verificare, pagină cu pagină:</p>
<ol><li><strong>Titluri:</strong> a rămas un titlu singur jos, cu textul lui pe pagina următoare?</li>
<li><strong>Pagini aproape goale:</strong> o pagină cu doar două rânduri?</li>
<li><strong>Margini:</strong> iese ceva (tabel, imagine) peste margine?</li>
<li><strong>Numere de pagină:</strong> sunt puse automat, în antet sau subsol?</li></ol>
${fig('previzualizare.webp',1000,697,'Fereastra Print din Word: în stânga setările de imprimare, în dreapta previzualizarea paginii','În dreapta, <b>previzualizarea</b>, cu antet, tabel și numărul paginii.')}`,
   incearca:{t:'tf',q:'Previzualizarea consumă hârtie, așa că e bine s-o folosești cât mai rar.',ok:false,ajutor:'Unde se vede previzualizarea?',why:'Fals. Previzualizarea se vede doar pe ecran și te ajută să prinzi greșelile înainte să tipărești.'},
   inca:[
    {t:'hunt',q:'Previzualizarea arată 2 greșeli de așezare. Apasă pe fiecare, apoi verifică.',src:'Pagina 1: titlul, un paragraf și o poză cu sursa ei. Pagina 2: un tabel care [[iese peste marginea din dreapta|Nimic nu iese din margini: schimbi orientarea sau lățimea coloanelor.]]. Pagina 3: [[un singur rând|O pagină aproape goală se evită.]]. Numerele paginilor sunt în subsol.',indiciu:'Folosește lista de verificare din pas: titluri, pagini goale, margini, numere.',why:'Obiectele stau între margini și nicio pagină nu rămâne aproape goală.'},
    {t:'order',q:'Pune în ordine verificarea din previzualizare, cum e în strategie.',items:['Titluri rămase singure jos','Pagini aproape goale','Ceva ieșit peste margini','Numere de pagină puse automat'],ajutor:'Urmează lista din pas.',why:'O listă fixă te face să nu sari nimic.'}
   ]},
  {t:'Salvezi și faci o copie PDF',
   text:`<p>La final:</p>
<ul><li><kbd>Ctrl</kbd>+<kbd>S</kbd> <strong>salvează</strong> documentul (fișier .docx);</li>
<li><kbd>F12</kbd> deschide <strong>Salvare ca…</strong> (Save As): acolo alegi un alt nume, alt loc sau alt tip de fișier. În lista cu tipul fișierului (Save as type) alegi <strong>PDF</strong>.</li></ul>
<p>Un <mark>PDF</mark> arată la fel pe orice calculator sau telefon, chiar dacă acolo nu e Word. E bun de trimis profesorului.</p>`,
   incearca:{t:'match',q:'Leagă scurtătura de ce face.',pairs:[['Ctrl + P','previzualizare și tipărire'],['F12','Salvare ca…'],['Ctrl + Enter','pagină nouă'],['Ctrl + S','salvare']],ajutor:'Caută-le în pașii acestui nivel.',why:'Patru scurtături pentru finalul unei lucrări: o împarți pe pagini, o verifici, o salvezi și îi faci o copie în alt format.'},
   inca:[
    {t:'choice',q:'Vrei ca diriginta să vadă lucrarea exact cum arată, chiar dacă nu are Word. Ce îi trimiți?',o:['O copie PDF','Documentul nesalvat','O fotografie a ecranului făcută cu telefonul','Doar titlul lucrării'],ok:0,ajutor:'Ce format arată la fel pe orice calculator?',why:'PDF-ul păstrează aspectul pe orice calculator sau telefon.'}
   ]}
 ],
 atelier:{t:'hunt',titlu:'Verifică referatul lui Radu',
  intro:`<p>Ai în față descrierea previzualizării (<kbd>Ctrl</kbd>+<kbd>P</kbd>) pentru referatul lui Radu. <strong>Sarcina:</strong> folosește lista de verificare (titluri, pagini goale, margini, numere de pagină) și apasă pe fiecare greșeală. Sunt 4.</p>${fig('previzualizare.webp',1000,697,'Fereastra Print din Word: în stânga setările de imprimare, în dreapta previzualizarea paginii','Așa arată previzualizarea în Word.')}`,
  q:'Previzualizarea referatului lui Radu arată 4 greșeli de așezare. Apasă pe fiecare, apoi verifică.',
  src:'Pagina 1: titlul și primele două paragrafe. Jos, pe pagina 1, [[titlul „Concluzii” rămas singur|Un titlu nu rămâne singur la baza paginii, cu textul lui pe pagina următoare.]]. Pagina 2: concluziile și o fotografie cu legenda și sursa ei. Pagina 3: [[doar două rânduri|O pagină cu două rânduri se evită: strângi textul sau refaci așezarea.]]. Numerele paginilor sunt [[scrise de mână la finalul textului|Numerotarea se pune automat, în antet sau în subsol.]]. Marginile au 2,5 cm în stânga și 2 cm în dreapta. Pe pagina 2, un tabel [[iese peste marginea din dreapta|Nimic nu iese în afara marginilor.]].',
  indiciu:'Treci prin lista din pasul 3: titluri, pagini aproape goale, margini, numere de pagină.',
  ajutor:'O greșeală pentru fiecare punct din lista de verificare.',
  why:'O pagină bine așezată nu are titluri rămase singure, pagini aproape goale sau obiecte ieșite din margini, iar numerele paginilor sunt puse automat.',
  inca:[
   {t:'hunt',q:'Încă una: previzualizarea referatului Mariei arată 3 greșeli.',src:'Pagina 1: [[titlul „Capitolul 2” rămas singur jos|Capitolul nou începe pe pagină nouă, cu Ctrl + Enter.]]. Pagina 2: textul capitolului și o imagine care [[trece peste marginea din stânga|Imaginea se micșorează din colț până încape între margini.]]. Numărul paginii e în subsol, pe fiecare pagină. Pagina 3: [[un singur rând, „Mulțumesc!”|O pagină aproape goală se evită.]].',indiciu:'Aceeași listă: titluri, margini, pagini goale, numere.',why:'Trei greșeli din listă: titlu singur, obiect peste margine, pagină aproape goală. Numerele erau bune.'}
  ]},
 qs:[
  {t:'choice',q:'Unde pui numărul paginii, ca să se schimbe singur când adaugi pagini?',o:['În subsol, cu Număr de pagină (Page Number)','Scris de mână, jos pe fiecare pagină','În rândul de antet al tabelului','În titlul lucrării'],ok:0,ajutor:'Fila Inserare, grupul Antet și subsol.',why:'Numărul pus automat în antet sau subsol se schimbă singur; cel scris de mână ajunge în alt loc când adaugi text.'},
  {t:'choice',q:'Capitolul 3 trebuie să înceapă sus, pe o pagină nouă, și să rămână acolo. Ce apeși înaintea titlului?',o:['Ctrl + Enter','Enter de 15 ori','Ctrl + P','Tab'],ok:0,why:'Ctrl + Enter pune un sfârșit de pagină care rămâne la locul lui. Enter-urile goale se mută de îndată ce adaugi sau ștergi text mai sus.'},
  {t:'tf',q:'Poți deschide previzualizarea de zece ori la rând fără să consumi nicio foaie de hârtie.',ok:true,why:'Adevărat. Previzualizarea se vede doar pe ecran. E cea mai ieftină economie de hârtie, fiindcă prinzi greșelile înainte să tipărești.'},
  {t:'classify',q:'În previzualizare: e bine sau trebuie reparat?',cats:['E bine','De reparat'],items:[['Numărul paginii în subsol, pe fiecare pagină',0],['Un titlu singur la baza paginii',1],['Tabel ieșit peste margine',1],['Pagina 4 cu un singur rând',1],['Poza cu sursa scrisă sub ea',0]],ajutor:'Folosește lista de verificare din pasul 3.',why:'Titlurile singure, obiectele peste margini și paginile aproape goale se repară înainte de tipărire.'},
  {t:'match',q:'Leagă ce vrei să faci de scurtătura potrivită.',pairs:[['Capitolul nou începe sus, pe altă pagină','Ctrl + Enter'],['Vrei și o copie PDF a lucrării','F12'],['Verifici paginile înainte de tipărire','Ctrl + P'],['Păstrezi ce ai lucrat în document','Ctrl + S']],why:'Patru scurtături pentru finalul unei lucrări: o împarți pe pagini, o verifici, o salvezi și îi faci o copie în alt format.'}
 ]},

/* ================= 7. Diploma după specificații (lecția 9) — nivelul final ================= */
{t:'Diploma după specificații',final:true,lectii:[9],continuturi:[PROG.specificatii,PROG.formatare],
 obiectiv:'faci un document după o specificație și îl verifici punct cu punct.',
 pasi:[
  {t:'Ce e o specificație',
   text:`<p>O <mark>specificație</mark> e lista de cerințe pe care trebuie să le respecte un document: pagina, fontul, imaginea, tabelul. Fiecare cerință se poate <strong>verifica</strong>: e sau nu e așa.</p>
<p>Misiunea finală: diploma pentru „Concursul de lectură”. Specificația ei:</p>
<ul><li>foaie A4, cu orientarea în care încape tabelul;</li>
<li>marginile din stânga și din dreapta între 2 și 3 cm;</li>
<li>numele premiantului cu <strong>28 pt</strong>, aldin, centrat;</li>
<li>sigla școlii ca <strong>fundal discret</strong>, în spatele textului;</li>
<li>un tabel: 4 coloane de câte 5,5 cm (Proba, Data, Punctaj, Premiul), rând de antet și titlul „Rezultate” pe un rând cu celulele îmbinate.</li></ul>`,
   exemplu:`${fig('diploma-model.webp',940,672,'Diplomă-model în Word, pe foaie culcată, cu numele premiantei mare și centrat, sigla palidă în spatele textului și un tabel cu titlu îmbinat','Diploma-model: foaie <b>A4 culcată</b> (Vedere), numele la <b>28 pt</b> aldin și centrat, sigla <b>în spatele textului</b>, tabelul cu titlul pe un rând îmbinat.')}`,
   altfel:`<p>E ca o rețetă de prăjitură: „200 g făină, 2 ouă, 30 de minute la cuptor”. Nu scrie „cam multă făină”, ci exact cât. Specificația îți spune exact cum trebuie să arate documentul.</p>`,
   incearca:{t:'tf',q:'„Numele cu 28 pt, aldin, centrat” este o cerință care se poate verifica.',ok:true,ajutor:'Poți spune sigur „da” sau „nu”?',why:'Adevărat. Te uiți la mărimea fontului, la aldin și la aliniere: fiecare e sau nu e așa.'},
   inca:[
    {t:'choice',q:'Care dintre acestea e o cerință bună de specificație?',o:['Marginile între 2 și 3 cm','Pagina să arate frumos','Tabelul să nu fie prea mare','Poza să fie cam la mijloc'],ok:0,ajutor:'Care se poate măsura?',why:'O cerință bună se poate măsura. „Frumos” sau „cam la mijloc” nu se pot verifica.'}
   ]},
  {t:'Strategia: lucrezi în ordine și bifezi',
   text:`<p>Cum faci un document după specificație, fără să sari nimic:</p>
<ol><li><strong>Citești toată specificația</strong> și o transformi într-o listă de bifat.</li>
<li><strong>Pagina întâi</strong>: orientarea și marginile. Ele decid cât loc ai pentru tot restul.</li>
<li><strong>Textul</strong>: scrii și formatezi (mărimea fontului, aldin, aliniere).</li>
<li><strong>Imaginea</strong>: o inserezi, o mărești din colț, alegi încadrarea.</li>
<li><strong>Tabelul</strong>: numeri, îl inserezi, îmbini titlul, verifici că încape.</li>
<li><strong>Previzualizare</strong> cu <kbd>Ctrl</kbd>+<kbd>P</kbd> și bifezi punct cu punct.</li></ol>`,
   altfel:`<p>La construirea unei case pui întâi fundația (pagina), apoi zidurile (textul) și abia la final mobila (imaginea și tabelul). Dacă schimbi fundația la final, se mută tot.</p>`,
   incearca:{t:'order',q:'Pune în ordine lucrul la diplomă.',items:['Citești specificația și faci lista de bifat','Alegi orientarea și marginile','Scrii și formatezi textul','Pui imaginea și tabelul','Verifici în previzualizare, punct cu punct'],ajutor:'Pagina e fundația.',why:'Pagina decide locul pentru tot restul, deci vine prima; verificarea vine la final.'},
   inca:[
    {t:'choice',q:'De ce alegi orientarea și marginile ÎNAINTE de tabel?',o:['Ele decid cât loc ai pentru tabel','Așa cere Word, altfel nu merge','Tabelul nu se poate face pe portret','Marginile se pot alege doar la început'],ok:0,ajutor:'Gândește-te la strategia de la nivelul 5: loc pentru text.',why:'Locul pentru text = lățimea foii minus marginile. Tabelul trebuie să încapă în el.'}
   ]},
  {t:'Calculul care decide orientarea',
   text:`<p>Aplici strategia de la nivelul „Pagina”:</p>
<ol><li>Lățimea tabelului: 4 coloane × 5,5 cm = <strong>22 cm</strong>.</li>
<li>Pe <strong>portret</strong> foaia are doar 21 cm. Chiar fără margini, 22 cm nu încap.</li>
<li>Pe <strong>vedere</strong>, cu margini de 2,5 cm: 29,7 − 2,5 − 2,5 = <strong>24,7 cm</strong>. 22 cm încap.</li></ol>
<p>Concluzia: diploma se face pe foaia <mark>culcată</mark> (Vedere / Landscape).</p>`,
   incearca:{t:'choice',q:'Tabelul diplomei are 4 coloane de câte 5,5 cm, adică 22 cm. Ce orientare alegi?',o:['Vedere, fiindcă foaia culcată are 29,7 cm','Portret, fiindcă e orientarea obișnuită','Portret, cu marginile puse la 1 cm','Portret, cu textul scris mai mărunt'],ok:0,ajutor:'Cât de lată e foaia portret, fără nicio margine?',why:'Foaia în picioare are doar 21 cm, deci 22 cm nu încap nici fără margini.'},
   inca:[
    {t:'choice',q:'Pe vedere, cu margini de 3 cm în stânga și 2 cm în dreapta, încape tabelul de 22 cm?',o:['Da, rămân 24,7 cm','Nu, rămân doar 16 cm','Da, rămân 29,7 cm','Nu, rămân 21 cm'],ok:0,ajutor:'29,7 − 3 − 2',why:'29,7 − 3 − 2 = 24,7 cm, mai mult decât 22 cm.'}
   ]},
  {t:'Numele la 28 pt și sigla ca fundal',
   text:`<p><strong>Numele premiantului:</strong> îl selectezi, apoi pe fila <strong>Pornire</strong> (Home), în grupul Font, scrii <strong>28</strong> în caseta cu mărimea fontului, apeși butonul <strong>Aldin</strong> (Bold) și butonul de centrare din grupul Paragraf (Paragraph).</p>
<p><strong>Sigla:</strong> o inserezi din <strong>Inserare → Imagini</strong>, o mărești <strong>din colț</strong> și alegi încadrarea <strong>În spatele textului</strong> (Behind Text). Ca să fie <mark>discretă</mark>, folosești o siglă deschisă la culoare, cu numele pus pe o zonă liniștită a ei.</p>`,
   incearca:{t:'classify',q:'Respectă specificația diplomei sau nu?',cats:['Respectă','Nu respectă'],items:[['Numele cu 28 pt, aldin, centrat',0],['Numele cu 14 pt',1],['Sigla în spatele textului, deschisă la culoare',0],['Sigla mărită din mijlocul laturii, turtită',1]],ajutor:'Compară fiecare rând cu specificația din pasul 1.',why:'Tot ce diferă de specificație (alt font, imagine deformată) înseamnă „nu respectă”.'}}
 ],
 atelier:{t:'pagina',titlu:'Așază diploma',
  intro:`<p><strong>Sarcina:</strong> așază diploma după specificație: orientarea, marginile (2–3 cm), încadrarea siglei (fundal discret, sub text) și tabelul cu rezultatele (4 coloane, antet, titlul „Rezultate” pe rând îmbinat). Lucrează în ordinea din strategie: întâi pagina, apoi imaginea, apoi tabelul. Apoi verifică.</p>`,
  q:'Diploma „Concursul de lectură”, după specificație.',
  parti:['orientare','margini','imagine','tabel'],
  cere:{marg:[2,3],incadrare:['spate'],incadrareCe:'sigla e un fundal discret, așezat sub text',

  start:{or:'portret',ms:2,md:2,inc:'aliniat',r:2,c:2},
  ajutor:'Vedere; margini între 2 și 3; În spatele textului; 4 coloane, 5 rânduri (titlu + antet + 3), antet și rând îmbinat pornite.',
  why:'Ai bifat fiecare punct: tabelul încape între margini, marginile sunt în interval, sigla e fundal și rândurile sunt numărate corect.',
  inca:[
   {t:'pagina',q:'Încă una: afișul târgului de carte. Specificație: margini între 2 și 2,5 cm, poza lângă text (textul curge pe lângă ea) și tabelul standurilor: 3 coloane de câte 6 cm (Stand, Clasa, Ora), antet, fără titlu.',
    parti:['orientare','margini','imagine','tabel'],
    cere:{marg:[2,2.5],incadrare:['patrat','strans'],incadrareCe:'textul curge pe lângă poză',tabel:{cap:['Stand','Clasa','Ora'],date:[['Povești','5A','10'],['Benzi desenate','6B','11']],latCol:6}},
    start:{or:'portret',ms:2,md:2,inc:'aliniat',r:2,c:2},ajutor:'Tabel: 3 × 6 = 18 cm. Pe portret rămân cel mult 17 cm.',why:'18 cm încap doar pe foaia culcată; textul curge pe lângă poză la Pătrat sau Strâns; 3 coloane și 3 rânduri.'}
  ]},
 qs:[
  {t:'choice',q:'Un tabel are 4 coloane de câte 5,5 cm. Ce orientare alegi, cu margini de 2 cm?',o:['Vedere: rămân 25,7 cm, tabelul are 22 cm','Portret: rămân 17 cm, tabelul are 22 cm','Portret: e orientarea obișnuită','Vedere: tabelul are 9,5 cm'],ok:0,ajutor:'Tabel: 4 × 5,5. Loc: lățimea foii minus marginile.',why:'4 × 5,5 = 22 cm. Pe portret rămân 21 − 2 − 2 = 17 cm, pe vedere 29,7 − 2 − 2 = 25,7 cm.'},
  {t:'classify',q:'Respectă specificația diplomei sau nu?',cats:['Respectă','Nu respectă'],items:[['Foaie A4 culcată',0],['Marginea din stânga de 1 cm',1],['Sigla în spatele textului, deschisă la culoare',0],['Tabel fără rândul de antet',1],['Titlul „Rezultate” pe un rând cu celulele îmbinate',0],['Sigla mărită din mijlocul laturii, turtită',1],['Numele premiantului scris cu 14 pt',1]],why:'Specificația se bifează punct cu punct. O margine prea mică, un font mai mic decât cel cerut, un antet lipsă sau o imagine deformată înseamnă că documentul nu e gata.'},
  {t:'order',q:'Pune în ordine lucrul după specificație.',items:['Citești specificația și faci lista de bifat','Alegi orientarea și marginile','Scrii și formatezi textul','Pui imaginea și tabelul','Verifici în previzualizare, punct cu punct'],ajutor:'Pagina e fundația.',why:'Pagina decide locul pentru tot restul, iar verificarea încheie lucrul.'},
  {t:'tf',q:'Specificația cere „tabel cu antet”. E respectată și dacă numele coloanelor sunt scrise într-un paragraf, sub tabel.',ok:false,why:'Fals. Antetul e primul rând al tabelului, deasupra datelor. Cititorul trebuie să afle ce e în coloane înainte să citească cifrele.'},
  {t:'choice',q:'Ai terminat diploma și vrei s-o trimiți dirigintei exact cum arată. Ce faci la final?',o:['Salvezi și o copie PDF, cu F12 (Salvare ca…)','Trimiți o fotografie a ecranului, făcută cu telefonul','Închizi documentul fără să-l salvezi','Tipărești direct, fără să te uiți în previzualizare'],ok:0,why:'Un PDF păstrează aspectul pe orice calculator. O fotografie a ecranului iese strâmbă, documentul nesalvat se pierde, iar fără previzualizare nu vezi dacă pagina a ieșit bine.'}
 ]}

/* tema: panoul de diagnoză al unui tehnician — LED-urile de pe carcasă (PWR, DISC, NET) și un indicator LCD
   de capacitate, cu treptele unităților de măsură care cresc de la bit la petabyte. Amintește de placa de bază

.banda{display:flex;align-items:center;gap:9px;min-height:34px;padding:0 10px;white-space:nowrap;overflow:hidden;

<script>
/* Acoperirea programei (OMEN 3393/2017, clasa a V-a, CS.1.1), textul EXACT din curriculum.json / ACOPERIRE.md. */
const PROG={
  norme:'Normele de securitate și protecție a muncii în laboratorul de informatică',
  pozitie:'Poziția corectă a corpului la stația de lucru',
  evolutie:'Momente principale în evoluția sistemelor de calcul',
  cotidian:'Sisteme de calcul și de comunicații întâlnite în viața cotidiană',
  structura:'Structura generală a unui sistem de calcul',
  hardware:'Rolul componentelor hardware ale unui sistem de calcul',
  intrare:'Dispozitive de intrare: exemple, rol, mod de utilizare',
  iesire:'Dispozitive de ieșire: exemple, rol, mod de utilizare',
  intrareIesire:'Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare',
  stocare:'Dispozitive de stocare a datelor:',
  exemple:'- exemple de dispozitive de stocare a datelor',
  unitati:'- unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.)',
  comparatie:'- comparație între dispozitivele de stocare în funcție de capacitate'
};

/* ---------------- Runda 1: De bază ----------------
   Descriptorul CS.1.1: cu sprijin, periferice de bază (tastatură, mouse, monitor), cunoștințe de bază despre
   componentele hardware, pași ghidați, contexte familiare. Aici: recunoaștere, o singură idee, pași scriși. */
const BAZA=[
 {t:'choice',lectii:[2],q:'Colegul de bancă a vărsat apă pe tastatură. Ce faci primul?',
  o:['Nu atingi nimic și chemi profesorul','Ștergi repede tastatura cu mâneca ta','Scoți chiar tu calculatorul din priză','Întorci tastatura și o scuturi bine'],ok:0,
  why:'Apa conduce curentul, deci orice atingere sau buton apăsat te poate pune în pericol. Profesorul oprește calculatorul și îl scoate din priză, iar tu aștepți la distanță.'},
 {t:'tf',lectii:[2],q:'Sub masă, prelungitorul are firele la vedere. E în regulă să-l împingi mai încolo cu piciorul, ca să nu se împiedice nimeni.',ok:false,
  why:'Fals. Un cablu rupt sau cu firele la vedere e periculos la orice atingere, și cu mâna, și cu piciorul. Nu îl atingi deloc și îi spui imediat profesorului.'},
 {t:'order',lectii:[2],q:'Începe ora. Pune în ordine pașii de pornire a calculatorului.',
  items:['Apeși butonul de pornire de pe carcasă','Aștepți să se încarce sistemul de operare','Scrii parola, dacă ți se cere','Începi lucrul când desktopul e complet'],
  why:'Fiecare pas așteaptă după cel dinainte: parola ți-o cere sistemul de operare abia după ce s-a încărcat, iar lucrul începe când desktopul (ecranul cu pictograme) e gata.'},
 {t:'order',lectii:[2],q:'S-a terminat ora. Pune în ordine pașii pentru oprirea calculatorului.',
  items:['Salvezi ce ai lucrat, cu Ctrl + S','Închizi programele deschise','Din meniul Start alegi închiderea calculatorului','Aștepți până se oprește de tot calculatorul'],
  why:'Întâi salvezi, ca munca să ajungă pe disc. Apoi închizi programele, ca sistemul de operare să nu mai aibă nimic deschis. Abia după aceea alegi închiderea și aștepți să se termine.'},
 {t:'choice',lectii:[2],q:'Te-ai așezat la calculator. Cum verifici repede dacă ecranul e destul de departe?',
  o:['Întinzi brațul: degetele ating ecranul','Te apleci până citești fără să miji ochii','Te uiți dacă vezi ecranul fără să întorci capul','Lipești coatele de marginea mesei'],ok:0,
  why:'Brațul întins e o riglă pe care o ai mereu la tine: când degetele ating ecranul, ești cam la 50–70 cm. Aplecat spre ecran, ochii obosesc mai repede.'},
 {t:'classify',lectii:[2],q:'Ioana lucrează la calculator. Sortează ce face bine și ce trebuie schimbat.',cats:['Bine','De schimbat'],
  items:[['Coatele îndoite cam în unghi drept',0],['Spatele sprijinit de spătar',0],['Încheieturile îndoite pe marginea tastaturii',1],['Marginea de sus a monitorului cam la nivelul ochilor',0],['Lampa aprinsă în spatele ei, care se vede în ecran',1],['Tălpile atârnă, fără să atingă nimic',1]],
  why:'Poziția bună ține corpul odihnit: coatele cam în unghi drept, spatele sprijinit, tălpile pe podea sau pe un suport. Încheieturile îndoite amorțesc palma, iar lumina din spate face reflexii în ecran. Lumina bună vine dintr-o parte.'},
 {t:'choice',lectii:[3],q:'Care dintre aceste obiecte din casă are un sistem de calcul în el?',
  o:['Cuptorul cu microunde din bucătărie','Veioza care se aprinde de la întrerupător','Foarfeca de bucătărie, cu lame de oțel','Lanterna cu baterii și un singur buton'],ok:0,
  why:'Cuptorul primește datele pe care le alegi (timpul, puterea), le prelucrează după un program și dă un rezultat: pornește, numără invers, se oprește. Veioza și lanterna doar închid și deschid curentul, iar foarfeca nu primește date deloc.'},
 {t:'tf',lectii:[3],q:'Routerul care aduce internetul în casă este și el un sistem de calcul.',ok:true,
  why:'Adevărat. Routerul primește date, le prelucrează (hotărăște spre ce dispozitiv merge fiecare) și le trimite mai departe. Nu are tastatură și nici monitor, iar treaba lui ține de partea de comunicații.'},
 {t:'choice',lectii:[4],q:'Care componentă transformă curentul din priză pentru celelalte componente ale calculatorului?',
  o:['Sursa de alimentare','Placa de bază','Procesorul','Hard diskul sau SSD-ul'],ok:0,
  why:'Curentul din priză nu merge direct la piesele din carcasă: sursa de alimentare îl transformă într-un curent potrivit pentru ele. Placa de bază doar leagă componentele, procesorul face calculele, iar discul păstrează fișierele.'},
 {t:'tf',lectii:[4],q:'Placa de bază face calculele, iar procesorul leagă componentele între ele.',ok:false,
  why:'Fals, rolurile sunt inversate. Procesorul execută instrucțiunile și face calculele. Placa de bază e ca un sistem de străzi: pe ea sunt legate toate componentele.'},
 {t:'tf',lectii:[4],q:'Un calculator cu procesor foarte rapid, dar fără niciun disc sau alt dispozitiv de stocare, își amintește temele și după ce îl oprești.',ok:false,
  why:'Fals. Procesorul doar prelucrează, iar RAM-ul se golește la oprire. Fără un dispozitiv de stocare (HDD, SSD, stick, cloud), nimic nu rămâne pentru a doua zi, oricât de rapid ar fi procesorul.'},
 {t:'choice',lectii:[4],q:'Desenezi schema oricărui sistem de calcul: INTRARE → ? → IEȘIRE. Ce scrii în căsuța din mijloc?',
  o:['PRELUCRARE','STOCARE','CURENT','INTERNET'],ok:0,
  why:'Datele intră, sunt prelucrate de procesor, care folosește memoria RAM, apoi rezultatul iese. Stocarea păstrează rezultatul pentru mai târziu, curentul hrănește toate componentele, iar internetul nu face parte din schema de bază.'},
 {t:'choice',lectii:[5],q:'La locul tău din laborator ai tastatură, mouse și monitor. Care dintre ele este de ieșire?',
  o:['Monitorul','Tastatura','Mouse-ul'],ok:0,
  why:'Monitorul îți arată ce a prelucrat calculatorul: informația merge de la calculator spre tine. Prin tastatură și mouse informația pleacă de la tine spre calculator, deci ele sunt de intrare.'},
 {t:'match',lectii:[5],q:'Ce obții cu fiecare gest făcut cu mouse-ul sau cu tastatura?',
  pairs:[['Dublu clic pe o pictogramă','deschizi programul sau dosarul'],['Clic dreapta','apare un meniu cu opțiuni'],['Tasta Backspace','ștergi litera din stânga cursorului'],['Tasta Enter','confirmi sau începi un rând nou']],
  why:'Tastatura și mouse-ul sunt dispozitive de intrare: fiecare gest îi dă calculatorului o comandă. Dacă nu știi ce face un gest, întrebi, nu apeși la întâmplare.'},
 {t:'choice',lectii:[5],q:'Pe tabletă desenezi cu degetul și vezi linia apărând chiar sub deget. Ce fel de dispozitiv este ecranul ei?',
  o:['de intrare-ieșire','doar de intrare','doar de ieșire'],ok:0,amesteca:false,
  why:'Prin același ecran îi dai tabletei informație (atingerea, adică intrare) și primești informație (desenul afișat, adică ieșire). Informația merge în ambele sensuri.'},
 {t:'choice',lectii:[6],q:'Cum se numește cea mai mică unitate de informație, care poate fi doar 0 sau 1?',
  o:['bitul','byte-ul','kilobyte-ul','megabyte-ul'],ok:0,
  why:'Bitul e cea mai mică informație posibilă: 0 sau 1. Byte-ul e deja un grup de 8 biți, iar kilobyte-ul și megabyte-ul sunt și mai mari.'},
 {t:'classify',lectii:[6],q:'Care dintre acestea sunt dispozitive de stocare?',cats:['Dispozitiv de stocare','Nu păstrează date'],
  items:[['Cardul de memorie din telefon',0],['DVD-ul',0],['SSD-ul',0],['Mouse-ul',1],['Boxele',1],['Microfonul',1]],
  why:'Un dispozitiv de stocare păstrează datele și după ce oprești aparatul: cardul, DVD-ul, SSD-ul. Mouse-ul și microfonul doar trimit informație spre calculator, iar boxele doar o scot afară.'},
 {t:'tf',lectii:[6],q:'Un kilobyte (KB) are 1024 de bytes.',ok:true,
  why:'Adevărat. De la byte în sus, la clasă socotim fiecare treaptă de 1024 de ori mai mare: 1 KB = 1024 B, 1 MB = 1024 KB. Doar de la bit la byte treapta e de 8.'}
];

/* ---------------- Runda 2: Consolidat ----------------
   Descriptorul: independent, mai multe periferice și dispozitive de stocare, structura generală și principalele
   componente, contexte familiare. Aici: situații cu mai multe elemente, alegi singur, fără pașii scriși. */
const CONSOLIDAT=[
 {t:'choice',lectii:[2],q:'Fereastra e în spatele tău, iar în ecran se vede lumina ei. Miji ochii ca să citești. Ce schimbi?',
  o:['Așezi ecranul ca lumina să vină dintr-o parte','Te apropii de ecran până când vezi mai clar','Stingi toate luminile și tragi draperiile','Lucrezi mai repede, ca să termini mai devreme'],ok:0,
  why:'Lumina din spatele tău se oglindește în ecran și obosește ochii. Lumina bună vine dintr-o parte. Aproape de ecran ochii obosesc mai tare, iar într-o cameră întunecată, cu doar lumina ecranului, la fel.'},
 {t:'hunt',lectii:[2],q:'Mara povestește cum a lucrat azi în laborator. Găsește cele 4 lucruri făcute greșit.',
  src:'Am intrat în laborator odată cu profesorul. Venisem de la baie și [[am pornit calculatorul cu mâinile ude|Apa conduce curentul: nu atingi calculatorul cu mâinile ude, te ștergi întâi.]]. Am pus ecranul cam la un braț de mine. Când mouse-ul s-a oprit, [[am scos și am pus la loc cablul din spatele carcasei|Cablurile și spatele calculatorului nu se ating. Defecțiunea o anunți profesorului.]]. Am lucrat [[cu umerii ridicați spre urechi|Umerii stau relaxați, lăsați în jos, nu ridicați spre urechi.]], dar la 20 de minute am privit pe geam, departe. La final [[am ținut apăsat butonul de pornire până s-a stins|Calculatorul se oprește din meniul Start. Butonul ținut apăsat e doar pentru urgențe.]].',
  indiciu:'Verifică pe rând siguranța, poziția corpului și felul în care a terminat lucrul.',
  why:'Mara a făcut și lucruri bune: a intrat cu profesorul, a ținut ecranul la un braț și a respectat pauza de 20 de minute. Greșelile țin de siguranța electrică, de poziție și de oprirea corectă.'},
 {t:'match',lectii:[3],q:'Leagă fiecare perioadă de calculatoarele cele mai cunoscute atunci.',
  pairs:[['anii 1940–1950','primele calculatoare electronice, cât o cameră'],['anii 1960–1970','calculatoare cu tranzistori și circuite integrate, cât un dulap'],['anii 1980–1990','calculatorul personal, în case și școli'],['după 2007','telefonul inteligent, un calculator în buzunar']],
  why:'Pe măsură ce piesele s-au micșorat, calculatoarele au trecut dintr-o cameră întreagă într-un dulap, apoi pe birou și în buzunar. Au devenit și mai rapide și conectate între ele.'},
 {t:'choice',lectii:[3],q:'Plătești cu cardul la magazin, iar după câteva secunde banca îți trimite un mesaj pe telefon. Ce arată asta?',
  o:['Sistemele de calcul schimbă date între ele','Casa de marcat și telefonul au tastatură','Fiecare aparat lucrează singur, fără legături','Un om de la bancă îți scrie mesajul de mână'],ok:0,
  why:'Aparatul de plată, calculatoarele băncii și telefonul tău sunt legate între ele și își trimit date. Legătura aceasta e partea de „comunicații” din sistemele de calcul de azi.'},
 {t:'tf',lectii:[3],q:'Un semafor inteligent, care ține verdele mai mult când așteaptă multe mașini, este un sistem de calcul.',ok:true,
  why:'Adevărat. Primește date (câte mașini așteaptă), le prelucrează (hotărăște cât ține verdele) și dă un rezultat (schimbă culoarea). Nu trebuie să arate ca un calculator ca să fie unul.'},
 {t:'order',lectii:[4],q:'Scrii o compunere și o salvezi. Pune în ordine drumul textului prin calculator.',
  items:['Scrii textul de la tastatură','Textul stă în memoria RAM cât lucrezi','Apeși Ctrl + S','Textul e scris pe disc și rămâne după oprire'],
  why:'Datele intră prin tastatură și stau în RAM, spațiul de lucru. RAM-ul se golește la oprire, așa că abia salvarea le scrie pe disc (SSD sau hard disk), care le păstrează.'},
 {t:'match',lectii:[4],q:'Fiecare componentă seamănă cu ceva din viața de zi cu zi. Potrivește-le.',
  pairs:[['Procesorul','creierul care ia deciziile'],['Memoria RAM','biroul pe care lucrezi acum'],['Hard diskul sau SSD-ul','dulapul cu dosare păstrate'],['Placa de bază','străzile care leagă casele între ele']],
  why:'Pe birou (RAM) ții doar ce folosești acum, iar la sfârșit îl strângi. Ce vrei să păstrezi pui în dulap (discul). Creierul (procesorul) hotărăște, iar pe străzi (placa de bază) circulă totul între componente.'},
 {t:'classify',lectii:[4],q:'Calculatorul de birou din laborator: ce se află în carcasă și ce e periferic, în afara ei?',cats:['În carcasă','Periferic, în afara carcasei'],
  items:[['Procesorul',0],['Sursa de alimentare',0],['Memoria RAM',0],['Tastatura',1],['Imprimanta',1],['Camera web',1]],
  why:'Componentele interne (procesorul, RAM-ul, sursa, placa de bază, discul) stau montate în carcasă. Perifericele se leagă din exterior, prin cablu sau fără fir, și leagă calculatorul de lumea din jur.'},
 {t:'classify',lectii:[5],q:'Unde pui fiecare dispozitiv? Gândește-te încotro merge informația.',cats:['Intrare','Ieșire','Intrare-ieșire'],
  items:[['Camera web',0],['Cititorul de coduri de bare de la casă',0],['Joystickul',0],['Imprimanta simplă',1],['Căștile fără microfon',1],['Ecranul tactil al bancomatului',2]],
  why:'Camera, cititorul de coduri și joystickul aduc informație în calculator. Imprimanta și căștile o scot spre om. Ecranul tactil al bancomatului îți arată meniul și primește atingerea ta, deci merge în ambele sensuri.'},
 {t:'choice',lectii:[5],q:'La ora de muzică vrei să înregistrezi cum cânți, apoi să te asculți. Ce folosești, în ordine?',
  o:['Microfonul, apoi boxele','Boxele, apoi microfonul','Microfonul, apoi scanerul','Camera web, apoi monitorul'],ok:0,
  why:'Înregistrarea aduce sunetul în calculator, deci ai nevoie de un dispozitiv de intrare: microfonul. Ascultarea scoate sunetul spre tine, deci de ieșire: boxele. Scanerul aduce hârtii, iar monitorul arată imagini, nu sunet.'},
 {t:'choice',lectii:[6],q:'Vrei să iei cu tine, în buzunar, 20 GB de fotografii din tabără. Pe care dispozitiv încap toate?',
  o:['Pe un stick de 32 GB','Pe un DVD de 4,7 GB','Pe un CD de 700 MB','Pe un card de 16 GB'],ok:0,
  why:'Compari în aceeași unitate: 20 GB e mai mult decât 16 GB și decât 4,7 GB, iar 700 MB nu ajunge nici la 1 GB. Doar stickul de 32 GB are loc pentru toate.'},
 {t:'order',lectii:[6],q:'Ordonează fișierele după cât loc ocupă, de la cel mai mic la cel mai mare.',
  items:['un mesaj de 900 B','o poză de 850 KB','o melodie de 4 MB','un film de 1,5 GB'],
  why:'Te uiți întâi la unitate, apoi la număr: B < KB < MB < GB. De aceea 900 B e mai puțin decât 850 KB, iar 4 MB e mai puțin decât 1,5 GB, deși numerele par să spună altceva.'},
 {t:'choice',lectii:[6],q:'Pe un stick au rămas liberi 2 GB. Câte clipuri de câte 256 MB mai încap? (La clasă socotim 1 GB = 1024 MB.)',
  o:['4','8','16','512'],ok:1,amesteca:false,
  why:'Aduci la aceeași unitate: 2 GB = 2 × 1024 MB = 2048 MB. Apoi împarți: 2048 : 256 = 8. Rezultatul 4 ar veni dintr-un singur GB, iar 16 dintr-un calcul pe 4 GB.'},
 {t:'match',lectii:[6],q:'Leagă fiecare mod de a păstra datele de ce îl deosebește.',
  pairs:[['SSD','foarte rapid, fără piese care se mișcă'],['Hard disk (HDD)','mult spațiu, ieftin, dar mai lent'],['Card de memorie','intră în telefon și în aparatul foto'],['Stocare în cloud','ajungi la ea de oriunde, dar cu internet'],['DVD','capacitate mică și se zgârie']],
  why:'Nu există un dispozitiv bun la toate. Alegi după ce contează: viteza (SSD), mult spațiu ieftin (HDD), mărimea mică (cardul), accesul de oriunde (cloud) sau un disc ieftin, dar mic, pe care îl poți da cuiva (DVD).'},
 {t:'choice',lectii:[6],q:'Ce are mai mult loc: 3 DVD-uri de câte 4,7 GB, puse la un loc, sau un stick de 16 GB?',
  o:['Stickul de 16 GB','Cele 3 DVD-uri','Au exact același loc'],ok:0,amesteca:false,
  why:'3 × 4,7 GB = 14,1 GB, iar 14,1 GB e mai puțin decât 16 GB. Mai multe bucăți nu înseamnă automat mai mult loc: faci socoteala în aceeași unitate.'},
 {t:'tf',lectii:[2],q:'La un calculator din biblioteca orașului, unde nu e profesorul de față, regulile din laborator nu se mai aplică.',ok:false,
  why:'Fals. Regulile te apără pe tine și aparatul oriunde: fără lichide lângă tastatură, fără mâini la cabluri, fără programe instalate fără voie. Acolo, o defecțiune o anunți bibliotecarului.'}

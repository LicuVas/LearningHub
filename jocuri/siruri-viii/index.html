<script>
// cod C++ pe mai multe rânduri; se scrie normal, iar funcția îl face sigur pentru HTML.
// Stilul e pus direct pe element, ca să arate la fel și în recapitularea clasei.
const C=s=>`<code class="cod" style="display:block;white-space:pre-wrap;line-height:1.5;padding:.45em .7em;margin:.5em 0">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code>`;
const SIR='Șir de valori (noțiuni introductive)';
const OPS='Operații cu șiruri de valori: citire, afişare, parcurgere';
const ALG='Algoritmi de bază pentru șiruri de valori: numărare, sumă /produs, minim/maxim, verificare a unei proprietăți.';
const LEVELS=[
{t:'Ce este un șir de valori',lectii:[23],continuturi:[SIR],text:`
<p>Un <mark>șir de valori</mark> (numit și <mark>vector</mark> sau tablou unidimensional) ține mai multe valori de <strong>același tip</strong> sub un singur nume. Îl găsești peste tot: notele din catalog, temperaturile unei săptămâni, scorurile unui clasament.</p>
<p>Fiecare valoare e un <mark>element</mark> și are o poziție, numită <mark>indice</mark>. În C++, primul element are indicele <strong>0</strong>:</p>
${C('int v[100];   // loc pentru cel mult 100 de numere întregi\n// v = 4 7 2 9 5\n// v[0] = 4, v[1] = 7, ..., v[4] = 5')}
<p>Dacă șirul are <code>n</code> elemente, indicii merg de la <code>0</code> la <code>n - 1</code>.</p>
<p>La unele exerciții, pozițiile se numără de la 1 la n, iar <code>v[0]</code> rămâne nefolosit. Important este să rămâi consecvent în tot programul.</p>`,
qs:[
 {t:'choice',q:'Care situație se potrivește cel mai bine cu un șir de valori?',o:['Temperaturile unei săptămâni','Numele școlii tale','Vârsta ta de azi, în ani','Culoarea preferată a unui coleg'],ok:0,why:'Un șir ține mai multe valori de același tip, puse în ordine: 7 temperaturi, una pe zi. Celelalte sunt o singură valoare.'},
 {t:'choice',q:'Șirul v are elementele 4 7 2 9 5, cu indicii de la 0. Cât este v[2]?',o:['2','7','9','4'],ok:0,why:'Numărătoarea începe de la 0: v[0] = 4, v[1] = 7, v[2] = 2. 7 ar fi al doilea element, adică v[1].'},
 {t:'tf',q:'Într-un șir declarat int v[100] pot pune și numere întregi, și cuvinte, amestecate.',ok:false,why:'Fals. Toate elementele unui șir au același tip. int v[100] ține doar numere întregi.'},
 {t:'choice',q:'Șirul are n = 6 elemente, cu indicii de la 0. Care e indicele ultimului element?',o:['5','6','7','0'],ok:0,why:'Indicii sunt 0, 1, 2, 3, 4 și 5: tot 6 poziții. Ultimul indice e n - 1 = 5.'},
 {t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['element','o valoare din șir'],['indice','poziția unui element'],['n','numărul de elemente'],['v[i]','elementul de pe poziția i']],why:'Un șir are n elemente. Fiecare stă pe o poziție, iar v[i] îți dă valoarea de pe poziția i.'}
]},
{t:'Citire, afișare, parcurgere',lectii:[24],continuturi:[OPS],text:`
<p>A <mark>parcurge</mark> un șir înseamnă a trece pe rând prin elementele lui. De obicei folosim <code>for</code>, cu indicele <code>i</code> ca și contor:</p>
${C('int n, v[100];\ncin >> n;\nfor (int i = 0; i < n; i++)\n    cin >> v[i];          // citire\nfor (int i = 0; i < n; i++)\n    cout << v[i] << " ";   // afișare')}
<p>Întâi se citește <mark>n</mark>, ca programul să știe câte elemente urmează. Apoi elementele, unul câte unul.</p>
<p>Parcurgerea poate merge și <mark>invers</mark>, de la ultimul element la primul: <code>for (int i = n - 1; i &gt;= 0; i--)</code>.</p>`,
qs:[
 {t:'tf',q:'Înainte de a citi elementele șirului, programul trebuie să știe câte sunt, deci n se citește primul.',ok:true,why:'Adevărat. Bucla for merge până la n, deci n trebuie să aibă deja o valoare când bucla pornește.'},
 {t:'order',q:'Pune în ordine rândurile care citesc un șir și îl afișează.',items:['int n, v[100];','cin >> n;','for (int i = 0; i < n; i++) cin >> v[i];','for (int i = 0; i < n; i++) cout << v[i] << " ";'],why:'Declari, afli câte elemente sunt, le citești, apoi le afișezi. Nu poți afișa ce n-ai citit încă.'},
 {t:'choice',q:`Se citește n = 4 și șirul 3 8 1 6. Ce afișează codul?${C('for (int i = n - 1; i >= 0; i--)\n    cout << v[i] << " ";')}`,o:['6 1 8 3','3 8 1 6','1 8 3 6','6 8 1 3'],ok:0,why:'i pornește de la n - 1 = 3 și scade până la 0, deci elementele se afișează de la ultimul la primul.'},
 {t:'choice',q:'Ce greșeală are bucla for (int i = 0; i <= n; i++) cin >> v[i]; pentru un șir cu n elemente, indicii de la 0?',o:['Citește un element în plus, pe poziția n','Sare peste primul element, v[0]','Citește elementele în ordine inversă','Nu are nicio greșeală, e corectă'],ok:0,why:'Cu i <= n, bucla trece și prin i = n, deci face n + 1 citiri. Pozițiile bune sunt doar 0 … n - 1.'},
 {t:'choice',q:`Ce afișează codul pentru șirul 5 10 15 20 (n = 4)?${C('for (int i = 0; i < n; i = i + 2)\n    cout << v[i] << " ";')}`,o:['5 15','10 20','5 10 15 20','5 10'],ok:0,why:'i ia valorile 0 și 2, apoi 4, când bucla se oprește. v[0] = 5 și v[2] = 15.'}
]},
{t:'Numărarea',lectii:[25],continuturi:[ALG],text:`
<p>Algoritmul de <mark>numărare</mark> află câte elemente au o anumită <mark>proprietate</mark>. Folosește un <mark>contor</mark> care pornește de la 0 și crește cu 1 la fiecare element potrivit:</p>
${C('int k = 0;\nfor (int i = 0; i < n; i++)\n    if (v[i] % 2 == 0)\n        k++;\ncout << k;')}
<p>Codul de mai sus numără elementele <mark>pare</mark>. Schimbi doar condiția din <code>if</code> și numeri altceva: elementele mai mari decât 5, notele de 10, zilele cu ger.</p>`,
qs:[
 {t:'choice',q:'Ce afișează codul din pagină pentru șirul 4 7 2 9 5?',o:['2','3','5','6'],ok:0,why:'Sunt pare doar 4 și 2, deci contorul crește de două ori. 6 ar fi suma lor, nu numărul lor.'},
 {t:'tf',q:'Contorul k se pune la 0 înainte de buclă, nu în interiorul ei.',ok:true,why:'Adevărat. Dacă l-ai pune la 0 în buclă, s-ar șterge la fiecare pas și ai număra cel mult un element.'},
 {t:'choice',q:'Vrei să numeri elementele mai mari decât 5. Ce condiție pui în if?',o:['v[i] > 5','i > 5','v[i] >= 5','k > 5'],ok:0,why:'Proprietatea privește valoarea elementului, v[i], nu poziția i. „Mai mari decât 5” nu include 5, deci >, nu >=.'},
 {t:'classify',q:'Numeri elementele divizibile cu 3 din șirul 9 4 12 7 3. Care intră la numărare?',cats:['Se numără','Nu se numără'],items:[['9',0],['12',0],['3',0],['4',1],['7',1]],why:'Se numără elementele cu v[i] % 3 == 0: 9, 12 și 3. La 4 și 7, restul împărțirii la 3 nu e 0. Rezultatul e 3.'}
]},
{t:'Suma și produsul',lectii:[26],continuturi:[ALG],text:`
<p>Algoritmul de <mark>sumă</mark> adună toate elementele. Suma pornește de la <mark>0</mark>, pentru că 0 nu schimbă o adunare:</p>
${C('int s = 0;\nfor (int i = 0; i < n; i++)\n    s = s + v[i];')}
<p>Algoritmul de <mark>produs</mark> înmulțește elementele. Produsul pornește de la <mark>1</mark>, pentru că 1 nu schimbă o înmulțire. Dacă ar porni de la 0, ar rămâne 0 orice ar urma.</p>
<p>Cu suma afli și <mark>media</mark>: împarți suma la n. Ca să nu pierzi zecimalele, media se calculează ca număr real, de exemplu <code>(double)s / n</code>.</p>`,
qs:[
 {t:'choice',q:'Ce sumă se obține pentru șirul 4 7 2 9 5?',o:['27','5','25','22'],ok:0,why:'4 + 7 + 2 + 9 + 5 = 27. 5 e numărul de elemente, nu suma lor.'},
 {t:'choice',q:'De la ce valoare pornește variabila p în algoritmul de produs?',o:['1','0','v[0] + 1','n'],ok:0,why:'1 e elementul neutru la înmulțire. Cu p = 0, orice înmulțire ar da tot 0.'},
 {t:'choice',q:'Cât este produsul elementelor șirului 2 3 4?',o:['24','9','0','234'],ok:0,why:'2 * 3 = 6, apoi 6 * 4 = 24. 9 ar fi suma, iar 0 ar ieși doar dacă produsul pornea greșit de la 0.'},
 {t:'tf',q:'Pentru șirul 7 8 (n = 2), cu s de tip int, calculul s / n dă 7.5.',ok:false,why:'Fals. s = 15 și n = 2 sunt int, deci / dă câtul: 7. Pentru 7.5 calculezi (double)s / n.'},
 {t:'match',q:'Leagă fiecare algoritm de valoarea lui de pornire.',pairs:[['sumă','s = 0'],['produs','p = 1'],['numărare','k = 0']],why:'Pornești de la valoarea care nu strică operația: 0 pentru adunare și numărare, 1 pentru înmulțire.'}
]},
{t:'Minimul și maximul',lectii:[27],continuturi:[ALG],text:`
<p>Ca să afli <mark>maximul</mark>, presupui că primul element e cel mai mare. Apoi îl compari cu fiecare element rămas și îl înlocuiești când găsești unul mai mare:</p>
${C('int mx = v[0];\nfor (int i = 1; i < n; i++)\n    if (v[i] > mx)\n        mx = v[i];')}
<p><mark>Minimul</mark> se află la fel, cu <code>&lt;</code> în loc de <code>&gt;</code>.</p>
<p>De ce <mark>pornim de la v[0]</mark> și nu de la 0? Dacă toate numerele sunt negative, de exemplu temperaturi de iarnă, un maxim pornit de la 0 ar rămâne 0, un număr care nici nu e în șir.</p>`,
qs:[
 {t:'choice',q:'Ce valoare are mx la final pentru șirul 4 7 2 9 5?',o:['9','5','4','2'],ok:0,why:'mx pornește de la 4, devine 7, apoi 9. 5 nu e mai mare decât 9, deci mx rămâne 9.'},
 {t:'choice',q:'Temperaturile sunt -3 -8 -1 -5. Dacă mx ar porni de la 0 în loc de v[0], ce ar afișa programul?',o:['0','-1','-8','-3'],ok:0,why:'Niciun element nu e mai mare decât 0, deci mx rămâne 0. Maximul corect e -1 și îl obții dacă pornești de la v[0].'},
 {t:'tf',q:'Pentru minim, singura schimbare față de maxim este semnul din comparație: < în loc de >.',ok:true,why:'Adevărat. Pornești tot de la v[0] și parcurgi restul șirului, dar păstrezi elementul mai mic.'},
 {t:'choice',q:'De ce bucla pentru maxim pornește de la i = 1?',o:['v[0] e deja în mx, deci nu mai trebuie comparat','v[0] nu face parte din șir','Pentru că indicii încep de la 1','Ca să fie mai scurt codul, altfel dă eroare'],ok:0,why:'mx a primit deja valoarea lui v[0]. Dacă bucla ar porni de la 0, rezultatul ar fi același, doar ai face o comparație în plus.'}
]},
{t:'Toți sau măcar unul?',lectii:[28],continuturi:[ALG],text:`
<p>Uneori vrei să afli dacă o proprietate e adevărată <mark>pentru toate</mark> elementele sau <mark>pentru cel puțin unul</mark>.</p>
<p><strong>Pentru toate:</strong> presupui că da și cauți un contraexemplu.</p>
${C('bool toate = true;\nfor (int i = 0; i < n; i++)\n    if (v[i] < 5)\n        toate = false;')}
<p><strong>Pentru cel puțin unul:</strong> presupui că nu și cauți un exemplu.</p>
${C('bool exista = false;\nfor (int i = 0; i < n; i++)\n    if (v[i] == 10)\n        exista = true;')}
<p>Un singur element e de ajuns ca să schimbe răspunsul. Tipul <code>bool</code> ține <code>true</code> (adevărat) sau <code>false</code> (fals).</p>`,
qs:[
 {t:'choice',q:'Notele sunt 7 9 4 8. Ce valoare are toate după primul cod din pagină („toate notele ≥ 5”)?',o:['false','true','4','7'],ok:0,why:'Nota 4 e mai mică decât 5, deci e un contraexemplu și toate devine false. Ajunge un singur element.'},
 {t:'choice',q:'Pentru aceleași note, 7 9 4 8, ce valoare are exista după al doilea cod („există un 10”)?',o:['false','true','0 note','8'],ok:0,why:'Niciun element nu e egal cu 10, deci exista rămâne false, cum a pornit.'},
 {t:'match',q:'Leagă fiecare întrebare de valoarea de pornire potrivită.',pairs:[['Sunt toate elementele pozitive?','ok = true, apoi caut un contraexemplu'],['Există măcar un element negativ?','gasit = false, apoi caut un exemplu'],['Câte elemente sunt negative?','k = 0, apoi număr']],why:'„Toate” pornește de la da, „măcar unul” pornește de la nu, iar „câte” pornește de la zero.'},
 {t:'tf',q:'În codul pentru „toate”, dacă pui și un else toate = true;, rezultatul rămâne corect.',ok:false,why:'Fals. Un element bun venit după unul rău ar pune toate înapoi pe true și ar ascunde contraexemplul. Odată false, trebuie să rămână false.'}
]},
{t:'În mediul de programare: combin și depanez',lectii:[29,30,31],continuturi:[OPS,ALG],text:`
<p>Algoritmii se <mark>combină</mark>: în aceeași parcurgere poți face suma și, în același timp, să numeri elementele pare.</p>
${C('int s = 0, k = 0;\nfor (int i = 0; i < n; i++)\n{\n    s = s + v[i];\n    if (v[i] % 2 == 0)\n        k++;\n}')}
<p>Când implementezi în mediul de programare, <mark>testezi</mark> cu șiruri mici, pentru care știi rezultatul. Alege și cazuri speciale: un singur element, numai numere negative.</p>
<p>Greșeli frecvente: <mark>indice în afara șirului</mark> (<code>i &lt;= n</code>), sumă nepornită de la 0, acolade uitate în buclă. <mark>Rularea pas cu pas</mark> îți arată valorile lui <code>i</code> și ale variabilelor la fiecare trecere.</p>`,
qs:[
 {t:'choice',q:'Ce valori au s și k după codul din pagină, pentru șirul 3 6 1 8?',o:['s = 18, k = 2','s = 18, k = 4','s = 14, k = 2','s = 4, k = 18'],ok:0,why:'3 + 6 + 1 + 8 = 18. Pare sunt 6 și 8, deci k = 2. O singură parcurgere face ambele lucruri.'},
 {t:'classify',q:'Ce test e bun pentru a prinde greșeala?',cats:['Prinde greșeala','Nu o prinde'],items:[['Maxim pornit de la 0, testat pe -4 -2 -9',0],['Maxim pornit de la 0, testat pe 3 8 5',1],['Produs pornit de la 0, testat pe 2 3',0],['Numărare cu v[i] > 5 în loc de v[i] >= 5, testată pe 5 7 5',0],['Numărare cu v[i] > 5 în loc de v[i] >= 5, testată pe 7 8 9',1]],why:'O greșeală se vede doar pe un test care ajunge la ea: maximul pornit de la 0 greșește pe numere negative, iar > în loc de >= greșește doar când în șir apare chiar 5. Produsul pornit de la 0 dă 0 pe orice șir.'},
 {t:'hunt',q:'Programul lui Radu trebuie să afișeze suma elementelor. Are 2 greșeli. Apasă pe ele.',src:'int n, v[100], s; cin >> n; for (int i = 0; i < n; i++) cin >> v[i]; [[s = 1;|suma pornește de la 0; cu 1 iese mai mare cu 1]] for (int i = 0; [[i <= n;|cu i <= n se adună și v[n], care nu face parte din șir; corect: i < n]] i++) s = s + v[i]; cout << s;',indiciu:'Verifică valoarea de pornire și ultima trecere prin buclă.',why:'Test: pentru 2 3 rezultatul corect e 5. Cu s = 1 și i <= n, programul ar aduna 1 și o valoare din afara șirului.'},
 {t:'tf',q:'Dacă programul trece un test, sigur e corect pentru orice șir.',ok:false,why:'Fals. Un test arată doar că programul merge pe acel exemplu. De aceea alegi mai multe teste, inclusiv cazuri speciale.'}
]},
{t:'Mini-proiectul: stația meteo a școlii',final:true,lectii:[32],continuturi:[OPS,ALG],text:`
<p><strong>Misiunea finală.</strong> Stația meteo a școlii a măsurat temperatura la prânz, 7 zile la rând:</p>
${C('n = 7\nt = 3 -2 5 0 -4 6 2')}
<p>Faci o aplicație care citește temperaturile și afișează: <mark>media</mark>, <mark>temperatura minimă</mark>, <mark>câte zile au fost sub 0 grade</mark> și dacă <mark>a existat o zi cu peste 5 grade</mark>.</p>
<p>Alegi pentru fiecare cerință algoritmul potrivit și calculezi rezultatele pe datele reale de mai sus, ca să le poți compara cu ce afișează programul.</p>`,
qs:[
 {t:'classify',q:'Ce algoritm folosești pentru fiecare cerință?',cats:['Sumă','Minim','Numărare','Verificare „există”'],items:[['Media temperaturilor',0],['Temperatura cea mai scăzută',1],['Câte zile au fost sub 0 grade',2],['A fost vreo zi cu peste 5 grade?',3]],why:'Media pornește de la sumă. Cea mai scăzută valoare e minimul. „Câte” cere numărare, iar „a fost vreo zi” cere o verificare pentru cel puțin un element.'},
 {t:'choice',q:'Cât este suma temperaturilor 3 -2 5 0 -4 6 2?',o:['10','22','18','7'],ok:0,why:'3 - 2 + 5 + 0 - 4 + 6 + 2 = 10. 22 ar ieși dacă ai aduna numerele fără semnul minus.'},
 {t:'choice',q:'Care este temperatura minimă și câte zile au fost sub 0 grade?',o:['-4 și 2 zile','-4 și 3 zile','-2 și 2 zile','0 și 3 zile'],ok:0,why:'Sub 0 sunt doar -2 și -4, deci 2 zile. Ziua cu 0 grade nu e sub 0. Cea mai mică valoare e -4.'},
 {t:'tf',q:'Pentru aceste date, verificarea „a existat o zi cu peste 5 grade” dă true.',ok:true,why:'Adevărat. A șasea zi are 6 grade, iar 6 > 5. Un singur exemplu e de ajuns.'},
 {t:'choice',q:'Media este 10 / 7. Cum o calculezi ca să nu pierzi zecimalele?',o:['(double)s / n','s / n, cu s și n de tip int','s % n','n / s'],ok:0,why:'Între două int, 10 / 7 dă 1. Cu (double)s împărțirea se face cu zecimale: aproximativ 1.43. % dă restul, nu media.'}
]}
];

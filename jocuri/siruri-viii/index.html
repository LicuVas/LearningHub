/* tema jocului: un șir de căsuțe numerotate cu indici, ca vagoanele unui tren */
.banda{display:flex;align-items:flex-end;gap:3px;padding:6px 12px 4px;white-space:nowrap;overflow:hidden;font-family:var(--fm);font-size:.74rem}
.banda .c{flex:none;display:flex;flex-direction:column;align-items:center}
.banda .c b{display:block;min-width:26px;text-align:center;padding:2px 5px;border:1.5px solid var(--accent);background:var(--cel);color:var(--ink);font-weight:500}
.banda .c i{font-style:normal;font-size:.62rem;color:var(--idx)}
.banda .c.on b{background:var(--accent);color:var(--accentInk)}

h1 .ac{color:var(--accent)}
.cod{display:block;white-space:pre-wrap;line-height:1.5;padding:.45em .7em;margin:.5em 0}
/* șirul desenat ca sertare cu indici (în pași) */
.vec{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;margin:.6em 0;font-family:var(--fm)}

.urm-lbl{font-weight:700;font-size:.85rem;color:var(--ink2);margin:.7em 0 .2em}

.urm-cons{font-family:var(--fm);font-size:.88rem;background:#1E1E1E;color:#EDEDED;border-radius:6px;padding:6px 10px;display:inline-block;max-width:100%}

<body>
<script src="../_motor/motor.js"></script>
<script>
/* MISIUNEA ȘIRUL, rescrisă pe PAȘI (26.09.2026).
   Profesorul: „informația e prea condensată - nu e beginner friendly - e mai mult test decât asistență de învățare”.
   De aceea: fiecare nivel = pași mici (o idee, un exemplu lucrat, „explică-mi altfel”, exercițiu cu indiciu și variante),
   un ATELIER care simulează rularea pas cu pas din Code::Blocks (fereastra Watches: elevul scrie valorile variabilelor
   după fiecare trecere prin buclă, pe date alese la întâmplare, iar TESTELE se bifează), apoi verificarea, doar pe ce
   s-a predat. Codul se arată mereu pe rânduri, indentat. */
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// cod C++ pe mai multe rânduri, în întrebări; stilul e pus pe element, ca să arate la fel și în recapitularea clasei
const C=s=>`<code class="cod" style="display:block;white-space:pre-wrap;line-height:1.5;padding:.45em .7em;margin:.5em 0">${X(s)}</code>`;
const pre=s=>`<pre>${X(s)}</pre>`;                        // cod în pași, indentat, aliniat la stânga
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../siruri-viii/img/${f}" target="_blank"><img src="../siruri-viii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* șirul desenat ca sertare: vec('v',[4,7,2,9,5],2) - al treilea argument = indicele evidențiat */
const vec=(nm,a,on)=>`<div class="vec" aria-label="Șirul ${nm}: ${a.join(' ')}"><span class="nm">${nm}</span>${a.map((x,i)=>`<span class="${i===on?'on':''}"><b>${x}</b><i>${i}</i></span>`).join('')}</div>`;

const SIR='Șir de valori (noțiuni introductive)';
const OPS='Operații cu șiruri de valori: citire, afişare, parcurgere';
const ALG='Algoritmi de bază pentru șiruri de valori: numărare, sumă /produs, minim/maxim, verificare a unei proprietăți.';

/* ---------------- simulatorul „urmarire”: rularea pas cu pas, ca în Code::Blocks ----------------
   Q: cod (programul arătat), date:[[...],[...]] (unul ales la întâmplare = ce scrie elevul în consolă),
   nume ('v' implicit), init:{var:'expresie'}, pas:'instrucțiunea din buclă' (C++ simplu, valid și în JS),
   de (primul i), invers:true, salt (pasul lui i), cols:[variabilele din Watches], scrie:[ce completează elevul:
   'i', 'vi' = elementul, sau numele variabilelor; implicit cols], afis:'expresia afișată la final'.
   Verificarea e pe COMPORTAMENT: valorile corecte se calculează rulând chiar instrucțiunea, pe datele de acum. */
function urmRun(Q,a){
  const nm=Q.nume||'v',n=a.length,sc={n,v:a};sc[nm]=a;
  const ev=e=>new Function('sc','with(sc){return ('+e+')}')(sc);
  const vars=Object.keys(Q.init||{});vars.forEach(k=>{sc[k]=ev(Q.init[k])});
  const start={};vars.forEach(k=>start[k]=sc[k]);
  const f=Q.pas?new Function('sc','with(sc){'+Q.pas+'}'):null,idx=[],d=Q.salt||1;
  if(Q.invers){for(let i=n-1;i>=0;i-=d)idx.push(i)}else{for(let i=(Q.de||0);i<n;i+=d)idx.push(i)}
  const rows=idx.map(i=>{sc.i=i;if(f)f(sc);const r={i,vi:a[i]};vars.forEach(k=>r[k]=sc[k]);return r});
  return {rows,start,afis:Q.afis?String(ev(Q.afis)):null};
}
const urmFmt=x=>x===true?'true':x===false?'false':String(x);
function urmOk(inp,exp){
  const s=String(inp==null?'':inp).trim().toLowerCase().replace(/\s+/g,' ');
  if(typeof exp==='boolean')return exp?['true','1','adevărat','adevarat'].includes(s):['false','0','fals'].includes(s);
  if(typeof exp==='number')return /^-?\d+([.,]\d+)?$/.test(s)&&Math.abs(parseFloat(s.replace(',','.'))-exp)<1e-9;
  return s===String(exp).trim().toLowerCase().replace(/\s+/g,' ');
}
const URMARIRE={
  render(Q,body,api){
    const a=Q.date[Math.floor(Math.random()*Q.date.length)],nm=Q.nume||'v',T=urmRun(Q,a);
    const cols=Q.cols||[],scrie=Q.scrie||cols;
    const keys=['i','vi'].concat(cols),head=k=>k==='vi'?nm+'[i]':k;
    const cel=(ri,k,x)=>scrie.includes(k)?`<td data-c="${ri}-${k}"><input data-r="${ri}" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${api.esc(head(k))} la trecerea ${ri+1}"></td>`:`<td class="dat">${api.esc(urmFmt(x))}</td>`;
    body._T=T;body._scrie=scrie;
    body.innerHTML=`<div class="urm">
      <div class="urm-lbl">Programul</div>${pre(Q.cod)}
      <div class="urm-lbl">Consola: ce scrii la tastatură</div>
      <div class="urm-cons"><small>n, apoi elementele:</small><br>${a.length}<br>${a.join(' ')}</div>
      <div class="urm-lbl">Watches: valorile după fiecare trecere prin buclă${scrie.length?' (completezi căsuțele albe)':''}</div>
      <div class="urm-w"><table class="urm-t"><thead><tr>${keys.map(k=>`<th>${api.esc(head(k))}</th>`).join('')}</tr></thead><tbody>
      ${cols.length?`<tr class="start"><td colspan="2">înainte</td>${cols.map(k=>`<td>${api.esc(urmFmt(T.start[k]))}</td>`).join('')}</tr>`:''}
      ${T.rows.map((r,ri)=>`<tr>${keys.map(k=>cel(ri,k,r[k])).join('')}</tr>`).join('')}
      </tbody></table></div>
      ${T.afis!=null?`<label class="urm-af" id="urm-af">Ce afișează programul la final? <input data-k="afis" autocomplete="off" autocapitalize="off" spellcheck="false"></label>`:''}
      <div class="urm-lbl">Testele</div><ul class="teste">
      ${scrie.length?T.rows.map((r,ri)=>`<li data-t="${ri}">Trecerea ${ri+1} (i = ${r.i}): valorile sunt corecte</li>`).join(''):''}
      ${T.afis!=null?'<li data-t="afis">Afișarea de la final e corectă</li>':''}</ul></div>`;
    const inp=(ri,k)=>body.querySelector(ri==='afis'?'input[data-k="afis"]':`input[data-r="${ri}"][data-k="${k}"]`);
    const marcheaza=()=>{let bune=0,tot=0;
      if(scrie.length)T.rows.forEach((r,ri)=>{tot++;let ok=true;
        scrie.forEach(k=>{const b=urmOk(inp(ri,k).value,r[k]);ok=ok&&b;body.querySelector(`td[data-c="${ri}-${k}"]`).className=b?'ok':'no'});
        if(ok)bune++;body.querySelector(`li[data-t="${ri}"]`).className=ok?'ok':'no'});
      if(T.afis!=null){tot++;const b=urmOk(inp('afis').value,T.afis);if(b)bune++;
        body.querySelector('#urm-af').className='urm-af '+(b?'ok':'no');body.querySelector('li[data-t="afis"]').className=b?'ok':'no'}
      return [bune,tot]};
    body._umple=()=>{if(scrie.length)T.rows.forEach((r,ri)=>scrie.forEach(k=>{inp(ri,k).value=urmFmt(r[k])}));if(T.afis!=null)inp('afis').value=T.afis};
    const nav=api.checkButton(()=>{
      const [bune,tot]=marcheaza();
      if(bune===tot){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${bune} din ${tot} teste trec. La rândurile roșii, ia pe rând: ce valoare are i, ce element e ${nm}[i], ce face instrucțiunea din buclă cu valoarea de ACUM a variabilei.`);
        api.revealButton(()=>{body._umple();marcheaza();nav.innerHTML='';api.giveUp('valorile corecte sunt acum în tabel, cu verde. Parcurge-le trecere cu trecere, ca la rularea pas cu pas.')})}
    },'Rulează testele');
  },
  rezolva(Q,body){body._umple()},
  gresit(Q,body){
    body._umple();const T=body._T,sc=body._scrie;
    if(sc.length){const ri=T.rows.length-1,k=sc[sc.length-1],e=body.querySelector(`input[data-r="${ri}"][data-k="${k}"]`),x=T.rows[ri][k];
      e.value=typeof x==='boolean'?String(!x):String(Number(x)+1)}
    else body.querySelector('input[data-k="afis"]').value=T.afis+' 0';
  }
};

const LEVELS=[
/* ================= 1. Ce este un șir de valori (lecția 23) ================= */
{t:'Ce este un șir de valori',lectii:[23],continuturi:[SIR],
 obiectiv:'știi ce este un șir de valori, ce sunt elementul și indicele și găsești orice element după poziția lui.',
 pasi:[
  {t:'Multe valori, un singur nume',
   text:`<p>Până acum, o variabilă ținea <strong>o singură</strong> valoare: <code>int t;</code> ține o temperatură.</p>
<p>Dar dacă vrei temperaturile unei săptămâni? Ai avea nevoie de 7 variabile: <code>t1</code>, <code>t2</code>, …, <code>t7</code>. Pentru notele unei clase de 28 de elevi, de 28!</p>
<p>Un <mark>șir de valori</mark> (numit și <mark>vector</mark> sau tablou unidimensional) ține mai multe valori de <strong>același tip</strong> sub <strong>un singur nume</strong>, puse în ordine. Îl găsești peste tot: notele din catalog, temperaturile unei săptămâni, scorurile unui clasament.</p>`,
   exemplu:`<p>Fără șir, 7 variabile separate:</p>${pre('int t1, t2, t3, t4, t5, t6, t7;')}<p>Cu șir, un singur nume pentru toate 7:</p>${pre('int t[7];')}`,
   altfel:`<p>Gândește-te la un <b>tren</b>: are un singur nume („trenul de Iași”), dar e format din mai multe vagoane, puse unul după altul. Fiecare vagon duce același fel de marfă. Șirul e trenul, iar valorile sunt vagoanele.</p>`,
   incearca:{t:'classify',q:'Ce se potrivește cu un șir de valori și ce e o singură valoare?',cats:['Șir de valori','O singură valoare'],items:[['Notele tale la matematică pe semestru',0],['Scorurile echipelor dintr-un campionat',0],['Vârsta ta de azi, în ani',1],['Numele școlii tale',1]],ajutor:'Un șir are MAI MULTE valori de același fel, puse în ordine.',why:'Notele și scorurile sunt mai multe valori de același tip. Vârsta și numele școlii sunt câte una.'},
   inca:[
    {t:'tf',q:'Într-un șir declarat int v[100] pot pune și numere întregi, și cuvinte, amestecate.',ok:false,ajutor:'Recitește: ce tip au valorile unui șir?',why:'Fals. Toate elementele unui șir au același tip. int v[100] ține doar numere întregi.'},
    {t:'choice',q:'Care situație NU cere un șir de valori?',o:['Anul nașterii tale','Temperaturile din fiecare zi a lunii','Timpii alergătorilor dintr-o cursă','Prețurile produselor dintr-un coș'],ok:0,ajutor:'Căutăm lucrul care e o singură valoare.',why:'Anul nașterii e un singur număr. Celelalte sunt liste de valori de același fel.'}
   ]},
  {t:'Element și indice: numărăm de la 0',
   text:`<p>Fiecare valoare din șir se numește <mark>element</mark>. Fiecare element stă pe o poziție, numită <mark>indice</mark>.</p>
<p>În C++, <strong>primul</strong> element are indicele <strong>0</strong>, al doilea are indicele 1, și tot așa.</p>
<p>Ca să folosești un element, scrii numele șirului și indicele între paranteze drepte: <code>v[0]</code> e primul element, <code>v[1]</code> al doilea. În general, <code>v[i]</code> este elementul de pe poziția <code>i</code>.</p>`,
   exemplu:`<p>Șirul <code>v</code> cu elementele 4 7 2 9 5. Sub fiecare căsuță e indicele:</p>${vec('v',[4,7,2,9,5],2)}<p><code>v[0]</code> = 4, <code>v[1]</code> = 7, <code>v[2]</code> = 2 (căsuța colorată), <code>v[3]</code> = 9, <code>v[4]</code> = 5.</p>`,
   altfel:`<p>Gândește-te la un bloc: primul nivel e <b>parterul</b>, adică etajul 0. Deasupra lui e etajul 1, apoi etajul 2. Dacă locuiești „la al treilea nivel”, ești la etajul 2. La fel, al treilea element al șirului e <code>v[2]</code>.</p>`,
   incearca:{t:'choice',q:'Șirul v are elementele 4 7 2 9 5, cu indicii de la 0. Cât este v[3]?',o:['9','2','5','7'],ok:0,ajutor:'Numără căsuțele de la 0: 0, 1, 2, 3.',why:'v[0] = 4, v[1] = 7, v[2] = 2, v[3] = 9. Al patrulea element are indicele 3.'},
   inca:[
    {t:'choice',q:'Șirul v are elementele 8 3 6 1. Pe ce indice stă elementul 6?',o:['2','3','6','1'],ok:0,ajutor:'8 stă pe indicele 0. Mergi mai departe câte o căsuță.',why:'8 e pe 0, 3 e pe 1, 6 e pe 2. Indicele e poziția, nu valoarea.'},
    {t:'match',q:'Șirul v = 5 0 8 2. Leagă fiecare element de valoarea lui.',pairs:[['v[0]','5'],['v[1]','0'],['v[2]','8'],['v[3]','2']],ajutor:'Primul element are indicele 0.',why:'Indicii pornesc de la 0: v[0] e primul element, v[3] e al patrulea.'}
   ]},
  {t:'Câte elemente și ultimul indice',
   text:`<p>Numărul de elemente al șirului se notează de obicei cu <mark>n</mark>.</p>
<p>Pentru că numărăm de la 0, dacă șirul are <code>n</code> elemente, indicii merg de la <code>0</code> la <code>n - 1</code>. Ultimul element este <code>v[n - 1]</code>.</p>
<p>Atenție: <code>v[n]</code> <strong>nu</strong> face parte din șir. Acolo e o căsuță în plus, cu o valoare necunoscută.</p>
<p>La unele exerciții, pozițiile se numără de la 1 la n, iar <code>v[0]</code> rămâne nefolosit. Important este să rămâi consecvent în tot programul. În misiunea asta numărăm de la 0.</p>`,
   exemplu:`<p>Șirul are n = 5 elemente. Indicii: 0, 1, 2, 3, 4. Ultimul e <code>v[4]</code>, adică <code>v[n - 1]</code>. Căsuța punctată <code>v[5]</code> nu e a șirului:</p><div class="vec"><span class="nm">v</span><span><b>4</b><i>0</i></span><span><b>7</b><i>1</i></span><span><b>2</b><i>2</i></span><span><b>9</b><i>3</i></span><span class="on"><b>5</b><i>4</i></span><span class="gol"><b>?</b><i>5</i></span></div>`,
   incearca:{t:'choice',q:'Un șir are n = 8 elemente, cu indicii de la 0. Care e indicele ultimului element?',o:['7','8','9','0'],ok:0,ajutor:'Ultimul indice este n - 1.',why:'Indicii sunt 0, 1, …, 7: tot 8 poziții. Ultimul indice e n - 1 = 7.'},
   inca:[
    {t:'tf',q:'Un șir are 5 elemente, cu indicii de la 0. v[5] este ultimul lui element.',ok:false,ajutor:'Care sunt indicii pentru 5 elemente?',why:'Fals. Indicii sunt 0 … 4, deci ultimul e v[4]. v[5] e în afara șirului.'},
    {t:'choice',q:'Ultimul element al unui șir este v[9]. Câte elemente are șirul (indicii de la 0)?',o:['10','9','8','11'],ok:0,ajutor:'Numără și poziția 0.',why:'Indicii 0, 1, …, 9 înseamnă 10 poziții. n - 1 = 9, deci n = 10.'}
   ]},
  {t:'Șirul în program: int v[100];',
   text:`<p>Un șir se <mark>declară</mark> ca o variabilă, dar cu numărul maxim de elemente între paranteze drepte:</p>
${pre('int n, v[100];   // loc pentru cel mult 100 de numere întregi')}
<p>Cele 100 de căsuțe sunt doar <strong>locul rezervat</strong>. Câte folosim de fapt ne spune <code>n</code>, citit de la tastatură.</p>
<p>Programul din imagine citește <code>n</code>, apoi elementele: primul număr scris în consolă ajunge în <code>v[0]</code>, al doilea în <code>v[1]</code>, și tot așa. Rândul cu <code>for</code> repetă citirea pentru <code>i</code> = 0, 1, 2, …, până la <code>n - 1</code>; cum funcționează el înveți pe larg în nivelul următor. La final programul afișează trei elemente.</p>
${fig('cb-sir.webp',680,295,'Editorul Code::Blocks cu un program care citește n și cele n elemente ale șirului v, apoi afișează v[0], v[1] și v[n - 1]','Programul, deschis în Code::Blocks.')}
${fig('cb-consola-sir.webp',552,187,'Consola: s-au scris 5 și 4 7 2 9 5, iar programul afișează v[0] = 4, v[1] = 7 și v[4] = 5','În consolă: n = 5 și șirul 4 7 2 9 5. Ultimul element e <code>v[4]</code>, adică <code>v[n - 1]</code>.')}`,
   altfel:`<p>E ca la un dulap cu 100 de sertare numerotate de la 0: nu ești obligat să le umpli pe toate. Dacă ai doar 5 caiete, le pui în sertarele 0, 1, 2, 3, 4, iar pe un bilet scrii „am 5 caiete”. Biletul acela e <code>n</code>.</p>`,
   incearca:{t:'match',q:'Leagă fiecare termen de ce înseamnă.',pairs:[['element','o valoare din șir'],['indice','poziția unui element'],['n','numărul de elemente folosite'],['v[i]','elementul de pe poziția i']],ajutor:'Recitește pașii 2 și 3.',why:'Un șir are n elemente. Fiecare stă pe o poziție, iar v[i] îți dă valoarea de pe poziția i.'},
   inca:[
    {t:'choice',q:'Ce înseamnă 100 în declarația int v[100]; ?',o:['Câte elemente încap cel mult în șir','Câte elemente citește programul','Valoarea primului element','Ultimul indice folosit'],ok:0,ajutor:'Câte folosim de fapt ne spune altă variabilă.',why:'100 e locul rezervat. Câte elemente folosește programul ne spune n.'},
    {t:'choice',q:'În consolă scrii 3, apoi 6 2 8. Ce valoare ajunge în v[1]?',o:['2','6','8','3'],ok:0,ajutor:'3 e n. Primul element citit ajunge în v[0].',why:'n = 3; apoi 6 intră în v[0], 2 în v[1], 8 în v[2].'}
   ]}
 ],

  intro:`<p>Aici „rulezi” programul în gând, ca în Code::Blocks. Sus e programul, dedesubt ce scrii în consolă. <strong>Sarcina:</strong> pentru fiecare trecere prin buclă, scrie ce element ajunge în <code>v[i]</code>. La final, scrie ce afișează programul. Apoi apasă <b>Rulează testele</b>. Datele se schimbă la fiecare exercițiu.</p>`,

  {t:'choice',q:'Care situație se potrivește cel mai bine cu un șir de valori?',o:['Temperaturile unei săptămâni','Numele școlii tale','Vârsta ta de azi, în ani','Culoarea preferată a unui coleg'],ok:0,why:'Un șir ține mai multe valori de același tip, puse în ordine: 7 temperaturi, una pe zi. Celelalte sunt o singură valoare.'},

/* ================= 2. Citire, afișare, parcurgere (lecția 24) ================= */
{t:'Citire, afișare, parcurgere',lectii:[24],continuturi:[OPS],
 obiectiv:'citești un șir de la tastatură, îl afișezi și îl parcurgi de la primul la ultimul element și invers.',
 pasi:[
  {t:'Parcurgerea: trec pe la fiecare element',
   text:`<p>A <mark>parcurge</mark> un șir înseamnă a trece, pe rând, pe la fiecare element. Folosim instrucțiunea <code>for</code>, cu indicele <code>i</code> ca și contor:</p>
${pre('for (int i = 0; i < n; i++)\n    // aici lucrezi cu v[i]')}
<p>Citește-o așa: <code>i</code> pornește de la <code>0</code>; cât timp <code>i &lt; n</code>, face instrucțiunea; apoi <code>i++</code> îl crește cu 1.</p>
<p>Condiția e <code>i &lt; n</code>, nu <code>i &lt;= n</code>: ultimul indice bun e <code>n - 1</code>.</p>`,
   exemplu:`<p>Pentru n = 4, <code>i</code> ia pe rând valorile:</p>${pre('i = 0   0 < 4 da  -> lucrez cu v[0]\ni = 1   1 < 4 da  -> lucrez cu v[1]\ni = 2   2 < 4 da  -> lucrez cu v[2]\ni = 3   3 < 4 da  -> lucrez cu v[3]\ni = 4   4 < 4 NU  -> bucla se oprește')}`,
   altfel:`<p>E ca profesorul care strigă catalogul: începe cu primul elev, apoi trece la următorul, și tot așa, până la ultimul. Nu sare pe nimeni și nu strigă un elev care nu există. <code>i</code> e degetul care arată pe rând fiecare nume.</p>`,
   incearca:{t:'choice',q:`Ce valori ia i în bucla de mai jos, pentru n = 3?${C('for (int i = 0; i < n; i++)')}`,o:['0, 1, 2','1, 2, 3','0, 1, 2, 3','0, 1'],ok:0,ajutor:'i pornește de la 0 și se oprește când i < 3 nu mai e adevărat.',why:'0, 1 și 2 sunt mai mici decât 3. La i = 3 condiția e falsă și bucla se oprește.'},
   inca:[
    {t:'choice',q:`Ce valori ia i în bucla greșită de mai jos, pentru n = 3?${C('for (int i = 0; i <= n; i++)')}`,o:['0, 1, 2, 3','0, 1, 2','1, 2, 3','0, 1, 2, 3, 4'],ok:0,ajutor:'Cu <=, și i = 3 trece condiția.',why:'Cu i <= n, bucla trece și prin i = 3 = n. Dar v[3] nu e în șirul de 3 elemente.'}
   ]},
  {t:'Citirea: întâi n, apoi elementele',
   text:`<p>Programul trebuie să știe <strong>câte</strong> elemente urmează, ca bucla să știe unde să se oprească. De aceea se citește întâi <mark>n</mark>. Apoi, cu o parcurgere, se citește fiecare element în <code>v[i]</code>:</p>
${pre('int n, v[100];\ncin >> n;\nfor (int i = 0; i < n; i++)\n    cin >> v[i];')}
<p>La fiecare trecere, <code>cin &gt;&gt; v[i]</code> pune următorul număr scris în consolă în sertarul <code>i</code>.</p>`,
   exemplu:`<p>În consolă scrii <b>4</b>, apoi <b>3 8 1 6</b>. Se întâmplă:</p>${pre('n = 4\ni = 0: v[0] = 3\ni = 1: v[1] = 8\ni = 2: v[2] = 1\ni = 3: v[3] = 6')}`,
   incearca:{t:'tf',q:'Înainte de a citi elementele șirului, programul trebuie să știe câte sunt, deci n se citește primul.',ok:true,ajutor:'Până unde merge bucla for?',why:'Adevărat. Bucla for merge până la n, deci n trebuie să aibă deja o valoare când bucla pornește.'},
   inca:[
    {t:'choice',q:'În consolă scrii 5, apoi 2 4 6 8 10. Ce valoare are v[4] după citire?',o:['10','8','5','4'],ok:0,ajutor:'5 e n. Numără elementele de la indicele 0.',why:'v[0] = 2, v[1] = 4, v[2] = 6, v[3] = 8, v[4] = 10. 5 e n, nu un element.'}
   ]},
  {t:'Afișarea, cu spațiu între elemente',
   text:`<p>Afișarea e tot o parcurgere, cu <code>cout</code> în loc de <code>cin</code>:</p>
${pre('for (int i = 0; i < n; i++)\n    cout << v[i] << " ";')}
<p>Spațiul <code>" "</code> de după fiecare element e important. Fără el, numerele se lipesc: pentru 3 8 1 6 ar apărea <b>3816</b>, care pare un singur număr.</p>
<p>Ordinea rândurilor contează: declari, citești <code>n</code>, citești elementele, abia apoi afișezi. Nu poți afișa ce n-ai citit încă.</p>
${fig('cb-parcurgere.webp',700,335,'Code::Blocks: citirea șirului cu for, afișarea de la primul la ultimul element și afișarea inversă cu i de la n - 1 la 0','Citirea, afișarea și (jos) parcurgerea inversă, în același program.')}`,
   incearca:{t:'order',q:'Pune în ordine rândurile care citesc un șir și îl afișează.',items:['int n, v[100];','cin >> n;','for (int i = 0; i < n; i++) cin >> v[i];','for (int i = 0; i < n; i++) cout << v[i] << " ";'],ajutor:'Declari, afli câte sunt, le citești, apoi le afișezi.',why:'Declari, afli câte elemente sunt, le citești, apoi le afișezi. Nu poți afișa ce n-ai citit încă.'},
   inca:[
    {t:'choice',q:`Șirul e 5 1 7. Ce apare pe ecran cu codul de mai jos, fără spațiu?${C('for (int i = 0; i < n; i++)\n    cout << v[i];')}`,o:['517','5 1 7','7 1 5','5'],ok:0,ajutor:'Nu se afișează nimic între elemente.',why:'Fără " ", elementele se lipesc: 517. Pare un singur număr, deși sunt trei.'}
   ]},
  {t:'Parcurgerea inversă și din 2 în 2',
   text:`<p>Parcurgerea poate merge și <mark>invers</mark>, de la ultimul element la primul. Pornești de la ultimul indice, <code>n - 1</code>, și scazi câte 1 cât timp <code>i &gt;= 0</code>, adică până ajungi la indicele 0, inclusiv:</p>
${pre('for (int i = n - 1; i >= 0; i--)\n    cout << v[i] << " ";')}
<p><code>i--</code> scade <code>i</code> cu 1. Poți sări și din 2 în 2, cu <code>i = i + 2</code>: atunci treci doar pe la indicii 0, 2, 4…</p>
${fig('cb-consola-parcurgere.webp',552,167,'Consola: datele 4 și 3 8 1 6, apoi rândul 3 8 1 6 și rândul 6 1 8 3','Pentru 3 8 1 6: întâi afișarea în ordine, apoi, invers, <b>6 1 8 3</b>.')}`,
   exemplu:`<p>n = 4, șirul 3 8 1 6, parcurs invers:</p>${pre('i = 3 -> 6\ni = 2 -> 1\ni = 1 -> 8\ni = 0 -> 3\ni = -1: -1 >= 0 NU, bucla se oprește')}<p>Pe ecran: <b>6 1 8 3</b>.</p>`,
   altfel:`<p>E ca atunci când cobori scările: pornești de la ultimul etaj și cobori câte unul, până la parter (etajul 0). Nu cobori mai jos de parter.</p>`,
   incearca:{t:'choice',q:`Se citește n = 4 și șirul 3 8 1 6. Ce afișează codul?${C('for (int i = n - 1; i >= 0; i--)\n    cout << v[i] << " ";')}`,o:['6 1 8 3','3 8 1 6','1 8 3 6','6 8 1 3'],ok:0,ajutor:'Primul i este n - 1 = 3. Cât e v[3]?',why:'i pornește de la n - 1 = 3 și scade până la 0, deci elementele se afișează de la ultimul la primul.'},
   inca:[
    {t:'choice',q:`Ce afișează codul pentru șirul 2 4 6 8 10 (n = 5)?${C('for (int i = 0; i < n; i = i + 2)\n    cout << v[i] << " ";')}`,o:['2 6 10','4 8','2 4 6 8 10','2 6'],ok:0,ajutor:'i ia valorile 0, 2, 4. Cât e v[4]?',why:'i = 0, 2, 4 (la 6 se oprește). v[0] = 2, v[2] = 6, v[4] = 10.'},
    {t:'choice',q:'Ce valoare are i la prima trecere într-o parcurgere inversă a unui șir cu n = 7 elemente?',o:['6','7','0','1'],ok:0,ajutor:'Ultimul indice e n - 1.',why:'Parcurgerea inversă pornește de la ultimul indice: n - 1 = 6.'}
   ]}
 ],
 atelier:{t:'urmarire',titlu:'Parcurgerea inversă, pas cu pas',
  intro:`<p>Programul citește șirul, apoi îl afișează <strong>invers</strong>. <strong>Sarcina:</strong> pentru fiecare trecere prin a doua buclă, scrie valoarea lui <code>i</code> și elementul <code>v[i]</code>. La final, scrie tot ce apare pe ecran, cu spații între numere. Datele se schimbă la fiecare exercițiu.</p>`,

  inca:[{t:'urmarire',q:'Încă unul: acum i crește din 2 în 2. Scrie i și v[i] doar la trecerile care au loc.',
   cod:'for (int i = 0; i < n; i = i + 2)\n    cout << v[i] << " ";',
   date:[[5,10,15,20],[2,4,6,8,10],[9,1,8,2,7,3]],salt:2,scrie:['i','vi'],afis:'v.filter((x,k)=>k%2==0).join(" ")',
   ajutor:'i ia valorile 0, 2, 4… cât timp i < n.',why:'Cu i = i + 2, bucla trece doar pe la indicii pari: 0, 2, 4…'}]},
 qs:[
  {t:'tf',q:'Înainte de a citi elementele șirului, programul trebuie să știe câte sunt, deci n se citește primul.',ok:true,why:'Adevărat. Bucla for merge până la n, deci n trebuie să aibă deja o valoare când bucla pornește.'},
  {t:'order',q:'Pune în ordine rândurile care citesc un șir și îl afișează.',items:['int n, v[100];','cin >> n;','for (int i = 0; i < n; i++) cin >> v[i];','for (int i = 0; i < n; i++) cout << v[i] << " ";'],why:'Declari, afli câte elemente sunt, le citești, apoi le afișezi. Nu poți afișa ce n-ai citit încă.'},
  {t:'choice',q:`Se citește n = 5 și șirul 1 3 5 7 9. Ce afișează codul?${C('for (int i = n - 1; i >= 0; i--)\n    cout << v[i] << " ";')}`,o:['9 7 5 3 1','1 3 5 7 9','9 7 5 3','7 5 3 1'],ok:0,ajutor:'Parcurgerea inversă pornește de la n - 1 și ajunge până la 0.',why:'i pornește de la 4 și scade până la 0, inclusiv, deci apar toate cele 5 elemente, de la ultimul la primul.'},
  {t:'choice',q:'Ce greșeală are bucla for (int i = 0; i <= n; i++) cin >> v[i]; pentru un șir cu n elemente, indicii de la 0?',o:['Citește un element în plus, pe poziția n','Sare peste primul element, v[0]','Citește elementele în ordine inversă','Nu are nicio greșeală, e corectă'],ok:0,ajutor:'Ce valori ia i cu <= în loc de <?',why:'Cu i <= n, bucla trece și prin i = n, deci face n + 1 citiri. Pozițiile bune sunt doar 0 … n - 1.'},
  {t:'choice',q:`Ce afișează codul pentru șirul 5 10 15 20 (n = 4)?${C('for (int i = 0; i < n; i = i + 2)\n    cout << v[i] << " ";')}`,o:['5 15','10 20','5 10 15 20','5 10'],ok:0,why:'i ia valorile 0 și 2, apoi 4, când bucla se oprește. v[0] = 5 și v[2] = 15.'}
 ]},

/* ================= 3. Numărarea (lecția 25) ================= */
{t:'Numărarea',lectii:[25],continuturi:[ALG],
 obiectiv:'numeri elementele unui șir care au o proprietate, cu un contor, și scrii singur condiția potrivită.',
 pasi:[
  {t:'Contorul: pornește de la 0, crește cu 1',
   text:`<p>Algoritmul de <mark>numărare</mark> află <strong>câte</strong> elemente au o anumită proprietate (câte sunt pare, câte sunt de 10…).</p>
<p>Folosește un <mark>contor</mark>, o variabilă, de obicei <code>k</code>:</p>
<ol><li><strong>înainte</strong> de buclă, <code>k = 0</code>: încă n-am găsit nimic;</li>
<li>în buclă, la fiecare element potrivit, <code>k++</code>: crește cu 1;</li>
<li><strong>după</strong> buclă, afișezi <code>k</code>.</li></ol>
<p>Dacă ai pune <code>k = 0</code> în buclă, s-ar șterge la fiecare trecere și ai număra cel mult un element.</p>`,
   exemplu:`<p>Programul numără elementele <strong>pare</strong>. Condiția <code>v[i] % 2 == 0</code> înseamnă „v[i] se împarte exact la 2”, adică e par; o explicăm în pasul următor.</p>${pre('int k = 0;\nfor (int i = 0; i < n; i++)\n    if (v[i] % 2 == 0)\n        k++;\ncout << k;')}<p>Pentru 4 7 2 9 5: k pornește de la 0, devine 1 la 4, rămâne 1 la 7, devine 2 la 2, rămâne 2 la 9 și la 5. Se afișează <b>2</b>.</p>`,
   altfel:`<p>Stai la fereastră și numeri mașinile roșii. Pornești de la 0. Treci cu privirea pe la fiecare mașină: dacă e roșie, adaugi 1. Dacă nu, nu faci nimic. La final, numărul din minte e rezultatul. Nu o iei de la 0 la fiecare mașină!</p>`,
   incearca:{t:'tf',q:'Contorul k se pune la 0 înainte de buclă, nu în interiorul ei.',ok:true,ajutor:'Ce s-ar întâmpla cu k dacă l-ai face 0 la fiecare trecere?',why:'Adevărat. Dacă l-ai pune la 0 în buclă, s-ar șterge la fiecare pas și ai număra cel mult un element.'},
   inca:[
    {t:'choice',q:'Șirul e 6 3 8 10 1. Codul din „Uite cum” numără elementele pare. Cât afișează?',o:['3','2','4','24'],ok:0,ajutor:'Care dintre ele se împart exact la 2?',why:'Pare sunt 6, 8 și 10, deci k crește de 3 ori. 24 ar fi suma lor, nu numărul lor.'}
   ]},
  {t:'Condiția din if = proprietatea',
   text:`<p>Ce numeri decide <strong>condiția din if</strong>. Restul algoritmului rămâne la fel.</p>
<ul><li><code>v[i] % 2 == 0</code>: elementul e <strong>par</strong> (<code>%</code> dă restul împărțirii, iar la numerele pare restul la 2 e 0);</li>
<li><code>v[i] % 3 == 0</code>: elementul se împarte exact la 3;</li>
<li><code>v[i] &gt; 5</code>: elementul e mai mare decât 5 (5 nu intră; cu <code>&gt;=</code> ar intra);</li>
<li><code>v[i] == 10</code>: elementul e egal cu 10 (două semne egal!).</li></ul>
<p>Proprietatea e despre <strong>valoarea</strong> elementului, <code>v[i]</code>, nu despre poziția lui, <code>i</code>.</p>
${fig('cb-numarare.webp',680,340,'Code::Blocks: programul care citește șirul și numără elementele pare cu contorul k pornit de la 0','Numărarea elementelor pare, în Code::Blocks.')}
${fig('cb-consola-numarare.webp',552,147,'Consola: datele 5 și 4 7 2 9 5, apoi rezultatul 2','Pentru 4 7 2 9 5 sunt pare doar 4 și 2: se afișează <b>2</b>.')}`,
   incearca:{t:'choice',q:'Vrei să numeri elementele mai mari decât 5. Ce condiție pui în if?',o:['v[i] > 5','i > 5','v[i] >= 5','k > 5'],ok:0,ajutor:'Proprietatea e despre valoare, v[i]. „Mai mare decât 5” include sau nu pe 5?',why:'Proprietatea privește valoarea elementului, v[i], nu poziția i. „Mai mari decât 5” nu include 5, deci >, nu >=.'},
   inca:[

  {t:'Strategia: cum scrii o numărare',
   text:`<p>Când o problemă întreabă „<strong>câte</strong>…?”, urmezi 4 pași:</p>
<ol><li><strong>Găsește proprietatea</strong> din cerință: „câte temperaturi sunt <em>sub 0</em>”.</li>

<li><strong>Testează pe un șir mic</strong>: numără tu, cu degetul, și compară cu ce afișează programul.</li></ol>`,

/* ================= 4. Suma și produsul (lecția 26) ================= */
{t:'Suma și produsul',lectii:[26],continuturi:[ALG],
 obiectiv:'aduni și înmulțești elementele unui șir, alegi corect valoarea de pornire și calculezi media cu zecimale.',
 pasi:[
  {t:'Suma: s pornește de la 0',
   text:`<p>Algoritmul de <mark>sumă</mark> adună toate elementele. Folosește o variabilă <code>s</code>:</p>
<ol><li>înainte de buclă, <code>s = 0</code>: suma a „nimic” e 0, iar 0 nu schimbă o adunare;</li>
<li>la fiecare trecere, adaugi elementul curent: <code>s = s + v[i]</code>;</li>
<li>după buclă, <code>s</code> are suma tuturor.</li></ol>
${pre('int s = 0;\nfor (int i = 0; i < n; i++)\n    s = s + v[i];\ncout << s;')}`,
   exemplu:`<p>Pentru șirul 2 3 4, urmărești <code>s</code> după fiecare trecere:</p>${pre('înainte: s = 0\ni = 0: s = 0 + 2 = 2\ni = 1: s = 2 + 3 = 5\ni = 2: s = 5 + 4 = 9')}<p>Se afișează <b>9</b>.</p>`,
   altfel:`<p>E ca o pușculiță: la început e goală (0 lei). Pui pe rând fiecare monedă, iar suma din pușculiță crește cu valoarea ei. La final numeri ce e înăuntru.</p>`,
   incearca:{t:'choice',q:'Ce sumă se obține pentru șirul 4 7 2 9 5?',o:['27','5','25','22'],ok:0,ajutor:'Adună pe rând: 4 + 7 = 11, apoi mai departe.',why:'4 + 7 + 2 + 9 + 5 = 27. 5 e numărul de elemente, nu suma lor.'},
   inca:[
    {t:'choice',q:'Șirul e 10 -3 5. Cât este s după a doua trecere prin buclă (i = 1)?',o:['7','10','12','13'],ok:0,ajutor:'După prima trecere s = 10. Apoi adaugi -3.',why:'s = 0 + 10 = 10, apoi 10 + (-3) = 7. A treia trecere l-ar face 12.'}
   ]},
  {t:'Produsul: p pornește de la 1',
   text:`<p>Algoritmul de <mark>produs</mark> înmulțește elementele. Seamănă cu suma, cu două schimbări:</p>
<ul><li>în buclă înmulțești: <code>p = p * v[i]</code>;</li>
<li><code>p</code> pornește de la <strong>1</strong>, pentru că 1 nu schimbă o înmulțire.</li></ul>
<p>De ce nu de la 0? Pentru că 0 înmulțit cu orice dă 0: produsul ar rămâne 0, orice ar urma.</p>`,
   exemplu:`${pre('int p = 1;\nfor (int i = 0; i < n; i++)\n    p = p * v[i];')}<p>Pentru 2 3 4: p = 1, apoi 1 · 2 = 2, apoi 2 · 3 = 6, apoi 6 · 4 = <b>24</b>.</p>`,
   incearca:{t:'choice',q:'De la ce valoare pornește variabila p în algoritmul de produs?',o:['1','0','v[0] + 1','n'],ok:0,ajutor:'Ce număr nu schimbă nimic la înmulțire?',why:'1 e elementul neutru la înmulțire. Cu p = 0, orice înmulțire ar da tot 0.'},
   inca:[
    {t:'choice',q:'Cât este produsul elementelor șirului 3 2 5?',o:['30','10','0','325'],ok:0,ajutor:'3 · 2, apoi rezultatul · 5.',why:'3 · 2 = 6, apoi 6 · 5 = 30. 10 ar fi suma, iar 0 ar ieși doar dacă p pornea greșit de la 0.'},
    {t:'match',q:'Leagă fiecare algoritm de valoarea lui de pornire.',pairs:[['sumă','s = 0'],['produs','p = 1'],['numărare','k = 0']],ajutor:'Pornești de la valoarea care nu strică operația.',why:'0 pentru adunare și numărare, 1 pentru înmulțire.'}
   ]},
  {t:'Media: suma împărțită la n, cu zecimale',
   text:`<p>Cu suma afli și <mark>media</mark>: împarți suma la numărul de elemente, <code>n</code>.</p>
<p>Atenție la o capcană: când împarți două numere <code>int</code>, C++ păstrează doar <strong>câtul</strong>. <code>15 / 2</code> dă 7, nu 7.5.</p>
<p>Ca să păstrezi zecimalele, transformi suma în număr real înainte de împărțire: <code>(double)s / n</code>.</p>
${fig('cb-suma-produs.webp',680,430,'Code::Blocks: suma s pornită de la 0, produsul p pornit de la 1 și afișarea mediei cu (double)s / n','Suma, produsul și media, în același program.')}
${fig('cb-consola-suma-produs.webp',552,187,'Consola: datele 4 7 2 9 5, apoi suma = 27, produsul = 2520 și media = 5.4','Pentru 4 7 2 9 5: suma 27, produsul 2520 și media 27 / 5 = <b>5.4</b>, cu zecimale datorită lui <code>(double)</code>.')}`,
   altfel:`<p>Împărțirea între <code>int</code>-uri e ca împărțirea bomboanelor între copii: 15 bomboane la 2 copii înseamnă câte 7 fiecare (una rămâne). Pentru medie vrei „7 și jumătate”, deci îi spui calculatorului să lucreze cu zecimale: <code>(double)</code>.</p>`,
   incearca:{t:'tf',q:'Pentru șirul 7 8 (n = 2), cu s de tip int, calculul s / n dă 7.5.',ok:false,ajutor:'Ce păstrează împărțirea a două int?',why:'Fals. s = 15 și n = 2 sunt int, deci / dă câtul: 7. Pentru 7.5 calculezi (double)s / n.'},
   inca:[
    {t:'choice',q:'Șirul e 4 5 (n = 2), deci s = 9. Cât afișează (double)s / n?',o:['4.5','4','5','9'],ok:0,ajutor:'Cu (double), împărțirea păstrează zecimalele.',why:'9 / 2 cu zecimale e 4.5. Fără (double), ar fi 4.'}
   ]},
  {t:'Suma doar a unora',
   text:`<p>Poți aduna nu toate elementele, ci doar pe cele cu o proprietate. Combini suma cu un <code>if</code>, ca la numărare:</p>
${pre('int s = 0;\nfor (int i = 0; i < n; i++)\n    if (v[i] % 2 == 0)\n        s = s + v[i];')}
<p>Diferența față de numărare: la numărare adaugi <strong>1</strong> (<code>k++</code>), aici adaugi <strong>elementul</strong> (<code>s = s + v[i]</code>).</p>`,
   exemplu:`<p>Pentru 4 7 2 9 5, suma elementelor pare: s = 0, apoi 4 (4 e par), rămâne 4 la 7, devine 6 la 2, rămâne 6. Rezultat: <b>6</b>. Numărarea lor ar fi dat 2.</p>`,
   incearca:{t:'choice',q:'Cât este suma elementelor pare din șirul 3 8 1 6?',o:['14','2','18','4'],ok:0,ajutor:'Pare sunt 8 și 6. Adună-le.',why:'8 + 6 = 14. 2 ar fi câte sunt (numărarea), iar 18 e suma tuturor.'},
   inca:[
    {t:'choice',q:'Ce instrucțiune pui în if ca să aduni elementele mai mari decât 5?',o:['s = s + v[i];','k++;','s = s + i;','s = v[i];'],ok:0,ajutor:'Aduni elementul, nu poziția și nu 1.',why:'s = s + v[i] adaugă valoarea elementului. s = s + i ar aduna poziții, iar s = v[i] ar șterge suma de până atunci.'}
   ]}
 ],

  {t:'choice',q:'Cât este suma elementelor pare din șirul 5 2 9 4 10?',o:['16','3','30','14'],ok:0,ajutor:'Care sunt pare? Adună doar valorile lor.',why:'2 + 4 + 10 = 16. 3 ar fi câte sunt pare (numărarea), iar 30 e suma tuturor.'},

/* ================= 5. Minimul și maximul (lecția 27) ================= */
{t:'Minimul și maximul',lectii:[27],continuturi:[ALG],
 obiectiv:'afli cel mai mare și cel mai mic element al unui șir, chiar și când toate sunt negative, și poziția lor.',
 pasi:[
  {t:'Maximul: campionul de până acum',
   text:`<p>Ca să afli <mark>maximul</mark> (cel mai mare element), procedezi ca la un concurs:</p>
<ol><li><strong>presupui</strong> că primul element e cel mai mare: <code>mx = v[0]</code>;</li>
<li>îl compari pe rând cu fiecare element rămas, de la <code>i = 1</code>;</li>
<li>când găsești unul <strong>mai mare</strong>, el devine noul <code>mx</code>.</li></ol>
${pre('int mx = v[0];\nfor (int i = 1; i < n; i++)\n    if (v[i] > mx)\n        mx = v[i];')}
<p>Bucla pornește de la 1 pentru că <code>v[0]</code> e deja în <code>mx</code>.</p>`,
   exemplu:`<p>Pentru 4 7 2 9 5:</p>${pre('înainte:      mx = 4\ni = 1 (7):  7 > 4 da   -> mx = 7\ni = 2 (2):  2 > 7 nu   -> mx = 7\ni = 3 (9):  9 > 7 da   -> mx = 9\ni = 4 (5):  5 > 9 nu   -> mx = 9')}`,
   altfel:`<p>Ca la un concurs de înălțime: primul copil urcă pe podium. Vine următorul: dacă e mai înalt, îi ia locul; dacă nu, pleacă. La final, pe podium stă cel mai înalt dintre toți.</p>`,
   incearca:{t:'choice',q:'Ce valoare are mx la final pentru șirul 3 11 6 8?',o:['11','8','3','6'],ok:0,ajutor:'Pornește de la 3 și schimbă doar când găsești ceva mai mare.',why:'mx = 3, devine 11, apoi 6 și 8 nu sunt mai mari decât 11. Rămâne 11.'},
   inca:[
    {t:'choice',q:'De câte ori se schimbă mx (după ce a primit v[0]) pentru șirul 4 7 2 9 5?',o:['de 2 ori','o dată','de 4 ori','niciodată'],ok:0,ajutor:'Urmărește tabelul din „Uite cum”.',why:'mx se schimbă la 7 și la 9. La 2 și 5 rămâne neschimbat.'},
    {t:'choice',q:'De ce bucla pentru maxim pornește de la i = 1?',o:['v[0] e deja în mx, deci nu mai trebuie comparat','v[0] nu face parte din șir','Pentru că indicii încep de la 1','Ca să fie mai scurt codul, altfel dă eroare'],ok:0,ajutor:'Ce valoare a primit mx înainte de buclă?',why:'mx a primit deja valoarea lui v[0]. Dacă bucla ar porni de la 0, rezultatul ar fi același, doar ai face o comparație în plus.'}
   ]},
  {t:'De ce pornim de la v[0], nu de la 0',
   text:`<p>Ai putea fi tentat să scrii <code>mx = 0</code>. Merge pe numere pozitive, dar greșește pe cele negative.</p>
<p>Temperaturile de iarnă: -3 -8 -1 -5. Niciuna nu e mai mare decât 0, deci un maxim pornit de la 0 ar rămâne 0, un număr care <strong>nici nu e în șir</strong>. Maximul corect e -1.</p>
<p>Pornind de la <code>v[0]</code>, pornești de la un element adevărat al șirului, deci rezultatul e mereu unul dintre elemente.</p>
${fig('cb-consola-minmax.webp',552,167,'Consola: temperaturile -3 -8 -1 -5, apoi maxim = -1 și minim = -8','Test cu temperaturi de iarnă, toate negative: maximul corect e <b>-1</b>. Un maxim pornit de la 0 ar fi afișat 0.')}`,
   incearca:{t:'choice',q:'Temperaturile sunt -3 -8 -1 -5. Dacă mx ar porni de la 0 în loc de v[0], ce ar afișa programul?',o:['0','-1','-8','-3'],ok:0,ajutor:'Este vreun element mai mare decât 0?',why:'Niciun element nu e mai mare decât 0, deci mx rămâne 0. Maximul corect e -1 și îl obții dacă pornești de la v[0].'},
   inca:[
    {t:'tf',q:'Maximul pornit de la v[0] dă mereu un număr care se află în șir.',ok:true,ajutor:'De unde vin toate valorile pe care le primește mx?',why:'Adevărat. mx primește doar valori de elemente: întâi v[0], apoi elemente mai mari.'}
   ]},
  {t:'Minimul: aceeași idee, cu <',
   text:`<p><mark>Minimul</mark> (cel mai mic element) se află la fel: pornești de la <code>v[0]</code>, parcurgi restul și păstrezi elementul <strong>mai mic</strong>. Singura schimbare e semnul din comparație: <code>&lt;</code> în loc de <code>&gt;</code>.</p>
${pre('int mn = v[0];\nfor (int i = 1; i < n; i++)\n    if (v[i] < mn)\n        mn = v[i];')}
${fig('cb-minmax.webp',680,452,'Code::Blocks: maximul mx și minimul mn, amândouă pornite de la v[0], cu buclele de la i = 1','Maximul și minimul, amândouă pornite de la <code>v[0]</code>.')}`,
   incearca:{t:'tf',q:'Pentru minim, singura schimbare față de maxim este semnul din comparație: < în loc de >.',ok:true,ajutor:'Compară cele două bucăți de cod.',why:'Adevărat. Pornești tot de la v[0] și parcurgi restul șirului, dar păstrezi elementul mai mic.'},
   inca:[
    {t:'choice',q:'Ce valoare are mn la final pentru șirul 6 3 8 1 4?',o:['1','3','4','6'],ok:0,ajutor:'mn = 6, apoi se schimbă la fiecare element mai mic.',why:'mn = 6, devine 3, apoi 1. 8 și 4 nu sunt mai mici decât 1.'}
   ]},
  {t:'Unde e maximul? Poziția lui',
   text:`<p>Uneori vrei să știi și <strong>pe ce poziție</strong> e maximul (în ce zi a fost cel mai cald). Ții minte, alături de <code>mx</code>, și indicele lui, într-o variabilă <code>p</code>. Când schimbi <code>mx</code>, schimbi și <code>p</code>, deci ai nevoie de acolade: două instrucțiuni în același <code>if</code>.</p>
${pre('int mx = v[0], p = 0;\nfor (int i = 1; i < n; i++)\n    if (v[i] > mx)\n    {\n        mx = v[i];\n        p = i;\n    }')}`,
   exemplu:`<p>Pentru 4 7 2 9 5: la i = 1, mx = 7 și p = 1; la i = 3, mx = 9 și p = 3. Rezultat: maximul <b>9</b>, pe poziția <b>3</b> (a patra zi).</p>`,
   incearca:{t:'choice',q:'Pentru șirul 5 12 3 12 8, ce valoare are p la final (indicii de la 0)?',o:['1','3','4','12'],ok:0,ajutor:'Condiția e v[i] > mx. Al doilea 12 e MAI MARE decât 12?',why:'mx devine 12 la i = 1. Al doilea 12 nu e mai mare decât 12, deci p rămâne 1: prima apariție a maximului.'},

   ]}
 ],

/* ================= 6. Toți sau măcar unul? (lecția 28) ================= */
{t:'Toți sau măcar unul?',lectii:[28],continuturi:[ALG],
 obiectiv:'verifici dacă o proprietate e adevărată pentru toate elementele sau pentru cel puțin unul, cu o variabilă bool.',
 pasi:[
  {t:'Două întrebări diferite',
   text:`<p>Uneori nu vrei un număr, ci un răspuns <strong>da sau nu</strong>:</p>
<ul><li>„Au luat <mark>toți</mark> elevii cel puțin nota 5?”</li>
<li>„A luat <mark>măcar unul</mark> (cel puțin un elev) nota 10?”</li></ul>
<p>Răspunsul se ține într-o variabilă de tip <code>bool</code>, care are doar două valori: <code>true</code> (adevărat) sau <code>false</code> (fals).</p>
<p>Atenție: <code>cout</code> afișează un <code>bool</code> ca <b>1</b> (pentru true) sau <b>0</b> (pentru false).</p>`,
   altfel:`<p>„Toți au adus tema?” e altă întrebare decât „A adus cineva tema?”. Dacă 27 din 28 au adus-o, la prima răspunzi <b>nu</b>, la a doua <b>da</b>.</p>`,
   incearca:{t:'classify',q:'Ce fel de întrebare este?',cats:['Pentru toate','Pentru cel puțin unul'],items:[['Sunt toate temperaturile peste 0?',0],['Au toți elevii nota de trecere?',0],['Există vreo notă de 10?',1],['A fost măcar o zi cu ploaie?',1]],ajutor:'Caută cuvintele „toate/toți” și „există/vreo/măcar”.',why:'„Toate/toți” cere ca fiecare element să aibă proprietatea. „Există/vreo/măcar” cere un singur element.'},
   inca:[
    {t:'choice',q:'Variabila gasit e de tip bool și are valoarea true. Ce afișează cout << gasit; ?',o:['1','true','0','adevărat'],ok:0,ajutor:'Recitește ultima propoziție a pasului.',why:'cout afișează true ca 1 și false ca 0.'}
   ]},
  {t:'Pentru toate: presupun DA, caut un contraexemplu',
   text:`<p>Pornești de la <code>true</code> („da, toate”) și parcurgi șirul. Dacă găsești <strong>un singur</strong> element fără proprietate (un <mark>contraexemplu</mark>), răspunsul devine <code>false</code>.</p>
${pre('bool toate = true;\nfor (int i = 0; i < n; i++)\n    if (v[i] < 5)\n        toate = false;')}
<p>Codul verifică „toate notele sunt cel puțin 5”. Condiția din <code>if</code> descrie contraexemplul: o notă sub 5.</p>`,
   exemplu:`<p>Notele 7 9 4 8: la 7 și 9 nu se schimbă nimic; la 4 (sub 5), <code>toate</code> devine false; la 8 rămâne false. Răspuns: <b>false</b>.</p>`,
   altfel:`<p>E ca profesorul care întreabă „Ați adus toți tema?”: presupune că da. Trece printre bănci; e de ajuns un singur elev fără temă ca răspunsul să fie „nu”.</p>`,
   incearca:{t:'choice',q:'Notele sunt 7 9 4 8. Ce valoare are toate după codul din pas („toate notele ≥ 5”)?',o:['false','true','4','7'],ok:0,ajutor:'Există vreo notă sub 5?',why:'Nota 4 e mai mică decât 5, deci e un contraexemplu și toate devine false. Ajunge un singur element.'},
   inca:[
    {t:'choice',q:'Notele sunt 6 7 10 5. Ce valoare are toate la final?',o:['true','false','5','0'],ok:0,ajutor:'Căutăm o notă MAI MICĂ decât 5. 5 e mai mică decât 5?',why:'Nicio notă nu e sub 5 (5 nu e mai mic decât 5), deci toate rămâne true.'}
   ]},
  {t:'Cel puțin unul: presupun NU, caut un exemplu',
   text:`<p>Invers: pornești de la <code>false</code> („nu există”) și cauți <strong>un singur</strong> element cu proprietatea. Când îl găsești, răspunsul devine <code>true</code>.</p>
${pre('bool exista = false;\nfor (int i = 0; i < n; i++)\n    if (v[i] == 10)\n        exista = true;')}
${fig('cb-toate-exista.webp',680,452,'Code::Blocks: verificarea toate cu bool toate = true și verificarea există cu bool exista = false','Cele două verificări, în același program.')}
${fig('cb-consola-toate-exista.webp',552,167,'Consola: notele 7 9 4 10, apoi toate >= 5: 0 și exista un 10: 1','Pentru notele 7 9 4 10: nota 4 face <code>toate</code> fals (0), iar nota 10 face <code>exista</code> adevărat (1).')}`,
   incearca:{t:'choice',q:'Pentru notele 7 9 4 8, ce valoare are exista după codul din pas („există un 10”)?',o:['false','true','0 note','8'],ok:0,ajutor:'Este vreo notă egală cu 10?',why:'Niciun element nu e egal cu 10, deci exista rămâne false, cum a pornit.'},
   inca:[
    {t:'match',q:'Leagă fiecare întrebare de valoarea de pornire potrivită.',pairs:[['Sunt toate elementele pozitive?','ok = true, apoi caut un contraexemplu'],['Există măcar un element negativ?','gasit = false, apoi caut un exemplu'],['Câte elemente sunt negative?','k = 0, apoi număr']],ajutor:'„Toate” pornește de la da, „măcar unul” de la nu, „câte” de la zero.',why:'„Toate” pornește de la da, „măcar unul” pornește de la nu, iar „câte” pornește de la zero.'}
   ]},
  {t:'Greșeala cu else',
   text:`<p>O greșeală des întâlnită: să pui un <code>else</code> care „repară” răspunsul.</p>
${pre('bool toate = true;\nfor (int i = 0; i < n; i++)\n    if (v[i] < 5)\n        toate = false;\n    else\n        toate = true;   // GREȘIT')}
<p>Pentru notele 4 8: la 4, <code>toate</code> devine false; la 8, <code>else</code> îl pune înapoi pe true. Contraexemplul s-a pierdut! Rezultatul depinde doar de <strong>ultimul</strong> element.</p>
<p>Regula: odată ce ai găsit contraexemplul, răspunsul rămâne <code>false</code>. Deci <strong>fără else</strong>.</p>`,
   incearca:{t:'tf',q:'În codul pentru „toate”, dacă pui și un else toate = true;, rezultatul rămâne corect.',ok:false,ajutor:'Ce se întâmplă dacă după un element rău vine unul bun?',why:'Fals. Un element bun venit după unul rău ar pune toate înapoi pe true și ar ascunde contraexemplul. Odată false, trebuie să rămână false.'},
   inca:[
    {t:'hunt',cod:true,q:'Codul verifică dacă toate notele sunt cel puțin 5. Are <b>o</b> greșeală. Apasă pe ea.',src:`bool toate = true;
for (int i = 0; i < n; i++)
    if (v[i] < 5)
        toate = false;
    [[else|Else-ul pune toate înapoi pe true și șterge contraexemplul găsit.]]
        toate = true;`,corect:`bool toate = true;
for (int i = 0; i < n; i++)
    if (v[i] < 5)
        toate = false;`,ajutor:'Recitește regula de la finalul pasului.',why:'Odată găsit un contraexemplu, toate trebuie să rămână false: fără else.'}
   ]}
 ],
 atelier:{t:'urmarire',titlu:'Toate notele ≥ 5? Pas cu pas',
  intro:`<p><strong>Sarcina:</strong> scrie valoarea lui <code>toate</code> (true sau false) după fiecare trecere, apoi ce afișează <code>cout</code> la final (1 sau 0). Datele se schimbă la fiecare exercițiu.</p>`,

 qs:[
  {t:'choice',q:'Notele sunt 8 6 3 9. Ce valoare are toate după codul „toate notele ≥ 5”?',o:['false','true','3','8'],ok:0,ajutor:'Caută un contraexemplu: o notă sub 5.',why:'Nota 3 e mai mică decât 5, deci e un contraexemplu și toate devine false. Ajunge un singur element.'},
  {t:'choice',q:'Pentru notele 7 9 4 8, ce valoare are exista după codul „există un 10”?',o:['false','true','0 note','8'],ok:0,why:'Niciun element nu e egal cu 10, deci exista rămâne false, cum a pornit.'},
  {t:'match',q:'Leagă fiecare întrebare de valoarea de pornire potrivită.',pairs:[['Sunt toate elementele pare?','ok = true, apoi caut un contraexemplu'],['Există măcar un element par?','gasit = false, apoi caut un exemplu'],['Câte elemente sunt pare?','k = 0, apoi număr']],why:'„Toate” pornește de la da, „măcar unul” pornește de la nu, iar „câte” pornește de la zero.'},
  {t:'tf',q:'În codul pentru „toate”, dacă pui și un else toate = true;, rezultatul rămâne corect.',ok:false,why:'Fals. Un element bun venit după unul rău ar pune toate înapoi pe true și ar ascunde contraexemplul. Odată false, trebuie să rămână false.'},
  {t:'choice',q:'Pentru notele 7 9 4 10, ce afișează cout << exista; după codul „există un 10”?',o:['1','0','true','10'],ok:0,ajutor:'cout afișează un bool ca 1 sau 0.',why:'Nota 10 există, deci exista e true, iar cout îl afișează ca 1.'}

/* ================= 7. Combin și depanez (lecțiile 29-31) ================= */
{t:'În mediul de programare: combin și depanez',lectii:[29,30,31],continuturi:[OPS,ALG],
 obiectiv:'faci mai multe prelucrări într-o singură parcurgere, alegi teste care prind greșelile și urmărești programul pas cu pas în Code::Blocks.',
 pasi:[
  {t:'Mai multe prelucrări într-o parcurgere',
   text:`<p>Algoritmii se <mark>combină</mark>: în aceeași parcurgere poți face suma și, în același timp, să numeri elementele pare.</p>
${pre('int s = 0, k = 0;\nfor (int i = 0; i < n; i++)\n{\n    s = s + v[i];\n    if (v[i] % 2 == 0)\n        k++;\n}\ncout << s << " " << k;')}
<p>Pentru că în buclă sunt acum <strong>două</strong> instrucțiuni, ele stau între <mark>acolade</mark> <code>{ }</code>. Fără acolade, în buclă ar intra doar prima: suma s-ar face, dar <code>if</code>-ul ar rula o singură dată, după buclă.</p>`,
   exemplu:`<p>Pentru 3 6 1 8: s = 3, 9, 10, 18; k crește la 6 și la 8, deci k = 2. Pe ecran: <b>18 2</b>.</p>`,
   incearca:{t:'choice',q:'Ce valori au s și k după codul din pas, pentru șirul 3 6 1 8?',o:['s = 18, k = 2','s = 18, k = 4','s = 14, k = 2','s = 4, k = 18'],ok:0,ajutor:'s adună tot; k numără doar pe cele pare.',why:'3 + 6 + 1 + 8 = 18. Pare sunt 6 și 8, deci k = 2. O singură parcurgere face ambele lucruri.'},
   inca:[
    {t:'choice',q:'Același cod, șirul 2 5 4. Ce se afișează?',o:['11 2','11 3','6 2','2 11'],ok:0,ajutor:'Suma tuturor, apoi câte sunt pare.',why:'2 + 5 + 4 = 11; pare sunt 2 și 4, deci 2. cout afișează întâi s, apoi k.'}
   ]},
  {t:'Testarea: alege teste care prind greșeala',
   text:`<p>Un program care merge pe un exemplu nu e sigur corect pe toate. De aceea <mark>testezi</mark>, cu o strategie în 4 pași:</p>
<ol><li><strong>Un test mic</strong>, cu rezultatul calculat de tine pe hârtie.</li>
<li><strong>Un singur element</strong>: n = 1.</li>
<li><strong>Numai numere negative</strong>: prinde maximul pornit de la 0. Pentru minim e invers: un minim pornit de la 0 greșește pe numere <strong>numai pozitive</strong> (pe 4 9 6 ar da 0, care nici nu e în șir), deci îl testezi pe pozitive.</li>
<li><strong>Valori „la limită”</strong>: dacă cerința spune „≥ 5”, pune și un 5 în test.</li></ol>
<p>O greșeală se vede doar pe un test care <strong>ajunge</strong> la ea.</p>`,
   exemplu:`<p>Programul numără notele „cel puțin 5”, dar are greșit <code>v[i] &gt; 5</code>. Testul 7 8 9 dă 3, corect, deci nu prinde greșeala. Testul 5 7 5 dă 1 în loc de 3: acesta o prinde.</p>`,
   incearca:{t:'classify',q:'Ce test e bun pentru a prinde greșeala?',cats:['Prinde greșeala','Nu o prinde'],items:[['Maxim pornit de la 0, testat pe -4 -2 -9',0],['Maxim pornit de la 0, testat pe 3 8 5',1],['Produs pornit de la 0, testat pe 2 3',0],['Numărare cu v[i] > 5 în loc de v[i] >= 5, testată pe 5 7 5',0],['Numărare cu v[i] > 5 în loc de v[i] >= 5, testată pe 7 8 9',1]],ajutor:'Testul ajunge la greșeală? Maximul pornit de la 0 greșește doar pe negative; > în loc de >= doar când apare chiar 5.',why:'O greșeală se vede doar pe un test care ajunge la ea: maximul pornit de la 0 greșește pe numere negative, iar > în loc de >= greșește doar când în șir apare chiar 5. Produsul pornit de la 0 dă 0 pe orice șir.'},
   inca:[
    {t:'tf',q:'Dacă programul trece un test, sigur e corect pentru orice șir.',ok:false,ajutor:'Recitește ultima propoziție a pasului.',why:'Fals. Un test arată doar că programul merge pe acel exemplu. De aceea alegi mai multe teste, inclusiv cazuri speciale.'},
    {t:'choice',q:'Un minim a fost pornit greșit de la 0, nu de la v[0]. Pe ce test se vede greșeala?',o:['5 8 3 (numai pozitive)','-2 -7 -4 (numai negative)','-1 6 2 (amestecate)','pe niciun test'],ok:0,ajutor:'Pe ce date niciun element nu e mai mic decât 0?',why:'Pe 5 8 3 niciun element nu e mai mic decât 0, deci minimul rămâne 0 în loc de 3. Pe date cu negative, minimul iese corect și greșeala nu se vede.'}
   ]},
  {t:'Greșelile frecvente și cum le găsești',
   text:`<p>Trei greșeli apar cel mai des:</p>
<ol><li><mark>indice în afara șirului</mark>: <code>i &lt;= n</code> în loc de <code>i &lt; n</code>;</li>
<li>sumă sau contor care nu pornesc de la 0 (sau produs care nu pornește de la 1);</li>
<li>acolade uitate când în buclă sunt două instrucțiuni.</li></ol>
<p>Cu <code>i &lt;= n</code>, programul folosește <code>v[n]</code>, o căsuță cu o valoare necunoscută. Rezultatul iese un număr ciudat, uriaș:</p>
${fig('cb-dep-consola.webp',552,147,'Consola programului greșit: pentru 4 și 3 6 1 8 afișează 1877968038 3 în loc de 18 2','Programul din pasul 1, scris greșit cu <code>i &lt;= n</code>. Testul 3 6 1 8 trebuia să dea <b>18 2</b>.')}`,
   incearca:{t:'hunt',cod:true,q:'Programul lui Radu trebuie să afișeze suma elementelor. Are <b>2</b> greșeli. Apasă pe ele.',src:`int n, v[100], s;

   {k:'pagina',a:'www.muzeu-exemplu.ro/lupi-romania',ce:'Ești pe pagina credibilă (autor, dată, muzeu)',msg:'Pagina deschisă nu trece cele 4 întrebări. Caută una cu autor, dată și care te informează.'},
   {k:'fisa',camp:'autor',v:'dr. Ion Stan',ce:'În fișă: autorul paginii',msg:'Autorul din fișă nu e cel de pe pagina credibilă.'},
   {k:'fisa',camp:'data',v:'10.02.2026',ce:'În fișă: data paginii',msg:'Data din fișă nu e cea de pe pagina credibilă.'}],
  sol:[['cauta','lupi România număr'],['go','www.muzeu-exemplu.ro/lupi-romania'],['fisa','autor','dr. Ion Stan'],['fisa','data','10.02.2026']],
  gresit:[['cauta','câți lupi trăiesc în România'],['go','www.super-stiri-exemplu.ro/lupi']],
  solText:'pagina „Câți lupi trăiesc în România” de la muzeu, cu autorul dr. Ion Stan și data 10.02.2026.',
  why:'Pagina muzeului răspunde la toate 4 întrebările: are autor, are dată, te informează și spune la fel ca alte surse.',
  inca:[
   {t:'classify',q:'Încă una: ai căutat „lupi România”. Unde ai încredere?',cats:['Am încredere','Verific în altă sursă','Reclamă, sar peste'],items:[['Câți lupi trăiesc în România — muzeu, autor, dată',0],['INCREDIBIL!!! Nu vei crede câți lupi au invadat orașele!',1],['am o intrebare despre lupi — forum, fără nume',1],['Sponsorizat: Lup de pluș, reducere 50%',2]],ajutor:'Pune fiecărui rezultat cele 4 întrebări.',why:'Muzeul trece întrebările. Titlul care strigă și forumul anonim sunt semne de atenție. Reclama vinde.'}
  ]},
 qs:[
  {t:'tf',q:'Lacătul de lângă adresă arată că informația de pe pagină e verificată.',ok:false,ajutor:'Ce e „încuiat”: legătura sau informația?',why:'Fals. Lacătul și https arată doar că legătura e criptată.'},
  {t:'classify',q:'Semn de pagină credibilă sau semn de atenție?',cats:['Pagină credibilă','Semn de atenție'],items:[['Articol semnat de un profesor, cu dată',0],['Aceeași cifră apare și la un muzeu',0],['„Dă clic AICI ca să vezi pozele șocante!!!”',1],['„Doar azi! Cumpără acum!”',1],['Nu are autor și nici dată',1]],why:'Autorul, data și confirmarea sunt semne bune; titlurile care strigă, graba și lipsa autorului sunt semne de atenție.'},
  {t:'choice',q:'Un forum fără nume și enciclopedia spun lucruri diferite despre hrana ursului. Ce faci?',o:['Caut o a treia sursă de încredere','Cred forumul, pentru că e scris mai simplu','Aleg varianta care îmi place mai mult','Nu mai scriu nimic despre hrana ursului'],ok:0,ajutor:'Strategia când sursele nu se potrivesc.',why:'O a treia sursă de încredere lămurește. Forumul anonim nu trece întrebarea „Cine a scris?”.'},
  {t:'match',q:'Leagă fiecare întrebare de verificare de ce afli din ea.',pairs:[['Cine a scris?','dacă autorul se pricepe la subiect'],['Când?','dacă informația e recentă'],['De ce?','dacă pagina informează sau vinde'],['Mai spune cineva la fel?','dacă informația e confirmată']],why:'Patru întrebări scurte, puse la fiecare pagină, te feresc de cele mai multe informații greșite.'},
  {t:'choice',q:'Care dintre acestea e o dată personală pe care nu o dai?',o:['Parola contului tău','Culoarea ta preferată','Numele unui personaj din poveste','Anotimpul care îți place'],ok:0,why:'Parola deschide contul tău; cine o are poate intra în el în locul tău.'}
 ]},

/* ============ 7. Fișa despre lupul carpatin (final, lecțiile 14-16) ============ */
{t:'Fișa despre lupul carpatin',final:true,lectii:[14,15,16],continuturi:['- căutarea informațiilor pe Internet utilizând motoare de căutare;','- salvarea informațiilor de pe Internet','Drepturi de autor','Siguranța pe Internet'],
 obiectiv:'faci singur, de la cap la coadă, documentarea pentru o fișă: cauți, alegi surse credibile, salvezi cu nume clare și scrii bibliografia.',
 pasi:[
  {t:'Planul misiunii (strategie)',
   text:`<p><strong>Misiunea finală.</strong> La biologie faci o fișă despre <mark>lupul carpatin</mark>: ce mănâncă, unde trăiește și o fotografie. Tot ce ai învățat intră acum într-o singură lucrare.</p>
<p><b>Planul, în 5 pași:</b></p>
<ol><li>Scrii întrebările fișei: ce mănâncă? unde trăiește? ce fotografie pun?</li><li>Cauți pentru fiecare întrebare, cu 2-3 cuvinte-cheie.</li><li>Deschizi 2-3 pagini credibile și compari ce spun.</li><li>Salvezi în folderul tău: textul copiat, cu sursă, și o fotografie cu licență liberă, cu nume clare.</li><li>Scrii <mark>bibliografia</mark>: lista surselor.</li></ol>`,
   incearca:{t:'choice',q:'Care e primul pas al documentării?',o:['Scrii întrebările la care vrei să răspunzi','Salvezi prima fotografie găsită','Scrii bibliografia fișei','Deschizi primul rezultat al căutării'],ok:0,ajutor:'Înainte de orice căutare trebuie să știi ce cauți.',why:'Întrebările îți spun ce să cauți; fără ele cauți la întâmplare.'},
   inca:[
    {t:'tf',q:'Bibliografia se scrie la final, după ce ai adunat toate sursele.',ok:true,ajutor:'Al câtelea pas din plan e bibliografia?',why:'Adevărat. Bibliografia e ultimul pas: lista tuturor surselor folosite.'}
   ]},
  {t:'O căutare pentru fiecare întrebare',
   text:`<p>Fiecare întrebare din fișă primește căutarea ei. Folosești strategia cuvintelor-cheie: <b>despre cine</b> + <b>ce vrei să afli</b>, fără cuvinte de legătură.</p>
<ul><li>„Ce mănâncă?” → <code>lupul carpatin hrană</code></li><li>„Unde trăiește?” → <code>lupul carpatin unde trăiește</code></li><li>„O fotografie?” → <code>lup fotografie</code>, apoi verifici licența de sub fiecare poză.</li></ul>
<p>Ai grijă la minus: pus lângă cuvântul principal, scoate chiar ce cauți.</p>`,
   incearca:{t:'choice',q:'Ce scrii în motorul de căutare pentru partea despre hrană?',o:['lupul carpatin hrană','vreau o fișă despre lupi la biologie','lup','-lupul carpatin hrană'],ok:0,ajutor:'Despre cine + ce vrei să afli.',why:'Cuvintele-cheie spun exact ce cauți. Propoziția are cuvinte inutile, „lup” e prea larg, iar minusul ar scoate chiar cuvântul „lupul”.'},
   inca:[
    {t:'choice',q:'Ce scrii pentru partea „unde trăiește”?',o:['lupul carpatin unde trăiește','Bună ziua, unde trăiesc lupii, vă rog?','lup','-lupul carpatin'],ok:0,ajutor:'Uită-te la lista din pas.',why:'„lupul carpatin” spune despre cine, „unde trăiește” ce vrei să afli.'}
   ]},
  {t:'Alegi și salvezi',
   text:`<p>Din rezultate alegi doar pagini care trec cele 4 întrebări: <b>cine</b> a scris, <b>când</b>, <b>de ce</b>, <b>mai spune cineva la fel</b>.</p>
<p>Apoi salvezi:</p>
<ul><li>textul: îl selectezi, <kbd>Ctrl</kbd>+<kbd>C</kbd>, în document <kbd>Ctrl</kbd>+<kbd>V</kbd>, între ghilimele, cu sursa;</li><li>fotografia: doar una cu licență liberă, cu clic dreapta → Salvează imaginea ca…, în folderul tău, cu nume clar;</li><li>sub fotografie scrii autorul și licența.</li></ul>`,
   incearca:{t:'classify',q:'Ce păstrezi pentru fișă?',cats:['Păstrez','Las deoparte'],items:[['Textul de pe site-ul unui muzeu, cu autor și dată',0],['O fotografie cu licență liberă, cu numele fotografului',0],['Un articol dintr-o revistă științifică pentru copii, cu autor și dată',0],['Un comentariu fără nume: „lupii mănâncă doar iarbă”',1],['O imagine dintr-o reclamă, fără autor',1]],ajutor:'Are autor cunoscut? Ai voie să-l folosești?',why:'Păstrezi ce are autor cunoscut și ai voie să folosești. Comentariul anonim e și greșit (lupul mănâncă mai ales carne), iar imaginea din reclamă nu are voie de folosire.'},
   inca:[
    {t:'choice',q:'Ai găsit două fotografii bune. Pe care o pui în fișă?',o:['Pe cea cu licență liberă, scriind numele autorului','Pe cea mai colorată','Pe cea cu „© Toate drepturile rezervate”','Pe amândouă, fără nume'],ok:0,ajutor:'Strategia pentru imagini de la nivelul 5.',why:'Doar licența liberă îți dă voie; condiția ei e numele autorului.'}
   ]},
  {t:'Bibliografia',
   text:`<p>La finalul fișei scrii <mark>bibliografia</mark>: lista tuturor surselor. Fiecare sursă stă pe un rând, în această ordine:</p>
<p><b>autor, „titlul paginii”, adresa, data</b></p>
<p>Cine citește fișa trebuie să poată ajunge la aceeași pagină. De aceea:</p>
<ul><li>nu scrii „Google”: Google e motorul de căutare, nu sursa; scrii pagina pe care ai citit;</li><li>nu scrii „de pe net”: nu spune nimic; scrii adresa exactă;</li><li>și la fotografie scrii autorul și pagina de unde ai luat-o.</li></ul>
${fig('fisa-bibliografie.webp',1000,306,'Fișă scrisă într-un editor de text, cu titlul, două secțiuni scurte și bibliografia încadrată, în care fiecare sursă are autor, adresă și dată','Fișa terminată: sub text, <b>bibliografia</b>, fiecare sursă cu autorul, titlul, adresa și data.')}`,
   exemplu:`<div class="bib">1. dr. Ana Munteanu, „Lupul carpatin”, www.muzeu-exemplu.ro/lupul, 12.03.2026<br>2. Echipa Enciclopediei Exemplu, „Lupul (enciclopedie pentru copii)”, www.enciclopedie-exemplu.ro/lup, 05.01.2026</div>`,
   incearca:{t:'choice',q:'Care rând de bibliografie e complet?',o:['dr. Ana Munteanu, „Lupul carpatin”, www.muzeu-exemplu.ro/lupul, 12.03.2026','Google, pagina cu rezultatele despre lupul carpatin, 2026','de pe net, un site despre lupi citit la școală, 12.03.2026','„Lupul carpatin”, www.muzeu-exemplu.ro/lupul, fără autor și fără dată'],ok:0,ajutor:'Are toate cele 4 părți: autor, titlu, adresă, dată?',why:'Doar primul rând are autorul, titlul, adresa și data.'},
   inca:[
    {t:'tf',q:'La bibliografie scriu „Google”, pentru că acolo am găsit pagina.',ok:false,ajutor:'Recitește prima regulă din listă.',why:'Fals. Google e motorul de căutare; sursa e pagina pe care ai citit.'}
   ]}
 ],
 atelier:{t:'browser',titlu:'Documentarea completă, în browserul de probă',
  intro:`<p>Acum faci singur toată documentarea, ca la calculator. <strong>Sarcina:</strong></p>
<ol><li>caută cu 2-4 cuvinte-cheie ce mănâncă lupul carpatin;</li><li>deschide o pagină credibilă (nu reclama, nu titlul care strigă);</li><li>salvează fotografia de pe ea (are licență liberă) în <b>Scoala › Clasa_5 › TIC</b>, cu un nume clar;</li><li>completează fișa cu sursa: autorul, titlul, adresa și data <b>aceleiași</b> pagini.</li></ol>`,
  q:'Caută, alege o pagină credibilă, salvează fotografia și scrie sursa completă în fișă.',start:'nou',fisa:['autor','titlu','adresa','data'],
  ajutor:'Căutare: lupul carpatin hrană. Pagina muzeului sau a enciclopediei. Titlul e cel mare de pe pagină, autorul și data sunt dedesubt, adresa e în bara de adresă.',
  checks:[

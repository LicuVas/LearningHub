<style>
:root{
  --desk:#ECF1EF; --paper:#FFFFFF; --paper2:#EEF5F3; --line:#CFDDD9;
  --ink:#16292A; --ink2:#53686A; --accent:#136B66; --accentInk:#FFFFFF; --sel:#D5ECE8;
  --mark:#FFE08A; --markInk:#16292A; --ok:#23784A; --okbg:#E0F2E7; --bad:#BA3A2F; --badbg:#FBE6E3;
  --fd:"Bree Serif",Georgia,serif; --fb:"PT Sans","Segoe UI",system-ui,sans-serif; --fm:"Ubuntu Mono",Consolas,monospace;
  --card:#F7F1E3; --cardInk:#5B4A2A; --link:#1A5FB4; --adr:#23784A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1716; --paper:#172221; --paper2:#1F2D2B; --line:#2E403D;
  --ink:#E4EFED; --ink2:#9FB5B2; --accent:#62CFC5; --accentInk:#0F1716; --sel:#1F4541;
  --mark:#EDCB63; --markInk:#16292A; --ok:#6CCF96; --okbg:#173020; --bad:#FF877B; --badbg:#3A1E1B;
  --card:#2A2619; --cardInk:#E2D3AE; --link:#8AB8FF; --adr:#6CCF96;
}}
:root[data-theme="dark"]{
  --desk:#0F1716; --paper:#172221; --paper2:#1F2D2B; --line:#2E403D;
  --ink:#E4EFED; --ink2:#9FB5B2; --accent:#62CFC5; --accentInk:#0F1716; --sel:#1F4541;
  --mark:#EDCB63; --markInk:#16292A; --ok:#6CCF96; --okbg:#173020; --bad:#FF877B; --badbg:#3A1E1B;
  --card:#2A2619; --cardInk:#E2D3AE; --link:#8AB8FF; --adr:#6CCF96;
}
/* tema jocului: caseta unui motor de căutare + fișa de bibliotecă pe care se notează sursa */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;white-space:nowrap;overflow:hidden}
.cauta{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--accent);border-radius:999px;padding:3px 12px;font-family:var(--fm);font-size:.78rem;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.cauta b{color:var(--ink);font-weight:700}
.lupa{flex:none;position:relative;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%;margin-right:3px}
.lupa::after{content:"";position:absolute;right:-5px;bottom:-4px;width:6px;height:2px;background:var(--accent);transform:rotate(45deg)}
.fisa{flex:none;font-family:var(--fm);font-size:.66rem;letter-spacing:.04em;color:var(--cardInk);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);padding:1px 8px;border-radius:2px}
h1 .ghil{color:var(--accent)}
.hunt{font-size:1rem}
.hunt .tk{text-align:left}
/* exemple: un rând de rezultat, o bibliografie */
.rez-ex{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 12px;margin:6px 0}
.rez-ex .sp{font-size:.72rem;font-weight:700;color:var(--ink2)}
.rez-ex .ti{color:var(--link);font-weight:700}
.rez-ex .ad{font-family:var(--fm);font-size:.8rem;color:var(--adr);overflow-wrap:anywhere}
.bib{font-family:var(--fm);font-size:.88rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 12px;overflow-wrap:anywhere}

/* ================= SIMULATORUL: browserul „de probă” ================= */
.br{display:flex;flex-direction:column;gap:10px;font-family:var(--fb);text-align:left}
.br-win{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.br-tabs{display:flex;align-items:flex-end;gap:4px;padding:6px 6px 0;background:var(--desk);overflow-x:auto}
.br-tab{display:flex;align-items:center;flex:0 1 150px;min-width:0;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--paper2);font-size:.78rem;color:var(--ink2)}
.br-tab.on{background:var(--paper);color:var(--ink);font-weight:700}
.br-tab button{background:none;border:0;color:inherit;font:inherit;padding:6px 7px;cursor:pointer;min-height:34px}
.br-tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;text-align:left}
.br-tab .x{flex:none;padding:6px 8px}
.br-plus{flex:none;border:0;background:none;color:var(--ink);font-size:1.25rem;line-height:1;width:34px;height:34px;cursor:pointer;border-radius:50%}
.br-bar{display:flex;align-items:center;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--paper)}
.br-bar .ico{flex:none;width:32px;height:34px;border-radius:8px;border:0;background:none;color:var(--ink);font-size:1.05rem;cursor:pointer;padding:0}
.br-bar .ico:disabled{opacity:.3;cursor:default}
.br-bar .ico.fav-on{color:#D08A00}
.br-bar form{flex:1 1 auto;min-width:0;display:flex;gap:2px}
.br-bar input{flex:1 1 auto;min-width:0;width:40px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-family:var(--fm);font-size:.85rem;background:var(--paper2);color:var(--ink)}
.br-bar .enter{flex:none;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:8px;font-size:.72rem;padding:0 6px;height:34px;cursor:pointer}
@media (max-width:600px){ /* pe telefon: butoanele pe un rând, bara de adresă pe rândul ei */
  .br-bar{flex-wrap:wrap}
  .br-bar form{order:10;flex:1 1 100%;margin-top:4px}
  .br-bar .sp{flex:1 1 auto}
}
.br-favbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--ink2);background:var(--paper)}
.br-favbar button{border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:6px;font:inherit;padding:2px 8px;cursor:pointer}
.br-menu{margin:0 6px 6px auto;max-width:260px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.18);padding:4px 0}
.br-menu button,.br-ctx button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:.88rem;padding:8px 14px;cursor:pointer}
.br-menu button:hover,.br-ctx button:hover{background:var(--sel)}
.br-menu kbd{float:right;font-size:.75rem}
.br-page{padding:12px 14px;min-height:170px;font-size:.93rem;line-height:1.45;overflow-wrap:anywhere;background:var(--paper);color:var(--ink)}
.br-page p{margin:.5em 0}
.br-site{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.br-h{font-family:var(--fd);font-size:1.25rem;margin:.2em 0 .3em}
.br-meta{font-size:.82rem;color:var(--ink2);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.br-a{border:0;background:none;color:var(--link);text-decoration:underline;font:inherit;padding:2px 0;cursor:pointer}
.br-img{position:relative;margin:10px 0;max-width:320px}
.br-img svg{display:block;width:100%;height:auto;border-radius:6px}
.br-img figcaption{font-size:.78rem;color:var(--ink2);margin-top:4px}
.br-rc{margin-top:6px;border:1px dashed var(--ink2);background:var(--paper2);color:var(--ink);border-radius:6px;font:inherit;font-size:.78rem;padding:4px 10px;cursor:pointer}
.br-ctx{position:absolute;left:12px;top:24px;z-index:3;min-width:210px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px 0}
.br-nou{text-align:center;padding:18px 4px}
.br-logo{font-family:var(--fd);font-size:1.6rem;color:var(--accent);margin-bottom:10px}
.br-logo b{color:var(--ink)}
.br-sf{display:flex;gap:6px;max-width:440px;margin:0 auto}
.br-sf input{flex:1 1 auto;min-width:0;width:40px;border:1.5px solid var(--accent);border-radius:999px;padding:8px 14px;font-family:var(--fb);font-size:.95rem;background:var(--paper);color:var(--ink)}
.br-sf button{flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accentInk);font:inherit;font-weight:700;padding:0 14px;cursor:pointer}
.br-sf.sus{margin:0 0 10px;max-width:none}
.br-mic{font-size:.8rem;color:var(--ink2)}
.br-res{padding:8px 0;border-bottom:1px solid var(--line)}
.br-spons{display:inline-block;font-size:.72rem;font-weight:700;color:var(--ink);background:var(--card);border-radius:4px;padding:0 6px;margin-bottom:2px}
.br-rt{display:block;border:0;background:none;color:var(--link);font:inherit;font-weight:700;font-size:1rem;text-align:left;padding:2px 0;cursor:pointer}
.br-ra{font-family:var(--fm);font-size:.8rem;color:var(--adr)}
.br-rs{font-size:.85rem;color:var(--ink2)}
.br-err{text-align:center;padding:24px 8px}
.br-err b{font-family:var(--fm)}
.br-ad{border:2px solid #D08A00;border-radius:8px;padding:10px;background:var(--card);color:var(--cardInk)}
.br-strig{font-family:var(--fd);font-size:1.3rem;color:var(--bad)}
.br-dlg{border-top:3px solid var(--accent);background:var(--paper2);padding:10px 12px}
.br-dlg .dt{font-weight:700;margin-bottom:6px}
.br-dlg .fold{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.br-dlg .fold button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;font:inherit;font-size:.82rem;padding:5px 9px;cursor:pointer}
.br-dlg .fold button.on{border-color:var(--accent);background:var(--sel);font-weight:700}
.br-dlg label{display:block;font-size:.85rem}
.br-dlg input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--fm);font-size:.9rem;background:var(--paper);color:var(--ink);margin:3px 0 8px}
.br-dlg .bt{display:flex;gap:8px;justify-content:flex-end}
.br-msg{font-size:.82rem;padding:6px 12px;background:var(--okbg);color:var(--ink);border-top:1px solid var(--line)}
.br-panou{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;font-size:.88rem}
.br-panou .lbl{font-weight:700;margin-bottom:4px}
.br-fisa{border-top:4px solid var(--accent);background:var(--card);color:var(--cardInk)}
.br-fisa label{display:block;margin:4px 0}
.br-fisa input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--fm);font-size:.9rem;background:var(--paper);color:var(--ink);margin-top:2px}
.br-files{font-family:var(--fm);font-size:.82rem;overflow-wrap:anywhere}
.br-teste{list-style:none;margin:0;padding:0}
.br-teste li{position:relative;padding:3px 0 3px 26px}
.br-teste li::before{content:"";position:absolute;left:2px;top:6px;width:14px;height:14px;border:2px solid var(--ink2);border-radius:3px}
.br-teste li.ok{color:var(--ok)}
.br-teste li.ok::before{border-color:var(--ok);background:var(--ok)}
.br-teste li.ok::after{content:"";position:absolute;left:7px;top:8px;width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
</style>

const N=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const ADR=s=>N(s).replace(/^https?:\/\//,'').replace(/\/+$/,'');
const CURAT=s=>N(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const STEM=w=>w.length>4?w.slice(0,w.length-1):w;
const STOP=new Set('si de ce despre vreau as sa stiu un o la in pe cu este e cum din pentru mi imi eu ziua buna va rog sunt si'.split(' '));
function parseQ(q){const fr=[],minus=[],w=[];
  String(q).replace(/["„“”]([^"„“”]*)["„“”]|(\S+)/g,(m,a,c)=>{if(a!=null){const f=N(a);if(f)fr.push(f)}else if(c.length>1&&c[0]==='-')minus.push(N(c.slice(1)));else if(c!=='-')w.push(N(c).replace(/[^a-z0-9]/g,''));return ''});
  return {fr,minus,w:w.filter(Boolean)}}
function idx(p){return N([p.titlu,p.site,p.cuv,(p.text||[]).join(' '),p.autor||''].join(' '))}
function cauta(q){
  const P=parseQ(q),out=[];
  Object.entries(SITE).forEach(([a,p])=>{
    const t=idx(p),tok=t.split(/[^a-z0-9]+/);
    if(P.fr.some(f=>!t.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').includes(f.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim())))return;
    if(P.minus.some(m=>tok.some(x=>x.startsWith(STEM(m)))))return;
    const scor=P.w.filter(x=>!STOP.has(x)).filter(x=>tok.some(y=>y.startsWith(STEM(x)))).length+P.fr.length*2;
    if(scor>0)out.push({a,p,scor});
  });
  /* ca un motor adevărat: sus paginile care se potrivesc cu cele mai multe cuvinte; cele slabe nu mai apar */
  const best=Math.max(0,...out.map(r=>r.scor)),prag=Math.ceil(best*0.67);
  return out.filter(r=>r.scor>=prag).sort((x,y)=>(y.p.reclama?1:0)-(x.p.reclama?1:0)||y.scor-x.scor);
}
function numeBun(n){const x=N(n);return /^[a-z0-9_.\-]+\.(jpg|jpeg|png|webp|html)$/.test(x)&&(x.match(/[a-z]/g)||[]).length>=5&&!/^(imagine|image|img|poza|foto|dsc|download|descarcare)[\d()_\-]*\./.test(x)}

 render(Q,body,api){

  function ev(c){

     case 'cautare':{if(!S.q)return false;const P=parseQ(S.q),all=P.w.concat(...P.fr.map(f=>f.split(' ')));

   exemplu:`<p>Îi trimiți bunicii o poză. Poza pleacă din telefonul tău, trece prin Wi-Fi-ul de acasă, apoi prin multe calculatoare legate între ele, și ajunge pe telefonul bunicii în câteva secunde. Tot acest drum este Internetul.</p>`,
   altfel:`<p>Gândește-te la o hartă cu drumuri. Orașele sunt dispozitivele, iar drumurile sunt legăturile dintre ele. Internetul este toată rețeaua de drumuri a lumii: de oriunde poți ajunge oriunde.</p>`,
   incearca:{t:'tf',q:'Un telefon fără Wi-Fi, fără cablu și fără date mobile poate intra pe Internet.',ok:false,ajutor:'Recitește ultimul paragraf: de ce are nevoie dispozitivul?',why:'Fals. Fără o conexiune (Wi-Fi, cablu sau date mobile), dispozitivul nu e legat de rețea.'},
   inca:[
    {t:'choice',q:'Ce este Internetul?',o:['O rețea care leagă dispozitive din toată lumea','Un program instalat pe calculator','Un singur site cu informații','Cablul din spatele calculatorului'],ok:0,ajutor:'Cuvântul-cheie al pasului este „rețea”.',why:'Internetul este rețeaua: leagă între ele milioane de dispozitive și rețele mai mici.'}
   ]},
  {t:'Primele servicii: web și e-mail',
   text:`<p>Pe rețeaua Internet funcționează mai multe <mark>servicii</mark>. Un serviciu este un fel anume de a folosi rețeaua. Primele două:</p>
<ul><li><strong>World Wide Web</strong> (pe scurt, <mark>web</mark>): paginile și site-urile pe care le citești;</li>
<li><strong>poșta electronică</strong> (<mark>e-mail</mark>): trimiți un mesaj la o adresă de e-mail, ca pe o scrisoare. O adresă de e-mail are mereu semnul <code>@</code>, de exemplu <code>clasa5b@scoala-exemplu.ro</code>.</li></ul>
${fig('pagina-web.webp',1000,550,'Fereastra browserului Google Chrome cu o pagină de enciclopedie deschisă: fila de sus, bara de adresă și textul paginii','Serviciul <b>web</b>, așa cum se vede: o pagină deschisă în browser.')}`,
   exemplu:`<p><b>Web:</b> Ioana citește pe site-ul unui muzeu despre dinozauri.<br><b>E-mail:</b> profesorul trimite tema la adresa clasei, iar fiecare elev o primește în căsuța lui de e-mail.</p>`,
   incearca:{t:'choice',q:'Maria citește programul bibliotecii pe site-ul ei. Ce serviciu folosește?',o:['Web-ul','E-mailul','Niciun serviciu'],ok:0,ajutor:'Citește pagini sau trimite un mesaj la o adresă?',why:'Paginile și site-urile sunt serviciul web.'},
   inca:[
    {t:'tf',q:'O adresă de e-mail are semnul @.',ok:true,ajutor:'Uită-te la exemplul de adresă din pas.',why:'Adevărat. Semnul @ desparte numele de numele serverului de e-mail.'},
    {t:'choice',q:'Clubul de șah îți trimite o invitație la adresa ta de e-mail. Ce serviciu folosește?',o:['Poșta electronică (e-mail)','Web-ul','Niciun serviciu'],ok:0,ajutor:'Mesajul ajunge la o adresă cu @.',why:'Un mesaj trimis la o adresă de e-mail folosește poșta electronică.'}
   ]},
  {t:'Mesagerie, cloud și streaming',
   text:`<p>Alte trei servicii pe care le folosești des:</p>
<ul><li><mark>mesageria instantanee</mark>: vorbești pe loc, în scris, prin mesaj vocal sau prin apel video;</li>
<li><mark>stocarea în cloud</mark>: îți păstrezi fișierele pe un calculator al unei firme (un <b>server</b>), le deschizi de pe orice dispozitiv și le poți da și altora;</li>
<li><mark>streamingul</mark>: asculți muzică sau vezi un film în timp ce sosește, fără să aștepți să se descarce tot.</li></ul>`,
   exemplu:`<p>Radu vorbește video cu bunica: <b>mesagerie</b>.<br>Ana își pune proiectul în cloud acasă și îl deschide la școală: <b>cloud</b>.<br>Mihai vede un documentar online: <b>streaming</b>.</p>`,
   altfel:`<p>Cloudul este ca un dulap al tău într-o clădire păzită, departe de casă: pui lucrurile acolo și le poți lua de oriunde, dacă ai cheia (contul și parola).</p><p>Streamingul este ca un robinet: apa (filmul) curge cât timp îl ții deschis, nu trebuie să umpli întâi o cadă.</p>`,
   incearca:{t:'match',q:'Leagă fiecare serviciu de ce faci cu el.',pairs:[['Mesageria instantanee','vorbești pe loc, în scris sau video'],['Stocarea în cloud','îți păstrezi fișierele pe un server'],['Streamingul','vezi un film în timp ce sosește']],ajutor:'Recitește lista din pas: fiecare rând începe cu numele serviciului.',why:'Mesageria = conversație pe loc; cloudul = fișierele tale păstrate pe un server; streamingul = privești sau asculți fără să descarci tot.'},
   inca:[
    {t:'choice',q:'Vrei să vezi un documentar fără să aștepți să se descarce tot filmul. Ce serviciu folosești?',o:['Streamingul','Poșta electronică','Mesageria instantanee'],ok:0,ajutor:'Care serviciu îți arată filmul „în timp ce sosește”?',why:'La streaming, filmul sosește bucată cu bucată și îl vezi în timp ce restul încă vine.'},
    {t:'choice',q:'Vrei să deschizi la școală proiectul făcut acasă, fără stick. Ce serviciu te ajută?',o:['Stocarea în cloud','Streamingul','Mesageria instantanee'],ok:0,ajutor:'Ce serviciu îți păstrează fișierele ca să le deschizi de pe orice dispozitiv?',why:'În cloud, fișierul stă pe un server și îl deschizi de oriunde, cu contul tău.'}
   ]},
  {t:'Cum recunoști serviciul (strategie)',
   text:`<p>Când citești o situație, pune-ți întrebările de mai jos, <b>în ordine</b>. Prima la care răspunzi „da” îți spune serviciul:</p>
<ol><li>Citește pagini sau site-uri? → <b>web</b></li>
<li>Trimite un mesaj la o adresă cu @? → <b>e-mail</b></li>
<li>Vorbește pe loc cu cineva? → <b>mesagerie instantanee</b></li>
<li>Își păstrează fișierele ca să le ia de oriunde? → <b>cloud</b></li>
<li>Privește sau ascultă fără să descarce tot? → <b>streaming</b></li></ol>`,
   exemplu:`<p>„Mama primește o factură ca atașament la adresa ei.”</p><p>Întrebarea 1: citește o pagină? Nu. Întrebarea 2: un mesaj la o adresă cu @? <b>Da → e-mail.</b></p>`,
   incearca:{t:'classify',q:'Ce serviciu folosește fiecare?',cats:['Web','E-mail','Mesagerie instantanee'],items:[['Doi colegi își scriu pe loc în chat',2],['Bunicul citește știrile pe un site',0],['Școala trimite anunțul la adresa de e-mail a părinților',1],['Sora ta face un apel video cu prietena ei',2]],ajutor:'Pune pe rând cele cinci întrebări din pas, începând cu prima.',why:'Pagini = web; mesaj la o adresă cu @ = e-mail; conversație pe loc = mesagerie.'},
   inca:[
    {t:'classify',q:'Cloud sau streaming?',cats:['Cloud','Streaming'],items:[['Asculți o melodie online, fără s-o descarci',1],['Îți păstrezi pozele din excursie pe un server',0],['Vezi un meci în direct pe tabletă',1],['Deschizi acasă tema salvată la școală, în contul tău',0]],ajutor:'Întrebările 4 și 5 din pas: își păstrează fișiere sau privește/ascultă?',why:'Cloudul păstrează fișierele tale; streamingul îți aduce muzica sau filmul cât îl urmărești.'}
   ]},
  {t:'Internetul nu e același lucru cu web-ul',
   text:`<p>Mulți spun „intru pe net” și „intru pe web” ca și cum ar fi totuna. Nu sunt!</p>
<p><mark>Internetul</mark> este <b>rețeaua</b>: legăturile dintre dispozitive. <mark>Web-ul</mark> este doar <b>unul dintre serviciile</b> care circulă pe această rețea, la fel ca e-mailul, mesageria, cloudul și streamingul.</p>
<p>De aceea, niciun serviciu nu merge fără conexiune la Internet. Dar poți folosi Internetul fără să deschizi vreo pagină web, de exemplu doar vorbind pe mesagerie.</p>`,
   altfel:`<p>Internetul este rețeaua de drumuri. Serviciile sunt vehiculele care circulă pe ea: web-ul e autobuzul, e-mailul e mașina poștei, streamingul e trenul cu filme. Autobuzul nu este drumul; e doar unul dintre vehicule.</p>`,
   incearca:{t:'tf',q:'Web-ul este unul dintre serviciile Internetului.',ok:true,ajutor:'Recitește a doua propoziție: ce este web-ul?',why:'Adevărat. Web-ul este un serviciu; Internetul este rețeaua pe care circulă toate serviciile.'},
   inca:[
    {t:'choice',q:'Fără ce nu poate funcționa niciunul dintre servicii?',o:['Fără o conexiune la Internet','Fără un cont de e-mail','Fără o imprimantă','Fără un stick'],ok:0,ajutor:'Toate serviciile circulă prin aceeași rețea.',why:'Toate serviciile circulă prin rețea, deci au nevoie de conexiune.'}
   ]}
 ],
 atelier:{t:'classify',titlu:'Ziua lui Radu pe Internet',
  intro:`<p>Aplică strategia din pasul 4 la fiecare situație din ziua lui Radu. <strong>Sarcina:</strong> pune fiecare situație la serviciul ei, apoi apasă <b>Verifică</b>.</p>`,
  q:'Ce serviciu folosește Radu?',cats:['Web','E-mail','Mesagerie instantanee','Cloud'],
  items:[['Dimineața citește pe site-ul școlii orarul zilei',0],['Primește de la dirigintă un mesaj la adresa lui cu @',1],['În pauză le scrie pe loc colegilor pe chat',2],['Își pune proiectul pe server, ca să-l deschidă acasă',3],['Seara caută pe un site cum se face un avion de hârtie',0],['Vorbește video cu verișoara din Italia',2]],
  ajutor:'Pentru fiecare situație, întreabă-te pe rând: pagini? adresă cu @? vorbește pe loc? își păstrează fișierele?',
  why:'Pagini = web; mesaj la adresă = e-mail; conversație pe loc = mesagerie; fișiere păstrate pe un server = cloud.',
  inca:[{t:'classify',q:'Încă o zi: ce serviciu folosește Ana?',cats:['Streaming','Web','Cloud'],items:[['Ascultă un podcast online în autobuz',0],['Citește pe un site programul muzeului',1],['Își salvează pozele din tabără în contul ei de pe server',2],['Vede un film online, fără să-l descarce',0]],ajutor:'Privește sau ascultă ceva care sosește? Citește o pagină? Își păstrează fișierele?',why:'Streamingul aduce sunetul și filmul pe loc; paginile sunt web; fișierele păstrate pe server sunt cloud.'}]},
 qs:[
  {t:'tf',q:'Internetul și World Wide Web-ul sunt două nume pentru același lucru.',ok:false,ajutor:'Care dintre ele este rețeaua și care este un serviciu?',why:'Fals. Internetul este rețeaua care leagă dispozitivele. Web-ul este un serviciu care folosește această rețea, la fel ca e-mailul sau mesageria.'},
  {t:'match',q:'Leagă fiecare serviciu de ce faci cu el.',pairs:[['World Wide Web','citești pagini și site-uri'],['Poșta electronică','trimiți un mesaj la o adresă de e-mail'],['Mesageria instantanee','vorbești pe loc, în scris sau video'],['Streamingul','vezi un film fără să-l descarci întâi'],['Stocarea în cloud','îți păstrezi fișierele pe un server']],why:'Fiecare serviciu răspunde unei nevoi din viața de zi cu zi: să afli ceva, să trimiți o scrisoare, să vorbești, să privești, să păstrezi.'},
  {t:'classify',q:'Ce serviciu folosește fiecare?',cats:['Web','E-mail','Mesagerie instantanee'],items:[['Ioana citește pe site-ul unui muzeu despre dinozauri',0],['Profesorul trimite tema la adresa de e-mail a clasei',1],['Radu vorbește video cu bunica',2],['Maria caută programul bibliotecii pe site-ul ei',0],['Mama primește o factură ca atașament la adresa ei',1],['Doi colegi își scriu pe loc în chat',2]],ajutor:'Folosește strategia: pagini? adresă cu @? vorbește pe loc?',why:'Pagini și site-uri = web. Un mesaj trimis la o adresă de e-mail = poștă electronică. O conversație pe loc = mesagerie instantanee.'},
  {t:'choice',q:'Vrei să asculți o melodie online, fără să o descarci întâi. Ce serviciu folosești?',o:['Streamingul','Poșta electronică','Stocarea în cloud','Mesageria instantanee'],ok:0,why:'La streaming, muzica sosește bucată cu bucată și o asculți pe loc.'},
  {t:'choice',q:'Care dintre acestea este o adresă de e-mail?',o:['elev@scoala-exemplu.ro','www.scoala-exemplu.ro','scoala exemplu','scoala-exemplu.ro/elev'],ok:0,ajutor:'Ce semn are mereu o adresă de e-mail?',why:'Adresa de e-mail are semnul @. Celelalte sunt adrese de site sau simple cuvinte.'}
 ]},

/* ============ 2. Navighez pe web (lecția 14) ============ */
{t:'Navighez pe web',lectii:[14],continuturi:['Serviciul World Wide Web:','- navigarea pe Internet;'],
 obiectiv:'deschizi o pagină după adresa ei, urmezi un link, te întorci cu Înapoi, lucrezi cu mai multe file și pui o pagină la Favorite.',
 pasi:[
  {t:'Browserul: programul pentru pagini',
   text:`<p>Paginile web le deschizi cu un program numit <mark>browser</mark> (se citește „brauzer”). Exemple: <b>Google Chrome</b>, <b>Microsoft Edge</b>, <b>Mozilla Firefox</b>.</p>
<p>Îl pornești cu dublu-clic pe pictograma lui de pe Desktop sau cu un clic pe pictograma din bara de activități, jos.</p>
<p>Atenție: Wikipedia sau YouTube nu sunt browsere. Sunt <b>site-uri</b>, pe care le deschizi <b>în</b> browser.</p>`,
   exemplu:`<p>Ca să citești Wikipedia: pornești browserul (programul), apoi deschizi în el site-ul Wikipedia. Programul e unul; site-urile pe care le deschizi în el pot fi mii.</p>`,
   incearca:{t:'choice',q:'Care dintre acestea este un browser?',o:['Mozilla Firefox','Wikipedia','Windows','YouTube'],ok:0,ajutor:'Caută numele în lista de exemple a pasului.',why:'Browserul este programul cu care deschizi paginile web. Wikipedia și YouTube sunt site-uri; Windows este sistemul de operare.'},
   inca:[
    {t:'tf',q:'YouTube este un browser.',ok:false,ajutor:'Recitește ultimul paragraf.',why:'Fals. YouTube este un site, pe care îl deschizi într-un browser.'}
   ]},
  {t:'Adresa web și bara de adresă',
   text:`<p>Fiecare pagină are o <mark>adresă web</mark> a ei, unică. O scrii în <mark>bara de adresă</mark>, lungă, sus în fereastra browserului.</p>
<p><b>Cum deschizi o pagină după adresă:</b></p>
<ol><li>dai clic în bara de adresă;</li><li>ștergi ce era scris acolo;</li><li>scrii adresa, literă cu literă;</li><li>apeși <kbd>Enter</kbd>.</li></ol>
<p>O singură literă greșită și ajungi pe altă pagină sau pe niciuna.</p>
${fig('bara-browser.webp',1000,248,'Bara de sus a browserului Chrome, cu săgețile Înapoi și Înainte, butonul de reîncărcare, bara de adresă cu https, steaua de la Favorite și butonul plus pentru filă nouă','Bara de sus a browserului: <b>Înapoi</b>, <b>Înainte</b>, <b>Reîncarcă</b>, <b>bara de adresă</b> și steaua de la <b>Favorite</b>.')}`,
   exemplu:`<p>Adresa <code>https://www.muzeu-exemplu.ro/lupul</code> are trei părți:</p>
<ul><li><code>https://</code> — începutul, felul în care browserul vorbește cu site-ul;</li><li><code>www.muzeu-exemplu.ro</code> — numele site-ului;</li><li><code>/lupul</code> — pagina din site.</li></ul>`,
   altfel:`<p>Adresa web e ca adresa de pe un plic: oraș, stradă, număr. Dacă greșești numărul, scrisoarea ajunge la altă casă sau nicăieri.</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii ca să deschizi o pagină după adresa ei.',items:['Deschizi browserul','Dai clic în bara de adresă','Scrii adresa paginii','Apeși Enter'],ajutor:'Întâi programul, apoi locul în care scrii, apoi scrisul, apoi tasta care trimite.',why:'Întâi ai nevoie de program, apoi de locul în care scrii. Enter trimite adresa, iar browserul aduce pagina.'},
   inca:[
    {t:'tf',q:'Dacă greșești o literă în adresă, poți ajunge pe altă pagină sau pe niciuna.',ok:true,ajutor:'Recitește propoziția de sub pașii numerotați.',why:'Adevărat. Adresa trebuie scrisă exact; de aceea o verifici literă cu literă.'},
    {t:'choice',q:'În adresa www.muzeu-exemplu.ro/ursul, care parte este numele site-ului?',o:['www.muzeu-exemplu.ro','/ursul','ursul','https://'],ok:0,ajutor:'Uită-te la exemplul „Uite cum”: a doua parte.',why:'www.muzeu-exemplu.ro este site-ul; /ursul este pagina din acel site.'}
   ]},
  {t:'Linkuri, Înapoi și Înainte',
   text:`<p>Un <mark>link</mark> (legătură) este un text sau o imagine pe care dai clic ca să ajungi la altă pagină. Textul unui link e adesea albastru sau subliniat, iar când treci cu mouse-ul peste el, cursorul se face mânuță.</p>
<p>Sus, în stânga barei de adresă, ai trei butoane:</p>
<ul><li><b>←</b> <mark>Înapoi</mark>: revii la pagina de dinainte;</li><li><b>→</b> <mark>Înainte</mark>: mergi din nou la pagina de unde te-ai întors;</li><li><b>⟳</b> <mark>Reîncarcă</mark>: încarci din nou aceeași pagină.</li></ul>`,
   exemplu:`<p>Ești pe pagina despre lup. Dai clic pe linkul „Ursul brun” → se deschide pagina ursului. Apeși <b>←</b> Înapoi → ești din nou la lup. Apeși <b>→</b> Înainte → iar la urs.</p>`,
   incearca:{t:'match',q:'Leagă fiecare element de ce face.',pairs:[['Linkul','dai clic și ajungi la altă pagină'],['Butonul Înapoi','revii la pagina de dinainte'],['Butonul Reîncarcă','încarci din nou aceeași pagină']],ajutor:'Recitește lista cu cele trei butoane.',why:'Linkul te duce mai departe, Înapoi te întoarce, Reîncarcă aduce din nou aceeași pagină.'},
   inca:[
    {t:'choice',q:'Ai dat clic pe un link greșit. Cum revii cel mai repede la pagina de dinainte?',o:['Apeși butonul Înapoi','Închizi browserul','Apeși Reîncarcă','Oprești calculatorul'],ok:0,ajutor:'Care buton te duce la pagina de dinainte?',why:'Înapoi te duce exact la pagina de dinainte, fără să cauți nimic.'}
   ]},
  {t:'Filele (tab-urile)',
   text:`<p>În aceeași fereastră de browser poți ține mai multe pagini deschise, fiecare în <mark>fila</mark> ei (în engleză, <i>tab</i>). Filele stau sus, una lângă alta.</p>
<ul><li><b>filă nouă:</b> butonul <b>+</b> de lângă file sau <kbd>Ctrl</kbd>+<kbd>T</kbd>;</li>
<li><b>treci la altă filă:</b> clic pe ea;</li>
<li><b>închizi o filă:</b> clic pe <b>×</b> de pe ea sau <kbd>Ctrl</kbd>+<kbd>W</kbd>.</li></ul>
${fig('fila-noua.webp',1000,423,'Două file deschise în aceeași fereastră de browser: fila cu pagina de dinainte și o filă nouă, goală, cu o căsuță de căutare','După <kbd>Ctrl</kbd>+<kbd>T</kbd>: pagina veche rămâne în fila ei, iar fila nouă e goală.')}`,
   exemplu:`<p>Scrii tema și ai nevoie de un dicționar: <kbd>Ctrl</kbd>+<kbd>T</kbd>, scrii adresa dicționarului, <kbd>Enter</kbd>. Pagina cu tema a rămas în fila ei: un clic pe filă și te întorci la ea.</p>`,
   altfel:`<p>Filele sunt ca foile dintr-un dosar cu separatoare: fiecare foaie e o pagină, iar cu un clic pe separator o scoți în față pe cea de care ai nevoie.</p>`,
   incearca:{t:'choice',q:'Vrei să ții deschisă pagina cu tema și să deschizi alături un dicționar. Ce apeși?',o:['Ctrl+T','Ctrl+W','Enter'],ok:0,ajutor:'Care scurtătură deschide o filă nouă?',why:'Ctrl+T deschide o filă nouă, iar pagina cu tema rămâne în fila ei. Ctrl+W ar închide fila în care ești.'},
   inca:[
    {t:'tf',q:'Când deschizi o filă nouă, pagina din fila veche se închide.',ok:false,ajutor:'Uită-te la captura din pas: ce s-a întâmplat cu pagina veche?',why:'Fals. Pagina veche rămâne în fila ei; revii la ea cu un clic pe filă.'}
   ]},
  {t:'Favoritele',
   text:`<p>Ai găsit o pagină bună și vrei s-o regăsești ușor? O pui la <mark>Favorite</mark> (se mai numesc <i>marcaje</i>):</p>
<ul><li>dai clic pe <b>steaua ☆</b> din dreapta barei de adresă, sau</li><li>apeși <kbd>Ctrl</kbd>+<kbd>D</kbd>.</li></ul>
<p>Data viitoare o deschizi din lista de Favorite, fără s-o cauți din nou.</p>
<p>Atenție: la Favorite se păstrează doar <b>adresa</b> paginii, nu pagina întreagă. Ca s-o citești, ai nevoie tot de Internet.</p>`,
   exemplu:`<p>Pagina muzeului despre lup e bună pentru referat → clic pe ☆ → steaua devine plină ★. Mâine, deschizi Favoritele și dai clic pe „Lupul carpatin”.</p>`,
   incearca:{t:'choice',q:'Unde dai clic ca să pui pagina la Favorite?',o:['Pe steaua din dreapta barei de adresă','Pe butonul + de lângă file','Pe butonul Înapoi'],ok:0,ajutor:'Caută în pas simbolul ☆.',why:'Steaua din bara de adresă pune pagina la Favorite. Butonul + deschide o filă nouă.'},
   inca:[
    {t:'choice',q:'Ce scurtătură pune pagina la Favorite?',o:['Ctrl+D','Ctrl+T','Ctrl+W'],ok:0,ajutor:'Recitește lista din pas.',why:'Ctrl+D pune pagina la Favorite; Ctrl+T deschide o filă nouă; Ctrl+W închide fila.'}
   ]}
 ],
 atelier:{t:'browser',titlu:'Navighează în browserul de probă',
  intro:`<p>Mai jos e un browser de probă, cu file, bară de adresă, butoane și Favorite. <strong>Sarcina:</strong></p>
<ol><li>scrie în bara de adresă <code>www.muzeu-exemplu.ro/lupul</code> și apasă <b>Enter</b>;</li>
<li>pune pagina la Favorite (steaua ☆);</li>
<li>deschide o filă nouă (butonul <b>+</b>) și scrie acolo adresa dicționarului: <code>www.dex-exemplu.ro</code>.</li></ol>
<p>Testele de sub browser se bifează singure. La final apasă <b>Verifică</b>.</p>`,
  q:'Deschide pagina muzeului, pune-o la Favorite, apoi deschide dicționarul într-o filă nouă.',start:'nou',

   {k:'favorit',a:'www.muzeu-exemplu.ro/lupul',ce:'Pagina muzeului e la Favorite',msg:'Pagina muzeului nu e la Favorite: deschide-o și apasă steaua ☆.'},

  inca:[

     {k:'inapoi',ce:'Ai folosit butonul ← Înapoi',msg:'Nu ai folosit butonul ← Înapoi.'},

    sol:[['go','www.muzeu-exemplu.ro/ursul'],['back']],gresit:[['go','www.muzeu-exemplu.ro/ursul']],
    why:'Linkul te-a dus mai departe, iar Înapoi te-a întors exact de unde ai plecat.'},
   {t:'browser',q:'Încă una: cineva a scris greșit adresa muzeului și a primit o eroare. Corecteaz-o în bara de adresă: pagina corectă este www.muzeu-exemplu.ro/lupul.',start:'eroare:www.muzeu-exmplu.ro/lupul',

 qs:[
  {t:'choice',q:'Care dintre acestea este un browser?',o:['Microsoft Edge','Wikipedia','YouTube','Windows'],ok:0,why:'Browserul este programul care deschide paginile. Wikipedia și YouTube sunt site-uri, iar Windows este sistemul de operare.'},

  {t:'choice',q:'Vrei ca pagina muzeului să rămână deschisă și să deschizi alături un dicționar. Ce faci?',o:['Deschid o filă nouă și scriu acolo adresa dicționarului','Scriu adresa dicționarului în aceeași filă','Apăs butonul Reîncarcă','Închid browserul și îl pornesc din nou'],ok:0,ajutor:'Gândește-te la ce ai făcut în atelier.',why:'În aceeași filă, pagina muzeului ar fi înlocuită. O filă nouă le păstrează pe amândouă.'},

/* ============ 3. Caut ca un detectiv (lecția 14) ============ */
{t:'Caut ca un detectiv',lectii:[14],continuturi:['- căutarea informațiilor pe Internet utilizând motoare de căutare;'],
 obiectiv:'cauți cu cuvinte-cheie potrivite, folosești ghilimelele și minusul și alegi un rezultat bun, nu o reclamă.',
 pasi:[
  {t:'Motorul de căutare',
   text:`<p>Nu știi adresa paginii? Folosești un <mark>motor de căutare</mark>: un site care găsește pagini după cuvintele pe care le scrii. Exemple: Google, Bing, DuckDuckGo.</p>
<p>Nu le încurca: <b>browserul</b> (Chrome, Edge, Firefox) este <b>programul</b>; motorul de căutare este un <b>site</b> pe care îl deschizi în browser.</p>
<p>În browserele de azi poți scrie cuvintele și direct în bara de adresă: browserul le trimite singur motorului de căutare.</p>`,
   altfel:`<p>Gândește-te la o bibliotecă. Browserul este ușa prin care intri. Motorul de căutare este bibliotecara: îi spui ce cauți, iar ea îți arată rafturile cu cărțile potrivite.</p>`,
   incearca:{t:'choice',q:'Ce este Google?',o:['Un motor de căutare, adică un site','Un browser, adică un program','Un sistem de operare'],ok:0,ajutor:'Recitește a doua propoziție din pas.',why:'Google este un motor de căutare. Chrome, de la aceeași firmă, este browserul.'},
   inca:[
    {t:'tf',q:'Poți căuta cu Bing și dacă folosești browserul Chrome.',ok:true,ajutor:'Motorul de căutare este un site: se poate deschide în orice browser?',why:'Adevărat. Orice motor de căutare e un site și se deschide în orice browser.'}
   ]},
  {t:'Cuvintele-cheie (strategie)',
   text:`<p>Motorul de căutare nu citește propoziții ca un om: caută paginile în care apar cuvintele tale. De aceea scrii <mark>cuvinte-cheie</mark>, nu o propoziție lungă.</p>
<p><b>Strategia, în 4 pași:</b></p>
<ol><li>Te întrebi ce vrei să afli.</li><li>Alegi 2-3 cuvinte importante: despre cine e vorba + ce vrei să afli despre el.</li><li>Scoți cuvintele de legătură („vreau”, „ce”, „despre”, „și”).</li><li>Cauți. Dacă rezultatele nu sunt bune, schimbi un cuvânt.</li></ol>
${fig('cautare-rezultate.webp',1000,560,'Pagina de rezultate a unui motor de căutare, cu cuvintele-cheie lupul carpatin hrana scrise în căsuța de căutare și primele rezultate dedesubt','Două-trei <b>cuvinte-cheie</b> în căsuță, nu o propoziție. Dedesubt vin rezultatele.')}`,
   exemplu:`<p>Întrebarea: „Ce mănâncă lupul carpatin?”</p><p>Despre cine: <b>lupul carpatin</b>. Ce vreau să aflu: <b>hrana</b>. Scot „ce”. Caut:</p><p><code>lupul carpatin hrană</code></p>`,
   altfel:`<p>Fiecare cuvânt pe care îl scrii e o condiție: „vreau pagini în care apare și cuvântul ăsta”. „Bună ziua” sau „aș vrea” nu ajută la nimic, doar încurcă.</p>`,
   incearca:{t:'choice',q:'Vrei să afli ce mănâncă ariciul. Care căutare e cea mai bună?',o:['arici hrană','Bună ziua, aș vrea să știu și eu ce mănâncă un arici','animale','arici'],ok:0,ajutor:'Despre cine? Ce vrei să afli despre el? Două cuvinte.',why:'Două cuvinte-cheie spun exact ce cauți. Propoziția lungă adaugă cuvinte inutile, iar „animale” sau doar „arici” aduc prea multe rezultate.'},
   inca:[
    {t:'choice',q:'Vrei să afli când e deschis Muzeul Exemplu. Ce scrii?',o:['Muzeul Exemplu program','Aș vrea să știu și eu când pot merge la muzeu','muzeu','program'],ok:0,ajutor:'Despre cine (muzeul) + ce vrei să afli (programul).',why:'Numele muzeului + „program” sunt exact cele două lucruri de care ai nevoie.'},
    {t:'choice',q:'Vrei să afli unde trăiește ursul brun. Ce scrii?',o:['ursul brun unde trăiește','vreau să aflu și eu despre urși','urs','animale din pădure'],ok:0,ajutor:'Despre cine + ce vrei să afli, fără „vreau”.',why:'„ursul brun” spune despre cine e vorba, „unde trăiește” spune ce vrei să afli.'}
   ]},
  {t:'Ghilimelele: expresia exactă',
   text:`<p>Uneori cauți cuvinte care trebuie să stea <b>exact</b> așa, unul lângă altul, în aceeași ordine: un titlu, un vers, un nume.</p>
<p>Atunci pui expresia între <mark>ghilimele</mark> drepte: <code>"Ștefan cel Mare"</code>. Motorul aduce doar paginile în care apare expresia întreagă.</p>
<p>Fără ghilimele primești și pagini în care cuvintele sunt împrăștiate sau în altă ordine.</p>`,
   exemplu:`<p><code>"Somnoroase păsărele"</code> → vine poezia lui Eminescu.</p><p><code>somnoroase păsărele</code> (fără ghilimele) → vine și un cântec în care scrie „păsărele mici și somnoroase”, în altă ordine.</p>`,
   incearca:{t:'choice',q:'Cauți versul „Somnoroase păsărele” exact cu aceste cuvinte, în această ordine. Ce scrii?',o:['"Somnoroase păsărele"','Somnoroase -păsărele','somnoroase păsărele păsărele','păsărele'],ok:0,ajutor:'Ce semn cere expresia exactă?',why:'Ghilimelele cer expresia exactă, cu cuvintele în ordinea scrisă.'},
   inca:[
    {t:'tf',q:'Cu ghilimele, motorul caută cuvintele exact în ordinea scrisă de tine.',ok:true,ajutor:'Recitește al doilea paragraf.',why:'Adevărat. Ghilimelele țin cuvintele împreună, în ordinea lor.'}
   ]},
  {t:'Minusul: scoate un cuvânt',
   text:`<p>Unele cuvinte au mai multe înțelesuri. „Jaguar” este un animal, dar și o marcă de mașini.</p>
<p>Ca să scoți din rezultate paginile pe care nu le vrei, pui <mark>minus</mark> lipit de cuvântul nedorit, fără spațiu între ele: <code>jaguar -mașină</code>.</p>
<p>Citește așa: „jaguar, dar nu pagini cu mașină”.</p>`,
   exemplu:`<p><code>jaguar</code> → vin pagini despre animal <b>și</b> despre mașini.</p><p><code>jaguar -mașină</code> → rămân doar paginile despre felina din pădurile Americii.</p>`,
   altfel:`<p>E ca atunci când îi spui vânzătorului: „Vreau o înghețată, dar fără ciocolată.” Minusul este „fără”.</p>`,
   incearca:{t:'choice',q:'Vrei pagini despre planeta Mercur, nu despre zeul roman Mercur. Ce scrii?',o:['Mercur -zeu','Mercur zeu','-Mercur planetă','"Mercur zeu"'],ok:0,ajutor:'Minusul stă lipit de cuvântul pe care NU îl vrei.',why:'„-zeu” scoate paginile despre zeu. „-Mercur” ar scoate chiar subiectul tău.'},
   inca:[
    {t:'choice',q:'Unde pui minusul?',o:['Lipit de cuvântul pe care nu-l vrei','Singur, la începutul căutării','La final, după un spațiu'],ok:0,ajutor:'Uită-te la exemplul din pas: între minus și cuvânt e spațiu?',why:'Minusul se lipește de cuvântul nedorit, fără spațiu.'}
   ]},
  {t:'Alege rezultatul bun (strategie)',
   text:`<p>Primele rezultate nu sunt mereu cele mai bune. Unele sunt <mark>reclame</mark>: cineva a plătit ca pagina lui să apară sus. Sunt marcate de obicei cu <b>„Sponsorizat”</b>.</p>
<p><b>Cum alegi:</b></p>
<ol><li>sari peste rezultatele „Sponsorizat”;</li><li>citește titlul: răspunde la întrebarea ta?</li><li>citește adresa: e de la un muzeu, o instituție, o enciclopedie?</li><li>deschide 2-3 rezultate, nu doar primul.</li></ol>`,
   exemplu:`<div class="rez-ex"><div class="sp">Sponsorizat</div><div class="ti">Lup de pluș — reducere 50%! Cumpără acum</div><div class="ad">www.magazin-exemplu.ro/lup</div></div><p>→ reclamă, sari peste.</p>
<div class="rez-ex"><div class="ti">Lupul carpatin</div><div class="ad">www.muzeu-exemplu.ro/lupul</div></div><p>→ titlul răspunde, adresa e a unui muzeu: îl deschizi.</p>`,
   incearca:{t:'tf',q:'Rezultatele marcate „Sponsorizat” sunt puse sus pentru că sunt cele mai corecte.',ok:false,ajutor:'Ce înseamnă „Sponsorizat”?',why:'Fals. Sunt reclame: cineva a plătit ca pagina lui să apară acolo.'},
   inca:[
    {t:'classify',q:'Cauți ce mănâncă lupul. Deschizi sau sari peste?',cats:['Deschid','Sar peste'],items:[['Lupul carpatin — www.muzeu-exemplu.ro',0],['Sponsorizat: Lup de pluș, reducere 50%',1],['Lupul (enciclopedie pentru copii)',0],['Sponsorizat: Hrană pentru animăluțe',1]],ajutor:'Pasul 1 al strategiei: ce faci cu „Sponsorizat”?',why:'Reclamele vând ceva; muzeul și enciclopedia te informează.'}
   ]}
 ],
 atelier:{t:'browser',titlu:'Caută ca un detectiv',
  intro:`<p>Browserul de probă are un motor de căutare, <b>Caută-Exemplu</b>, cu rezultate și reclame. <strong>Sarcina:</strong> afli <b>ce mănâncă ariciul</b>.</p>
<ol><li>scrie 2-3 cuvinte-cheie în căsuța de căutare și apasă <b>Caută</b>;</li><li>sari peste ce e „Sponsorizat”;</li><li>deschide pagina care îți răspunde.</li></ol>`,
  q:'Caută ce mănâncă ariciul și deschide un rezultat bun.',start:'nou',
  ajutor:'Despre cine? <b>arici</b>. Ce vrei să afli? <b>hrană</b>. Apoi dă clic pe titlul de la muzeu, nu pe cel „Sponsorizat”.',
  checks:[
   {k:'cautare',are:['arici',['hrana','mananca','hraneste']],max:4,ce:'Ai căutat cu 2-4 cuvinte-cheie: ariciul + hrana',msg:'Căutarea ta nu are cuvintele-cheie potrivite (arici + hrană) sau e prea lungă.'},
   {k:'pagina',a:['www.muzeu-exemplu.ro/ariciul'],ce:'Ai deschis pagina care răspunde, nu o reclamă',msg:'Pagina deschisă nu e cea bună. Sari peste „Sponsorizat” și deschide pagina muzeului despre arici.'}],
  sol:[['cauta','arici hrană'],['go','www.muzeu-exemplu.ro/ariciul']],
  gresit:[['cauta','Bună ziua, aș vrea să știu și eu ce mănâncă un arici din grădină'],['go','www.magazin-exemplu.ro/hrana']],
  why:'Cuvinte-cheie scurte, reclama sărită, pagina muzeului deschisă: exact strategia unui detectiv.',
  inca:[

    checks:[{k:'cautare',fraza:'somnoroase pasarele',ce:'Ai căutat expresia exactă, între ghilimele',msg:'Căutarea nu are expresia între ghilimele: "Somnoroase păsărele".'},
     {k:'pagina',a:'www.poezii-exemplu.ro/somnoroase',ce:'Ai deschis pagina poeziei',msg:'Nu ai deschis pagina poeziei lui Eminescu.'}],
    sol:[['cauta','"Somnoroase păsărele"'],['go','www.poezii-exemplu.ro/somnoroase']],gresit:[['cauta','somnoroase păsărele'],['go','www.cantece-exemplu.ro/leagan']],
    why:'Ghilimelele au păstrat doar paginile cu expresia exactă.'},
   {t:'browser',q:'Încă una: caută pagini despre animalul jaguar, fără pagini despre mașini, și deschide una.',start:'nou',
    ajutor:'Scrie jaguar, un spațiu, apoi minus lipit de cuvântul mașină.',
    checks:[{k:'cautare',are:['jaguar'],minus:'masina',ce:'Ai scos mașinile cu minus',msg:'Căutarea nu scoate mașinile. Scrie: jaguar -mașină.'},
     {k:'pagina',a:'www.animale-exemplu.ro/jaguar',ce:'Ai deschis pagina despre animal',msg:'Nu ai deschis pagina despre animalul jaguar.'}],
    sol:[['cauta','jaguar -mașină'],['go','www.animale-exemplu.ro/jaguar']],gresit:[['cauta','jaguar'],['go','www.masini-exemplu.ro/jaguar']],
    why:'Minusul a scos paginile cu mașini; a rămas doar felina.'}
  ]},
 qs:[
  {t:'tf',q:'Chrome și Google sunt același lucru.',ok:false,ajutor:'Care e programul și care e site-ul?',why:'Fals. Chrome este un browser, adică un program. Google este un motor de căutare, adică un site.'},
  {t:'classify',q:'Browser sau motor de căutare?',cats:['Browser','Motor de căutare'],items:[['Google Chrome',0],['Mozilla Firefox',0],['Microsoft Edge',0],['Bing',1],['DuckDuckGo',1],['Google (site-ul de căutare)',1]],why:'Browserul este programul care afișează paginile. Motorul de căutare este un site pe care îl deschizi în browser.'},
  {t:'order',q:'Pune în ordine strategia cuvintelor-cheie.',items:['Te întrebi ce vrei să afli','Alegi 2-3 cuvinte importante','Scoți cuvintele de legătură','Cauți și, dacă nu merge, schimbi un cuvânt'],ajutor:'Întâi gândești, apoi alegi, apoi cureți, apoi cauți.',why:'Știi ce cauți, alegi cuvintele, le scoți pe cele inutile, apoi încerci și ajustezi.'},
  {t:'choice',q:'Cauți exact titlul cărții „Amintiri din copilărie”. Ce scrii?',o:['"Amintiri din copilărie"','Amintiri -copilărie','-"Amintiri din copilărie"','amintiri amintiri copilărie'],ok:0,ajutor:'Titlul trebuie găsit exact, cu cuvintele în ordine.',why:'Ghilimelele cer expresia exactă. Minusul ar scoate chiar ce cauți.'},
  {t:'choice',q:'Vrei pagini despre animalul jaguar, fără mașini. Ce scrii?',o:['jaguar -mașină','jaguar mașină','-jaguar mașină','"jaguar mașină"'],ok:0,ajutor:'Minusul stă lipit de cuvântul pe care NU îl vrei.',why:'„-mașină” scoate paginile cu mașini; „-jaguar” ar scoate chiar animalul.'},
  {t:'choice',q:'Primul rezultat e marcat „Sponsorizat”. Ce înseamnă?',o:['E o reclamă plătită','E cea mai corectă pagină','E pagina unui muzeu','E singura pagină bună'],ok:0,why:'„Sponsorizat” înseamnă reclamă plătită. Nu spune nimic despre cât de corectă e informația.'}
 ]},

/* ============ 4. Salvez ce am găsit (lecția 15) ============ */
{t:'Salvez ce am găsit',lectii:[15],continuturi:['- salvarea informațiilor de pe Internet'],
 obiectiv:'salvezi un text, o imagine și o pagină întreagă în folderul tău, cu nume clare, și notezi sursa.',
 pasi:[
  {t:'Copiezi un text (strategie)',
   text:`<p>Ai găsit un paragraf util. Îl muți în documentul tău în 4 pași:</p>
<ol><li><b>selectezi</b> textul: ții apăsat butonul stâng al mouse-ului și tragi peste el (se colorează);</li>
<li>apeși <kbd>Ctrl</kbd>+<kbd>C</kbd> (copiere);</li>
<li>mergi în documentul tău (de exemplu Word sau Google Docs) și dai clic acolo unde vrei textul;</li>
<li>apeși <kbd>Ctrl</kbd>+<kbd>V</kbd> (lipire).</li></ol>
<p>Pui textul copiat între ghilimele „…” și scrii sub el de unde l-ai luat (pasul 4).</p>`,
   exemplu:`<p>Pe pagina muzeului selectezi: <i>Hrana lupului este mai ales carnea.</i> → <kbd>Ctrl</kbd>+<kbd>C</kbd> → clic în document → <kbd>Ctrl</kbd>+<kbd>V</kbd>. În document apare aceeași propoziție.</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii ca să copiezi un paragraf în documentul tău.',items:['Selectezi textul, trăgând cu mouse-ul peste el','Apeși Ctrl+C','Dai clic în document, unde vrei textul','Apeși Ctrl+V'],ajutor:'Nu poți copia ce n-ai selectat, și nu poți lipi înainte să copiezi.',why:'Selectezi, copiezi, alegi locul, lipești.'},
   inca:[
    {t:'match',q:'Leagă fiecare pas de ce face.',pairs:[['Selectarea','marchezi textul, trăgând cu mouse-ul peste el'],['Ctrl+C','copiezi textul selectat'],['Ctrl+V','lipești textul în document']],ajutor:'C de la „copy” (copiere), V vine imediat lângă C pe tastatură.',why:'Selectarea alege textul, Ctrl+C îl copiază, Ctrl+V îl lipește.'}
   ]},
  {t:'Salvezi o imagine',
   text:`<p>O imagine de pe o pagină o salvezi astfel:</p>
<ol><li>dai <b>clic dreapta</b> pe imagine;</li><li>din meniul care apare alegi <mark>Salvează imaginea ca…</mark> (în engleză, <i>Save image as…</i>);</li><li>se deschide caseta <b>Salvare ca</b>, în care alegi folderul și numele (pasul următor).</li></ol>
${fig('salvez-imaginea.webp',620,568,'Meniul care apare la clic dreapta pe o fotografie dintr-o pagină web, cu comanda Salvează imaginea ca încadrată','Clic dreapta pe imagine → <b>Salvează imaginea ca…</b> (<i>Save image as…</i>).')}`,
   incearca:{t:'choice',q:'Vrei să păstrezi o fotografie cu un lup de pe o pagină. Ce faci?',o:['Clic dreapta pe ea și aleg Salvează imaginea ca…','Apăs Ctrl+D și pun pagina la Favorite','Apăs Ctrl+T și deschid o filă nouă','Închid pagina, poza rămâne în browser'],ok:0,ajutor:'Primul pas din listă: ce buton al mouse-ului?',why:'Comanda de salvare din meniul de clic dreapta pune imaginea într-un fișier pe calculator. Favoritele păstrează doar adresa.'},
   inca:[
    {t:'tf',q:'Ctrl+D salvează imaginea pe calculator.',ok:false,ajutor:'Ce face Ctrl+D (nivelul 2)?',why:'Fals. Ctrl+D pune pagina la Favorite. Imaginea o salvezi cu clic dreapta → Salvează imaginea ca…'}
   ]},
  {t:'Caseta Salvare ca: folder și nume (strategie)',
   text:`<p>Dacă nu schimbi nimic, fișierul ajunge de obicei în folderul <mark>Descărcări</mark> (<i>Downloads</i>), cu un nume ca <code>imagine(3).jpg</code>, care peste o săptămână nu-ți mai spune nimic.</p>
<p><b>În caseta Salvare ca:</b></p>
<ol><li>alegi <b>folderul</b> tău (de exemplu Scoala › Clasa_5 › TIC);</li><li>scrii un <b>nume clar</b>: ce e în fișier, fără spații, cu cuvintele legate prin liniuța de jos, de exemplu <code>lup_hrana.jpg</code>;</li><li>apeși <b>Salvare</b>.</li></ol>
<p>Toată pagina o salvezi cu <kbd>Ctrl</kbd>+<kbd>S</kbd>: se deschide aceeași casetă. (Comanda <b>Salvează pagina ca…</b> există și în meniul browserului, butonul <b>⋮</b> din dreapta sus, dar scurtătura e mai rapidă.)</p>
${fig('caseta-salvare.webp',1000,304,'Caseta Salvare ca din Windows, cu bara de adresă care arată folderul C: Scoala Clasa_5 TIC, câmpul Nume fișier completat cu lup_carpatin_wikipedia, tipul Pagina web completă și butonul Salvare, toate încadrate și numerotate','Caseta <b>Salvare ca</b>: <b>1</b> folderul, <b>2</b> numele clar, <b>3</b> Salvare.')}`,
   exemplu:`<p><b>Înainte:</b> Descărcări › <code>imagine(3).jpg</code><br><b>După:</b> Scoala › Clasa_5 › TIC › <code>lup_hrana.jpg</code></p>`,
   incearca:{t:'choice',q:'Unde ajunge, de obicei, un fișier descărcat din browser, dacă nu alegi alt folder?',o:['În folderul Descărcări (Downloads)','Pe Desktop, întotdeauna','În Coșul de reciclare','În folderul Imagini, întotdeauna'],ok:0,ajutor:'Recitește primul paragraf.',why:'Browserele pun descărcările în folderul Descărcări, dacă nu alegi altul.'},
   inca:[
    {t:'tf',q:'Un nume ca „imagine(3).jpg” e la fel de bun ca „lup_hrana.jpg”, fiindcă fișierul e același.',ok:false,ajutor:'Care nume îți spune ce e în fișier?',why:'Fals. Peste o săptămână, „imagine(3)” nu-ți mai spune nimic. Un nume clar te ajută să găsești fișierul.'},
    {t:'choice',q:'Ce scurtătură salvează toată pagina?',o:['Ctrl+S','Ctrl+D','Ctrl+T'],ok:0,ajutor:'S de la „save” (salvare).',why:'Ctrl+S deschide caseta Salvare ca pentru toată pagina.'}
   ]},
  {t:'Notezi sursa',
   text:`<p>Lângă orice informație salvată notezi <mark>sursa</mark>, adică de unde ai luat-o. Altfel, peste o săptămână nu mai știi.</p>
<p>Sursa are 4 părți:</p>
<ol><li><b>autorul</b>, dacă apare;</li><li><b>titlul</b> paginii;</li><li><b>adresa</b> paginii, din bara de adresă;</li><li><b>data</b>: cea scrisă pe pagină sau, dacă nu are, ziua în care ai citit-o.</li></ol>
<p>Autorul și data stau de obicei sus, sub titlu, sau jos, în subsolul paginii.</p>`,
   exemplu:`<div class="bib">dr. Ana Munteanu, „Lupul carpatin”, www.muzeu-exemplu.ro/lupul, 12.03.2026</div>`,
   incearca:{t:'classify',q:'Ce notezi lângă o informație salvată pentru referat?',cats:['Notez','Nu e nevoie'],items:[['Adresa paginii',0],['Data paginii',0],['Numele autorului, dacă apare',0],['Culoarea fundalului paginii',1],['Câte reclame avea pagina',1]],ajutor:'Care lucruri te duc înapoi la pagină?',why:'Adresa, data și autorul te duc înapoi la sursă. Culoarea sau reclamele nu ajută pe nimeni să găsească sursa.'},
   inca:[
    {t:'choice',q:'Unde găsești de obicei autorul și data unei pagini?',o:['Sus, sub titlu, sau jos, în subsolul paginii','În bara de file, lângă butonul +','În folderul Descărcări, după salvare','Pe butonul Înapoi, din stânga sus'],ok:0,ajutor:'Recitește ultimul paragraf.',why:'Autorul și data stau sub titlu sau în subsol.'}
   ]}
 ],

  {t:'match',q:'Leagă fiecare scurtătură de ce face în browser.',pairs:[['Ctrl+C','copiezi textul selectat'],['Ctrl+V','lipești textul în document'],['Ctrl+S','salvezi toată pagina'],['Ctrl+D','pui adresa paginii la Favorite']],ajutor:'Ctrl+D e de la nivelul cu Favoritele.',why:'Copierea și lipirea mută textul în documentul tău. Ctrl+S face un fișier cu pagina. Ctrl+D doar ține minte adresa.'},

/* ============ 5. Drepturile de autor (lecția 15) ============ */
{t:'Drepturile de autor',lectii:[15],continuturi:['Drepturi de autor'],
 obiectiv:'știi cine are drepturi asupra unei opere, verifici dacă ai voie să folosești o imagine și faci diferența dintre citat și plagiat.',
 pasi:[
  {t:'Orice operă are un autor',
   text:`<p>Un text, o fotografie, un desen, un cântec sau un film sunt <mark>opere</mark>. Cine le-a făcut este <mark>autorul</mark>.</p>
<p>În România, Legea nr. 8/1996 îi dă autorului <mark>drepturi de autor</mark>: el hotărăște cine are voie să-i folosească opera și cum.</p>
<p>Drepturile apar <b>singure</b>, din clipa în care opera e creată. Nu e nevoie de semnul ©; semnul doar amintește că există drepturi.</p>`,
   exemplu:`<p>Desenul tău de ieri de la ora de desen este o operă, iar tu ești autorul lui. Chiar dacă n-ai scris © pe el, colegul nu are voie să-l semneze cu numele lui.</p>`,
   incearca:{t:'tf',q:'Desenul făcut de tine e protejat de drepturi de autor doar dacă scrii © pe el.',ok:false,ajutor:'Recitește ultimul paragraf: când apar drepturile?',why:'Fals. Drepturile apar singure, din clipa în care faci desenul.'},
   inca:[
    {t:'choice',q:'Cine are drepturile de autor asupra unei fotografii?',o:['Cel care a făcut-o','Oricine o găsește pe Internet','Motorul de căutare care o arată','Cel care a descărcat-o'],ok:0,ajutor:'Cine este autorul unei opere?',why:'Autorul este cel care a creat opera, adică fotograful.'}
   ]},
  {t:'Văzut pe Internet nu înseamnă liber',
   text:`<p>Faptul că vezi o imagine sau un text pe Internet <b>nu</b> înseamnă că ai voie să-l folosești în lucrarea ta.</p>
<p>Într-o temă sau într-un proiect ai voie:</p>
<ol><li>să citezi un <b>fragment scurt</b>, între ghilimele, cu <mark>sursa</mark> (autorul și locul de unde l-ai luat);</li><li>să folosești ce are o <b>licență liberă</b>, respectând condițiile ei (pasul următor);</li><li>să folosești ce ai făcut <b>tu</b>.</li></ol>`,
   altfel:`<p>Bicicleta din fața blocului o vede toată lumea, dar asta nu înseamnă că o poate lua oricine. La fel, o fotografie pe care o vede toată lumea tot are un stăpân: autorul.</p>`,
   incearca:{t:'tf',q:'Dacă o imagine apare printre primele rezultate ale căutării, înseamnă că e liberă.',ok:false,ajutor:'Recitește prima propoziție.',why:'Fals. Locul în rezultate nu spune nimic despre voie. Imaginea tot are un autor.'},
   inca:[
    {t:'choice',q:'Ce ai voie să pui într-un proiect pentru școală?',o:['Un fragment scurt citat, cu sursa','Un articol întreg, fără sursă','O fotografie oarecare, fără să verifici ale cui e','Tema unui coleg, cu numele tău'],ok:0,ajutor:'Uită-te la lista cu trei lucruri permise.',why:'Fragmentul scurt, cu sursa scrisă, este un citat.'}
   ]},
  {t:'Licența liberă (strategie pentru imagini)',
   text:`<p>Unii autori dau voie dinainte, printr-o <mark>licență liberă</mark>, de exemplu <b>Creative Commons</b> (pe scurt <b>CC</b>). De obicei condiția e să scrii numele autorului.</p>
<p><b>Cum verifici o imagine:</b></p>
<ol><li>te uiți sub imagine sau lângă ea: scrie autorul și licența?</li><li>dacă scrie o licență liberă (CC…) → o poți folosi și scrii numele autorului;</li><li>dacă scrie „© Toate drepturile rezervate” sau nu scrie nimic → n-o folosești; cauți alta sau desenezi tu.</li></ol>
${fig('licenta-imagine.webp',1000,335,'Sub o fotografie dintr-o enciclopedie online apar legătura către autorul fotografiei și licența CC BY 2.0','O fotografie cu <b>licență liberă</b>: sub ea scrie cine a făcut-o și ce licență are (aici <b>CC BY 2.0</b>).')}`,
   exemplu:`<p>Sub fotografie: <i>Foto: Maria Ionescu · licență liberă CC BY 4.0</i> → o folosești și scrii sub ea: <i>Foto: Maria Ionescu, CC BY 4.0</i>.</p><p>Sub alta: <i>© Toate drepturile rezervate</i> → n-o folosești.</p>`,
   incearca:{t:'choice',q:'Sub o fotografie scrie „© Toate drepturile rezervate”. O pui în proiect?',o:['Nu, caut alta cu licență liberă','Da, dacă o micșorez','Da, dacă îi schimb numele fișierului','Da, pentru că e pe Internet'],ok:0,ajutor:'Pasul 3 al strategiei.',why:'Toate drepturile sunt ale autorului; fără voia lui, n-o folosești.'},
   inca:[
    {t:'choice',q:'Ce condiție are de obicei o licență liberă?',o:['Să scrii numele autorului','Să plătești','Să nu o arăți nimănui','Să o desenezi din nou'],ok:0,ajutor:'Recitește prima propoziție din pas.',why:'De obicei, condiția e să scrii numele autorului lângă imagine.'}
   ]},
  {t:'Citatul și plagiatul',
   text:`<p>Un <mark>citat</mark> înseamnă câteva rânduri luate de la altcineva, puse între ghilimele „…”, cu autorul și sursa scrise lângă ele. E voie.</p>
<p><mark>Plagiatul</mark> înseamnă să iei textul sau ideile altcuiva fără să spui de unde sunt, ca și cum ar fi ale tale. Nu e voie.</p>
<p>Diferența stă într-un singur lucru: <b>sursa scrisă</b>.</p>`,
   exemplu:`<p><b>Citat:</b> Muzeul Exemplu scrie că „lupul este o specie protejată de lege” (dr. Ana Munteanu, www.muzeu-exemplu.ro/lupul).</p><p><b>Plagiat:</b> copiezi tot articolul și îl predai cu numele tău.</p>`,
   incearca:{t:'tf',q:'Dacă pui textul copiat între ghilimele și scrii sursa, e citat, nu plagiat.',ok:true,ajutor:'Care e singura diferență dintre citat și plagiat?',why:'Adevărat. Ghilimelele și sursa arată cinstit al cui e textul.'},
   inca:[
    {t:'classify',q:'Citat sau plagiat?',cats:['Citat','Plagiat'],items:[['Două rânduri între ghilimele, cu autorul și adresa',0],['Un paragraf copiat, fără nicio sursă',1],['Tot referatul unui coleg, cu numele tău',1],['Un vers între ghilimele, cu numele poetului',0]],ajutor:'E scrisă sursa sau nu?',why:'Cu sursă scrisă = citat. Fără sursă, ca și cum ar fi al tău = plagiat.'}
   ]}
 ],
 atelier:{t:'browser',titlu:'Alege imaginea pe care ai voie s-o folosești',
  intro:`<p>Browserul de probă e deschis pe o pagină cu două fotografii de lup. <strong>Sarcina:</strong></p>
<ol><li>citește ce scrie sub fiecare fotografie (autorul și licența);</li><li>salvează <b>doar</b> fotografia pe care ai voie s-o folosești, în folderul <b>Scoala › Clasa_5 › TIC</b>, cu un nume clar;</li><li>în fișă scrie numele autorului ei.</li></ol>`,
  q:'Salvează fotografia cu licență liberă și notează autorul ei.',start:'www.poze-exemplu.ro/lup',fisa:['autor'],
  ajutor:'Una dintre fotografii are „© Toate drepturile rezervate”: pe aceea n-ai voie s-o folosești. Cealaltă are licență liberă CC BY 4.0.',
  checks:[
   {k:'salvat',img:'lup4',folder:'tic',nume:true,ce:'Ai salvat fotografia cu licență liberă, în TIC, cu nume clar',msg:'Nu ai salvat fotografia cu licență liberă (lupul în zăpadă) în TIC, cu un nume clar.'},
   {k:'fisa',camp:'autor',v:'Maria Ionescu',ce:'În fișă: autorul fotografiei cu licență liberă',msg:'Autorul din fișă nu e cel al fotografiei cu licență liberă. Citește ce scrie sub ea.'}],
  sol:[['img','lup4','tic','lup_zapada.jpg'],['fisa','autor','Maria Ionescu']],
  gresit:[['img','lup3','tic','lup_luna.jpg'],['fisa','autor','Foto Exemplu SRL']],
  solText:'fotografia „Lup în zăpadă” (licență liberă CC BY 4.0) salvată în TIC, iar în fișă autorul: Maria Ionescu.',
  why:'Ai verificat licența înainte să salvezi și ai notat autorul: exact condiția licenței CC BY.',
  inca:[
   {t:'hunt',q:'Afișul Ioanei are 2 greșeli legate de drepturile de autor. Apasă pe ele.',src:'Pe afiș am pus [[o fotografie găsită pe un site, fără să mă uit ce scrie sub ea|întâi verifici autorul și licența de sub imagine; fără licență liberă n-ai voie]]. Textul l-am scris eu. Am citat două rânduri dintr-o carte, între ghilimele, cu numele autorului. Jos am scris: [[„Toate imaginile sunt de pe Google”|Google e motorul de căutare, nu autorul; scrii autorul și licența fiecărei imagini]].',indiciu:'Uită-te la fotografie și la ce scrie jos.',ajutor:'Strategia pentru imagini: ce scrie sub ea? Cine e autorul?',why:'Textul propriu și citatul cu autor sunt corecte. Fotografia neverificată și „de pe Google” nu sunt.'}
  ]},
 qs:[
  {t:'tf',q:'O fotografie găsită pe Internet e liberă: o pot folosi oricum, fiindcă oricine o poate vedea.',ok:false,why:'Fals. Fotografia are un autor și este protejată, chiar dacă oricine o poate vedea. O folosești doar dacă autorul permite, de exemplu printr-o licență liberă, și îi scrii numele.'},
  {t:'tf',q:'O poezie nouă e protejată de drepturile de autor doar dacă autorul a pus lângă ea semnul ©.',ok:false,why:'Fals. Protecția apare singură, din clipa în care opera e creată. Semnul © doar amintește că există drepturi.'},
  {t:'classify',q:'E în regulă sau nu, într-un proiect pentru școală?',cats:['În regulă','Nu e în regulă'],items:[['Citez două rânduri dintr-un articol și scriu autorul și adresa',0],['Folosesc o imagine cu licență liberă și scriu numele autorului',0],['Desenez eu ilustrația pentru afiș',0],['Copiez tot articolul și îmi pun numele pe el',1],['Folosesc o fotografie de pe Internet fără să scriu de unde e',1]],ajutor:'Lista din pasul 2: ce trei lucruri ai voie?',why:'Citatul scurt cu sursă, licența respectată și munca ta proprie sunt în regulă. Să iei lucrarea altcuiva ca pe a ta sau fără sursă nu e.'},
  {t:'choice',q:'Cum se numește prezentarea textului altcuiva ca fiind al tău, fără să spui de unde e?',o:['Plagiat','Citat','Licență liberă','Descărcare'],ok:0,why:'Citatul arată clar cine a scris textul. Plagiatul ascunde asta. Diferența stă în sursa scrisă sau nescrisă.'},
  {t:'hunt',q:'Referatul lui Vlad are 3 greșeli legate de drepturile de autor. Apasă pe ele.',src:'Am luat [[tot textul unui articol|se citează doar un fragment scurt, nu tot articolul]] despre lupi și am scris pe prima pagină [[că eu sunt autorul lui|autorul e cel care a scris textul; tu ești autorul doar al părților scrise de tine]]. Fotografia cu lupul are licență liberă și am scris sub ea numele fotografului. La final [[n-am trecut sursele, erau prea multe|fiecare sursă se trece, cu autorul și adresa paginii]].',indiciu:'Uită-te la cât a luat, al cui e textul și la surse.',ajutor:'Verifică: fragment scurt? autorul adevărat? sursa scrisă?',why:'Fotografia e folosită corect: licență liberă și numele autorului. Textul, în schimb, e luat întreg, fără sursă și cu alt autor.'}
 ]},

/* ============ 6. Pot avea încredere? (lecția 16) ============ */
{t:'Pot avea încredere?',lectii:[16],continuturi:['Siguranța pe Internet'],
 obiectiv:'verifici o pagină cu patru întrebări, recunoști semnele de atenție, compari surse, știi ce arată https și îți păstrezi datele personale.',
 pasi:[
  {t:'Cele 4 întrebări (strategie)',
   text:`<p>Pe Internet oricine poate publica, deci nu tot ce scrie e adevărat. Înainte să folosești o pagină, verifici dacă e <mark>credibilă</mark> (dacă poți avea încredere în ea), cu 4 întrebări:</p>
<ol><li><b>Cine a scris?</b> Un autor cu nume, un muzeu, o instituție?</li><li><b>Când?</b> Pagina are o dată?</li><li><b>De ce?</b> Te informează sau vrea să-ți vândă ceva?</li><li><b>Mai spune cineva la fel?</b> Compari cu alte surse.</li></ol>
${fig('data-si-sursa.webp',337,150,'Rândul din subsolul unei pagini de enciclopedie: Ultima editare a paginii a fost efectuată la 23 mai 2025, cu data încadrată cu roșu și, dedesubt, aceeași dată mărită','Răspunsul la „<b>Când?</b>”: în subsolul paginii scrie când a fost modificată ultima dată.')}`,
   exemplu:`<p>Pagina muzeului despre lup: <b>Cine?</b> dr. Ana Munteanu, de la un muzeu. <b>Când?</b> 12.03.2026. <b>De ce?</b> Te informează, nu vinde nimic. <b>Mai spune cineva?</b> Enciclopedia spune la fel. → <b>Credibilă.</b></p>`,
   incearca:{t:'match',q:'Leagă fiecare întrebare de ce afli din ea.',pairs:[['Cine a scris?','dacă autorul se pricepe la subiect'],['Când?','dacă informația e recentă'],['De ce?','dacă pagina informează sau vinde'],['Mai spune cineva la fel?','dacă informația e confirmată']],ajutor:'Recitește lista: după fiecare întrebare e un exemplu.',why:'Patru întrebări scurte, puse la fiecare pagină, te feresc de cele mai multe informații greșite.'},
   inca:[
    {t:'choice',q:'Ce întrebare îți arată dacă informația e recentă?',o:['Când?','Cine a scris?','De ce?','Mai spune cineva la fel?'],ok:0,ajutor:'„Recent” are legătură cu timpul.',why:'„Când?” te trimite la data paginii.'}
   ]},
  {t:'Semne de atenție',
   text:`<p>Unele pagini arată de la prima privire că trebuie să fii atent. <mark>Semne de atenție</mark>:</p>
<ul><li>titluri care strigă: „INCREDIBIL!!!”, „Nu vei crede…”;</li><li>nu au autor și nici dată;</li><li>te grăbesc să cumperi sau să dai clic: „Doar azi!”, „Dă clic AICI!”;</li><li>sunt pline de greșeli de scriere, fără diacritice.</li></ul>
<p>Un singur semn nu înseamnă sigur că pagina minte, dar îți spune: verifică în altă sursă.</p>`,
   exemplu:`<p><b>Semn de atenție:</b> „INCREDIBIL!!! Nu vei crede câți lupi au invadat orașele!” — fără autor, fără dată.</p><p><b>Credibil:</b> „Câți lupi trăiesc în România” — autor dr. Ion Stan, muzeu, 10.02.2026.</p>`,
   incearca:{t:'classify',q:'Semn de pagină credibilă sau semn de atenție?',cats:['Pagină credibilă','Semn de atenție'],items:[['Autorul are nume și e specialist',0],['Pagina are data publicării',0],['Aceeași informație apare și pe site-ul unui muzeu',0],['Titlu: „INCREDIBIL! Nu vei crede ce au descoperit!”',1],['Nu are autor și nici dată',1],['Te grăbește să cumperi un produs',1]],ajutor:'Recitește lista semnelor de atenție.',why:'Autorul, data și confirmarea din altă sursă arată grijă pentru adevăr. Titlurile care strigă, lipsa autorului și graba de a vinde sunt semne de atenție.'},
   inca:[
    {t:'tf',q:'O pagină fără autor și fără dată e un semn că trebuie să verifici informația în altă sursă.',ok:true,ajutor:'E în lista semnelor de atenție?',why:'Adevărat. Fără autor și dată nu știi cine răspunde de informație și cât e de nouă.'}
   ]},
  {t:'Compară 2-3 surse (strategie)',
   text:`<p>Chiar și paginile bune pot greși. De aceea, pentru orice informație importantă, <mark>compari două-trei surse</mark>.</p>
<p><b>Ce faci când sursele nu se potrivesc:</b></p>
<ol><li>te uiți care sursă e mai credibilă (cele 4 întrebări);</li><li>cauți o a treia sursă de încredere: un muzeu, o instituție, o enciclopedie;</li><li>dacă tot nu te lămurești, întrebi profesorul.</li></ol>`,
   exemplu:`<p>Un forum fără nume spune că lupii „mănâncă doar iarbă”. Muzeul și enciclopedia spun că mănâncă mai ales carne. Două surse credibile contra una anonimă → lupii mănâncă mai ales carne.</p>`,
   incearca:{t:'choice',q:'Două pagini spun cifre diferite despre câți lupi trăiesc în România. Ce faci?',o:['Caut o a treia sursă de încredere','Aleg pagina cu mai multe poze','Aleg pagina care a apărut prima','Scriu cifra care îmi place mai mult'],ok:0,ajutor:'Pasul 2 al strategiei.',why:'Când sursele nu se potrivesc, o sursă sigură în plus ajută să afli cifra corectă. Dacă tot nu te lămurești, întrebi profesorul.'},
   inca:[
    {t:'order',q:'Pune în ordine ce faci când sursele nu se potrivesc.',items:['Verifici care sursă e mai credibilă','Cauți o a treia sursă de încredere','Întrebi profesorul, dacă tot nu te lămurești'],ajutor:'Profesorul e ultimul pas, nu primul.',why:'Întâi judeci singur, apoi cauți confirmare, iar la nevoie ceri ajutor.'}
   ]},
  {t:'https și lacătul',
   text:`<p>O adresă care începe cu <code>https</code> (în unele browsere apare și un lacăt lângă ea) arată că legătura dintre tine și site este <mark>criptată</mark>: ce trimiți circulă „încuiat”, ca să nu poată fi citit pe drum.</p>
<p>Atât! <b>Nu</b> arată că informația de pe pagină e adevărată. Și o pagină cu informații greșite poate avea https.</p>
${fig('lacat-https.webp',480,285,'Panoul deschis din bara de adresă a browserului arată un lacăt și textul Conexiunea este securizată, iar în adresă este încadrat https','Adresa începe cu <b>https</b>, iar panoul arată lacătul: <b>Conexiunea este securizată</b>. Nu spune că informația e adevărată.')}`,
   altfel:`<p>E ca un plic sigilat: nimeni nu-l poate deschide pe drum. Dar dacă scrisoarea din plic spune o prostie, sigiliul n-o face adevărată.</p>`,
   incearca:{t:'tf',q:'Dacă adresa paginii începe cu https, tot ce scrie pe pagină e adevărat.',ok:false,ajutor:'Ce arată https: legătura sau informația?',why:'Fals. https arată doar că datele circulă criptate. Și o pagină cu informații greșite poate avea https.'},
   inca:[
    {t:'choice',q:'Ce arată lacătul de lângă adresă?',o:['Că legătura cu site-ul e criptată','Că informația e verificată de specialiști','Că pagina nu are reclame','Că pagina e nouă'],ok:0,ajutor:'Recitește prima propoziție.',why:'Lacătul arată criptarea legăturii, nimic despre adevărul informației.'}
   ]},
  {t:'Datele tale personale',
   text:`<p><mark>Datele personale</mark> sunt informațiile care te arată pe tine: numele complet împreună cu adresa de acasă, numărul de telefon, școala și clasa, parola, pozele tale.</p>
<p><b>Regulile tale:</b></p>
<ol><li>nu dai date personale pe site-uri, în jocuri sau în chat;</li><li>parola nu o dai nimănui, în afară de părinți;</li><li>nu descarci nimic fără acordul unui adult;</li><li>dacă ceva te sperie sau te supără, spui imediat unui părinte sau profesorului.</li></ol>`,
   exemplu:`<p>Un joc îți scrie: „Ai câștigat! Scrie adresa ta ca să-ți trimitem premiul.” → nu scrii nimic și îi arăți mesajul unui părinte. „Premiul” e o momeală des folosită.</p>`,
   incearca:{t:'choice',q:'Un joc online îți cere adresa de acasă ca să-ți „trimită un premiu”. Ce faci?',o:['Nu o dau și spun unui părinte','O dau, e doar un joc','O dau, dar fără numărul casei','O scriu în chat, nu în formular'],ok:0,ajutor:'Regulile 1 și 4 din pas.',why:'Adresa de acasă este o dată personală. Un „premiu” este o momeală des folosită.'},
   inca:[
    {t:'tf',q:'Un site cu articole îți cere parola de la e-mail ca să vezi articolul. E în regulă s-o scrii.',ok:false,ajutor:'Regula 2.',why:'Fals. Parola nu se dă niciunui site străin. Cauți altă sursă și spui unui adult.'}
   ]}
 ],
 atelier:{t:'browser',titlu:'Găsește sursa de încredere',
  intro:`<p>La biologie trebuie să afli <b>câți lupi trăiesc în România</b>. Motorul de căutare îți va da și reclame, și pagini care strigă, și un forum fără nume. <strong>Sarcina:</strong></p>
<ol><li>caută cu 2-3 cuvinte-cheie;</li><li>deschide pagini și pune-le cele 4 întrebări;</li><li>rămâi pe pagina credibilă și scrie în fișă autorul și data ei.</li></ol>`,
  q:'Caută câți lupi trăiesc în România, alege pagina credibilă și notează autorul și data.',start:'nou',fisa:['autor','data'],
  ajutor:'Sari peste „Sponsorizat”, peste titlul cu „INCREDIBIL!!!” și peste forumul fără nume. Pagina credibilă are autor și dată, sus, sub titlu.',
  checks:[

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">

<title>Misiunea Webmaster</title>
<meta name="description" content="Lecție-joc pentru clasa a VIII-a: pagini web în HTML, de la etichete și schelet la imagini, liste, legături, formatare și siguranța datelor.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#F1EEEA; --paper:#FFFFFF; --paper2:#F7F2EC; --line:#E0D6CB;
  --ink:#1F1A24; --ink2:#62586A; --accent:#B4441B; --accentInk:#FFFFFF; --sel:#FBE1D3;
  --mark:#FFE08A; --markInk:#1F1A24; --ok:#1C6E4A; --okbg:#E0F1E8; --bad:#B42F3C; --badbg:#F9E3E5;
  --fd:"Unbounded","Segoe UI",system-ui,sans-serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"Fira Code",Consolas,monospace;
  --tag:#6B3FA0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#15121A; --paper:#1F1A26; --paper2:#2A2333; --line:#3A3145;
  --ink:#EEE8F2; --ink2:#AFA3B8; --accent:#FF8B5E; --accentInk:#1A1016; --sel:#4A2A22;
  --mark:#F2CF63; --markInk:#1F1A24; --ok:#63D19B; --okbg:#173326; --bad:#FF8A95; --badbg:#3D1E24;
  --tag:#C9A5F2;
}}
:root[data-theme="dark"]{
  --desk:#15121A; --paper:#1F1A26; --paper2:#2A2333; --line:#3A3145;
  --ink:#EEE8F2; --ink2:#AFA3B8; --accent:#FF8B5E; --accentInk:#1A1016; --sel:#4A2A22;
  --mark:#F2CF63; --markInk:#1F1A24; --ok:#63D19B; --okbg:#173326; --bad:#FF8A95; --badbg:#3D1E24;
  --tag:#C9A5F2;
}
/* tema jocului: bara unui browser (butoanele ferestrei + bara de adresă) și etichete HTML în titlu */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;min-height:34px}
.banda .dots{display:flex;gap:6px;flex:none}
.banda .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.banda .dots i:first-child{background:#E0604E}
.banda .dots i:nth-child(2){background:#E6B33E}
.banda .dots i:nth-child(3){background:#58B26B}
.banda .url{flex:1;min-width:0;font-family:var(--fm);font-size:.72rem;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banda .url b{color:var(--ink);font-weight:600}
h1{font-size:clamp(1.55rem,6.4vw,2.9rem);font-weight:800;overflow-wrap:anywhere}
h2{font-size:clamp(1.25rem,4.6vw,1.9rem);font-weight:700}
h1 .tg{color:var(--tag);font-family:var(--fm);font-weight:500}
.reading code,.q code{color:var(--tag)}
/* Fira Code are ligaturi (</ devine un singur semn): în HTML elevul trebuie să vadă fiecare caracter */
code,.code,kbd,textarea,.hunt,.banda,.eyebrow,.hud,.tabs,.ancora,.opt,.cls-row,.toast{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
/* „așa arată în browser” din exemplele pașilor: pagina desenată cu stilurile implicite ale browserului */
.mini-pag{border:1px solid var(--line);border-radius:8px;background:#fff;color:#000;padding:6px 14px;font-family:"Times New Roman",Times,serif;margin:8px 0;font-size:1rem;line-height:1.35}
.mini-pag h1{font-size:1.9em;margin:.35em 0;font-family:inherit;font-weight:700}
.mini-pag h2{font-size:1.45em;margin:.4em 0;font-family:inherit;font-weight:700}
.mini-pag h3{font-size:1.15em;margin:.5em 0;font-family:inherit;font-weight:700}
.mini-pag p{margin:.6em 0}.mini-pag ol,.mini-pag ul{margin:.5em 0;padding-left:1.6em}
.mini-pag .lnk{color:#0000EE;text-decoration:underline}
</style>

<body>
<script src="../_motor/motor.js"></script>
<script src="../_motor/tip-html.js"></script>
<script>
/* MISIUNEA WEBMASTER, rescrisă pe PAȘI (26.09.2026).
   El: „informația e prea condensată - nu e beginner friendly - e mai mult test decât asistență de învățare”;
   „aici sunt noțiuni nepredate - exemplu </heat>”; „ar trebui indentare și aliniere la stânga”;
   „îmi place htmledit.squarefree.com - o idee simplă, dar i-ar trebui un mod de testare”.
   De aceea: fiecare nivel = pași mici (o idee, un exemplu, „explică-mi altfel”, exercițiu cu indiciu și variante),
   atelier (editorul HTML cu pagina desenată live și TESTE bifate), abia apoi verificarea — și verificarea
   folosește doar ce s-a predat în pași (poarta test_joc o verifică). Codul se arată mereu indentat. */
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const c=s=>`<code>${X(s)}</code>`;                         // etichetă în text: c('<p>')
const pre=s=>`<pre>${X(s)}</pre>`;                          // cod pe mai multe rânduri, indentat
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../web-viii/img/${f}" target="_blank"><img src="../web-viii/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* „în browser arată așa”: un mic cadru care imită pagina desenată (text, nu imagine), pentru exemple */
const pagina=h=>`<div class="mini-pag" aria-label="Așa arată în browser">${h}</div>`;

/* conținuturile programei (OMEN 3393/2017), textul exact din curriculum.json */
const P={
  interfata:'Elemente de interfaţă ale unui editor de pagini web',
  instrumente:'Instrumente de bază ale editorului de pagini web',
  structura:'Elemente de structură ale unei pagini web: antet, titlu, corp',
  editare:'Operații de editare a elementelor de conținut (paragraf, imagini, tabele, liste, legături): inserare, ștergere, mutare, copiere',
  formatare:'Operații de formatare la nivel de text, paragraf, fundal',
  securitate:'Securitate cibernetică'
};

const SCHELET=`<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Clasa mea</title>
  </head>
  <body>
    <h1>Clasa a VIII-a B</h1>
    <p>Bine ați venit!</p>
  </body>
</html>`;

const LEVELS=[
/* ================= 1. Cum e făcută o pagină web (lecția 14) ================= */
{t:'Cum e făcută o pagină web',lectii:[14],continuturi:[P.interfata,P.instrumente],
 obiectiv:'știi ce e o pagină web, ce e o etichetă HTML și scrii primul tău paragraf într-un editor.',
 pasi:[
  {t:'O pagină web e un fișier text',
   text:`<p>Fiecare pagină pe care o vezi pe internet e, de fapt, un <mark>fișier text</mark> cu numele terminat în <strong>.html</strong> (de exemplu <code>pagina.html</code>).</p>
<p>Fișierul îl poți deschide în două feluri:</p>
<ul><li>în <strong>Notepad</strong> vezi textul lui, cu toate semnele;</li>
<li>în <strong>browser</strong> (Chrome, Edge, Firefox) vezi pagina „desenată”: titluri mari, paragrafe, imagini.</li></ul>
${fig('cod-schelet.webp',563,520,'Fișierul pagina.html deschis în Notepad: textul paginii, rând cu rând, cu semnele < și >','<b>În Notepad</b>: vezi textul fișierului.')}
${fig('pag-schelet.webp',620,346,'Același fișier deschis în Chrome: titlul mare, subtitlul și paragraful','<b>În browser</b>: același fișier, desenat ca pagină.')}`,
   altfel:`<p>Gândește-te la o rețetă: pe hârtie e doar text („pune 2 ouă, amestecă”). Bucătarul o citește și face prăjitura. Fișierul .html e rețeta, iar <strong>browserul e bucătarul</strong> care face din ea pagina.</p>`,
   incearca:{t:'tf',q:'O pagină web se poate deschide și în Notepad.',ok:true,ajutor:'Recitește prima listă din pas: în ce două feluri se deschide fișierul?',why:'Adevărat. E un fișier text: în Notepad îi vezi textul, în browser vezi pagina desenată.'},
   inca:[
    {t:'choice',q:'Ce program „desenează” pagina din fișierul .html?',o:['Browserul (Chrome, Edge, Firefox)','Notepad','Calculatorul din Windows','Paint'],ok:0,ajutor:'E programul cu care intri pe internet.',why:'Browserul citește fișierul și desenează pagina. Notepad îți arată doar textul.'},
    {t:'choice',q:'Care nume de fișier e al unei pagini web?',o:['excursie.html','excursie.docx','excursie.jpg','excursie.mp3'],ok:0,ajutor:'Caută terminația despre care vorbește pasul.',why:'Paginile web au terminația .html. .docx e document Word, .jpg e imagine, .mp3 e sunet.'}
   ]},
  {t:'Etichetele: una deschide, una închide',
   text:`<p>În fișier, fiecare bucată de text e „îmbrăcată” în <mark>etichete</mark>. O etichetă e un cuvânt scurt între semnele <code>&lt;</code> și <code>&gt;</code>.</p>
<p>Etichetele vin de obicei <strong>în pereche</strong>:</p>
<ul><li><code>&lt;p&gt;</code> <strong>deschide</strong> un paragraf;</li>
<li><code>&lt;/p&gt;</code> îl <strong>închide</strong>. Are în plus bara <code>/</code>, pusă imediat după <code>&lt;</code>.</li></ul>
<p>Textul stă între ele. Browserul nu arată etichetele, arată doar textul, așezat cum spun ele.</p>`,
   exemplu:`<p>Scrii în fișier:</p>${pre('<p>Salut, clasa a VIII-a!</p>')}<p>În browser apare doar:</p>${pagina('<p>Salut, clasa a VIII-a!</p>')}`,
   altfel:`<p>Etichetele sunt ca parantezele: <b>(</b> deschide, <b>)</b> închide, iar ce e înăuntru ține împreună. La HTML, „paranteza care închide” se recunoaște după bara <code>/</code>.</p>`,
   incearca:{t:'classify',q:'Etichetă care deschide sau etichetă care închide?',cats:['Deschide','Închide'],items:[['<p>',0],['</p>',1],['<h1>',0],['</h1>',1]],ajutor:'Caută bara / imediat după semnul <.',why:'Bara / apare doar în eticheta care închide.'},
   inca:[
    {t:'choice',q:'Care etichetă ÎNCHIDE un paragraf?',o:['</p>','<p>','<\\p>','<p/>'],ok:0,ajutor:'Bara stă imediat după <, iar bara e /, nu \\.',why:'Eticheta de închidere repetă numele, cu bara <code>/</code> imediat după <code>&lt;</code>. Bara inversă <code>\\</code> nu are rol în HTML.'},
    {t:'tf',q:'Browserul afișează pe pagină și etichetele, de exemplu <code>&lt;p&gt;</code>.',ok:false,ajutor:'Uită-te la exemplul „Uite cum”: ce apare în browser?',why:'Fals. Etichetele sunt instrucțiuni pentru browser; pe pagină apare doar textul dintre ele.'}
   ]},
  {t:'HTML spune ce ROL are fiecare bucată',
   text:`<p>Limbajul etichetelor se numește <mark>HTML</mark>. Este un <strong>limbaj de marcare</strong>: nu face calcule și nu ia decizii, doar <em>marchează</em> ce rol are fiecare bucată de text.</p>
<p>Primele două etichete de care ai nevoie:</p>
<ul><li><code>&lt;h1&gt;</code> … <code>&lt;/h1&gt;</code> = <strong>titlul</strong> mare al paginii;</li>
<li><code>&lt;p&gt;</code> … <code>&lt;/p&gt;</code> = un <strong>paragraf</strong> de text.</li></ul>`,
   exemplu:`${pre('<h1>Munții Carpați</h1>\n<p>Sunt cei mai înalți munți din România.</p>')}${pagina('<h1>Munții Carpați</h1><p>Sunt cei mai înalți munți din România.</p>')}`,
   incearca:{t:'match',q:'Potrivește eticheta cu rolul ei.',pairs:[['<h1>','Titlul mare al paginii'],['<p>','Un paragraf de text'],['</p>','Sfârșitul paragrafului']],ajutor:'h vine de la „heading” (titlu), p de la „paragraph”.',why:'<code>&lt;h1&gt;</code> marchează titlul, <code>&lt;p&gt;</code> paragraful, iar eticheta cu bară îl închide.'},
   inca:[
    {t:'choice',q:'Ce este HTML?',o:['Un limbaj de marcare, care arată ce rol are fiecare parte','Un limbaj de programare, care face calcule','Un browser, programul care deschide paginile','Un program de desenat imagini'],ok:0,ajutor:'Recitește prima propoziție a pasului.',why:'HTML doar marchează: asta e titlu, asta e paragraf. Calculele sunt treaba limbajelor de programare.'}
   ]},
  {t:'Editorul de pagini web',
   text:`<p>Paginile se scriu într-un <mark>editor de pagini web</mark>. Aproape toate au trei zone:</p>
<ul><li><strong>zona de cod</strong>: aici scrii etichetele;</li>
<li><strong>previzualizarea</strong>: pagina, așa cum o va desena browserul;</li>
<li><strong>bara de instrumente</strong>: butoane care scriu etichetele în locul tău (titlu, imagine, listă, legătură).</li></ul>
<p>La final <strong>salvezi</strong> fișierul .html și îl deschizi în browser. Atelierul din joc e un astfel de editor: cod în stânga, pagina alături, butoane sus.</p>`,
   altfel:`<p>E ca la un joc video cu editor de nivele: într-o parte construiești, în cealaltă vezi imediat cum arată. Butoanele sunt scurtături; tot ce fac ele poți scrie și de mână.</p>`,
   incearca:{t:'match',q:'Potrivește fiecare parte a editorului cu rolul ei.',pairs:[['Zona de cod','Aici scrii etichetele'],['Previzualizarea','Arată pagina cum o va desena browserul'],['Bara de instrumente','Butoane care scriu etichete în locul tău']],ajutor:'Recitește lista din pas: fiecare rând începe cu numele zonei.',why:'Scrii în zona de cod (sau cu butoanele), verifici în previzualizare, apoi salvezi și deschizi în browser.'},
   inca:[
    {t:'choice',q:'În editor apeși butonul care inserează un titlu. Ce se schimbă în zona de cod?',o:['Apare eticheta de titlu, scrisă de editor','Nu se schimbă nimic în cod','Se șterg etichetele de până atunci','Se deschide singur browserul'],ok:0,ajutor:'Butoanele sunt scurtături pentru ceva ce poți face și de mână.',why:'Butoanele scriu în cod aceleași etichete pe care le-ai scrie tu.'}
   ]}
 ],
 atelier:{t:'html',titlu:'Primul tău paragraf',
  intro:`<p>Editorul de mai jos are deja un titlu. <strong>Sarcina:</strong> scrie sub el un paragraf, de la <code>&lt;p&gt;</code> la <code>&lt;/p&gt;</code>, cu o propoziție despre tine. Privește cum apare în pagină cât scrii, apoi apasă <b>Rulează testele</b>.</p>`,
  q:'Scrie un paragraf sub titlu.',start:'<h1>Pagina mea</h1>\n',
  ajutor:'Scrie pe rândul 2: <code>&lt;p&gt;</code>, apoi propoziția ta, apoi <code>&lt;/p&gt;</code>.',
  checks:[
   {el:'h1',text:'Pagina mea',ce:'Titlul <code>&lt;h1&gt;</code> „Pagina mea” e tot acolo',msg:'Titlul a dispărut. Scrie-l la loc: <h1>Pagina mea</h1>.'},
   {el:'p',full:true,ce:'Există un paragraf <code>&lt;p&gt;</code> cu text',msg:'Nu găsesc un paragraf cu text: <p>propoziția ta</p>.'},
   {curat:true,ce:'Toate etichetele sunt închise corect (corectorul e mulțumit)',msg:'Uită-te la corector: o etichetă nu e închisă sau are nume greșit.'}],
  solutie:'<h1>Pagina mea</h1>\n<p>Îmi place să joc baschet.</p>',why:'Ai scris HTML adevărat: <code>&lt;p&gt;</code> deschide paragraful, <code>&lt;/p&gt;</code> îl închide, iar browserul a desenat textul.',
  inca:[{t:'html',q:'Încă una: fă o pagină cu titlul tău (<code>&lt;h1&gt;</code>, numele tău) și două paragrafe.',start:'',
   ajutor:'Trei rânduri: <code>&lt;h1&gt;…&lt;/h1&gt;</code>, apoi două rânduri <code>&lt;p&gt;…&lt;/p&gt;</code>.',
   checks:[{el:'h1',full:true,ce:'Există un titlu <code>&lt;h1&gt;</code> cu text',msg:'Lipsește titlul <h1> cu numele tău.'},
    {el:'body',min:2,child:'p',ce:'Există cel puțin 2 paragrafe <code>&lt;p&gt;</code> cu text',msg:'Scrie două paragrafe <p>…</p>, fiecare cu text.'},
    {curat:true,ce:'Toate etichetele sunt închise corect',msg:'Uită-te la corector.'}],
   solutie:'<h1>Ana Popescu</h1>\n<p>Sunt în clasa a VIII-a.</p>\n<p>Îmi place muzica.</p>',why:'Un titlu și două paragrafe: fiecare cu perechea lui de etichete.'}]},
 qs:[
  {t:'choice',q:'Ce este HTML?',o:['Un limbaj de marcare, care arată ce rol are fiecare parte a paginii','Un limbaj de programare, care face calcule și ia decizii','Un browser, programul care deschide paginile web','Un program de desenat imaginile unei pagini'],ok:0,ajutor:'„Marchează” e cuvântul-cheie din pasul 3.',why:'HTML doar marchează: asta e titlu, asta e paragraf.'},
  {t:'choice',q:'Care etichetă ÎNCHIDE un titlu mare?',o:['</h1>','<h1>','<\\h1>','<h1/>'],ok:0,ajutor:'Aceeași regulă ca la paragraf: bara / după <.',why:'Închiderea repetă numele etichetei, cu bara <code>/</code> imediat după <code>&lt;</code>.'},
  {t:'match',q:'Potrivește fiecare parte cu rolul ei.',pairs:[['Browser','Citește fișierul și desenează pagina'],['Zona de cod','Aici scrii etichetele'],['Previzualizarea','Arată pagina înainte să o salvezi'],['Bara de instrumente','Butoane care scriu etichete în locul tău']],why:'Scrii în editor, verifici în previzualizare, apoi deschizi fișierul salvat în browser.'},
  {t:'tf',q:'Fișierul unei pagini web se termină în .html și e un fișier text.',ok:true,why:'Adevărat. De aceea îl poți deschide și în Notepad.'},
  {t:'classify',q:'Etichetă care deschide sau etichetă care închide?',cats:['Deschide','Închide'],items:[['<h1>',0],['</h1>',1],['<p>',0],['</p>',1]],why:'Bara <code>/</code> apare doar în eticheta care închide.'}
 ]},

/* ================= 2. Antet, titlu, corp (lecția 15) ================= */
{t:'Antet, titlu, corp',lectii:[15],continuturi:[P.structura],
 obiectiv:'construiești scheletul complet al unei pagini și găsești singur greșelile de etichete dintr-un cod.',
 pasi:[
  {t:'Scheletul oricărei pagini',
   text:`<p>Orice pagină are același <mark>schelet</mark>, în aceeași ordine:</p>
<ol><li><code>&lt;!doctype html&gt;</code> — prima linie; anunță browserul că e o pagină HTML;</li>
<li><code>&lt;html&gt;</code> — cuprinde toată pagina și se închide la final cu <code>&lt;/html&gt;</code>;</li>
<li><code>&lt;head&gt;</code> — <mark>antetul</mark>: informații <strong>despre</strong> pagină, care nu apar în fereastră;</li>
<li><code>&lt;body&gt;</code> — <mark>corpul</mark>: tot ce vede cititorul.</li></ol>`,
   exemplu:`<p>Scheletul complet. Fiecare rând e împins la dreapta cu 2 spații față de eticheta care îl cuprinde (<b>indentare</b>):</p>${pre(SCHELET)}`,
   altfel:`<p>Gândește-te la o scrisoare: pe <b>plic</b> (antetul, <code>&lt;head&gt;</code>) scrie cui și de la cine e, dar asta nu e scrisoarea. <b>Scrisoarea</b> propriu-zisă (corpul, <code>&lt;body&gt;</code>) e ce citește omul. Amândouă stau în același <b>pachet</b>: <code>&lt;html&gt;</code>.</p>`,
   incearca:{t:'order',q:'Pune liniile scheletului în ordine.',items:['<!doctype html>','<html>','<head>','</head>','<body>','</body>','</html>'],ajutor:'Antetul vine înaintea corpului. <code>&lt;html&gt;</code> se deschide primul și se închide ultimul.',why:'Antetul, apoi corpul, amândouă în <code>&lt;html&gt;</code>. Ce s-a deschis mai târziu se închide mai devreme.'},
   inca:[
    {t:'classify',q:'Ce se pune în antet și ce în corp?',cats:['Antet (head)','Corp (body)'],items:[['<title>Clasa mea</title>',0],['<h1> cu numele clasei',1],['un paragraf despre excursie',1],['<meta charset="utf-8">',0]],ajutor:'Se vede în fereastră? Atunci e în corp.',why:'În antet stau informațiile despre pagină, care nu se văd în fereastră. Tot ce citește vizitatorul stă în corp.'}
   ]},
  {t:'Titlul de pe filă: <title>',
   text:`<p>În antet pui două lucruri:</p>
<ul><li><code>&lt;meta charset="utf-8"&gt;</code>, ca literele ș, ț, ă să apară corect. Nu se închide;</li>
<li><code>&lt;title&gt;</code>…<code>&lt;/title&gt;</code>, <mark>titlul paginii</mark>. Browserul îl scrie <strong>pe filă</strong>, sus, nu în pagină.</li></ul>
<p>Nu-l confunda cu <code>&lt;h1&gt;</code>: acela e titlul mare <strong>din pagină</strong> și stă în corp.</p>
${fig('cod-title.webp',563,520,'În codul din Notepad, eticheta title din interiorul lui head este încadrată cu roșu','În cod: <code>&lt;title&gt;</code> stă în <code>&lt;head&gt;</code>.')}
${fig('pag-title.webp',620,356,'În Chrome, textul scris în title apare pe fila browserului, încadrat cu roșu','În browser: același text apare pe <b>filă</b>, nu în pagină.')}`,
   incearca:{t:'choice',q:'Unde apare textul scris în <code>&lt;title&gt;</code>?',o:['Pe fila browserului','Cu litere mari, sus în pagină','La finalul paginii','Nicăieri'],ok:0,ajutor:'Uită-te la a doua imagine: ce e încadrat cu roșu?',why:'<code>&lt;title&gt;</code> stă în antet, iar antetul nu se vede în fereastră. Browserul scrie titlul pe filă.'},
   inca:[
    {t:'tf',q:'<code>&lt;h1&gt;</code> și <code>&lt;title&gt;</code> fac același lucru.',ok:false,ajutor:'Unul e pe filă, celălalt în pagină.',why:'Fals. <code>&lt;title&gt;</code> e în antet și apare pe filă. <code>&lt;h1&gt;</code> e în corp și apare pe pagină.'}
   ]},
  {t:'Titlurile din pagină: de la <h1> la <h6>',
   text:`<p>În corp, titlurile au <strong>șase</strong> mărimi: <code>&lt;h1&gt;</code>, <code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code>, <code>&lt;h4&gt;</code>, <code>&lt;h5&gt;</code>, <code>&lt;h6&gt;</code>. <code>&lt;h1&gt;</code> e cel mai mare (subiectul paginii), <code>&lt;h6&gt;</code> cel mai mic.</p>
<p><strong>Atât.</strong> Nu există <code>&lt;h7&gt;</code> sau <code>&lt;h0&gt;</code>. Dacă scrii o etichetă care nu există, browserul <strong>nu</strong> îți spune că ai greșit: o ignoră și afișează textul simplu.</p>`,
   exemplu:`${pre('<h1>Munții Carpați</h1>\n<h2>Carpații Meridionali</h2>\n<h3>Vârful Moldoveanu</h3>')}${pagina('<h1>Munții Carpați</h1><h2>Carpații Meridionali</h2><h3>Vârful Moldoveanu</h3>')}`,
   incearca:{t:'choice',q:'Care dintre acestea NU este o etichetă HTML?',o:['<h7>','<h1>','<h6>','<h2>'],ok:0,ajutor:'Numără: câte mărimi de titlu există?',why:'Titlurile merg doar de la <code>&lt;h1&gt;</code> la <code>&lt;h6&gt;</code>.'},
   inca:[
    {t:'order',q:'Ordonează titlurile de la cel mai MARE la cel mai mic.',items:['<h1>','<h2>','<h3>','<h6>'],why:'Cu cât cifra e mai mică, cu atât titlul e mai mare.'}
   ]},
  {t:'Cum găsești o greșeală în cod',
   text:`<p>Browserul nu arată erori: dacă greșești o etichetă, ghicește ce ai vrut și pagina iese altfel. De aceea verifici tu, rând cu rând, în <strong>trei pași</strong>:</p>
<ol><li><strong>Numele</strong>: e o etichetă care există? (<code>&lt;head&gt;</code>, <code>&lt;body&gt;</code>, <code>&lt;title&gt;</code>, <code>&lt;h1&gt;</code>…<code>&lt;h6&gt;</code>, <code>&lt;p&gt;</code>). O literă greșită, ca <code>&lt;/haed&gt;</code>, face din ea o etichetă care nu există.</li>
<li><strong>Bara</strong>: eticheta care închide are <code>/</code>? Un <code>&lt;body&gt;</code> fără bară, pus la final, <em>deschide</em> încă un corp în loc să-l închidă.</li>
<li><strong>Perechea</strong>: fiecare etichetă deschisă are închiderea ei, iar ce e înăuntru se închide înăuntru.</li></ol>
<p>Aici te ajută <mark>indentarea</mark>: dacă fiecare rând e împins cu 2 spații față de eticheta care îl cuprinde, perechile stau una sub alta și vezi imediat ce lipsește.</p>`,
   exemplu:`<p>Cod cu o greșeală. Uită-te la ultimele rânduri: <code>&lt;body&gt;</code> stă sub <code>&lt;body&gt;</code>, dar ar trebui să fie închiderea lui.</p>${pre('<body>\n  <h1>Clasa mea</h1>\n  <p>Suntem 24 de elevi.</p>\n<body>')}<p>Corect: ultimul rând este <code>&lt;/body&gt;</code>, cu bară.</p>`,
   altfel:`<p>E ca la ghiozdan: dacă deschizi penarul (<code>&lt;p&gt;</code>) înăuntrul ghiozdanului (<code>&lt;body&gt;</code>), întâi închizi penarul, apoi ghiozdanul. Indentarea e ca și cum ai pune penarul puțin mai la dreapta, ca să se vadă că e <em>în</em> ghiozdan.</p>`,
   incearca:{t:'hunt',cod:true,q:'În codul de mai jos e <b>o</b> greșeală. Apasă pe ea.',src:`<body>
  <h1>Clasa mea</h1>
  <p>Suntem 24 de elevi.</p>
[[<body>|Corpul se închide cu </body>, cu bară. Fără bară, e o etichetă care deschide.]]`,corect:`<body>
  <h1>Clasa mea</h1>
  <p>Suntem 24 de elevi.</p>
</body>`,ajutor:'Pasul 2 din strategie: care etichetă de la final ar trebui să aibă bară?',why:'Ultimul rând trebuie să închidă corpul: <code>&lt;/body&gt;</code>.'},
   inca:[
    {t:'hunt',cod:true,q:'Aici sunt <b>2</b> greșeli. Folosește cei trei pași: nume, bară, pereche.',src:`<head>
  <title>Excursia</title>
[[</haed>|Nume greșit: antetul se închide cu </head> (h-e-a-d).]]
<body>
  [[<h7>La munte</h7>|Titlurile merg doar de la <h1> la <h6>.]]
</body>`,corect:`<head>
  <title>Excursia</title>
</head>
<body>
  <h1>La munte</h1>
</body>`,ajutor:'Citește literă cu literă numele fiecărei etichete. Apoi: ce mărimi de titlu există?',why:'O literă greșită sau o cifră prea mare fac o etichetă care nu există.'},
    {t:'hunt',cod:true,q:'Aici e <b>o</b> greșeală de pereche. Apasă pe locul unde trebuia să se închidă ceva.',src:`<p>Vârful Moldoveanu are 2544 de [[metri.|Aici se termină primul paragraf, dar lipsește </p>.]]
<p>E cel mai înalt vârf din România.</p>`,corect:`<p>Vârful Moldoveanu are 2544 de metri.</p>
<p>E cel mai înalt vârf din România.</p>`,ajutor:'Numără: câte <code>&lt;p&gt;</code> deschise și câte <code>&lt;/p&gt;</code>?',why:'Primul paragraf nu e închis: îi lipsește <code>&lt;/p&gt;</code> la capătul rândului. Pe rândul de mai sus, apasă pe cuvântul de la final ca să marchezi locul.'}
   ]}
 ],

  intro:`<p>Editorul are scheletul, dar îi lipsesc două lucruri. <strong>Sarcina:</strong> (1) în antet, scrie titlul paginii <code>Clasa mea</code> în <code>&lt;title&gt;</code>; (2) în corp, scrie un titlu <code>&lt;h1&gt;</code> cu clasa ta. Uită-te sus, pe „fila” previzualizării: acolo apare titlul din <code>&lt;title&gt;</code>.</p>`,

/* ================= 3. Paragrafe și imagini (lecția 16) ================= */
{t:'Paragrafe și imagini',lectii:[16],continuturi:[P.editare],
 obiectiv:'scrii paragrafe și rânduri noi, pui o imagine cu text alternativ și muți, copiezi sau ștergi un element întreg.',
 pasi:[
  {t:'Paragrafe și rânduri noi',
   text:`<p>Fiecare paragraf are perechea lui: <code>&lt;p&gt;</code>…<code>&lt;/p&gt;</code>. Browserul lasă un mic spațiu între paragrafe.</p>
<p>Atenție: <strong>Enter-urile din cod nu contează</strong>. Dacă scrii două propoziții pe rânduri diferite, dar în același paragraf, apar una după alta, pe același rând.</p>
<p>Ca să rupi rândul în interiorul paragrafului, pui <code>&lt;br&gt;</code> („break” = rupe). <code>&lt;br&gt;</code> <strong>nu se închide</strong>: nu are text înăuntru.</p>`,
   exemplu:`${pre('<p>Carpații formează un arc.\nSunt munți tineri.</p>\n<p>Au multe peșteri.<br>Și multe lacuri.</p>')}${pagina('<p>Carpații formează un arc. Sunt munți tineri.</p><p>Au multe peșteri.<br>Și multe lacuri.</p>')}<p>Primul paragraf: Enter-ul din cod n-a contat. Al doilea: <code>&lt;br&gt;</code> a rupt rândul.</p>`,
   incearca:{t:'choice',q:'Scrii două propoziții pe rânduri diferite, în același <code>&lt;p&gt;</code>, fără <code>&lt;br&gt;</code>. Cum apar?',o:['Pe același rând, una după alta','Pe două rânduri','Ca două paragrafe','Nu apar deloc'],ok:0,ajutor:'Uită-te la primul paragraf din exemplu.',why:'Browserul nu ține cont de Enter-urile din cod. Un rând nou îl ceri cu <code>&lt;br&gt;</code>.'},
   inca:[
    {t:'tf',q:'<code>&lt;br&gt;</code> are nevoie de o etichetă de închidere.',ok:false,ajutor:'Are text înăuntru?',why:'Fals. <code>&lt;br&gt;</code> doar rupe rândul; nu cuprinde text, deci nu se închide.'}
   ]},
  {t:'Imaginea și atributele ei',
   text:`<p>O imagine se pune cu <code>&lt;img&gt;</code>, care nici ea <strong>nu se închide</strong> (nu există <code>&lt;/img&gt;</code>). Tot ce-i trebuie scrii în <mark>atribute</mark>, în interiorul etichetei, sub forma <code>nume="valoare"</code>:</p>
<ul><li><code>src</code> („source”, sursa) = <strong>fișierul</strong> imaginii, de exemplu <code>src="carpati.jpg"</code>;</li>
<li><code>alt</code> = <mark>textul alternativ</mark>: o descriere în cuvinte. Apare dacă imaginea nu se încarcă și e citit cu voce tare pentru nevăzători.</li></ul>
${fig('cod-paragrafe.webp',593,616,'Cod în Notepad cu două paragrafe, un br și eticheta img cu atributele src și alt, încadrată','În cod: <code>&lt;img&gt;</code> cu <code>src</code> și <code>alt</code> (încadrat).')}
${fig('pag-paragrafe.webp',620,425,'În browser, în locul imaginii care lipsește se vede textul din alt','În browser: fișierul lipsește, așa că se vede <b>textul din <code>alt</code></b>.')}`,
   exemplu:pre('<img src="carpati.jpg" alt="Vârfuri înzăpezite din Munții Carpați">'),
   altfel:`<p><code>src</code> răspunde la „<b>ce</b> poză?”, <code>alt</code> la „<b>ce se vede</b> în poză?”. Ca atunci când îi descrii la telefon unui prieten o fotografie pe care el n-o poate vedea.</p>`,
   incearca:{t:'choice',q:'Ce face atributul <code>alt</code> al unei imagini?',o:['Dă textul care apare în locul imaginii','Alege fișierul imaginii de afișat','Mărește imaginea pe toată lățimea','Pune un chenar colorat în jurul ei'],ok:0,ajutor:'Uită-te la a doua captură.',why:'<code>alt</code> descrie imaginea în cuvinte. Fișierul îl alege <code>src</code>.'},
   inca:[
    {t:'choice',q:'Care atribut spune ce FIȘIER se afișează?',o:['src','alt','img','p'],ok:0,why:'<code>src</code> = sursa, fișierul. <code>alt</code> e descrierea.'},
    {t:'tf',q:'Eticheta <code>&lt;img&gt;</code> se închide cu <code>&lt;/img&gt;</code>.',ok:false,why:'Fals. Imaginea nu are text înăuntru; tot ce-i trebuie stă în atribute.'}
   ]},
  {t:'Editezi un element ÎNTREG',
   text:`<p>Când muți, copiezi sau ștergi un paragraf, iei <strong>tot elementul</strong>: de la eticheta care deschide până la cea care închide, cu textul dintre ele. Dacă iei doar o parte, rămân etichete fără pereche.</p>
<p>Îl selectezi cu mouse-ul (sau cu <kbd>Shift</kbd> + săgeți), apoi:</p>
<ul><li><kbd>Ctrl</kbd>+<kbd>C</kbd> <strong>copiază</strong> (originalul rămâne);</li>
<li><kbd>Ctrl</kbd>+<kbd>X</kbd> <strong>decupează</strong> — așa <strong>muți</strong> (originalul dispare);</li>
<li><kbd>Ctrl</kbd>+<kbd>V</kbd> <strong>lipește</strong> unde e cursorul;</li>
<li><kbd>Delete</kbd> <strong>șterge</strong>.</li></ul>`,
   incearca:{t:'choice',q:'Vrei să MUȚI un paragraf mai sus. Ce apeși după ce l-ai selectat?',o:['Ctrl+X, apoi Ctrl+V la locul nou','Ctrl+C, apoi Ctrl+V la locul nou','Delete, apoi Ctrl+V','Ctrl+V, apoi Ctrl+X'],ok:0,ajutor:'La mutare, originalul trebuie să dispară de unde era.',why:'Decupezi (<kbd>Ctrl</kbd>+<kbd>X</kbd>) și lipești (<kbd>Ctrl</kbd>+<kbd>V</kbd>). Cu copiere, paragraful ar apărea de două ori.'},
   inca:[
    {t:'order',q:'Pune în ordine pașii pentru a muta un paragraf.',items:['Selectezi de la <p> la </p>','Apeși Ctrl+X','Pui cursorul la locul nou','Apeși Ctrl+V'],why:'Selectezi tot elementul, îl decupezi, alegi locul, lipești.'}
   ]}
 ],
 atelier:{t:'html',titlu:'Paragraf și imagine',

    {absent:'<p[^>]*>\\s*</p>',ce:'Nu a rămas niciun paragraf gol',msg:'A rămas un paragraf gol, <p></p>. Șterge și etichetele, nu doar textul.'}],
   solutie:'<h1>Munții Carpați</h1>\n<p>Carpații formează un arc prin România.</p>\n<img src="carpati.jpg" alt="Vârfuri din Munții Carpați">',why:'Mutat întreg, fără copie, fără resturi.'}]},
 qs:[

   solutie:'<p>Vârful Moldoveanu are 2544 de metri.<br>E cel mai înalt din România.</p>',why:'<code>&lt;br&gt;</code> rupe rândul în interiorul aceluiași paragraf.'}
 ]},

/* ================= 4. Liste și tabele (lecția 17) ================= */
{t:'Liste și tabele',lectii:[17],continuturi:[P.editare],
 obiectiv:'faci liste cu buline sau numerotate și un tabel simplu, rând cu rând.',
 pasi:[
  {t:'Listele: cu buline sau numerotate',
   text:`<p>Două feluri de liste:</p>
<ul><li><code>&lt;ul&gt;</code> = <mark>listă neordonată</mark>, cu <strong>buline</strong> (ordinea nu contează: ce iei în excursie);</li>
<li><code>&lt;ol&gt;</code> = <mark>listă ordonată</mark>, <strong>numerotată</strong> 1, 2, 3 (ordinea contează: pașii unei rețete).</li></ul>
<p>Fiecare element al listei stă în <code>&lt;li&gt;</code>…<code>&lt;/li&gt;</code> („list item”), <strong>înăuntrul</strong> listei. Numerele și bulinele le pune browserul singur.</p>
${fig('pag-liste.webp',620,476,'În browser, prima listă apare cu buline, a doua numerotată 1, 2, 3','În browser: <code>&lt;ul&gt;</code> iese cu <b>buline</b>, <code>&lt;ol&gt;</code> <b>numerotată</b>.')}`,
   exemplu:`${pre('<ol>\n  <li>Spală fructele</li>\n  <li>Taie-le</li>\n  <li>Amestecă</li>\n</ol>')}${pagina('<ol><li>Spală fructele</li><li>Taie-le</li><li>Amestecă</li></ol>')}`,
   incearca:{t:'choice',q:'Vrei pașii unei rețete, numerotați 1, 2, 3. Ce listă folosești?',o:['<ol>','<ul>','<li>','<p>'],ok:0,ajutor:'o = ordered (ordonată, numerotată), u = unordered.',why:'<code>&lt;ol&gt;</code> numerotează singură. <code>&lt;li&gt;</code> e doar un element.'},
   inca:[
    {t:'tf',q:'Un <code>&lt;li&gt;</code> se scrie înăuntrul unei liste <code>&lt;ul&gt;</code> sau <code>&lt;ol&gt;</code>.',ok:true,why:'Adevărat. <code>&lt;li&gt;</code> e un element DE listă, deci are nevoie de lista lui.'},
    {t:'choice',q:'Ce iei în rucsac: apă, hartă, lanternă. Ordinea nu contează. Ce listă?',o:['<ul>','<ol>','<li>','<h1>'],ok:0,why:'Când ordinea nu contează, lista e cu buline: <code>&lt;ul&gt;</code>.'}
   ]},
  {t:'Tabelul, rând cu rând',
   text:`<p>Un <mark>tabel</mark> se scrie din afară spre înăuntru:</p>
<ul><li><code>&lt;table&gt;</code> cuprinde tot tabelul;</li>
<li><code>&lt;tr&gt;</code> = un <strong>rând</strong> („table row”);</li>
<li>în fiecare rând, celulele: <code>&lt;td&gt;</code> = celulă cu date, <code>&lt;th&gt;</code> = celulă din <strong>capul</strong> tabelului, scrisă îngroșat.</li></ul>
<p><strong>Coloanele nu se scriu separat</strong>: câte celule pui într-un rând, atâtea coloane are tabelul.</p>
${fig('pag-tabel.webp',620,375,'În browser, capul de tabel cu celulele th apare îngroșat','În browser: celulele <code>&lt;th&gt;</code> ies <b>îngroșate</b>.')}`,
   exemplu:`${pre('<table>\n  <tr>\n    <th>Vârf</th>\n    <th>Înălțime</th>\n  </tr>\n  <tr>\n    <td>Moldoveanu</td>\n    <td>2544 m</td>\n  </tr>\n</table>')}<p>2 <code>&lt;tr&gt;</code> = 2 rânduri; câte 2 celule în fiecare = 2 coloane.</p>`,
   altfel:`<p>Gândește-te la un raft de cărți: <code>&lt;table&gt;</code> e dulapul, fiecare <code>&lt;tr&gt;</code> e un raft, iar celulele sunt cărțile de pe raft. Câte cărți pui pe un raft, atâtea „coloane”.</p>`,
   incearca:{t:'choice',q:'Un tabel are 3 etichete <code>&lt;tr&gt;</code>, iar în fiecare sunt 4 <code>&lt;td&gt;</code>. Cum arată?',o:['3 rânduri și 4 coloane','4 rânduri și 3 coloane','12 rânduri','7 celule'],ok:0,ajutor:'<code>&lt;tr&gt;</code> = rând. Celulele dintr-un rând = coloanele.',why:'3 rânduri, fiecare cu 4 celule: 4 coloane, 12 celule.'},
   inca:[
    {t:'match',q:'Potrivește eticheta cu rolul ei în tabel.',pairs:[['<table>','Cuprinde tot tabelul'],['<tr>','Un rând'],['<td>','O celulă cu date'],['<th>','O celulă din capul tabelului']],why:'Tabel, apoi rânduri, apoi celule în fiecare rând.'}
   ]}
 ],

 qs:[

  {t:'choice',q:'Un tabel are 2 etichete <code>&lt;tr&gt;</code>, iar în fiecare sunt 3 <code>&lt;td&gt;</code>. Câte coloane are?',o:['3','2','6','5'],ok:0,why:'Câte celule într-un rând, atâtea coloane: 3.'},

</ul>`,ajutor:'Pereche cu pereche: fiecare <code>&lt;li&gt;</code> are <code>&lt;/li&gt;</code>? Lista se închide cu același nume cu care s-a deschis?',why:'Închiderea repetă exact numele etichetei deschise.'},
  {t:'tf',q:'Coloanele unui tabel se scriu cu o etichetă separată, înaintea rândurilor.',ok:false,why:'Fals. Coloanele ies din numărul de celule din fiecare rând.'}

/* ================= 5. Legături (lecția 18) ================= */
{t:'Legături',lectii:[18],continuturi:[P.editare],
 obiectiv:'faci legături spre alte pagini ale site-ului tău și spre alte site-uri, cu text care spune unde duc.',
 pasi:[
  {t:'Legătura: <a href="…">',
   text:`<p>O <mark>legătură</mark> (link) se scrie cu eticheta <code>&lt;a&gt;</code>:</p>
<ul><li>atributul <code>href</code> spune <strong>unde</strong> duce;</li>
<li>textul dintre <code>&lt;a …&gt;</code> și <code>&lt;/a&gt;</code> e ce vede cititorul și pe ce apasă.</li></ul>
<p>Nu confunda: <code>href</code> e pentru legături, <code>src</code> e pentru fișierul unei imagini.</p>`,
   exemplu:`${pre('<p>Vezi <a href="orar.html">Orarul clasei</a>.</p>')}${pagina('<p>Vezi <span class="lnk">Orarul clasei</span>.</p>')}`,
   incearca:{t:'choice',q:'Care atribut al etichetei <code>&lt;a&gt;</code> spune unde duce legătura?',o:['href','src','alt','link'],ok:0,ajutor:'Recitește prima liniuță.',why:'<code>href</code> ține adresa destinației. <code>src</code> e pentru imagini.'},
   inca:[
    {t:'hunt',cod:true,q:'Legătura are <b>2</b> greșeli. Apasă pe ele.',src:`[[<a src="orar.html">|Adresa destinației se scrie în href, nu în src.]]Orarul clasei[[<a>|Legătura se închide cu </a>, cu bară.]]`,corect:'<a href="orar.html">Orarul clasei</a>',why:'Fără <code>href</code> textul nu duce nicăieri. Fără <code>&lt;/a&gt;</code>, tot ce urmează devine legătură.'}
   ]},
  {t:'În același site sau în alt site',
   text:`<p>Spre o pagină din <strong>același site</strong> scrii doar numele fișierului: <code>href="orar.html"</code>.</p>
<p>Spre <strong>alt site</strong> (o <mark>resursă externă</mark>) scrii adresa întreagă, cu <code>https://</code> la început: <code>href="https://www.example.com"</code>.</p>
<p>Dacă vrei ca legătura să se deschidă într-o <strong>filă nouă</strong>, adaugi <code>target="_blank"</code>.</p>
${fig('pag-legaturi.webp',620,573,'În browser, cu mouse-ul pe legătura externă, adresa apare în colțul din stânga jos','Ține mouse-ul pe o legătură: <b>adresa apare în colțul din stânga jos</b>. Așa verifici unde duce înainte să apeși.')}`,
   exemplu:pre('<a href="galerie.html">Galeria clasei</a>\n<a href="https://www.example.com" target="_blank">Site extern</a>'),
   incearca:{t:'classify',q:'Legătură spre o pagină din același site sau spre alt site?',cats:['Același site','Alt site (externă)'],items:[['orar.html',0],['https://www.example.com',1],['galerie.html',0],['https://biblioteca.example.org',1]],ajutor:'Are https:// la început?',why:'Paginile din același site se scriu doar cu numele fișierului. Adresa întreagă, cu <code>https://</code>, duce în afara site-ului.'},
   inca:[
    {t:'choice',q:'Ce face <code>target="_blank"</code>?',o:['Deschide legătura într-o filă nouă','Face textul legăturii gol','Colorează legătura în negru','Șterge legătura'],ok:0,why:'<code>target="_blank"</code> = filă nouă.'}
   ]},
  {t:'Textul legăturii spune unde ajungi',
   text:`<p>Cine citește doar legăturile, sau le ascultă cu un cititor de ecran, trebuie să înțeleagă unde duc. De aceea textul legăturii <strong>numește destinația</strong>:</p>
<ul><li>bine: „Orarul clasei”, „Galeria de la excursie”;</li>
<li>rău: „apasă aici”, „link”, „aici”.</li></ul>`,
   incearca:{t:'tf',q:'„Apasă aici” e un text bun pentru o legătură.',ok:false,ajutor:'Dacă citești doar textul legăturii, afli unde duce?',why:'Fals. „Apasă aici” nu spune unde ajungi.'}}
 ],

 qs:[

/* ================= 6. Formatare (lecția 19) ================= */
{t:'Formatare: text, paragraf, fundal',lectii:[19],continuturi:[P.formatare],
 obiectiv:'schimbi culoarea, mărimea și fontul textului, alinierea paragrafelor și fundalul paginii, cu atributul style.',
 pasi:[
  {t:'Atributul style: proprietate și valoare',
   text:`<p>Aspectul se schimbă cu <mark>stiluri</mark> (CSS). În cod, stilul se scrie în atributul <code>style</code>, în eticheta de deschidere:</p>
<ul><li>întâi <strong>proprietatea</strong> (ce schimbi), de exemplu <code>color</code>;</li>
<li>apoi <strong>două puncte</strong> <code>:</code></li>
<li>apoi <strong>valoarea</strong>, de exemplu <code>navy</code>;</li>
<li>între două proprietăți pui <strong>punct și virgulă</strong> <code>;</code>.</li></ul>
<p>Nu <code>=</code>, ci <code>:</code>. Numele proprietăților sunt în engleză.</p>`,
   exemplu:`${pre('<h1 style="color: navy; text-align: center">Munții Carpați</h1>')}${pagina('<h1 style="color:navy;text-align:center">Munții Carpați</h1>')}`,
   altfel:`<p>Ca o fișă de comandă: „culoare: albastru; mărime: mare”. Întâi ce vrei să schimbi, două puncte, apoi cum vrei să fie. Fiecare comandă se termină cu <code>;</code>.</p>`,
   incearca:{t:'choice',q:'Care stil e scris CORECT?',o:['style="color: navy"','style="color = navy"','style="navy: color"','style="color navy"'],ok:0,ajutor:'Proprietatea întâi, apoi <code>:</code>, apoi valoarea.',why:'<code>proprietate: valoare</code>, cu două puncte.'},
   inca:[
    {t:'choice',q:'Ce semn pui între DOUĂ proprietăți din același style?',o:[';',':','=',','],ok:0,why:'Punctul și virgula despart proprietățile: <code>color: navy; text-align: center</code>.'}
   ]},
  {t:'Formatarea TEXTULUI',
   text:`<p>Pentru litere ai trei proprietăți:</p>
<ul><li><code>color</code> = culoarea literelor (<code>red</code>, <code>navy</code>, <code>green</code>…);</li>
<li><code>font-size</code> = mărimea literelor, de exemplu <code>font-size: 20px</code> (px = pixeli);</li>
<li><code>font-family</code> = fontul, de exemplu <code>font-family: Arial</code>.</li></ul>`,
   exemplu:`${pre('<p style="color: green; font-size: 20px">Pădurea e verde.</p>')}${pagina('<p style="color:green;font-size:20px">Pădurea e verde.</p>')}`,
   incearca:{t:'match',q:'Potrivește proprietatea cu efectul ei.',pairs:[['color','Culoarea literelor'],['font-size','Mărimea literelor'],['font-family','Fontul']],ajutor:'<em>size</em> = mărime, <em>family</em> = familie de fonturi.',why:'Toate trei privesc literele.'}},
  {t:'Formatarea PARAGRAFULUI: alinierea',
   text:`<p>Paragraful întreg se aliniază cu <code>text-align</code>:</p>
<ul><li><code>left</code> = la stânga (așa e de la sine);</li>
<li><code>center</code> = centrat;</li>
<li><code>right</code> = la dreapta;</li>
<li><code>justify</code> = aliniat la ambele margini.</li></ul>`,
   exemplu:`${pre('<p style="text-align: center">Titlu centrat</p>')}${pagina('<p style="text-align:center">Titlu centrat</p>')}`,
   incearca:{t:'choice',q:'Vrei un titlu centrat. Ce scrii în eticheta lui?',o:['style="text-align: center"','style="color: center"','style="align = center"','style="background-color: center"'],ok:0,ajutor:'Alinierea e <code>text-align</code>.',why:'Alinierea e <code>text-align</code>, cu <code>:</code>, nu <code>=</code>.'}},
  {t:'FUNDALUL și contrastul',
   text:`<p>Culoarea din spatele textului se schimbă cu <code>background-color</code>. Pusă pe <code>&lt;body&gt;</code>, colorează <strong>toată pagina</strong>: <code>&lt;body style="background-color: lightyellow"&gt;</code>.</p>
<p>Alege culori cu <mark>contrast</mark>: text închis pe fundal deschis (sau invers). Galben pe alb nu se citește.</p>
${fig('pag-formatare-inainte.webp',620,397,'Pagina fără niciun stil: text negru pe fundal alb, aliniat la stânga','<b>Înainte</b>: fără stiluri.')}
${fig('pag-formatare-dupa.webp',620,397,'Aceeași pagină cu stiluri: titlu albastru centrat, text mai mare, fundal crem','<b>După</b>: titlu albastru centrat, text mai mare, fundal crem.')}`,

   inca:[{t:'tf',q:'Text galben-deschis pe fundal alb se citește ușor.',ok:false,why:'Fals. Fără contrast, textul abia se vede.'}]}
 ],

/* ================= 7. Pagina clasei, în siguranță (lecțiile 20-21) ================= */
{t:'Pagina clasei, în siguranță',lectii:[20,21],continuturi:[P.securitate,P.editare],final:true,
 obiectiv:'construiești singur pagina clasei după o listă de cerințe, fără nicio dată personală, și recunoști o pagină falsă.',
 pasi:[
  {t:'Ce NU publici niciodată',
   text:`<p>Ce pui pe web poate rămâne acolo multă vreme, chiar dacă ștergi mai târziu: cineva poate să-l fi copiat. Pe pagina clasei <strong>nu</strong> pui niciodată:</p>
<ul><li><mark>parole</mark> și coduri;</li><li>adresa de acasă, numărul de telefon, data nașterii;</li><li>poze cu colegi fără acordul lor.</li></ul>
<p>Atenție: și <strong>codul</strong> paginii e public. O parolă scrisă în cod, chiar dacă nu apare pe pagină, o poate citi oricine (clic dreapta → Vezi sursa).</p>`,
   incearca:{t:'classify',q:'Poate apărea pe pagina clasei?',cats:['Da','Nu'],items:[['Lista proiectelor clasei',0],['Parola platformei școlare',1],['Adresa de acasă a unui coleg',1],['Rezultatul clasei la un concurs',0]],ajutor:'E despre munca clasei sau e o dată despre o persoană?',why:'Proiectele și rezultatele sunt despre munca clasei. Parola și adresa pot fi folosite împotriva cuiva.'},
   inca:[{t:'choice',q:'Vrei să pui pe pagină o poză de la excursie, cu colegii. Ce faci întâi?',o:['Ceri acordul colegilor și întrebi profesorul','O publici, oricum toți au fost acolo','Scrii sub poză numele fiecăruia','O publici și o ștergi dacă se supără cineva'],ok:0,why:'Poza cu o persoană e un dat personal. Fără acord nu o publici.'}]},
  {t:'Paginile false (inginerie socială)',
   text:`<p><mark>Ingineria socială</mark> înseamnă să fii păcălit să-ți dai singur datele. Semnele unei pagini sau ale unui mesaj fals:</p>
<ul><li><strong>graba</strong>: „doar 10 minute!”;</li><li><strong>premii prea bune</strong>: „ai câștigat un telefon!”, fără să fi participat la ceva;</li>
<li>cererea de <strong>parolă sau cod</strong>;</li><li>o <strong>adresă care imită</strong> una cunoscută: <code>c0nt-scoala</code>, cu cifra 0 în loc de litera o.</li></ul>
<p>Un singur semn e destul: închizi pagina și anunți un adult.</p>`,
   incearca:{t:'choice',q:'Primești: „Ai câștigat o tabletă! Intră în 10 minute pe premii-rapide.test și scrie parola.” Ce faci?',o:['Închizi mesajul și anunți un adult','Intri repede, ca să nu pierzi premiul','Trimiți parola, dar nu și numele','Dai mesajul mai departe colegilor'],ok:0,ajutor:'Numără semnele din pas: câte găsești în mesaj?',why:'Graba, premiul și cererea de parolă: trei semne în același mesaj.'}},
  {t:'Cum construiești o pagină după cerințe',
   text:`<p>La misiunea finală primești o <strong>listă de cerințe</strong>. Lucrezi ca un webmaster adevărat:</p>
<ol><li><strong>Citește toate cerințele</strong> înainte să scrii ceva. Fiecare cerință e un test.</li>
<li><strong>Una câte una</strong>: scrii o cerință, te uiți în previzualizare, <strong>rulezi testele</strong>.</li>
<li><strong>Citește corectorul</strong>: îți spune rândul unde o etichetă nu e închisă sau are nume greșit.</li>
<li><strong>Recitește codul</strong> la final: nicio parolă, nicio adresă, niciun telefon.</li></ol>`,
   altfel:`<p>E ca la o listă de cumpărături: nu alergi prin tot magazinul deodată. Iei un produs, îl bifezi, treci la următorul. Testele sunt bifele tale.</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii unui webmaster.',items:['Citești toate cerințele','Scrii o cerință','Te uiți în previzualizare și rulezi testele','Recitești codul pentru date personale'],why:'Cerințele întâi, apoi pas cu pas cu testele, iar la final verificarea datelor.'}}
 ],

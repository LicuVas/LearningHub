<script src="../_motor/motor.js"></script>
<script>
// algoritm pe mai multe rânduri; stilul e pus direct pe element, ca să arate la fel și în recapitularea clasei
const A=s=>`<code class="alg" style="display:block;white-space:pre-wrap;line-height:1.55;padding:.45em .7em;margin:.5em 0">${s}</code>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../algoritmi-v/img/${f}" target="_blank"><img src="../algoritmi-v/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
// tabel de urmărire static (pentru exemplele din pași)
const TT=(cap,rows)=>`<div class="tu-w"><table class="tu"><thead><tr>${cap.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ================= Simulatorul „urmarire”: tabelul de urmărire, ca pe caiet =================
   Calculatorul alege datele de intrare (altele la fiecare deschidere), elevul execută algoritmul rând cu rând.
   Verificarea e pe COMPORTAMENT: algoritmul e chiar textul afișat, interpretat aici, deci răspunsul
   corect se calculează pentru datele de acum, nu e scris de mână. */
function urmEval(expr,v){
  const js=expr.replace(/[≥≤≠=]/g,c=>({'≥':'>=','≤':'<=','≠':'!=','=':'=='})[c])
    .replace(/\sȘI\s/g,' && ').replace(/\sSAU\s/g,' || ').replace(/NU\s*\(/g,'!(');
  return new Function('v','with(v){return ('+js+')}')(v);
}
function urmTrace(prog,d){
  const v=Object.assign({},d);let cond=null,br=null;
  return prog.map((raw,i)=>{
    const ind=/^\s/.test(raw),s=raw.trim();let m;
    if(!ind&&!/^altfel$/i.test(s))br=null;
    const exec=!ind||(br==='da'&&cond)||(br==='nu'&&!cond);
    const r={i,raw,exec,ind,k:'nimic'};
    if(/^altfel$/i.test(s)){br='nu';return r}
    if((m=s.match(/^Citește (.+?)\.?$/))){r.k='cit';r.names=m[1].split(/\s*,\s*|\s+și\s+/);r.names.forEach(n=>v[n]=d[n]);return r}
    if((m=s.match(/^Dacă (.+) atunci$/))){r.k='daca';cond=!!urmEval(m[1],v);br='da';r.val=cond;return r}
    if((m=s.match(/^Afișează (.+?)\.?$/))){r.k='afis';const t=m[1].match(/^„(.*)”$/);r.val=exec?(t?t[1]:urmEval(m[1],v)):'';return r}
    if((m=s.match(/^([\p{L}_][\p{L}\d_]*) ← (.+)$/u))){r.k='set';r.name=m[1];if(exec){r.val=urmEval(m[2],v);v[m[1]]=r.val}else r.val='';return r}
    return r;
  });
}
const urmFmt=x=>x===true?'adevărat':x===false?'fals':typeof x==='number'?String(Math.round(x*1000)/1000).replace('.',','):String(x);
function urmOk(inp,exp){
  const s=String(inp==null?'':inp).trim().toLowerCase().replace(/[„”"“]/g,'').replace(/\s+/g,' ');
  if(exp===''||exp==null)return s===''||s==='-'||s==='—';
  if(typeof exp==='boolean')return exp?(s==='adevărat'||s==='adevarat'):s==='fals';
  if(typeof exp==='number')return /^-?\d+([.,]\d+)?$/.test(s)&&Math.abs(parseFloat(s.replace(',','.'))-exp)<1e-9;
  return s===String(exp).trim().toLowerCase();
}
const URMARIRE={
  render(Q,body,api){
    const d=Q.date[Math.floor(Math.random()*Q.date.length)],tr=urmTrace(Q.prog,d);
    body._tr=tr;
    const dateTxt=Object.entries(d).map(([k,x])=>`${k} = ${urmFmt(x)}`).join(', ');
    const cell=r=>{
      if(r.k==='cit')return `<span class="dat">${r.names.map(n=>`${api.esc(n)} = ${urmFmt(d[n])}`).join(', ')}</span>`;
      if(r.k==='daca'||(r.k==='set'&&typeof r.val==='boolean'))return `${r.k==='set'?api.esc(r.name)+' = ':''}<select data-i="${r.i}" aria-label="Rândul ${r.i+1}: condiția"><option value="">alege…</option><option value="adevărat">adevărat</option><option value="fals">fals</option></select>`;
      if(r.k==='set')return `<label>${api.esc(r.name)} = <input data-i="${r.i}" autocomplete="off" aria-label="Rândul ${r.i+1}: noua valoare a lui ${api.esc(r.name)}"></label>`;
      if(r.k==='afis')return `<label>se afișează: <input data-i="${r.i}" autocomplete="off" aria-label="Rândul ${r.i+1}: ce se afișează"></label>`;
      return '';
    };
    const ck=tr.filter(r=>r.k==='daca'||r.k==='set'||r.k==='afis');
    const et=r=>r.k==='daca'?`Rândul ${r.i+1}: condiția e adevărată sau falsă`:r.k==='afis'?`Rândul ${r.i+1}: ce se afișează${r.ind?' (sau gol, dacă ramura nu se execută)':''}`:`Rândul ${r.i+1}: noua valoare a lui ${api.esc(r.name)}${r.ind?' (sau gol, dacă ramura nu se execută)':''}`;
    body.innerHTML=`<div class="datele">Datele de intrare de acum: ${api.esc(dateTxt)}</div>
      <div class="tu-w"><table class="tu sim"><thead><tr><th>Nr.</th><th>Pasul</th><th>Ce se întâmplă</th></tr></thead><tbody>
      ${tr.map(r=>`<tr><td class="nr">${r.i+1}</td><td><code class="pl${r.ind?' ind':''}">${api.esc(r.raw.trim())}</code></td><td data-c="${r.i}">${cell(r)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint" style="margin:6px 0 0">Scrie numere simple (5 sau 5,5). Pe o ramură care <b>nu</b> se execută, lași căsuța goală.</p>
      <div class="lbl" style="margin-top:8px">Testele</div><ul class="teste">${ck.map(r=>`<li data-t="${r.i}">${et(r)}</li>`).join('')}</ul>`;
    const val=i=>{const e=body.querySelector(`[data-i="${i}"]`);return e?e.value:''};
    const marcheaza=()=>{let bune=0;ck.forEach(r=>{const ok=urmOk(val(r.i),r.val);if(ok)bune++;
      body.querySelector(`td[data-c="${r.i}"]`).className=ok?'ok':'no';body.querySelector(`li[data-t="${r.i}"]`).className=ok?'ok':'no'});return bune};
    const umple=()=>ck.forEach(r=>{const e=body.querySelector(`[data-i="${r.i}"]`);e.value=r.k==='daca'?urmFmt(r.val):r.val===''?'':urmFmt(r.val)});
    body._umple=umple;
    const nav=api.checkButton(()=>{
      const bune=marcheaza();
      if(bune===ck.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${bune} din ${ck.length} teste trec. Rândurile roșii mai au nevoie de o privire: calculează partea din dreapta săgeții cu valorile de ACUM.`);
        api.revealButton(()=>{umple();marcheaza();nav.innerHTML='';api.giveUp('valorile corecte sunt acum în tabel, cu verde. Parcurge-le rând cu rând.')})}
    },'Verifică tabelul');
  },
  rezolva(Q,body){body._umple()},
  gresit(Q,body){
    body._umple();
    const tr=body._tr,r=[...tr].reverse().find(x=>x.k==='set'||x.k==='afis'||x.k==='daca');
    const e=body.querySelector(`[data-i="${r.i}"]`);
    if(r.k==='daca')e.value=r.val?'fals':'adevărat';
    else if(typeof r.val==='number')e.value=String(r.val+1);
    else e.value=r.val===''?'7':'altceva';
  }
};

const LEVELS=[
/* ================= 1. Ce este un algoritm (lecția 24) ================= */
{t:'Ce este un algoritm',lectii:[24],continuturi:['Noțiunea de algoritm'],
 obiectiv:'știi ce este un algoritm, recunoști unul în viața de zi cu zi și scrii singur pașii unui algoritm simplu, în ordine.',
 pasi:[
  {t:'Un algoritm = pași în ordine',
   text:`<p>Un <mark>algoritm</mark> este un șir de <mark>pași clari</mark>, scriși <strong>în ordine</strong>, care rezolvă o problemă.</p>
<p>Folosești algoritmi în fiecare zi, chiar dacă nu le spui așa: rețeta unei prăjituri, drumul de acasă la școală, instrucțiunile de montare a unei jucării, pașii adunării a două numere în coloană.</p>
<p>Ce au toate în comun? Sunt <strong>pași</strong>, unul după altul, și te duc la un <strong>scop</strong>. Un desen sau o listă de nume nu sunt algoritmi: nu îți spun ce să faci.</p>`,
   exemplu:`<p>Algoritmul „Fac un ceai”:</p>${A('1. Pun apă în fierbător.\n2. Pornesc fierbătorul și aștept să fiarbă apa.\n3. Pun un plic de ceai în cană.\n4. Torn apa fierbinte în cană.\n5. Aștept 3 minute și scot plicul.')}<p>Sunt pași, în ordine, și la final am un ceai.</p>`,
   altfel:`<p>Gândește-te că explici drumul spre casa ta unui prieten care n-a mai fost niciodată acolo: „Ieși din școală, mergi la dreapta până la farmacie, treci strada la semafor…”. Ce îi spui tu e un algoritm: pași în ordine care îl duc la scop.</p>`,
   incearca:{t:'classify',q:'Sortează: care sunt algoritmi?',cats:['Este algoritm','Nu este algoritm'],items:[['Instrucțiunile de montare a unui raft',0],['Rețeta de clătite',0],['Un desen cu un peisaj',1],['Lista cu numele colegilor',1]],ajutor:'Întreabă-te: îmi spune ce să fac, pas cu pas, ca să ajung la ceva?',why:'Un algoritm are pași în ordine și un scop. Un desen sau o listă de nume nu spun ce să faci.'},
   inca:[
    {t:'tf',q:'Pașii adunării a două numere „în coloană” formează un algoritm.',ok:true,ajutor:'Are pași în ordine? Te duce la un rezultat?',why:'Adevărat. Aduni unitățile, apoi zecile, ții minte ce trece peste 9… sunt pași în ordine care duc la sumă.'},
    {t:'choice',q:'Care dintre acestea este un algoritm?',o:['Pașii pentru a spăla o cană','O fotografie de la mare','Numele zilelor săptămânii','Culoarea preferată'],ok:0,why:'Doar spălatul cănii are pași de făcut, în ordine, cu un scop: o cană curată.'}
   ]},
  {t:'De la date la rezultat',
   text:`<p>Orice algoritm pornește de la ce ai <strong>la început</strong> și ajunge la ce vrei <strong>la final</strong>.</p>
<ul><li><mark>datele</mark> = ce ai la început, de la care pornești;</li>
<li><mark>pașii</mark> = ce faci cu datele (algoritmul propriu-zis);</li>
<li><mark>rezultatul</mark> = ce obții la final.</li></ul>
<p>Când citești un algoritm, caută întâi aceste trei lucruri. Te ajută să înțelegi ce face.</p>`,
   exemplu:`<p>Rețeta de clătite:</p>${TT(['Datele','Pașii','Rezultatul'],[['ouă, lapte, făină','amesteci, torni în tigaie, întorci','clătitele gata făcute']])}<p>Adunarea în coloană: datele sunt cele două numere, rezultatul este suma.</p>`,
   incearca:{t:'choice',q:'Într-o rețetă de sandvișuri, ce este <b>rezultatul</b>?',o:['Sandvișul gata făcut','Pâinea și cașcavalul','Cuțitul','Pasul „taie pâinea”'],ok:0,ajutor:'Rezultatul e ce obții la FINAL.',why:'Pâinea și cașcavalul sunt datele, „taie pâinea” e un pas. La final obții sandvișul.'},
   inca:[
    {t:'match',q:'Algoritmul „adunarea în coloană a lui 25 și 13”. Leagă fiecare parte de rolul ei.',pairs:[['25 și 13','datele'],['aduni unitățile, apoi zecile','pașii'],['38','rezultatul']],why:'Numerele de la început sunt datele, adunarea pe coloane e algoritmul, iar 38 e rezultatul.'}
   ]},
  {t:'Calculatorul face EXACT ce scrie',
   text:`<p>Calculatorul nu ghicește ce ai vrut să spui. Face <strong>exact</strong> ce scrie în pași, în ordinea scrisă. De aceea pașii pentru calculator trebuie să fie foarte preciși.</p>
<p>Pozele sunt din <mark>Scratch</mark>, un program în care pașii sunt <strong>blocuri colorate</strong> lipite unul sub altul. Apeși <strong>steagul verde</strong>, de deasupra scenei, și pisica execută blocurile de sus în jos.</p>
${fig('scratch-pasi-ordine.webp',760,345,'Scratch: trei blocuri „glisează în 0.4 secunde la x y”, încadrate și etichetate „pașii, în ordine”, iar pe scenă traseul albastru desenat de pisică','Algoritmul „drumul spre școală”: <b>pașii, în ordine</b>, iar pe scenă <b>rezultatul</b>, traseul desenat.')}`,
   exemplu:`<p>Aceiași pași, dar doi dintre ei <strong>schimbați între ei</strong>. Calculatorul nu observă „greșeala”: execută ce scrie și desenează alt drum.</p>${fig('scratch-alta-ordine.webp',760,345,'Scratch: aceleași blocuri, cu două glisări schimbate între ele, încadrate; pe scenă traseul desenat este cu totul altul','Doi pași schimbați: iese alt drum.')}`,
   altfel:`<p>E ca atunci când îi spui unui robot-jucărie „du-te la ușă”. Nu știe unde e ușa. Trebuie să-i spui: „mergi 3 pași înainte, întoarce-te la dreapta, mergi 2 pași”. Și dacă încurci ordinea, ajunge în altă parte.</p>`,
   incearca:{t:'tf',q:'Dacă schimbi între ei doi pași ai unui algoritm, calculatorul își dă seama și îi execută tot în ordinea bună.',ok:false,ajutor:'Uită-te la a doua poză: ce a desenat pisica?',why:'Fals. Calculatorul execută pașii exact în ordinea scrisă. Altă ordine înseamnă alt rezultat.'},
   inca:[
    {t:'choice',q:'De ce pașii pentru calculator trebuie să fie foarte preciși?',o:['Pentru că face exact ce scrie, nu ghicește','Pentru că refuză pașii scurți','Pentru că pașii preciși merg mai încet','Pentru că vrea pași în limba engleză'],ok:0,why:'Calculatorul nu înțelege „cam așa” sau „știi tu”. Orice pas vag duce la un rezultat greșit.'}
   ]},
  {t:'Strategia: cum scrii un algoritm',
   text:`<p>Când trebuie să scrii <strong>tu</strong> un algoritm, lucrează în patru pași:</p>
<ol><li><strong>Datele</strong>: ce am la început?</li>
<li><strong>Rezultatul</strong>: ce vreau să obțin la final?</li>
<li><strong>Pașii</strong>: împart drumul în acțiuni mici, <strong>câte una pe rând</strong>, și le numerotez.</li>
<li><strong>Proba robotului</strong>: citesc pașii ca un robot. Poate face fiecare pas fără să ghicească? Ordinea e bună?</li></ol>`,
   exemplu:`<p>„Îl sun pe un prieten.” Date: telefonul și numele prietenului. Rezultat: vorbim la telefon.</p>${A('1. Deblochez telefonul.\n2. Deschid agenda.\n3. Caut numele prietenului.\n4. Apăs butonul de apel.')}<p>Proba robotului: fără telefon deblocat nu pot deschide agenda, deci ordinea e bună.</p>`,
   incearca:{t:'order',q:'Pune în ordine pașii algoritmului: îți speli mâinile.',items:['Deschizi robinetul','Îți uzi mâinile','Te freci cu săpun','Clătești săpunul','Închizi robinetul','Te ștergi cu prosopul'],ajutor:'Fă proba robotului: ce trebuie să fie gata înainte de fiecare pas?',why:'Nu poți uda mâinile fără apă, nu clătești săpunul înainte să-l pui, iar ștersul vine la sfârșit.'},
   inca:[
    {t:'order',q:'Pune în ordine pașii: trimiți un desen la tema de informatică pe calculator.',items:['Pornești calculatorul','Deschizi programul de desen','Desenezi','Salvezi desenul','Îl trimiți profesorului'],why:'Fiecare pas are nevoie de cel dinainte: nu poți trimite un desen care încă nu e salvat.'}
   ]}
 ],
 atelier:{t:'order',titlu:'Refă scriptul din Scratch',

${fig('scratch-pasi-ordine.webp',760,345,'Scriptul din Scratch pentru drumul spre școală, cu blocurile glisează încadrate, și traseul albastru desenat pe scenă','Scriptul și drumul desenat.')}`,
  q:'Ordonează blocurile scriptului.',items:['când se dă click pe steagul verde','stilou jos (de acum pisica desenează)','glisează la x: -60 y: -110','glisează la x: -60 y: 40','glisează la x: 120 y: 40','spune „Am ajuns la școală!”'],

/* ================= 2. Proprietățile unui algoritm (lecția 25) ================= */
{t:'Proprietățile unui algoritm',lectii:[25],continuturi:['Proprietăți ale algoritmilor'],
 obiectiv:'verifici dacă un algoritm e clar, se termină și merge pentru orice date de același fel, și îl repari când nu e așa.',
 pasi:[
  {t:'Claritatea: fiecare pas are un singur înțeles',
   text:`<p>Un algoritm bun are trei <mark>proprietăți</mark>. Prima este <mark>claritatea</mark>: fiecare pas trebuie înțeles <strong>la fel</strong> de oricine îl citește.</p>
<p>Cuvintele vagi strică claritatea: <em>puțin, câteva, potrivit, cam, mult</em>. „Pune puțină sare” nu e clar: pentru cineva „puțin” e un vârf de linguriță, pentru altcineva o lingură plină.</p>
<p>Cum repari: înlocuiești cuvântul vag cu un <strong>număr</strong> sau cu o regulă exactă.</p>`,
   exemplu:`${TT(['Nu e clar','E clar'],[['Pune puțină sare.','Pune o linguriță de sare.'],['Fierbe apa puțin.','Fierbe apa 5 minute.'],['Mergi cam pe acolo.','Mergi 200 de metri, până la farmacie.']])}`,
   altfel:`<p>Dacă zece colegi citesc același pas, ar face toți <strong>exact același lucru</strong>? Dacă da, pasul e clar. Dacă unul pune o linguriță și altul trei, pasul nu e clar.</p>`,
   incearca:{t:'choice',q:'Care pas este <b>clar</b>?',o:['Adaugă 2 linguri de zahăr.','Adaugă zahăr cât trebuie.','Adaugă puțin zahăr.','Adaugă zahăr după gust.'],ok:0,ajutor:'Caută pasul pe care l-ar face toți la fel.',why:'Doar „2 linguri” are un singur înțeles. „Cât trebuie”, „puțin” și „după gust” diferă de la om la om.'},
   inca:[
    {t:'classify',q:'Clar sau neclar?',cats:['Clar','Neclar'],items:[['Citește două numere.',0],['Mergi 3 pași înainte.',0],['Adaugă câteva linguri de făină.',1],['Așteaptă un timp potrivit.',1]],why:'„Câteva” și „potrivit” lasă loc de ghicit. Numerele fac pasul clar.'}
   ]},
  {t:'Finitudinea: algoritmul se oprește',
   text:`<p>A doua proprietate este <mark>finitudinea</mark>: algoritmul se <strong>oprește</strong> după un număr de pași. „Mergi înainte și nu te opri” nu se termină niciodată, deci nu e un algoritm bun.</p>
<p>În Scratch, blocul <strong>la infinit</strong> repetă pașii la nesfârșit. Programul se oprește doar dacă apeși tu <strong>semnul roșu</strong> de lângă steagul verde.</p>
${fig('scratch-infinit.webp',760,333,'Scratch: blocul „la infinit” încadrat, cu eticheta „nu se oprește singur”, și semnul roșu de oprire de deasupra scenei, încadrat','Blocul <b>la infinit</b>: nu se oprește singur. Semnul roșu îl oprește.')}`,
   exemplu:`<p>Același lucru, dar cu blocul <strong>repetă 10</strong>: pisica face 10 pași și algoritmul se oprește singur. Are finitudine.</p>${fig('scratch-finit.webp',760,333,'Scratch: blocul „repetă 10” încadrat, cu eticheta „de 10 ori, apoi gata”, iar pe scenă pisica spune „Gata: 10 pași.”','<b>repetă 10</b>: de 10 ori, apoi gata.')}<p>Cum repari un pas fără sfârșit: spui <strong>de câte ori</strong> sau <strong>până când</strong>. „Amestecă fără oprire” devine „amestecă de 5 ori”.</p>`,
   incearca:{t:'tf',q:'Algoritmul „Numără 1, 2, 3, … și nu te opri niciodată” are finitudine.',ok:false,ajutor:'Finitudine = se oprește.',why:'Fals. Nu are un moment de oprire, deci nu se termină niciodată.'},
   inca:[
    {t:'choice',q:'Cum repari pasul „Bate ouăle fără oprire”?',o:['Bate ouăle de 20 de ori','Bate ouăle mult','Bate ouăle repede','Bate ouăle mereu'],ok:0,why:'„De 20 de ori” spune când te oprești. „Mult”, „repede” și „mereu” nu dau un sfârșit.'}
   ]},
  {t:'Generalitatea: merge pentru orice date',
   text:`<p>A treia proprietate este <mark>generalitatea</mark>: algoritmul rezolvă <strong>toate</strong> problemele de același fel, nu doar una.</p>
<p>Un algoritm care află aria doar pentru dreptunghiul de 3 pe 5 e bun o singură dată. Unul care <strong>citește</strong> lungimea și lățimea și calculează <em>lungime * lățime</em> merge pentru <strong>orice</strong> dreptunghi. (Semnul <strong>*</strong> înseamnă <strong>ori</strong>, înmulțire, ca pe calculator: <em>3 * 5</em> = 15.)</p>
<p>Semnul că lipsește generalitatea: în pași apar numere fixe acolo unde ar trebui date citite.</p>`,
   exemplu:`${TT(['Fără generalitate','Cu generalitate'],[['Calculează 3 * 5.','Citește lungimea și lățimea. Calculează lungime * lățime.'],['Calculează suma numerelor 4 și 7.','Citește a și b. Calculează a + b.']])}<p>În coloana a doua schimbi datele și obții alt rezultat, fără să schimbi pașii.</p>`,
   incearca:{t:'tf',q:'Un algoritm care primește lungimea și lățimea și află aria oricărui dreptunghi are proprietatea de generalitate.',ok:true,ajutor:'Merge și pentru alte dreptunghiuri?',why:'Adevărat. Schimbi datele și obții aria noului dreptunghi, fără să schimbi pașii.'},
   inca:[
    {t:'choice',q:'Care algoritm are generalitate?',o:['Citește un număr n și afișează n * 2','Afișează dublul numărului 6','Afișează numărul 12 pe ecran','Calculează 6 + 6 și afișează'],ok:0,why:'Doar primul merge pentru orice număr. Celelalte dau mereu 12.'}
   ]},
  {t:'Strategia: verifici și repari un algoritm',
   text:`<p>Ca să verifici un algoritm, pune-i trei întrebări, pe rând, la fiecare pas:</p>
<ol><li><strong>Se înțelege?</strong> Caută cuvinte vagi (puțin, câteva, potrivit). → claritate</li>
<li><strong>Se termină?</strong> Caută „fără oprire”, „mereu”, „la nesfârșit”. → finitudine</li>
<li><strong>Merge și pentru alte date?</strong> Caută numere fixe unde ar trebui date citite. → generalitate</li></ol>
<p>Apoi repari: cuvântul vag devine număr, pasul fără sfârșit primește „de câte ori”, numărul fix devine dată citită.</p>`,
   exemplu:`<p>Pasul „Amestecă fără oprire”: se înțelege? da. Se termină? <strong>nu</strong>. Deci încalcă finitudinea. Reparat: „Amestecă de 5 ori.”</p>`,
   incearca:{t:'hunt',cod:true,q:'Algoritmul Anei pentru ceai are 2 pași care încalcă proprietățile. Apasă pe ei.',src:`1. Pune apă în fierbător.
2. Pornește fierbătorul și așteaptă să fiarbă apa.
3. Pune în cană [[o cantitate potrivită de zahăr|„potrivită” nu e clar: câte lingurițe?]].
4. Toarnă apa fierbinte în cană.
5. [[Amestecă fără oprire|algoritmul nu se mai termină: trebuie spus când te oprești]].`,corect:`1. Pune apă în fierbător.
2. Pornește fierbătorul și așteaptă să fiarbă apa.
3. Pune în cană o linguriță de zahăr.
4. Toarnă apa fierbinte în cană.
5. Amestecă de 5 ori.`,ajutor:'Întrebarea 1: e vreun cuvânt vag? Întrebarea 2: se termină fiecare pas?',indiciu:'Caută un pas vag și un pas care nu se termină.',why:'„Potrivită” lasă loc de ghicit, deci strică claritatea. „Fără oprire” strică finitudinea. Corect: „o linguriță de zahăr” și „amestecă de 5 ori”.'},
   inca:[
    {t:'classify',q:'Ce proprietate încalcă fiecare pas?',cats:['Claritatea','Finitudinea','Generalitatea'],items:[['Adaugă „câteva” linguri de făină',0],['Numără din 1 în 1 și nu te opri niciodată',1],['Calculează doar suma numerelor 4 și 7',2],['Mergi „cam pe acolo”',0]],why:'Cuvintele vagi strică claritatea, lipsa opririi strică finitudinea, un singur caz fix strică generalitatea.'}
   ]}
 ],
 atelier:{t:'hunt',cod:true,titlu:'Repară algoritmul ariei',
  intro:`<p>Colegul tău a scris un algoritm pentru aria unui dreptunghi, dar a greșit în <b>3</b> locuri. <strong>Sarcina:</strong> ia-l rând cu rând și pune-i cele trei întrebări (se înțelege? se termină? merge pentru alte date?). Apasă pe fiecare greșeală. După răspuns vezi alături algoritmul reparat.</p>`,
  q:'Apasă pe cele 3 greșeli.',src:`Început
1. Citește lungimea și lățimea.
2. Calculează aria = [[3 * 5|Merge doar pentru dreptunghiul de 3 pe 5. Folosește datele citite: lungime * lățime (generalitate).]]
3. Afișează aria [[de câteva ori|„de câteva ori” nu e clar: afișează aria o dată (claritate).]]
4. [[Repetă pasul 3 la nesfârșit.|Algoritmul nu se mai oprește: pasul se șterge (finitudine).]]
Sfârșit`,corect:`Început
1. Citește lungimea și lățimea.
2. Calculează aria = lungime * lățime
3. Afișează aria
Sfârșit`,
  ajutor:'Un număr fix, un cuvânt vag și un pas care nu se termină.',indiciu:'Caută un număr fix, un cuvânt vag și un „la nesfârșit”.',
  why:'Algoritmul reparat citește datele, le folosește în calcul, afișează o dată și se oprește.',
  inca:[
   {t:'hunt',cod:true,q:'Încă una: algoritmul „Fac o limonadă” are <b>2</b> greșeli. Apasă pe ele.',src:`1. Stoarce o lămâie într-un pahar.
2. Adaugă [[puțină apă|„puțină” nu e clar: câți mililitri? (claritate)]]
3. Pune 2 lingurițe de zahăr.
4. [[Amestecă mereu.|„mereu” nu se termină: amestecă de 10 ori (finitudine).]]`,corect:`1. Stoarce o lămâie într-un pahar.
2. Adaugă 200 ml de apă.
3. Pune 2 lingurițe de zahăr.
4. Amestecă de 10 ori.`,ajutor:'Un cuvânt vag și un pas care nu se oprește.',indiciu:'„puțin” și „mereu” sunt semne rele.',why:'Numerele fac pașii clari, iar „de 10 ori” dă un sfârșit.'},
   {t:'classify',q:'Încă una: ce proprietate încalcă fiecare algoritm?',cats:['Claritatea','Finitudinea','Generalitatea'],items:[['Află perimetrul doar pentru pătratul cu latura 5',2],['Apasă butonul din nou și din nou, fără să spui când te oprești',1],['Pune „o cantitate potrivită” de apă',0],['Afișează suma lui 2 și 3',2]],why:'Numere fixe = fără generalitate; fără oprire = fără finitudine; cuvinte vagi = fără claritate.'}
  ]},
 qs:[
  {t:'choice',q:'Pasul „Fierbe apa puțin” încalcă o proprietate. Care?',o:['Claritatea','Finitudinea','Generalitatea'],ok:0,why:'„Puțin” poate însemna un minut pentru cineva și zece minute pentru altcineva. Pasul are mai multe înțelesuri, deci nu e clar.'},
  {t:'match',q:'Leagă fiecare proprietate de ce cere ea.',pairs:[['Claritatea','fiecare pas are un singur înțeles'],['Finitudinea','algoritmul se oprește după un număr de pași'],['Generalitatea','rezolvă toate problemele de același fel']],why:'Cele trei proprietăți răspund la trei întrebări: se înțelege? se termină? merge și pentru alte date?'},
  {t:'classify',q:'Ce proprietate încalcă fiecare algoritm?',cats:['Claritatea','Finitudinea','Generalitatea'],items:[['Adaugă „câteva” linguri de făină',0],['Mergi „cam pe acolo” până la școală',0],['Numără din 1 în 1 și nu te opri niciodată',1],['Apasă butonul din nou și din nou, fără să spui când te oprești',1],['Calculează doar suma numerelor 4 și 7',2],['Află perimetrul doar pentru pătratul cu latura 5',2]],ajutor:'Folosește cele trei întrebări: se înțelege? se termină? merge pentru alte date?',why:'Cuvintele vagi strică claritatea. Lipsa unui moment de oprire strică finitudinea. Un algoritm legat de un singur caz nu are generalitate.'},
  {t:'tf',q:'În Scratch, un script cu blocul „la infinit” se oprește singur după câțiva pași.',ok:false,why:'Fals. „La infinit” repetă la nesfârșit; se oprește doar când apeși semnul roșu. Cu „repetă 10” s-ar opri singur.'},
  {t:'choice',q:'Care este varianta reparată a pasului „Calculează aria pentru dreptunghiul de 3 pe 5”?',o:['Citește lungimea și lățimea, apoi calculează lungime * lățime','Calculează aria de mai multe ori, ca să fii sigur','Calculează 3 * 5 cu mare atenție la fiecare cifră','Calculează aria cam cât trebuie pentru orice caz'],ok:0,why:'Pasul nu avea generalitate. Reparat, citește datele și le folosește, deci merge pentru orice dreptunghi.'}
 ]},

/* ================= 3. Datele și variabilele (lecția 26) ================= */
{t:'Datele și variabilele',lectii:[26],continuturi:['Clasificarea datelor cu care lucrează algoritmii în funcţie de rolul acestora (de intrare, de ieșire, de manevră)','Constante și variabile'],
 obiectiv:'recunoști datele de intrare, de ieșire și de manevră, deosebești o variabilă de o constantă și urmărești cum se schimbă valoarea unei variabile.',
 pasi:[
  {t:'Date de intrare și date de ieșire',
   text:`<p>Un algoritm lucrează cu <mark>date</mark>. După rolul lor, le împărțim în grupe. Primele două:</p>
<ul><li><mark>datele de intrare</mark>: le primește <strong>la început</strong>. Spunem că algoritmul le <strong>citește</strong> (pasul „Citește…”);</li>
<li><mark>datele de ieșire</mark>: rezultatele pe care le dă <strong>la final</strong>. Spunem că le <strong>afișează</strong> (pasul „Afișează…”).</li></ul>
<p>Truc: caută cuvintele <strong>Citește</strong> și <strong>Afișează</strong>. Ce e după „Citește” intră; ce e după „Afișează” iese.</p>`,
   exemplu:`${A('Citește numărul de caiete și prețul unui caiet.\nCalculează suma ← număr * preț.\nAfișează suma.')}<p>Săgeata <strong>←</strong> se citește „primește”: <em>suma</em> primește rezultatul calculului. O înveți pe larg la pasul 4.</p>${TT(['Dată','Rol'],[['numărul de caiete','de intrare (se citește)'],['prețul unui caiet','de intrare (se citește)'],['suma','de ieșire (se afișează)']])}`,
   incearca:{t:'choice',q:'Algoritmul citește numărul de caiete și prețul unui caiet, apoi afișează cât ai de plătit. Care este data de ieșire?',o:['Suma de plătit','Prețul unui caiet','Numărul de caiete'],ok:0,ajutor:'Ce vine după „Afișează”?',why:'Numărul de caiete și prețul sunt date de intrare. Suma de plătit se afișează, deci e de ieșire.'},
   inca:[
    {t:'classify',q:'Algoritmul: „Citește vârsta ta. Calculează anul nașterii. Afișează anul nașterii.” Ce rol au datele?',cats:['De intrare','De ieșire'],items:[['vârsta',0],['anul nașterii',1],['anul în care suntem, citit și el',0],['mesajul afișat cu anul',1]],why:'Ce se citește intră, ce se afișează iese.'}
   ]},
  {t:'Date de manevră: ajutoarele de pe drum',
   text:`<p>A treia grupă sunt <mark>datele de manevră</mark>: valori <strong>ajutătoare</strong>, calculate pe drum. Nu le primești la început și nu le afișezi la final, dar fără ele n-ai ajunge la rezultat.</p>
<p>La perimetrul dreptunghiului, poți aduna întâi lungimea cu lățimea (o sumă <code>s</code>), apoi dublezi suma. <code>s</code> e o dată de manevră: o folosești doar ca să ajungi la perimetrul <code>P</code>.</p>
${fig('scratch-roluri-date.webp',760,333,'Scratch: perimetrul dreptunghiului; pe scenă lungime 8 și lățime 3 încadrate ca date de intrare, s 11 ca dată de manevră, P 22 ca dată de ieșire','În Scratch: <b>lungime</b> și <b>lățime</b> de intrare, <code>s</code> de manevră, <code>P</code> de ieșire.')}`,
   exemplu:`${A('Citește L și l.\ns ← L + l\nP ← 2 * s\nAfișează P.')}<p>Pentru L = 8 și l = 3: s = 11 (de manevră), P = 22 (de ieșire).</p>`,
   altfel:`<p>Când faci un tort, blatul copt e un „ajutor pe drum”: nu l-ai cumpărat așa (nu e dată de intrare) și nu-l servești singur (nu e rezultatul). E doar o etapă spre tort. Așa e o dată de manevră.</p>`,
   incearca:{t:'classify',q:'Perimetrul: citești L și l, calculezi s ← L + l, apoi P ← 2 * s și afișezi P. Ce rol are fiecare dată?',cats:['De intrare','De ieșire','De manevră'],items:[['Lungimea L',0],['Lățimea l',0],['Suma s, calculată pe drum',2],['Perimetrul P, afișat la final',1]],ajutor:'Care se citește? Care se afișează? Care nu se citește și nici nu se afișează?',why:'L și l se citesc. P se afișează. s e o valoare ajutătoare.'},
   inca:[
    {t:'choice',q:'Media a două note: citești a și b, calculezi s ← a + b, apoi m ← s / 2 și afișezi m. Care este data de manevră?',o:['s','a','b','m'],ok:0,why:'a și b se citesc, m se afișează. s e calculată pe drum, doar ca să ajungi la m.'}
   ]},
  {t:'Variabile și constante',
   text:`<p>O <mark>variabilă</mark> este ca o cutie cu <strong>nume</strong>, în care stă o <strong>valoare care se poate schimba</strong>. Exemplu: scorul dintr-un joc. Numele rămâne „scor”, valoarea crește pe parcurs.</p>
<p>O <mark>constantă</mark> are o valoare care <strong>nu se schimbă</strong>: 60 de minute într-o oră, 7 zile într-o săptămână.</p>
<p>În Scratch, o variabilă nouă se face din categoria <strong>Variabile</strong>, cu butonul <strong>Creează o variabilă</strong>. Îi dai un nume și apoi îi pui valori cu blocul <strong>setează … la …</strong>.</p>
${fig('scratch-variabile.webp',500,400,'Scratch, categoria Variabile: butonul Creează o variabilă încadrat și blocurile setează scor la 0 și modifică scor cu 1, încadrate','Categoria <b>Variabile</b>: <b>Creează o variabilă</b>, apoi <b>setează scor la 0</b>.')}`,
   exemplu:`${TT(['Mărimea','Se schimbă?','Deci e'],[['scorul din joc','da, la fiecare punct','variabilă'],['vârsta ta','da, în fiecare an','variabilă'],['minute într-o oră (60)','niciodată','constantă'],['zile într-o săptămână (7)','niciodată','constantă']])}`,
   altfel:`<p>Pe tabla de scor de la un meci de fotbal scrie „Gazde” și un număr. Cuvântul „Gazde” e numele, numărul se schimbă la fiecare gol: e o variabilă. Durata unei reprize, 45 de minute, e aceeași la fiecare meci: e o constantă.</p>`,
   incearca:{t:'classify',q:'Constantă sau variabilă?',cats:['Constantă','Variabilă'],items:[['Numărul de minute dintr-o oră (60)',0],['Numărul de zile dintr-o săptămână (7)',0],['Scorul dintr-un joc',1],['Temperatura de afară',1]],ajutor:'Se poate schimba? Atunci e variabilă.',why:'O oră are mereu 60 de minute și o săptămână 7 zile. Scorul și temperatura se schimbă.'},
   inca:[
    {t:'tf',q:'O variabilă poate avea valori diferite în momente diferite ale algoritmului.',ok:true,why:'Adevărat. De aceea se numește variabilă, de la „a varia”, adică a se schimba.'}
   ]},
  {t:'Săgeata ←: o variabilă primește o valoare',
   text:`<p>Scriem <code>scor ← 10</code> și citim „scor <strong>primește</strong> valoarea 10”. Pasul se numește <mark>atribuire</mark>. Valoarea veche se <strong>pierde</strong>, ca atunci când ștergi ce era pe tablă și scrii altceva.</p>
<p>Ce face <code>scor ← scor + 5</code>? <strong>Strategia</strong>, mereu în această ordine:</p>
<ol><li>Te uiți în <strong>dreapta</strong> săgeții și pui valorile de ACUM: scor + 5 = 10 + 5.</li>
<li>Calculezi: 15.</li>
<li>Scrii rezultatul în variabila din <strong>stânga</strong>: scor devine 15.</li></ol>
<p>Pe caiet ții un <mark>tabel de urmărire</mark>: un rând pentru fiecare pas, cu noua valoare.</p>`,
   exemplu:`${A('scor ← 10\nscor ← scor + 5\nscor ← scor * 2')}${TT(['Pasul','Calcul (dreapta săgeții)','scor devine'],[['1','10','10'],['2','10 + 5','15'],['3','15 * 2','30']])}`,
   altfel:`<p>Gândește-te la pușculiță. Ai 10 lei. „pușculiță ← pușculiță + 5” înseamnă: te uiți cât ai acum (10), adaugi 5 și pui la loc: acum ai 15. Nu apar două pușculițe, ci aceeași, cu altă sumă.</p>`,
   incearca:{t:'choice',q:`Urmărește pașii. Ce valoare are scor la final?${A('scor ← 10\nscor ← scor + 5')}`,o:['15','10','5','105'],ok:0,ajutor:'Pasul 2: pune în dreapta valoarea de acum a lui scor.',why:'La primul pas scor devine 10. La al doilea, scor primește 10 + 5 = 15. Nu se lipesc cifrele, ca în 105.'},
   inca:[
    {t:'choice',q:`Ce valoare are x la final?${A('x ← 3\nx ← x * 4\nx ← x - 2')}`,o:['10','12','3','1'],ok:0,why:'x = 3, apoi 3 * 4 = 12, apoi 12 - 2 = 10.'},
    {t:'choice',q:`Ce valoare are b la final?${A('a ← 6\nb ← a + 1\na ← 20')}`,o:['7','21','6','20'],ok:0,why:'b primește 6 + 1 = 7 în pasul 2. Schimbarea lui a de după nu mai atinge b.'}
   ]}
 ],
 atelier:{t:'urmarire',titlu:'Tabelul de urmărire: scorul',
  intro:`<p>Așa verifici un algoritm la ora de informatică: îl execuți <strong>tu</strong>, ca un calculator, și scrii în tabel ce se întâmplă la fiecare rând. <strong>Sarcina:</strong> calculatorul îți dă o valoare de intrare pentru <code>scor</code>. Completează căsuțele rând cu rând, cu strategia săgeții: dreapta cu valorile de acum, calculezi, scrii în stânga. Apasă „Verifică tabelul”: testele se bifează.</p>`,
  q:'Execută algoritmul pentru datele de mai jos.',
  prog:['Început','Citește scor','scor ← scor + 5','scor ← scor * 2','Afișează scor','Sfârșit'],
  date:[{scor:10},{scor:4},{scor:7},{scor:0}],
  ajutor:'Rândul 3: la valoarea citită adaugi 5. Rândul 4: dublezi ce ai obținut la rândul 3. Rândul 5: afișezi valoarea de acum.',

  inca:[

   {t:'urmarire',q:'Încă unul: două variabile. Atenție la valoarea de ACUM a lui a.',prog:['Început','Citește a','b ← a + 1','a ← b * 3','Afișează a','Afișează b','Sfârșit'],date:[{a:2},{a:5},{a:0}],ajutor:'La rândul 4 folosești b de la rândul 3.',why:'După rândul 4, a are o valoare nouă, iar cea citită s-a pierdut.'}
  ]},
 qs:[
  {t:'choice',q:'Algoritmul citește lungimea unei laturi a unui pătrat și afișează perimetrul. Care este data de intrare?',o:['Lungimea laturii','Perimetrul','Numărul 4','Mesajul afișat'],ok:0,ajutor:'Ce se citește?',why:'Latura se citește, deci e de intrare. Perimetrul se afișează, deci e de ieșire.'},
  {t:'classify',q:'Perimetrul dreptunghiului: citești L și l, calculezi s ← L + l, apoi P ← 2 * s și afișezi P. Ce rol are fiecare dată?',cats:['De intrare','De ieșire','De manevră'],items:[['Lungimea L',0],['Lățimea l',0],['Suma s, calculată pe drum',2],['Perimetrul P, afișat la final',1]],why:'L și l se citesc la început. P se afișează. s e o valoare ajutătoare: o folosești ca să ajungi la P, dar nu o primești și nu o afișezi.'},
  {t:'classify',q:'Constantă sau variabilă?',cats:['Constantă','Variabilă'],items:[['Numărul de minute dintr-o oră (60)',0],['Numărul de zile dintr-o săptămână (7)',0],['Scorul dintr-un joc',1],['Temperatura de afară',1],['Numărul de mere rămase în coș',1]],why:'O oră are mereu 60 de minute și o săptămână 7 zile. Scorul, temperatura și merele din coș se schimbă.'},
  {t:'tf',q:'Numărul de zile dintr-o săptămână își poate schimba valoarea pe parcursul algoritmului, deci e o variabilă.',ok:false,why:'Fals. O săptămână are mereu 7 zile, deci valoarea nu se schimbă: e o constantă. Variabilă e o mărime care se poate schimba, ca scorul sau temperatura.'},
  {t:'choice',q:`Urmărește pașii. Ce valoare are mere la final?${A('mere ← 8\nmere ← mere - 3')}`,o:['5','8','3','11'],ok:0,ajutor:'Dreapta săgeții, cu valoarea de acum, apoi scrii în stânga.',why:'La primul pas mere devine 8. La al doilea, mere primește valoarea lui veche minus 3, adică 8 - 3 = 5. Valoarea 8 se pierde; 11 ar fi dacă ai aduna în loc să scazi.'}
 ]},

/* ================= 4. Expresii și operatori (lecția 27) ================= */
{t:'Expresii și operatori',lectii:[27],continuturi:['Expresii (operatori aritmetici, relaționali, logici; evaluarea expresiilor)'],
 obiectiv:'calculezi o expresie cu operatori aritmetici, relaționali și logici, în ordinea corectă, și spui dacă o condiție e adevărată sau falsă.',
 pasi:[
  {t:'Operatorii aritmetici și restul împărțirii',
   text:`<p>O <mark>expresie</mark> leagă numere și variabile prin <mark>operatori</mark>. A <mark>evalua</mark> expresia înseamnă a-i afla valoarea.</p>
<p><strong>Operatorii aritmetici</strong> calculează numere: <code>+</code> adunare, <code>-</code> scădere, <code>*</code> înmulțire, <code>/</code> împărțire și <code>%</code>, <mark>restul împărțirii</mark>.</p>
<p><code>17 % 5</code> se citește „17 modulo 5” și înseamnă: ce rest rămâne când împarți 17 la 5?</p>`,
   exemplu:`<p><code>17 % 5</code>: 5 încape în 17 de 3 ori (5 * 3 = 15). Rămân 17 - 15 = <strong>2</strong>. Deci <code>17 % 5</code> = 2.</p><p><code>12 % 4</code> = 0, pentru că 4 * 3 = 12 și nu rămâne nimic.</p>`,
   altfel:`<p>Ai 17 bomboane și le împarți la 5 copii, fiecare primind la fel. Fiecare primește 3 și îți rămân <strong>2</strong> în mână. Cele 2 sunt restul: <code>17 % 5</code>.</p>`,
   incearca:{t:'choice',q:'Cât este <code>9 % 2</code>?',o:['1','4','4,5','0'],ok:0,ajutor:'2 încape în 9 de 4 ori. Cât rămâne?',why:'2 * 4 = 8, iar 9 - 8 = 1. Restul este 1.'},
   inca:[
    {t:'choice',q:'Cât este <code>20 % 6</code>?',o:['2','3','0','14'],ok:0,why:'6 * 3 = 18, iar 20 - 18 = 2.'},
    {t:'match',q:'Leagă fiecare expresie de restul ei.',pairs:[['12 % 4','0'],['13 % 4','1'],['14 % 4','2'],['15 % 4','3']],why:'4 * 3 = 12; de la 12 la 15 restul crește cu câte 1.'}
   ]},
  {t:'Ordinea operațiilor',
   text:`<p>Ordinea e ca la matematică:</p>
<ol><li>întâi <strong>parantezele</strong>;</li>
<li>apoi <code>*</code>, <code>/</code> și <code>%</code>, de la stânga la dreapta;</li>
<li>apoi <code>+</code> și <code>-</code>, de la stânga la dreapta.</li></ol>
<p>Calculatorul respectă mereu ordinea asta. Dacă vrei să aduni întâi, pui paranteze.</p>
${fig('scratch-expresii.webp',760,333,'Scratch: setează e la 2 + 3 * 4 și rest la 17 mod 5; pe scenă e = 14 și rest = 2; blocul „7 > 3 și 2 > 5” încadrat, iar pisica spune fals','În Scratch: <code>2 + 3 * 4</code> dă <b>14</b>, iar <code>17 mod 5</code> dă <b>2</b>.')}`,
   exemplu:`${TT(['Expresia','Primul calcul','Rezultatul'],[['2 + 3 * 4','3 * 4 = 12','2 + 12 = 14'],['(2 + 3) * 4','2 + 3 = 5','5 * 4 = 20'],['10 - 4 / 2','4 / 2 = 2','10 - 2 = 8']])}`,
   incearca:{t:'choice',q:'Cât este 2 + 3 * 4?',o:['14','20','9','24'],ok:0,ajutor:'Înmulțirea se face înaintea adunării.',why:'3 * 4 = 12, apoi 2 + 12 = 14. 20 ar fi corect doar pentru (2 + 3) * 4.'},
   inca:[
    {t:'choice',q:'Cât este (6 + 4) / 2?',o:['5','8','6','10'],ok:0,why:'Parantezele întâi: 6 + 4 = 10, apoi 10 / 2 = 5.'},
    {t:'choice',q:'Cât este 5 + 10 % 3?',o:['6','0','15','3'],ok:0,why:'% se face înaintea adunării: 10 % 3 = 1, apoi 5 + 1 = 6.'}
   ]},
  {t:'Operatorii relaționali: adevărat sau fals',
   text:`<p><strong>Operatorii relaționali</strong> compară două valori: <code>&lt;</code> mai mic, <code>≤</code> mai mic sau egal, <code>&gt;</code> mai mare, <code>≥</code> mai mare sau egal, <code>=</code> egal, <code>≠</code> diferit.</p>
<p>Rezultatul unei comparații nu e un număr, ci <mark>adevărat</mark> sau <mark>fals</mark>. <code>7 &gt; 3</code> e adevărat, <code>10 &lt; 10</code> e fals (10 nu e mai mic decât el însuși), dar <code>10 ≤ 10</code> e adevărat.</p>
<p>Comparațiile se fac <strong>după</strong> calcule: la <code>2 + 3 &gt; 4</code> calculezi întâi 5, apoi compari: 5 &gt; 4, adevărat.</p>`,
   exemplu:`${TT(['Comparația','Rezultat'],[['8 ≥ 5','adevărat'],['5 ≥ 5','adevărat'],['5 &gt; 5','fals'],['6 ≠ 6','fals'],['2 * 3 = 6','adevărat']])}`,
   incearca:{t:'tf',q:'Comparația 10 &lt; 10 este adevărată.',ok:false,ajutor:'10 e mai mic decât 10?',why:'Fals. 10 nu e mai mic decât el însuși. Ar fi adevărat 10 ≤ 10.'},
   inca:[
    {t:'classify',q:'Adevărat sau fals?',cats:['Adevărat','Fals'],items:[['9 ≥ 9',0],['4 ≠ 5',0],['3 &gt; 8',1],['2 + 2 = 5',1]],why:'≥ acceptă egalitatea; 4 e diferit de 5; 3 nu e mai mare ca 8; 2 + 2 = 4, nu 5.'}
   ]},
  {t:'Operatorii logici: ȘI, SAU, NU',
   text:`<p><strong>Operatorii logici</strong> leagă mai multe condiții:</p>
<ul><li><mark>ȘI</mark> e adevărat doar dacă <strong>ambele</strong> părți sunt adevărate;</li>
<li><mark>SAU</mark> e adevărat dacă <strong>cel puțin una</strong> e adevărată;</li>
<li><mark>NU</mark> întoarce valoarea: adevărat devine fals și invers.</li></ul>
<p>Operatorii logici se fac <strong>la urmă</strong>, după calcule și comparații.</p>
${fig('scratch-operatori.webp',500,700,'Scratch, categoria Operatori: blocurile plus minus înmulțit împărțit încadrate ca aritmetici, blocurile mai mare mai mic egal ca relaționali, blocurile și sau nu ca logici, iar blocul mod ca restul împărțirii','Categoria <b>Operatori</b> din Scratch: aritmetici, relaționali, logici și <b>mod</b> (restul, adică <code>%</code>).')}`,
   exemplu:`<p>nota = 8:</p>${TT(['Expresia','Pe rând','Rezultat'],[['nota ≥ 5 ȘI nota = 10','adevărat ȘI fals','fals'],['nota ≥ 5 SAU nota = 10','adevărat SAU fals','adevărat'],['NU (nota ≥ 5)','NU adevărat','fals']])}`,
   altfel:`<p>Mama spune: „Mergi la film dacă ți-ai făcut temele <b>ȘI</b> ai strâns camera.” Trebuie amândouă. Dacă spune „<b>SAU</b>”, ajunge una dintre ele. Iar „<b>NU</b> plouă” e adevărat exact când „plouă” e fals.</p>`,
   incearca:{t:'tf',q:'Expresia „7 &gt; 3 ȘI 2 &gt; 5” este adevărată.',ok:false,ajutor:'Evaluează fiecare parte. La ȘI trebuie ambele adevărate.',why:'Fals. 7 &gt; 3 e adevărat, dar 2 &gt; 5 e fals, iar la ȘI trebuie ambele adevărate.'},
   inca:[
    {t:'tf',q:'Expresia „7 &gt; 3 SAU 2 &gt; 5” este adevărată.',ok:true,why:'Adevărat. La SAU ajunge o parte adevărată: 7 &gt; 3.'},
    {t:'choice',q:'x = 4. Cât este NU (x &gt; 10)?',o:['adevărat','fals','4','10'],ok:0,why:'x &gt; 10 e fals (4 nu e mai mare ca 10), iar NU îl face adevărat.'}
   ]},
  {t:'Strategia: evaluezi orice expresie',
   text:`<p>Pentru orice expresie, lucrezi în ordinea asta:</p>
<ol><li><strong>Înlocuiești</strong> fiecare variabilă cu valoarea ei.</li>
<li>Calculezi <strong>parantezele</strong>.</li>
<li>Faci <code>*</code> <code>/</code> <code>%</code>, apoi <code>+</code> <code>-</code>.</li>
<li>Faci <strong>comparațiile</strong>: fiecare dă adevărat sau fals.</li>
<li>La urmă, <strong>ȘI</strong>, <strong>SAU</strong>, <strong>NU</strong>.</li></ol>
<p>Scrie fiecare etapă pe un rând nou, ca să nu pierzi nimic.</p>`,
   exemplu:`<p>a = 17, b = 5. Evaluăm <code>a % b = 2 ȘI a &gt; 10</code>:</p>${A('17 % 5 = 2 ȘI 17 &gt; 10      (1. înlocuiesc)\n2 = 2 ȘI 17 &gt; 10           (3. calculez restul)\nadevărat ȘI adevărat       (4. compar)\nadevărat                   (5. ȘI)')}`,
   incearca:{t:'choice',q:'Variabila nota are valoarea 8. Care expresie este adevărată?',o:['nota ≥ 5 SAU nota = 10','nota < 5','nota = 10 ȘI nota ≥ 5','NU (nota ≥ 5)'],ok:0,ajutor:'Înlocuiește nota cu 8 în fiecare variantă și compară.',why:'La SAU ajunge ca o parte să fie adevărată, iar 8 ≥ 5 e adevărat. La ȘI, partea „nota = 10” e falsă. NU schimbă adevărat în fals.'},
   inca:[
    {t:'choice',q:'n = 12. Cât este n % 2 = 0 ȘI n &gt; 10?',o:['adevărat','fals','0','12'],ok:0,why:'12 % 2 = 0, deci 0 = 0 e adevărat; 12 &gt; 10 e adevărat; adevărat ȘI adevărat = adevărat.'}
   ]}
 ],
 atelier:{t:'urmarire',titlu:'Evaluează ca un calculator',
  intro:`<p>Calculatorul alege două numere, <code>a</code> și <code>b</code>. <strong>Sarcina:</strong> calculează fiecare expresie cu strategia în 5 pași (înlocuiești, paranteze, <code>*</code> <code>/</code> <code>%</code>, <code>+</code> <code>-</code>, comparații, ȘI/SAU/NU). La rândurile care dau adevărat sau fals, scrie <b>adevărat</b> sau <b>fals</b>.</p>`,
  q:'Completează valorile expresiilor.',
  prog:['Început','Citește a, b','s ← a + b * 2','r ← a % b','c ← a > b ȘI r = 0','Afișează s - r','Sfârșit'],
  date:[{a:17,b:5},{a:12,b:4},{a:9,b:2},{a:20,b:6}],
  ajutor:'Rândul 3: întâi b * 2, apoi aduni a. Rândul 4: restul împărțirii lui a la b. Rândul 5: două comparații legate cu ȘI.',
  why:'Ai aplicat ordinea operațiilor: înmulțirea înaintea adunării, comparațiile după calcule, ȘI la urmă.',
  inca:[
   {t:'urmarire',q:'Încă unul: paranteze sau nu? Compară e și f.',prog:['Început','Citește x','e ← (x + 3) * 2','f ← x + 3 * 2','g ← x % 3','Afișează e - f','Sfârșit'],date:[{x:4},{x:10},{x:7},{x:2}],ajutor:'e: întâi paranteza. f: întâi 3 * 2.',why:'Parantezele schimbă ordinea, deci și rezultatul.'},
   {t:'urmarire',q:'Încă unul: SAU și NU. Scrie adevărat sau fals.',prog:['Început','Citește nota','p ← nota ≥ 5','z ← nota = 10 SAU nota < 3','q ← NU (nota ≥ 5)','Sfârșit'],date:[{nota:8},{nota:10},{nota:2},{nota:5}],ajutor:'La SAU ajunge o parte adevărată. NU întoarce valoarea.',why:'q e mereu opusul lui p.'}
  ]},
 qs:[
  {t:'choice',q:'Cât este 20 - 4 * 3?',o:['8','48','13','60'],ok:0,why:'Înmulțirea se face înaintea scăderii: 4 * 3 = 12, apoi 20 - 12 = 8. Rezultatul 48 ar fi corect doar pentru (20 - 4) * 3.'},
  {t:'choice',q:'Cât este 17 % 5?',o:['2','3','3,4','85'],ok:0,ajutor:'% dă restul, nu câtul.',why:'17 împărțit la 5 dă câtul 3 și restul 2, pentru că 5 * 3 = 15 și 17 - 15 = 2. Operatorul % dă restul, nu câtul.'},
  {t:'classify',q:'Ce fel de operator este fiecare?',cats:['Aritmetic','Relațional','Logic'],items:[['+',0],['%',0],['≥',1],['≠',1],['ȘI',2],['SAU',2]],why:'Operatorii aritmetici calculează numere. Cei relaționali compară și dau adevărat sau fals. Cei logici leagă mai multe condiții.'},
  {t:'match',q:'Leagă fiecare expresie de valoarea ei.',pairs:[['(2 + 3) * 4','20'],['10 - 4 / 2','8'],['9 % 2','1'],['6 ≠ 6','fals']],ajutor:'Parantezele întâi; împărțirea înaintea scăderii.',why:'Parantezele se fac primele. Împărțirea vine înaintea scăderii: 4 / 2 = 2, apoi 10 - 2 = 8. 9 împărțit la 2 are restul 1. 6 este egal cu 6, deci „6 ≠ 6” e fals.'},
  {t:'tf',q:'Expresia „4 &lt; 1 ȘI 6 ≥ 6” este adevărată.',ok:false,why:'Fals. 6 ≥ 6 e adevărat, dar 4 &lt; 1 e fals. Cu ȘI, expresia e adevărată doar dacă ambele părți sunt adevărate.'},
  {t:'choice',q:'Variabila v are valoarea 12. Care expresie este adevărată?',o:['v ≥ 10 ȘI v < 14','v = 14 ȘI v ≥ 10','NU (v < 14)','v < 10 SAU v > 14'],ok:0,ajutor:'Înlocuiește v cu 12 și evaluează fiecare parte, apoi ȘI, SAU, NU.',why:'12 ≥ 10 și 12 < 14 sunt amândouă adevărate, deci ȘI dă adevărat. La „v = 14 ȘI v ≥ 10” o parte e falsă, iar la ȘI nu ajunge una. NU schimbă „12 < 14”, adevărat, în fals. La SAU ambele părți sunt false.'}
 ]},

/* ================= 5. Structura secvențială (lecția 28) ================= */
{t:'Structura secvențială',lectii:[28],continuturi:['Structura secvenţială (liniară)'],
 obiectiv:'scrii un algoritm liniar în limbaj natural, îl urmărești pas cu pas într-un tabel și găsești greșelile de ordine și de calcul.',
 pasi:[
  {t:'Pașii, unul după altul',
   text:`<p>În <mark>structura secvențială</mark> (liniară), pașii se execută <mark>unul după altul</mark>, în ordinea scrisă, de sus în jos.</p>
<ul><li>fiecare pas se execută <strong>o singură dată</strong>;</li>
<li><strong>niciun</strong> pas nu se sare;</li>
<li>niciun pas nu se repetă.</li></ul>
<p>Dacă un pas e inutil, nu îl sari: îl scoți din algoritm.</p>
${fig('scratch-secventa.webp',760,333,'Scratch: scriptul ariei, încadrat și etichetat „unul după altul”; pe scenă lungime 6, lățime 4 și aria 24','În Scratch, blocurile lipite <b>unul după altul</b> se execută în ordine. Pentru 6 și 4, <b>aria</b> iese 24.')}`,
   altfel:`<p>E ca o coadă la cantină: fiecare copil trece o dată, în ordinea în care stă. Nimeni nu e sărit și nimeni nu trece de două ori.</p>`,
   incearca:{t:'tf',q:'În structura secvențială, un pas poate fi sărit dacă ți se pare inutil.',ok:false,ajutor:'Recitește regulile: fiecare pas…',why:'Fals. Fiecare pas se execută o dată, în ordinea scrisă. Un pas inutil se scoate din algoritm.'},
   inca:[
    {t:'choice',q:'Un algoritm liniar are 5 pași. De câte ori se execută pasul 3?',o:['o dată','de 3 ori','deloc','de 5 ori'],ok:0,why:'În secvență fiecare pas se execută exact o dată.'}
   ]},
  {t:'Limbajul natural: Început, Citește, Calculează, Afișează, Sfârșit',
   text:`<p>Scriem algoritmul în <mark>limbaj natural</mark>, adică în cuvinte, cu pași numerotați, între <strong>Început</strong> și <strong>Sfârșit</strong>.</p>
<p>Aproape orice algoritm liniar are aceeași formă, în trei părți:</p>
<ol><li><strong>Citește</strong> datele de intrare;</li>
<li><strong>Calculează</strong> ce trebuie, cu săgeata ←;</li>
<li><strong>Afișează</strong> rezultatul.</li></ol>
<p>Nu poți calcula fără date și nu poți afișa ceva ce nu ai calculat încă.</p>`,
   exemplu:`${A('Început\n1. Citește lungimea și lățimea.\n2. Calculează aria ← lungime * lățime.\n3. Afișează aria.\nSfârșit')}`,
   incearca:{t:'order',q:'Pune în ordine algoritmul care află aria unui dreptunghi.',items:['Început','Citește lungimea și lățimea','Calculează aria ← lungime * lățime','Afișează aria','Sfârșit'],ajutor:'Citește → Calculează → Afișează, între Început și Sfârșit.',why:'Nu poți calcula fără date și nu poți afișa un rezultat pe care încă nu l-ai calculat.'},
   inca:[
    {t:'order',q:'Pune în ordine algoritmul care află perimetrul unui pătrat.',items:['Început','Citește latura','Calculează P ← 4 * latura','Afișează P','Sfârșit'],why:'Aceeași formă: citești, calculezi, afișezi.'}
   ]},
  {t:'Urmărirea pas cu pas, în tabel',
   text:`<p>Ca să verifici un algoritm, îl <mark>urmărești pas cu pas</mark>: îl execuți tu, ca un calculator, și scrii într-un tabel valoarea fiecărei variabile după fiecare pas.</p>
<p>Regula de aur: când o variabilă primește o valoare nouă, <strong>valoarea veche se pierde</strong>. Folosești mereu valoarea de <strong>acum</strong>.</p>`,
   exemplu:`${A('a ← 4\nb ← a * 3\na ← b - 2\nAfișează a')}${TT(['Pasul','Calcul','a','b'],[['1','4','4','–'],['2','4 * 3','4','12'],['3','12 - 2','10','12'],['4','se afișează 10','10','12']])}`,
   altfel:`<p>Tabelul e ca jurnalul unui detectiv: după fiecare pas notezi ce s-a schimbat. La final citești din ultimul rând valorile finale.</p>`,
   incearca:{t:'choice',q:`Urmărește pas cu pas. Ce se afișează?${A('a ← 4\nb ← a * 3\na ← b - 2\nAfișează a')}`,o:['10','4','12','2'],ok:0,ajutor:'Uită-te în tabelul din exemplu.',why:'a = 4. Apoi b = 12. Apoi a primește 12 - 2 = 10, iar 4 se pierde.'},
   inca:[
    {t:'choice',q:`Ce se afișează?${A('x ← 2\ny ← x + 5\nx ← y * 2\nAfișează x')}`,o:['14','7','4','2'],ok:0,why:'x = 2, y = 7, apoi x = 7 * 2 = 14.'}
   ]},
  {t:'Schimbul a două valori, cu aux',
   text:`<p>Vrei ca <code>x</code> și <code>y</code> să-și schimbe valorile. Dacă scrii direct <code>x ← y</code>, valoarea veche a lui x se pierde!</p>
<p>Soluția: o variabilă ajutătoare, <code>aux</code>, care păstrează valoarea lui x:</p>
${A('aux ← x\nx ← y\ny ← aux')}
<p><code>aux</code> e o dată de manevră: nu o citești și nu o afișezi.</p>
${fig('scratch-urmarire.webp',760,333,'Scratch: schimbul valorilor lui x și y prin variabila aux; pe scenă x = 8, y = 5, aux = 5','În Scratch: <code>aux</code> păstrează valoarea veche a lui <code>x</code>, iar la final <b>x și y s-au schimbat</b>.')}`,
   exemplu:`${TT(['Pasul','x','y','aux'],[['x ← 5','5','–','–'],['y ← 8','5','8','–'],['aux ← x','5','8','5'],['x ← y','8','8','5'],['y ← aux','8','5','5']])}`,
   altfel:`<p>Ai suc de mere într-un pahar și suc de portocale în altul și vrei să le schimbi. Îți trebuie un <b>al treilea pahar, gol</b>: torni merele în el, portocalele în paharul mărului, apoi merele din paharul ajutător în paharul portocalelor.</p>`,
   incearca:{t:'choice',q:`Urmărește pas cu pas. Ce valori au x și y la final?${A('x ← 5\ny ← 8\naux ← x\nx ← y\ny ← aux')}`,o:['x = 8, y = 5','x = 5, y = 8','x = 8, y = 8','x = 5, y = 5'],ok:0,ajutor:'Uită-te în tabelul din exemplu, pe ultimul rând.',why:'aux păstrează 5, x primește 8, y primește ce era în aux: 5.'},
   inca:[
    {t:'choice',q:`Ce valori au x și y la final, FĂRĂ aux?${A('x ← 5\ny ← 8\nx ← y\ny ← x')}`,o:['x = 8, y = 8','x = 8, y = 5','x = 5, y = 8','x = 5, y = 5'],ok:0,why:'x ← y face x = 8 și pierde 5. Apoi y ← x dă tot 8. De aceea e nevoie de aux.'}
   ]},
  {t:'Strategia: găsești greșelile unui algoritm',
   text:`<p>Când verifici un algoritm scris de altcineva, treci prin patru întrebări:</p>
<ol><li>Fiecare dată e <strong>citită înainte</strong> să fie folosită?</li>
<li>Fiecare rezultat e <strong>calculat înainte</strong> să fie afișat?</li>
<li><strong>Parantezele</strong>: se calculează ce ai vrut? <code>nota1 + nota2 / 2</code> împarte doar nota2!</li>
<li><strong>Proba cu numere</strong>: urmărește-l în tabel cu date mici și verifică rezultatul de mână.</li></ol>`,
   exemplu:`<p>Media notelor 6 și 8 trebuie să fie 7. Proba cu numere:</p>${TT(['Expresia','Calcul','Rezultat'],[['nota1 + nota2 / 2','6 + 8 / 2 = 6 + 4','10 (greșit!)'],['(nota1 + nota2) / 2','14 / 2','7 (corect)']])}`,
   incearca:{t:'hunt',cod:true,q:'Algoritmul lui Mihai pentru media a două note are 2 greșeli. Apasă pe ele.',src:`Început
1. Citește nota1 și nota2.
2. [[Afișează media.|media nu e încă calculată: afișarea vine după calcul]]
3. Calculează media ← [[nota1 + nota2 / 2|fără paranteze se împarte doar nota2 la 2; corect: (nota1 + nota2) / 2]]
Sfârșit`,corect:`Început
1. Citește nota1 și nota2.
2. Calculează media ← (nota1 + nota2) / 2
3. Afișează media.
Sfârșit`,ajutor:'Întrebarea 2: ce se afișează înainte să fie calculat? Întrebarea 3: parantezele.',indiciu:'Uită-te la ordinea pașilor și la paranteze.',why:'Un rezultat se afișează doar după calcul, iar suma se pune în paranteze.'},
   inca:[
    {t:'hunt',cod:true,q:'Aici e <b>o</b> greșeală. Apasă pe ea.',src:`Început
1. [[Calculează aria ← lungime * lățime|lungimea și lățimea nu au fost încă citite: citirea vine întâi]]
2. Citește lungimea și lățimea.
3. Afișează aria.
Sfârșit`,corect:`Început
1. Citește lungimea și lățimea.
2. Calculează aria ← lungime * lățime
3. Afișează aria.
Sfârșit`,ajutor:'Întrebarea 1: e vreo dată folosită înainte să fie citită?',indiciu:'Ce se folosește înainte de a fi citit?',why:'Nu poți calcula cu date pe care încă nu le ai.'}
   ]}
 ],
 atelier:{t:'urmarire',titlu:'Urmărește schimbul',
  intro:`<p>Calculatorul îți dă două valori, <code>x</code> și <code>y</code>. <strong>Sarcina:</strong> execută algoritmul de schimb rând cu rând și completează tabelul. Ține minte regula de aur: la fiecare rând folosești valorile de <b>acum</b>, iar cea veche se pierde.</p>`,
  q:'Completează tabelul de urmărire.',
  prog:['Început','Citește x, y','aux ← x','x ← y','y ← aux','Afișează x','Afișează y','Sfârșit'],
  date:[{x:5,y:8},{x:3,y:9},{x:12,y:4},{x:1,y:6}],
  ajutor:'aux primește x-ul citit. Apoi x primește y. Apoi y primește ce e în aux.',
  why:'Valorile s-au schimbat între ele, iar aux a păstrat valoarea care altfel s-ar fi pierdut.',
  inca:[
   {t:'urmarire',q:'Încă unul: media a două note, cu paranteze.',prog:['Început','Citește nota1, nota2','s ← nota1 + nota2','media ← s / 2','Afișează media','Sfârșit'],date:[{nota1:6,nota2:8},{nota1:4,nota2:7},{nota1:9,nota2:10},{nota1:5,nota2:5}],ajutor:'s e suma, media e jumătate din s. Poate ieși cu virgulă: 5,5.',why:'Cu suma calculată separat, nu mai ai probleme cu parantezele.'},
   {t:'urmarire',q:'Încă unul: atenție, a se schimbă pe drum.',prog:['Început','Citește a','b ← a * 3','a ← b - 2','Afișează a','Sfârșit'],date:[{a:4},{a:2},{a:5},{a:10}],ajutor:'La rândul 4 folosești b de la rândul 3.',why:'Valoarea citită a lui a se pierde la rândul 4.'}
  ]},
 qs:[
  {t:'tf',q:'În structura secvențială, fiecare pas se execută o singură dată, în ordinea scrisă.',ok:true,why:'Adevărat. Niciun pas nu se sare și niciunul nu se repetă.'},
  {t:'order',q:'Pune în ordine algoritmul care află perimetrul unui dreptunghi.',items:['Început','Citește L și l','Calculează P ← 2 * (L + l)','Afișează P','Sfârșit'],why:'Nu poți calcula fără date și nu poți afișa un rezultat pe care încă nu l-ai calculat. Început și Sfârșit închid algoritmul.'},
  {t:'choice',q:`Urmărește pas cu pas. Ce se afișează?${A('a ← 3\nb ← a + 4\na ← b * 2\nAfișează a')}`,o:['14','7','3','6'],ok:0,ajutor:'Fă tabelul: a, apoi b, apoi noul a.',why:'a = 3, b = 3 + 4 = 7, apoi a = 7 * 2 = 14. Valoarea veche, 3, se pierde.'},
  {t:'choice',q:`Urmărește pas cu pas. Ce valori au x și y la final?${A('x ← 2\ny ← 9\naux ← x\nx ← y\ny ← aux')}`,o:['x = 9, y = 2','x = 2, y = 9','x = 9, y = 9','x = 2, y = 2'],ok:0,why:'aux păstrează 2. x primește 9. y primește ce era în aux, adică 2. Valorile s-au schimbat între ele.'},
  {t:'hunt',cod:true,q:'Algoritmul Ioanei pentru perimetrul unui dreptunghi are 2 greșeli. Apasă pe ele.',src:`Început
1. [[Afișează P.|P nu e încă calculat: afișarea vine la final]]
2. Citește L și l.
3. Calculează P ← [[2 * L + l|fără paranteze se dublează doar L; corect: 2 * (L + l)]]
Sfârșit`,corect:`Început
1. Citește L și l.
2. Calculează P ← 2 * (L + l)
3. Afișează P.
Sfârșit`,ajutor:'Folosește strategia: ce se afișează înainte de calcul? Ce fac parantezele?',indiciu:'Uită-te la ordinea pașilor și la paranteze.',why:'Un rezultat se afișează doar după ce a fost calculat, iar suma L + l trebuie pusă în paranteze ca să fie dublată toată.'}
 ]},

/* ================= 6. Structura alternativă (lecția 29) ================= */
{t:'Structura alternativă',lectii:[29],continuturi:['Structura alternativă (decizională)Medii grafice interactive - elemente de interfață specifice mediului grafic interactiv'],
 obiectiv:'scrii și urmărești un algoritm cu decizie, alegi semnul corect pentru o condiție și recunoști în Scratch blocurile și zonele care o construiesc.',
 pasi:[
  {t:'Când algoritmul trebuie să aleagă',
   text:`<p>Uneori algoritmul trebuie să <mark>aleagă</mark> ce face, după date. Pentru asta folosim <mark>structura alternativă</mark> (decizia):</p>
${A('Dacă nota ≥ 5 atunci\n    afișează „Promovat”\naltfel\n    afișează „Nepromovat”')}
<p>Întâi se verifică <mark>condiția</mark> (aici <strong>nota ≥ 5</strong>). Dacă e <strong>adevărată</strong>, se execută ramura <strong>atunci</strong>. Dacă e <strong>falsă</strong>, se execută ramura <strong>altfel</strong>.</p>
<p>Rândurile unei ramuri se scriu mai la dreapta, ca să se vadă ale cui sunt.</p>`,
   exemplu:`${TT(['nota','nota ≥ 5','Se afișează'],[['9','adevărat','Promovat'],['5','adevărat','Promovat'],['4','fals','Nepromovat']])}`,
   altfel:`<p>E ca la o răscruce: „Dacă plouă, iau umbrela, altfel iau șapca.” Te uiți pe geam (condiția) și faci <b>un singur</b> lucru, în funcție de ce vezi.</p>`,
   incearca:{t:'choice',q:`Ce se afișează pentru a = 4 și b = 9?${A('Citește a, b\nDacă a &gt; b atunci\n    afișează a\naltfel\n    afișează b')}`,o:['9','4','13','4 și 9'],ok:0,ajutor:'Evaluează condiția: 4 &gt; 9?',why:'4 &gt; 9 e fals, deci se afișează b, adică 9.'},
   inca:[
    {t:'choice',q:'Pentru nota = 3, ce afișează algoritmul „Dacă nota ≥ 5 atunci Promovat, altfel Nepromovat”?',o:['Nepromovat','Promovat','Promovat și Nepromovat','nimic'],ok:0,why:'3 ≥ 5 e fals, deci ramura altfel.'}
   ]},
  {t:'O singură ramură se execută',
   text:`<p>Se execută <mark>o singură ramură</mark>, niciodată amândouă. Condiția alege.</p>
<p>În pozele din Scratch, același algoritm e rulat pentru două numere. Condiția <code>n mod 2 = 0</code> întreabă: „n se împarte exact la 2?”. Dacă da, n e <strong>par</strong>.</p>
${fig('scratch-impar.webp',760,333,'Scratch: n este 7, condiția n mod 2 = 0 încadrată, blocul spune impar încadrat ca ramura altfel, iar pisica spune impar','Pentru <b>n = 7</b>: condiția e falsă, deci se execută <b>ramura altfel</b>. Pisica spune „impar”.')}`,
   exemplu:`${fig('scratch-par.webp',760,333,'Scratch: n este 8, blocul spune par încadrat ca ramura atunci, iar pisica spune par','Pentru <b>n = 8</b>: condiția e adevărată, deci se execută <b>ramura atunci</b>.')}<p>Se schimbă doar datele, nu și pașii. De fiecare dată, <strong>o singură</strong> ramură.</p>`,
   incearca:{t:'tf',q:'Într-o structură alternativă se execută ambele ramuri, una după alta.',ok:false,ajutor:'Uită-te la cele două poze: câte mesaje spune pisica?',why:'Fals. Condiția alege o singură ramură: atunci sau altfel.'},
   inca:[
    {t:'choice',q:`Ce se afișează pentru n = 7?${A('Citește n\nDacă n % 2 = 0 atunci\n    afișează „par”\naltfel\n    afișează „impar”')}`,o:['impar','par','7','nimic'],ok:0,why:'7 % 2 = 1, deci 1 = 0 e fals: ramura altfel.'}
   ]},
  {t:'Ramura altfel poate lipsi',
   text:`<p>Uneori nu ai nimic de făcut când condiția e falsă. Atunci ramura <strong>altfel</strong> lipsește:</p>
${A('Citește temperatura\nDacă temperatura &lt; 10 atunci\n    afișează „Ia geaca”\nAfișează „Drum bun!”')}
<p>Dacă condiția e falsă, nu se face nimic din ramură, iar algoritmul merge <strong>mai departe</strong>, la pasul de după decizie.</p>`,
   exemplu:`${TT(['temperatura','temperatura &lt; 10','Se afișează'],[['3','adevărat','Ia geaca, apoi Drum bun!'],['18','fals','doar Drum bun!']])}`,
   incearca:{t:'choice',q:'Pentru temperatura 18, ce afișează algoritmul de mai sus?',o:['doar „Drum bun!”','„Ia geaca” și „Drum bun!”','doar „Ia geaca”','nimic'],ok:0,ajutor:'18 &lt; 10? Dacă nu, sari ramura și mergi mai departe.',why:'18 &lt; 10 e fals, deci ramura nu se execută, dar pasul de după decizie da.'},
   inca:[
    {t:'tf',q:'Dacă ramura altfel lipsește și condiția e falsă, algoritmul se oprește.',ok:false,why:'Fals. Nu se face nimic din ramură, dar algoritmul continuă cu pasul următor.'}
   ]},
  {t:'Strategia: scrii condiția corect',
   text:`<p>Cea mai des întâlnită greșeală e semnul greșit în condiție. Lucrează așa:</p>
<ol><li>Găsește în cerință <strong>pragul</strong> (numărul de care depinde decizia).</li>
<li>Traduce cuvintele în semn: <strong>sub / mai mic decât</strong> → <code>&lt;</code>; <strong>peste / mai mare decât</strong> → <code>&gt;</code>; <strong>cel puțin</strong> → <code>≥</code>; <strong>cel mult</strong> → <code>≤</code>.</li>
<li><strong>Testează pragul</strong>: ce se întâmplă exact la prag? Și cu un număr de fiecare parte.</li></ol>`,
   exemplu:`<p>„Copiii sub 14 ani primesc bilet redus.” Pragul: 14. „Sub” → <code>vârsta &lt; 14</code>.</p>${TT(['vârsta','vârsta &lt; 14','Redus?'],[['13','adevărat','da'],['14','fals','nu (a împlinit 14)'],['15','fals','nu']])}`,
   incearca:{t:'choice',q:'Copiii sub 14 ani primesc bilet redus. Ce condiție scrii?',o:['vârsta < 14','vârsta > 14','vârsta ≤ 14','vârsta = 14'],ok:0,ajutor:'„Sub” → ce semn? Testează vârsta 14.',why:'„Sub 14 ani” înseamnă mai puțin de 14, fără 14. Cu „≤ 14” ar primi reducere și cei de 14 ani.'},
   inca:[
    {t:'choice',q:'Promovezi dacă media este cel puțin 5. Ce condiție scrii?',o:['media ≥ 5','media > 5','media < 5','media ≤ 5'],ok:0,why:'„Cel puțin 5” înseamnă 5 sau mai mult: ≥. Cu > 5, media 5 n-ar promova.'},
    {t:'classify',q:'Algoritmul: „Dacă temperatura &lt; 10 atunci «Ia geaca» altfel «Nu e nevoie de geacă»”. Ce afișează?',cats:['Ia geaca','Nu e nevoie de geacă'],items:[['9 grade',0],['-2 grade',0],['10 grade',1],['18 grade',1]],why:'La pragul 10, „10 &lt; 10” e fals. Și -2 e mai mic decât 10.'}
   ]},
  {t:'Decizia în Scratch: unde găsești blocurile',
   text:`<p>Scratch este un <mark>mediu grafic interactiv</mark>: construiești algoritmul trăgând blocuri cu mouse-ul. Fereastra are trei zone:</p>
<ol><li>în stânga, <strong>categoriile de blocuri</strong>, pe culori: Mișcare, Aspect, Control, Operatori, Variabile și altele;</li>
<li>la mijloc, <strong>zona de script</strong>, unde lipești blocurile;</li>
<li>în dreapta, <strong>scena</strong>, cu steagul verde (pornește) și semnul roșu (oprește).</li></ol>
<p>Decizia e blocul <strong>dacă … atunci … altfel</strong>, din categoria <strong>Control</strong>. Condiția (hexagonul verde) vine din <strong>Operatori</strong>.</p>`,
   exemplu:`${fig('scratch-variabile.webp',500,400,'Scratch: coloana de categorii din stânga (Mișcare, Aspect, Sunet, Evenimente, Control, Detectare, Operatori, Variabile) și blocurile categoriei Variabile','Coloana de <b>categorii</b>, din stânga ferestrei.')}<p>Atenție: în Scratch există doar <code>&gt;</code>, <code>&lt;</code> și <code>=</code>. Pentru „cel puțin 5” (<code>≥</code>) folosești <strong>NU</strong>: <code>NU (media &lt; 5)</code> înseamnă același lucru ca <code>media ≥ 5</code>.</p>`,
   incearca:{t:'match',q:'Leagă fiecare lucru de locul lui în Scratch.',pairs:[['blocul dacă … atunci … altfel','categoria Control'],['blocul mod și comparațiile','categoria Operatori'],['Creează o variabilă','categoria Variabile'],['pornirea programului','steagul verde']],ajutor:'Recitește lista de mai sus: decizia în Control, condiția în Operatori.',why:'Fiecare categorie are culoarea ei; decizia e în Control, condițiile în Operatori, variabilele în Variabile.'},
   inca:[

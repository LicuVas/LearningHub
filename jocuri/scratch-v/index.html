<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misiunea Scenă</title>
<meta name="description" content="Lecție-joc pentru clasa a V-a: mediul grafic interactiv Scratch, pas cu pas, de la zero. Interfața, categoriile de blocuri, structura secvențială și structura alternativă cu blocuri, evenimente, atingeri și un mini-joc, cu un Scratch simulat în care construiești și rulezi scripturi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&family=Inconsolata:wght@500;700&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../_motor/motor.css">
<style>
:root{
  --desk:#EEF3FA; --paper:#FFFFFF; --paper2:#F2F6FC; --line:#D2DCEB;
  --ink:#1A2233; --ink2:#55607A; --accent:#6D3FC0; --accentInk:#FFFFFF; --sel:#E6DDF7;
  --mark:#FFE07A; --markInk:#1A2233; --ok:#23784A; --okbg:#E0F2E7; --bad:#B8362E; --badbg:#FBE5E3;
  --fd:"Chewy","Segoe UI",system-ui,sans-serif; --fb:"Nunito","Segoe UI",system-ui,sans-serif; --fm:"Inconsolata",Consolas,monospace;
  --ev:#E6A800; --mv:#4C7FD9; --ct:#E08A1E; --op:#3FA95B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#10141D; --paper:#181E2A; --paper2:#202838; --line:#343E55;
  --ink:#E6EAF3; --ink2:#A3ADC4; --accent:#B597F5; --accentInk:#10141D; --sel:#382A5C;
  --mark:#EBC95C; --markInk:#1A2233; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF8479; --badbg:#3B1E1E;
  --ev:#B88A00; --mv:#3E6CC0; --ct:#C8781A; --op:#2F8A47;
}}
:root[data-theme="dark"]{
  --desk:#10141D; --paper:#181E2A; --paper2:#202838; --line:#343E55;
  --ink:#E6EAF3; --ink2:#A3ADC4; --accent:#B597F5; --accentInk:#10141D; --sel:#382A5C;
  --mark:#EBC95C; --markInk:#1A2233; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF8479; --badbg:#3B1E1E;
  --ev:#B88A00; --mv:#3E6CC0; --ct:#C8781A; --op:#2F8A47;
}
/* tema jocului: o stivă de blocuri colorate, ca în paleta unui mediu grafic interactiv */
.banda{display:flex;align-items:center;gap:6px;padding:7px 12px;white-space:nowrap;overflow:hidden;font-family:var(--fb);font-size:.7rem;font-weight:800;color:#fff}
.banda .b{flex:none;display:inline-block;padding:3px 9px;border-radius:6px;position:relative}
.banda .ev{background:var(--ev);border-radius:14px 14px 6px 6px}
.banda .mv{background:var(--mv)}
.banda .ct{background:var(--ct)}
.banda .op{background:var(--op);border-radius:12px}
.banda .mv::before,.banda .ct::before{content:"";position:absolute;left:10px;top:-3px;width:12px;height:4px;background:inherit;border-radius:2px 2px 0 0}
h1 .st{color:var(--accent)}

/* ===== Scratch simulat (atelierul) și blocurile din exemple ===== */
.sx-b{display:inline-block;border-radius:7px;padding:6px 10px;font:800 .84rem/1.35 var(--fb);border:1px solid rgba(0,0,0,.2);text-align:left;max-width:100%;overflow-wrap:anywhere;box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.sx-b{cursor:pointer}
button.sx-b:active{transform:translateY(1px);box-shadow:none}
.c-mis{background:#3373CC;color:#fff}.c-asp{background:#774DCB;color:#fff}
.c-ev{background:#FFBF00;color:#2b1d00}.c-ct{background:#FFAB19;color:#2b1d00}.c-vr{background:#FF8C1A;color:#2b1d00}
.sx-b.hat{border-radius:18px 18px 7px 7px;padding-top:9px}
.hx{font-style:normal;display:inline-block;padding:1px 12px;margin:0 2px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.hx.op{background:#59C059;color:#10250f}.hx.det{background:#5CB1D6;color:#0c2430}
.flag{color:#1f7a2e}
.sx-ln{display:flex;align-items:center;gap:4px;padding:2px 0 2px calc(var(--d)*18px);background:repeating-linear-gradient(90deg,#FFAB19 0 6px,transparent 6px 18px) 0 0/calc(var(--d)*18px) 100% no-repeat;min-width:0}
.sx-ln.hat{margin-top:12px}.sx-ln:first-child{margin-top:0}
.sx-ln.loose .sx-b{outline:2px dashed var(--bad);outline-offset:2px;opacity:.85}
.sx-stiva{margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);max-width:100%;overflow:hidden}
.sx-stiva .cap{font-size:.8rem;color:var(--ink2);font-weight:700;margin:0 0 6px}
.sx{display:grid;gap:12px;margin-top:8px;min-width:0}
.sx>*{min-width:0}
@media (min-width:760px){.sx{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.sx-scena{grid-column:2;grid-row:1/span 3}}
.sx-scena,.sx-pal,.sx-cod,.sx-tst{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 10px}
.sx-scena{background:var(--paper2)}
.sx .lbl{font:800 .76rem var(--fb);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.sx-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sx-flag,.sx-stop{width:44px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;padding:0}
.sx-flag svg{width:22px;height:22px}
.sx-flag.on{background:#CFEFD5;border-color:#2E9E3F}
.sx-stop::before{content:"";width:18px;height:18px;border-radius:50%;background:#E5484D}
.sx-pers{font-size:.85rem;color:var(--ink2);margin-left:auto}
.sx-st{position:relative;aspect-ratio:4/3;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sx-sp{position:absolute;width:15%;transform:translate(-50%,-50%)}
.sx-sp svg{display:block;width:100%;height:auto}
.sx-bub{position:absolute;transform:translate(0,-100%);background:#fff;color:#222;border:2px solid #aaa;border-radius:12px;padding:2px 8px;font:800 .78rem var(--fb);white-space:nowrap}
.sx-mon{position:absolute;left:6px;top:6px;background:#eee;border:1px solid #ccc;border-radius:5px;padding:2px 6px;font:800 .74rem var(--fb);color:#333}
.sx-mon b{background:#FF8C1A;color:#fff;border-radius:4px;padding:0 6px;margin-left:4px}
.sx-xy{font:700 .84rem var(--fm);color:var(--ink2);margin-top:6px;overflow-wrap:anywhere}
.sx-taste{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sx-grp{margin:2px 0 10px}
.sx-gn{display:flex;align-items:center;gap:6px;font-size:.84rem;font-weight:800;margin-bottom:5px}
.sx-gn i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.sx-pb{display:flex;flex-wrap:wrap;gap:7px}
.sx-x{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:.95rem;padding:4px 7px;flex:none}
.sx-cur{font-size:.88rem;color:var(--ink2);margin:10px 0 6px}
.sx-cur .bad{color:var(--bad);display:block;margin-top:4px}
.sx-gol{color:var(--ink2);font-style:italic;font-size:.9rem;margin:4px 0}
.sx-tst ol{margin:0;padding:0;list-style:none}
.sx-tst li{display:flex;gap:8px;padding:3px 0;font-size:.92rem}
.sx-tst li .s{flex:none;width:1.1em;font-weight:800}
.sx-tst li.ok .s{color:var(--ok)}.sx-tst li.no .s{color:var(--bad)}
.sx-tst .m{display:block;color:var(--bad);font-size:.85rem}
</style>
</head>
<body>
<script src="../_motor/motor.js"></script>
<script>
/* MISIUNEA SCENĂ, rescrisă pe PAȘI (26.09.2026).
   Profesorul: „informația e prea condensată - nu e beginner friendly - e mai mult test decât asistență de învățare”;
   „posibilitatea efectivă a exersării - simulare a aplicației adevărate”.
   De aceea: fiecare nivel = pași mici (o idee, un exemplu cu blocuri, „explică-mi altfel”, exercițiu cu indiciu
   și variante), apoi ATELIERUL: un Scratch simulat (paletă, zonă de cod, scenă cu steag verde și buton roșu,
   săgeți, variabila scor) în care elevul îmbină blocuri și le rulează, cu TESTE pe comportament
   (scriptul se rulează în simulator și se verifică ce face personajul, și pe date schimbate), abia apoi verificarea.
   Numele blocurilor sunt cele din Scratch 3 în română, citite de pe capturile din img/. */
const IMG=(f,w,h,alt,cap)=>`<figure class="captura"><a href="../scratch-v/img/${f}" target="_blank"><img src="../scratch-v/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

/* ---------- blocurile (textul exact din Scratch 3 în română, după capturi) ---------- */
const CAT={mis:['Mișcare','Motion','#3373CC'],asp:['Aspect','Looks','#774DCB'],ev:['Evenimente','Events','#FFBF00'],ct:['Control','Control','#FFAB19'],vr:['Variabile','Variables','#FF8C1A']};
const STEAG='<b class="flag">⚑</b>';
const B={
 steag:{c:'ev',h:1,t:`când se dă click pe ${STEAG}`},
 tdr:{c:'ev',h:1,key:'dreapta',t:'când tasta săgeată dreapta este apăsată'},
 tst:{c:'ev',h:1,key:'stanga',t:'când tasta săgeată stânga este apăsată'},
 m10:{c:'mis',t:'mergi 10 pași',a:S=>S.mergi(10)},
 m100:{c:'mis',t:'mergi 100 pași',a:S=>S.mergi(100)},
 r15:{c:'mis',t:'rotește-te ↻ 15 grade',a:S=>S.roteste(15)},
 g00:{c:'mis',t:'mergi la x: 0 y: 0',a:S=>S.la(0,0)},
 gsus:{c:'mis',t:'mergi la x: 0 y: 150',a:S=>S.la(0,150)},
 x10:{c:'mis',t:'modifică x cu 10',a:S=>S.la(S.x+10,S.y)},
 xm10:{c:'mis',t:'modifică x cu -10',a:S=>S.la(S.x-10,S.y)},
 ym10:{c:'mis',t:'modifică y cu -10',a:S=>S.la(S.x,S.y-10)},
 sSalut:{c:'asp',t:'spune Salut! pentru 2 secunde',say:'Salut!',dur:2},
 sPornim:{c:'asp',t:'spune Pornim! pentru 2 secunde',say:'Pornim!',dur:2},
 sBravo:{c:'asp',t:'spune Bravo! pentru 2 secunde',say:'Bravo!',dur:2},
 sMai:{c:'asp',t:'spune Mai încearcă! pentru 2 secunde',say:'Mai încearcă!',dur:2},
 sCastig:{c:'asp',t:'spune Am câștigat!',say:'Am câștigat!'},
 w1:{c:'ct',t:'așteaptă 1 secunde',wait:1},
 inf:{c:'ct',C:1,loop:1,t:'la infinit'},
 dScor:{c:'ct',C:1,t:'dacă <i class="hx op">scor &gt; 10</i> atunci',cond:S=>S.scor>10},
 dScorA:{c:'ct',C:2,t:'dacă <i class="hx op">scor &gt; 10</i> atunci … altfel',cond:S=>S.scor>10},
 d10:{c:'ct',C:1,t:'dacă <i class="hx op">scor = 10</i> atunci',cond:S=>S.scor===10},
 dAt:{c:'ct',C:1,t:'dacă <i class="hx det">atinge Pisica ?</i> atunci',cond:S=>S.atinge()},
 alt:{c:'ct',mk:1,t:'altfel'},
 sc0:{c:'vr',t:'setează scor la 0',a:S=>S.scorLa(0,1)},
 sc12:{c:'vr',t:'setează scor la 12',a:S=>S.scorLa(12,1)},
 sc5:{c:'vr',t:'setează scor la 5',a:S=>S.scorLa(5,1)},
 sc1:{c:'vr',t:'modifică scor cu 1',a:S=>S.scorLa(S.scor+1)}
};
const FPS=30;   // ca Scratch: 30 de cadre pe secundă
const clone=a=>JSON.parse(JSON.stringify(a||[]));
const faraTag=s=>s.replace(/<[^>]+>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<');
/* după ultimul bloc, unde se îmbină următorul (0 = sub script; d+1 = în „gura” unui bloc de Control) */
function adancime(L){let c=0;L.forEach(([id,d])=>{const b=B[id];c=b.h?0:(b.C||b.mk)?d+1:d});return c}
const primaPalarie=L=>L.findIndex(l=>B[l[0]].h);
const liber=(L,i)=>{const fp=primaPalarie(L);return !B[L[i][0]].h&&(fp<0||i<fp)};
function stramosi(L,i){const r=[];let need=L[i][1]-1;for(let j=i-1;j>=0&&need>=0;j--){const b=B[L[j][0]];if(b.h)break;if(L[j][1]===need&&b.C){r.push(L[j][0]);need--}}return r}
/* liniile → scripturi (arbori); blocurile de dinaintea primului eveniment sunt „lăsate singure” */
function parse(L){const sc=[];let cur=null,nodes=[];
  L.forEach(([id,d])=>{const b=B[id];
    if(b.h){cur={hat:id,kids:[]};sc.push(cur);nodes=[];return}
    if(!cur)return;
    if(b.mk){const n=nodes[d];if(n&&B[n.id].C===2)n.inAlt=true;return}
    const par=d?nodes[d-1]:null,tgt=par?(par.inAlt?par.alt:par.kids):cur.kids;
    const n={id,kids:[],alt:[],inAlt:false};tgt.push(n);nodes[d]=n;nodes.length=d+1});
  return sc}
function* rul(list,S){for(const n of list)yield* exb(n,S)}
function* exb(n,S){const b=B[n.id];
  if(b.loop){for(;;){yield* rul(n.kids,S);yield}}
  if(b.C){if(b.cond(S))yield* rul(n.kids,S);else if(b.C===2)yield* rul(n.alt,S);return}
  if(b.say){S.spune(b.say);if(b.dur){for(let k=0;k<b.dur*FPS;k++)yield;S.spune('')}return}
  if(b.wait){for(let k=0;k<b.wait*FPS;k++)yield;return}
  b.a(S)}
/* motorul: lume '' (pisica singură), 'mar' (scrii codul mărului; pisica stă jos), 'auto' (scrii codul pisicii; mărul crește scorul singur, o dată pe secundă) */
function Motor(L,o){o=o||{};const P=parse(L),lume=o.lume||'';
  const d0=lume==='mar'?[0,150]:lume==='auto'?[0,-120]:[0,0];
  const S={f:0,ev:[],fire:[],t0:null,x:o.x0!=null?o.x0:d0[0],y:o.y0!=null?o.y0:d0[1],dir:o.dir0!=null?o.dir0:90,say:'',scor:o.scor0||0};
  S.log=(k,v)=>S.ev.push({f:S.f,k,v});
  S.la=(x,y)=>{S.x=Math.round(x*10)/10+0;S.y=Math.round(y*10)/10+0;S.log('pos',[S.x,S.y])};
  S.mergi=n=>{const r=S.dir*Math.PI/180;S.la(S.x+n*Math.sin(r),S.y+n*Math.cos(r))};
  S.roteste=g=>{S.dir=(S.dir+g)%360;S.log('dir',S.dir)};
  S.spune=t=>{S.say=t;if(t)S.log('say',t)};
  S.scorLa=(v,set)=>{if(set&&o.scor!=null)v=o.scor;S.scor=v;S.log('scor',v)};
  S.atinge=()=>lume==='mar'&&Math.abs(S.x)<50&&Math.abs(S.y+120)<50;
  return {S,lume,
    steag(){S.fire=P.filter(s=>s.hat==='steag').map(s=>rul(s.kids,S));if(lume==='auto'){S.scorLa(0);S.t0=S.f}},
    tasta(k){P.filter(s=>B[s.hat].key===k).forEach(s=>S.fire.push(rul(s.kids,S)))},
    stop(){S.fire=[];S.say='';S.t0=null},
    merge(){return S.fire.length>0||(lume==='auto'&&S.t0!=null&&S.scor<10)},
    tick(){if(lume==='auto'&&S.t0!=null){const k=Math.min(10,Math.floor((S.f-S.t0)/FPS));if(k>S.scor)S.scorLa(k)}
      S.fire=S.fire.filter(g=>!g.next().done);S.f++}};
}
/* rularea „de test”: steagul la cadrul 0, tastele la cadrele cerute; întoarce tot ce s-a întâmplat */
function urma(L,o){const M=Motor(L,o);M.steag();const ap=o.apasa||[],n=o.cadre||360;
  for(let f=0;f<n;f++){ap.forEach(a=>{if(a[1]===f)M.tasta(a[0])});M.tick()}return M.S}
/* ajutoare pentru teste */
const spus=(T,t)=>T.ev.some(e=>e.k==='say'&&e.v===t);
const cand=(T,k,p)=>{const e=T.ev.find(e=>e.k===k&&(!p||p(e.v)));return e?e.f:-1};
const pozitii=T=>T.ev.filter(e=>e.k==='pos');
const are=(L,id)=>L.some(l=>l[0]===id);
const inBloc=(L,id,par)=>L.some((l,i)=>l[0]===id&&stramosi(L,i).includes(par));
const faraLibere=L=>!L.some((_,i)=>liber(L,i));
const incepeCu=(L,id)=>L.length>0&&L[0][0]===id&&faraLibere(L);

function linie(l,i,L,edit){const b=B[l[0]],lz=liber(L,i);
  return `<div class="sx-ln${b.h?' hat':''}${lz?' loose':''}" style="--d:${l[1]}"><span class="sx-b c-${b.c}${b.h?' hat':''}">${b.t}</span>${edit?`<button type="button" class="sx-x" data-i="${i}" aria-label="Scoate blocul din zona de cod" title="Scoate blocul">✕</button>`:''}</div>`}
/* blocuri „de citit” în pași (ca în zona de cod) */
const stiva=(L,cap)=>`<div class="sx-stiva" role="img" aria-label="Blocuri Scratch: ${L.map(l=>faraTag(B[l[0]].t).replace('⚑','steagul verde')).join(', ')}">${cap?`<p class="cap">${cap}</p>`:''}${L.map((l,i)=>linie(l,i,L,false)).join('')}</div>`;
const bloc=id=>`<span class="sx-b c-${B[id].c}${B[id].h?' hat':''}">${B[id].t}</span>`;

const PISICA=`<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M13 24 L15 5 L27 17 Z M47 24 L45 5 L33 17 Z" fill="#F7A21B" stroke="#8a5300" stroke-width="2" stroke-linejoin="round"/><ellipse cx="30" cy="33" rx="21" ry="18" fill="#F7A21B" stroke="#8a5300" stroke-width="2"/><ellipse cx="30" cy="40" rx="11" ry="7" fill="#fff"/><circle cx="23" cy="29" r="4.5" fill="#fff" stroke="#8a5300"/><circle cx="37" cy="29" r="4.5" fill="#fff" stroke="#8a5300"/><circle cx="24.5" cy="29.5" r="2" fill="#222"/><circle cx="38.5" cy="29.5" r="2" fill="#222"/><path d="M24 41 Q30 46 36 41" stroke="#5a3500" stroke-width="2" fill="none"/></svg>`;
const MAR=`<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M30 16 Q33 6 40 5" stroke="#6b3b12" stroke-width="3" fill="none"/><path d="M33 12 Q44 4 48 12 Q40 17 33 12 Z" fill="#3fa34d"/><path d="M30 18 C18 10 5 20 8 36 C11 52 22 57 30 52 C38 57 49 52 52 36 C55 20 42 10 30 18 Z" fill="#E03131" stroke="#8f1d1d" stroke-width="2"/><ellipse cx="20" cy="28" rx="4" ry="7" fill="#fff" opacity=".5"/></svg>`;
const STEAG_SVG=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v19" stroke="#1f7a2e" stroke-width="2.4" stroke-linecap="round"/><path d="M6 4c4-2 7 2 13 0v9c-6 2-9-2-13 0z" fill="#3CB44B" stroke="#1f7a2e" stroke-width="1.4"/></svg>`;

/* ---------- simulatorul: Scratch în miniatură ---------- */
const TIPURI={scratch:{
 render(Q,body,api){
  const lume=Q.lume||'',o0={lume,x0:Q.x0,y0:Q.y0};
  let L=clone(Q.start),cur=adancime(L),M=null,timer=null;const U={ran:false,stopped:false};
  const pal=Q.paleta||[],teste=Q.teste||[];
  const ids=pal.concat(L.map(l=>l[0])).concat((Q.solutie||[]).map(l=>l[0]));
  const areTaste=ids.some(id=>B[id].key),areScor=lume==='mar'||lume==='auto'||ids.some(id=>B[id].c==='vr');
  const pers=lume==='mar'?'Măr':'Pisica';
  const grupuri=Object.keys(CAT).map(c=>{const bl=pal.filter(id=>B[id].c===c);return bl.length?`<div class="sx-grp"><div class="sx-gn"><i style="background:${CAT[c][2]}"></i>${CAT[c][0]} <span style="color:var(--ink2);font-weight:400">(${CAT[c][1]})</span></div><div class="sx-pb">${bl.map(id=>`<button type="button" class="sx-b c-${B[id].c}${B[id].h?' hat':''}" data-b="${id}">${B[id].t}</button>`).join('')}</div></div>`:''}).join('');
  body.innerHTML=`<div class="sx">
   <div class="sx-scena"><div class="lbl">Scena</div>
    <div class="sx-bar"><button type="button" class="sx-flag" aria-label="Steagul verde: pornește programul" title="Steagul verde: pornește">${STEAG_SVG}</button><button type="button" class="sx-stop" aria-label="Butonul roșu: oprește programul" title="Butonul roșu: oprește"></button><span class="sx-pers">Codul e al personajului: <b>${pers}</b></span></div>
    <div class="sx-st"><div class="sx-mon" ${areScor?'':'hidden'}>scor<b>0</b></div><div class="sx-sp mar" hidden>${MAR}</div><div class="sx-sp pis">${PISICA}</div><div class="sx-bub" hidden></div></div>
    <div class="sx-xy"></div>

  const $=s=>body.querySelector(s);

  const pune=(el,x,y,dir)=>{el.style.left=((x+240)/4.8)+'%';el.style.top=((180-y)/3.6)+'%';el.style.transform=`translate(-50%,-50%) rotate(${(dir||90)-90}deg)`};

    if(lume==='auto')pune($('.mar'),0,150,90);
    const bub=$('.sx-bub');bub.hidden=!S.say;bub.textContent=S.say;
    bub.style.left=Math.min(70,(S.x+240)/4.8+3)+'%';bub.style.top=Math.max(14,(180-S.y)/3.6-7)+'%';

    $('.sx-xy').textContent=`${pers}:  x: ${Math.round(S.x)}  y: ${Math.round(S.y)}  direcția: ${Math.round(S.dir)}`};
  const opreste=deUser=>{if(deUser&&U.ran&&(timer||M.merge()))U.stopped=true;if(timer){clearInterval(timer);timer=null}
    if(deUser)M.stop();else{M.S.fire=[];M.S.t0=null}$('.sx-flag').classList.remove('on');draw()};
  const porneste=()=>{if(timer)return;$('.sx-flag').classList.add('on');
    timer=setInterval(()=>{if(!body.isConnected){clearInterval(timer);timer=null;return}
      M.tick();draw();if(!M.merge())opreste(false)},1000/FPS)};
  const steag=()=>{U.ran=true;if(timer){clearInterval(timer);timer=null}nou(true);M.steag();draw();porneste()};
  const marcheaza=()=>{body.querySelectorAll('.sx-tst li').forEach(li=>{li.className='';li.querySelector('.s').textContent='○';li.querySelector('.m').hidden=true});const nr=$('.sx-tst .nr');if(nr)nr.textContent='apasă „Rulează testele”'};
  const cod=()=>{
    const box=$('.sx-lines');
    box.innerHTML=L.length?L.map((l,i)=>linie(l,i,L,true)).join(''):'<p class="sx-gol">Zona de cod e goală. Atinge un bloc din paletă.</p>';
    const fp=primaPalarie(L),lz=L.some((_,i)=>liber(L,i));let t,btn='';
    if(fp<0)t='Un script începe cu un bloc galben de <b>Evenimente</b>, de exemplu „când se dă click pe ⚑”.';
    else if(cur===0)t='Blocul următor se îmbină la <b>capătul scriptului</b>, sub ultimul bloc.';
    else{let j=-1;for(let k=L.length-1;k>=0;k--){if(L[k][1]===cur-1&&B[L[k][0]].C){j=k;break}}
      if(j<0){cur=0;return cod()}
      const nm=faraTag(B[L[j][0]].t).replace(' … altfel',''),aAlt=L.slice(j+1).some(l=>l[0]==='alt'&&l[1]===L[j][1]);
      t=`Blocul următor intră <b>în</b> „${nm}”${aAlt?', pe ramura <b>altfel</b>':''}.`;
      btn=`<button type="button" class="btn sm" data-a="iesi">Ieși din „${nm}”</button>`;
      if(B[L[j][0]].C===2&&!aAlt)btn+=` <button type="button" class="btn sm" data-a="altfel" data-j="${j}">Treci pe ramura „altfel”</button>`}
    if(lz)t+='<span class="bad">Blocul încadrat cu linie punctată nu e îmbinat sub un bloc de eveniment, deci nu se execută. Scoate-l cu ✕ și pune-l la locul lui.</span>';
    $('.sx-cur').innerHTML=t+(btn?`<div class="row" style="margin-top:6px">${btn}</div>`:'');
    box.querySelectorAll('.sx-x').forEach(b=>b.onclick=()=>scoate(+b.dataset.i));
    const iesi=$('[data-a="iesi"]');if(iesi)iesi.onclick=()=>{cur--;cod()};
    const al=$('[data-a="altfel"]');if(al)al.onclick=()=>{const j=+al.dataset.j;L.push(['alt',L[j][1]]);cur=L[j][1]+1;schimbat()}};
  const schimbat=()=>{if(timer){clearInterval(timer);timer=null;$('.sx-flag').classList.remove('on')}nou(true);cod();draw();marcheaza()};
  const adauga=id=>{if(api.done())return;if(B[id].h){L.push([id,0]);cur=0}else{L.push([id,cur]);if(B[id].C)cur++}schimbat()};
  const scoate=i=>{if(api.done())return;const [id,D]=L[i],b=B[id];let k=i+1;
    if(b.h){while(k<L.length&&!B[L[k][0]].h)k++}
    else if(b.C){while(k<L.length&&(L[k][1]>D||(L[k][0]==='alt'&&L[k][1]===D)))k++}
    L.splice(i,k-i);cur=adancime(L);schimbat()};

  const ruleaza=()=>{let prima=null,n=0;
    teste.forEach((t,i)=>{let ok=false;try{ok=!!t.ok(urma(L,Object.assign({},o0,t.o||{})),L,U)}catch(e){ok=false}
      const li=$(`.sx-tst li[data-i="${i}"]`);li.className=ok?'ok':'no';li.querySelector('.s').textContent=ok?'✓':'✗';

    const nr=$('.sx-tst .nr');if(nr)nr.textContent=`${n} din ${teste.length} trec`;return {ok:n===teste.length,msg:prima}};
  body._sx={set(nl){L=clone(nl);cur=adancime(L);schimbat()},steag:()=>$('.sx-flag').click(),stop:()=>$('.sx-stop').click()};
  nou(false);cod();draw();
  api.checkButton(()=>{const r=ruleaza();

 },
 rezolva(Q,body){const c=body._sx;c.set(Q.solutie);c.steag();c.stop()},
 gresit(Q,body){body._sx.set(Q.gresit||Q.start||[])}
}};

   incearca:{t:'choice',q:'Cum recunoști repede din ce categorie e un bloc?',o:['După culoare: are culoarea bulinei','După lungimea textului scris pe el','După primul cuvânt din bloc','Nu se poate recunoaște deloc'],ok:0,ajutor:'Ultima propoziție scrisă îngroșat în pas.',why:'Blocul are aceeași culoare ca bulina categoriei lui: albastru = Mișcare, galben = Evenimente.'},
   inca:[
    {t:'tf',q:'Când apeși pe bulina unei categorii, paleta îți arată blocurile acelei categorii.',ok:true,ajutor:'Recitește a doua parte a pasului.',why:'Adevărat. Bulinele sunt ca un cuprins: te duc direct la blocurile categoriei.'}
   ]},
  {t:'Mișcare și Aspect',
   text:`<p>Două categorii pe care le folosești mereu:</p>
<ul><li><strong>Mișcare</strong> (<em>Motion</em>, albastru): schimbă <mark>locul</mark> sau direcția personajului: „mergi 10 pași”, „rotește-te 15 grade”, „mergi la x: 0 y: 0”;</li>
<li><strong>Aspect</strong> (<em>Looks</em>, mov): schimbă cum <mark>arată</mark> personajul sau ce <mark>spune</mark>: „spune Salut! pentru 2 secunde”.</li></ul>
<p><strong>Cum alegi:</strong> întreabă-te „se schimbă LOCUL personajului?” Dacă da, cauți la Mișcare. „Se schimbă ce SPUNE sau cum ARATĂ?” Atunci cauți la Aspect.</p>`,
   exemplu:`${stiva([['m10',0],['r15',0],['g00',0]],'Mișcare (albastru):')}${stiva([['sSalut',0]],'Aspect (mov):')}`,
   incearca:{t:'choice',q:'În ce categorie cauți blocul care face pisica să spună „Salut!”?',o:['Aspect (Looks)','Mișcare (Motion)','Evenimente (Events)','Operatori (Operators)'],ok:0,ajutor:'Se schimbă locul pisicii sau ce spune ea?',why:'Tot ce ține de cum arată personajul, inclusiv bulele cu text, e la Aspect. Mișcare schimbă doar poziția și direcția.'},
   inca:[
    {t:'classify',q:'Mișcare sau Aspect?',cats:['Mișcare','Aspect'],items:[['mergi 10 pași',0],['spune Salut! pentru 2 secunde',1],['rotește-te ↻ 15 grade',0],['spune Bravo! pentru 2 secunde',1]],ajutor:'Schimbă locul? Mișcare. Spune ceva? Aspect.',why:'Blocurile care mută sau rotesc sunt la Mișcare; cele care fac personajul să vorbească sunt la Aspect.'}
   ]},
  {t:'Evenimente, Control, Operatori',
   text:`<ul><li><strong>Evenimente</strong> (<em>Events</em>, galben): blocurile care <mark>pornesc</mark> un script: „când se dă click pe ⚑”, „când tasta săgeată dreapta este apăsată”. Au partea de sus rotunjită, ca o pălărie: stau mereu primele.</li>
<li><strong>Control</strong> (<em>Control</em>, portocaliu): hotărăsc <mark>când și dacă</mark> se execută alte blocuri: „așteaptă 1 secunde”, „la infinit”, „dacă … atunci”.</li>
<li><strong>Operatori</strong> (<em>Operators</em>, verde): fac <mark>calcule și comparații</mark>, de exemplu „scor &gt; 10”.</li></ul>`,
   exemplu:`${stiva([['steag',0],['w1',0],['sSalut',0]],'Galben sus (pornește), portocaliu (așteaptă), mov (spune):')}<p>La steag, pisica stă o secundă, apoi spune „Salut!”.</p>`,
   altfel:`<p>La școală: <b>clopoțelul</b> pornește ora (Evenimente), <b>regulile</b> spun când și dacă faci ceva, „dacă termini, citești” (Control), iar <b>calculatorul de buzunar</b> socotește și compară (Operatori).</p>`,
   incearca:{t:'classify',q:'În ce categorie e fiecare bloc?',cats:['Mișcare','Evenimente','Control'],items:[['mergi 10 pași',0],['rotește-te ↻ 15 grade',0],['când se dă click pe steagul verde',1],['când tasta săgeată dreapta este apăsată',1],['așteaptă 1 secunde',2],['dacă … atunci',2]],ajutor:'„când…” pornește ceva: Evenimente. „așteaptă” și „dacă” hotărăsc când: Control.',why:'Mișcare mută personajul. Evenimentele pornesc scriptul la un semnal. Control hotărăște când și dacă se execută blocurile.'},
   inca:[
    {t:'choice',q:'În ce categorie găsești blocul „la infinit”?',o:['Control','Evenimente','Mișcare','Aspect'],ok:0,ajutor:'Hotărăște de câte ori se execută alte blocuri.',why:'„la infinit” e un bloc de Control: repetă blocurile din interiorul lui fără oprire.'},
    {t:'choice',q:'Ce fel de bloc stă mereu primul, sus, într-un script?',o:['Un bloc galben de Evenimente','Un bloc albastru de Mișcare','Un bloc verde de Operatori','Un bloc mov de Aspect'],ok:0,ajutor:'Care blocuri au partea de sus rotunjită, ca o pălărie?',why:'Blocurile de Evenimente pornesc scriptul, deci stau deasupra tuturor celorlalte.'}
   ]},
  {t:'Unde e personajul: x și y',
   text:`<p>Pe scenă, locul personajului se scrie cu două numere:</p>
<ul><li><mark>x</mark> = stânga–dreapta. Spre <strong>dreapta</strong> x crește, spre stânga scade.</li>
<li><mark>y</mark> = jos–sus. În <strong>sus</strong> y crește, în jos scade.</li></ul>
<p><strong>Centrul scenei</strong> este x = 0, y = 0. Sub scenă, la personaj, vezi mereu x și y ale lui. Blocul „mergi la x: 0 y: 0” îl duce în centru.</p>
${IMG('scratch-scena-xy.webp',488,510,'Scena din Scratch cu personajul Pisica fix în mijloc și câmpurile x și y încadrate, amândouă la 0','Pisica stă chiar în centru, iar sub scenă scrie <b>x 0</b> și <b>y 0</b>.')}`,
   exemplu:`<p>Pisica e în centru (x 0, y 0). După „mergi 10 pași”, sub scenă scrie <b>x 10</b>, y 0: s-a mutat puțin la dreapta, fără să urce.</p>`,
   altfel:`<p>E ca pe tabla de șah sau la „Vaporașe”: o literă și o cifră îți spun căsuța. Aici x spune cât de la dreapta, iar y cât de sus.</p>`,
   incearca:{t:'choice',q:'Personajul e la x = 0, y = 0. Unde ajunge dacă îl duci la x = 100, y = 0?',o:['Mai la dreapta','Mai la stânga','Mai sus','Mai jos'],ok:0,ajutor:'Care număr s-a schimbat? x e stânga–dreapta.',why:'y rămâne 0, deci nu urcă și nu coboară. x crește de la 0 la 100, adică personajul se mută spre dreapta.'},
   inca:[
    {t:'choice',q:'Personajul e la x = 0, y = 0. Unde ajunge la x = 0, y = -100?',o:['Mai jos','Mai sus','Mai la dreapta','Mai la stânga'],ok:0,ajutor:'y e jos–sus; minus înseamnă că scade.',why:'x nu se schimbă, iar y scade de la 0 la -100: personajul coboară.'},
    {t:'tf',q:'Centrul scenei are coordonatele x = 0 și y = 0.',ok:true,why:'Adevărat. Spre dreapta x crește, spre stânga scade. În sus y crește, în jos scade.'}
   ]}
 ],
 atelier:{t:'scratch',titlu:'La centru, apoi la plimbare',

   {ce:'Pisica spune „Salut!”',msg:'Lipsește blocul mov „spune Salut! pentru 2 secunde”.',ok:T=>spus(T,'Salut!')},
   {ce:'La final, pisica e la x: 100, y: 0',msg:'Din centru, 100 de pași o duc la x: 100. Verifică ordinea: întâi centrul, apoi pașii.',ok:T=>T.x===100&&T.y===0},

  solutie:[['steag',0],['g00',0],['sSalut',0],['m100',0]],gresit:[['steag',0],['m100',0],['g00',0],['sSalut',0]],
  why:'Ai folosit blocuri din trei categorii: galben (pornește), albastru (mută), mov (spune). Ordinea din stivă a fost ordinea pașilor.',

 qs:[
  {t:'choice',q:'În ce categorie cauți blocul care face pisica să spună „Bravo!”?',o:['Aspect (Looks)','Mișcare (Motion)','Evenimente (Events)','Operatori (Operators)'],ok:0,why:'Bulele cu text sunt la Aspect: schimbă ce spune personajul, nu locul lui.'},
  {t:'classify',q:'În ce categorie e fiecare bloc?',cats:['Mișcare','Evenimente','Control'],items:[['mergi 10 pași',0],['mergi la x: 0 y: 0',0],['când se dă click pe steagul verde',1],['când tasta săgeată stânga este apăsată',1],['așteaptă 1 secunde',2],['la infinit',2]],ajutor:'Mută? Pornește? Hotărăște când?',why:'Mișcare mută personajul. Evenimentele pornesc scriptul la un semnal. Control hotărăște când și dacă se execută blocurile.'},
  {t:'tf',q:'Centrul scenei are coordonatele x = 0 și y = 0.',ok:true,why:'Adevărat. Spre dreapta x crește, spre stânga scade. În sus y crește, în jos scade.'},
  {t:'choice',q:'Personajul e la x = 0, y = 0. Unde ajunge dacă îl duci la x = 100, y = 0?',o:['Mai la dreapta','Mai la stânga','Mai sus','Mai jos'],ok:0,why:'y rămâne 0, deci nu urcă și nu coboară. x crește de la 0 la 100, adică personajul se mută spre dreapta.'},
  {t:'match',q:'Potrivește categoria cu ce fac blocurile ei.',pairs:[['Mișcare','schimbă locul personajului'],['Aspect','schimbă ce spune sau cum arată'],['Evenimente','pornesc un script'],['Operatori','fac calcule și comparații']],why:'Categoria îți spune unde să cauți: după ce trebuie să facă blocul.'}

/* ================= 3. Secvența cu blocuri (lecția 32) ================= */
{t:'Secvența cu blocuri',lectii:[32],continuturi:[BLK,'Structura secvenţială (liniară)'],
 obiectiv:'construiești un script care face pașii exact în ordinea cerută și îi vezi pe rând pe scenă.',
 pasi:[
  {t:'Scriptul: o stivă de blocuri',
   text:`<p>Un <mark>script</mark> este o stivă de blocuri îmbinate. Sus stă întotdeauna un bloc de <strong>Evenimente</strong>, de exemplu „când se dă click pe ⚑”. El spune <em>când</em> pornește scriptul.</p>
<p>Sub el se lipesc, unul sub altul, blocurile care spun <em>ce</em> face personajul. Toate blocurile lipite formează un singur script.</p>`,
   exemplu:stiva([['steag',0],['sPornim',0],['m100',0]],'Un script cu trei blocuri:'),
   incearca:{t:'tf',q:'Într-un script, blocul de eveniment stă sus, deasupra celorlalte.',ok:true,ajutor:'Care bloc spune „când” pornește scriptul?',why:'Adevărat. Evenimentul pornește scriptul, deci stă primul.'},
   inca:[
    {t:'choice',q:'Ce este un script?',o:['O stivă de blocuri îmbinate, cu un eveniment sus','Un singur bloc albastru de Mișcare','Un personaj care stă pe scenă','O categorie de blocuri din paletă'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Scriptul e stiva întreagă: evenimentul de sus plus blocurile lipite sub el.'}
   ]},
  {t:'De sus în jos, unul după altul',
   text:`<p>Blocurile unui script se execută <mark>de sus în jos</mark>, unul după altul, fiecare o singură dată. Aceasta este <mark>structura secvențială</mark>, pe care o știi din algoritmii scriși în cuvinte.</p>
<p>De aceea <strong>ordinea contează</strong>: dacă schimbi locul a două blocuri, personajul face lucrurile în altă ordine.</p>`,
   exemplu:`${stiva([['steag',0],['sPornim',0],['m100',0]],'A: întâi vorbește, apoi merge.')}${stiva([['steag',0],['m100',0],['sPornim',0]],'B: întâi merge, apoi vorbește.')}<p>Aceleași blocuri, altă ordine, alt rezultat.</p>`,
   altfel:`<p>Ca o rețetă: „bați ouăle, apoi le pui în tigaie” nu e același lucru cu „pui ouăle în tigaie, apoi le bați”. Pașii sunt aceiași, ordinea schimbă totul.</p>`,
   incearca:{t:'order',q:'Pune blocurile în ordine: la steag, pisica spune „Pornim!” 2 secunde, apoi merge 100 de pași.',items:['când se dă click pe steagul verde','spune Pornim! pentru 2 secunde','mergi 100 pași'],ajutor:'Evenimentul sus, apoi pașii exact în ordinea din cerință.',why:'Blocul de eveniment stă mereu sus. Apoi pașii, în ordinea cerută: întâi vorbește, apoi merge.'},
   inca:[
    {t:'tf',q:'Într-un script, blocurile se execută de jos în sus.',ok:false,ajutor:'În ce direcție citești o rețetă?',why:'Fals. Se execută de sus în jos, începând cu blocul de eveniment.'},
    {t:'order',q:'La steag, pisica merge în centru, apoi spune „Salut!”, apoi se rotește. Pune blocurile în ordine.',items:['când se dă click pe steagul verde','mergi la x: 0 y: 0','spune Salut! pentru 2 secunde','rotește-te ↻ 15 grade'],ajutor:'Citește cerința și pune blocurile în aceeași ordine.',why:'Ordinea din stivă e ordinea din cerință.'}
   ]},
  {t:'Prea repede? Pune „așteaptă”',
   text:`<p>Blocurile de mișcare se execută foarte repede. Dacă pui două blocuri „mergi 100 pași” unul sub altul, nu vezi doi pași: pisica pare că sare direct la final.</p>
${IMG('scratch-fara-asteptare.webp',940,250,'Scriptul rulat în Scratch fără blocul așteaptă: cele două blocuri mergi 100 de pași unul sub altul, iar pe scenă pisica a ajuns direct la capăt','<b>Fără</b> „așteaptă”: cei doi pași se fac într-o clipă, deci vezi doar rezultatul.')}
<p>Ca să vezi fiecare pas, pui între ele blocul de Control <mark>așteaptă 1 secunde</mark>. Pisica face o pauză de o secundă între pași.</p>`,
   exemplu:`${stiva([['steag',0],['m100',0],['w1',0],['m100',0]],'Cu pauză între pași:')}<p>Acum vezi pisica oprindu-se o secundă la jumătatea drumului.</p>`,
   incearca:{t:'choice',q:'Ai pus două blocuri „mergi 100 pași” unul sub altul. Pisica pare că sare direct la final. Ce adaugi între ele ca să vezi ambii pași?',o:['așteaptă 1 secunde','încă un bloc de eveniment','rotește-te 15 grade','un bloc de Operatori'],ok:0,ajutor:'Ai nevoie de o pauză între pași.',why:'Blocul „așteaptă” face o pauză între pași, deci vezi fiecare mișcare.'},
   inca:[
    {t:'choice',q:'În ce categorie e blocul „așteaptă 1 secunde”?',o:['Control','Mișcare','Aspect','Evenimente'],ok:0,ajutor:'Hotărăște CÂND se execută blocul următor.',why:'„așteaptă” e un bloc de Control: amână blocul următor.'}
   ]},
  {t:'Blocul lăsat singur nu se execută',
   text:`<p>Un bloc tras în zona de cod, dar lăsat <mark>deoparte</mark>, neîmbinat cu stiva, <strong>nu se execută</strong> când apeși steagul. Steagul pornește doar blocurile lipite sub „când se dă click pe ⚑”.</p>
${IMG('scratch-secventa.webp',940,250,'Scriptul rulat în Scratch, cu blocul așteaptă 1 secunde între cele două blocuri mergi 100 de pași, plus un bloc mergi 10 pași lăsat singur alături, toate încadrate','În dreapta, „mergi 10 pași” stă singur: la steag, el nu pornește.')}
<p><strong>Cum repari:</strong> tragi blocul până sub ultimul bloc din stivă, până se îmbină.</p>`,
   incearca:{t:'choice',q:'Ai tras blocul „mergi 10 pași” în zona de cod, dar l-ai lăsat deoparte, neîmbinat. Ce se întâmplă la steagul verde?',o:['Nu se execută','Se execută primul','Se execută ultimul','Se execută de două ori'],ok:0,ajutor:'Ce blocuri pornește steagul?',why:'La steag pornesc doar blocurile îmbinate sub blocul de eveniment. Un bloc singur nu face parte din script.'},
   inca:[
    {t:'tf',q:'Ca să se execute, un bloc lăsat deoparte trebuie tras sub ultimul bloc din stivă, până se îmbină.',ok:true,ajutor:'Recitește „Cum repari”.',why:'Adevărat. Odată îmbinat, face parte din script și se execută la rândul lui.'}
   ]},
  {t:'Strategia: cum construiești un script',
   text:`<p>Când ai o cerință, lucrezi mereu în <strong>patru pași</strong>:</p>
<ol><li><strong>Citește cerința</strong> și spune pașii în cuvinte: „întâi…, apoi…”.</li>
<li><strong>Pune sus evenimentul</strong> care o pornește (de obicei „când se dă click pe ⚑”).</li>
<li><strong>Adaugă blocurile</strong> unul câte unul, în ordinea pașilor.</li>
<li><strong>Apasă steagul și privește.</strong> Face pisica exact ce scrie în cerință? Dacă nu, caută <em>primul</em> pas greșit și repară doar acolo.</li></ol>`,
   incearca:{t:'order',q:'Pune în ordine pașii strategiei.',items:['Citești cerința și spui pașii în cuvinte','Pui sus evenimentul','Adaugi blocurile în ordinea pașilor','Apeși steagul și verifici'],ajutor:'Întâi înțelegi, apoi construiești, la final verifici.',why:'Înțelegi, pornești scriptul cu un eveniment, construiești în ordine și verifici pe scenă.'}
  }
 ],

    teste:[
     {ce:'Pisica face trei pași',msg:'Ai nevoie de trei blocuri „mergi 10 pași”.',ok:T=>pozitii(T).length===3},
     {ce:'Între pași e câte o pauză de o secundă',msg:'Pune „așteaptă 1 secunde” între fiecare doi pași.',ok:T=>{const p=pozitii(T);return p.length===3&&p[1].f-p[0].f>=FPS&&p[2].f-p[1].f>=FPS}},
     {ce:'La final pisica e la x: 30',msg:'Trei pași de câte 10 fac 30.',ok:T=>T.x===30}],
    solutie:[['steag',0],['m10',0],['w1',0],['m10',0],['w1',0],['m10',0]],why:'Trei pași vizibili, pentru că fiecare are pauza lui.'}]},
 qs:[
  {t:'tf',q:'Într-un script, blocurile se execută de jos în sus.',ok:false,why:'Fals. Se execută de sus în jos, începând cu blocul de eveniment. Ordinea din stivă e ordinea pașilor.'},
  {t:'order',q:'Pune blocurile în ordine: la steag, pisica spune „Pornim!” 2 secunde, apoi merge 100 de pași.',items:['când se dă click pe steagul verde','spune Pornim! pentru 2 secunde','mergi 100 pași'],why:'Blocul de eveniment stă mereu sus. Apoi pașii, în ordinea cerută: întâi vorbește, apoi merge.'},
  {t:'choice',q:'Ai pus două blocuri „mergi 100 pași” unul sub altul. Pisica pare că sare direct la final. Ce adaugi între ele ca să vezi ambii pași?',o:['așteaptă 1 secunde','încă un bloc de eveniment','rotește-te 15 grade','spune Salut!, fără durată'],ok:0,ajutor:'Recitește pasul „Prea repede?”.',why:'Blocul „așteaptă” face o pauză între pași, deci vezi fiecare mișcare. Celelalte blocuri schimbă ce face pisica, nu îți arată pașii separat.'},
  {t:'choice',q:'Ai tras blocul „mergi 10 pași” în zona de cod, dar l-ai lăsat deoparte, neîmbinat. Ce se întâmplă la steagul verde?',o:['Nu se execută','Se execută primul','Se execută ultimul','Se execută de două ori'],ok:0,why:'La steag pornesc doar blocurile îmbinate sub blocul de eveniment. Un bloc singur nu face parte din script.'},
  {t:'choice',q:'Ai construit scriptul și pisica face altceva decât cere sarcina. Ce faci, după strategie?',o:['Cauți primul pas greșit și repari doar acolo','Ștergi tot și o iei de la capăt','Apeși steagul de mai multe ori','Schimbi personajul'],ok:0,ajutor:'Pasul 4 al strategiei.',why:'Compari ce face pisica cu cerința, pas cu pas, și repari primul loc unde nu se potrivesc.'}
 ]},

/* ================= 4. Decizia cu blocuri și evenimente (lecția 33) ================= */
{t:'Decizia cu blocuri și evenimente',lectii:[33],continuturi:[ALT,BLK],
 obiectiv:'faci personajul să aleagă între două mesaje după o condiție și pornești un script cu o tastă.',
 pasi:[
  {t:'„dacă … atunci”: o ramură',
   text:`<p>Uneori un pas se face <strong>doar uneori</strong>: „<em>dacă</em> scorul e mai mare decât 10, <em>atunci</em> spune Bravo!”. Aceasta e <mark>structura alternativă</mark> (decizia).</p>
<p>În Scratch, la categoria <strong>Control</strong>, blocul <mark>dacă … atunci</mark> are o „gură”. Blocurile puse în gură se execută <strong>doar dacă</strong> condiția e adevărată. Dacă e falsă, sunt sărite.</p>
<p>În exemplu, <em>scor</em> e un număr pe care programul îl ține minte. Blocul portocaliu „setează scor la 12” îl face 12. Cum îți faci singur un scor afli în nivelul 5.</p>
${IMG('scratch-daca-atunci.webp',251,330,'Categoria Control din paleta Scratch, cu blocurile la infinit, dacă atunci și dacă atunci altfel încadrate și etichetate','Blocurile de decizie, în categoria <b>Control</b>.')}`,
   exemplu:`${stiva([['steag',0],['sc12',0],['dScor',0],['sBravo',1]])}<p>Scorul e 12, deci „scor &gt; 10” e adevărat: pisica spune „Bravo!”. Cu scorul 5, n-ar spune nimic.</p>`,
   altfel:`<p>Ca o ușă cu cartelă: <em>dacă</em> ai cartela, <em>atunci</em> intri. Dacă n-ai, ușa rămâne închisă și treci mai departe pe hol.</p>`,
   incearca:{t:'tf',q:'Blocurile din gura lui „dacă … atunci” se execută mereu, oricare ar fi condiția.',ok:false,ajutor:'Ce se întâmplă când condiția e falsă?',why:'Fals. Se execută doar când condiția e adevărată; altfel sunt sărite.'},
   inca:[
    {t:'choice',q:'Scorul e 5. Ce face scriptul din exemplu („dacă scor > 10 atunci spune Bravo!”)?',o:['Nu spune nimic','Spune „Bravo!”','Spune „Bravo!” de 5 ori','Se oprește cu eroare'],ok:0,ajutor:'5 e mai mare decât 10?',why:'5 nu e mai mare decât 10, deci condiția e falsă și blocul din gură e sărit.'}
   ]},
  {t:'Condiția: blocul în formă de hexagon',
   text:`<p><mark>Condiția</mark> are forma unui <strong>hexagon</strong> (colțuri ascuțite). Ea răspunde doar cu <strong>adevărat</strong> sau <strong>fals</strong>. O pui în locul hexagonal din „dacă”.</p>
<ul><li>de la <strong>Operatori</strong> (verde) iei comparații: <span class="hx op">scor &gt; 10</span>, <span class="hx op">scor = 10</span>;</li>
<li>de la <strong>Detectare</strong> (albastru deschis) iei întrebări despre scenă: <span class="hx det">atinge Pisica ?</span>.</li></ul>
<p>Blocurile-comandă, ca „mergi 10 pași”, au altă formă și <strong>nu</strong> intră în locul hexagonal: ele nu răspund cu adevărat sau fals.</p>`,
   incearca:{t:'classify',q:'Ce poate intra în locul hexagonal al lui „dacă”?',cats:['Condiție (hexagon)','Nu e condiție'],items:[['scor > 10',0],['atinge Pisica ?',0],['scor = 10',0],['mergi 10 pași',1],['spune Salut! pentru 2 secunde',1]],ajutor:'Poți răspunde la el cu „da” sau „nu”? Atunci e condiție.',why:'În „dacă” intră doar blocuri care răspund cu adevărat sau fals. „mergi” și „spune” sunt comenzi, nu întrebări.'},
   inca:[
    {t:'choice',q:'Din ce categorie iei comparația „scor > 10”?',o:['Operatori (verde)','Mișcare (albastru)','Aspect (mov)','Evenimente (galben)'],ok:0,ajutor:'Comparațiile și calculele sunt la…',why:'Comparațiile sunt la Operatori, blocurile verzi în formă de hexagon.'}
   ]},
  {t:'„dacă … atunci … altfel”: exact o ramură',
   text:`<p>Când ai <strong>două</strong> cazuri, folosești <mark>dacă … atunci … altfel</mark>. Are două guri:</p>
<ul><li>sus, ramura <strong>atunci</strong>: se execută când condiția e adevărată;</li>
<li>jos, ramura <strong>altfel</strong>: se execută când e falsă.</li></ul>
<p>Se execută <strong>o singură</strong> ramură, niciodată amândouă.</p>
<p><strong>Cum alegi blocul:</strong> numără cazurile din cerință. Un caz („dacă…, fă ceva”) → „dacă … atunci”. Două cazuri („dacă…, altfel…”) → „dacă … atunci … altfel”.</p>`,
   exemplu:`${IMG('scratch-decizie-rulata.webp',940,300,'Script rulat în Scratch: setează scor la 12, apoi dacă scor mai mare decât 10 atunci spune Bravo! altfel spune Mai încearcă!; pe scenă monitorul scor arată 12, iar pisica spune Bravo!','Rulat în Scratch: scorul e 12, deci s-a executat <b>doar</b> ramura „atunci”: pisica spune „Bravo!”.')}`,
   incearca:{t:'choice',q:'Vrei ca pisica să spună „Bravo!” dacă scorul e mai mare decât 10 și „Mai încearcă!” altfel. Ce bloc folosești?',o:['dacă … atunci … altfel','dacă … atunci','așteaptă 1 secunde','mergi 10 pași'],ok:0,ajutor:'Câte cazuri are cerința?',why:'Sunt două mesaje, unul pentru fiecare caz, deci ai nevoie de două ramuri. „dacă … atunci” are o singură ramură.'},
   inca:[
    {t:'tf',q:'În „dacă … atunci … altfel”, Scratch execută ambele ramuri, pe rând.',ok:false,ajutor:'Ultima propoziție din listă.',why:'Fals. Condiția alege o singură ramură: „atunci” dacă e adevărată, „altfel” dacă e falsă.'},
    {t:'choice',q:'În scriptul din captură, scorul e pus la 5 în loc de 12. Ce spune pisica?',o:['Mai încearcă!','Bravo!','Bravo! și apoi Mai încearcă!','Nimic'],ok:0,ajutor:'5 > 10 e adevărat sau fals? Care ramură urmează?',why:'Condiția e falsă, deci se execută ramura „altfel”: „Mai încearcă!”.'}
   ]},
  {t:'Alte evenimente: tastele',
   text:`<p>Un script nu pornește doar la steag. Blocurile galbene de <strong>Evenimente</strong> au și alte semnale, de exemplu <mark>când tasta săgeată dreapta este apăsată</mark>: scriptul de sub el pornește de fiecare dată când jucătorul apasă săgeata.</p>
${IMG('scratch-eveniment-tasta.webp',305,115,'Al doilea script din același proiect Scratch: când tasta săgeată dreapta este apăsată, modifică x cu 10','Alt început de script: pornește la apăsarea tastei, nu la steag.')}
<p>Un proiect poate avea <strong>mai multe scripturi</strong>, fiecare cu evenimentul lui. „modifică x cu 10” mută personajul 10 la dreapta (x crește).</p>`,
   altfel:`<p>La telecomandă, fiecare buton pornește altceva: unul schimbă canalul, altul dă volumul mai tare. Fiecare script e un buton al telecomenzii tale.</p>`,
   incearca:{t:'match',q:'Leagă fiecare eveniment de momentul în care pornește scriptul.',pairs:[['când se dă click pe steagul verde','la pornirea programului'],['când tasta săgeată dreapta este apăsată','când jucătorul apasă săgeata dreapta'],['când tasta săgeată stânga este apăsată','când jucătorul apasă săgeata stânga']],ajutor:'Citește ce scrie în fiecare bloc: „când…”.',why:'Fiecare bloc de eveniment așteaptă semnalul lui. Un joc are, de obicei, mai multe scripturi.'}
  }
 ],
 atelier:{t:'scratch',titlu:'Bravo sau Mai încearcă',
  intro:`<p><strong>Sarcina:</strong> la steag, scorul se pune la 12. Apoi pisica spune „Bravo!” dacă scorul e mai mare decât 10, altfel spune „Mai încearcă!”.</p><p>După ce atingi blocul „dacă … atunci … altfel”, blocurile următoare intră în ramura <b>atunci</b>. Butonul <b>Treci pe ramura „altfel”</b> te mută în a doua gură. Testele rulează scriptul <strong>și cu scorul 5</strong>, ca să vadă că ambele ramuri merg.</p>`,
  q:'Construiește decizia cu două ramuri.',
  start:[],paleta:['steag','sc12','dScorA','dScor','sBravo','sMai'],
  ajutor:'Steag → „setează scor la 12” → „dacă scor > 10 atunci … altfel” → în „atunci”: „spune Bravo!” → Treci pe ramura „altfel” → „spune Mai încearcă!”.',
  teste:[
   {ce:'Scriptul începe cu „când se dă click pe ⚑”',msg:'Primul bloc trebuie să fie steagul.',ok:(T,L)=>incepeCu(L,'steag')},
   {ce:'Folosește „dacă … atunci … altfel” (două cazuri)',msg:'Cerința are două cazuri: îți trebuie blocul cu altfel.',ok:(T,L)=>are(L,'dScorA')},
   {ce:'Cu scorul 12, pisica spune „Bravo!”',msg:'„spune Bravo!” trebuie pus în ramura „atunci”.',ok:T=>spus(T,'Bravo!')},
   {ce:'Cu scorul 12, pisica NU spune „Mai încearcă!”',msg:'„Mai încearcă!” trebuie să stea în ramura „altfel”, nu sub decizie.',ok:T=>!spus(T,'Mai încearcă!')},
   {ce:'Test pe date schimbate: cu scorul 5, spune „Mai încearcă!” și nu „Bravo!”',msg:'Cu scorul 5 trebuie să se execute ramura „altfel”.',o:{scor:5},ok:T=>spus(T,'Mai încearcă!')&&!spus(T,'Bravo!')}],
  solutie:[['steag',0],['sc12',0],['dScorA',0],['sBravo',1],['alt',0],['sMai',1]],
  gresit:[['steag',0],['sc12',0],['dScor',0],['sBravo',1],['sMai',0]],
  why:'Structura alternativă: condiția a ales o singură ramură, și cu scorul 12, și cu scorul 5.',
  inca:[{t:'scratch',q:'Încă una: fă ca pisica să meargă la dreapta când apeși săgeata dreapta (câte 10 la fiecare apăsare). Încearcă-l cu butonul „tasta săgeată dreapta” de sub scenă.',
   start:[],paleta:['steag','tdr','x10','m100'],
   ajutor:'Un script nou: „când tasta săgeată dreapta este apăsată” și sub el „modifică x cu 10”. Nu folosi steagul.',
   teste:[
    {ce:'Scriptul pornește la tasta săgeată dreapta',msg:'Primul bloc: „când tasta săgeată dreapta este apăsată”.',ok:(T,L)=>incepeCu(L,'tdr')},
    {ce:'Două apăsări pe săgeată: pisica ajunge la x: 20',msg:'Sub eveniment pune „modifică x cu 10”.',o:{apasa:[['dreapta',5],['dreapta',10]],cadre:20},ok:T=>T.x===20&&T.y===0},
    {ce:'Doar steagul, fără tastă: pisica stă pe loc',msg:'Mișcarea trebuie să pornească de la tastă, nu de la steag.',o:{cadre:20},ok:T=>T.x===0}],
   solutie:[['tdr',0],['x10',0]],why:'Un eveniment nou, un script nou: pisica răspunde la tastă.'}]},
 qs:[
  {t:'choice',q:'Vrei ca pisica să spună „Bravo!” dacă scorul e mai mare decât 10 și „Mai încearcă!” altfel. Ce bloc folosești?',o:['dacă … atunci … altfel','dacă … atunci','așteaptă 1 secunde','mergi 10 pași'],ok:0,why:'Sunt două mesaje, unul pentru fiecare caz, deci ai nevoie de două ramuri. „dacă … atunci” are o singură ramură.'},
  {t:'tf',q:'În „dacă … atunci … altfel”, Scratch execută ambele ramuri, pe rând.',ok:false,why:'Fals. Ca în algoritmii scriși în cuvinte, condiția alege o singură ramură: „atunci” dacă e adevărată, „altfel” dacă e falsă.'},
  {t:'classify',q:'Ce poate intra în locul hexagonal al lui „dacă”?',cats:['Condiție (hexagon)','Nu e condiție'],items:[['scor > 10',0],['atinge Pisica ?',0],['scor = 10',0],['mergi 10 pași',1],['spune Salut! pentru 2 secunde',1]],ajutor:'Răspunde cu adevărat sau fals?',why:'În „dacă” intră doar blocuri care răspund cu adevărat sau fals. „mergi” și „spune” sunt comenzi, nu întrebări.'},
  {t:'match',q:'Leagă fiecare eveniment de momentul în care pornește scriptul.',pairs:[['când se dă click pe steagul verde','la pornirea programului'],['când tasta săgeată dreapta este apăsată','când jucătorul apasă săgeata dreapta'],['când tasta săgeată stânga este apăsată','când jucătorul apasă săgeata stânga']],why:'Fiecare bloc de eveniment așteaptă un semnal. Un joc are, de obicei, mai multe scripturi, pornite de evenimente diferite.'},
  {t:'choice',q:'Scorul e 8. Scriptul are „dacă scor > 10 atunci spune Bravo! altfel spune Mai încearcă!”. Ce spune pisica?',o:['Mai încearcă!','Bravo!','Amândouă mesajele','Nimic'],ok:0,ajutor:'8 > 10: adevărat sau fals?',why:'8 nu e mai mare decât 10, deci condiția e falsă și se execută ramura „altfel”.'}
 ]},

/* ================= 5. Atingeri și scor (lecția 33) ================= */
{t:'Atingeri și scor',lectii:[33],continuturi:[BLK],
 obiectiv:'faci un personaj să numere de câte ori a fost atins, cu o variabilă și cu o decizie verificată „la infinit”.',
 pasi:[
  {t:'Atingerea: „atinge Pisica ?”',
   text:`<p>Într-un joc, personajele se <mark>ating</mark>: pisica prinde un măr, mingea lovește peretele. Asta e o <mark>coliziune</mark>.</p>
<p>O verifici cu o decizie. În <strong>codul mărului</strong> pui „dacă <span class="hx det">atinge Pisica ?</span> atunci”. Condiția e de la <strong>Detectare</strong> și răspunde cu adevărat când mărul și pisica se ating.</p>`,
   exemplu:`${stiva([['dAt',0],['sc1',1]],'În codul mărului:')}<p>Dacă mărul atinge pisica, scorul crește cu 1.</p>`,
   incearca:{t:'choice',q:'Cum verifici, în codul mărului, dacă pisica a prins mărul?',o:['Cu „dacă atinge Pisica ? atunci”','Cu „mergi 10 pași”','Cu „așteaptă 1 secunde”','Cu „spune Măr!”'],ok:0,ajutor:'Ai nevoie de o decizie cu o condiție de la Detectare.',why:'Întrebarea „atinge Pisica ?” răspunde cu adevărat sau fals, iar „dacă” face ceva doar când răspunsul e adevărat.'},
   inca:[
    {t:'choice',q:'Din ce categorie e condiția „atinge Pisica ?”?',o:['Detectare','Operatori','Mișcare','Evenimente'],ok:0,ajutor:'Recitește ultima propoziție a pasului.',why:'Întrebările despre ce se întâmplă pe scenă (atingeri) sunt la Detectare.'}
   ]},
  {t:'„la infinit”: verifici mereu',
   text:`<p>O decizie se verifică <strong>o singură dată</strong>, exact când ajunge scriptul la ea. La start, mărul e sus și nu atinge pisica, deci răspunsul e „fals” și… gata. Prinderile de mai târziu nu le mai vede nimeni.</p>
<p>De aceea pui decizia <strong>în</strong> blocul <mark>la infinit</mark> (<em>forever</em>), de la Control. El repetă tot ce e în gura lui, iar și iar, cât timp merge jocul.</p>
${IMG('scratch-atingere-infinit.webp',445,575,'Codul personajului Măr din mini-jocul Prinde mărul: blocul la infinit încadrat și, în interiorul lui, dacă atinge Pisica atunci modifică scor cu 1','Codul mărului în Scratch: decizia stă <b>în</b> „la infinit”.')}`,
   altfel:`<p>Un portar care se uită o singură dată la poartă, la începutul meciului, nu vede niciun gol. Portarul bun se uită <em>tot timpul</em>. „la infinit” e portarul bun.</p>`,
   incearca:{t:'tf',q:'Dacă decizia „dacă atinge Pisica ?” e pusă o singură dată, la start, atingerile de mai târziu nu mai sunt verificate.',ok:true,ajutor:'De câte ori se verifică o decizie care nu e în „la infinit”?',why:'Adevărat. Decizia se verifică o dată și gata. De aceea se pune în „la infinit”, care o verifică iar și iar.'},
   inca:[
    {t:'choice',q:'Unde pui decizia „dacă atinge Pisica ? atunci”, ca să fie verificată tot timpul?',o:['În gura blocului „la infinit”','Deasupra blocului de steag','Sub „la infinit”, după el','În alt personaj'],ok:0,ajutor:'„în” e cuvântul-cheie din pas.',why:'Doar blocurile din gura lui „la infinit” se repetă.'}
   ]},
  {t:'Variabila scor',
   text:`<p>Scorul se ține într-o <mark>variabilă</mark>: o cutie cu un nume, în care stă un număr. O faci în categoria <strong>Variabile</strong>, cu butonul de creare a unei variabile, și îi dai numele <em>scor</em>. Pe scenă apare un mic panou care arată valoarea ei.</p>
<ul><li>La start o pui la zero: <mark>setează scor la 0</mark> (o singură dată, sub steag).</li>
<li>La fiecare prindere, <mark>modifică scor cu 1</mark>: adună 1 la ce era.</li></ul>
${IMG('scratch-scor-0.webp',488,410,'Scena mini-jocului imediat după apăsarea steagului verde: mărul sus, pisica jos și monitorul variabilei scor arătând 0','Chiar după steagul verde: scorul e pus la <b>0</b>.')}`,
   exemplu:`${IMG('scratch-scor.webp',488,410,'Aceeași scenă după ce jocul a fost jucat: monitorul variabilei scor arată 4','După patru prinderi: 0 + 1 + 1 + 1 + 1 = <b>4</b>.')}`,
   incearca:{t:'choice',q:'Ce bloc pui sub steag, ca jocul să înceapă de la zero?',o:['setează scor la 0','modifică scor cu 1','setează scor la 12','la infinit'],ok:0,ajutor:'„setează” pune o valoare; „modifică” adună.',why:'„setează scor la 0” pune scorul la zero o dată, la start.'},
   inca:[
    {t:'tf',q:'„modifică scor cu 1” face scorul mereu egal cu 1.',ok:false,ajutor:'„modifică” adună la ce era deja.',why:'Fals. Adaugă 1 la valoarea de acum: din 3 face 4, din 4 face 5.'}
   ]},
  {t:'Mărul cade și pleacă iar de sus',
   text:`<p>Codul întreg al mărului, în <strong>ordinea</strong> lui:</p>
<ol><li>la steag, scorul se pune la 0 și mărul merge sus;</li>
<li>la infinit, mărul coboară puțin: „modifică y cu -10” (y scade, deci coboară);</li>
<li>tot în „la infinit”, dacă atinge pisica, scorul crește cu 1 <strong>și</strong> mărul se întoarce sus, cu „mergi la x: 0 y: 150”.</li></ol>
<p>De ce se întoarce sus? Mărul atinge pisica mai multe clipe la rând. Dacă ar rămâne acolo, fiecare clipă ar mai adăuga 1 la scor.</p>`,
   exemplu:stiva([['steag',0],['sc0',0],['gsus',0],['inf',0],['ym10',1],['dAt',1],['sc1',2],['gsus',2]],'Codul mărului:'),
   incearca:{t:'order',q:'Pune în ordine scriptul mărului care numără prinderile.',items:['când se dă click pe steagul verde','setează scor la 0','la infinit','dacă atinge Pisica ? atunci','modifică scor cu 1'],ajutor:'Scorul se pune la 0 o singură dată, înainte de „la infinit”.',why:'Scorul pornește de la 0 o singură dată, la start. Apoi, la infinit, verifici atingerea și abia când ea are loc adaugi 1.'},
   inca:[
    {t:'choice',q:'O singură prindere a adăugat 8 puncte. Ce lipsește din decizie?',o:['„mergi la x: 0 y: 150”, după prindere','„setează scor la 0”, la început','Un al doilea bloc cu steagul verde','„așteaptă 1 secunde”, sub steag'],ok:0,ajutor:'Cât timp stă mărul lipit de pisică, fiecare clipă adaugă 1.',why:'Fără întoarcerea sus, mărul atinge pisica mai multe clipe la rând, iar fiecare clipă adaugă 1.'}
   ]},
  {t:'Scorul nu crește? Depanare în 3 întrebări',

/* ================= 6. Final: Prinde mărul (lecția 34) ================= */
{t:'Mini-jocul Prinde mărul',final:true,lectii:[34],continuturi:[BLK,ALT],
 obiectiv:'construiești și verifici scripturile pisicii din jocul Prinde mărul, apoi faci jocul întreg în Scratch-ul adevărat.',
 pasi:[
  {t:'Planul jocului: cine ce face',
   text:`<p><strong>Misiunea finală:</strong> jocul <mark>Prinde mărul</mark>. Înainte de blocuri, faci <strong>planul</strong>: pentru fiecare personaj scrii „la ce eveniment → ce face”.</p>
<ul><li><strong>Pisica:</strong> la săgeata dreapta merge la dreapta; la săgeata stânga merge la stânga; la steag, verifică la infinit dacă scorul a ajuns la 10.</li>
<li><strong>Mărul:</strong> la steag, pune scorul la 0; la infinit cade, iar la atingere adaugă 1 și pleacă iar de sus.</li></ul>
${IMG('scratch-prinde-marul.webp',1000,625,'Mini-jocul Prinde mărul rulat în editorul Scratch: scripturile pisicii pentru tastele săgeți și pentru condiția de câștig sunt încadrate, iar pe scenă scorul arată 4','Jocul adevărat, jucat: scorul a ajuns la 4. În stânga, scripturile pisicii.')}`,
   incearca:{t:'classify',q:'Ce eveniment pornește fiecare script?',cats:['Steagul verde','Tasta săgeată dreapta'],items:[['Scorul se pune la 0',0],['Mărul pornește de sus',0],['Pisica se mută la dreapta cu 10',1],['Pisica verifică la infinit dacă scorul e 10',0]],ajutor:'Ce se pregătește la începutul jocului pornește la steag.',why:'Ce se pregătește la începutul jocului pornește la steag. Mișcarea pisicii pornește doar când jucătorul apasă tasta.'}
  },
  {t:'Pisica se mișcă cu săgețile',
   text:`<p>Pisica are nevoie de <strong>două scripturi</strong>, câte unul pentru fiecare tastă:</p>
<ul><li>„când tasta săgeată dreapta este apăsată” → „modifică x cu 10” (x crește: dreapta);</li>
<li>„când tasta săgeată stânga este apăsată” → „modifică x cu -10” (x scade: stânga).</li></ul>
<p>În captura jocului adevărat, de la pasul 1, numărul e 25: în Scratch-ul adevărat dai click pe cerculețul alb din bloc și scrii alt număr. Cu cât e mai mare, cu atât pisica e mai rapidă.</p>`,
   exemplu:`${stiva([['tdr',0],['x10',0],['tst',0],['xm10',0]],'Două scripturi, două evenimente:')}`,
   incearca:{t:'choice',q:'Ce pui sub „când tasta săgeată stânga este apăsată”?',o:['modifică x cu -10','modifică x cu 10','modifică y cu -10','mergi la x: 0 y: 0'],ok:0,ajutor:'Spre stânga, x crește sau scade?',why:'Spre stânga x scade, deci adaugi un număr negativ: -10.'},
   inca:[
    {t:'tf',q:'Pentru săgeata dreapta și săgeata stânga îți trebuie două scripturi, fiecare cu evenimentul lui.',ok:true,ajutor:'Fiecare tastă e alt semnal.',why:'Adevărat. Fiecare bloc de eveniment așteaptă o singură tastă.'}
   ]},
  {t:'Condiția de câștig',
   text:`<p>Când scorul ajunge la 10, pisica spune „Am câștigat!”. Scorul crește <strong>în timpul</strong> jocului, deci condiția trebuie verificată mereu: o pui în „la infinit”, sub steag.</p>
<p>Condiția corectă e <span class="hx op">scor = 10</span> („egal cu 10”). Nu „scor &lt; 10” (semnul &lt; înseamnă „mai mic decât”): aceea ar fi adevărată tot timpul <em>până</em> la 10.</p>`,
   exemplu:stiva([['steag',0],['inf',0],['d10',1],['sCastig',2]],'Scriptul de câștig al pisicii:'),
   incearca:{t:'choice',q:'Ce condiție pui ca pisica să spună „Am câștigat!”?',o:['scor = 10','scor < 10','atinge marginea ?','scor = 0'],ok:0,ajutor:'Când se câștigă? Exact când scorul ajunge la…',why:'Jocul se câștigă exact când scorul ajunge la 10. „scor < 10” ar fi adevărat tot timpul până atunci.'},
   inca:[
    {t:'tf',q:'Dacă pui „dacă scor = 10” direct sub steag, fără „la infinit”, pisica spune „Am câștigat!” când scorul ajunge la 10.',ok:false,ajutor:'De câte ori se verifică o decizie în afara lui „la infinit”?',why:'Fals. Decizia s-ar verifica o singură dată, la start, când scorul e 0.'}
   ]},
  {t:'Testezi ca un programator, apoi salvezi',
   text:`<p>Un joc e gata abia după ce l-ai <strong>testat</strong>. Plan de test, în ordine:</p>
<ol><li>Apeși steagul: scorul arată 0?</li>
<li>Apeși săgețile: pisica merge în <em>ambele</em> părți?</li>
<li>Prinzi mărul: scorul crește cu 1, o singură dată?</li>
<li>La 10: apare „Am câștigat!”?</li></ol>
<p>Apoi salvezi: meniul <strong>Fișier</strong> (<em>File</em>), comanda de salvare pe calculator (<em>Save to your computer</em>). Proiectul se salvează ca fișier <mark>.sb3</mark>.</p>`,
   incearca:{t:'choice',q:'Ce extensie are un proiect Scratch salvat pe calculator?',o:['.sb3','.docx','.html','.mp3'],ok:0,ajutor:'Ultimul rând al pasului.',why:'Proiectele Scratch 3 se salvează ca fișiere .sb3.'},
   inca:[
    {t:'order',q:'Pune în ordine planul de test.',items:['Apeși steagul: scorul e 0?','Apeși săgețile: pisica merge în ambele părți?','Prinzi mărul: scorul crește cu 1?','La 10: apare „Am câștigat!”?'],ajutor:'Urmezi jocul de la pornire până la câștig.',why:'Testezi în ordinea în care se joacă: pornire, mișcare, prindere, câștig.'}
   ]}
 ],
 atelier:{t:'scratch',titlu:'Scripturile pisicii',
  intro:`<p>Mărul are deja codul lui: în simulator, după steag, scorul crește singur cu 1 în fiecare secundă, ca și cum pisica l-ar prinde. Tu scrii <strong>codul pisicii</strong>.</p><p><strong>Sarcina:</strong> (1) săgeata dreapta mută pisica 10 la dreapta; (2) săgeata stânga, 10 la stânga; (3) la steag, la infinit, dacă scorul e 10, pisica spune „Am câștigat!”. Încearcă cu steagul și cu butoanele de săgeți, apoi <b>Rulează testele</b>.</p>`,

/* ================= 4. Editez (lecția 5) ================= */
{t:'Editez: inserez, copiez, mut, șterg',lectii:[5],continuturi:[P.editare],
 obiectiv:'adaugi, dublezi, ascunzi, muți, copiezi și ștergi diapozitive și obiecte, iar o greșeală o anulezi imediat.',
 pasi:[
  {t:'Meniul miniaturii',
   text:`<p>A <mark>edita</mark> înseamnă a schimba <strong>ce</strong> conține prezentarea: adaugi, copiezi, muți, ștergi.</p>
<p>Pentru diapozitive, cel mai scurt drum e <strong>clic dreapta pe miniatură</strong>, în panoul din stânga. Apare un meniu:</p>
<ul><li><i>New Slide</i>: diapozitiv nou, după acesta (sau <kbd>Ctrl</kbd>+<kbd>M</kbd>);</li><li><i>Duplicate Slide</i>: o copie identică (<mark>dublare</mark>);</li><li><i>Delete Slide</i>: ștergere;</li><li><i>Hide Slide</i>: <mark>ascundere</mark>, rămâne în fișier, dar nu apare când prezinți.</li></ul>
${fig('meniu-miniatura','Meniul de clic dreapta pe o miniatură în PowerPoint, cu New Slide, Duplicate Slide, Delete Slide și Hide Slide încadrate','Clic dreapta pe miniatură: <i>New Slide</i>, <i>Duplicate Slide</i>, <i>Delete Slide</i>, <i>Hide Slide</i>.')}`,
   exemplu:`<p>Ai un diapozitiv „Piesele” reușit și vrei încă unul la fel, pentru alte piese. Clic dreapta pe miniatura lui → <i>Duplicate Slide</i>. Copia apare imediat după el; îi schimbi doar textul.</p>`,
   altfel:`<p>Un diapozitiv ascuns e ca o carte întoarsă cu fața în jos într-un teanc: e tot acolo, dar nu se vede. O întorci la loc cu aceeași comandă, <i>Hide Slide</i>.</p>`,
   incearca:{t:'tf',q:'Duplicate Slide face o copie identică a diapozitivului.',ok:true,ajutor:'„Duplicate” = a dubla.',why:'Adevărat. Copia apare imediat după original, cu tot ce are el.'},
   inca:[
    {t:'match',q:'Leagă comanda din meniul miniaturii de ce face.',pairs:[['New Slide','diapozitiv nou'],['Duplicate Slide','o copie identică'],['Delete Slide','șterge diapozitivul'],['Hide Slide','nu apare când prezinți']],ajutor:'Lista din pas.',why:'Toate patru sunt în meniul de clic dreapta al miniaturii.'}
   ]},
  {t:'Copiez, lipesc, șterg, anulez',
   text:`<p>Un diapozitiv sau un obiect <strong>selectat</strong> se poate:</p>
<ul><li><mark>copia</mark> cu <kbd>Ctrl</kbd>+<kbd>C</kbd> și <strong>lipi</strong> cu <kbd>Ctrl</kbd>+<kbd>V</kbd>, chiar și pe alt diapozitiv;</li><li><strong>șterge</strong> cu tasta <kbd>Delete</kbd>.</li></ul>
<p>Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> <strong>anulează</strong> ultima acțiune. Apăsat de mai multe ori, anulează pe rând și acțiunile dinainte.</p>
<p>Regula: întâi <strong>selectezi</strong> (un clic pe obiect sau pe miniatură), abia apoi dai comanda.</p>`,
   exemplu:`<p>Vrei sigla clubului de șah pe diapozitivul următor:</p><ol><li>clic pe siglă (o selectezi);</li><li><kbd>Ctrl</kbd>+<kbd>C</kbd>;</li><li>clic pe miniatura diapozitivului următor;</li><li><kbd>Ctrl</kbd>+<kbd>V</kbd>.</li></ol><p>Ai lipit-o de două ori din greșeală? <kbd>Ctrl</kbd>+<kbd>Z</kbd>.</p>`,
   altfel:`<p><kbd>Ctrl</kbd>+<kbd>Z</kbd> e ca butonul „înapoi în timp” dintr-un joc: te întoarce la o clipă înainte de greșeală.</p>`,
   incearca:{t:'match',q:'Leagă ce vrei să faci de tasta sau scurtătura potrivită.',pairs:[['Anulezi ultima greșeală','Ctrl + Z'],['Ștergi obiectul selectat','Delete'],['Adaugi un diapozitiv nou','Ctrl + M'],['Copiezi un obiect selectat','Ctrl + C']],ajutor:'Ctrl + M e în pasul 1, celelalte în pasul 2.',why:'Scurtăturile te scapă de căutat prin meniuri. Ctrl + Z e cea mai utilă, fiindcă repară aproape orice greșeală.'},
   inca:[
    {t:'choice',q:'Ai șters din greșeală un diapozitiv. Ce apeși imediat?',o:['Ctrl + Z','Ctrl + C','Delete','Ctrl + M'],ok:0,ajutor:'Care scurtătură „anulează”?',why:'Ctrl + Z anulează ultima acțiune, deci diapozitivul șters revine.'}
   ]},
  {t:'Mut un diapozitiv: tragi miniatura',
   text:`<p>Ordinea diapozitivelor se schimbă în <strong>panoul cu miniaturi</strong>. Nu copiezi și nu ștergi nimic: doar <strong>tragi</strong> miniatura în locul nou.</p>
<p><b>Pașii:</b></p><ol><li>găsești miniatura în panoul din stânga;</li><li>ții apăsat pe ea (butonul stâng al mouse-ului);</li><li>o tragi în sus sau în jos, până ajunge între diapozitivele unde o vrei;</li><li>îi dai drumul și verifici ordinea.</li></ol>`,
   exemplu:`<p>Concluzia a ajuns din greșeală pe locul 2. Tragi miniatura ei în jos, după ultimul diapozitiv de conținut, înainte de surse. Numerele din stânga miniaturilor se schimbă singure.</p>`,
   incearca:{t:'order',q:'Diapozitivul 7 trebuie să devină al doilea. Pune pașii în ordine.',items:['Găsești miniatura diapozitivului 7 în panoul din stânga','Ții apăsat pe ea','O tragi în sus, între diapozitivele 1 și 2','Îi dai drumul și verifici ordinea'],ajutor:'Pașii numerotați din pas.',why:'Ordinea se schimbă din panoul cu miniaturi: prinzi miniatura, o tragi, îi dai drumul, apoi verifici că prezentarea are sens.'},
   inca:[
    {t:'choice',q:'Unde schimbi ordinea diapozitivelor?',o:['În panoul cu miniaturi, din stânga','În zona de note','În bara de stare','Pe fila Proiectare (Design)'],ok:0,ajutor:'Prima propoziție a pasului.',why:'În panoul cu miniaturi vezi toate diapozitivele și le poți trage în altă ordine.'}
   ]},
  {t:'Mânerele: mărești fără să deformezi',
   text:`<p>Un obiect selectat are <mark>mânere</mark>: cerculețe albe pe margine.</p>
<ul><li>tragi de un mâner din <strong>colț</strong>: obiectul se mărește și își păstrează forma;</li><li>tragi de mânerul de la <strong>mijlocul unei laturi</strong>: se lățește sau se lungește doar într-o parte, deci o poză se <strong>turtește</strong>;</li><li>săgeata rotundă de sus îl rotește.</li></ul>
${fig('obiect-manere','O formă albastră selectată în PowerPoint, cu mânerele albe din colțuri și de pe laturi; un mâner de colț și unul de latură sunt încadrate','Forma selectată are mânere albe: în <b>colțuri</b> și la <b>mijlocul laturilor</b>. Săgeata rotundă de sus o rotește.')}`,
   exemplu:`<p>Poza cu tabla de șah e prea mică. Clic pe ea, apoi tragi în afară de mânerul din colțul din dreapta-jos. Tabla se mărește și rămâne pătrată.</p>`,
   incearca:{t:'choice',q:`Mărești o poză trăgând de mânerul din mijlocul laturii din dreapta. Ce se întâmplă?${fig('obiect-manere','PowerPoint: o formă selectată, cu mânerele albe din colțuri și de pe mijlocul laturilor','Un obiect selectat: <b>mânerele</b> din colțuri și cele de pe mijlocul laturilor.')}`,o:['Poza se turtește (se deformează)','Poza se mărește perfect','Poza se șterge','Poza se mută pe alt diapozitiv'],ok:0,ajutor:'Mijlocul laturii schimbă o singură dimensiune.',why:'Mânerul din mijlocul laturii schimbă doar lățimea. Mânerul din colț schimbă lățimea și înălțimea deodată, deci poza își păstrează forma.'},
   inca:[
    {t:'choice',q:'Ce face săgeata rotundă de deasupra unui obiect selectat?',o:['Îl rotește','Îl șterge','Îl copiază','Îl mută pe alt diapozitiv'],ok:0,ajutor:'Ultimul punct al listei.',why:'Săgeata rotundă rotește obiectul. Ștergerea e cu Delete, iar copierea cu Ctrl + C.'}
   ]},
  {t:'Straturile: ce stă deasupra',
   text:`<p>Obiectele de pe diapozitiv stau în <mark>straturi</mark>, unul peste altul. Cel pus ultimul stă deasupra și îl poate acoperi pe cel de dedesubt.</p>
<p>Schimbi stratul din <strong>clic dreapta pe obiect</strong>:</p>
<ul><li><i>Bring to Front</i>: aduce obiectul <strong>în față</strong>, deasupra tuturor;</li><li><i>Send to Back</i>: trimite obiectul <strong>în spate</strong>, sub toate.</li></ul>`,
   exemplu:`<p>Ai pus o poză mare, iar titlul a dispărut sub ea. Clic dreapta pe poză → <i>Send to Back</i>. Poza trece în stratul din spate, iar titlul apare iar deasupra.</p>`,
   altfel:`<p>Straturile sunt ca foile puse una peste alta pe bancă: vezi doar ce e deasupra. <i>Send to Back</i> pune foaia dedesubtul teancului.</p>`,
   incearca:{t:'choice',q:'O săgeată a ajuns sub o poză și nu se mai vede. Vrei s-o aduci deasupra. Ce alegi din meniul de clic dreapta al săgeții?',o:['Bring to Front','Send to Back','Delete Slide','Duplicate Slide'],ok:0,ajutor:'„Front” = față.',why:'Bring to Front aduce săgeata în stratul de deasupra, peste poză. Send to Back ar trimite-o și mai jos.'},
   inca:[
    {t:'tf',q:'Send to Back trimite obiectul selectat sub celelalte obiecte.',ok:true,ajutor:'„Back” = spate.',why:'Adevărat. Obiectul trece în stratul din spate, iar celelalte se văd deasupra lui.'}
   ]}
 ],
 atelier:{t:'ppt',titlu:'Editează din panoul cu miniaturi',
  intro:DZ_INTRO+'<p><strong>Sarcina:</strong> dublează diapozitivul 2, apoi ascunde diapozitivul cu sursele (ultimul), ca să nu apară acum la expunere. <b>În simulator, o atingere pe miniatură deschide meniul de clic dreapta</b>; în PowerPoint faci clic dreapta pe ea.</p>',
  q:'Dublează diapozitivul 2 și ascunde ultimul diapozitiv.',
  sarcini:[{ce:'Deschide meniul miniaturii 2',t:'mini-2'},{ce:'Alege <i>Duplicate Slide</i>',t:'ctx-dup'},{ce:'Deschide meniul ultimei miniaturi (acum e a 5-a: „Surse”)',t:'mini-5'},{ce:'Alege <i>Hide Slide</i>',t:'ctx-hide'}],
  why:'Copia a apărut pe locul 3, iar miniatura ascunsă s-a estompat și are numărul tăiat, ca în PowerPoint.',
  inca:[
   {t:'ppt',q:'Încă una: pe diapozitivul 2, poza acoperă titlul. Trimite poza în spate.',start:{cur:1,pozaPeste:true},
    sarcini:[{ce:'Selectează poza (o atingere pe ea)',t:'obj-poza'},{ce:'Deschide meniul de clic dreapta al pozei (în simulator: atinge-o încă o dată)',t:'meniu-obj',drum:['obj-poza']},{ce:'Alege <i>Send to Back</i>',t:'ctx-back'}],
    why:'Poza a trecut în stratul din spate, iar titlul se vede din nou deasupra ei.'},
   {t:'ppt',q:'Și încă una: adaugă un diapozitiv nou după diapozitivul 3, apoi șterge-l.',
    sarcini:[{ce:'Deschide meniul miniaturii 3',t:'mini-3'},{ce:'Alege <i>New Slide</i>',t:'ctx-new'},{ce:'Deschide meniul miniaturii noi (a 4-a)',t:'mini-4'},{ce:'Alege <i>Delete Slide</i>',t:'ctx-del'}],
    why:'Inserare și ștergere din același meniu: prezentarea are din nou 4 diapozitive.'}]},
 qs:[
  {t:'choice',q:'Vrei să mărești poza fără s-o deformezi. De unde tragi?',o:['De un mâner din colț','De mânerul de la mijlocul unei laturi','De săgeata rotundă de sus','De mijlocul pozei'],ok:0,ajutor:'Care mâner schimbă lățimea și înălțimea deodată?',why:'Mânerul din colț schimbă ambele dimensiuni deodată, deci poza își păstrează forma.'},
  {t:'order',q:'Vrei sigla pe diapozitivul 3. Pune pașii în ordine.',items:['Clic pe siglă, ca s-o selectezi','Apeși Ctrl + C','Clic pe miniatura diapozitivului 3','Apeși Ctrl + V'],ajutor:'Exemplul din pasul 2.',why:'Întâi selectezi și copiezi, apoi alegi unde lipești.'},
  {t:'match',q:'Leagă scurtătura de ce face.',pairs:[['Ctrl + Z','anulează ultima acțiune'],['Ctrl + V','lipește'],['Ctrl + M','diapozitiv nou'],['Delete','șterge ce e selectat']],why:'Sunt scurtăturile de editare din pașii 1 și 2.'},
  {t:'tf',q:'Un diapozitiv ascuns dispare din fișier.',ok:false,why:'Fals. Diapozitivul ascuns rămâne în fișier și îl poți face din nou vizibil. Doar nu apare când prezinți.'},
  {t:'choice',q:'Titlul nu se mai vede, pentru că ai pus peste el o imagine mare. Ce faci?',o:['Trimiți imaginea în spate, sub text','Scrii titlul din nou','Ștergi diapozitivul','Mărești și mai mult imaginea'],ok:0,ajutor:'Straturile, din pasul 5.',why:'Obiectele stau în straturi. Dacă imaginea trece în stratul din spate (Send to Back), titlul revine deasupra ei.'},
  {t:'choice',q:'Care e primul lucru înainte să apeși Ctrl + C?',o:['Selectezi obiectul','Apeși Ctrl + V','Salvezi prezentarea','Deschizi fila Inserare (Insert)'],ok:0,why:'Regula din pasul 2: întâi selectezi, apoi dai comanda. Fără selecție, aplicația nu știe ce să copieze.'}
 ]},

/* ================= 5. Formatez (lecția 6) ================= */
{t:'Formatez ca să se citească',lectii:[6],continuturi:[P.formatare],
 obiectiv:'formatezi textul, formele și fundalul, astfel încât diapozitivul să se citească din ultima bancă.',
 pasi:[
  {t:'Formatarea: cum arată, nu ce scrie',
   text:`<p><mark>Formatarea</mark> schimbă <strong>cum arată</strong> ceva, nu ce scrie. Scopul: diapozitivul să se citească ușor din <strong>ultima bancă</strong>.</p>
<p>Formatezi trei feluri de lucruri:</p><ul><li><strong>textul</strong>: fontul, mărimea, culoarea, aldinul;</li><li><strong>obiectele</strong>, de exemplu o formă: culoarea din interior și marginea;</li><li><strong>diapozitivul</strong>: fundalul.</li></ul>
<p>Regula de la editare rămâne: întâi <strong>selectezi</strong>, apoi formatezi.</p>`,
   exemplu:`<p>Același rând, formatat în două feluri. Cuvintele sunt aceleași; s-a schimbat doar formatarea:</p>${mini('Tabla și piesele',['Tabla are 64 de pătrățele'],'color:#9E9E9E;font-size:.8rem')}${mini('Tabla și piesele',['Tabla are 64 de pătrățele'],'color:#111')}`,
   incearca:{t:'choice',q:'Ce schimbă formatarea?',o:['Cum arată textul','Ce scrie în text','Numărul de diapozitive','Numele fișierului'],ok:0,ajutor:'Prima propoziție a pasului.',why:'Formatarea schimbă aspectul (mărime, culoare, fundal), nu conținutul.'},
   inca:[
    {t:'tf',q:'Dacă schimbi culoarea unui titlu, se schimbă și ce scrie în el.',ok:false,ajutor:'Culoarea e formatare.',why:'Fals. Culoarea ține de cum arată titlul; cuvintele rămân aceleași.'}
   ]},
  {t:'Mărimea și culoarea textului',
   text:`<p>Pe fila <strong>Pornire</strong> (Home), în grupul <i>Font</i>:</p>
<ul><li>caseta <strong>Dimensiune font</strong> (Font Size): scrii un număr sau alegi din listă;</li><li>butonul pentru <strong>culoarea fontului</strong> (Font Color): litera A cu bara colorată;</li><li>butonul <strong>B</strong>, <mark>aldin</mark> (Bold): litere groase.</li></ul>
<p>Mărimi bune: <strong>titlul în jur de 32–40</strong>, <strong>textul în jur de 24–28</strong>; sub 20 se citește greu din sală. Titlul e mereu mai mare decât textul. Aldinul îl pui doar pe <strong>cuvântul-cheie</strong>.</p>
${fig('marime-culoare-text','Două decupaje din fila Home a PowerPoint: caseta cu mărimea fontului, în care scrie 40, încadrată cu roșu, și butonul A cu bară colorată dedesubt, tot încadrat','Pornire (Home): caseta <b>Dimensiune font</b> (Font Size) — aici scrie 40 — și butonul <b>Font Color</b>, litera A cu bara colorată sub ea.')}`,
   exemplu:`<p><b>Strategia, în 4 pași:</b></p><ol><li>Selectezi titlul (clic pe el).</li><li>Pornire (Home) → Font Size: <b>40</b>.</li><li>Selectezi rândurile de dedesubt → Font Size: <b>26</b>.</li><li>Te uiți de la câțiva pași de ecran: se citește?</li></ol>`,
   incearca:{t:'tf',q:'Dacă pui tot textul pe aldin, se vede mai bine ce e important.',ok:false,ajutor:'Unde pui aldinul, după pas?',why:'Fals. Aldinul atrage privirea doar când e folosit puțin. Pus peste tot, nu mai scoate nimic în evidență.'},
   inca:[
    {t:'choice',q:'Ce mărime alegi pentru rândurile de sub titlu?',o:['26','12','16','60'],ok:0,ajutor:'Textul: în jur de 24–28.',why:'26 se citește din ultima bancă și rămâne mai mic decât titlul. 12 și 16 sunt prea mici, 60 e mai mare decât un titlu.'}
   ]},
  {t:'Contrastul',
   text:`<p><mark>Contrastul</mark> e diferența de luminozitate dintre text și fundal. Cu cât e mai mare, cu atât literele se văd mai clar, chiar și pe un proiector slab.</p>
<p>Regula simplă: <strong>text închis pe fundal deschis</strong> (negru pe alb) sau <strong>text deschis pe fundal închis</strong> (alb pe bleumarin). Nu merg culorile la fel de luminoase: galben pe alb, gri pe gri, roșu pe portocaliu.</p>
${fig('contrast-inainte-dupa','Același diapozitiv Sistemul solar de două ori: sus cu titlu galben pe alb și text gri mic, abia vizibil, jos cu text alb pe fundal bleumarin și litere mari','Același diapozitiv, înainte și după. Sus: galben pe alb și gri pe alb, cu litere mici — abia se citește. Jos: alb pe bleumarin, titlu 40 și text 26.')}`,
   exemplu:`<p>Testul ochilor mijiți: te uiți la diapozitiv cu ochii mijiți. Dacă literele se „topesc” în fundal, contrastul e prea mic; schimbi culoarea textului sau a fundalului.</p>`,
   incearca:{t:'choice',q:'Ce pereche de culori se citește cel mai bine?',o:['Text negru pe fundal alb','Text galben pe fundal alb','Text gri pe fundal gri','Text roșu pe fundal portocaliu'],ok:0,ajutor:'Închis pe deschis sau deschis pe închis.',why:'Când textul și fundalul sunt foarte diferite ca luminozitate, literele se văd clar, chiar și pe un proiector slab.'},
   inca:[
    {t:'classify',q:'Se citește bine sau greu?',cats:['Bine','Greu'],items:[['alb pe bleumarin',0],['galben pe alb',1],['negru pe alb',0],['gri pe gri',1]],ajutor:'Sunt cele două culori foarte diferite ca luminozitate?',why:'Negru pe alb și alb pe bleumarin au contrast mare. Galben pe alb și gri pe gri sunt la fel de luminoase, deci se „topesc”.'}
   ]},
  {t:'Umplerea și conturul unei forme',
   text:`<p>O formă (dreptunghi, săgeată, stea) are două lucruri de formatat:</p>
<ul><li><mark>umplerea</mark>, culoarea din interior: <strong>Umplere formă</strong> (Shape Fill);</li><li><mark>conturul</mark>, linia de margine, cu culoare și grosime: <strong>Contur formă</strong> (Shape Outline).</li></ul>
<p>Le găsești pe Pornire (Home), grupul <strong>Desen</strong> (Drawing). Butoanele merg doar când e <strong>selectată o formă</strong>. <i>No Fill</i> înseamnă fără umplere: se vede ce e în spate.</p>
${fig('umplere-contur-butoane','Grupul Drawing din fila Home a PowerPoint, cu butoanele Shape Fill și Shape Outline încadrate','Pornire (Home), grupul <b>Desen</b> (Drawing): <b>Shape Fill</b> și <b>Shape Outline</b>.')}
${fig('umplere-contur','Lista Shape Fill deschisă în PowerPoint, cu culorile temei, culorile standard și No Fill, deasupra unei forme albastre selectate','<b>Shape Fill</b> deschis: alegi culoarea interiorului formei selectate.')}`,
   exemplu:`<ol><li>Clic pe săgeată (o selectezi).</li><li>Pornire (Home) → <i>Shape Fill</i> → roșu.</li><li><i>Shape Outline</i> → negru.</li></ol><p>Săgeata e acum roșie, cu margine neagră.</p>`,
   incearca:{t:'choice',q:'Vrei ca săgeata să fie verde pe dinăuntru. Ce buton folosești?',o:['Shape Fill (Umplere formă)','Shape Outline (Contur formă)','Font Color','Layout'],ok:0,ajutor:'Umplerea = culoarea din interior.',why:'Shape Fill colorează interiorul formei. Shape Outline colorează doar marginea.'},
   inca:[
    {t:'tf',q:'Shape Fill și Shape Outline merg și când nu e selectată nicio formă.',ok:false,ajutor:'Pasul spune când merg butoanele.',why:'Fals. Butoanele sunt gri până selectezi o formă: aplicația trebuie să știe pe ce formă lucrezi.'}
   ]},
  {t:'Fundalul și tema',
   text:`<p><strong>Fundalul</strong> ține de diapozitiv, nu de o formă. Drumul: fila <strong>Proiectare</strong> (Design) → <strong>Stiluri de fundal</strong> (Background Styles) → <strong>Formatare fundal</strong> (Format Background). În panoul care se deschide alegi <strong>Umplere solidă</strong> (Solid fill), apoi culoarea. Poți pune și o imagine ștearsă, care nu „înghite” textul.</p>
<p>O <mark>temă</mark> (tot pe Proiectare) pune dintr-odată aceleași culori, fonturi și fundaluri pe <strong>toate</strong> diapozitivele.</p>
${fig('fundal-proiectare','Patru decupaje din PowerPoint, unul sub altul: fila Design încadrată, butonul Background Styles încadrat, comanda Format Background din lista lui și panoul Format Background cu Solid fill și Color încadrate','Drumul spre fundal: <b>Design</b> → <b>Background Styles</b> → <b>Format Background</b> → <b>Solid fill</b> → <b>Color</b>.')}`,
   exemplu:`<p>Ai 12 diapozitive. Varianta lentă: schimbi fundalul la fiecare, de 12 ori, și sigur uiți unul. Varianta rapidă: un clic pe o temă, pe Proiectare (Design), și toate arată la fel.</p>`,
   incearca:{t:'tf',q:'O temă schimbă culorile și fonturile pe toate diapozitivele deodată.',ok:true,ajutor:'Ultimul paragraf al pasului.',why:'Adevărat. De aceea tema e cel mai rapid drum spre o prezentare unitară.'},
   inca:[
    {t:'order',q:'Pui un fundal colorat pe un diapozitiv. Pune pașii în ordine.',items:['Fila Proiectare (Design)','Background Styles (Stiluri de fundal)','Format Background (Formatare fundal)','Solid fill (Umplere solidă)','Alegi culoarea'],ajutor:'Urmează legenda capturii, de sus în jos.',why:'Drumul coboară de la filă la buton, apoi la panou, unde alegi felul umplerii și culoarea.'}
   ]}
 ],
 atelier:{t:'diapozitiv',titlu:'Repară diapozitivul lui Mihai',
  intro:'<p>Mai jos e diapozitivul lui Mihai: galben pe alb, cu litere mici. Alegi culorile și mărimile, ca din fila Pornire (Home), și vezi rezultatul pe loc. Jocul <strong>calculează</strong> contrastul dintre culorile alese și verifică mărimile după regulile din pași. Orice variantă care respectă regulile e bună.</p>',
  q:'Repară diapozitivul: culori cu contrast puternic și mărimi potrivite pentru titlu și text, apoi verifică.',
  dz:'Sistemul solar',randuri:['Soarele este o stea','Opt planete','Pământul e a treia planetă'],
  start:{tx:2,bg:0,mt:0,ms:0},verifica:['contrast','marime'],
  why:'Jocul a calculat contrastul dintre culorile alese de tine și a verificat mărimile: titlul cel mai mare, textul destul de mare cât să se citească din sală.',
  inca:[
   {t:'ppt',q:'Încă una, în PowerPoint simulat: fă săgeata de pe diapozitivul 3 roșie.',start:{cur:2},
    sarcini:[{ce:'Selectează săgeata de pe diapozitiv',t:'obj-forma'},{ce:'Deschide <i>Shape Fill</i> (pe Pornire / Home)',t:'shape-fill'},{ce:'Alege roșu',t:'sf-rosu'}],
    why:'Shape Fill a colorat interiorul formei selectate. Fără selecție, butonul ar fi rămas gri.'},
   {t:'ppt',q:'Și încă una: pune fundal bleumarin pe diapozitivul 2.',start:{cur:1},
    sarcini:[{ce:'Deschide fila <b>Design</b> (Proiectare)',t:'tab-design'},{ce:'Apasă <i>Background Styles</i>',t:'bg-styles'},{ce:'Alege <i>Format Background...</i>',t:'format-bg'},{ce:'Bifează <i>Solid fill</i>',t:'solid-fill'},{ce:'La <i>Color</i> alege bleumarin',t:'bgc-bleumarin'}],
    why:'Fundalul ține de diapozitiv. Pe fundal închis, textul a devenit alb, ca să rămână contrastul mare.'}]},
 qs:[
  {t:'choice',q:'Diapozitivul are fundal bleumarin. Ce culoare alegi pentru text?',o:['Alb','Bleumarin','Albastru închis','Negru'],ok:0,ajutor:'Fundal închis → text …',why:'Pe fundal închis merge text deschis. Bleumarin, albastru închis și negru se topesc în fundal.'},
  {t:'tf',q:'Titlul trebuie să fie mai mare decât textul de dedesubt.',ok:true,why:'Adevărat. Titlul e cel mai mare, ca să se vadă dintr-o privire despre ce e vorba.'},
  {t:'classify',q:'Ce formatezi în fiecare caz: textul, un obiect sau diapozitivul?',cats:['Textul','Un obiect','Diapozitivul'],items:[['Mărești literele titlului',0],['Pui aldin pe un cuvânt-cheie',0],['Schimbi culoarea din interiorul unei săgeți',1],['Îngroși linia de margine a unui dreptunghi',1],['Schimbi fundalul în albastru deschis',2]],ajutor:'Lista din pasul 1.',why:'Fontul, mărimea și aldinul țin de text. Umplerea și conturul țin de o formă, adică de un obiect. Fundalul ține de diapozitivul întreg.'},
  {t:'choice',q:'Ai 12 diapozitive și vrei aceleași culori și fonturi pe toate. Care e calea cea mai rapidă?',o:['Aplici o temă','Schimbi fiecare diapozitiv, pe rând','Faci o prezentare nouă','Pui tot textul pe aldin'],ok:0,why:'Tema se aplică o singură dată pentru toată prezentarea. Așa nu uiți niciun diapozitiv, iar aspectul rămâne unitar.'},
  {t:'choice',q:'Butonul Shape Fill e gri și nu merge. De ce?',o:['Nu ai selectat nicio formă','Prezentarea nu e salvată','Fundalul e prea închis','Ai ales o temă'],ok:0,ajutor:'Pasul 4 spune când merg butoanele.',why:'Shape Fill lucrează pe forma selectată. Fără selecție, aplicația nu știe ce să coloreze.'},
  {t:'choice',q:'Care mărime e prea mică pentru textul unui diapozitiv?',o:['14','26','28','24'],ok:0,why:'Sub 20 se citește greu din sală. 24–28 e mărimea potrivită pentru text.'}
 ]},

/* ================= 6. Animații și tranziții (lecția 7) ================= */
{t:'Animații și tranziții',lectii:[7],continuturi:[P.animatie,P.tranzitie],
 obiectiv:'deosebești tranziția de animație, pui o animație pe un obiect și o tranziție pe un diapozitiv, doar acolo unde ajută.',
 pasi:[
  {t:'Tranziție sau animație?',
   text:`<p>Două efecte care se confundă des:</p>
<ul><li><mark>tranziția</mark> = felul în care se trece de la un diapozitiv la <strong>altul</strong> (se estompează, alunecă). Fila <strong>Tranziții</strong> (Transitions).</li><li><mark>animația</mark> = mișcarea unui <strong>obiect</strong> pe același diapozitiv (un rând apare, o săgeată se mișcă). Fila <strong>Animații</strong> (Animations).</li></ul>
<p>Întrebarea care te ajută: se schimbă <strong>diapozitivul întreg</strong> sau doar <strong>un obiect</strong> de pe el?</p>
${fig('fila-tranzitii','Două decupaje din panglica PowerPoint, unul sub altul: rândul de file cu Transitions încadrată între Design și Animations, iar dedesubt trei efecte din galerie, None, Morph și Fade','Sus: fila <b>Transitions</b> încadrată, între Design și Animations. Jos, trei efecte din galeria ei: <i>None</i> = niciunul, <i>Morph</i>, <i>Fade</i> = estompare.')}`,
   altfel:`<p>La teatru, tranziția e schimbarea decorului între acte. Animația e un actor care intră sau iese din scenă, în timp ce decorul rămâne același.</p>`,
   incearca:{t:'choice',q:'Punctele unei liste apar unul câte unul, pe același diapozitiv. Ce efect e acesta?',o:['Animație','Tranziție','Temă','Aspect'],ok:0,ajutor:'Se schimbă diapozitivul întreg sau doar un obiect?',why:'Se mișcă obiecte de pe același diapozitiv, deci e animație. O tranziție ar schimba diapozitivul întreg.'},
   inca:[
    {t:'tf',q:'Tranziția mișcă un singur obiect pe același diapozitiv.',ok:false,ajutor:'Tranziția e între diapozitive.',why:'Fals. Tranziția e trecerea de la un diapozitiv la altul; mișcarea unui obiect e animație.'}
   ]},
  {t:'Patru feluri de animații',
   text:`<p>Pe fila Animații (Animations), butonul <strong>Adăugare animație</strong> (Add Animation) deschide o listă cu patru grupuri:</p>
<ul><li><strong>intrare</strong> (Entrance): obiectul <strong>apare</strong>, de exemplu <i>Appear</i>, <i>Fade</i>, <i>Fly In</i>;</li><li><strong>evidențiere</strong> (Emphasis): obiectul, deja vizibil, <strong>atrage atenția</strong>, de exemplu <i>Pulse</i>;</li><li><strong>ieșire</strong> (Exit): obiectul <strong>dispare</strong>;</li><li><strong>cale definită</strong> (Motion Paths): obiectul <strong>se deplasează pe un drum</strong>.</li></ul>
${fig('animatii-familii','Lista Add Animation din fila Animations: grupurile Entrance și Emphasis cu efecte, titlul Exit și comenzile More Entrance, Emphasis, Exit Effects și More Motion Paths','Fila <b>Animations</b> → <b>Add Animation</b>: <i>Entrance</i> = intrare, <i>Emphasis</i> = evidențiere, <i>Exit</i> = ieșire, <i>Motion Paths</i> = căi definite.')}`,
   incearca:{t:'choice',q:'Vrei ca o poză să apară pe diapozitiv abia când ajungi cu vorba la ea. Din ce grup alegi efectul?',o:['Intrare (Entrance)','Ieșire (Exit)','Evidențiere (Emphasis)','Cale definită (Motion Paths)'],ok:0,ajutor:'„Apare” = intră.',why:'Efectele de intrare fac obiectul să apară. Ieșirea l-ar face să dispară.'},
   inca:[
    {t:'choice',q:'Titlul e deja pe ecran și vrei să „pulseze” o clipă. Din ce grup alegi?',o:['Evidențiere (Emphasis)','Intrare (Entrance)','Ieșire (Exit)','Cale definită (Motion Paths)'],ok:0,ajutor:'Obiectul e deja vizibil.',why:'Evidențierea atrage atenția asupra unui obiect care se vede deja. Pulse e un astfel de efect.'}
   ]},
  {t:'Cum pui o animație și o tranziție',
   text:`<p>O animație se pune pe un <strong>obiect</strong>, deci primul pas e mereu selecția:</p>
<ol><li><strong>selectezi</strong> obiectul (clic pe el);</li><li>fila <strong>Animații</strong> (Animations) → <strong>Add Animation</strong>;</li><li>alegi efectul din grupul potrivit;</li><li>verifici: pornești prezentarea cu <kbd>F5</kbd>.</li></ol>
<p>Fără obiect selectat, butonul <i>Add Animation</i> e gri. Lângă obiectul animat apare un număr mic: ordinea în care pornesc animațiile.</p>
<p>O <strong>tranziție</strong> se pune pe diapozitiv: alegi miniatura, apoi fila Tranziții (Transitions) și un efect.</p>`,
   exemplu:`<p>Rândurile de pe „Tabla și piesele” să apară pe rând: clic pe caseta cu rânduri → Animații (Animations) → <i>Add Animation</i> → <i>Appear</i> (grupul Entrance). Apoi, pentru trecerea spre diapozitivul următor: Tranziții (Transitions) → <i>Fade</i>.</p>`,
   incearca:{t:'order',q:'Pui o animație pe o poză. Pune pașii în ordine.',items:['Selectezi poza','Deschizi fila Animații (Animations)','Apeși Add Animation','Alegi efectul','Verifici cu F5'],ajutor:'Lista numerotată din pas.',why:'Selecția e mereu prima; verificarea cu F5, ultima, pentru că efectele se văd doar în expunere.'},
   inca:[
    {t:'choice',q:'Butonul Add Animation e gri. Ce ai uitat?',o:['Să selectezi un obiect','Să salvezi prezentarea','Să alegi o temă','Să pui o tranziție'],ok:0,ajutor:'Care e primul pas?',why:'Animația se pune pe un obiect. Fără obiect selectat, butonul nu are pe ce lucra.'}
   ]},
  {t:'Când ajută un efect',
   text:`<p>Un efect ajută când are un <strong>motiv</strong>: punctele unei liste apar pe rând, ca publicul să nu citească înainte; o săgeată arată drumul unei piese. Fără motiv, efectul doar încurcă.</p>
<p>Reguli:</p><ul><li><strong>aceeași tranziție</strong> în toată prezentarea;</li><li>efecte <strong>scurte</strong>;</li><li><strong>fără sunete</strong> la fiecare pas;</li><li>verifici totul cu <kbd>F5</kbd>: efectele se văd doar când prezentarea rulează, nu în miniaturi și nici într-un PDF.</li></ul>`,
   incearca:{t:'choice',q:'Când ajută o animație?',o:['Când are un motiv, de exemplu rândurile apar pe rând','Mereu: cu cât mai multe, cu atât mai bine','Când are și un sunet','Doar pe diapozitivul de titlu'],ok:0,ajutor:'Primul cuvânt îngroșat din pas.',why:'Efectul ajută doar când are un motiv. Altfel atrage atenția asupra lui, nu asupra ideii.'},
   inca:[
    {t:'tf',q:'Animațiile se văd și într-un PDF.',ok:false,ajutor:'Ultimul punct al listei.',why:'Fals. PDF-ul e nemișcat: efectele se văd doar când prezentarea rulează.'}
   ]}
 ],
 atelier:{t:'ppt',titlu:'Animează titlul și pune o tranziție',
  intro:DZ_INTRO+'<p><strong>Sarcina:</strong> pe diapozitivul 2, titlul să „zboare” înăuntru (un efect de intrare), iar trecerea spre diapozitiv să fie o estompare (Fade). Atenție: <i>Add Animation</i> merge doar după ce selectezi obiectul.</p>',
  q:'Titlul diapozitivului 2: animație de intrare Fly In. Diapozitivul 2: tranziția Fade.',start:{cur:1},
  sarcini:[{ce:'Selectează <b>titlul</b> diapozitivului',t:'obj-titlu'},{ce:'Deschide fila <b>Animations</b> (Animații)',t:'tab-animations'},{ce:'Apasă <i>Add Animation</i>',t:'add-anim'},{ce:'Alege <i>Fly In</i>, din grupul Entrance',t:'an-flyin'},
   {ce:'Deschide fila <b>Transitions</b> (Tranziții)',t:'tab-transitions'},{ce:'Alege tranziția <i>Fade</i>',t:'tr-fade'}],
  why:'Lângă titlu a apărut numărul 1 (ordinea animației), iar miniatura are o steluță: semnul că diapozitivul are un efect.',
  inca:[
   {t:'ppt',q:'Încă una: pe diapozitivul 3, fă săgeata să „pulseze” (evidențiere).',start:{cur:2},
    sarcini:[{ce:'Selectează săgeata',t:'obj-forma'},{ce:'Deschide fila <b>Animations</b>',t:'tab-animations'},{ce:'Apasă <i>Add Animation</i>',t:'add-anim'},{ce:'Alege <i>Pulse</i>, din grupul Emphasis',t:'an-pulse'}],
    why:'Pulse e un efect de evidențiere: săgeata se vede deja și doar atrage atenția.'},
   {t:'ppt',q:'Și încă una: diapozitivul 2 are o tranziție de care nu e nevoie. Scoate-o.',start:{cur:1,tr:'tr-fade'},
    sarcini:[{ce:'Deschide fila <b>Transitions</b>',t:'tab-transitions'},{ce:'Alege <i>None</i> (niciun efect)',t:'tr-none'}],
    why:'None scoate tranziția: steluța de lângă miniatură a dispărut.'}]},
 qs:[
  {t:'choice',q:'Diapozitivul 3 se estompează și apare diapozitivul 4. Ce efect e acesta?',o:['Tranziție','Animație','Temă','Aspect'],ok:0,why:'Se schimbă diapozitivul întreg, deci e tranziție.'},
  {t:'classify',q:'Tranziție sau animație?',cats:['Tranziție','Animație'],items:[['Diapozitivul 3 se estompează și apare diapozitivul 4',0],['O săgeată se mișcă pe hartă',1],['Titlul pulsează o clipă',1],['Diapozitivul întreg alunecă spre stânga',0],['O imagine dispare de pe diapozitiv',1]],ajutor:'Diapozitivul întreg sau un obiect?',why:'Întreabă-te: se schimbă diapozitivul întreg (tranziție) sau doar un obiect de pe el (animație)?'},
  {t:'match',q:'Leagă felul animației de ce face obiectul.',pairs:[['Intrare','apare'],['Evidențiere','atrage atenția, deși se vede deja'],['Ieșire','dispare'],['Cale definită','se deplasează pe un drum']],why:'Numele spune ce se întâmplă: intrarea aduce obiectul, ieșirea îl scoate, evidențierea îl scoate în față, iar calea definită îl plimbă pe un drum.'},
  {t:'tf',q:'E bine să pui altă tranziție la fiecare diapozitiv, ca prezentarea să fie variată.',ok:false,why:'Fals. Efectele schimbate mereu atrag atenția asupra lor și o iau de pe ce spui. O singură tranziție păstrează prezentarea unitară.'},
  {t:'choice',q:'Cum verifici că animațiile apar în ordinea bună?',o:['Pornești prezentarea cu F5 și treci prin diapozitive','Te uiți la miniaturile din stânga ferestrei','Salvezi prezentarea ca PDF și o deschizi','Mărești textul ca să vezi animațiile mai bine'],ok:0,ajutor:'Unde se văd efectele?',why:'Efectele se văd doar când prezentarea rulează. Miniaturile sunt nemișcate, iar într-un PDF animațiile nu există.'},
  {t:'choice',q:'Care e primul pas când pui o animație?',o:['Selectezi obiectul','Apeși F5','Alegi o tranziție','Salvezi ca PDF'],ok:0,why:'Animația se pune pe un obiect, deci întâi îl selectezi. Fără selecție, Add Animation e gri.'}
 ]},

/* ================= 7. Expun prezentarea (lecția 8) ================= */
{t:'Expun prezentarea',lectii:[8],continuturi:[P.expunere,P.gestionare,P.sustinere],
 obiectiv:'pornești, conduci și închei expunerea, alegi cum avansează diapozitivele și îți folosești notele fără ca publicul să le vadă.',
 pasi:[
  {t:'Pornești și oprești expunerea',
   text:`<p><mark>Expunerea</mark> înseamnă să arăți prezentarea pe tot ecranul, așa cum o vede publicul. În PowerPoint, de pe fila <strong>Expunere diapozitive</strong> (Slide Show) sau din taste:</p>
<ul><li><kbd>F5</kbd>: pornește <strong>de la început</strong> (<i>From Beginning</i>);</li><li><kbd>Shift</kbd>+<kbd>F5</kbd>: pornește <strong>de la diapozitivul curent</strong> (<i>From Current Slide</i>);</li><li><kbd>Esc</kbd>: <strong>încheie</strong> expunerea.</li></ul>
${fig('fila-expunere','Trei decupaje din panglica PowerPoint, unul sub altul: fila Slide Show încadrată lângă Record, butoanele From Beginning și From Current Slide încadrate, iar jos bifa Use Presenter View încadrată','Fila <b>Slide Show</b>: <i>From Beginning</i> (<kbd>F5</kbd>), <i>From Current Slide</i> (<kbd>Shift</kbd>+<kbd>F5</kbd>), <i>Use Presenter View</i>.')}`,
   exemplu:`<p>Ai reparat diapozitivul 6 și vrei să vezi cum arată mare: rămâi pe el și apeși <kbd>Shift</kbd>+<kbd>F5</kbd>. Nu mai treci prin primele cinci. Apoi <kbd>Esc</kbd> și continui lucrul.</p>`,

  {t:'Te miști prin prezentare',
   text:`<p>În timpul expunerii:</p>
<ul><li><strong>înainte</strong>: clic, <kbd>Enter</kbd> sau săgeata spre dreapta <kbd>→</kbd>;</li><li><strong>înapoi</strong>: săgeata spre stânga <kbd>←</kbd>;</li><li><kbd>B</kbd> face ecranul <strong>negru</strong>, ca toți să te privească pe tine; o apeși din nou și revii.</li></ul>
<p>Diapozitivele ascunse (<i>Hide Slide</i>) sunt sărite. După ultimul diapozitiv apare un ecran negru: sfârșitul expunerii.</p>`,
   exemplu:`<p>Un coleg întreabă ceva despre diapozitivul de dinainte: apeși <kbd>←</kbd>, răspunzi, apoi <kbd>→</kbd>. Vrei să vorbești fără ca ei să se uite la ecran: <kbd>B</kbd>; când termini, încă o dată <kbd>B</kbd>.</p>`,
   incearca:{t:'choice',q:'Cum te întorci la diapozitivul anterior, în expunere?',o:['Cu săgeata spre stânga','Cu Enter','Cu tasta B','Cu F5'],ok:0,ajutor:'„Înapoi”, în listă.',why:'Săgeata spre stânga te duce înapoi. Enter merge înainte, B face ecranul negru, iar F5 repornește de la început.'},
   inca:[
    {t:'choice',q:'Ce face tasta B în expunere?',o:['Face ecranul negru, apoi îl readuce','Închide prezentarea','Pune textul pe aldin','Trece la diapozitivul următor'],ok:0,ajutor:'Al treilea punct al listei.',why:'B întunecă ecranul, ca publicul să se uite la tine; a doua apăsare readuce diapozitivul.'}
   ]},
  {t:'La clic sau automat',
   text:`<p>Diapozitivele pot avansa în două feluri, setate pe fila Tranziții (Transitions), grupul <strong>Temporizare</strong> (Timing):</p>
<ul><li><mark>la clic</mark> (<i>On Mouse Click</i>): trece mai departe când decizi tu;</li><li><mark>automat</mark> (<i>After</i>): trece singur, după timpul scris în casetă.</li></ul>
<p>Când prezinți tu, alegi <strong>la clic</strong>: treci mai departe abia după ce ai terminat ideea. Automat e bine pe un ecran din holul școlii, unde nu vorbește nimeni.</p>
${fig('avansare-automata','Grupul Timing din fila Transitions: Advance Slide cu On Mouse Click bifat și After cu 00:00,00 nebifat','Fila Transitions, grupul <b>Timing</b>: <i>On Mouse Click</i> = la clic; <i>After</i> = automat, după timpul din casetă.')}`,
   incearca:{t:'choice',q:'Prezinți proiectul în fața clasei. Cum e bine să avanseze diapozitivele?',o:['La clic, când decizi tu','Automat, la 2 secunde','Automat, la 10 secunde','Nu avansează deloc'],ok:0,ajutor:'Cine vorbește? Atunci cine dă ritmul?',why:'Când vorbești tu, tu dai ritmul: treci mai departe abia după ce ai terminat ideea.'},
   inca:[
    {t:'classify',q:'Cum e mai bine să avanseze diapozitivele?',cats:['La clic','Automat'],items:[['Îți prezinți proiectul în fața clasei',0],['Un ecran din holul școlii arată anunțuri, unul după altul',1],['Te oprești să răspunzi la o întrebare a unui coleg',0],['Pozele de la excursie rulează pe ecran la ședința cu părinții, cât timp se adună lumea',1]],ajutor:'Vorbește cineva?',why:'Când vorbește cineva, ritmul îl dă omul, deci la clic. Când nu prezintă nimeni, diapozitivele trec singure.'}
   ]},
  {t:'Vizualizarea prezentator',
   text:`<p>Când calculatorul are un al doilea ecran (videoproiectorul), <mark>Vizualizarea prezentator</mark> (Presenter View) îți arată <strong>ție</strong>, pe laptop, notele, diapozitivul următor și un ceas. <strong>Publicul</strong>, pe videoproiector, vede doar diapozitivele.</p>
<p>O pornești de pe fila Expunere diapozitive (Slide Show), bifând <i>Use Presenter View</i>. Așa, notele din zona de note devin planul tău, pe care nu-l vede nimeni.</p>`,
   exemplu:`<p>Ioana prezintă la ședința cu părinții. Pe laptop vede diapozitivul curent, nota „spun că am strâns 120 kg de hârtie” și diapozitivul următor. Pe tabla albă, părinții văd doar diapozitivul.</p>`,
   incearca:{t:'choice',q:'Unde vezi notele, în Presenter View?',o:['Pe ecranul tău, de exemplu pe laptop','Pe videoproiector, pentru public','Nicăieri','Doar după ce salvezi ca PDF'],ok:0,ajutor:'„Îți arată ție…”',why:'Presenter View arată notele doar pe ecranul tău; publicul vede numai diapozitivele.'},
   inca:[
    {t:'choice',q:'Unde scrii ce vrei să vezi în Presenter View?',o:['În zona de note','Pe diapozitiv, cu litere mici','În bara de stare','În numele fișierului'],ok:0,ajutor:'Ultima propoziție a pasului.',why:'Notele scrise sub diapozitiv apar în Presenter View, doar pentru tine.'}

 ],

/* ================= 8. Mini-proiect: prezint un joc (lecțiile 8-9) ================= */
{t:'Mini-proiect: prezint un joc',final:true,lectii:[8,9],continuturi:[P.estetica,P.sustinere],
 obiectiv:'faci și susții o prezentare de 3–5 minute despre șah, după regulile de estetică, ergonomie și susținere.',
 pasi:[
  {t:'Estetica: îngrijit și limpede',
   text:`<p><strong>Misiunea finală:</strong> prezinți clasei, în 3–5 minute, jocul tău preferat: <strong>șahul</strong>.</p>
<p><mark>Estetica</mark> înseamnă că prezentarea arată îngrijit și limpede:</p>
<ul><li>puțin text: <strong>cel mult 6 rânduri</strong>, <strong>cel mult 6 cuvinte pe rând</strong> (regula 6 × 6);</li><li>contrast puternic, font simplu;</li><li>aceleași culori pe toate diapozitivele (o temă);</li><li>imagini care explică, nu doar decorează.</li></ul>
${fig('diapozitiv-sah','Diapozitiv-model despre șah în PowerPoint: titlul Șahul regulile de bază, patru rânduri scurte cu text alb pe fundal albastru închis, o tablă de șah desenată și notele vorbitorului dedesubt','Un diapozitiv-model: titlu, patru rânduri scurte, text alb pe fundal închis, o imagine care explică. Ce ai de spus stă în note, dedesubt.')}`,
   exemplu:`<p>Rândul „Fiecare jucător începe cu 16 piese: un rege, o damă, două ture, doi nebuni, doi cai și opt pioni” are 17 cuvinte. Pe diapozitiv rămâne „Fiecare jucător are 16 piese”, adică 5 cuvinte. Lista pieselor o spui tu, cu ajutorul notelor.</p>`,
   incearca:{t:'choice',q:'Câte cuvinte are voie un rând, după regula 6 × 6?',o:['Cel mult 6','Cel puțin 6','Exact 12','Oricâte'],ok:0,ajutor:'Primul punct al listei.',why:'Regula 6 × 6: cel mult 6 rânduri, cel mult 6 cuvinte pe rând.'},
   inca:[
    {t:'classify',q:'Rândul respectă regula de cel mult 6 cuvinte?',cats:['Da','Nu'],items:[['Albul mută primul',0],['Regele e piesa cea mai importantă',0],['Șahul este un joc foarte vechi, inventat acum multe secole',1],['Tabla are 64 de pătrățele',0]],ajutor:'Numără cuvintele pe degete.',why:'Primele rânduri au 3–6 cuvinte. Rândul despre vechimea șahului are 10: ideea lui o spui tu.'}
   ]},
  {t:'Ergonomia: să se vadă și să nu obosească',
   text:`<p><mark>Ergonomia</mark> înseamnă că prezentarea se urmărește ușor, fără efort:</p>
<ul><li>totul se vede din <strong>ultima bancă</strong>: titlul 32–40, textul 24–28;</li><li>efectele sunt puține și scurte, ca să nu obosească ochii;</li><li>fără sunete la fiecare pas;</li><li>un diapozitiv stă pe ecran cât vorbești despre el.</li></ul>
<p>Testul ultimei bănci: pornești cu <kbd>F5</kbd>, te duci în spatele clasei și citești. Dacă trebuie să mijești ochii, mărești textul.</p>`,
   incearca:{t:'tf',q:'Dacă fiecare diapozitiv are alt sunet și altă tranziție, prezentarea se urmărește mai ușor.',ok:false,ajutor:'Al doilea și al treilea punct.',why:'Fals. Efectele multe obosesc și atrag atenția asupra lor, nu asupra ideilor.'},
   inca:[
    {t:'choice',q:'Colegul din ultima bancă nu poate citi textul. Ce faci?',o:['Mărești textul, în jur de 24–28','Adaugi încă un paragraf','Pui o animație','Schimbi tranziția'],ok:0,ajutor:'Testul ultimei bănci.',why:'Textul trebuie să fie destul de mare cât să se citească din sală: 24–28.'}
   ]},
  {t:'Planul prezentării despre șah',
   text:`<p>Înainte să deschizi aplicația, fă <strong>planul</strong>, pe hârtie. Pașii:</p>
<ol><li>alegi 3–4 idei despre șah (tabla, piesele, cum mută, cum câștigi);</li><li>faci structura: titlu, cuprins, câte un diapozitiv pe idee, concluzie, surse;</li><li>pentru fiecare diapozitiv scrii rândurile scurte și alegi o imagine;</li><li>în note scrii ce spui la fiecare;</li><li>verifici: temă, contrast, mărimi, o singură tranziție, apoi <kbd>F5</kbd>.</li></ol>`,
   exemplu:`<p>Planul Anei:</p><ol><li>Șahul — Ana Pop, a VI-a A</li><li>Cuprins</li><li>Tabla și piesele (poză cu tabla)</li><li>Cum mută piesele</li><li>Cum câștigi: șah-mat</li><li>Ce am aflat</li><li>Surse: manualul, clubul de șah</li></ol>`,
   incearca:{t:'choice',q:'Ai scos de pe diapozitiv un rând prea lung. Unde pui ce voiai să spui în el?',o:['În note, și îl spui tu','Pe alt diapozitiv, tot ca paragraf','Nicăieri, îl uiți','În numele fișierului'],ok:0,ajutor:'Pasul 4 al planului.',why:'Ideea nu se pierde: o scrii în note și o spui cu voce tare.'},
   inca:[
    {t:'tf',q:'Planul îl faci după ce ai pus toate efectele.',ok:false,ajutor:'Prima propoziție a pasului.',why:'Fals. Planul e primul, pe hârtie; efectele și verificarea vin la final.'}
   ]},
  {t:'Susținerea: tu ești prezentarea',
   text:`<p>Când <strong>susții</strong> prezentarea:</p>
<ul><li>privești <strong>publicul</strong>, nu ecranul;</li><li>vorbești rar și clar;</li><li>ai o <strong>introducere</strong> (saluți, spui subiectul), <strong>conținutul</strong> (ideile, pe rând) și o <strong>încheiere</strong> (rezumi, mulțumești, primești întrebări);</li><li>notele sunt planul tău, nu un text de citit.</li></ul>
<p>Înainte de oră: verifici prezentarea cu <kbd>F5</kbd>, o <strong>repeți</strong> o dată cu voce tare și te <strong>cronometrezi</strong>.</p>`,
   altfel:`<p>Gândește-te la un ghid într-un muzeu: nu citește de pe tăblițe, ci se uită la vizitatori și le povestește. Tăblițele (diapozitivele) îl ajută doar să nu se piardă.</p>`,
   incearca:{t:'choice',q:'În timp ce prezinți, unde te uiți cel mai mult?',o:['La colegi, adică la public','La ecran, ca să citești','În foaia ta','În podea'],ok:0,ajutor:'Primul punct al listei.',why:'Când privești colegii, ei simt că le vorbești lor și te urmăresc. Ecranul e pentru public, nu pentru tine.'},
   inca:[
    {t:'choice',q:'Ce faci în încheiere?',o:['Rezumi, mulțumești și primești întrebări','Saluți și spui subiectul','Citești toate notele','Pornești prezentarea cu F5'],ok:0,ajutor:'Paranteza de după „încheiere”.',why:'Încheierea fixează ideile: un rezumat scurt, mulțumiri și întrebările publicului.'}
   ]}
 ],
 atelier:{t:'diapozitiv',titlu:'Repară diapozitivul despre șah',
  intro:'<p>Diapozitivul de mai jos încalcă toate regulile: roșu pe portocaliu, titlu mic, rânduri lungi. Alegi culorile și mărimile și <strong>apeși pe un rând ca să-l scoți</strong> sau să-l păstrezi. Jocul calculează contrastul și numără cuvintele de pe fiecare rând păstrat.</p>',

     {ce:'Deschide fila <b>File</b>',t:'tab-file'},{ce:'Alege <i>Save As</i>',t:'f-saveas'},{ce:'Scrie un nume bun: subiect, clasă, nume, de exemplu Sahul_6A_Pop',t:'nume',valoare:'Sahul_6A_Pop'},{ce:'Apasă <i>Save</i> (tipul .pptx)',t:'salvat-pptx',drum:['btn-save']}],
    why:'Ai verificat prezentarea în expunere și ai salvat-o cu un nume care spune al cui e și despre ce.'}]},
 qs:[
  {t:'hunt',q:'Planul lui Andrei are 4 greșeli. Apasă pe fiecare, apoi verifică.',
   src:'Diapozitivul 1: [[fără titlu|Primul diapozitiv spune subiectul și autorul.]], doar o poză cu o tablă de șah. Diapozitivul 2: cuprinsul. Diapozitivul 3: regulile, scrise în [[trei paragrafe lungi|Pe diapozitiv pui ideea pe scurt, iar explicația o spui tu.]]. Diapozitivul 4: piesele, cu câte o imagine. La fiecare diapozitiv, [[altă tranziție și un sunet|O singură tranziție, fără sunete, ține atenția pe conținut.]]. Ultimul diapozitiv: concluzia și „Mulțumesc!”, [[fără surse|Sursele informațiilor și ale imaginilor se trec la final.]].',
   indiciu:'Gândește-te la structură, la cantitatea de text, la efecte și la final.',ajutor:'Verifică pe rând: titlul, textul, efectele, sursele.',
   why:'Un plan bun are titlu, puțin text pe fiecare diapozitiv, efecte puține și sursele la final.'},
  {t:'tf',q:'E în regulă să citești prezentarea de pe ecran, cu spatele la clasă.',ok:false,why:'Fals. Colegii citesc mai repede decât vorbești și nu te mai ascultă. Privește-i și folosește notele doar ca plan.'},
  {t:'order',q:'Ziua prezentării. Pune pașii în ordine.',items:['Verifici prezentarea pornind-o cu F5','Saluți și spui subiectul','Prezinți ideile, câte una pe diapozitiv','Rezumi pe scurt ce ai arătat','Mulțumești și răspunzi la întrebări'],ajutor:'Înainte de oră, introducere, conținut, încheiere.',why:'Verificarea se face înainte, ca să nu ai surprize. Introducerea spune despre ce e vorba, conținutul ține ideile în ordine, iar încheierea fixează ce reține publicul.'},
  {t:'choice',q:'Ce înseamnă regula 6 × 6?',o:['Cel mult 6 rânduri, cel mult 6 cuvinte pe rând','Cel mult 6 diapozitive, cu câte 6 imagini','Exact 6 culori și 6 fonturi diferite','Cel mult 6 minute și 6 întrebări la final'],ok:0,why:'E o regulă de estetică: puțin text pe diapozitiv, ca să se înțeleagă dintr-o privire.'},
  {t:'choice',q:'Prezentarea arată îngrijit, dar textul e mic și nu se vede din ultima bancă. Ce regulă nu respectă?',o:['Ergonomia','Structura','Salvarea','Tranziția'],ok:0,ajutor:'Care regulă cere „totul se vede din ultima bancă”?',why:'Ergonomia cere ca prezentarea să se urmărească fără efort, deci textul trebuie să se vadă din ultima bancă.'},
  {t:'classify',q:'Ține de estetica diapozitivelor sau de susținerea prezentării?',cats:['Estetica diapozitivelor','Susținerea prezentării'],items:[['Contrast puternic',0],['Privești publicul',1],['Aceleași culori peste tot',0],['Vorbești rar și clar',1]],why:'Estetica e despre cum arată diapozitivele; susținerea e despre cum vorbești tu.'}
 ]}

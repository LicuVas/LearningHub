<script>
/* Tipul de întrebare „diapozitiv”: elevul repară un diapozitiv (culori, mărimi, rânduri) și vede rezultatul pe loc.
   Întrebare: {t:'diapozitiv', q, dz (titlul de pe diapozitiv; `titlu` rămâne pentru titlul atelierului), randuri:[...], start:{tx,bg,mt,ms}, verifica:['contrast','marime','randuri'], min, why}
   Verificare pe comportament: contrastul se CALCULEAZĂ din culorile alese (formula de luminanță WCAG, prag 4,5),
   mărimile se compară cu regulile din pagina de citit, cuvintele se numără pe fiecare rând păstrat.
   Nu există „răspunsul unic” memorat: orice combinație care respectă regulile e acceptată. */
const JocDiapozitiv=(function(){
'use strict';
const TXT=[['negru','#1F1F1F'],['alb','#FFFFFF'],['galben','#F2C300'],['roșu','#D62828'],['gri deschis','#BDBDBD']];
const BG=[['alb','#FFFFFF'],['bleumarin','#1E3A5F'],['portocaliu','#F28C28'],['gri','#9E9E9E']];
const MT=[20,28,36], MS=[12,16,26,44];
function lum(hex){const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)}
const words=s=>s.split(/\s+/).filter(w=>/[0-9A-Za-zĂÂÎȘȚăâîșț]/.test(w)).length;
const CSS=`.dz-wrap{container-type:inline-size;max-width:520px;margin:0 auto 14px}
.dz-slide{aspect-ratio:16/9;border:1px solid var(--line);border-radius:4px;box-shadow:0 3px 0 var(--line);padding:5cqw 6cqw;overflow:hidden;font-family:Arial,"Segoe UI",sans-serif;line-height:1.2}
.dz-t{font-size:calc(var(--pt) * 100cqw / 640);font-weight:700;margin:0 0 .45em;overflow-wrap:anywhere}
.dz-l{font-size:calc(var(--pt) * 100cqw / 640);margin:0;padding-left:1.1em}
.dz-l li{margin:.12em 0;overflow-wrap:anywhere}
.dz-ctl{display:grid;gap:12px}
.dz-opts{display:flex;flex-wrap:wrap;gap:6px}
.dz-sw{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);font-size:.9rem;line-height:1.2}
.dz-sw i{width:16px;height:16px;border-radius:3px;border:1px solid var(--ink2);flex:none}
.dz-sw.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600}
.dz-rows{display:flex;flex-direction:column;gap:6px}
.dz-row{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);line-height:1.3;overflow-wrap:anywhere}
.dz-row b{font-family:var(--fm);font-size:.72rem;width:5.2em;flex:none;padding-top:.2em;color:var(--ok)}
.dz-row span{min-width:0}
.dz-row.off{background:transparent}
.dz-row.off span{text-decoration:line-through;color:var(--ink2)}
.dz-row.off b{color:var(--bad)}`;

function solution(Q){
  let best=[0,0,0];
  TXT.forEach((t,i)=>BG.forEach((b,j)=>{const r=contrast(t[1],b[1]);if(r>best[2])best=[i,j,r]}));
  let keep=Q.randuri.map(r=>words(r)<=6),n=0;
  keep=keep.map(k=>k&&(++n)<=6);
  return {tx:best[0],bg:best[1],mt:MT.indexOf(36),ms:MS.indexOf(26),keep};
}

function render(Q,body,api){
  if(!document.getElementById('tip-diapozitiv-css')){const s=document.createElement('style');s.id='tip-diapozitiv-css';s.textContent=CSS;document.head.appendChild(s)}
  const esc=api.esc,V=Q.verifica||['contrast','marime','randuri'],has=k=>V.includes(k);
  const st=Object.assign({tx:0,bg:0,mt:2,ms:2},Q.start||{});st.keep=Q.randuri.map(()=>true);
  const group=(label,html)=>`<div><div class="lbl">${label}</div><div class="dz-opts">${html}</div></div>`;
  function draw(){
    const sw=(arr,key)=>arr.map(([n,c],i)=>`<button type="button" class="dz-sw ${i===st[key]?'on':''}" data-${key}="${i}" aria-pressed="${i===st[key]}"><i style="background:${c}"></i>${esc(n)}</button>`).join('');
    const sz=(arr,key)=>arr.map((v,i)=>`<button type="button" class="dz-sw ${i===st[key]?'on':''}" data-${key}="${i}" aria-pressed="${i===st[key]}">${v}</button>`).join('');
    body.innerHTML=`<div class="dz-wrap"><div class="dz-slide" role="img" aria-label="Diapozitivul, așa cum arată acum" style="background:${BG[st.bg][1]};color:${TXT[st.tx][1]}">
        <div class="dz-t" style="--pt:${MT[st.mt]}">${esc(Q.dz||Q.titlu)}</div>
        <ul class="dz-l" style="--pt:${MS[st.ms]}">${Q.randuri.map((r,k)=>st.keep[k]?`<li>${esc(r)}</li>`:'').join('')}</ul>
      </div></div>
      <div class="dz-ctl">
        ${has('contrast')?group('Culoarea textului',sw(TXT,'tx'))+group('Fundalul',sw(BG,'bg')):''}
        ${has('marime')?group('Mărimea titlului',sz(MT,'mt'))+group('Mărimea textului',sz(MS,'ms')):''}
        ${has('randuri')?`<div><div class="lbl">Rândurile · apasă ca să păstrezi sau să scoți</div><div class="dz-rows">${Q.randuri.map((r,k)=>`<button type="button" class="dz-row ${st.keep[k]?'on':'off'}" data-k="${k}" aria-pressed="${st.keep[k]}"><b>${st.keep[k]?'păstrez':'scot'}</b><span>${esc(r)}</span></button>`).join('')}</div></div>`:''}
      </div>`;
    body.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{if(api.done())return;st.tx=+b.dataset.tx;draw()});
    body.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{if(api.done())return;st.bg=+b.dataset.bg;draw()});
    body.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{if(api.done())return;st.mt=+b.dataset.mt;draw()});
    body.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{if(api.done())return;st.ms=+b.dataset.ms;draw()});
    body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(api.done())return;const k=+b.dataset.k;st.keep[k]=!st.keep[k];draw()});
  }
  function problems(){
    const out=[];
    if(has('contrast')){
      const r=contrast(TXT[st.tx][1],BG[st.bg][1]);
      if(r<4.5)out.push(`Textul ${TXT[st.tx][0]} pe fundal ${BG[st.bg][0]} se vede slab. Alege text închis pe fundal deschis sau text deschis pe fundal închis.`);
    }
    if(has('marime')){
      const t=MT[st.mt],x=MS[st.ms];
      if(t<32)out.push(`Titlul de ${t} e prea mic: un titlu are în jur de 32–40.`);
      if(x<24)out.push(`Textul de ${x} nu se citește din ultima bancă: pune-l în jur de 24–28.`);
      else if(x>=t)out.push(`Textul de ${x} e cel puțin cât titlul. Titlul trebuie să fie cel mai mare, ca să se vadă despre ce e vorba.`);
    }
    if(has('randuri')){
      const kept=Q.randuri.filter((_,k)=>st.keep[k]),lung=kept.filter(r=>words(r)>6),min=Q.min||3;
      if(lung.length)out.push(`${lung.length===1?'Un rând păstrat are':lung.length+' rânduri păstrate au'} mai mult de 6 cuvinte (de exemplu „${esc(lung[0].split(/\s+/).slice(0,3).join(' '))}…”). Pe diapozitiv rămân ideile scurte, restul îl spui tu.`);
      if(kept.length<min)out.push(`Au rămas ${kept.length} rânduri. Păstrează cel puțin ${min} idei scurte, ca diapozitivul să spună ceva.`);
      if(kept.length>6)out.push(`Ai păstrat ${kept.length} rânduri. Cel mult 6 încap bine pe un diapozitiv.`);
    }
    return out;
  }
  draw();
  const nav=api.checkButton(()=>{
    const pr=problems();
    if(!pr.length){nav.innerHTML='';api.resolve(true)}
    else{api.resolve(false,pr.slice(0,2).join(' ')+(pr.length>2?` (încă ${pr.length-2})`:''));
      api.revealButton(()=>{const s=solution(Q);
        if(has('contrast')){st.tx=s.tx;st.bg=s.bg}
        if(has('marime')){st.mt=s.mt;st.ms=s.ms}
        if(has('randuri'))st.keep=s.keep;
        draw();nav.innerHTML='';
        const parts=[];
        if(has('contrast'))parts.push(`text ${TXT[st.tx][0]} pe fundal ${BG[st.bg][0]}`);
        if(has('marime'))parts.push(`titlul ${MT[st.mt]}, textul ${MS[st.ms]}`);
        if(has('randuri'))parts.push('doar rândurile scurte');
        api.giveUp(`o variantă bună e acum pe diapozitiv: ${parts.join('; ')}.`)})}
  });
}
function rezolva(Q,body){
  const s=solution(Q);
  const click=sel=>{const b=body.querySelector(sel);if(b)b.click()};
  click(`[data-tx="${s.tx}"]`);click(`[data-bg="${s.bg}"]`);click(`[data-mt="${s.mt}"]`);click(`[data-ms="${s.ms}"]`);
  s.keep.forEach((k,i)=>{const b=body.querySelector(`[data-k="${i}"]`);if(b&&(b.getAttribute('aria-pressed')==='true')!==k)b.click()});
}
/* Răspuns greșit tipic de copil, pentru poartă: pornește de la o variantă bună și strică un singur lucru,
   cel verificat de întrebare — text galben pe fundal alb (contrast ~1,8), titlu de 20 sau toate rândurile scoase. */
function gresit(Q,body){
  rezolva(Q,body);
  const V=Q.verifica||['contrast','marime','randuri'];
  const click=sel=>{const b=body.querySelector(sel);if(b)b.click()};
  if(V.includes('contrast')){click(`[data-tx="${TXT.findIndex(t=>t[0]==='galben')}"]`);click(`[data-bg="${BG.findIndex(b=>b[0]==='alb')}"]`)}
  else if(V.includes('marime')){click(`[data-mt="${MT.indexOf(20)}"]`)}
  else{Q.randuri.forEach((_,i)=>{const b=body.querySelector(`[data-k="${i}"]`);if(b&&b.getAttribute('aria-pressed')==='true')b.click()})}
}
return {render,rezolva,gresit,contrast,words};
})();

/* Tipul „ppt”: o fereastră PowerPoint SIMULATĂ (interfața în engleză, ca pe calculatorul de lucru; filele au și numele românesc).
   Elevul face pașii din Q.sarcini, pe rând; fiecare pas se bifează când apasă ce trebuie. Verificarea e pe comportament:
   pasul contează doar dacă gestul chiar a mers în simulator (Add Animation e gri fără obiect selectat, Save refuză un nume slab,
   fundalul cere întâi Solid fill...). Q:{t:'ppt', q, sarcini:[{ce, t:'id emis', drum?:[id-uri de apăsat], unde?}], start?:{cur,tab,pozaPeste,tr,modificat}, why}.
   Numele butoanelor = cele din capturile din img/ (PowerPoint în engleză); nu am pus butoane pe care nu le-am văzut sau nu le știu sigur. */
const JocPPT=(function(){
'use strict';
const TABS=[['file','File','Fișier'],['home','Home','Pornire'],['insert','Insert','Inserare'],['design','Design','Proiectare'],['transitions','Transitions','Tranziții'],['animations','Animations','Animații'],['slideshow','Slide Show','Expunere diapozitive']];
const RIB={
  home:[['new-slide','New Slide'],['layout','Layout ▾'],['font-size','Font Size ▾','text'],['font-color','Font Color ▾','text'],['bold','B','text'],['shape-fill','Shape Fill ▾','forma'],['shape-outline','Shape Outline ▾','forma']],
  insert:[['ins-table','Table'],['ins-pictures','Pictures'],['ins-shapes','Shapes'],['ins-textbox','Text Box'],['ins-link','Link'],['ins-audio','Audio']],
  design:[['tema-1','Temă albă'],['tema-2','Temă bleumarin'],['tema-3','Temă verde'],['bg-styles','Background Styles ▾']],
  transitions:[['tr-none','None'],['tr-morph','Morph'],['tr-fade','Fade'],['on-click','On Mouse Click','chk'],['after','After: 00:05','chk']],
  animations:[['add-anim','Add Animation ▾','obj']],
  slideshow:[['from-begin','From Beginning'],['from-current','From Current Slide'],['presenter','Use Presenter View','chk']]
};
const MENU={
  file:{titlu:'File',items:[['f-new','New'],['f-open','Open'],['f-save','Save'],['f-saveas','Save As'],['f-close','Close']]},
  layout:{titlu:'Layout',items:[['lay-title','Title Slide'],['lay-tc','Title and Content'],['lay-two','Two Content'],['lay-comp','Comparison'],['lay-to','Title Only'],['lay-blank','Blank']]},
  'font-size':{titlu:'Font Size',sw:true,items:[['fs-12','12'],['fs-20','20'],['fs-28','28'],['fs-40','40']]},
  'font-color':{titlu:'Font Color',sw:true,items:[['fc-negru','negru'],['fc-alb','alb'],['fc-galben','galben']],cul:{'fc-negru':'#1F1F1F','fc-alb':'#FFFFFF','fc-galben':'#F2C300'}},
  'shape-fill':{titlu:'Shape Fill',sw:true,items:[['sf-rosu','roșu'],['sf-verde','verde'],['sf-galben','galben'],['sf-none','No Fill']],cul:{'sf-rosu':'#D62828','sf-verde':'#2E8B57','sf-galben':'#F2C300','sf-none':'transparent'}},
  'shape-outline':{titlu:'Shape Outline',sw:true,items:[['so-negru','negru'],['so-rosu','roșu'],['so-none','No Outline']],cul:{'so-negru':'#1F1F1F','so-rosu':'#D62828','so-none':'transparent'}},
  'bg-styles':{titlu:'Background Styles',items:[['format-bg','Format Background...']]},
  'add-anim':{titlu:'Add Animation',groups:[['Entrance',[['an-appear','Appear'],['an-fade','Fade'],['an-flyin','Fly In']]],['Emphasis',[['an-pulse','Pulse'],['an-spin','Spin']]],['Exit',[['an-disappear','Disappear'],['an-flyout','Fly Out']]],['Motion Paths',[['an-lines','Lines'],['an-arcs','Arcs']]]]},
  'ctx-thumb':{titlu:'Meniul miniaturii (clic dreapta)',items:[['ctx-new','New Slide'],['ctx-dup','Duplicate Slide'],['ctx-del','Delete Slide'],['ctx-hide','Hide Slide']]},
  'ctx-obj':{titlu:'Meniul obiectului (clic dreapta)',items:[['ctx-front','Bring to Front'],['ctx-back','Send to Back']]}
};
const GRUP={};MENU['add-anim'].groups.forEach(([g,it])=>it.forEach(([id])=>GRUP[id]=g.toLowerCase().replace(/\s+/g,'')));
const TEME=[{bg:'#FFFFFF',fg:'#1F1F1F'},{bg:'#1E3A5F',fg:'#FFFFFF'},{bg:'#E8F3EA',fg:'#1B3A24'}];
const BGC=[['bgc-alb','alb','#FFFFFF'],['bgc-bleumarin','bleumarin','#1E3A5F'],['bgc-negru','negru','#111111']];
const TIPF=[['tip-pptx','PowerPoint Presentation (*.pptx)','pptx'],['tip-pdf','PDF (*.pdf)','pdf'],['tip-odp','OpenDocument Presentation (*.odp)','odp']];
const LBL={};
TABS.forEach(([id,en,ro])=>LBL['tab-'+id]=`fila ${en} (${ro})`);
Object.values(RIB).forEach(a=>a.forEach(([id,l])=>LBL[id]=l.replace(' ▾','')));
Object.values(MENU).forEach(m=>{(m.items||[]).forEach(([id,l])=>LBL[id]=l);(m.groups||[]).forEach(([g,it])=>it.forEach(([id,l])=>LBL[id]=`${l} (${g})`))});
BGC.forEach(([id,n])=>LBL[id]='culoarea '+n);TIPF.forEach(([id,l])=>LBL[id]=l);
Object.assign(LBL,{bold:'B (Bold, aldin)','zona-panglica':'panglica','zona-miniaturi':'panoul cu miniaturi','zona-lucru':'zona de lucru','zona-note':'zona de note','bara-stare':'bara de stare',
  'obj-titlu':'titlul','obj-text':'caseta cu rânduri','obj-poza':'poza','obj-forma':'săgeata','obj-tabel':'tabelul','obj-caseta':'caseta de text','obj-link':'legătura','obj-audio':'sunetul',
  'k-next':'→ (înainte)','k-prev':'← (înapoi)','k-b':'B (ecran negru)','k-esc':'Esc (ieșire)','btn-save':'Save','btn-cancel':'Cancel','q-save':'Save','q-dont':'Don’t Save','q-cancel':'Cancel',
  'solid-fill':'Solid fill','pane-close':'închiderea panoului','menu-close':'închiderea meniului','redeschide':'Redeschide','zona-dlg':'fereastra Save As','zona-show':'ecranul expunerii'});
const label=id=>LBL[id]||(id.startsWith('mini-')?`miniatura diapozitivului ${id.slice(5)}`:id);
const dark=hex=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return (0.299*c[0]+0.587*c[1]+0.114*c[2])<128};
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const numeBun=n=>{n=String(n).trim();return n.length>=5&&!/\s/.test(n)&&/[_-]/.test(n)&&!/^(prezentare|presentation)\d*$/i.test(n)};
const CSS=`.pp-root{max-width:680px;margin:0 auto}
.pp{border:1px solid #AEB8BB;border-radius:6px;overflow:hidden;background:#F3F3F3;color:#222;font:13px/1.3 "Segoe UI",system-ui,sans-serif;text-align:left}
.pp button{font:inherit;color:inherit;cursor:pointer;margin:0}
.pp-bar{background:#B7472A;color:#fff;padding:4px 8px;font-size:12px;overflow-wrap:anywhere}
.pp-tabs{display:flex;flex-wrap:wrap;gap:0 2px;padding:3px 3px 0;background:#fff}
.pp-tab{border:0;border-bottom:3px solid transparent;background:none;padding:3px 6px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.pp-tab small{font-size:10px;color:#6B6B6B}
.pp-tab.on{border-bottom-color:#B7472A}.pp-tab.on b{color:#B7472A}
.pp-btns{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#fff;border-bottom:1px solid #D0D0D0;min-height:24px}
.pp-b{border:1px solid #D2D2D2;background:#FAFAFA;border-radius:3px;padding:5px 8px;overflow-wrap:anywhere}
.pp-b.on{background:#FBE3DB;border-color:#B7472A}

  {titlu:'Cum câștigi',text:['Regele atacat e în șah','Șah-mat: regele nu mai scapă'],lay:'tc',obj:['forma'],note:'Arăt pe tablă un șah-mat simplu.'},
  {titlu:'Surse',text:['Manualul de informatică, clasa a VI-a','Clubul de șah al școlii'],lay:'tc',obj:[],note:''}
].map(s=>Object.assign({hidden:false,tr:null,anim:{},bg:null,jos:{},fill:null,outline:null,f:{},peste:false},s))}
function nou(){return {titlu:'',text:[],lay:'tc',obj:[],note:'',hidden:false,tr:null,anim:{},bg:null,jos:{},fill:null,outline:null,f:{},peste:false}}
function init(Q){
  const s0=Q.start||{};
  const S={tab:s0.tab||'home',menu:null,pane:null,dlg:false,ask:false,closing:false,inchis:false,sel:null,cur:s0.cur||0,slides:deck(),show:null,black:false,
    tip:'pptx',nume:'Presentation1',salvat:null,modificat:!!s0.modificat,chk:{'on-click':true,after:false,presenter:false},tema:0,solid:false,step:0,msg:''};
  if(s0.pozaPeste){const sl=S.slides[S.cur];sl.peste=true;if(!sl.obj.includes('poza'))sl.obj.push('poza')}
  if(s0.tr)S.slides[S.cur].tr=s0.tr;
  return S;
}
function nextVis(S,i,d){while(i>=0&&i<S.slides.length){if(!S.slides[i].hidden)return i;i+=d}return -1}

/* un gest în simulator: întoarce id-urile „emise” (ce s-a întâmplat) sau false, dacă gestul nu merge (cu S.msg = de ce) */
function act(S,id){
  const sl=S.slides[S.cur];
  const blocat=m=>{S.msg=m;return false};
  if(id==='redeschide'){S.inchis=false;S.salvat=S.salvat;return [id]}
  if(S.inchis)return blocat('Prezentarea e închisă. Apasă „Redeschide”.');
  if(S.show!==null){
    if(id==='k-esc'||(id==='zona-show'&&S.show==='end')){S.show=null;S.black=false;return ['k-esc']}
    if(id==='k-b'){if(S.show==='end')return [id];S.black=!S.black;return [id,S.black?'negru-on':'negru-off']}
    if(id==='k-next'){if(S.show!=='end'){const n=nextVis(S,S.show+1,1);S.show=n<0?'end':n}S.black=false;return [id]}
    if(id==='k-prev'){const p=S.show==='end'?nextVis(S,S.slides.length-1,-1):nextVis(S,S.show-1,-1);if(p>=0)S.show=p;S.black=false;return [id]}
    return blocat('Ești în expunere: folosește tastele de sub ecran. Esc te scoate.');
  }
  if(S.dlg){
    if(id.startsWith('tip-')){S.tip=id.slice(4);return [id]}
    if(id==='btn-cancel'){S.dlg=false;S.closing=false;return [id]}
    if(id==='btn-save'){
      if(!numeBun(S.nume))return blocat('Numele nu e bun încă. Un nume bun spune subiectul, clasa și numele tău, despărțite cu _ și fără spații, de exemplu Sahul_6A_Pop.');
      S.dlg=false;S.salvat=S.nume.trim()+'.'+S.tip;S.modificat=false;S.msg=`Salvat: ${S.salvat}.`;
      const r=[id,'salvat-'+S.tip];if(S.closing){S.closing=false;S.inchis=true;r.push('inchis')}return r;
    }
    if(id==='zona-dlg')return [id];
    return blocat('Fereastra Save As e deschisă: termin-o întâi (Save sau Cancel).');
  }
  if(S.ask){
    if(id==='q-save'){S.ask=false;if(S.salvat){S.inchis=true;S.modificat=false;return [id,'salvat-'+S.tip,'inchis']}S.dlg=true;S.closing=true;return [id]}
    if(id==='q-dont'){S.ask=false;S.inchis=true;S.msg='Închis fără salvare: modificările s-au pierdut.';return [id,'inchis']}
    if(id==='q-cancel'){S.ask=false;return [id]}
    return blocat('Răspunde întâi la întrebare: Save, Don’t Save sau Cancel.');
  }
  if(id.startsWith('tab-')){S.tab=id.slice(4);S.menu=S.tab==='file'?'file':null;S.pane=null;return [id]}
  if(id==='menu-close'){if(S.menu==='file')S.tab='home';S.menu=null;return [id]}
  if(id.startsWith('mini-')){S.cur=+id.slice(5)-1;S.sel=null;S.menu='ctx-thumb';return [id,'meniu-mini']}
  if(id.startsWith('obj-')){const o=id.slice(4);if(S.sel===o){S.menu='ctx-obj';return [id,'meniu-obj']}S.sel=o;S.menu=null;return [id]}
  if(id==='zona-lucru'){S.sel=null;S.menu=null;return [id]}
  if(['zona-panglica','zona-miniaturi','zona-note','bara-stare'].includes(id)){S.menu=null;return [id]}
  if(gri(S,id))return blocat(`Butonul ${label(id)} e gri: ${ce_lipseste(id)}`);
  if(MENU[id]&&id!=='file'){S.menu=S.menu===id?null:id;return [id]}
  S.menu=S.menu&&(id.startsWith('ctx-')||MENU[S.menu].items&&MENU[S.menu].items.some(x=>x[0]===id)||MENU[S.menu].groups)?null:S.menu;
  const fo=S.sel&&(sl.f[S.sel]=sl.f[S.sel]||{});
  if(id==='bold'){fo.b=!fo.b;S.modificat=true;return [id]}
  if(id.startsWith('fs-')){fo.fs=+id.slice(3);S.menu=null;S.modificat=true;return [id]}
  if(id.startsWith('fc-')){fo.fc=MENU['font-color'].cul[id];S.menu=null;S.modificat=true;return [id]}
  if(id.startsWith('sf-')){sl.fill=MENU['shape-fill'].cul[id];S.menu=null;S.modificat=true;return [id]}
  if(id.startsWith('so-')){sl.outline=MENU['shape-outline'].cul[id];S.menu=null;S.modificat=true;return [id]}
  if(id==='new-slide'||id==='ctx-new'){S.slides.splice(S.cur+1,0,nou());S.cur++;S.sel=null;S.menu=null;S.modificat=true;return [id,'slide-nou']}
  if(id==='ctx-dup'){S.slides.splice(S.cur+1,0,JSON.parse(JSON.stringify(sl)));S.cur++;S.menu=null;S.modificat=true;return [id]}
  if(id==='ctx-del'){if(S.slides.length<2)return blocat('Nu poți șterge singurul diapozitiv.');S.slides.splice(S.cur,1);S.cur=Math.min(S.cur,S.slides.length-1);S.menu=null;S.modificat=true;return [id]}
  if(id==='ctx-hide'){sl.hidden=!sl.hidden;S.menu=null;S.modificat=true;return [id,sl.hidden?'ascuns':'vizibil']}
  if(id==='ctx-back'||id==='ctx-front'){if(S.sel)sl.jos[S.sel]=id==='ctx-back';S.menu=null;S.modificat=true;return [id]}
  if(id.startsWith('lay-')){sl.lay=id.slice(4);S.menu=null;S.modificat=true;return [id]}
  if(id.startsWith('ins-')){const o={'ins-table':'tabel','ins-pictures':'poza','ins-shapes':'forma','ins-textbox':'caseta','ins-link':'link','ins-audio':'audio'}[id];
    if(!sl.obj.includes(o))sl.obj.push(o);S.sel=o;S.modificat=true;return [id]}
  if(id.startsWith('tema-')){S.tema=+id.slice(5)-1;S.slides.forEach(s=>s.bg=null);S.modificat=true;return [id]}
  if(id==='format-bg'){S.pane='fundal';S.menu=null;return [id]}
  if(id==='solid-fill'){S.solid=true;return [id]}
  if(id.startsWith('bgc-')){if(!S.solid)return blocat('Alege întâi Solid fill (umplere solidă), apoi culoarea.');sl.bg=BGC.find(b=>b[0]===id)[2];S.modificat=true;return [id]}
  if(id==='pane-close'){S.pane=null;return [id]}
  if(id.startsWith('tr-')){sl.tr=id;S.modificat=true;return [id]}
  if(id==='on-click'||id==='after'||id==='presenter'){S.chk[id]=!S.chk[id];S.modificat=true;return [id,id+(S.chk[id]?'-on':'-off')]}
  if(id.startsWith('an-')){sl.anim[S.sel]=id;S.menu=null;S.modificat=true;return [id,'an-'+GRUP[id]]}
  if(id==='from-begin'){const f=nextVis(S,0,1);S.show=f<0?'end':f;S.menu=null;S.black=false;return [id]}
  if(id==='from-current'){S.show=S.cur;S.menu=null;S.black=false;return [id]}
  if(id==='f-saveas'){S.dlg=true;S.menu=null;S.tab='home';return [id]}
  if(id==='f-save'){S.menu=null;S.tab='home';
    if(S.salvat){S.modificat=false;S.msg=`Salvat din nou în ${S.salvat}, fără nicio întrebare.`;return [id,'salvat-'+S.tip]}
    S.dlg=true;S.msg='Prima salvare: aplicația te întreabă sub ce nume și în ce format.';return [id]}
  if(id==='f-close'){S.menu=null;S.tab='home';if(S.modificat){S.ask=true;return [id]}S.inchis=true;return [id,'inchis']}
  if(id==='f-new'){S.menu=null;S.tab='home';S.msg='În aplicația reală se deschide o prezentare nouă, goală, într-o fereastră nouă.';return [id]}
  if(id==='f-open'){S.menu=null;S.tab='home';S.msg='În aplicația reală alegi acum fișierul dintr-un folder.';return [id]}
  return [id];
}
function gri(S,id){
  const need={'font-size':'text','font-color':'text',bold:'text','shape-fill':'forma','shape-outline':'forma','add-anim':'obj'}[id];
  if(need==='text')return !['titlu','text','caseta'].includes(S.sel);
  if(need==='forma')return S.sel!=='forma';
  if(need==='obj')return !S.sel;
  return false;
}
function ce_lipseste(id){
  return {'font-size':'selectează întâi un text de pe diapozitiv (titlul sau rândurile).','font-color':'selectează întâi un text de pe diapozitiv.',bold:'selectează întâi un text.',
    'shape-fill':'selectează întâi o formă (săgeata).','shape-outline':'selectează întâi o formă (săgeata).','add-anim':'selectează întâi un obiect de pe diapozitiv.'}[id]||'';
}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function forma(sl){const f=sl.fill||'#2F6DB5',o=sl.outline||'#1F3F6B';
  return `<svg viewBox="0 0 100 50" aria-hidden="true"><polygon points="2,16 60,16 60,3 98,25 60,47 60,34 2,34" fill="${f==='transparent'?'none':f}" stroke="${o==='transparent'?'none':o}" stroke-width="3"/></svg>`}
function slideHTML(S,k,inter){
  const sl=S.slides[k],T=TEME[S.tema],bg=sl.bg||T.bg,fg=sl.bg?(dark(sl.bg)?'#FFFFFF':'#1F1F1F'):T.fg;
  const OBJ={poza:'',forma:forma(sl),tabel:'<table><tr><td>Piesa</td><td>Câte</td></tr><tr><td>Pion</td><td>8</td></tr></table>',caseta:'Text nou',link:'<u>www.exemplu.ro</u>',audio:'♪ sunet'};
  const O=(n,inner,extra='')=>{const f=sl.f[n]||{};
    const st=`${f.fs?`--pt:${f.fs};`:''}${f.fc?`color:${f.fc};`:''}${f.b?'font-weight:700;':''}${extra}`;
    const an=inter&&S.tab==='animations'&&sl.anim[n]?'<span class="pp-an">1</span>':'';
    const sel=inter&&k===S.cur&&S.sel===n?' sel':'';
    return `<div class="pp-o pp-${n}${sel}"${inter?` data-t="obj-${n}" role="button" tabindex="0" aria-label="${label('obj-'+n)}"`:''}${st?` style="${st}"`:''}>${an}${inner}</div>`};
  const lista=sl.text.length?`<ul>${sl.text.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<span class="pp-ph">Click to add text</span>';
  const titlu=sl.lay==='blank'?'':O('titlu',sl.titlu?esc(sl.titlu):'<span class="pp-ph">Click to add title</span>');
  const objs=sl.obj.filter(n=>!(n==='poza'&&sl.peste)).map(n=>O(n,OBJ[n])).join('');
  let corp='';
  if(sl.lay==='title')corp=O('text',sl.text.map(esc).join('<br>')||'<span class="pp-ph">Click to add subtitle</span>','text-align:center');
  else if(sl.lay==='tc')corp=O('text',lista)+(objs?`<div class="pp-rowo">${objs}</div>`:'');
  else if(sl.lay==='two'||sl.lay==='comp')corp=`<div class="pp-two">${O('text',lista)}<div>${objs||'<span class="pp-ph">Click to add text</span>'}</div></div>`;
  else corp=objs?`<div class="pp-rowo">${objs}</div>`:'';
  const peste=sl.peste&&sl.obj.includes('poza')?O('poza','',`position:absolute;left:4%;top:3%;width:92%;height:46%;aspect-ratio:auto;z-index:${sl.jos.poza?0:3}`):'';
  return `<div class="pp-slide lay-${sl.lay}" style="background:${bg};color:${fg}">${peste}${titlu}${corp}</div>`;
}
function menuHTML(S){

  let h=`<div class="pp-menu" role="menu"><div class="pp-mt"><span>${tit}</span><button type="button" class="pp-x" data-t="menu-close" aria-label="Închide meniul">×</button></div>`;
  if(m.groups)h+=m.groups.map(([g,it])=>`<div class="pp-gr">${g}</div><div class="pp-grid">${it.map(([id,l])=>`<button type="button" class="pp-mi" data-t="${id}">${l}</button>`).join('')}</div>`).join('');
  else h+=`<div class="${m.sw?'pp-grid':''}">${m.items.map(([id,l])=>`<button type="button" class="pp-mi" data-t="${id}">${m.cul?`<i class="pp-c" style="background:${m.cul[id]}"></i>`:''}${l}</button>`).join('')}</div>`;
  return h+'</div>';
}

  if(S.inchis)return `<div class="pp"><div class="pp-bar">PowerPoint</div><div class="pp-gol">Prezentarea s-a închis.${S.salvat?` Fișierul <b>${esc(S.salvat)}</b> e salvat pe disc.`:''}<br><br><button type="button" class="pp-b" data-t="redeschide">Redeschide</button></div></div>`;
  const sl=S.slides[S.cur];
  const tabs=TABS.map(([id,en,ro])=>`<button type="button" class="pp-tab${S.tab===id?' on':''}" data-t="tab-${id}" aria-pressed="${S.tab===id}"><b>${en}</b><small>${ro}</small></button>`).join('');
  const rib=S.tab==='file'?'<span style="color:#777;padding:4px">Fila File deschide lista de mai jos.</span>':RIB[S.tab].map(([id,l,k])=>{
    if(k==='chk')return `<button type="button" class="pp-b${S.chk[id]?' on':''}" data-t="${id}" aria-pressed="${!!S.chk[id]}"><span class="bx">${S.chk[id]?'✓':''}</span>${l}</button>`;

    <div class="pp-row2"><button type="button" class="pp-b pp-prim" data-t="btn-save">Save</button><button type="button" class="pp-b" data-t="btn-cancel">Cancel</button></div></div>`:'';
  const ask=S.ask?`<div class="pp-dlg"><p>Want to save your changes? <small>(Salvezi modificările?)</small></p><div class="pp-row2"><button type="button" class="pp-b pp-prim" data-t="q-save">Save</button><button type="button" class="pp-b" data-t="q-dont">Don’t Save</button><button type="button" class="pp-b" data-t="q-cancel">Cancel</button></div></div>`:'';
  let main;
  if(S.show!==null){
    let ec;
    if(S.black)ec='<div class="pp-sh-negru" aria-label="Ecran negru"></div>';
    else if(S.show==='end')ec='<div class="pp-sh-negru">End of slide show, click to exit.<br>(Sfârșitul expunerii: Esc ca să ieși.)</div>';

    const nr=S.show==='end'?'sfârșitul expunerii':`diapozitivul ${S.show+1} din ${S.slides.length}`;

}

function render(Q,body,api){
  if(!document.getElementById('tip-ppt-css')){const s=document.createElement('style');s.id='tip-ppt-css';s.textContent=CSS;document.head.appendChild(s)}
  let S=init(Q);const n=Q.sarcini.length;
  body.innerHTML=`<div class="pp-root"><div class="pp-app"></div><div class="pp-msg" aria-live="polite"></div>
    <div class="pp-lista"><div class="lbl">Pașii tăi (se bifează singuri)</div><ol class="pp-pasi"></ol></div>
    <button type="button" class="btn ghost sm pp-reset">Ia-o de la capăt</button></div>`;
  const app=body.querySelector('.pp-app'),msg=body.querySelector('.pp-msg'),ol=body.querySelector('.pp-pasi');
  function side(){
    ol.innerHTML=Q.sarcini.map((s,i)=>`<li class="${i<S.step?'gata':i===S.step?'acum':''}">${s.ce}</li>`).join('');
    msg.innerHTML=S.msg?esc(S.msg):(S.step<n?'Fă pasul scris îngroșat în listă.':'Toți pașii sunt făcuți. Apasă „Verifică”.');
  }
  function draw(){app.innerHTML=appHTML(S);side()}
  function advance(ids){const s=Q.sarcini[S.step];if(s&&ids.includes(s.t)){S.step++;S.msg=`✓ ${strip(s.ce)}.`+(S.step===n?' Toți pașii sunt făcuți: apasă „Verifică”.':'');return true}return false}
  function gest(el){
    const ids=[];let p=el;while(p&&p!==app){if(p.dataset&&p.dataset.t)ids.push(p.dataset.t);p=p.parentElement}
    if(!ids.length)return;
    S.msg='';const r=act(S,ids[0]);
    if(r!==false&&!advance(r.concat(ids.slice(1)))&&!S.msg)S.msg=`Ai apăsat: ${label(ids[0])}.`;
    draw();
  }
  app.addEventListener('click',e=>{if(api.done()||e.target.closest('.pp-in'))return;const el=e.target.closest('[data-t]');if(el&&app.contains(el))gest(el)});
  app.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-t^="mini-"],[data-t^="obj-"]');if(!el||api.done())return;e.preventDefault();
    if(el.dataset.t.startsWith('obj-'))S.sel=el.dataset.t.slice(4);gest(el)});   // clic dreapta adevărat, pe calculator
  app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-t]')){e.preventDefault();gest(e.target)}});
  app.addEventListener('input',e=>{if(!e.target.classList.contains('pp-in'))return;S.nume=e.target.value;S.msg='';
    if(numeBun(S.nume)){if(!advance(['nume']))S.msg='Numele e bun.'}else S.msg='Un nume bun: subiect, clasă, nume, despărțite cu _ (fără spații).';side()});
  body.querySelector('.pp-reset').onclick=()=>{if(api.done())return;S=init(Q);draw()};
  draw();
  const nav=api.checkButton(()=>{
    if(S.step>=n){nav.innerHTML='';api.resolve(true);return}
    const s=Q.sarcini[S.step];
    api.resolve(false,`Ai făcut ${S.step} din ${n} pași. Urmează: ${strip(s.ce)}.${s.unde?' '+s.unde:''}`);
    api.revealButton(()=>{S=init(Q);draw();faPasii(Q,app,n);nav.innerHTML='';
      api.giveUp('pașii s-au făcut acum în simulator, unul câte unul: '+Q.sarcini.map(x=>strip(x.ce)).join(' → ')+'.')});
  });
}
function faPasii(Q,app,k){
  for(let i=0;i<k;i++){const s=Q.sarcini[i];
    for(const id of (s.drum||[s.t])){
      if(id==='nume'){const inp=app.querySelector('.pp-in');if(inp){inp.value=s.valoare||'Sahul_6A_Pop';inp.dispatchEvent(new Event('input',{bubbles:true}))}continue}
      const el=app.querySelector(`[data-t="${id}"]`);if(el)el.click();
    }}
}
function rezolva(Q,body){faPasii(Q,body.querySelector('.pp-app'),Q.sarcini.length)}
/* greșeala tipică: se oprește înainte de ultimul pas (de ex. deschide meniul, dar nu alege efectul) */
function gresit(Q,body){faPasii(Q,body.querySelector('.pp-app'),Q.sarcini.length-1)}
return {render,rezolva,gresit};

  {t:'match',q:'În PowerPoint, pe ce filă a panglicii cauți instrumentul?',pairs:[['Inserare','pui o imagine sau un tabel'],['Proiectare','alegi o temă pentru toată prezentarea'],['Pornire','adaugi un diapozitiv nou'],['Expunere diapozitive','pornești prezentarea pe tot ecranul']],ajutor:'Recitește lista filelor din pasul 4.',why:'Numele filei spune ce fel de instrumente are: pe Inserare adaugi obiecte, pe Proiectare schimbi aspectul întregii prezentări, pe Pornire lucrezi cu textul și diapozitivele, iar pe Expunere diapozitive arăți prezentarea publicului.'},
  {t:'tf',q:'Publicul vede pe ecran ce ai scris în zona de note.',ok:false,why:'Fals. Notele le vezi doar tu. De aceea acolo îți poți scrie explicațiile, fără să aglomerezi diapozitivul.'},
  {t:'classify',q:'E semnul unei prezentări bune sau al uneia slabe?',cats:['Bună','Slabă'],items:[['O idee principală pe diapozitiv',0],['Paragrafe întregi de text',1],['Litere mari, ușor de citit',0],['Cinci idei pe același diapozitiv',1],['O imagine care explică ideea',0]],why:'O prezentare bună se înțelege dintr-o privire: puțin text, litere mari și imagini care chiar explică ceva.'},
  {t:'choice',q:'Colegul tău lucrează în Google Slides, iar tu în PowerPoint. Ce e adevărat?',o:['Cele mai multe operații se fac la fel, doar butoanele arată puțin altfel','Aplicațiile nu au nimic în comun, fiecare face altceva','Google Slides nu are diapozitive, doar pagini de text','Doar PowerPoint poate face prezentări cu teme și efecte'],ok:0,ajutor:'Ultimul paragraf din pasul 4.',why:'Toate aplicațiile de prezentări lucrează cu diapozitive, obiecte, formatare și efecte. Dacă știi ce operație vrei, găsești butonul ei.'}
 ]},

/* ================= 2. Creez, salvez, închid (lecția 3) ================= */
{t:'Creez, salvez, închid',lectii:[3],continuturi:[P.gestionare],
 obiectiv:'creezi, deschizi, salvezi și închizi o prezentare, alegi formatul potrivit și îi dai un nume bun.',
 pasi:[
  {t:'Cinci operații cu fișierul',
   text:`<p>Orice prezentare e un <strong>fișier</strong>. Cu el faci mereu aceleași cinci <mark>operații de gestionare</mark>:</p>
<ul><li><strong>creare</strong>: o prezentare nouă, goală;</li><li><strong>deschidere</strong>: una salvată mai demult;</li><li><strong>salvare</strong>: scrii pe disc ce ai lucrat;</li><li><strong>salvare ca…</strong>: salvezi sub alt nume sau în alt format;</li><li><strong>închidere</strong>.</li></ul>
<p>Toate stau pe fila <strong>Fișier</strong> (File), prima din stânga: <i>New</i>, <i>Open</i>, <i>Save</i>, <i>Save As</i>, <i>Close</i>. Scurtături: <kbd>Ctrl</kbd>+<kbd>N</kbd> (nou), <kbd>Ctrl</kbd>+<kbd>O</kbd> (deschide), <kbd>Ctrl</kbd>+<kbd>S</kbd> (salvează).</p>`,
   exemplu:`<p>O oră de lucru la calculator:</p><ol><li><kbd>Ctrl</kbd>+<kbd>O</kbd>: deschizi „Vulcanii”, începută ieri;</li><li>lucrezi și apeși din când în când <kbd>Ctrl</kbd>+<kbd>S</kbd>;</li><li>la final: Fișier (File) → <i>Close</i>.</li></ol>`,
   altfel:`<p>Literele vin din engleză: <b>N</b> de la „new” (nou), <b>O</b> de la „open” (deschide), <b>S</b> de la „save” (salvează). E ca la un caiet: iei unul nou, deschizi unul vechi, scrii în el, îl închizi.</p>`,
   incearca:{t:'match',q:'Leagă scurtătura de operația ei.',pairs:[['Ctrl + N','prezentare nouă'],['Ctrl + O','deschiderea unei prezentări'],['Ctrl + S','salvare']],ajutor:'N = new, O = open, S = save.',why:'Literele vin din engleză: N de la „new” (nou), O de la „open” (deschide), S de la „save” (salvează).'},
   inca:[
    {t:'choice',q:'Vrei o prezentare nouă, goală. Ce apeși?',o:['Ctrl + N','Ctrl + O','Ctrl + S','Esc'],ok:0,ajutor:'„Nou” în engleză e „new”.',why:'Ctrl + N face o prezentare nouă. Ctrl + O deschide una existentă, Ctrl + S salvează.'}
   ]},
  {t:'Salvează des',
   text:`<p>Ce nu ai salvat se pierde dacă se oprește curentul sau se blochează calculatorul. Salvează <strong>des</strong>, nu doar la final: după fiecare diapozitiv terminat, <kbd>Ctrl</kbd>+<kbd>S</kbd>.</p>
<p>Prima dată când salvezi, aplicația te întreabă <strong>sub ce nume</strong> și <strong>unde</strong>. De atunci, <kbd>Ctrl</kbd>+<kbd>S</kbd> salvează în același fișier, fără să mai întrebe.</p>
<p><strong>Google Slides</strong> e o excepție: salvează singur, în Drive, cât lucrezi.</p>`,
   exemplu:`<p>Mihai a lucrat 40 de minute fără să salveze. S-a oprit curentul: a pierdut tot. Ioana a apăsat <kbd>Ctrl</kbd>+<kbd>S</kbd> după fiecare diapozitiv: a pierdut doar ultimele două minute.</p>`,
   incearca:{t:'choice',q:'Lucrezi de 20 de minute la prezentare. Ce apeși des, ca să nu pierzi munca?',o:['Ctrl + S','Ctrl + N','Ctrl + O','Esc'],ok:0,ajutor:'S = save (salvează).',why:'Ctrl + S scrie modificările pe disc. Ctrl + N face o prezentare nouă, iar Ctrl + O deschide una salvată, deci niciuna nu îți păstrează munca.'},
   inca:[
    {t:'tf',q:'Google Slides salvează singur prezentarea, în Drive.',ok:true,ajutor:'Ultimul paragraf al pasului.',why:'Adevărat. Google Slides salvează automat, cât lucrezi. PowerPoint și Impress așteaptă să salvezi tu.'},
    {t:'tf',q:'La a doua salvare cu Ctrl + S, aplicația te întreabă din nou numele fișierului.',ok:false,ajutor:'Doar prima salvare întreabă.',why:'Fals. Numele îl alegi o singură dată; apoi Ctrl + S salvează în același fișier, fără întrebări.'}
   ]},
  {t:'Salvare ca… și formatul',
   text:`<p><strong>Salvare ca…</strong> (Save As, tasta <kbd>F12</kbd>) te lasă să alegi alt nume sau alt <mark>format</mark>. Formatul e terminația de după punct și îl alegi după scop:</p>
<ul><li><code>.pptx</code> (PowerPoint) sau <code>.odp</code> (LibreOffice Impress), dacă vrei să mai <strong>modifici</strong> prezentarea;</li><li><code>.pdf</code>, dacă vrei să arate <strong>la fel pe orice calculator</strong>, doar de citit.</li></ul>
${fig('salvare-ca-formate','Fereastra Save As din PowerPoint cu lista Save as type deschisă; încadrate: PowerPoint Presentation .pptx, PDF .pdf și OpenDocument Presentation .odp','Salvare ca (Save As): în lista <b>Salvare cu tipul</b> (Save as type) alegi <code>.pptx</code>, <code>.pdf</code> sau, ultimul, <code>.odp</code>.')}`,
   exemplu:`<p><b>Salvare ca PDF, pas cu pas:</b></p><ol><li>Fișier (File) → <i>Save As</i> (sau <kbd>F12</kbd>);</li><li>alegi folderul;</li><li>scrii numele fișierului;</li><li>la <b>Save as type</b> alegi <code>.pdf</code>;</li><li>apeși <i>Save</i>.</li></ol><p>Fișierul <code>.pptx</code> rămâne și el pe disc, neschimbat: acum ai două fișiere.</p>`,
   altfel:`<p><code>.pptx</code> e ca aluatul: îl mai poți frământa. <code>.pdf</code> e prăjitura coaptă: arată la fel oriunde o duci, dar nu mai schimbi rețeta.</p>`,
   incearca:{t:'choice',q:'Trimiți prezentarea profesorului, care doar o citește. Vrei să arate exact ca la tine. Ce format alegi?',o:['.pdf','.pptx','.txt','.odp'],ok:0,ajutor:'Care format arată „la fel pe orice calculator”?',why:'Un PDF păstrează aspectul pe orice calculator, chiar dacă acolo lipsesc fonturile tale. Un fișier .pptx sau .odp se poate modifica, dar poate arăta altfel pe alt calculator.'},
   inca:[
    {t:'tf',q:'„Salvare ca…” te lasă să salvezi prezentarea sub alt nume sau în alt format.',ok:true,ajutor:'Prima propoziție a pasului.',why:'Adevărat. Salvarea simplă păstrează numele și formatul. „Salvare ca…” le poate schimba, de exemplu ca să faci și o copie PDF.'},
    {t:'classify',q:'Ce format alegi?',cats:['.pptx sau .odp','.pdf'],items:[['Vrei să mai lucrezi mâine la prezentare',0],['O trimiți bunicii, doar s-o vadă',1],['Colegul o continuă în LibreOffice Impress',0],['O pui pe site-ul școlii, ca să fie citită',1]],ajutor:'Mai modifică cineva prezentarea? Atunci nu PDF.',why:'Dacă prezentarea se mai modifică, rămâne .pptx sau .odp. Dacă doar se citește, PDF-ul o păstrează neschimbată.'}
   ]},
  {t:'Un nume bun pentru fișier',
   text:`<p>Dă fișierului un nume care spune <strong>ce</strong> conține și <strong>al cui</strong> e: subiectul, clasa, numele tău. Desparte cuvintele cu liniuța de jos <code>_</code>, fără spații: <code>Reciclare_6A_Popescu.pptx</code>. Un nume ca <code>final_bun_2.pptx</code> nu spune nimic peste o lună.</p>`,
   exemplu:`<p>În folderul clasei, printre 25 de fișiere:</p><ul><li><code>Prezentare1.pptx</code> — a cui e? despre ce?</li><li><code>Vulcani_6B_Ionescu.pptx</code> — se vede imediat.</li></ul>`,
   incearca:{t:'classify',q:'Nume bun sau nume slab pentru fișier?',cats:['Bun','Slab'],items:[['Reciclare_6A_Popescu.pptx',0],['final_final_2.pptx',1],['Prezentare1.pptx',1],['Vulcani_geografie_6B.pptx',0]],ajutor:'Spune numele subiectul și al cui e?',why:'Un nume bun spune subiectul și autorul sau clasa. Așa îți găsești fișierul și peste o lună, printre ale colegilor.'},
   inca:[
    {t:'choice',q:'Ce desparte cuvintele într-un nume bun de fișier?',o:['Liniuța de jos _','Un spațiu','Nimic, cuvintele stau lipite','Un punct'],ok:0,ajutor:'Uită-te la Reciclare_6A_Popescu.pptx.',why:'Liniuța de jos desparte cuvintele fără spații. Punctul e rezervat pentru format, de exemplu .pptx.'}
   ]},
  {t:'Închiderea prezentării',
   text:`<p>Când termini, <strong>închizi</strong>: Fișier (File) → <i>Close</i>.</p>
<p>Dacă ai modificări nesalvate, aplicația te întreabă ce faci cu ele. Ai trei butoane:</p>
<ul><li><i>Save</i>: le salvezi, apoi prezentarea se închide;</li><li><i>Don’t Save</i>: nu le salvezi, se pierd;</li><li><i>Cancel</i>: renunți la închidere și te întorci la lucru.</li></ul>`,
   exemplu:`<p>Ai mai adăugat un diapozitiv și apeși File → <i>Close</i>. Apare întrebarea. Vrei să-l păstrezi, deci apeși <i>Save</i>. Dacă e prima salvare, aplicația îți cere și numele fișierului.</p>`,
   incearca:{t:'choice',q:'Închizi prezentarea și aplicația te întreabă dacă salvezi modificările. Vrei să le păstrezi. Ce apeși?',o:['Save','Don’t Save','Cancel','Nimic, se salvează singure'],ok:0,ajutor:'Care buton „le salvează”?',why:'Save păstrează modificările. Don’t Save le aruncă, iar Cancel te întoarce la prezentare, fără să închidă.'},
   inca:[
    {t:'choice',q:'Ai apăsat Close din greșeală și vrei să mai lucrezi. Ce apeși la întrebare?',o:['Cancel','Don’t Save','Save','Esc de trei ori'],ok:0,ajutor:'Care buton „renunță la închidere”?',why:'Cancel oprește închiderea și te lasă să lucrezi mai departe. Don’t Save ar închide și ar pierde modificările.'}
   ]}
 ],

  intro:DZ_INTRO+'<p>Prezentarea „Șahul” e gata, iar profesorul vrea s-o citească pe telefon. <strong>Sarcina:</strong> salveaz-o ca PDF, cu un nume bun. În PowerPoint-ul adevărat, după <i>Save As</i> alegi întâi locul, apoi apare fereastra cu numele și tipul, ca aici.</p>',
  q:'Salvează prezentarea ca PDF, cu un nume bun.',
  sarcini:[{ce:'Deschide fila <b>File</b> (Fișier)',t:'tab-file'},{ce:'Alege <i>Save As</i> (Salvare ca)',t:'f-saveas'},
   {ce:'La <b>File name</b> scrie un nume bun: subiect, clasă, nume, cu _ între ele',t:'nume',unde:'De exemplu: Sahul_6A_Pop.'},{ce:'La <b>Save as type</b> alege <b>PDF</b>',t:'tip-pdf'},{ce:'Apasă <i>Save</i>',t:'salvat-pdf',drum:['btn-save']}],
  why:'Ai făcut exact drumul din PowerPoint: File → Save As → nume → tip → Save. Bara de sus arată acum numele fișierului nou.',

 qs:[
  {t:'choice',q:'Ce se întâmplă cu munca nesalvată dacă se oprește curentul?',o:['Se pierde','Se salvează singură în PowerPoint','Rămâne în bara de stare','Se mută în zona de note'],ok:0,why:'PowerPoint scrie pe disc doar când salvezi. De aceea salvezi des, cu Ctrl + S.'},
  {t:'match',q:'Leagă operația de ce face.',pairs:[['Salvare','scrie pe disc ce ai lucrat'],['Salvare ca…','alt nume sau alt format'],['Deschidere','aduce o prezentare salvată'],['Creare','o prezentare nouă, goală']],ajutor:'Lista din pasul 1.',why:'Fiecare operație are rolul ei; Salvare ca… e singura care schimbă numele sau formatul.'},
  {t:'choice',q:'Vrei ca bunica să vadă prezentarea exact ca la tine, pe calculatorul ei, fără s-o modifice. Ce format alegi?',o:['.pdf','.pptx','.odp','.txt'],ok:0,ajutor:'„La fel pe orice calculator.”',why:'PDF-ul arată la fel pe orice calculator și e făcut pentru citit, nu pentru modificat.'},
  {t:'tf',q:'Prima dată când salvezi o prezentare nouă, aplicația te întreabă sub ce nume o salvezi.',ok:true,why:'Adevărat. La prima salvare alegi numele și locul; apoi Ctrl + S salvează fără să mai întrebe.'},
  {t:'classify',q:'Nume bun sau nume slab?',cats:['Bun','Slab'],items:[['Plante_6A_Marin.pptx',0],['aaa.pptx',1],['Prezentare2.pptx',1],['Apa_in_natura_6C_Dinu.pptx',0]],why:'Numele bun spune subiectul, clasa și autorul. „aaa” și „Prezentare2” nu spun nimic.'},
  {t:'order',q:'Salvezi prezentarea ca PDF. Pune pașii în ordine.',items:['Deschizi fila Fișier (File)','Alegi Save As','Alegi tipul PDF la Save as type','Apeși Save'],ajutor:'Exemplul „Uite cum” din pasul 3.',why:'Întâi ajungi la fereastra Save As, alegi tipul, iar Save încheie.'}
 ]},

/* ================= 3. Diapozitive și obiecte (lecția 4) ================= */
{t:'Diapozitive și obiecte',lectii:[4],continuturi:[P.structura],
 obiectiv:'știi ce obiecte pui pe un diapozitiv, adaugi un diapozitiv cu aspectul potrivit și construiești structura unei prezentări.',
 pasi:[
  {t:'Pe diapozitiv așezi obiecte',
   text:`<p>Pe un diapozitiv nu scrii direct, ca pe o foaie. Așezi <mark>obiecte</mark>, fiecare în chenarul lui:</p>
<ul><li><mark>casete de text</mark> (și titlul stă tot într-o casetă);</li><li>imagini, forme (săgeți, stele), tabele;</li><li>sunete și legături (linkuri).</li></ul>
<p>Le găsești pe fila <strong>Inserare</strong> (Insert): <i>Pictures</i> (imagini), <i>Shapes</i> (forme), <i>Table</i> (tabel), <i>Text Box</i> (casetă de text), <i>Audio</i> (sunet), <i>Link</i> (legătură). Fiecare obiect se poate muta, mări și formata separat.</p>`,
   exemplu:`<p>Diapozitivul „Tabla și piesele” are patru obiecte:</p><ol><li>caseta de titlu: „Tabla și piesele”;</li><li>o casetă cu trei rânduri scurte;</li><li>o imagine cu tabla de șah;</li><li>o săgeată (o formă) care arată spre regină.</li></ol><p>Poți muta imaginea fără să miști textul.</p>`,
   incearca:{t:'tf',q:'Titlul unui diapozitiv stă tot într-o casetă de text.',ok:true,ajutor:'Citește paranteza din primul punct al listei.',why:'Adevărat. De aceea titlul se poate selecta, muta și formata la fel ca orice altă casetă.'},
   inca:[
    {t:'choice',q:'Pe ce filă găsești butonul Table (tabel)?',o:['Inserare (Insert)','Pornire (Home)','Animații (Animations)','Expunere diapozitive (Slide Show)'],ok:0,ajutor:'Un tabel e un obiect nou, pe care îl adaugi.',why:'Toate obiectele noi (tabele, imagini, forme) se adaugă de pe Inserare (Insert).'}
   ]},
  {t:'Diapozitiv nou și aspectul lui',
   text:`<p>Un diapozitiv nou îl adaugi de pe fila <strong>Pornire</strong> (Home), cu butonul <i>New Slide</i>.</p>
<p>Fiecare diapozitiv are un <mark>aspect</mark> (Layout): o machetă gata făcută, cu locuri pregătite pentru obiecte. Îl schimbi din Pornire (Home) → <i>Layout</i>:</p>
<ul><li><i>Title Slide</i>: diapozitivul de titlu;</li><li><i>Title and Content</i>: titlu și conținut (cel mai des folosit);</li><li><i>Two Content</i>: două conținuturi alăturate, bune pentru comparații;</li><li><i>Title Only</i>: doar titlu; <i>Blank</i>: gol.</li></ul>
${fig('aspect-machete','Butonul Layout din fila Home al PowerPoint, deschis, cu machetele Title Slide, Title and Content, Two Content încadrată, Comparison, Title Only, Blank','În PowerPoint: Pornire (Home) → <b>Aspect</b> (Layout). Aici e încadrată <i>Two Content</i>.')}`,
   exemplu:`<p>Vrei să arăți „tabla goală” și „tabla la începutul jocului”, una lângă alta:</p><ol><li>Pornire (Home) → <i>New Slide</i>;</li><li>Pornire (Home) → <i>Layout</i> → <i>Two Content</i>;</li><li>în stânga pui prima imagine, în dreapta a doua.</li></ol>`,
   incearca:{t:'choice',q:'Vrei să arăți „înainte” și „după”, una lângă alta. Ce aspect alegi?',o:['Two Content','Title Only','Blank','Title and Content'],ok:0,ajutor:'Care aspect are două conținuturi alăturate?',why:'Two Content are două zone de conținut puse alături: comparația se vede dintr-o privire.'},
   inca:[
    {t:'match',q:'Leagă aspectul de ce are pe el.',pairs:[['Title Only','doar titlu'],['Title and Content','titlu și conținut'],['Blank','nimic, e gol'],['Two Content','două conținuturi alăturate']],ajutor:'Lista din pas.',why:'Numele englezești spun chiar ce are macheta: „only” = doar, „blank” = gol, „two” = două.'}
   ]},
  {t:'Structura unei prezentări',
   text:`<p>O prezentare bună are o <mark>structură</mark>: părți puse într-o ordine care ajută publicul.</p>
<ol><li>diapozitivul de <strong>titlu</strong>: subiectul și autorul;</li><li><strong>cuprinsul</strong>: ce vei prezenta;</li><li><strong>conținutul</strong>: câte o idee pe diapozitiv;</li><li><strong>concluzia</strong>: ce trebuie să rețină publicul;</li><li><strong>sursele</strong>: de unde ai luat informațiile <em>și imaginile</em>.</li></ol>`,
   exemplu:`<p><b>Cum construiești structura, în 4 pași:</b></p><ol><li>Scrii pe o foaie ideile, fiecare pe un rând.</li><li>O idee = un diapozitiv de conținut.</li><li>Pui în față titlul și cuprinsul.</li><li>La final pui concluzia și sursele.</li></ol><p>„Șahul”: titlu · cuprins · tabla și piesele · cum mută piesele · cum câștigi · concluzie · surse = 7 diapozitive.</p>`,
   altfel:`<p>E ca la o compunere: are introducere, dezvoltare și încheiere. Titlul și cuprinsul sunt introducerea, diapozitivele de conținut sunt dezvoltarea, concluzia e încheierea. Sursele sunt ca lista de cărți de la finalul unui manual.</p>`,
   incearca:{t:'order',q:'Pune părțile unei prezentări în ordine.',items:['Titlul: subiectul și autorul','Cuprinsul','Conținutul: o idee pe diapozitiv','Concluzia','Sursele'],ajutor:'Lista numerotată din pas.',why:'Publicul află întâi despre ce e vorba, apoi urmărește ideile. La final vede ce trebuie să rețină și de unde ai luat informațiile.'},
   inca:[
    {t:'choice',q:'Ai 3 idei despre piesele de șah. Câte diapozitive de conținut faci pentru ele?',o:['3, câte unul pentru fiecare idee','1, cu toate ideile','Niciunul, le spui doar','6, câte două pentru fiecare idee'],ok:0,ajutor:'Pasul 2 al strategiei.',why:'O idee = un diapozitiv. Așa fiecare diapozitiv rămâne scurt și clar.'}
   ]},
 ],
 atelier:{t:'ppt',titlu:'Construiește un diapozitiv de comparație',
  intro:DZ_INTRO+'<p><strong>Sarcina:</strong> adaugă după diapozitivul 1 un diapozitiv nou, fă-l cu două conținuturi alăturate (pentru o comparație) și pune pe el un tabel.</p>',
  q:'Diapozitiv nou → aspect Two Content → un tabel.',
  sarcini:[{ce:'Adaugă un diapozitiv nou: Pornire (Home) → <i>New Slide</i>',t:'new-slide'},{ce:'Deschide lista <i>Layout</i>, tot pe Pornire (Home)',t:'layout'},{ce:'Alege aspectul <i>Two Content</i>',t:'lay-two'},
   {ce:'Deschide fila <b>Inserare</b> (Insert)',t:'tab-insert'},{ce:'Pune un tabel: <i>Table</i>',t:'ins-table'}],
  why:'Diapozitiv nou, aspect ales, obiect inserat: exact pașii din PowerPoint. Miniatura nouă a apărut în stânga, pe locul 2.',
  inca:[{t:'ppt',q:'Încă una: pe diapozitivul 3 („Cum câștigi”) adaugă o imagine și o casetă de text.',
   sarcini:[{ce:'Alege diapozitivul 3 din miniaturi',t:'mini-3'},{ce:'Deschide fila <b>Inserare</b> (Insert)',t:'tab-insert'},{ce:'Pune o imagine: <i>Pictures</i>',t:'ins-pictures'},{ce:'Pune o casetă de text: <i>Text Box</i>',t:'ins-textbox'}],
   why:'Fiecare obiect a apărut separat pe diapozitiv: le poți muta și formata unul câte unul.'}]},
 qs:[
  {t:'order',q:'Pune părțile unei prezentări în ordine.',items:['Titlul: subiectul și autorul','Cuprinsul','Conținutul: o idee pe diapozitiv','Concluzia','Sursele'],why:'Publicul află întâi despre ce e vorba, apoi urmărește ideile, iar la final vede ce trebuie să rețină și de unde ai luat informațiile.'},
  {t:'choice',q:'Vrei un diapozitiv cu un singur titlu mare, de exemplu „Întrebări?”, fără alt conținut. Ce aspect alegi?',o:['Title Only','Two Content','Comparison','Title and Content'],ok:0,ajutor:'„Only” înseamnă „doar”.',why:'Title Only are doar locul pentru titlu. Celelalte aspecte au și zone de conținut.'},
  {t:'classify',q:'Obiect pe diapozitiv sau parte a ferestrei aplicației?',cats:['Obiect pe diapozitiv','Parte a ferestrei'],items:[['Caseta de text',0],['Imaginea',0],['Tabelul',0],['Panglica',1],['Zona de note',1],['O formă (săgeată, stea)',0]],why:'Obiectele stau pe diapozitiv și le vede publicul. Panglica și zona de note țin de fereastra aplicației și sunt pentru tine.'},
  {t:'tf',q:'Fiecare obiect de pe diapozitiv se poate muta separat, fără să le miști pe celelalte.',ok:true,why:'Adevărat. Fiecare obiect are chenarul lui, deci îl muți, îl mărești și îl formatezi singur.'},
  {t:'tf',q:'Dacă o imagine e luată de pe internet, nu trebuie să scrii de unde e.',ok:false,ajutor:'Ce scrie pe ultimul diapozitiv, „sursele”?',why:'Fals. Sursele se trec și pentru imagini. Așa ești corect față de autorul lor, iar publicul poate verifica.'},

<script>
/* Excel pas cu pas (25.09.2026, pe site-ul de probă): învățare ATOMICĂ a Excel-ului adevărat, treaptă cu treaptă.
   Fiecare nivel = o pagină scurtă + sarcini făcute într-o foaie care se poartă ca Excel (tip-excel.js):
   clic pe celulă, tras cu mouse-ul, scris direct în celulă, Enter/Tab/săgeți, clic pe celulă în formulă, F4,
   tras de colț, setări RO/EN. Unde gestul e esența treptei, sarcina îl cere (verifica.gest). */
// conținuturile din programă (aceleași texte ca în Misiunea Analist, unitatea VIII-U1)
const P={
  interfata:'Elemente de interfaţă ale unei aplicaţii de calcul tabelar',
  structura:'Structura unui registru de calcul (foaie de calcul, coloană, rând, celulă, adresă de celulă)',
  editare:'Operaţii de editare (selectare, copiere, mutare, ştergere)',
  tipuri:'Tipuri de date: numeric, text, dată calendaristică',
  formule:'Formule de calcul care utilizează operatori aritmetici (+, -,*, /)',
  functii:'Funcții specifice aplicaţiei de calcul tabelar pentru sumă, maxim, minim, medie aritmetică şi decizie',
  randuri:'Operații de formatare a rândurilor/coloanelor',
  celule:'Operații de formatare a celulelor (aliniere conținut, borduri, culori de umplere, stiluri predefinite)',
  sortare:'Sortarea crescătoare/descrescătoare a datelor dintr-un tabel după unul sau mai multe criterii',
  grafice:'Grafice: tipuri de grafice',
  serii:'Serii de date'
};
const CLASA={A1:'Elev',B1:'Clasa',C1:'Media',A2:'Dan',B2:'VIII A',C2:7.5,A3:'Ana',B3:'VIII B',C3:9.25,A4:'Elena',B4:'VIII A',C4:8.5,A5:'Bogdan',B5:'VIII B',C5:6.75,A6:'Carmen',B6:'VIII A',C6:9.25};
const TEMP={A1:'Ziua',B1:'Grade',A2:'Luni',B2:14,A3:'Marți',B3:17,A4:'Miercuri',B4:12,A5:'Joi',B5:19,A6:'Vineri',B6:21,A7:'Sâmbătă',B7:18};
const BANI={A1:'Cheltuială',B1:'Lei',A2:'Mâncare',B2:40,A3:'Transport',B3:15,A4:'Rechizite',B4:25,A5:'Distracție',B5:20};
const NOTE={A1:'Elev',B1:'Nota 1',C1:'Nota 2',A2:'Ana',B2:8,C2:9,A3:'Bogdan',B3:5,C3:6,A4:'Carmen',B4:10,C4:9,A5:'Dan',B5:7,C5:4,A6:'Elena',B6:6,C6:8};
const MAG={A1:'Produs',B1:'Preț',C1:'Bucăți',D1:'Total',A2:'Caiet',B2:4,C2:3,A3:'Pix',B3:2,C3:5,A4:'Riglă',B4:6,C4:2,A5:'Gumă',B5:1,C5:4};
const LEVELS=[
{t:'Foaia, celula și adresa',lectii:[2],continuturi:[P.interfata,P.structura],text:`
<p>Foaia de calcul e o grilă: <mark>coloanele</mark> au litere (A, B, C…), <mark>rândurile</mark> au numere (1, 2, 3…). La întâlnirea lor e o <strong>celulă</strong>, cu <strong>adresa</strong> literă + număr: <code>C4</code>.</p>
<p>Un clic pe celulă o <mark>alege</mark>. Adresa ei apare în <strong>caseta de nume</strong> (Name Box), în stânga barei <em>fx</em>. Capul coloanei și al rândului se colorează.</p>
<p>Ca să alegi mai multe celule odată, <mark>apeși pe prima și tragi</mark> până la ultima. Zona se scrie <code>B2:D2</code> (de la B2 până la D2). Cât tragi, caseta de nume arată mărimea ei, de exemplu <code>1R x 3C</code> (1 rând, 3 coloane). După ce ridici degetul, Excel arată acolo doar <strong>celula activă</strong>: cea din care ai pornit, rămasă albă în zonă. (Google Sheets arată în schimb toată zona: <code>B2:D2</code>.)</p>
<p>Jos, bara de stare îți arată singură suma, media și câte celule ai ales. Tot acolo, în stânga, scrie ce face Excel acum: <em>Gata</em> (Ready), <em>Introducere</em> (Enter), <em>Editare</em> (Edit).</p>`,
qs:[
 {t:'excel',q:'Alege celula <b>C4</b>. Uită-te apoi în caseta de nume din stânga.',cols:5,rows:6,cells:NOTE,verifica:{sel:'C4'},why:'Coloana C, rândul 4. Caseta de nume arată mereu unde ești: C4.'},
 {t:'excel',q:'Alege celula de la întâlnirea <b>coloanei B</b> cu <b>rândul 6</b>.',cols:5,rows:6,cells:NOTE,verifica:{sel:'B6'},why:'Litera coloanei vine prima, apoi numărul rândului: B6.'},
 {t:'excel',q:'Selectează cele două note ale Anei: apasă pe <b>B2</b> și trage până la <b>C2</b>. Privește bara de jos: ce sumă arată?',cols:5,rows:6,cells:NOTE,verifica:{zona:'B2:C2'},why:'Zona B2:C2. Bara de stare arată singură suma notelor (17) și media lor.'},
 {t:'excel',q:'Încearcă tu: selectează în foaie de la <b>B2</b> până la <b>C4</b>. Ce arată caseta de nume <b>după</b> ce ridici degetul de pe mouse?',cols:5,rows:6,cells:NOTE,o:['B2','B2:C4','C4','3R x 2C'],ok:0,why:'În Excel, după selectare, caseta de nume arată celula activă, B2 (cea din care ai pornit). Cât tragi, arată 3R x 2C. Google Sheets ar arăta B2:C4.'}
]},
{t:'Bula de ajutor și setările calculatorului',lectii:[7,8],continuturi:[P.formule,P.functii],text:`
<p>Când scrii o funcție, Excel te ajută de două ori. Întâi, după primele litere (<code>=SU</code>) apare o <mark>listă de funcții</mark>. Cu săgețile alegi, iar <kbd>Tab</kbd> o completează: <code>=SUM(</code>.</p>
<p>Apoi, sub bara de formule apare <mark>bula de ajutor</mark>: <code>SUM(number1; [number2]; …)</code>. Îți arată ce părți are funcția, iar partea pe care o scrii acum e îngroșată. Ce e între paranteze drepte <code>[ ]</code> poți să nu scrii.</p>
<p>Bula îți mai spune ceva important: <strong>semnul dintre părți</strong>. Pe calculatoarele cu Windows în română e <code>;</code>. Pe cele în engleză e <code>,</code>. Semnul greșit dă eroare. Deci, la un calculator nou, întâi scrii <code>=SUM(</code> și te uiți la bulă.</p>`,
qs:[
 {t:'excel',q:'Încearcă: alege <b>B7</b> și scrie <code>=SUM(</code>. Citește bula de sub bara de formule. Apoi apasă sus pe <b>EN</b> și iar pe <b>RO</b>. Ce semn desparte părțile pe setările <b>RO</b>?',cols:4,rows:8,cells:NOTE,mod:'ro',o:['; (punct și virgulă)',', (virgulă)','. (punct)',': (două puncte)'],ok:0,why:'Pe setări românești părțile se despart cu ;. Bula îți arată asta de fiecare dată: SUM(number1; [number2]; …).'},
 {t:'excel',q:'În <b>B7</b> fă suma notelor 1 lăsând Excel să scrie numele funcției: scrie doar <code>=SU</code>, apasă <kbd>Tab</kbd> (apare <code>=SUM(</code>), trage peste B2:B6 și apasă <kbd>Enter</kbd>. Paranteza de la final o pune Excel singur.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},mod:'ro',verifica:{formule:{B7:'=SUM(B2:B6)'},gest:['autocompletare']},why:'Tab completează funcția aleasă din listă. La Enter, Excel închide singur paranteza uitată.'},
 {t:'excel',q:'Același lucru pe un calculator cu setări <b>EN</b> (butonul e deja apăsat): în <b>C7</b> calculează <b>media</b> notelor 2. Uită-te în bulă ce semn cere.',cols:4,rows:8,cells:{...NOTE,A7:'Media'},mod:'en',verifica:{formule:{C7:'=AVERAGE(C2:C6)'}},why:'=AVERAGE(C2:C6). Aici e o singură parte, deci semnul contează abia când sunt mai multe (IF, ROUND).'},
 {t:'choice',q:'Ai ajuns la un calculator nou din laborator. Care e cel mai sigur mod de a afla dacă Excel vrea <code>;</code> sau <code>,</code>?',o:['Scrii =SUM( și citești bula','Încerci la întâmplare','Întrebi colegul de bancă','Te uiți în fila Pornire'],ok:0,why:'Bula care apare după =SUM( arată exact semnul folosit pe acel calculator.'}
]},
{t:'Scriu și modific date',lectii:[4,5],continuturi:[P.editare,P.tipuri],text:`
<p>Alegi celula și <mark>începi direct să scrii</mark>. Nu trebuie să apeși întâi în bara de formule. Ce scrii apare și în celulă, și în bara <em>fx</em>.</p>
<p><kbd>Enter</kbd> pune ce ai scris și te duce <strong>în jos</strong>. <kbd>Tab</kbd> te duce <strong>la dreapta</strong>. Săgețile te mută. <kbd>Esc</kbd> renunță.</p>
<p>Excel își dă seama singur ce ai scris: <mark>numerele stau la dreapta</mark>, textul la stânga. Pe calculatoarele cu setări românești zecimalele se scriu cu <strong>virgulă</strong> (<code>7,5</code>). Cu punct (<code>7.5</code>) Excel crede că e o dată: 7 mai (<code>07.mai</code>).</p>
<p>Scrii peste o celulă plină și o înlocuiești. <kbd>F2</kbd> (sau dublu-clic) te lasă să modifici doar o parte. <kbd>Delete</kbd> golește celula.</p>`,
qs:[
 {t:'excel',q:'Scrie capul de tabel: în <b>A1</b> scrie <code>Elev</code>, apoi <kbd>Tab</kbd>, și în <b>B1</b> scrie <code>Nota</code>. Începe direct să tastezi pe celulă.',cols:4,rows:4,cells:{},verifica:{valori:{A1:'Elev',B1:'Nota'},gest:['tastat-in-celula']},why:'Alegi celula și tastezi. Tab trece la dreapta, Enter în jos.'},
 {t:'excel',q:'Setările sunt <b>RO</b>. Scrie nota <b>9</b> în B2 și nota <b>7,5</b> în B3 (cu virgulă!).',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A2:'Ana',A3:'Bogdan'},mod:'ro',verifica:{valori:{B2:9,B3:7.5}},why:'Pe setări românești, 7,5 cu virgulă e număr și stă la dreapta. 7.5 cu punct ar deveni data 07.mai.'},
 {t:'excel',q:'Nota lui Bogdan e greșită: în <b>B3</b> scrie <b>8</b> peste ce e acolo.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A2:'Ana',B2:9,A3:'Bogdan',B3:3},verifica:{valori:{B3:8}},why:'Alegi celula și scrii peste: vechea valoare dispare.'},
 {t:'excel',q:'În <b>C3</b> a rămas un cuvânt scris din greșeală. Golește celula: alege-o și apasă <kbd>Delete</kbd>.',cols:4,rows:4,cells:{A1:'Elev',B1:'Nota',A3:'Bogdan',B3:8,C3:'greșit'},verifica:{gol:['C3']},why:'Delete golește celulele alese, fără să le mute pe celelalte.'},
 {t:'choice',q:'Pe un calculator cu setări românești ai scris <code>7.5</code>, iar în celulă a apărut <code>07.mai</code>. Ce s-a întâmplat?',o:['Excel l-a luat drept dată (7 mai)','E un număr cu formatare specială','Excel l-a rotunjit la 8','Celula e prea îngustă'],ok:0,why:'Pe setări românești punctul desparte ziua de lună, așa că 7.5 devine data 7 mai. Zecimalele se scriu cu virgulă: 7,5.'},
]},
{t:'Tabelul arată bine: formatarea',lectii:[6],continuturi:[P.celule,P.randuri],text:`
<p>Formatarea schimbă <strong>cum arată</strong> celulele, nu ce e în ele. Întâi <mark>selectezi</mark>, apoi apeși butonul din fila <strong>Pornire (Home)</strong> a panglicii.</p>
<p>Capul de tabel se face <strong>aldin</strong> (<kbd>Ctrl</kbd>+<kbd>B</kbd>) și primește o <strong>culoare de umplere</strong> (Fill Color). <strong>Bordurile</strong> (Borders → All Borders) desenează liniile tabelului. <strong>Alinierea</strong> așază conținutul în celulă.</p>
<p>Formatul numerelor schimbă doar afișarea: <code>0,19</code> cu <strong>Procent</strong> (Percentage) apare <code>19%</code>, iar cu <strong>Monedă</strong> (Currency) apare <code>0,19 lei</code>. Butoanele <code>.0→.00</code> și <code>.00→.0</code> adaugă sau scot zecimale. Valoarea rămâne aceeași: se vede în bara fx.</p>
<p><strong>Îmbină și centrează</strong> (Merge &amp; Center) face din mai multe celule una singură, bună pentru un titlu deasupra tabelului.</p>`,
qs:[
 {t:'excel',q:'Fă capul de tabel <b>A1:C1</b> aldin și pune-i o culoare de umplere (Pornire → B și 🪣 Umplere).',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C1':{b:true,fill:true}}},why:'Selectezi A1:C1 trăgând, apoi B (aldin) și o culoare de umplere. Doar capul de tabel, nu tot tabelul.'},
 {t:'excel',q:'Pune borduri pe tot tabelul <b>A1:C6</b>: selectează-l și alege ▦ Borduri → Toate bordurile (All Borders).',cols:4,rows:7,cells:NOTE,verifica:{format:{'A1:C6':{bd:'all'}}},why:'Toate bordurile desenează liniile fiecărei celule din zonă. Pe hârtie, tabelul arată abia așa ca un tabel.'},
 {t:'excel',q:'Centrează notele din <b>B2:C6</b> (butonul ≡ de centrare).',cols:4,rows:7,cells:NOTE,verifica:{format:{'B2:C6':{al:'center'}}},why:'Alinierea la centru se pune doar pe zona cu note, selectată trăgând.'},
 {t:'excel',q:'Cotele de TVA din <b>C2:C4</b> sunt scrise ca zecimale (0,19). Fă-le să apară ca <b>procente</b>, fără zecimale.',cols:4,rows:5,cells:{A1:'Produs',B1:'Preț',C1:'Cota TVA',A2:'Caiet',B2:4,C2:0.19,A3:'Pâine',B3:3,C3:0.09,A4:'Carte',B4:30,C4:0.05},verifica:{format:{'C2:C4':{nf:'percent',dec:0}}},why:'Formatul Procent înmulțește afișarea cu 100: 0,19 apare 19%. Valoarea din celulă rămâne 0,19.'},
 {t:'excel',q:'Titlul din <b>A1</b> trebuie să stea deasupra întregului tabel: îmbină și centrează <b>A1:C1</b>.',cols:4,rows:6,cells:{A1:'Situația la informatică',A2:'Elev',B2:'Nota 1',C2:'Nota 2',A3:'Ana',B3:8,C3:9,A4:'Bogdan',B4:5,C4:6},verifica:{imbinat:'A1:C1'},why:'Merge & Center unește A1:C1 într-o singură celulă și pune titlul la mijloc.'},
 {t:'excel',q:'Încearcă: alege <b>D2</b> (media 8,5) și apasă de câteva ori <code>.00→.0</code>, apoi <code>.0→.00</code>. Uită-te și în bara fx. Ce se schimbă?',cols:5,rows:4,cells:{A1:'Elev',B1:'Nota 1',C1:'Nota 2',D1:'Media',A2:'Ana',B2:8,C2:9,D2:'=(B2+C2)/2',A3:'Bogdan',B3:5,C3:6,D3:'=(B3+C3)/2'},o:['Doar afișarea; valoarea rămâne 8,5','Valoarea se rotunjește de-adevăratelea','Se schimbă formula','Nu se schimbă nimic'],ok:0,why:'Butoanele de zecimale schimbă doar cum arată numărul. În calcule Excel folosește tot valoarea întreagă, 8,5.'}
]},
{t:'Prima formulă',lectii:[7],continuturi:[P.formule],text:`
<p>O <strong>formulă</strong> începe mereu cu <mark>=</mark>. Folosește <strong>adresele</strong> celulelor, nu numerele din ele: <code>=B2+C2</code>. Așa, când schimbi o notă, rezultatul se refac singur.</p>
<p>Truc de Excel: după <code>=</code> (sau după <code>+</code>, <code>*</code>…) <mark>apeși pe celulă</mark> și adresa ei intră singură în formulă. Nu mai greșești adresa.</p>
<p>Semnele: <code>+</code> adunare, <code>-</code> scădere, <code>*</code> înmulțire, <code>/</code> împărțire, <code>^</code> putere. <kbd>Enter</kbd> arată rezultatul în celulă. Formula o vezi în bara <em>fx</em>.</p>`,
qs:[
 {t:'excel',q:'În <b>D2</b> calculează suma notelor Anei. Scrie <code>=</code>, <b>apasă pe B2</b>, scrie <code>+</code>, <b>apasă pe C2</b>, apoi <kbd>Enter</kbd>.',cols:5,rows:6,cells:{...NOTE,D1:'Suma'},verifica:{formule:{D2:'=B2+C2'},gest:['clic-adresa']},why:'=B2+C2 folosește adresele: dacă schimbi o notă, suma se refac singură.'},
 {t:'excel',q:'La magazinul clasei: în <b>D2</b> calculează totalul pentru caiete, adică preț × bucăți.',cols:5,rows:6,cells:MAG,verifica:{formule:{D2:'=B2*C2'}},why:'Înmulțirea se scrie cu steluță: =B2*C2.'},
 {t:'excel',q:'În <b>D3</b> calculează cu cât e mai mare Nota 2 decât Nota 1 la Bogdan (Nota 2 minus Nota 1).',cols:5,rows:6,cells:{...NOTE,D1:'Diferență'},verifica:{formule:{D3:'=C3-B3'}},why:'=C3-B3: întâi Nota 2, apoi scazi Nota 1.'},
 {t:'choice',q:'Care dintre acestea se recalculează singură când schimbi nota din B2?',o:['=B2+C2','=8+9','B2+C2','17'],ok:0,why:'Doar formula cu = și cu adrese se refac singură. =8+9 are numerele scrise de mână, iar fără = e doar text.'}
]},
{t:'Copiez formula trăgând de colț',lectii:[4,7],continuturi:[P.editare,P.formule],text:`
<p>Celula aleasă are în colțul din dreapta-jos un <mark>pătrățel verde</mark> (<em>fill handle</em>). Îl apuci cu mouse-ul și <strong>tragi în jos</strong>: formula se copiază în celulele de dedesubt.</p>
<p>La copiere, Excel <mark>mută adresele</mark>: <code>=B2*C2</code> din D2 devine <code>=B3*C3</code> în D3, <code>=B4*C4</code> în D4. Se numesc <strong>adrese relative</strong>: țin minte „cu un rând mai jos”, nu o celulă anume.</p>
<p>Așa calculezi o coloană întreagă scriind o singură formulă.</p>`,
qs:[
 {t:'excel',q:'În <b>D2</b> scrie <code>=B2*C2</code>, apoi alege iar D2 și <b>trage de pătrățelul verde</b> până la <b>D5</b>.',cols:5,rows:6,cells:MAG,verifica:{formule:{D2:'=B2*C2'},umplut:{D2:['D3','D4','D5']},gest:['umple']},why:'O formulă, trasă în jos, calculează toată coloana. Adresele se mută singure: B3*C3, B4*C4, B5*C5.'},
 {t:'excel',q:'Încearcă tu: în D2 e deja <code>=B2*C2</code>. Trage-o până la D5, apoi alege <b>D5</b> și citește bara de formule. Ce formulă a ajuns acolo?',cols:5,rows:6,cells:{...MAG,D2:'=B2*C2'},o:['=B5*C5','=B2*C2','=B2*C5','=D2*5'],ok:0,why:'Adresele relative coboară cu câte un rând: din rândul 2 în rândul 5.'},
 {t:'excel',q:'Altă cale, din tastatură: selectează de la <b>D2</b> până la <b>D5</b> (D2 are deja formula) și apasă <kbd>Ctrl</kbd>+<kbd>D</kbd>. Formula se copiază în jos, ca la tragere.',cols:5,rows:6,cells:{...MAG,D2:'=B2*C2'},verifica:{formule:{D2:'=B2*C2'},umplut:{D2:['D3','D4','D5']},gest:['ctrl-d']},why:'Ctrl+D (Down) copiază primul rând al selecției în toate rândurile de dedesubt. Ctrl+R face la fel, la dreapta.'},
 {t:'excel',q:'În <b>D2</b> e deja media notelor Anei. Copiaz-o pentru toți elevii: alege D2 și trage de colț până la <b>D6</b>.',cols:5,rows:6,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2'},verifica:{formule:{D2:'=(B2+C2)/2'},umplut:{D2:['D3','D4','D5','D6']},gest:['umple']},why:'Tragerea copiază formula în jos. Fiecare rând își calculează media lui.'}
]},
{t:'Funcții: SUM, AVERAGE, MIN, MAX',lectii:[8],continuturi:[P.functii],text:`
<p>O <strong>funcție</strong> face un calcul gata pregătit pe o <mark>zonă</mark> de celule: <code>=SUM(B2:B6)</code> adună de la B2 până la B6.</p>
<p>Numele funcțiilor sunt <mark>în engleză</mark>, și pe Excel-ul în română: <code>SUM</code> (suma), <code>AVERAGE</code> (media), <code>MIN</code> (cea mai mică valoare), <code>MAX</code> (cea mai mare). Cu un nume românesc (<code>SUMA</code>) Excel arată eroarea <code>#NAME?</code>.</p>
<p>Truc: scrii <code>=SUM(</code> și <mark>tragi cu mouse-ul</mark> peste celule. Zona intră singură în formulă. Închizi paranteza și apeși <kbd>Enter</kbd>.</p>`,
qs:[
 {t:'excel',q:'În <b>B7</b> calculează suma notelor 1: scrie <code>=SUM(</code>, apoi <b>trage cu mouse-ul de la B2 la B6</b>, scrie <code>)</code> și <kbd>Enter</kbd>.',cols:4,rows:8,cells:{...NOTE,A7:'Suma'},verifica:{formule:{B7:'=SUM(B2:B6)'},gest:['zona-mouse']},why:'=SUM(B2:B6) adună toată zona. Zona trasă cu mouse-ul nu poate fi greșită.'},
 {t:'excel',q:'În <b>B7</b> calculează <b>media</b> notelor 1 ale clasei.',cols:4,rows:8,cells:{...NOTE,A7:'Media'},verifica:{formule:{B7:'=AVERAGE(B2:B6)'}},why:'Media se face cu AVERAGE: =AVERAGE(B2:B6).'},
 {t:'excel',q:'Nota cea mai mare în <b>C7</b>, nota cea mai mică în <b>C8</b> (din coloana Nota 2).',cols:4,rows:8,cells:{...NOTE,A7:'Maxim',A8:'Minim'},verifica:{formule:{C7:'=MAX(C2:C6)',C8:'=MIN(C2:C6)'}},why:'=MAX(C2:C6) găsește cea mai mare notă, =MIN(C2:C6) pe cea mai mică.'},
 {t:'choice',q:'Pe un Excel în limba română scrii <code>=SUMA(B2:B6)</code>. Ce se întâmplă?',o:['Apare eroarea #NAME?','Adună normal, ca SUM','Apare eroarea #DIV/0!','O traduce singur în SUM'],ok:0,why:'Excel păstrează numele englezești ale funcțiilor și în română. Un nume necunoscut dă #NAME?.'}
]},
{t:'Decizii cu IF și setările calculatorului',lectii:[9],continuturi:[P.functii],text:`
<p><code>IF</code> alege între două rezultate după o condiție: <code>=IF(B2>=5,"admis","respins")</code>. Dacă nota e cel puțin 5, scrie „admis”, altfel „respins”. Textul se pune între ghilimele drepte <code>"…"</code>.</p>
<p>Atenție la <mark>setările calculatorului</mark>. Pe Windows în română părțile funcției se despart cu <strong>punct și virgulă</strong>: <code>=IF(B2>=5;"admis";"respins")</code>. Pe Windows în engleză se despart cu <strong>virgulă</strong>. Cu semnul greșit, Excel arată fereastra „There's a problem with this formula”.</p>
<p>Cum afli ce setări are calculatorul? Scrii <code>=SUM(</code>, iar Excel îți arată în bulă semnul: <code>SUM(number1; [number2]…)</code> sau cu virgulă.</p>`,
qs:[
 {t:'excel',q:'Setările sunt <b>RO</b>. În <b>D2</b> scrie verdictul Anei cu IF: „admis” dacă Nota 1 e cel puțin 5, altfel „respins”. Apoi trage până la <b>D6</b>.',cols:5,rows:6,cells:{...NOTE,D1:'Verdict'},mod:'ro',verifica:{formule:{D2:'=IF(B2>=5,"admis","respins")'},umplut:{D2:['D3','D4','D5','D6']}},why:'Pe setări românești: =IF(B2>=5;"admis";"respins"), cu punct și virgulă între părți.'},
 {t:'choice',q:'Calculatorul din laborator are setări românești. Care formulă o primește Excel fără eroare?',o:['=IF(B2>=5;"admis";"respins")','=IF(B2>=5,"admis","respins")','=IF(B2>=5;„admis”;„respins”)','=DACA(B2>=5;"admis";"respins")'],ok:0,why:'Pe setări românești: punct și virgulă între părți, ghilimele drepte, iar numele funcției în engleză (IF).'},
 {t:'choice',q:'Cum afli repede dacă Excel-ul de pe calculator vrea <code>;</code> sau <code>,</code> între părți?',o:['Scrii =SUM( și citești bula de ajutor','Te uiți la tastatură','Excel scrie singur semnul bun','Deschizi fila Pornire (Home)'],ok:0,why:'Bula care apare după =SUM( arată semnul folosit pe acel calculator: SUM(number1; …) sau SUM(number1, …).'}
]},
{t:'Ordine în tabel: sortarea',lectii:[10],continuturi:[P.sortare],text:`
<p><strong>Sortarea</strong> pune rândurile în ordine după o coloană: <strong>crescător</strong> (A→Z, de la mic la mare) sau <strong>descrescător</strong> (Z→A, de la mare la mic). Fila <strong>Date (Data)</strong>.</p>
<p>Regula de aur: <mark>alegi o singură celulă din coloana după care sortezi</mark> (sau tot tabelul), niciodată doar o coloană. Excel mută rândurile întregi, deci fiecare elev rămâne cu notele lui. Dacă selectezi doar o coloană, Excel te avertizează (Sort Warning). Atunci alegi <strong>Extinde selecția</strong>.</p>
<p>După <mark>două criterii</mark> (de exemplu întâi clasa, apoi media) folosești <strong>Sortare particularizată (Custom Sort)</strong>. Acolo bifezi „Datele mele au antet” și adaugi niveluri.</p>`,
qs:[
 {t:'excel',q:'Ordonează elevii de la <b>cea mai mare medie</b> la cea mai mică: alege o celulă din coloana <b>Media</b> și Date → <b>Z→A</b>.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'C',ord:'desc'}]}},why:'Z→A pe coloana Media, cu o singură celulă aleasă: Excel ia singur tot tabelul și mută rândurile întregi.'},
 {t:'excel',q:'Pune elevii în <b>ordine alfabetică</b> (coloana Elev, A→Z).',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'A',ord:'asc'}]}},why:'A→Z pe coloana Elev. Capul de tabel rămâne sus, pentru că Excel vede că e antet.'},
 {t:'excel',q:'Întâi pe clase (A→Z), iar în fiecare clasă de la media cea mai mare. Folosește <b>Sortare particularizată (Custom Sort)</b> cu două niveluri.',cols:4,rows:7,cells:CLASA,verifica:{sortat:{zona:'A1:C6',dupa:[{col:'B',ord:'asc'},{col:'C',ord:'desc'}]},gest:['sortare-dlg']},why:'Nivelul 1: Clasa, crescător. Nivelul 2 (Add Level): Media, descrescător. Așa VIII A vine prima, cu elevii ordonați după medie.'},
 {t:'excel',q:'Încearcă ce NU trebuie făcut: selectează doar <b>C2:C6</b> (mediile) și apasă Z→A. Citește avertismentul și alege „Continuă cu selecția curentă”. Ce s-a întâmplat?',cols:4,rows:7,cells:CLASA,o:['Mediile s-au mutat, dar numele au rămas pe loc: s-au amestecat','Totul s-a sortat corect','Excel a șters mediile','Nu s-a întâmplat nimic'],ok:0,why:'Sortând doar o coloană, fiecare elev primește media altcuiva. De aceea alegi „Extinde selecția” sau sortezi dintr-o singură celulă.'}
]},
{t:'Graficul potrivit',lectii:[11,12],continuturi:[P.grafice,P.serii],text:`
<p>Un <strong>grafic</strong> arată numerele ca desen. Selectezi datele <mark>împreună cu etichetele</mark> (numele și capul de tabel), apoi fila <strong>Inserare (Insert)</strong>.</p>
<p>Alegi tipul după întrebare. <strong>Coloane</strong> (Column) compară valori între ele: notele elevilor. <strong>Linie</strong> (Line) arată cum se schimbă ceva în timp: temperatura pe zile. <strong>Radială</strong> (Pie) arată părțile unui întreg: din ce e făcut bugetul.</p>
<p>O <mark>serie de date</mark> e un șir de numere din aceeași coloană. Fiecare serie are culoarea ei și apare în legendă. La final, dai clic pe titlu și îl scrii.</p>`,
qs:[
 {t:'excel',q:'Fă un grafic <b>cu coloane</b> din notele elevilor: selectează <b>A1:B6</b> și Inserare → Coloane (Column).',cols:4,rows:7,cells:NOTE,verifica:{grafic:{tip:'column',zona:'A1:B6'}},why:'Coloanele compară valorile. Zona A1:B6 are numele (etichetele) și notele (seria).'},
 {t:'excel',q:'Temperatura pe zile: fă un grafic <b>linie</b> din <b>A1:B7</b> și scrie titlul <code>Temperatura pe zile</code>.',cols:4,rows:8,cells:TEMP,verifica:{grafic:{tip:'line',zona:'A1:B7',titlu:'Temperatura pe zile'}},why:'Linia arată cum urcă și coboară valorile de la o zi la alta. Titlul spune ce vedem.'},
 {t:'excel',q:'Bugetul pe o săptămână: fă un grafic <b>radial</b> (Pie) din <b>A1:B5</b>, cu titlul <code>Cheltuieli</code>.',cols:4,rows:6,cells:BANI,verifica:{grafic:{tip:'pie',zona:'A1:B5',titlu:'Cheltuieli'}},why:'Graficul radial arată cât din întreg înseamnă fiecare parte.'},
 {t:'choice',q:'Vrei să arăți cum a crescut numărul de elevi de la un an la altul, pe 5 ani. Ce grafic alegi?',o:['Linie (Line)','Radial (Pie)','Niciun grafic','Doar un tabel'],ok:0,why:'Pentru schimbarea în timp alegi linia. Radialul e pentru părțile unui întreg.'},
 {t:'excel',q:'Încearcă: selectează <b>A1:C6</b> (două coloane de note) și fă un grafic cu coloane. Câte serii de date (culori în legendă) are?',cols:4,rows:7,cells:NOTE,o:['2','1','5','6'],ok:0,why:'Fiecare coloană de numere e o serie: Nota 1 și Nota 2. Legenda le arată cu culori diferite.'}
]},
{t:'Situația clasei (recapitulare)',lectii:[7,8,9],continuturi:[P.formule,P.functii,P.editare],final:true,text:`
<p>Pui totul la un loc, ca într-un tabel adevărat de la dirigenție: <mark>formula</mark> într-o celulă, apoi o <mark>tragi în jos</mark> pentru toți elevii, apoi <mark>funcțiile</mark> pe coloană și decizia cu <code>IF</code>.</p>
<p>Lucrează ca în Excel: pune adresele cu mouse-ul, trage de colț, selectează zonele trăgând. Setările sunt românești, deci între părțile funcțiilor pui <code>;</code>.</p>`,
qs:[
 {t:'excel',q:'În <b>D2</b> calculează media Anei, <code>=(B2+C2)/2</code>, și trage până la <b>D6</b>. Apoi în <b>E2</b> scrie cu IF „promovat” dacă media e cel puțin 5, altfel „corigent”, și trage până la <b>E6</b>.',cols:6,rows:8,cells:{...NOTE,D1:'Media',E1:'Situația'},mod:'ro',verifica:{formule:{D2:'=(B2+C2)/2',E2:'=IF(D2>=5,"promovat","corigent")'},umplut:{D2:['D3','D4','D5','D6'],E2:['E3','E4','E5','E6']},gest:['umple']},why:'Două formule scrise o singură dată și trase în jos calculează toată clasa. IF lucrează pe media din coloana D.'},
 {t:'excel',q:'Sub tabel: în <b>D7</b> media clasei și în <b>D8</b> cea mai mare medie. Selectează zona D2:D6 trăgând cu mouse-ul.',cols:6,rows:9,cells:{...NOTE,D1:'Media',D2:'=(B2+C2)/2',D3:'=(B3+C3)/2',D4:'=(B4+C4)/2',D5:'=(B5+C5)/2',D6:'=(B6+C6)/2',C7:'Media clasei',C8:'Maxim'},mod:'ro',verifica:{formule:{D7:'=AVERAGE(D2:D6)',D8:'=MAX(D2:D6)'},gest:['zona-mouse']},why:'=AVERAGE(D2:D6) și =MAX(D2:D6). Funcțiile lucrează pe coloana de medii calculată cu formule.'},
 {t:'choice',q:'Schimbi Nota 1 a lui Dan din 7 în 9. Ce se întâmplă cu media lui, cu situația lui și cu media clasei?',o:['Se recalculează toate singure','Trebuie scrise din nou','Se schimbă doar media lui','Nu se schimbă nimic'],ok:0,why:'Toate sunt formule cu adrese, deci Excel le recalculează singur când se schimbă o notă.'}
]},
{t:'Bonus: adrese fixe cu $ și F4 (în afara programei)',lectii:[7,8],continuturi:[P.formule,P.editare],text:`
<p>Uneori o adresă <mark>nu trebuie să se mute</mark> la copiere. De exemplu, o singură celulă cu TVA-ul (F1), folosită de toate produsele.</p>
<p>Pui semnul <code>$</code> și adresa rămâne pe loc: <code>$F$1</code> e <strong>adresă absolută</strong>. Cel mai simplu: după ce ai pus adresa în formulă, apeși <kbd>F4</kbd>. La fiecare apăsare: <code>F1</code> → <code>$F$1</code> → <code>F$1</code> → <code>$F1</code>.</p>
<p><code>=B2*$F$1</code> trasă în jos devine <code>=B3*$F$1</code>: B se mută, F1 rămâne.</p>`,
qs:[
 {t:'excel',q:'În <b>C2</b> calculează TVA-ul caietului: <code>=B2*</code>, apasă pe <b>F1</b>, apasă <kbd>F4</kbd> (apare $F$1), <kbd>Enter</kbd>. Apoi trage C2 până la <b>C5</b>.',cols:6,rows:6,cells:{A1:'Produs',B1:'Preț',C1:'TVA',E1:'Cota TVA',F1:0.19,A2:'Caiet',B2:4,A3:'Pix',B3:2,A4:'Riglă',B4:6,A5:'Gumă',B5:1},verifica:{formule:{C2:'=B2*$F$1'},umplut:{C2:['C3','C4','C5']},gest:['f4','umple']},why:'$F$1 rămâne pe loc la copiere, deci toate produsele folosesc aceeași cotă de TVA.'},
 {t:'choice',q:'<code>=B2*F1</code> (fără $) din C2 e trasă în jos până la C3. Ce ajunge în C3?',o:['=B3*F2','=B3*F1','=B2*F1','=B3*$F$1'],ok:0,why:'Fără $, ambele adrese coboară. F2 e goală, deci TVA-ul iese 0. De aceea trebuie $F$1.'},
 {t:'excel',q:'Încearcă tu: în <b>C2</b> scrie <code>=B2*F1</code> (fără Enter!) și apasă <kbd>F4</kbd> o dată, cu cursorul lângă F1. Ce apare în bara de formule? (Poți apăsa F4 de mai multe ori să vezi toată rotația, apoi Esc.)',cols:6,rows:4,cells:{A1:'Produs',B1:'Preț',C1:'TVA',E1:'Cota',F1:0.19,A2:'Caiet',B2:4},o:['=B2*$F$1','=B2*F$1','=B2*$F1','=$B$2*F1'],ok:0,why:'Prima apăsare pe F4 pune $ și la coloană, și la rând: $F$1. Următoarele apăsări dau F$1, apoi $F1, apoi iar F1.'}
]}
];

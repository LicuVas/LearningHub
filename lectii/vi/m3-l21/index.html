<style>

/* tema: blocurile Scratch ale lecției, cu „repetă până când” portocaliu și condiția albastru-deschis */
.banda{display:flex;align-items:center;gap:4px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:.72rem;font-weight:700;color:#fff}
.banda .bk{flex:none;display:inline-block;padding:4px 10px;border-radius:5px;border:1px solid rgba(0,0,0,.18)}
.banda .ev{background:#FFBF00;color:#3A2A00;border-radius:14px 14px 5px 5px}
.banda .ct{background:#FFAB19;color:#3A2A00}
.banda .dt{background:#5CB1D6;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);padding:4px 14px}

.acum ol{margin:.2em 0 .2em 1.2em;padding:0}

.acum.dmt{border-style:dotted}

.ss-static{display:block!important;margin:8px 0!important;max-width:100%;overflow-x:auto}
.ss-static .ss-b{touch-action:auto;cursor:default}
.ss-cap{margin:0 0 4px;font-size:.85rem;color:var(--ink2)}
.blk{display:inline-block;padding:1px 7px;border-radius:5px;color:#fff;font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;font-weight:700;font-size:.86em;white-space:nowrap}
.blk.ev{background:#FFBF00;color:#3A2A00}.blk.mv{background:#3373CC}.blk.lk{background:#774DCB}.blk.ct{background:#FFAB19;color:#3A2A00}

<script>
/* Lecția 21, clasa a VI-a (M3, predare): „Structura repetitivă condiționată anterior (cu test inițial)”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026). Faptele
   despre „repetă până când”, „atinge marginea?”, „poziția x” și comparații sunt PROBATE în editorul viu (Chromium headless,
   profil temporar, fără cont, 24.10.2026: _proba\live_conditie*.py → live_conditie.json).
   Simulatoarele: lectii/_sim/scratch.js (VI/18) + scratch-control.js (VI/20), doar FOLOSITE + lectii/_sim/scratch-conditie.js
   (NOU, al lecției: „repetă până când”, „atinge marginea?”, „poziția x”, „>”, „<”, „=”) · lectii/_sim/urmarire-algoritm.js
   (VI/17) + urmarire-algoritm-repetitie.js (VI/20), doar FOLOSITE + lectii/_sim/urmarire-algoritm-cattimp.js (NOU: „cât timp”,
   tabelul pe teste, „de câte ori”). Valorile din tabele și din exemplele de pseudocod sunt CALCULATE de interpretor, nu scrise
   de mână (oracolul independent: _proba\oracol_independent.py).
   Granița: NU „repetă … până când” din pseudocod (22), NU comparația celor trei (23), NU blocurile grafice ca temă (24),
   NU variabilele Scratch, NU „dacă” în Scratch. */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
/* caseta opțională (reparația după judecata 1: durata ≤ 50 min) */
const ACUM_DMT = (...p) => `<div class="acum dmt" role="note"><div class="lbl">Dacă mai ai timp, în Scratch</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));
const L = p => UrmarireAlgoritm.listare(p);
const TT = (p, d) => UrmarireCatTimp.tabelTeste(p, d);
const CT = UrmarireCatTimp;

/* ---- ajutoare pentru testele simulatorului (pe COMPORTAMENT: programul elevului e rulat de la steag) ---- */
const A = SimScratch.ajutor, SC = SimScratchConditie;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const cate = (P, id) => A.toate(P).filter(x => x === id).length;
const spusLa = (U, text, o) => { let p = [o.x, o.y]; const r = []; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune' && norm(e.valoare) === norm(text)) r.push(p); } return r; };
const STRAMB = {x: -120, y: 80, directie: 0};
const PAL = ['steag', 'mergi', 'mergi_la_xy', 'orienteaza', 'pozitia_x', 'spune_sec', 'repeta', 'repeta_pana', 'atinge', 'mai_mare', 'mai_mic', 'egal'];
const START = [['steag'], ['mergi_la_xy', 0, 0], ['orienteaza', 90]];
/* abaterea spusă pe ecran (regula 9): în pagină nu urmărim mouse-ul peste scenă */
const NOTA_SIM = 'În pagină sunt doar blocurile de azi, iar pisica e desenată mai simplu. În Scratch, fiecare categorie are mult mai multe blocuri, iar pisica arată ca în pozele din lecție. „atinge cursorul mouse-ului?” e aici mereu fals: pagina nu urmărește mouse-ul peste scenă.';
const MARG = ['atinge', 'marginea'];
const POZ = (op, n) => [op, '', n, {s: {0: ['pozitia_x']}}];
/* programul elevului, pornit din alt x: ce face condiția lui pe alte date (ca la VI/17: o regulă se probează și departe de prag) */
const dinX = (P, x) => { const Q = JSON.parse(JSON.stringify(P)); Q.forEach(sc => sc.b.forEach(b => { if (b[0] === 'mergi_la_xy') { b[1] = x; b[2] = 0; } })); return Q; };
const ruleaza = (P, cadre) => SimScratch.urma(P, {x: 0, y: 0, directie: 90, cadre: cadre || 600});
/* „cât timp x ≤ prag execută x ← x + pas” — ce face pseudocodul, pentru comparație */
const catTimpLe = (x, prag, pas) => { let k = 0; while (x <= prag && k < 1000) { x += pas; k++; } return x; };
const caPseudocodul = (P, prag, pas, starturi) => starturi.every(s => { const U = ruleaza(dinX(P, s)); return U.terminat && U.x === catTimpLe(s, prag, pas); });

/* ---- pseudocodul (valorile din exemple le calculează interpretorul) ---- */
const FORMA = ['cât timp condiție execută', '   rândurile care se repetă', 'sfârșit cât timp'];
const PENTRU_3 = ['pentru i ← 1, 3 execută', '   Afișează i', 'sfârșit pentru'];
const CATTIMP_3 = ['i ← 1', 'cât timp i ≤ 3 execută', '   Afișează i', '   i ← i + 1', 'sfârșit cât timp'];
const REST = ['n ← 17', 'cât timp n ≥ 5 execută', '   n ← n - 5', 'sfârșit cât timp', 'Afișează n'];
const PISICA = ['x ← 0', 'cât timp x ≤ 190 execută', '   x ← x + 10', 'sfârșit cât timp', 'Afișează x'];
const PATRU = ['Început', 'Citește n', 'cât timp n ≥ 4 execută', '   n ← n - 4', 'sfârșit cât timp', 'Afișează n', 'Sfârșit'];
const PRAG = ['Început', 's ← 0', 'k ← 0', 'cât timp s < 20 execută', '   k ← k + 1', '   s ← s + 6', 'sfârșit cât timp', 'Afișează k', 'Sfârșit'];
const INFINIT = ['a ← 5', 'cât timp a > 0 execută', '   a ← a + 1', 'sfârșit cât timp'];
const ATELIER_PS = ['x ← -40', 'cât timp x ≤ 50 execută', '   x ← x + 30', 'sfârșit cât timp', 'Afișează x'];

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun ---- */
const LAB = [
  'Programul de la pași e în fila Scratch? Trage „( ) &gt; (190)” în paletă; „atinge marginea?”, de sub program, înapoi în locul în șase colțuri. Fila e închisă? <code>scratch.mit.edu</code> › <b>Creează</b>; din <b>Evenimente</b>, „când se dă click pe ⚑”; sub el: „mergi la x 0 y: 0”, „orientează-te în direcția 90”, „repetă până când” cu „atinge … ?” (▾ › <b>marginea</b>) și „mergi 10 pași” în gură.',
  'Din <b>Aspect</b>, „spune Salut! pentru 2 secunde” <b>sub brațul de jos</b> al lui „repetă până când”; în loc de Salut! scrie <code>Margine!</code>. Steagul: abia la x 200 pisica spune „Margine!”.',
  'Alt pas: în „mergi 10 pași” scrie <code>7</code>, <kbd>Enter</kbd>, steagul. Pisica se oprește în alt loc: x 196.',
  '<b>Dacă mai ai timp:</b> în „orientează-te în direcția 90”, <b>dublu clic</b> pe 90 (apare și un cerc cu o săgeată; un singur clic nu ajunge), scrie <code>-90</code>, <kbd>Enter</kbd>. În bloc scrie 9 sau 90? Încă un dublu clic, repede, pe număr, apoi <code>-90</code>, <kbd>Enter</kbd>. Scrie -90? Steagul: pisica merge spre stânga, cu capul în jos (așa o întoarce Scratch), și se oprește la x −196.',
  '<b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? Folderul tău, numele <code>Margine_</code>, clasa și numele tău (de exemplu <code>Margine_6A_Popescu</code>), <b>Salvare</b>. Numele există deja? <b>Nu</b> (sau <b>Anulare</b>), adaugă prenumele, <b>Salvare</b>. Sari la punctul 7.',
  'Nu te-a întrebat? Explorer › <b>Descărcări</b>: fișierul <b>Proiect Scratch</b> (poate cu (1)). <kbd>F2</kbd>, <code>Margine_</code>, clasa și numele tău, <kbd>Enter</kbd>; <b>Decupare</b>, folderul tău, <b>Lipire</b>. Există deja? <b>Se omite acest fișier</b>, adaugă prenumele, mută-l din nou.',
  'Închide fila Scratch (te întreabă dacă pleci? Pleci: ai salvat).'
];

JocMotor.porneste({
  cheie: 'lectie_vi_m3_l21',
  mod: 'lectie',
  titlu: 'Structura repetitivă condiționată anterior (cu test inițial)',
  marca: 'Lecția <b>21</b> · clasa a VI-a',
  h1: 'Structura repetitivă <span class="acc">condiționată anterior</span> (cu test inițial)',
  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a VI-a',
  unitate: 'VI-U3',
  unitateTitlu: 'Algoritmi: structuri repetitive',
  competente: ['CS.2.1', 'CS.2.2', 'CS.2.3'],
  lectii: '21',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a VI-a, CS.2.1 „Utilizarea unui mediu grafic-interactiv pentru exersarea algoritmilor”, CS.2.2 „Aplicarea etapelor de rezolvare…, urmărind pas cu pas”, CS.2.3 „Reprezentarea algoritmilor…” · unitatea VI-U3 „Algoritmi: structuri repetitive” · lecția 21, predare · conținutul „Structura repetitivă condiționată anterior”. Aplicația: Scratch 3, editorul online scratch.mit.edu; pseudocodul în notația lecțiilor 17 și 20.',
  intro: '<p><b>Ai nevoie de:</b> lecția 17 (algoritmul pe rânduri; condiția adevărată sau falsă, cu &lt; ≤ &gt; ≥ = ≠; tabelul de urmărire; finitudinea), lecția 18 (Scratch: tragerea, steagul, Stop, salvarea) și lecția 20 (blocul „repetă”: gura, trecerea, brațul de jos; „pentru”, corpul, tabelul pe treceri).</p>',
  cum: '<b>Cum lucrezi:</b> casetele „Acum în Scratch” le faci în fila Scratch, lângă pagină. „Încă un exercițiu” și „Dacă mai ai timp”: doar dacă termini repede.',
  banda: '<span class="bk ev">când se dă click pe ⚑</span><span class="bk ct">repetă până când</span><span class="bk dt">atinge marginea?</span><span class="bk mv">mergi 10 pași</span><span class="bk lk">spune Margine!</span>',
  nivele: [
{t: 'Structura repetitivă condiționată anterior (cu test inițial)', final: true, lectii: [21],
 continuturi: ['Structura repetitivă condiționată anterior'],
 obiectiv: 'faci pisica să meargă până atinge marginea cu „repetă până când”, citești aceeași repetiție în pseudocod, cu „cât timp … execută”, și o treci în Scratch, traduci condiția pe dos, urmărești testele într-un tabel și recunoști o repetiție care nu se oprește.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: când nu știi dinainte de câte ori',
   text: `<p>La lecția 20 știai dinainte de câte ori: 4 laturi, „repetă 4”. Dar de multe ori nu știi.</p>
<p>La semafor: <b>cât timp</b> e roșu, aștepți. Nu știi câte secunde. Înainte de fiecare clipă te uiți: tot roșu? Mai aștepți. Verde? Treci. Dacă e verde când ajungi, nu aștepți deloc.</p>
<p>Asta e <mark>structura repetitivă condiționată anterior</mark> (<mark>cu test inițial</mark>): o <mark>condiție</mark>, adevărată sau falsă (lecția 17), se verifică ÎNAINTE de fiecare trecere.</p>
${fig('semafor-rosu.webp', 600, 402, 'Un semafor pentru pietoni pe un stâlp, la colțul unei clădiri: lumina de sus e aprinsă roșu și arată un om mare și un copil, ținându-se de mână', '<small>Foto: R1717, <a href="https://commons.wikimedia.org/wiki/File:Fu%C3%9Fg%C3%A4ngerampel_Landau_Pfalz_rot.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC0; micșorată.</small>')}`},
  /* ---- pasul 1: „repetă până când” + „atinge marginea?” (probat viu) ---- */
  {t: 'În Scratch: „repetă până când”',
   text: `<p>În <b>Control</b> e blocul <span class="blk ct">repetă până când</span> (în engleză: repeat until). Are forma literei C, ca „repetă”, dar în loc de număr are un <mark>loc în șase colțuri</mark>: acolo pui o condiție.</p>
<p>Înainte de FIECARE trecere, Scratch verifică condiția. Falsă? Execută o dată blocurile din gură. Adevărată? Se oprește și trece la blocul de sub brațul de jos.</p>
<p>Prima condiție e în <b>Detectare</b>: <span class="blk dt">atinge cursorul mouse-ului?</span>. Clic pe ▾ și alegi <b>marginea</b>: e adevărată când pisica atinge marginea scenei.</p>`,
   exemplu: `${fig('control-pana-cand.webp', 312, 603, 'Editorul Scratch în română: categoriile din stânga, cu Control ales, și paleta Control; blocul repetă până când, cu locul în șase colțuri, e încadrat cu roșu', 'Bulina <b>Control</b>: <b>repetă până când</b>.')}
${fig('atinge-marginea.webp', 273, 159, 'Blocul atinge cursorul mouse-ului, cu lista deschisă: cursorul mouse-ului și marginea; marginea e încadrată cu roșu', 'Clic pe ▾: alegi <b>marginea</b>.')}
${fig('program-margine.webp', 278, 222, 'Zona de cod din Scratch: când se dă click pe steag, mergi la x 0 y 0, orientează-te în direcția 90, repetă până când atinge marginea, cu mergi 10 pași în gură', 'Programul.')}
${fig('scena-margine.webp', 490, 429, 'Scena Scratch: pisica oprită la marginea din dreapta; sub scenă, x 200 și y 0, încadrate cu roșu', 'După steag: x 200.')}
${ACUM('Deschide <code>scratch.mit.edu</code> › <b>Creează</b> (în engleză? <b>Settings</b> › <b>Language</b> › <b>Română</b>).',
  'Din <b>Evenimente</b>, „când se dă click pe ⚑” în zona de cod. Sub el: „mergi la x 0 y: 0” (în proiectul nou are deja 0 și 0), „orientează-te în direcția 90”, apoi „repetă până când”.',
  '„atinge cursorul mouse-ului?” în locul în șase colțuri, ▾ › <b>marginea</b>; „mergi 10 pași” în gură.',
  'Steagul: pisica se oprește la x 200. Nu se oprește? Stop, apoi vezi dacă ▾ arată „marginea”.')}`,
   altfel: `<p>E ca atunci când umpli un pahar la robinet: torni până când paharul e plin. Nu știi dinainte cât durează. Înainte să mai torni, te uiți: e plin? Da: te oprești. Nu: mai torni puțin.</p>`,
   incearca: {t: 'scratch', q: 'Pune „atinge … ?” în locul în șase colțuri și alege „marginea”, apoi apasă steagul. Pe telefon: ții degetul pe bloc și îl duci acolo; ▾ nu se vede? Trage zona de cod spre stânga, pe un loc gol.',
    paleta: PAL, nota: NOTA_SIM,
    program: [{x: 14, y: 14, b: START.concat([['repeta_pana', {guri: [[['mergi', 10]]]}]])}],
    teste: [
     {ce: 'În locul în șase colțuri e „atinge marginea?”', msg: 'Trage „atinge cursorul mouse-ului?” din Detectare în locul în șase colțuri al lui „repetă până când”, apoi clic pe ▾ și alege „marginea”.', ok: (U, P) => SC.textConditie(P) === 'atinge marginea?'},
     {ce: 'În gură a rămas „mergi 10 pași”', msg: 'Lasă „mergi 10 pași” înăuntrul lui „repetă până când”, chiar sub rândul de sus.', ok: (U, P) => eq(SC.subPana(P), ['mergi']) && eq(A.valori(P, 'mergi'), [[10]])},
     {ce: 'Pisica se oprește la x 200', o: STRAMB, msg: 'Steagul: pisica pornește din mijloc spre dreapta și se oprește când atinge marginea.', ok: U => U.terminat && U.x === 200 && U.y === 0},
     {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde, deasupra scenei, și privește x.', ok: (U, P, S) => S.apasatSteag}],
    solutie: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: MARG}, guri: [[['mergi', 10]]]}]])}],
    gresit: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: ['atinge', 'cursorul mouse-ului']}, guri: [[['mergi', 10]]]}]])}],
    ajutor: 'Locul în șase colțuri e pe rândul portocaliu, după „până când”. „atinge … ?” din Detectare are și el șase colțuri: se lipește acolo. Apoi ▾ › marginea.',
    why: 'Înainte de fiecare trecere, Scratch întreabă „atinge marginea?”. Cât timp răspunsul e nu, pisica mai face 10 pași. La x 200 răspunsul e da, iar repetiția se oprește.'},
   inca: [
    {t: 'choice', q: `Pisica pornește din mijloc, cu fața spre dreapta. De câte ori verifică Scratch condiția, dacă pisica atinge marginea abia după a 20-a trecere?${STIVA([['repeta_pana', {s: {0: MARG}, guri: [[['mergi', 10]]]}]])}`, o: ['21', '20', '19', '1'], ok: 0,
     ajutor: 'Condiția se verifică înainte de fiecare trecere și încă o dată, la final, când e adevărată.', why: '20 de verificări cu „nu”, câte una înainte de fiecare trecere, și a 21-a cu „da”, care oprește repetiția.'}
   ]},
  /* ---- pasul 2: „cât timp … execută” în pseudocod (exemplele, calculate de interpretor) ---- */
  {t: 'În caiet: „cât timp … execută”',
   text: `<p>În pseudocod (lecția 20), repetiția cu test inițial se scrie cu <mark>cât timp</mark>:</p>
${L(FORMA)}
<p>Înainte de fiecare trecere se verifică condiția. <b>Adevărată</b>: <mark>corpul</mark> (rândurile mai la dreapta) se execută o dată, apoi se verifică din nou. <b>Falsă</b>: repetiția se oprește; algoritmul merge sub „sfârșit cât timp”.</p>
<p>Dacă e falsă de la început, corpul se execută de <b>0 ori</b>.</p>`,
   exemplu: `<p>Problema de la lecția 20, în două feluri:</p>
<div class="doua"><div><p class="et">cu „pentru”:</p>${L(PENTRU_3)}</div><div><p class="et">cu „cât timp”:</p>${L(CATTIMP_3)}</div></div>
<p>Amândouă afișează ${UrmarireAlgoritm.ruleaza(CATTIMP_3, {}).afisari.join(', ')}. La „cât timp”, începutul (i ← 1) și creșterea (i ← i + 1) le scrii TU. Fără creștere, i ≤ 3 ar rămâne adevărată.</p>`,
   altfel: `<p>E ca o coadă la cantină: cât timp mai e cineva în fața ta, mai aștepți un pas. Dacă ajungi și nu e nimeni la coadă, nu aștepți deloc: zero pași.</p>`,
   incearca: {t: 'cattimpori', q: 'Scazi 5 din 23 cât timp se mai poate. De câte ori se execută corpul (rândul „n ← n - 5”)?', cere: 'ori',
    prog: ['n ← 23', 'cât timp n ≥ 5 execută', '   n ← n - 5', 'sfârșit cât timp', 'Afișează n'],
    ajutor: 'Scrie pe rând valorile lui n: 23, 18, … Înainte de fiecare scădere te întrebi: n ≥ 5? Numără scăderile.',
    why: 'n ia valorile 23, 18, 13, 8, 3: patru scăderi. La 3, condiția 3 ≥ 5 e falsă și repetiția se oprește.'},
   inca: [
    {t: 'cattimpori', q: 'De câte ori se execută corpul?', cere: 'ori',
     prog: ['n ← 3', 'cât timp n ≥ 5 execută', '   n ← n - 5', 'sfârșit cât timp', 'Afișează n'],
     ajutor: 'Fă primul test: 3 ≥ 5?', why: 'Primul test, 3 ≥ 5, e fals: corpul nu se execută deloc (0 ori). Se afișează 3.'},
    {t: 'cattimpori', q: 'Ce se afișează, în ordine?', cere: 'afisari',
     prog: ['i ← 2', 'cât timp i ≤ 10 execută', '   Afișează i', '   i ← i + 3', 'sfârșit cât timp'],
     ajutor: 'i pornește de la 2 și crește cu 3. Înainte de fiecare afișare: i ≤ 10?', why: 'i = 2, 5, 8 se afișează; la 11, testul 11 ≤ 10 e fals.'}
   ]},
  /* ---- pasul 3: capcana: condiția din Scratch e opusul (probat viu: poziția x > 190 → x 200) ---- */
  {t: 'Capcana: în Scratch, condiția e pe dos',
   text: `<p>„cât timp” repetă cât timp condiția e <b>adevărată</b>. „repetă până când” repetă cât timp condiția e <b>falsă</b> și se oprește când devine adevărată (Scratch nu are un bloc „cât timp”). Deci, din caiet în Scratch, scrii condiția <mark>opusă</mark>: cea care spune când te OPREȘTI.</p>
<table class="opuse"><thead><tr><th>în caiet</th><th>opusul, în Scratch</th></tr></thead><tbody><tr><td>x ≤ 190</td><td>x &gt; 190</td></tr><tr><td>x ≥ 5</td><td>x &lt; 5</td></tr><tr><td>nu atinge marginea</td><td>atinge marginea</td></tr></tbody></table>
<p>Comparațiile sunt în <b>Operatori</b>: <span class="blk op">( ) &gt; (50)</span>, <span class="blk op">( ) &lt; (50)</span>. x-ul pisicii e blocul rotunjit <span class="blk mv">poziția x</span> din Mișcare: îl tragi în prima căsuță.</p>`,
   exemplu: `<div class="doua"><div><p class="et">în caiet:</p>${L(PISICA)}</div><div><p class="et">în Scratch:</p>${STIVA([['repeta_pana', {s: {0: POZ('mai_mare', 190)}, guri: [[['mergi', 10]]]}]])}</div></div>
<p>Amândouă se opresc la x ${UrmarireAlgoritm.ruleaza(PISICA, {}).afisari[0]}: 200 &gt; 190 e primul test adevărat în Scratch, iar 200 ≤ 190 e primul test fals în caiet.</p>
${fig('operatori-poz.webp', 271, 228, 'Zona de cod din Scratch: repetă până când, cu poziția x mai mare decât 190 în locul în șase colțuri și mergi 10 pași în gură, încadrat cu roșu', '„poziția x” în prima căsuță.')}
${ACUM('Trage „atinge marginea?” afară și lasă-l sub program: îl folosești la laborator.',
  'Din <b>Operatori</b>, „( ) &gt; (50)” în locul în șase colțuri, acum gol; din <b>Mișcare</b>, „poziția x” (spre capătul listei) în prima căsuță. Clic pe 50, scrie <code>190</code>, <kbd>Enter</kbd>.',
  'Steagul: tot la x 200.')}`,
   altfel: `<p>„Mănânci cât timp ți-e foame” și „mănânci până când te saturi” spun același lucru. Prima spune când continui, a doua spune când te oprești. „Ți-e foame” și „te-ai săturat” sunt opuse.</p>`,
   incearca: {t: 'scratch', q: 'În caiet: x pornește de la 0; cât timp x ≤ 140 execută, pisica merge 20 de pași. Scrie-l în Scratch, cu condiția OPUSĂ, și apasă steagul. Pe telefon, a doua căsuță o vezi trăgând zona de cod spre stânga.',
    paleta: PAL, nota: NOTA_SIM,
    program: [{x: 14, y: 14, b: START.concat([['repeta_pana', {guri: [[['mergi', 20]]]}]])}],
    teste: [
     {ce: 'Condiția e opusul lui x ≤ 140', msg: '„repetă până când” se oprește când condiția e adevărată, deci pui opusul lui x ≤ 140: din Operatori „( ) > (50)”, „poziția x” în prima căsuță, 140 în a doua.', ok: (U, P) => caPseudocodul(P, 140, 20, [0, -100, 150, 141])},
     {ce: 'În gură a rămas „mergi 20 pași”', msg: 'Nu schimba blocul din gură.', ok: (U, P) => eq(SC.subPana(P), ['mergi']) && eq(A.valori(P, 'mergi'), [[20]])},
     {ce: 'Pisica se oprește la x 160, ca în caiet', o: STRAMB, msg: 'În caiet: 0, 20, …, 140, apoi 160, iar 160 ≤ 140 e fals.', ok: U => U.terminat && U.x === 160},
     {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde.', ok: (U, P, S) => S.apasatSteag}],
    solutie: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: POZ('mai_mare', 140)}, guri: [[['mergi', 20]]]}]])}],
    gresit: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: POZ('mai_mic', 140)}, guri: [[['mergi', 20]]]}]])}],
    ajutor: 'Opusul lui ≤ e >. Trage „( ) > (50)” în locul în șase colțuri, „poziția x” în prima căsuță, iar în a doua scrie 140.',
    why: 'Caietul repetă cât timp x ≤ 140; Scratch se oprește când x > 140. E aceeași repetiție: pisica ajunge la 160.'},
   inca: [
    {t: 'choice', q: 'În caiet ai „cât timp x ≥ -100 execută”. Ce condiție pui în „repetă până când” din Scratch?', o: ['(poziția x) < -100', '(poziția x) > -100', '(poziția x) = -100', 'atinge marginea?'], ok: 0,
     ajutor: 'Scrii condiția în care te OPREȘTI: opusul lui ≥.', why: 'Opusul lui x ≥ -100 e x < -100: atunci te oprești.'}
   ]},
  /* ---- pasul 4: tabelul pe teste (completat de interpretor) ---- */
  {t: 'Urmărești testele, în tabel',
   text: `<p>Urmărești ca la lecția 20, dar tabelul are un rând pe fiecare <b>test</b>:</p>
<ol><li>„la început”: valorile de dinainte de „cât timp”;</li>
<li>la fiecare test pui în condiție valorile de pe rândul de deasupra: adevărat sau fals?</li>
<li>adevărat: execuți corpul și scrii valorile noi; fals: repetiția se oprește, apoi execuți rândurile de sub „sfârșit cât timp”.</li></ol>`,
   exemplu: `${L(REST)}${TT(REST, {})}<p>Trei treceri, patru teste: ultimul, 2 ≥ 5, e fals și oprește repetiția. Se afișează ${CT.teste(REST, {}).final.join(', ')}.</p>`,
   altfel: `<p>E ca la cântar, când pui mere în pungă până la 2 kilograme: înainte de fiecare măr te uiți la cântar. Scrii pe un bilet, de fiecare dată, ce arată cântarul și dacă mai pui.</p>`,
   incearca: {t: 'urmarire', mod: 'teste', q: 'Primul test e completat. Completează restul. După oprire, rândurile rămân goale.', prog: PATRU, date: [{n: 10}, {n: 9}, {n: 11}], facut: 1,
    ajutor: 'Pe fiecare rând: n de pe rândul de deasupra ≥ 4? Dacă da, n nou = n − 4. Dacă nu, te oprești și lași restul gol.',
    why: 'Scazi 4 cât timp se mai poate. Ce rămâne la final e restul împărțirii la 4.'},
   inca: [
    {t: 'urmarire', mod: 'teste', q: 'Același algoritm, cu n = 3. Completează tabelul.', prog: PATRU, date: [{n: 3}], inPlus: 1,
     ajutor: 'Primul test: 3 ≥ 4?', why: 'Primul test e fals: zero treceri. n rămâne 3, iar 3 se afișează.'},
    {t: 'urmarire', mod: 'teste', q: 'k numără de câte ori adaugi 6, până când suma s nu mai e sub 20. Completează tabelul.', prog: PRAG, date: [{}],
     ajutor: 'La fiecare test: s de pe rândul de deasupra < 20? Dacă da, k crește cu 1, s crește cu 6.', why: 's: 6, 12, 18, 24. La 24 testul e fals: k = 4.'}
   ]},
  /* ---- pasul 5: finitudinea: corpul trebuie să schimbe condiția, spre oprire ---- */
  {t: 'Se oprește? Corpul trebuie să schimbe condiția',
   text: `<p>Repetiția se oprește doar când condiția din caiet devine falsă (în Scratch: adevărată). Pentru asta, <b>corpul</b> trebuie să <b>schimbe</b> ce e în condiție, <b>spre oprire</b>. Altfel algoritmul nu se oprește: nu e finit (lecția 17). Verifici cu 3 întrebări:</p>
<ol><li>Ce apare în condiție?</li><li>Corpul îl schimbă?</li><li>Îl schimbă spre oprire?</li></ol>
<p>În Scratch, un program care nu se oprește îl oprești cu butonul <b>Stop</b>, de lângă steag.</p>`,
   exemplu: `${L(INFINIT)}<p>(1) a. (2) Da: a ← a + 1. (3) Nu: a crește, 6, 7, 8…, iar a &gt; 0 rămâne adevărată. Cu <code>a ← a - 1</code> se oprește după 5 treceri.</p>
${ACUM_DMT('În „mergi 10 pași” scrie <code>-10</code>, <kbd>Enter</kbd>, steagul. Pisica rămâne la marginea din stânga, iar blocurile au un contur galben: programul nu se oprește.',
  'Apasă <b>Stop</b>. Scrie la loc <code>10</code>, <kbd>Enter</kbd>.')}`,
   altfel: `<p>E ca pe banda de alergare: alergi, dar nu ajungi nicăieri, pentru că banda te duce înapoi. Ca să ajungi la capăt, pașii trebuie să te apropie de el.</p>`,
   incearca: {t: 'choice', q: 'Care algoritm nu se oprește niciodată? Fiecare e scris pe un singur rând: „;” desparte rândurile.', o: ['b ← 1; cât timp b < 10 execută b ← b - 2', 'b ← 1; cât timp b < 10 execută b ← b + 2', 'b ← 12; cât timp b < 10 execută b ← b - 2', 'b ← 20; cât timp b > 10 execută b ← b - 2'], ok: 0,
    ajutor: 'Pune cele 3 întrebări fiecărui algoritm. Pașii duc b spre oprire?', why: 'b pornește de la 1 și scade (−1, −3, …), deci b < 10 rămâne adevărată. Cu b ← b + 2, b ajunge la 11; cu b ← 12, primul test e fals; cu b ← 20, b scade până la 10, iar 10 > 10 e fals.'},
   inca: [
    {t: 'scratch', q: 'Programul de mai jos nu se oprește. Repară-l: pisica trebuie să ajungă la x 120 și abia acolo să spună „Gata!”. Apasă steagul (dacă nu se oprește, apasă Stop).',
     paleta: PAL, nota: NOTA_SIM,
     program: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: POZ('mai_mare', 100)}, guri: [[['mergi', -20]]]}], ['spune_sec', 'Gata!', 2]])}],
     teste: [
      {ce: 'Programul se oprește', o: STRAMB, msg: 'Corpul trebuie să ducă pisica spre x > 100: spre dreapta.', ok: U => U.terminat},
      {ce: 'Pisica ajunge la x 120 și abia acolo spune „Gata!”', o: STRAMB, msg: 'Pași de 20 spre dreapta: 0, 20, …, 120.', ok: U => U.x === 120 && eq(spusLa(U, 'Gata!', STRAMB), [[120, 0]])},
      {ce: 'Condiția a rămas (poziția x) > 100', msg: 'Condiția e bună: schimbă blocul din gură.', ok: (U, P) => SC.textConditie(P) === '(poziția x) > 100'},
      {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde.', ok: (U, P, S) => S.apasatSteag}],
     solutie: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: POZ('mai_mare', 100)}, guri: [[['mergi', 20]]]}], ['spune_sec', 'Gata!', 2]])}],
     gresit: [{x: 14, y: 14, b: START.concat([['repeta_pana', {s: {0: POZ('mai_mare', 100)}, guri: [[['mergi', -20]]]}], ['spune_sec', 'Gata!', 2]])}],
     ajutor: 'Întrebarea 3: „mergi -20 pași” duce pisica spre stânga, departe de x > 100. Clic pe -20, scrie 20, Enter.', why: 'Cu 20, x crește: 20, 40, …, 120. La 120 condiția x > 100 e adevărată, repetiția se oprește, iar pisica spune „Gata!”.'}
   ]}
 ],
 atelier: {t: 'scratch', titlu: 'Pisica merge până trece de x 100',
  intro: `<p><b>Cerința:</b> pisica pornește din x −200 (stânga), cu fața spre dreapta. În caiet, algoritmul e:</p>${L(['x ← -200', 'cât timp x ≤ 100 execută', '   x ← x + 30', 'sfârșit cât timp'])}
<p><strong>Sarcina:</strong> în Scratch, „repetă până când” cu condiția opusă și „mergi 30 pași” în gură. Probezi cu steagul, apoi „Rulează testele”.</p>`,
  q: 'Scrie algoritmul în Scratch și pornește-l cu steagul.',
  paleta: PAL, nota: NOTA_SIM,
  program: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', -200, 0], ['orienteaza', 90]]}],
  teste: [
   {ce: 'Sub „orientează-te în direcția 90” e „repetă până când”', msg: 'Din Control, „repetă până când” chiar sub „orientează-te în direcția 90”.', ok: (U, P) => eq(A.dupaSteag(P).slice(0, 3), ['mergi_la_xy', 'orienteaza', 'repeta_pana'])},
   {ce: 'Condiția e opusul lui x ≤ 100', msg: 'Opusul lui x ≤ 100 e x > 100: „( ) > (50)”, cu „poziția x” în prima căsuță și 100 în a doua.', ok: (U, P) => caPseudocodul(P, 100, 30, [-200, 95, 130, 101])},
   {ce: 'În gură: un singur „mergi 30 pași”', msg: 'În gura lui „repetă până când”: doar „mergi 30 pași”.', ok: (U, P) => eq(SC.subPana(P), ['mergi']) && eq(A.valori(P, 'mergi'), [[30]])},
   {ce: 'Pisica se oprește la x 130, ca în caiet', o: STRAMB, msg: 'În caiet: −200, −170, …, 100, apoi 130, iar 130 ≤ 100 e fals.', ok: U => U.terminat && U.x === 130 && U.y === 0},
   {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde, deasupra scenei, și privește pisica.', ok: (U, P, S) => S.apasatSteag}],
  solutie: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', -200, 0], ['orienteaza', 90], ['repeta_pana', {s: {0: POZ('mai_mare', 100)}, guri: [[['mergi', 30]]]}]]}],
  gresit: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', -200, 0], ['orienteaza', 90], ['repeta_pana', {s: {0: POZ('mai_mic', 100)}, guri: [[['mergi', 30]]]}]]}],
  ajutor: 'Control: „repetă până când”. Operatori: „( ) > (50)” în locul în șase colțuri; Mișcare: „poziția x” în prima căsuță; 100 în a doua. În gură: „mergi 30 pași”. Butonul „Pas cu pas” îți arată blocurile pe rând.',
  why: 'Caietul repetă cât timp x ≤ 100; Scratch se oprește când x > 100. Pisica merge −200, −170, …, 100, 130: la 130 se oprește.',
  inca: [
   {t: 'urmarire', mod: 'teste', q: 'Același fel de algoritm, mai scurt: x pornește de la −40. Completează tabelul.', prog: ATELIER_PS, date: [{}],
    ajutor: 'La fiecare test: x de pe rândul de deasupra ≤ 50? Dacă da, x crește cu 30.', why: 'x: −10, 20, 50, 80. La 80, testul 80 ≤ 50 e fals: se afișează 80.'}
  ]},
 qs: [
  {t: 'choice', q: `Pisica pornește din x 0, cu fața spre dreapta. Ce face, după steag?${STIVA([['repeta_pana', {s: {0: POZ('mai_mare', 50)}, guri: [[['mergi', 20]]]}], ['spune_sec', 'Gata!', 2]])}`,
   o: ['Merge până la x 60, apoi spune „Gata!”', 'Merge până la x 40, apoi spune „Gata!”', 'Spune „Gata!” după fiecare pas', 'Nu pleacă deloc'], ok: 0,
   why: 'Testele: 0 > 50, 20 > 50, 40 > 50 sunt false, deci pisica mai merge. La 60, 60 > 50 e adevărat: se oprește. „Gata!” e sub braț: o dată, la final.'},
  {t: 'choice', q: 'În caiet: x pornește de la 0; cât timp x ≤ 80 execută, pisica merge 30 de pași. În Scratch, ce condiție pui în „repetă până când”?', o: ['(poziția x) > 80', '(poziția x) < 80', '(poziția x) = 80', 'atinge marginea?'], ok: 0,
   why: 'Opusul lui x ≤ 80 e x > 80: pisica merge 0, 30, 60, 90, iar 90 > 80 o oprește. Cu < 80 n-ar pleca deloc; cu = 80 n-ar nimeri niciodată 80 și nu s-ar opri.'},
  {t: 'cattimpori', q: 'De câte ori se execută rândul „x ← x + 3”?', cere: 'ori',
   prog: ['x ← 12', 'cât timp x ≤ 10 execută', '   x ← x + 3', 'sfârșit cât timp', 'Afișează x'],
   why: 'Primul test, 12 ≤ 10, e fals: corpul se execută de 0 ori. La „cât timp”, testul e înainte.'},

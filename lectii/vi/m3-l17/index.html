/* tema: un rând din tabelul de urmărire, ca pe caiet */
.banda{display:flex;align-items:stretch;gap:0;padding:6px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent);font-family:var(--fm);font-size:.72rem;font-weight:700}

<script>
/* Lecția 17, clasa a VI-a (M3, recapitulare): „Recapitulăm: algoritm, date, secvență, decizie”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Simulatorul: lectii/_sim/urmarire-algoritm.js (NOU, proprietar lecția aceasta): tabelul de urmărire („urmarire”) și
   completarea unui rând („completeaza”), verificate pe COMPORTAMENT; listările și tabelele din pași le face tot el
   (UrmarireAlgoritm.listare / .tabel), deci valorile din exemple sunt calculate, nu scrise de mână.
   Notația e a clasei a V-a (jocul algoritmi-v; testul inițial al profesorului): Citește, ←, Dacă … atunci … altfel,
   Afișează, Început / Sfârșit. Granița: NU repetiția (lecțiile 19-23), NU aplicația de exersare (18), NU blocurile (24).
   Aplicația reală: Notepad (gesturile scrise din nou în casete, cu fereastra spusă întâi), fișierul elevului în Documente
   (convenția VI/3). Reparată după judecata 1 (19.10.2026): _verificare/registru_j1.md, puncte A–S. */
const L = p => UrmarireAlgoritm.listare(p);
const T = (p, d) => UrmarireAlgoritm.tabel(p, d, {calcul: true});
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum la calculator, în Notepad</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;

/* ---- programele lecției (aceleași în pași, în simulator și la laborator) ---- */
const P_MARA_GRESIT = ['Început', 'Citește preț', 'total ← preț * 4', 'Afișează cam cât face total', 'Sfârșit'];
const P_MARA = ['Început', 'Citește preț, n', 'total ← preț * n', 'Afișează total', 'Sfârșit'];
const P_MUZEU_COST = ['Început', 'Citește n, preț, autocar', 'bilete ← n * preț', 'total ← bilete + autocar', 'Afișează total', 'Sfârșit'];
const P_DRUM = ['Început', 'Citește km, v', 'h ← km / v', 'min ← h * 60', 'Afișează min', 'Sfârșit'];
const P_SECV = ['Început', 'Citește b', 'b ← b + 3 * 4', 'rest ← b % 5', 'Afișează rest', 'Sfârșit'];
const P_PARC = ['Început', 'Citește înălțime', 'Dacă înălțime ≥ 140 atunci', '   Afișează „traseul mare”', 'altfel', '   Afișează „traseul mic”', 'Sfârșit'];
const P_MUZEU = ['Început', 'Citește vârsta, n', 'Dacă vârsta ≥ 14 atunci', '   bilet ← 15', 'altfel', '   bilet ← 8', 'total ← (bilet + 5) * n', 'Afișează total', 'Sfârșit'];

/* proba la prag (pasul 5): valorile sunt calculate de interpretor, nu scrise de mână */
const PRAG = (() => {
  const r = [2, 3, 4].map(n => {
    const a = UrmarireAlgoritm.evalueaza('n ≤ 3', {n}), b = UrmarireAlgoritm.evalueaza('n < 3', {n}), f = UrmarireAlgoritm.format;
    return `<tr><td>${n}</td><td${a !== b ? ' class="dif"' : ''}>${f(a)}</td><td${a !== b ? ' class="dif"' : ''}>${f(b)}</td></tr>`;
  }).join('');
  return `<div class="ua-tw"><table class="tt"><thead><tr><th>n (cărți)</th><th><code>n ≤ 3</code> (corect)</th><th><code>n &lt; 3</code> (greșit)</th></tr></thead><tbody>${r}</tbody></table></div>`;
})();

/* ---- „Acum la calculator, în Notepad” (laboratorul, după atelier). FĂRĂ profesor, pe calculatorul comun: fișierul
   elevului în Documente (sau folderul de pe tablă), Notepad lăsat gol la final. Datele (14 și 13, n = 4) NU sunt ale
   atelierului. Reparat după J1 (registrul _verificare/registru_j1.md, A, C, L, M, N): fiecare scurtătură spune întâi
   fereastra; urmărirea are TIPAR (copiat odată cu algoritmul; elevul înlocuiește fiecare ?); cazul 13 = „dacă mai ai timp”. */
const TIPAR = ['Urmărirea pentru vârsta 14 și n = 4', 'rândul 2: vârsta = 14, n = 4', 'rândul 3: 14 ≥ 14 e ?', 'rândul 4: bilet = ?', 'rândul 6: nu se execută', 'rândul 7: total = ?', 'rândul 8: se afișează ?'];
const LAB = [
  'Fișierul tău (<code>Algoritm_</code>, clasa și numele tău) e deschis în Notepad? Treci la punctul 2. L-ai închis? Explorer (dosarul galben), <b>Documente</b> (sau folderul de pe tablă), dublu-clic pe el. Nu-l ai deloc? Pornește Notepad, scrie numele tău pe primul rând și salvează-l ca la pasul „Datele…”.',
  `În pagină, copiază algoritmul muzeului și tiparul de sub el: ține apăsat butonul stâng al mouse-ului pe „Început” și trage până după ultimul <b>?</b>; <kbd>Ctrl</kbd>+<kbd>C</kbd>. Apoi clic în Notepad, la sfârșitul textului, <kbd>Enter</kbd> și <kbd>Ctrl</kbd>+<kbd>V</kbd>.${L(P_MUZEU)}<pre class="np-ex">${TIPAR.join('\n')}</pre>`,
  `În Notepad, înlocuiește fiecare <b>?</b> cu ce se întâmplă pentru <b>vârsta 14</b> și <b>n = 4</b>. Numerele rândurilor le vezi în pagină. Apoi, tot în Notepad, <kbd>Ctrl</kbd>+<kbd>S</kbd>: se salvează fără fereastră. <details class="verif"><summary>Verifică-te, după ce ai scris</summary>rândul 3: 14 ≥ 14 e adevărat · rândul 4: bilet = 15 · rândul 6: nu se execută · rândul 7: total = (15 + 5) * 4 = 80 · rândul 8: se afișează 80.</details>`,
  `<b>Dacă mai ai timp:</b> clic în Notepad, la sfârșitul textului, <kbd>Enter</kbd>, apoi scrie ce afișează algoritmul pentru <b>vârsta 13</b> și <b>n = 4</b>. Apoi <kbd>Ctrl</kbd>+<kbd>S</kbd>. <details class="verif"><summary>Verifică-te</summary>Condiția 13 ≥ 14 e falsă, deci bilet = 8, total = (8 + 5) * 4 = 52: se afișează 52.</details>`,
  'Lasă calculatorul cum l-ai găsit. Clic în Notepad. Pe Windows 11: <b>Fișier</b> › <b>Închideți fila</b>. Pe Windows 10: <b>X</b>-ul ferestrei Notepad, sus în colțul ei din dreapta (nu X-ul paginii). Dacă întreabă „Salvați modificările…?”, alege <b>Salvare</b>. Fișierul tău rămâne în folder.'
];

JocMotor.porneste({
  cheie: 'lectie_vi_m3_l17',
  mod: 'lectie',
  titlu: 'Recapitulăm: algoritm, date, secvență, decizie',
  marca: 'Lecția <b>17</b> · clasa a VI-a',
  h1: 'Recapitulăm: <span class="acc">algoritm, date, secvență, decizie</span>',
  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a VI-a',
  unitate: 'VI-U3',
  unitateTitlu: 'Algoritmi: structuri repetitive',
  competente: ['CS.2.2'],
  lectii: '17',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a VI-a, CS.2.2 · unitatea VI-U3 „Algoritmi: structuri repetitive” · lecția 17, recapitulare. Reia conținuturile clasei a V-a: „Noțiunea de algoritm”, „Proprietăți ale algoritmilor”, „Clasificarea datelor cu care lucrează algoritmii în funcţie de rolul acestora (de intrare, de ieșire, de manevră)”, „Constante și variabile”, „Expresii (operatori aritmetici, relaționali, logici; evaluarea expresiilor)”, „Structura secvenţială (liniară)”, „Structura alternativă (decizională)”',
  intro: '<p>Reiei, pe probleme scurte, algoritmii din clasa a V-a și îi execuți tu, într-un tabel. <b>Ai nevoie de:</b> din clasa a V-a, algoritmii scriși în cuvinte, Explorer și folderul Documente; Notepad (gesturile sunt scrise din nou, în casete); clasa a VI-a, lecția 3 (numele fișierului, „numele există deja”).</p>',
  cum: `<b>Cum lucrezi</b><ol><li>6 pași scurți, cu câte un exercițiu fără puncte și, la pașii 1-4, gesturi în Notepad. „Încă un exercițiu” și „Dacă mai ai timp” sunt pentru cine termină repede.</li><li>Atelierul: un algoritm executat în tabel, o dată și exact la prag.</li><li>Acum la calculator: termini fișierul din Notepad.</li><li>5 întrebări: pentru ele primești stele.</li></ol>`,
  banda: '<span class="bd-c">rândul 3</span><span class="bd-c">vârsta = 14</span><span class="bd-c">14 ≥ 14: adevărat</span><span class="bd-c">bilet = 15</span><span class="bd-c">se afișează 80</span>',
  nivele: [
{t: 'Recapitulăm: algoritm, date, secvență, decizie', final: true, lectii: [17],
 continuturi: ['Etapele unui exercițiu algoritmic utilizând aplicația aleasă'],
 obiectiv: 'verifici un algoritm cu cele trei întrebări, spui rolul fiecărei date și execuți pas cu pas, într-un tabel, un algoritm cu secvență și decizie, inclusiv exact la prag.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: pașii pe care îi urmează o mașină',
   text: `<p>Ai cumpărat vreodată un bilet de la un automat ca acesta? Automatul nu ghicește: urmează pași scriși de oameni. Află ce bilet vrei, primește banii, verifică dacă ajung, apoi îți dă biletul și restul.</p>
<p>Pașii aceștia formează un algoritm. Azi reiei algoritmii din clasa a V-a și îi execuți tu, ca un calculator.</p>
${fig('automat-bilete.webp', 400, 711, 'Un automat de bilete de transport în comun: sus un ecran cu butonul Cumpără bilet de hârtie, la mijloc locul pentru card, jos tava din care ies biletul și restul', 'Un automat de bilete din Galați. <small>Foto: Baditastefan, <a href="https://commons.wikimedia.org/wiki/File:Automat_de_bilete_Galati.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0; micșorată.</small>')}`},
  /* ---- pasul 1: algoritmul și cele trei proprietăți ---- */
  {t: 'Un algoritm bun: trei întrebări',
   text: `<p>Problema: Mara vrea să afle cât plătește pe biletele de autobuz ale familiei. Fratele ei îi scrie pașii.</p>
<p>Un <mark>algoritm</mark> e un șir de pași clari, în ordine, care rezolvă o problemă. Îl verifici punând fiecărui rând trei întrebări:</p>
<ol><li><b>Se înțelege la fel, de oricine?</b> Cuvintele <i>puțin, câteva, cam</i> strică <mark>claritatea</mark>.</li>
<li><b>Se termină?</b> „Fără oprire”, „la nesfârșit” strică <mark>finitudinea</mark>.</li>
<li><b>Merge și pentru alte date?</b> Un număr fix, acolo unde trebuia o dată citită, strică <mark>generalitatea</mark>.</li></ol>`,
   exemplu: `<p>Pașii fratelui. Săgeata <code>←</code> se citește „primește”.</p>${L(P_MARA_GRESIT)}
<p>Rândul 3 merge doar pentru 4 bilete: lipsește generalitatea. Rândul 4 nu e clar: cât e „cam”? Reparat, cu <code>n</code> = numărul de bilete:</p>${L(P_MARA)}
${ACUM('Pornește <b>Notepad</b>: butonul Start, scrii <code>note</code>, clic pe <b>Notepad</b>.', 'Are deja textul altcuiva? Nu scrie peste el. Pe Windows 11 apeși <b>+</b>, sus, lângă file: lucrezi într-o filă nouă. Pe Windows 10 îl lași așa și pornești Notepad încă o dată, din Start.', 'Pe primul rând scrie <code>Recapitulare algoritmi</code>, numele tău și clasa.')}`,
   altfel: `<p>Gândește-te la un robot care face exact ce scrie. Dacă scrie „cam”, nu știe cât. Dacă scrie „la nesfârșit”, nu se mai oprește. Dacă scrie 4, plătește 4 bilete chiar și pentru o familie de 5.</p>`,
   incearca: {t: 'hunt', cod: true, q: 'Algoritmul lui Radu află perimetrul unui pătrat cu latura <code>L</code>. Două rânduri strică proprietățile. Apasă pe ele.',
    src: `Început
Citește L
[[P ← 4 * 5|Merge doar pentru latura 5. Folosește data citită: P ← 4 * L (generalitatea).]]
Afișează P
[[Așteaptă la nesfârșit.|Algoritmul nu se mai termină: rândul se șterge (finitudinea).]]
Sfârșit`,
    corect: `Început
Citește L
P ← 4 * L
Afișează P
Sfârșit`,
    ajutor: 'Întrebarea 3: merge și pentru latura 7? Întrebarea 2: se termină fiecare rând?', indiciu: 'Caută rândul cu un număr fix pus în locul datei citite (L) și rândul care nu se termină.',
    why: 'Cu 5 în loc de L, algoritmul dă mereu 20, oricare ar fi latura citită: lipsește generalitatea. „La nesfârșit” înseamnă că nu se oprește: lipsește finitudinea.'},
   inca: [
    {t: 'classify', q: 'Ce proprietate strică fiecare rând?', cats: ['Claritatea', 'Finitudinea', 'Generalitatea'],
     items: [['Pune sare după gust.', 0], ['Afișează suma lui 12 și 8.', 2], ['Bate ouăle fără să te oprești.', 1], ['Mergi cam 100 de metri.', 0]],
     ajutor: 'Pune cele trei întrebări: se înțelege? se termină? merge și pentru alte date?',
     why: '„După gust” și „cam” nu se înțeleg la fel de toți. Fără oprire, rândul nu se termină. Suma lui 12 și 8 e mereu aceeași: merge pentru un singur caz.'},
    {t: 'choice', q: 'Algoritmul află cât costă <code>n</code> caiete de <code>preț</code> lei fiecare. Care rând are generalitate?', o: ['total ← preț * n', 'total ← 3 * 5', 'total ← 15', 'total ← preț * 4'], ok: 0,
     ajutor: 'Care rând folosește ambele date citite?', why: 'Doar preț * n merge pentru orice număr de caiete și orice preț. Celelalte au numere fixe.'}
   ]},
  /* ---- pasul 2: datele ---- */
  {t: 'Datele: ce intră, ce iese, ce ajută pe drum',
   text: `<p>Problema: clasa merge la muzeu. Cât costă biletele și autocarul? (<code>n</code> = câți elevi merg, <code>preț</code> = prețul unui bilet, <code>autocar</code> = prețul autocarului.)</p>
${L(P_MUZEU_COST)}
<p>După rolul lor, datele sunt:</p>
<ul><li><mark>de intrare</mark>: le primești la început, după <b>Citește</b> (n, preț, autocar);</li>
<li><mark>de ieșire</mark>: rezultatul, după <b>Afișează</b> (total);</li>
<li><mark>de manevră</mark>: calculate pe drum, ca ajutor; nu se citesc și nu se afișează (bilete).</li></ul>`,
   exemplu: `<p>O <mark>variabilă</mark> e ca o cutie cu nume: valoarea din ea se poate schimba (n, total). O <mark>constantă</mark> nu se schimbă: în <code>P ← 4 * L</code>, 4 e o constantă, ca cele 60 de minute dintr-o oră.</p>
${ACUM('Clic în Notepad, pe textul tău (sau pe Notepad, în bara de jos a ecranului). Abia apoi salvezi: <kbd>Ctrl</kbd>+<kbd>S</kbd>. Dacă fereastra propune numele lecției („Lecția 17…”), ai apăsat în pagină: <b>Anulare</b>, clic în Notepad și din nou <kbd>Ctrl</kbd>+<kbd>S</kbd>.', 'În fereastra <b>Salvare ca</b>, numele propus e colorat: scrie direct <code>Algoritm_</code>, clasa și numele tău, de exemplu <code>Algoritm_6A_Popescu</code> (liniuța de jos: <kbd>Shift</kbd> + tasta cu minus).', 'Abia apoi, în stânga, <b>Documente</b> (sau folderul scris pe tablă). Te uiți sus, la numele folderului, și apeși <b>Salvare</b>. Notepad adaugă singur <code>.txt</code>.', 'Apare „… există deja. Îl înlocuiți?”: e fișierul unui coleg. Apasă <b>Nu</b>: fereastra rămâne deschisă. Dai clic în <b>Nume fișier</b>, ștergi ce scrie acolo și scrii din nou numele, cu prenumele la sfârșit (<code>Algoritm_6A_Popescu_Ana</code>), și apasă <b>Salvare</b>.')}`,
   altfel: `<p>Ca la o prăjitură: ouăle, făina și zahărul cumpărate sunt datele de intrare. Aluatul, făcut pe drum, e o dată de manevră: nu l-ai cumpărat și nu-l servești. Prăjitura de pe masă, la final, e data de ieșire.</p>`,
   incearca: {t: 'classify', q: `Algoritmul află în câte minute ajunge autocarul (<code>km</code> = distanța, <code>v</code> = câți kilometri face într-o oră):${L(P_DRUM)}Ce rol are fiecare?`,
    cats: ['De intrare', 'De ieșire', 'De manevră', 'Constantă'], items: [['km', 0], ['v', 0], ['h', 2], ['min', 1], ['60', 3]],
    ajutor: 'Ce vine după Citește? Ce vine după Afișează? Ce se calculează doar pe drum? Ce număr nu se schimbă niciodată?',

  /* ---- pasul 3: secvența, atribuirea, tabelul de urmărire ---- */
  {t: 'Secvența, executată ca un calculator',
   text: `<p>Problema: Ana are <code>b</code> bomboane. Mai primește 3 pungi cu câte 4. Apoi împarte toate bomboanele în mod egal la 5 prieteni. Câte îi rămân?</p>
<p>În <mark>structura secvențială</mark>, fiecare rând se execută o dată, de sus în jos. Verifici algoritmul executându-l tu, rând cu rând, într-un <mark>tabel de urmărire</mark>. La o <mark>atribuire</mark>, ca <code>b ← b + 3 * 4</code>:</p>
<ol><li>în dreapta săgeții pui valorile de <b>acum</b>;</li>
<li>calculezi: întâi parantezele, apoi <code>*</code> <code>/</code> <code>%</code>, apoi <code>+</code> <code>-</code> (<code>%</code> dă restul împărțirii);</li>
<li>scrii rezultatul în variabila din stânga. Valoarea ei veche se pierde.</li></ol>`,
   exemplu: `<p>Algoritmul Anei, pentru <code>b = 6</code>:</p>${T(P_SECV, {b: 6})}
<p>La rândul 3, <code>b</code> primește 18, iar 6 se pierde. La rândul 4: 5 încape de 3 ori în 18 și rămân 3, deci <code>18 % 5 = 3</code>.</p>
${ACUM(`<b>Dacă mai ai timp</b> (laboratorul reia gestul): în pagină, copiază algoritmul din chenarul de mai jos (nu tabelul de sus): ține apăsat butonul stâng al mouse-ului pe „Început” și trage până după „Sfârșit”; <kbd>Ctrl</kbd>+<kbd>C</kbd>. Numerele rândurilor din chenar nu se copiază.${L(P_SECV)}`, '<b>Tot dacă ai copiat:</b> clic în Notepad, la sfârșitul textului, <kbd>Enter</kbd>, apoi <kbd>Ctrl</kbd>+<kbd>V</kbd>. Tot în Notepad, <kbd>Ctrl</kbd>+<kbd>S</kbd>: fișierul are deja nume și folder, deci se salvează fără fereastră.')}`,
   altfel: `<p>Tabelul e ca jurnalul unui detectiv: după fiecare rând notezi ce s-a schimbat. Nu sari niciun rând și folosești mereu ce scrie în jurnal acum, nu ce era la început.</p>`,
   incearca: {t: 'urmarire', q: 'Execută algoritmul pentru datele de mai jos, rând cu rând, apoi apasă „Verifică tabelul”.',

    ajutor: 'Rândul 3: întâi y * 2, apoi aduni x. Rândul 4: restul împărțirii lui s la 4. Rândul 5: x are acum valoarea nouă.',
    why: 'Ai folosit la fiecare rând valorile de acum: s de la rândul 3, apoi x cel nou, de la rândul 4. Valoarea citită a lui x s-a pierdut.'},
   inca: [
    {t: 'urmarire', q: 'Încă unul: urmărește ce se întâmplă cu <code>a</code> și <code>b</code>. Ce face algoritmul cu ele?',

     date: [{a: 5, b: 8}, {a: 2, b: 9}, {a: 7, b: 3}, {a: 10, b: 4}],
     ajutor: 'La rândul 4 folosești a cel nou, de la rândul 3. La rândul 5, și a, și b sunt cele noi.',
     why: 'La final a și b și-au schimbat valorile între ele. Aici merge fără altă variabilă pentru că sunt numere și folosim + și -. În general (și cu texte), schimbul se face cu o variabilă ajutătoare, aux, ca în clasa a V-a.'},
    {t: 'order', q: 'Pune în ordine rândurile algoritmului care află aria unui triunghi (<code>b</code> = baza, <code>h</code> = înălțimea).', items: ['Început', 'Citește b, h', 'aria ← b * h / 2', 'Afișează aria', 'Sfârșit'],
     ajutor: 'Nu poți calcula fără date și nu poți afișa ce n-ai calculat.', why: 'Citești datele, calculezi cu ele, afișezi rezultatul, între Început și Sfârșit.'}

  /* ---- pasul 4: decizia ---- */
  {t: 'Decizia: Dacă … atunci … altfel',
   text: `<p>Problema: la parcul de aventură, traseul mare e doar pentru copiii de cel puțin 140 cm. Algoritmul de mai jos, din „Uite cum”, alege cu <mark>structura alternativă</mark> (decizia).</p>
<p><mark>Condiția</mark>, aici <code>înălțime ≥ 140</code>, e adevărată sau falsă. Rândurile mai la dreapta formează o <mark>ramură</mark>: ramura <b>atunci</b> și ramura <b>altfel</b>. Se execută una singură: atunci, la adevărat; altfel, la fals. Ramura altfel poate lipsi: la fals, treci la rândul de după decizie.</p>`,
   exemplu: `<p>Algoritmul parcului, pentru <code>înălțime = 132</code>:</p>${T(P_PARC, {'înălțime': 132})}
<p>Condiția compară: <code>&lt;</code> <code>≤</code> <code>&gt;</code> <code>≥</code> <code>=</code> <code>≠</code>. Două comparații se leagă cu <b>ȘI</b> (adevărat doar dacă amândouă sunt adevărate) sau cu <b>SAU</b> (ajunge una). <b>NU</b> schimbă adevărat în fals și invers.</p>
${ACUM('Clic în Notepad, la sfârșitul textului, și <kbd>Enter</kbd>. Pe rândul nou scrie <code>Parcul, 140 cm:</code> și ce afișează algoritmul parcului pentru 140 cm. Apoi, tot în Notepad, <kbd>Ctrl</kbd>+<kbd>S</kbd>.')}`,
   altfel: `<p>E ca la o răscruce cu indicator: citești indicatorul (condiția) și mergi pe un singur drum. Nu poți merge pe amândouă deodată, iar după răscruce drumurile se unesc din nou.</p>`,
   incearca: {t: 'urmarire', q: 'La bazin, copiii sub 7 ani intră gratuit, ceilalți plătesc 12 lei, iar dulapul costă 3 lei pentru toți. Execută algoritmul.',

   inca: [

     prog: ['Început', 'Citește nota', 'Dacă nota ≥ 9 atunci', '   Afișează „Felicitări!”', 'Afișează nota', 'Sfârșit'],

    {t: 'choice', q: '<code>x = 12</code>. Ce valoare are condiția <code>x &gt; 10 ȘI x &lt; 12</code>?', o: ['fals', 'adevărat', '12', '10'], ok: 0,

   ]},
  /* ---- pasul 5: strategia (etapele) și proba la prag ---- */
  {t: 'Strategia: de la cerință la algoritm verificat',
   text: `<p>La o problemă nouă lucrezi în patru etape:</p>
<ol><li><b>Cerința</b>: afli datele de intrare și ce trebuie să iasă.</li>

<li><b>Proba</b>: îl execuți în tabel, pe date alese. La o decizie iei o valoare sub <mark>prag</mark>, una exact la prag și una peste. Pragul e numărul de care depinde decizia.</li>
<li><b>Corectezi</b> ce nu iese cum trebuia.</li></ol>
<p>Pentru condiție, cuvintele devin semne: <i>sub</i> → <code>&lt;</code>, <i>peste</i> → <code>&gt;</code>, <i>cel puțin</i> → <code>≥</code>, <i>cel mult</i> → <code>≤</code>.</p>`,
   exemplu: `<p>La bibliotecă împrumuți <i>cel mult</i> 3 cărți, deci condiția e <code>n ≤ 3</code>. Proba arată de ce nu merge <code>n &lt; 3</code>:</p>${PRAG}

   inca: [

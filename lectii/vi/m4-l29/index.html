   Granița: NU interfața (VI/27), ciclul de depanare (VI/28), proprietățile (VI/30), temporizarea (VI/31), tastele (VI/32), notarea (VI/34-35). */

const ACUM = (lbl, ...p) => `<div class="acum" role="note"><div class="lbl">${lbl}</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;

/* R1 (M1, M2, J1-m2, J1-m3): ce VEDE elevul la steag. Fiecare „spune”, cu locul pisicii și câte cadre (30 = 1 s) stă balonul
   în același loc: până la alt loc, alt balon sau sfârșitul rulării. Un „spune” cu text gol nu pune balon (nu apare în listă);
   unul „pentru 0 secunde” stă 0 cadre (în Scratch, balonul dispare imediat). START = de unde pornește pisica la test.
   Structura e judecată separat, ca la VI/19: un singur bloc galben, cu blocuri sub el, și nimic deoparte. */
const START = {x: 150, y: 0, directie: 90}, SE_VEDE = 15;
const spuse = U => {
  const ev = U.evenimente || [], S = [];
  let p = [START.x, START.y];
  ev.forEach((e, i) => {
    if (e.tip === 'poz') p = e.valoare;
    if (e.tip !== 'spune') return;
    const urm = ev.slice(i + 1).find(f => f.tip === 'spune' || (f.tip === 'poz' && (f.valoare[0] !== p[0] || f.valoare[1] !== p[1])));
    S.push({x: p[0], y: p[1], text: e.valoare, cadre: (urm ? urm.cadru : U.cadre) - e.cadru});
  });
  return S;
};

  /* ---- P2: cadrul, compoziția ---- */
  {t: 'Cadrul și compoziția',
   text: `<p>O căsuță din storyboard e un <mark>cadru</mark>: ce se vede într-un singur moment, ca o fotografie din animație. O animație adevărată are mult mai multe cadre; în storyboard desenezi doar pe cele care spun povestea.</p>
<p><mark>Compoziția</mark> înseamnă ce pui într-un cadru și unde: ce e în fundal, ce obiecte sunt, unde stă fiecare, cine e mare și cine e mic.</p>`,
   exemplu: `<p>Același moment, cu două compoziții. În prima abia găsești pisica și fluturele; în a doua le vezi imediat. Ce e important pui mai mare, la vedere.</p>${SC.banda([
     {desen: {f: 'parc', alt: 'Copac foarte mare în mijloc; pisica foarte mică, într-un colț', ob: [['copac', 62, 104, {s: 1.8}], ['pisica', 140, 104, {s: .5}], ['fluture', 150, 72, {s: .5}]]}, text: 'Pisica e mică, într-un colț.'},
     {desen: {f: 'parc', alt: 'Copac mic la stânga; pisica mare în mijloc; fluturele lângă ea', ob: [['copac', 22, 96, {s: .85}], ['pisica', 84, 104, {s: 1.4}], ['fluture', 132, 42, {s: 1.2}]]}, text: 'Pisica e mare, la mijloc.'}
   ], {coloane: 2})}`,
   altfel: `<p>Gândește-te la o fotografie de clasă: compoziția e cine stă în față, cine în spate și ce se vede în fundal.</p>`,
   incearca: {t: 'casute_compozitie', q: 'Fă acest cadru: <b>copacul în stânga</b>, <b>soarele sus</b>, <b>pisica jos, în dreapta</b>. Atingi un nume, apoi un loc din cadru (pe calculator: clic).',
    f: 'parc', obiecte: [{id: 'copac', o: 'copac', nume: 'Copacul', s: .85}, {id: 'soare', o: 'soare', nume: 'Soarele'}, {id: 'pisica', o: 'pisica', nume: 'Pisica'}],
    teste: [
     {ce: 'Copacul e în stânga', msg: 'Copacul nu e în coloana din stânga. Atinge „Copacul”, apoi un loc din stânga cadrului.', ok: S => S.loc.copac.c === 0},
     {ce: 'Soarele e sus', msg: 'Soarele nu e pe rândul de sus. Atinge „Soarele”, apoi un loc de sus.', ok: S => S.loc.soare.r === 0},
     {ce: 'Pisica e jos, în dreapta', msg: 'Pisica nu e în colțul de jos din dreapta. Atinge „Pisica”, apoi acel colț.', ok: S => S.loc.pisica.c === 2 && S.loc.pisica.r === 2}],
    solutie: {copac: [0, 2], soare: [1, 0], pisica: [2, 2]}, gresit: {copac: [0, 2], soare: [1, 0], pisica: [1, 2]},
    ajutor: 'Sunt 9 locuri: trei rânduri și trei coloane. Primul loc atins pentru un obiect se poate schimba oricând.', why: 'Așa arată o compoziție spusă în cuvinte: ce obiecte sunt și unde stă fiecare.'},
   inca: [
    {t: 'casute_compozitie', q: 'Alt cadru: <b>norul sus, în stânga</b>, <b>muntele în dreapta</b>, <b>barca jos, la mijloc</b>.',
     f: 'lac', obiecte: [{id: 'nor', o: 'nor', nume: 'Norul'}, {id: 'munte', o: 'munte', nume: 'Muntele', s: .8}, {id: 'barca', o: 'barca', nume: 'Barca'}],
     teste: [
      {ce: 'Norul e sus, în stânga', msg: 'Norul nu e în colțul de sus din stânga. Atinge „Norul”, apoi acel colț.', ok: S => S.loc.nor.c === 0 && S.loc.nor.r === 0},
      {ce: 'Muntele e în dreapta', msg: 'Muntele nu e în coloana din dreapta. Atinge „Muntele”, apoi un loc din dreapta.', ok: S => S.loc.munte.c === 2},
      {ce: 'Barca e jos, la mijloc', msg: 'Barca nu e jos, la mijloc. Atinge „Barca”, apoi locul de jos din coloana din mijloc.', ok: S => S.loc.barca.c === 1 && S.loc.barca.r === 2}],
     solutie: {nor: [0, 0], munte: [2, 1], barca: [1, 2]}, gresit: {nor: [2, 0], munte: [2, 1], barca: [1, 2]},
     ajutor: 'Coloana din stânga, coloana din mijloc, coloana din dreapta; rândul de sus, cel din mijloc, cel de jos.', why: 'Ai pus fiecare obiect unde cerea cadrul.'}
   ]},
  /* ---- P3: obiectele animate, harta spre Scratch ---- */
  {t: 'Obiectele animate și ce sunt ele în Scratch',
   text: `<p>Compară căsuțele vecine, pe rând. Ce se mută sau arată altfel, măcar o dată, e un <mark>obiect animat</mark>. Ce rămâne la fel în toate căsuțele stă pe loc, în fundal.</p>
<p>În Scratch, cuvântul „cadru” nu apare pe ecran. Cadrul de pe hârtie e, în Scratch, un moment din rularea programului: ce decor e pe scenă, unde stă personajul și ce costum are. (În jocul „Misiunea Cadru”, cadrele pisicii erau costumele ei; aici, cadrul are și decorul, și locul.)</p>
<table class="harta"><tr><th>Pe hârtie</th><th>În Scratch</th></tr>
<tr><td>Obiectul animat</td><td>Un <b>personaj</b>. S-a mutat? Are alt x și y. Arată altfel? Are alt <b>costum</b>.</td></tr>
<tr><td>Fundalul căsuței</td><td><b>Decorul</b> scenei.</td></tr>
<tr><td>Cadrul</td><td>Un <b>moment</b> din rulare.</td></tr></table>`,
   exemplu: `${fig('fila-costume.webp', 330, 240, 'Fila Costume din editor: două desene ale pisicii, costume1 și costume2', 'Fila <b>Costume</b>: două desene ale aceleiași pisici, deci două costume.')}
<p>Programul acesta are două momente. Pisica stă în primul cât vorbește, cam 2 secunde:</p>
${fig('program-casute.webp', 243, 195, 'Programul din editor: când se dă click pe steag, mergi la x -120 y -40, spune Bună! pentru 2 secunde, mergi la x 120 y -40, spune Am ajuns! pentru 2 secunde', 'Captură din Scratch.')}
<div class="duo">${fig('moment-1.webp', 360, 271, 'Scena: pisica la stânga spune Bună!, pe cer albastru cu dealuri', 'Primul moment: x −120.')}${fig('moment-2.webp', 360, 271, 'Scena: pisica la dreapta spune Am ajuns!, pe același fundal', 'Al doilea moment: x 120, același decor.')}</div>`,
   altfel: `<p>La teatru, decorul e pânza din spate, actorul e personajul, iar costumul e cum arată actorul: cu mâna jos e un costum, cu mâna sus e altul. Un cadru e ce vezi dacă faci o fotografie a scenei.</p>`,
   incearca: {t: 'casute_obiect', q: 'Compară cele două căsuțe vecine. Alege pentru fiecare ce s-a întâmplat cu el între ele.',
    a: {f: 'parc', alt: 'Căsuța 1: copac la stânga, soare sus, pisica la mijloc cu laba jos, fluture sus în dreapta', ob: [['copac', 30, 98], ['soare', 88, 32], ['pisica', 82, 102], ['fluture', 136, 40]]},
    b: {f: 'parc', alt: 'Căsuța 2: copac la stânga, soare sus, pisica la mijloc cu laba ridicată, fluture mai jos, în stânga pisicii', ob: [['copac', 30, 98], ['soare', 88, 32], ['pisica', 82, 102, {laba: true}], ['fluture', 58, 62]]},
    obiecte: [{id: 'copac', nume: 'Copacul', ok: 'pe_loc'}, {id: 'soare', nume: 'Soarele', ok: 'pe_loc'}, {id: 'fluture', nume: 'Fluturele', ok: 'mutat'}, {id: 'pisica', nume: 'Pisica', ok: 'altfel'}],
    gresit: {copac: 'pe_loc', soare: 'pe_loc', fluture: 'mutat', pisica: 'mutat'},
    ajutor: 'Pune degetul pe un obiect în căsuța 1, apoi caută-l în căsuța 2: e în același loc? Arată la fel?', why: 'Fluturele are alt loc: în Scratch, alt x și y. Pisica e pe loc, dar și-a ridicat laba: alt costum. Copacul și soarele stau la fel; dacă rămân așa în toate căsuțele, țin de decor.'},
   inca: [
    {t: 'classify', q: 'Vrei să se vadă asta în animație. Ce schimbi în Scratch?', cats: ['Decorul', 'Costumul personajului', 'Locul personajului (x și y)'],
     items: [['Tot fundalul se face deșert', 0], ['Pisica ajunge în dreapta scenei', 2], ['Pisica ține ochii închiși', 1], ['Pădurea se schimbă cu un castel', 0], ['Pisica urcă spre marginea de sus', 2], ['Pisica ridică laba', 1]],
     ajutor: 'Fundalul e al scenei. Cum arată pisica ține de ea; unde stă se vede la x și y.', why: 'Decorul e fundalul, costumul e cum arată personajul, x și y spun unde stă.'}
   ]},
  /* ---- P4: în caiet ---- */
  {t: 'Storyboardul tău, în caiet',
   text: `<p>Alege o idee a ta: un personaj și ceva ce i se întâmplă. Una singură, scurtă. N-ai idee? Ia una: „Câinele își caută mingea” sau „Pisica vrea peștele de pe masă”.</p>
<p>Desenezi șase căsuțe. Prima arată începutul, ultima sfârșitul. Personajele le faci <mark>omuleți din bețe</mark> (în engleză, stick figure): un cerc pentru cap și linii pentru corp, mâini și picioare. Nu e un concurs de desen: contează să se înțeleagă.</p>
<p>Sub fiecare căsuță scrii o propoziție: ce se întâmplă. Cu o săgeată arăți ce se mută.</p>`,
   exemplu: `<p>Așa arată foaia. Prima căsuță e un exemplu; celelalte așteaptă:</p>${SC.banda([
     {desen: {f: 'alb', alt: 'O căsuță desenată simplu: omuleț din bețe, o minge și o săgeată care arată spre dreapta', ob: [['omulet', 50, 96], ['minge', 76, 96], ['sageata', 90, 88, {dx: 34}]]}, text: 'Ana lovește mingea.'},
     {desen: {f: 'alb', alt: 'Căsuță goală'}, text: '…'}, {desen: {f: 'alb', alt: 'Căsuță goală'}, text: '…'},
     {desen: {f: 'alb', alt: 'Căsuță goală'}, text: '…'}, {desen: {f: 'alb', alt: 'Căsuță goală'}, text: '…'}, {desen: {f: 'alb', alt: 'Căsuță goală'}, text: '…'}], {coloane: 2})}
${ACUM('Acum, în caiet (și dacă ești pe telefon): 11 minute',
  '<b>1 minut:</b> scrie ideea într-o singură propoziție.',
  '<b>1 minut:</b> împarte o pagină în șase, cu mâna, fără riglă (sau ia fișa de storyboard, dacă ai primit): o linie de sus în jos, două de-a curmezișul. Propoziția o scrii jos, în căsuță.',
  '<b>Cel mult un minut și jumătate pe căsuță.</b> Desen rapid, propoziție, săgeată dacă se mută ceva. Te uiți la ceas: după atât treci la următoarea, chiar dacă nu e gata.')}`,
   altfel: `<p>E ca o listă de cumpărături desenată: trebuie să înțelegi ce scrie, nu să fie frumoasă.</p>`,
   incearca: {t: 'choice', q: 'Sub căsuța asta scrii o singură propoziție. Care ajută cel mai mult pe cineva care nu știe povestea?' + SC.banda([FLUTURE[1]], {coloane: 2, fara_numere: true}).replace('<figcaption>Fluturele coboară spre pisică.</figcaption>', ''),
    o: ['Fluturele se apropie de pisică.', 'Aici am desenat foarte frumos.', 'Asta e a doua căsuță din șase.', 'Vezi desenul și îți dai seama.'], ok: 0,
    ajutor: 'Propoziția spune ce se întâmplă în acel moment.', why: 'Celelalte vorbesc despre desen sau despre foaie, nu despre ce se întâmplă în poveste.'},
   inca: [
    {t: 'choice', q: 'Au trecut 6 minute și ești tot la căsuța 1: desenezi fiecare fir de iarbă. Ce faci?',
     o: ['Treci la căsuța 2: cerc, linii și o propoziție', 'Termini iarba, apoi vezi cât timp mai ai', 'Ștergi tot și o iei de la capăt, cu alt desen', 'Lași restul căsuțelor goale; prima contează'], ok: 0,
     ajutor: 'Sunt șase căsuțe, cu cel mult un minut și jumătate pe fiecare.', why: 'Povestea se înțelege din toate căsuțele; o căsuță foarte frumoasă nu ține locul celorlalte.'}
   ]},
  /* ---- P5: citit de altcineva ---- */
  {t: 'Citit de altcineva',
   text: `<p>Tu știi povestea, deci nu vezi ce lipsește. Cineva care n-o știe vede.</p>
<p>Dă-i caietul unui coleg și nu-i explica nimic. El citește căsuțele pe rând și spune unde nu înțelege. Tu doar notezi.</p>
<p>Apoi repari o singură dată: scrii o propoziție mai clară sau adaugi lângă o căsuță în plus. Nu o iei de la capăt.</p>`,
   exemplu: `${ACUM('Acum, cam 5 minute',
     'Colegul citește și răspunde, la căsuțele pe care nu le înțelege: <b>Ce se întâmplă aici? Ce se mișcă? Cum s-a ajuns aici din căsuța de dinainte?</b>',
     'Notezi lângă căsuță ce a spus. Apoi faci același lucru pentru storyboardul lui.')}
<p><b>N-ai un coleg lângă tine?</b> Nu e nevoie de profesor. Alege una:</p>
<ul><li>citește-ți singur căsuțele, încet, cu voce mică, și răspunde la cele trei întrebări;</li><li>citește-le mâine, ca și cum le-ar fi făcut altcineva;</li><li>scrie în caiet o singură întrebare („Ce crezi că se întâmplă în căsuța 4?”) și pune-o mai târziu cuiva.</li></ul>`,
   altfel: `<p>E ca atunci când explici drumul spre casa ta: tu îl știi pe de rost, dar abia cel care îl urmează află unde te-ai încurcat.</p>`,
   incearca: {t: 'casute_neclar', q: 'Ești colegul care citește. La ce căsuță te-ai opri, pentru că nu știi cum s-a ajuns acolo? Atinge-o (pe calculator: clic).',
    casute: MINGEA, ok: 'n4',
    dece: {n1: 'Căsuța 1 se înțelege: e începutul, pisica și mingea se văd.', n2: 'Căsuța 2 se înțelege: pisica era lângă minge și acum o lovește.', n3: 'Căsuța 3 se înțelege: pisica tocmai a lovit mingea, iar săgeata arată că mingea se rostogolește spre copac.', n5: 'Căsuța 5 urmează firesc după cea de dinainte. Caută mai devreme.', n6: 'Căsuța 6 spune chiar ce s-a întâmplat: pisica a coborât.'},
    ajutor: 'Compară fiecare căsuță cu cea de dinainte: se vede cum s-a ajuns aici?', why: 'Pisica era pe jos, iar deodată e pe acoperiș. O căsuță în plus sau o propoziție (de ce s-a urcat, cum) ar lămuri lucrurile.'},
   inca: [
    {t: 'choice', q: 'Colegul spune: „Nu înțeleg de ce e pisica pe acoperiș.” Ce faci?',
     o: ['Scrii sau desenezi ce lipsește acolo', 'Îi explici tu și lași caietul cum e', 'Desenezi acoperișul mai frumos', 'Ștergi tot și începi altă poveste'], ok: 0,
     ajutor: 'Cel care vede animația nu te are lângă el, să-i explici.', why: 'Lipsa o repari pe hârtie, o singură dată, fără s-o iei de la capăt.'}
   ]}
 ],
 atelier: {t: 'scena', titlu: 'Primele două căsuțe, în Scratch simulat',
  intro: `<p>Faci primele două căsuțe din storyboardul „În pădure”. Pisica are două momente, în același decor:</p>
${SC.banda([
  {desen: {f: 'parc', alt: 'Pisica în stânga, printre copaci; spune Unde e?', ob: [['copac', 136, 98], ['copac', 104, 98, {s: .7}], ['pisica', 34, 102], ['balon', 54, 62, {t: 'Unde e?'}]]}, text: 'Căsuța 1: în stânga, spune ceva.'},
  {desen: {f: 'parc', alt: 'Pisica în dreapta, lângă copaci; spune Uite-l!', ob: [['copac', 136, 98], ['copac', 104, 98, {s: .7}], ['pisica', 92, 102], ['balon', 62, 62, {t: 'Uite-l!'}]]}, text: 'Căsuța 2: în dreapta, spune altceva.'}], {coloane: 2})}
<ol><li>Butonul <b>Alege un Decor</b>: pune decorul <b>Forest</b>.</li>
<li>Trage pisica în jumătatea din stânga a scenei. Din <b>Evenimente</b>, blocul galben; sub el, „mergi la x … y: …” (vine cu locul de acum al pisicii); sub el, „spune … pentru 2 secunde”.</li>
<li>Trage pisica în jumătatea din dreapta. Lipește la capăt încă un „mergi la x … y: …” și încă un „spune … pentru 2 secunde”.</li>
<li>Apasă steagul verde și privește cele două momente.</li></ol>
<p><strong>La sfârșit:</strong> „Rulează testele”. Textul din „spune” poate fi oricare.</p>`,
  q: 'Pe telefon: blocul din paletă îl tragi întâi puțin spre dreapta, apoi unde vrei. Nu trebuie să scrii numere: le aduce blocul.',
  paleta: PAL, program: [], pasCuPas: false, nota: NOTA,
  teste: [
   {ce: 'Pe scenă e decorul Forest', msg: 'Apasă butonul Alege un Decor, apoi Forest.', ok: (U, P, S) => S.decor === 'Forest'},
   {ce: 'Programul pornește de la blocul galben', msg: 'Niciun bloc nu e lipit sub blocul galben „când se dă click pe ⚑” (sau blocul lipsește), deci la steag nu pornește nimic. Ia-l din Evenimente, dacă nu-l ai, și lipește sub el blocurile de la punctele 2 și 3. Paleta e acoperită? Apasă pe Sprite1.', ok: (U, P) => A.cuSteag(P).some(sc => sc.b.length > 1)},
   {ce: 'Un singur bloc galben', msg: 'În zona de cod sunt mai multe blocuri galbene: la steag, toate pornesc deodată. Lasă unul singur: blocurile de sub celelalte le lipești la capătul primului program (tragi primul bloc de sub blocul galben; vin și cele de sub el), apoi tragi în paletă blocul galben rămas singur.', ok: (U, P) => A.cuSteag(P).length <= 1},
   {ce: 'Niciun bloc nu stă deoparte', msg: 'Un grup de blocuri stă deoparte, nelipit sub blocul galben: la steag nu se execută. Trage-l de primul lui bloc și lipește-l în program, sub blocul galben sau la capăt. Nu-ți trebuie? Trage-l în paletă.', ok: (U, P) => A.libere(P).length === 0},
   {ce: 'Pisica vorbește de două ori', o: START, msg: 'La steag, pisica trebuie să vorbească de două ori, pe rând. Lipsește un „spune”? Ia „spune … pentru 2 secunde” din Aspect și lipește-l la capăt. Un „spune” are textul gol sau aproape 0 la secunde? Scrie un text și 2: altfel, în Scratch, balonul nu apare sau dispare imediat.', ok: U => { const s = spuse(U); return s.length > 1 && s[0].cadre >= SE_VEDE && s[1].cadre >= SE_VEDE; }},
   {ce: 'Primul moment: pisica vorbește în stânga', o: START, msg: 'Programul nu duce pisica în stânga înainte de primul „spune” (lipsește „spune” sau „mergi la”, ori „mergi la” are x 0 sau duce în dreapta). Trage pisica în stânga scenei, ia un „mergi la x … y: …” nou și lipește-l chiar deasupra primului „spune”.', ok: U => { const s = spuse(U); return s.length > 0 && s[0].x < 0; }},
   {ce: 'Al doilea moment: pisica vorbește în dreapta', o: START, msg: 'Programul nu duce pisica în dreapta între primul și al doilea „spune” (lipsește un „spune” sau „mergi la”, ori „mergi la” are x 0 sau duce în stânga). Trage pisica în dreapta scenei, ia un „mergi la x … y: …” nou și lipește-l chiar deasupra celui de-al doilea „spune”.', ok: U => { const s = spuse(U); return s.length > 1 && s[1].x > 0; }},
   {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde, deasupra scenei, și privește pisica.', ok: (U, P, S) => S.apasatSteag}],
  solutie: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', -120, -40], ['spune_sec', 'Unde e?', 2], ['mergi_la_xy', 120, -40], ['spune_sec', 'Uite-l!', 2]]}], solutieDecor: 'Forest',
  gresit: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', -120, -40], ['spune_sec', 'Unde e?', 2], ['spune_sec', 'Uite-l!', 2]]}],
  ajutor: 'Decorul se alege cu butonul de sub scenă. Pisica se trage pe scenă. „mergi la x … y: …” din paletă arată locul de acum al pisicii, deci o muți întâi și iei blocul după aceea.',
  why: 'Ai făcut în Scratch două cadre de pe hârtie: același decor, același personaj, două locuri, două momente.'},
 qs: [
  {t: 'choice', q: 'Muți copacul din stânga în dreapta, în aceeași căsuță. Povestea rămâne aceeași. Ce ai schimbat?',
   o: ['Compoziția cadrului', 'Ordinea căsuțelor', 'Scenariul poveștii', 'Costumul personajului'], ok: 0,

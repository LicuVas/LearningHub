<script>
/* Lecția 23, clasa a VI-a (M4, consolidare): „Comparăm cele trei structuri repetitive. Când o folosesc pe fiecare”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   Activitatea profesorului (activitati_lectii_V_VI.json, lecția 23): „Tabel comparativ completat de elevi în echipe și
   confruntat la tablă. Apoi, pentru cinci probleme date, fiecare echipă alege structura potrivită și argumentează.”
   La ora simultană (fără profesor, fără echipe): tabelul îl completează elevul în pagină (pasul 2), „confruntarea” =
   aceeași problemă scrisă cu cele trei structuri și urmărită cu componentele publicate (pașii 3-4), cele cinci probleme
   (din jocul algoritmi-vi, nivelul 6) cu structura și motivul ales dintre variante-soră (pasul 5).
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026).
   Faptele despre Scratch: probate în editorul viu (_proba\live_compara.py → live_compara.json) + lecțiile 20-22.
   Simulatoarele, doar FOLOSITE: scratch.js (VI/18), scratch-control.js (VI/20), scratch-conditie.js (VI/21),
   urmarire-algoritm.js (VI/17), -repetitie.js (VI/20), -cattimp.js (VI/21), -pana-cand.js (VI/22) · NOU, al lecției:
   lectii/_sim/compara-repetitii.js (tabelul comparativ, „treiori”, „alegestructura”).
   Valorile din tabele și din exemple sunt CALCULATE de interpretoarele publicate, nu scrise de mână.
   Granița: NU schema logică / blocurile grafice (24), NU sume, numărări, cifre (25), NU evaluarea (26), NU variabilele
   Scratch, NU „dacă” în Scratch. */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
const L = p => UrmarireAlgoritm.listare(p);
const CR = ComparaRepetitii;
const afis = (p, d) => CR.afisari(p, d || {});
const tr = (p, d) => CR.treceri(p, d || {});

/* ---- ajutoare pentru testele simulatorului (pe COMPORTAMENT: programul elevului e rulat de la steag) — copiate din VI/22 ---- */
const SC = SimScratchConditie;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const spusLa = (U, text, o) => { let p = [o.x, o.y]; const r = []; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune' && norm(e.valoare) === norm(text)) r.push(p); } return r; };
const STRAMB = {x: -120, y: 80, directie: 0};
const PAL = ['steag', 'mergi', 'mergi_la_xy', 'orienteaza', 'pozitia_x', 'spune_sec', 'repeta', 'repeta_pana', 'mai_mare', 'mai_mic'];
const NOTA_SIM = 'În pagină sunt doar blocurile de azi (Scratch are mult mai multe), iar pisica e desenată mai simplu decât în Scratch.';
const POZ = (op, n) => [op, '', n, {s: {0: ['pozitia_x']}}];
const dinX = (P, x) => { const Q = JSON.parse(JSON.stringify(P)); Q.forEach(sc => sc.b.forEach(b => { if (b[0] === 'mergi_la_xy') { b[1] = x; b[2] = 0; } })); return Q; };
const ruleaza = (P, cadre) => SimScratch.urma(P, {x: 0, y: 0, directie: 90, cadre: cadre || 900});
const condLa = (P, x) => { const c = SC.conditia(P); if (!c) return false; return SimScratch.urma([{x: 0, y: 0, b: [['steag'], ['mergi_la_xy', x, 0], ['orienteaza', 90], ['repeta_pana', {s: {0: c}, guri: [[]]}]]}], {x: 0, y: 0, directie: 90, cadre: 20}).terminat; };
const condCaInCaiet = (P, prag) => [prag - 60, prag - 1, prag, prag + 1, prag + 60].every(x => condLa(P, x) === (x > prag));
/* „cât timp x ≤ prag execută x ← x + pas” din caiet: unde se oprește și unde e pisica după fiecare trecere */
const catTimp = (x, prag, pas) => { let k = 0; while (x <= prag && k < 1000) { x += pas; k++; } return x; };
const treceriCT = (x, prag, pas) => { const r = []; while (x <= prag && r.length < 1000) { x += pas; r.push(x); } return r; };
const caCaietul = (P, prag, pas, starturi, cuHop) => starturi.every(s => { const U = ruleaza(dinX(P, s));
  return U.terminat && U.x === catTimp(s, prag, pas) && (!cuHop || eq(spusLa(U, 'Hop!', {x: 0, y: 0}), treceriCT(s, prag, pas).map(x => [x, 0]))); });
const nx = x => (x < 0 ? `−${-x}` : `${x}`);

/* ---- mesajele testelor Scratch spun STAREA programului de acum (regula 28; modelul VI/22: testCuMesaj) ---- */
const ob = b => b.find(x => x && typeof x === 'object' && !Array.isArray(x)) || {};
const eCorp = b => b[0] === 'mergi' || b[0] === 'spune_sec';
const numeBloc = b => b[0] === 'mergi' ? `„mergi ${b[1]} pași”` : b[0] === 'spune_sec' ? `„spune ${b[1]} pentru ${b[2]} secunde”` : b[0] === 'steag' ? '„când se dă click pe ⚑”' : 'un bloc';
const stareT = (P) => {
  const cuSteag = P.filter(s => s.b.length && s.b[0][0] === 'steag');
  const main = cuSteag.find(s => s.b.some(b => b[0] === 'repeta_pana' || b[0] === 'repeta')) || cuSteag[0] || {b: []};
  const iR = main.b.findIndex(b => b[0] === 'repeta_pana'), iC = main.b.findIndex(b => b[0] === 'repeta');
  const iO = main.b.findIndex(b => b[0] === 'orienteaza');
  const guraR = iR >= 0 ? ((ob(main.b[iR]).guri || [[]])[0] || []) : [];
  /* r1 (G1, 02.11): corpul pus între „orientează-te” și „repetă până când” (obiceiul lecției 22) și „repetă până când” lăsat liber */
  const rpLiber = P.find(s => s !== main && s.b.length && s.b[0][0] === 'repeta_pana');
  /* t2 (Q, 02.11): corpul pus mai sus, deasupra lui „orientează-te” (sub pălărie sau sub „mergi la x”) */
  const iSus = iO > 0 && iO < iR ? main.b.findIndex((b, i) => i > 0 && i < iO && eCorp(b)) : -1;
  return {main, iR, iC, iO, iSus, guraR, imbricat: guraR.some(b => b[0] === 'repeta'), sub: iR >= 0 ? main.b.slice(iR + 1) : [],
    deasupra: iR >= 0 ? main.b.slice(iO + 1, iR).filter(eCorp) : [], rest: main.b.slice(iO + 1).filter(eCorp),
    rpLiber, guraLiber: rpLiber ? ((ob(rpLiber.b[0]).guri || [[]])[0] || []) : [],
    libere: P.filter(s => s !== main && s.b.length && s.b[0][0] !== 'steag' && s.b.some(eCorp))};
};
/* o = {corp:[blocuri], nume:'„mergi 50 pași”', n: 5, prag: 60}; întoarce mesajul stării sau null */
const mesajT = (P, o) => {
  const S = stareT(P), N = `„repetă ${o.n}”`;
  if (S.imbricat) return `În gura lui „repetă până când” e încă ${N}. Trage-l afară, pe un loc gol (vine cu corpul din gura lui); mută corpul în gura lui „repetă până când”, chiar sub rândul de sus; apoi ${N}, gol, în paletă.`;
  if (S.iR < 0 && S.iC >= 0) return `Programul are încă ${N}: el face mereu ${o.n} treceri, de oriunde pornește pisica. Trage ${o.nume} din gura lui pe un loc gol; trage ${N}, rămas gol, în paletă; din Control, „repetă până când” chiar sub „orientează-te în direcția 90”; apoi ${o.nume} în gura lui, chiar sub rândul de sus.`;
  if (S.iR < 0 && S.rpLiber) {
    const plin = S.guraLiber.some(eCorp);
    if (plin && S.rest.length) return `„repetă până când” stă pe un loc gol, nelipit de program. Trage ${numeBloc(S.rest[0])} de sub „orientează-te” în paletă (vin și blocurile de sub el); apoi lasă „repetă până când” (vine cu ce are în gură) chiar sub „orientează-te în direcția 90”.`;
    if (S.rest.length) return `„repetă până când” stă pe un loc gol, nelipit de program, iar corpul e sub „orientează-te”. Trage ${numeBloc(S.rest[0])} (vin și blocurile de sub el) în gura lui „repetă până când”, chiar sub rândul de sus; apoi lasă „repetă până când” chiar sub „orientează-te în direcția 90”.`;
    return `„repetă până când” stă pe un loc gol, nelipit de program, deci nu pornește la steag. Trage-l (vine cu ce are în gură) chiar sub „orientează-te în direcția 90”.`;
  }
  if (S.iR < 0) return `În program nu e niciun „repetă până când”: din Control, lasă-l chiar sub „orientează-te în direcția 90”, apoi pune ${o.nume} în gura lui, chiar sub rândul de sus.`;
  if (S.iC > S.iR) return `${N} e sub brațul de jos al lui „repetă până când”: se execută după repetiție. Dacă are ceva în gură, trage de acolo ${o.nume} în gura lui „repetă până când”, chiar sub rândul de sus; apoi trage ${N} în paletă (vin și blocurile de sub el).`;
  if (S.iC >= 0) return `${N} e încă în program, deasupra lui „repetă până când”. Trage „repetă până când” pe un loc gol (vine cu tot ce are în gură și sub el); scoate ${o.nume} din gura lui ${N} și pune-l în gura lui „repetă până când”; trage ${N} în paletă; apoi lasă „repetă până când” chiar sub „orientează-te în direcția 90”.`;
  /* t2 (P, Q, 02.11): gura PLINĂ = are tot corpul; atunci copia de afară se șterge, nu se mai pune în gură */
  const plina = o.corp.every(c => S.guraR.some(b => b[0] === c[0])), goala = !S.guraR.some(eCorp);
  if (S.iSus > 0 && (plina || goala)) {
    const scurt = b => b[0] === 'orienteaza' ? '„orientează-te”' : b[0] === 'mergi_la_xy' ? '„mergi la x”' : numeBloc(b);
    const B = S.main.b, x = numeBloc(B[S.iSus]), y = scurt(B.slice(S.iSus).find(b => !eCorp(b))), z = scurt(B[S.iSus - 1]);
    return (plina ? `Între ${z} și ${y} e încă ${x}, deși corpul e deja în gura lui „repetă până când”. `
      : `Între ${z} și ${y} e ${x}, iar gura lui „repetă până când” e goală. `) +
      `Trage ${y} pe un loc gol (vin și blocurile de sub el); ` +
      (plina ? `trage ${x} în paletă (vin și blocurile de sub el)` : `trage ${x} (vin și blocurile de sub el) în gura lui „repetă până când”, chiar sub rândul de sus`) +
      `; lasă ${y} înapoi chiar sub ${z}.`;
  }
  /* r1 (G1): corpul o dată deasupra (obiceiul lecției 22) — aici caietul are „cât timp”, deci nimic deasupra.
     t2 (R): ce face pisica din cauza lui, după blocurile care chiar sunt acolo */
  const nM = S.deasupra.filter(b => b[0] === 'mergi').length, sp = S.deasupra.filter(b => b[0] === 'spune_sec');
  /* j3 (T, 02.11, dirijor): „face o trecere” doar când deasupra e corpul ÎNTREG; un „mergi” singur doar mută pisica */
  const intreg = o.corp.every(c => S.deasupra.some(b => b[0] === c[0]));
  const efect = nM === 1 && intreg ? `așa pisica face o trecere și când pornește de dincolo de ${o.prag}` : nM ? `așa pisica merge ${nM === 1 ? 'o dată' : `de ${nM} ori`} înainte de repetiție, de oriunde pornește`
    : sp.length ? `așa pisica spune „${sp[0][1]}” ${sp.length === 1 ? 'o dată' : `de ${sp.length} ori`} înainte de repetiție, de oriunde pornește` : '';
  if (S.deasupra.length && S.guraR.some(eCorp)) return `Între „orientează-te în direcția 90” și „repetă până când” e încă ${numeBloc(S.deasupra[0])}: ${efect}. Corpul o dată deasupra e pentru „repetă … până când” din caiet (lecția 22); aici caietul are „cât timp”. Trage „repetă până când” pe un loc gol (vine cu ce are în gură); trage ${numeBloc(S.deasupra[0])} rămas sub „orientează-te” în paletă (vin și blocurile de sub el); lasă „repetă până când” chiar sub „orientează-te în direcția 90”.`;
  if (S.deasupra.length) return `${numeBloc(S.deasupra[0])} e deasupra lui „repetă până când”, iar gura lui e goală: așa corpul se execută o singură dată, înainte de repetiție. Trage „repetă până când” pe un loc gol; trage ${numeBloc(S.deasupra[0])} (vin și blocurile de sub el) în gura lui, chiar sub rândul de sus; lasă „repetă până când” chiar sub „orientează-te în direcția 90”.`;
  if (S.sub.some(eCorp) && plina) return `Sub brațul de jos al lui „repetă până când” e încă ${numeBloc(S.sub.find(eCorp))}, deși corpul e deja în gura lui: așa se mai execută o dată, după repetiție. Trage-l în paletă (vin și blocurile de sub el).`;
  if (S.sub.some(eCorp)) return `Sub brațul de jos al lui „repetă până când” e ${numeBloc(S.sub.find(eCorp))}: acolo se execută o dată, după repetiție. Trage-l (vin și blocurile de sub el) în gura lui, chiar sub rândul de sus.`;
  if (!S.guraR.some(eCorp) && S.libere.length) return `${numeBloc(S.libere[0].b.find(eCorp))} de lângă program nu e lipit de el, deci nu pornește la steag. Trage-l (vin și blocurile de sub el) în gura lui „repetă până când”, chiar sub rândul de sus.`;
  return null;
};
/* testul condiției: mesajul spune ce e acum în locul în șase colțuri */
const mesajCond = (P, prag, o) => {
  const S = stareT(P);
  if (S.iR < 0) return mesajT(P, o);
  if (!SC.conditia(P)) return `Locul în șase colțuri al lui „repetă până când” e gol: din Operatori, „( ) > (50)”; în prima lui căsuță „poziția x” din Mișcare, în a doua ${prag}.`;
  if (condLa(P, prag - 60) && !condLa(P, prag + 60)) return `Condiția e pe dos: pisica s-ar opri înainte de ${prag}, nu după ce trece de el. În Scratch scrii când te OPREȘTI, adică opusul lui „x ≤ ${prag}”: „(poziția x) > ${prag}” — „poziția x” în PRIMA căsuță a lui „( ) > (50)”, ${prag} în a doua.`;
  return null;
};
/* r1 (G1, 02.11): unde ajunge pisica față de caiet, la PRIMUL loc de pornire care pică (nu la unul fix) */
const undeLa = (P, prag, pas, starturi, cuHop) => {
  const s = starturi.find(x => !caCaietul(P, prag, pas, [x], cuHop));
  if (s === undefined) return '';
  const U = ruleaza(dinX(P, s)), xc = catTimp(s, prag, pas);
  if (!U.terminat) return `Pornită din x ${nx(s)}, pisica nu se mai oprește; în caiet, la x ${nx(xc)}. `;
  if (U.x !== xc) return `Pornită din x ${nx(s)}, pisica ajunge la x ${nx(U.x)}; în caiet, la x ${nx(xc)}. `;
  return `Pornită din x ${nx(s)}, pisica spune „Hop!” în alte locuri decât în caiet. `;
};

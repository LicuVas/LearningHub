<script>
/* Lecția 25, clasa a VI-a (M4, consolidare): „Rezolv probleme cu repetiție: sume, numărări, cifre”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   Activitatea profesorului (activitati_lectii_V_VI.json): „Set de probleme gradate, rezolvate individual la calculator:
   suma primelor n numere, numărarea valorilor cu o proprietate, prelucrarea cifrelor unui număr. Cine termină ajută
   un coleg.” Resursa: „laborator, fișă de probleme pe trei niveluri”.
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026).
   Faptele despre Scratch sunt PROBATE în editorul viu (Chromium headless, profil temporar, fără cont, rețeaua doar spre
   scratch.mit.edu, 01.11.2026: _proba\live_var.py, live_var2.py, live_var3.py → live_var*.json): fereastra „Variabilă
   nouă”, caseta de pe scenă, valoarea care rămâne între steaguri, „setează” / „modifică”, „mod”, programele EXACTE ale
   paginii rulate în mașina virtuală (scratch-vm) pe valorile testelor.
   Simulatoarele: lectii/_sim/scratch.js (VI/18) + scratch-control.js (VI/20) + scratch-conditie.js (VI/21), doar FOLOSITE,
   + lectii/_sim/scratch-variabile.js (NOU, al lecției: variabilele, operatorii, „dacă … atunci”) · urmarire-algoritm.js
   (VI/17) + -repetitie.js (VI/20) + -cattimp.js (VI/21), doar FOLOSITE. Valorile din tabele și din exemple le CALCULEAZĂ
   interpretorul, nu sunt scrise de mână (oracolul independent: _proba\oracol_independent.py).
   Granița: NU comparația celor trei structuri / regula alegerii (23), NU schema logică (24), NU evaluarea (26). */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
const L = p => UrmarireAlgoritm.listare(p);
const UR = UrmarireRepetitie, UC = UrmarireCatTimp;
const afis = (p, d) => UrmarireAlgoritm.ruleaza(p, d || {}).afisari;

/* ---- ajutoare pentru testele Scratch (pe COMPORTAMENT: programul elevului rulat de la steag, pe mai multe valori ale
   lui n, pornit cu variabilele „rămase de data trecută”, ca să se vadă inițializarea) ---- */
const SV = SimScratchVariabile;
const nrv = SV.caCast.numar;
const RAMAS = {n: 0, s: 37, i: 9, k: 6, c: 4};
const ext = b => { const e = b[b.length - 1]; return e && typeof e === 'object' && !Array.isArray(e) ? e : null; };
const principal = P => { const s = (P || []).find(x => x.b.length && x.b[0][0] === 'steag'); return s ? s.b : null; };
const cauta = (lista, id) => { for (const b of lista || []) { if (b[0] === id) return b; const e = ext(b); if (e && e.guri) for (const g of e.guri) { const r = cauta(g, id); if (r) return r; } } return null; };
const gura = b => (b && ext(b) && ext(b).guri && ext(b).guri[0]) || [];
const areSeteaza = (P, v) => { const b = principal(P); return !!b && b.some(x => x[0] === 'seteaza_var' && x[1] === v); };
/* rulează programul elevului cu n dat (schimbă numărul din „setează n la …”, ca elevul) și întoarce variabila v la final
   (null dacă nu se oprește) */
const fin = (P, n, v, start) => { const R = SV.ruleaza(n == null ? P : SV.cuValoare(P, 'n', n), {variabile: Object.assign({}, start || RAMAS), cadre: 4000}); return R.terminat ? nrv(R.variabile[v]) : null; };
const cat = x => x == null ? 'nu se mai oprește' : `ajunge ${String(x).replace('-', '−')}`;
/* oracolele paginii (scrise separat de programele din Scratch; confirmate în scratch-vm: _proba\live_var3.json) */
const LEI = n => 5 * n * (n + 1) / 2;
const MULT4 = n => Math.floor(n / 4);
const ULT7 = n => { let k = 0; for (let i = 1; i <= n; i++) if (i % 10 === 7) k++; return k; };
const NRC = n => String(n).length;
/* testul își pune mesajul după starea programului (motorul și scratch.js citesc t.msg după t.ok); msg0 = mesajul general */
const testCuMesaj = (t, mesaj) => { const ok0 = t.ok, msg0 = t.msg; t.ok = (U, P, S) => { const r = ok0(U, P, S); if (!r) { try { t.msg = mesaj(P, S) || msg0; } catch (e) { t.msg = msg0; } } return r; }; return t; };
/* teste pe valori: unul pe fiecare n, cu mesajul stării (sau „Cu n = …, … ajunge …; trebuie …”) */
const pe = (n, v, f, ce, stare) => testCuMesaj({ce, msg: `Cu n = ${n}, ${v} trebuie să ajungă ${f(n)}.`, ok: (U, P) => fin(P, n, v) === f(n)},
  P => stare(P) || `Cu n = ${n}, ${v} ${cat(fin(P, n, v))}; trebuie ${f(n)}.`);
const STEAG = {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde, deasupra scenei, și privește casetele.', ok: (U, P, S) => S.apasatSteag};
const NOTA_SIM = 'În pagină sunt doar blocurile de azi, iar pisica e mai simplă. „variabila mea” (o are orice proiect nou) nu e desenată, iar lista ▾ are doar variabilele.';
const TINE = 'pe telefon: ții degetul pe el';
const lipsaN = P => areSeteaza(P, 'n') ? null : 'Sub „când se dă click pe ⚑” trebuie să rămână „setează n la …”: de acolo ia programul valoarea lui n.';
/* inițializarea: primul „setează v la …” lipsă dintre cele cerute */
const NUME_BLOC = {repeta: '„repetă”', repeta_pana: '„repetă până când”', daca: '„dacă”'};
const lipsaInit = (P, vs) => {
  const v = vs.find(x => !areSeteaza(P, x)); if (!v) return null;
  const b = principal(P) || [], urma = JSON.stringify(['seteaza_var', v]).slice(0, -1) + ',';
  const g = b.find(x => x[0] !== 'seteaza_var' && JSON.stringify(x).indexOf(urma) >= 0);
  if (g) return `„setează ${v} la …” e în gura lui ${NUME_BLOC[g[0]] || '„repetă”'}: la fiecare trecere ${v} o ia de la capăt. Clic dreapta pe el › Șterge blocul (${TINE}), apoi pune altul chiar sub „când se dă click pe ⚑”, deasupra lui „repetă”.`;
  if ((P || []).some(s => s.b !== b && s.b.some(x => x[0] === 'seteaza_var' && x[1] === v))) return `„setează ${v} la …” stă deoparte, nelipit de program, deci nu pornește la steag. Trage-l și lasă-l sub „când se dă click pe ⚑”, deasupra lui „repetă”.`;
  return `Lipsește „setează ${v} la …” de sub „când se dă click pe ⚑”: fără el, ${v} pornește de la ce a rămas data trecută. Pune-l înapoi (din Variabile), deasupra lui „repetă”.`;
};

/* ---- pasul 2: k pornește de la 0 (inițializarea) ---- */
const P1_START = [{x: 14, y: 14, b: [['steag'], ['repeta', 3, {guri: [[]]}]]}];
const P1_SOL = [{x: 14, y: 14, b: [['steag'], ['seteaza_var', 'k', 0], ['repeta', 3, {guri: [[['modifica_var', 'k', 1]]]}]]}];
/* R2 (judecata 2, O-R): fiecare mesaj spune starea de ACUM. S.variabileCreate = numele create cu butonul; „setează” /
   „modifică” din paletă arată prima dintre ele (alfabetic fără majuscule, la egalitate prima creată — ca Scratch) */
const primaVar = (nume) => (nume || []).slice().sort((a, b) => a.localeCompare(b, 'ro', {sensitivity: 'base'}))[0];
const P1_STARE = (P, S) => {
  const b = principal(P);
  if (!b) return 'Programul trebuie să înceapă cu „când se dă click pe ⚑”.';
  const create = (S && S.variabileCreate) || [], areK = create.indexOf('k') >= 0;
  /* ce arată blocul din paletă: acum (cu k creat) sau după ce creezi k */
  const pal = primaVar(areK ? create : create.concat('k'));
  const din = (bl) => pal === 'k' ? `„${bl.replace('…', 'k')}”` : `„${bl.replace('…', pal)}” (apoi alegi k din ▾)`;
  /* O: blocuri de variabile cu alt nume decât k (ex. „K” mare, creat întâi) */
  const alte = [];
  const toate = (l) => (l || []).forEach(x => { if ((x[0] === 'seteaza_var' || x[0] === 'modifica_var') && x[1] !== 'k') alte.push(x); const e = ext(x); ((e && e.guri) || []).forEach(toate); });
  P.forEach(sc => toate(sc.b));
  if (alte.length) {
    const nume = [...new Set(alte.map(x => x[1]))], w = nume.length === 1 ? nume[0] : null;
    const unde = [...new Set(alte.map(x => x[0] === 'seteaza_var' ? `„setează ${x[1]} la …”` : `„modifică ${x[1]} cu …”`))].join(' și ');
    const e = w ? `e ${w}${w === 'K' ? ' (mare)' : ''}` : `e ${nume.join(', ')}`;
    const ce = `${alte.length > 1 ? 'în fiecare bloc' : 'în bloc'}, clic pe ${w ? w + ' ' : ''}▾ și alege k`;
    return areK ? `În ${unde} ${e}, nu k: ${ce}.` : `În ${unde} ${e}, nu k (litera mică). Întâi Variabile › Creează o variabilă: scrie k, OK. Apoi, ${ce}.`;
  }
  const iR = b.findIndex(x => x[0] === 'repeta'), iS = b.findIndex(x => x[0] === 'seteaza_var' && x[1] === 'k');
  const gR = iR >= 0 ? gura(b[iR]) : [], iM = gR.findIndex(x => x[0] === 'modifica_var');
  /* R1: „setează” în gură → valoarea spusă e cea calculată; R2 (R): numărul e cel scris în bloc */
  const sG = gR.find(x => x[0] === 'seteaza_var');
  if (iR >= 0 && sG) {
    const vG = fin(P, null, 'k', {k: 6}), e = ext(sG), alt = !!(e && e.s && e.s[1]), gol = !alt && String(sG[2]).trim() === '';
    const bl = alt || gol ? '„setează k la …”' : `„setează k la ${sG[2]}”`;
    const rev = alt ? 'k primește din nou ce e în bloc' : gol ? 'k se golește' : `k revine la ${sG[2]}`;
    const sus = iS >= 0 && iS < iR;
    return `${bl} e în gura lui „repetă”: la fiecare trecere ${rev}, ${vG === 1 ? 'deci la final e 1' : `deci după steag k ${cat(vG)}`}. Clic dreapta pe el › Șterge blocul (${TINE})${sus ? ': „setează k la …” de sub „când se dă click pe ⚑” ajunge.' : ', apoi pune altul chiar sub „când se dă click pe ⚑”.'}`;
  }
  if (iS < 0 && P.some(s => s.b[0] && s.b[0][0] === 'seteaza_var')) return '„setează k la 0” stă deoparte, nelipit de program, deci nu pornește la steag. Trage-l și lasă-l chiar sub „când se dă click pe ⚑”.';
  if (iM < 0) {
    /* P: locul spus e cel adevărat (deasupra / sub „repetă”, sau „repetă” lipsă) */
    if (iR < 0) return P.some(s => s.b !== b && s.b.some(x => x[0] === 'repeta')) ? '„repetă 3” stă deoparte, nelipit de program. Trage-l și lasă-l sub ultimul bloc al programului.' :'Sub „când se dă click pe ⚑” lipsește „repetă”: din Control, trage „repetă 10” sub ultimul bloc al programului și scrie 3 în el.';
    const iMb = b.findIndex(x => x[0] === 'modifica_var');
    /* U (judecata 3): deasupra, blocul tras ia cu el și „repetă” de sub el (ca în Scratch) → întâi „repetă” deoparte */
    if (iMb >= 0) return iMb < iR ? '„modifică k cu 1” e deasupra lui „repetă”, nu în gura lui: se execută o singură dată. Când îl tragi, vine și „repetă” de sub el: trage întâi „repetă” deoparte, pune „modifică k cu 1” în gura lui, apoi trage „repetă” înapoi sub ultimul bloc al programului.' : '„modifică k cu 1” e sub „repetă”, nu în gura lui: se execută o singură dată. Trage-l în gura lui „repetă”.';
    if (P.some(s => s.b !== b && s.b.some(x => x[0] === 'modifica_var'))) return '„modifică k cu 1” stă deoparte, nelipit de program. Trage-l și lasă-l în gura lui „repetă”.';
    /* Q: înainte de crearea lui k, blocul nu e în paletă */
    return areK ? `Gura lui „repetă 3” e goală, deci k nu crește. Din Variabile, trage ${din('modifică … cu 1')} și lasă-l în gura lui „repetă”.` : `Gura lui „repetă 3” e goală, deci k nu crește. După ce creezi k, din Variabile trage ${din('modifică … cu 1')} în gura lui „repetă”.`;
  }
  if (iS < 0) return `Fără „setează k la 0”, k pornește de la ce a rămas data trecută: la fiecare steag crește cu încă 3 (3, 6, 9…). Din Variabile, trage ${din('setează … la 0')} și lasă-l chiar sub „când se dă click pe ⚑”.`;
  if (iR >= 0 && iS > iR) return '„setează k la 0” e sub brațul lui „repetă”: se execută după treceri, deci k rămâne 0. Trage-l (vin și blocurile de sub el) și lasă-l chiar sub „când se dă click pe ⚑”.';
  if (nrv(b[iS][2]) !== 0 || String(b[iS][2]).trim() === '') return 'În „setează k la …” scrie 0: clic pe căsuța albă, scrii 0, Enter.';
  if (iR >= 0 && nrv(b[iR][1]) !== 3) return '„repetă” trebuie să facă 3 treceri: clic pe numărul din el, scrii 3, Enter.';
  if (gR[iM][1] !== 'k') return `În gura lui „repetă” e „modifică ${gR[iM][1]} cu …”: alege k din ▾.`;
  if (nrv(gR[iM][2]) !== 1) return 'În „modifică k cu …” scrie 1: clic pe căsuță, scrii 1, Enter.';
  return `Pornit cu k = 6, după steag k ${cat(fin(P, null, 'k', {k: 6}))}; trebuie 3: „setează k la 0”, apoi „repetă 3” cu „modifică k cu 1” în gură.`;
};

/* ---- pasul 3: suma (pseudocodul lecției 20) ---- */
const SUMA = ['Început', 'Citește n', 's ← 0', 'pentru i ← 1, n execută', '   s ← s + i', 'sfârșit pentru', 'Afișează s', 'Sfârșit'];
const SUMA_AB = ['Început', 'Citește a, b', 's ← 0', 'pentru i ← a, b execută', '   s ← s + i', 'sfârșit pentru', 'Afișează s', 'Sfârșit'];
const PARTIAL = ['s ← 0', 'pentru i ← 1, 5 execută', '   s ← s + i', '   Afișează s', 'sfârșit pentru'];
const TS = UR.treceri(SUMA, {n: 4});

/* ---- pasul 4: numărarea ---- */
const NUMARA = ['Început', 'Citește n', 'k ← 0', 'pentru i ← 1, n execută', '   Dacă i % 3 = 0 atunci', '      k ← k + 1', 'sfârșit pentru', 'Afișează k', 'Sfârșit'];
const TN = UR.treceri(NUMARA, {n: 7});
const P3_DACA = (cond) => ['daca', cond ? {s: {0: cond}, guri: [[['modifica_var', 'k', 1]]]} : {guri: [[['modifica_var', 'k', 1]]]}];
const P3_PROG = (cond) => [{x: 14, y: 14, b: [['steag'], ['seteaza_var', 'n', 10], ['seteaza_var', 'k', 0], ['seteaza_var', 'i', 1], ['repeta', '', {s: {0: ['var:n']}, guri: [[P3_DACA(cond), ['modifica_var', 'i', 1]]]}]]}];
const COND4 = ['egal', '', 0, {s: {0: ['mod', '', 4, {s: {0: ['var:i']}}]}}];
const P3_STARE = (P) => {
  const m = lipsaN(P) || lipsaInit(P, ['k', 'i']); if (m) return m;

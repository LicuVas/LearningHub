<meta name="description" content="Lecția 5, clasa a VI-a (TIC): editezi o prezentare PowerPoint — dublezi, ștergi și muți diapozitive în panoul cu miniaturi, copiezi, muți și ștergi obiecte, anulezi greșelile cu Ctrl+Z. Cu PowerPoint simulat în pagină și o prezentare de lucru pentru PowerPoint-ul adevărat.">

<style>
:root{
  --desk:#F2EEEA; --paper:#FFFFFF; --paper2:#F8F3EF; --line:#E2D6CD;
  --ink:#231A16; --ink2:#62554E; --accent:#A83A1C; --accentInk:#FFFFFF; --sel:#F7DED3;
  --mark:#FFE08A; --markInk:#231A16; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Bricolage Grotesque",Georgia,serif; --fb:"Lexend","Segoe UI",system-ui,sans-serif; --fm:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#17120F; --paper:#211A16; --paper2:#2A221D; --line:#3D322B;
  --ink:#F1E8E2; --ink2:#BCAEA5; --accent:#FF9A74; --accentInk:#17120F; --sel:#4A2A1E;
  --mark:#F2C94C; --markInk:#231A16; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#17120F; --paper:#211A16; --paper2:#2A221D; --line:#3D322B;
  --ink:#F1E8E2; --ink2:#BCAEA5; --accent:#FF9A74; --accentInk:#17120F; --sel:#4A2A1E;
  --mark:#F2C94C; --markInk:#231A16; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: miniaturi de diapozitive, una scoasă din rând (mutată), una dublată — doar CSS */
.banda{display:flex;gap:7px;padding:6px 12px;min-height:36px;align-items:center}
.banda span{flex:0 0 auto;width:38px;height:22px;border:1px solid var(--ink2);border-radius:2px;opacity:.75;
  background:linear-gradient(var(--ink2),var(--ink2)) 5px 5px/20px 2px no-repeat,linear-gradient(var(--line),var(--line)) 5px 11px/26px 2px no-repeat,linear-gradient(var(--line),var(--line)) 5px 15px/18px 2px no-repeat}
.banda .sus{transform:translateY(-5px) rotate(-4deg);border-color:var(--accent);border-width:2px;opacity:1}
.banda .dub{box-shadow:4px 4px 0 -1px var(--paper),4px 4px 0 0 var(--ink2)}
.banda .gol{border-style:dashed;background:none;opacity:.5}
h1{font-size:clamp(1.7rem,7vw,3rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:750}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.ingusta img{max-width:250px}
.reading ol li,.reading ul li{margin:.2em 0}
.descarca{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/ui-panglica.js"></script>
<script src="../../../jocuri/_motor/panglica-powerpoint.js"></script>
<script src="../../_sim/simppt.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M1 · nr. 5 — „Editarea prezentării: inserare, copiere, mutare, ștergere”.
   Simulatorul: lectii/_sim/simppt.js (SimPPT, comun clasei a VI-a). Aici stau doar prezentările de lucru ale lecției.
   Faptele despre PowerPoint sunt probate în PowerPoint-ul real (afirmatii.json, _proba/).
   ====================================================================================================== */
const DP=SimPPT.diap;
const STEA=(x,y)=>({tip:'forma',forma:'star5',culoare:'aur',x:x==null?90:x,y:y==null?3:y,w:7.5,h:13.33});
const SAGEATA=(x,y)=>({tip:'forma',forma:'arrowR',x,y,w:15.6,h:14.8});
const TITLU1=()=>DP('d1','title',{titlu:'Sistemul solar',sub:'Ana Pop, clasa a VI-a'});
const SOARE_PESTE=()=>[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Steaua din centrul\nSistemului solar'},{tip:'imagine',fis:'soare.png',x:8,y:27,w:26,h:46.3}];
SimPPT.prezentari({
  /* pasul 1: dublare */
  l5_concurs:()=>[DP('d1','title',{titlu:'Concurs: Sistemul solar',sub:'Clasa a VI-a'}),
    DP('d2','tc',{titlu:'Întrebarea 1',c1:'Care planetă e cea mai aproape de Soare?'},[STEA()])],
  /* pasul 2: ștergere și anulare */
  l5_stergere:()=>[TITLU1(),DP('d2','to',{titlu:'Soarele'},[{tip:'imagine',fis:'soare.png',x:62,y:27,w:26,h:46.3}]),
    DP('d3','to',{titlu:'Pisica mea'},[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Mia doarme toată ziua.'}]),
    DP('d4','tc',{titlu:'Planetele',c1:'Mercur\nVenus\nPământul\nMarte'},[SAGEATA(72,70)]),DP('d5','to',{titlu:'Ce reținem'})],
  /* pasul 3: mutarea unui diapozitiv */
  l5_mutare:()=>[TITLU1(),DP('d2','to',{titlu:'Ce reținem'}),DP('d3','tc',{titlu:'Cuprins',c1:'Soarele\nPlanetele\nCe reținem'}),
    DP('d4','to',{titlu:'Soarele'}),DP('d5','to',{titlu:'Planetele'})],
  /* pasul 4: copierea unui obiect */
  l5_copiere:()=>[TITLU1(),DP('d2','tc',{titlu:'Cuprins',c1:'Soarele\nPlanetele\nCe reținem'}),
    DP('d3','to',{titlu:'Soarele'},[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Steaua din centrul\nSistemului solar'},{tip:'imagine',fis:'soare.png',x:62,y:27,w:26,h:46.3},STEA()]),
    DP('d4','to',{titlu:'Planetele'}),DP('d5','to',{titlu:'Ce reținem'})],
  /* pasul 5: mutarea unui obiect */
  l5_mutobj:()=>[TITLU1(),DP('d2','tc',{titlu:'Cuprins',c1:'Soarele\nPlanetele\nCe reținem'},[STEA(80,62)]),DP('d3','to',{titlu:'Soarele'},SOARE_PESTE())],
  /* atelierul = prezentarea de lucru descărcabilă (sistemul-solar-de-editat.pptx, făcută prin COM) */
  l5_atelier:()=>[TITLU1(),DP('d2','to',{titlu:'Ce reținem'},[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Soarele e o stea.\nPlanetele se rotesc în jurul Soarelui.'}]),
    DP('d3','tc',{titlu:'Cuprins',c1:'Soarele\nPlanetele\nLuna\nCe reținem'},[SAGEATA(70,60)]),
    DP('d4','to',{titlu:'Soarele'},SOARE_PESTE().concat([STEA()])),
    DP('d5','to',{titlu:'Pisica mea'},[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Mia doarme toată ziua.'}]),
    DP('d6','tc',{titlu:'Planetele'})],
  /* verificarea (variante-soră, alte date) */
  l5_anotimpuri:()=>[DP('d1','title',{titlu:'Anotimpurile',sub:'Dan Pop, clasa a VI-a'}),DP('d2','to',{titlu:'Vara'}),DP('d3','to',{titlu:'Primăvara'}),
    DP('d4','to',{titlu:'Toamna'}),DP('d5','to',{titlu:'Tema la mate'}),DP('d6','to',{titlu:'Iarna'})],
  l5_excursie:()=>[DP('d1','title',{titlu:'Excursia la munte',sub:'Clasa a VI-a'}),DP('d2','to',{titlu:'Ziua 1'},[SAGEATA(78,72)]),
    DP('d3','to',{titlu:'Ziua 2'}),DP('d4','to',{titlu:'Ziua 3'})]
});

/* ---------------- lecția ---------------- */
const IMG={'biletele-perete':[600,800],'meniu-miniatura-editare':[450,364],'soare-inainte-dupa':[1000,318]};
const fig=(f,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m1-l05/img/${f}.webp" target="_blank"><img src="../m1-l05/img/${f}.webp" alt="${alt}" width="${IMG[f][0]}" height="${IMG[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CONT='Operații de editare a unei prezentări: inserare, copiere, mutare, ștergere a unui diapozitiv/obiect';
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. Clic dreapta pe o miniatură sau pe un obiect deschide meniul lui (pe telefon: ții degetul apăsat, apoi îl ridici). Tastele le ai și ca butoane sub fereastră. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_INTRO=`<p>Mai jos e un <strong>PowerPoint simulat</strong>, cu panglica în engleză, ca pe unele calculatoare din laborator (pe altele PowerPoint e în română; numele românești le ai în pași). Lucrează în fereastră: <strong>testele se bifează singure</strong>, apoi apeși <b>Verifică</b>.</p>
<ul><li><b>Meniul unei miniaturi sau al unui obiect:</b> clic dreapta pe el. Pe telefon: ții degetul apăsat o clipă, apoi îl ridici.</li>
<li><b>Tragerea:</b> cu mouse-ul, ții apăsat și tragi. Pe telefon, la o miniatură ții degetul o clipă, până i se colorează chenarul, apoi tragi; un obiect îl atingi întâi o dată, ca să aibă chenar, apoi îl tragi.</li>
<li><b>Tastele</b> <kbd>Delete</kbd>, <kbd>Ctrl</kbd>+<kbd>C</kbd>, <kbd>Ctrl</kbd>+<kbd>X</kbd>, <kbd>Ctrl</kbd>+<kbd>V</kbd>, <kbd>Ctrl</kbd>+<kbd>Z</kbd> le ai și ca butoane sub fereastră: pe telefon nu există.</li></ul>`;
const ORD_FINAL=['Sistemul solar','Cuprins','Soarele','Planetele','Luna','Ce reținem'];
const STELUTA={tip:'forma',forma:'star5'};

const LECTIA={
 t:'Editarea prezentării: inserare, copiere, mutare, ștergere',lectii:[5],continuturi:[CONT],final:true,
 obiectiv:'repari o prezentare fără s-o iei de la capăt: dublezi, ștergi și muți diapozitive, copiezi, muți și ștergi obiecte, iar o greșeală o anulezi cu Ctrl+Z.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>În lecția 4 ai construit o prezentare. Rar iese bună din prima: un diapozitiv stă în locul greșit, unul e în plus, altul îți trebuie încă o dată.</p>
<p>Nu o iei de la capăt. O <strong>editezi</strong>, adică schimbi ce conține: adaugi, copiezi, muți și ștergi diapozitive și obiecte. E ca la un perete cu bilețele: pe unul îl muți mai sus, pe altul îl scrii încă o dată, pe altul îl dezlipești.</p>
${fig('biletele-perete','Un perete de sticlă cu multe bilețele lipicioase colorate, așezate pe coloane; fiecare bilețel poate fi mutat sau dezlipit','Bilețele pe un perete: le poți muta, dubla sau dezlipi, fără să rescrii tot. Fotografie: embljusocmedia, domeniu public, Wikimedia Commons.','ingusta')}
<p class="nevoie"><b>Ai nevoie de:</b> lecția 2 (panoul cu miniaturi, zona de lucru), lecția 3 (deschidere, salvare), lecția 4 (diapozitive, obiecte, substituenți, Diapozitiv nou) și clasa a V-a (clic dreapta, tragere, copiere și mutare de fișiere).</p>`},
  /* ---------- pasul 1: dublare ---------- */
  {t:'Dublezi un diapozitiv',
   text:`<p>Uneori îți trebuie încă un diapozitiv la fel cu unul făcut deja. Nu îl refaci: îl <mark>dublezi</mark>, adică îi faci o copie.</p>
<ol><li>În panoul cu miniaturi (stânga) dai <strong>clic dreapta</strong> pe miniatura lui.</li><li>Din meniu alegi <strong>Dublare diapozitiv (Duplicate Slide)</strong>.</li></ol>
<p>Copia apare <strong>imediat după original</strong>, cu tot ce are el, și devine cea aleasă. Diapozitivele de după ea primesc un număr mai mare cu 1. Apoi schimbi în copie doar ce e diferit.</p>
<p>În același meniu e și <strong>Diapozitiv nou (New Slide)</strong>, din lecția 4.</p>
${fig('meniu-miniatura-editare','Meniul de clic dreapta pe miniatura diapozitivului 2 în PowerPoint: Cut, Copy, Paste Options, apoi New Slide, Duplicate Slide și Delete Slide, încadrate cu roșu','Clic dreapta pe miniatura 2: <b>Diapozitiv nou (New Slide)</b>, <b>Dublare diapozitiv (Duplicate Slide)</b>, <b>Ștergere diapozitiv (Delete Slide)</b>. Captură din PowerPoint în engleză.')}`,
   exemplu:`<p>Ana face un concurs. Diapozitivul 2, „Întrebarea 1”, are o stea în colț. Pentru a doua întrebare:</p>
<ol><li>clic dreapta pe miniatura 2 → <b>Dublare diapozitiv (Duplicate Slide)</b>;</li><li>copia apare pe locul 3, cu steaua în același colț;</li><li>clic în titlul copiei, șterge cifra 1 și scrie 2.</li></ol>`,
   altfel:`<p>E ca la copiator: pui o fișă, iese o copie la fel, iar pe copie scrii doar ce e altfel. Fișa de la care ai pornit rămâne cum era.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Dublează diapozitivul 2 („Întrebarea 1”), apoi schimbă titlul copiei în <b>Întrebarea 2</b>.',start:{deck:'l5_concurs',cur:0},
     teste:[{ce:'Prezentarea are 3 diapozitive',c:[{k:'nr',n:3}],ajutor:'Dublează un singur diapozitiv. Ai pus prea multe? Apasă Ctrl+Z (butonul de sub fereastră).'},
       {ce:'Diapozitivul 3 e copia diapozitivului 2 (făcut prin dublarea lui)',c:[{k:'copieDin',d:3,din:2}],ajutor:'Clic dreapta pe miniatura 2 → Duplicate Slide (Dublare diapozitiv). Un diapozitiv nou, gol, nu e o copie.'},
       {ce:'Titlul diapozitivului 3 este <b>Întrebarea 2</b>, iar al diapozitivului 2 a rămas „Întrebarea 1”',c:[{k:'text',d:3,ph:'titlu',val:'Întrebarea 2'},{k:'text',d:2,ph:'titlu',val:'Întrebarea 1'}],ajutor:'Clic în titlul copiei (diapozitivul 3), șterge cifra 1 și scrie 2.'}],
     rez:[{ctx:2},'cm:dup',{ph:'titlu',scrie:'Întrebarea 2'}],gresit:['mini-2','new-slide',{ph:'titlu',scrie:'Întrebarea 2'}],
     rezText:'clic dreapta pe miniatura 2 → Duplicate Slide (Dublare diapozitiv) → clic în titlul copiei → „Întrebarea 2”',ajutor:'Copia apare imediat după original. Pe care miniatură dai clic dreapta?',
     why:'Copia a apărut imediat după original, cu aceeași întrebare și aceeași stea. Ai schimbat doar titlul, iar originalul a rămas neatins.'},
   inca:[
    {t:'choice',q:'Prezentarea are 5 diapozitive. Dublezi diapozitivul 2. Pe ce loc apare copia și câte diapozitive are acum prezentarea?',
     o:['Pe locul 3; sunt 6 diapozitive','Pe locul 6, la sfârșit; sunt 6 diapozitive','Pe locul 2; sunt 5 diapozitive','Pe locul 3; sunt 5 diapozitive'],ok:0,ajutor:'Copia apare imediat după original și se adaugă la celelalte.',
     why:'Copia vine imediat după diapozitivul 2, deci pe locul 3. Prezentarea avea 5 și a primit încă unul: 6.'}
   ]},
  /* ---------- pasul 2: ștergere și anulare ---------- */
  {t:'Ștergi ce e în plus. Anulezi o greșeală',
   text:`<p>Ce nu-și are locul se <mark>șterge</mark>: întâi alegi, apoi apeși tasta <kbd>Delete</kbd>.</p>
<ul><li><strong>Un diapozitiv:</strong> clic pe miniatura lui, apoi <kbd>Delete</kbd>. Sau clic dreapta pe ea → <strong>Ștergere diapozitiv (Delete Slide)</strong>. Cele de după el primesc un număr mai mic cu 1.</li>
<li><strong>Un obiect:</strong> clic pe el, ca să aibă chenar, apoi <kbd>Delete</kbd>.</li></ul>
<p>Ai șters din greșeală? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (ții apăsată tasta <kbd>Ctrl</kbd> și apeși <kbd>Z</kbd>) <mark>anulează</mark> ultima acțiune. Dacă mai apeși o dată, anulează și acțiunea dinainte.</p>`,
   exemplu:`<p>În prezentarea Anei a intrat din greșeală diapozitivul „Pisica mea”, pe locul 3.</p>
<ol><li>clic pe miniatura 3 → <kbd>Delete</kbd>: „Planetele” trece de pe locul 4 pe locul 3;</li><li>pe „Planetele” e o săgeată rătăcită: clic pe ea → <kbd>Delete</kbd>;</li><li>a șters din greșeală și „Soarele”? <kbd>Ctrl</kbd>+<kbd>Z</kbd> îl aduce înapoi, pe locul lui.</li></ol>`,
   altfel:`<p>Gândește-te la o listă cu tot ce ai făcut, pas cu pas. <kbd>Ctrl</kbd>+<kbd>Z</kbd> scoate ultimul pas din listă, ca și cum nu l-ai fi făcut. Încă un <kbd>Ctrl</kbd>+<kbd>Z</kbd> îl scoate și pe cel dinainte.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Șterge diapozitivul <b>Pisica mea</b> și săgeata rătăcită de pe <b>Planetele</b>. Apoi exersează anularea: șterge diapozitivul <b>Soarele</b> și adu-l înapoi cu <kbd>Ctrl</kbd>+<kbd>Z</kbd>.',start:{deck:'l5_stergere',cur:0},
     teste:[{ce:'Diapozitivul „Pisica mea” nu mai e în prezentare',c:[{k:'faraTitlu',val:'Pisica mea'}],ajutor:'Clic pe miniatura „Pisica mea”, apoi Delete.'},
       {ce:'Pe „Planetele” nu mai e săgeata',c:[{k:'nobj',d:'Planetele',tip:'forma',forma:'arrowR',n:0}],ajutor:'Alege diapozitivul „Planetele”, dă clic pe săgeată (să aibă chenar), apoi Delete.'},
       {ce:'Ai anulat o ștergere cu Ctrl+Z, iar „Soarele” e pe locul 2',c:[{k:'ev',e:'undo'},{k:'loc',val:'Soarele',n:2}],ajutor:'Clic pe miniatura „Soarele”, Delete, apoi Ctrl+Z.'},
       {ce:'Au rămas 4 diapozitive, în ordinea: Sistemul solar, Soarele, Planetele, Ce reținem',c:[{k:'ordine',val:['Sistemul solar','Soarele','Planetele','Ce reținem']}],ajutor:'Ai șters ce nu trebuia? Ctrl+Z, până revine.'}],
     rez:['mini-3','k:del',{alege:{tip:'forma',forma:'arrowR'}},'k:del','mini-2','k:del','k:undo'],gresit:['mini-3','k:del'],
     rezText:'miniatura „Pisica mea” → Delete; pe „Planetele”, clic pe săgeată → Delete; miniatura „Soarele” → Delete → Ctrl+Z',ajutor:'Întâi alegi (clic), apoi Delete.',
     why:'Ai șters un diapozitiv și un obiect, fiecare după ce l-ai ales. Ștergerea greșită ai reparat-o cu Ctrl+Z: „Soarele” s-a întors pe locul lui.'},
   inca:[
    {t:'choice',q:'Prezentarea are 6 diapozitive. Ștergi diapozitivul 2. Ce număr are acum diapozitivul care era al 4-lea?',o:['3','4','5','2'],ok:0,
     ajutor:'Cele de după diapozitivul șters primesc un număr mai mic cu 1.',why:'Toate diapozitivele de după cel șters urcă un loc: al 4-lea devine al 3-lea.'}
   ]},
  /* ---------- pasul 3: mutarea unui diapozitiv ---------- */
  {t:'Muți un diapozitiv: tragi miniatura',
   text:`<p>Ordinea diapozitivelor se schimbă în panoul cu miniaturi, prin <mark>tragere</mark>, ca la fișierele din clasa a V-a:</p>
<ol><li>pui mouse-ul pe miniatură;</li><li>ții apăsat butonul din stânga;</li><li>tragi în sus sau în jos; PowerPoint îți arată unde va ajunge: între miniaturi apare un spațiu sau o linie;</li><li>îi dai drumul.</li></ol>
<p>Diapozitivul nu se copiază și nu se șterge: doar își schimbă locul. Numerele din stânga miniaturilor se schimbă singure.</p>`,
   exemplu:`<p>„Ce reținem” a ajuns din greșeală pe locul 2, dar trebuie să fie ultimul.</p>
<ol><li>prinzi miniatura 2 și o tragi în jos;</li><li>când ajunge sub ultima miniatură, îi dai drumul acolo;</li><li>„Ce reținem” e acum ultimul, iar „Cuprins” a trecut de pe locul 3 pe locul 2.</li></ol>`,
   altfel:`<p>E ca atunci când schimbi ordinea cărților pe un raft: scoți o carte, o bagi între altele două, iar celelalte se dau puțin la o parte. Nicio carte nu se pierde și nu apare una nouă.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Mută diapozitivul <b>Ce reținem</b> la sfârșit, după „Planetele”. (Pe telefon: ții degetul pe miniatură până i se colorează chenarul, apoi tragi.)',start:{deck:'l5_mutare',cur:0},
     teste:[{ce:'„Ce reținem” e ultimul diapozitiv',c:[{k:'ultimul',val:'Ce reținem'}],ajutor:'Trage miniatura 2 în jos și las-o sub ultima miniatură.'},
       {ce:'Ordinea: Sistemul solar, Cuprins, Soarele, Planetele, Ce reținem (niciunul în plus sau în minus)',c:[{k:'ordine',val:['Sistemul solar','Cuprins','Soarele','Planetele','Ce reținem']}],ajutor:'Tragerea nu copiază și nu șterge. Ai greșit? Ctrl+Z.'}],
     rez:[{muta:[2,5]}],gresit:[{muta:[2,4]}],

<script>
/* Lecția 20, clasa a VI-a (M3, predare): „Structura repetitivă cu contor (număr cunoscut de pași)”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026). Faptele
   despre blocul „repetă” sunt PROBATE în editorul viu (Chromium headless, profil temporar, fără cont, 24.10.2026:
   _proba\live_repeta*.py → live_repeta*.json; structura citită din project.json-ul salvat).
   Simulatoarele: lectii/_sim/scratch.js (VI/18, doar FOLOSIT) + lectii/_sim/scratch-control.js (NOU, al lecției: blocul
   „repetă” și înfășurarea, ca în editor) · lectii/_sim/urmarire-algoritm.js (VI/17, doar FOLOSIT) +
   lectii/_sim/urmarire-algoritm-repetitie.js (NOU: „pentru”, tabelul pe treceri, „de câte ori”). Valorile din tabelele
   și exemplele de pseudocod sunt CALCULATE de interpretor, nu scrise de mână (oracolul independent: _proba\oracol_independent.py).
   Granița: NU „cât timp”, NU „repetă până când”, NU comparația structurilor, NU schema logică, NU variabilele Scratch.
   Reparată după judecata 1 (24.10.2026): registrul _verificare\registru_j1.md, probele _proba\proba_reparatii.py și
   _proba\live_repeta6.py (editorul viu). */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));
const L = p => UrmarireAlgoritm.listare(p);
const TT = (p, d) => UrmarireRepetitie.tabelTreceri(p, d);

/* ---- ajutoare pentru testele simulatorului (pe COMPORTAMENT: programul elevului e rulat de la steag) ---- */
const A = SimScratch.ajutor, C = SimScratchControl;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const spuse = U => U.spuse.map(norm);
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const cate = (P, id) => A.toate(P).filter(x => x === id).length;
/* toate locurile în care pisica a spus textul, în ordine */
const spusLa = (U, text, o) => { let p = [o.x, o.y]; const r = []; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune' && norm(e.valoare) === norm(text)) r.push(p); } return r; };
const ALTUNDE = {x: -150, y: 60, directie: 90};
const STRAMB = {x: -120, y: 80, directie: 0};
const PAL = ['steag', 'mergi', 'roteste_dr', 'roteste_st', 'mergi_la_xy', 'orienteaza', 'spune_sec', 'repeta'];
const zeroZero = P => { const v = A.valori(P, 'mergi_la_xy'); return v.length === 1 && +v[0][0] === 0 && +v[0][1] === 0; };

/* ---- programele lecției (pătratul și scările sunt cele ale lecției 19, granița vi_l19.md) ---- */
const LATURA = [['mergi', 100], ['spune_sec', 'Colț!', 1], ['roteste_dr', 90]];
const START = [['steag'], ['mergi_la_xy', 0, 0], ['orienteaza', 90]];
const P_LUNG = [{x: 14, y: 14, b: START.concat(LATURA, LATURA, LATURA, LATURA)}];
const P_SCURT = [{x: 14, y: 14, b: START.concat([['repeta', 4, {guri: [LATURA]}]])}];
const TREAPTA = [['mergi', 40], ['roteste_st', 90], ['mergi', 40], ['roteste_dr', 90]];
const P_SCARI_LUNG = [{x: 14, y: 14, b: START.concat(TREAPTA, TREAPTA, TREAPTA, [['spune_sec', 'Sus!', 2]])}];
const COLTURI = [[100, 0], [100, -100], [0, -100], [0, 0]];

/* ---- pseudocodul (valorile din exemple le calculează interpretorul) ---- */
const P4_EX = ['pentru i ← 1, 3 execută', '   Afișează i', 'sfârșit pentru'];
const P4_EX2 = ['pentru i ← 3, 7 execută', '   Afișează i * 10', 'sfârșit pentru'];
const SUMA = ['Început', 'Citește n', 's ← 0', 'pentru i ← 1, n execută', '   s ← s + i', 'sfârșit pentru', 'Afișează s', 'Sfârșit'];
const PUTERI = ['Început', 'Citește n', 'p ← 1', 'pentru i ← 1, n execută', '   p ← p * 2', 'sfârșit pentru', 'Afișează p', 'Sfârșit'];
const SCARI_PS = ['Început', 'x ← 0', 'y ← 0', 'pentru i ← 1, 4 execută', '   x ← x + 30', '   y ← y + 30', 'sfârșit pentru', 'Afișează x', 'Sfârșit'];

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun. Drumul e
   probat viu (live_repeta4.py: E2 scurtarea, E3 latura 60, E4 triunghiul; live_repeta5.py F1: după „Load from your
   computer”, „Salvează pe calculatorul tău” propune numele fișierului încărcat; live_repeta6.py R1: proiectul pornit
   de la zero se salvează ca „Proiect Scratch.sb3”). ---- */
const LAB = [
  'Pătratul scurt e în fila Scratch? Treci la punctul 2. Altfel: <code>scratch.mit.edu</code> › <b>Creează</b> › <b>Fișier</b> › <b>Load from your computer</b> › folderul tău › <b>Patrat_…</b>, apoi punctele 1-3 de la pasul „Programul lung devine scurt” (pasul 3 din 6). Nu ai <b>Patrat_…</b>? După <b>Creează</b>, fă direct pătratul scurt, ca în desenul din P3.',
  'În „mergi 100 pași” scrie <code>60</code>, <kbd>Enter</kbd>, apoi apasă steagul: colțurile sunt acum la x 60 și y −60.',
  '<b>Dacă mai ai timp:</b> triunghiul. În „repetă” scrie <code>3</code>, în „rotește-te” scrie <code>120</code>. Steagul: 3 colțuri, apoi pisica e din nou în mijloc.',
  '<b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? Folderul tău, numele <code>Repeta_</code>, clasa și numele tău (<code>Repeta_6A_Popescu</code>), <b>Salvare</b>. Există deja? E al unui coleg: nu-l înlocui, adaugă prenumele. Apoi punctul 6.',
  'Nu te-a întrebat? Explorer › <b>Descărcări</b> › fișierul cel mai nou (<b>Patrat_…</b> sau, pornit de la zero, <b>Proiect Scratch</b>; poate cu (1)): <kbd>F2</kbd>, <code>Repeta_</code>, clasa și numele tău, <kbd>Enter</kbd>; <b>Decupare</b>, folderul tău, <b>Lipire</b>. Există deja? <b>Se omite acest fișier</b>, adaugă prenumele, mută-l din nou.',
  'Închide fila Scratch (te întreabă dacă pleci? Pleci: ai salvat). În folderul tău: <b>Repeta_…</b> nou și, dacă îl aveai, <b>Patrat_…</b> neschimbat.'
];

JocMotor.porneste({
  cheie: 'lectie_vi_m3_l20',
  mod: 'lectie',
  titlu: 'Structura repetitivă cu contor (număr cunoscut de pași)',
  marca: 'Lecția <b>20</b> · clasa a VI-a',
  h1: 'Structura repetitivă <span class="acc">cu contor</span> (număr cunoscut de pași)',
  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a VI-a',
  unitate: 'VI-U3',
  unitateTitlu: 'Algoritmi: structuri repetitive',
  competente: ['CS.2.1', 'CS.2.2', 'CS.2.3'],
  lectii: '20',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a VI-a, CS.2.1 „Utilizarea unui mediu grafic-interactiv pentru exersarea algoritmilor”, CS.2.2 „Aplicarea etapelor de rezolvare…, urmărind pas cu pas”, CS.2.3 „Reprezentarea algoritmilor…” · unitatea VI-U3 „Algoritmi: structuri repetitive” · lecția 20, predare · conținutul „Structura repetitivă cu contor”. Aplicația: Scratch 3, editorul online scratch.mit.edu; pseudocodul în notația lecției 17.',
  intro: '<p><b>Ai nevoie de:</b> lecțiile 17 (algoritmul pe rânduri, tabelul de urmărire), 18 (Scratch: tragerea, steagul, salvarea) și 19 (pătratul lung, salvat ca <b>Patrat_…</b>; ce se repetă și de câte ori).</p>',
  cum: '<b>Cum lucrezi:</b> casetele „Acum în Scratch” le faci în fila Scratch. „Încă un exercițiu” și „Dacă mai ai timp”: doar dacă termini repede.',
  banda: '<span class="bk ev">când se dă click pe ⚑</span><span class="bk ct">repetă 4</span><span class="bk mv">mergi 100 pași</span><span class="bk lk">spune Colț!</span><span class="bk mv">rotește-te ↻ 90</span>',
  nivele: [
{t: 'Structura repetitivă cu contor (număr cunoscut de pași)', final: true, lectii: [20],
 continuturi: ['Structura repetitivă cu contor'],
 obiectiv: 'scurtezi un program cu blocul „repetă” din Scratch, alegi numărul de treceri din cerință, scrii aceeași repetiție în pseudocod cu „pentru” și urmărești contorul într-un tabel, trecere cu trecere.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: când știi dinainte de câte ori',
   text: `<p>La lecția 19, pătratul avea de 4 ori aceleași trei blocuri. Azi le scrii <b>o singură dată</b> și spui „de 4 ori”.</p>
<p>Asta e <mark>structura repetitivă cu contor</mark>: știi DINAINTE de câte ori se repetă. <mark>Contorul</mark> ține socoteala: 1, 2, 3, 4; la capăt, repetiția se oprește (finitudinea, lecția 17).</p>
${fig('scari-parc.webp', 400, 601, 'O scară de beton pe o pantă cu iarbă, într-un parc: grupuri de trepte, despărțite de porțiuni drepte, se repetă până sus', 'Același grup de trepte, de mai multe ori. <small>Foto: Krzysztof Popławski, <a href="https://commons.wikimedia.org/wiki/File:Schody_w_Parku_%C5%9Arodula.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0; micșorată.</small>')}`},
  /* ---- pasul 1: blocul „repetă” (ce este, la ce folosește, cum) ---- */
  {t: 'Blocul „repetă”: ce pui în gura lui se repetă',
   text: `<p>În <b>Control</b> e blocul <span class="blk ct">repetă 10</span>, în forma literei C. Blocurile din <mark>gura</mark> lui se execută de câte ori scrie în căsuță.</p>
<p>O <mark>trecere</mark> = toate blocurile din gură, o dată, de sus în jos. După ultima trecere vine, o singură dată, blocul de sub brațul de jos.</p>
<p>Numărul îl schimbi ca la lecția 18: clic pe 10, scrii, <kbd>Enter</kbd>.</p>`,
   exemplu: `${fig('control-repeta.webp', 312, 260, 'Editorul Scratch în română: în stânga categoriile, cu Control ales; în paleta Control, blocul repetă 10, în formă de C, încadrat cu roșu', 'În Scratch: bulina <b>Control</b>, apoi blocul <b>repetă 10</b>.')}
${STIVA([['steag'], ['mergi_la_xy', 0, 0], ['repeta', 3, {guri: [[['mergi', 50], ['spune_sec', 'Hop!', 1]]]}], ['spune_sec', 'Gata!', 1]], 'De 3 ori „Hop!”, apoi o dată „Gata!”; la final, x e 150.')}
${ACUM('Deschide Scratch: <code>scratch.mit.edu</code> › <b>Creează</b>. Meniul e în engleză? <b>Settings</b> › <b>Language</b> › <b>Română</b>.',
  'Din <b>Evenimente</b>, trage „când se dă click pe ⚑”. Apasă bulina <b>Control</b> și lipește sub el „repetă 10”.',
  'Din <b>Mișcare</b>, lasă „mergi 10 pași” în gura lui „repetă”. Apasă steagul: x e 100 (a doua oară, 200: pisica pleacă de unde a rămas).')}`,
   altfel: `<p>E ca la ora de sport: profesorul spune „10 genuflexiuni”. Nu spune „genuflexiune” de 10 ori: spune o dată ce faci și de câte ori. Gura blocului e „ce faci”, căsuța e „de câte ori”.</p>`,
   incearca: {t: 'scratch', q: 'Lasă „mergi 10 pași” în gura lui „repetă 10” și apasă steagul. Pe telefon, ca la lecția 18: degetul pe bloc, întâi puțin spre dreapta, apoi unde vrei (nu-l ține pe loc: se deschide meniul).',
    paleta: PAL,
    program: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['repeta', 10, {guri: [[]]}]]}, {x: 30, y: 190, b: [['mergi', 10]]}],
    teste: [
     {ce: '„mergi 10 pași” în gura lui „repetă”', msg: 'Trage „mergi 10 pași” și lasă-l înăuntrul lui „repetă”, chiar sub rândul „repetă 10”, până se lipește acolo.', ok: (U, P) => eq(C.subRepeta(P), ['mergi']) && P.length === 1},
     {ce: 'x 100, de oriunde pornește pisica', o: ALTUNDE, msg: 'De 10 ori câte 10 pași fac 100. Lasă „repetă” cu 10 și „mergi” cu 10.', ok: U => U.x === 100 && U.y === 0},
     {ce: 'Ai apăsat steagul', msg: 'Apasă steagul verde, deasupra scenei, și privește x.', ok: (U, P, S) => S.apasatSteag}],
    solutie: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['repeta', 10, {guri: [[['mergi', 10]]]}]]}],
    gresit: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['repeta', 10, {guri: [[]]}], ['mergi', 10]]}],
    ajutor: 'Gura e locul de sub rândul portocaliu „repetă 10”, înăuntrul literei C. Un bloc lăsat sub brațul de jos se execută o singură dată.',
    why: 'Blocul din gură se execută de 10 ori: 10 treceri a câte 10 pași fac 100.'},
   inca: [
    {t: 'scratch', q: 'Pisica trebuie să spună „Hop!” de 3 ori. Lasă „spune Hop! pentru 1 secunde” în gura lui „repetă”, scrie 3 în căsuța lui și apasă steagul.',
     paleta: PAL,
     program: [{x: 14, y: 14, b: [['steag'], ['repeta', 10, {guri: [[]]}]]}, {x: 30, y: 170, b: [['spune_sec', 'Hop!', 1]]}],
     teste: [
      {ce: '„spune Hop!” e în gura lui „repetă”', msg: 'Lasă „spune Hop! pentru 1 secunde” înăuntrul lui „repetă”, chiar sub rândul de sus.', ok: (U, P) => eq(C.subRepeta(P), ['spune_sec'])},
      {ce: '„repetă” are 3 în căsuță', msg: 'Clic pe 10, scrie 3, Enter.', ok: (U, P) => eq(C.numere(P), [3])},
      {ce: 'Pisica spune „Hop!” de 3 ori', msg: 'Trei treceri: „Hop!” de trei ori.', ok: U => eq(spuse(U), ['hop', 'hop', 'hop'])},
      {ce: 'Ai apăsat steagul', msg: 'Apasă steagul verde.', ok: (U, P, S) => S.apasatSteag}],
     solutie: [{x: 14, y: 14, b: [['steag'], ['repeta', 3, {guri: [[['spune_sec', 'Hop!', 1]]]}]]}],
     gresit: [{x: 14, y: 14, b: [['steag'], ['repeta', 10, {guri: [[['spune_sec', 'Hop!', 1]]]}]]}],
     ajutor: 'Întâi blocul în gură, apoi numărul: clic pe 10, scrii 3, Enter.', why: 'Ce e în gură se execută de câte ori scrie în căsuță: 3 treceri, 3 „Hop!”.'}
   ]},
  /* ---- pasul 2: programul lung devine scurt (drumul probat viu: live_repeta4.py, E2) ---- */
  {t: 'Programul lung devine scurt',
   text: `<p>Pătratul de la lecția 19 îl scurtezi așa:</p>
<ol><li>Lași „repetă 10” sub „orientează-te în direcția 90”. Gol, în mijlocul programului, „repetă” ia în gură <b>toate</b> blocurile de dedesubt.</li>

  /* ---- pasul 4: „pentru” în pseudocod (exemplele, calculate de interpretor) ---- */
  {t: 'Același lucru în caiet: „pentru”',
   text: `<p>Algoritmul scris pe rânduri (lecția 17) se numește <mark>pseudocod</mark>. Acolo, repetiția cu contor se scrie cu <mark>pentru</mark>:</p>

   exemplu: `<p>„repetă 4” din Scratch se scrie <code>pentru i ← 1, 4 execută</code>: în Scratch, contorul nu se vede.</p>
${L(P4_EX2)}

   altfel: `<p>E ca strigarea catalogului: profesorul numără de la 1 la 25 și, pentru fiecare număr, face același lucru: strigă elevul cu numărul acela. Numărul care crește e contorul; 1 e valoarea inițială, 25 e valoarea finală.</p>`,
   incearca: {t: 'decateori', q: 'De câte ori se execută corpul (rândul „Afișează i * 2”)?',
    prog: ['Început', 'pentru i ← 4, 9 execută', '   Afișează i * 2', 'sfârșit pentru', 'Sfârșit'], cere: 'ori',
    ajutor: 'Scrie valorile lui i: 4, 5, …, 9, și numără-le. Sau: finală − inițială + 1.',
    why: 'i ia valorile 4, 5, 6, 7, 8, 9: 9 − 4 + 1 = 6 treceri.'},
   inca: [
    {t: 'decateori', q: 'Ce se afișează, în ordine?', prog: ['Început', 'pentru i ← 2, 5 execută', '   Afișează i + 100', 'sfârșit pentru', 'Sfârșit'], cere: 'afisari',
     ajutor: 'La fiecare trecere, i are altă valoare: 2, apoi 3, 4, 5. Calculezi i + 100 de fiecare dată.', why: 'i = 2, 3, 4, 5, deci se afișează 102, 103, 104, 105.'},
    {t: 'choice', q: 'Cum se scrie în pseudocod blocul „repetă 5” din Scratch?', o: ['pentru i ← 1, 5 execută', 'pentru i ← 2, 5 execută', 'pentru i ← 0, 5 execută', 'pentru i ← 1, 6 execută'], ok: 0,

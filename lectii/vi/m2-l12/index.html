/* banda de sus: un câmp de parolă cu punctele lui și un lacăt închis — doar CSS */
.banda{display:flex;gap:7px;padding:6px 12px;min-height:36px;align-items:center}
.banda span{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.85}
.banda .camp{width:auto;height:22px;border-radius:5px;background:none;border:2px solid var(--ink2);display:flex;align-items:center;gap:6px;padding:0 8px;opacity:1}
.banda .camp i{display:block;width:7px;height:7px;border-radius:50%;background:var(--ink2)}
.banda .lacat{width:18px;height:14px;border-radius:3px;background:var(--accent);position:relative;margin-top:6px;opacity:1}
.banda .lacat::before{content:"";position:absolute;left:3px;top:-8px;width:8px;height:9px;border:2px solid var(--accent);border-bottom:0;border-radius:6px 6px 0 0}
h1{font-size:clamp(1.6rem,6.2vw,2.7rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:340px}
/* legăturile din legenda pozei (licența, Wikimedia): zonă de atins de 32 px, fără să mute rândurile (regula 20) */
figure.captura figcaption a{display:inline-block;padding:7px 2px;margin:-7px 0}
.reading ol li,.reading ul li{margin:.2em 0}
.descarca{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;font-weight:600;text-decoration:none;min-height:32px}
.cod{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:0 4px;white-space:nowrap}
details.verif{margin:.5em 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
details.verif summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;box-sizing:border-box;list-style-position:inside}
details.verif>div{padding:0 12px 10px}

<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 12 — „Protecția datelor personale. Parole și identitate virtuală” (VI-U2, CS.1.3).
   Simulatorul: lectii/_sim/cont-sigur.js (proprietar: lecția aceasta) — tipurile parola, profil, cont.
   SIGURANȚA: toate parolele, persoanele, profilurile și mesajele sunt INVENTATE; lecția nu cere nicăieri date reale.
   Ce tastează elevul nu se salvează și nu pleacă nicăieri (proba: _proba/proba_siguranta.py, în surse.md).
   Regulile despre parole (cel puțin 15 caractere, amestec, frază-parolă, altă parolă pe fiecare cont): DNSC (surse.md).
   Trimiterile între pași se fac după NUMELE pasului; numărul de pe ecran îl pune motorul.
   ====================================================================================================== */
const CONT=['Protecția datelor personale în comunicarea prin Internet(de exemplu, construcția și protejarea parolelor, identitatea virtuală)'];
const fig=(f,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m2-l12/img/${f}" target="_blank"><img src="../m2-l12/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;

/* testele de parolă folosite în pagină (catalogul e în cont-sigur.js) */
const T5=['lung15','mari','mici','cifre','simbol'];
/* parolele „bune” scrise în lecție (exemple, soluții, fișa): acum le știe toată lumea, deci nu trec drept „inventate”.
   Fiecare exercițiu le primește pe toate, în afară de propria soluție (de ea are nevoie „Arată-mi răspunsul” și poarta). */
const PUBLICATE=['Pian4!Nor#Lebada','Melc4?Cer!Vioara','Mar7!Tren#Galben','Zmeu9?Lingura#Port','Stea4!Munte#Pahar','Cana8#Zebra!Somn',
  'Lampa7?Nor#Vioara','Ghinda3!Toba#Ceainic','Cana8#Pod!Vulpe','Ceas3?Lup#Fereastra','Melc5!Nor?Trompeta','Ploaie9#Cartof!Vis'];
const ALTE=sol=>PUBLICATE.filter(x=>x!==sol);
const NU_EX=sol=>({c:'nuExemplu',v:ALTE(sol)});

/* profilurile inventate: unul la „Încearcă”, altul (frate) la verificare */
const PROFIL_ALEX={nume:'Alex_Fotbal12',avatar:'⚽',randuri:[
  {t:'Membru de 4 zile',semn:true,dece:'contul e nou'},
  {t:'Prieteni: 2 · Poze: 1',semn:true,dece:'are foarte puțini prieteni și foarte puține poze'},
  {t:'Îi place fotbalul',semn:false},
  {t:'Salut! Ce faci?',semn:false,mesaj:true},
  {t:'Ești cea mai simpatică persoană din tot jocul! Hai să fim prieteni buni!',semn:true,dece:'te laudă mult și vrea foarte repede să fiți prieteni',mesaj:true},
  {t:'Îți dau 500 de monede în joc dacă îmi spui la ce școală ești.',semn:true,dece:'îți promite un premiu și îți cere o dată personală (școala)',mesaj:true},
  {t:'Eu joc în fiecare seară, după teme.',semn:false,mesaj:true},
  {t:'Să nu le spui părinților, e secretul nostru.',semn:true,dece:'îți cere să păstrezi secretul față de părinți',mesaj:true}]};
const PROFIL_SARA={nume:'Sara_Dans11',avatar:'💃',randuri:[
  {t:'Îi place să danseze',semn:false},
  {t:'Membru de ieri',semn:true,dece:'contul e nou'},
  {t:'Poze: 1 · Prieteni: 3',semn:true,dece:'are foarte puține poze și foarte puțini prieteni'},
  {t:'Bună! Și eu sunt în clasa a VI-a.',semn:false,mesaj:true},
  {t:'Trimite-mi o poză cu tine și numărul tău de telefon.',semn:true,dece:'îți cere o poză cu tine și o dată personală (telefonul)',mesaj:true},
  {t:'Îți fac cadou un costum rar pentru personajul tău.',semn:true,dece:'îți promite un cadou',mesaj:true},
  {t:'Ce culoare îți place cel mai mult?',semn:false,mesaj:true},
  {t:'Dar nu le zice alor tăi, bine?',semn:true,dece:'îți cere să păstrezi secretul față de părinți',mesaj:true}]};

/* atelierul: contul lui Matei (din simulator) și al doilea cont, al Ilincăi, pentru „Încă un exercițiu” */
const CONT_MATEI=Object.assign({},SimContSigur.CONT_MATEI,{publicate:ALTE('Lampa7?Nor#Vioara')});
const CONT_ILINCA={app:'Grădina cu povești',eu:'Floare_de_colt',cine:'Ilinca',despre:'numele ei, anul în care s-a născut, numele pisicii',
  solutie:'Ghinda3!Toba#Ceainic',publicate:ALTE('Ghinda3!Toba#Ceainic'),
  explica:{ilinca:'numele ei',marin:'numele ei de familie','2015':'anul în care s-a născut',pufi:'numele pisicii'},
  date:[
    {id:'nume',et:'Numele complet',val:'Ilinca Marin',ascunde:true},
    {id:'porecla',et:'Porecla (numele din joc)',val:'Floare_de_colt',ascunde:false},
    {id:'adresa',et:'Adresa',val:'Strada Morii nr. 15',ascunde:true},
    {id:'desen',et:'Poza de profil',val:'un desen cu o pisică albastră',ascunde:false},
    {id:'scoala',et:'Școala și clasa',val:'Școala Gimnazială nr. 1, clasa a VI-a A',ascunde:true},
    {id:'joc',et:'Jocul preferat',val:'puzzle',ascunde:false},
    {id:'telefon',et:'Telefonul',val:'07xx xxx xxx (numărul ei de mobil)',ascunde:true}],
  interzise:['ilinca','marin','2015','pufi'],
  mesaj:{de:'Dana_Prietena11',text:'Bună, Ilinca! Am 11 ani, ca tine. Scrie-mi adresa ta, să-ți trimit o brățară cadou. Și nu le zice alor tăi, e secretul nostru!'}};

const LECTIA={
 t:'Protecția datelor personale. Parole și identitate virtuală',lectii:[12],continuturi:CONT,final:true,
 obiectiv:'știi ce date personale păstrezi pentru tine, faci o parolă puternică după metoda frazei-parolă și o ții secretă, știi ce urmă lași când postezi și recunoști un profil fals.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Pe Internet intri în jocuri, în aplicații de mesaje, pe LearningHub. Peste tot lași informații despre tine. Azi afli ce informații păstrezi doar pentru tine, cum faci o <strong>parolă</strong> greu de ghicit și cum recunoști pe cineva care se dă drept altcineva.</p>
${fig('cheia-casei.webp',520,520,'O mână ține legătura de chei a casei, cu un breloc în formă de căsuță; o cheie e băgată în broasca ușii','Cheia de la casă o ai tu și o au părinții tăi; n-o dai altcuiva. Parola e cheia ta de pe Internet. Fotografie: Shixart1985, <a href="https://creativecommons.org/licenses/by/2.0" target="_blank" rel="noopener">CC BY 2.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Hand_holds_house_keys_near_door_lock,_symbolizing_new_beginnings_and_homeownership_journey_in_a_modern_setting.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> din clasa a V-a, serviciile Internetului (web, mesageria, jocurile) și regulile de siguranță pe Internet; din clasa a VI-a, lucrul în PowerPoint: deschizi un fișier descărcat cu Activare editare, <kbd>F5</kbd> și <kbd>Esc</kbd>, închizi fără să salvezi (lecțiile 2 și 3), ții apăsat <kbd>Shift</kbd> ca să scrii un semn (lecția 3: <kbd>Shift</kbd> + minus scrie _), scrii într-un substituent și într-un tabel (lecția 4).</p>`},
  /* ---------- pasul: datele personale ---------- */
  {t:'Datele personale: ce sunt și ce nu publici',
   text:`<p><mark>Datele personale</mark> sunt informațiile după care cineva poate afla cine ești sau unde te găsește: numele complet, adresa de acasă, numărul de telefon, școala și clasa, pozele cu tine, locul unde ești acum.</p>
<p>Le protejezi pentru că un necunoscut care le adună te poate căuta sau se poate da drept tine.</p>
<p><strong>Regula:</strong> nu le <mark>publici</mark> (nu le pui pe Internet, unde le vede oricine) și nu le dai cuiva pe care nu-l cunoști în viața reală, oricât de frumos ți le cere. Dacă nu ești sigur, întrebi părinții.</p>
<p>Unele lucruri nu te dau de gol singure, de exemplu culoarea preferată. Laolaltă cu altele, însă, te pot da de gol.</p>`,
   exemplu:`<p>Ioana vrea să scrie într-un joc: „Sunt Ioana Pop, de la Școala nr. 5, clasa a VI-a A, și acum sunt singură în parcul de lângă bloc.” Așa, un necunoscut ar afla cum o cheamă, unde învață și unde e chiar acum.</p>
<p>Ioana scrie altceva: „Salut! Îmi place să desenez dragoni.” Nimeni nu află cine e sau unde e.</p>`,
   altfel:`<p>Pe Internet e ca la avizierul din holul blocului: ce lipești acolo citește oricine trece, și vecinul, și un străin. Pe avizier nu ți-ai lipi adresa, telefonul și unde ești în fiecare zi. Nici pe Internet.</p>`,
   incearca:{t:'classify',q:'Pentru fiecare informație, hotărăște: e o dată personală pe care n-o dai, sau nu te dă de gol singură?',
     cats:['Dată personală: n-o dai','Nu te dă de gol singură'],
     items:[['numele străzii pe care locuiești',0],['sportul preferat',1],['„Acum sunt singur acasă.”',0],['o poză cu tine în fața școlii, cu numele școlii pe clădire',0],['desenul animat preferat',1],['numărul de telefon al mamei tale',0]],
     ajutor:'La fiecare, întreabă-te: un necunoscut ar afla din asta cine sunt sau unde mă găsește?',
     why:'Strada e o bucată din adresă. „Acum sunt singur acasă” spune unde ești chiar acum. Poza arată și cum arăți, și unde înveți. Telefonul mamei duce la familia ta. Sportul și desenul animat preferat nu spun singure cine ești.'},
   inca:[
    {t:'choice',q:'Un jucător pe care nu-l cunoști îți scrie în joc: „Din ce oraș ești și la ce școală mergi? Vreau să-ți trimit un cadou.” Ce faci?',
     o:['Nu-i spui și le arăți părinților mesajul','Îi spui doar orașul, nu și școala','Îi spui, dacă pare să aibă vârsta ta','Îi dai numărul de telefon, ca să vorbiți direct'],ok:0,
     ajutor:'Îl cunoști în viața reală? Ce spune regula din pas?',
     why:'Orașul și școala spun unde te găsește. Unui necunoscut nu-i dai date personale, nici pe bucăți, nici pentru un cadou. Părinții te ajută să decizi.'}
   ]},
  /* ---------- pasul: parola puternică ---------- */
  {t:'Parola puternică: fraza-parolă',
   text:`<p>Un <mark>cont</mark> e locul tău dintr-un joc sau dintr-o aplicație. Intri în el cu un nume și cu o <mark>parolă</mark>: un cuvânt secret care arată că ești chiar tu.</p>
<p>O parolă e <strong>puternică</strong> dacă e greu de ghicit: are <strong>cel puțin 15 caractere</strong> (litere, cifre sau semne) și <strong>amestecă</strong> litere mari, litere mici, cifre și <mark>simboluri</mark> (semne ca <kbd>!</kbd> <kbd>?</kbd> <kbd>#</kbd> <kbd>%</kbd>).</p>
<p>Ca s-o ții minte, faci o <mark>frază-parolă</mark>:</p>
<ol><li>alegi 3 cuvinte fără legătură între ele și fără legătură cu tine;</li><li>le scrii lipite, fiecare cu literă mare;</li><li>pui între ele cifre și simboluri (nu un an);</li><li>numeri caracterele: sunt cel puțin 15?</li></ol>`,
   exemplu:`<p>Parole <b>slabe</b>, pe care cine ghicește parole le încearcă primele: un nume și un an (${C_('maria2014')}), cifre sau litere la rând (${C_('123456')}, ${C_('aaaaaa')}), un cuvânt obișnuit (${C_('fotbal')}, ${C_('parola')}).</p>
<p>O frază-parolă: Pian, Nor, Lebada → ${C_('Pian4!Nor#Lebada')}. Are 16 caractere: litere mari și mici, o cifră și două simboluri. N-o folosi pe asta: acum o știe toată lumea.</p>
<p>Ca s-o scrii, ții apăsat <kbd>Shift</kbd>: <kbd>Shift</kbd> + <kbd>P</kbd> scrie P, <kbd>Shift</kbd> + <kbd>1</kbd> scrie !. Pe telefon: săgeata ⇧ și butonul ?123.</p>`,
   altfel:`<p>O parolă scurtă e ca un lacăt cu cifru de 3 rotițe: cineva le încearcă pe toate într-o după-amiază. Una lungă și amestecată e ca un lacăt cu 15 rotițe, fiecare cu litere, cifre și semne: nimeni nu termină de încercat.</p>`,
   incearca:{t:'parola',q:'Inventează o frază-parolă după metodă: 3 cuvinte fără legătură cu tine, lipite, fiecare cu literă mare, cu cifre și simboluri între ele. Testele se bifează cât scrii.',
     teste:['lung15','mari','mici','cifre','simbol','cuvinte3','neghicita',NU_EX('Melc4?Cer!Vioara')],start:'',solutie:'Melc4?Cer!Vioara',gresit:'pisicuta',
     ajutor:'Alege trei cuvinte, de exemplu un animal, un obiect și o culoare (nu ale tale preferate). Scrie-le lipite, cu literă mare, și pune între ele o cifră și un simbol. Numără: cel puțin 15?',
     why:'Ai o frază-parolă: lungă, amestecată și ușor de ținut minte. Pe cea adevărată o faci tot așa, dar alta, și n-o scrii nicăieri.'},
   inca:[
    {t:'classify',q:'Judecă parolele inventate: e puternică sau încă nu?',cats:['Puternică','Încă nu e puternică'],
     items:[['Mar7!Tren#Galben',0],['andrei2013',1],['Ab3!',1],['munteverdealbastru',1],['Zmeu9?Lingura#Port',0],['1234567890',1]],
     ajutor:'La fiecare: are cel puțin 15 caractere? Are litere mari, litere mici, cifre și simboluri?',
     why:'Mar7!Tren#Galben (16) și Zmeu9?Lingura#Port (18) sunt lungi și amestecate. andrei2013 e un nume și un an. Ab3! e amestecată, dar prea scurtă. munteverdealbastru e lungă, dar are doar litere mici. 1234567890 sunt cifre la rând.'},
    {t:'parola',q:`Repară parola slabă ${C_('maria2014')}: fă din ea o parolă puternică, fără numele Maria și fără anul 2014.`,start:'maria2014',
     teste:T5.concat(['cuvinte3','neghicita',{c:'faraDate',v:['maria','2014'],ce:'Nu mai conține numele „maria” și anul „2014”'},NU_EX('Stea4!Munte#Pahar')]),solutie:'Stea4!Munte#Pahar',gresit:'Maria2014!!!!!!!',
     ajutor:'Șterge tot și pornește de la 3 cuvinte noi, fără legătură cu Maria.',
     why:'Numele și anul se ghicesc primele. Trei cuvinte fără legătură cu persoana, amestecate cu cifre și simboluri, nu.'}
   ]},
  /* ---------- pasul: parola rămâne a ta ---------- */
  {t:'Parola rămâne a ta',
   text:`<p>O parolă puternică nu te apără dacă o mai știe cineva. Patru reguli:</p>
<ol><li><strong>O știi doar tu și părinții tăi.</strong> N-o spui nimănui altcuiva, nici prietenilor buni.</li>
<li><strong>Pe fiecare cont, altă parolă.</strong> Dacă cineva o află pe una, nu intră și în celelalte conturi.</li>
<li>Un mesaj care îți cere parola sau date personale e o <mark>capcană</mark>, chiar dacă pare de la echipa jocului, de la școală sau de la un prieten. Nu răspunzi și îl arăți unui adult.</li>
<li>Pe un calculator folosit de mai mulți, la final <mark>ieși din cont</mark> (te deconectezi). Altfel, următorul intră direct în contul tău.</li></ol>`,
   exemplu:`<p>Lui Mihai îi scrie „echipa jocului”: „Trimite-ne parola, altfel îți închidem contul.” E o capcană (regula 3): Mihai nu răspunde și îi arată mesajul mamei.</p>
<p>Pe LearningHub, eticheta cu numele tău, jos pe pagină, are un buton roșu, <b>Ieși</b>. Oriunde o atingi, se deschide întâi meniul de mai jos. La sfârșitul orei, când pleci, alegi <b>Ieși (deconectare)</b> (regula 4). Data viitoare intri pe numele tău cu codul tău.</p>
${fig('meniu-iesi.webp',540,191,'Meniul etichetei de pe LearningHub: butonul roșu Ieși (deconectare), butonul Închide și textul: Pleci de la calculator? Apasă Ieși. După aceea, pe numele tău se intră doar cu codul tău','Meniul care se deschide când atingi eticheta cu numele tău. Captură de pe LearningHub, cu un elev inventat.')}`,
   altfel:`<p>Gândește-te la cheia de la casă. O ai tu și o au părinții tăi; n-o dai nici celui mai bun prieten. Fiecare ușă are cheia ei: cine găsește o cheie nu le deschide pe toate. Dacă un necunoscut sună la ușă și îți cere cheia „ca să repare ceva”, nu i-o dai: chemi un părinte. Iar când pleci, încui ușa în urma ta.</p>`,
   incearca:{t:'classify',q:'E în regulă sau e o greșeală?',cats:['În regulă','Greșeală'],

     why:'E o capcană, chiar dacă spune că e de la școală. Te grăbește („azi”) ca să nu te gândești. Nu trimiți nimic, nici o bucată din parolă, și îl arăți unui adult.'}

  /* ---------- pasul: identitatea virtuală și urma ---------- */
  {t:'Identitatea virtuală și urma ta',
   text:`<p><mark>Profilul</mark> e pagina ta dintr-un joc sau dintr-o aplicație, pe care o văd și alții. <mark>Identitatea virtuală</mark> e felul în care te văd ceilalți pe Internet: după numele afișat, poza de profil și ce scrii.</p>
<p>Când <mark>postezi</mark> (pui pe Internet) o poză sau un mesaj, lași o <mark>urmă</mark>: alții îl pot salva sau îi pot face o captură de ecran (o „fotografie” a ecranului). Chiar dacă îl ștergi, copiile lor rămân.</p>
<p>De aceea, în profil pui o poreclă și un desen, nu numele complet și poza ta. Înainte să postezi, te întrebi: „E în regulă să vadă asta oricine, chiar și peste câțiva ani?”</p>`,
   exemplu:`<p>Andrei vrea să posteze o poză din vacanță: el, cu numele școlii pe tricou, și textul „Suntem plecați la mare două săptămâni!”. Se întreabă: e în regulă să vadă oricine? Nu: se vede la ce școală învață și oricine află că acasă nu e nimeni.</p>
<p>Postează altă poză, doar cu marea, și scrie: „Ce frumoasă e marea!”</p>`,
   altfel:`<p>E ca un bilet lipit la avizierul școlii: îl poți dezlipi după o zi, dar colegii care l-au copiat între timp în caiet îl au în continuare.</p>`,
   incearca:{t:'classify',q:'Ce poți posta liniștit și ce nu postezi?',cats:['Poți posta','Nu postezi'],
     items:[['un desen făcut de tine, fără numele tău pe el',0],['o poză cu diploma de la concurs, pe care se citește numele tău complet',1],['o poză cu pisica ta, în care nu se vede nimic altceva',0],['„Mâine la 8 sunt singur în stația de autobuz de lângă școală.”',1],['o poză cu tine în fața casei, cu numărul casei în spate',1],['un mesaj de bravo pentru echipa ta preferată',0]],
     ajutor:'La fiecare: ar afla oricine din asta cine ești sau unde te găsește?',
     why:'Desenul fără nume, pisica și un mesaj de bravo nu spun cine ești. Diploma arată numele complet, mesajul cu stația spune unde vei fi, iar poza cu numărul casei arată unde locuiești.'},
   inca:[
    {t:'choice',q:'Care profil e cel mai sigur?',
     o:['Porecla „Dragonul_Verde” și un desen cu un dragon','Numele „Ana Pop” și poza ei de la școală','Porecla „Ana_Pop_6B” și o poză cu ea în uniformă','Numele complet și orașul în care locuiește'],ok:0,
     ajutor:'Ce pui în profil, după pas: o poreclă și un desen, sau numele și poza ta?',
     why:'Porecla și desenul nu spun cine ești. „Ana_Pop_6B” pare o poreclă, dar are în ea numele și clasa, iar poza în uniformă arată școala.'}
   ]},
  /* ---------- pasul: profilurile false ---------- */
  {t:'Profilurile false',
   text:`<p>Oricine își poate face un <mark>profil fals</mark>: cu alt nume, altă vârstă și poza altcuiva. Semne că un profil poate fi fals:</p>
<ul><li>contul e nou sau aproape gol: foarte puține poze, prieteni sau postări;</li>
<li>te laudă mult și vrea foarte repede să fiți prieteni;</li>
<li>îți promite cadouri, bani sau premii în joc;</li>
<li>îți cere date personale, poze cu tine sau parola;</li>
<li>îți cere să păstrezi secretul față de părinți.</li></ul>
<p>Ce faci: nu-i dai nimic și nu-i mai răspunzi. Îl <mark>blochezi</mark> (nu-ți mai poate scrie), îl <mark>raportezi</mark> (îl semnalezi celor care se ocupă de joc sau de aplicație) și arăți mesajele unui adult.</p>`,
   exemplu:`<p>Profilul „Bianca_Star11” e făcut acum 5 zile și are o singură poză. Bianca îi scrie lui Mihai: „Ești cel mai tare! Îți dau un costum rar pentru personajul tău dacă îmi spui parola. Nu le zice alor tăi.”</p>
<p>Mihai numără semnele: cont nou, laude, cadou, cere parola, cere secret. Nu-i răspunde, o blochează, o raportează și îi arată mesajul mamei.</p>`,
   incearca:{t:'profil',q:'Profilul și mesajul de mai jos sunt inventate. Atinge fiecare rând care e un semn de profil fals, după lista din pas, apoi apasă <b>Verifică</b>.',profil:PROFIL_ALEX,
     ajutor:'Ia lista din pas pe rând: cont nou? puține poze sau prieteni? laude? cadouri? cere date, poze sau parola? cere secret?',
     why:'Un singur semn e de ajuns ca să fii atent; aici sunt cinci. Nu-i răspunzi, îl blochezi, îl raportezi și arăți mesajele unui adult.'},

    {t:'choice',q:'Ai găsit mai multe semne la un profil care îți scrie. Ce faci?',
     o:['Nu-i răspunzi, îl blochezi, îl raportezi, spui unui adult','Îi răspunzi politicos, ca să nu se supere pe tine','Îi trimiți o poză veche, ca să nu fie una nouă cu tine','Îl întrebi direct dacă profilul lui e fals sau nu'],ok:0,
     ajutor:'Ultimul paragraf al pasului.',
     why:'Un profil fals nu recunoaște că e fals și folosește orice răspuns. Îl blochezi, îl raportezi și ceri ajutorul unui adult.'}

 ],
 atelier:{t:'cont',titlu:'Pune în siguranță un cont inventat',cont:CONT_MATEI,

/* „Acum la calculatorul din laborator”: fișa profesorului (zece parole + un profil fals), făcută cu python-pptx
   (_proba/fa_fisa.py), deschisă și verificată în PowerPoint-ul real (_proba/probe_ppt.py); metadate curățate. */
const DESCARCA='<a class="descarca" href="fisa-parole-si-profil.pptx" download>⬇ fisa-parole-si-profil.pptx</a>';
const RASP_PAROLE=`<details class="verif"><summary>Verifică-te: parolele</summary><div><table><tr><th>Parola</th><th>Puternică?</th></tr>
<tr><td>soare</td><td>nu: scurtă, doar litere mici</td></tr><tr><td>Cana8#Pod!Vulpe</td><td>da: 15 caractere, amestec</td></tr>
<tr><td>darius2013</td><td>nu: un nume și un an</td></tr><tr><td>123456789</td><td>nu: cifre la rând</td></tr>
<tr><td>Ceas3?Lup#Fereastra</td><td>da: 19 caractere, amestec</td></tr><tr><td>Mo7!</td><td>nu: prea scurtă</td></tr>
<tr><td>bicicletarosiecuclopotel</td><td>nu: lungă, dar doar litere mici</td></tr><tr><td>Parola2026!</td><td>nu: prea scurtă (11 caractere); „parola” e un cuvânt obișnuit, iar 2026 e un an</td></tr>
<tr><td>Melc5!Nor?Trompeta</td><td>da: 18 caractere, amestec</td></tr><tr><td>Ploaie9#Cartof!Vis</td><td>da: 18 caractere, amestec</td></tr></table></div></details>`;
const RASP_PROFIL=`<details class="verif"><summary>Verifică-te: semnele</summary><div><ol>
<li>contul e nou (făcut acum 2 zile);</li><li>foarte puține poze și prieteni (o poză, un prieten);</li><li>te laudă mult („Ești cel mai deștept din joc!”);</li>
<li>îți promite un premiu (o tabletă);</li><li>îți cere date personale (adresa) și parola;</li><li>îți cere să păstrezi secretul față de părinți.</li></ol>
<p>„Îmi plac jocurile cu mașini” nu e un semn.</p></div></details>`;
const PASI_REAL=[
  `Descarcă fișa: ${DESCARCA}. Deschide fișierul descărcat (clic pe el, în lista de descărcări a browserului): se deschide în PowerPoint.`,
  'Dacă sus apare o bară galbenă, <b>Vizualizare protejată (Protected View)</b>, apasă pe ea butonul <b>Activare editare (Enable Editing)</b>. Fără el nu poți scrie nimic.',
  `Clic pe miniatura diapozitivului 2, în stânga: „Zece parole inventate”. În tabel, clic în căsuța goală din dreapta fiecărei parole și scrie <b>da</b> (e puternică) sau <b>nu</b>. Judecă după pasul „Parola puternică”: cel puțin 15 caractere, amestec de litere mari, litere mici, cifre și simboluri, nimic ușor de ghicit. Când ai terminat tabelul, deschide „Verifică-te” de mai jos și compară.${RASP_PAROLE}`,
  `Clic pe miniatura diapozitivului 3: profilul inventat „Tudor_Pro13” și mesajul lui. În dreapta e un substituent gol, cu un text gri care te invită să faci clic și să adaugi text (în PowerPoint în engleză: <i>Click to add text</i>). Clic în el și scrie, câte unul pe rând, semnele de profil fals pe care le găsești (<kbd>Enter</kbd> între rânduri). Apoi deschide „Verifică-te” de mai jos și compară.${RASP_PROFIL}`,
  'Apasă <kbd>F5</kbd> și treci prin diapozitive cu <kbd>→</kbd>. Ieși cu <kbd>Esc</kbd>.',
  'Închide PowerPoint cu ✕ din colțul din dreapta sus. La întrebarea <i>Save your changes to this file?</i> apasă <b>Nu salvați (Don\'t Save)</b>: calculatorul e comun, iar fișa rămâne curată pentru colegul care vine după tine.',
  'Înapoi în browser, pe pagina asta. Dacă ai spus cine ești, jos pe pagină e eticheta cu numele tău și cu butonul roșu <b>Ieși</b>. Atinge eticheta: se deschide meniul cu <b>Ieși (deconectare)</b> și <b>Închide</b>. Acum apasă <b>Închide</b>: meniul se închide și rămâi pe numele tău. Lecția nu s-a terminat: apasă <b>La verificare →</b>, jos pe pagină, și răspunde la cele 5 întrebări. La sfârșitul orei, când pleci de la calculator, alegi <b>Ieși (deconectare)</b>.'
];

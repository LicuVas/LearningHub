<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formatarea textului, a obiectelor și a diapozitivelor</title>
<meta name="description" content="Lecția 6, clasa a VI-a (TIC): formatezi o prezentare PowerPoint ca să se citească din ultima bancă — mărimea, aldinul și culoarea literelor, umplerea și conturul unei forme, fundalul unui diapozitiv și tema tuturor. Cu PowerPoint simulat în pagină și o prezentare de lucru pentru PowerPoint-ul adevărat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Lexend:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EFF1F4; --paper:#FFFFFF; --paper2:#F4F6F9; --line:#D9DEE6;
  --ink:#1B2230; --ink2:#566074; --accent:#1F5FA8; --accentInk:#FFFFFF; --sel:#DCE8F7;
  --mark:#FFE08A; --markInk:#1B2230; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Bricolage Grotesque",Georgia,serif; --fb:"Lexend","Segoe UI",system-ui,sans-serif; --fm:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#12161D; --paper:#1B212B; --paper2:#222A36; --line:#344052;
  --ink:#E9EEF5; --ink2:#AAB6C7; --accent:#8CB8F2; --accentInk:#12161D; --sel:#23364F;
  --mark:#F2C94C; --markInk:#1B2230; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#12161D; --paper:#1B212B; --paper2:#222A36; --line:#344052;
  --ink:#E9EEF5; --ink2:#AAB6C7; --accent:#8CB8F2; --accentInk:#12161D; --sel:#23364F;
  --mark:#F2C94C; --markInk:#1B2230; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: miniaturi de diapozitive cu fundaluri și litere formatate — doar CSS */
.banda{display:flex;gap:7px;padding:6px 12px;min-height:36px;align-items:center}
.banda span{flex:0 0 auto;width:38px;height:22px;border:1px solid var(--ink2);border-radius:2px;opacity:.8;
  background:linear-gradient(var(--ink2),var(--ink2)) 5px 5px/20px 3px no-repeat,linear-gradient(var(--line),var(--line)) 5px 11px/26px 2px no-repeat,var(--paper)}
.banda .inch{background:linear-gradient(#fff,#fff) 5px 5px/20px 3px no-repeat,linear-gradient(#9CB3D6,#9CB3D6) 5px 11px/26px 2px no-repeat,#16335F}
.banda .gros{background:linear-gradient(var(--accent),var(--accent)) 5px 4px/26px 5px no-repeat,linear-gradient(var(--line),var(--line)) 5px 12px/20px 2px no-repeat,var(--paper)}
.banda .forma{background:radial-gradient(circle at 70% 55%,#FFC000 0 5px,#BF9000 5px 6px,transparent 6px),linear-gradient(var(--ink2),var(--ink2)) 5px 5px/16px 3px no-repeat,var(--paper)}
h1{font-size:clamp(1.7rem,7vw,3rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:750}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.ingusta img{max-width:300px}
figure.captura.mica img{max-width:280px}
.reading ol li,.reading ul li{margin:.2em 0}
.descarca{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/ui-panglica.js"></script>
<script src="../../../jocuri/_motor/panglica-powerpoint.js"></script>
<script src="../../_sim/simppt.js"></script>
<script src="../../_sim/simppt-formatare.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M1 · nr. 6 — „Formatarea textului, a obiectelor și a diapozitivelor”.
   Simulatorul: lectii/_sim/simppt.js (SimPPT, comun clasei a VI-a) + lectii/_sim/simppt-formatare.js (formatarea).
   Aici stau doar prezentările de lucru ale lecției. Faptele despre PowerPoint sunt probate în PowerPoint-ul real
   (afirmatii.json, _proba/: probe_com, probe_teme, probe_ui, fa_pptx).
   ====================================================================================================== */
const SF=SimPPTFormatare, P=SF.pas, DP=SF.diap;
const FX=(s,fx)=>Object.assign(s,{fx});
const ROSU={rgb:'#FF0000'},GALBEN={rgb:'#FFFF00'},BLEUMARIN={rgb:'#002060'},PORTOCALIU={rgb:'#FFC000'},VERDE={rgb:'#00B050'};
const ALB={t:'bg1',v:0},NEGRU={t:'tx1',v:0};
const SAGEATA=(x,y)=>({tip:'forma',forma:'arrowR',x,y,w:15.6,h:14.8});
SF.prezentari({
  /* pasul 1: mărimea și aldinul */
  l6_p1:()=>[DP('d1','title',{titlu:'Ziua școlii',sub:'Clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Programul',c1:'La ora 10: serbarea\nLa ora 11: expoziția de desene\nLa ora 12: concursul de șah'}),{ph:{c1:{pt:14}}})],
  l6_p1b:()=>[DP('d1','title',{titlu:'Concursul de desen',sub:'Premii pentru toate clasele'}),DP('d2','to',{titlu:'Regulamentul'})],
  /* pasul 2: culoarea și contrastul */
  l6_p2:()=>[DP('d1','to',{titlu:'Reguli la ora de TIC'},[{tip:'caseta',x:6.9,y:30,pt:28,txt:'Nu mâncăm lângă calculator.\nSalvăm des ce lucrăm.',fx:{cul:GALBEN}}])],
  l6_p2b:()=>[FX(DP('d1','to',{titlu:'Noaptea în pădure'}),{bg:{cul:BLEUMARIN}}),DP('d2','to',{titlu:'Bufnița'})],
  /* pasul 3: umplerea și conturul */
  l6_p3:()=>[DP('d1','to',{titlu:'Harta comorii'},[{tip:'forma',forma:'star5',x:60,y:40,w:15,h:26.7},SAGEATA(20,55)])],
  l6_p3b:()=>[DP('d1','to',{titlu:'Soarele, prin fereastră'},[{tip:'imagine',fis:'soare.png',x:37,y:30,w:26,h:46.3},{tip:'forma',forma:'rect',x:33,y:27,w:34,h:52}])],
  /* pasul 4: fundalul */
  l6_p4:()=>[DP('d1','title',{titlu:'Animale de la munte',sub:'Clasa a VI-a'}),DP('d2','to',{titlu:'Ursul'}),DP('d3','to',{titlu:'Capra neagră'})],
  l6_p4b:()=>[DP('d1','title',{titlu:'Grădina școlii',sub:'Clasa a VI-a'}),DP('d2','to',{titlu:'Ce plantăm'}),DP('d3','to',{titlu:'Cine udă florile'})],
  /* pasul 5: tema */
  l6_p5:()=>[DP('d1','title',{titlu:'Orașul meu',sub:'Clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Ce vizitez',c1:'Muzeul\nParcul central\nTurnul cu ceas'}),{ph:{titlu:{pt:40,cul:ROSU}}}),
    DP('d3','to',{titlu:'Harta orașului'},[{tip:'forma',forma:'star5',x:73,y:55,w:9.4,h:15.7}])],
  /* atelierul = prezentarea de lucru descărcabilă (excursia-de-formatat.pptx, făcută prin COM: _proba/fa_pptx.py) */
  l6_atelier:()=>[DP('d1','title',{titlu:'Excursia la munte',sub:'Clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Traseul',c1:'Plecăm de la școală la ora 8\nUrcăm până la cabană\nCoborâm la ora 17'}),{ph:{c1:{pt:14}}}),
    DP('d3','to',{titlu:'Ce punem în rucsac'},[{tip:'caseta',x:6.9,y:30,pt:24,txt:'Apă, sandvișuri\no geacă de ploaie',fx:{cul:GALBEN}},SAGEATA(60,55)]),
    FX(DP('d4','tc',{titlu:'Ce am învățat',c1:'Mergem mereu în grup\nNu lăsăm gunoaie pe munte'}),{ph:{c1:{pt:32}}})],
  /* verificarea (variante-soră, alte date) */
  l6_v1:()=>[DP('d1','tc',{titlu:'Toamna',c1:'Frunzele cad încet\nVântul bate rece'})],
  l6_v3:()=>[DP('d1','to',{titlu:'Semaforul'},[{tip:'forma',forma:'oval',x:45,y:40,w:10,h:17.8}])],
  l6_v4:()=>[DP('d1','title',{titlu:'Anotimpurile',sub:'Clasa a VI-a'}),DP('d2','to',{titlu:'Primăvara'}),DP('d3','to',{titlu:'Vara'}),DP('d4','to',{titlu:'Toamna'})]
});

/* ---------------- lecția ---------------- */
const IMG={'indicatoare':[460,553],'tema-inainte-dupa':[1000,450],'fundal-un-diapozitiv':[1000,230]};
const JOC={'marime-culoare-text':[276,246],'contrast-inainte-dupa':[685,834],'umplere-contur-butoane':[640,125],'umplere-contur':[700,660],'fundal-proiectare':[322,726]};
const fig=(f,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m1-l06/img/${f}.webp" target="_blank"><img src="../m1-l06/img/${f}.webp" alt="${alt}" width="${IMG[f][0]}" height="${IMG[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const figJ=(f,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../../../jocuri/prezentari-vi/img/${f}.webp" target="_blank"><img src="../../../jocuri/prezentari-vi/img/${f}.webp" alt="${alt}" width="${JOC[f][0]}" height="${JOC[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CONT='Formatarea textului, obiectelor, diapozitivelor';
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. Ca să formatezi tot textul unei casete: clic în text, apoi clic pe chenarul punctat (sau butonul <b>Esc</b> de sub fereastră), până chenarul devine linie plină. Săgeata ▾ de lângă un buton deschide lista lui. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_INTRO=`<p>Mai jos e un <strong>PowerPoint simulat</strong>, cu panglica în engleză, ca pe unele calculatoare din laborator (pe altele PowerPoint e în română; numele românești le ai în pași). Lucrează în fereastră: <strong>testele se bifează singure</strong>, apoi apeși <b>Verifică</b>.</p>
<ul><li><b>Tot textul unei casete:</b> clic în text, apoi clic pe chenarul punctat, până devine linie plină. Pe telefon: atingi textul, apoi butonul <b>Esc</b> de sub fereastră.</li>
<li><b>Listele</b> (mărimi, culori, grosimi): apeși săgeata ▾ de lângă buton. Numele unei culori apare sub listă când ții mouse-ul pe ea; pe telefon, după ce o alegi, în mesajul de sub fereastră.</li>
<li><b>Panoul Format Background</b> (Formatare fundal) apare sub panglică; în PowerPoint stă în dreapta ferestrei.</li>
<li>Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (și ca buton sub fereastră) anulează ultimul pas, inclusiv o formatare.</li></ul>`;
const T_CONTRAST=(d,tinta)=>Object.assign({k:'fmtText',d,contrastMin:4.5},typeof tinta==='string'?{ph:tinta}:{o:tinta});
const CASETA={tip:'caseta'},SAG={tip:'forma',forma:'arrowR'};

const LECTIA={
 t:'Formatarea textului, a obiectelor și a diapozitivelor',lectii:[6],continuturi:[CONT],final:true,
 obiectiv:'faci o prezentare să se citească din ultima bancă: schimbi mărimea, grosimea și culoarea literelor, umplerea și conturul unei forme, fundalul unui diapozitiv și tema tuturor diapozitivelor.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>În lecțiile 4 și 5 ai pus în prezentare texte, imagini și forme. Acum le faci să se vadă bine. <mark>Formatarea</mark> schimbă <strong>cum arată</strong> ceva, nu ce scrie: mărimea și culoarea literelor, culoarea unei forme, fundalul.</p>
<p>Indicatoarele din poză au litere mari și groase, negre pe alb sau albe pe roșu: le citești de departe. Așa trebuie să se vadă și diapozitivul tău din ultima bancă.</p>
${fig('indicatoare','Un stâlp cu cinci indicatoare de direcție dintr-un oraș din România: patru albe cu litere negre groase și unul roșu cu litere albe, fiecare cu o săgeată','Litere mari, groase, foarte diferite de fundal. Foto: Andrei Stroe (decupată), <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>, <a href="https://commons.wikimedia.org/wiki/File:RO_OT_Slatina_road_sign.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.','ingusta')}
<p class="nevoie"><b>Ai nevoie de:</b> lecțiile 2-5: panglica, salvarea (Salvare ca), substituenții, casetele de text, formele; întâi alegi, apoi dai comanda; <kbd>Ctrl</kbd>+<kbd>Z</kbd>.</p>`},
  /* ---------- pasul 1: toată caseta, mărimea, aldinul ---------- */
  {t:'Alegi toată caseta, apoi mărimea și aldinul',
   text:`<p>Formatarea se pune pe ce e <strong>ales</strong>. Ca să schimbi <strong>tot</strong> textul unei casete:</p>
<ol><li>clic în text: apar chenarul punctat și cursorul;</li><li>clic pe chenarul punctat (sau tasta <kbd>Esc</kbd>, stânga sus): chenarul devine <strong>linie plină</strong>.</li></ol>
<p>Apoi, pe <strong>Pornire (Home)</strong>, grupul <strong>Font</strong>: în caseta <mark>Dimensiune font (Font Size)</mark> alegi un număr din listă sau îl scrii și apeși <kbd>Enter</kbd>. Numărul mai mare înseamnă litere mai mari. Butonul <strong>B</strong>, <mark>Aldin (Bold)</mark>, îngroașă literele. Lângă el: <strong>I</strong>, Cursiv (Italic), litere aplecate, și <strong>U</strong>, Subliniat (Underline).</p>
${figJ('marime-culoare-text','Două decupaje din fila Home a PowerPoint: caseta Font Size, în care scrie 40, încadrată cu roșu, și butonul A cu bară roșie dedesubt, tot încadrat','Pornire (Home): caseta <b>Dimensiune font (Font Size)</b>, aici 40. Dedesubt, butonul pentru culoare, din pasul 2.','mica')}`,
   exemplu:`<p>Pe „Programul”, rândurile au 14: din spate nu se văd.</p>
<ol><li>clic în rânduri, apoi clic pe chenar (linie plină);</li><li><b>Font Size</b> ▾ → <b>32</b>;</li><li>clic în titlu, clic pe chenarul lui, apoi <b>B</b>.</li></ol>
<p>Pentru o clasă, textul să aibă cel puțin 24, iar titlul să fie mai mare decât textul.</p>`,
   altfel:`<p>Chenarul punctat înseamnă „scriu în casetă”, ca atunci când ții creionul pe foaie. Chenarul plin înseamnă „am luat toată foaia în mână”: ce faci acum se întâmplă cu toată foaia, adică cu tot textul din casetă.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Pe diapozitivul „Programul”, rândurile de sub titlu au mărimea 14. Fă-le de <b>32</b>. Apoi fă titlul <b>aldin (Bold)</b>.',start:{deck:'l6_p1',cur:1},
     teste:[{ce:'Rândurile de sub titlul „Programul” au mărimea 32',c:[{k:'fmtText',d:'Programul',ph:'c1',pt:32}],ajutor:'Clic în rânduri, clic pe chenar (linie plină), apoi Font Size ▾ → 32.'},
       {ce:'Titlul „Programul” e aldin (Bold)',c:[{k:'fmtText',d:'Programul',ph:'titlu',b:true}],ajutor:'Clic în titlu, clic pe chenar, apoi B.'}],
     rez:[P.text(2,'c1',{pt:32}),P.text(2,'titlu',{b:true})],gresit:[P.text(2,'c1',{pt:24}),P.text(2,'titlu',{b:true})],
     rezText:'clic în rânduri → clic pe chenar → Font Size ▾ → 32; clic în titlu → clic pe chenar → B',ajutor:'Întâi toată caseta aleasă (chenar plin), apoi comanda.',
     why:'Ai ales toată caseta (chenar plin), apoi ai dat comanda: mărimea s-a pus pe toate rândurile deodată, aldinul pe tot titlul.'},
   inca:[
    {t:'ppt',q:SIM_SCURT+'Fă titlul „Concursul de desen” de <b>54</b>. Îl poți alege din listă sau îl poți scrie în casetă și apăsa Enter.',start:{deck:'l6_p1b',cur:0},
     teste:[{ce:'Titlul „Concursul de desen” are mărimea 54',c:[{k:'fmtText',d:'Concursul de desen',ph:'titlu',pt:54}],ajutor:'Clic în titlu, clic pe chenar, apoi Font Size ▾ → 54.'}],
     rez:[P.text(1,'titlu',{pt:54})],gresit:[P.text(1,'titlu',{pt:44})],
     rezText:'clic în titlu → clic pe chenar → Font Size ▾ → 54',ajutor:'Caseta Font Size e pe Pornire (Home), grupul Font.',
     why:'Mărimea se pune pe toată caseta aleasă: titlul întreg are acum 54.'}
   ]},
  /* ---------- pasul 2: culoarea și contrastul ---------- */
  {t:'Culoarea literelor: să se vadă pe fundal',
   text:`<p>Culoarea literelor o schimbi pe <strong>Pornire (Home)</strong> › Font, cu <mark>Culoare font (Font Color)</mark>: litera A cu o bară colorată sub ea. Apeși <strong>săgeata ▾</strong> de lângă A și alegi: sus sunt <strong>Theme Colors</strong> (Culori temă), despre care afli în pasul 5, jos <strong>Standard Colors</strong> (Culori standard). Numele culorii apare când ții mouse-ul pe ea.</p>
<p>Alege culoarea după fundal. <mark>Contrastul</mark> e diferența de luminozitate dintre text și fundal. Se citește bine <strong>text închis pe fundal deschis</strong> sau <strong>text deschis pe fundal închis</strong>. Galben pe alb sau negru pe bleumarin (albastru închis) nu se văd.</p>
${figJ('contrast-inainte-dupa','Același diapozitiv Sistemul solar de două ori: sus cu titlu galben pe alb și text gri mic, abia vizibil, jos cu text alb pe fundal bleumarin și litere mari','Sus: galben și gri pe alb, litere mici. Jos: alb pe bleumarin, litere mari.','mica')}`,
   exemplu:`<p>În caseta „Reguli”, literele galbene pe alb aproape nu se văd:</p>
<ol><li>clic în text, apoi clic pe chenar (linie plină);</li><li>săgeata ▾ de lângă A → <b>Dark Blue</b> (albastru închis), din Standard Colors.</li></ol>
<p>Dacă apeși chiar pe litera A, se pune culoarea din bara ei (la început, roșu). Ca să alegi tu, apeși săgeata ▾.</p>`,
   altfel:`<p>Gândește-te la tabla din clasă: creta albă pe tabla verde-închis se vede din ultima bancă. Un creion galben pe o foaie albă aproape nu se vede. Contează cât de diferite sunt textul și fundalul, nu cât de frumoasă e culoarea.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Textul galben din casetă nu se vede pe fundalul alb. Alege tu, din Font Color ▾, o culoare cu care tot textul casetei să se citească bine.',start:{deck:'l6_p2',cur:0},
     teste:[{ce:'Textul casetei se citește pe fundalul alb: e o culoare închisă (contrast mare)',c:[T_CONTRAST(1,CASETA)],ajutor:'Pe fundal deschis: text închis, de exemplu negru, Dark Blue (albastru închis) sau Purple (mov). Roșul, portocaliul și verdele deschis sunt prea luminoase.'}],
     rez:[P.text(1,CASETA,{cul:BLEUMARIN})],gresit:[P.text(1,CASETA,{cul:PORTOCALIU})],
     rezText:'clic în text → clic pe chenar → Font Color ▾ → Dark Blue (sau altă culoare închisă)',ajutor:'Fundalul e deschis. Ce fel de text se citește pe el?',
     why:'Pe fundal deschis ai ales o culoare închisă: diferența de luminozitate e mare, deci textul se citește și de departe.'},
   inca:[
    {t:'ppt',q:SIM_SCURT+'Pe diapozitivul „Noaptea în pădure”, fundalul e bleumarin, iar titlul negru abia se vede. Fă tot titlul să se citească.',start:{deck:'l6_p2b',cur:0},
     teste:[{ce:'Titlul „Noaptea în pădure” se citește pe fundalul bleumarin (contrast mare)',c:[T_CONTRAST(1,'titlu')],ajutor:'Pe fundal închis: text deschis, de exemplu alb (pătrățelul alb din Culori temă / Theme Colors) sau galben (Yellow).'}],
     rez:[P.text(1,'titlu',{cul:ALB})],gresit:[P.text(1,'titlu',{cul:{rgb:'#7030A0'}})],
     rezText:'clic în titlu → clic pe chenar → Font Color ▾ → alb (pătrățelul alb din Culori temă / Theme Colors)',ajutor:'Fundalul e închis. Ce fel de text se citește pe el?',
     why:'Pe fundal închis ai pus text deschis: contrastul e mare, titlul se vede.'}
   ]},
  /* ---------- pasul 3: umplerea și conturul ---------- */
  {t:'O formă: umplerea și conturul',
   text:`<p>O formă (stea, săgeată, dreptunghi) are două părți de colorat:</p>
<ul><li><mark>umplerea</mark>, culoarea din interior: butonul <strong>Umplere formă (Shape Fill)</strong>;</li><li><mark>conturul</mark>, linia de pe margine: butonul <strong>Contur formă (Shape Outline)</strong>. În lista lui alegi și grosimea liniei: <strong>Weight</strong> (Grosime), în puncte (pt).</li></ul>
<p>Le găsești pe <strong>Pornire (Home)</strong>, în grupul <strong>Drawing</strong> (Desen). Sunt gri până alegi o formă. Tot ele sunt și pe fila <strong>Shape Format</strong> (Format formă), care apare singură cât e aleasă forma. <strong>No Fill</strong> (Fără umplere) lasă să se vadă ce e în spatele formei. <strong>No Outline</strong> (Fără contur) scoate marginea.</p>
${figJ('umplere-contur-butoane','Grupul Drawing din fila Home a PowerPoint, cu butoanele Shape Fill și Shape Outline încadrate și etichetate umplere și contur','Pornire (Home), grupul <b>Drawing</b>: <b>Shape Fill</b> și <b>Shape Outline</b>.')}`,

  /* ---------- pasul 4: fundalul ---------- */
  {t:'Fundalul unui diapozitiv',
   text:`<p>Fundalul ține de <strong>diapozitiv</strong>, nu de un obiect. Clic dreapta pe miniatura lui → <strong>Format Background...</strong> (Formatare fundal). Sau: <strong>Proiectare (Design)</strong> → <strong>Background Styles</strong> (Stiluri de fundal) ▾ → Format Background...; pe unele calculatoare, Format Background e chiar un buton pe fila Design. În panou alegi <strong>Solid fill</strong> (Umplere solidă), apoi culoarea de la <strong>Culoare (Color)</strong> ▾.</p>
<p>Culoarea se pune <strong>doar pe diapozitivul ales</strong>. <mark>Apply to All</mark> (Aplicare la toate), jos în panou, o pune pe toate. <strong>Reset Background</strong> (Resetare fundal) pune înapoi fundalul temei. Pe fundal închis, fă textul deschis (pasul 2).</p>
${figJ('fundal-proiectare','Patru decupaje din PowerPoint, unul sub altul: fila Design, butonul Background Styles, comanda Format Background din lista lui și panoul Format Background cu Solid fill și Color încadrate','Drumul: <b>Design</b> → <b>Background Styles</b> → <b>Format Background...</b> → <b>Solid fill</b> → <b>Color</b>.','mica')}`,
   exemplu:`<p>Ana vrea doar diapozitivul „Ursul” pe bleumarin:</p>
<ol><li>clic dreapta pe miniatura „Ursul” → Format Background...;</li><li>Solid fill → Color ▾ → <b>Dark Blue</b>;</li><li>titlul negru nu se mai vede: clic în el, clic pe chenar, Font Color ▾ → alb (pătrățelul alb din Culori temă / Theme Colors).</li></ol>
${fig('fundal-un-diapozitiv','Trei diapozitive desenate de PowerPoint: primul și al treilea albe, al doilea, Ursul, cu fundal albastru închis și titlu alb','Desenat de PowerPoint: fundal <b>Dark Blue</b> doar pe al doilea diapozitiv, cu titlul făcut alb.')}`,
   altfel:`<p>Fundalul e ca hârtia pe care scrii: poți lua o foaie colorată doar pentru o pagină sau poți pune același fel de hârtie la toate paginile. Textul și desenele stau deasupra hârtiei.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Pune fundal <b>Dark Blue</b> (albastru închis) <b>doar</b> pe diapozitivul „Ursul”, apoi fă titlul lui alb, ca să se citească.',start:{deck:'l6_p4',cur:0},
     teste:[{ce:'„Ursul” are fundal Dark Blue',c:[{k:'fmtFundal',d:'Ursul',cul:'#002060'}],ajutor:'Clic dreapta pe miniatura „Ursul” → Format Background... (sau Design → Background Styles ▾ → Format Background...) → Solid fill → Color ▾ → Dark Blue.'},
       {ce:'Celelalte diapozitive au rămas cu fundalul lor (albe)',c:[{k:'fmtFaraFundal',except:['Ursul']}],ajutor:'Un alt diapozitiv are acum altă culoare. Clic pe miniatura lui, apoi în panou Reset Background (Resetare fundal); sau Ctrl+Z.'},
       {ce:'Titlul „Ursul” e alb',c:[{k:'fmtText',d:'Ursul',ph:'titlu',cul:'#FFFFFF'}],ajutor:'Clic în titlu, clic pe chenar, Font Color ▾ → alb (pătrățelul alb din Culori temă / Theme Colors).'}],

     rezText:'clic dreapta pe miniatura „Ursul” → Format Background... → Solid fill → Color ▾ → Dark Blue; titlul → Font Color ▾ → alb',ajutor:'Fundalul se pune pe diapozitivul ales. Apply to All îl pune pe toate.',

   inca:[
    {t:'ppt',q:SIM_SCURT+'Pune același fundal, <b>Light Green</b> (verde deschis), pe <b>toate</b> diapozitivele, dintr-o dată.',start:{deck:'l6_p4b',cur:0},

  /* ---------- pasul 5: tema ---------- */
  {t:'Tema: toate diapozitivele deodată',
   text:`<p>O <mark>temă</mark> e un pachet gata făcut: fundal, fonturi (forma literelor), culori, locul titlurilor. O alegi pe <strong>Proiectare (Design)</strong>, în galeria <strong>Teme (Themes)</strong>, șirul de pătrățele cu teme: un clic pe una și se schimbă <strong>toate</strong> diapozitivele. Săgeata ▾ din dreapta galeriei le arată pe toate.</p>
<p>Ce ai pus tu rămâne: o mărime nouă, aldinul, o culoare din Culori standard, fundalul pus de tine. Se schimbă odată cu tema: culorile din <strong>Culori temă (Theme Colors)</strong> (albul poate deveni negru) și mărimea pusă chiar egală cu cea dată singur de PowerPoint (28 la rânduri). De aceea pui <strong>întâi tema</strong>, apoi culorile și mărimile.</p>
${fig('tema-inainte-dupa','Trei diapozitive desenate de PowerPoint, de două ori: sus albe, în tema Office Theme, jos pe fundal verde-albastru închis, în tema Ion; titlul roșu de pe al doilea a rămas roșu','Desenat de PowerPoint: înainte și după un clic pe tema <b>Ion</b>.')}`,
   exemplu:`<p>În poza de sus, titlul „Ce vizitez” are culoarea Red (din Culori standard) și mărimea 40. După tema Ion a rămas roșu și de 40; s-au schimbat fontul și, puțin, locul lui. Pe fundalul închis al temei, roșul se vede greu, așa că Ana îl face galben (pasul 2).</p>`,
   altfel:`<p>Tema e ca tricoul unei echipe: toți jucătorii primesc deodată același tricou. Numărul pe care și l-a cusut fiecare pe tricou rămâne al lui.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Pune tema <b>Ion</b> pe prezentare: Design → galeria Themes (dacă nu vezi pătrățelul Ion, apasă săgeata ▾ din dreapta galeriei; pe telefon, dacă nu vezi nici săgeata, trage panglica spre stânga). Uită-te la toate miniaturile. Apoi titlul roșu de pe „Ce vizitez” nu se mai vede bine pe fundalul temei: fă-l să se citească.',start:{deck:'l6_p5',cur:0},
     teste:[{ce:'Prezentarea are tema Ion (pe toate diapozitivele)',c:[{k:'fmtTema',nume:'Ion'}],ajutor:'Fila Design → galeria Themes → săgeata ▾ din dreapta ei → Ion.'},

       {ce:'Titlul „Ce vizitez” se citește pe fundalul temei (contrast mare)',c:[{k:'fmtTema',nume:'Ion'},T_CONTRAST('Ce vizitez','titlu')],ajutor:'Fundalul temei Ion e închis: alege pentru titlu o culoare deschisă din Culori standard, de exemplu Yellow (galben).'}],
     rez:[P.tema('Ion'),P.text(2,'titlu',{cul:GALBEN})],gresit:[P.tema('Ion')],
     rezText:'Design → Themes → Ion; titlul „Ce vizitez” → clic pe chenar → Font Color ▾ → Yellow (galben, din Culori standard)',ajutor:'Tema schimbă tot ce e „al ei”; culoarea Red pusă de tine rămâne.',
     why:'Tema a schimbat dintr-un clic fundalul, fonturile și locul titlurilor pe toate diapozitivele. Mărimea 40 a rămas; culoarea roșie pusă de tine rămăsese și ea, dar pe fundalul nou nu se vedea, așa că ai ales o culoare deschisă. Din Culori standard, ea rămâne și la o altă temă.'},
   inca:[
    {t:'choice',q:'Ai o prezentare cu 12 diapozitive. Vrei ca toate să primească alt fundal și alte fonturi, la fel. Ce faci cel mai repede?',
     o:['Alegi o temă, pe Proiectare (Design) → Themes','Schimbi fundalul pe fiecare diapozitiv, pe rând','Faci o prezentare nouă și scrii totul din nou','Alegi Font Color pe fiecare titlu'],ok:0,

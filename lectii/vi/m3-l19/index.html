<script>
/* Lecția 19, clasa a VI-a (M3, predare): „De ce avem nevoie de repetiție. Etapele unui exercițiu algoritmic”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online, în română, fără cont (ca la lecția 18). Faptele despre editor sunt PROBATE în
   editorul viu (Chromium headless, profil temporar, fără cont, 24.10.2026: _proba\live_scratch.py → live_rezultat.json):
   Load from your computer, „spune Bună!” tras în paletă, Duplică (vin și blocurile de sub el), pătratul, greșeala de probă,
   scările, numele propus la salvare. Simulatorul: lectii/_sim/scratch.js (SimScratch 1.1, lecția 18), doar FOLOSIT.
   Granița: DOAR secvență. NU blocul care repetă (lecția 20; nici numele lui), NU „dacă”, NU variabilele, NU „așteaptă”. */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
/* o stivă de blocuri desenată în text (forma și culorile editorului); se desenează când apare în pagină (ca la lecția 18) */
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));

/* ---- ajutoare pentru teste (pe COMPORTAMENT: programul elevului e rulat de la steag, și dintr-un alt loc de pornire) ---- */
const A = SimScratch.ajutor;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const spuse = U => U.spuse.map(norm);
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const r0 = v => Math.round(v) || 0;
/* unde era pisica la fiecare „spune” (în ordine) */
const spuneri = (U, o) => { let p = [o.x, o.y]; const r = []; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune') r.push([r0(p[0]), r0(p[1])]); } return r; };
const ALTUNDE = {x: -150, y: 60, directie: 0};
const ALT90 = {x: -150, y: 60, directie: 90};   /* pietrele nu au „orientează-te”: pisica privește spre dreapta, ca la lecția 18 */
const PAL = ['steag', 'mergi', 'roteste_dr', 'roteste_st', 'mergi_la_xy', 'orienteaza', 'spune_sec'];
const unScript = P => P.length === 1 && A.cuSteag(P).length === 1 && A.libere(P).length === 0;
const STEAG = {ce: 'Ai apăsat steagul verde', msg: 'Apasă steagul verde, deasupra scenei, și privește pisica.', ok: (U, P, S) => S.apasatSteag};
const LIPIT = {ce: 'Totul e lipit sub blocul galben', msg: 'Un singur program: toate blocurile lipite sub blocul galben. Un grup lăsat deoparte nu se execută.', ok: (U, P) => unScript(P)};

/* ---- programele lecției (aceleași în pași, în simulator și la laborator; probate în Scratch-ul viu, _proba/live_scratch.py) ---- */
const de = (n, grup) => Array.from({length: n}, () => grup.map(b => b.slice())).flat();
const PIETRE = pasi => [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0]].concat(de(4, [['mergi', pasi], ['spune_sec', 'Hop!', 1]]))}];
const PIETRE_GRESIT = [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['mergi', 50], ['spune_sec', 'Hop!', 1], ['mergi', 50], ['spune_sec', 'Hop!', 1], ['mergi', 5], ['spune_sec', 'Hop!', 1], ['mergi', 50], ['spune_sec', 'Hop!', 1]]}];
const INCEPUT = [['steag'], ['mergi_la_xy', 0, 0], ['orienteaza', 90]];
const LATURA = [['mergi', 100], ['spune_sec', 'Colț!', 1], ['roteste_dr', 90]];
const PATRAT = INCEPUT.concat(de(4, LATURA));
const TREAPTA = [['mergi', 40], ['roteste_st', 90], ['mergi', 40], ['roteste_dr', 90]];
const SCARI = INCEPUT.concat(de(3, TREAPTA), [['spune_sec', 'Sus!', 2]]);
const COLTURI = [[100, 0], [100, -100], [0, -100], [0, 0]];
const laColturi = U => eq(spuneri(U, ALTUNDE), COLTURI) && eq(spuse(U), ['colt', 'colt', 'colt', 'colt']);
const laFinal = U => r0(U.x) === 0 && r0(U.y) === 0 && r0(U.directie) === 90;
const PATRAT_TESTE = (indiciu) => [
  LIPIT,
  {ce: '„Colț!” în cele 4 colțuri', o: ALTUNDE, msg: indiciu, ok: laColturi},
  {ce: 'La final: x 0, y 0, Direcția 90', o: ALTUNDE, msg: 'Pătratul nu s-a închis. Citește fiecare grup: mergi 100 pași, spune Colț! pentru 1 secunde, rotește-te ↻ 90 grade.', ok: laFinal},
  STEAG];
const PATRAT_LIPSA = [{x: 14, y: 14, b: INCEPUT.concat(LATURA, [['mergi', 100], ['spune_sec', 'Colț!', 1]], LATURA, LATURA)}];
const PATRAT_9 = [{x: 14, y: 14, b: INCEPUT.concat(LATURA, LATURA, [['mergi', 100], ['spune_sec', 'Colț!', 1], ['roteste_dr', 9]], LATURA)}];

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun.
   Probat viu pe drumul literal (_proba/live_scratch.py, B-H; după judecata 1: _proba/live_r1.py, A-H: „Șterge blocul”
   pe „spune Bună!” scoate doar blocul acela; „orientează-te” lăsat sub „mergi la x 0 y: 0” intră între ele).
   Reparația 2 (judecata 2, _proba/live_r2.py → live_r2.json): copia lăsată chiar sub ultimul bloc, la marginea lui
   stângă (0-20 px sub el, chiar și acoperindu-l puțin) se lipește la capăt; mai jos de ~30 px sau la 40 px spre dreapta
   rămâne separată; urcată peste ultimul bloc intră între blocuri. Proba din punctul 4 se uită la FORMA drumului (copia
   intrată în primul grup dă tot x 0, y 0, Direcția 90, dar drumul e dreapta-dreapta-stânga-stânga); reparația: al
   doilea „mergi 100 pași” (și un grup rămas deoparte) în paletă, primul grup completat ca la punctul 2, punctul 3
   refăcut → pătratul bun (S1-S5).
   Trecerea 4 (judecata 3, S; _proba/live_t4.py → live_t4.json): „orientează-te” care nu e chiar sub „mergi la x 0 y: 0”
   (lăsat la capăt la punctul 1 = S9; prima copie urcată deasupra primului grup = S7) → reparația veche se învârtea în
   cerc; propoziția nouă stă ÎNAINTE de „Altfel” (se verifică întâi, e mai ieftin), spune „primul” (sunt mai multe) și
   „lipește altul ca la punctul 1” (nu „refă punctele 1-3”: punctul 2 refăcut ar putea pune al doilea „rotește-te”).
   Fișierul nou are nume NOU (Patrat_…). ---- */
const LAB = [
  '<b>Etapa 3:</b> fila Scratch s-a închis? Deschide-o și încarcă <code>Pisica_</code>… ca la începutul lecției. În programul de la lecția 18: clic dreapta pe „spune Bună!” › <b>Șterge blocul</b> (pleacă doar el). Sub „mergi la x 0 y: 0” lipește „orientează-te în direcția 90”.',
  'În „spune Am ajuns! pentru 2 secunde” scrie Colț! și 1. Sub el lipește „rotește-te ↻ 15 grade”, cu 90. Ai „mergi 150 pași”? Scrie 100. <b>Proiect nou?</b> Sub „când se dă click pe ⚑” (<b>Evenimente</b>): „mergi la x … y: …” (0 și 0), „orientează-te în direcția 90”, „mergi 10 pași” (100), „spune Salut! pentru 2 secunde” (Colț! și 1), „rotește-te ↻ 15 grade” (90).',
  'Clic dreapta pe „mergi 100 pași” › <b>Duplică</b>. Copia vine după mouse (stă pe loc? trage-o). Las-o chiar sub ultimul „rotește-te”, la marginea lui stângă, fără să-l acopere. Încă o dată, pe primul „mergi 100 pași”: vin două grupuri; la fel. Lipite bine: fără loc gol, de 4 ori mergi, spune, rotește-te.',
  '<b>Etapa 4, proba:</b> steagul: pisica sare în colțurile unui pătrat (dreapta, jos, stânga, sus), cu „Colț!” în fiecare; la final x 0, y 0, Direcția 90. Nu iese? Număr greșit? Scrie-l bine. „orientează-te” nu e chiar sub „mergi la x 0 y: 0”? Trage în paletă primul „orientează-te” (pleacă și ce e sub el), lipește altul ca la punctul 1 și refă punctul 3. Altfel: trage în paletă al doilea „mergi 100 pași” și orice grup deoparte, completează primul grup (mergi, spune, rotește-te) ca la punctul 2 și refă punctul 3. Salvezi doar după o probă reușită.',
  '<b>Etapa 5:</b> pune tu o greșeală: în al treilea „rotește-te”, 80. Steagul: pisica nu mai ajunge la x 0, y 0. Scrie la loc 90 și refă proba.',
  '<b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Te întreabă unde? Folderul tău și, în locul numelui propus, numele NOU: <code>Patrat_</code>, clasa și numele tău (de exemplu <code>Patrat_6A_Popescu</code>), <b>Salvare</b>. Numele există deja? <b>Nu</b> (sau <b>Anulare</b>), adaugă prenumele, <b>Salvare</b>. Sari la punctul 8.',
  'Nu te-a întrebat? Explorer › <b>Descărcări</b> › fișierul de acum (<code>Pisica_</code>… sau <b>Proiect Scratch</b>): <kbd>F2</kbd>, <code>Patrat_</code>, clasa și numele, <kbd>Enter</kbd>; <b>Decupare</b>, folderul tău, <b>Lipire</b>. Există deja? <b>Se omite acest fișier</b>, adaugă prenumele, mută-l din nou.',
  'Închide fila (te întreabă dacă pleci? Pleci). <b>Data viitoare:</b> un bloc nou face singur repetiția.'
];

JocMotor.porneste({
  cheie: 'lectie_vi_m3_l19',
  mod: 'lectie',
  titlu: 'De ce avem nevoie de repetiție. Etapele unui exercițiu algoritmic',
  marca: 'Lecția <b>19</b> · clasa a VI-a',
  h1: 'De ce avem nevoie de repetiție. <span class="acc">Etapele unui exercițiu algoritmic</span>',
  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a VI-a',
  unitate: 'VI-U3',
  unitateTitlu: 'Algoritmi: structuri repetitive',
  competente: ['CS.2.2', 'CS.2.1', 'CS.2.3'],
  lectii: '19',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a VI-a · unitatea VI-U3 „Algoritmi: structuri repetitive” · lecția 19, predare · conținutul „Etapele unui exercițiu algoritmic utilizând aplicația aleasă”; CS.2.2 „Aplicarea etapelor de rezolvare pentru cerințe simple, corespunzătoare unor situații familiare”, CS.2.1 (mediul grafic-interactiv: Scratch 3), CS.2.3 („construirea, pentru o cerință dată, a unui algoritm ce utilizează în mod repetat o secvență de prelucrare”). Activitatea profesorului: un algoritm fără repetiție pentru o sarcină care se repetă, din care elevii constată singuri problema.',
  intro: '<p><b>Ai nevoie de:</b> lecția 17 (algoritmul, finitudinea, cele patru etape); lecția 18 (Scratch: tragi și lipești blocuri, steagul, „mergi la x 0 y: 0”, salvarea .sb3, Load from your computer); Explorer: Redenumire, Decupare, Lipire.</p>',
  cum: '<b>Cum lucrezi:</b> „Încă un exercițiu” e pentru cine termină repede.',
  banda: '<span class="nr">1</span><span class="bk mv">mergi 100 pași</span><span class="bk lk">spune Colț!</span><span class="bk mv">rotește-te ↻ 90</span><span class="nr">2</span><span class="bk mv">mergi 100 pași</span><span class="bk lk">spune Colț!</span><span class="bk mv">rotește-te ↻ 90</span><span class="nr">3</span><span class="bk mv">mergi 100 pași</span>',
  nivele: [
{t: 'De ce avem nevoie de repetiție. Etapele unui exercițiu algoritmic', final: true, lectii: [19],
 continuturi: ['Etapele unui exercițiu algoritmic utilizând aplicația aleasă'],
 obiectiv: 'găsești ce se repetă într-un program lung și de câte ori, faci copiile cu Duplică și rezolvi un exercițiu în Scratch pe etape: cerința, algoritmul, construiești, proba, corectezi.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: același pas, de mai multe ori',
   text: `<p>Când treci un pârâu pe pietre, faci același pas de mai multe ori. Antrenorul nu-ți spune de 20 de ori „Fă o genuflexiune”, ci o dată: „Fă 20 de genuflexiuni”.</p>
<p>Când aceiași pași se fac de mai multe ori, avem o <mark>repetiție</mark>. Azi o spunem ca antrenorul: pașii o dată și de câte ori se fac.</p>
${fig('pietre-parau.webp', 560, 375, 'Un pârâu de munte, iarna, traversat de un șir de pietre de călcat, la fel de mari și la distanțe egale', 'Pietre la fel, același pas. <small>Foto: Sudzie, <a href="https://commons.wikimedia.org/wiki/File:Stepping_Stones_Gibsons_Mill_Heptonstall.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0; micșorată.</small>')}`},
  /* ---- pasul 1: programul lung (fără repetiție): lung, greu de schimbat, ușor de greșit ---- */
  {t: 'Programul lung: aceleași blocuri, de 4 ori',
   text: `<p>Cerința: pisica trece pârâul pe 4 pietre, la 50 de pași una de alta, și spune „Hop!” pe fiecare.</p>
<p>Programul pune de 4 ori aceleași două blocuri: <span class="blk mv">mergi 50 pași</span> și <span class="blk lk">spune Hop! pentru 1 secunde</span>. Al doilea o ține o secundă pe piatră, ca s-o vezi. La final, pisica e la x 200.</p>
<p>Merge, dar e:</p>
<ul><li><b>lung</b>: 10 blocuri;</li><li><b>greu de schimbat</b>: pietre mai depărtate = 4 numere de schimbat;</li><li><b>ușor de greșit</b>: o copie greșită se vede greu.</li></ul>`,
   exemplu: `${ACUM('Deschide Scratch: <code>scratch.mit.edu</code> › <b>Creează</b>. Meniul e în engleză? <b>Settings</b> › <b>Language</b> › <b>Română</b>. Abia apoi <b>X</b> la filmuleț.','<b>Fișier</b> › <b>Load from your computer</b>; în <b>Deschidere</b>: folderul tău, <code>Pisica_</code>… de la lecția 18, <b>Deschidere</b>. Nu-l găsești? Rămâi în proiectul nou.')}`,
   altfel: `<p>E ca o temă în care scrii de 4 ori aceeași propoziție. Dacă profesorul schimbă un cuvânt, îl schimbi în 4 locuri. Dacă greșești o literă într-un loc, o găsești greu.</p>`,
   incearca: {t: 'scratch', q: 'Pietrele s-au mutat la 60 de pași una de alta. Schimbă programul (clic pe număr, scrii, <kbd>Enter</kbd>; pe telefon atingi numărul), apoi apasă steagul.',
    paleta: PAL,
    program: PIETRE(50),
    teste: [
     {ce: 'Toate cele 4 „mergi … pași” au 60', msg: 'Fiecare piatră e la 60 de pași: în FIECARE „mergi … pași” scrie 60. Sunt 4.', ok: (U, P) => { const v = A.valori(P, 'mergi'); return unScript(P) && v.length === 4 && v.every(x => +x[0] === 60); }},
     {ce: '„Hop!” la x 60, 120, 180 și 240', o: ALT90, msg: 'Pisica pleacă din mijloc (0 și 0) și sare de 4 ori câte 60 de pași.', ok: U => eq(spuneri(U, ALT90), [[60, 0], [120, 0], [180, 0], [240, 0]]) && eq(spuse(U), ['hop', 'hop', 'hop', 'hop'])},
     STEAG],
    solutie: PIETRE(60),
    gresit: [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['mergi', 60], ['spune_sec', 'Hop!', 1], ['mergi', 50], ['spune_sec', 'Hop!', 1], ['mergi', 50], ['spune_sec', 'Hop!', 1], ['mergi', 50], ['spune_sec', 'Hop!', 1]]}],
    ajutor: 'Sunt 4 blocuri „mergi 50 pași”, câte unul pentru fiecare piatră. În fiecare scrii 60.',
    why: 'Ai schimbat același număr în 4 locuri: de aceea programul lung e greu de schimbat.'},
   inca: [
    {t: 'scratch', q: 'Ușor de greșit: pietrele sunt la 50 de pași, dar pisica ajunge la x 155, nu la x 200. O copie e greșită. Găsește-o, corecteaz-o și apasă steagul.',
     paleta: PAL,
     program: PIETRE_GRESIT,
     teste: [
      {ce: 'Toate cele 4 „mergi … pași” au 50', msg: 'Citește numărul din fiecare „mergi … pași”. Unul nu e 50.', ok: (U, P) => { const v = A.valori(P, 'mergi'); return unScript(P) && v.length === 4 && v.every(x => +x[0] === 50); }},
      {ce: '„Hop!” la x 50, 100, 150 și 200', o: ALT90, msg: 'Pe fiecare piatră pisica e cu 50 de pași mai departe.', ok: U => eq(spuneri(U, ALT90), [[50, 0], [100, 0], [150, 0], [200, 0]]) && eq(spuse(U), ['hop', 'hop', 'hop', 'hop'])},
      STEAG],
     solutie: PIETRE(50),
     gresit: PIETRE_GRESIT,
     ajutor: 'Al treilea „mergi” are 5 în loc de 50: 50 + 50 + 5 + 50 = 155.', why: 'O singură cifră lipsă și pisica ajunge în altă parte. Într-un program lung, o asemenea greșeală se ascunde ușor.'}
   ]},
  /* ---- pasul 2: tiparul (ce se repetă, de câte ori) + finitudinea (Duplică s-a mutat la atelier: judecata 1, I) ---- */
  {t: 'Tiparul: ce se repetă și de câte ori',
   text: `<p>Într-un program lung cauți <mark>tiparul</mark>: grupul de blocuri care apare la fel, în aceeași ordine, de mai multe ori. Îl spui în cuvinte: <b>de 4 ori:</b> mergi 50 pași, spune Hop! pentru 1 secunde. Ce e înaintea lui, ca „mergi la x 0 y: 0”, se face o singură dată.</p>
<p>Repetiția de azi spune <b>de câte ori</b>, deci se termină. „La nesfârșit” strică finitudinea (lecția 17).</p>`,
   exemplu: `<p>Pătratul = de 4 ori o latură. <code>↻</code> rotește pisica spre dreapta, <code>↺</code> spre stânga; 90 de grade = un colț.</p>
${fig('patrat-tipar.webp', 263, 510, 'Zona de cod din Scratch cu programul pătratului: sub pălărie, mergi la x 0 y: 0 și orientează-te în direcția 90, apoi patru grupuri la fel, încadrate și numerotate de la 1 la 4: mergi 100 pași, spune Colț! pentru 1 secunde, rotește-te spre dreapta 90 grade', 'Tiparul pătratului, de 4 ori.')}`,
   altfel: `<p>Ca la un cântec: refrenul se cântă de mai multe ori, la fel. Pe foaie îl scrii o dată și notezi „de 3 ori”. Ce cânți o singură dată, la început, nu face parte din refren.</p>`,
   incearca: {t: 'choice', q: `Programul scărilor:${STIVA(SCARI)}Ce se repetă și de câte ori?`,
    o: ['de 3 ori: mergi 40, ↺ 90, mergi 40, ↻ 90', 'de 6 ori: mergi 40, rotește-te 90', 'de 3 ori: mergi 40, ↺ 90, mergi 40, ↻ 90, spune Sus!', 'de 4 ori: mergi 40, ↺ 90, mergi 40, ↻ 90'], ok: 0,
    ajutor: 'Pornește de la primul „mergi 40 pași”. Unde începe din nou același grup? Atenție la săgețile rotirilor și la ce e după ultimul grup.',
    why: 'Grupul mergi, ↺, mergi, ↻ (o treaptă) apare de 3 ori. Rotirile nu sunt la fel, deci nu e „de 6 ori”. „spune Sus!” e o singură dată, la sfârșit, deci nu e în tipar.'},
   inca: [
    {t: 'choice', q: 'Fără repetiție, câte blocuri ar avea programul scărilor cu 10 trepte? (Începutul are 3 blocuri, o treaptă are 4, iar la sfârșit e „spune Sus!”.)', o: ['44', '16', '40', '14'], ok: 0,
     ajutor: 'Începutul + 10 trepte de câte 4 blocuri + ultimul bloc.', why: '3 + 10 × 4 + 1 = 44 de blocuri. Cu 3 trepte erau 16. Cu cât se repetă de mai multe ori, cu atât programul e mai lung.'},
    {t: 'choice', q: 'Care descriere a pătratului e bună într-un algoritm?', o: ['de 4 ori: mergi 100, spune Colț!, ↻ 90', 'la nesfârșit: mergi 100, spune Colț!, ↻ 90', 'de câteva ori: mergi 100, spune Colț!, ↻ 90', 'de 4 ori: mergi cam 100, spune Colț!, ↻ 90'], ok: 0,
     ajutor: 'Pune întrebările de la lecția 17: se înțelege la fel? se termină?', why: '„De 4 ori” spune exact de câte ori și se termină. „La nesfârșit” nu se termină (finitudinea); „de câteva ori” și „cam” nu se înțeleg la fel de toți (claritatea).'}
   ]},
  /* ---- pasul 3: etapele unui exercițiu algoritmic (cuvintele lecției 17 + „construiești”) ---- */
  {t: 'Etapele unui exercițiu algoritmic',
   text: `<p>La lecția 17 ai lucrat în patru etape; în aplicație se adaugă una. <mark>Etapele unui exercițiu algoritmic</mark>, în Scratch:</p>
<ol><li><b>Cerința</b>: ce ai la început și ce trebuie să iasă (unde ajunge pisica, ce spune).</li>
<li><b>Algoritmul</b>: pașii, în cuvinte, în caiet.</li>
<li><b>Construiești</b>: fiecare pas devine un bloc, în aceeași ordine.</li>
<li><b>Proba</b>: apeși steagul și compari ce vezi cu cerința.</li>
<li><b>Corectezi</b> ce nu iese, apoi faci din nou proba.</li></ol>`,
   exemplu: `<p><b>Cerința</b> pătratului: latura 100; „Colț!” în fiecare colț; la final x 0, y 0, Direcția 90.</p>
<p><b>Algoritmul</b>: mergi la x 0 y: 0; orientează-te în direcția 90; de 4 ori: mergi 100 pași, spune Colț! pentru 1 secunde, rotește-te ↻ 90 grade.</p>`,
   altfel: `<p>Ca la o prăjitură după rețetă: citești ce trebuie să iasă, îți notezi pașii, o faci, guști, iar dacă nu e bună, schimbi ce trebuie și guști din nou.</p>`,
   incearca: {t: 'order', q: 'Cerință nouă: pisica urcă 2 trepte de 40 de pași și spune „Sus!”. Pune în ordine ce faci.',
    items: ['Citești cerința: la final x 80, y 80 și spune Sus!', 'Scrii în caiet algoritmul: de 2 ori o treaptă, apoi spune Sus!', 'Lipești blocurile sub „când se dă click pe ⚑”', 'Apeși steagul și compari x și y cu 80', 'Schimbi blocul greșit și apeși iar steagul'],
    ajutor: 'Etapele: cerința, algoritmul, construiești, proba, corectezi.',
    why: 'Nu scrii algoritmul până nu știi ce trebuie să iasă și nu probezi ce n-ai construit.'},
   inca: [
    {t: 'choice', q: 'La pătrat, pisica a spus „Colț!” doar de 3 ori. În ce etapă ești și ce urmează?', o: ['La probă; corectezi, apoi din nou proba', 'La cerință; scrii algoritmul', 'La construit; salvezi proiectul', 'La probă; programul e bun, îl salvezi'], ok: 0,
     ajutor: 'Cerința spune 4 colțuri. Ce faci când proba arată altceva?', why: 'Proba a arătat că programul nu face ce cere cerința, deci corectezi, apoi probezi din nou. Abia după o probă reușită salvezi.'}
   ]},
  /* ---- pasul 4: proba (compari cu cerința, găsești blocul, corectezi un lucru, din nou proba) ---- */
  {t: 'Proba: compari, găsești, corectezi',
   text: `<p>La <mark>probă</mark> compari ce vezi cu cerința: ce spune pisica, unde se oprește și unde ajunge la final. Sub scenă citești x, y și Direcția.</p>
<p>Nu se potrivește? Cauți blocul vinovat: citești blocurile de sus în jos. În pagină, butonul „Pas cu pas (doar aici)” execută câte un bloc și îl încadrează cu roșu pe următorul.</p>
<p>Corectezi un singur lucru, apoi refaci proba.</p>`,
   exemplu: `${fig('proba-colt.webp', 800, 552, 'Editorul Scratch în timpul probei: programul pătratului are contur galben, pisica spune Colț! pe scenă, iar sub scenă x este 100, y este 0 și Direcția 90; balonul, x și y, și Direcția sunt încadrate și numerotate 1, 2, 3', 'Proba în Scratch: 1. balonul, 2. x și y, 3. Direcția. Blocurile care rulează au contur galben.')}`,
   altfel: `<p>E ca la corectarea unui test: compari fiecare răspuns cu ce se cerea. Unde nu se potrivește, cauți rândul greșit, îl repari și verifici din nou.</p>`,
   incearca: {t: 'scratch', q: 'Programul pătratului de mai jos nu trece proba. Fă proba (steagul sau „Pas cu pas”), găsește ce lipsește, corectează, apoi din nou proba.',
    paleta: PAL,
    program: PATRAT_LIPSA,
    teste: PATRAT_TESTE('„Colț!” nu vine exact în cele 4 colțuri ale pătratului. Apasă „Pas cu pas (doar aici)” și urmărește după care bloc pisica o ia pe alt drum.'),
    solutie: [{x: 14, y: 14, b: PATRAT}],
    gresit: PATRAT_LIPSA,
    ajutor: 'Numără blocurile fiecărui grup. Al doilea are doar două: îi lipsește „rotește-te ↻ 90 grade”. Lipește-l sub al doilea „spune Colț!” și scrie în el 90.',
    why: 'Fără rotirea din al doilea colț, pisica mergea mai departe în aceeași direcție. Proba, comparată cu cerința, a arătat unde.'}}
 ],
 atelier: {t: 'scratch', titlu: 'Pătratul, pe etape',
  intro: `<p>Copiile le faci cu <mark>Duplică</mark>: clic dreapta pe primul bloc al grupului (pe telefon: ții degetul pe el) › <b>Duplică</b>. Vine copia lui și a celor de sub el.</p>
${fig('meniu-duplica.webp', 223, 222, 'Clic dreapta pe blocul mergi 100 pași: meniul cu Duplică încadrat, Adaugă comentariu și Șterge blocul', 'Clic dreapta › <b>Duplică</b>.')}
<p><b>Cerința și algoritmul:</b> ca la pasul 3. <strong>Sarcina:</strong> primele 2 grupuri sunt gata. Duplică pe primul „mergi 100 pași”: vin amândouă grupurile; lasă-le sub ultimul bloc și ai 4. Apoi steagul și „Rulează testele”.</p>
<p><b>Pe telefon:</b> după Duplică, copia apare peste partea de jos a programului, puțin la dreapta. Apuc-o de primul ei bloc („mergi 100 pași”) și las-o chiar sub ultimul bloc, la marginea lui stângă.</p>`,
  q: 'Construiește pătratul și fă proba.',
  paleta: PAL,
  program: [{x: 14, y: 14, b: INCEPUT.concat(LATURA, LATURA)}],
  teste: PATRAT_TESTE('Trebuie 4 grupuri la fel: mergi 100 pași, spune Colț! pentru 1 secunde, rotește-te ↻ 90 grade. Duplică pe PRIMUL „mergi 100 pași” (vin amândouă grupurile) și lasă copia sub ultimul bloc.'),
  solutie: [{x: 14, y: 14, b: PATRAT}],
  gresit: [{x: 14, y: 14, b: INCEPUT.concat(LATURA, LATURA, LATURA)}],
  ajutor: 'Clic dreapta pe PRIMUL „mergi 100 pași” (pe telefon: ții degetul pe el) › Duplică: vin amândouă grupurile. Le lași chiar sub ultimul bloc (pe telefon: copia apare peste partea de jos a programului; o apuci de primul ei bloc și o lași sub ultimul, la marginea lui stângă).',
  why: 'Ai construit tiparul de 4 ori și ai verificat cu proba: 4 colțuri, iar la final pisica e de unde a plecat.',
  inca: [
   {t: 'scratch', q: 'Încă unul: scările. Pisica urcă 3 trepte. O treaptă: mergi 40 pași, rotește-te ↺ 90 grade, mergi 40 pași, rotește-te ↻ 90 grade. La sfârșit spune „Sus!” 2 secunde. Construiește o treaptă, celelalte cu Duplică, apoi fă proba.',
    paleta: PAL,
    program: [{x: 14, y: 14, b: INCEPUT.map(b => b.slice())}],
    teste: [
     LIPIT,
     {ce: 'La final: x 120, y 120, Direcția 90', o: ALTUNDE, msg: 'Trei trepte la fel: mergi 40, ↺ 90, mergi 40, ↻ 90. ↺ e rotirea spre stânga.', ok: U => r0(U.x) === 120 && r0(U.y) === 120 && r0(U.directie) === 90},
     {ce: '„Sus!” abia sus, după a treia treaptă', o: ALTUNDE, msg: '„spune Sus! pentru 2 secunde” vine o singură dată, la sfârșit, sub ultima treaptă.', ok: U => eq(spuse(U), ['sus']) && eq(spuneri(U, ALTUNDE), [[120, 120]])},
     STEAG],
    solutie: [{x: 14, y: 14, b: SCARI}],
    gresit: [{x: 14, y: 14, b: INCEPUT.concat(de(3, [['mergi', 40], ['roteste_dr', 90], ['mergi', 40], ['roteste_st', 90]]), [['spune_sec', 'Sus!', 2]])}],
    ajutor: 'Cele două rotiri au săgeți diferite: întâi ↺ (spre stânga, ca să urce), apoi ↻ (din nou spre dreapta).',
    why: 'O treaptă = 4 blocuri, de 3 ori, iar „spune Sus!” o singură dată, la final: 3 × 40 = 120 spre dreapta și 120 în sus.'}
  ]},
 qs: [

  {t: 'choice', q: `Ce se repetă aici și de câte ori?${STIVA([['steag'], ['mergi_la_xy', 0, 0], ['spune_sec', 'Start!', 1]].concat(de(3, [['mergi', 30], ['spune_sec', 'Pas!', 1]])))}`,

 ]}

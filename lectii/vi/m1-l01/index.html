<meta name="description" content="Lecția 1, clasa a VI-a (TIC): ce faci anul acesta (prezentări, Internet în siguranță, algoritmi cu repetiție, animații și 3D), cele trei niveluri De bază, Consolidat, Avansat, cum afli nota unei lucrări din punctaj și nivelul din notă și o evaluare inițială fără note, care îți spune ce să recitești din clasa a V-a.">

<style>
:root{
  --desk:#EEF2EF; --paper:#FFFFFF; --paper2:#F4F7F5; --line:#D3DDD7;
  --ink:#15211C; --ink2:#4F6058; --accent:#0B6B5C; --accentInk:#FFFFFF; --sel:#D4EDE6;
  --mark:#FFE08A; --markInk:#15211C; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Literata",Georgia,serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"Fira Code",Consolas,monospace;
  --p1:#D9692B; --p2:#2F7FCB; --p3:#7B52C7; --p4:#23915E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1614; --paper:#17211E; --paper2:#1E2A26; --line:#2F3D38;
  --ink:#E6EFEB; --ink2:#A9BAB3; --accent:#5FD0BC; --accentInk:#0F1614; --sel:#1F4A41;
  --mark:#F2C94C; --markInk:#15211C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
  --p1:#F0955E; --p2:#6FB0F0; --p3:#AE8CF0; --p4:#5CCB94;
}}
:root[data-theme="dark"]{
  --desk:#0F1614; --paper:#17211E; --paper2:#1E2A26; --line:#2F3D38;
  --ink:#E6EFEB; --ink2:#A9BAB3; --accent:#5FD0BC; --accentInk:#0F1614; --sel:#1F4A41;
  --mark:#F2C94C; --markInk:#15211C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
  --p1:#F0955E; --p2:#6FB0F0; --p3:#AE8CF0; --p4:#5CCB94;
}
/* banda de sus: anul pe o linie — cele patru capitole, lungi cât orele lor, iar la început semnul „tu ești aici” (doar CSS) */
.banda{display:flex;gap:3px;padding:9px 12px;min-height:30px;align-items:center}
.banda i{display:block;height:10px;border-radius:3px}
.banda .e0,.banda .r{flex:1;background:var(--ink2);opacity:.55}
.banda .e0{position:relative;opacity:1;background:var(--accent)}
.banda .e0::after{content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--accent)}
.banda .p1{flex:9;background:var(--p1)} .banda .p2{flex:6;background:var(--p2)} .banda .p3{flex:10;background:var(--p3)} .banda .p4{flex:9;background:var(--p4)}
h1{font-size:clamp(1.6rem,6.4vw,2.7rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:800}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
.reading ol li,.reading ul li{margin:.25em 0}
.parti{list-style:none;padding:0;margin:.4em 0}
.parti li{border-left:6px solid var(--line);padding:4px 0 4px 10px;margin:.45em 0}
.parti li.c1{border-color:var(--p1)} .parti li.c2{border-color:var(--p2)} .parti li.c3{border-color:var(--p3)} .parti li.c4{border-color:var(--p4)}
.trepte{list-style:none;padding:0;margin:.4em 0}
.trepte li{padding:5px 10px;margin:.3em 0;border:1px solid var(--line);border-radius:6px;background:var(--paper2)}
.trepte li:nth-child(2){margin-left:14px} .trepte li:nth-child(3){margin-left:28px}
.seg button{min-height:36px}
.captura figcaption a{display:inline-block;padding:6px 0;min-height:32px;color:var(--accent);font-weight:600}
/* fișa cu teste (tipul autoverificare, definit mai jos): pașii 3-4 și atelierul „Evaluarea inițială” */
.av{display:flex;flex-direction:column;gap:14px}
.av-parte{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px}
.av-parte h3{font-size:1.02rem;margin:0 0 8px;line-height:1.25}
.av-it{padding:8px 0;border-top:1px dashed var(--line)}
.av-it:first-of-type{border-top:0}
.av-it .av-t{display:block;margin-bottom:6px;line-height:1.4}
.av-it input[type=text]{font:inherit;font-size:16px;min-height:40px;width:100%;max-width:22em;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink)}
.av-it select{font:inherit;font-size:16px;min-height:38px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink)}
.av-it .av-af{display:flex;gap:8px;flex-wrap:wrap}
.av-it .av-af button,.av-it .av-var button{min-height:40px}
.av-it .av-var{display:flex;flex-direction:column;gap:6px}
.av-it .av-var.cod button{font-family:var(--fm);white-space:pre;font-size:.9rem;line-height:1.65;overflow-x:auto}
.av-it.bine{box-shadow:inset 4px 0 0 var(--ok);padding-left:10px}
.av-it.rau{box-shadow:inset 4px 0 0 var(--bad);padding-left:10px}
.av-it .av-semn{font-size:.9rem;font-weight:700;margin-top:4px}
.av-it.bine .av-semn{color:var(--ok)} .av-it.rau .av-semn{color:var(--bad)}
.av-teste{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
.av-teste li{padding:8px 12px;border-top:1px solid var(--line)}
.av-teste li:first-child{border-top:0}
.av-teste .st{display:inline-block;width:1.4em;font-weight:800}
.av-teste li.bine .st{color:var(--ok)} .av-teste li.rau .st{color:var(--bad)}
.av-teste .recit{display:block;margin:4px 0 0 1.4em;font-size:.92rem}
.av-teste .recit a,.aplicatie-reala a{font-weight:600;display:inline-block;padding:6px 0;min-height:32px;color:var(--accent);text-underline-offset:3px}
.av-lbl{font-family:var(--fd);font-weight:700;margin:2px 0 4px}
.av-prima{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--paper)}
.av-prima .caiet{margin:8px 0 0;padding:8px 10px;background:var(--paper2);border-radius:6px}
.av-act{min-height:40px;margin:8px 8px 0 0;white-space:normal;text-align:left;line-height:1.3}
.av-lab{margin:8px 0}
.av-lipsa{border:1px dashed var(--bad);border-radius:8px;padding:8px 10px}
</style>

<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/rezultat-elev.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M1 · nr. 1 — „Ce facem anul acesta. Criteriile de evaluare și cele trei niveluri. Evaluare inițială”.
   Sursele (documentele profesorului): Info_Gimnaziu_2026/SISTEM_EVALUARE.md, instrumente/Fisa_criterii_elev_clasa_VI.md,
   data/unitati.json (VI), materiale/continut/teste_initiale.json (VI), generator/print_engine.py (legenda foilor:
   B = De bază · C = Consolidat · A = Avansat). Detalii și contradicții: surse.md.
   Atelierul = evaluarea inițială a profesorului, ca autoverificare; rezultatul PRIMEI verificări rămâne (pe elev).
   Reparat după judecător (27.09.2026): _verificare/judecator.md -> _verificare/reparatii.md.
   ====================================================================================================== */
const IMG={'bicicleta-sprijin':[800,533]};
const fig=(f,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m1-l01/img/${f}.webp" target="_blank"><img src="../m1-l01/img/${f}.webp" alt="${alt}" width="${IMG[f][0]}" height="${IMG[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const EXT=(href,txt)=>`<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;

/* unde recitești ce ți-a arătat evaluarea inițială: lecțiile și jocurile clasei a V-a (nivelurile citite din pagini, _proba/niveluri_v.json) */
/* nivelurile de joc: legătura „doar recitire” a motorului (?recitire=N, N ca pe ecran): deschide pașii nivelului
   fără să-l deblocheze și fără să noteze, deci merge și pe un profil nou; toate se deschid în filă nouă */
const NIV=(slug,nrs)=>nrs.map(n=>`<a href="../../../jocuri/${slug}/?recitire=${n}" target="_blank" rel="noopener">nivelul ${n}</a>`).join(', ');
const LV=(nr)=>`<a href="../../v/m1-l0${nr}/" target="_blank" rel="noopener">lecția ${nr}</a>`;
const RECIT={
  comp:`${LV(4)} și ${LV(5)} din clasa a V-a; jocul Misiunea Tehnician: ${NIV('calculator-v',[4,5])}`,
  unit:`${LV(6)} din clasa a V-a; jocul Misiunea Tehnician: ${NIV('calculator-v',[6])}`,
  so:`jocul Misiunea Ordine: ${NIV('fisiere-v',[1,3,6])}`,
  sters:`jocul Misiunea Ordine: ${NIV('fisiere-v',[5])} (ștergerea și Coșul de reciclare). Despre ce postezi pe internet înveți în capitolul 2 al anului`,
  alg:`jocul Misiunea Pas cu Pas: ${NIV('algoritmi-v',[2,3,6])}`
};

/* ---------------- simulatorul „fac eu” al lecției: fișa cu teste (tipul `autoverificare`) ----------------
   Q.teste = [{ce, recit?, itemi:[{tip:'scris'|'af'|'var'|'sel', text, ok, re?, gresit?, ...}]}].
   Elevul completează tot și apasă Verifică; fiecare test primește ✔ doar dacă toate câmpurile lui sunt bune.
   Folosit și la pașii 3-4: elevul completează singur fișa unei lucrări (punctajul, nota = punctaj : 10, nivelul din notă,
   partea cu cele mai multe puncte pierdute), ca în SISTEM_EVALUARE §4.2-4.3; socotelile: _proba/verifica_regula_noua.py.
   Q.initiala = true (atelierul, evaluarea inițială): rezultatul PRIMEI încercări (diagnosticul, lista „Recitește”)
   îl ține componenta comună lectii/_sim/rezultat-elev.js (RezultatElev), pentru elevul care stă ACUM pe scaun:
   - la fiecare verificare completă: RezultatElev.salveaza(CHEIE, {teste, raspunsuri}) (prima rămâne, restul = reîncercări);
   - se desenează din RezultatElev.citeste(CHEIE) (în atelier, în laborator la <div class="av-lab">, pe diplomă),
     la încărcare și la evenimentul `rezultat-elev`;
   - butonul „Sunt alt elev / Încep din nou” = RezultatElev.golesteAlElevuluiDeAcum(CHEIE);
   - numele, rezultatul fără nume, întrebarea „Verificarea de la ora hh:mm e a ta?” = treaba componentei.
   (Codul propriu de identitate de până la 28.09.2026 e scos: vezi _verificare/reparatii.md.) */
const AV=(()=>{
  const CHEIE='vi-m1-l01-initiala';
  const RE=()=>window.RezultatElev||null;
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[.,;:!?„”"'()\-]/g,' ').replace(/\s+/g,' ').trim();
  const itemi=Q=>Q.teste.flatMap((T,ti)=>T.itemi.map((it,ii)=>({it,ti,id:ti+'-'+ii})));
  const semn='<div class="av-semn" aria-live="polite"></div>';
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const citesteRez=()=>{try{const r=RE()&&RE().citeste(CHEIE);return r&&r.rezultat&&Array.isArray(r.rezultat.teste)?r:null}catch(e){return null}};
  const cine=()=>{try{return RE()?RE().cine():{stare:'',elev:null}}catch(e){return {stare:'',elev:null}}};
  /* butonul „Sunt alt elev / Încep din nou” e recunoscut de componentă (data-rezultat-elev-alt): pentru elevul înscris
     îi pune eticheta „Sunt alt elev”, iar imediat după el pune rândul „Se salvează pe numele: X” (cu „Nu e verificarea
     mea” pentru proprietar) sau „Se păstrează fără nume…” */
  const BUTON_ALT='<button type="button" class="btn ghost sm av-act" id="av-alt" data-rezultat-elev-alt data-av-act="alt">Sunt alt elev / Încep din nou</button>';
  function listaPrima(Q,r){
    const P=r.rezultat,n=P.teste.filter(Boolean).length,N=Q.teste.length,nume=r.elev||'',c=cine();
    const cineE=nume
      ?`<p class="hint av-nu-esti"><b>Nu ești ${esc(nume)}?</b> Atunci rezultatul nu e al tău: apasă „Sunt alt elev”. Alege-te din listă sau, dacă nu ești în ea, apasă „Nu sunt în listă” și spune cine ești. Dacă pagina se redeschide la începutul lecției, apasă pe lecție, apoi pe „Atelier” în bara pașilor: fișa ta e goală.</p>
        <p class="hint av-esti-x"><b>Ești ${esc(nume)}, dar n-ai dat tu verificarea?</b> După ce răspunzi „Da” sus, apasă de două ori „Sunt ${esc(nume)}, dar n-am dat-o eu”, de sub buton: verificarea nu se șterge, doar iese de pe numele tău.</p>${BUTON_ALT}`
      :r.deConfirmat&&c.elev
        ?`<p class="hint av-fara-nume">Sus pe pagină te întreabă dacă ești ${esc(c.elev)}. Răspunde acolo: „Da, sunt eu” o pune pe numele tău; „Nu, sunt alt elev” o lasă fără nume și te lasă să spui cine ești.</p>${BUTON_ALT}`
        :BUTON_ALT;
    return `<div class="av-prima"><div class="av-lbl">Rezultatul ${nume?'lui '+esc(nume)+' ':''}la prima încercare (ora ${esc(r.ora)}): ✔ la ${n} din ${N} teme</div>
      <ul class="av-teste">${Q.teste.map((T,ti)=>`<li class="${P.teste[ti]?'bine':'rau'}"><span class="st" aria-hidden="true">${P.teste[ti]?'✔':'✘'}</span><span class="ce">${esc(T.ce)}${P.teste[ti]?'':' <b>(de recitit)</b>'}</span>${!P.teste[ti]&&T.recit?`<span class="recit"><b>Recitește:</b> ${T.recit}</span>`:''}</li>`).join('')}</ul>
      <div class="caiet"><b>Pentru caiet:</b> la „Unde sunt:” scrii temele cu ✔; la „Ce urmează:” scrii ce e la „Recitește”${n===N?' (la tine: „nimic de recitit, pot începe capitolul 1”)':''}. Rezultatul ăsta rămâne așa, chiar dacă după aceea repari răspunsurile.</div>
      ${cineE}</div>`;
  }
  /* pentru pasul din laborator și pentru diplomă */
  let EXPIRAT=false;   // componenta a scos, după 50 de minute, verificarea fără nume a filei (motivul „expirat”)
  const TXT_EXPIRAT='Verificarea ta fără nume a expirat după 50 de minute. Dacă ai scris-o în caiet, folosește-o pe aceea. Data viitoare, spune întâi cine ești, jos pe pagină („Spune cine ești”).';
  /* v3: fișa unui elev „activ”, neconfirmat în încărcarea asta, nu se arată (citeste = null), ci așteaptă „Ești X?” sus;
     atunci pagina NU spune „nu e niciun rezultat” și nici „fișa ta”: poate sta alt elev în fața ei */
  const asteapta=()=>{try{return RE()&&RE().asteaptaConfirmare?RE().asteaptaConfirmare(CHEIE):null}catch(e){return null}};
  const txtAsteapta=a=>`Pe calculator e fișa lui ${esc(a.elev)}, de la ora ${esc(a.ora)}. Dacă ești ${esc(a.elev)}, apasă sus „Da” ca s-o vezi.`;
  function lab(Q){
    const r=citesteRez();
    if(r)return listaPrima(Q,r);
    const a=asteapta();
    if(a)return `<p class="av-lipsa av-asteapta">${txtAsteapta(a)}</p>`;
    if(EXPIRAT)return `<p class="av-lipsa">${TXT_EXPIRAT}</p>`;
    const c=cine();
    return `<p class="av-lipsa">${c.elev?`Pe numele ${esc(c.elev)} nu e încă niciun rezultat al atelierului „Evaluarea inițială”.`:'În fila asta nu e încă niciun rezultat al atelierului „Evaluarea inițială”.'} Dacă sus pe pagină e o întrebare despre o verificare, răspunde întâi acolo. Altfel, întoarce-te la atelier, răspunde la toate întrebările și apasă o dată <b>Verifică</b>; apoi revino aici.</p>`;
  }
  /* redesenarea: la evenimentul componentei (alt elev, „Da, e a mea”, golit, expirat…), dar nu în mijlocul unei fișe
     începute și neverificate; „salvat” îl desenează chiar Verifică */
  function redeseneaza(){
    const f=document.querySelector('#av-rez');
    const inceput=f&&!f.querySelector('.av-prima')&&[...document.querySelectorAll('.av-it input')].some(i=>i.value);
    if(f&&!inceput)try{JocMotor.test.atelier()}catch(e){}
    document.querySelectorAll('.av-lab').forEach(el=>{el.innerHTML=lab(LECTIA.atelier)});
  }
  addEventListener('rezultat-elev',e=>{const m=e.detail&&e.detail.motiv;
    if(m==='expirat'&&(!e.detail.cheie||e.detail.cheie===CHEIE))EXPIRAT=true;
    if(m==='salvat')EXPIRAT=false;
    if(m!=='salvat')redeseneaza()});
  document.addEventListener('click',ev=>{
    const b=ev.target.closest&&ev.target.closest('[data-av-act="alt"]');if(!b)return;
    try{RE().golesteAlElevuluiDeAcum(CHEIE)}catch(e){}
  });
  function htmlItem(it,id,api){
    if(it.tip==='scris')return `<div class="av-it" data-id="${id}"><label><span class="av-t">${it.text}</span><input type="text" ${it.numar?'inputmode="numeric" ':''}autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-in="${id}" aria-label="${esc(it.eticheta||'Răspunsul tău')}" placeholder="${it.numar?'scrie numărul':'scrie aici'}"></label>${semn}</div>`;
    if(it.tip==='af'){const e=it.etichete||['Adevărat','Fals'];
      return `<div class="av-it" data-id="${id}"><span class="av-t">${it.text}</span><div class="av-af" role="group" aria-label="${esc(e[0]+' sau '+e[1])}"><button type="button" class="opt" data-af="1" aria-pressed="false">${esc(e[0])}</button><button type="button" class="opt" data-af="0" aria-pressed="false">${esc(e[1])}</button></div>${semn}</div>`}
    if(it.tip==='var'){const ord=api.shuffle(it.o.map((_,k)=>k));   // ordinea se amestecă: varianta bună nu stă mereu prima
      return `<div class="av-it" data-id="${id}"><span class="av-t">${it.text}</span><div class="av-var${it.cod?' cod':''}" role="group" aria-label="Alege o variantă">${ord.map(k=>`<button type="button" class="opt" data-v="${k}" aria-pressed="false">${esc(it.o[k])}</button>`).join('')}</div>${semn}</div>`}
    if(it.tip==='sel')return `<div class="av-it" data-id="${id}"><label><span class="av-t">${it.text}</span><select data-sel="${id}" aria-label="${esc(it.eticheta||'Alege')}"><option value="">alege</option>${it.o.map((o,k)=>`<option value="${k}">${esc(o)}</option>`).join('')}</select></label>${semn}</div>`;
    return '';
  }
  function citeste(box,it){
    if(it.tip==='scris')return box.querySelector('input').value;
    if(it.tip==='af'){const b=box.querySelector('[data-af][aria-pressed="true"]');return b?b.dataset.af==='1':null}
    if(it.tip==='var'){const b=box.querySelector('[data-v][aria-pressed="true"]');return b?+b.dataset.v:null}
    if(it.tip==='sel'){const v=box.querySelector('select').value;return v===''?null:+v}
  }
  const gol=(it,v)=>it.tip==='scris'?!norm(v):v===null;
  const corect=(it,v)=>it.tip==='scris'?(it.re?new RegExp(it.re).test(norm(v)):it.ok.map(norm).includes(norm(v))):v===it.ok;
  const bun=it=>it.tip==='scris'?it.ok[0]:it.ok;
  function marcheaza(box,ok,initiala){box.classList.toggle('bine',ok);box.classList.toggle('rau',!ok);box.querySelector('.av-semn').textContent=ok?'✔ bine':(initiala?'✘ de recitit':'✘ mai încearcă')}
  function pune(box,it,v){
    box.classList.remove('bine','rau');box.querySelector('.av-semn').textContent='';
    if(it.tip==='scris'){box.querySelector('input').value=v;return}
    if(it.tip==='sel'){box.querySelector('select').value=String(v);return}
    const want=it.tip==='af'?(v?'1':'0'):String(v);
    box.querySelectorAll(it.tip==='af'?'[data-af]':'[data-v]').forEach(b=>{const on=(it.tip==='af'?b.dataset.af:b.dataset.v)===want;b.setAttribute('aria-pressed',String(on));b.classList.toggle('on',on)});
  }
  function render(Q,body,api){
    const L=itemi(Q),box=id=>body.querySelector(`.av-it[data-id="${id}"]`);
    const R0=Q.initiala?citesteRez():null,P0=R0?R0.rezultat:null;
    const A0=Q.initiala&&!R0?asteapta():null;
    const gol0=`${A0?`<p class="av-lipsa av-asteapta">${txtAsteapta(A0)}</p>`:EXPIRAT?`<p class="av-lipsa">${TXT_EXPIRAT}</p>`:''}<div class="av-lbl">Testele: se bifează la prima verificare completă și rămân așa</div><ul class="av-teste">${Q.teste.map(T=>`<li><span class="st" aria-hidden="true">○</span><span class="ce">${esc(T.ce)}</span></li>`).join('')}</ul>`;
    const teste=Q.initiala
      ?`<div id="av-rez">${R0?listaPrima(Q,R0):gol0}</div>`
      :`<div><div class="av-lbl">Testele (se bifează când apeși Verifică)</div><ul class="av-teste">${Q.teste.map((T,ti)=>`<li data-t="${ti}"><span class="st" aria-hidden="true">○</span><span class="ce">${esc(T.ce)}</span></li>`).join('')}</ul></div>`;
    body.innerHTML=`<div class="av">${Q.teste.map((T,ti)=>`<section class="av-parte" aria-label="${esc(T.ce)}"><h3>${Q.initiala?'Tema '+(ti+1)+': ':ti+1+'. '}${esc(T.ce)}</h3>${T.itemi.map((it,ii)=>htmlItem(it,ti+'-'+ii,api)).join('')}</section>`).join('')}${teste}</div>`;
    const curataSemn=b=>{b.classList.remove('bine','rau');b.querySelector('.av-semn').textContent=''};
    body.querySelectorAll('.av-it').forEach(b=>{
      b.querySelectorAll('[data-af],[data-v]').forEach(x=>x.onclick=()=>{if(api.done())return;
        b.querySelectorAll('[data-af],[data-v]').forEach(y=>{const on=y===x;y.setAttribute('aria-pressed',String(on));y.classList.toggle('on',on)});curataSemn(b)});
      b.querySelectorAll('input,select').forEach(x=>{x.addEventListener('input',()=>curataSemn(b));x.addEventListener('change',()=>curataSemn(b))});
    });
    body._av={pune:(id,v)=>pune(box(id),L.find(e=>e.id===id).it,v),L};
    if(P0&&P0.raspunsuri)L.forEach(({it,id})=>{const v=P0.raspunsuri[id];if(v!==undefined&&v!==null){pune(box(id),it,v);marcheaza(box(id),corect(it,v),true)}});
    api.checkButton(()=>{
      const lipsa=L.filter(({it,id})=>gol(it,citeste(box(id),it))).length;
      if(lipsa){api.feedback('bad',`<strong>Mai ai ${lipsa===1?'un răspuns necompletat':lipsa+' răspunsuri necompletate'}.</strong> ${Q.initiala?'Răspunde la toate, chiar dacă nu ești sigur: așa afli ce ai de recitit.':'Completează tot, apoi apasă din nou Verifică.'}`);return}
      const bunT=Q.teste.map(()=>true),rasp={};
      L.forEach(({it,ti,id})=>{const v=citeste(box(id),it),ok=corect(it,v);rasp[id]=v;marcheaza(box(id),ok,Q.initiala);if(!ok)bunT[ti]=false});
      const n=bunT.filter(Boolean).length,N=Q.teste.length;
      if(Q.initiala){
        let v=null;try{v=RE().salveaza(CHEIE,{teste:bunT,raspunsuri:rasp})}catch(e){}
        const primaData=!v||v.ca==='prima';
        const R=v&&v.rezultat&&Array.isArray(v.rezultat.teste)?v:{rezultat:{teste:bunT,raspunsuri:rasp},ora:'',elev:null};
        body.querySelector('#av-rez').innerHTML=listaPrima(Q,R);
        if(n===N){api.resolve(true);return}
        api.feedback('bad',primaData
          ?`<strong>Unde ești:</strong> ✔ la ${n} din ${N} teme. <strong>Ce urmează:</strong> ce scrie la „Recitește” sub temele cu ✘. Asta nu e o notă. Ce ai greșit acum rămâne în listă: asta e ce ai de recitit. Scrie-o acum în caiet.`
          :`<strong>Acum:</strong> ✔ la ${n} din ${N} teme. Lista de recitit rămâne cea de la prima încercare, de deasupra.`);
        return;
      }
      body.querySelectorAll('.av-teste li').forEach(li=>{const ok=bunT[+li.dataset.t];li.classList.toggle('bine',ok);li.classList.toggle('rau',!ok);li.querySelector('.st').textContent=ok?'✔':'✘'});
      if(n===N){api.resolve(true);return}
      api.resolve(false,`${n} din ${N} teste au ✔. Uită-te la câmpurile cu ✘, repară-le și apasă din nou Verifică.`);
      api.revealButton(()=>{L.forEach(({it,id})=>pune(box(id),it,bun(it)));api.nav().innerHTML='';api.giveUp('răspunsurile corecte sunt acum completate în fișă.')});
    });
  }
  function umple(body,gresit){
    const s=body._av;s.L.forEach(({it,id})=>s.pune(id,gresit&&it.gresit!==undefined?it.gresit:bun(it)));
  }
  /* cheia verificării se anunță componentei de la încărcare: întrebarea „Verificarea de la ora hh:mm e a ta?” apare
     imediat după înscriere / „Da, sunt eu”, nu abia când elevul deschide atelierul */
  try{RE()&&RE().citeste(CHEIE)}catch(e){}
  return {render,rezolva:(Q,body)=>umple(body,false),gresit:(Q,body)=>umple(body,true),lab};
})();

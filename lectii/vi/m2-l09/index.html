<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini-proiect: prezentare pe o temă la alegere (realizare + susținere)</title>
<meta name="description" content="Lecția 9, clasa a VI-a (TIC): mini-proiectul. Faci singur o prezentare PowerPoint pe o temă aleasă de tine, după un plan pe hârtie, o verifici după criteriile profesorului cu o listă de autoverificare și o susții în fața colegilor. Cu exerciții în pagină și un PowerPoint simulat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Libre+Franklin:wght@400;600;700&family=Cousine:wght@400;700&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EEF2EF; --paper:#FFFFFF; --paper2:#F3F7F4; --line:#CFDDD5;
  --ink:#16221C; --ink2:#4A5C53; --accent:#0B6B5B; --accentInk:#FFFFFF; --sel:#D4EDE6;
  --mark:#FFE08A; --markInk:#16221C; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Bree Serif",Georgia,serif; --fb:"Libre Franklin","Segoe UI",system-ui,sans-serif; --fm:"Cousine",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1714; --paper:#17221E; --paper2:#1E2B26; --line:#34473F;
  --ink:#E4EFEA; --ink2:#A9BDB4; --accent:#5FD1B9; --accentInk:#0F1714; --sel:#1F4A40;
  --mark:#F2C94C; --markInk:#16221C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#0F1714; --paper:#17221E; --paper2:#1E2B26; --line:#34473F;
  --ink:#E4EFEA; --ink2:#A9BDB4; --accent:#5FD1B9; --accentInk:#0F1714; --sel:#1F4A40;
  --mark:#F2C94C; --markInk:#16221C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: drumul proiectului — o foaie cu rânduri (planul), diapozitive, apoi o bifă (verificarea); doar CSS */
.banda{display:flex;gap:8px;padding:6px 12px;min-height:36px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.banda .foaie{flex:0 0 auto;width:20px;height:26px;border:1px solid var(--ink2);border-radius:2px;background:
  linear-gradient(var(--ink2),var(--ink2)) 3px 6px/12px 1px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 3px 11px/12px 1px no-repeat,
  linear-gradient(var(--ink2),var(--ink2)) 3px 16px/12px 1px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 3px 21px/8px 1px no-repeat}
.banda .sag{flex:0 0 auto;width:14px;height:2px;background:var(--ink2);position:relative}
.banda .sag::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--ink2);border-right:0}
.banda .dz{flex:0 0 auto;width:36px;height:22px;border:1px solid var(--ink2);border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent)) 5px 5px/18px 3px no-repeat,linear-gradient(var(--line),var(--line)) 5px 12px/24px 2px no-repeat}
.banda .bifa{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);position:relative}
.banda .bifa::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:10px;border:solid var(--accentInk);border-width:0 3px 3px 0;transform:rotate(45deg)}
h1{font-size:clamp(1.55rem,6.2vw,2.7rem);font-weight:400;letter-spacing:-.005em}
h1 .acc{color:var(--accent)}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:360px}
.reading ol li,.reading ul li{margin:.2em 0}
/* legăturile spre lecțiile anterioare: zonă de atins de cel puțin 32 px în înălțime (regula 20), fără să mute rândul */
a.lk{padding:7px 2px;border-radius:4px}
/* planul pe hârtie: tabel lizibil și pe telefon (derulare doar în tabel, nu în pagină) */
.plan-tab{overflow-x:auto;max-width:100%}
.plan-tab table{border-collapse:collapse;font-size:.92em;min-width:100%}
.plan-tab th,.plan-tab td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.plan-tab th{background:var(--paper2)}
/* lista de autoverificare (pasul de la calculator): bifele stau doar în pagina deschisă, nu se păstrează */
.autover{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--paper)}
.autover .av-cap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:0 0 6px}
.autover .av-grup{font-weight:700;margin:10px 0 2px}
.autover label.av-rand{display:flex;gap:10px;align-items:flex-start;min-height:32px;padding:4px 2px;cursor:pointer}
.autover label.av-rand input{flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.autover details.av-dece{margin:0 0 4px 34px}
.autover details.av-dece summary,.autover details.grila summary{min-height:32px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:600}
.autover .av-nr{font-weight:700}
.autover .grila table{border-collapse:collapse;font-size:.88em}
.autover .grila th,.autover .grila td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.autover .grila .plan-tab{margin-top:6px}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/ui-panglica.js"></script>
<script src="../../../jocuri/_motor/panglica-powerpoint.js"></script>
<script src="../../_sim/simppt.js"></script>
<script src="../../_sim/simppt-formatare.js"></script>
<script src="../../_sim/simppt-interfata.js"></script>
<script src="../../_sim/simppt-proiect.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 9 — „Mini-proiect: prezentare pe o temă la alegere (realizare + susținere)”.
   Lecție de CONSOLIDARE: nu predă nimic nou; duce elevul prin proiect, cu trimiteri la lecțiile 2-8.
   AL PROFESORULUI (surse.md): grila (instrumente/Grila_produs.md, copiată exact, FĂRĂ punctaje: grila nu are),
   etapele (activitati_lectii_V_VI.json), durata orientativă „cam un diapozitiv pe minut” și mărimile 32-40 / 24-28
   (materiale/continut/clasa_VI_M1.json), descriptorii (Proiectul_unitatii_VI-U1.md), activitățile din programă.
   AL PAGINII (spus pe ecran ca propunere, după judecătorul VI/9, J03): lista de autoverificare și gruparea regulilor
   din lecțiile 2-8 după criteriile grilei. Exercițiile NU notează această grupare, doar cuvintele grilei.
   Simulatoarele: lectii/_sim/simppt.js + simppt-formatare.js (tipul ppt), simppt-interfata.js (tipul ppti: notele și
   expunerea), simppt-proiect.js (condițiile linieIncepe și startPrimul, ale acestei lecții; se încarcă ultimul).
   Nu se modifică niciunul dintre cele comune.
   Faptele despre PowerPoint sunt cele deja probate în lecțiile 2-7 (afirmatii.json al fiecăreia; aici: afirmatii.json).
   ====================================================================================================== */
const SF=SimPPTFormatare, P=SF.pas, DP=SF.diap;
const FX=(s,fx)=>Object.assign(s,{fx});
const GALBEN={rgb:'#FFFF00'},BLEUMARIN={rgb:'#002060'};
const CASETA={tip:'caseta'};
const T_CONTRAST=(d,tinta)=>Object.assign({k:'fmtText',d,contrastMin:4.5},typeof tinta==='string'?{ph:tinta}:{o:tinta});

SF.prezentari({
  /* pasul „Realizarea”: o prezentare nouă, ca după Blank Presentation */
  l9_nou:()=>[DP('d1','title',{})],
  /* atelierul: proiectul lui Radu, cu câte o problemă pentru rânduri din lista de autoverificare */
  l9_marte:()=>[DP('d1','title',{titlu:'Planeta Marte'}),
    DP('d2','tc',{titlu:'Cuprins',c1:'De ce e roșie\nCât de departe e\nCe reținem'}),
    FX(DP('d3','tc',{titlu:'Cât de departe e',c1:'Mai departe decât Luna\nDrumul durează câteva luni'}),{ph:{c1:{cul:GALBEN}}}),
    /* Two Content (lecția 4): rândurile în locul din stânga, imaginea în cel din dreapta (poziția calculată ca în simppt.js,
       puneObiect, pentru o imagine pusă în substituentul c2) — drumul probat de judecător în PowerPoint real (A08b, cazurile E, F) */
    FX(DP('d4','two',{titlu:'De ce e roșie',c1:'Solul are mult fier ruginit\nDe aceea pare roșie'},[{tip:'imagine',fis:'luna.png',ph:'c2',x:55.8,y:29.8,w:32.1,h:57.1}]),{ph:{c1:{pt:14}}}),
    DP('d5','tc',{titlu:'Ce reținem',c1:'Marte e a patra planetă de la Soare\nE numită planeta roșie'})],
  /* pasul „Imaginea: în locul din dreapta”: un diapozitiv Title and Content cu titlul scris, restul gol */
  l9_pamant:()=>[DP('d1','title',{titlu:'Planeta noastră',sub:'Vlad Ene, clasa a VI-a'}),DP('d2','tc',{titlu:'Pământul'})],
  /* întrebarea 5: imaginea care nu spune ce spune titlul */
  l9_luna:()=>[DP('d1','title',{titlu:'Luna',sub:'Irina Dinu, clasa a VI-a'}),
    DP('d2','two',{titlu:'Cum arată Luna',c1:'Are multe cratere\nNu are lumină proprie'},[{tip:'imagine',fis:'pamant.png',ph:'c2',x:55.8,y:29.8,w:32.1,h:57.1}])]
});

/* pasul „Susținerea”: aceeași prezentare ca în planul Ioanei (tipul ppti: notele și expunerea) */
SimPPTInt.prezentari({
  sahul:{titlu:'Sahul_6A_Pop',diap:[
    {lay:'titlu',titlu:'Șahul',sub:'Ioana Pop, clasa a VI-a',note:'Bună ziua! Azi vă vorbesc despre șah.'},
    {lay:'tc',titlu:'Cuprins',randuri:['Tabla și piesele','Cum mută calul','Cum câștigi','Ce reținem'],note:'Vă spun ce urmează.'},
    {lay:'tc',titlu:'Tabla și piesele',randuri:['64 de pătrățele','16 piese'],note:'Arăt tabla și piesele.'},
    {lay:'tc',titlu:'Cum mută calul',randuri:['Mută în formă de L'],note:''},
    {lay:'tc',titlu:'Cum câștigi',randuri:['Prin șah-mat'],note:'Explic șah-matul.'},
    {lay:'tc',titlu:'Ce reținem',randuri:['Se joacă în doi','Surse: ro.wikipedia.org'],note:'Mulțumesc! Aveți întrebări?'}]}
});

/* ---------------- lecția ---------------- */
/* trimiterea spre o lecție: legătura duce la începutul ei (motorul nu are legătură spre un pas de lecție), deci pasul
   se NUMEȘTE cu titlul lui exact de pe pagina acelei lecții (judecătorul VI/9, J11) */
const L=(n,pas)=>`<a class="lk" href="../${n===8?'m2-l08':'m1-l0'+n}/" target="_blank" rel="noopener">lecția ${n}</a>${pas?`, pasul „${pas}”`:''}`;
const figDin=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CONT=['Structura unei prezentări: diapozitive, obiecte utilizate în prezentări (casete de text, imagini importate, forme, sunete, tabele, legături)',
  'Reguli elementare de estetică și ergonomie utilizate în realizarea unei prezentări',
  'Reguli elementare de susținere a unei prezentări'];
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. Scrii într-un substituent cu un clic în el. Ca să schimbi tot textul unei casete: clic în text, apoi clic pe chenarul punctat (sau butonul <b>Esc</b> de sub fereastră), până chenarul devine linie plină. Pe telefon, tastele (Delete, Ctrl+Z) sunt butoane sub fereastră. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_PPTI='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. În zona de note scrii cu un clic în ea. Pe telefon, tasta F5 e buton sub fereastră, iar în expunere atingi ecranul ca să mergi înainte. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_INTRO=`<p>Mai jos e un <strong>PowerPoint simulat</strong>, cu panglica în engleză, ca pe unele calculatoare din laborator (pe altele PowerPoint e în română; numele românești le ai în pași). Lucrează în fereastră: <strong>testele se bifează singure</strong>, apoi apeși <b>Verifică</b>.</p>
<ul><li><b>Scrii</b> într-un substituent sau într-o casetă cu un clic în text; ieși cu un clic pe o parte goală a diapozitivului.</li>
<li><b>Tot textul unei casete:</b> clic în text, apoi clic pe chenarul punctat, până devine linie plină. Pe telefon: atingi textul, apoi butonul <b>Esc</b> de sub fereastră.</li>
<li><b>Muți un diapozitiv</b> trăgându-i miniatura (pe telefon: ții degetul apăsat o clipă, apoi tragi).</li>
<li>Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (și ca buton sub fereastră) anulează ultimul pas.</li></ul>`;

const LECTIA={
 t:'Mini-proiect: prezentare pe o temă la alegere (realizare + susținere)',lectii:[9],continuturi:CONT,final:true,
 obiectiv:'faci singur, după un plan, o prezentare pe o temă aleasă de tine, o verifici după criteriile profesorului și o susții în fața colegilor.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>În lecțiile 2-8 ai învățat tot ce trebuie pentru o prezentare.</p>
<p>Acum le pui pe toate la un loc, într-un <strong>mini-proiect</strong>: o lucrare mică, a ta, de la idee până la capăt. Faci o prezentare pe o temă aleasă de tine și o <strong>susții</strong>, adică o prezinți colegilor, vorbind. Proiectul îți aduce o notă.</p>
<p>Aproape nimic nu e nou: doar unde pui imaginea (pasul 5). Pagina te duce prin proiect și îți spune unde recitești.</p>
${figDin('../m1-l04/img/prezentare-la-ora.webp',960,688,'O oră de clasă: pe ecranul videoproiectorului se vede un diapozitiv; lângă ecran vorbește prezentatorul, cu fața spre elevi','Cel care prezintă stă lângă ecran, cu fața la public. La susținere, în locul lui ești tu. Fotografie: Bureau of Land Management (SUA), domeniu public, Wikimedia Commons.','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> ${L(2)}, ${L(3)}, ${L(4)}, ${L(5)}, ${L(6)}, ${L(7)} și ${L(8)}, care se deschid într-o filă nouă; din clasa a V-a, căutarea pe internet, salvarea unei imagini și drepturile de autor.</p>`},

  /* ---------- pasul 1: cerința ---------- */
  {t:'Ce ți se cere',
   text:`<p><strong>Cerința</strong> spune ce trebuie să aibă proiectul. Pe cea exactă ți-o dă profesorul și pe ea o respecți întâi. Până atunci, iată ce cer programa și proiectul unității:</p>
<ul><li>o <strong>temă aleasă de tine</strong>: un joc, un film, un loc, un animal. <strong>Publicul</strong> sunt colegii tăi;</li>
<li>titlu cu numele tău, cuprins, câte un diapozitiv pentru fiecare idee, încheiere cu sursele (${L(4,'Structura unei prezentări')});</li>
<li>casete de text, imagini din fișiere, forme (${L(4,'Pui obiecte de pe fila Inserare (Insert)')});</li>
<li>o tranziție și o animație puse cu rost (${L(7,'Privește ca publicul: ajută sau încurcă?')});</li>
<li>o susții în fața clasei.</li></ul>`,
   exemplu:`<p>Ioana alege <b>șahul</b>, jocul ei preferat. Publicul: colegii, dintre care nu toți știu să joace. Are trei idei: tabla și piesele, cum mută calul, cum câștigi.</p>
<p>Prezentarea ei are deci: titlul „Șahul”, cu numele ei; cuprinsul; trei diapozitive, câte unul pentru fiecare idee; „Ce reținem”, cu sursele. Pune imaginea unei table de șah, o săgeată care arată mutarea calului, aceeași tranziție pe toate și o animație: săgeata apare abia la clic, când vorbește despre ea.</p>`,
   altfel:`<p>E ca o rețetă: îți spune ce ingrediente nu au voie să lipsească. Ce prăjitură faci alegi tu (tema), dar ingredientele cerute sunt toate acolo.</p>`,
   incearca:{t:'choice',q:'Mara a făcut o prezentare despre pisica ei: titlul „Pisica mea”, cu numele ei; trei diapozitive, câte unul pentru fiecare idee, cu text, o fotografie din fișier și o săgeată; „Ce reținem”, cu sursele. Are aceeași tranziție pe toate și o animație care apare la clic. Ce îi lipsește din cerință?',
    o:['Diapozitivul cu cuprinsul','Câte o tranziție diferită pe fiecare diapozitiv','Un sunet pe fiecare diapozitiv','Nimic, are tot'],ok:0,
    ajutor:'Ia lista pasului, parte cu parte: titlu, cuprins, câte un diapozitiv pe idee, încheiere.',
    why:'După titlu vine și cuprinsul: lista ideilor. Tranzițiile diferite și sunetele nu se cer; ele încurcă publicul (lecția 7).'},
   inca:[
    {t:'tf',q:'Prezentarea „Fotbalul” are titlul, cuprinsul, trei diapozitive de conținut și încheierea. Deci are 6 diapozitive.',ok:true,
     ajutor:'Numără: titlul, cuprinsul, câte unul pentru fiecare idee, încheierea.',
     why:'Adevărat: 1 titlu + 1 cuprins + 3 idei + 1 încheiere = 6. Fiecare idee are diapozitivul ei.'}
   ]},

  /* ---------- pasul 2: planul pe hârtie ---------- */
  {t:'Planul pe hârtie',
   text:`<p>Înainte să deschizi PowerPoint, faci <strong>planul</strong> pe o foaie. Alegi două sau trei idei: cu „Ce reținem”, cuprinsul are atunci cel mult patru rânduri. Apoi faci un tabel, cu câte un rând pentru fiecare diapozitiv:</p>
<ul><li>numărul și titlul diapozitivului;</li>
<li>rândurile de pe ecran: cel mult patru, scurte (${L(2,'O idee pe diapozitiv, în puține cuvinte')});</li>
<li>ce imagine sau ce formă pui;</li>
<li>ce spui tu; asta va merge în zona de note.</li></ul>
<p>Rândurile tabelului vin în ordinea structurii (${L(4,'Structura unei prezentări')}). Titlurile diapozitivelor de conținut sunt ideile din cuprins, în aceeași ordine.</p>`,
   exemplu:`<p>Planul Ioanei, în caiet:</p>
<div class="plan-tab"><table><thead><tr><th>Nr.</th><th>Titlul</th><th>Pe ecran</th><th>Imagine sau formă</th><th>Ce spun eu</th></tr></thead><tbody>
<tr><td>1</td><td>Șahul</td><td>Ioana Pop, clasa a VI-a</td><td>–</td><td>Salut, spun tema.</td></tr>
<tr><td>2</td><td>Cuprins</td><td>ideile, în ordine</td><td>–</td><td>Spun ce urmează.</td></tr>
<tr><td>3</td><td>Tabla și piesele</td><td>64 de pătrățele; 16 piese</td><td>tabla de șah</td><td>Arăt piesele.</td></tr>
<tr><td>4</td><td>Cum mută calul</td><td>Mută în formă de L</td><td>o săgeată</td><td>Arăt o mutare.</td></tr>
<tr><td>5</td><td>Cum câștigi</td><td>Prin șah-mat</td><td>–</td><td>Explic șah-matul.</td></tr>
<tr><td>6</td><td>Ce reținem</td><td>Se joacă în doi; Surse: ro.wikipedia.org</td><td>–</td><td>Mulțumesc.</td></tr>
</tbody></table></div>`,
   altfel:`<p>Planul e ca schița unei case: întâi desenezi pe hârtie câte camere are și în ce ordine, apoi construiești. Un perete mutat pe hârtie te costă o gumă; unul mutat în casă, o zi de muncă.</p>`,
   incearca:{t:'choice',q:'Radu are două idei despre planeta Marte: de ce e roșie și cât de departe e. Câte rânduri are tabelul planului lui, adică câte diapozitive va avea prezentarea?',
    o:['5','2','3','4'],ok:0,
    ajutor:'Pe lângă câte un rând pentru fiecare idee, mai sunt titlul, cuprinsul și încheierea.',
    why:'1 titlu + 1 cuprins + 2 idei + 1 încheiere = 5 rânduri, deci 5 diapozitive.'},
   inca:[
    {t:'hunt',q:'Planul lui Dan are 3 greșeli față de regulile planului. Apasă pe fiecare, apoi verifică.',
     src:'Planul lui Dan, „Fotbalul”. Diapozitivul 1: titlul „Fotbalul”, cu numele lui și clasa. Diapozitivul 2: cuprinsul, cu Terenul, Regulile, Echipa mea. [[Diapozitivul 3: Regulile. Diapozitivul 4: Terenul.|Ordinea nu e cea din cuprins: întâi Terenul, apoi Regulile.]] Diapozitivul 5: Echipa mea [[și istoria fotbalului în lume|Aici sunt două idei. Istoria fotbalului ar avea nevoie de diapozitivul ei și de un loc în cuprins.]]. Diapozitivul 6: Ce reținem, [[fără surse|Încheierea are și sursele: de unde ai luat informațiile și imaginile.]].',
     indiciu:'Compară cuprinsul cu ordinea diapozitivelor; caută un diapozitiv cu două idei; uită-te la încheiere.',
     ajutor:'Verifică pe rând: ordinea, o idee pe diapozitiv, încheierea.',
     why:'Un plan bun ține ordinea din cuprins, pune o singură idee pe diapozitiv și are sursele la încheiere.'}
   ]},

  /* ---------- pasul 3: realizarea, în ordinea bună ---------- */
  {t:'Realizarea, în ordinea bună',
   text:`<p>În PowerPoint lucrezi după plan, în ordinea asta:</p>
<ol><li>prezentare nouă, <strong>salvată imediat</strong> cu un nume bun (${L(3,'Prima salvare: numele și folderul')});</li>
<li><strong>întâi tema</strong> (${L(6,'Tema: toate diapozitivele deodată')});</li>
<li>diapozitivele și textul lor (${L(4,'Diapozitiv nou și aspectul lui')});</li>
<li>imaginile și formele (pasul următor);</li>
<li>mărimile și culorile care se citesc (${L(6,'Alegi toată caseta, apoi mărimea și aldinul')});</li>
<li>o tranziție pe toate și animațiile care ajută (${L(7,'O singură tranziție, scurtă, pe toate')}).</li></ol>
<p>Apeși des <kbd>Ctrl</kbd>+<kbd>S</kbd>. Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd>.</p>`,
   exemplu:`<p>Uite un diapozitiv de conținut terminat, despre șah:</p>
${figDin('../../../jocuri/prezentari-vi/img/diapozitiv-sah.webp',1000,529,'Diapozitiv PowerPoint despre șah: titlul Șahul: regulile de bază, patru rânduri scurte scrise cu alb pe fundal albastru închis, o tablă de șah în dreapta și, dedesubt, în zona de note, ce spune prezentatorul','Titlu, patru rânduri scurte, text alb pe fundal închis, o tablă de șah care arată chiar ce spune textul. Jos, în zona de note, ce spune cel care prezintă; publicul nu o vede. Captură din PowerPoint în engleză.')}`,
   incearca:{t:'ppt',q:SIM_SCURT+'Maria începe proiectul „Fotbalul”, după planul ei. Pe primul diapozitiv scrie titlul <b>Fotbalul</b> și, dedesubt, <b>Maria Pop, clasa a VI-a</b>. Apoi adaugă un diapozitiv nou (Pornire (Home) → Diapozitiv nou (New Slide)), cu titlul <b>Cuprins</b>. Sub titlu scrie ideile, pe trei rânduri, în ordinea din plan: <b>Terenul</b>, <b>Regulile</b>, <b>Ce reținem</b> (<kbd>Enter</kbd> între ele).',
    start:{deck:'l9_nou',cur:0},
    teste:[
     {ce:'Primul diapozitiv are titlul „Fotbalul”',c:[{k:'text',d:1,ph:'titlu',val:'Fotbalul'}],ajutor:'Clic pe Click to add title și scrie Fotbalul.'},
     {ce:'Sub titlu scrie cine a făcut prezentarea',c:[{k:'textmin',d:1,ph:'sub',min:5}],ajutor:'Clic pe Click to add subtitle și scrie Maria Pop, clasa a VI-a.'},
     {ce:'Al doilea diapozitiv e cuprinsul: are titlul „Cuprins”',c:[{k:'nr',n:2},{k:'text',d:2,ph:'titlu',val:'Cuprins'}],ajutor:'Home (Pornire) → New Slide (Diapozitiv nou), apoi clic pe Click to add title.'},
     {ce:'Cuprinsul are ideile în ordinea din plan: Terenul, Regulile, Ce reținem',c:[{k:'linii',d:2,ph:'c1',val:['Terenul','Regulile','Ce reținem']}],ajutor:'Clic pe Click to add text: Terenul, Enter, Regulile, Enter, Ce reținem.'}],
    rez:[{ph:'titlu',scrie:'Fotbalul'},{ph:'sub',scrie:'Maria Pop, clasa a VI-a'},'new-slide',{ph:'titlu',scrie:'Cuprins'},{ph:'c1',scrie:'Terenul\nRegulile\nCe reținem'}],
    gresit:[{ph:'titlu',scrie:'Fotbalul'},{ph:'sub',scrie:'Maria Pop, clasa a VI-a'},'new-slide',{ph:'titlu',scrie:'Cuprins'},{ph:'c1',scrie:'Regulile\nTerenul\nCe reținem'}],
    rezText:'Click to add title → Fotbalul; Click to add subtitle → Maria Pop, clasa a VI-a; Home → New Slide; Click to add title → Cuprins; Click to add text → Terenul, Enter, Regulile, Enter, Ce reținem',
    ajutor:'Lucrează test cu test. Ai greșit? Ctrl+Z.',
    why:'Ai început cum cere structura: titlul, cu cine a făcut prezentarea, apoi cuprinsul, cu ideile în ordinea din plan. Diapozitivele de conținut vor veni în aceeași ordine.'},

  /* ---------- pasul 4: imaginea, în locul gol din dreapta (Two Content) — judecătorul VI/9, J02, probat în PowerPoint real ---------- */
  {t:'Imaginea: în locul din dreapta',
   text:`<p>Pe un diapozitiv cu text, o imagine nouă apare în mijloc, peste rânduri; o fotografie mare acoperă și titlul. De aceea folosești aspectul <strong>Two Content</strong> (Două conținuturi), cu două locuri alăturate (${L(4,'Diapozitiv nou și aspectul lui')}):</p>
<ol><li>Pornire (Home) → Aspect (Layout) → Two Content;</li>
<li>scrii ÎNTÂI rândurile, în locul din stânga (cu ambele locuri goale, imaginea ar intra în stânga);</li>
<li>Inserare (Insert) → Imagini (Pictures) → Acest dispozitiv (This Device) → fișierul → Inserare (Insert): imaginea intră în locul gol din dreapta.</li></ol>
<p>A ajuns totuși în mijloc? Clic pe ea → Delete. Cu aspectul Two Content și locul din dreapta gol, o pui din nou.</p>`,
   exemplu:`<p>Pe „Tabla și piesele”, Ioana alege Two Content. În stânga scrie „64 de pătrățele” și „16 piese”; dreapta rămâne goală. Apoi Inserare (Insert) → Imagini (Pictures) → Acest dispozitiv (This Device) → <code>tabla_Ioana.jpg</code> → Inserare (Insert). Fotografia tablei, deși e mare, se micșorează singură cât locul din dreapta, iar rândurile se văd toate.</p>`,
   altfel:`<p>E ca un album cu buzunare: fiecare poză are buzunarul ei, lângă text. Dacă o lipești oriunde pe pagină, poate acoperi ce ai scris.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Pe diapozitivul 2, „Pământul”, rândurile și imaginea trebuie să stea alăturat. Alege miniatura 2, apoi Pornire (Home) → Aspect (Layout) → <b>Two Content</b>. În locul din stânga scrie <b>Are apă și aer</b> și, pe rândul următor, <b>Are o singură lună</b>. Apoi pune imaginea <b>pamant.png</b>: Insert (Inserare) → Pictures (Imagini) → This Device (Acest dispozitiv) → pamant.png → Insert.',
    start:{deck:'l9_pamant',cur:0},
    teste:[
     {ce:'Diapozitivul „Pământul” are aspectul Two Content',c:[{k:'aspect',d:'Pământul',lay:'two'}],ajutor:'Miniatura 2, apoi Home (Pornire) → Layout (Aspect) → Two Content.'},
     {ce:'În locul din stânga: Are apă și aer, Are o singură lună',c:[{k:'linii',d:'Pământul',ph:'c1',val:['Are apă și aer','Are o singură lună']}],ajutor:'Clic în locul din stânga, scrie primul rând, Enter, apoi al doilea.'},
     {ce:'Imaginea pamant.png e pe diapozitiv, în locul din dreapta, fără să acopere rândurile',c:[{k:'imagine',d:'Pământul',fis:'pamant.png'},{k:'pozitie',d:'Pământul',tip:'imagine',fis:'pamant.png',xmin:50}],ajutor:'Imaginea a ajuns în mijloc? Clic pe ea → Delete. Apoi, dacă nu e deja, Home (Pornire) → Layout (Aspect) → Two Content. Scrie rândurile în stânga, iar cu locul din dreapta gol pune imaginea din nou: Insert → Pictures → This Device → pamant.png → Insert.'},
     {ce:'Pe diapozitiv e o singură imagine: niciuna în mijloc, peste rânduri',c:[{k:'nobj',d:'Pământul',tip:'imagine',n:1}],ajutor:'Mai e o imagine în mijloc, peste rânduri? Clic pe ea → Delete. Cea din locul din dreapta rămâne.'}],
    rez:['mini-2','layout','lay:two',{ph:'c1',scrie:'Are apă și aer\nAre o singură lună'},'tab-insert','ins-pictures','pic-device','file:pamant.png','file-insert'],
    gresit:['mini-2',{ph:'c1',scrie:'Are apă și aer\nAre o singură lună'},'tab-insert','ins-pictures','pic-device','file:pamant.png','file-insert'],
    rezText:'miniatura 2 → Home → Layout → Two Content; în stânga: Are apă și aer, Enter, Are o singură lună; Insert → Pictures → This Device → pamant.png → Insert',
    ajutor:'Întâi aspectul, apoi rândurile, la sfârșit imaginea.',
    why:'Cu aspectul Two Content, imaginea a intrat singură în locul gol din dreapta, lângă rânduri, fără să le acopere.'},
   inca:[
    {t:'choice',q:'Pe un diapozitiv Title and Content (Titlu și conținut) ai scris deja rândurile. Acum inserezi o fotografie mare de pe internet. Ce se întâmplă?',
     o:['Apare în mijloc, peste rânduri, poate și peste titlu','Intră singură lângă rânduri, în dreapta','Rândurile se mută singure mai jos','Nu se poate pune nicio imagine'],ok:0,
     ajutor:'Prima propoziție a pasului.',
     why:'Pe un diapozitiv fără loc gol, imaginea nouă apare în mijloc, peste text. De aceea, pentru o idee cu imagine, alegi întâi Two Content și lași locul din dreapta gol.'}
   ]},

  /* ---------- pasul 4: verificarea după criterii ---------- */
  {t:'Verifici după criterii',
   text:`<p>Profesorul îți judecă proiectul după o <strong>grilă</strong>: un tabel cu cinci <strong>criterii</strong>, adică lucrurile după care se judecă o lucrare. La fiecare criteriu primești unul dintre nivelurile din ${L(1,'Cele trei niveluri')}. Criteriile, cu vorbele grilei, la nivelul Consolidat:</p>
<ol><li><strong>Respectarea cerinței</strong>: conține tot ce s-a cerut, fără ajutor.</li>
<li><strong>Corectitudinea tehnică</strong>: operațiile cerute, corect, singur.</li>
<li><strong>Organizarea</strong>: structură proprie, clară.</li>
<li><strong>Explicația</strong> (ce am făcut și de ce): explică pașii.</li>
<li><strong>Munca proprie / sursele</strong>: citează sursele imaginilor și ale textelor.</li></ol>
<p>Nivelul proiectului este cel mai mic dintre nivelurile de la criteriile 1-4. Grila întreagă e la pasul de la calculator.</p>`,
   exemplu:`<p>Ca să te verifici, pagina îți propune și o <b>listă de autoverificare</b>, la pasul de la calculator: regulile din lecțiile 2-8, așezate de noi lângă criteriile grilei. E un ajutor, nu grila profesorului. Radu o parcurge și găsește un diapozitiv cu două idei: îl dublează (${L(5,'Dublezi un diapozitiv')}) și lasă pe fiecare câte o idee. La surse lipsea situl pozei: îl scrie pe ultimul diapozitiv.</p>`,
   altfel:`<p>Gândește-te la un lanț: ține atât cât ține cea mai slabă verigă a lui. La fel, un proiect cu imagini frumoase, dar fără ce s-a cerut, nu poate avea un nivel mai mare decât criteriul la care a rămas în urmă.</p>`,
   incearca:{t:'classify',q:'După cuvintele grilei din pas, la ce criteriu ține fiecare problemă?',
    cats:['Respectarea cerinței','Corectitudinea tehnică','Explicația','Munca proprie / sursele'],
    items:[['Proiectul nu are nicio imagine, deși cerința cerea una',0],['A apăsat Salvare, dar pe bara ferestrei scrie tot Presentation1: salvarea n-a reușit',1],['Întrebat de ce a ales poza, Radu nu știe ce să spună',2],['Poza e luată de pe un sit, dar nu scrie de pe care',3]],
    ajutor:'Caută în lista pasului cuvintele care se potrivesc: „tot ce s-a cerut”, „operațiile cerute, corect”, „ce am făcut și de ce”, „citează sursele”.',
    why:'Ce lipsește din cerință: „conține tot ce s-a cerut”. O operație nereușită, ca salvarea: „operațiile cerute, corect”. Nu poate spune de ce: „ce am făcut și de ce”. Poza fără sit: „citează sursele imaginilor”.'},
   inca:[
    {t:'choice',q:'La criteriile 1-4, proiectul Anei are nivelurile: Avansat, Consolidat, Avansat, De bază. Ce nivel are proiectul?',
     o:['De bază','Consolidat','Avansat'],ok:0,amesteca:false,
     ajutor:'Care e cel mai mic dintre cele patru niveluri?',
     why:'Nivelul proiectului e cel mai mic dintre nivelurile criteriilor 1-4: aici De bază, la explicație. Ca să urce, Ana are de lucrat întâi la explicație.'}
   ]},

  /* ---------- pasul 5: susținerea ---------- */
  {t:'Susținerea: ce spui și cum',
   text:`<p>La <strong>susținere</strong>, prezentarea o faci tu. Pornești expunerea cu <kbd>F5</kbd> (${L(2,'Expunerea: pornești și ieși')}); diapozitivele doar te ajută, iar explicația o spui tu:</p>
<ul><li>la titlu: saluți, spui tema și numele tău;</li>
<li>la cuprins: spui ce urmează;</li>
<li>la fiecare idee: explici cu vorbele tale, fără să citești de pe ecran;</li>
<li>la încheiere: spui ce să rețină colegii, mulțumești și răspunzi la întrebări, de exemplu de ce ai ales o imagine.</li></ul>
<p>Stai cu fața la clasă și te uiți la colegi, nu la ecran. Vorbești rar și clar. Durata: cam un diapozitiv pe minut de vorbit; cât timp ai îți spune profesorul.</p>`,
   exemplu:`<p><b>Repetiția, în pereche.</b> Înainte de susținere, Ioana îi prezintă proiectul colegului de bancă, încet, ca să nu-i încurce pe ceilalți: <kbd>F5</kbd>, apoi clic după clic. Colegul urmărește trei lucruri: se uită la el? citește de pe ecran? vorbește prea repede? Apoi schimbă rolurile. Ce a uitat să spună, Ioana scrie în zona de note (lecția 2).</p>`,
   altfel:`<p>Gândește-te la un ghid într-un muzeu: nu citește de pe tăblițele de lângă tablouri, ci se uită la vizitatori și le povestește. Tăblițele (diapozitivele) îl ajută doar să nu se piardă.</p>`,
   incearca:{t:'ppti',q:SIM_PPTI+'Repetiția Ioanei. Alege diapozitivul <b>4</b>, „Cum mută calul”, și scrie în zona lui de note ce va spune: <b>Arăt pe tablă o mutare a calului.</b> Apoi pornește expunerea <b>de la început</b> și mergi, clic după clic, până la ecranul negru de final.',
    start:{deck:'sahul',cur:0},
    teste:[
     {ce:'Pe „Cum mută calul” ai scris în note ce vei spune',c:[{k:'nota',d:4,min:10}],ajutor:'Clic pe miniatura 4, apoi clic în zona de note, sub diapozitiv, și scrie propoziția.'},
     {ce:'Ai pornit expunerea de la primul diapozitiv',c:[{k:'startPrimul'}],ajutor:'Tasta F5 (butonul F5 de sub fereastră) sau fila Slide Show (Expunere diapozitive) → From Beginning (De la început). Butonul din bara de stare pornește de la diapozitivul ales: alege întâi miniatura 1.'},
     {ce:'Ai mers până la ecranul negru de final',c:[{k:'ev',e:'final'}],ajutor:'Clic (sau →) până după ultimul diapozitiv.'}],
    rez:['mini-4',{nota:[4,'Arăt pe tablă o mutare a calului.']},'f5','next','next','next','next','next','next'],
    gresit:['mini-4',{nota:[4,'Arăt pe tablă o mutare a calului.']},'v:show','next','next','next'],
    rezText:'miniatura 4 → clic în zona de note → Arăt pe tablă o mutare a calului. → F5 → clic de 6 ori, până la ecranul negru',
    ajutor:'F5 pornește de la primul diapozitiv, oricare e ales. Butonul din bara de stare pornește de la diapozitivul ales.',
    why:'În expunere, publicul vede doar diapozitivele; nota ta rămâne pentru tine, ca plan. Așa repeți: de la început până la capăt, cum va vedea clasa.'},
   inca:[
    {t:'choice',q:'Pe diapozitivul tău scrie: „Calul mută în formă de L”. Ce e mai bine să faci când ajungi la el, la susținere?',
     o:['Te uiți la colegi și le arăți, cu o mutare, cum sare calul','Citești rândul de pe ecran, cu spatele la clasă','Treci repede mai departe, fiindcă scrie deja pe ecran','Citești din note tot ce ai scris, cuvânt cu cuvânt'],ok:0,
     ajutor:'Cine explică: ecranul sau tu?',
     why:'Diapozitivul spune ideea pe scurt, iar tu o explici, cu fața la colegi. Dacă citești, colegii citesc și ei, mai repede decât vorbești, și nu te mai ascultă.'},
    {t:'choice',q:'Prezentarea lui Radu are 5 diapozitive. Cam cât ține susținerea lui?',
     o:['Cam 5 minute','Cam 1 minut','Cam 20 de minute','Cam 50 de minute'],ok:0,
     ajutor:'Ultima propoziție a pasului: cam cât ține un diapozitiv?',
     why:'Cam un diapozitiv pe minut de vorbit: 5 diapozitive, cam 5 minute. Cât timp ai exact îți spune profesorul.'}
   ]}
 ],

 atelier:{t:'ppt',titlu:'Pregătește prezentarea lui Radu pentru susținere',

const AV_TOTAL=AV.reduce((n,g)=>n+g.r.length,0);
const BIFATE=new Set();
const GRILA=`<details class="grila"><summary>Grila profesorului: ce înseamnă fiecare nivel</summary>
<p>Aceeași grilă pentru orice produs (proiect, afiș, prezentare). La fiecare criteriu se bifează nivelul atins. Nivelul produsului = nivelul cel mai mic dintre criteriile 1-4: un produs nu poate fi Avansat dacă cerința nu e respectată.</p>
<div class="plan-tab"><table><thead><tr><th>Criteriul</th><th>De bază (cu sprijin, model)</th><th>Consolidat (independent)</th><th>Avansat (context nou, justificat)</th></tr></thead><tbody>
<tr><td>1. Respectarea cerinței</td><td>conține elementele cerute, cu ajutor</td><td>conține tot ce s-a cerut, fără ajutor</td><td>depășește cerința cu elemente potrivite, alese motivat</td></tr>
<tr><td>2. Corectitudinea tehnică</td><td>operațiile de bază, cu îndrumare</td><td>operațiile cerute, corect, singur</td><td>operații diverse, alese potrivit situației</td></tr>
<tr><td>3. Organizarea</td><td>structură dată de profesor</td><td>structură proprie, clară</td><td>organizare gândită pentru scopul și publicul produsului</td></tr>
<tr><td>4. Explicația (ce am făcut și de ce)</td><td>răspunde la întrebări</td><td>explică pașii</td><td>justifică alegerile și propune alternative</td></tr>
<tr><td>5. Munca proprie / sursele</td><td>folosește materialele date</td><td>citează sursele imaginilor/textelor</td><td>respectă drepturile de autor și explică de ce contează</td></tr>
</tbody></table></div></details>`;
function listaAutoverificare(){
  let h=`<div class="autover" data-autover><p class="av-cap"><span><b>Lista de autoverificare</b> · bifate: <span class="av-nr" data-av-nr>0</span> din ${AV_TOTAL}</span>
<button type="button" class="btn sm" data-av-alt>Sunt alt elev / Încep din nou</button></p>
<p style="margin:0 0 4px">O listă care te ajută să-ți verifici proiectul: regulile din lecțiile 2-8, așezate de noi lângă criteriile grilei. <b>Nu e grila profesorului</b>: grila lui e mai jos, copiată exact, iar el poate judeca un rând și altfel.</p>
<p class="hint" style="margin:0 0 4px">Bifele rămân doar cât e deschisă pagina; nu se salvează nicăieri.</p>`;
  for(const g of AV){
    h+=`<p class="av-grup">${g.g}</p>`;
    for(const [id,txt,dece] of g.r){
      h+=`<label class="av-rand"><input type="checkbox" data-av="${id}"><span>${txt}</span></label><details class="av-dece"><summary>De ce?</summary><p>${dece}</p></details>`;
    }
  }
  return h+GRILA+'</div>';
}
function avActualizeaza(){
  document.querySelectorAll('[data-autover]').forEach(box=>{
    box.setAttribute('data-av-gata','');
    box.querySelectorAll('input[data-av]').forEach(x=>{const v=BIFATE.has(x.dataset.av);if(x.checked!==v)x.checked=v});
    const n=box.querySelector('[data-av-nr]'),t=String(BIFATE.size);if(n&&n.textContent!==t)n.textContent=t;   // scrie doar ce s-a schimbat: altfel observatorul de mai jos s-ar trezi la nesfârșit
  });
}
document.addEventListener('change',e=>{
  const x=e.target&&e.target.closest&&e.target.closest('input[data-av]');if(!x)return;
  if(x.checked)BIFATE.add(x.dataset.av);else BIFATE.delete(x.dataset.av);
  avActualizeaza();
});
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest&&e.target.closest('[data-av-alt]');if(!b)return;
  BIFATE.clear();avActualizeaza();
});
/* motorul redesenează pașii la fiecare trecere: lista nou apărută primește bifele de acum */
new MutationObserver(()=>{if(document.querySelector('[data-autover]:not([data-av-gata])'))avActualizeaza()}).observe(document.body,{childList:true,subtree:true});

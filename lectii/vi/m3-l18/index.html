/* Lecția 18, clasa a VI-a (M3, predare): „Aplicația de exersare a algoritmilor: interfață și instrumente de bază”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026; planificarea
   profesorului: „mediul grafic interactiv (Scratch)”). Faptele despre editor sunt PROBATE în editorul viu (Chromium headless,
   profil temporar, fără cont, 24.10.2026: _proba\live_scratch*.py, _proba\live\rezultat.json) și în traducerea oficială
   (scratch-l10n, _proba\l10n\). Simulatorul NOU: lectii/_sim/scratch.js (proprietar: lecția aceasta; API pentru VI/19-26).
   Explorer-ul simulat (redenumire + mutare): lectii/_sim/explorer-operatii.js (lecția V/10), doar FOLOSIT.
   Granița: NU repetiția (19-23), NU „dacă”, NU variabilele, NU contul, NU „Distribuie”.
   Reparată după judecata 1 (24.10.2026): registrul _verificare/registru_j1.md, probele _proba/proba_reparatii.py. */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
/* o stivă de blocuri desenată în text (forma și culorile editorului); se desenează când apare în pagină */
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));

/* ---- ajutoare pentru testele simulatorului (pe COMPORTAMENT: programul elevului e rulat de la steag) ---- */
const A = SimScratch.ajutor;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const spuse = U => U.spuse.map(norm);
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
/* unde era pisica atunci când a spus textul (null = n-a spus) */
const spusLa = (U, text, o) => { let p = [o.x, o.y]; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune' && norm(e.valoare) === norm(text)) return p; } return null; };
const ALTUNDE = {x: -150, y: 60, directie: 90};
const PAL = ['steag', 'mergi', 'roteste_dr', 'roteste_st', 'mergi_la_xy', 'orienteaza', 'spune_sec', 'spune'];
/* „mergi la x … y: …” are 0 și 0 (în paletă, numerele lui urmează pisica: SimScratch 1.1, ca editorul) */
const zeroZero = P => { const v = A.valori(P, 'mergi_la_xy'); return v.length === 1 && +v[0][0] === 0 && +v[0][1] === 0; };

/* ---- programele lecției ---- */
const P_ATELIER = [{x: 14, y: 14, b: [['steag'], ['mergi_la_xy', 0, 0], ['spune_sec', 'Bună!', 2], ['mergi', 100], ['spune_sec', 'Am ajuns!', 2]]}];

/* ---- explorer-ul simulat (lecția V/10): calculatorul din laborator, contul Elev.
   extensii:true (reparare J1, punctul B): „.sb3” nu e un tip cunoscut de Windows, deci se vede după nume, iar
   Redenumire alege doar numele (ca la V/10: „aici extensiile se văd … Extensia rămâne aceeași”). ---- */
const D = 'C:/Users/Elev/Documents/', TIC = D + 'TIC_6A/', DL = 'C:/Users/Elev/Downloads/';
const OP = o => Object.assign({t: 'explorerop', unitati: {'C:': {nume: 'Disc local'}}, doc: D, afisat: {'C:/Users/Elev/Desktop/': 'Desktop', [DL]: 'Descărcări'},
  extensii: true, acum: '26.01.2027 10:44'}, o, {fs: ['C:/Users/Elev/Desktop/', DL, TIC, D + 'TIC_6B/'].concat(o.fs || [])});

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun.
   Reparare J1: punctul 2 spune LOCUL primului „spune” (E); 100 → 150 = „Dacă mai ai timp” (C); numele = Pisica_,
   clasa și numele (D, ca „Algoritm_” la VI/17). ---- */
const LAB = [
  'Fila Scratch s-a închis? <code>scratch.mit.edu</code> › <b>Creează</b>; meniul e în engleză? <b>Settings</b> › <b>Language</b> › <b>Română</b>; apoi <b>X</b> la filmuleț.',
  'Sub blocul galben ai „mergi la x 0 y: 0” și „mergi 10 pași” (lipsesc? Ia-le din paletă: blocul galben „când se dă click pe ⚑” din <b>Evenimente</b>, apoi „mergi la x … y: …”, în care scrii <code>0</code> și <code>0</code>, și „mergi 10 pași”). Din <b>Aspect</b>, trage „spune Salut! pentru 2 secunde” și lasă-l chiar sub „mergi la x 0 y: 0”: intră între cele două. Scrie <code>Bună!</code> în el.',
  'În „mergi 10 pași” scrie <code>100</code>. La sfârșit, sub „mergi 100 pași”, lipește încă un „spune … pentru 2 secunde”, cu <code>Am ajuns!</code>. Apasă steagul: la final, x e 100.',
  '<b>Dacă mai ai timp:</b> schimbă 100 în <code>150</code> și apasă din nou steagul: x e 150.',
  '<b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? <b>Documente</b> (sau folderul scris pe tablă), numele <code>Pisica_</code>, clasa și numele tău (de exemplu <code>Pisica_6A_Popescu</code>), <b>Salvare</b>. Spune că numele există deja? Nu (sau Anulare), adaugi prenumele, Salvare; sari la punctul 7.',
  'Nu te-a întrebat? Explorer › <b>Descărcări</b> › <b>Proiect Scratch</b> (cu ora de acum; poate cu (1)): <kbd>F2</kbd>, <code>Pisica_</code>, clasa și numele tău, <kbd>Enter</kbd>; <b>Decupare</b>, Documente › folderul tău, <b>Lipire</b>. Există deja? E al unui coleg: <b>Se omite acest fișier</b>, adaugă prenumele, mută-l din nou.',
  'Închide fila (browserul întreabă dacă pleci? Pleci: proiectul e salvat). <code>scratch.mit.edu</code> › <b>Creează</b>, <b>X</b> la filmuleț, <b>Fișier</b> › <b>Load from your computer</b>; în fereastra <b>Deschidere</b>: folderul tău, fișierul tău, <b>Deschidere</b>. Steagul: e programul tău. Închide fila.'
];

  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a VI-a',
  unitate: 'VI-U3',
  unitateTitlu: 'Algoritmi: structuri repetitive',
  competente: ['CS.2.1'],
  lectii: '18',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a VI-a, CS.2.1 „Utilizarea unui mediu grafic-interactiv pentru exersarea algoritmilor” · unitatea VI-U3 „Algoritmi: structuri repetitive” · lecția 18, predare · conținuturile „Elemente de interfață ale unei aplicații de exersare a algoritmilor” și „Instrumente de bază utilizate în exersarea algoritmilor”. Aplicația: Scratch 3, editorul online scratch.mit.edu, pe care planificarea profesorului îl numește „mediul grafic interactiv”.',
  intro: '<p><b>Ai nevoie de:</b> lecția 17 (algoritmul, secvența); din clasa a V-a: browserul, Descărcări, Explorer (Redenumire, Decupare, Lipire), Documente; lecția 3: numele fișierului, fereastra Deschidere.</p>',
  cum: '<b>Cum lucrezi:</b> „Încă un exercițiu” și „Dacă mai ai timp” sunt pentru cine termină repede.',

  nivele: [
{t: 'Aplicația de exersare a algoritmilor: interfață și instrumente de bază', final: true, lectii: [18],

 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */

   text: `<p>La lecția 17 ai scris algoritmi în cuvinte. Azi îi faci din <mark>blocuri</mark>: fiecare bloc e un pas, de exemplu <span class="blk mv">mergi 10 pași</span>, iar blocurile se prind unul sub altul, în ordinea pașilor.</p>

${fig('start-creeaza.webp', 960, 50, 'Bara de sus a paginii scratch.mit.edu în română, cu Creează încadrat', '<b>Creează</b>, pe scratch.mit.edu.')}
${fig('limba-romana.webp', 396, 432, 'Editorul Scratch în engleză: meniul Settings deschis, Language și, în lista limbilor, Română, încadrate și numerotate 1, 2, 3', '1. <b>Settings</b>, 2. <b>Language</b>, 3. <b>Română</b>.')}`,
   exemplu: `${fig('tutorial.webp', 482, 328, 'Fereastra verde a tutorialului, cu un filmuleț și butoanele Tutorials, Shrink și Close (X) sus', 'Filmulețul se închide cu <b>X</b> (Close; cu meniul în română, Închide).')}
${ACUM('Fă pașii 1-4 de mai sus, în browser. Lasă fila Scratch deschisă: lucrezi în ea și la pașii următori.')}`,

   text: `<ul><li>În stânga, <mark>paleta de blocuri</mark>, cu bulinele <mark>categoriilor</mark>. Blocurile au culoarea categoriei lor: <span class="blk mv">Mișcare</span> albastru, <span class="blk lk">Aspect</span> mov, <span class="blk ev">Evenimente</span> galben.</li>

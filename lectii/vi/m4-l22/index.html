<script>
/* Lecția 22, clasa a VI-a (M4, predare): „Structura repetitivă condiționată posterior (cu test final)”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online scratch.mit.edu, în română, FĂRĂ cont (decizia dirijorului, 23.10.2026).
   Faptele despre Scratch sunt PROBATE în editorul viu (Chromium headless, profil temporar, fără cont, rețeaua doar spre
   scratch.mit.edu, 26.10.2026: _proba\live_pana.py → live_pana.json): blocul „repetă până când” verifică ÎNAINTE (din
   x 150 pisica nu pleacă), corpul pus o dată deasupra lui face testul final (x 180), atelierul (−180 → 120, cinci „Hop!”;
   din 150 → 210, un „Hop!”), tragerea între blocuri, „Șterge blocul”.
   Simulatoarele: lectii/_sim/scratch.js (VI/18) + scratch-control.js (VI/20) + scratch-conditie.js (VI/21), doar FOLOSITE
   (Scratch n-are un bloc cu test final, deci nu e nevoie de bloc nou) · lectii/_sim/urmarire-algoritm.js (VI/17) +
   urmarire-algoritm-cattimp.js (VI/21), doar FOLOSITE + lectii/_sim/urmarire-algoritm-pana-cand.js (NOU, al lecției:
   „repetă … până când”, tabelul pe treceri, „Citește” cu mai multe valori, tipul „panaori”). Valorile din tabele și din
   exemplele de pseudocod sunt CALCULATE de interpretor, nu scrise de mână (oracolul independent: _proba\oracol_independent.py).
   Granița: NU comparația celor trei structuri (23), NU blocurile grafice / schema logică (24), NU sume / cifre (25),
   NU variabilele Scratch, NU „dacă” în Scratch, NU „întreabă și așteaptă”. */
SimScratch.stil();
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol></div>`;
const L = p => UrmarireAlgoritm.listare(p);
const UPC = UrmarirePanaCand;
const TR = (p, d) => UPC.tabelTreceri(p, d);
const afis = (p, d) => UrmarireAlgoritm.ruleaza(p, d || {}).afisari;

/* ---- ajutoare pentru testele simulatorului (pe COMPORTAMENT: programul elevului e rulat de la steag) ---- */
const A = SimScratch.ajutor, SC = SimScratchConditie;
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.!?…]+$/, '').trim();
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const spusLa = (U, text, o) => { let p = [o.x, o.y]; const r = []; for (const e of U.evenimente) { if (e.tip === 'poz') p = e.valoare; if (e.tip === 'spune' && norm(e.valoare) === norm(text)) r.push(p); } return r; };
const STRAMB = {x: -120, y: 80, directie: 0};
const PAL = ['steag', 'mergi', 'mergi_la_xy', 'orienteaza', 'pozitia_x', 'spune_sec', 'repeta_pana', 'mai_mare', 'mai_mic'];
/* abaterea spusă pe ecran (regula 9) */
const NOTA_SIM = 'În pagină sunt doar blocurile de azi (Scratch are mult mai multe), iar pisica e desenată mai simplu decât în Scratch.';
const POZ = (op, n) => [op, '', n, {s: {0: ['pozitia_x']}}];
/* programul elevului, pornit din alt x (o regulă se probează și departe de prag, ca la VI/17 și VI/21) */
const dinX = (P, x) => { const Q = JSON.parse(JSON.stringify(P)); Q.forEach(sc => sc.b.forEach(b => { if (b[0] === 'mergi_la_xy') { b[1] = x; b[2] = 0; } })); return Q; };
const ruleaza = (P, cadre) => SimScratch.urma(P, {x: 0, y: 0, directie: 90, cadre: cadre || 900});
/* „x ← start; repetă x ← x + pas până când x > prag” din caiet: unde se oprește (testul DUPĂ corp) */
const testFinal = (x, prag, pas) => { let k = 0; do { x += pas; k++; } while (!(x > prag) && k < 1000); return x; };
const treceriFinal = (x, prag, pas) => { const r = []; do { x += pas; r.push(x); } while (!(x > prag) && r.length < 1000); return r; };
/* ce spune condiția din locul în șase colțuri al primului „repetă până când”, cu pisica la x (rulată chiar de SimScratch:
   adevărată → 0 treceri, programul se termină; falsă → gura goală se repetă până la capătul cadrelor) */
const condLa = (P, x) => { const c = SC.conditia(P); if (!c) return false; return SimScratch.urma([{x: 0, y: 0, b: [['steag'], ['mergi_la_xy', x, 0], ['orienteaza', 90], ['repeta_pana', {s: {0: c}, guri: [[]]}]]}], {x: 0, y: 0, directie: 90, cadre: 20}).terminat; };
const condCaInCaiet = (P, prag) => [prag - 60, prag - 1, prag, prag + 1, prag + 60].every(x => condLa(P, x) === (x > prag));
const caCaietul = (P, prag, pas, starturi) => starturi.every(s => { const U = ruleaza(dinX(P, s)); return U.terminat && U.x === testFinal(s, prag, pas); });

/* ---- R1 (judecata 1: J1-A, J1-D, S1, S6): mesajele testelor Scratch spun STAREA programului de acum (regula 28).
   Testul își scrie mesajul când rulează (motorul și scratch.js citesc t.msg după t.ok). Stările: corpul pus deasupra
   de mai multe ori (pe telefon, două Duplică stau una peste alta), copia nelipită (pe telefon apare lângă program și
   pare lipită), blocuri sub brațul de jos, blocuri deasupra lui „orientează-te”, al doilea „mergi” pus în gură. ---- */
const ob = b => b.find(x => x && typeof x === 'object' && !Array.isArray(x)) || {};
const eCorp = b => b[0] === 'mergi' || b[0] === 'spune_sec';
const laFel = (a, b) => a[0] === b[0] && (a[0] === 'mergi' ? Number(a[1]) === Number(b[1]) : a[0] === 'spune_sec' ? norm(a[1]) === norm(b[1]) : true);
const numeBloc = b => b[0] === 'mergi' ? `„mergi ${b[1]} pași”` : b[0] === 'spune_sec' ? `„spune ${b[1]} pentru ${b[2]} secunde”` : 'un bloc';
/* de câte ori stă corpul întreg în lista l (null: l nu e făcută doar din copii ale corpului) */
const copiiCorp = (l, corp) => { if (!l.length || l.length % corp.length) return l.length ? null : 0; for (let i = 0; i < l.length; i++) if (!laFel(l[i], corp[i % corp.length])) return null; return l.length / corp.length; };
const stareProg = (P) => {
  const cuSteag = P.filter(s => s.b.length && s.b[0][0] === 'steag');
  const main = cuSteag.find(s => s.b.some(b => b[0] === 'repeta_pana')) || cuSteag[0] || {b: []};
  const iR = main.b.findIndex(b => b[0] === 'repeta_pana'), iO = main.b.findIndex(b => b[0] === 'orienteaza');
  return {
    sus: iR > 0 && iO >= 0 && iO < iR ? main.b.slice(iO + 1, iR) : [],
    preaSus: (iO > 0 ? main.b.slice(1, iO) : []).filter(eCorp),
    sub: iR >= 0 ? main.b.slice(iR + 1) : [],
    gura: iR >= 0 ? ((ob(main.b[iR]).guri || [[]])[0] || []) : [],
    libere: P.filter(s => s !== main && s.b.length && s.b[0][0] !== 'steag' && s.b.some(eCorp))
  };
};
const TINE = '(pe telefon: ții degetul pe el)';
/* o = {corp:[blocuri], nume:'„mergi 60 pași” și „spune …”'}; întoarce mesajul stării sau null */
const mesajLoc = (P, o) => {
  const S = stareProg(P), k = copiiCorp(S.sus, o.corp);
  if (S.preaSus.length) return `${numeBloc(S.preaSus[0])} e deasupra lui „orientează-te în direcția 90”: acolo pisica merge înainte să se întoarcă spre dreapta. Clic dreapta pe fiecare bloc al corpului de acolo ${TINE} › Șterge blocul. Apoi pui corpul chiar sub „orientează-te”.`;
  if (k >= 2) { const n = (k - 1) * o.corp.length;
    return `Ai pus corpul de ${k} ori deasupra lui „repetă până când”; trebuie o singură dată. ${n > 1 ? `Ștergi, unul câte unul, ${n} blocuri: de fiecare dată blocul de chiar deasupra lui „repetă până când”` : 'Ștergi blocul de chiar deasupra lui „repetă până când”'} (clic dreapta pe el › Șterge blocul; ${TINE.slice(1, -1)}). Deasupra ${o.corp.length > 1 ? 'rămân' : 'rămâne'} doar ${o.nume}.`; }
  /* T2 (judecata 2, K): deasupra sunt doar blocuri ale corpului, mai multe decât are corpul, dar nu corpul repetat întocmai
     (două copii lăsate cu mouse-ul pe același loc intră una în alta: mergi, mergi, spune, spune) → spune care rămân și ce
     se șterge. Păstrezi, de sus în jos, primul bloc potrivit al corpului, apoi pe următorul de sub el; restul se șterge. */
  if (k === null && S.sus.length > o.corp.length && S.sus.every(b => o.corp.some(c => laFel(b, c)))) {
    const tin = []; for (let i = 0; i < S.sus.length && tin.length < o.corp.length; i++) if (laFel(S.sus[i], o.corp[tin.length])) tin.push(i);
    const cap = `Deasupra lui „repetă până când” sunt ${S.sus.length} blocuri; corpul trebuie o singură dată, în ordinea asta: ${o.corp.map(numeBloc).join(', apoi ')}.`;
    if (tin.length < o.corp.length) return `${cap} Le ștergi pe toate, unul câte unul (clic dreapta pe bloc › Șterge blocul; ${TINE.slice(1, -1)}), apoi pui corpul o dată, cu Duplică.`;
    const sterse = S.sus.filter((b, i) => !tin.includes(i));
    const cate = o.corp.map(c => { const n = sterse.filter(b => laFel(b, c)).length; return n ? `${n === 1 ? 'un' : n} ${numeBloc(c)}` : ''; }).filter(Boolean).join(' și ');
    return `${cap} Păstrezi ${tin.map((i, j) => `primul ${numeBloc(S.sus[i])} ${j ? 'de sub el' : 'de sus'}`).join(' și ')}; ${sterse.length === 1 ? `celălalt bloc (${cate}) îl ștergi: clic dreapta pe el › Șterge blocul` : `celelalte ${sterse.length} blocuri (${cate}) le ștergi, unul câte unul: clic dreapta pe bloc › Șterge blocul`} (${TINE.slice(1, -1)}).`;
  }
  if (S.sub.length) {
    const ks = copiiCorp(S.sub, o.corp);
    return `Sub brațul de jos al lui „repetă până când” e ${numeBloc(S.sub[0])}: acolo se execută o dată, DUPĂ repetiție. ` + (k === 0 && ks === 1
      ? 'Trage-l de acolo (vin și blocurile de sub el) și lasă-l chiar sub „orientează-te în direcția 90”.'
      : 'Trage-l înapoi în paletă (vin și blocurile de sub el): așa se șterg.');
  }
  if (!S.sus.length && S.libere.length) {
    const n = S.libere.length;
    return `${numeBloc(S.libere[0].b[0])} de lângă program nu e lipit de el, deci nu pornește la steag (pe telefon, copia de la Duplică apare lângă program și pare lipită). Trage-l (vin și blocurile de sub el) și lasă-l chiar sub „orientează-te în direcția 90”.${n > 1 ? ` Sunt ${n} copii nelipite, poate una peste alta: o tragi pe una; pe celelalte le poți trage înapoi în paletă (așa se șterg).` : ''}`;
  }
  const kg = copiiCorp(S.gura, o.corp);
  if (kg >= 2 && (k === 0 || k === 1)) return `În gura lui „repetă până când” corpul e de ${kg} ori; acolo trebuie o singură dată. ` + (k === 0
    ? `Trage de acolo al doilea ${numeBloc(o.corp[0])} din gură (${o.corp.length > 1 || kg > 2 ? 'vin și blocurile de sub el' : 'e ultimul din gură'}) și lasă-l chiar sub „orientează-te în direcția 90”.`
    : `Trage al doilea ${numeBloc(o.corp[0])} din gură înapoi în paletă (vin și blocurile de sub el): așa se șterg.`);
  return null;
};
/* testul își pune mesajul după starea programului; msg0 = mesajul general (adevărat în orice stare) */
const CORP6 = {corp: [['mergi', 40]], nume: 'un „mergi 40 pași”'};
const CORPA = {corp: [['mergi', 60], ['spune_sec', 'Hop!', 1]], nume: '„mergi 60 pași” și „spune Hop! pentru 1 secunde”'};
const testCuMesaj = (t, mesaj) => { const ok0 = t.ok, msg0 = t.msg; t.ok = (U, P, S) => { const r = ok0(U, P, S); if (!r) { try { t.msg = mesaj(P) || msg0; } catch (e) { t.msg = msg0; } } return r; }; return t; };

/* ---- pseudocodul (valorile din exemple le calculează interpretorul) ---- */
const FORMA = ['repetă', '   rândurile care se repetă', 'până când condiție'];
const P1EX = ['x ← 3', 'repetă', '   x ← x + 5', 'până când x > 20', 'Afișează x'];
const P1INC = ['n ← 2', 'repetă', '   n ← n * 3', 'până când n > 50', 'Afișează n'];
const P1INCA = ['k ← 10', 'repetă', '   Afișează k', '   k ← k - 3', 'până când k < 0'];
const CT30 = ['x ← 30', 'cât timp x < 20 execută', '   x ← x + 5', 'sfârșit cât timp', 'Afișează x'];
const PC30 = ['x ← 30', 'repetă', '   x ← x + 5', 'până când x ≥ 20', 'Afișează x'];
const cu5 = p => ['x ← 5'].concat(p.slice(1));
const CT40 = ['n ← 40', 'cât timp n ≥ 50 execută', '   n ← n - 15', 'sfârșit cât timp', 'Afișează n'];
const PC40 = ['n ← 40', 'repetă', '   n ← n - 15', 'până când n < 50', 'Afișează n'];
const P2INCA = ['m ← 50', 'repetă', '   m ← m + 10', 'până când m > 0', 'Afișează m'];
const EX3 = ['n ← 25', 'repetă', '   n ← n - 7', 'până când n < 5', 'Afișează n'];
const SASE = ['Început', 'Citește n', 'repetă', '   n ← n - 6', 'până când n < 6', 'Afișează n', 'Sfârșit'];
const VALID = ['repetă', '   Citește nota', 'până când nota ≥ 1 ȘI nota ≤ 10', 'Afișează nota'];
const D_VALID = {nota: [12, 0, 9]};
const ZAR = ['repetă', '   Citește v', 'până când v ≥ 1 ȘI v ≤ 6', 'Afișează v'];
const SCR_CAIET = ['x ← 150', 'repetă', '   x ← x + 30', 'până când x > 100'];
const ATELIER_PS = ['x ← -180', 'repetă', '   x ← x + 60', '   Afișează „Hop!”', 'până când x > 100'];
const ATELIER_INCA = ['Citește x', 'repetă', '   x ← x + 60', 'până când x > 100', 'Afișează x'];
const T1 = UPC.treceri(P1EX, {}), T3 = UPC.treceri(EX3, {}), TV = UPC.treceri(VALID, D_VALID);

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun ---- */
const LAB = [
  'Programul de la pași e în fila Scratch, cu „mergi 30 pași” deasupra lui „repetă până când”? Treci la punctul 2. Fila e închisă? <code>scratch.mit.edu</code> › <b>Creează</b> (în engleză? <b>Settings</b> › <b>Language</b> › <b>Română</b>); fă programul din poza de la pasul „În Scratch: corpul o dată, apoi «repetă până când»” (pasul 6 din 6) și apasă steagul: x 180.',
  'În „mergi la x 150 y: 0”: clic pe 150, scrie <code>-200</code>, <kbd>Enter</kbd>. Steagul: pisica merge și se oprește la x 130, ca în caiet cu x ← -200.',
  '<b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? Folderul tău, numele <code>Final_</code>, clasa și numele tău (de exemplu <code>Final_6A_Popescu</code>), <b>Salvare</b>. Numele există deja? <b>Nu</b> (sau <b>Anulare</b>), adaugă prenumele, <b>Salvare</b>. Sari la punctul 5.',
  'Nu te-a întrebat? Explorer › <b>Descărcări</b>: fișierul <b>Proiect Scratch</b> (poate cu (1)). <kbd>F2</kbd>, <code>Final_</code>, clasa și numele tău, <kbd>Enter</kbd>; <b>Decupare</b>, folderul tău, <b>Lipire</b>. Există deja? <b>Se omite acest fișier</b>, adaugă prenumele, mută-l din nou.',

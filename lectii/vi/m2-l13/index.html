/* banda de sus: marginea unui plic de poștă aeriană (dungi roșii și albastre) și semnul @ — doar CSS */

  background:repeating-linear-gradient(-45deg,#C8102E 0 9px,transparent 9px 18px,#1F4E9C 18px 27px,transparent 27px 36px)}

<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/posta-gmail.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 13 — „Poșta electronică: cont, adresă, structura unui mesaj” (VI-U2, CS.1.3).
   Serviciul = Gmail, cu contul Google de la școală (decizia profesorului, 11.10.2026).
   Simulatorul: lectii/_sim/posta-gmail.js (proprietar: lecția aceasta; îl extind VI/14 și VI/15) — tipurile adresa, posta.
   SIGURANȚA: conturile, adresele, persoanele și mesajele sunt INVENTATE (domeniul .test e rezervat pentru exemple);
   ce tastează elevul nu se salvează și nu pleacă nicăieri (proba: _proba/proba_lectie.py, în surse.md).
   Numele din interfața Gmail/Google: pagina publică de conectare + ajutorul Gmail în română (surse.md); NESIGURE trecute acolo.
   Granița: compunerea, trimiterea, răspunsul, redirecționarea, atașarea = lecția 14; etichete, contacte, netichetă = 15.
   Reparată după judecata 1 (12.10.2026): registrul în _verificare/registru_j1.md, schimbările în surse.md §11.
   ====================================================================================================== */
const CONT=['Poșta electronică (email): conturi, adresă de poștă electronică, structura unui mesaj transmis prin poșta electronică'];
const fig=(f,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m2-l13/img/${f}" target="_blank"><img src="../m2-l13/img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;

/* ---------------- conturile și mesajele inventate ---------------- */
const D=SimPostaGmail.DOMENIU;                      // scoala-exemplu.test
const K=SimPostaGmail.CONTURI;                      // ioana, andrei, sofia (adresă, nume, parolă inventată)
const om=(nume,adresa)=>({nume,adresa});
const PROF=om('Mihai Stan','mihai.stan@'+D), DIRIG=om('Elena Matei','elena.matei@'+D);
const ANDREI=om(K.andrei.nume,K.andrei.adresa), SOFIA=om(K.sofia.nume,K.sofia.adresa);
const MESAJE_ANDREI=[
  {id:'concurs',lista:'primite',de:PROF,catre:[ANDREI],cc:[DIRIG],subiect:'Concursul de informatică',data:'10 dec.',ora:'09:30',
   corp:'Bună ziua, Andrei,\nTe-ai calificat la etapa pe școală a concursului. Ne vedem marți, la ora 13, în laboratorul de informatică.',
   semnatura:'Mihai Stan\nProfesor de informatică'},
  {id:'antrenament',lista:'primite',de:om('Vlad Munteanu','vlad.munteanu@'+D),catre:[ANDREI],subiect:'Antrenament joi',data:'9 dec.',ora:'18:12',citit:true,
   corp:'Salut! Joi antrenamentul începe la 4, nu la 5.',semnatura:'Vlad'},
  {id:'carte',lista:'primite',de:om('Biblioteca școlii','biblioteca@'+D),catre:[ANDREI],subiect:'Cartea ta e gata',data:'8 dec.',ora:'11:00',citit:true,
   corp:'Cartea pe care ai cerut-o te așteaptă la bibliotecă, până vineri.',semnatura:'Biblioteca școlii'},
  {id:'bunicul',lista:'trimise',de:ANDREI,catre:[om('Bunicul Petre','bunicul.petre@posta-exemplu.test')],subiect:'La mulți ani, bunicule!',data:'7 dec.',ora:'08:05',citit:true,
   corp:'Dragă bunicule,\nÎți doresc sănătate și multă bucurie!',semnatura:'Andrei'},
  {id:'plansa',lista:'nefinalizate',de:ANDREI,catre:[om('Vlad Munteanu','vlad.munteanu@'+D)],subiect:'Planșa pentru proiect',data:'9 dec.',ora:'21:40',citit:true,
   corp:'Salut, Vlad! Eu aduc'},
  {id:'telefon',lista:'spam',de:om('Premii Mari','premii@castiga-acum.test'),catre:[ANDREI],subiect:'Câștigă un telefon nou!',data:'9 dec.',ora:'04:20',
   corp:'Ai fost ales! Scrie-ne adresa ta și parola contului.'},
  {id:'confirma',lista:'spam',de:om('Securitate Cont','securitate@g00gle-cont.test'),catre:[ANDREI],subiect:'Confirmă-ți parola acum',data:'8 dec.',ora:'03:02',
   corp:'Contul tău va fi șters dacă nu ne trimiți parola în 24 de ore.'},
  {id:'jucarii',lista:'cos',de:om('Magazinul Exemplu','oferte@magazin-exemplu.test'),catre:[ANDREI],subiect:'Reduceri la jucării',data:'5 dec.',ora:'10:00',citit:true,
   corp:'Reduceri doar azi!'}];
const MESAJE_SOFIA=[
  {id:'serbare',lista:'primite',de:DIRIG,catre:[SOFIA],subiect:'Repetiția pentru serbare',data:'10 dec.',ora:'14:00',
   corp:'Dragă Sofia,\nRepetiția e mâine, după ore, în sala de festivități.',semnatura:'Elena Matei\nDiriginta clasei a VI-a A'},
  {id:'mama',lista:'primite',de:om('Mama','mama.sofiei@posta-exemplu.test'),catre:[SOFIA],subiect:'Te iau la 2',data:'10 dec.',ora:'07:30',
   corp:'Puiule, azi te iau eu de la școală, la ora 2.',semnatura:'Mama'},
  {id:'poveste',lista:'trimise',de:SOFIA,catre:[om('Ana Dima','ana.dima@'+D)],subiect:'Povestea scrisă de mine',data:'9 dec.',ora:'16:45',citit:true,
   corp:'Uite povestea despre vulpe. Spune-mi dacă îți place!',semnatura:'Sofia'}];
const ID_SOFIA=MESAJE_SOFIA.map(m=>m.id);

/* sarcinile în căsuța simulată (tipul „posta” din posta-gmail.js) */
const P_=o=>Object.assign({t:'posta'},o);

const LECTIA={
 t:'Poșta electronică: cont, adresă, structura unui mesaj',lectii:[13],continuturi:CONT,final:true,
 obiectiv:'știi cum arată adresa ta de la școală, intri în Gmail și ieși din cont pe calculatorul comun, știi ce faci dacă ai uitat parola, găsești mesajele în meniul principal și numești părțile unui mesaj.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Știi din clasa a V-a: <mark>poșta electronică</mark> (e-mailul; în engleză, <b>email</b>) duce scrisori prin Internet. Mesajul <strong>așteaptă</strong> în căsuța poștală a celuilalt până îl deschide; la chat, vorbiți pe loc.</p>
<p>La școală ai un cont Google, cu care intri în <mark>Gmail</mark>, serviciul de poștă electronică al Google. Azi afli cum arată adresa ta, cum intri în cont și cum ieși, ce faci dacă ai uitat parola, unde stau mesajele și din ce părți e făcut un mesaj.</p>
${fig('cutii-postale.webp',560,569,'Un perete cu multe cutii poștale de metal, așezate pe rânduri, fiecare cu un număr scris pe ea și o broască de cheie, în holul unui bloc','Pe fiecare cutie poștală e scris numărul apartamentului, ca poștașul să știe unde lasă scrisoarea. La e-mail e la fel: fiecare căsuță are adresa ei. Fotografie: Marek Ślusarczyk (Tupungato), <a href="https://creativecommons.org/licenses/by/3.0" target="_blank" rel="noopener">CC BY 3.0</a>, <a href="https://commons.wikimedia.org/wiki/File:04_Mailboxes_in_lobby_of_apartment_building_in_Spain,_common_area_in_apartment_building.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> din clasa a V-a, poșta electronică, adresa cu <code>@</code>, browserul și bara de adrese (lecțiile 13-14); din lecția 12: contul, parola, ieșirea din cont, mesajul-capcană.</p>`},
  /* ---------- pasul: contul și adresa ---------- */
  {t:'Contul și adresa de e-mail',
   text:`<p>Contul tău de la școală are o <mark>adresă de e-mail</mark>, la care îți vin mesajele, și o parolă. Adresa are două părți, despărțite de <code>@</code> („a rond”):</p>
<ul><li>înainte de <code>@</code>, <mark>numele de utilizator</mark>: al cui e contul, de obicei prenumele, un punct și numele;</li>
<li>după <code>@</code>, <mark>domeniul</mark>: al școlii, același pentru toți elevii ei. Are cel puțin un punct.</li></ul>
<p>Adresa nu are spații și nici diacritice. Fiecare elev are numele lui înainte de <code>@</code>, deci adresa ta e alta decât a colegului: așa ajunge fiecare mesaj la cine trebuie. Adresa ta exactă o afli de la profesor.</p>`,
   exemplu:`<p>Ioana Rusu și Radu Ene sunt colegi. Adresele lor (inventate, ca toate din lecție; terminația <code>.test</code> e doar pentru exemple): ${C_('ioana.rusu@scoala-exemplu.test')} și ${C_('radu.ene@scoala-exemplu.test')}. După <code>@</code>, același domeniu; înainte, numele fiecăruia.</p>
<p>Verifici o adresă semn cu semn: un singur <code>@</code>, fără spații, fără diacritice, ceva înainte și după <code>@</code>, punct în domeniu. ${C_('ioana rusu@scoala-exemplu.test')} e greșită: are un spațiu.</p>`,
   altfel:`<p>Gândește-te la un plic. Pe el scrii școala (domeniul, după <code>@</code>) și numele copilului (numele de utilizator, înainte de <code>@</code>). Toți colegii au aceeași școală pe plic, dar fiecare are numele lui: de aceea scrisoarea ta nu ajunge la colegul de bancă.</p>`,
   incearca:{t:'adresa',mod:'scrie',prenume:'Bianca',nume:'Dobre',domeniu:D,
     q:`Bianca Dobre e elevă la aceeași școală, cu domeniul ${C_(D)}. Scrie adresa ei, după regula din pas. Testele se bifează cât scrii.`,
     ajutor:'Înainte de @: prenumele, un punct, numele, fără diacritice (de obicei, cu litere mici). După @: domeniul școlii.',
     why:'Înainte de @ sunt prenumele și numele ei, după @ domeniul școlii. Colegii au același domeniu, dar alt nume înainte de @.'},
   inca:[
    {t:'adresa',mod:'scrie',prenume:'Ștefan',nume:'Țurcanu',domeniu:D,gresit:'ștefan.țurcanu@'+D,
     q:`Ștefan Țurcanu e colegul Biancăi. Scrie adresa lui de la școală. Atenție la diacritice!`,
     ajutor:'Adresa nu are diacritice: Ș devine s, Ț devine t.',
     why:'Fără diacritice, cu litere mici: stefan.turcanu, apoi @ și domeniul școlii.'},
    {t:'adresa',mod:'desparte',adresa:'mara.olaru@'+D,
     q:'Desparte adresa de mai jos: scrie numele de utilizator în prima căsuță și domeniul în a doua.',
     ajutor:'Tot ce e înainte de @ e numele de utilizator; tot ce e după @ e domeniul. Semnul @ nu intră în căsuțe.',
     why:'Numele de utilizator spune al cui e contul (mara.olaru), domeniul spune al cui e serviciul: al școlii.'},
    {t:'hunt',q:'În lista clasei, câteva adrese sunt scrise greșit. Apasă pe fiecare adresă greșită, apoi pe Verifică.',
     src:`bianca.dobre@${D} [[radu ene@${D}|are un spațiu]] [[mara.olaru@@${D}|are doi @]] stefan.turcanu@${D} [[ioana.rusu.${D}|nu are @]] [[sofia.ilie@scoala-exemplu|domeniul nu are punct]]`,
     indiciu:'Treci prin regula din „Uite cum”: un singur @, fără spații, ceva înainte și după @, punct în domeniu.',
     ajutor:'La fiecare adresă: câte @ are? Are spațiu? Are punct după @?',
     why:'O adresă bună are un singur @, niciun spațiu, ceva de o parte și de alta a lui @ și un punct în domeniu.'}
   ]},
  /* ---------- pasul: intri în cont ---------- */
  {t:'Intri în cont: conectarea la Gmail',
   text:`<p>Ca să-ți citești mesajele, intri în cont, adică te <mark>conectezi</mark>:</p>
<ol><li>În bara de adrese a browserului scrii ${C_('gmail.com')} și apeși <kbd>Enter</kbd>.</li>
<li>Se deschide pagina „Conectează-te” (Sign in). Uită-te în bara de adrese: acum apare ${C_('accounts.google.com')}. Parola o scrii doar aici.</li>
<li>În căsuța „Adresa de e-mail sau numărul de telefon” (Email or phone) scrii adresa ta și apeși <b>Înainte</b> (Next).</li>
<li>Pe pagina următoare scrii parola și apeși iar <b>Înainte</b>.</li></ol>
<p>Google spune că parola e greșită? O mai scrii o dată, atent. Ai uitat-o? Nu-ți faci alt cont și nu ghicești: îi spui profesorului. El sau <mark>administratorul</mark> conturilor școlii (cel care se ocupă de ele) îți dă o parolă nouă.</p>`,
   exemplu:`<p>Andrei scrie ${C_('gmail.com')} și apasă <kbd>Enter</kbd>. Pe pagina „Conectează-te” scrie ${C_(K.andrei.adresa)} și apasă Înainte. Greșește o literă din parolă: Google îi spune că parola e greșită. O scrie din nou, atent, apasă Înainte și se deschide căsuța lui.</p>
<p>A doua zi a uitat parola. Nu apasă „Creează un cont” și nu încearcă parole la întâmplare: îi spune profesorului și primește una nouă. Dacă Google îi cere apoi una a lui, face o frază-parolă, ca la lecția 12.</p>`,
   altfel:`<p>E ca la intrarea în școală: întâi îi spui paznicului cine ești (adresa), apoi îi arăți carnetul de elev, pe care îl ai doar tu (parola). Dacă ți l-ai pierdut, nu-ți faci altul singur: îi spui dirigintelui, iar școala îți dă unul nou.</p>`,
   incearca:P_({q:`Intră în contul inventat al lui Andrei, în căsuța de exersare de mai jos. Adresa: ${C_(K.andrei.adresa)}. Parola (inventată): ${C_(K.andrei.parola)}. Pornești de la o filă nouă.`,
     sim:{start:'fila',cont:K.andrei,mesaje:MESAJE_ANDREI},
     teste:[{c:'bara'},{c:'conectat',v:'lui Andrei'}],gresit:{adresa:K.andrei.adresa.replace('.',' ')},
     ajutor:'Sus, în bara de adrese: gmail.com și Enter. Apoi adresa lui Andrei, Înainte, parola, Înainte. Copiază-le semn cu semn.',
     arata:'bara de adrese: gmail.com și Enter; adresa lui Andrei, Înainte; parola, Înainte.',
     why:'Ai intrat în cont: adresa, Înainte, parola, Înainte. La fel intri și în contul tău de la școală.'}),
   inca:[
    {t:'choice',q:'Bianca nu-și mai amintește parola contului de la școală. Ce face?',
     o:['Îi spune profesorului, ca să primească o parolă nouă','Apasă „Creează un cont” și își face alt cont','Încearcă la rând parolele pe care le știe de la colegi','Îi cere colegei de bancă parola ei, ca să intre azi'],ok:0,
     ajutor:'Ultimul paragraf al pasului.',
     why:'La contul de la școală, parola nouă o dă profesorul sau administratorul conturilor. Alt cont sau parola altcuiva nu rezolvă nimic: mesajele tale sunt în contul tău.'},
    P_({q:`Intră în contul inventat al Sofiei: ${C_(K.sofia.adresa)}, parola ${C_(K.sofia.parola)}. De data asta pagina de conectare e deja deschisă.`,
     sim:{start:'conectare',cont:K.sofia,mesaje:MESAJE_SOFIA},teste:[{c:'conectat',v:'Sofiei'}],gresit:{adresa:'sofia.ilie@scoala-exemplu'},
     ajutor:'Adresa întreagă, cu @ și cu domeniul, apoi Înainte; parola, apoi Înainte.',
     arata:'adresa Sofiei, Înainte; parola, Înainte.',
     why:'Adresa trebuie scrisă întreagă și exact: o literă sau un punct lipsă și contul nu se găsește.'})
   ]},
  /* ---------- pasul: calculatorul comun ---------- */
  {t:'Pe calculatorul comun: refuzi salvarea parolei, ieși din cont',
   text:`<p>Pe calculatorul din laborator lucrează mulți elevi. Ca nimeni să nu intre în contul tău:</p>
<ul><li>Browserul te întreabă dacă salvează parola sau altceva despre contul tău? <b>Refuzi</b>: <b>✕</b> din colțul întrebării, „Nu acum” sau „Niciodată”. Nu apeși <b>Salvează</b> (Save).</li>
<li>La final <mark>ieși din cont</mark> (te deconectezi): în dreapta sus apeși <b>Profil</b> (cerculețul cu inițiala sau poza ta), apoi <b>Deconectează-te</b> (Sign out). Scrie <b>Deconectează-te de la toate conturile</b> (Sign out of all accounts)? Pe acela îl apeși.</li></ul>
${ACUM(`La laborator: filă nouă (<b>+</b>), ${C_('gmail.com')}, <kbd>Enter</kbd>. E deschisă căsuța cuiva? Nu citești nimic: Profil, Deconectează-te. Vezi „Conectează-te” sau o listă de conturi? Nu te conectezi.`,'Închide fila cu <b>×</b>.')}`,
   exemplu:`<p>Ioana se conectează. Browserul o întreabă dacă salvează parola (în Chrome: „Salvezi parola?”): ea apasă ✕. Apoi o întreabă dacă se conectează și la browser: tot ✕. La sfârșitul orei apasă Profil, apoi Deconectează-te. Dacă ar fi apăsat din greșeală Salvează, ar fi ieșit tot din cont și i-ar fi spus profesorului înainte să plece: el șterge parola din browser.</p>
<p>Radu vine după ea și găsește deschis contul altcuiva. Nu citește nimic: apasă Profil și Deconectează-te.</p>`,
   altfel:`<p>E ca dulăpiorul de la sala de sport: când pleci, îl încui și iei cheia cu tine. Dacă îl lași deschis, oricine umblă prin lucrurile tale. Iar dacă găsești dulapul altuia deschis, nu te uiți înăuntru: doar îl închizi.</p>`,
   incearca:P_({q:'Te așezi la calculator și vezi că a rămas deschis contul Sofiei, o colegă de la ora trecută. Fă ce scrie în pas.',

  /* ---------- pasul: meniul principal ---------- */
  {t:'Unde stau mesajele: meniul principal',
   text:`<p>În Gmail, în stânga, e <mark>meniul principal</mark>. Fiecare rând deschide o listă de mesaje:</p>
<ul><li><b>Mesaje primite</b> (Inbox): ce ți-au trimis alții;</li>
<li><b>Trimise</b> (Sent): ce ai trimis tu;</li>
<li><b>Mesaje nefinalizate</b> (Drafts; uneori scrie „Schițe”): mesaje începute și încă netrimise;</li>
<li><b>Spam</b>: mesaje nedorite (reclame, capcane), mutate acolo de Gmail. Pe acestea nu le deschizi;</li>
<li><b>Coș de gunoi</b> (Trash): mesajele șterse; după 30 de zile dispar de tot.</li></ul>
<p>Spam și Coș de gunoi apar după ce apeși <b>Mai multe</b> (More). Un mesaj îl deschizi cu un clic pe el, în listă. Gmail-ul tău e în engleză? Numele sunt cele din paranteze.</p>`,
   exemplu:`<p>Andrei caută mesajul profesorului despre concurs: l-a primit, deci e în Mesaje primite. Felicitarea scrisă bunicului e în Trimise. Mesajul despre planșă, început aseară și netrimis, e în Mesaje nefinalizate. Ca să vadă câte reclame nedorite are, apasă Mai multe, apoi Spam, și doar se uită la listă.</p>`,

  /* ---------- pasul: părțile unui mesaj ---------- */
  {t:'Părțile unui mesaj',
   text:`<p>Un mesaj deschis are mereu aceleași părți:</p>
<ul><li><b>De la</b> (from): <mark>expeditorul</mark>, cine l-a trimis: numele lui și, lângă, adresa;</li>
<li><b>Către</b> (to): <mark>destinatarul</mark>, cui i-a fost trimis;</li>
<li><b>Cc</b>: cine mai primește o copie, doar ca să știe (nu toate mesajele au);</li>
<li><b>Subiectul</b> (subject): titlul scurt, scris sus;</li>
<li><b>corpul</b>: textul mesajului;</li>
<li><b>semnătura</b>: rândurile de la sfârșit, cu numele celui care a scris.</li></ul>
<p>Expeditorul, destinatarul, Cc și subiectul le vezi una sub alta cu săgeata ▾ de lângă „către”, sub numele expeditorului: <b>Afișează detaliile</b> (Show details). Corpul și semnătura sunt în mesaj, dedesubt.</p>`,
   exemplu:`<p>Mesajul profesorului către Andrei: sus, subiectul „Concursul de informatică”. Dedesubt, expeditorul: Mihai Stan, cu adresa ${C_('mihai.stan@scoala-exemplu.test')}. Cu săgeata ▾ vezi: către ${K.andrei.nume}, cc: Elena Matei, diriginta. Urmează corpul („Te-ai calificat…”), iar la sfârșit semnătura: „Mihai Stan, Profesor de informatică”.</p>`,
   altfel:`<p>E ca o scrisoare în plic. Pe plic scrie de la cine vine (expeditorul) și pentru cine e (destinatarul). Subiectul e un titlu scris pe plic. În plic e scrisoarea (corpul), iar la sfârșitul ei, numele celui care a scris (semnătura). Cc e o copie a scrisorii, dată altcuiva ca să știe și el.</p>`,

/* „Acum la calculatorul din laborator”: Gmail-ul adevărat, cu contul elevului de la școală; fără profesor; gesturi mici.
   Cine nu-și știe parola (sau adresa) face aceiași pași în căsuța de exersare (atelierul) și îi spune profesorului la final. */
const ATELIER='<a href="?pas=atelier">atelierul lecției</a>';
const PASI_REAL=[
  'Scrie întâi în caiet adresa ta de la școală, dacă o știi: o vei copia de acolo. Lecția rămâne deschisă în fila ei. Deschide o filă nouă: clic pe <b>+</b>, în dreapta filei lecției (sau ții apăsat <kbd>Ctrl</kbd> și apeși <kbd>T</kbd>). Fila nouă acoperă lecția: ca să citești pasul următor, faci clic pe fila lecției, apoi din nou pe fila Gmail. La sfârșit închizi fila Gmail cu <b>×</b> de pe ea; fereastra browserului NU o închizi (cu ✕ din colțul ei de sus): s-ar închide și lecția. Gmail-ul tău e în engleză? Numele sunt cele din paranteze.',
  `În bara de adrese a filei noi scrie ${C_('gmail.com')} și apasă <kbd>Enter</kbd>. Se deschide direct căsuța cuiva (un coleg a uitat să iasă)? Nu citești nimic: apeși <b>Profil</b>, în dreapta sus, apoi <b>Deconectează-te</b> (Sign out) sau, dacă scrie așa, <b>Deconectează-te de la toate conturile</b> (Sign out of all accounts). Altfel, uită-te în bara de adrese: acum apare ${C_('accounts.google.com')}.`,
  `Pe pagina „Conectează-te” (Sign in), în căsuța „Adresa de e-mail sau numărul de telefon” (Email or phone), scrie adresa ta de la școală, semn cu semn, și apasă <b>Înainte</b> (Next). Apare în loc o listă cu conturile folosite înainte pe calculatorul acesta? Nu alegi contul altcuiva: apeși rândul pentru alt cont (scrie ceva de felul „Folosește alt cont”; în engleză: Use another account) și scrii adresa ta. Nu ești sigur de adresă? Te oprești aici: închizi fila cu ×, faci din nou ${ATELIER} și, la final, îl întrebi pe profesor.`,
  `Scrie parola și apasă <b>Înainte</b>. Google spune că parola e greșită? Mai scrie-o o dată, atent la literele mari și mici, la cifre și la semne. Nici a doua oară nu merge sau ai uitat-o? Nu mai încerca parole și nu apeși „Creează un cont” (Create account): închizi fila cu ×, faci din nou ${ATELIER} și, la final, îi spui profesorului că ai nevoie de o parolă nouă. Dacă Google îți cere o parolă nouă (se întâmplă după ce profesorul ți-a dat una), faci o frază-parolă, ca la lecția 12, și o spui acasă părinților.`,
  'Browserul te întreabă dacă salvează parola (în Chrome: „Salvezi parola?”; în Edge, cu alte cuvinte) sau altceva despre contul tău (de exemplu, dacă te conectezi și la browser)? Refuzi: <b>✕</b> din colțul întrebării, „Nu acum” sau „Niciodată”. Nu apeși <b>Salvează</b> (Save). Ai apăsat-o din greșeală? Faci restul pașilor, ieși din cont la pasul de ieșire și îi spui profesorului înainte să pleci din laborator: el șterge parola din browser.',
  'Apare o fereastră pe care n-o știi (de exemplu un „Bun venit” cu condiții sau o întrebare despre numărul de telefon)? Nu apeși la întâmplare: ridici mâna și îl întrebi pe profesor; până vine, nu pleci de la calculator. Dacă nu apare nimic de felul acesta, treci mai departe.',
  'În stânga, în meniul principal, apasă pe rând <b>Trimise</b> (Sent), <b>Mesaje nefinalizate</b> (Drafts; uneori „Schițe”), apoi <b>Mai multe</b> (More) și <b>Spam</b>: te uiți doar la listă, nu deschizi mesajele de acolo. La final apasă <b>Mesaje primite</b> (Inbox).',
  'Deschide un mesaj din Mesaje primite cu un clic pe el (dacă n-ai niciunul, unul din Trimise; dacă nu ai niciun mesaj, sari peste pasul acesta). Apasă săgeata ▾ de lângă „către” (Afișează detaliile; în engleză: Show details). Găsește și scrie în caiet: expeditorul (adresa lui), destinatarul, subiectul și semnătura, dacă are. Apoi apasă <b>Mesaje primite</b>, în stânga, ca să te întorci la listă.',
  'Ieși din cont: în dreapta sus apasă <b>Profil</b> (cerculețul cu inițiala sau cu poza ta), apoi <b>Deconectează-te</b> (Sign out). Dacă scrie <b>Deconectează-te de la toate conturile</b> (Sign out of all accounts), pe acela îl apeși. Verifică: nu mai e niciun cont deschis; apare pagina de conectare sau o listă de conturi, în care contul tău apare ca deconectat.',
  'Închide fila Gmail cu <b>×</b> de pe ea (nu fereastra). Fila lecției rămâne. Contul tău nu mai e deschis: adresa ta poate rămâne în lista de conturi, dar fără parolă nu intră nimeni. Pe fila lecției apasă <b>La verificare →</b> și răspunde la cele 5 întrebări.'
];

<title>Reguli de estetică și ergonomie. Reguli de susținere a unei prezentări</title>
<meta name="description" content="Lecția 8, clasa a VI-a (TIC): faci diapozitivele să arate la fel și ordonat, le verifici cu o listă (se citesc din ultima bancă?), apoi îți susții prezentarea: privești publicul, folosești notele și Vizualizarea prezentatorului, ții timpul. Cu PowerPoint simulat în pagină și o prezentare de reparat și de susținut, în perechi, la calculatorul din laborator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --desk:#EEF2F0; --paper:#FFFFFF; --paper2:#F4F8F6; --line:#D3DFDA;
  --ink:#14211D; --ink2:#4E5F59; --accent:#0F6B5C; --accentInk:#FFFFFF; --sel:#D6EEE8;
  --mark:#FFE08A; --markInk:#14211D; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Crimson Pro",Georgia,serif; --fb:"Onest","Segoe UI",system-ui,sans-serif; --fm:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0E1614; --paper:#16211E; --paper2:#1C2A26; --line:#2E403B;
  --ink:#E6F0EC; --ink2:#A9BDB6; --accent:#6FD6C1; --accentInk:#0E1614; --sel:#1F4A41;
  --mark:#F2C94C; --markInk:#14211D; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#0E1614; --paper:#16211E; --paper2:#1C2A26; --line:#2E403B;
  --ink:#E6F0EC; --ink2:#A9BDB6; --accent:#6FD6C1; --accentInk:#0E1614; --sel:#1F4A41;
  --mark:#F2C94C; --markInk:#14211D; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: diapozitive cu titlul și rândurile aliniate la stânga, același aspect pe toate, apoi un cronometru
   (ca în Vizualizarea prezentatorului) — doar CSS */
.banda{display:flex;gap:8px;padding:6px 12px;min-height:36px;align-items:center}
.banda span{flex:0 0 auto;width:40px;height:23px;border:1px solid var(--ink2);border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent)) 5px 4px/18px 3px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 5px 10px/24px 2px no-repeat,
  linear-gradient(var(--ink2),var(--ink2)) 5px 14px/20px 2px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 5px 18px/22px 2px no-repeat}
.banda .ceas{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);background:
  linear-gradient(var(--accent),var(--accent)) 50% 20%/2px 7px no-repeat,linear-gradient(var(--accent),var(--accent)) 70% 50%/6px 2px no-repeat}
h1{font-size:clamp(1.7rem,6.6vw,2.9rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.ingusta img{max-width:300px}
figure.captura.mica img{max-width:440px}
.reading ol li,.reading ul li{margin:.2em 0}
.descarca{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;font-weight:600;text-decoration:none}
/* diapozitivele-exemplu: câte două-trei pe rând pe ecran lat, câte unul pe telefon */
.diap-grila{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;margin:.4em 0}
.diap-grila .captura{margin:.2em 0 .4em}
.diap-grila .captura img{width:100%;max-height:none}
.q .diap-grila .captura img{max-height:none;width:100%}
.diap-grila figcaption{font-size:.95rem}
.lista-verif{padding-left:1.4em}
.lista-verif li{margin:.15em 0}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>

<script src="../../_sim/simppt.js"></script>

<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 8 — „Reguli de estetică și ergonomie. Reguli de susținere a unei prezentări”.
   Simulatoarele: lectii/_sim/simppt.js + simppt-formatare.js (PowerPoint cu formatare, lecția 6) + simppt-estetica.js
   (testele fmtFont, fmtFontToate, fmtMaiMare, caseta Font și Comic Sans pe telefon; proprietar: lecția 8) +
   simppt-interfata.js (doar tipul `zona`, lecția 2). Faptele despre PowerPoint sunt probate în PowerPoint-ul real, pe
   desktopul ascuns (afirmatii.json, _proba/). Diapozitivele-exemplu sunt desenate de PowerPoint (Slide.Export,
   _proba/fa_pptx.py), cu conținut inventat.
   Trimiterile între pași se fac după NUMELE pasului (judecătorul, M1): numărul de pe ecran („pasul 4 din 6”) îl pune motorul.
   ====================================================================================================== */
const SF=SimPPTFormatare, P=SF.pas, DP=SF.diap;
const FX=(s,fx)=>Object.assign(s,{fx});
const ALB={t:'bg1',v:0},NEGRU={t:'tx1',v:0},BLEUMARIN={rgb:'#002060'};
SF.prezentari({
  /* pasul „Același aspect”: un titlu cu alt font */
  l8_p2:()=>[DP('d1','title',{titlu:'Munții României',sub:'Clasa a VI-a'}),
    DP('d2','tc',{titlu:'Carpații',c1:'Formează un arc\nAu vârfuri înalte'}),
    FX(DP('d3','tc',{titlu:'Munții Rodnei',c1:'Sunt în nordul țării\nAu lacuri glaciare'}),{ph:{titlu:{font:{n:'Comic Sans MS'}}}}),
    DP('d4','tc',{titlu:'Ce am aflat',c1:'Munții noștri sunt în arc\nFiecare are ceva deosebit'})],
  /* pasul „Lista de verificare”: întrebările 3-4 (litere mari, contrast) */
  l8_p1:()=>[DP('d1','title',{titlu:'Livada',sub:'Clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Merele',c1:'Sunt roșii sau galbene\nSe culeg toamna\nDin ele facem suc'}),{ph:{c1:{pt:18,cul:{rgb:'#00B0F0'}}}})],
  /* atelierul = prezentarea de descărcat (padurea-de-reparat.pptx, făcută prin COM: _proba/fa_pptx.py) */
  l8_atelier:()=>[DP('d1','title',{titlu:'Pădurea',sub:'Maria Ionescu, clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Copacii pădurii',c1:'Stejarul și fagul\nBradul și molidul\nMesteacănul'}),{ph:{c1:{pt:16}}}),
    FX(DP('d3','tc',{titlu:'Animalele pădurii',c1:'Ursul și lupul\nCăprioara\nVeverița'}),{ph:{titlu:{font:{n:'Comic Sans MS'}}}}),
    FX(DP('d4','tc',{titlu:'Cum ocrotim pădurea',c1:'Nu lăsăm gunoaie\nNu aprindem focul\nPlantăm copaci'}),{bg:{cul:BLEUMARIN},ph:{titlu:{cul:ALB},c1:{cul:{rgb:'#FF0000'}}}}),
    DP('d5','tc',{titlu:'Ce am aflat',c1:'Pădurea e casa animalelor\nCopacii ne dau aer curat\nO ocrotim împreună'})],
  /* verificarea 2 (sora pasului „Același aspect”: rândurile, nu titlul) */
  l8_q2:()=>[DP('d1','title',{titlu:'Râurile României',sub:'Clasa a VI-a'}),
    FX(DP('d2','tc',{titlu:'Dunărea',c1:'Trece prin zece țări\nSe varsă în Marea Neagră'}),{ph:{c1:{font:{n:'Times New Roman'}}}}),
    DP('d3','tc',{titlu:'Oltul',c1:'Trece prin Carpați\nSe varsă în Dunăre'})]
});

/* ---------------- imaginile ---------------- */
const IMG={
  'ex1-inainte':[480,270],'ex1-dupa':[480,270],'p1-a':[480,270],'p1-b':[480,270],'p1-c':[480,270],'p1-d':[480,270],
  'q1-a':[480,270],'q1-b':[480,270],'q1-c':[480,270],'q1-d':[480,270],
  'ex2-inainte-1':[480,270],'ex2-inainte-3':[480,270],'ex2-dupa-1':[480,270],'ex2-dupa-2':[480,270],
  'ex3-inainte':[480,270],'ex3-dupa':[480,270],'p3-a':[480,270],'p3-b':[480,270],'p3-c':[480,270],'p3-d':[480,270],
  'q3-a':[480,270],'q3-b':[480,270],'q3-c':[480,270],'p4':[480,270],'p4b':[480,270],
  'lista-font':[376,360],'caseta-font-comic':[760,292],'note-cuvinte-cheie':[605,120],'prezentator':[1000,563],'prezentator-zone':[1000,563]
};
const fig=(f,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="../m2-l08/img/${f}.webp" target="_blank"><img src="../m2-l08/img/${f}.webp" alt="${alt}" width="${IMG[f][0]}" height="${IMG[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const figDin=(cale,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${cale}" target="_blank"><img src="${cale}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const D=(f,lit,alt,cap)=>fig(f,alt,cap||`Diapozitivul <b>${lit}</b>`);
const grila=(...f)=>`<div class="diap-grila">${f.join('')}</div>`;
const CC='<a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>';
const FOTO_ALB='<p class="hint">Fotografia albinei: John Severns, domeniu public, Wikimedia Commons.</p>';
const FOTO_AMBELE=`<p class="hint">Fotografii: John Severns (albina, domeniu public) și Ibrahim Husain Meraj (baloanele, ${CC}), Wikimedia Commons.</p>`;
const FOTO_BAL=`<p class="hint">Fotografia baloanelor: Ibrahim Husain Meraj, ${CC}, Wikimedia Commons.</p>`;
const IMG_PV={src:'../m2-l08/img/prezentator-zone.webp',w:1000,h:563,alt:'Vizualizarea prezentatorului din PowerPoint, cu patru zone încadrate cu roșu și numerotate de la 1 la 4'};
/* numerele stau departe unul de altul, ca să nu se atingă pe telefon (procente din captură) */
const ZONE_PV=[{z:'ceas',nr:1,nx:19,ny:11.4},{z:'curent',nr:2,nx:33,ny:62},{z:'urmator',nr:3,nx:82,ny:36},{z:'note',nr:4,nx:82,ny:76}];
const CONT=['Reguli elementare de estetică și ergonomie utilizate în realizarea unei prezentări','Reguli elementare de susținere a unei prezentări','Modalități de expunere a unei prezentări'];
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. Ca să schimbi tot textul unei casete: clic în text, apoi clic pe chenarul punctat (sau butonul <b>Esc</b> de sub fereastră), până chenarul devine linie plină. Săgeata ▾ de lângă un buton sau o casetă deschide lista ei. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_INTRO=`<p>Mai jos e un <strong>PowerPoint simulat</strong>, cu panglica în engleză, ca pe unele calculatoare din laborator (pe altele PowerPoint e în română; numele românești le ai în pași). Lucrează în fereastră: <strong>testele se bifează singure</strong>, apoi apeși <b>Verifică</b>.</p>
<ul><li><b>Tot textul unei casete:</b> clic în text, apoi clic pe chenarul punctat, până devine linie plină. Pe telefon: atingi textul, apoi butonul <b>Esc</b> de sub fereastră.</li>
<li><b>Listele</b> (fonturi, mărimi, culori): apeși săgeata ▾ din dreapta casetei sau a butonului. Numele unei culori apare sub listă când ții mouse-ul pe ea; pe telefon, după ce o alegi, în mesajul de sub fereastră.</li>
<li>Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (și ca buton sub fereastră) anulează ultimul pas.</li></ul>`;
const T_CONTRAST=(d,ph)=>({k:'fmtText',d,ph,contrastMin:4.5});
/* lista de verificare: O SINGURĂ formulare, folosită în pasul ei (cu id, pentru lecția 9), în atelier și în laborator */
const LISTA_LI=`<li><b>O idee:</b> totul ține de titlu? (Primul diapozitiv: numele și clasa.)</li>
<li><b>Puține cuvinte:</b> cel mult patru rânduri scurte, de câte o linie?</li>
<li><b>Litere mari:</b> rânduri de cel puțin 24, titlul de cel puțin 32 și mai mare decât ele?</li>
<li><b>Contrast:</b> textul e mult mai închis sau mai deschis decât fundalul?</li>
<li><b>Imaginea</b> (dacă e) arată ce spune titlul și e trecută la surse?</li>
<li><b>Același aspect:</b> fonturile temei, aceleași culori ca pe celelalte?</li>
<li><b>Ordonat:</b> aliniat, cu loc liber pe margini?</li>
<li><b>Efecte</b> (dacă sunt): aceeași tranziție scurtă, animații doar unde ajută?</li>`;
const LISTA=`<ol class="lista-verif" id="lista-diapozitiv">${LISTA_LI}</ol>`;
const LISTA_COPIE=`<ol class="lista-verif">${LISTA_LI}</ol>`;
/* grila de observare a susținerii (criteriile profesorului: contact vizual, ritm, ce spun eu vs. ce scrie pe ecran) */
const GRILA_LI=`<li><b>Privirea:</b> se uită la noi, nu la ecran?</li>
<li><b>Ritmul:</b> vorbește tare și rar, nici grăbit, nici în șoaptă?</li>
<li><b>Vorbele lui:</b> spune cu vorbele lui, nu citește ce scrie pe ecran?</li>`;
const GRILA=`<ol class="lista-verif" id="grila-sustinere">${GRILA_LI}</ol>`;
const GRILA_COPIE=`<ol class="lista-verif">${GRILA_LI}</ol>`;

const LECTIA={
 t:'Reguli de estetică și ergonomie. Reguli de susținere a unei prezentări',lectii:[8],continuturi:CONT,final:true,
 obiectiv:'faci diapozitivele la fel și ordonate, le verifici cu o listă și îți susții prezentarea: privești publicul, folosești notele și Vizualizarea prezentatorului, ții timpul.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Știi deja să faci diapozitive: text, imagini, formatare, efecte. Azi afli cum faci o prezentare pe care clasa o urmărește ușor și cum o <strong>susții</strong>, adică o prezinți tu, cu voce tare.</p>
<p><mark>Estetica</mark> e grija ca diapozitivele să arate îngrijit și ordonat. <mark>Ergonomia</mark> e grija ca publicul să le urmărească fără efort: să citească ușor și să nu obosească.</p>
${figDin('../m1-l04/img/prezentare-la-ora.webp',960,688,'O oră de clasă: pe ecran, un diapozitiv cu cinci propoziții lungi; lângă ecran, prezentatorul se uită la elevi și le vorbește','Prezentatorul se uită la public, nu la ecran: așa da. Diapozitivul însă e plin de propoziții lungi: colegii citesc în loc să asculte. Fotografie: Bureau of Land Management (SUA), domeniu public, Wikimedia Commons.','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> lecția 2 (cele patru reguli ale unui diapozitiv bun, zona de note, expunerea cu <kbd>F5</kbd> și <kbd>Esc</kbd>), lecția 4 (sursele, la final), lecția 5 (muți un obiect trăgându-l), lecția 6 (mărimea și culoarea literelor, tema) și lecția 7 (efectele puse cu măsură).</p>`},
  /* ---------- pasul: același aspect ---------- */
  {t:'Același aspect pe toate diapozitivele',
   text:`<p>O prezentare îngrijită are <strong>același aspect</strong> pe toate diapozitivele:</p>
<ul><li><strong>o singură temă</strong> (lecția 6);</li>
<li><strong>cel mult două fonturi</strong>, ale temei. În lista <strong>Font</strong> (Pornire (Home), săgeata ▾ a casetei Font), sus, la <i>Theme Fonts</i> (fonturile temei): primul, cu <i>(Headings)</i>, e pentru titluri; al doilea, cu <i>(Body)</i>, pentru text;</li>
<li><strong>aceleași câteva culori</strong> pe toate diapozitivele; cel mult una în plus, pentru ce vrei să iasă în evidență;</li>
<li>titlurile <strong>în același loc</strong>: nu le muta. Doar primul diapozitiv are titlul la mijloc.</li></ul>
${fig('lista-font','Lista Font deschisă în PowerPoint: sus, sub Theme Fonts, Calibri Light cu Headings și Calibri cu Body; dedesubt All Fonts','Lista <b>Font</b> deschisă: sus <i>Theme Fonts</i>, cele două fonturi ale temei. Pe unele calculatoare au alte nume, de exemplu Aptos Display și Aptos. Captură din PowerPoint în engleză.','ingusta')}`,
   exemplu:`${fig('caseta-font-comic','Grupul Font din PowerPoint: în caseta Font scrie Comic Sans MS, iar dedesubt se vede titlul Animalele pădurii scris cu acest font','Titlul ales e scris în <b>Comic Sans MS</b>: caseta Font arată ce font are. Captură din PowerPoint în engleză.','mica')}
<p>Ana dă clic în titlu, apoi pe chenar: caseta Font arată Comic Sans MS. Săgeata ▾ a casetei → primul font de sus, cu <i>(Headings)</i>. În casetă apare Calibri Light (Headings). Același nume ales mai jos, din <i>All Fonts</i>, nu e fontul temei: caseta nu arată (Headings).</p>${grila(D('ex2-inainte-1','','Diapozitivul Castelul Peleș cu titlul în Comic Sans MS, roșu','<b>Înainte:</b> Comic Sans MS, roșu.'),D('ex2-dupa-1','','Același diapozitiv cu titlul în fontul și culoarea temei','<b>După:</b> fontul și culoarea temei.'))}`,
   altfel:`<p>Gândește-te la un manual: toate lecțiile au titlul scris la fel, în același loc, cu aceeași culoare. Îl găsești imediat pe orice pagină. Dacă fiecare pagină ar avea alt scris, te-ai uita la litere, nu la lecție.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'În prezentarea „Munții României”, un titlu are alt font decât celelalte. Găsește-l și pune-i fontul temei pentru titluri: primul de sus, din <i>Theme Fonts</i>, cel cu <i>(Headings)</i>. Celelalte titluri rămân cum sunt.',start:{deck:'l8_p2',cur:0},
     teste:[{ce:'Titlul „Munții Rodnei” are fontul temei pentru titluri (din Theme Fonts, cel cu (Headings))',c:[{k:'fmtFont',d:'Munții Rodnei',ph:'titlu',font:'titluri'}],ajutor:'Clic în titlul „Munții Rodnei”, clic pe chenar, apoi Font ▾ → primul de sus, cel cu (Headings). Dacă l-ai ales din All Fonts, caseta nu arată (Headings): alege-l de sus, din Theme Fonts.'},
       {ce:'Toate titlurile prezentării au fontul temei pentru titluri',c:[{k:'fmtFontToate',ph:'titlu',font:'titluri'}],ajutor:'Ai schimbat și alt titlu? Ctrl+Z, sau pune-i și lui fontul cu (Headings), din Theme Fonts.'}],
     rez:[P.text(3,'titlu',{font:{tema:'t'}})],gresit:[P.text(3,'titlu',{font:{n:'Calibri Light'}})],
     rezText:'miniatura 3 → clic în titlul „Munții Rodnei” → clic pe chenar → Font ▾ → Calibri Light (Headings), din Theme Fonts',ajutor:'Ia miniaturile pe rând și uită-te la forma literelor din titluri, sau dă clic în fiecare titlu și citește caseta Font.',
     why:'„Munții Rodnei” era scris în Comic Sans MS. Acum are fontul temei pentru titluri, ca toate celelalte: prezentarea arată la fel peste tot.'},
   inca:[
    {t:'choice',q:`Trei diapozitive din aceeași prezentare. Care nu se potrivește cu celelalte două?${grila(
       D('ex2-dupa-1','A','Diapozitivul A, Castelul Peleș, cu fonturile temei'),D('ex2-dupa-2','B','Diapozitivul B, Castelul Bran, cu fonturile temei'),
       D('ex2-inainte-3','C','Diapozitivul C, Cetatea Neamț, cu titlul albastru deschis și rândurile în alt font'))}`,
     o:['Diapozitivul C','Diapozitivul A','Diapozitivul B'],ok:0,ajutor:'Compară culoarea titlurilor și forma literelor de pe rânduri.',
     why:'La C, titlul are altă culoare (albastru deschis) și rândurile alt font. A și B au fonturile și culorile temei: se potrivesc.'}
   ]},
  /* ---------- pasul: aliniat și aerisit ---------- */
  {t:'Aliniat și aerisit',
   text:`<p>Încă două reguli fac diapozitivul să arate ordonat:</p>
<ul><li><mark>Alinierea</mark>: obiectele stau pe aceeași linie. Textul începe exact sub marginea din stânga a titlului, ca rândurile dintr-un caiet.</li>
<li><mark>Spațiul liber</mark>: lași loc gol pe marginile diapozitivului și între obiecte. Nimic nu se lipește de margine și nimic nu acoperă altceva. O poză mare spune mai mult decât patru poze mici înghesuite.</li></ul>
<p>Un obiect îl muți trăgându-l de chenar (lecția 5).</p>`,
   exemplu:`${grila(D('ex3-inainte','','Diapozitivul Albina la lucru: caseta de text începe mai la dreapta decât titlul, iar poza albinei e lipită de marginea din dreapta','<b>Înainte:</b> caseta nu începe sub titlu, poza e lipită de margine.'),D('ex3-dupa','','Același diapozitiv: caseta începe sub titlu, iar poza are loc liber în jur','<b>După:</b> aliniat, cu loc liber pe margini.'))}
<p>Mihai trage caseta de chenar spre stânga, până începe sub titlu. Apoi trage poza puțin spre stânga și în jos, ca să rămână loc gol pe margini.</p>${FOTO_ALB}`,
   altfel:`<p>Gândește-te la un raft de bibliotecă: cărțile stau aliniate, cu puțin loc între ele, și le găsești ușor. Dacă ar fi aruncate grămadă, una peste alta, n-ai mai găsi nimic.</p>`,
   incearca:{t:'classify',q:`Care diapozitive sunt aliniate și aerisite și care încalcă o regulă?${grila(

       D('p3-c','C','Diapozitivul C, Albinele: patru poze mici împrăștiate, una lipită de colțul de sus, textul în colțul de jos'),D('p3-d','D','Diapozitivul D, Serbarea clasei: textul începe sub titlu, poza cu baloane are loc liber în jur'))}${FOTO_AMBELE}`,
     cats:['Aliniat și aerisit','Încalcă o regulă'],
     items:[['Diapozitivul A („Albina și floarea”)',0],['Diapozitivul B („Stupul”)',1],['Diapozitivul C („Albinele”)',1],['Diapozitivul D („Serbarea clasei”)',0]],
     ajutor:'La fiecare: textul începe sub marginea din stânga a titlului? E loc gol pe margini?',
     why:'La B textul nu începe sub titlu. La C pozele mici sunt înghesuite, una e lipită de margine, iar textul stă în colț. A și D sunt aliniate și au loc liber în jur.'},

  /* ---------- pasul: lista de verificare (aici intră și recapitularea „se citește din ultima bancă”, lecțiile 2 și 6) ---------- */
  {t:'Lista de verificare a diapozitivului',
   text:`<p>Înainte să prezinți, treci diapozitivele prin <mark>lista de verificare</mark>. La fiecare „nu”, repari. Lista e pentru tine; profesorul notează după grila lui.</p>${LISTA}`,
   exemplu:`${grila(D('ex1-inainte','','Diapozitivul Păsările iarna: rânduri mici, roșii, pe fundal verde deschis','<b>Înainte:</b> rânduri de 16, roșu pe verde deschis.'),D('ex1-dupa','','Același diapozitiv: rânduri mari, negre ca titlul, pe verde deschis','<b>După:</b> rânduri de 28, negre ca titlul.'))}
<p>Ioana verifică „Păsările iarna”. La „Litere mari”: nu, rândurile au 16. Le face 28 (PowerPoint pune singur titlul la 44 și rândurile la 28; dacă scrii mult, micșorează literele, deci verifici Dimensiune font). La „Contrast”: nu. Roșul și verdele diferă mult ca nuanță, dar sunt la fel de luminoase, deci de departe se amestecă. Le face negre, ca titlul.</p>`,
   altfel:`<p>E ca lista pe care o faci înainte de o excursie: apă, geacă, mâncare. O iei rând cu rând și bifezi. Dacă verifici din memorie, sigur uiți ceva.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Verifică diapozitivul „Merele” la întrebările „Litere mari” și „Contrast” din listă. Rândurile au 18 și sunt albastru deschis pe alb. Repară-le: mărime de cel puțin 24, dar mai mică decât a titlului, și o culoare cu contrast mare pe fundalul alb.',start:{deck:'l8_p1',cur:1},
     teste:[{ce:'Rândurile de pe „Merele” au cel puțin 24, iar titlul a rămas mai mare decât ele',c:[{k:'fmtText',d:'Merele',ph:'c1',ptMin:24},{k:'fmtMaiMare',d:'Merele'}],ajutor:'Clic în rânduri, clic pe chenar (linie plină), apoi Font Size ▾ → 28.'},
       {ce:'Rândurile se citesc pe fundalul alb: o culoare închisă (contrast mare)',c:[T_CONTRAST('Merele','c1')],ajutor:'Font Color ▾ → o culoare închisă, de exemplu negrul din Culori temă (Theme Colors), ca titlul. Roșul, albastrul deschis, verdele deschis și portocaliul sunt prea luminoase pe alb.'}],
     rez:[P.text(2,'c1',{pt:28}),P.text(2,'c1',{cul:NEGRU})],gresit:[P.text(2,'c1',{pt:28})],
     rezText:'clic în rânduri → clic pe chenar → Font Size ▾ → 28 → Font Color ▾ → negru (Culori temă)',ajutor:'Două lucruri: mărimea și culoarea. Fundalul e alb: ce fel de text se vede pe el?',
     why:'Rândurile au acum 28, sub titlul de 44, iar culoarea închisă face contrast mare cu albul: se citesc și din ultima bancă.'},
   inca:[
    {t:'classify',q:`Litere mari și contrast: care diapozitive se citesc din ultima bancă și care nu?${grila(
       D('p1-a','A','Diapozitivul A, Munții: rânduri mari, negre pe alb'),D('p1-b','B','Diapozitivul B, Râurile: rânduri foarte mici, negre pe alb'),
       D('p1-c','C','Diapozitivul C, Marea Neagră: rânduri mari, roșii pe fundal verde'),D('p1-d','D','Diapozitivul D, Lacurile: text alb pe fundal albastru închis'))}`,
     cats:['Se citește','Nu se citește'],
     items:[['Diapozitivul A („Munții”)',0],['Diapozitivul B („Râurile”)',1],['Diapozitivul C („Marea Neagră”)',1],['Diapozitivul D („Lacurile”)',0]],
     ajutor:'La fiecare: literele sunt destul de mari? Textul e mult mai închis sau mult mai deschis decât fundalul?',
     why:'B are rânduri de 14: prea mici. C are roșu pe verde, culori la fel de luminoase: se amestecă. A (negru pe alb) și D (alb pe albastru închis) au litere mari și contrast mare.'},
    {t:'classify',q:`Verifică diapozitivul „Vulpea” cu lista. La fiecare întrebare de mai jos, e „da” sau „nu”?${fig('p4','Diapozitivul Vulpea: titlul în Times New Roman, trei rânduri scurte, mari, negre pe alb, și în dreapta o poză cu baloane colorate','Diapozitivul „Vulpea”.','mica')}${FOTO_BAL}`,
     cats:['Da, e în regulă','Nu, trebuie reparat'],

     why:'Rândurile sunt puține, mari, negre pe alb: da. Baloanele nu arată o vulpe, iar titlul e în Times New Roman, alt font decât al temei: acestea două trebuie reparate.'},
    {t:'choice',q:`La ce întrebare din listă primește diapozitivul „Ursul” „nu” și cum îl repari?${fig('p4b','Diapozitivul Ursul: trei rânduri scurte, negre pe alb, cu litere foarte mici','Diapozitivul „Ursul”.','mica')}`,
     o:['Litere mari: faci rândurile de cel puțin 24','O idee: îl împarți în două diapozitive','Contrast: pui fundal negru','Efecte: pui o animație pe fiecare rând'],ok:0,
     ajutor:'Rândurile sunt puține și țin de titlu. Cum sunt literele?',why:'Rândurile au 14, prea mici pentru ultima bancă. Le faci de cel puțin 24 (de exemplu 28). Restul listei e în regulă.'}

  /* ---------- pasul: susținerea ---------- */
  {t:'Susținerea: vorbești cu publicul',
   text:`<p><mark>Susținerea</mark> prezentării înseamnă că o prezinți tu, cu voce tare. Colegul care te ascultă poate bifa <mark>grila de observare</mark> a profesorului:</p>${GRILA}
<p><mark>Notele vorbitorului</mark>, din zona de note (lecția 2), au doar <strong>cuvinte-cheie</strong>: le privești o clipă, apoi te uiți iar la colegi. Începi cu salutul și subiectul; închei cu ce ați aflat, „Mulțumesc!” și întrebări.</p>
${fig('note-cuvinte-cheie','Partea de jos a unui diapozitiv în PowerPoint și, sub el, zona de note cu cuvintele-cheie: urs, lup, prădători; căprioara, se sperie ușor; veverița, strânge alune','Zona de note, sub diapozitiv, cu cuvinte-cheie. Publicul nu o vede. Captură din PowerPoint în engleză.')}`,
   exemplu:`<p>Notele Mariei pentru „Copacii pădurii”:</p>
<ul><li><b>Așa nu</b>, ar trebui să le citească: „Stejarul și fagul sunt copaci cu frunze late, care își pierd frunzele toamna, iar bradul și molidul...”</li>
<li><b>Așa da</b>, cuvinte-cheie: „stejar, fag: frunze late · brad, molid: ace, verzi și iarna · mesteacăn: scoarță albă”.</li></ul>
<p>Maria aruncă o privire la note, apoi le spune colegilor, uitându-se la ei: „În pădurile noastre cresc stejari și fagi...”</p>`,
   altfel:`<p>Gândește-te la cineva care comentează un meci la radio: nu citește de pe o foaie, ci povestește ce vede, cu vorbele lui. Are doar câteva notițe, de exemplu numele jucătorilor.</p>`,
   incearca:{t:'classify',q:'Ce faci și ce nu faci când îți susții prezentarea?',
     cats:['Așa da','Așa nu'],
     items:[['Te uiți la colegi în timp ce vorbești',0],['Citești rândurile de pe ecran, cu spatele la clasă',1],['Spui cu vorbele tale ce înseamnă un rând',0],['Scrii în note tot textul, ca să-l citești',1],['Vorbești încet, aproape în șoaptă',1],['Închei cu „Mulțumesc!” și aștepți întrebări',0]],
     ajutor:'Întreabă-te la fiecare, ca în grila de observare: colegii mă văd uitându-mă la ei, mă aud, înțeleg ce spun?',
     why:'Privirea spre colegi, vorbele tale și încheierea cu întrebări țin publicul atent. Cu spatele la clasă, citind, sau în șoaptă, colegii nu te mai urmăresc.'},
   inca:[
    {t:'choice',q:'Care note sunt potrivite pentru diapozitivul „Ursul”?',
     o:['doarme iarna · fructe, miere · până la 300 kg','Ursul este un animal mare, care doarme toată iarna în bârlog și mănâncă fructe de pădure și miere.','Ursul','Nimic: le știu pe de rost'],ok:0,
     ajutor:'Notele bune au câteva cuvinte-cheie, pe care le vezi dintr-o privire.',
     why:'Cuvintele-cheie îți amintesc ce spui, dintr-o privire. O propoziție întreagă te face să citești, un singur cuvânt nu-ți amintește destul, iar fără note te poți încurca.'}
   ]},
  /* ---------- pasul: Vizualizarea prezentatorului, timpul, trecerile ---------- */
  {t:'Vizualizarea prezentatorului: notele, cronometrul, ce urmează',
   text:`<p><mark>Vizualizarea prezentatorului</mark> (Presenter View) e expunerea văzută de tine: diapozitivul curent, diapozitivul următor (<i>Next slide</i>), notele și un <strong>cronometru</strong>, ca la sport, care arată de cât timp vorbești.</p>
<p>Pe un singur ecran o pornești cu <kbd>Alt</kbd>+<kbd>F5</kbd>: ții apăsată tasta <kbd>Alt</kbd>, de lângă bara de spațiu, și apeși <kbd>F5</kbd>. Pornește de la primul diapozitiv. Înainte de <kbd>→</kbd> spui o <mark>frază de trecere</mark>: o propoziție care leagă ce ai spus de ce urmează.</p>
<p>Când videoproiectorul e al doilea ecran, publicul vede pe perete doar diapozitivul. Dacă pe perete apare exact ce vezi tu pe monitor, pornește cu <kbd>F5</kbd>: altfel colegii îți văd notele.</p>
${fig('prezentator','Vizualizarea prezentatorului din PowerPoint: stânga sus cronometrul, mare diapozitivul Copacii pădurii, dreapta sus diapozitivul următor, Animalele pădurii, dedesubt notele cu cuvinte-cheie, jos Slide 2 of 5','Stânga sus: <b>cronometrul</b> (0:00:08); mai la dreapta, ora din zi. Mare: <b>diapozitivul curent</b>. Dreapta sus: <b>diapozitivul următor</b>. Dedesubt: <b>notele</b>. Jos: ◀ ▶. <i>END SLIDE SHOW</i> (Încheiere expunere de diapozitive) sau <kbd>Esc</kbd> încheie expunerea. PowerPoint în engleză.')}`,
   exemplu:`<p>Maria are un minut pentru diapozitivele 2 și 3: cam o jumătate de minut pe fiecare. Repetă cu <kbd>Alt</kbd>+<kbd>F5</kbd>: apasă <kbd>→</kbd> până la diapozitivul 2, se uită cât arată cronometrul și vorbește un minut de acolo.</p>
<p>Pe „Copacii pădurii” vede în dreapta că urmează „Animalele pădurii”. Termină ideea, apoi spune fraza de trecere: „Copacii sunt casa multor animale. Să vedem care.” Abia atunci apasă <kbd>→</kbd>.</p>`,
   altfel:`<p>Gândește-te la bordul unei mașini: șoferul vede cât a mers și ecranul care îi arată pe unde o ia mai departe. Pasagerii din spate văd doar drumul.</p>`,
   incearca:{t:'zona',q:'În captura de mai jos, patru zone ale Vizualizării prezentatorului sunt încadrate și numerotate. În care zonă te uiți ca să afli ce diapozitiv urmează, înainte să spui fraza de trecere? Atinge numărul ei.',img:IMG_PV,zone:ZONE_PV,ok:'urmator',
     ajutor:'Care zonă arată un diapozitiv mic, pe care publicul încă nu l-a văzut?',
     gresitMsg:{ceas:'Zona 1 e cronometrul: de cât timp vorbești.',curent:'Zona 2 e diapozitivul de acum, cel pe care îl vede și publicul.',note:'Zona 4 sunt notele tale.'},
     why:'Zona 3, diapozitivul următor (Next slide): vezi ce vine, deci poți spune o frază de trecere spre el înainte de →.'},
   inca:[
    {t:'zona',q:'Aceeași captură. În care zonă vezi de cât timp vorbești? Atinge numărul ei.',img:IMG_PV,zone:ZONE_PV,ok:'ceas',
     ajutor:'Caută cifre care cresc, de forma 0:00:08 (nu ora din zi).',why:'Zona 1: cronometrul pornește singur odată cu expunerea și arată de cât timp vorbești.'},
    {t:'choice',q:'Ai un minut pentru 3 diapozitive. Cam cât timp stai pe fiecare?',
     o:['Cam 20 de secunde','Cam un minut','Cam 3 minute','Cam 5 secunde'],ok:0,ajutor:'Un minut are 60 de secunde. Împarte-le la numărul de diapozitive.',
     why:'60 de secunde : 3 diapozitive = 20 de secunde pe fiecare.'},
    {t:'choice',q:'Ce faci înainte să treci la diapozitivul următor?',
     o:['Termini ideea, spui o frază de trecere, apoi apeși →','Apeși → în mijlocul unei propoziții','Spui „următorul diapozitiv” și citești ce scrie pe el','Taci și aștepți să treacă singur'],ok:0,
     ajutor:'Publicul trebuie să știe de ce vine diapozitivul următor.',why:'Fraza de trecere leagă ideile: publicul înțelege de ce vine diapozitivul următor. Apoi apeși →.'}
   ]}
 ],

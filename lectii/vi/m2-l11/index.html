<meta name="description" content="Lecția 11, clasa a VI-a (TIC): ce programe rău-intenționate vin de pe Internet (virusul, troianul, programul-spion), pe unde intră în calculator, cum închizi o fereastră falsă fără să apeși în ea, ce face antivirusul (Microsoft Defender, în Securitate Windows) și cum verifici un stick sau un fișier. Cu un calculator simulat în pagină și pași de privit și de verificat la calculatorul din laborator.">

/* banda de sus: file de browser cu ✕ (o închizi pe cea falsă) și un scut (antivirusul) — doar CSS */
.banda{display:flex;gap:6px;padding:8px 12px 0;min-height:36px;align-items:flex-end}
.banda span{flex:0 0 auto;width:58px;height:22px;border:1px solid var(--ink2);border-bottom:0;border-radius:6px 6px 0 0;
  background:linear-gradient(var(--ink2),var(--ink2)) 7px 9px/26px 3px no-repeat;position:relative}
.banda span::after{content:"✕";position:absolute;right:5px;top:2px;font-size:11px;color:var(--ink2)}
.banda span.falsa{border-color:var(--bad);background:linear-gradient(var(--bad),var(--bad)) 7px 9px/26px 3px no-repeat}
.banda span.falsa::after{color:var(--bad);font-weight:700}
.banda .scut{width:22px;height:26px;border:0;background:var(--accent);clip-path:polygon(50% 0,100% 18%,92% 62%,50% 100%,8% 62%,0 18%);align-self:center;margin-left:8px}
.banda .scut::after{content:""}
h1{font-size:clamp(1.6rem,6.2vw,2.7rem);font-weight:700;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.ingusta img{max-width:420px}
figure.captura.mica img{max-width:320px}
.reading ol li,.reading ul li{margin:.2em 0}
.descarca{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:6px;font-weight:600;text-decoration:none;min-height:32px}
.gest{border-left:4px solid var(--accent);background:var(--paper2);padding:6px 10px;border-radius:0 6px 6px 0;margin:.6em 0 0}
</style>

<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 11 — „Măsuri de siguranță în utilizarea Internetului. Programele antivirus”.
   Simulatorul: lectii/_sim/siguranta-pc.js (proprietar: această lecție) — tipurile fereastra, scanare, laborator.
   Faptele despre Windows / Securitate Windows: citite din Windows (resursele aplicației, PowerShell Get-MpComputerStatus,
   MpCmdRun pe un dosar din _proba) și din paginile Microsoft ro-ro citate în surse.md; aplicația Securitate Windows NU a
   fost pornită (s-ar fi deschis pe ecranul vizibil al profesorului). Granița: parolele și datele personale = lecția 12;
   e-mailul și atașamentele = lecțiile 13-15 (nu apar aici).
   Trimiterile între pași se fac după NUMELE pasului (numărul de pe ecran îl pune motorul).
   ====================================================================================================== */
const fig=(cale,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${cale}" target="_blank"><img src="${cale}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CCBYSA4='<a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>';
const CONT=['Măsuri de siguranță în utilizarea Internetului (de exemplu, utilizarea programelor de tip antivirus)'];
const IMG_STICK=fig('../../v/m1-l06/img/stick.webp',420,236,'Un stick USB gri închis, cu capătul de metal în stânga; pe el scrie PNY și 16GB',
  `Un stick USB: pe el îți aduci tema de acasă. Fotografie: Donald Trung Quoc Don, ${CCBYSA4}, <a href="https://commons.wikimedia.org/wiki/File:PNY_USB_flash_drive_(16GB),_Hillegersberg,_Rotterdam_(2020)_01.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.`,'mica');
const IMG_EXE=fig('../../../jocuri/internet-vi/img/fisier-exe.webp',685,260,'Un folder în File Explorer, în vederea cu coloane: fișierul joc_gratis.exe e încadrat cu roșu, iar în coloana Tip, tot încadrat, scrie Aplicație; o etichetă roșie spune: un .exe este un PROGRAM: dacă îl deschizi, pornește. La celelalte fișiere scrie Folder de fișiere, Fișier MP3, IrfanView JPG File sau Microsoft Word Document',
  'Aici extensiile se văd; pe multe calculatoare <code>joc_gratis.exe</code> apare doar ca <code>joc_gratis</code>, dar coloana <b>Tip</b> spune tot <b>Aplicație</b>: e un program.');
const IMG_FILA=fig('../../../jocuri/documentare-v/img/bara-browser.webp',1000,248,'Bara de sus a browserului Google Chrome: fila Lup cenușiu - Wikipedia, cu un ✕ mic chiar în dreapta numelui ei; săgeți roșii arată alte butoane: plus pentru filă nouă, Înapoi, Înainte, Reîncarcă, bara de adresă și steaua pentru Favorite',
  'Fila are chiar lângă nume un <b>✕</b> mic, nu cel din colțul ferestrei: el închide doar fila. Săgețile arată alte butoane ale browserului (Google Chrome).');
const IMG_SEC=fig('../../../jocuri/internet-vi/img/antivirus-scanare.webp',700,610,'Aplicația Securitate Windows, pagina Protecție antivirus și împotriva amenințărilor: la Amenințări curente scrie Momentan nu există amenințări, ultima scanare, 0 amenințări găsite, 79270 fișiere scanate; dedesubt butonul Scanare rapidă și legăturile Opțiuni de scanare, Amenințări permise, Istoric protecție',
  'Sus, la <b>Amenințări curente</b>: rezultatul ultimei scanări. Jos, <b>Istoric protecție</b>: ce a blocat antivirusul și ce a pus în carantină. Captură din Windows în română.','ingusta');

const T_LAB=[
  {c:'falsaInchisa',ce:'Ai închis fila cu fereastra falsă, fără să apeși nimic în ea',ajutor:'Bara de activități → Browser → ✕ de lângă numele filei false. Ai apăsat ceva în pagina falsă? Apasă jos „Ia-o de la capăt”.'},
  {c:'scanatInainte',ce:'Ai scanat <b>STICK (E:)</b> cu Microsoft Defender înainte să deschizi vreun fișier de pe el',ajutor:'File Explorer → clic dreapta pe STICK (E:) (pe telefon: ții degetul apăsat sau atingi ⋯) → Afișați mai multe opțiuni → Scanați cu Microsoft Defender... Ai deschis deja un fișier de pe stick? „Ia-o de la capăt” și scanează întâi.'},
  {c:'nr',ce:'Ai scris în căsuța „Răspunsul tău” câte amenințări a găsit scanarea',ajutor:'În Securitate Windows citește rândul „… amenințări găsite.”. Numărul din fața cuvântului „amenințări” îl scrii în căsuța „Răspunsul tău”, de sub calculator.'},
  {c:'deschisFaraProgram',v:['Tema_6A_Pop','joc_gratis'],ce:'Ai deschis tema (<b>Tema_6A_Pop</b>), iar <b>joc_gratis</b> (Tip: Aplicație) a rămas nepornit',ajutor:'Dublu clic pe STICK (E:), apoi dublu clic pe Tema_6A_Pop (pe telefon: atingi de două ori repede). joc_gratis e un program de pe un site necunoscut: nu-l porni. L-ai pornit? „Ia-o de la capăt”.'}
];

const LECTIA={
 t:'Măsuri de siguranță în utilizarea Internetului. Programele antivirus',lectii:[11],continuturi:CONT,final:true,
 obiectiv:'recunoști programele rău-intenționate și căile pe care intră, închizi o fereastră falsă fără să apeși în ea, știi ce face antivirusul și verifici cu el un stick sau un fișier.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>De pe Internet iei lecții, jocuri și filme. Tot de acolo pot veni și programe care strică un calculator sau fură ce e în el. Azi afli ce sunt, pe unde intră, cum le oprește un <strong>program antivirus</strong> și ce faci tu, ca să rămână calculatorul sigur.</p>
${IMG_STICK}
<p>De exemplu: îți aduci tema de acasă pe un stick. La școală, înainte s-o deschizi, verifici stickul cu antivirusul.</p>
<p class="nevoie"><b>Ai nevoie de:</b> din clasa a V-a, fișierele și folderele din File Explorer, cu extensia și coloana Tip (lecția 9), stickul USB (lecția 6), browserul, filele și descărcarea fișierelor (lecțiile 14 și 15), regulile de siguranță pe Internet (lecția 16); din clasa a VI-a, fișierele descărcate din lecții (lecțiile 2-8).</p>`},
  /* ---------- pasul: programele rău-intenționate ---------- */
  {t:'Programe rău-intenționate',
   text:`<p>Un <mark>program rău-intenționat</mark> (în engleză <i>malware</i>, se citește „mal-uer”) e un program făcut ca să strice sau să fure. Trei feluri des întâlnite:</p>
<ul><li><mark>virusul</mark>: se copiază singur în alte fișiere și trece mai departe odată cu ele, pe stickuri și pe alte calculatoare;</li>
<li><mark>troianul</mark>: se preface că e un program bun, de exemplu un joc „gratis”; nu se copiază singur: îl pornește cineva, păcălit;</li>
<li><mark>programul-spion</mark>: notează pe ascuns ce scrii și ce pagini deschizi, apoi trimite altcuiva.</li></ul>
<p>Altele blochează fișierele și cer bani ca să le deblocheze.</p>`,
   exemplu:`<p>Andrei descarcă „Curse de mașini, GRATIS” de pe un site necunoscut și îl pornește. Jocul nu apare, iar a doua zi pozele lui nu se mai deschid. Ce a fost? Un <b>troian</b>: s-a prefăcut că e joc, iar Andrei l-a pornit singur.</p>
<p>Dacă s-ar fi copiat apoi singur în alte fișiere, de exemplu în prezentările de pe stickul colegului, ar fi fost un <b>virus</b>.</p>`,
   altfel:`<p>Numele „troian” vine dintr-o poveste veche. Grecii au lăsat în fața cetății Troia un cal mare de lemn, ca dar. Troienii l-au tras singuri în cetate, iar noaptea din cal au ieșit soldați. La fel, troianul arată ca un dar, un joc gratis, dar tu îl lași să intre.</p>`,
   incearca:{t:'classify',q:'Ce fel de program rău-intenționat e fiecare?',
     cats:['Virus','Troian','Program-spion'],
     items:[['Se copiază singur în toate prezentările din calculator, apoi pe orice stick pus în el',0],['Un „program care îți dă monede în joc”: după ce îl pornești, aduce alte programe rele',1],['Notează pe ascuns fiecare tastă apăsată și o trimite unui necunoscut',2],['Pare o aplicație de desenat; după ce o pornești, îți șterge fișierele',1]],
     ajutor:'Întreabă-te la fiecare: se copiază singur în alte fișiere (virus)? S-a prefăcut că e bun și l-a pornit cineva (troian)? Urmărește pe ascuns ce faci (program-spion)?',
     why:'Virusul se copiază singur în alte fișiere. Troianul se ascunde într-un program care pare bun și îl pornește cineva păcălit. Programul-spion urmărește pe ascuns ce faci și trimite altcuiva.'},
   inca:[
    {t:'tf',q:'Un troian se copiază singur în alte fișiere și pe alte calculatoare, fără să-l pornească nimeni.',ok:false,ajutor:'Cum intră troianul: singur sau pornit de cineva păcălit?',
     why:'Fals. Troianul nu se copiază singur: îl pornește cineva care crede că e un program bun. Cel care se copiază singur în alte fișiere e virusul.'},
    {t:'choice',q:'Ce au în comun virusul, troianul și programul-spion?',o:['Sunt toate programe rău-intenționate','Sunt toate programe antivirus','Se copiază toate singure','Sunt toate fișiere cu poze'],ok:0,
     ajutor:'Care e numele de familie al tuturor celor trei?',why:'Toate trei sunt programe rău-intenționate (malware): făcute ca să strice sau să fure. Doar virusul se copiază singur.'}
   ]},
  /* ---------- pasul: pe unde intră ---------- */
  {t:'Pe unde intră în calculator',
   text:`<p>Un program rău-intenționat intră, de obicei, pe una din trei căi:</p>
<ol><li><strong>programe descărcate de pe site-uri necunoscute</strong>: „jocuri gratis”, „monede gratis”;</li>
<li><strong>stickuri</strong> aduse de la alții sau găsite;</li>
<li><strong>ferestre și reclame false</strong>, care te sperie sau îți promit un premiu, ca să apeși pe ele.</li></ol>
<p>În File Explorer, în vederea cu coloane (Detalii), coloana <b>Tip</b> a unui program scrie <b>Aplicație</b>, chiar dacă extensia <code>.exe</code> e ascunsă. Atenție: și alte Tipuri pot porni programe, așa că un Tip necunoscut nu-l deschizi. Regula: nu instalezi (nu pui pe calculator) și nu pornești programe fără acordul unui adult.</p>
${IMG_EXE}
<p class="gest"><b>La calculator, acum:</b> deschide <b>File Explorer</b>, alege în stânga <b>Descărcări</b> și citește coloana <b>Tip</b>. Nu deschide nimic; apoi închide File Explorer cu ✕. (Descărcări e gol sau nu vezi coloanele? Treci peste.)</p>`,
   exemplu:`<p>Pe stickul primit de la un vecin, Ioana vede două lucruri: „Poze_vacanta”, cu Tip: Folder de fișiere, și „vezi_pozele”, cu Tip: <b>Aplicație</b>. Pozele nu sunt programe, deci „vezi_pozele” e ciudat: e un program cu nume de poze. Ioana nu-l deschide și îl întreabă pe tatăl ei.</p>`,
   altfel:`<p>Gândește-te la ușa casei: un hoț intră cel mai ușor dacă îi deschizi chiar tu, păcălit de o poveste frumoasă. Programul „gratis”, stickul adus de altcineva și fereastra falsă vin și ele cu o poveste frumoasă. Nu deschizi până nu verifici, oricine ar fi la ușă.</p>`,
   incearca:{t:'classify',q:'E un obicei riscant sau sigur pentru calculator?',
     cats:['Riscant','Sigur'],
     items:[['Pui în calculator un stick găsit pe holul școlii, ca să vezi al cui e',0],['Descarci de pe un site necunoscut un „program care face jocul mai rapid”',0],['Un coleg îți dă pe stick un fișier cu Tip: Aplicație, „ca să te joci”',0],['Pe un stick e un fișier cu Tip: Pachet pentru Windows Installer; îl deschizi, ca să vezi ce e',0],['Descarci prezentarea de pe pagina lecției și o verifici cu antivirusul înainte s-o deschizi',1],['Profesorul pune un program nou pe calculatoarele din laborator',1]],
     ajutor:'La fiecare: vine pe una din cele trei căi (program de pe un site necunoscut, stick străin, fereastră falsă)? Știi ce e și de unde vine?',
     why:'Stickul găsit, programul de pe un site necunoscut, aplicația primită „ca să te joci” și fișierul cu un Tip pe care nu-l cunoști pot lăsa să intre programe rele. Prezentarea din lecție vine dintr-un loc cunoscut și o verifici înainte s-o deschizi, iar programele noi le pune profesorul.'},
   inca:[
    {t:'choice',q:'Pe un stick vezi „tema_mate”, cu Tip: Aplicație. Ce e?',o:['Un program, chiar dacă numele pare de temă','O temă la matematică, scrisă în Word','Un folder cu teme','O poză cu tema'],ok:0,
     ajutor:'Ce înseamnă „Aplicație” în coloana Tip?',why:'Tip: Aplicație înseamnă program. Numele îl poate alege oricine, așa că te uiți la Tip, nu la nume.'}
   ]},
  /* ---------- pasul: fereastra falsă ---------- */
  {t:'Fereastra care te sperie: o închizi',
   text:`<p>Pe unele site-uri apare o <mark>fereastră falsă</mark>: o pagină care imită un avertisment sau un premiu. Te sperie („Calculatorul tău e infectat!”) sau îți promite ceva („Ai câștigat!”) și te grăbește să apeși sau să suni la un număr. Avertismentele adevărate de la Microsoft nu au niciodată număr de telefon.</p>
<p>Ce faci: <strong>nu apeși nimic în ea</strong>, nici „OK”, nici „✕” desenat în pagină. Închizi <strong>fila</strong>, de sus, cu ✕ de lângă numele ei, apoi spui unui adult. Nu vezi filele sau fila nu se închide? Nu apăsa nimic și cheamă un adult.</p>
${IMG_FILA}
<p class="gest"><b>La calculator, acum:</b> apasă <kbd>Ctrl+T</kbd> și închide fila nouă cu ✕ de lângă numele ei. Încă o dată: <kbd>Ctrl+T</kbd>, apoi <kbd>Ctrl+W</kbd>, care o închide. Revii la lecție.</p>`,
   exemplu:`<p>Mihai caută un joc și se deschide o filă nouă: „FELICITĂRI! Ai câștigat o tabletă! Apasă OK!”. Nu apasă OK și nici ✕ din colțul casetei roșii: e tot din pagină. Se uită sus, găsește fila nouă și apasă ✕ de lângă numele ei. Fila se închide, iar el îi spune profesorului ce a văzut.</p>`,
   altfel:`<p>E ca un necunoscut care te strigă pe stradă: „Ai câștigat un premiu, vino repede!”. Nu iei nimic din ce îți întinde și nu stai de vorbă: pleci și le spui părinților.</p>`,
   incearca:{t:'fereastra',falsa:'premiu',q:'Mai jos e un browser simulat. În fila nouă a apărut o fereastră falsă. Închide-o așa cum ai învățat, cu mouse-ul (pe telefon, cu degetul). Aici nu folosi Ctrl+W: ar închide chiar lecția. Dacă l-ai apăsat totuși și apare întrebarea „Părăsiți site-ul?”, apasă Anulați: lecția rămâne deschisă.',
     ajutor:'Nu apăsa nimic în caseta roșie. Sus, caută fila cu numele „FELICITĂRI! Ai câștigat!” și apasă ✕ de lângă el.',
     why:'Ai închis fila cu ✕ de pe ea, fără să apeși nimic în pagina falsă. Așa nu poate porni nicio descărcare.'},
   inca:[
    {t:'choice',q:'O pagină scrie: „Calculatorul tău e blocat! Sună acum la 07xx xxx xxx ca să-l deblochezi.” Ce faci?',
     o:['Închid fila, fără să sun, și îi spun unui adult','Sun repede, ca să nu pierd fișierele','Apăs „OK”, ca să dispară mesajul','Notez numărul și sun de acasă'],ok:0,
     ajutor:'Avertismentele adevărate de la Microsoft au număr de telefon?',why:'Un avertisment cu număr de telefon e fals: Microsoft nu pune numere de telefon în avertismente. Închizi fila și îi spui unui adult.'},
    {t:'fereastra',falsa:'descarca',q:'Altă filă falsă: îți oferă un joc gratis, „doar 5 minute”. Închide-o corect, cu mouse-ul sau cu degetul (nu cu Ctrl+W: ar închide chiar lecția).',
     ajutor:'Butoanele din pagină sunt tot ale paginii false. Fila are ✕ sus, lângă numele ei.',why:'Ai închis fila de sus, cu ✕, fără să descarci nimic.'}
   ]},
  /* ---------- pasul: antivirusul ---------- */
  {t:'Antivirusul: ce face',
   text:`<p>Un <mark>program antivirus</mark> te apără de programele rău-intenționate:</p>
<ul><li><strong>scanează</strong>: verifică fișierele, singur, când le descarci sau le deschizi, și ori de câte ori îi ceri tu;</li>
<li><strong>blochează</strong> un program periculos: nu-l lasă să pornească;</li>
<li>îl pune în <mark>carantină</mark>: îl mută deoparte, închis, unde nu mai poate face rău;</li>
<li><strong>se actualizează</strong> singur: primește informații despre programele rele noi.</li></ul>
<p>Pe Windows, antivirusul inclus e <b>Microsoft Defender</b>. Programele rele pe care le găsește, el le numește <mark>amenințări</mark>. Îl găsești în aplicația <b>Securitate Windows</b>, la <b>Protecție antivirus și împotriva amenințărilor</b>.</p>
${IMG_SEC}
<p class="gest"><b>La calculator, acum:</b> lângă ceas, în dreapta barei de activități, caută scutul <b>Securitate Windows</b> (sau după săgeata mică <b>^</b>). Doar uită-te la el. Nu-l găsești? Treci mai departe.</p>`,
   exemplu:`<p>Elena deschide Securitate Windows, apoi Protecție antivirus și împotriva amenințărilor. La Amenințări curente citește: „Momentan nu există amenințări.” și, la ultima scanare, „0 amenințări găsite.”. Apoi apasă <b>Istoric protecție</b>: acolo ar vedea ce a blocat antivirusul și ce a pus în carantină. Nu schimbă nimic.</p>`,

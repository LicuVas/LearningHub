<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operații de gestionare: creare, deschidere, salvare în diverse formate, închidere</title>
<meta name="description" content="Lecția 3, clasa a VI-a (TIC): creezi o prezentare PowerPoint nouă (goală sau cu temă), o salvezi cu un nume bun în folderul potrivit, alegi între Salvare și Salvare ca, o salvezi ca PDF, Expunere PowerPoint sau imagine, o închizi fără să pierzi nimic și o deschizi din nou. Cu PowerPoint simulat în pagină și pași pentru calculatorul din laborator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EEF1EF; --paper:#FFFFFF; --paper2:#F4F7F5; --line:#D5DDD9;
  --ink:#17231F; --ink2:#52615B; --accent:#0E6B62; --accentInk:#FFFFFF; --sel:#D5ECE8;
  --mark:#FFE08A; --markInk:#17231F; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Sora",Georgia,serif; --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101715; --paper:#18221F; --paper2:#1F2B27; --line:#34443E;
  --ink:#E7F0EC; --ink2:#A9BAB3; --accent:#5FD1C2; --accentInk:#0F1714; --sel:#1E3F3A;
  --mark:#F2C94C; --markInk:#17231F; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#101715; --paper:#18221F; --paper2:#1F2B27; --line:#34443E;
  --ink:#E7F0EC; --ink2:#A9BAB3; --accent:#5FD1C2; --accentInk:#0F1714; --sel:#1E3F3A;
  --mark:#F2C94C; --markInk:#17231F; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: cotoarele unor bibliorafturi, fiecare cu eticheta lui — doar CSS */
.banda{display:flex;gap:5px;padding:6px 12px 0;min-height:38px;align-items:flex-end;overflow:hidden}
.banda span{flex:0 0 auto;width:22px;height:30px;border-radius:2px 2px 0 0;background:var(--accent);opacity:.8;position:relative}
.banda span::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:11px;background:var(--paper);border-radius:1px}
.banda span.b{background:#C8702A}.banda span.c{background:var(--ink2)}.banda span.lat{width:30px}
h1{font-size:clamp(1.6rem,6.4vw,2.8rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
.reading ol li,.reading ul li{margin:.2em 0}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/simppt-fisier.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M1 · nr. 3 — „Operații de gestionare: creare, deschidere, salvare în diverse formate, închidere”.
   Simulatorul: lectii/_sim/simppt-fisier.js (SimPPTFisier, tipul `pptf`, scris pentru lecția asta).
   Faptele despre PowerPoint sunt probate în PowerPoint-ul real, pe desktop ascuns (afirmatii.json, _proba/probe_fisier.json).
   ====================================================================================================== */
const Pz=SimPPTFisier.P, Fz=SimPPTFisier.F;
const salvata=(dir,nume,titlu)=>({app:'deschis',wins:[{pres:Pz({nume:nume+'.pptx',titlu,fis:{dir,nume,ext:'pptx'}})}],
  files:[Fz(dir,nume,'pptx',{titlu})],recent:[{dir,nume,ext:'pptx'}]});
SimPPTFisier.scenarii({
  l3_start:()=>({app:'start'}),
  l3_excursia:()=>({app:'deschis',wins:[{pres:Pz({nume:'Presentation1',titlu:'Excursia',salvat:false})}],
    files:[Fz('Documente','Excursia_6A_Ion','pptx',{titlu:'Excursia la munte'})]}),
  l3_tic:()=>({app:'deschis',wins:[{pres:Pz({nume:'Presentation1',titlu:'Robotul',salvat:false})}],dirs:['Documente/TIC_6A'],
    files:[Fz('Documente/TIC_6A','Robotul_6A_Ion','pptx',{titlu:'Robotul meu'})]}),
  l3_plante:()=>salvata('Documente','Plante_6A_Pop','Plante'),
  l3_vulcani:()=>salvata('Documente','Vulcanii_6A_Pop','Vulcanii'),
  l3_orar:()=>salvata('Documente','Orar_6A_Pop','Orarul clasei'),
  l3_zoo:()=>salvata('Documente','Zoo_6A_Pop','Zoo'),
  l3_ploaia:()=>salvata('Documente','Ploaia_6A_Pop','Ploaia'),
  l3_deschide:()=>({app:'deschis',wins:[{pres:null}],
    files:[Fz('Documente','Plante_6A_Ion','pptx',{titlu:'Plantele mele'}),Fz('Documente','Plante_6A_Pop','pptx',{titlu:'Plante'}),Fz('Documente','Plante_6A_Pop','pdf',{titlu:'Plante'})]}),
  l3_descarcat:()=>({app:'deschis',wins:[{pres:null}],
    files:[Fz('Descărcări','ciclul-apei-de-reparat','pptx',{titlu:'Ciclul apei'},{internet:true})]}),
  l3_frati:()=>({app:'deschis',wins:[{pres:Pz({nume:'Presentation1',titlu:'Excursia',salvat:false})}],
    files:[Fz('Documente','Excursia_6A_Pop','pptx',{titlu:'Excursia la mare'})]}),
  l3_castele:()=>({app:'deschis',wins:[{pres:Pz({nume:'Presentation1',titlu:'Castele',salvat:false})}],
    files:[Fz('Documente','Castele_6B_Ana','pptx',{titlu:'Castele din România'})]}),
  l3_atelier:()=>({app:'oprit',files:[Fz('Documente','Toamna_6A_Ion','pptx',{titlu:'Toamna la țară'})],recent:[{dir:'Documente',nume:'Toamna_6A_Ion',ext:'pptx'}]})
});

const IMG={'bibliorafturi-etichete':[800,534],'salvare-ca-tipuri':[890,446]};
const fig=(f,alt,cap)=>`<figure class="captura"><a href="../m1-l03/img/${f}.webp" target="_blank"><img src="../m1-l03/img/${f}.webp" alt="${alt}" width="${IMG[f][0]}" height="${IMG[f][1]}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CONT='Operații de gestionare a prezentărilor: creare, deschidere, expunere, salvare în diverse formate, închidere';
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat, în engleză, ca pe unele calculatoare din laborator; lângă butoanele din lecție scrie cu gri și numele românesc. Pe un PowerPoint în română, și titlurile ferestrelor sunt în română. Tastele le ai și ca butoane sub fereastră. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const SIM_INTRO=`<p>Mai jos e un <strong>PowerPoint simulat</strong>, cu meniurile în engleză, ca pe unele calculatoare din laborator (pe altele PowerPoint e în română; numele românești le ai în pași și, cu gri, lângă butoane). Dedesubt e un <strong>File Explorer</strong> simplificat: vezi ce fișiere sunt în folder. <strong>Testele se bifează singure</strong>, apoi apeși <b>Verifică</b>.</p>
<ul><li><b>Tastele</b> <kbd>Ctrl</kbd>+<kbd>N</kbd>, <kbd>Ctrl</kbd>+<kbd>O</kbd>, <kbd>Ctrl</kbd>+<kbd>S</kbd>, <kbd>F12</kbd>, <kbd>Esc</kbd> le ai și ca butoane sub fereastră. Pe telefon nu există. Pe calculator, <kbd>Ctrl</kbd>+<kbd>N</kbd> apăsat pe tastatură deschide o fereastră nouă de browser: în pagină folosește butonul.</li>
<li><b>Bara de jos</b> arată ferestrele PowerPoint deschise, ca bara de activități din Windows.</li>
<li><b>Titlurile ferestrelor</b> (Save this file, Save your changes to this file?, Confirm Save As) le vezi aici în engleză. Pe un PowerPoint în română sunt scrise în română.</li></ul>`;

const LECTIA={
 t:'Operații de gestionare: creare, deschidere, salvare în diverse formate, închidere',lectii:[3],continuturi:[CONT],final:true,
 obiectiv:'creezi o prezentare nouă, o salvezi cu un nume bun în folderul potrivit, faci din ea un PDF, o expunere sau o imagine, o închizi fără să pierzi nimic și o deschizi din nou.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Tot ce lucrezi în PowerPoint stă într-un <strong>fișier</strong> (clasa a V-a). Fișierul îl creezi, îl pui pe disc cu un nume, îl deschizi data viitoare și îl închizi la final. Acestea sunt <mark>operațiile de gestionare</mark>.</p>
<p>Calculatorul din laborator e al tuturor. Dacă lași lucrarea cu numele „Presentation1”, ora viitoare nu o mai găsești sau o acoperă colegul. E ca la bibliorafturile de pe raft: fiecare are pe cotor o etichetă clară și stă la locul lui.</p>
${fig('bibliorafturi-etichete','Bibliorafturi portocalii și verzi așezate pe un raft; fiecare are pe cotor o etichetă albă scrisă de mână','Bibliorafturi pe un raft, fiecare cu eticheta lui. Fotografie: Shixart1985, <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC BY 2.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Collection_of_colorful_binders_on_a_shelf_for_storing_documents_in_an_office_setting.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (redimensionată).')}
<p class="nevoie"><b>Ai nevoie de:</b> lecția 2 (fereastra PowerPoint: panglica, filele și <b>expunerea</b>, adică prezentarea pe tot ecranul) și clasa a V-a (fișier, folder, extensie, File Explorer, dublu clic, fișier descărcat de pe internet).</p>`},
  /* ---------- pasul 1: prezentare nouă ---------- */
  {t:'Prezentare nouă: goală sau cu o temă',
   text:`<p>Când pornești PowerPoint, apare <mark>ecranul de început</mark>. Pe el alegi:</p>
<ul><li><strong>Prezentare necompletată (Blank Presentation)</strong>: o prezentare albă, cu un singur <strong>diapozitiv</strong>, adică o pagină a prezentării. Pe el scrie <i>Click to add title</i>: dai clic acolo și scrii titlul;</li>
<li>o <mark>temă</mark>, de exemplu Madison: culori, fonturi și fundal gata alese. Dai clic pe ea, apoi pe <strong>Creare (Create)</strong>. Tema se descarcă de pe internet.</li></ul>
<p>Cu PowerPoint deja deschis: <strong>Fișier (File) › Nou (New) › Prezentare necompletată (Blank Presentation)</strong> sau tastele <kbd>Ctrl</kbd>+<kbd>N</kbd>. Prezentarea nouă apare în fereastra ei. Sus, pe bara ferestrei, scrie Presentation1, Presentation2… (în română: Prezentare1…) până o salvezi.</p>`,
   exemplu:`<p>Ana pornește PowerPoint și dă clic pe <b>Blank Presentation</b>. Sus scrie „Presentation1 - PowerPoint”.</p>
<p>Vrea încă o prezentare, pentru istorie. Apasă <kbd>Ctrl</kbd>+<kbd>N</kbd>: apare a doua fereastră, „Presentation2 - PowerPoint”. Prima fereastră e tot deschisă, în spatele celei noi.</p>`,
   altfel:`<p>E ca la caiete. Prezentarea goală e un caiet nou, cu foi albe. Prezentarea cu temă e un caiet care are deja coperta și culorile alese: tu scrii doar ce vrei să spui.</p>`,
   incearca:{t:'pptf',q:SIM_SCURT+'PowerPoint e pornit, pe ecranul de început. Fă o prezentare <b>goală</b>. Apoi, fără s-o închizi, fă încă una goală, cu <kbd>Ctrl</kbd>+<kbd>N</kbd> (butonul de sub fereastră).',start:{scen:'l3_start'},
     teste:[{ce:'E deschisă o prezentare goală',c:[{k:'goale',n:1}],ajutor:'Pe ecranul de început, clic pe Blank Presentation (Prezentare necompletată).'},
       {ce:'Sunt deschise două prezentări goale, fiecare în fereastra ei',c:[{k:'goale',n:2},{k:'nprez',n:2}],ajutor:'Cu prima prezentare deschisă, apasă butonul Ctrl+N de sub fereastră. Ai făcut prea multe? Închide una cu ✕.'}],
     rez:['blank','k:ctrl+n'],gresit:['blank'],
     rezText:'Blank Presentation (Prezentare necompletată) → Ctrl+N',ajutor:'Întâi Blank Presentation, apoi Ctrl+N.',
     why:'Blank Presentation a făcut prima prezentare goală, iar Ctrl+N a doua, în fereastra ei. Pe bara de jos se văd amândouă ferestrele.'},
   inca:[
    {t:'pptf',q:SIM_SCURT+'Pe ecranul de început, fă o prezentare nouă cu tema <b>Atlas</b>.',start:{scen:'l3_start'},
     teste:[{ce:'E deschisă o prezentare cu tema Atlas',c:[{k:'tema',val:'Atlas'}],ajutor:'Clic pe tema Atlas, apoi pe Create (Creare).'}],
     rez:[{tema:'Atlas'},'create'],gresit:['blank'],rezText:'clic pe Atlas → Create (Creare)',ajutor:'Tema se alege cu un clic, apoi Create.',
     why:'Clicul pe temă a deschis previzualizarea, iar Create a făcut prezentarea. Până o salvezi, bara ferestrei arată numele temei.'},
    {t:'choice',q:'PowerPoint e deschis și lucrezi la o prezentare. Vrei încă una, goală, fără s-o închizi pe cea de acum. Ce faci?',
     o:['Apeși Ctrl+N','Apeși Ctrl+S','Închizi PowerPoint și îl pornești din nou','Ștergi tot ce ai scris în prezentarea de acum'],ok:0,
     ajutor:'Care taste fac o prezentare nouă?',why:'Ctrl+N face o prezentare nouă, în fereastra ei, iar cea veche rămâne deschisă. Ctrl+S salvează, nu face una nouă.'}
   ]},
  /* ---------- pasul 2: prima salvare ---------- */
  {t:'Prima salvare: numele și folderul',
   text:`<p>Prima dată când salvezi cu <kbd>Ctrl</kbd>+<kbd>S</kbd>, apare fereastra <strong>Save this file</strong> (în română: Salvați acest fișier):</p>
<ol><li>la <strong>Nume fișier (File name)</strong> scrii subiectul, clasa și numele tău, legate cu liniuța de jos <code>_</code> (Shift + tasta cu minus, de lângă 0): <code>Vacanta_6A_Popescu</code>;</li>
<li>verifici că locul e <strong>Documents</strong> (folderul Documente). Alt folder, scris pe tablă? <strong>Mai multe opțiuni (More options)</strong> › <strong>Răsfoire (Browse)</strong> și îl cauți cu dublu clic, ca în File Explorer;</li>
<li>apeși <strong>Salvare (Save)</strong>.</li></ol>
<p>Numele există deja? PowerPoint întreabă „… already exists. Do you want to replace the existing file?”. Apeși <strong>Anulare (Cancel)</strong> și schimbi numele. Cu OK, fișierul colegului se pierde.</p>`,
   exemplu:`<p>Ana a scris pe diapozitiv titlul „Vacanța mea” și apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>. La File name, PowerPoint îi propune chiar titlul. Ea îl șterge și scrie <code>Vacanta_6A_Pop</code>. Locul e Documents. Apasă <b>Save</b>.</p>
<p>Sus, în locul lui Presentation1, scrie acum numele fișierului. Extensia <code>.pptx</code> a pus-o PowerPoint singur.</p>`,
   altfel:`<p>Gândește-te la un biblioraft nou. Până nu-i scrii eticheta și nu-l pui pe raft, nu-l găsește nimeni. Numele fișierului e eticheta, iar folderul e raftul.</p>`,
   incearca:{t:'pptf',explorer:'Documente',q:SIM_SCURT+'Prezentarea „Excursia” n-a fost salvată niciodată. Salveaz-o în folderul Documente, cu numele <b>Excursia_6A_Pop</b>. În Documente e deja fișierul colegului Ion.',start:{scen:'l3_excursia'},
     teste:[{ce:'În Documente e fișierul Excursia_6A_Pop.pptx, cu titlul Excursia',c:[{k:'fisier',dir:'Documente',nume:'Excursia_6A_Pop',ext:'pptx',titlu:'Excursia'}],ajutor:'Ctrl+S; la File name scrie Excursia_6A_Pop; Save.'},
       {ce:'Fișierul lui Ion, Excursia_6A_Ion.pptx, a rămas neatins',c:[{k:'neschimbat',dir:'Documente',nume:'Excursia_6A_Ion',ext:'pptx'}],ajutor:'Nu salva peste fișierul colegului. Ia-o de la capăt, dacă s-a întâmplat.'},
       {ce:'Lucrezi acum în Excursia_6A_Pop.pptx (bara de sus arată numele)',c:[{k:'deschis',nume:'Excursia_6A_Pop',ext:'pptx'}],ajutor:'După Save, fereastra se închide și bara de sus arată numele nou.'}],
     rez:['k:ctrl+s',{nume:'Excursia_6A_Pop'},'d:save'],gresit:['k:ctrl+s','d:save'],
     rezText:'Ctrl+S → la File name (Nume fișier) scrii Excursia_6A_Pop → Save (Salvare)',ajutor:'Numele propus e doar titlul. Îl schimbi înainte de Save.',
     why:'La prima salvare ai ales numele și locul. Numele cu clasa și cu numele tău nu se bate cu al lui Ion.'},
   inca:[
    {t:'pptf',explorer:'Documente',q:SIM_SCURT+'Profesorul a scris pe tablă: „Salvați în Documente › TIC_6A”. Salvează prezentarea „Robotul” acolo, cu numele <b>Robotul_6A_Pop</b>.',start:{scen:'l3_tic'},
     teste:[{ce:'În Documente › TIC_6A e Robotul_6A_Pop.pptx',c:[{k:'fisier',dir:'Documente/TIC_6A',nume:'Robotul_6A_Pop',ext:'pptx'}],ajutor:'Ctrl+S → More options (Mai multe opțiuni) → Browse (Răsfoire) → în Documente, dublu clic pe folderul TIC_6A (pe telefon: două atingeri repezi) → nume → Save.'},
       {ce:'Nu ai lăsat un fișier Robotul_6A_Pop direct în Documente',c:[{k:'lipsa',dir:'Documente',nume:'Robotul_6A_Pop',ext:'pptx'}],ajutor:'Locul se alege înainte de Save.'}],
     rez:['k:ctrl+s','d:more','browse-save','intra:Documente/TIC_6A',{nume:'Robotul_6A_Pop'},'d:save'],gresit:['k:ctrl+s',{nume:'Robotul_6A_Pop'},'d:save'],
     rezText:'Ctrl+S → More options → Browse → dublu clic pe folderul TIC_6A din Documente → File name: Robotul_6A_Pop → Save',ajutor:'Alt folder decât Documents? More options, apoi Browse.',
     why:'More options și Browse te duc la fereastra în care alegi orice folder. Acolo ai intrat în TIC_6A, apoi ai salvat.'},
    {t:'pptf',explorer:'Documente',q:SIM_SCURT+'În clasă mai e un Pop: în Documente e deja <b>Excursia_6A_Pop.pptx</b>, al lui. Salvează prezentarea ta, „Excursia”, cu numele <b>Excursia_6A_Pop</b> și vezi ce întreabă PowerPoint. Nu-i înlocui fișierul: salvează-l pe al tău ca <b>Excursia_6A_Pop_Ana</b>.',start:{scen:'l3_frati'},
     teste:[{ce:'PowerPoint a întrebat dacă înlocuiești fișierul, iar tu ai apăsat Anulare',c:[{k:'ev',e:'inlocuireAnulare'}],ajutor:'Ctrl+S, File name: Excursia_6A_Pop, Save; la întrebare apasă Anulare (Cancel).'},
       {ce:'Fișierul colegului, Excursia_6A_Pop.pptx, a rămas neatins',c:[{k:'neschimbat',dir:'Documente',nume:'Excursia_6A_Pop',ext:'pptx'}],ajutor:'OK ar fi înlocuit fișierul colegului. Ia-o de la capăt.'},
       {ce:'În Documente e Excursia_6A_Pop_Ana.pptx',c:[{k:'fisier',dir:'Documente',nume:'Excursia_6A_Pop_Ana',ext:'pptx'}],ajutor:'După Anulare ești din nou în Save this file: schimbă numele în Excursia_6A_Pop_Ana și apasă Save.'}],
     rez:['k:ctrl+s',{nume:'Excursia_6A_Pop'},'d:save','i:anulare',{nume:'Excursia_6A_Pop_Ana'},'d:save'],gresit:['k:ctrl+s',{nume:'Excursia_6A_Pop'},'d:save','i:ok'],
     rezText:'Ctrl+S → File name: Excursia_6A_Pop → Save → Anulare (Cancel) → File name: Excursia_6A_Pop_Ana → Save',ajutor:'La „already exists”, Anulare lasă fișierul colegului neatins.',
     why:'Anulare te-a întors în fereastra de salvare, fără să atingă fișierul colegului. Cu prenumele în plus, numele tău e altul.'},
    {t:'choice',q:'Ce nume e bun pentru prezentarea ta despre munți, la calculatorul comun din laborator? Ești Maria Ionescu, în clasa a VI-a B.',
     o:['Muntii_6B_Ionescu','Presentation1','munti','Prezentarea mea'],ok:0,ajutor:'Subiectul, clasa, numele tău.',
     why:'Muntii_6B_Ionescu spune ce e, din ce clasă și al cui e. Celelalte se pot încurca ușor cu ale colegilor.'}
   ]},
  /* ---------- pasul 3: Salvare sau Salvare ca ---------- */
  {t:'Salvare sau Salvare ca',
   text:`<p>După prima salvare, prezentarea are nume și folder. De acum:</p>
<ul><li><strong>Salvare (Save)</strong>, adică <kbd>Ctrl</kbd>+<kbd>S</kbd>, scrie ce ai lucrat <mark>în același fișier</mark>. Nu mai apare nicio fereastră. Apasă-l des.</li>
<li><strong>Salvare ca (Save As)</strong> face un <mark>fișier nou</mark>: alt nume, alt folder sau alt format (pasul următor). Drumul: <strong>Fișier (File) › Salvare ca (Save As) › Răsfoire (Browse)</strong> sau tasta <kbd>F12</kbd>. Fișierul vechi rămâne cum era la ultima salvare.</li></ul>
<p>La Salvare ca, dacă alegi un nume care există deja, apare <strong>Confirm Save As</strong>: „… already exists. Do you want to replace it?”. Apeși <strong>No (Nu)</strong> și schimbi numele. Cu Yes, fișierul vechi se pierde.</p>`,
   exemplu:`<p>Ana a salvat <code>Vacanta_6A_Pop</code>. Mai scrie ceva și apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>: nicio fereastră, gata.</p>
<p>Vrea o copie pe care să încerce altceva. Apasă <kbd>F12</kbd>, la File name scrie <code>Vacanta_6A_Pop_v2</code>, apoi Save. Acum lucrează în <code>Vacanta_6A_Pop_v2</code>, iar în Documente sunt amândouă fișierele.</p>`,

  /* ---------- pasul 4: formatele ---------- */
  {t:'Formatul: la ce folosește fiecare',
   text:`<p>În fereastra Salvare ca, lista <strong>Salvare cu tipul (Save as type)</strong> alege <mark>formatul</mark>, adică extensia fișierului:</p>
<ul><li><code>.pptx</code>, PowerPoint Presentation: ca să mai <strong>lucrezi</strong> la prezentare;</li>
<li><code>.pdf</code>, PDF: ca s-o <strong>citească</strong> oricine, pe orice calculator sau telefon; diapozitivele nu se mai modifică;</li>
<li><code>.ppsx</code>, <strong>Expunere PowerPoint (PowerPoint Show)</strong>: la dublu clic pornește direct <strong>expunerea</strong>, pe tot ecranul;</li>
<li><code>.png</code> sau <code>.jpg</code>: diapozitivul devine <strong>imagine</strong>. PowerPoint întreabă: All Slides (toate, câte o imagine, într-un folder nou) sau Just This One (doar acesta).</li></ul>
${fig('salvare-ca-tipuri','Fereastra Save As din PowerPoint cu lista Save as type deschisă; încadrate cu roșu: PowerPoint Presentation .pptx, PDF .pdf, PowerPoint Show .ppsx, JPEG .jpg și PNG .png','Lista <b>Salvare cu tipul</b> (Save as type) din fereastra Salvare ca: <code>.pptx</code>, <code>.pdf</code>, <code>.ppsx</code>, <code>.jpg</code>, <code>.png</code>. Captură din PowerPoint în engleză.')}`,
   exemplu:`<p>Ana are <code>Vacanta_6A_Pop.pptx</code>. Pentru bunica: <kbd>F12</kbd>, la Save as type alege <b>PDF</b>, apoi Save. Pentru serbare: încă o dată <kbd>F12</kbd>, alege <b>PowerPoint Show</b>, apoi Save.</p>
<p>În Documente are acum trei fișiere cu același nume și extensii diferite. Atenție: după PDF, fereastra rămâne la <code>.pptx</code>; după <code>.ppsx</code>, lucrezi în <code>.ppsx</code>.</p>`,
   altfel:`<p><code>.pptx</code> e ca un desen în creion: îl mai poți schimba. PDF-ul e ca o fotocopie a lui: arată la fel oriunde, dar pe ea nu mai desenezi.</p>`,
   incearca:{t:'choice',q:'Vrei să trimiți pe grupul clasei <b>un singur diapozitiv</b>, cel cu orarul, ca poză pe care colegii o văd pe telefon. Ce alegi în fereastra Salvare ca?',
     o:['PNG (.png), apoi Just This One','PNG (.png), apoi All Slides','PowerPoint Show (.ppsx)','PowerPoint Presentation (.pptx)'],ok:0,
     ajutor:'O poză, și doar diapozitivul acesta.',
     why:'PNG face din diapozitiv o imagine, iar Just This One salvează doar diapozitivul de acum. All Slides ar face câte o imagine pentru fiecare diapozitiv, într-un folder.'},
   inca:[
    {t:'pptf',explorer:'Documente',q:SIM_SCURT+'Lucrezi în <b>Orar_6A_Pop.pptx</b>. Salvează-l și ca <b>PDF</b>, și ca <b>Expunere PowerPoint (.ppsx)</b>, în Documente, cu același nume.',start:{scen:'l3_orar'},
     teste:[{ce:'În Documente e Orar_6A_Pop.pdf',c:[{k:'fisier',dir:'Documente',nume:'Orar_6A_Pop',ext:'pdf'}],ajutor:'F12 → Save as type: PDF (*.pdf) → Save.'},
       {ce:'În Documente e Orar_6A_Pop.ppsx',c:[{k:'fisier',dir:'Documente',nume:'Orar_6A_Pop',ext:'ppsx'}],ajutor:'F12 → Save as type: PowerPoint Show (*.ppsx) → Save.'},
       {ce:'Orar_6A_Pop.pptx a rămas neatins',c:[{k:'neschimbat',dir:'Documente',nume:'Orar_6A_Pop',ext:'pptx'}],ajutor:'La tipul .pptx nu ai de salvat nimic acum.'}],
     rez:['k:f12',{tip:'pdf'},'d:save','k:f12',{tip:'ppsx'},'d:save'],gresit:['k:f12',{tip:'pdf'},'d:save'],
     rezText:'F12 → Save as type: PDF → Save; F12 → Save as type: PowerPoint Show → Save',ajutor:'Fiecare format cere câte o Salvare ca.',
     why:'Fiecare Salvare ca a făcut un fișier nou, cu alt format: PDF pentru citit, .ppsx pentru expunere.'},
    {t:'choice',q:'Doamna dirigintă vrea să citească prezentarea pe telefon, într-o pauză. Nu are PowerPoint și nu vrea s-o modifice. Ce format îi trimiți?',
     o:['PDF (.pdf)','PowerPoint Presentation (.pptx)','PowerPoint Show (.ppsx)','PNG, cu All Slides'],ok:0,ajutor:'Pentru citit, oriunde.',
     why:'PDF-ul se citește pe orice telefon sau calculator. Un .pptx sau un .ppsx cer un program de prezentări.'}
   ]},
  /* ---------- pasul 5: închiderea ---------- */
  {t:'Închizi prezentarea sau PowerPoint',
   text:`<p>Sunt două feluri de a închide:</p>
<ul><li><strong>Fișier (File) › Închidere (Close)</strong> închide doar prezentarea. Dacă era singura, PowerPoint rămâne deschis, cu fereastra goală; altfel, fereastra ei dispare.</li>
<li><strong>✕</strong> din colțul ferestrei închide fereastra. Dacă era ultima fereastră PowerPoint, se închide tot PowerPoint.</li></ul>
<p>Dacă ai lucrat ceva după ultima salvare, PowerPoint întreabă <strong>Save your changes to this file?</strong> și îți dă trei butoane:</p>
<ul><li><strong>Salvare (Save)</strong>: salvează, apoi închide;</li><li><strong>Nu salvați (Don't Save)</strong>: închide, iar ce ai lucrat de la ultima salvare se <strong>pierde</strong>;</li><li><strong>Anulare (Cancel)</strong>: nu închide nimic.</li></ul>`,
   exemplu:`<p>Ana schimbă titlul și dă clic pe ✕. Apare întrebarea. Vrea titlul nou, deci alege <b>Save</b>. Fereastra se închide și, fiind singura, se închide tot PowerPoint.</p>
<p>Altă dată apasă ✕ din greșeală, în mijlocul lucrului. La întrebare alege <b>Cancel</b> și lucrează mai departe.</p>`,
   altfel:`<p>File › Close e ca atunci când închizi un caiet, dar rămâi la bancă, cu ghiozdanul deschis. ✕ pe ultima fereastră e ca atunci când strângi tot și pleci din clasă.</p>`,
   incearca:{t:'pptf',q:SIM_SCURT+'Lucrezi în <b>Zoo_6A_Pop.pptx</b>. Schimbă titlul în <b>La grădina zoologică</b>. Apoi închide <b>doar prezentarea</b>, din fila File, fără să pierzi titlul nou. PowerPoint trebuie să rămână deschis.',start:{scen:'l3_zoo'},
     teste:[{ce:'Zoo_6A_Pop.pptx are titlul La grădina zoologică',c:[{k:'fisier',dir:'Documente',nume:'Zoo_6A_Pop',ext:'pptx',titlu:'La grădina zoologică'}],ajutor:'La întrebarea de la închidere alege Save (Salvare).'},
       {ce:'PowerPoint e deschis, fără nicio prezentare',c:[{k:'app',stare:'goala'}],ajutor:'File → Close, nu ✕.'}],
     rez:[{titlu:'La grădina zoologică'},'file','bs:close','d:save'],gresit:[{titlu:'La grădina zoologică'},'file','bs:close','d:dont'],
     rezText:'clic pe titlu → La grădina zoologică → File (Fișier) → Close (Închidere) → Save (Salvare)',ajutor:'Close închide prezentarea; la întrebare, Save păstrează titlul.',
     why:'File › Close a închis doar prezentarea, iar Save a păstrat titlul nou. PowerPoint a rămas deschis, gata pentru altă prezentare.'},
   inca:[
    {t:'choice',q:'Ai apăsat din greșeală ✕ și apare <b>Save your changes to this file?</b>. Nu ai terminat și vrei să lucrezi mai departe. Ce apeși?',
     o:['Anulare (Cancel)','Nu salvați (Don\'t Save)','Salvare (Save)','Încă o dată ✕, pe fereastra PowerPoint'],ok:0,ajutor:'Care buton nu închide nimic?',
     why:'Cancel oprește închiderea: prezentarea rămâne deschisă, cu tot ce ai lucrat. Save și Don\'t Save o închid.'},
    {t:'choice',q:'Ai o singură prezentare deschisă, salvată de curând, fără nimic nou. Dai clic pe ✕ din colțul ferestrei. Ce se întâmplă?',
     o:['Se închide tot PowerPoint, fără nicio întrebare','Rămâne PowerPoint cu fereastra goală','Apare Save your changes to this file?','Nu se întâmplă nimic'],ok:0,ajutor:'Era ultima fereastră și nu avea nimic nesalvat.',
     why:'✕ închide fereastra, iar pentru că era ultima, se închide tot PowerPoint. Întrebarea apare doar dacă ai ceva nesalvat.'}
   ]},
  /* ---------- pasul 6: deschiderea ---------- */
  {t:'Deschizi o prezentare salvată',
   text:`<p>Ora viitoare o <mark>deschizi</mark>:</p>
<ul><li>Din PowerPoint: <strong>Fișier (File) › Deschidere (Open)</strong> sau <kbd>Ctrl</kbd>+<kbd>O</kbd>. Pe un calculator comun, în lista Recent pot fi și fișierele colegilor: citește numele. Dacă nu e acolo, apeși <strong>Răsfoire (Browse)</strong>, cauți folderul (în stânga sau cu dublu clic), alegi fișierul, apoi <strong>Deschidere (Open)</strong>.</li>
<li>Din File Explorer: dublu clic pe fișier. Un <code>.pptx</code> se deschide în PowerPoint. Un <code>.ppsx</code> pornește expunerea; ca să-l modifici, îl deschizi din PowerPoint.</li></ul>
<p>Un fișier de pe internet se deschide cu bara galbenă <strong>Vizualizare protejată (Protected View)</strong>. Pentru <strong>editare</strong> (să modifici și să salvezi) apeși pe ea <strong>Activare editare (Enable Editing)</strong>.</p>`,
   exemplu:`<p>Marți, Ana pornește PowerPoint. În lista Recent vede <code>Vacanta_6A_Ion.pptx</code> și <code>Vacanta_6A_Pop.pptx</code>. Dă clic pe al ei. Prezentarea se deschide exact cum a salvat-o ultima dată.</p>`,
   altfel:`<p>E ca la biblioteca școlii: cauți pe raft (folderul) cartea cu eticheta ta (numele) și o deschizi acolo unde ai rămas.</p>`,
   incearca:{t:'pptf',explorer:'Documente',q:SIM_SCURT+'PowerPoint e deschis, fără nicio prezentare. Deschide <b>prezentarea</b> ta, <b>Plante_6A_Pop.pptx</b>, din Documente. Lista Recent e goală, deci folosește Browse (Răsfoire).',start:{scen:'l3_deschide'},
     teste:[{ce:'E deschisă Plante_6A_Pop.pptx',c:[{k:'deschis',dir:'Documente',nume:'Plante_6A_Pop',ext:'pptx'}],ajutor:'Ctrl+O → Browse → Documente → Plante_6A_Pop.pptx → Open. Atenție la numele colegului.'}],
     rez:['k:ctrl+o','browse-open',{alege:'Plante_6A_Pop.pptx'},'d:open'],gresit:['k:ctrl+o','browse-open',{alege:'Plante_6A_Ion.pptx'},'d:open'],
     rezText:'Ctrl+O → Browse (Răsfoire) → Documente → Plante_6A_Pop.pptx → Open (Deschidere)',ajutor:'Fișierul tău are numele tău în nume.',
     why:'Ai deschis prezentarea ta, nu pe a colegului: ai citit numele înainte de Open.'},
   inca:[
    {t:'pptf',explorer:'Descărcări',q:SIM_SCURT+'Ai descărcat de pe sit prezentarea <b>ciclul-apei-de-reparat.pptx</b>. Deschide-o din File Explorer (folderul Descărcări) și fă-o gata de lucru.',start:{scen:'l3_descarcat'},
     teste:[{ce:'E deschisă ciclul-apei-de-reparat.pptx',c:[{k:'deschis',nume:'ciclul-apei-de-reparat',ext:'pptx'}],ajutor:'În File Explorer, la fișier, butonul Deschide (ca dublu clic).'},
       {ce:'Ai apăsat Enable Editing (Activare editare) pe bara galbenă',c:[{k:'ev',e:'enable'}],ajutor:'Bara galbenă Protected View are butonul Enable Editing.'}],
     rez:[{ex:'ciclul-apei-de-reparat.pptx'},'enable'],gresit:[{ex:'ciclul-apei-de-reparat.pptx'}],
     rezText:'File Explorer → Descărcări → Deschide (dublu clic) → Enable Editing (Activare editare)',ajutor:'Un fișier de pe internet se deschide întâi doar pentru citit.',
     why:'Fișierul venit de pe internet s-a deschis în Protected View. Enable Editing te lasă să-l modifici și să-l salvezi.'},
    {t:'choice',q:'Dai dublu clic, în File Explorer, pe <code>Serbare_6A_Pop.ppsx</code>. Ce se întâmplă?',
     o:['Pornește direct expunerea, pe tot ecranul','Se deschide în PowerPoint, gata de modificat','Se deschide ca PDF','Apare fereastra Save As'],ok:0,ajutor:'Ce e un .ppsx?',
     why:'Un .ppsx e o Expunere PowerPoint: la dublu clic pornește expunerea. Ca să-l modifici, îl deschizi din PowerPoint, cu File › Open.'}
   ]}
 ],

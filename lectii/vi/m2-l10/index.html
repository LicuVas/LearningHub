<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluare sumativă: prezentări digitale</title>
<meta name="description" content="Lecția 10, clasa a VI-a (TIC): evaluarea sumativă a capitolului despre prezentări. Afli ce fel de cerințe are proba practică, cum faci din cerință o listă de bife, ce înseamnă o animație justificată și cum te verifici cu grila profesorului. Apoi dai o probă de antrenament, în PowerPoint simulat și în PowerPoint-ul din laborator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Libre+Franklin:wght@400;600;700&family=Cousine:wght@400;700&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EEF2EF; --paper:#FFFFFF; --paper2:#F3F7F4; --line:#CFDDD5;
  --ink:#16221C; --ink2:#4A5C53; --accent:#0B6B5B; --accentInk:#FFFFFF; --sel:#D4EDE6;
  --mark:#FFE08A; --markInk:#16221C; --ok:#1E7A4A; --okbg:#E2F3E8; --bad:#B3261E; --badbg:#FBE6E3;
  --fd:"Bree Serif",Georgia,serif; --fb:"Libre Franklin","Segoe UI",system-ui,sans-serif; --fm:"Cousine",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1714; --paper:#17221E; --paper2:#1E2B26; --line:#34473F;
  --ink:#E4EFEA; --ink2:#A9BDB4; --accent:#5FD1B9; --accentInk:#0F1714; --sel:#1F4A40;
  --mark:#F2C94C; --markInk:#16221C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#0F1714; --paper:#17221E; --paper2:#1E2B26; --line:#34473F;
  --ink:#E4EFEA; --ink2:#A9BDB4; --accent:#5FD1B9; --accentInk:#0F1714; --sel:#1F4A40;
  --mark:#F2C94C; --markInk:#16221C; --ok:#6FD19A; --okbg:#173226; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda de sus: cerința devine o listă de bife, apoi prezentarea, apoi verificarea; doar CSS */
.banda{display:flex;gap:8px;padding:6px 12px;min-height:36px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.banda .foaie{flex:0 0 auto;width:20px;height:26px;border:1px solid var(--ink2);border-radius:2px;background:
  linear-gradient(var(--ink2),var(--ink2)) 3px 6px/12px 1px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 3px 11px/12px 1px no-repeat,
  linear-gradient(var(--ink2),var(--ink2)) 3px 16px/12px 1px no-repeat,linear-gradient(var(--ink2),var(--ink2)) 3px 21px/8px 1px no-repeat}
.banda .sag{flex:0 0 auto;width:14px;height:2px;background:var(--ink2);position:relative}
.banda .sag::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--ink2);border-right:0}
.banda .dz{flex:0 0 auto;width:36px;height:22px;border:1px solid var(--ink2);border-radius:2px;
  background:linear-gradient(var(--accent),var(--accent)) 5px 5px/18px 3px no-repeat,linear-gradient(var(--line),var(--line)) 5px 12px/24px 2px no-repeat}
.banda .bifa{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);position:relative}
.banda .bifa::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:10px;border:solid var(--accentInk);border-width:0 3px 3px 0;transform:rotate(45deg)}
h1{font-size:clamp(1.55rem,6.2vw,2.7rem);font-weight:400;letter-spacing:-.005em}
h1 .acc{color:var(--accent)}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:360px}
.reading ol li,.reading ul li{margin:.2em 0}
/* legăturile spre lecțiile anterioare: zonă de atins de cel puțin 32 px în înălțime (regula 20), fără să mute rândul */
a.lk{padding:7px 2px;border-radius:4px}
/* cerința probei de antrenament: chenar punctat, ca o foaie de lucru */
.cerinta{border:2px dashed var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--paper)}
.cerinta ol{margin:.3em 0 .3em 1.2em;padding:0}
.cerinta li{margin:.2em 0}
/* grila profesorului (copiată exact, ca în lecția 9): pe telefon nu se rupe în litere; se derulează în chenarul ei */
.autover{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--paper)}
.autover details.grila summary{min-height:32px;display:flex;align-items:center;cursor:pointer;color:var(--accent);font-weight:600}
.plan-tab{overflow-x:auto;max-width:100%}
.autover .grila table{border-collapse:collapse;font-size:.88em}
.autover .grila th,.autover .grila td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.autover .grila th{background:var(--paper2)}
.autover .grila .plan-tab{margin-top:6px}
.autover .grila .plan-tab table{min-width:600px}
.autover .grila th,.autover .grila td{overflow-wrap:normal;word-break:normal;hyphens:none}
.autover .grila th:nth-child(2),.autover .grila td:nth-child(2){position:sticky;left:-1px;z-index:1;background:var(--paper);box-shadow:-4px 0 0 var(--paper),1px 0 0 var(--line)}
.autover .grila th:nth-child(2){background:var(--paper2);box-shadow:-4px 0 0 var(--paper2),1px 0 0 var(--line)}
@media (max-width:480px){.autover .grila .plan-tab table{min-width:440px;font-size:.8em}}
.autover .grila .plan-tab{scroll-snap-type:x mandatory}
.autover .grila th:nth-child(n+3){scroll-snap-align:end}
.descarca{display:inline-flex;align-items:center;min-height:40px;margin:4px 0}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/ui-panglica.js"></script>
<script src="../../../jocuri/_motor/panglica-powerpoint.js"></script>
<script src="../../_sim/simppt.js"></script>
<script src="../../_sim/simppt-formatare.js"></script>
<script src="../../_sim/simppt-animatii.js"></script>
<script src="../../_sim/simppt-proiect.js"></script>
<script src="../../_sim/simppt-proba.js"></script>
<script>
/* ======================================================================================================
   Lecția VI · M2 · nr. 10 — „Evaluare sumativă: prezentări digitale” (evaluare sumativă, 20.11.2026 la Brauner).
   NU PREDĂ NIMIC NOU: pregătește proba practică, cu trimiteri exacte la pașii lecțiilor 1-9 (titlurile exacte ale pașilor).
   AL PROFESORULUI (surse.md): felul cerințelor (data/activitati_lectii_V_VI.json, VI/10: „Probă practică: prezentare după
   specificații date (număr de diapozitive, obiecte obligatorii, o tranziție, o animație justificată) plus susținere scurtă.”,
   resurse „test practic de unitate, grila de produs”); grila (instrumente/Grila_produs.md, copiată exact, ca în lecția 9);
   nota (lecția 1, pașii „Lucrarea și nota ei” și „Munca ta pe LearningHub intră în notă”: doar trimiteri, nimic în plus).
   TESTUL PROFESORULUI NU EXISTĂ ÎNCĂ: pagina nu-l inventează. Proba de antrenament („Soarele” în pagină, „Calculatorul” în
   laborator) are tema și specificațiile autorului, spuse pe ecran ca ANTRENAMENT.
   Simulatoarele (neatinse): lectii/_sim/simppt.js + simppt-formatare.js (tipul ppt), simppt-animatii.js (ppta),
   simppt-proiect.js (condiția linieIncepe). Extensia NOUĂ a lecției: lectii/_sim/simppt-proba.js (proba de antrenament:
   fără bife până la prima verificare, prima verificare ținută doar în memoria paginii, „Sunt alt elev / Încep din nou”).
   Faptele despre PowerPoint: afirmatii.json (probate în PowerPoint real: _proba/probe_ppt_l10.py → .json).
   ====================================================================================================== */
const SF=SimPPTFormatare, DP=SF.diap, DA=SimPPTAnim.diap;
const CAS=(ref,x,y,txt,pt,w)=>Object.assign({tip:'caseta',ref,x,y,pt:pt||28,txt},w?{w}:{});

/* ---------------- prezentările simulate ---------------- */
SF.prezentari({
  /* atelierul, bucata 1: o prezentare nouă, ca după Blank Presentation (un diapozitiv Title Slide) */
  l10_nou:()=>[DP('d1','title',{})],
  /* atelierul, bucata 2: cele 4 diapozitive cu titluri (bucata 1 terminată, cu un nume de exemplu) */
  l10_titluri:()=>[DP('d1','title',{titlu:'Soarele',sub:'Ana Pop, clasa a VI-a'}),DP('d2','tc',{titlu:'Steaua noastră'}),
    DP('d3','tc',{titlu:'Ziua și noaptea'}),DP('d4','tc',{titlu:'Ce reținem'})],
  /* pasul „Cerința devine o listă de bife”: un diapozitiv gol, în plus */
  l10_vlad:()=>[DP('d1','title',{titlu:'Planetele',sub:'Vlad Ene, clasa a VI-a'}),DP('d2','tc',{titlu:'Marte',c1:'E a patra planetă de la Soare\nE numită planeta roșie'}),
    DP('d3','tc',{}),DP('d4','tc',{titlu:'Ce reținem',c1:'Marte e o planetă\nSurse: NASA'})],
  /* întrebarea 2: lipsește ultimul diapozitiv */
  l10_irina:()=>[DP('d1','title',{titlu:'Luna',sub:'Irina Dinu, clasa a VI-a'}),DP('d2','tc',{titlu:'Cum arată Luna',c1:'Are multe cratere\nNu are lumină proprie'}),
    DP('d3','tc',{titlu:'Cum se vede de pe Pământ',c1:'O vedem mai ales noaptea'})]
});
/* atelierul, bucățile 3 și 5: aceeași prezentare, desenată de simulatorul de efecte (lecția 7); la bucata 5, cu efectele puse */
const EFECTE=gata=>{const fx=k=>gata?{tr:{ef:'Fade',dur:0.5},an:k===3?[{t:'ref:sageata',ef:'Fade',start:'clic'}]:[]}:{};
  return [DA('d1','title',{titlu:'Soarele',sub:'Ana Pop, clasa a VI-a'},[],fx(1)),
    DA('d2','to',{titlu:'Steaua noastră'},[CAS('t',7,30,'Soarele e o stea\nNe dă lumină și căldură',28,48),{tip:'imagine',fis:'soare',ref:'soare',x:62,y:28,w:26,h:46}],fx(2)),
    DA('d3','to',{titlu:'Ziua și noaptea'},[CAS('t',7,30,'Pământul se învârte',28,50),{tip:'forma',forma:'arrowR',culoare:'albastru',ref:'sageata',x:56,y:56,w:16,h:15}],fx(3)),
    DA('d4','to',{titlu:'Ce reținem'},[CAS('t',7,30,'Fără Soare nu e viață\nSurse: NASA',28,60)],fx(4))]};
SimPPTAnim.prezentari({
  /* pasul „Animația justificată”: răspunsul apare abia după întrebare */
  l10_mare:()=>[DA('d1','title',{titlu:'Soarele și Pământul',sub:'Ioana Dinu, clasa a VI-a'}),
    DA('d2','to',{titlu:'Ce e mai mare?'},[CAS('q',7,30,'Soarele sau Pământul?',32,60),CAS('r',7,55,'Soarele: e mult mai mare\ndecât Pământul.',28,80)])],
  l10_efecte:()=>EFECTE(false),
  l10_repetitie:()=>EFECTE(true)
});

/* ---------------- proba de antrenament (atelierul): extensia simppt-proba.js ---------------- */
SimPPTProba.configureaza({titlu:'Proba de antrenament „Soarele”',bucati:[{id:'A1',nume:'diapozitivele'},{id:'A2',nume:'obiectele'},
  {id:'A3',nume:'tranziția și animația'},{id:'A4',nume:'de ce ai pus animația'},{id:'A5',nume:'repetiția'}]});

/* ---------------- lecția ---------------- */
/* trimiterea spre un pas al altei lecții: L(n, titlul exact al pasului, k) → ../m1-l0N/?vezi=pK (motorul, de la 10.10:
   deschide DIRECT pasul K, P1 = „La ce folosește”, doar citire, chiar și pentru un elev nou). Toată trimiterea e legătura.
   Verificat mecanic: _proba/verifica_trimiteri.py (titlul = pasul K de pe pagina lecției N) și _proba/proba_vezi.py
   (Chromium deschide fiecare ?vezi=pK și citește titlul pasului de pe ecran). Fără pas: legătura duce la cuprins. */
const L=(n,pas,k)=>`<a class="lk" href="../${n>=8?'m2-l'+String(n).padStart(2,'0'):'m1-l0'+n}/${pas&&k?'?vezi=p'+k:''}" target="_blank" rel="noopener">lecția ${n}${pas?`, pasul „${pas}”`:''}</a>`;
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CONT=['Operații de gestionare a prezentărilor: creare, deschidere, expunere, salvare în diverse formate, închidere',
  'Structura unei prezentări: diapozitive, obiecte utilizate în prezentări (casete de text, imagini importate, forme, sunete, tabele, legături)',
  'Operații de editare a unei prezentări: inserare, copiere, mutare, ștergere a unui diapozitiv/obiect',
  'Formatarea textului, obiectelor, diapozitivelor',
  'Efecte de animație','Efecte de tranziție','Modalități de expunere a unei prezentări',
  'Reguli elementare de estetică și ergonomie utilizate în realizarea unei prezentări',
  'Reguli elementare de susținere a unei prezentări'];
const SIM_SCURT='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat. Scrii într-un substituent cu un clic în el. Pe telefon, tastele (Delete, Ctrl+Z) sunt butoane sub fereastră. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>';
const simEfecte=f5=>`<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">PowerPoint simulat: efectele sunt desenate aproximativ (în PowerPoint arată puțin altfel). Pe telefon, tastele Delete, Ctrl+Z${f5?' și F5':''} le ai ca butoane sub fereastră${f5?'; în expunere atingi ecranul ca să mergi înainte':'; după ce scrii o durată, atinge în afara casetei'}. Testele se bifează singure; la final apeși <b>Verifică</b>.</span>`;
const SIM_EFECTE=simEfecte(false),SIM_EFECTE_F5=simEfecte(true);
/* în bucățile probei, bifele NU se aprind singure până la prima verificare: textul simulatorului fără propoziția despre bife */
const FARA_BIFE=s=>s.replace(' Testele se bifează singure; la final apeși <b>Verifică</b>.','');
const SIM_PROBA='<span class="hint" style="display:block;font-weight:400;margin-bottom:4px">Proba de antrenament: bifele de sub fereastră apar abia după prima apăsare pe <b>Verifică</b>, ca la proba adevărată, unde nu ai bife.</span>';
const CERINTA=`<div class="cerinta"><p style="margin:.2em 0"><b>Cerința de antrenament „Soarele”</b> (inventată de pagină, nu e testul profesorului). Prezentarea are 4 diapozitive:</p><ol>
<li>titlul <b>Soarele</b> și, dedesubt, numele și clasa ta;</li>
<li>„<b>Steaua noastră</b>”, cu aspectul Two Content: în stânga rândurile <b>Soarele e o stea</b> și <b>Ne dă lumină și căldură</b>, în dreapta imaginea <b>soare.png</b>;</li>
<li>„<b>Ziua și noaptea</b>”: rândul <b>Pământul se învârte</b> și o săgeată spre dreapta (Arrow: Right), într-o parte goală a diapozitivului;</li>
<li>„<b>Ce reținem</b>”: rândul <b>Fără Soare nu e viață</b> și, ultimul, rândul <b>Surse: NASA</b>.</li></ol>
<p style="margin:.2em 0">Toate diapozitivele au aceeași tranziție, de 0,5 secunde. Săgeata apare La clic, cu o animație de intrare; spui de ce. La sfârșit, repeți susținerea: expunerea de la început până la capăt.</p></div>`;

/* grila profesorului: instrumente/Grila_produs.md, copiată exact (aceeași formă ca în lecția 9; fără rândul de antet al fișei) */
const GRILA=`<div class="autover"><details class="grila"><summary>Grila profesorului, cu punctele</summary>
<p>Aceeași grilă pentru orice produs (proiect, afiș, prezentare, animație, document, pagină web, program).</p>
<p>La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). <b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8.</p>
<div class="plan-tab"><table><thead><tr><th>#</th><th>Criteriu</th><th>De bază (cu sprijin, model) · 10 p</th><th>Consolidat (independent) · 14 p</th><th>Avansat (context nou, justificat) · 18 p</th><th>Puncte</th></tr></thead><tbody>
<tr><td>1</td><td><b>Respectarea cerinței</b></td><td>conține elementele cerute, cu ajutor</td><td>conține tot ce s-a cerut, fără ajutor</td><td>depășește cerința cu elemente potrivite, alese motivat</td><td></td></tr>
<tr><td>2</td><td><b>Corectitudinea tehnică</b></td><td>operațiile de bază, cu îndrumare</td><td>operațiile cerute, corect, singur</td><td>operații diverse, alese potrivit situației</td><td></td></tr>
<tr><td>3</td><td><b>Organizarea</b></td><td>structură dată de profesor</td><td>structură proprie, clară</td><td>organizare gândită pentru scopul și publicul produsului</td><td></td></tr>
<tr><td>4</td><td><b>Explicația</b> (ce am făcut și de ce)</td><td>răspunde la întrebări</td><td>explică pașii</td><td>justifică alegerile și propune alternative</td><td></td></tr>
<tr><td>5</td><td><b>Munca proprie / sursele</b></td><td>folosește materialele date</td><td>citează sursele imaginilor/textelor</td><td>respectă drepturile de autor și explică de ce contează</td><td></td></tr>
</tbody></table></div>
<p><b>Punctaj:</b> ____ + 10 din oficiu = ____ &nbsp; <b>Nota</b> (punctaj : 10): ______ &nbsp; <b>Nivelul</b> (din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate): ______</p>
<p><b>Ce ai reușit:</b> ______<br><b>Pasul următor (ce faci ca să urci un nivel):</b> ______</p></details></div>`;

const LECTIA={
 t:'Evaluare sumativă: prezentări digitale',lectii:[2,3,4,5,6,7,8,9,10],continuturi:CONT,final:true,
 obiectiv:'știi ce fel de cerințe are proba practică, faci din cerință o listă de bife, dai o probă de antrenament după specificații și te verifici singur cu grila profesorului.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Lecția aceasta încheie capitolul despre prezentări. La ora ei dai <strong>evaluarea sumativă</strong>: o probă de la sfârșitul capitolului, care arată ce știi să faci. E o probă practică, la calculator: faci o prezentare după o cerință dată, apoi o <strong>susții</strong> pe scurt, adică o prezinți colegilor, vorbind. Proba aduce o notă.</p>
<p>Nimic nu e nou. Pagina îți arată ce fel de cerințe vin și cum te verifici singur. Apoi dai o <strong>probă de antrenament</strong>: întâi aici, apoi în PowerPoint.</p>
${fig('../../v/m1-l02/img/laborator.webp',1000,750,'Un laborator de informatică: calculatoare pe mese, în rând, și un ecran de proiecție pe perete','Aici lucrezi proba, iar pe ecranul de proiecție se arată prezentările la susținere. Fotografie: Kiruthikapalani, CC BY-SA 4.0, Wikimedia Commons.','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> ${L(1)} (nota), lecțiile 2-8 și ${L(9)} (grila profesorului). Se deschid într-o filă nouă.</p>`},

  /* ---------- pasul 1: felul cerințelor (activitati_lectii_V_VI.json, VI/10) ---------- */
  {t:'Ce fel de cerințe vin',
   text:`<p>Testul exact îl primești la oră. Planul profesorului spune ce <strong>fel</strong> de cerințe are: o prezentare după <strong>specificații</strong>, adică reguli exacte:</p>
<ul><li><b>câte diapozitive</b> (${L(4,'Diapozitiv nou și aspectul lui',4)});</li>
<li><b>obiecte obligatorii</b>, de exemplu text, imagini, forme (${L(4,'Pui obiecte de pe fila Inserare (Insert)',5)});</li>
<li><b>o tranziție</b> (${L(7,'O singură tranziție, scurtă, pe toate',3)});</li>
<li><b>o animație justificată</b>: pusă cu un motiv pe care îl poți spune (${L(7,'Privește ca publicul: ajută sau încurcă?',7)});</li>
<li>o <b>susținere</b> scurtă: expunerea cu <kbd>F5</kbd>, de la început, și ideea fiecărui diapozitiv, spusă cu vorbele tale (${L(9,'Susținerea: ce spui și cum',7)}).</li></ul>`,
   exemplu:`<p>O cerință de felul acesta, inventată pentru antrenament: „Prezentarea «Soarele» are 4 diapozitive: titlul, cu numele tău; «Steaua noastră», cu o imagine din fișier; «Ziua și noaptea», cu o săgeată; «Ce reținem», cu sursele. Toate au aceeași tranziție. Săgeata are o animație care pornește La clic.”</p>
<p>Câte diapozitive: 4. Obiecte: imaginea și săgeata. Efecte: o tranziție și o animație.</p>`,
   altfel:`<p>E ca o comandă la cofetărie: „un tort cu 3 etaje, cu căpșuni și cu numele Ana scris deasupra”. Cofetarul nu alege câte etaje pune: face exact ce scrie pe bon. Culorile și decorul le alege el.</p>`,
   incearca:{t:'choice',q:'Cerința: „4 diapozitive; pe al doilea, o imagine din fișier; pe al treilea, o formă; aceeași tranziție pe toate; pe formă, o animație care pornește La clic.” Prezentarea lui Dan are 4 diapozitive, imaginea pe al doilea, o săgeată pe al treilea și aceeași tranziție pe toate. Ce îi lipsește?',
    o:['Animația de pe formă','Încă un diapozitiv','O a doua imagine','Nimic, are tot'],ok:0,
    ajutor:'Ia cerința bucată cu bucată și caută fiecare bucată în prezentarea lui Dan.',
    why:'Dan are numărul de diapozitive, imaginea, forma (săgeata) și tranziția. Îi lipsește animația de pe săgeată. Încă un diapozitiv ar strica numărul cerut: 4.'},
   inca:[
    {t:'choice',q:'Cerința spune „4 diapozitive”. Jos, în bara de stare a prezentării tale, scrie Slide 1 of 5. Ce faci?',
     o:['Ștergi diapozitivul în plus: clic pe miniatura lui, apoi Delete','Lași așa: un diapozitiv în plus nu contează','Adaugi încă un diapozitiv','Schimbi tema prezentării'],ok:0,
     ajutor:'Slide 1 of 5: diapozitivul 1 din câte?',
     why:'Slide 1 of 5 înseamnă 5 diapozitive, deci unul e în plus. Cerința spune exact câte. Îl ștergi ca în lecția 5: clic pe miniatura lui, apoi Delete.'}
   ]},

  /* ---------- pasul 2: metoda (README §4, regula 3: strategia se predă) ---------- */
  {t:'Cerința devine o listă de bife',
   text:`<p>La probă lucrezi singur și nu se aprinde nicio bifă. Te ajută o metodă în patru pași:</p>
<ol><li>Citește toată cerința, până la capăt.</li>
<li>Pe o foaie, scrie câte un rând pentru fiecare lucru cerut: un număr, un obiect, un efect.</li>
<li>Lucrează și salvează des, cu <kbd>Ctrl</kbd>+<kbd>S</kbd> (${L(3,'Salvare sau Salvare ca',4)}).</li>
<li>La sfârșit, ia lista rând cu rând și caută fiecare lucru în prezentare. Bifează doar ce ai văzut.</li></ol>
<p>Câte diapozitive ai vezi jos, în bara de stare: Slide 1 of 4 înseamnă diapozitivul 1 din 4 (${L(2,'Fereastra PowerPoint: cinci zone',4)}).</p>`,
   exemplu:`<p>Lista lui Radu, pentru cerința „Soarele” de la pasul dinainte:</p>
<ul><li>4 diapozitive;</li><li>titlul, cu numele meu;</li><li>imaginea, pe „Steaua noastră”;</li><li>săgeata, pe „Ziua și noaptea”;</li><li>sursele, pe „Ce reținem”;</li><li>aceeași tranziție pe toate;</li><li>animația săgeții, La clic, și motivul ei.</li></ul>`,
   altfel:`<p>E ca lista de cumpărături: o scrii acasă, iar în magazin tai un rând abia când produsul e în coș, nu când treci pe lângă raft.</p>`,
   incearca:{t:'ppt',q:SIM_SCURT+'Cerința spune: „3 diapozitive: titlul, «Marte» și «Ce reținem»”. Prezentarea lui Vlad are 4: al treilea e gol, pus din greșeală. Fă-o să respecte cerința.',
    start:{deck:'l10_vlad',cur:0},
    teste:[
     {ce:'Prezentarea are 3 diapozitive',c:[{k:'nr',n:3}],ajutor:'Clic pe miniatura diapozitivului gol (al treilea), apoi Delete.'},
     {ce:'Au rămas titlul, „Marte” și „Ce reținem”, în ordinea asta',c:[{k:'ordine',val:['Planetele','Marte','Ce reținem']}],ajutor:'Ai șters alt diapozitiv? Ctrl+Z și încearcă din nou, pe miniatura goală.'}],
    rez:['mini-3','k:del'],gresit:['mini-4','k:del'],
    rezText:'clic pe miniatura 3 (cea goală) → Delete',
    ajutor:'Diapozitivul în plus e cel gol.',
    why:'Acum numărul se potrivește cu cerința: în bara de stare scrie „of 3”. Ai șters doar diapozitivul în plus, nu pe cele cerute.'},
   inca:[
    {t:'tf',q:'Rândul „aceeași tranziție pe toate” îl bifezi imediat după ce ai pus tranziția pe primul diapozitiv.',ok:false,
     ajutor:'Tranziția pusă pe un diapozitiv ajunge singură și pe celelalte?',
     why:'Fals. Tranziția pusă pe un diapozitiv rămâne doar pe el. Bifezi abia după Se aplică pentru toate (Apply To All) și după ce te-ai uitat la fiecare diapozitiv (lecția 7).'}
   ]},

  /* ---------- pasul 3: animația justificată + susținerea ---------- */
  {t:'Animația justificată',
   text:`<p>O animație e <strong>justificată</strong> când îi poți spune motivul, iar motivul ajută publicul: arată ordinea în care vorbești sau ascunde un lucru până îl spui (${L(7,'Privește ca publicul: ajută sau încurcă?',7)}). Pusă doar ca să arate frumos, încurcă.</p>
<p>Motivul îl spui la susținere, într-o propoziție: „Am pus animația pe … ca să …”. Scrie-l în zona de note a diapozitivului, ca să nu-l uiți (${L(2,'Fereastra PowerPoint: cinci zone',4)}).</p>`,
   exemplu:`<p>Pe diapozitivul „Marte” al lui Vlad, poza planetei are o animație care pornește La clic.</p>
<p>În notele diapozitivului, Vlad scrie: „Am pus poza să apară La clic, ca publicul să se uite la ea abia când spun că Marte e planeta roșie.” La susținere dă clic exact când ajunge la propoziția aceea.</p>`,
   altfel:`<p>E ca la un spectacol de magie: iepurele apare din pălărie abia când magicianul spune „Abracadabra!”. Dacă ar sta de la început pe masă, n-ar mai mira pe nimeni.</p>`,
   incearca:{t:'ppta',q:SIM_EFECTE+'Pe diapozitivul „Ce e mai mare?”, întrebarea trebuie să se vadă de la început, iar răspunsul să apară abia La clic, după ce colegii s-au gândit. Pune o animație justificată.',
    start:{deck:'l10_mare',cur:1},
    teste:[
     {ce:'Răspunsul are o animație de intrare care pornește La clic',c:[{k:'an',d:2,o:{ref:'r'},fam:'in',start:'clic'}],ajutor:'Clic pe caseta cu răspunsul, apoi fila Animații (Animations) → Fade.'},
     {ce:'Întrebarea se vede de la început, fără animație',c:[{k:'faraAn',d:2,o:{ref:'q'}}],ajutor:'Ai pus efectul pe întrebare? Clic pe ea → Animații (Animations) → None (Fără).'}],
    rez:['tab-animations',{alege:{ref:'r'}},'an:Fade'],gresit:['tab-animations',{alege:{ref:'q'}},'an:Fade'],
    rezText:'fila Animations → clic pe caseta cu răspunsul → Fade',
    ajutor:'Ce trebuie să apară mai târziu: întrebarea sau răspunsul?',
    why:'Motivul: colegii se gândesc întâi la întrebare, iar răspunsul apare abia când îl spui. Asta e o animație justificată.'},
   inca:[
    {t:'choice',q:'Care animație e justificată?',
     o:['Pe „Cum mută calul”, săgeata mutării apare La clic, când explici mutarea','Titlul fiecărui diapozitiv se rotește când apare','Toate rândurile intră din stânga, ca să fie mai vie prezentarea','Fotografia intră de sus, ca să atragă privirea'],ok:0,
     ajutor:'Care animație ajută publicul să urmărească ce spui?',
     why:'Săgeata apare exact când vorbești despre ea, deci publicul se uită unde trebuie. Celelalte sunt puse doar ca să arate: încurcă.'}
   ]},

  /* ---------- pasul 4: autoverificarea cu grila, pe o lucrare bună și una slabă (capturi din PowerPoint real) ---------- */
  {t:'Te verifici cu grila: o lucrare bună, una slabă',
   text:`<p>Printre resursele probei, planul profesorului are <strong>grila de produs</strong>, aceeași ca la mini-proiect (${L(9,'Verifici după criterii',5)}): respectarea cerinței, corectitudinea tehnică, organizarea, explicația, munca proprie și sursele. Aici o folosești doar ca să te verifici singur: înainte să predai, ia criteriu cu criteriu și caută în prezentarea ta.</p>
<p>Cum se notează proba adevărată, cu grila aceasta sau pe părțile din ${L(1,'Lucrarea și nota ei',4)}, anunță profesorul. Cum intră munca de pe LearningHub în nota lucrării de modul afli în ${L(1,'Munca ta pe LearningHub intră în notă',5)}.</p>`,
   exemplu:`<p>Aceeași cerință, „Albina”, la doi elevi. Diapozitivele sunt desenate de PowerPoint.</p>
${fig('img/lucrare-buna.webp',990,570,'Lucrarea bună, 4 diapozitive: titlul Albina cu autorul; Ce face albina, cu rândurile în stânga și fotografia în dreapta; De ce e importantă, cu o săgeată; Ce reținem, cu sursele pe ultimul rând','Lucrarea bună: tot ce cere cerința, iar fotografia nu acoperă rândurile.')}
${fig('img/lucrare-slaba.webp',990,570,'Lucrarea slabă, 3 diapozitive: titlul albina, fără autor; fotografia peste rânduri; textul mic, galben pe alb','Lucrarea slabă: fără autor, fotografia peste rânduri, textul mic și galben pe alb, doar 3 diapozitive, fără surse.')}`,
   altfel:`<p>E ca atunci când îți verifici ghiozdanul după orar, materie cu materie: nu te uiți „în general” dacă e plin, ci cauți fiecare caiet pe rând.</p>`,
   incearca:{t:'classify',q:'Lucrarea slabă de mai sus și elevul care a făcut-o: la ce criteriu al grilei pierde puncte fiecare problemă?',
    cats:['Respectarea cerinței','Explicația','Munca proprie / sursele'],
    items:[['Are 3 diapozitive, iar cerința cere 4',0],['Întrebat de ce a scris cu galben, elevul nu știe ce să spună',1],['Întrebat ce a făcut pe diapozitivul 2, elevul nu știe ce să spună',1],['Nu scrie nicăieri de unde e fotografia',2]],
    ajutor:'Cuvintele grilei: „conține tot ce s-a cerut”, „ce am făcut și de ce”, „citează sursele imaginilor/textelor”.',
    why:'Un diapozitiv lipsă: nu „conține tot ce s-a cerut”. De ce a ales galbenul și ce a făcut pe un diapozitiv: „ce am făcut și de ce”. Fotografia fără sursă: nu „citează sursele imaginilor”.'},
   inca:[
    {t:'choice',q:'Pe grila Mariei scrie: cerința 14 puncte, corectitudinea 14, organizarea 10, explicația 14, sursele 18. Ce notă are?',
     o:['8','7','9','6'],ok:0,amesteca:false,
     ajutor:`Adună cele cinci criterii, apoi încă 10 din oficiu. Împarte la 10 (${L(9,'Punctele și nota proiectului',6)}).`,
     why:'14 + 14 + 10 + 14 + 18 = 70. Cu cele 10 din oficiu, punctajul e 80, iar 80 : 10 = 8. Nota 7 iese dacă uiți oficiul.'}
   ]}
 ],

 /* ---------- ATELIERUL: proba de antrenament „Soarele”, în 5 bucăți (lectii/_sim/simppt-proba.js) ---------- */
 atelier:{t:'probappt',proba:'A1',titlu:'Atelier: proba de antrenament „Soarele”',
  intro:`<p><strong>Proba de antrenament</strong> (nu se notează): cerința „Soarele”, lucrată în PowerPoint simulat, în 5 bucăți. Fiecare bucată se face în simulatorul lecției care a predat-o, deci pornește de la prezentarea gata până acolo, cu un nume de exemplu, Ana Pop. În laborator faci totul într-un singur fișier.</p>
${CERINTA}
<ol><li>Lucrează toată bucata, apoi apasă <b>Verifică</b>. Ca la proba adevărată, nu vezi bife până atunci. Ce ai îndeplinit la prima apăsare rămâne scris deasupra bucății.</li>
<li>Ce n-a ieșit repari. Apoi <b>Încă un exercițiu</b> te duce la bucata următoare.</li>
<li>După bucata 5 vezi ce ai îndeplinit din prima și ce ai de recitit.</li></ol>
<p>Calculatorul e comun: dacă se așază alt elev, apasă <b>Sunt alt elev / Încep din nou</b>. Nimic nu se salvează: la reîncărcare, proba e goală.</p>`,
  q:FARA_BIFE(SIM_SCURT)+SIM_PROBA+'<b>Bucata 1: diapozitivele.</b> Pornești de la o prezentare nouă, cu un singur diapozitiv. Scrie titlul <b>Soarele</b> și, dedesubt, numele și clasa ta. Apoi adaugă, în ordinea asta, diapozitivele „Steaua noastră”, „Ziua și noaptea” și „Ce reținem”, fiecare cu titlul lui.',
  start:{deck:'l10_nou',cur:0},
  teste:[
   {ce:'Primul diapozitiv are titlul Soarele',c:[{k:'text',d:1,ph:'titlu',val:'Soarele'}],ajutor:'Clic pe Click to add title și scrie Soarele.',lectia:L(4,'Substituenții: locuri pregătite',3)},
   {ce:'Sub titlu scrie cine a făcut prezentarea',c:[{k:'textmin',d:1,ph:'sub',min:5}],ajutor:'Clic pe Click to add subtitle și scrie numele și clasa ta.',lectia:L(4,'Structura unei prezentări',6)},
   {ce:'Prezentarea are 4 diapozitive',c:[{k:'nr',n:4}],ajutor:'Pornire (Home) → Diapozitiv nou (New Slide), de trei ori. Jos, în bara de stare, vezi câte sunt.',lectia:L(4,'Diapozitiv nou și aspectul lui',4)},
   {ce:'Titlurile, în ordine: Soarele, Steaua noastră, Ziua și noaptea, Ce reținem',c:[{k:'ordine',val:['Soarele','Steaua noastră','Ziua și noaptea','Ce reținem']}],ajutor:'Clic pe miniatura fiecărui diapozitiv nou, apoi pe Click to add title. Un diapozitiv venit în altă ordine îl muți trăgându-i miniatura.',lectia:L(5,'Muți un diapozitiv: tragi miniatura',4)}],
  rez:[{ph:'titlu',scrie:'Soarele'},{ph:'sub',scrie:'Ana Pop, clasa a VI-a'},'new-slide',{ph:'titlu',scrie:'Steaua noastră'},'new-slide',{ph:'titlu',scrie:'Ziua și noaptea'},'new-slide',{ph:'titlu',scrie:'Ce reținem'}],
  gresit:[{ph:'titlu',scrie:'Soarele'},{ph:'sub',scrie:'Ana Pop, clasa a VI-a'},'new-slide',{ph:'titlu',scrie:'Steaua noastră'},'new-slide',{ph:'titlu',scrie:'Ziua și noaptea'}],
  rezText:'Soarele în titlu, numele în subtitlu; Home → New Slide, titlul Steaua noastră; din nou New Slide, Ziua și noaptea; din nou New Slide, Ce reținem',
  ajutor:'Lucrează pe rând: titlul, subtitlul, apoi câte un diapozitiv nou pentru fiecare titlu.',
  why:'Ai structura cerută: titlul cu autorul și cele trei diapozitive, în ordine. Numărul îl vezi și în bara de stare: „of 4”.',
  inca:[
   {t:'probappt',proba:'A2',titlu:'Atelier: proba de antrenament, bucata 2',
    q:FARA_BIFE(SIM_SCURT)+SIM_PROBA+'<b>Bucata 2: obiectele.</b> Prezentarea are cele 4 diapozitive, cu titlurile. Pune ce cere cerința: pe „Steaua noastră”, aspectul Two Content, în stânga rândurile <b>Soarele e o stea</b> și <b>Ne dă lumină și căldură</b>, în dreapta imaginea <b>soare.png</b>; pe „Ziua și noaptea”, rândul <b>Pământul se învârte</b> și o săgeată spre dreapta (Arrow: Right); pe „Ce reținem”, rândul <b>Fără Soare nu e viață</b> și, ultimul, <b>Surse: NASA</b>.',
    start:{deck:'l10_titluri',cur:0},
    teste:[
     {ce:'„Steaua noastră” are aspectul Two Content',c:[{k:'aspect',d:2,lay:'two'}],ajutor:'Miniatura 2, apoi Pornire (Home) → Aspect (Layout) → Two Content.',lectia:L(4,'Diapozitiv nou și aspectul lui',4)},
     {ce:'În stânga, rândurile Soarele e o stea și Ne dă lumină și căldură',c:[{k:'linii',d:2,ph:'c1',val:['Soarele e o stea','Ne dă lumină și căldură']}],ajutor:'Clic în locul din stânga, scrie primul rând, Enter, apoi al doilea. Nu mai vezi locul din stânga? L-a luat imaginea, pusă înaintea rândurilor: clic pe imagine → Delete, scrie întâi rândurile, apoi pune imaginea din nou.',lectia:L(9,'Imaginea: în locul din dreapta',4)},
     {ce:'În dreapta, imaginea soare.png, singura imagine, fără să acopere rândurile',c:[{k:'imagine',d:2,fis:'soare.png'},{k:'pozitie',d:2,tip:'imagine',fis:'soare.png',xmin:50},{k:'nobj',d:2,tip:'imagine',n:1}],ajutor:'Scrie întâi rândurile. Apoi Inserare (Insert) → Imagini (Pictures) → Acest dispozitiv (This Device) → soare.png → Insert: intră în locul gol din dreapta. A ajuns în stânga (ai pus-o înaintea rândurilor) sau în mijloc, peste rânduri? Clic pe ea → Delete; scrie rândurile în locul din stânga, apoi o pui din nou.',lectia:L(9,'Imaginea: în locul din dreapta',4)},
     {ce:'Pe „Ziua și noaptea”, rândul Pământul se învârte și o săgeată spre dreapta',c:[{k:'linii',d:3,ph:'c1',val:['Pământul se învârte']},{k:'forma',d:3,forma:'arrowR'}],ajutor:'Clic pe Click to add text și scrie rândul. Apoi Inserare (Insert) → Forme (Shapes) → Arrow: Right și un clic pe o parte goală a diapozitivului.',lectia:L(4,'Pui obiecte de pe fila Inserare (Insert)',5)},
     {ce:'Pe „Ce reținem”, rândul Fără Soare nu e viață și, ultimul, Surse: NASA',c:[{k:'linii',d:4,ph:'c1',val:['Fără Soare nu e viață']},{k:'linieIncepe',d:4,ph:'c1',cu:'Surse',min:3,ultima:true}],ajutor:'Clic pe Click to add text, scrie primul rând, Enter, apoi Surse: NASA. Rândul cu sursele e ultimul.',lectia:L(9,'Ce ți se cere',2)}],
    rez:['mini-2','layout','lay:two',{ph:'c1',scrie:'Soarele e o stea\nNe dă lumină și căldură'},'tab-insert','ins-pictures','pic-device','file:soare.png','file-insert',
     'mini-3',{ph:'c1',scrie:'Pământul se învârte'},'tab-insert','ins-shapes','shape:arrowR',{clic:[60,68]},
     'mini-4',{ph:'c1',scrie:'Fără Soare nu e viață\nSurse: NASA'}],
    gresit:['mini-2','layout','lay:two',{ph:'c1',scrie:'Soarele e o stea\nNe dă lumină și căldură'},'tab-insert','ins-pictures','pic-device','file:soare.png','file-insert',
     'mini-3',{ph:'c1',scrie:'Pământul se învârte'},'mini-4',{ph:'c1',scrie:'Fără Soare nu e viață\nSurse: NASA'}],
    rezText:'miniatura 2 → Layout → Two Content → rândurile în stânga → Insert → Pictures → This Device → soare.png → Insert; miniatura 3 → rândul → Insert → Shapes → Arrow: Right → clic sub rând; miniatura 4 → rândul și Surse: NASA',
    ajutor:'Lucrează diapozitiv cu diapozitiv: 2, apoi 3, apoi 4.',
    why:'Ai toate obiectele cerute: rândurile, imaginea în locul din dreapta, săgeata și sursele pe ultimul rând.'},
   {t:'probaanim',proba:'A3',titlu:'Atelier: proba de antrenament, bucata 3',
    q:FARA_BIFE(SIM_EFECTE)+SIM_PROBA+'<b>Bucata 3: tranziția și animația.</b> Prezentarea are acum tot conținutul. Pune pe toate diapozitivele aceeași tranziție, de 0,5 secunde. Apoi pune pe săgeată, pe „Ziua și noaptea”, o animație de intrare care pornește La clic.',
    start:{deck:'l10_efecte',cur:0},

     {ce:'Tranziția durează 0,5 secunde pe fiecare diapozitiv',c:[{k:'trDur',v:0.5}],ajutor:'În Durată (Duration) scrie 0,5, apoi Se aplică pentru toate (Apply To All).',lectia:L(7,'O singură tranziție, scurtă, pe toate',3)},
     {ce:'Săgeata are o animație de intrare care pornește La clic',c:[{k:'an',d:3,o:{ref:'sageata'},fam:'in',start:'clic'}],ajutor:'Miniatura 3 → clic pe săgeată → Animații (Animations) → Fade. Pornirea rămâne La clic (On Click).',lectia:L(7,'Animația: un obiect apare când vrei tu',4)}],

    gresit:['mini-1','tab-transitions','tr:Fade',{trDur:0.5},'mini-3','tab-animations',{alege:{ref:'sageata'}},'an:Fade'],

   {t:'probaalege',proba:'A4',titlu:'Atelier: proba de antrenament, bucata 4',
    q:SIM_PROBA+'<b>Bucata 4: de ce ai pus animația.</b> La susținere te întreabă un coleg: „De ce apare săgeata abia la clic?” Ce răspuns arată că animația e justificată?',
    o:['Ca publicul să se uite la săgeată abia când spun că Pământul se învârte','Ca prezentarea să arate mai vie','Pentru că cerința cere o animație','Ca expunerea să țină mai mult'],ok:0,

/* ---------------- acum la calculatorul din laborator: proba de antrenament „Calculatorul” ---------------- */
const CERINTA_LAB=`<div class="cerinta"><p style="margin:.2em 0"><b>Cerința de antrenament „Calculatorul”</b> (inventată de pagină, nu e testul profesorului). Prezentarea are 4 diapozitive:</p><ol>
<li>titlul <b>Calculatorul</b> și, dedesubt, numele și clasa ta;</li>
<li>„<b>Din ce e făcut</b>”, cu aspectul Two Content: în stânga rândurile <b>Unitatea centrală</b> și <b>Monitorul, tastatura și mouse-ul</b>, în dreapta fotografia de mai jos;</li>
<li>„<b>Cum îi dau comenzi</b>”: rândul <b>Tastatura și mouse-ul trimit comenzi</b> și o săgeată spre dreapta (Arrow: Right);</li>
<li>„<b>Ce reținem</b>”: rândul <b>Calculatorul are mai multe părți</b> și, ultimul, rândul <b>Surse: Wikimedia Commons, fotografia: Ente75</b>.</li></ol>
<p style="margin:.2em 0">Toate diapozitivele au aceeași tranziție, de 0,5 secunde. Săgeata apare La clic, cu o animație de intrare; motivul îl scrii în notele diapozitivului 3. La sfârșit, o susții scurt.</p></div>`;
const PASI_REAL=[
  'Proba de antrenament, în PowerPoint (nu se notează). Copiază cerința pe o foaie, ca listă de bife (pasul „Cerința devine o listă de bife”). Apoi lucrează după punctele de mai jos, unul câte unul. La proba adevărată nu vei avea punctele, doar cerința: de aceea, la fiecare punct, uită-te întâi în cerință ce trebuie să iasă.'+CERINTA_LAB,
  'Descarcă fotografia: <a class="btn descarca" href="calculatorul.jpg" download>Descarcă calculatorul.jpg</a> Browserul o pune de obicei în folderul <b>Descărcări (Downloads)</b>. Fotografia e a lui Ente75, din Wikimedia Commons, și e liberă de drepturi (domeniu public).',
  'Pornește <b>PowerPoint</b> din Start și alege <b>Prezentare necompletată (Blank Presentation)</b>. Clic pe Click to add title și scrie <b>Calculatorul</b>. Clic pe Click to add subtitle și scrie numele tău și clasa.',
  'Salvează imediat: <kbd>Ctrl</kbd>+<kbd>S</kbd>. În fereastra <b>Save this file</b> (în română: Salvați acest fișier), la <b>Nume fișier (File name)</b>, șterge ce e scris și scrie tema, clasa și numele tău, legate cu liniuța de jos (<kbd>Shift</kbd> + tasta cu minus): de exemplu <code>Calculatorul_6A_Popescu</code> (lecția 3). Locul: <b>Documents</b> (Documente) sau folderul scris pe tablă (<b>Mai multe opțiuni (More options)</b> › <b>Răsfoire (Browse)</b>). Apasă <b>Salvare (Save)</b>.',
  'Dacă apare „The file … already exists. Do you want to replace the existing file?”, un coleg are deja un fișier cu numele ăsta. Apasă <b>Anulare (Cancel)</b>, nu OK: cu OK, fișierul colegului se pierde. Fereastra de salvare revine, cu același nume. Clic în caseta <b>Nume fișier (File name)</b>, șterge ce e scris și scrie numele întreg, cu prenumele tău la sfârșit (de exemplu <code>Calculatorul_6A_Popescu_Ana</code>). Apasă din nou <b>Salvare (Save)</b>. Verifică: sus, pe bara ferestrei, scrie acum numele fișierului tău.',
  'Diapozitivele: <b>Pornire (Home)</b> → <b>Diapozitiv nou (New Slide)</b>, de trei ori. Scrie titlurile din cerință, fiecare pe diapozitivul lui. Jos, în bara de stare, trebuie să scrie „of 4”.',
  'Pe „Din ce e făcut”: <b>Pornire (Home)</b> → <b>Aspect (Layout)</b> → <b>Two Content</b> (Două conținuturi). Scrie ÎNTÂI, în locul din stânga, cele două rânduri. Apoi <b>Inserare (Insert)</b> → <b>Imagini (Pictures)</b> → <b>Acest dispozitiv (This Device)</b>. În fereastră, în stânga, alege <b>Descărcări (Downloads)</b>, apoi fotografia <b>calculatorul</b> → <b>Inserare (Insert)</b>. Ea intră singură în locul din dreapta. A ajuns în stânga (ai pus-o înaintea rândurilor) sau în mijloc, peste rânduri? Clic pe ea → <kbd>Delete</kbd>; scrie rândurile în locul din stânga și, cu locul din dreapta gol, o pui din nou.',
  'Pe „Cum îi dau comenzi”: scrie rândul. Apoi <b>Inserare (Insert)</b> → <b>Forme (Shapes)</b> → <b>Arrow: Right</b> și un clic pe o parte goală, sub rând (lecția 4). După formă, sus se deschide singură altă filă: pentru diapozitivul următor dai clic înapoi pe <b>Pornire (Home)</b>.',
  'Pe „Ce reținem”: scrie primul rând, <kbd>Enter</kbd>, apoi rândul cu sursele, ultimul. Apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>.',
  'Tranziția (lecția 7): clic pe miniatura 1 → fila <b>Tranziții (Transitions)</b> → <b>Fade</b>. În <b>Durată (Duration)</b> scrie <code>0,5</code> (sau <code>0.5</code>, dacă acolo scrie cu punct), Enter, apoi <b>Se aplică pentru toate (Apply To All)</b>. Tranziția o vezi la repetiție (punctul 13): fiecare diapozitiv apare la fel.',
  'Animația (lecția 7): pe „Cum îi dau comenzi”, clic pe săgeată → fila <b>Animații (Animations)</b> → <b>Fade</b>. Lângă săgeată apare cifra 1: săgeata apare la primul clic. În zona de note a diapozitivului scrie motivul: „Am pus săgeata să apară La clic, ca …”. Apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>.',
  '<b>Verifică-te.</b> Ia lista de pe foaie rând cu rând și caută fiecare lucru în prezentare; bifează doar ce ai văzut. Ce lipsește repari. Apoi grila profesorului, de mai jos (aici o folosești doar ca să te verifici; cum se notează proba adevărată anunță profesorul): la fiecare criteriu, alege câte puncte ți-ai da (cuvintele din coloane te ajută), adună, adaugă 10 din oficiu și împarte la 10, ca în lecția 9. Scrie în caiet: <b>Proba de antrenament</b>, punctele pe criterii, nota și ce ai de lucrat.'+GRILA,
  'Susținerea scurtă: apasă <kbd>F5</kbd> și prezintă-i proba colegului de bancă, încet, clic după clic, până la ecranul negru; încă un clic te scoate (sau <kbd>Esc</kbd>). Stai cu fața la el și spune ideea fiecărui diapozitiv cu vorbele tale. La „Cum îi dau comenzi” spune și motivul animației. Apoi schimbați rolurile. Ești singur? Spune-o cu voce joasă, pentru tine.',
  'La final: <kbd>Ctrl</kbd>+<kbd>S</kbd>, apoi închide PowerPoint cu <b>✕</b>. Dacă te întreabă <b>Save your changes to this file?</b>, alege <b>Salvare (Save)</b>.'
];

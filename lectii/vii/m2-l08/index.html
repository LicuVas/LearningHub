<title>Reguli de tehnoredactare și estetică a paginii tipărite</title>
<meta name="description" content="Lecția 8, clasa a VII-a: regulile unui text îngrijit în Word (un singur spațiu, semnele lipite de cuvânt, ghilimelele „…”, cratima și linia de pauză, diacriticele, Enter doar la sfârșit de paragraf, alinierea cu butoanele, puține fonturi) și verificarea cu semnele ¶ și cu previzualizarea (Ctrl+P), în Word-ul simulat din pagină și la calculatorul din laborator.">

<style>
/* TEMA: o foaie tipărită verificată de corector: rândurile textului, semnele ¶ și · și o corectură roșie pe margine */
:root{
  --desk:#EFEDE8; --paper:#FFFFFF; --paper2:#F6F4EF; --line:#D3CEC3;
  --ink:#23201B; --ink2:#5B554B; --accent:#9C2B23; --accentInk:#FFFFFF; --sel:#F3DEDA;
  --mark:#FFE08A; --markInk:#23201B; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Crimson Pro",Georgia,"Times New Roman",serif; --fb:"Lexend","Segoe UI",system-ui,sans-serif; --fm:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#15130F; --paper:#1F1C17; --paper2:#27231D; --line:#433D33; --ink:#EEE9DF; --ink2:#B5AD9E;
  --accent:#F0998F; --accentInk:#15130F; --sel:#4A2A26; --mark:#F2C94C; --markInk:#23201B;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#15130F; --paper:#1F1C17; --paper2:#27231D; --line:#433D33; --ink:#EEE9DF; --ink2:#B5AD9E;
  --accent:#F0998F; --accentInk:#15130F; --sel:#4A2A26; --mark:#F2C94C; --markInk:#23201B;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda: un rând de text cu semnele ¶ pornite și o corectură pe margine */
.banda{min-height:32px;padding:0 12px;display:flex;align-items:center;gap:10px;background:var(--paper);font-family:var(--fm);font-size:.82rem;color:var(--ink2);overflow:hidden;white-space:nowrap}
.banda .pt{color:#4A7FC1}
.banda .cor{color:var(--accent);font-weight:600;border:1.5px solid var(--accent);border-radius:50%;padding:0 5px}
h1{font-weight:700;letter-spacing:-.005em}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:600}
.mono{font-family:var(--fm);font-size:.86rem;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0;overflow-wrap:anywhere}
.mono .pt,.mono .pm{color:#4A7FC1}
.sageata{font-family:var(--fm);font-size:.85rem;color:var(--ink2);margin:2px 0}
.doua{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:640px){.doua{grid-template-columns:1fr 1fr;align-items:start}}
.doua .et{font-weight:700;font-size:.88rem;color:var(--ink2)}
.descarca{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
/* vânătoarea de greșeli (regula 20; judecătorul, M5): o țintă mai îngustă de 32 px (un semn, „s”, „la”) primește o zonă de atins
   de 32 x 32 px, centrată pe ea și deasupra vecinelor; textul NU se mișcă (spațiile rămân cum sunt, ele sunt de vânat) */
#body .hunt:not(.cod) .tk.tk-mic{position:relative;z-index:2}
#body .hunt:not(.cod) .tk.tk-mic::after{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%)}
</style>
</head>

<script>
/* LECȚIA 8, clasa a VII-a, modulul 2 (revizuirea LearningHub, standardul din 27.09.2026).
   Un singur nivel pe pași: pasul 0 „La ce folosește”, 5 pași cu „Încearcă”, atelierul în Word-ul simulat, pasul
   „Acum la calculatorul din laborator” (documentul de lucru se descarcă din pagină), 5 întrebări.
   Simulatorul: lectii/_sim/wordobj-tehnoredactare.js (tipul `wordteh`: regulile ca teste, previzualizarea File › Print,
   Ctrl+P), peste editorul din wordobj-formatare.js (neschimbat). Documentele: _proba/continut.py (aceleași texte).
   Faptele „dacă faci X, apare Y”: afirmatii.json, cu proba din Word-ul real (_proba/rezultate_word*.json, rezultate_fa.json). */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const BS='<kbd>⌫</kbd>';
const PT=s=>s.replace(/ /g,'<span class="pt">·</span>');
const PROG='Reguli generale de tehnoredactare şi estetică a paginii tipărite';
const DOCX='expozitia-de-desene.docx';
const CAL='Calibri (Body)';
/* documentele simulatorului (aceleași ca în _proba/continut.py) */
const ATELIER_START=[{t:'      Târgul de toamnă',f:{font:'Comic Sans MS',sz:20,b:1}},'Vineri, 13 noiembrie, de la ora 12, elevii claselor','a VII-a vă invită în curtea școlii la  Târgul de toamnă.',
  {t:'Găsiți mere , prăjituri și suc de struguri.Banii strânși merg la biblioteca școlii ( pentru cărți noi).',f:{font:'Courier New'}},'Aduceți -vă și prietenii–vă așteptăm !','','','          Clasele a VII-a'];
const ATELIER_TINTA=[{t:'Târgul de toamnă',al:'center',f:{font:'Comic Sans MS',sz:20,b:1}},'Vineri, 13 noiembrie, de la ora 12, elevii claselor a VII-a vă invită în curtea școlii la Târgul de toamnă.',
  'Găsiți mere, prăjituri și suc de struguri. Banii strânși merg la biblioteca școlii (pentru cărți noi).','Aduceți-vă și prietenii – vă așteptăm!',{t:'Clasele a VII-a',al:'right'}];
const P14=t=>({t,f:{sz:14}});
const P5_TEXT=[{t:'Invitație',al:'center',f:{sz:28,b:1}},P14('Dragi părinți,'),P14('Vă invităm la serbarea de Crăciun a clasei a VII-a, vineri, 18 decembrie, la ora 17, în sala de festivități.'),
  P14('Programul serbării:'),P14('Colinde cântate de toată clasa.'),P14('O scenetă despre iarnă, pregătită de fete.'),P14('Tombola cu premii mici.'),P14('Ceai și cozonac pentru toți invitații.'),P14('Vă așteptăm cu drag!')];
const P5_SEMN={t:'Diriginta clasei',al:'right',f:{sz:14}};
const P5_START=P5_TEXT.concat(Array.from({length:20},()=>P14('')),[P5_SEMN]);
const P5_TINTA=P5_TEXT.concat([P5_SEMN]);
const AVIZIER=fig('img/avizier.webp',800,665,'Avizierul albastru al unei școli, cu multe foi tipărite prinse pe el: anunțuri, afișe și fotografii','Avizierul unei școli din Anglia. Foto: Geographer, <a href="https://commons.wikimedia.org/wiki/File:Bunwell_Primary_School_Notice_Board_-_geograph.org.uk_-_5108277.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, licența <a href="https://creativecommons.org/licenses/by-sa/2.0" target="_blank" rel="noopener">CC BY-SA 2.0</a> (decupată).');
const LAB_DUPA=fig('img/expozitie-dupa.webp',620,254,'Anunțul Expoziția de desene în Word, reparat: titlul mare la mijloc, trei paragrafe cu spațiile corecte, toate cu același font, și Clasa a VII-a A la dreapta, pe o singură pagină','<b>Așa trebuie să arate la final</b>: pagina desenată de Word.');
const PROVOCARE=[
  `Descarcă documentul de lucru: <a href="${DOCX}" download="${DOCX}">${DOCX}</a>. Ajunge în folderul <b>Descărcări (Downloads)</b>.`,
  `Deschide-l în Word: clic pe el în lista de descărcări a browserului sau dublu-clic pe el în folderul <b>Descărcări (Downloads)</b>. Dacă sub panglică apare bara galbenă <b>Vizualizare protejată (Protected View)</b>, apasă pe ea <b>Activare editare (Enable Editing)</b>.`,
  `Apasă ${K('Ctrl+P')}: în dreapta vezi două pagini („1 of 2”), iar semnătura stă singură pe a doua. Întoarce-te în document cu săgeata ← din stânga-sus sau cu <kbd>Esc</kbd>. Apoi pornește semnele: fila <b>Pornire (Home)</b>, grupul <b>Paragraf (Paragraph)</b>, butonul <b>¶</b>.`,
  `<b>Titlul:</b> dă un clic chiar înaintea lui „Expoziția” și apasă ${BS} până dispar toate punctele · din fața lui. Apoi apasă ${K('Ctrl+E')} (<b>Center</b>).`,
  `<b>Paragraful rupt:</b> după „elevii clasei” e un ¶ în mijlocul propoziției. Dă un clic chiar înaintea lui „a VII-a”, la începutul rândului următor, și apasă ${BS} (Backspace). Word lipește cuvintele („claseia”), iar cursorul rămâne chiar între ele: apasă imediat bara de spațiu.`,
  `<b>Spațiile și semnele:</b> în „de··educație” șterge un spațiu. În paragraful cu tema (e pe două rânduri): șterge spațiile din interiorul ghilimelelor și al parantezei și pune un spațiu după punctul din fața lui „Fiecare”. În ultimul rând: „Vizitați-o” fără spațiu, câte un spațiu de o parte și de alta a liniei de pauză (–) și niciun spațiu înainte de „!”.`,
  `<b>Fontul:</b> paragraful cu tema e scris cu alt font (Courier New). Dă un clic în paragraful de deasupra lui: caseta <b>Font</b> arată <b>Calibri (Body)</b>. Selectează tot paragraful cu tema: e pe două rânduri, deci trage de la „Tema” până după „clasa).”, la capătul rândului al doilea. Apoi alege din lista casetei Font <b>Calibri (Body)</b>, sus, sau <b>Calibri</b>, mai jos: e același font.`,
  `<b>Rândurile goale și semnătura:</b> dă un clic pe rândul gol de deasupra semnăturii și apasă ${BS} de mai multe ori: fiecare apăsare șterge un ¶. Oprește-te când semnătura ajunge chiar sub rândul „Vizitați-o…”. Apoi dă un clic chiar înaintea lui „Clasa” și apasă ${BS} până dispar punctele din fața semnăturii. La final apasă ${K('Ctrl+R')} (<b>Align Right</b>).`,
  `Verifică: apasă ${K('Ctrl+P')}. Trebuie „1 of 1”, titlul la mijloc, semnătura la dreapta, fără semnele ¶ pe pagină, ca în poza „Așa trebuie să arate la final”. <b>Nu apăsa Print.</b> Întoarce-te cu ← sau <kbd>Esc</kbd>. Ceva nu e bine? ${K('Ctrl+Z')} și reia pasul.`,
  `Salvează cu <kbd>F12</kbd>, în <b>Documente (Documents)</b>, cu numele tău după regula din lecția 3 și <b>tehnoredactare</b> la capăt, de exemplu <code>Popescu_Ana_7A_tehnoredactare</code>. Dacă Word spune că fișierul există deja (<i>already exists</i>): <b>Anulare (Cancel)</b>, pune o cifră la capătul numelui și salvează din nou.`
];

/* marchează țintele înguste ale vânătorii (vezi stilul .tk-mic): la fiecare desen nou și la schimbarea mărimii ecranului */
(function(){const marcheaza=()=>document.querySelectorAll('#body .hunt:not(.cod) .tk').forEach(b=>{const r=b.getBoundingClientRect();b.classList.toggle('tk-mic',r.width>0&&r.width<32)});
  new MutationObserver(marcheaza).observe(document.body,{childList:true,subtree:true});addEventListener('resize',marcheaza)})();
JocMotor.porneste({
  cheie:'lectie_vii_m2_l08',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/vii/, „Lecția 8”, pasul din laborator înainte de verificare
  titlu:'Reguli de tehnoredactare și estetică a paginii tipărite',
  marca:'Lecția 8 · <b>Pagina îngrijită</b>',
  h1:'Reguli de <em>tehnoredactare</em> și estetică a paginii tipărite',
  clasa:'a VII-a', unitate:'VII-U1', unitateTitlu:'Tehnoredactare: editorul de texte',
  competente:['CS.1.1','CS.3.1'], lectii:'8',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.1, CS.3.1 · unitatea VII-U1 „Tehnoredactare: editorul de texte” · lecția 8, prima din modulul 2 · conținutul: „Reguli generale de tehnoredactare şi estetică a paginii tipărite”',
  banda:`<span>Luni<span class="pt">·</span>mergem<span class="pt">·</span>la<span class="pt">·</span>muzeu,<span class="pt">·</span>la<span class="pt">·</span>ora<span class="pt">·</span>10.<span class="pt">¶</span></span><span class="cor" aria-hidden="true">✓</span>`,
  intro:`<p>Înveți regulile după care un text arată îngrijit (spațiile, semnele, Enter-ul, fonturile, așezarea în pagină) și cum le verifici în <b>Word</b>, înainte de tipărire: cu semnele ¶ și cu previzualizarea. Exersezi în Word-ul simulat din pagină, apoi la calculatorul din laborator, pe un anunț de reparat.</p>
<p><b>Ai nevoie de:</b> lecția 2 (semnele ¶, Enter doar la paragraf nou, ${BS} și <kbd>Delete</kbd>), lecția 3 (salvezi cu <kbd>F12</kbd>, cu numele tău, în Documente), lecția 5 (selectezi trăgând peste text; anulezi cu ${K('Ctrl+Z')}; deschizi un document descărcat cu <b>Activare editare</b>), lecția 6 (fontul, mărimea, aldinul; alinierea cu <b>Center</b> și <b>Align Right</b>) și lecția 7 (marginile paginii).</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, te uiți la „Uite cum”, faci exercițiul „Încearcă tu”. În exerciții, după o greșeală apare singur un indiciu, iar după două poți cere răspunsul. Urmează atelierul (Word-ul simulat), apoi pasul „Acum la calculatorul din laborator”: lucrezi singur în Word, pe un document pe care îl descarci din pagină. La final ai 5 întrebări de verificare. La întrebări, indiciul îl ceri cu „Am nevoie de un indiciu”, iar după a doua greșeală vezi răspunsul.</p>`,
  nivele:[
{t:'Reguli de tehnoredactare și estetică a paginii tipărite',lectii:[8],continuturi:[PROG],final:true,
 obiectiv:'scrii și așezi un text în Word după regulile de tehnoredactare (spațiile, semnele, Enter-ul, alinierea, fonturile) și îl verifici cu semnele ¶ și cu previzualizarea, înainte de tipărire.',
 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Pe avizierul unei școli stau anunțuri tipărite. Unele se citesc dintr-o privire. La altele, titlul e strâmb, cuvintele se lipesc de virgule, iar un rând a fugit singur pe a doua foaie.</p>
<p><mark>Tehnoredactarea</mark> înseamnă să scrii un text și să-l așezi în pagină după reguli, ca să se citească ușor, pe ecran și pe hârtie. Azi înveți regulile și cum le verifici în Word, înainte să tipărești.</p>
${AVIZIER}`},
  /* ---------- pasul 1 ---------- */
  {t:'Spațiile: unul singur, lipit de semne',
   text:`<ol><li>între două cuvinte, <strong>un singur spațiu</strong>;</li>
<li>virgula, punctul, două puncte, punctul și virgula, „?” și „!” se <strong>lipesc</strong> de cuvântul dinainte și au un spațiu după, dacă mai urmează text. <strong>Excepție:</strong> în interiorul unui număr, al unei date, al unei ore, al unei abrevieri sau al unei adrese nu pui spațiu: 7,5, 13.11.2026, 10.30, ș.a.m.d., www.scoala.ro. Între numere diferite, după virgulă pui spațiu: 12, 13 și 14;</li>
<li><strong>parantezele</strong> și <strong>ghilimelele</strong> se lipesc de textul dintre ele.</li></ol>
<p>Word nu repară spațiile tastate greșit (la ștergere și lipire le potrivește uneori, lecția 5). Cu <strong>¶</strong> (lecția 2), fiecare spațiu e un punct ·: ·· e un spațiu în plus.</p>
${fig('img/semne-greseli.webp',703,123,'Două rânduri în Word, cu semnele ¶ pornite. În primul se văd cinci greșeli de spațiu: două spații după Luni, un spațiu înaintea virgulei, niciun spațiu după virgulă, niciun spațiu după 10 și punct, un spațiu după paranteza deschisă. Al doilea rând: Ne vedem sâmbătă!','În Word, cu ¶ pornit: cinci greșeli de spațiu în primul rând.')}`,
   exemplu:`<p>Primul rând din poză, cu ¶ pornit:</p><p class="mono">${PT('Luni  mergem la muzeu ,la ora 10.Luați apă ( și o gustare).')}</p><p class="sageata">↓ cinci reparații</p><p class="mono">${PT('Luni mergem la muzeu, la ora 10. Luați apă (și o gustare).')}</p><p>La ghilimele, la fel: „Micul prinț”, nu „ Micul prinț ”.</p>`,
   altfel:`<p>Semnul de punctuație e ca o remorcă prinsă de mașina din fața ei: stă lipit de ea. După remorcă lași loc până la mașina următoare, adică un spațiu. Parantezele și ghilimelele sunt ca două mâini care țin textul strâns, fără loc gol înăuntru.</p>`,
   incearca:{t:'wordteh',previz:false,
    q:'Pornește semnele ¶: fila <b>Pornire (Home)</b>, grupul <b>Paragraf (Paragraph)</b>, butonul <b>¶</b> (pe telefon, butonul <b>¶</b> de sub fereastră). Apoi repară cele 3 greșeli de spațiu: două spații la rând, un spațiu înaintea virgulei și un spațiu care lipsește după ea.',
    start:['Luni  mergem la muzeu ,la ora 10.'],tinta:['Luni mergem la muzeu, la ora 10.'],
    verif:[{ce:'Semnele ¶ sunt pornite',pil:true},{ce:'Niciun spațiu dublu',fara:'spatiiDuble'},{ce:'Niciun spațiu înaintea virgulei',fara:'spatiuInainte'},{ce:'După virgulă urmează un spațiu',fara:'lipitDupa'},{ce:'Textul e „Luni mergem la muzeu, la ora 10.”',tinta:true}],
    tipic:['Luni mergem la muzeu ,la ora 10.'],
    ajutor:'Clic între cele două puncte de după „Luni” și ⌫. Clic între spațiu și virgulă și ⌫. Clic imediat după virgulă și bara de spațiu.',
    why:'Un singur spațiu între cuvinte; virgula e lipită de „muzeu”, iar după ea urmează un spațiu.'},
   inca:[
    {t:'wordteh',previz:false,q:'Repară spațiile din jurul parantezei și al punctului: sunt 3 greșeli. Semnele ¶ te ajută.',
     start:['Luați apă (și o gustare ) .Plecăm la ora 8.'],tinta:['Luați apă (și o gustare). Plecăm la ora 8.'],
     verif:[{ce:'Paranteza e lipită de text',fara:'paranteze'},{ce:'Niciun spațiu înaintea punctului',fara:'spatiuInainte'},{ce:'După punct urmează un spațiu',fara:'lipitDupa'},{ce:'Textul e exact cel cerut',tinta:true}],
     tipic:['Luați apă (și o gustare) .Plecăm la ora 8.'],
     ajutor:'Șterge spațiul dinaintea lui „)” și pe cel dinaintea punctului; după punct, bara de spațiu.',
     why:'Paranteza se lipește de „gustare”, punctul de paranteză, iar după punct urmează un spațiu.'},
    {t:'wordteh',previz:false,q:'Repară cele 4 greșeli de spațiu din jurul semnelor, dar lasă data și ora cum sunt: între cifre nu se pune spațiu.',
     start:['Serbarea e pe 18.12.2026 ,la ora 17.30.Vă așteptăm !'],tinta:['Serbarea e pe 18.12.2026, la ora 17.30. Vă așteptăm!'],
     verif:[{ce:'Niciun spațiu înaintea semnelor',fara:'spatiuInainte'},{ce:'Un spațiu după virgulă și după punctul de la sfârșitul propoziției',fara:'lipitDupa'},{ce:'Data și ora au rămas fără spații între cifre',fara:'intreCifre'},{ce:'Textul e exact cel cerut',tinta:true}],
     tipic:['Serbarea e pe 18. 12. 2026, la ora 17. 30. Vă așteptăm!'],
     ajutor:'Șterge spațiul dinaintea virgulei și pe cel dinaintea lui „!”; pune un spațiu după virgulă și după „17.30.”. În „18.12.2026” și „17.30” nu schimbi nimic.',
     why:'Semnele sunt lipite de cuvântul dinainte și urmate de un spațiu; între cifre (data, ora) nu se pune spațiu.'},
    {t:'wordteh',previz:false,q:'Aici „5,6” nu e un număr cu virgulă, ci două clase diferite: pune spațiul după virgula dintre ele și repară spațiul dinaintea virgulei. Ora rămâne cum e.',
     start:['Concursul e pentru clasele 5,6 și 7 , sâmbătă la ora 9:30.'],tinta:['Concursul e pentru clasele 5, 6 și 7, sâmbătă la ora 9:30.'],
     verif:[{ce:'Niciun spațiu înaintea virgulei',fara:'spatiuInainte'},{ce:'Ora a rămas 9:30, fără spațiu',fara:'intreCifre'},
            {ce:'Niciun spațiu dublu',fara:'spatiiDuble'},
            {ce:'Clasele sunt despărțite de virgulă și spațiu: 5, 6 și 7',tinta:true,cumDaca:{text:'5,6',cum:'Între numere diferite dintr-o înșiruire, după virgulă pui spațiu: „5, 6 și 7”. Scris lipit, „5,6” se citește „cinci virgulă șase”. Dă un clic imediat după virgula dintre 5 și 6 și apasă bara de spațiu.'}}],
     tipic:['Concursul e pentru clasele 5,6 și 7, sâmbătă la ora 9:30.'],
     ajutor:'Clic imediat după virgula dintre 5 și 6, bara de spațiu. Apoi șterge spațiul dinaintea virgulei de după 7. În „9:30” nu schimbi nimic.',
     why:'5, 6 și 7 sunt numere diferite, deci după virgulă vine un spațiu; în interiorul orei (9:30) nu se pune.'}
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Semnele limbii române: ghilimele, cratimă, linie, diacritice',
   text:`<ul><li><mark>Ghilimelele</mark> românești se deschid jos și se închid sus: „Micul prinț”. Nu "așa" și nici “așa”.</li>
<li><mark>Cratima</mark> (-) e scurtă și leagă cuvinte, fără spații în jur: într-o, s-a, ne-am.</li>
<li><mark>Linia de pauză</mark> (–) e mai lungă și are câte un spațiu de o parte și de alta: Mâine – dacă nu plouă – mergem la munte.</li>
<li><mark>Diacriticele</mark> sunt semnele de pe ă, â, î, ș, ț. „Scoala” e greșit; corect e „școala”. Ș și ț au dedesubt o virgulă mică, nu un cârlig (ş, ţ). Tastatura nu scrie deloc diacritice (lecția 3)? Azi nu ai de tastat niciuna; spune-i profesorului la oră.</li></ul>`,
   exemplu:`<p>Pe tastatura <b>Română (standard)</b>: „ e tasta din stânga lui 1, ” e Shift + aceeași tastă; ă, î, â sunt pe [, ], \\; ș pe ;, ț pe tasta de lângă Enter (cea desenată cu ").</p>
<p>Pe alte tastaturi, dacă limba calculatorului e română, Word face singur „ sau ” din ", iar din cratima dintre spații face –, după cuvântul următor. Verifică cu ochii. Iese ş cu cârlig? Tastatura e Română (tradițională): nu e vina ta.</p>`,
   altfel:`<p>Cratima e ca o agrafă: prinde două bucăți strâns, fără loc între ele (într-o). Linia de pauză e ca o pauză de respirație când vorbești: lași loc înainte și după ea.</p>`,
   incearca:{t:'hunt',q:'Găsește cele 4 greșeli: la ghilimele, la cratimă, la linia de pauză și la diacritice. Apasă pe ele, apoi verifică.',
    src:'Am văzut filmul [["Vaiana"|În română, ghilimelele se scriu jos-sus: „Vaiana”.]] și apoi [[ne -am|Cratima nu are spații: „ne-am”.]] culcat târziu [[-|Între două spații pui linia de pauză (–), mai lungă decât cratima.]] mâine mergem la [[scoala|Lipsesc diacriticele: „școală”.]] obosiți.',
    ajutor:'Uită-te pe rând: ghilimelele (jos-sus?), cratima (are spații?), semnul dintre „târziu” și „mâine”, literele fără diacritice.',
    why:'Ghilimelele românești, cratima fără spații, linia de pauză între spații și diacriticele sunt regulile din pas.'},
   inca:[
    {t:'wordteh',previz:false,q:'Repară cratima și linia de pauză: cratima fără spații, iar linia (–) cu câte un spațiu de o parte și de alta.',
     start:['Ne -am întâlnit în parc–era soare.'],tinta:['Ne-am întâlnit în parc – era soare.'],
     verif:[{ce:'Cratima nu are spații',fara:'cratima'},{ce:'Linia de pauză are spații în jur',fara:'linia'},{ce:'Textul e exact cel cerut',tinta:true}],
     tipic:['Ne-am întâlnit în parc–era soare.'],
     ajutor:'Clic între spațiu și cratimă, ⌫. Apoi clic între „parc” și linie, bara de spațiu; clic între linie și „era”, bara de spațiu.',
     why:'„Ne-am” e legat cu cratima, fără spații; linia de pauză stă între două spații.'},
    {t:'choice',q:'Cum se scriu corect ghilimelele în română?',o:['„Ion”','"Ion"','“Ion”','„ Ion ”'],ok:0,
     ajutor:'Jos la început, sus la sfârșit, lipite de text.',why:'Ghilimelele românești se deschid jos și se închid sus, lipite de cuvânt.'}
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Enter și spațiile nu așază textul',
   text:`<p>Din lecția 2 știi: <kbd>Enter</kbd> se apasă doar la sfârșit de paragraf. Cu Enter la capătul fiecărui rând, rândurile se rup urât de îndată ce mărești literele sau schimbi marginile.</p>
<p>Nici spațiile nu așază textul: un titlu adus la mijloc cu spații fuge într-o parte la prima schimbare. Așezi cu butoanele din grupul <strong>Paragraf (Paragraph)</strong> (lecția 6): <strong>Center</strong> (${K('Ctrl+E')}) pentru titlu, <strong>Align Right</strong> (${K('Ctrl+R')}) pentru semnătură. Iar rândurile goale făcute cu Enter nu fac spațiu frumos: împing textul spre pagina următoare.</p>
${fig('img/titlu-spatii-center.webp',900,501,'Trei bucăți din aceeași pagină Word, cu linia punctată roșie a mijlocului foii: titlul Târgul de toamnă adus la mijloc cu spații, apoi același titlu mărit, mutat mult spre dreapta, apoi titlul mărit și centrat cu butonul Center, exact la mijloc','În Word. Sus: titlul adus la mijloc cu 16 spații, la 20 pt. La mijloc: același titlu, mărit la 28 pt, a fugit spre dreapta. Jos: titlul centrat cu <b>Center</b>, mărit la 28 pt, stă la mijloc. Linia roșie arată mijlocul foii.')}`,
   exemplu:`${fig('img/enter-la-capat-de-rand.webp',900,417,'Trei bucăți din pagini Word: un paragraf cu Enter la capătul fiecărui rând, apoi același paragraf cu literele mărite, cu rânduri scurte și rupte, apoi paragraful scris fără Enter, mărit, cu rânduri pline','În Word. Sus: Enter la capătul fiecărui rând, la 11 pt. La mijloc: același text mărit la 14 pt, cu rânduri scurte, rupte. Jos: textul scris fără Enter, mărit la 14 pt.')}
<p>Repari cu ¶ pornit: dai un clic la începutul rândului rupt și apeși ${BS}. Word lipește cuvintele (din „la¶munte” iese „lamunte”), iar cursorul rămâne chiar între ele: apasă imediat bara de spațiu.</p>`,
   altfel:`<p>E ca atunci când îți aduci caietul la mijlocul băncii împingându-l cu cotul: stă bine doar până se mișcă banca. Butonul Center e ca un semn tras la mijlocul băncii: orice schimbi, titlul se întoarce singur la mijloc.</p>`,
   incearca:{t:'wordteh',previz:false,
    q:'Paragraful e rupt cu Enter în mijlocul propoziției. Pornește ¶, dă un clic chiar înaintea lui „la bunici” (începutul rândului al doilea) și apasă ⌫. Cuvintele se lipesc, iar cursorul rămâne chiar între ele: apasă imediat bara de spațiu.',
    start:['Duminică mergem cu familia','la bunici, la Târgu Neamț.'],tinta:['Duminică mergem cu familia la bunici, la Târgu Neamț.'],
    verif:[{ce:'Un singur paragraf',paragrafe:1},{ce:'Cuvintele sunt despărțite corect',tinta:true}],
    tipic:['Duminică mergem cu familiala bunici, la Târgu Neamț.'],
    ajutor:'Clic înaintea lui „la bunici”, ⌫: se lipește „familiala”, iar cursorul rămâne între „familia” și „la”. Apasă imediat bara de spațiu.',
    why:'Ai șters ¶ din mijlocul propoziției și ai pus spațiul la loc: acum e un paragraf, pe care Word îl rupe singur pe rânduri.'},
   inca:[
    {t:'wordteh',previz:false,q:'Titlul a fost adus la mijloc cu spații. Pornește ¶, dă un clic chiar înaintea lui „Excursia” și apasă ⌫ până dispar toate punctele din fața titlului. Apoi apasă <b>Center</b> (Ctrl+E).',
     start:[{t:'        Excursia la Bicaz',f:{sz:16,b:1}},'Plecăm sâmbătă, la ora 8, din fața școlii.'],tinta:[{t:'Excursia la Bicaz',al:'center',f:{sz:16,b:1}},'Plecăm sâmbătă, la ora 8, din fața școlii.'],
     verif:[{ce:'Titlul nu mai are spații în față',fara:'spatiiInceput'},{ce:'Titlul e la mijloc, cu Center',paragraf:'Excursia la Bicaz',al:'center'}],
     tipic:[{t:'        Excursia la Bicaz',al:'center',f:{sz:16,b:1}},'Plecăm sâmbătă, la ora 8, din fața școlii.'],
     ajutor:'Clic chiar înaintea lui „E”, apoi ⌫ de 8 ori: fiecare apăsare șterge un punct. Apoi Ctrl+E (pe telefon, butonul Ctrl+E de sub fereastră).',
     why:'Fără spații, titlul stă la mijloc doar cu butonul Center și rămâne acolo orice ai schimba.'},
    {t:'wordteh',previz:false,q:'Semnătura a fost împinsă la dreapta cu spații. Șterge spațiile din fața ei și pune-o la dreapta cu <b>Align Right</b> (Ctrl+R).',
     start:['Vă așteptăm cu drag!','              Clasa a VII-a B'],tinta:['Vă așteptăm cu drag!',{t:'Clasa a VII-a B',al:'right'}],
     verif:[{ce:'Semnătura nu mai are spații în față',fara:'spatiiInceput'},{ce:'Semnătura e la dreapta, cu Align Right',paragraf:'Clasa a VII-a B',al:'right'}],
     tipic:['Vă așteptăm cu drag!',{t:'              Clasa a VII-a B',al:'right'}],
     ajutor:'Clic chiar înaintea lui „Clasa”, ⌫ până dispar punctele; apoi Ctrl+R.',
     why:'Align Right lipește rândul de marginea din dreapta, fără spații.'},
    {t:'choice',q:'Ai apăsat Enter la capătul fiecărui rând dintr-un paragraf. Apoi mărești literele. Ce se întâmplă?',
     o:['Rândurile se rup în locuri urâte, unele rămân scurte','Word unește singur rândurile într-un paragraf','Rândurile rămân la fel de frumoase','Word șterge singur Enter-urile în plus'],ok:0,
     ajutor:'Uită-te la poza din „Uite cum”, la mijloc.',why:'Fiecare Enter rupe rândul acolo unde a fost apăsat; literele mai mari nu mai încap, iar rândul se rupe încă o dată.'}
   ]},
  /* ---------- pasul 4 ---------- */
  {t:'Estetica paginii: puține fonturi, titluri la fel, o pagină',
   text:`<p>O pagină e frumoasă când e <strong>ordonată</strong>:</p>
<ul><li>folosești cel mult <strong>2-3 fonturi</strong>; într-un anunț scurt, de obicei unul pentru titlu și unul pentru text;</li>
<li>titlurile de același fel arată la fel: același font, aceeași mărime, aldine sau nu, toate;</li>
<li>paragrafele de același fel au aceeași aliniere;</li>
<li>nimic nu iese din margini (lecția 7), iar un anunț scurt încape pe <strong>o singură pagină</strong>, fără un rând rătăcit pe a doua.</li></ul>`,
   exemplu:`<div class="doua"><div><span class="et">Înainte</span>${fig('img/targ-inainte.webp',620,323,'Anunțul Târgul de toamnă în Word: titlul împins cu spații, un paragraf rupt pe două rânduri, un paragraf scris cu alt font, cuvinte lipite de semne și semnătura împinsă cu spații','<b>Înainte</b>: pagina desenată de Word.')}</div><div><span class="et">După</span>${fig('img/targ-dupa.webp',620,240,'Același anunț în Word, reparat: titlul mare la mijloc, trei paragrafe în același font, cu spațiile corecte, și semnătura la dreapta','<b>După</b>: titlul într-un font, tot textul în altul.')}</div></div>`,
   altfel:`<p>Gândește-te la un cor: toți cântă aceeași melodie, iar dacă unul cântă altceva, se aude imediat. Un paragraf scris cu alt font „se aude” la fel de tare pe pagină.</p>`,
   incearca:{t:'wordteh',previz:false,
    q:'Sub titlu, textul are trei fonturi. Fă-l tot <b>Calibri</b>, ca primul paragraf: selectează al doilea și al treilea paragraf (trage de la „Aduceți” până după „sport.”) și alege <b>Calibri</b> din caseta <b>Font</b>. Titlul rămâne Cambria.',
    start:[{t:'Clubul de șah',al:'center',f:{font:'Cambria',sz:18,b:1}},'Ne întâlnim marțea, după ore, în sala 12.',{t:'Aduceți tabla de șah, dacă aveți.',f:{font:'Comic Sans MS'}},{t:'Înscrierile se fac la profesorul de sport.',f:{font:'Courier New'}}],
    tinta:[{t:'Clubul de șah',al:'center',f:{font:'Cambria',sz:18,b:1}},'Ne întâlnim marțea, după ore, în sala 12.','Aduceți tabla de șah, dacă aveți.','Înscrierile se fac la profesorul de sport.'],
    verif:[{ce:'Textul de sub titlu are un singur font',fonturiDe:{dela:2,max:1}},{ce:'Titlul a rămas Cambria, 18 pt, aldin',fmt:{text:'Clubul de șah',font:'Cambria',sz:18,b:1}},{ce:'Textul a rămas același',textPastrat:true}],
    tipic:[{t:'Clubul de șah',al:'center',f:{font:'Cambria',sz:18,b:1}},'Ne întâlnim marțea, după ore, în sala 12.','Aduceți tabla de șah, dacă aveți.',{t:'Înscrierile se fac la profesorul de sport.',f:{font:'Courier New'}}],
    ajutor:'Trage de la „A” din „Aduceți” până după punctul din „sport.”. Apoi caseta Font (prima din grupul Font), din listă: Calibri. În listă apare și Calibri (Body): e același font, merge oricare.',
    why:'Titlul are fontul lui, iar tot textul de sub el are un singur font: două fonturi în toată pagina.'},
   inca:[
    {t:'wordteh',previz:false,q:'Titlurile celor două părți trebuie să arate la fel. „Partea întâi” e aldină, de 14 pt. Fă și „Partea a doua” aldină, de 14 pt: selecteaz-o, apasă <b>B</b> și alege 14 în caseta de mărime (<b>Font Size</b>).',
     start:[{t:'Programul serbării',al:'center',f:{sz:18,b:1}},{t:'Partea întâi',f:{sz:14,b:1}},'Colinde și o scenetă.','Partea a doua','Tombola și premiile.'],
     tinta:[{t:'Programul serbării',al:'center',f:{sz:18,b:1}},{t:'Partea întâi',f:{sz:14,b:1}},'Colinde și o scenetă.',{t:'Partea a doua',f:{sz:14,b:1}},'Tombola și premiile.'],
     verif:[{ce:'„Partea a doua” e aldină, de 14 pt',fmt:{text:'Partea a doua',b:1,sz:14}},{ce:'Textul a rămas același',textPastrat:true}],
     tipic:[{t:'Programul serbării',al:'center',f:{sz:18,b:1}},{t:'Partea întâi',f:{sz:14,b:1}},'Colinde și o scenetă.',{t:'Partea a doua',f:{b:1}},'Tombola și premiile.'],
     ajutor:'Trage peste „Partea a doua”, apasă B (Ctrl+B), apoi caseta de mărime: 14.',
     why:'Titlurile de același fel au acum aceeași mărime și același aldin.'},
    {t:'classify',q:'E bine sau trebuie reparat?',cats:['E bine','De reparat'],
     items:[['Titlul în Cambria, tot textul în Calibri',0],['Cinci fonturi diferite într-un anunț',1],['Două titluri de parte: unul de 14 pt, altul de 11 pt',1],['Anunțul scurt încape pe o pagină',0],['Un tabel iese peste marginea din dreapta',1]],
     ajutor:'Folosește lista din pas.',why:'Puține fonturi, titluri la fel, totul între margini și pe o pagină.'}
   ]},
  /* ---------- pasul 5 ---------- */
  {t:'Verifici: semnele ¶ și previzualizarea',
   text:`<p>Înainte să tipărești, verifici în două feluri:</p>
<ol><li>cu <strong>¶</strong> pornit: cauți ·· (un spațiu în plus), ¶ în mijlocul unei propoziții și rândurile care au doar ¶;</li>
<li>cu <mark>previzualizarea</mark>: apeși ${K('Ctrl+P')} sau <strong>Fișier (File)</strong> › <strong>Imprimare (Print)</strong>. În dreapta vezi paginile cum ies pe hârtie: fără semnele ¶, cu marginile. Dedesubt, „1 of 2” înseamnă pagina 1 din 2.</li></ol>
<p>Te întorci în document cu săgeata ← din stânga-sus sau cu <kbd>Esc</kbd>. Butonul <strong>Print</strong> tipărește pe hârtie: îl apeși doar când chiar vrei.</p>
${fig('img/fila-print.webp',1000,498,'Word după Ctrl+P: în stânga lista File cu Print ales, la mijloc setările de tipărire, în dreapta două pagini ale invitației, a doua doar cu semnătura, și 1 of 2 dedesubt','În Word, după Ctrl+P: în stânga, <b>Print</b> (Imprimare); în dreapta, cele două pagini ale invitației, fără semnele ¶, și „1 of 2” dedesubt.')}`,
   exemplu:`<p>Invitația din poză are textul pe pagina 1, iar semnătura stă singură pe pagina 2: cineva a apăsat Enter de multe ori, ca s-o coboare. În document, cu ¶ pornit, vezi rândurile goale. În previzualizare vezi urmarea: o foaie în plus, aproape goală. În Word-ul în română, previzualizarea se numește „examinare înaintea imprimării”.</p>`,
   altfel:`<p>Previzualizarea e ca oglinda de dinainte să pleci de acasă: te uiți o dată la tot și vezi ce trebuie aranjat înainte să te vadă alții. Ce ai tipărit nu mai poți corecta.</p>`,
   incearca:{t:'wordteh',
    q:'Invitația are 2 pagini: semnătura a fost împinsă jos cu Enter-uri. (1) Deschide previzualizarea (<b>Ctrl+P</b> sau <b>Fișier (File)</b> › <b>Imprimare (Print)</b>; pe telefon, butonul <b>Ctrl+P</b> de sub fereastră) și uită-te: „1 of 2”. (2) Întoarce-te cu ← sau Esc. (3) Dă un clic pe rândul gol de deasupra semnăturii și apasă ⌫ de mai multe ori, până semnătura ajunge sub „Vă așteptăm cu drag!”. (4) Deschide din nou previzualizarea: trebuie „1 of 1”.',
    start:P5_START,tinta:P5_TINTA,
    verif:[{ce:'Invitația încape pe o pagină',pagini:1},{ce:'Ai verificat în previzualizare, după ultima schimbare',previzualizare:true},{ce:'Textul a rămas același',textPastrat:true}],
    tipic:P5_START,
    ajutor:'Fiecare ⌫ pe un rând gol șterge un ¶. Pe telefon, butonul ⌫ de sub fereastră. La final, Ctrl+P (pe telefon, butonul Ctrl+P) și uită-te jos: „1 of 1”.',
    why:'Fără rândurile goale, invitația încape pe o foaie; previzualizarea ți-a arătat-o înainte de tipărire.'},
   inca:[
    {t:'choice',q:'În previzualizare, sub pagini, scrie „1 of 3”. Ce înseamnă?',o:['Vezi pagina 1; documentul are 3 pagini','Se tipăresc 3 copii','Pagina are 3 greșeli','Documentul are 3 fonturi'],ok:0,
     ajutor:'„of” înseamnă „din”.',why:'„1 of 3” = pagina 1 din 3.'},
    {t:'tf',q:'Previzualizarea (Ctrl+P) tipărește documentul pe hârtie.',ok:false,
     ajutor:'Ce buton tipărește?',why:'Fals. Previzualizarea doar arată paginile pe ecran; tipărește butonul Print.'}
   ]}
 ],
 atelier:{t:'wordteh',titlu:'Atelier: anunțul târgului',
  intro:`<p>Acum repari singur un anunț întreg, în Word-ul simulat. Sub sarcină vezi <strong>testele</strong>: fiecare se bifează ✔ când partea lui e gata.</p>
<p><b>Cum lucrezi aici:</b> un clic (o atingere) pune cursorul; selectezi trăgând. Butonul <b>¶</b> e pe fila <b>Pornire (Home)</b>, grupul <b>Paragraf (Paragraph)</b>. Previzualizarea: <b>Ctrl+P</b> sau <b>Fișier (File)</b> › <b>Imprimare (Print)</b>. Pe telefon, ¶ și tastele (⌫, Delete, Ctrl+E, Ctrl+R, Ctrl+P) sunt butoane sub fereastră. Ai greșit? ${K('Ctrl+Z')}.</p>
<p>După atelier urmează pasul „Acum la calculatorul din laborator”, pe un document pe care îl descarci. Apoi 5 întrebări de verificare.</p>`,
  q:'Repară anunțul, pe rând: (1) pornește ¶; (2) titlul: șterge spațiile din fața lui și apasă <b>Center</b>; (3) unește paragraful rupt după „claselor” (și pune spațiul la loc); (4) repară spațiile din jurul semnelor, al parantezei, al cratimei și al liniei de pauză; (5) paragraful scris cu <b>Courier New</b> trece în <b>Calibri</b>, ca restul textului; (6) șterge cele două rânduri goale; (7) semnătura: fără spații în față, cu <b>Align Right</b>; (8) la final, verifică pagina în previzualizare (Ctrl+P).',
  start:ATELIER_START,tinta:ATELIER_TINTA,
  verif:[{ce:'Semnele ¶ sunt pornite',pil:true},
         {ce:'Titlul e la mijloc, cu Center, fără spații în față',paragraf:'Târgul de toamnă',al:'center'},
         {ce:'Primul paragraf e întreg (fără Enter în mijloc)',paragraf:'Vineri, 13 noiembrie, de la ora 12, elevii claselor a VII-a vă invită în curtea școlii la Târgul de toamnă.'},
         {ce:'Niciun spațiu dublu',fara:'spatiiDuble'},
         {ce:'Niciun spațiu înaintea semnelor , . ! ?',fara:'spatiuInainte'},
         {ce:'Un spațiu după fiecare virgulă și punct din mijlocul textului',fara:'lipitDupa'},
         {ce:'Paranteza lipită de textul din ea',fara:'paranteze'},
         {ce:'Cratima fără spații, linia de pauză cu spații',fara:['cratima','linia']},

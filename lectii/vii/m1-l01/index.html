<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ce facem anul acesta. Criteriile de evaluare și cele trei niveluri. Evaluare inițială</title>
<meta name="description" content="Lecția 1, clasa a VII-a: ce faci anul acesta la TIC, cele trei niveluri (De bază, Consolidat, Avansat), cum devin punctele unei lucrări notă și evaluarea inițială, pe care ți-o corectezi singur, fără note.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Mulish:ital,wght@0,400;0,700;0,800;1,400&family=Overpass+Mono:wght@400;600&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
/* TEMA: foaia de lucrare și scara celor trei niveluri (De bază → Consolidat → Avansat) */
:root{
  --desk:#EEF1EC; --paper:#FFFFFF; --paper2:#F3F6F1; --line:#C8D2C6;
  --ink:#1B2620; --ink2:#4C5B52; --accent:#2F5D50; --accentInk:#FFFFFF; --sel:#DCEBE4;
  --mark:#FFE08A; --markInk:#1B2620; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Young Serif",Georgia,"Times New Roman",serif; --fb:"Mulish","Segoe UI",system-ui,sans-serif; --fm:"Overpass Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101713; --paper:#18221C; --paper2:#1F2B24; --line:#34463B; --ink:#E5EEE8; --ink2:#A5B8AC;
  --accent:#8FD1B8; --accentInk:#101713; --sel:#24453A; --mark:#F2C94C; --markInk:#1B2620;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#101713; --paper:#18221C; --paper2:#1F2B24; --line:#34463B; --ink:#E5EEE8; --ink2:#A5B8AC;
  --accent:#8FD1B8; --accentInk:#101713; --sel:#24453A; --mark:#F2C94C; --markInk:#1B2620;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda: trei trepte care urcă */
.banda{min-height:34px;padding:4px 10px;display:flex;align-items:flex-end;gap:4px;background:var(--paper)}
.banda .tr{font-family:var(--fm);font-size:.68rem;font-weight:600;letter-spacing:.02em;color:var(--accent);border:1.5px solid var(--accent);border-bottom:0;border-radius:5px 5px 0 0;padding:1px 7px;white-space:nowrap;background:var(--paper2)}
.banda .tr.t1{height:14px;line-height:12px}.banda .tr.t2{height:20px;line-height:18px}.banda .tr.t3{height:26px;line-height:24px;background:var(--accent);color:var(--accentInk)}
h1{font-weight:400;letter-spacing:0}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:400}
/* eticheta nivelului */
.niv{display:inline-block;font-family:var(--fm);font-size:.74rem;font-weight:600;letter-spacing:.02em;padding:1px 9px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);margin:0 6px 2px 0;vertical-align:.08em;white-space:nowrap}
.niv.c{border-style:double;border-width:3px}
.niv.a{background:var(--accent);color:var(--accentInk)}
.niv-lista{list-style:none;padding:0;margin:.5em 0 .7em;display:grid;gap:6px}
.niv-lista li{border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:6px 10px;line-height:1.4}
.unitati{margin:.4em 0 .6em;padding-left:1.3em}
.unitati li{margin:.25em 0}
.unitati .fol{color:var(--ink2)}
.calc{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:inline-block}
.credit{font-size:.78rem;color:var(--ink2)}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:800;color:var(--accent);min-height:44px;padding:12px 0;line-height:1.35;box-sizing:border-box}

/* ---- tipul „numar”: un rezultat scris ---- */
.nr-rand{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.nr-rand label{font-weight:700}
.nr-in{font:inherit;font-family:var(--fm);font-size:1.05rem;width:7.5em;min-height:44px;box-sizing:border-box;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.nr-in:focus{outline:3px solid var(--accent);outline-offset:1px}

/* ---- tipul „evalinit”: evaluarea inițială, corectată de elev ---- */
.ei-ex{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;margin:0 0 12px}
.ei-ex h3{font-family:var(--fb);font-size:1rem;font-weight:800;margin:0 0 6px;line-height:1.35}
.ei-parte{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.ei-parte:first-of-type{border-top:0;padding-top:0}
.ei-parte.rau{background:var(--badbg);border-radius:8px;padding:8px;border-top-color:transparent}
.ei-parte.bun{background:var(--okbg);border-radius:8px;padding:8px;border-top-color:transparent}
.ei-parte .ei-t{margin:0 0 6px;line-height:1.4}
.ei-parte .ei-mesaj{display:block;font-size:.88rem;color:var(--bad);margin-top:4px}
.ei-but{display:flex;flex-wrap:wrap;gap:6px}
.ei-b{font:inherit;min-height:44px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper2);color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.ei-b[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:800}
.ei-b[aria-pressed="true"]::before{content:"✔ ";color:var(--accent)}
.ei-b:disabled{cursor:default;opacity:.85}
.ei-col{display:grid;gap:6px}
.ei-col .ei-b{width:100%}
.ei-in{font:inherit;font-family:var(--fm);min-height:44px;box-sizing:border-box;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:11em;max-width:100%}
.ei-in.scurt{width:6em}
.ei-in:focus,.ei-b:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.ei-alg{display:grid;gap:10px}
@media (min-width:640px){.ei-alg{grid-template-columns:1fr 1fr}}
.ei-alg .et{font-weight:800;font-size:.88rem;color:var(--ink2);margin:0 0 4px}
.ei-cod{font-family:var(--fm);white-space:pre;min-height:44px}
.ei-prog{list-style:none;margin:0;padding:6px;border:2px dashed var(--line);border-radius:8px;min-height:120px;display:grid;gap:6px;align-content:start;background:var(--paper2)}
.ei-prog .gol{color:var(--ink2);font-size:.88rem;padding:6px}
.ei-teste{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.ei-teste ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ei-teste li{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;line-height:1.35}
.ei-teste li .s{flex:none;width:1.4em;text-align:center;font-weight:800}
.ei-teste li.ok .s{color:var(--ok)}.ei-teste li.rau .s{color:var(--bad)}
.ei-teste li .m{display:block;font-size:.86rem;color:var(--ink2)}
.ei-fisa{margin-top:12px;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ei-fisa h3{font-family:var(--fd);font-weight:400;font-size:1.05rem;margin:0 0 6px}
.ei-fisa table{border-collapse:collapse;width:100%;font-size:.92rem}
.ei-fisa th,.ei-fisa td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.ei-fisa ul{margin:.4em 0 0;padding-left:1.2em}
.ei-fisa li{margin:.3em 0}
.ei-fisa a{font-weight:700}
.ei-noua{min-height:44px}
/* legăturile din fișă și din teste: culoarea temei (judecata 2, m3: #0000EE pe fond întunecat avea ≈ 1,7:1) */
.ei-fisa a,.ei-teste a,.ei-mesaj a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.ei-mesaj a{color:var(--bad)}
.pescurt{border-left:4px solid var(--accent);background:var(--paper2);padding:6px 10px;margin:.6em 0;line-height:1.45}
.ei-cine{border:2px solid var(--accent);border-radius:10px;background:var(--sel);color:var(--ink);padding:10px 12px;margin:0 0 12px;line-height:1.45}
</style>
</head>
<body>
<script src="../../_sim/rezultat-elev.js"></script>
<script src="../../../jocuri/_motor/motor.js"></script>
<script>
/* LECȚIA 1, clasa a VII-a, modulul 1 (revizuirea LearningHub, standardul din 27.09.2026): ora de organizare + evaluare inițială.
   Surse (toate ale profesorului): Info_Gimnaziu_2026\instrumente\Fisa_criterii_elev_clasa_VII.md, SISTEM_EVALUARE.md,
   materiale\print\Saptamana1_clasa_VII.html, materiale\continut\teste_initiale.json (VII), data\unitati.json. Detalii: surse.md.
   Pasul 0 „La ce folosește”, 5 pași cu „Încearcă” (regulile de note: rezumatul „Pe scurt” din pasul 5), atelierul = evaluarea inițială a
   profesorului, corectată de elev (tipul `evalinit`, scris aici), pasul „Acum la calculatorul din laborator”, 5 întrebări.
   Reparațiile după judecător (27.09): _verificare/judecator.md și surse.md, „Reparații”. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const NIV={b:'<span class="niv">De bază</span>',c:'<span class="niv c">Consolidat</span>',a:'<span class="niv a">Avansat</span>'};
const NUME_NIV={b:'De bază',c:'Consolidat',a:'Avansat'};
const IMG_CENTURI=fig('img/centuri.webp',850,754,'Cinci centuri de arte marțiale, strânse și așezate una lângă alta: galbenă, portocalie, verde, albastră și maro',
  'Centurile de la judo: cerințele se știu dinainte, iar centurile se iau una după alta. <span class="credit">Foto: chris 論, <a href="https://commons.wikimedia.org/wiki/File:Obi-goky%C5%AB.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 3.0</a>; convertită în WebP.</span>');

/* ---------- unde se recitește (jocurile de a V-a și a VI-a de pe sit; nivelurile citite din configurația lor) ---------- */
/* legătura „doar recitire” a motorului (dirijorul, 27.09): ?recitire=N (N de la 1, ca pe ecran) deschide pașii nivelului N
   fără să-l deblocheze și fără notă; nivelurile unui joc se deschid altfel numai pe rând */
const JOC=(slug,joc,n,titlu)=>({href:`../../../jocuri/${slug}/?recitire=${n}`,joc,n,titlu});
const RE={
  ppt6:  {...JOC('prezentari-vi','Misiunea Diapozitiv',8,'Mini-proiect: prezint un joc'),amintire:'Pe un diapozitiv stau idei scurte: cel mult 6 rânduri, cel mult 6 cuvinte pe rând (regula 6 × 6).'},
  /* „5–8 diapozitive pentru 5 minute” e cheia profesorului, nepredată în prezentari-vi (judecătorul, M7): fără trimitere la joc */
  pptNr: {href:'',joc:'',n:0,titlu:'',amintire:'Pentru o prezentare de 5 minute, profesorul socotește potrivite 5–8 diapozitive: primul cu titlul și numele tău, apoi câte o idee pe diapozitiv, la final concluzia.'},
  pptStr:{...JOC('prezentari-vi','Misiunea Diapozitiv',3,'Diapozitive și obiecte'),amintire:'Ordinea unei prezentări: diapozitivul de titlu (subiectul și autorul), cuprinsul, câte o idee pe diapozitiv, concluzia; sursele, dacă ai folosit, pe un diapozitiv la final.'},
  ppt1:  {...JOC('prezentari-vi','Misiunea Diapozitiv',1,'Prezentarea și fereastra aplicației'),amintire:'O prezentare este un șir de diapozitive.'},
  parola:{...JOC('internet-vi','Misiunea Mesaj Sigur',2,'Parola și urma ta digitală'),amintire:'O parolă puternică amestecă litere mari, litere mici, cifre și simboluri și are cel puțin 15 caractere.'},
  atas:  {...JOC('internet-vi','Misiunea Mesaj Sigur',3,'Contul și adresa de e-mail'),amintire:'Atașamentele sunt fișiere trimise odată cu mesajul.'},
  cc:    {href:'',joc:'',n:0,titlu:'',amintire:'CC (copie) trimite același mesaj și altor persoane, pe lângă cea din Către; toți văd cine l-a primit. Mesajul nu se șterge.'},
  netic: {...JOC('internet-vi','Misiunea Mesaj Sigur',5,'Dosare, agendă și netichetă'),amintire:'Neticheta înseamnă bunele maniere pe internet.'},
  capc:  {...JOC('internet-vi','Misiunea Mesaj Sigur',6,'Mesajul-capcană'),amintire:'Serviciile adevărate nu îți cer niciodată parola prin e-mail. La un mesaj-capcană nu apeși pe linkuri, nu răspunzi, nu deschizi atașamentele; arăți mesajul unui adult și îl marchezi ca spam.'},
  repet: {...JOC('algoritmi-vi','Misiunea Buclă',2,'De ce repetăm'),amintire:'Structura repetitivă face aceiași pași de mai multe ori.'},
  contor:{...JOC('algoritmi-vi','Misiunea Buclă',3,'Repetiția cu contor'),amintire:'Când știi dinainte de câte ori repeți, folosești structura cu contor: pentru i ← 1, n execută.'},
  suma:  {...JOC('algoritmi-vi','Misiunea Buclă',8,'Sume, numărări, cifre'),amintire:'La o sumă, variabila pornește de la 0 (s ← 0), pentru că 0 nu schimbă suma. La fiecare trecere aduni numărul curent: s ← s + i. La final scrii s.'},
  /* clasa a V-a */
  intr:  {...JOC('calculator-v','Misiunea Tehnician',5,'Intrare, ieșire, intrare-ieșire'),amintire:'Pe un dispozitiv de intrare datele intră în calculator (microfonul, tastatura); pe unul de ieșire iese rezultatul (monitorul, boxele).'},
  stoc:  {...JOC('calculator-v','Misiunea Tehnician',6,'Stocare: cât încape?'),amintire:'De la byte în sus, fiecare treaptă e de 1024 de ori mai mare: 1 GB = 1024 MB.'},
  cos:   {...JOC('fisiere-v','Misiunea Ordine',5,'Copiez, mut, șterg, caut'),amintire:'Un fișier de pe discul calculatorului, șters cu tasta Delete, ajunge în Coșul de reciclare, de unde îl poți restaura. Cu Shift+Delete sau de pe un stick USB, fișierul se șterge definitiv, fără să treacă prin Coș.'},
  folder:{...JOC('fisiere-v','Misiunea Ordine',3,'Fișiere și foldere'),amintire:'Un folder poate avea în el fișiere și alte foldere. Extensia (după punct) arată tipul fișierului.'},
  autor: {...JOC('documentare-v','Misiunea Documentare',5,'Drepturile de autor'),amintire:'Folosești ce are licență liberă sau un fragment scurt, și scrii mereu sursa: autorul și locul de unde ai luat.'},
  cred:  {...JOC('documentare-v','Misiunea Documentare',6,'Pot avea încredere?'),amintire:'Pagina e credibilă dacă știi cine a scris-o, când, de ce, și dacă alte surse spun la fel.'},
  alt:   {...JOC('algoritmi-v','Misiunea Pas cu Pas',6,'Structura alternativă'),amintire:'Dacă condiția e adevărată, se execută ramura „atunci”; dacă e falsă, ramura „altfel”. Se execută o singură ramură.'}
};
const unde=r=>r.href?`<a href="${r.href}" target="_blank" rel="noopener">pașii nivelului ${r.n} („${r.titlu}”) din jocul „${r.joc}”</a>`:'explicația din fișa de pornire, de mai jos (nu e în jocurile de pe sit)';

/* ce NU verifică fiecare probă (judecătorul, m3: fișa spunea „nimic de recitit” și despre materia neverificată) */
const NEVERIF={
  vi:[{ce:'animațiile și modelele 3D (clasa a VI-a)',...JOC('animatii-3d-vi','Misiunea Cadru',1,'Studioul de animație')}],
  v:[{ce:'desenul în editorul grafic (clasa a V-a)',...JOC('grafica-v','Misiunea Pixel',1,'Ce face un editor grafic')},
     {ce:'Scratch (clasa a V-a)',...JOC('scratch-v','Misiunea Scenă',1,'Interfața mediului grafic')}]
};

/* ---------- fișa de pornire: ține-o componenta comună lectii/_sim/rezultat-elev.js (dirijorul, 28.09) ----------
   Fără logică proprie de identitate: RezultatElev.salveaza() la prima apăsare pe „Verifică” a fiecărei evaluări,
   RezultatElev.citeste() la desen, evenimentul `rezultat-elev` pentru redesenare. Componenta pune numele doar când caseta
   din prezenta.js spune „activ”, păstrează PRIMA încercare (refacerea e „reîncercare”), ține rezultatul fără nume doar
   în fila asta, 50 de minute, și întreabă singură „Verificarea de la ora hh:mm e a ta?” când elevul se înscrie. */
const CHEI_FISA={vi:'vii-m1-l01-initiala',v:'vii-m1-l01-proba-v'};
const TITLU_FISA={vi:'Evaluarea inițială (materia clasei a VI-a)',v:'Proba din clasa a V-a'};
const escF=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RE_OK=()=>!!(window.RezultatElev&&window.RezultatElev.citeste);
function fisaHtml(){
  if(!RE_OK())return '<p><b>Fișa de pornire nu se poate afișa</b> (lipsește componenta care o ține minte). Scrie în caiet ce ai trecut și ce nu.</p>';
  const R=Object.fromEntries(Object.entries(CHEI_FISA).map(([p,k])=>[p,window.RezultatElev.citeste(k)])),probe=['vi','v'].filter(p=>R[p]&&R[p].rezultat&&R[p].rezultat.ex);
  const buton='<button class="btn ei-noua" type="button" data-fisa-noua>Începe o fișă nouă (sunt alt elev)</button>';
  /* v3: citeste(K) e null și când fișa lui X e pe calculator, dar așteaptă „Ești X?” — atunci NU scriem „e goală”
     (l-ar trimite pe elev să refacă evaluarea, cu răspunsurile deja văzute) */
  const asteapta=Object.entries(CHEI_FISA).filter(([p])=>!probe.includes(p)).map(([p,k])=>{try{return window.RezultatElev.asteaptaConfirmare?window.RezultatElev.asteaptaConfirmare(k):null}catch(e){return null}}).filter(Boolean);
  const mesajAsteapta=asteapta.length?`<p class="ei-asteapta"><b>Pe calculator e fișa lui ${escF(asteapta[0].elev)}, de la ora ${escF(asteapta[0].ora)}.</b> Dacă ești ${escF(asteapta[0].elev)}, apasă sus „Da” ca s-o vezi.</p>`:'';
  if(!probe.length)return mesajAsteapta||'<p><b>Fișa de pornire e goală.</b> Mergi la Atelier (fila „Atelier” din bara de pași), rezolvă evaluarea și apasă „Verifică”.</p>';
  const P0=R[probe[0]];
  const cine=P0.elev?`<p>Fișa elevului înscris: <b>${escF(P0.elev)}</b>.</p>`
    :P0.deConfirmat?'<p>Fișa așteaptă răspunsul tău la întrebarea de sus: e scrisă pe numele din caseta de jos abia după ce spui că ești tu.</p>'
    :'<p>Fișa nu are nume: nu erai înscris în caseta de jos când ai dat evaluarea. Se păstrează doar în fila asta, cel mult 50 de minute. După ce te înscrii, pagina te întreabă sus dacă verificarea e a ta: apasă „Da” doar dacă ai făcut-o tu.</p>';
  return cine+mesajAsteapta+probe.map(pid=>{const V=R[pid],ex=V.rezultat.ex;
    const rand=ex.map(e=>`<tr><td>${e.nr}</td><td>${NUME_NIV[e.niv]}</td><td>${e.ok?'✔ din prima':'✗ nu din prima'}</td></tr>`).join('');
    const rec=ex.filter(e=>!e.ok).flatMap(e=>e.recit.map(k=>({nr:e.nr,r:RE[k]})));
    const lista=rec.length?`<p><b>De recitit</b> (fiecare legătură deschide, într-o filă nouă, pașii unui nivel, doar de citit):</p><ul>${rec.map(x=>`<li>Exercițiul ${x.nr}: ${x.r.href?`${unde(x.r)}. <i>Pe scurt:</i>`:'<i>nu e în jocurile de pe sit; reține:</i>'} ${x.r.amintire}</li>`).join('')}</ul>`:'<p><b>De recitit</b>, din ce a verificat proba: nimic.</p>';
    const nev=`<p><b>Proba nu a verificat:</b> ${(NEVERIF[pid]||[]).map(n=>`${n.ce}: ${unde(n)}`).join('; ')}.</p>`;
    const re=V.reincercare?`<p>Ai refăcut evaluarea (${oriText(V.reincercari)}, ultima la ora ${V.oraReincercare}). Fișa păstrează <b>prima încercare</b>: după ce ai văzut răspunsurile, refacerea nu mai arată de unde pleci.</p>`:'';
    return `<h3>${TITLU_FISA[pid]}</h3><p>Prima încercare: ora ${V.ora}.</p><table><thead><tr><th>Exercițiul</th><th>Nivelul</th><th>La prima apăsare pe „Verifică”</th></tr></thead><tbody>${rand}</tbody></table>${re}${lista}${nev}`}).join('')
    +`<p>Nu e fișa ta? ${buton}</p>`;
}
function umpleFisa(){document.querySelectorAll('[data-fisa]').forEach(el=>{el.classList.add('ei-fisa');el.innerHTML=fisaHtml()});
  document.querySelectorAll('[data-fisa-local]:not([hidden])').forEach(el=>{el.innerHTML=fisaHtml()})}
/* ---------- „Cine dă evaluarea?” la ÎNCEPUTUL atelierului (judecata 2, GRAV: identitatea se cerea abia în laborator,
   DUPĂ evaluare). Starea o dă RezultatElev.cine() (prezenta.js: 'activ' | 'intreaba' | …; componenta adaugă
   'alta-fila' și 'fara-prezenta'). Etichetele sunt cele din assets/js/prezenta.js. */
const scurtNume=n=>{const w=String(n||'').trim().split(/\s+/);return w.length>1?w[w.length-1]+' '+w[0].charAt(0)+'.':(w[0]||'')};   // ca scurt() din prezenta.js
const ASCUNSA=' Dacă nu vezi caseta, derulează până la capătul paginii.';
const oriText=n=>n===1?'o dată':n<20?`de ${n} ori`:`de ${n} de ori`;
const cuPunct=t=>/[.!?]$/.test(t)?t:t+'.';
function cineHtml(){
  const c=RE_OK()?window.RezultatElev.cine():{stare:'fara-prezenta',elev:null};
  if(c.stare==='activ'&&c.elev)return `<b>Cine dă evaluarea?</b> Caseta de jos a ecranului scrie că lucrează <b>${escF(cuPunct(scurtNume(c.elev)))}</b> Nu ești tu? Apasă pe ea, apoi „Nu ești tu? Schimbă elevul” și alege-te din listă.${ASCUNSA}`;
  if(c.stare==='intreaba')return '<b>Cine dă evaluarea?</b> Caseta de jos a ecranului te întreabă „Ești tot …?”. Răspunde întâi: „Da, sunt eu” sau „Nu, sunt alt elev”.';
  if(c.stare==='vizitator')return '<b>Cine dă evaluarea?</b> Ai ales „Nu, doar vizitez”. Dacă ești elev, apasă caseta de jos a ecranului („Sunt elev — mă înscriu”) și înscrie-te, apoi revino la fila „Atelier”.'+ASCUNSA;
  if(c.stare==='alta-fila')return '<b>Cine dă evaluarea?</b> Elevul s-a schimbat în altă filă. Reîncarcă pagina, ca să vezi în caseta de jos cine lucrează acum.';
  return '<b>Cine dă evaluarea?</b> Nu ești înscris. Apasă caseta de jos a ecranului („Spune cine ești” sau „Cine lucrează acum?”) și înscrie-te, apoi revino la fila „Atelier”.'+ASCUNSA;
}
function umpleCine(){document.querySelectorAll('[data-cine]').forEach(el=>{el.innerHTML=cineHtml()})}
new MutationObserver(()=>{
  if(document.querySelector('[data-fisa]:not([data-umplut])')){document.querySelectorAll('[data-fisa]').forEach(el=>el.setAttribute('data-umplut','1'));umpleFisa()}
  if(document.querySelector('[data-cine]:not([data-umplut])')){document.querySelectorAll('[data-cine]').forEach(el=>el.setAttribute('data-umplut','1'));umpleCine()}
}).observe(document.documentElement,{childList:true,subtree:true});

/* ---------- tipul „numar”: elevul scrie un rezultat pe care îl obține aplicând regula ---------- */
/* un număr scris de copil: „72”, „8,5”, „1 024”, dar și „6 diapozitive”, „1024 MB”, „72 de puncte” (judecătorul, M4-M5:
   răspunsuri bune respinse); orice altceva („cinci”, „5 sau 6”) = null, iar pagina cere „doar numărul, cu cifre” */
const citesteNr=s=>{s=String(s||'').trim().toLowerCase().replace(/(\d)[\s ]+(?=\d)/g,'$1').replace(',','.');
  const m=s.match(/^(-?\d+(?:\.\d+)?)(?:\s*[a-zăâîșşțţ]+(?:\s+[a-zăâîșşțţ]+)*)?\s*\.?$/);return m?parseFloat(m[1]):null};
const fmtNr=v=>String(v).replace('.',',');
const TipNumar={
  render(Q,body,api){
    body.innerHTML=`<div class="nr-rand"><label>${api.esc(Q.eticheta||'Răspunsul tău')}: <input class="nr-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></label>${Q.unitate?`<span>${api.esc(Q.unitate)}</span>`:''}</div>`;
    const inp=body.querySelector('.nr-in');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=document.getElementById('chk');if(b)b.click()}});
    const nav=api.checkButton(()=>{
      const v=citesteNr(inp.value);
      if(v===null){api.feedback('bad','<strong>Scrie un număr</strong>, doar cu cifre (de exemplu 72).');inp.focus({preventScroll:true});return}
      if(Math.abs(v-Q.ok)<1e-9){inp.disabled=true;nav.innerHTML='';api.resolve(true);return}
      const cap=(Q.capcane||{})[String(v)];
      api.resolve(false,cap||`${fmtNr(v)} nu e rezultatul. Refă socoteala pe pașii din pas.`);
      inp.focus({preventScroll:true});inp.select();
      api.revealButton(()=>{inp.value=fmtNr(Q.ok);inp.disabled=true;nav.innerHTML='';api.giveUp(`<b>${fmtNr(Q.ok)}</b>`)});
    });
  },
  rezolva(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.ok);return true},
  gresit(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.tipic);return true}
};

/* ---------- tipul „evalinit”: evaluarea inițială, pe care elevul și-o corectează singur ----------
   Q.ex:[{nr, niv:'b'|'c'|'a', titlu, test, parti:[…]}]; o parte:
     {k:'af', t, r:true|false, re}                    adevărat / fals
     {k:'text', pre, post, r:['variante acceptate'], re}   completare (fără diacritice, litere mici/mari la fel)
     {k:'nr', t, r:[min,max], re, eticheta?}           un număr
     {k:'alege', t, o:[…], ok, re}                     o singură variantă
     {k:'bife', t, o:[[text, bun],…], re}              tot ce se potrivește (nimic în plus)
     {k:'linii', t, o:[rânduri], r:[indici în ordine], re}   construiești un algoritm din rânduri
   re = cheia din RE (unde se recitește). Q.gresite = răspunsuri tipice greșite, pentru poartă. */
const fara=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[şș]/g,'s').replace(/[ţț]/g,'t').replace(/[„”"'.,;:!?]/g,' ').replace(/\s+/g,' ').trim();
const TipEval={
  render(Q,body,api){
    const st={v:{},prima:null};
    const id=(e,p)=>`${e}_${p}`;
    const parteHtml=(E,P,j)=>{const k=id(E.nr,j);
      if(P.k==='af')return `<p class="ei-t">${P.t}</p><div class="ei-but" role="group" aria-label="Adevărat sau fals">${[['A','Adevărat'],['F','Fals']].map(([v,n])=>`<button class="ei-b" type="button" data-p="${k}" data-v="${v}" aria-pressed="false">${n}</button>`).join('')}</div>`;
      if(P.k==='text')return `<p class="ei-t"><label>${P.pre} <input class="ei-in" type="text" data-p="${k}" autocomplete="off" spellcheck="false" aria-label="${api.esc(P.pre.replace(/<[^>]+>/g,''))}"> ${P.post||''}</label></p>`;
      if(P.k==='nr')return `<p class="ei-t"><label>${P.t} <input class="ei-in scurt" type="text" inputmode="numeric" data-p="${k}" autocomplete="off" spellcheck="false"> ${P.post||''}</label></p>`;
      if(P.k==='alege'||P.k==='bife')return `<p class="ei-t">${P.t}</p><div class="ei-col" role="group">${P.o.map((o,i)=>`<button class="ei-b" type="button" data-p="${k}" data-v="${i}" aria-pressed="false">${api.esc(P.k==='bife'?o[0]:o)}</button>`).join('')}</div>`;
      if(P.k==='linii')return `<p class="ei-t">${P.t}</p><div class="ei-alg"><div><p class="et">Liniile (atinge una ca s-o adaugi)</p><div class="ei-col ei-pool" data-p="${k}">${P.o.map((o,i)=>`<button class="ei-b ei-cod" type="button" data-l="${i}">${api.esc(o)}</button>`).join('')}</div></div><div><p class="et">Algoritmul tău (atinge o linie ca s-o scoți)</p><ol class="ei-prog" data-p="${k}"><li class="gol">Încă nicio linie.</li></ol></div></div>`;
      return '';};
    body.innerHTML=`<div class="ei-cine" data-cine role="note"></div>${Q.ex.map(E=>`<section class="ei-ex" data-e="${E.nr}"><h3>${NIV[E.niv]} ${E.nr}. ${E.titlu}</h3>${E.parti.map((P,j)=>`<div class="ei-parte" data-pp="${id(E.nr,j)}">${parteHtml(E,P,j)}<span class="ei-mesaj"></span></div>`).join('')}</section>`).join('')}
      <div class="ei-teste"><b>Testele</b> <span class="hint">· se bifează când apeși „Verifică”</span><ol>${Q.ex.map(E=>`<li data-e="${E.nr}"><span class="s">○</span><span>${api.esc(E.test)}<span class="m"></span></span></li>`).join('')}</ol></div>
      <div data-rezultat-elev-intrebare></div>
      <div class="ei-fisa" data-fisa-local hidden></div>`;   /* locul întrebării „Ești X?” a componentei: sub teste, unde era butonul „Verifică” când l-ai apăsat (judecata 4); fișa se deschide dedesubt */
    /* alegerile */
    body.querySelectorAll('.ei-b[data-p]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;
      const k=b.dataset.p,[en,pj]=k.split('_').map(Number),P=Q.ex.find(e=>e.nr===en).parti[pj];
      if(P.k==='bife'){const s=new Set(st.v[k]||[]),v=+b.dataset.v;s.has(v)?s.delete(v):s.add(v);st.v[k]=[...s];b.setAttribute('aria-pressed',s.has(v)?'true':'false')}
      else{st.v[k]=b.dataset.v;body.querySelectorAll(`.ei-b[data-p="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}}));
    body.querySelectorAll('.ei-in').forEach(i=>i.addEventListener('input',()=>{st.v[i.dataset.p]=i.value}));
    /* algoritmul din rânduri */
    const desen=k=>{const [en,pj]=k.split('_').map(Number),P=Q.ex.find(e=>e.nr===en).parti[pj],ales=st.v[k]||[];
      const ol=body.querySelector(`.ei-prog[data-p="${k}"]`);
      ol.innerHTML=ales.length?ales.map((l,poz)=>`<li><button class="ei-b ei-cod" type="button" data-scoate="${poz}">${api.esc(P.o[l])}</button></li>`).join(''):'<li class="gol">Încă nicio linie.</li>';
      body.querySelectorAll(`.ei-pool[data-p="${k}"] .ei-b`).forEach(b=>{b.disabled=ales.includes(+b.dataset.l)||st.gata});
      ol.querySelectorAll('[data-scoate]').forEach(b=>{b.disabled=!!st.gata;b.onclick=()=>{if(st.gata)return;ales.splice(+b.dataset.scoate,1);st.v[k]=ales;desen(k)}})};
    body.querySelectorAll('.ei-pool').forEach(pool=>{const k=pool.dataset.p;st.v[k]=[];
      pool.querySelectorAll('.ei-b').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;st.v[k]=(st.v[k]||[]).concat(+b.dataset.l);desen(k)}))});
    /* verificarea unei părți */
    const bun=(P,v)=>{
      if(P.k==='af')return v===(P.r?'A':'F');
      if(P.k==='text')return v!=null&&P.r.some(r=>fara(v).replace(/^cu /,'')===fara(r));
      if(P.k==='nr'){const n=citesteNr(v);return n!==null&&n>=P.r[0]&&n<=P.r[1]}
      if(P.k==='alege')return v!=null&&+v===P.ok;
      if(P.k==='bife'){const s=new Set(v||[]);return P.o.every((o,i)=>!!o[1]===s.has(i))}
      if(P.k==='linii')return JSON.stringify(v||[])===JSON.stringify(P.r);
      return false};
    const lipsa=(P,v)=>P.k==='bife'?!(v&&v.length):P.k==='linii'?!(v&&v.length):(v==null||String(v).trim()===''||(P.k==='nr'&&citesteNr(v)===null));
    /* „Începe o fișă nouă”: următoarea apăsare pe „Verifică” scrie din nou fișa */
    const nou=e=>{if(!body.isConnected){removeEventListener('rezultat-elev',nou);return}
      if(e.detail&&(e.detail.motiv==='golit'||e.detail.motiv==='alt-elev'))st.prima=null};   // următoarea apăsare pe „Verifică” se salvează din nou (prima sau reîncercare, decide componenta)
    addEventListener('rezultat-elev',nou);
    const MESAJ={af:'Alegerea nu e bună.',text:'Cuvântul nu e cel căutat.',nr:'Numărul nu e bun.',alege:'Varianta nu e cea bună.',bife:'Ai bifat prea puțin sau ceva ce nu faci.',linii:'Algoritmul nu e bun: verifică de unde pornește s, de câte ori repeți și ce aduni.'};
    const blocheaza=()=>{st.gata=true;body.querySelectorAll('.ei-b,.ei-in').forEach(x=>x.disabled=true);body.querySelectorAll('.ei-prog [data-scoate]').forEach(x=>x.disabled=true)};
    const verifica=()=>{
      const gol=[],cifre=[];Q.ex.forEach(E=>E.parti.forEach((P,j)=>{const v=st.v[id(E.nr,j)];if(lipsa(P,v)){gol.push(E.nr);if(P.k==='nr'&&v!=null&&String(v).trim()!=='')cifre.push(E.nr)}}));
      if(gol.length){api.feedback('bad',`<strong>Mai ai de răspuns</strong> la exercițiul ${[...new Set(gol)].join(', ')}. Răspunde la tot, chiar dacă nu ești sigur: evaluarea nu se notează.${cifre.length?` La exercițiul ${[...new Set(cifre)].join(', ')} scrie numărul cu cifre, de exemplu 6.`:''}`);return}
      let trecute=0;const rez=[];
      Q.ex.forEach(E=>{let ok=true;const rec=[];
        E.parti.forEach((P,j)=>{const k=id(E.nr,j),b=bun(P,st.v[k]),div=body.querySelector(`[data-pp="${k}"]`);
          div.classList.toggle('rau',!b);div.classList.toggle('bun',b);
          div.querySelector('.ei-mesaj').innerHTML=b?'':`${MESAJ[P.k]} Recitește: ${unde(RE[P.re])}.`;
          if(!b){ok=false;if(!rec.includes(P.re))rec.push(P.re)}});
        const li=body.querySelector(`.ei-teste li[data-e="${E.nr}"]`);li.className=ok?'ok':'rau';li.querySelector('.s').textContent=ok?'✔':'✗';
        li.querySelector('.m').innerHTML=ok?'':`Recitește: ${rec.map(r=>unde(RE[r])).join('; ')}.`;
        if(ok)trecute++;rez.push({nr:E.nr,niv:E.niv,ok,recit:rec})});
      let asteapta=false;
      if(!st.prima){st.prima=rez;if(RE_OK()){const v=window.RezultatElev.salveaza(CHEI_FISA[Q.proba],{ex:rez});asteapta=!!(v&&v.deConfirmat)}}
      /* întrebarea componentei („Ești X?”) stă sub teste; o aducem în fața elevului (judecata 4: pe telefon rămânea cu ~4.450 px mai sus) */
      const laIntrebare=()=>{const q=document.getElementById('lh-rez-q');if(q&&q.offsetParent!==null)q.scrollIntoView({block:'center'});return !!q};
      if(asteapta)[250,700].forEach(t=>setTimeout(laIntrebare,t));
      const MSG_INTREBARE=asteapta?' <b>Răspunde întâi la întrebarea „Ești …?”, de sub teste:</b> fără „Da”, fișa nu se scrie pe numele tău.':'';
      const f=body.querySelector('[data-fisa-local]');f.hidden=false;f.innerHTML=fisaHtml();
      if(trecute===Q.ex.length){blocheaza();api.nav().innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${trecute} din ${Q.ex.length} teste trecute. La ✗: recitește ce scrie sub test, repară și apasă din nou „Verifică”. Fișa de pornire a păstrat ce ai trecut din prima.${MSG_INTREBARE}`);
        const primul=body.querySelector('.ei-parte.rau .ei-b:not(:disabled),.ei-parte.rau .ei-in');if(primul)primul.focus({preventScroll:true});
        api.revealButton(()=>{pune(corecte());blocheaza();const f2=body.querySelector('[data-fisa-local]');f2.hidden=false;f2.innerHTML=fisaHtml();api.nav().innerHTML='';api.giveUp('răspunsurile bune sunt acum puse în pagină. Uită-te la fiecare, apoi scrie în caiet ce ai de recitit.')})}
    };
    api.checkButton(verifica,'Verifică');
    /* pentru poartă: pune răspunsurile corecte / tipice greșite */
    const corecte=()=>{const v={};Q.ex.forEach(E=>E.parti.forEach((P,j)=>{const k=id(E.nr,j);
      v[k]=P.k==='af'?(P.r?'A':'F'):P.k==='text'?P.r[0]:P.k==='nr'?String(P.r[0]):P.k==='alege'?String(P.ok):P.k==='bife'?P.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0):P.k==='linii'?P.r.slice():null}));return v};
    const pune=v=>{Object.entries(v).forEach(([k,val])=>{st.v[k]=Array.isArray(val)?val.slice():val;
      const inp=body.querySelector(`.ei-in[data-p="${k}"]`);if(inp){inp.value=val;return}
      if(body.querySelector(`.ei-prog[data-p="${k}"]`)){desen(k);return}
      body.querySelectorAll(`.ei-b[data-p="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',(Array.isArray(val)?val.includes(+b.dataset.v):b.dataset.v===String(val))?'true':'false'))})};
    body._ei={corecte,pune};
  },
  rezolva(Q,body){body._ei.pune(body._ei.corecte());return true},
  gresit(Q,body){body._ei.pune(Object.assign(body._ei.corecte(),Q.gresite));return true}
};

${IMG_CENTURI}`},
  /* ---------- pasul 1 ---------- */
  {t:'Ce faci anul acesta',
   text:`<p>Materia are patru <mark>unități</mark>: părți mari, fiecare cu o lucrare la final.</p>
<ol class="unitati"><li><b>Tehnoredactare: editorul de texte</b>: documente cu text, imagini și tabele <span class="fol">(referate, afișe)</span>.</li>
<li><b>Audio</b> înseamnă sunet, iar <b>audio-video</b>, sunet cu imagini care se mișcă. În <b>Aplicații audio și audio-video</b> faci înregistrări și filmulețe.</li>
<li><b>Aplicații colaborative</b>: lucrați mai mulți la același document, fiecare de pe calculatorul lui.</li>
<li><b>De la algoritm la program</b>: scrii un program care face singur calculele lungi.</li></ol>`,

  /* ---------- pasul 2 ---------- */
  {t:'Cele trei niveluri',
   text:`<p>La o lucrare nu contează cât ai scris, ci <strong>ce știi să faci</strong>, pe trei <mark>niveluri</mark>:</p>
<ul class="niv-lista"><li>${NIV.b} rezolvi cu un <strong>model</strong> sau cu <strong>pașii dați</strong>, lucruri pe care le-ai mai făcut;</li>
<li>${NIV.c} rezolvi <strong>singur</strong> lucruri de felul celor exersate;</li>
<li>${NIV.a} rezolvi <strong>singur</strong> o situație <strong>nouă</strong> și <strong>explici</strong> de ce.</li></ul>
<p>Diferența dintre Consolidat și Avansat e aproape mereu <strong>situația nouă</strong>, nu cantitatea de muncă. Nivelurile vin de la minister.</p>`,
   exemplu:`<p><b>Metoda:</b> am model sau pași scriși? De bază. N-am model, dar am mai făcut așa ceva? Consolidat. E ceva nou și trebuie să explic? Avansat.</p>`,
   altfel:`<p>Gândește-te la bicicletă. De bază: mergi cu cineva care te ține de șa. Consolidat: mergi singur, pe drumul pe care îl știi. Avansat: mergi singur pe un drum nou și îi explici fratelui mai mic de ce frânezi înainte de curbă.</p>`,
   incearca:{t:'classify',q:'La ce nivel e fiecare sarcină?',cats:['De bază','Consolidat','Avansat'],
    items:[['Faci un tabel ca tabelul rezolvat alături',0],['Faci suma până la 20, după ce ați făcut-o până la 10',1],['Vezi prima dată un link ciudat și explici ce faci',2],['Salvezi o prezentare fără ajutor, ca de zeci de ori',1]],
    ajutor:'Trei întrebări, în ordine: am model sau pași? am mai făcut așa ceva? e ceva nou, pe care trebuie să-l explic?',
    why:'Tabelul rezolvat alături e un model: De bază. Suma până la 20 (ați făcut-o până la 10) și salvarea făcută de zeci de ori sunt de felul celor exersate, fără ajutor: Consolidat. Linkul văzut prima dată e o situație nouă, iar tu explici de ce: Avansat.'},

    {t:'tf',q:'Diferența dintre Consolidat și Avansat e că la Avansat scrii mai mult.',ok:false,

  /* ---------- pasul 3 ---------- */
  {t:'Cum arată o lucrare',
   text:`<p>O <mark>lucrare</mark> (evaluarea de la finalul unei unități) are trei părți:</p>
<ul class="niv-lista"><li><b>Partea A</b>, 40 de puncte: cu model (De bază);</li>
<li><b>Partea B</b>, 30 de puncte: singur, situație cunoscută (Consolidat);</li>
<li><b>Partea C</b>, 20 de puncte: situație nouă și explicație (Avansat).</li></ul>
<p>Plus <strong>10 puncte din oficiu</strong>: în total, 100.</p>
<p><b>Atenție la litere.</b> „Partea A” e partea de bază, nu „A de la Avansat”. Lângă cerințe mai vezi o literă mică, cu alt rost: nivelul cerinței (B = De bază, C = Consolidat, A = Avansat).</p>`,

    capcane:{'62':'Ai adunat doar părțile A, B și C. Mai adaugă punctele din oficiu.'},
    ajutor:'Aduni cele trei părți, apoi încă 10 puncte din oficiu.',why:'30 + 22 + 10 = 62, iar cu cele 10 puncte din oficiu fac 72.'},

    {t:'numar',q:'Ioana a luat 35 de puncte la A, 25 la B și 18 la C. Câte puncte are în total, cu oficiul?',eticheta:'Totalul',unitate:'puncte',ok:88,tipic:78,

  /* ---------- pasul 4 ---------- */
  {t:'Din puncte, nivelul',
   text:`<p>Nivelul îl afli în ordine, de jos în sus:</p>
<ol><li>Cel puțin <b>27</b> din 40 la A? Ai atins <b>De bază</b>.</li>
<li><b>Și</b> cel puțin <b>20</b> din 30 la B? <b>Consolidat</b>.</li>
<li><b>Și</b> cel puțin <b>14</b> din 20 la C? <b>Avansat</b>.</li></ol>
<p>Sub 27 la A ești <mark>În formare</mark> (cu cel puțin 14 la A) sau <mark>În dificultate</mark> (sub 14) și primești un <mark>plan de recuperare</mark>: pașii prin care recuperezi. Pragurile sunt regula profesorului tău.</p>`,
   exemplu:`<p>Un elev are 31 la A, 21 la B și 6 la C: A ✔, B ✔, C ✘ (6 e sub 14). Te oprești la primul ✘: <b>Consolidat</b>.</p>`,

  {t:'Din nivel, nota',
   text:`<p>Nivelul îți dă două note: <b>Avansat</b> 9 sau 10, <b>Consolidat</b> 7 sau 8, <b>De bază</b> 5 sau 6, <b>În formare</b> 3 sau 4. Pe care o primești alege <strong>totalul</strong>, cu oficiul: nota mai mare cere cel puțin 90, 80, 60, respectiv 40 de puncte. <b>În dificultate</b>: 2 dacă ai lucrat, 1 dacă n-ai predat sau ai copiat.</p>
<p>Pe foaie poate scrie alt calcul; regula clasei e aceasta.</p>

    {t:'classify',q:'Ce se trece în catalog ca notă și ce nu?',cats:['Se notează','Nu se notează'],

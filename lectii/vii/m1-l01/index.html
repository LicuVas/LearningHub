<style>
/* TEMA: foaia de lucrare și scara celor trei niveluri (De bază → Consolidat → Avansat) */
:root{
  --desk:#EEF1EC; --paper:#FFFFFF; --paper2:#F3F6F1; --line:#C8D2C6;
  --ink:#1B2620; --ink2:#4C5B52; --accent:#2F5D50; --accentInk:#FFFFFF; --sel:#DCEBE4;
  --mark:#FFE08A; --markInk:#1B2620; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Young Serif",Georgia,"Times New Roman",serif; --fb:"Mulish","Segoe UI",system-ui,sans-serif; --fm:"Overpass Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101713; --paper:#18221C; --paper2:#1F2B24; --line:#34463B; --ink:#E5EEE8; --ink2:#A5B8AC;
  --accent:#8FD1B8; --accentInk:#101713; --sel:#24453A; --mark:#F2C94C; --markInk:#1B2620;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#101713; --paper:#18221C; --paper2:#1F2B24; --line:#34463B; --ink:#E5EEE8; --ink2:#A5B8AC;
  --accent:#8FD1B8; --accentInk:#101713; --sel:#24453A; --mark:#F2C94C; --markInk:#1B2620;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda: trei trepte care urcă */
.banda{min-height:34px;padding:4px 10px;display:flex;align-items:flex-end;gap:4px;background:var(--paper)}
.banda .tr{font-family:var(--fm);font-size:.68rem;font-weight:600;letter-spacing:.02em;color:var(--accent);border:1.5px solid var(--accent);border-bottom:0;border-radius:5px 5px 0 0;padding:1px 7px;white-space:nowrap;background:var(--paper2)}
.banda .tr.t1{height:14px;line-height:12px}.banda .tr.t2{height:20px;line-height:18px}.banda .tr.t3{height:26px;line-height:24px;background:var(--accent);color:var(--accentInk)}
h1{font-weight:400;letter-spacing:0}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:400}
/* eticheta nivelului */
.niv{display:inline-block;font-family:var(--fm);font-size:.74rem;font-weight:600;letter-spacing:.02em;padding:1px 9px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);margin:0 6px 2px 0;vertical-align:.08em;white-space:nowrap}
.niv.c{border-style:double;border-width:3px}
.niv.a{background:var(--accent);color:var(--accentInk)}
.niv-lista{list-style:none;padding:0;margin:.5em 0 .7em;display:grid;gap:6px}
.niv-lista li{border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:6px 10px;line-height:1.4}
.unitati{margin:.4em 0 .6em;padding-left:1.3em}
.unitati li{margin:.25em 0}
.unitati .fol{color:var(--ink2)}
.calc{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;display:inline-block}
.credit{font-size:.78rem;color:var(--ink2)}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:800;color:var(--accent);min-height:44px;padding:12px 0;line-height:1.35;box-sizing:border-box}

/* ---- tipul „numar”: un rezultat scris ---- */
.nr-rand{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.nr-rand label{font-weight:700}
.nr-in{font:inherit;font-family:var(--fm);font-size:1.05rem;width:7.5em;min-height:44px;box-sizing:border-box;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.nr-in:focus{outline:3px solid var(--accent);outline-offset:1px}

/* ---- tipul „evalinit”: evaluarea inițială, corectată de elev ---- */
.ei-ex{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;margin:0 0 12px}
.ei-ex h3{font-family:var(--fb);font-size:1rem;font-weight:800;margin:0 0 6px;line-height:1.35}
.ei-parte{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.ei-parte:first-of-type{border-top:0;padding-top:0}
.ei-parte.rau{background:var(--badbg);border-radius:8px;padding:8px;border-top-color:transparent}
.ei-parte.bun{background:var(--okbg);border-radius:8px;padding:8px;border-top-color:transparent}
.ei-parte .ei-t{margin:0 0 6px;line-height:1.4}
.ei-parte .ei-mesaj{display:block;font-size:.88rem;color:var(--bad);margin-top:4px}
.ei-but{display:flex;flex-wrap:wrap;gap:6px}
.ei-b{font:inherit;min-height:44px;padding:8px 12px;border:2px solid var(--line);border-radius:8px;background:var(--paper2);color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.ei-b[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:800}
.ei-b[aria-pressed="true"]::before{content:"✔ ";color:var(--accent)}
.ei-b:disabled{cursor:default;opacity:.85}
.ei-col{display:grid;gap:6px}
.ei-col .ei-b{width:100%}
.ei-in{font:inherit;font-family:var(--fm);min-height:44px;box-sizing:border-box;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:11em;max-width:100%}
.ei-in.scurt{width:6em}
.ei-in:focus,.ei-b:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.ei-alg{display:grid;gap:10px}
@media (min-width:640px){.ei-alg{grid-template-columns:1fr 1fr}}
.ei-alg .et{font-weight:800;font-size:.88rem;color:var(--ink2);margin:0 0 4px}
.ei-cod{font-family:var(--fm);white-space:pre;min-height:44px}
.ei-prog{list-style:none;margin:0;padding:6px;border:2px dashed var(--line);border-radius:8px;min-height:120px;display:grid;gap:6px;align-content:start;background:var(--paper2)}
.ei-prog .gol{color:var(--ink2);font-size:.88rem;padding:6px}
.ei-teste{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.ei-teste ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.ei-teste li{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;line-height:1.35}
.ei-teste li .s{flex:none;width:1.4em;text-align:center;font-weight:800}
.ei-teste li.ok .s{color:var(--ok)}.ei-teste li.rau .s{color:var(--bad)}
.ei-teste li .m{display:block;font-size:.86rem;color:var(--ink2)}
.ei-fisa{margin-top:12px;border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ei-fisa h3{font-family:var(--fd);font-weight:400;font-size:1.05rem;margin:0 0 6px}
.ei-fisa table{border-collapse:collapse;width:100%;font-size:.92rem}
.ei-fisa th,.ei-fisa td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.ei-fisa ul{margin:.4em 0 0;padding-left:1.2em}
.ei-fisa li{margin:.3em 0}
.ei-fisa a{font-weight:700}
.ei-noua{min-height:44px}
/* legăturile din fișă și din teste: culoarea temei (judecata 2, m3: #0000EE pe fond întunecat avea ≈ 1,7:1) */
.ei-fisa a,.ei-teste a,.ei-mesaj a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.ei-mesaj a{color:var(--bad)}
.pescurt{border-left:4px solid var(--accent);background:var(--paper2);padding:6px 10px;margin:.6em 0;line-height:1.45}
.ei-cine{border:2px solid var(--accent);border-radius:10px;background:var(--sel);color:var(--ink);padding:10px 12px;margin:0 0 12px;line-height:1.45}
/* montajele casetei de jos (16.10.2026): înalte; pe ecran lat nu mai late de 560 px, ca să se citească fără să umple pagina */
.captura img[src*="casete-cod"]{max-width:min(100%,560px)}
</style>

<script src="../../_sim/rezultat-elev.js"></script>
<script src="../../../jocuri/_motor/motor.js"></script>

<script>
/* LECȚIA 1, clasa a VII-a, modulul 1 (revizuirea LearningHub, standardul din 27.09.2026): ora de organizare + evaluare inițială.
   Surse (toate ale profesorului): Info_Gimnaziu_2026\instrumente\Fisa_criterii_elev_clasa_VII.md, SISTEM_EVALUARE.md,
   materiale\print\Saptamana1_clasa_VII.html, materiale\continut\teste_initiale.json (VII), data\unitati.json. Detalii: surse.md.
   Pasul 0 „La ce folosește”, 6 pași cu „Încearcă” (regulile de note: caseta „Pe scurt” din pasul 4; din 07.10.2026, pasul 5 =
   munca pe LearningHub în nota din catalog), atelierul = evaluarea inițială a
   profesorului, corectată de elev (tipul `evalinit`, scris aici), pasul „Acum la calculatorul din laborator”, 5 întrebări.
   Reparațiile după judecător (27.09): _verificare/judecator.md și surse.md, „Reparații”.
   Pașii 4-5, exercițiile lor, întrebările 3-4 și pasul 3 din laborator: SISTEM_EVALUARE.md §4.2-4.3 și fișa de criterii
   a clasei a VII-a §4-5 (surse.md, secțiunea din 29.09.2026).
   Alinierea la actele oficiale (01.10.2026; surse.md, secțiunea cu același nume): literele din OMEC 4.615/2026, anexa 2
   (A = Avansat, B = Consolidat, C = De bază), părțile lucrării C 40 / B 30 / A 20, cinci niveluri, regula notă → nivel
   a profesorului, planul individualizat de învățare pentru fiecare elev, Avansat fără explicație în definiția ministerului.
   CODUL (16.10.2026; contractul _campaign\revizuire_completa_2026_09\v1_cu_cod_2026_10_16): de la 30.09, prezenta.js cere
   un cod de 4 cifre la fiecare intrare pe numele unui elev. Pașii 2-3 (pe bară P2, P3) predau intrarea cu cod; caseta
   „Cine dă evaluarea?” din atelier trimite la ei; laboratorul se face cu codul adevărat. Faptele: _proba/proba_cod_vii.py
   și _proba/proba_laborator_cod.py, pe caseta adevărată (prezenta.js sha1 8e852437), serverul FALS local, rețeaua blocată. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* cheile b / c / a sunt INTERNE (stau și în fișele salvate ale elevilor), nu literele nivelurilor; literele oficiale
   (OMEC 4.615/2026, anexa 2: A = Avansat, B = Consolidat, C = De bază) sunt în etichete (01.10.2026) */
const NIV={b:'<span class="niv">C · De bază</span>',c:'<span class="niv c">B · Consolidat</span>',a:'<span class="niv a">A · Avansat</span>'};
const NUME_NIV={b:'C · De bază',c:'B · Consolidat',a:'A · Avansat'};
const IMG_CENTURI=fig('img/centuri.webp',850,754,'Cinci centuri de arte marțiale, strânse și așezate una lângă alta: galbenă, portocalie, verde, albastră și maro',
  'Centurile de la judo: cerințele fiecărei centuri se știu dinainte. <span class="credit">Foto: chris 論, <a href="https://commons.wikimedia.org/wiki/File:Obi-goky%C5%AB.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 3.0</a>; convertită în WebP.</span>');

/* ---------- PAȘII CU CODUL (16.10.2026) ----------
   Pozele: capturi ale casetei ADEVĂRATE de azi (prezenta.js sha1 8e852437), cu unealta comună
   lectii/v/m1-l01/_proba/captura_casete_cod.py --clasa VII --scoala tupilati --clasa-exacta VII, nume inventate
   (Vlaicu Sorina cu codul 3946, Toma Radu, Dobre Matei fără cod). casete-cod.webp = montajul uneltei;
   casete-cod-altfel.webp = două capturi ale ei, montate de _proba/monta_altfel.py (două persoane). Rândurile: img/SURSE.json. */
const FIG_COD_INTRA=fig('img/casete-cod.webp',834,2431,
  'Patru capturi ale casetei de jos, numerotate. 1: formularul Cine ești? completat: Scoala Gimnaziala Tupilati, clasa VII, Vlaicu Sorina, codul 3946 (cifrele se văd), butonul Gata. 2: lista Cine lucrează acum? cu Toma Radu, Vlaicu Sorina și Dobre Matei. 3: Salut, Vlaicu Sorina! cu câmpul Codul tău (4 cifre) și butoanele Intră, Înapoi la listă, Mi-am uitat codul. 4: meniul etichetei, cu butonul roșu Ieși (deconectare) și, mai jos, Nu ești tu? Schimbă elevul',
  'Caseta adevărată: 1 prima dată, 2 lista, 3 codul, 4 meniul etichetei.');
const FIG_COD_ALTFEL=fig('img/casete-cod-altfel.webp',643,1253,
  'Două capturi ale casetei de jos, numerotate. 1: Mi-am uitat codul, Vlaicu Sorina (VII): Codul nou (4 cifre), Scrie-l încă o dată, butonul Trimite cererea. 2: meniul etichetei la Dobre Matei, care n-a avut cod: Progresul tău stă doar pe calculatorul ăsta, cu butonul Păstrează-l online',
  '1 „Mi-am uitat codul”; 2 Matei, fără cod: „Păstrează-l online”.');
/* Scenariile casetei de exersare comune (lectii/_sim/intrare-cod.js, API: lectii/_sim/intrare-cod.GATA.md, proprietar:
   autorul V/1). Caseta imită caseta adevărată, dar NU atinge înscrierea adevărată (R4). Elevii sunt INVENTAȚI; școala
   și clasa sunt cele ale clasei a VII-a de la Tupilați (lista școlilor: 'tupilati', 'VII').
   gresit() al casetei (poarta test_joc): fără colegi = a doua înscriere, cu altă clasă; cu colegi = pe numele colegului. */
const ELEV_COD={nume:'Lazăr Bianca',clasa:'VII',scoala:'tupilati'};
const SCENARII_COD={
  /* pasul „Pe numele tău…”, „Încearcă”: (a) prima înscriere, (c) ieșirea, (b) intrarea din listă, cu același cod.
     Greșeala tipică respinsă: a doua înscriere, cu altă clasă (gresit()). */
  inscriere:{t:'intrare-cod',start:'nou',elev:ELEV_COD,tinta:['intrat','iesit','intrat'],
    q:'În chenarul de exersare de mai jos (nu în caseta din colțul ecranului): ești Lazăr Bianca, din clasa a VII-a, la Școala Gimnazială Tupilați. Înscrie-te cu un cod ales de tine. Apoi ieși și intră din nou din listă, cu același cod.',
    ajutor:'Prima dată: „Spune cine ești”, școala, clasa, numele, codul, „Gata”. Ieși: eticheta din exersare, apoi „Ieși (deconectare)”. Din nou: „Intră”, numele tău din listă, codul, „Intră”.',
    why:'Pe numele tău se intră doar cu codul tău. „Ieși (deconectare)” lasă calculatorul liber; data viitoare caseta îți cere codul.'},
  /* pasul „Pe numele tău…”, „Încă un exercițiu”: (b) calculatorul are deja lista; codul din caiet */
  lista:{t:'intrare-cod',start:'lista',elev:ELEV_COD,cod:'6402',colegi:[{nume:'Toma Radu'},{nume:'Pavel Irina'}],tinta:'intrat',
    q:'În chenarul de exersare e lista „Cine lucrează acum?”. În caiet, Bianca are codul 6402: e doar codul exercițiului (pe al tău îl alegi tu, altul). Intră pe numele ei.',
    ajutor:'Apasă pe numele Biancăi, scrie codul din caiet la „Codul tău (4 cifre)” și apasă „Intră”.',
    why:'Din listă intri apăsând pe numele tău și scriind codul tău. Pe numele unui coleg nu intri: nu-i știi codul.'},
  /* pasul „Pe numele tău…”, „Încă un exercițiu”: eticheta are numele colegului → „Nu ești tu? Schimbă elevul” → lista → codul */
  coleg:{t:'intrare-cod',start:'eticheta',elev:ELEV_COD,cod:'6402',pe:'Toma Radu',colegi:[{nume:'Toma Radu'}],tinta:'intrat',
    q:'Bianca se așază la calculator. În chenarul de exersare, eticheta are numele lui Radu. Bianca are codul 6402. Fă ca munca să se scrie pe numele ei.',
    ajutor:'Apasă pe etichetă, apoi „Nu ești tu? Schimbă elevul”. Din listă, numele Biancăi și codul ei.',
    why:'Cât eticheta are numele lui Radu, munca se scrie pe numele lui. Schimbi elevul și intri pe numele tău, cu codul tău.'},
  /* pasul „Acasă, pe telefon…”, „Încearcă”: (e) „Mi-am uitat codul” → cod nou de două ori → „Trimite cererea” →
     „Cererea a ajuns la profesor.”, apoi ce face profesorul (deblocat:true: exersarea face „Deblochează”) → intră cu codul NOU.
     Greșeala tipică respinsă: o înscriere nouă (a doua înscriere, gresit()). */
  uitat:{t:'intrare-cod',start:'uitat',elev:ELEV_COD,cod:'6402',deblocat:true,tinta:['cerere','intrat'],
    q:'Bianca și-a uitat codul, iar chenarul de exersare îi cere „Codul tău (4 cifre)”. Cere un cod nou. În exersare, profesorul o deblochează imediat; pe site, abia după ce vorbește cu el. Apoi intră cu codul nou.',
    ajutor:'„Mi-am uitat codul”, un cod nou scris de două ori la fel, „Trimite cererea”. Apoi „Am înțeles”, numele ei din listă, codul nou și „Intră”.',
    why:'Cererea ajunge la profesor. Îi spui că e a ta (acum, dacă e în sală, sau la ora următoare); după ce te deblochează, intri cu codul nou și îți găsești progresul. Ai deja două coduri? Tot așa: la deblocare, ce ai lucrat online pe numele tău, la clasa ta, trece sub codul nou. O înscriere nouă, cu alt cod, ar fi o a doua Biancă, fără progres.'},
  /* pasul „Acasă, pe telefon…”, „Încă un exercițiu”: (f) a lucrat fără cod → meniul → „Păstrează-l online” → cod → „Păstrează” */
  faraCod:{t:'intrare-cod',start:'fara-cod',elev:ELEV_COD,tinta:'online',
    q:'Bianca a lucrat până acum fără cod. E conectată pe calculatorul ăsta. Fă, în chenarul de exersare, ca progresul ei să meargă și acasă.',
    ajutor:'Apasă eticheta din exersare, apoi „Păstrează-l online”, scrie un cod de 4 cifre și apasă „Păstrează”.',
    why:'Fără cod, progresul stă doar pe calculatorul ăsta. Cu un cod, urcă online; acasă intri cu același nume, aceeași clasă și același cod.'},
  /* pasul „Acasă, pe telefon…”, „Încă un exercițiu”: (d) acasă / pe telefon: formularul cu același nume, aceeași clasă, același cod */
  telefon:{t:'intrare-cod',start:'acasa',elev:ELEV_COD,cod:'6402',tinta:'intrat',
    q:'Acasă, pe telefon, Bianca vrea să continue ce a lucrat la școală. În caiet: Școala Gimnazială Tupilați, clasa a VII-a, Lazăr Bianca, codul 6402. Înscrie-o, în chenarul de exersare.',
    ajutor:'Același nume, aceeași clasă, același cod ca la școală. Altfel e o a doua înscriere, fără progresul ei.',
    why:'Cu același nume, aceeași clasă și același cod, progresul de la școală vine și pe telefon. Pe site, semnul e pe cuprinsul lecției: stelele ei sau „Continuă de unde ai rămas”. Nu apare nimic? Codul greșit: „Mi-am uitat codul”, cu codul din caiet, și îi spui profesorului. Clasa greșită o repari singur: exercițiul următor.'},
  /* pasul „Acasă, pe telefon…”, „Încă un exercițiu” (reparare 16.10, registrul C21; API: start 'eticheta' + scris.clasa, ținta
     'corectat'): acasă, înscrisă din greșeală la altă clasă → „Mi-am scris greșit numele, clasa sau școala” → codul → clasa
     bună → „Salvează”. Pe caseta adevărată: „Progresul tău a venit cu tine.” + „Continuă de unde ai rămas: P3”
     (_proba/proba_reparare.py, c21_clasa, 1280 + 390). */
  clasaGresita:{t:'intrare-cod',start:'eticheta',elev:ELEV_COD,cod:'6402',scris:{clasa:'VIII'},
    q:'Acasă, pe telefon, Bianca s-a înscris din greșeală la clasa VIII și nu i-a apărut „Continuă de unde ai rămas”. Codul ei e 6402. Repar-o în chenarul de exersare, ca să-i vină munca de la școală.',
    ajutor:'Apasă eticheta din exersare, apoi „Mi-am scris greșit numele, clasa sau școala”. Scrie codul, apasă „Mai departe”, alege clasa VII și apasă „Salvează”.',

/* ---------- fișa de pornire: ține-o componenta comună lectii/_sim/rezultat-elev.js (dirijorul, 28.09) ----------
   Fără logică proprie de identitate: RezultatElev.salveaza() la prima apăsare pe „Verifică” a fiecărei evaluări,
   RezultatElev.citeste() la desen, evenimentul `rezultat-elev` pentru redesenare. Componenta pune numele doar când caseta
   din prezenta.js spune „activ”, păstrează PRIMA încercare (refacerea e „reîncercare”), ține rezultatul fără nume doar
   în fila asta, 50 de minute, și întreabă singură „Verificarea de la ora hh:mm e a ta?” când elevul se înscrie. */
const CHEI_FISA={vi:'vii-m1-l01-initiala',v:'vii-m1-l01-proba-v'};
const TITLU_FISA={vi:'Evaluarea inițială (materia clasei a VI-a)',v:'Proba din clasa a V-a'};
const escF=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RE_OK=()=>!!(window.RezultatElev&&window.RezultatElev.citeste);
function fisaHtml(){
  if(!RE_OK())return '<p><b>Fișa de pornire nu se poate afișa</b> (lipsește componenta care o ține minte). Scrie în caiet ce ai trecut și ce nu.</p>';
  const R=Object.fromEntries(Object.entries(CHEI_FISA).map(([p,k])=>[p,window.RezultatElev.citeste(k)])),probe=['vi','v'].filter(p=>R[p]&&R[p].rezultat&&R[p].rezultat.ex);
  const buton='<button class="btn ei-noua" type="button" data-fisa-noua>Începe o fișă nouă (sunt alt elev)</button>';
  /* v3: citeste(K) e null și când fișa lui X e pe calculator, dar așteaptă „Ești X?” — atunci NU scriem „e goală”
     (l-ar trimite pe elev să refacă evaluarea, cu răspunsurile deja văzute) */
  const asteapta=Object.entries(CHEI_FISA).filter(([p])=>!probe.includes(p)).map(([p,k])=>{try{return window.RezultatElev.asteaptaConfirmare?window.RezultatElev.asteaptaConfirmare(k):null}catch(e){return null}}).filter(Boolean);
  const mesajAsteapta=asteapta.length?`<p class="ei-asteapta"><b>Pe calculator e fișa lui ${escF(asteapta[0].elev)}, de la ora ${escF(asteapta[0].ora)}.</b> Dacă ești ${escF(asteapta[0].elev)}, apasă sus „Da” ca s-o vezi.</p>`:'';
  if(!probe.length)return mesajAsteapta||'<p><b>Fișa de pornire e goală.</b> Mergi la Atelier (fila „Atelier” din bara de pași), rezolvă evaluarea și apasă „Verifică”.</p>';
  const P0=R[probe[0]];
  const cine=P0.elev?`<p>Fișa elevului înscris: <b>${escF(P0.elev)}</b>.</p>`
    :P0.deConfirmat?'<p>Fișa așteaptă răspunsul tău la întrebarea de sus: e scrisă pe numele din caseta de jos abia după ce spui că ești tu.</p>'
    :'<p>Fișa nu are nume: nu erai înscris în caseta de jos când ai dat evaluarea. Se păstrează doar în fila asta, cel mult 50 de minute. După ce te înscrii, pagina te întreabă sus dacă verificarea e a ta: apasă „Da” doar dacă ai făcut-o tu.</p>';
  return cine+mesajAsteapta+probe.map(pid=>{const V=R[pid],ex=V.rezultat.ex;
    const rand=ex.map(e=>`<tr><td>${e.nr}</td><td>${NUME_NIV[e.niv]}</td><td>${e.ok?'✔ din prima':'✗ nu din prima'}</td></tr>`).join('');
    const rec=ex.filter(e=>!e.ok).flatMap(e=>e.recit.map(k=>({nr:e.nr,r:RE[k]})));
    const lista=rec.length?`<p><b>De recitit</b> (fiecare legătură deschide, într-o filă nouă, pașii unui nivel, doar de citit):</p><ul>${rec.map(x=>`<li>Exercițiul ${x.nr}: ${x.r.href?`${unde(x.r)}. <i>Pe scurt:</i>`:'<i>nu e în jocurile de pe sit; reține:</i>'} ${x.r.amintire}</li>`).join('')}</ul>`:'<p><b>De recitit</b>, din ce a verificat proba: nimic.</p>';
    const nev=`<p><b>Proba nu a verificat:</b> ${(NEVERIF[pid]||[]).map(n=>`${n.ce}: ${unde(n)}`).join('; ')}.</p>`;
    const re=V.reincercare?`<p>Ai refăcut evaluarea (${oriText(V.reincercari)}, ultima la ora ${V.oraReincercare}). Fișa păstrează <b>prima încercare</b>: după ce ai văzut răspunsurile, refacerea nu mai arată de unde pleci.</p>`:'';
    return `<h3>${TITLU_FISA[pid]}</h3><p>Prima încercare: ora ${V.ora}.</p><table><thead><tr><th>Exercițiul</th><th>Nivelul</th><th>La prima apăsare pe „Verifică”</th></tr></thead><tbody>${rand}</tbody></table>${re}${lista}${nev}`}).join('')
    +`<p>Nu e fișa ta? ${buton}</p>`;
}
function umpleFisa(){document.querySelectorAll('[data-fisa]').forEach(el=>{el.classList.add('ei-fisa');el.innerHTML=fisaHtml()});

/* ---------- „Cine dă evaluarea?” la ÎNCEPUTUL atelierului (judecata 2, GRAV: identitatea se cerea abia în laborator,
   DUPĂ evaluare). Starea o dă RezultatElev.cine() (prezenta.js: 'activ' | 'intreaba' | …; componenta adaugă
   'alta-fila' și 'fara-prezenta'). Etichetele sunt cele din assets/js/prezenta.js. */
const scurtNume=n=>{const w=String(n||'').trim().split(/\s+/);return w.length>1?w[w.length-1]+' '+w[0].charAt(0)+'.':(w[0]||'')};   // ca scurt() din prezenta.js
const ASCUNSA=' Dacă nu vezi caseta, derulează până la capătul paginii.';
/* 16.10.2026, reparare (registrul comun C1, C5): după intrare pagina pornește din nou pe cuprins. Elevul neconectat primește
   „Continuă de unde ai rămas” (munca lui neconectat trece pe numele lui); cel care schimbă de pe numele unui coleg NU (munca
   rămâne în sertarul colegului) și se întoarce cu butonul lecției + „Pasul următor →” + „La atelier →”, fără să rezolve
   din nou (probat: _proba/proba_reparare.py, c1_mijloc, c1_drum_rapid, 1280 + 390). Bara pașilor e a elevului care tocmai a
   intrat, deci nu-l trimitem la fila „Atelier” din bară (C5). */
const REVINO=' Pagina pornește din nou: apasă „Continuă de unde ai rămas”; nu apare? Apasă Lecția 1, apoi „Pasul următor →” și „La atelier →”, până aici.';
const oriText=n=>n===1?'o dată':n<20?`de ${n} ori`:`de ${n} de ori`;
const cuPunct=t=>/[.!?]$/.test(t)?t:t+'.';
function cineHtml(){
  const c=RE_OK()?window.RezultatElev.cine():{stare:'fara-prezenta',elev:null};
  /* 16.10.2026: fiecare variantă trimite la pasul cu codul („Pe numele tău, cu codul tău”), nu mai predă intrarea aici */
  if(c.stare==='activ'&&c.elev)return `<b>Cine dă evaluarea?</b> Caseta de jos a ecranului scrie că lucrează <b>${escF(cuPunct(scurtNume(c.elev)))}</b> Nu ești tu? Apasă pe ea, apoi „Nu ești tu? Schimbă elevul”, și intră pe numele tău, cu codul tău.${REVINO}${ASCUNSA}`;
  if(c.stare==='intreaba')return '<b>Cine dă evaluarea?</b> Caseta de jos a ecranului te întreabă „Ești tot …?”. Răspunde întâi: „Da, sunt eu” sau „Nu, sunt alt elev” (apoi intri pe numele tău, cu codul tău).'+REVINO;
  if(c.stare==='vizitator')return '<b>Cine dă evaluarea?</b> Ai ales „Nu, doar vizitez”. Dacă ești elev, apasă caseta de jos a ecranului („Sunt elev — mă înscriu”) și intră pe numele tău, cu codul tău.'+REVINO+ASCUNSA;
  if(c.stare==='alta-fila')return '<b>Cine dă evaluarea?</b> Elevul s-a schimbat în altă filă. Reîncarcă pagina, ca să vezi în caseta de jos cine lucrează acum.';
  return '<b>Cine dă evaluarea?</b> Nu ești conectat. Intră pe numele tău, cu codul tău, ca la pasul <i>Pe numele tău, cu codul tău</i>: apasă caseta de jos a ecranului („Spune cine ești”, „Cine lucrează acum?” sau „Nu e nimeni conectat”).'+REVINO+ASCUNSA;
}
function umpleCine(){document.querySelectorAll('[data-cine]').forEach(el=>{el.innerHTML=cineHtml()})}
new MutationObserver(()=>{
  if(document.querySelector('[data-fisa]:not([data-umplut])')){document.querySelectorAll('[data-fisa]').forEach(el=>el.setAttribute('data-umplut','1'));umpleFisa()}
  if(document.querySelector('[data-cine]:not([data-umplut])')){document.querySelectorAll('[data-cine]').forEach(el=>el.setAttribute('data-umplut','1'));umpleCine()}

/* „Începe o fișă nouă (sunt alt elev)” = RezultatElev.golesteAlElevuluiDeAcum(): golește rezultatul fără nume din fila

/* ---------- tipul „numar”: elevul scrie un rezultat pe care îl obține aplicând regula ---------- */
/* un număr scris de copil: „72”, „8,5”, „1 024”, dar și „6 diapozitive”, „1024 MB”, „72 de puncte” (judecătorul, M4-M5:
   răspunsuri bune respinse); orice altceva („cinci”, „5 sau 6”) = null, iar pagina cere „doar numărul, cu cifre” */
const citesteNr=s=>{s=String(s||'').trim().toLowerCase().replace(/(\d)[\s ]+(?=\d)/g,'$1').replace(',','.');
  const m=s.match(/^(-?\d+(?:\.\d+)?)(?:\s*[a-zăâîșşțţ]+(?:\s+[a-zăâîșşțţ]+)*)?\s*\.?$/);return m?parseFloat(m[1]):null};
const fmtNr=v=>String(v).replace('.',',');
const TipNumar={
  render(Q,body,api){
    body.innerHTML=`<div class="nr-rand"><label>${api.esc(Q.eticheta||'Răspunsul tău')}: <input class="nr-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></label>${Q.unitate?`<span>${api.esc(Q.unitate)}</span>`:''}</div>`;
    const inp=body.querySelector('.nr-in');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=document.getElementById('chk');if(b)b.click()}});
    const nav=api.checkButton(()=>{
      /* un cuvânt ÎNAINTEA numărului („nota 9”, „total 72”) e primit ca numărul; la „Nota”, exemplul e o notă, nu un punctaj
         (judecata pe regula de notare, m2; 10 nu e răspunsul și nici capcana vreunui exercițiu cu nota) */
      const v=citesteNr(inp.value.replace(/^\s*[a-zăâîșşțţ]+:?\s+(?=-?\d)/i,''));
      if(v===null){api.feedback('bad',Q.eticheta==='Nota'?'<strong>Scrie nota</strong> doar cu cifre (de exemplu 10).':'<strong>Scrie un număr</strong>, doar cu cifre (de exemplu 72).');inp.focus({preventScroll:true});return}
      if(Math.abs(v-Q.ok)<1e-9){inp.disabled=true;nav.innerHTML='';api.resolve(true);return}
      const cap=(Q.capcane||{})[String(v)];
      api.resolve(false,cap||`${fmtNr(v)} nu e rezultatul. Refă socoteala pe pașii din pas.`);
      inp.focus({preventScroll:true});inp.select();
      api.revealButton(()=>{inp.value=fmtNr(Q.ok);inp.disabled=true;nav.innerHTML='';api.giveUp(`<b>${fmtNr(Q.ok)}</b>`)});
    });
  },
  rezolva(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.ok);return true},
  gresit(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.tipic);return true}
};

/* ---------- tipul „evalinit”: evaluarea inițială, pe care elevul și-o corectează singur ----------
   Q.ex:[{nr, niv:'b'|'c'|'a', titlu, test, parti:[…]}]; o parte:
     {k:'af', t, r:true|false, re}                    adevărat / fals
     {k:'text', pre, post, r:['variante acceptate'], re}   completare (fără diacritice, litere mici/mari la fel)
     {k:'nr', t, r:[min,max], re, eticheta?}           un număr
     {k:'alege', t, o:[…], ok, re}                     o singură variantă
     {k:'bife', t, o:[[text, bun],…], re}              tot ce se potrivește (nimic în plus)
     {k:'linii', t, o:[rânduri], r:[indici în ordine], re}   construiești un algoritm din rânduri
   re = cheia din RE (unde se recitește). Q.gresite = răspunsuri tipice greșite, pentru poartă. */
const fara=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[şș]/g,'s').replace(/[ţț]/g,'t').replace(/[„”"'.,;:!?]/g,' ').replace(/\s+/g,' ').trim();
const TipEval={
  render(Q,body,api){
    const st={v:{},prima:null};
    const id=(e,p)=>`${e}_${p}`;
    const parteHtml=(E,P,j)=>{const k=id(E.nr,j);
      if(P.k==='af')return `<p class="ei-t">${P.t}</p><div class="ei-but" role="group" aria-label="Adevărat sau fals">${[['A','Adevărat'],['F','Fals']].map(([v,n])=>`<button class="ei-b" type="button" data-p="${k}" data-v="${v}" aria-pressed="false">${n}</button>`).join('')}</div>`;
      if(P.k==='text')return `<p class="ei-t"><label>${P.pre} <input class="ei-in" type="text" data-p="${k}" autocomplete="off" spellcheck="false" aria-label="${api.esc(P.pre.replace(/<[^>]+>/g,''))}"> ${P.post||''}</label></p>`;
      if(P.k==='nr')return `<p class="ei-t"><label>${P.t} <input class="ei-in scurt" type="text" inputmode="numeric" data-p="${k}" autocomplete="off" spellcheck="false"> ${P.post||''}</label></p>`;
      if(P.k==='alege'||P.k==='bife')return `<p class="ei-t">${P.t}</p><div class="ei-col" role="group">${P.o.map((o,i)=>`<button class="ei-b" type="button" data-p="${k}" data-v="${i}" aria-pressed="false">${api.esc(P.k==='bife'?o[0]:o)}</button>`).join('')}</div>`;
      if(P.k==='linii')return `<p class="ei-t">${P.t}</p><div class="ei-alg"><div><p class="et">Liniile (atinge una ca s-o adaugi)</p><div class="ei-col ei-pool" data-p="${k}">${P.o.map((o,i)=>`<button class="ei-b ei-cod" type="button" data-l="${i}">${api.esc(o)}</button>`).join('')}</div></div><div><p class="et">Algoritmul tău (atinge o linie ca s-o scoți)</p><ol class="ei-prog" data-p="${k}"><li class="gol">Încă nicio linie.</li></ol></div></div>`;
      return '';};
    body.innerHTML=`<div class="ei-cine" data-cine role="note"></div>${Q.ex.map(E=>`<section class="ei-ex" data-e="${E.nr}"><h3>${NIV[E.niv]} ${E.nr}. ${E.titlu}</h3>${E.parti.map((P,j)=>`<div class="ei-parte" data-pp="${id(E.nr,j)}">${parteHtml(E,P,j)}<span class="ei-mesaj"></span></div>`).join('')}</section>`).join('')}
      <div class="ei-teste"><b>Testele</b> <span class="hint">· se bifează când apeși „Verifică”</span><ol>${Q.ex.map(E=>`<li data-e="${E.nr}"><span class="s">○</span><span>${api.esc(E.test)}<span class="m"></span></span></li>`).join('')}</ol></div>
      <div data-rezultat-elev-intrebare></div>
      <div class="ei-fisa" data-fisa-local hidden></div>`;   /* locul întrebării „Ești X?” a componentei: sub teste, unde era butonul „Verifică” când l-ai apăsat (judecata 4); fișa se deschide dedesubt */
    /* alegerile */
    body.querySelectorAll('.ei-b[data-p]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;
      const k=b.dataset.p,[en,pj]=k.split('_').map(Number),P=Q.ex.find(e=>e.nr===en).parti[pj];
      if(P.k==='bife'){const s=new Set(st.v[k]||[]),v=+b.dataset.v;s.has(v)?s.delete(v):s.add(v);st.v[k]=[...s];b.setAttribute('aria-pressed',s.has(v)?'true':'false')}
      else{st.v[k]=b.dataset.v;body.querySelectorAll(`.ei-b[data-p="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))}}));
    body.querySelectorAll('.ei-in').forEach(i=>i.addEventListener('input',()=>{st.v[i.dataset.p]=i.value}));
    /* algoritmul din rânduri */
    const desen=k=>{const [en,pj]=k.split('_').map(Number),P=Q.ex.find(e=>e.nr===en).parti[pj],ales=st.v[k]||[];
      const ol=body.querySelector(`.ei-prog[data-p="${k}"]`);
      ol.innerHTML=ales.length?ales.map((l,poz)=>`<li><button class="ei-b ei-cod" type="button" data-scoate="${poz}">${api.esc(P.o[l])}</button></li>`).join(''):'<li class="gol">Încă nicio linie.</li>';
      body.querySelectorAll(`.ei-pool[data-p="${k}"] .ei-b`).forEach(b=>{b.disabled=ales.includes(+b.dataset.l)||st.gata});
      ol.querySelectorAll('[data-scoate]').forEach(b=>{b.disabled=!!st.gata;b.onclick=()=>{if(st.gata)return;ales.splice(+b.dataset.scoate,1);st.v[k]=ales;desen(k)}})};
    body.querySelectorAll('.ei-pool').forEach(pool=>{const k=pool.dataset.p;st.v[k]=[];
      pool.querySelectorAll('.ei-b').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;st.v[k]=(st.v[k]||[]).concat(+b.dataset.l);desen(k)}))});
    /* verificarea unei părți */
    const bun=(P,v)=>{
      if(P.k==='af')return v===(P.r?'A':'F');
      if(P.k==='text')return v!=null&&P.r.some(r=>fara(v).replace(/^cu /,'')===fara(r));
      if(P.k==='nr'){const n=citesteNr(v);return n!==null&&n>=P.r[0]&&n<=P.r[1]}
      if(P.k==='alege')return v!=null&&+v===P.ok;
      if(P.k==='bife'){const s=new Set(v||[]);return P.o.every((o,i)=>!!o[1]===s.has(i))}
      if(P.k==='linii')return JSON.stringify(v||[])===JSON.stringify(P.r);
      return false};
    const lipsa=(P,v)=>P.k==='bife'?!(v&&v.length):P.k==='linii'?!(v&&v.length):(v==null||String(v).trim()===''||(P.k==='nr'&&citesteNr(v)===null));
    /* „Începe o fișă nouă”: următoarea apăsare pe „Verifică” scrie din nou fișa */
    const nou=e=>{if(!body.isConnected){removeEventListener('rezultat-elev',nou);return}
      if(e.detail&&(e.detail.motiv==='golit'||e.detail.motiv==='alt-elev'))st.prima=null};   // următoarea apăsare pe „Verifică” se salvează din nou (prima sau reîncercare, decide componenta)
    addEventListener('rezultat-elev',nou);
    const MESAJ={af:'Alegerea nu e bună.',text:'Cuvântul nu e cel căutat.',nr:'Numărul nu e bun.',alege:'Varianta nu e cea bună.',bife:'Ai bifat prea puțin sau ceva ce nu faci.',linii:'Algoritmul nu e bun: verifică de unde pornește s, de câte ori repeți și ce aduni.'};
    const blocheaza=()=>{st.gata=true;body.querySelectorAll('.ei-b,.ei-in').forEach(x=>x.disabled=true);body.querySelectorAll('.ei-prog [data-scoate]').forEach(x=>x.disabled=true)};
    const verifica=()=>{
      const gol=[],cifre=[];Q.ex.forEach(E=>E.parti.forEach((P,j)=>{const v=st.v[id(E.nr,j)];if(lipsa(P,v)){gol.push(E.nr);if(P.k==='nr'&&v!=null&&String(v).trim()!=='')cifre.push(E.nr)}}));
      if(gol.length){api.feedback('bad',`<strong>Mai ai de răspuns</strong> la exercițiul ${[...new Set(gol)].join(', ')}. Răspunde la tot, chiar dacă nu ești sigur: evaluarea nu se notează.${cifre.length?` La exercițiul ${[...new Set(cifre)].join(', ')} scrie numărul cu cifre, de exemplu 6.`:''}`);return}
      let trecute=0;const rez=[];
      Q.ex.forEach(E=>{let ok=true;const rec=[];
        E.parti.forEach((P,j)=>{const k=id(E.nr,j),b=bun(P,st.v[k]),div=body.querySelector(`[data-pp="${k}"]`);
          div.classList.toggle('rau',!b);div.classList.toggle('bun',b);
          div.querySelector('.ei-mesaj').innerHTML=b?'':`${MESAJ[P.k]} Recitește: ${unde(RE[P.re])}.`;
          if(!b){ok=false;if(!rec.includes(P.re))rec.push(P.re)}});
        const li=body.querySelector(`.ei-teste li[data-e="${E.nr}"]`);li.className=ok?'ok':'rau';li.querySelector('.s').textContent=ok?'✔':'✗';
        li.querySelector('.m').innerHTML=ok?'':`Recitește: ${rec.map(r=>unde(RE[r])).join('; ')}.`;
        if(ok)trecute++;rez.push({nr:E.nr,niv:E.niv,ok,recit:rec})});
      let asteapta=false;
      if(!st.prima){st.prima=rez;if(RE_OK()){const v=window.RezultatElev.salveaza(CHEI_FISA[Q.proba],{ex:rez});asteapta=!!(v&&v.deConfirmat)}}
      /* întrebarea componentei („Ești X?”) stă sub teste; o aducem în fața elevului (judecata 4: pe telefon rămânea cu ~4.450 px mai sus) */
      const laIntrebare=()=>{const q=document.getElementById('lh-rez-q');if(q&&q.offsetParent!==null)q.scrollIntoView({block:'center'});return !!q};
      if(asteapta)[250,700].forEach(t=>setTimeout(laIntrebare,t));
      const MSG_INTREBARE=asteapta?' <b>Răspunde întâi la întrebarea „Ești …?”, de sub teste:</b> fără „Da”, fișa nu se scrie pe numele tău.':'';
      const f=body.querySelector('[data-fisa-local]');f.hidden=false;f.innerHTML=fisaHtml();
      if(trecute===Q.ex.length){blocheaza();api.nav().innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${trecute} din ${Q.ex.length} teste trecute. La ✗: recitește ce scrie sub test, repară și apasă din nou „Verifică”. Fișa de pornire a păstrat ce ai trecut din prima.${MSG_INTREBARE}`);
        const primul=body.querySelector('.ei-parte.rau .ei-b:not(:disabled),.ei-parte.rau .ei-in');if(primul)primul.focus({preventScroll:true});
        api.revealButton(()=>{pune(corecte());blocheaza();const f2=body.querySelector('[data-fisa-local]');f2.hidden=false;f2.innerHTML=fisaHtml();api.nav().innerHTML='';api.giveUp('răspunsurile bune sunt acum puse în pagină. Uită-te la fiecare, apoi scrie în caiet ce ai de recitit.')})}
    };
    api.checkButton(verifica,'Verifică');
    /* pentru poartă: pune răspunsurile corecte / tipice greșite */
    const corecte=()=>{const v={};Q.ex.forEach(E=>E.parti.forEach((P,j)=>{const k=id(E.nr,j);
      v[k]=P.k==='af'?(P.r?'A':'F'):P.k==='text'?P.r[0]:P.k==='nr'?String(P.r[0]):P.k==='alege'?String(P.ok):P.k==='bife'?P.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0):P.k==='linii'?P.r.slice():null}));return v};
    const pune=v=>{Object.entries(v).forEach(([k,val])=>{st.v[k]=Array.isArray(val)?val.slice():val;
      const inp=body.querySelector(`.ei-in[data-p="${k}"]`);if(inp){inp.value=val;return}
      if(body.querySelector(`.ei-prog[data-p="${k}"]`)){desen(k);return}
      body.querySelectorAll(`.ei-b[data-p="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',(Array.isArray(val)?val.includes(+b.dataset.v):b.dataset.v===String(val))?'true':'false'))})};
    body._ei={corecte,pune};
  },
  rezolva(Q,body){body._ei.pune(body._ei.corecte());return true},
  gresit(Q,body){body._ei.pune(Object.assign(body._ei.corecte(),Q.gresite));return true}
};

     După intrarea în caseta adevărată, pagina se încarcă din nou, cu „Continuă de unde ai rămas: P3” (proba_laborator_cod.py). */
  {t:'Acasă, pe telefon, cu codul uitat',
   text:`<p><b>Acasă sau pe telefon</b> nu ești în listă: lista e a calculatorului. Te înscrii, cu internet, cu același nume, aceeași clasă și același cod: îți vine ce ai lucrat la școală. Alt cod, altă clasă sau alt nume fac o a doua înscriere, goală.</p>
<p><b>Ți-ai uitat codul?</b> Apasă „Mi-am uitat codul” (acasă: la „Spune cine ești”, după nume), alege un cod nou și „Trimite cererea”. Spune-i profesorului că cererea e a ta. După ce te deblochează (îți primește codul nou), intri cu el și ai tot ce ai lucrat.</p>
<p><b>Ai lucrat până acum fără cod?</b> Apasă eticheta: dacă scrie „Progresul tău stă doar pe calculatorul ăsta.”, apasă „Păstrează-l online”.</p>`,
   /* „Uite cum” scurtat în etapa 2 (I4): poza (1) „Mi-am uitat codul”, (2) meniul la elevul fără cod (Dobre Matei). Fraza
      despre „Alege-ți codul (4 cifre)” din listă a ieșit: caseta adevărată o explică singură, pe ecran. */
   exemplu:`<p>Acasă, cu caietul, Sorina se înscrie. Pe cuprins vede stelele sau „Continuă de unde ai rămas”. Nimic? A greșit clasa: eticheta, „Mi-am scris greșit numele, clasa sau școala”. A greșit codul: „Mi-am uitat codul”, cu codul din caiet, și spune profesorului.</p>`+FIG_COD_ALTFEL+`
<p><b>Acum, de-adevăratelea,</b> în caseta din colțul ecranului (nu în exersare): intră pe numele tău sau verifică-l. Fără cod încă? Îl alegi, de două ori. Pagina pornește din nou? „Continuă de unde ai rămas”.</p>`,
   /* APLICARE pe caseta de exersare (etapa 2): codul uitat, cererea, apoi intrarea cu codul nou după deblocare.
      Alegerea din etapa 1 (Bianca și codul uitat) a ieșit: e aceeași situație ca exercițiul acesta. */
   incearca:SCENARII_COD.uitat,
   inca:[
    SCENARII_COD.faraCod,
    SCENARII_COD.telefon,
    SCENARII_COD.clasaGresita,
    {t:'tf',q:'Acasă, Sorina scrie numele începând cu prenumele: Sorina Vlaicu, cu aceeași clasă și același cod. Pentru site e alt elev.',ok:false,
     ajutor:'Ce trebuie să fie la fel: cuvintele din nume, clasa, codul. Contează și ordinea?',
     why:'Fals. Ordinea cuvintelor, literele mari și diacriticele nu contează. Contează aceleași cuvinte, aceeași clasă și același cod. Vlaicu Sorina Maria, sau clasa VIII, ar fi o a doua înscriere, fără progresul de la școală.'},
    {t:'choice',q:'Cezar a lucrat la școală fără cod. Acum e la calculatorul lui, iar eticheta de jos scrie numele lui. Ce face ca să-și continue progresul și acasă?',

     ajutor:'Ce scrie în caseta de la etichetă, la elevul fără cod?',

  /* ---------- pasul 1 ---------- */
  {t:'Ce faci anul acesta',
   text:`<p>Materia are patru <mark>unități</mark>: părți mari, fiecare cu o lucrare la final.</p>
<ol class="unitati"><li><b>Tehnoredactare: editorul de texte</b>: documente cu text, imagini și tabele <span class="fol">(referate, afișe)</span>.</li>
<li><b>Audio</b> înseamnă sunet, iar <b>audio-video</b>, sunet cu imagini care se mișcă. În <b>Aplicații audio și audio-video</b> faci înregistrări și filmulețe.</li>
<li><b>Aplicații colaborative</b>: lucrați mai mulți la același document, fiecare de pe calculatorul lui.</li>
<li><b>De la algoritm la program</b>: scrii un program care face singur calculele lungi.</li></ol>`,
   exemplu:`<p><b>Cum recunoști unitatea:</b> ce iese la final? O pagină, un sunet sau filmuleț, un material făcut împreună sau un program?</p>`,
   incearca:{t:'classify',q:'În ce unitate înveți fiecare lucru? Ce iese la final?',
    cats:['1. Tehnoredactare','2. Audio și audio-video','3. Aplicații colaborative','4. De la algoritm la program'],
    items:[['Lista pentru tabără, lipită pe ușă',0],['Emisiunea de radio a clasei, cu vocile voastre',1],['Prezentarea scrisă deodată de patru colegi, fiecare de acasă',2],['Un joc de ghicitori care îți arată scorul',3]],
    ajutor:'Pentru fiecare, ce iese la final: o pagină, un sunet sau un filmuleț, un material făcut împreună de la calculatoare diferite, sau un program care socotește?',
    why:'Lista lipită pe ușă e o pagină: tehnoredactare. Emisiunea de radio e sunet: audio. Prezentarea scrisă în același timp, fiecare din casa lui, e un material făcut împreună: aplicații colaborative (chiar dacă e o prezentare). Scorul îl socotește jocul singur: e treaba unui program.'},
   inca:[
    {t:'choice',q:'Ana vrea să facă un filmuleț de două minute din bucățile filmate la excursie, cu muzică. În ce unitate învață asta?',
     o:['Aplicații audio și audio-video','Tehnoredactare: editorul de texte','Aplicații colaborative','De la algoritm la program'],ok:0,
     ajutor:'Ce iese la final: o pagină, un filmuleț, un material comun sau un program?',why:'La final iese un filmuleț, deci unitatea „Aplicații audio și audio-video”.'},
    {t:'tf',q:'La unitatea „Aplicații colaborative” fiecare lucrează singur, la documentul lui.',ok:false,
     ajutor:'Recitește ce scrie în pas la unitatea 3.',why:'Fals. „Colaborativ” înseamnă că lucrați mai mulți la același document, fiecare de pe calculatorul lui.'}
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Cele trei niveluri',
   text:`<p>Pentru tot ce înveți, Ministerul Educației și Cercetării descrie trei <mark>niveluri</mark>:</p>
<ul class="niv-lista"><li>${NIV.b} rezolvi după un <strong>model</strong> sau după <strong>pașii dați</strong>, la lucruri pe care le-ai mai făcut;</li>
<li>${NIV.c} rezolvi <strong>singur</strong>, la lucruri de felul celor exersate;</li>
<li>${NIV.a} rezolvi <strong>singur</strong>, după cerință, o situație <strong>pe care n-ai mai văzut-o</strong>.</li></ul>
<p>Între Consolidat și Avansat, semnul cel mai sigur e <strong>situația nouă</strong>. Explicația („de ce”) nu intră în definiție, dar la clasa a VII-a ministerul chiar o cere când analizezi datele unei probleme: să justifici rolul lor.</p>
<p>În total, ministerul numește cinci niveluri: încă două sub De bază.</p>`,
   exemplu:`<p><b>Metoda:</b> am model sau pași scriși? De bază. N-am model, dar am mai făcut așa ceva? Consolidat. E o situație nouă, pe care o rezolv singur? Avansat.</p>`,
   altfel:`<p>Gândește-te la bicicletă. De bază: mergi cu cineva care te ține de șa. Consolidat: mergi singur, pe drumul pe care îl știi. Avansat: mergi singur pe un drum pe care n-ai mai fost.</p>`,
   incearca:{t:'classify',q:'La ce nivel e fiecare sarcină?',cats:['De bază','Consolidat','Avansat'],
    items:[['Faci un tabel ca tabelul rezolvat alături',0],['Faci suma până la 20, după ce ați făcut-o până la 10',1],['Vezi prima dată un link ciudat și hotărăști singur ce faci',2],['Salvezi o prezentare fără ajutor, ca de zeci de ori',1]],
    ajutor:'Trei întrebări, în ordine: am model sau pași? am mai făcut așa ceva? e o situație nouă, pe care o rezolv singur?',
    why:'Tabelul rezolvat alături e un model: De bază. Suma până la 20 (ați făcut-o până la 10) și salvarea făcută de zeci de ori sunt de felul celor exersate, fără ajutor: Consolidat. Linkul văzut prima dată e o situație nouă, iar tu hotărăști singur ce faci: Avansat.'},
   inca:[
    {t:'choice',q:'Ionuț a rezolvat singur un exercițiu de felul celor de la oră. Ce nivel a arătat?',o:['Consolidat','Avansat','De bază'],ok:0,
     ajutor:'Avea model? Era o situație nouă?',why:'A lucrat singur (deci nu De bază), pe ceva de felul celor exersate, nu într-o situație nouă (deci nu Avansat): Consolidat.'},
    {t:'tf',q:'Diferența dintre Consolidat și Avansat e că la Avansat scrii mai mult.',ok:false,
     ajutor:'Recitește propoziția de sub listă, despre Consolidat și Avansat.',why:'Fals. Între Consolidat și Avansat, semnul cel mai sigur e situația nouă, nu cât scrii.'}
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Cum arată o lucrare',
   text:`<p>O <mark>lucrare</mark> (evaluarea de la finalul unei unități) are trei părți, de la ușor la greu:</p>
<ul class="niv-lista"><li><b>Partea C</b>, 40 de puncte: cu model (De bază);</li>
<li><b>Partea B</b>, 30 de puncte: singur, situație cunoscută (Consolidat);</li>
<li><b>Partea A</b>, 20 de puncte: situație nouă și explicație (Avansat).</li></ul>
<p>Plus <strong>10 puncte din oficiu</strong> (le primești oricum): în total, 100. Părțile și explicația de la A sunt regula profesorului tău.</p>
<p><b>Literele</b> sunt ale ministerului. Pe fișa din caiet și în lecție, până pe 1 octombrie, partea A era cea cu model (40 p), iar C cea cu situația nouă (20 p). Pe testul de la început, B și C erau inversate.</p>`,
   incearca:{t:'numar',q:'Cristi a luat 30 de puncte la partea C, 22 la B și 10 la A. Câte puncte are în total, cu oficiul?',eticheta:'Totalul',unitate:'puncte',ok:72,tipic:62,
    capcane:{'62':'Ai adunat doar părțile C, B și A. Mai adaugă punctele din oficiu.'},
    ajutor:'Aduni cele trei părți, apoi încă 10 puncte din oficiu.',why:'30 + 22 + 10 = 62, iar cu cele 10 puncte din oficiu fac 72.'},
   inca:[
    {t:'tf',q:'Partea A e prima pe foaie și are cele mai multe puncte, pentru că A e prima literă din alfabet.',ok:false,
     ajutor:'Recitește lista părților și paragraful „Literele”.',why:'Fals. Partea A verifică nivelul Avansat (A de la Avansat): are 20 de puncte și vine ultima pe foaie, după C și B. Cele mai multe puncte, 40, le are partea C, De bază.'},
    {t:'numar',q:'Ioana a luat 35 de puncte la C, 25 la B și 18 la A. Câte puncte are în total, cu oficiul?',eticheta:'Totalul',unitate:'puncte',ok:88,tipic:78,
     capcane:{'78':'Ai uitat cele 10 puncte din oficiu.'},ajutor:'Trei părți, plus oficiul.',why:'35 + 25 + 18 = 78, plus 10 din oficiu: 88.'}
   ]},
  /* ---------- pasul 4 (nota = punctaj : 10; SISTEM_EVALUARE.md §4.2, fișa de criterii VII §4; nota 1: copiatul = frauda din
     ROFUIP art. 106 alin. 9, lucrarea nepredată = regula profesorului, SISTEM §4.2 și fișa §6, 01.10.2026; 07.10.2026: trimiterea spre
     pasul 5, munca pe LearningHub; ca textul să rămână sub 110 cuvinte, punctajul e spus într-o propoziție, fără „cel mult 100”, deja
     spus la pasul 3, iar exemplul 8,2 fără „82 : 10”, arătat în „altfel”) ---------- */
  {t:'Din puncte, nota',
   text:`<p>Aduni părțile și cele 10 din oficiu: C + B + A + 10 = <mark>punctajul</mark>.</p>
<p><b>Nota = punctaj : 10</b>, <mark>rotunjită</mark> la cel mai apropiat întreg: 8,2 devine 8, 6,8 devine 7. La <b>,5</b> exact rotunjești în sus, în favoarea ta: 85 de puncte dau 8,5: nota 9. Copiatul: nota 1; după regula profesorului, și lucrarea nepredată.</p>
<p>La lucrarea de modul contează și munca pe LearningHub: pasul următor.</p>
<div class="pescurt"><b>Pe scurt:</b> cel puțin o notă în fiecare modul, deci cel puțin 5 pe an, din lucrări sau proiecte făcute la oră. O singură medie anuală, la ,50 rotunjită în sus. Testul de la început nu se notează.</div>`,
   exemplu:`<p>Un elev are 31 la C, 21 la B și 6 la A. Punctajul: 31 + 21 + 6 + 10 = 68. Nota: 68 : 10 = 6,8, rotunjit: <b>nota 7</b>.</p>`,
   altfel:`<p>Nota e punctajul cu o virgulă pusă înaintea ultimei cifre: 82 devine 8,2, iar 68 devine 6,8. Apoi rotunjești la cel mai apropiat număr întreg; la ,5 exact, urci. Pentru 100 de puncte, nota e 10.</p>`,
   incearca:{t:'numar',q:'Maria are 34 de puncte la C, 25 la B și 17 la A. Ce notă ia?',eticheta:'Nota',ok:9,tipic:8,
    capcane:{'8':'8,6 e mai aproape de 9 decât de 8: rotunjești la cel mai apropiat, nu tai virgula. Ai adunat și cele 10 din oficiu?','7':'Ai adunat și cele 10 puncte din oficiu? Punctajul e C + B + A + 10.','8.6':'8,6 e punctajul împărțit la 10. Nota e un număr întreg: rotunjește la cel mai apropiat.','86':'86 e punctajul. Nota = punctaj : 10, apoi rotunjești.'},
    ajutor:'Întâi punctajul: C + B + A + 10. Apoi îl împarți la 10 și rotunjești la cel mai apropiat număr întreg.',
    why:'Punctajul: 34 + 25 + 17 + 10 = 86. Nota: 86 : 10 = 8,6, mai aproape de 9: nota 9.'},
   inca:[
    {t:'numar',q:'Bianca are 35 de puncte la C, 24 la B și 16 la A. Ce notă ia?',eticheta:'Nota',ok:9,tipic:8,
     capcane:{'8':'Verifică două lucruri: ai adunat cele 10 puncte din oficiu? Iar la ,5 exact rotunjești în sus, în favoarea ta.','8.5':'Nota e un număr întreg. La ,5 exact rotunjești în sus.','85':'85 e punctajul. Nota = punctaj : 10, apoi rotunjești.','7':'Adună și cele 10 puncte din oficiu: punctajul e C + B + A + 10.'},
     ajutor:'Punctajul (C + B + A + 10), apoi punctaj : 10. Dacă iese ,5, în ce parte rotunjești?',why:'35 + 24 + 16 + 10 = 85. Nota: 8,5, exact la jumătate, deci rotunjești în sus, în favoarea ta: nota 9.'},
    {t:'tf',q:'Sorin are 74 de puncte. Nota lui e 8, pentru că rotunjirea e în favoarea elevului.',ok:false,
     ajutor:'Cât face 74 : 10? E mai aproape de 7 sau de 8?',why:'Fals. 74 : 10 = 7,4, mai aproape de 7: nota 7. Rotunjești în sus, în favoarea ta, doar la ,5 exact.'},
    {t:'classify',q:'Ce se trece în catalog ca notă și ce nu?',cats:['Se notează','Nu se notează'],
     items:[['Testul de la început de an',1],['Lucrarea de la finalul unei unități',0],['Un proiect făcut la oră, de exemplu filmulețul tău',0],['O lucrare copiată de la colegul de bancă',0]],
     ajutor:'Recitește caseta „Pe scurt” și propoziția despre lucrarea copiată.',why:'Notele vin din lucrările de la finalul unităților și din proiectele făcute la oră: cel puțin una în fiecare modul. Lucrarea copiată se notează și ea: cu nota 1. Testul de la început nu se notează: arată de unde pleci.'}
   ]},
  /* ---------- pasul 5 (07.10.2026): la lucrarea de modul, nota din catalog = (80% din punctajul lucrării + cel mult 20 de puncte
     de pe LearningHub) : 10 (SISTEM_EVALUARE §4.5; regula în cod: AI_0\tools\nota_site.py; fișa din caiet, „Munca mea pe
     LearningHub”). Răspunsurile exercițiilor, verificate cu nota_site.py. Pasul despre nivel a devenit pasul 6. ---------- */
  {t:'Din lucrare și LearningHub, nota din catalog',
   text:`<p><mark>LearningHub</mark> e situl acesta, cu lecțiile și jocurile clasei. La lucrarea (sau proiectul) de modul, <b>nota din catalog</b> = (80% din punctajul lucrării + punctele de pe LearningHub) : 10, rotunjită ca nota lucrării.</p>
<p>Pe LearningHub ai <b>cel mult 20 de puncte</b>: 2 din oficiu, până la 8 dacă termini ce s-a dat clasei, până la 6 dacă lucrezi fără „Arată-mi răspunsul” (apare după două greșeli) și nimerești din prima, până la 4 pentru jocurile în plus.</p>
<p>Contează ce termini, nu minutele. Regula se aplică de la ora în care o anunță profesorul; ce ai făcut înainte te poate doar ajuta.</p>`,
   exemplu:`<p>Ana: 100 de puncte la lucrare, nimic pe LearningHub: (80 + 2) : 10 = 8,2, <b>nota 8</b>. Bogdan: 60 de puncte și tot pe LearningHub: 80% din 60 = 48, iar (48 + 20) : 10 = 6,8, <b>nota 7</b>.</p>
<p>Fără calculator sau internet acasă, faci aceeași muncă la oră, la calculatorul școlii, sau pe foaie. Lecția din ziua în care ai lipsit motivat nu se numără. Copiatul și lucrarea nepredată rămân nota 1.</p>`,
   altfel:`<p>Nota din catalog se socotește ca o lucrare de 100 de puncte: cel mult 80 vin din lucrare, cel mult 20 din munca pe LearningHub. Fără nimic pe LearningHub rămân doar cele 2 puncte din oficiu, deci și cu lucrarea perfectă iei 8. Contează ce termini, nu cât timp stai.</p>`,
   incearca:{t:'classify',q:'Ce notă trece profesorul în catalog la lucrarea de modul?',cats:['nota 4','nota 5','nota 6','nota 8'],
    items:[['Mihai: 95 de puncte la lucrare și 8 pe LearningHub',3],['Oana: 50 de puncte la lucrare și toate cele 20 pe LearningHub',2],['Luca: 60 de puncte la lucrare și nimic pe LearningHub',1],['Sonia: 30 de puncte la lucrare și toate cele 20 pe LearningHub',0]],
    ajutor:'Pentru fiecare: 80% din punctajul lucrării (8 puncte din fiecare 10), plus punctele de pe LearningHub („nimic” înseamnă cele 2 din oficiu); apoi împarți la 10 și rotunjești.',
    why:'Mihai: 80% din 95 = 76; (76 + 8) : 10 = 8,4, nota 8. Oana: 80% din 50 = 40; (40 + 20) : 10 = 6. Luca: 80% din 60 = 48; (48 + 2) : 10 = 5. Sonia: 80% din 30 = 24; (24 + 20) : 10 = 4,4, nota 4. Doar din lucrare, notele ar fi fost 10, 5, 6 și 3: cu toate cele 20 de puncte, Oana și Sonia au urcat; cu puține sau fără, Mihai și Luca au coborât.'},
   inca:[
    {t:'numar',q:'Paula are 80 de puncte la lucrare și 11 pe LearningHub. Ce notă trece profesorul în catalog?',eticheta:'Nota',ok:8,tipic:9,
     capcane:{'9':'Ai luat tot punctajul lucrării. În nota din catalog intră doar 80% din el.','7':'(64 + 11) : 10 = 7,5. La ,5 exact rotunjești în sus, în favoarea ta.','7.5':'Nota e un număr întreg: la ,5 exact rotunjești în sus.','75':'75 e suma. O împarți la 10, apoi rotunjești.'},
     ajutor:'80% din 80, plus cele 11 puncte de pe LearningHub; apoi împarți la 10 și rotunjești.',why:'80% din 80 = 64; (64 + 11) : 10 = 7,5, exact la jumătate, deci rotunjești în sus: nota 8.'},
    {t:'tf',q:'Cine stă două ore pe LearningHub primește mai multe puncte decât cine termină aceeași lecție, la fel de bine, în 20 de minute.',ok:false,
     ajutor:'Ce contează: timpul sau ce termini?',why:'Fals. Minutele nu contează. Contează ce termini și cum: fără „Arată-mi răspunsul” și din prima.'},
    {t:'choice',q:'Ai lipsit motivat joi, când clasa a primit o lecție pe LearningHub. Ce se întâmplă cu lecția aceea?',o:['Nu se numără la tine','Pierzi punctele ei','Primești nota 1','Trebuie s-o faci de două ori'],ok:0,
     ajutor:'Recitește ce se întâmplă cu lecția din ziua unei absențe motivate.',why:'Lecția din ziua în care ai lipsit motivat nu se numără, deci nu pierzi nimic din cauza ei.'}
   ]},
  /* ---------- pasul 6 (până pe 07.10.2026: pasul 5; nivelul se citește din notă; SISTEM_EVALUARE.md §4.3, fișa de criterii VII §4-5) ---------- */
  {t:'Din notă, nivelul',
   text:`<p>Niciun document oficial nu leagă nivelul de notă. Regula profesorului tău: nivelul se citește din notă. 9 sau 10, <b>Avansat</b>; 7 sau 8, <b>Consolidat</b>; 5 sau 6, <b>De bază</b>; 3 sau 4, <mark>În formare</mark>; 1 sau 2, <mark>În dificultate</mark>.</p>
<p>Ultimele două arată ce sprijin îți trebuie: ajutor doar pentru tine, care se poate da la oră (În formare), sau ajutor special, în afara orei (În dificultate).</p>
<p>Fiecare elev primește, pe an, cel puțin un <mark>plan individualizat de învățare</mark>: pașii lui următori. Sub nota 5, pașii te duc la De bază. Părțile arată ce ai de lucrat.</p>`,

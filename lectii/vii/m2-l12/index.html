<script>
/* LECȚIA 12, clasa a VII-a, modulul 2 (revizuirea LearningHub, standardul din 27.09.2026 + regula 10 din 08.10.2026),
   scrisă în tura de noapte 10→11.10.2026. Un nivel pe pași: pasul 0, 5 pași cu „Încearcă” și cu un gest scurt în
   Audacity-ul adevărat, atelierul, pasul din laborator, 5 întrebări.
   Simulatorul: lectii/_sim/audio-linie-inregistrare.js (extensie nouă, proprietar VII/12), peste lectii/_sim/audio-linie.js
   (VII/11, neschimbat). Faptele despre proiect, salvare, deschidere sunt probate în Audacity 4.0.0 REAL (desktop ascuns,
   _proba/audacity_proba_l12_*.json); despre înregistrare, din manualul Audacity (butonul roșu NU s-a apăsat: fără microfon).
   Afirmațiile: afirmatii.json. Imaginile: img/SURSE.json.
   Reparată după judecata 1 (12.10.2026): _verificare/registru_j1.md (A–S); simulatorul 1.1. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/audio-video-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const S=x=>`<span class="simb">${x}</span>`;
const REC=`<span class="simb rosu">●</span>`;
const PROG1='Operații pentru gestionarea unei aplicații audio, audio-video: creare, deschidere, vizualizare, salvare, închidere';
const PROG2='Înregistrarea şi redarea sunetelor';
const TEXT_CITIT=`Bună ziua! Ascultați radioul școlii. Astăzi vă spunem vremea: dimineața e frig, la prânz iese soarele, iar seara poate ploua. Nu uitați umbrela! În pauza mare, biblioteca vă așteaptă cu cărți noi despre animale, despre călătorii și despre știință. Vă mulțumim că ne ascultați. La revedere!`;
const P=o=>Object.assign({t:'audioproiect'},o);   /* exercițiu în Audacity-ul simulat (proiecte, înregistrare, salvare) */
const COLEGI=[{nume:'Ionescu_Dan_7A_voce',autor:'coleg',voce:{sec:9,seed:21}},{nume:'Marin_Ioana_7B_voce',autor:'coleg',voce:{sec:7,seed:33}}];
const NESALVATE=fig('img/modificari-nesalvate.webp',677,237,'Fereastra Modificări nesalvate din Audacity 4, cu întrebarea Dorești să salvezi modificările acestui proiect înainte de a-l închide și butoanele Salvează încadrat, Nu salva, Renunță','„Modificări nesalvate” (Unsaved changes): apare doar dacă proiectul are ceva nesalvat. Ca să nu pierzi înregistrarea, apeși <b>Salvează</b>, butonul încadrat.');
const EROARE=fig('img/eroare-salvare.webp',508,233,'Fereastra Audacity cu titlul Eroare la salvarea proiectului: Audacity a eșuat să scrie într-un fișier. Poate C: nu are drepturi de scriere sau discul este plin. Butonul OK','„Salvează ca…” peste un proiect care există deja, când proiectul tău deschis are deja un nume: Audacity 4 dă eroarea asta, iar proiectul de acolo <b>dispare</b> de pe disc. (Pe un proiect fără nume, „Fără titlu”, „Salvează ca…” înlocuiește proiectul de acolo fără nicio fereastră.)');
const PROVOCARE=[
  `Pune căștile cu microfon de pe masa ta. Nu băga și nu scoate cabluri din spatele calculatorului. Pornește Audacity, dacă nu e deja pornit: <b>Start</b>, scrii <b>Audacity</b>, clic. Ferestrele „O nouă versiune…” sau „Bun venit”, dacă apar, le închizi cu ✕. Nu instala nimic.`,
  `În fila <b>Acasă (Home)</b>, clic pe <b>Proiect nou (New project)</b>. (Audacity 3 n-are fila Acasă: de obicei pornește direct cu un proiect gol.)`,
  `Apasă <b>Setări audio (Audio setup)</b> › <b>Dispozitiv înregistrare (Recording device)</b> și uită-te ce microfon e ales (de obicei are o bifă în față): trebuie să fie al căștilor (numele lui conține de obicei „Microphone”, „Microfon” sau „Headset”). Dacă nu e, alege-l. Nu umbla la setările Windows.`,
  `Apasă ${REC} și citește clar, nu tare (colegii lucrează lângă tine), textul de mai jos, cam 20 de secunde. Apoi dă clic, în fereastra Audacity, pe ${S('■')} <b>Stop</b>.<div class="foaie">${TEXT_CITIT}</div>`,
  `Apasă ${S('|◀')}, apoi ${S('▶')}, și ascultă în căști. Unda e aproape o linie, vârfurile ating marginile sau se aude zgomot? Apasă ${K('Ctrl+Z')} și înregistrează din nou, la o palmă de microfon, în liniște. (Dacă după ${K('Ctrl+Z')} rămâne o pistă goală, nu e nimic: înregistrezi din nou.) Dacă stă un coleg lângă tine, cere-i părerea: se înțelege fiecare cuvânt?`,
  `<b>Fișier › Salvează (File › Save)</b> sau ${K('Ctrl+S')}. La „Unde dorești să salvezi?” apasă <b>Salvează pe calculator (Save to computer)</b>; nu bifa „Nu mai arăta din nou”. Întrebarea nu apare? E normal (a bifat-o un coleg): mergi mai departe. Fereastra de salvare se poate deschide unde a salvat colegul de dinainte: în stânga alege tu <b>Documente (Documents)</b>, sau folderul scris pe tablă, dacă profesorul a scris unul.`,
  `La <b>Nume fișier</b> șterge „Fără titlu” și scrie numele TĂU după modelul <code>Nume_Prenume_clasa_voce</code>: în loc de <i>Nume</i>, numele tău de familie; în loc de <i>Prenume</i>, prenumele tău; în loc de <i>clasa</i>, clasa ta (de exemplu 7A). Fără diacritice și fără să copiezi modelul.`,
  `<b>Înainte de Salvare, caută în listă EXACT ce ai scris (literele mari sau mici nu contează):</b> dacă e acolo, al oricui ar fi, pune o cifră la capăt (Audacity 4 nu întreabă, ci înlocuiește proiectul de acolo). Apoi <b>Salvare</b>: sus, în bara de titlu, apare numele tău. Nu folosi <b>Salvează ca…</b> peste un nume care există: proiectul de acolo se șterge. (Audacity 3: dacă apare „Dorești să suprascrii proiectul…?”, apasă <b>Nu</b> și pune o cifră.)`,
  `<b>Fișier › Închide proiectul (File › Close project)</b> sau ${K('Ctrl+W')}, în Audacity. În fila <b>Acasă</b>, la <b>Noi și recente (New & recent)</b>, clic pe proiectul tău cu <code>voce</code> la capăt: se deschide. Apasă ${S('|◀')} și ${S('▶')} și ascultă-l din nou. (Audacity 3: <b>Fișier › Deschide…</b>, apoi Documente și proiectul tău.)`,
  `Închide Audacity cu ✕: proiectul e salvat, deci nu te întreabă nimic. Dacă totuși apare „Modificări nesalvate” (Unsaved changes), apasă <b>Salvează</b>, butonul încadrat în imagine. Proiectul rămâne unde l-ai salvat (Documente sau folderul de pe tablă): în lecția 13 îl deschizi și îl cureți. ${NESALVATE}`,
  `Ceva nu merge? <b>Unda rămâne o linie, deși vorbești, sau la ${REC} apare o fereastră de eroare</b> (de exemplu „Error opening recording device”)? Închide fereastra (OK), apoi: 1) <b>Setări audio</b> › <b>Dispozitiv înregistrare</b>: alege microfonul căștilor. 2) Microfonul căștilor nu e în listă? <b>Setări audio</b> › <b>Rescanează dispozitive audio (Rescan audio devices)</b>, apoi uită-te din nou în listă. 3) Tot nimic? Lucrează la calculatorul unui coleg, cu căștile lui, și spune-i profesorului la sfârșitul orei. Nu schimba setările Windows ale calculatorului.`,
  `<b>La salvare apare o fereastră care îți cere să te conectezi (audio.com)?</b> Nu te conecta și nu-ți face cont: închide-o cu ✕ și spune-i profesorului la sfârșitul orei.`
];

JocMotor.porneste({
  cheie:'lectie_vii_m2_l12',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/vii/, „Lecția 12”, pasul din laborator înainte de verificare
  titlu:'Gestionarea proiectului audio-video. Înregistrarea și redarea sunetelor',
  marca:'Lecția 12 · <b>Proiectul și înregistrarea</b>',
  h1:'Gestionarea proiectului audio-video. <em>Înregistrarea și redarea sunetelor</em>',
  clasa:'a VII-a', unitate:'VII-U2', unitateTitlu:'Aplicații audio și audio-video',
  competente:['CS.1.2','CS.3.2'], lectii:'12',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.2, CS.3.2 · unitatea VII-U2 „Aplicații audio și audio-video” · lecția 12 din modulul 2 · conținuturile: „Operații pentru gestionarea unei aplicații audio, audio-video: creare, deschidere, vizualizare, salvare, închidere”, „Înregistrarea şi redarea sunetelor”',
  banda:'<span class="air">ON AIR</span><span class="und">'+Array.from({length:44},(_,i)=>`<i class="${i>30?'nou':''}" style="height:${i>30?8:Math.round(14+80*Math.abs(Math.sin(i*1.1)*Math.cos(i*.29)))}%"></i>`).join('')+'</span>',
  intro:`<p>Faci primul tău <b>proiect</b> în Audacity: îți înregistrezi vocea cu butonul roșu, o asculți, o refaci dacă nu e bună, salvezi proiectul cu numele tău, îl închizi și îl redeschizi. Exersezi întâi în pagină, apoi la calculator, cu căștile cu microfon.</p>
<p><b>Ai nevoie de:</b> lecția 11 (fereastra Audacity: pista, unda, capul de redare, ${S('▶')} Redare, ${S('■')} Stop, ${S('|◀')} Început). Din lecția 3: fereastra de salvare, <b>Documente (Documents)</b>, numele fișierului după regulă, ${K('Ctrl+W')}. Din lecția 2: ${K('Ctrl+Z')}. Din clasa a V-a: microfonul, dispozitivul care „aude” vocea.</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, faci exercițiul „Încearcă tu” și gestul scurt din Audacity-ul adevărat. În pagină nu se folosește microfonul: unda o desenează simulatorul, după cum alegi în panoul „Tu, la microfon”. Vocea ta adevărată o înregistrezi la calculator, cu căștile cu microfon.</p>
<p>În Audacity-ul din pagină alegi comenzile din meniul <b>Fișier</b>. Merg și ${K('Ctrl+S')}, ${K('Ctrl+Z')} și bara de spațiu. ${K('Ctrl+W')} și ${K('Ctrl+O')} le apeși doar în Audacity-ul adevărat: în browser, ${K('Ctrl+W')} închide fila lecției.</p>`,
  nivele:[
{t:'Gestionarea proiectului audio-video. Înregistrarea și redarea sunetelor',lectii:[12],continuturi:[PROG1,PROG2],final:true,
 obiectiv:'faci un proiect nou în Audacity, îți înregistrezi vocea, o asculți și o refaci dacă nu e bună, salvezi proiectul cu numele tău, îl închizi și îl redeschizi.',
 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Reporterii școlii înregistrează interviuri, iar un podcast începe tot cu o voce la microfon. O înregistrare iese rar perfectă din prima: o asculți, o refaci, apoi o păstrezi, ca s-o lucrezi mai departe.</p>
<p>Azi faci primul tău <strong>proiect</strong> în Audacity: îți înregistrezi vocea, o asculți și o salvezi cu numele tău. În lecția 13 o vei curăța.</p>
${fig('img/podcast.webp',960,720,'O persoană văzută din spate, cu căști pe urechi, înregistrează la un microfon de masă, citind de pe o foaie scrisă de mână, într-o sală cu calculatoare','Înregistrarea unui podcast într-o sală cu calculatoare: căști, microfon, textul scris pe o foaie. Foto: Guillaume Bonzoms, <a href="https://commons.wikimedia.org/wiki/File:Enregistrement_d%27un_podcast.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a>.')}`},
  /* ---------- pasul 1 ---------- */
  {t:'Proiectul: fișierul tău de lucru',
   text:`<p>Ce faci în Audacity stă într-un <mark>proiect</mark>: pistele și înregistrările de pe ele. Proiectul e <strong>fișierul de lucru</strong> al Audacity: se deschide doar în Audacity, iar data viitoare continui de unde ai rămas. Audacity 4 îl salvează cu extensia <code>.aup4</code>, Audacity 3 cu <code>.aup3</code>.</p>
<p>Un <strong>fișier de sunet</strong> (<code>.wav</code>, <code>.mp3</code>) e altceva: îl ascultă oricine, pe aproape orice telefon. Pe acela îl faci la final, într-o lecție următoare.</p>
<p>Proiect nou: la pornire, în fila <strong>Acasă (Home)</strong>, clic pe <strong>Proiect nou (New project)</strong>.</p>
${fig('img/acasa.webp',1000,536,'Fila Acasă a Audacity 4 la pornire: titlul Proiecte, fila Noi și recente și dala Proiect nou încadrată cu roșu; jos, butoanele Nou și Deschide altul','Audacity 4 la pornire: fila <b>Acasă</b>, cu dala <b>Proiect nou</b>.')}
<p class="gest"><b>La calculator, acum:</b> pornește Audacity și fă un proiect nou, ca în „Uite cum”.</p>`,
   exemplu:`<ol><li><b>Start</b>, scrii <b>Audacity</b>, clic. Fereastra „O nouă versiune…” sau „Bun venit”, dacă apare, o închizi cu ✕.</li>
<li>În fila <b>Acasă</b>, clic pe <b>Proiect nou</b> (sau <b>Fișier › Nou…</b>).</li>
<li>Se deschide fila <b>Proiect</b>, fără nicio pistă. Sus scrie doar „Audacity 4.0”: proiectul încă n-are nume.</li></ol>
<p>Audacity 3 n-are fila Acasă: de obicei pornește direct cu un proiect gol.</p>`,
   altfel:`<p>Proiectul e ca un caiet de lucru: scrii în el, îl închizi, iar ora viitoare îl deschizi și continui. Fișierul de sunet e ca o felicitare gata scrisă: o dai oricui s-o citească, dar nu mai lucrezi în ea.</p>`,
   incearca:P({start:{ecran:'acasa'},
    q:'În Audacity-ul din pagină, fă un <b>proiect nou</b>.',
    teste:[{ce:'Ai făcut un proiect nou',proiectNou:true,cum:'În fila Acasă, clic pe dala Proiect nou (sau Fișier › Nou…).'}],
    solutie:[{proiectNou:1}],gresit:[],
    ajutor:'Dala cu semnul + din fila Acasă.',
    why:'Proiect nou deschide fila Proiect, cu un proiect gol: acolo vei înregistra.'}),
   inca:[
    {t:'choice',q:'Vrei să lucrezi și ora viitoare la înregistrarea ta, în Audacity 4. Ce fișier îți trebuie?',
     o:['interviu.aup4','interviu.mp3','interviu.wav','interviu.docx'],ok:0,
     ajutor:'Care extensie e a proiectului Audacity 4?',why:'.aup4 e proiectul Audacity 4, fișierul de lucru. .mp3 și .wav sunt fișiere de sunet, iar .docx e un document Word.'},
    P({start:{ecran:'inchis'},
     q:'Audacity e închis. Pornește-l (butonul „Pornește Audacity” ține locul butonului Start) și fă un proiect nou, din meniul <b>Fișier</b>.',
     teste:[{ce:'Ai pornit Audacity',folosit:'pornit',cum:'Apasă „Pornește Audacity”.'},{ce:'Ai făcut un proiect nou',proiectNou:true,cum:'Fișier › Nou… (sau dala Proiect nou).'}],
     solutie:[{pornesteAplicatia:1},{proiectNou:1}],gresit:[{pornesteAplicatia:1}],
     ajutor:'Pornește Audacity, apoi Fișier › Nou….',why:'Ai deschis Audacity, apoi un proiect nou, gol.'})
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Înregistrezi: butonul roșu ●',
   text:`<p>Înregistrarea are nevoie de un <strong>microfon</strong>: în laborator, cel al căștilor. Microfonul folosit e cel ales în <strong>Setări audio (Audio setup) › Dispozitiv înregistrare (Recording device)</strong>; de obicei are o bifă în față.</p>
<p>Apeși butonul roșu <strong>${REC} Înregistrează (Record)</strong> și vorbești. Pe o <strong>pistă</strong> apare, de obicei chiar cât vorbești, unda vocii tale. Oprești cu <strong>${S('■')} Stop</strong> sau cu bara de spațiu.</p>
<p>Vorbește clar, cam la o palmă de microfon.</p>
${fig('img/proiect-nou.webp',1000,177,'Partea de sus a unui proiect nou în Audacity 4: butonul roșu de înregistrare încadrat lângă Redare și Stop, butonul Setări audio încadrat; dedesubt Piste, Adaugă pistă și linia de timp','Butonul roșu ● și <b>Setări audio</b>, într-un proiect nou.')}
<p class="gest"><b>La calculator, acum (cu căștile):</b> întâi <b>Setări audio</b> › <b>Dispozitiv înregistrare</b>: alege microfonul căștilor, dacă nu e deja ales. Apoi apasă ${REC}, spune „Unu, doi, trei, probă de microfon” și apasă ${S('■')}.</p>`,
   exemplu:`${fig('img/setari-audio.webp',300,270,'Lista Setări audio din Audacity 4 cu rândurile Gazdă, Dispozitiv redare, Dispozitiv înregistrare încadrat, Canale înregistrare, Rescanează dispozitive audio, Setări audio','<b>Setări audio</b> › <b>Dispozitiv înregistrare</b>: aici alegi microfonul.')}
<p>Proiect gol. Clic pe ${REC}: începe înregistrarea. Spui o propoziție. Clic pe ${S('■')}: pe pistă rămâne unda propoziției, cu vârfuri unde ai vorbit și aproape o linie unde ai tăcut.</p>`,
   altfel:`<p>E ca reportofonul de pe telefon: apeși butonul roșu, vorbești, apeși pătratul ca să oprești. Doar că aici îți vezi vocea desenată pe pistă.</p>`,
   incearca:P({start:{ecran:'proiect',proiect:{}},
    q:'Înregistrează <b>cel puțin 3 secunde</b> de voce, la o palmă de microfon, apoi oprește. Distanța o alegi jos, în „Tu, la microfon”.',

  {t:'Asculți și, dacă trebuie, refaci',
   text:`<p>După ${S('■')}, ascultă: ${S('|◀')} <strong>Început</strong>, apoi ${S('▶')} <strong>Redare</strong>, ca în lecția 11. Uită-te și la undă:</p>

   text:`<p><strong>Fișier › Salvează (File › Save)</strong> sau ${K('Ctrl+S')}. Prima dată, Audacity întreabă <strong>„Unde dorești să salvezi?”</strong>: apeși <strong>Salvează pe calculator (Save to computer)</strong>. Nu bifa „Nu mai arăta din nou”.</p>

   ieșirea calculată pentru o intrare („exemplu”) și atelierul întreg („analiza”), verificate pe REZULTAT (marcajele,

   din clasele a V-a și a VI-a (Citește, ←, Afișează), reluată pe scurt la pasul 6. Granița: NU mediul de programare,
   structura programului (VII/24), vocabularul, tipurile, citirea/afișarea în limbaj (VII/25), structurile (VII/26-28).
   Aplicația reală: Word (VII/2-10), gesturile reluate din VII/3 (F12, „already exists” → Anulare) și VII/4 (grila, Tab). */
const fig = (f, w, h, alt, cap) => `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

const A = s => AnalizaEnunt.arata(s);

/* ---- „Acum la calculator, în Word” (laboratorul, după atelier). FĂRĂ profesor, pe calculatorul comun: fișierul elevului în

  /* ---- pasul 4: restricțiile ---- */
  {t: 'Restricțiile: ce date sunt permise',
   text: `<p><mark>Restricțiile</mark> sunt regulile din enunț despre datele de intrare: ce fel de numere pot fi și cât de mari. De exemplu: „n este un număr natural mai mic decât 1000”. Un număr natural e unul dintre numerele 0, 1, 2, 3 și așa mai departe: fără virgulă, fără fracție și fără minus, ca 7 sau 350.</p>
<p>Semnele scurte: <code>&lt;</code> = mai mic decât, <code>≤</code> = cel mult (mai mic sau egal), <code>&gt;</code> = mai mare decât, <code>≥</code> = cel puțin (mai mare sau egal). Restricțiile îți spun pe ce date trebuie să meargă rezolvarea, iar un exemplu bun le respectă.</p>`,
   exemplu: `<p>La Mara, restricția: suma și prețurile sunt numere naturale mai mici decât 1000, iar suma ajunge pentru caiet și pix.</p>
<div style="overflow-x:auto"><table class="tt"><thead><tr><th>Intrarea (suma; caietul; pixul)</th><th>Respectă?</th></tr></thead><tbody>
<tr><td>50; 12; 5</td><td class="da">da</td></tr>
<tr><td>20; 12; 15</td><td class="nu">nu: 12 + 15 = 27, mai mult decât 20, deci banii nu ajung</td></tr>
<tr><td>50; 12,5; 5</td><td class="nu">nu: 12,5 are virgulă, nu e număr natural</td></tr>
<tr><td>1000; 12; 5</td><td class="nu">nu: 1000 nu e mai mic decât 1000</td></tr></tbody></table></div>`,
   altfel: `<p>Ca la un tobogan din parcul de distracții: scrie „copii de cel puțin 6 ani”. Regula nu spune cum se coboară, ci cine are voie să urce. Restricțiile spun la fel ce date au voie să intre în problemă.</p>`,
   incearca: {t: 'classify', q: 'Restricția: „n, numărul de elevi din clasă, este un număr natural, 1 ≤ n ≤ 30”. Respectă restricția fiecare intrare?',
    cats: ['Respectă restricția', 'Nu respectă restricția'],
    items: [['n = 25', 0], ['n = 31', 1], ['n = 30', 0], ['n = 12,5', 1], ['n = 1', 0], ['n = −4', 1]],
    ajutor: '1 ≤ n înseamnă că n e cel puțin 1; n ≤ 30 înseamnă că n e cel mult 30. Un număr natural (0, 1, 2, 3…) nu are virgulă, fracție sau minus.',
    why: '25, 30 și 1 sunt numere naturale de la 1 la 30 (semnul ≤ primește și numărul egal). 31 e prea mare, 12,5 are virgulă, iar −4 are minus.'},
   inca: [
    {t: 'choice', q: 'Restricția: „a și b sunt numere naturale mai mici decât 1000”. Care intrare NU respectă restricția?',
     o: ['a = 1000, b = 5', 'a = 999, b = 5', 'a = 45, b = 300', 'a = 7, b = 999'], ok: 0,
     ajutor: 'Mai mic decât 1000: semnul e < sau ≤?',
     why: '„Mai mic decât 1000” înseamnă &lt; 1000, deci 1000 nu e primit. 999 e cel mai mare număr permis.'}
   ]},
  /* ---- pasul 5: tabelul analizei + enunțul căruia îi lipsește o dată ---- */
  {t: 'Tabelul analizei: nu lipsește nimic',
   text: `<p>Analiza se scrie într-un tabel cu trei coloane: datele de intrare, datele de ieșire și operațiile (tabelul din Word mai are în față coloana „Problema”, cu numele problemei). Apoi verifici: fiecare operație folosește doar date de intrare, numere fixe ale regulii sau rezultate calculate înainte.</p>
<p>Dacă o operație are nevoie de ceva ce enunțul nu dă, enunțului îi <mark>lipsește o dată</mark>. O astfel de problemă nu se poate rezolva: nu știi cu ce să calculezi.</p>`,
   exemplu: `<p>Tabelul analizei pentru Mara:</p>${AnalizaEnunt.tabel(MARA_TABEL)}

<pre class="alg">Început
Citește suma, caiet, pix
rest ← suma - (caiet + pix)
Afișează rest
Sfârșit</pre>`,

<script>
/* LECȚIA 10, clasa a VII-a, modulul 2 (evaluare sumativă; revizuirea LearningHub, standardul din 27.09.2026).
   Nu predă nimic nou: pregătește proba practică a unității VII-U1 „Tehnoredactare: editorul de texte”, cu trimiteri la
   lecțiile 1-9 ale clasei. Un singur nivel pe pași: pasul 0 „La ce folosește”, 5 pași cu „Încearcă”, atelierul (proba de
   antrenament cu punctaj, în Word-ul simulat: lectii/_sim/wordobj-proba.js, extensie NOUĂ a acestei lecții, peste
   simulatoarele neatinse wordobj / wordobj-formatare / wordobj-pagina / wordobj-hartie / wordobj-tehnoredactare și peste
   componenta comună rezultat-elev.js), pasul „Acum la calculatorul din laborator” (aceeași probă, alt document, în Word-ul
   adevărat; documentul: proba-lectia10.docx, făcut în Word-ul real, _proba/proba_word.py), 5 întrebări.
   Cerințele, punctele și nota: documentele profesorului (Info_Gimnaziu_2026: SISTEM_EVALUARE.md §4.1-4.3,
   instrumente/Fisa_criterii_elev_clasa_VII.md, data/activitati_lectii_VII_VIII.json VII/10), cu deciziile în surse.md.
   Testul profesorului nu există încă: pagina nu-l inventează; proba e marcată peste tot ca antrenament.
   Faptele „dacă faci X, apare Y”: afirmatii.json. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const BS='<kbd>⌫</kbd>';
const I8='../m2-l08/img/',I9='../m2-l09/img/';
const VERIF=t=>`<details class="verif"><summary>Verifică-te, după ce ai lucrat</summary>${t}</details>`;
/* eticheta părții (litera oficială a nivelului: SISTEM_EVALUARE.md §4.1, Anexa 2 a OM 4.615/2026) */
const PARTE={C:'<span class="niv">C · De bază</span>',B:'<span class="niv b">B · Consolidat</span>',A:'<span class="niv a">A · Avansat</span>'};
/* conținuturile unității VII-U1, copiate întocmai din lecțiile 2-9 (care le-au luat din programă) */
const PROG={
  interfata:'Interfaţa unei aplicaţii de realizare a documentelor',
  instrumente:'Instrumente de bază ale unei aplicații de realizare a documentelor',
  gestionare:'Operații pentru gestionarea unui document: creare, deschidere, vizualizare, salvare, închidere',
  obiecte:'Obiecte într-un document: text, imagini, tabele',
  editare:'Operaţii de editare într-un document: copiere, mutare, ștergere',
  formatare:'Operaţii de formatare a unui document: text, imagine, tabel, pagină',
  reguli:'Reguli generale de tehnoredactare şi estetică a paginii tipărite',
  specificatii:'Reguli de lucru în realizarea unui document conform unor specificații (dimensiune pagină, dimensiune font, dimensiune imagine, format tabel)'
};
/* poza din Word-ul simulat la foaie (wordpag): cea a lecției 7 */
TipWordPagina.poza='../m1-l07/img/cetatea.png';

/* ---------- tipul „numar” (copiat din lecția VII/1): elevul scrie nota pe care o obține aplicând regula ---------- */
const citesteNr=s=>{s=String(s||'').trim().toLowerCase().replace(/(\d)[\s ]+(?=\d)/g,'$1').replace(',','.');
  const m=s.match(/^(-?\d+(?:\.\d+)?)(?:\s*[a-zăâîșşțţ]+(?:\s+[a-zăâîșşțţ]+)*)?\s*\.?$/);return m?parseFloat(m[1]):null};
const fmtNr=v=>String(v).replace('.',',');
const TipNumar={
  render(Q,body,api){
    body.innerHTML=`<div class="nr-rand"><label>${api.esc(Q.eticheta||'Răspunsul tău')}: <input class="nr-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></label></div>`;
    const inp=body.querySelector('.nr-in');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=document.getElementById('chk');if(b)b.click()}});
    const nav=api.checkButton(()=>{
      const v=citesteNr(inp.value.replace(/^\s*[a-zăâîșşțţ]+:?\s+(?=-?\d)/i,''));
      if(v===null){api.feedback('bad','<strong>Scrie doar numărul</strong>, cu cifre (de exemplu 10).');inp.focus({preventScroll:true});return}
      if(Math.abs(v-Q.ok)<1e-9){inp.disabled=true;nav.innerHTML='';api.resolve(true);return}
      const cap=(Q.capcane||{})[String(v)];
      api.resolve(false,cap||`${fmtNr(v)} nu e răspunsul. Refă socoteala: adună părțile și oficiul, împarte la 10, rotunjește.`);
      inp.focus({preventScroll:true});inp.select();
      api.revealButton(()=>{inp.value=fmtNr(Q.ok);inp.disabled=true;nav.innerHTML='';api.giveUp(`<b>${fmtNr(Q.ok)}</b>`)});
    });
  },
  rezolva(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.ok);return true},
  gresit(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.tipic);return true}
};

/* PROBA DE ANTRENAMENT (atelierul): 6 exerciții, punctele după structura lucrării (SISTEM_EVALUARE.md §4.1: C 40, B 30,
   A 20, 10 din oficiu). Punctele se socotesc la PRIMA apăsare pe „Verifică” (lectii/_sim/wordobj-proba.js). */
WordProba.configureaza({cheie:'vii-m2-l10-proba',oficiu:10,
  parti:{C:{nume:'De bază',max:40},B:{nume:'Consolidat',max:30},A:{nume:'Avansat',max:20}},
  itemi:[{id:'C1',parte:'C',puncte:20},{id:'C2',parte:'C',puncte:20},{id:'B1',parte:'B',puncte:15},{id:'B2',parte:'B',puncte:15},{id:'A1',parte:'A',puncte:12},{id:'A2',parte:'A',puncte:8}]});

const L6a='lecția 6, pasul „Aldin, cursiv, subliniat”',L6f='lecția 6, pasul „Fontul, mărimea și culoarea”',L6al='lecția 6, pasul „Alinierea paragrafului”',L6s='lecția 6, pasul „Alineatul și spațierea dintre rânduri”';
const L4p='lecția 4, pasul „Inserezi o imagine din calculator”',L4t='lecția 4, pasul „Inserezi un tabel și scrii în celule”',L4c='lecția 4, pasul „Cursorul și tasta Enter”';
const L7p='lecția 7, pasul „Poza: o selectezi și o mărești din colț”',L7t='lecția 7, pasul „Tabelul: un stil, dintr-un clic”',L7f='lecția 7, pasul „Pagina: în picioare sau culcată, și marginile”';
const L8s='lecția 8, pasul „Spațiile: unul singur, lipit de semne”',L8e='lecția 8, pasul „Enter și spațiile nu așază textul”',L8f='lecția 8, pasul „Estetica paginii: puține fonturi, titluri la fel, o pagină”',L8v='lecția 8, pasul „Verifici: semnele ¶ și previzualizarea”';

/* A1: anunțul bibliotecii, cu greșelile regulilor din lecția 8 (situație nouă) și 30 de rânduri goale care împing
   semnătura pe pagina a doua (în simulator: 2 pagini; proba în _proba/proba_gesturi.py) */
const A1_START=[{t:'        Cărți noi la bibliotecă',f:{sz:20,b:1}},'Au sosit 40 de cărți noi : romane , povești și atlase.Le găsiți pe raftul de lângă fereastră.',
  'Le puteți împrumuta câte două, pentru două','săptămâni.',{t:'Bibliotecara vă așteaptă în pauza mare ( la etajul întâi).',f:{font:'Courier New'}}]
  .concat(Array.from({length:30},()=>''),['          Biblioteca școlii']);
const A1_TINTA=[{t:'Cărți noi la bibliotecă',al:'center',f:{sz:20,b:1}},'Au sosit 40 de cărți noi: romane, povești și atlase. Le găsiți pe raftul de lângă fereastră.',
  'Le puteți împrumuta câte două, pentru două săptămâni.','Bibliotecara vă așteaptă în pauza mare (la etajul întâi).',{t:'Biblioteca școlii',al:'right'}];

/* „Acum la calculatorul din laborator”: o probă la fel, cu alt document, în Word-ul adevărat, fără profesor (ora simultană).
   Documentul proba-lectia10.docx are exact textul de mai jos (_proba/proba_word.py, LAB); poza e cea din lecția 9. */
const DOCX='proba-lectia10.docx',POZA='../m2-l09/creioane-colorate.jpg';
const PROVOCARE=[
  `<b>Încălzirea, un minut.</b> Deschide documentul descărcat: clic pe el în lista de descărcări a browserului sau dublu-clic pe el în folderul <b>Descărcări (Downloads)</b>. Dacă sub panglică apare bara galbenă <b>Vizualizare protejată (Protected View)</b>, apasă pe ea <b>Activare editare (Enable Editing)</b>. Dacă documentul nu arată ca o foaie albă, cu margini, apasă <b>Vizualizare (View)</b> › <b>Aspect pagină imprimată (Print Layout)</b>, ca la lecția 3. Pornește <b>¶</b> (fila <b>Pornire (Home)</b>, grupul <b>Paragraf (Paragraph)</b>) și oprește-l. Apasă ${K('Ctrl+P')}: sub pagină scrie câte pagini are documentul acum. Înapoi cu <kbd>Esc</kbd>.`,
  `Lucrează fără să te uiți în pașii lecției sau în atelier: aici citești doar cerința părții la care ești. Deschide „Verifică-te” abia după ce ai terminat partea. Scrie în caiet titlul <b>Proba de antrenament</b>.`,
  `<b>C · De bază (15 puncte din 40).</b> Selectează titlul <b>Atelierul de pictură</b> trăgând peste el. Apasă <b>B</b> (aldin), alege <b>20</b> în caseta de mărime (<b>Font Size</b>) și apasă <b>Center</b> (10 puncte). Dă un clic în paragraful „În fiecare joi…” și apasă <b>Justify</b> (stânga-dreapta) (5 puncte).`
   +VERIF('Cu titlul selectat, caseta de mărime arată 20, iar <b>B</b> și <b>Center</b> sunt aprinse. Cu un clic în paragraful „În fiecare joi…”, <b>Justify</b> e aprins: paragraful are ambele margini drepte, iar ultimul lui rând stă la stânga.'),
  `<b>C · De bază, încă 25 de puncte.</b> <b>Poza</b> (10 puncte): dă un clic la capătul paragrafului „În fiecare joi…”, după ultima literă, și apasă <kbd>Enter</kbd>. Pe rândul gol: <b>Inserare (Insert)</b> › <b>Imagini (Pictures)</b> › <b>Acest dispozitiv… (This Device…)</b> › <b>Descărcări (Downloads)</b> › <b>creioane-colorate.jpg</b> › <b>Inserare (Insert)</b>. <b>Tabelul</b> (15 puncte): dă un clic la capătul rândului „Programul atelierului:”, după ultima literă, apoi <b>Inserare (Insert)</b> › <b>Tabel (Table)</b> și alege pe grilă <b>2x3</b>. Scrie în celule, cu <kbd>Tab</kbd> între ele: <b>Ziua</b>, <b>Tema</b>; <b>12 noiembrie</b>, <b>Frunze colorate</b>; <b>19 noiembrie</b>, <b>Cerul noaptea</b>.`
   +VERIF('Poza stă singură pe rândul ei, sub paragraful „În fiecare joi…”. Tabelul are 2 coloane și 3 rânduri și stă sub „Programul atelierului:”. Sub tabel, Word lasă singur un rând gol: pe acela îl lași. Scrie în caiet câte puncte ai luat la partea C, din 40.'),
  `<b>B · Consolidat (30 de puncte).</b> Lucrezi singur, după fișa de mai jos:<ul class="fisa-mica"><li><b>Foaia:</b> marginile de 2 cm sus, jos, stânga și dreapta (8 puncte).</li><li><b>Poza:</b> lată de 6 cm (se acceptă între 5,5 și 6,5 cm), nedeformată, la mijloc (8 puncte).</li><li><b>Tabelul:</b> stilul <b>Grid Table 4 - Accent 1</b>, cu bifa <b>Rând antet (Header Row)</b> pusă (7 puncte).</li><li><b>Paragraful „În fiecare joi…”:</b> alineat de 1,25 cm (<b>Special: First line</b>) (7 puncte).</li></ul>`
   +VERIF('<b>Aspect (Layout)</b> › <b>Margini (Margins)</b> › <b>Margini particularizate (Custom Margins...)</b>: Top, Bottom, Left și Right arată 2 cm; închizi cu <b>Anulare (Cancel)</b>. Clic pe poză › <b>Format imagine (Picture Format)</b>, grupul <b>Dimensiune (Size)</b>: jos 6 cm, sus 4 cm (nedeformată: două treimi din lățime, ca la lecția 9); cu poza selectată, <b>Center</b> e aprins pe <b>Pornire (Home)</b>. Clic în tabel › <b>Proiectare tabel (Table Design)</b>: bifa <b>Header Row</b> e pusă, antetul e albastru, iar rândurile sunt în dungi. Clic în paragraf, fereastra <b>Paragraph</b>: Special arată First line, By arată 1,25 cm. Scrie în caiet punctele de la partea B, din 30.'),
  `<b>A · Avansat (14 puncte din 20).</b> Situație nouă: afișul se tipărește pe <b>o singură foaie</b> și se pune la avizier. Pregătește-l pentru tipar: găsește și repară singur tot ce nu respectă regulile unei pagini îngrijite (lecția 8). La final, verifică pagina cu ${K('Ctrl+P')} și întoarce-te cu <kbd>Esc</kbd>.`
   +VERIF(`<p>Bara de stare arată <b>Page 1 of 1</b>, iar ${K('Ctrl+P')} arată o singură pagină. Partea ei de sus arată ca aceasta:</p>${fig('img/lab-buna.webp',838,593,'Afișul Atelierul de pictură în Word, pe o singură pagină: titlul aldin la mijloc, paragraful stânga-dreapta cu alineat, poza creioanelor la mijloc, tabelul albastru cu Ziua și Tema, două paragrafe corecte și semnătura la dreapta','Lucrarea bună, desenată de Word. Poza creioanelor: MichaelMaggs, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Colouring_pencils.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.')}<p>Ce era de reparat: spațiile de lângă semne, adică două spații între „voi” și „aduceți”, „dirigintă ,”, „vineri.Locurile” și „( cel” (5 puncte); paragraful rupt după „și cu”: ștergi ¶ de după „cu”, apoi te uiți să fie un spațiu între „cu” și „pensulele”; dacă s-au lipit, pui spațiul (3 puncte); rândurile goale de la sfârșit, care împingeau semnătura pe pagina a doua (3 puncte); semnătura adusă la dreapta cu spații: le ștergi și apeși <b>Align Right</b> (3 puncte).</p>`),
  `<b>A · Avansat, în caiet (6 puncte).</b> Scrie într-o propoziție de ce ai adus semnătura la dreapta cu <b>Align Right</b>, nu cu spații.`
   +VERIF('De exemplu: „Am folosit Align Right, pentru că semnătura adusă cu spații fuge din loc la prima schimbare de litere sau de margini, iar butonul o ține lipită de marginea din dreapta.” 6 puncte dacă ai spus și ce se întâmplă cu spațiile, și ce face butonul; 3 dacă ai spus doar unul. Scrie în caiet punctele de la partea A, din 20.'),
  'Socotește-ți nota, ca la lucrare: adună punctele de la C, B și A, apoi încă 10 din oficiu. Împarte la 10. Dacă nu iese număr întreg, rotunjește la cel mai apropiat; la ,5, în favoarea ta. Scrie în caiet punctajul, nota și nivelul citit din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate.',
  `Salvează cu numele tău: apasă <kbd>F12</kbd>, adică <b>Salvare ca (Save As)</b>. Alege în stânga <b>Documente (Documents)</b> sau folderul scris pe tablă și scrie la <b>Nume fișier (File name)</b> numele, prenumele și clasa ta, cu <code>lectia10</code> la capăt, de exemplu <code>Popescu_Ana_7A_lectia10</code>. Apasă <b>Salvare (Save)</b>. Dacă Word spune că fișierul există deja (<i>already exists</i>), e al unui coleg: <b>Anulare (Cancel)</b>, pune o cifră la capătul numelui tău (<code>Popescu_Ana_7A_lectia10_2</code>), apoi iar <b>Salvare (Save)</b>.`,
  `Închide documentul cu ${K('Ctrl+W')}. Apoi apasă ${K('Ctrl+O')}: în lista <b>Recente (Recent)</b> e fișierul tău, cu numele tău. Deschide-l și uită-te că e cum l-ai lăsat. La final închide Word de tot, cu butonul ✕ din colțul din dreapta-sus.`
];

JocMotor.porneste({
  cheie:'lectie_vii_m2_l10',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/vii/, „Lecția 10”, pasul din laborator înainte de verificare
  titlu:'Evaluare sumativă: tehnoredactare',
  marca:'Lecția <b>10</b> · Word · a VII-a',
  h1:'Evaluare sumativă: <em>tehnoredactare</em>',
  eticheta:'Lecții TIC', acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a VII-a', unitate:'VII-U1', unitateTitlu:'Tehnoredactare: editorul de texte',
  competente:['CS.1.1','CS.3.1'], lectii:'10',
  ancoraText:'Programa (OMEN 3393/2017): CS.1.1, CS.3.1 · unitatea VII-U1 „Tehnoredactare: editorul de texte” · lecția 10, evaluare sumativă pe lecțiile 2-9 · conținuturile unității: interfața și instrumentele de bază, gestionarea documentului, obiectele (text, imagini, tabele), editarea, formatarea textului, a imaginii, a tabelului și a paginii, regulile de tehnoredactare și documentul după specificații',
  intro:`<p>Lecția 10 e <b>evaluarea sumativă</b> a unității „Tehnoredactare”: lucrarea de la finalul ei. Lucrarea e o <b>probă practică</b>: faci în Word un document după cerințe date. Pagina te pregătește: afli ce fel de cerințe vin și cum se notează, cum arată o lucrare bună și cum te verifici singur. Dai o probă de antrenament cu punctaj, apoi o faci și în Word-ul adevărat.</p>
<p><b>Ai nevoie de:</b></p>
<ul><li>Lecția 1: nivelurile C · De bază, B · Consolidat, A · Avansat. Nota = punctaj : 10.</li>
<li>Lecția 2: panglica și bara de stare. Semnele ¶. Tastele ${BS} și Delete. ${K('Ctrl+Z')}.</li>
<li>Lecția 3: Salvare ca (<kbd>F12</kbd>), cu numele tău. Activare editare (Enable Editing).</li>
<li>Lecția 4: poza și tabelul, puse la locul lor.</li>
<li>Lecția 5: selectezi textul trăgând peste el.</li>
<li>Lecția 6: fontul, mărimea, aldinul, culoarea, alinierea. Fereastra Paragraph.</li>
<li>Lecția 7: poza mărită din colț. Stilul tabelului. Foaia culcată. Marginile.</li>
<li>Lecția 8: regulile unei pagini îngrijite. Semnele ¶ și previzualizarea (${K('Ctrl+P')}).</li>
<li>Lecția 9: fișa de specificații. Verificarea în Word, cerință cu cerință.</li></ul>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> După „La ce folosește” urmează 5 pași scurți, fiecare cu „Încearcă tu”, fără puncte. Apoi atelierul: proba de antrenament, cu punctaj, în Word-ul simulat. Apoi o probă la fel, cu alt document, în Word-ul adevărat, la calculatorul din laborator. La sfârșit, 5 întrebări.</p>`,
  banda:'<span class="cm"></span><span class="p"><b>C</b> 40</span><span class="p"><b>B</b> 30</span><span class="p"><b>A</b> 20</span><span class="p">+10</span>',
  tipuri:{
    wordfmt:TipWordFormat, wordobj:TipWordObiecte, wordpag:TipWordPagina, wordteh:TipWordTehno, numar:TipNumar,
    probafmt:WordProba.punctat(TipWordFormat), probaobj:WordProba.punctat(TipWordObiecte), probapag:WordProba.punctat(TipWordPagina),
    probateh:WordProba.punctat(TipWordTehno), probaalege:WordProba.punctat(WordProba.alegere)
  },
  nivele:[
  {t:'Evaluare sumativă: tehnoredactare', final:true, lectii:[2,3,4,5,6,7,8,9,10],
   continuturi:[PROG.interfata,PROG.instrumente,PROG.gestionare,PROG.obiecte,PROG.editare,PROG.formatare,PROG.reguli,PROG.specificatii],
   obiectiv:'știi ce poate cere fiecare parte a probei practice de tehnoredactare, îți socotești nota din punctaj, îți verifici singur documentul cerință cu cerință și afli, pe o probă de antrenament, ce mai ai de recitit.',
   pasi:[
    /* ---------- PASUL 0: la ce folosește (fără acțiuni) ---------- */
    {t:'La ce folosește',
     text:`<p>Un croitor primește măsurile clientului: lungimea, talia, lățimea umerilor. Coase haina după ele. Înainte s-o predea, o măsoară din nou cu centimetrul.</p>
<p>Lucrarea de la finalul unității „Tehnoredactare” e la fel. Primești cerințele unui document: ce scrie în el, poza, tabelul, cum arată literele, foaia. Îl faci în Word, apoi îl verifici, cerință cu cerință, înainte să-l predai.</p>
<p>Pagina asta te pregătește pentru lucrare.</p>
${fig('img/croitor.webp',800,535,'Pe o masă veche de lemn: o foarfecă mare de croitor, un centimetru de croitorie desfăcut, cu cifre negre, rigle de lemn și mostre de stofă','Masa unui croitor: foarfeca, centimetrul și riglele. Foto: Wolfgang Sauber, <a href="https://commons.wikimedia.org/wiki/File:Tailor%C2%B4s_shop_-_Werkstatt_2.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, licența <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a> (micșorată).')}`},

    /* ---------- PASUL 1: cum arată lucrarea și cum se notează ---------- */
    {t:'Cum arată lucrarea și cum se notează',
     text:`<p>Lucrarea e o <mark>probă practică</mark>: faci în Word un document după cerințe date. Știi dinainte cum se notează. Are trei părți, de la ușor la greu; fiecare poartă litera nivelului pe care îl verifică:</p>
<ul class="parti"><li>${PARTE.C} 40 de puncte: lucrezi după un model sau după pașii dați;</li>
<li>${PARTE.B} 30 de puncte: lucrezi singur, ca la exercițiile de la clasă;</li>
<li>${PARTE.A} 20 de puncte: o situație nouă, iar tu explici de ce ai lucrat așa.</li></ul>
<p>Primești și 10 puncte din oficiu. <mark>Nota = punctaj : 10</mark>, rotunjită la cel mai apropiat întreg; la ,5, în favoarea ta. Nivelul se citește din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate.</p>`,
     exemplu:`<p>C 30 + B 24 + A 12 + 10 din oficiu = 76 de puncte. 76 : 10 = 7,6, deci nota 8 și nivelul B · Consolidat. Părțile nu schimbă nota: îți arată unde ai pierdut puncte, adică ce ai de recitit.</p>
<p>La lucrarea (sau proiectul) de modul, nota din catalog = (80% din punctajul lucrării + punctele de pe LearningHub) : 10, rotunjită ca nota lucrării (lecția 1).</p>`,
     altfel:`<p>E ca la un concurs de gimnastică: fiecare aparat aduce puncte, iar clasamentul se face după total. Punctele de la fiecare aparat îți arată unde mai ai de lucrat.</p>`,
     incearca:{t:'numar',q:'Andrei are la lucrare C 34, B 22 și A 9 puncte, plus cele 10 din oficiu. Ce notă are lucrarea lui?',eticheta:'Nota',ok:8,tipic:7,
       capcane:{'7':'34 + 22 + 9 + 10 = 75, iar 75 : 10 = 7,5. La ,5 exact rotunjești în sus, în favoarea ta.','7.5':'Nota e un număr întreg: la ,5 exact rotunjești în sus.','75':'75 e punctajul. Îl împarți la 10, apoi rotunjești.','6.5':'Ai uitat cele 10 puncte din oficiu? 34 + 22 + 9 + 10 = 75.','65':'Ai uitat cele 10 puncte din oficiu? 34 + 22 + 9 + 10 = 75.'},
       ajutor:'Adună cele trei părți și cele 10 din oficiu, apoi împarte la 10. La ,5 în ce parte rotunjești?',
       why:'34 + 22 + 9 + 10 = 75 de puncte; 75 : 10 = 7,5, exact la jumătate, deci nota 8 și nivelul Consolidat.'},
     inca:[
      {t:'tf',q:'Mihai are la partea A toate cele 20 de puncte, dar la C doar 15 și la B 10. Fiindcă a rezolvat partea grea, nivelul lui e Avansat.',ok:false,
       ajutor:'Socotește întâi nota: 15 + 10 + 20 + 10. Apoi citește nivelul din notă.',why:'Fals. 15 + 10 + 20 + 10 = 55 de puncte; 55 : 10 = 5,5, deci nota 6 și nivelul De bază. Nivelul se citește din notă, nu din partea cea mai grea.'},
      {t:'choice',q:'O cerință a lucrării spune: „Selectează titlul, apasă B, apoi Center.” La ce nivel e?',o:['C · De bază: cerința îți dă pașii, unul câte unul','B · Consolidat: lucrezi singur, fără pași','A · Avansat: o situație nouă, cu explicație','La niciun nivel: e doar un sfat'],ok:0,
       ajutor:'Cerința îți spune pașii, unul câte unul?',why:'Cerința îți dă pașii, deci e la nivelul De bază, adică partea C.'}
     ]},

    /* ---------- PASUL 2: partea C ---------- */
    {t:'Partea C: după pașii dați',
     text:`<p>La partea C primești pașii sau un model și faci la fel, pe lucruri exersate la clasă. Se pot cere, de exemplu:</p>
<ul><li>litere aldine, mai mari, cu alt font, și alinierea unui paragraf (lecția 6);</li>
<li>o poză sau un tabel puse la locul cerut: clic la capătul rândului de deasupra (pentru poză, apoi <kbd>Enter</kbd>) și <b>Inserare (Insert)</b> (lecția 4);</li>
<li>salvarea cu numele tău, cu <kbd>F12</kbd> (lecția 3).</li></ul>
<p><b>Un pas e făcut</b> doar dacă se vede în Word: selectezi rândul și citești casetele grupului Font și butonul de aliniere aprins (lecția 9).</p>`,
     exemplu:`${fig(I9+'verifici-font.webp',647,322,'Grupurile Font și Paragraph din Word, de două ori: cu titlul selectat, casetele arată Georgia și 48, iar B și Center sunt aprinse; cu două rânduri selectate, caseta de mărime e goală','De la lecția 9. Sus: titlul selectat, <b>Georgia</b>, <b>48</b>, <b>B</b> și <b>Center</b> aprinse. Jos: două rânduri cu mărimi diferite, caseta de mărime goală.')}
<p class="gest"><b>La calculatorul din laborator, acum (un minut):</b> deschide Word, alege <b>Document necompletat (Blank document)</b> și scrie un titlu. Selectează-l trăgând peste el, apasă ${K('Ctrl+B')}, apoi ${K('Ctrl+E')}: <b>B</b> și <b>Center</b> se aprind. Închide cu ${K('Ctrl+W')} › <b>Nu salvați (Don't Save)</b>.</p>`,
     altfel:`<p>E ca o rețetă cu pașii scriși: faci exact ce scrie, în ordine, iar la sfârșit guști. În Word, „gustul” e ce arată casetele: dacă scrie 20 și <b>B</b> e aprins, pasul e făcut.</p>`,
     incearca:{t:'wordfmt',unelte:['caractere','paragraf'],q:'Fă pașii: (1) selectează titlul <b>Clubul de șah</b> trăgând peste el; (2) apasă <b>B</b>; (3) alege <b>16</b> în caseta de mărime (<b>Font Size</b>); (4) dă un clic în paragraful de sub titlu și apasă <b>Justify</b> (stânga-dreapta).',
       start:['Clubul de șah','Joi, după ore, ne întâlnim în sala 12. Învățăm deschideri noi și jucăm partide scurte, pe echipe, cu ceasul de șah pe masă.'],
       verif:[{ce:'Titlul e aldin',text:'Clubul de șah',b:1},{ce:'Titlul are 16 pt',text:'Clubul de șah',sz:16},{ce:'Paragraful e stânga-dreapta',par:2,al:'justify'}],
       tipic:[{text:'Clubul de șah',b:1}],
       ajutor:'Titlul: trage peste el, apasă B, apoi alege 16 în a doua casetă a grupului Font. Paragraful: un clic în el, apoi Justify, ultimul buton de aliniere.',
       why:'Titlul e aldin, de 16 pt, iar paragraful are ambele margini drepte. Exact pașii dați, în ordine.'},
     inca:[
      {t:'wordobj',q:'Fă pașii: (1) dă un clic la capătul rândului <b>Orele clubului:</b>, după ultima literă; (2) <b>Inserare (Insert)</b> › <b>Tabel (Table)</b> și alege pe grilă <b>2x2</b>; (3) scrie în celule, cu <b>Tab</b> între ele: <b>Joi</b>, <b>14</b>, <b>Vineri</b>, <b>13</b>.',
       start:[{titlu:'Clubul de șah'},'Orele clubului:'],
       cere:[{tip:'tabel',dupa:'Orele clubului',c:2,r:2,celule:[['Joi','14'],['Vineri','13']]}],
       ajutor:'Clic după „:”, apoi Insert › Table; pe grilă 2 coloane și 2 rânduri. În celule: Joi, Tab, 14, Tab, Vineri, Tab, 13. Pe telefon, Tab e butonul de sub document.',
       why:'Tabelul a apărut sub rândul „Orele clubului:”, cu cele patru celule completate rând cu rând.'},
      {t:'choice',q:'Pasul cerea: „titlul aldin, de 16 pt”. Cum verifici în Word că l-ai făcut?',o:['Selectezi titlul: caseta de mărime arată 16, iar butonul B e aprins','Te uiți de departe la ecran: dacă titlul pare gros, e aldin','Mai apeși o dată B pe titlu, ca să fii sigur că a rămas aldin','Îl întrebi pe colegul de bancă dacă titlul arată bine'],ok:0,
       ajutor:'Unde îți arată Word mărimea și aldinul unui rând selectat?',why:'Valoarea o citești în Word, cu rândul selectat. Încă o apăsare pe B ar scoate aldinul.'}
     ]},

    /* ---------- PASUL 3: partea B ---------- */
    {t:'Partea B: singur, după o fișă',
     text:`<p>La partea B nu mai primești pașii. Primești o <mark>fișă de specificații</mark>, ca la lecția 9: ce trebuie să obții, cu numere. De exemplu: „foaia culcată; marginile de 2 cm; tabelul cu stilul Grid Table 4 - Accent 1; poza lată de 6 cm, nedeformată”.</p>
<p>Locul fiecărei cerințe îl găsești singur: foaia pe <b>Aspect (Layout)</b>, poza pe <b>Format imagine (Picture Format)</b>, tabelul pe <b>Proiectare tabel (Table Design)</b>. Ordinea bună, din lecția 9: întâi foaia, apoi literele și rândurile, apoi poza și tabelul.</p>`,
     exemplu:`${fig(I9+'verifici-poza.webp',390,165,'Fila Picture Format din Word, grupul Size: înălțimea 4 cm sus și lățimea 6 cm jos, încadrată cu roșu','De la lecția 9: grupul <b>Dimensiune (Size)</b>, jos lățimea pozei, <b>6 cm</b>.')}
<p>Poza creioanelor, nedeformată, are la 6 cm lățime 4 cm înălțime (lecția 9).</p>
<p class="gest"><b>La calculator, acum:</b> într-un document gol, deschide <b>Aspect (Layout)</b> › <b>Margini (Margins)</b> › <b>Margini particularizate (Custom Margins...)</b> și citește cele patru margini. Închide fereastra cu <b>Anulare (Cancel)</b>.</p>`,
     altfel:`<p>E ca la cumpărături cu o listă: „2 litri de lapte, 1 kg de mere”. Nimeni nu-ți spune în ce raft stau. Știi magazinul, le cauți singur și bifezi fiecare rând.</p>`,
     incearca:{t:'wordpag',q:'Lucrezi singur, după fișă: <b>marginile</b> de 2 cm pe fiecare parte (sus, jos, stânga, dreapta); <b>poza</b> lată de 5 cm (se acceptă între 4,5 și 5,5 cm), nedeformată.',
       start:{bl:[{titlu:'Vizita la cetate'},'Clasa a VII-a a vizitat Cetatea Neamțului. Iată locul unde am fost:',{poza:{w:8,h:6,alt:'poza cetății'}}]},
       verif:[{ce:'Marginile au 2 cm pe fiecare parte',pagina:{m:{sus:2,jos:2,st:2,dr:2}}},{ce:'Poza are între 4,5 și 5,5 cm lățime',poza:{wmin:4.5,wmax:5.5}},{ce:'Poza nu e turtită',poza:{prop:true}}],
       sol:{m:[2,2,2,2],poza:{w:5,h:3.75}},
       tipic:{m:[2,2,2,2],poza:{w:5,h:6}},
       ajutor:'Marginile: Layout › Margins › Custom Margins..., în fiecare casetă 2, apoi OK. Poza: clic pe ea, trage de mânerul din colț până când caseta Width (Lățime) arată 5 cm.',
       why:'Marginile sunt de 2 cm, iar poza a ajuns la 5 cm lățime, tot din colț, deci nu s-a turtit.'},
     inca:[
      {t:'wordfmt',unelte:['caractere','paragraf'],q:'Lucrezi singur, după fișă: titlul <b>Ora de lectură</b>: Arial, 18 pt, aldin, centrat.',
       start:['Ora de lectură','În fiecare vineri citim câte o poveste și vorbim despre ea.'],
       verif:[{ce:'Titlul: Arial, 18 pt, aldin',text:'Ora de lectură',font:'Arial',sz:18,b:1},{ce:'Titlul e centrat',par:1,al:'center'}],
       tipic:[{text:'Ora de lectură',font:'Arial',sz:18}],
       ajutor:'Selectează titlul. Caseta Font: Arial; caseta de mărime: 18; apoi B și Center.',
       why:'Fiecare valoare din fișă e acum în Word: Arial, 18, B aprins, Center aprins.'},
      {t:'choice',q:'Fișa cere: „tabelul cu stilul Grid Table 4 - Accent 1”. Unde îl alegi?',o:['Un clic în tabel, apoi fila Proiectare tabel (Table Design), galeria Stiluri de tabel','Fila Aspect (Layout), butonul Margini (Margins), apoi Margini particularizate (Custom Margins...)','Fila Pornire (Home), grupul Font, caseta Font, unde alegi stilul literelor din tabel','Fila Inserare (Insert), butonul Tabel (Table), apoi încă o dată grila cu pătrățele'],ok:0,
       ajutor:'Ce filă apare doar când cursorul e în tabel?',why:'Stilul tabelului e pe fila Proiectare tabel (Table Design), care apare după un clic în tabel (lecția 7).'}
     ]},

    /* ---------- PASUL 4: partea A ---------- */
    {t:'Partea A: o situație nouă, cu explicație',
     text:`<p>La partea A primești o situație pe care n-ai mai văzut-o: un document nou, pe care îl faci potrivit pentru ce e. Nimeni nu-ți spune ce e greșit sau ce unealtă iei. Metoda:</p>
<ol class="pasi-met"><li>Citește cerința: pentru cine e documentul și unde ajunge (pe avizier, pe o foaie).</li>
<li>Treci prin regulile paginii îngrijite (lecția 8): spațiile și semnele, Enter-ul, alinierea, fonturile, o singură pagină.</li>
<li>Repară, apoi verifică cu ¶ și cu previzualizarea (${K('Ctrl+P')}).</li>
<li>Explică într-o propoziție de ce ai lucrat așa.</li></ol>`,
     exemplu:`<p>O explicație bună spune regula pe care ai folosit-o, nu „așa mi-a plăcut”. De exemplu: „Am pus tot textul în același font, pentru că o pagină cu multe fonturi pare dezordonată.”</p>
<p class="gest"><b>La calculator, acum:</b> într-un document gol, scrie <i>Ne vedem joi</i>, cu două spații între „vedem” și „joi”. Pornește <b>¶</b> (fila <b>Pornire (Home)</b>, grupul <b>Paragraf (Paragraph)</b>): vezi ··. Dă un clic chiar în fața cuvântului „joi” și apasă ${BS} o dată: din ·· rămâne un singur ·, adică un spațiu. Oprește ¶ și închide cu ${K('Ctrl+W')} › <b>Nu salvați (Don't Save)</b>.</p>`,
     altfel:`<p>E ca atunci când mergi prima dată în vizită la bunicii unui prieten: n-ai mai fost acolo, dar știi regulile de politețe. Le aplici singur, fără să ți le spună cineva, și poți spune de ce.</p>`,
     incearca:{t:'wordteh',previz:false,q:'Situație nouă: biletul de mai jos se lipește în caiete. Fă-l să respecte regulile din lecția 8. Ce e greșit afli singur: pornește ¶ și uită-te la spații și la semne.',
       start:['Mâine , la ora 8,venim cu echipament de sport.Nu uitați apa !'],tinta:['Mâine, la ora 8, venim cu echipament de sport. Nu uitați apa!'],
       verif:[{ce:'Niciun spațiu înaintea semnelor',fara:'spatiuInainte'},{ce:'Un spațiu după fiecare semn din mijlocul textului',fara:'lipitDupa'},{ce:'Textul e exact cel cerut',tinta:true}],
       tipic:['Mâine, la ora 8,venim cu echipament de sport. Nu uitați apa!'],
       ajutor:'Înainte de virgulă și de „!” nu se pune spațiu. După virgula și punctul din mijlocul textului, un spațiu.',
       why:'Semnele sunt lipite de cuvântul dinainte și au un spațiu după ele: regula din lecția 8, aplicată pe un bilet nou.'},
     inca:[
      {t:'choice',q:'Ai șters rândurile goale de la sfârșitul unui afiș. Care explicație e bună?',o:['Rândurile goale împingeau semnătura pe pagina a doua, iar afișul trebuia să încapă pe o foaie','Rândurile goale nu-mi plăceau, iar pagina arăta mai frumos, după gustul meu, fără ele','Așa a făcut și colegul de bancă la afișul lui, iar al lui a ieșit foarte bine','Word oricum șterge singur rândurile goale când tipărești, deci nu contează dacă rămân'],ok:0,
       ajutor:'O explicație bună spune ce s-ar fi întâmplat altfel și ce regulă ai urmat.',why:'Spune ce făceau rândurile goale (o a doua pagină) și ce cerea situația (o singură foaie). Word nu șterge singur rândurile goale.'},
      {t:'classify',q:'Ce regulă din lecția 8 încalcă fiecare greșeală?',cats:['Spațiile și semnele','Enter-ul și alinierea','O singură pagină'],
       items:[['„sala 12.Aduceți”',0],['„joi , după ore”',0],['Un titlu adus la mijloc cu spații',1],['Enter apăsat la capătul fiecărui rând',1],['Un rând rătăcit pe a doua pagină',2]],
       ajutor:'Spațiile și semnele: unde stă spațiul lângă virgulă și punct. Enter-ul și alinierea: cum se rup și cum se așază rândurile. Pagina: ce încape pe foaie.',
       why:'Lângă semne: spațiul după punct, nu înaintea virgulei. Titlul se așază cu Center, iar Enter se apasă doar la sfârșit de paragraf. Un rând rătăcit pe pagina a doua strică regula „o singură pagină”.'}
     ]},

    /* ---------- PASUL 5: verifică-ți lucrarea ---------- */
    {t:'Înainte să predai: verifică-ți lucrarea',
     text:`<p>Înainte să predai, verifică-ți lucrarea cu lista asta:</p>
<ul><li>fiecare cerință e făcută: selectezi și citești valoarea în Word (fontul, mărimea, lățimea pozei, marginile), nu o ghicești din ochi (lecția 9);</li>
<li>cu ¶ pornit: niciun ·· în plus, niciun ¶ în mijlocul unei propoziții, niciun rând gol făcut cu Enter (lecția 8);</li>
<li>bara de stare arată <b>Page 1 of 1</b>, dacă se cere o pagină, iar ${K('Ctrl+P')} arată pagina întreagă (lecția 8);</li>
<li>fișierul e salvat cu numele tău (lecția 3).</li></ul>`,
     exemplu:`<div class="doua-poze">${fig('img/ex-buna.webp',898,597,'Lucrarea bună Expoziția de toamnă în Word: titlul aldin la mijloc, paragraful, poza creioanelor nedeformată la mijloc, tabelul albastru și semnătura la dreapta, pe o singură pagină','Lucrarea bună: totul pe o pagină.')}
${fig('img/ex-slaba.webp',898,951,'Aceeași lucrare, slabă, pe două pagini, una sub alta: titlul neîngroșat și puțin într-o parte, poza turtită și lățită, tabelul fără culori; pe pagina a doua stă doar semnătura','Lucrarea slabă: două pagini.')}</div>
<p>Aceeași fișă, două lucrări, desenate de Word.</p>
<p class="gest"><b>La calculator, acum:</b> într-un document al tău, de exemplu cel de la lecția 9, apasă ${K('Ctrl+P')} și citește sub pagină „1 of 1” sau „1 of 2”. Înapoi cu <kbd>Esc</kbd>.</p>`,
     altfel:`<p>E ca la pilotul unui avion: înainte de decolare citește lista de verificare rând cu rând, chiar dacă a zburat de o mie de ori. Lista nu se bazează pe memorie.</p>`,
     incearca:{t:'classify',q:`Mai jos e lucrarea slabă de la „Uite cum”. Fișa ei cerea: titlul aldin, la mijloc; poza nedeformată; tabelul cu stilul Grid Table 4 - Accent 1 (antet albastru); totul pe o singură pagină; tabelul cu 2 coloane și 3 rânduri, sub „Desenele expuse:”; paragraful sub titlu, deasupra pozei. Sortează cerințele.${fig('img/ex-slaba.webp',898,951,'Lucrarea slabă pe două pagini, una sub alta: titlul neîngroșat și puțin într-o parte, poza turtită, tabelul fără culori, semnătura singură pe pagina a doua','Lucrarea slabă, cele două pagini.')}`,
       cats:['Respectată','Nerespectată'],
       items:[['Titlul: aldin, la mijloc',1],['Poza: nedeformată',1],['Tabelul: cu antet albastru',1],['Totul pe o singură pagină',1],['Tabelul: 2 coloane și 3 rânduri, sub „Desenele expuse:”',0],['Paragraful: sub titlu, deasupra pozei',0]],
       ajutor:'Ia cerințele pe rând și caută fiecare în poză: e titlul gros? are poza aceeași formă ca în lucrarea bună? câte pagini sunt?',
       why:'Titlul nu e aldin și nici la mijloc, poza e turtită, tabelul n-are stilul, iar semnătura a fugit pe pagina a doua. Tabelul și paragraful sunt la locul lor.'},
     inca:[
      {t:'tf',q:'Ai mărit zoomul la 200%. Titlul pare acum foarte mare, dar caseta de mărime arată tot 20. Titlul are 20 pt.',ok:true,
       ajutor:'Zoomul schimbă documentul sau doar ce vezi pe ecran?',why:'Adevărat. Zoomul mărește doar ce vezi (lecția 3). Mărimea literelor o spune caseta de mărime.'},
      {t:'choice',q:'Fișa cere poza lată de 6 cm. Unde citești lățimea pozei?',o:['Clic pe poză, fila Format imagine (Picture Format), grupul Dimensiune (Size), caseta de jos','Pe rigla de deasupra paginii: numeri cu ochiul centimetrii de la un capăt al pozei la altul','În bara de stare, jos, lângă Page 1 of 1, unde Word scrie mărimea obiectului ales','Pe fila Pornire (Home), în caseta de mărime (Font Size), după un clic pe poză'],ok:0,
       ajutor:'Ce filă apare după un clic pe poză?',why:'Lățimea pozei e în grupul Dimensiune (Size) al filei Format imagine (Picture Format): caseta de jos (lecția 9).'}
     ]}
   ],

   /* ---------- ATELIERUL: proba de antrenament, cu punctaj ---------- */
   atelier:{t:'probafmt',titlu:'Atelier: proba de antrenament, cu punctaj',
    intro:`<p><strong>Proba de antrenament</strong>, în Word-ul simulat: 6 exerciții pe părțile lucrării. C1 și C2 · De bază (câte 20 de puncte), B1 și B2 · Consolidat (câte 15), A1 și A2 · Avansat (12 și 8), plus 10 din oficiu. Nu e lucrarea profesorului: e un antrenament.</p>
<ol><li>Lucrezi tot exercițiul, apoi apeși <b>Verifică</b>. Punctele se socotesc la <b>prima</b> apăsare, ca la lucrare, unde predai o dată. Abia apoi vezi bifele testelor și indiciul. Dacă apeși pe documentul neatins, nu se socotește nimic.</li>
<li>Apoi <b>Încă un exercițiu</b>. Dacă nu ți-a ieșit, mai încerci; după a doua încercare greșită apare „Arată-mi răspunsul”.</li>
<li>După A2 vezi punctajul, nota și ce ai de recitit.</li></ol>
<p><b>Cum lucrezi aici:</b> un clic (o atingere) pune cursorul; selectezi trăgând (pe telefon, cu degetul). Panglica e cea din Word, în engleză. Pe telefon nu ai tastele Ctrl, Enter și Tab: folosești butoanele de sub document; panglica se derulează în lateral. Pe telefon, mai multe rânduri goale la rând le ștergi așa: atingi începutul primului rând scris de sub ele și apeși ${BS} până urcă.</p>
<details class="verif"><summary>Întâi spune cine ești</summary>Proba se salvează pe numele din caseta de jos a paginii. Dacă scrie „Spune cine ești”, apasă pe ea și înscrie-te. Dacă scrie numele altui elev, apasă pe el, apoi <b>Nu ești tu? Schimbă elevul</b>. Sus pot apărea întrebări de felul „Verificarea se scrie pe numele …. Ești …?”: apasă <b>Da</b> doar dacă e numele tău. Dacă ai venit după alt elev, apasă <b>Sunt alt elev / Încep din nou</b>, din panoul probei.</details>`,
    proba:'C1',unelte:['caractere','paragraf'],
    q:`${PARTE.C} <b>C1.</b> Anunțul zilei sportului. Fă pașii în ordine:<ol><li>Selectează titlul <b>Ziua sportului</b> trăgând peste el.</li><li>Apasă <b>B</b> (aldin).</li><li>În caseta de mărime (<b>Font Size</b>) alege <b>20</b>.</li><li>Apasă <b>Center</b> (centrat).</li><li>Dă un clic în paragraful lung și apasă <b>Justify</b> (stânga-dreapta).</li><li>Dă un clic în ultimul rând și apasă <b>Align Right</b> (la dreapta).</li></ol>`,
    start:['Ziua sportului','Vineri, 20 noiembrie, toate clasele de gimnaziu ies în curtea școlii la întreceri de alergare, sărituri și fotbal. Echipele se fac pe clase, iar fiecare elev aduce apă și echipamentul de sport.','Profesorul de sport'],
    verif:[{ce:'Titlul e aldin',text:'Ziua sportului',b:1,puncte:4,lectia:L6a},
           {ce:'Titlul are 20 pt',text:'Ziua sportului',sz:20,puncte:4,lectia:L6f},
           {ce:'Titlul e centrat',par:1,al:'center',puncte:4,lectia:L6al},
           {ce:'Paragraful lung e stânga-dreapta',par:2,al:'justify',puncte:4,lectia:L6al},
           {ce:'Ultimul rând e la dreapta',par:3,al:'right',puncte:4,lectia:L6al},{ce:'Doar titlul e aldin și de 20 pt',text:'Ziua sportului',b:1,sz:20,doar:true,puncte:0,lectia:L6a}],
    tipic:[{text:'Ziua sportului',b:1,sz:20},{par:1,al:'center'}],
    ajutor:'Titlul: trage peste el, apoi B; în caseta de mărime 20; apoi Center. Paragraful lung: un clic în el, Justify. Ultimul rând: un clic în el, Align Right.',
    why:'Titlul e aldin, de 20 pt și la mijloc; paragraful are ambele margini drepte, iar semnătura stă la dreapta.',
    inca:[
     {t:'probaobj',proba:'C2',titlu:'Atelier: proba, exercițiul C2',
      q:`${PARTE.C} <b>C2.</b> Referatul despre excursie. Fă pașii în ordine:<ol><li>Dă un clic la capătul rândului <b>Ce am plătit:</b>, după ultima literă. Apoi <b>Inserare (Insert)</b> › <b>Tabel (Table)</b> și alege pe grilă <b>2x3</b> (2 coloane, 3 rânduri).</li><li>Scrie în celule, rând cu rând, cu <b>Tab</b> între ele: <b>Ce</b> și <b>Lei</b>; <b>Bilet</b> și <b>15</b>; <b>Vaporul</b> și <b>20</b>.</li><li>Dă un clic la capătul paragrafului „Am mers cu autocarul…”, după ultima literă, și apasă <b>Enter</b>.</li><li>Pe rândul gol: <b>Inserare (Insert)</b> › <b>Imagini (Pictures)</b> › <b>Acest dispozitiv… (This Device…)</b>, poza <b>lacul-bicaz.jpg</b>, <b>Inserare (Insert)</b>.</li></ol>`,
      start:[{titlu:'Excursia la Lacul Bicaz'},'Am mers cu autocarul până la baraj, apoi ne-am plimbat cu vaporul pe lac.','Ce am plătit:'],
      cere:[{tip:'tabel',dupa:'Ce am plătit',c:2,r:3,celule:[['Ce','Lei'],['Bilet','15'],['Vaporul','20']]},{tip:'poza',dupa:'Am mers cu autocarul',fisier:'lacul-bicaz.jpg'}],
      punctaj:[{ce:'Textul de la început a rămas cum era',puncte:2,lectia:L4c,paza:true},
               {ce:'Sub „Ce am plătit:” e un tabel',puncte:3,lectia:L4t},
               {ce:'Tabelul are 2 coloane și 3 rânduri',puncte:3,lectia:L4t},
               {ce:'În celule scrie exact ce cere sarcina',puncte:3,lectia:L4t},
               {ce:'Poza lacul-bicaz.jpg e în document',puncte:2,lectia:L4p},
               {ce:'Poza lacul-bicaz.jpg stă singură pe rândul ei',puncte:2,lectia:L4c},
               {ce:'Poza e imediat sub „Am mers cu autocarul…”',puncte:3,lectia:L4c},
               {ce:'Nu sunt obiecte în plus',puncte:2,lectia:L4t,paza:true}],
      ajutor:'Tabelul: clic după „:”, Insert › Table, grila 2 coloane și 3 rânduri; în celule cu Tab între ele. Poza: clic după „lac.”, Enter, apoi Insert › Pictures › This Device…, lacul-bicaz.jpg, Insert. Pe telefon, Enter și Tab sunt butoanele de sub document.',
      why:'Fiecare obiect a ajuns unde era cursorul: tabelul sub „Ce am plătit:”, poza singură pe rândul ei, sub paragraf.'},
     {t:'probapag',proba:'B1',titlu:'Atelier: proba, exercițiul B1',
      q:`${PARTE.B} <b>B1.</b> Fișa concursului de istorie. Lucrezi singur, după fișa de specificații:<ul class="fisa-mica"><li><b>Foaia:</b> culcată, <b>Vedere (Landscape)</b>.</li><li><b>Marginile:</b> 2 cm sus, jos, stânga și dreapta.</li><li><b>Tabelul:</b> stilul <b>Grid Table 4 - Accent 1</b>, cu bifa <b>Header Row</b> pusă.</li><li><b>Poza:</b> lată de 6 cm (se acceptă între 5,5 și 6,5 cm), nedeformată.</li></ul><p class="hint">Pe telefon: apasă de două ori butonul <b>+</b> de sub foaie, apoi atinge cuvântul „Zimbrii”, din tabel.</p>`,
      start:{bl:[{titlu:'Concursul de istorie'},'Echipele au răspuns la întrebări despre Cetatea Neamțului. Iată punctele lor:',{tabel:{cols:[4,3,4,3],rows:[['Echipa','Clasa','Căpitanul','Puncte'],['Zimbrii','a VII-a A','Ioana Rusu','27'],['Străjerii','a VII-a B','Matei Pop','25']]}},'Locul despre care au fost întrebările:',{poza:{w:9,h:6.75,alt:'poza cetății'}}]},
      verif:[{ce:'Foaia e culcată (Landscape)',pagina:{or:'vedere'},puncte:3,lectia:L7f},
             {ce:'Marginile au 2 cm pe fiecare parte',pagina:{m:{sus:2,jos:2,st:2,dr:2}},puncte:4,lectia:L7f},
             {ce:'Tabelul are stilul Grid Table 4 - Accent 1, cu bifa Header Row pusă',tabel:{stil:'Grid Table 4 - Accent 1',antet:true},puncte:4,lectia:L7t},
             {ce:'Poza are între 5,5 și 6,5 cm lățime și nu e turtită',poza:{wmin:5.5,wmax:6.5,prop:true},puncte:4,lectia:L7p}],
      sol:{or:'vedere',m:[2,2,2,2],poza:{w:6,h:4.5},tabel:{stil:'Grid Table 4 - Accent 1'}},
      tipic:{or:'vedere',m:[2,2,2,2],poza:{w:6,h:6.75},tabel:{stil:'Grid Table 4 - Accent 1'}},
      ajutor:'Foaia: Layout › Orientation › Landscape. Marginile: Layout › Margins › Custom Margins..., 2 în fiecare casetă, OK. Tabelul: clic în el, Table Design, ▾ (More) al galeriei; la Grid Tables, primul rând cu antetul negru, al doilea model. Poza: clic pe ea, trage de mânerul din colț până la 6 cm lățime.',
      why:'Foaia, marginile, tabelul și poza sunt acum exact ca în fișă.'},
     {t:'probafmt',proba:'B2',unelte:['caractere','paragraf'],titlu:'Atelier: proba, exercițiul B2',
      q:`${PARTE.B} <b>B2.</b> Invitația la serbare. Lucrezi singur, după fișa de specificații:<ul class="fisa-mica"><li><b>Titlul „Serbarea de iarnă”:</b> Georgia, 24 pt, aldin, albastru (<b>Blue</b>), centrat.</li><li><b>Paragraful lung:</b> stânga-dreapta, alineat de 1,25 cm (<b>Special: First line</b>), spațiere de 1,5 rânduri (<b>1.5 lines</b>).</li><li><b>Ultimul rând:</b> cursiv, la dreapta.</li></ul>`,
      start:['Serbarea de iarnă','Dragi părinți, vă invităm vineri, 18 decembrie, la ora 17, în sala de festivități. Elevii clasei a VII-a vor cânta colinde și vor juca o scenetă despre iarnă.','Diriginta clasei'],
      verif:[{ce:'Titlul: Georgia, 24 pt, aldin',text:'Serbarea de iarnă',font:'Georgia',sz:24,b:1,puncte:3,lectia:L6f},
             {ce:'Titlul e albastru',text:'Serbarea de iarnă',col:'albastru',puncte:2,lectia:L6f},
             {ce:'Titlul e centrat',par:1,al:'center',puncte:2,lectia:L6al},
             {ce:'Paragraful lung e stânga-dreapta',par:2,al:'justify',puncte:2,lectia:L6al},
             {ce:'Paragraful lung are alineat de 1,25 cm',par:2,prim:1.25,puncte:2,lectia:L6s},
             {ce:'Paragraful lung are spațiere de 1,5 rânduri',par:2,rand:1.5,puncte:2,lectia:L6s},
             {ce:'Ultimul rând e cursiv',text:'Diriginta clasei',i:1,puncte:1,lectia:L6a},
             {ce:'Ultimul rând e la dreapta',par:3,al:'right',puncte:1,lectia:L6al}],
      tipic:[{text:'Serbarea de iarnă',font:'Georgia',sz:24,b:1},{par:1,al:'center'},{par:2,al:'justify'}],
      ajutor:'Titlul: selectează-l; caseta Font: Georgia; mărimea: 24; B; săgeata ▾ de lângă A: Blue (al optulea pătrățel din Standard Colors); Center. Paragraful: clic în el, Justify; săgeata mică ↘ a grupului Paragraph: Special First line, By 1,25 cm, Line spacing 1.5 lines, OK. Ultimul rând: selectează-l, I, apoi Align Right.',
      why:'Fiecare rând al fișei e acum în Word: literele titlului, alinierea, alineatul și spațierea paragrafului, rândul de la sfârșit.'},
     {t:'probateh',proba:'A1',titlu:'Atelier: proba, exercițiul A1',
      q:`${PARTE.A} <b>A1.</b> Situație nouă. Anunțul bibliotecii se tipărește pe <b>o singură foaie</b> și se pune la avizier. Pregătește-l pentru tipar: să respecte regulile unei pagini îngrijite (lecția 8) și să încapă pe o pagină. Ce e greșit nu-ți spune nimeni: găsește singur, repară, apoi verifică în previzualizare.`,
      start:A1_START,tinta:A1_TINTA,ceInainteUnul:'Anunțul respectă regulile unei pagini îngrijite (lecția 8) și încape pe o singură pagină',
      verif:[{ce:'Niciun spațiu înaintea semnelor, un spațiu după ele, nimic lipit în paranteză',ceInainte:'Spațiile de lângă semne',fara:['spatiuInainte','lipitDupa','paranteze'],paza:true,puncte:3,lectia:L8s},
             {ce:'Paragraful „Le puteți împrumuta…” e întreg (fără Enter în mijlocul propoziției)',ceInainte:'Paragrafele',paragraf:'Le puteți împrumuta câte două, pentru două săptămâni.',puncte:2,lectia:L8e},
             {ce:'Titlul e la mijloc, cu Center, fără spații în față',ceInainte:'Titlul',paragraf:'Cărți noi la bibliotecă',al:'center',puncte:2,lectia:L8e},
             {ce:'Textul de sub titlu are un singur font',ceInainte:'Fonturile',fonturiDe:{dela:2,max:1},paza:true,puncte:1,lectia:L8f},
             {ce:'Semnătura e la dreapta, cu Align Right, fără spații în față',ceInainte:'Semnătura',paragraf:'Biblioteca școlii',al:'right',puncte:1,lectia:L8e},
             {ce:'Anunțul încape pe o singură pagină',ceInainte:'Pagina',pagini:1,paza:true,puncte:2,lectia:L8f},
             {ce:'Ai verificat în previzualizare, după ultima schimbare',previzualizare:true,paza:true,puncte:1,lectia:L8v},
             {ce:'Literele și semnele anunțului au rămas aceleași',textPastrat:true,conditie:{prag:10},puncte:0,lectia:L8s}],
      tipic:[{t:'Cărți noi la bibliotecă',al:'center',f:{sz:20,b:1}},'Au sosit 40 de cărți noi: romane, povești și atlase. Le găsiți pe raftul de lângă fereastră.',
             'Le puteți împrumuta câte două, pentru două','săptămâni.',{t:'Bibliotecara vă așteaptă în pauza mare (la etajul întâi).',f:{font:'Courier New'}},{t:'Biblioteca școlii',al:'right'}],
      ajutor:'Pornește ¶ și ia regulile din lecția 8 pe rând: spațiile de lângă semne, ¶ din mijlocul propozițiilor, titlul și semnătura (fără spații în față, cu butoanele de aliniere), fontul fiecărui paragraf, rândurile goale. La final Ctrl+P.',
      why:'Anunțul e gata de tipar: încape pe o pagină și respectă regulile din lecția 8.'},
     {t:'probaalege',proba:'A2',titlu:'Atelier: proba, exercițiul A2',amesteca:true,
      q:`${PARTE.A} <b>A2.</b> Explicația. În anunțul de la A1, titlul era adus la mijloc cu spații. De ce e mai bine să-l pui la mijloc cu butonul <b>Center</b>?`,
      o:['Cu spații, titlul stă la mijloc doar cât nu schimbi nimic; la alte litere sau margini fuge într-o parte. Center îl ține la mijloc oricum.','Cu spații în față, documentul nu se mai poate salva ca .docx, iar Word cere atunci alt format, de exemplu .pdf, ca să-l păstreze.','Center face literele titlului mai mari și mai groase, deci titlul se citește mai ușor de departe, de pe avizier, decât cu spații.','La tipărire, Word șterge singur spațiile de la începutul rândului, deci titlul adus cu spații ajunge oricum în stânga foii.'],ok:0,
      mesaje:{1:'Documentul se salvează la fel, cu sau fără spații. Gândește-te ce se întâmplă cu titlul când schimbi mărimea literelor sau marginile.',2:'Center nu schimbă mărimea și nici grosimea literelor: doar așază rândul la mijloc.',3:'Word nu șterge spațiile tastate: le tipărește așa cum sunt, deci titlul rămâne unde l-au împins spațiile.'},
      ce:'Explicația: de ce titlul se pune la mijloc cu Center',lectia:L8e,
      why:'Butonul Center așază titlul la mijloc între margini, oricare ar fi mărimea literelor sau a marginilor. Spațiile îl mută doar pe ecranul de acum.'}
    ]},

   /* ---------- ÎNTREBĂRILE ---------- */
   qs:[
    {t:'choice',q:'Ai terminat lucrarea. Bara de stare arată Page 1 of 2, deși fișa cere o singură pagină, iar pe a doua pagină e doar semnătura. Ce faci întâi?',
     o:['Pornești ¶ și cauți rândurile goale făcute cu Enter','Faci toate literele de 8 pt, ca să încapă tot pe prima pagină','Ștergi semnătura de pe pagina a doua, ca să rămână o pagină','Apeși de mai multe ori Ctrl+P, până rămâne o singură pagină'],ok:0,
     ajutor:'Ce împinge, de obicei, un rând pe pagina a doua (lecția 8)?',why:'Rândurile goale făcute cu Enter împing textul spre pagina următoare. Cu ¶ pornit le vezi și le ștergi cu ⌫. Ctrl+P doar arată pagina.'},
    {t:'numar',q:'Ioana vrea nota 7 la lucrare. La C are 31 de puncte, la B are 20, plus cele 10 din oficiu. Cel puțin câte puncte îi trebuie la partea A?',eticheta:'Punctele la A',ok:4,tipic:9,
     capcane:{'9':'Cu 9 puncte are 70, nota 7, dar ajunge și mai puțin: la ,5 rotunjirea e în favoarea ei, deci și 65 de puncte dau nota 7.','14':'Ai uitat cele 10 puncte din oficiu? 31 + 20 + 10 = 61.','5':'Cu 5 puncte are 66, nota 7. Se poate și cu mai puțin: caută cel mai mic număr.','3':'Cu 3 puncte are 64 de puncte: 6,4 se rotunjește la 6, nu la 7.'},
     ajutor:'Ce punctaj dă nota 7, cel mai mic? Gândește-te la ,5. Apoi scade ce are deja: 31 + 20 + 10.',why:'Nota 7 vine de la 65 de puncte în sus: 65 : 10 = 6,5, rotunjit în favoarea ei. Are 31 + 20 + 10 = 61, deci îi mai trebuie cel puțin 4.'},
    {t:'wordfmt',unelte:['caractere','paragraf'],q:'Fă pașii: (1) selectează titlul <b>Cercul de robotică</b> trăgând peste el; (2) apasă <b>B</b>; (3) apasă <b>Center</b>.',
     start:['Cercul de robotică','Ne întâlnim miercuri, la ora 14, în laboratorul de informatică. Construim un robot care ocolește obstacolele.'],

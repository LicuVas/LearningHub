/* TEMA: sala de cinema — ecranul negru cu titlul filmului și genericul de final care urcă */

  --ink:#1F1B16; --ink2:#5E564B; --accent:#9A3412; --accentInk:#FFFFFF; --sel:#FBE6D8;
  --mark:#FFE38A; --markInk:#1F1B16; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

/* banda: ecranul negru al sălii, cu titlul la stânga și rândurile genericului de final la dreapta */
.banda{min-height:34px;padding:4px 10px;display:flex;align-items:center;gap:12px;background:#0E0D0B;overflow:hidden}
.banda .tit{font:700 13px/1 var(--fd);letter-spacing:.18em;color:#F6E7C8;white-space:nowrap}
.banda .gen{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}

.banda .gen i:nth-child(1){width:46%}.banda .gen i:nth-child(2){width:62%}.banda .gen i:nth-child(3){width:38%}

.trei img{width:100%;height:100%;object-fit:cover;display:block}

<script>
/* LECȚIA 15, clasa a VII-a, modulul 2 (revizuirea LearningHub, standardul din 27.09.2026 + regula 10 din 08.10.2026),
   scrisă 12.10.2026; reparată după judecata 1 (12.10.2026, seara: _verificare/registru_j1.md). Un nivel pe pași: pasul 0,
   5 pași cu „Încearcă” și cu un gest scurt în Clipchamp-ul adevărat, atelierul, pasul din laborator, 5 întrebări.
   Simulatorul: lectii/_sim/video-clipchamp.js (lecția 14) + extensia lectii/_sim/video-clipchamp-text.js (proprietar VII/15,
   1.1: fila Text, panoul textului, textul peste previzualizare, exportul). Clipchamp NU a fost pornit (aplicație din
   Magazin, cere cont): faptele vin din documentația oficială Microsoft (_proba/docs/citate_text.md) și din capturile
   Clipchamp în română ale jocului audio-video-vii. Afirmațiile: afirmatii.json. Imaginile: img/SURSE.json.
   Reparația J1: casetele „La calculator, acum” fac gesturile noi, în filmul copilului; laboratorul VERIFICĂ ce s-a făcut la
   pași, completează ce lipsește și exportă o singură dată (G1). La CC0 licența nu obligă, dar la școală scrii mereu autorul
   și sursa, ca la clasa a V-a (G2): genericul are autorii. Contul: formularea lecției 14 reparate (pașii 3, 4, 16, 18). */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/audio-video-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const S=x=>`<span class="simb">${x}</span>`;
const CEAS=t=>`<span class="ceas">${t}</span>`;
const PROG='Generice – suprapunerea textului peste scene';
/* scenele și muzica din lecția 14 (copiate aici; CC0, img/SURSE.json, surse.md §5) */
const S1='scena-1-dimineata.jpg',S2='scena-2-padure.jpg',S3='scena-3-lac.jpg',S4='scena-4-seara.jpg',MU='muzica-fundal.wav';
const TOATE=[S1,S2,S3,S4,MU];
const CAT={
  [S1]:{tip:'imagine',src:'img/scena-1-dimineata.webp',titlu:'dimineața',lum:LUM_L15[S1]},
  [S2]:{tip:'imagine',src:'img/scena-2-padure.webp',titlu:'pădurea',lum:LUM_L15[S2]},
  [S3]:{tip:'imagine',src:'img/scena-3-lac.webp',titlu:'lacul',lum:LUM_L15[S3]},
  [S4]:{tip:'imagine',src:'img/scena-4-seara.webp',titlu:'seara',lum:LUM_L15[S4]},
  [MU]:{tip:'audio',durata:24,fis:MU,unda:UNDE_L15.muzica,titlu:'muzica'}};
const DESCARCARI=[MU,S1,S2,S3,S4];
/* genericul de final, cu autorii (img/SURSE.json: dimineața mike anderson, pădurea Paul Gilmore, lacul Gugalcrom123,
   seara Joe deSousa; muzica Erik Satie, interpretare Teknopazzo; toate CC0, Wikimedia Commons): 15 cuvinte → 10 s */
const TITLU='O zi la munte';
const G_FOTO='Foto: Anderson, Gilmore, Gugalcrom123, deSousa',G_MUZ='Muzica: Erik Satie, Teknopazzo',G_LIC='CC0, Wikimedia Commons';
const GEN='Montaj: Ana Pop\n'+G_FOTO+'\n'+G_MUZ+'\n'+G_LIC;
const GEN_VECHI='Montaj: Ana Pop\nImagini și muzică: Wikimedia Commons, CC0';   /* fără autori: drumul greșit al exercițiilor */
const RG=s=>`<span class="rand-gen">${s}</span>`;
const GEN_RANDURI=nume=>RG('Montaj: '+nume)+RG(G_FOTO)+RG(G_MUZ)+RG(G_LIC);
const T_AUTORI_FOTO={ce:'Genericul are rolul („Montaj:”) și autorii fotografiilor',textContine:['Montaj:','Anderson','Gilmore','Gugalcrom123','deSousa'],cum:'În căsuța Text: Montaj: și numele, apoi, pe rândul 2, Foto: Anderson, Gilmore, Gugalcrom123, deSousa.'};
const T_AUTORI_MUZ={ce:'Genericul are autorii muzicii, licența și de unde sunt',textContine:['Montaj:','Satie','Teknopazzo','CC0','Wikimedia Commons'],cum:'Rândul 3: Muzica: Erik Satie, Teknopazzo; rândul 4: CC0, Wikimedia Commons.'};
const T_RANDURI={ce:'Genericul e pe patru rânduri (Enter între ele)',textRanduri:{contine:['Montaj'],min:4},cum:'În căsuța Text, la capătul fiecărui rând apasă Enter.'};
const T_DOUA_ORI={ce:'Genericul stă cât să fie citit de două ori',textDeDouaOri:{contine:['Montaj']},cum:'Numără cuvintele: la fiecare 3, cel puțin 2 secunde. 15 cuvinte cer 10 secunde: mânerul din dreapta al genericului până la 0:28. Pe telefon, dacă 0:28 nu încape pe ecran: trage mânerul până la margine, apasă Potrivește și trage din nou.'};
const T_MUZ_INTREAGA={ce:'Muzica merge până la capătul ei (0:24)',muzicaIntreaga:MU,cum:'Clic pe muzică, apoi trage mânerul ei din dreapta până la 0:24: mai departe nu merge, fișierul are 24 de secunde.'};
/* proiectul cu care rămâne elevul după lecția 14: 4 scene (seara 6 s), Estompare încrucișată lac → seară, muzica 0:00-0:18 */
const P14=o=>Object.assign({ecran:'editor',nume:'O zi la munte',media:TOATE.slice(),descarcari:DESCARCARI,
  video:[[S1,4],[S2,4],[S3,4],[S4,6]],audio:[{m:MU,start:0,durata:18,vol:70}],tranz:[{intre:[S3,S4],nume:'Estompare încrucișată',durata:2}]},o||{});
const CUTITLU=o=>P14(Object.assign({text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48}]},o||{}));
const V=o=>Object.assign({t:'videoclipchamptext',catalog:CAT,sunet:true},o);
const dl=n=>`<a href="${n}" download>${n}</a>`;
const DESC_TOATE=`<span class="desc">${TOATE.map(dl).join(', ')}</span>`;
const MINI=(img,txt,cul,top,lit)=>`<div><img src="img/${img}.webp" alt="" loading="lazy"><b style="color:${cul};${top}">${txt}</b><span>${lit}</span></div>`;
/* Laboratorul (reparat după J1, 12.10.2026). G1: elevul vine de la casetele „La calculator, acum”, deci de obicei e deja în
   editor, în filmul lui: pasul 2 îl lasă acolo și îl trimite la verificări (8-12); exportul (13-14) se face doar dacă n-a
   exportat la pași sau a schimbat ceva după. Pașii 3, 4, 16 și 18: formularea lecției 14 reparate (contul). Pașii 6-7: drumul
   de rezervă, literal (M4). Numerele pașilor numiți în text: 5, 6-7, 8, 15, 16 — de verificat la orice schimbare a listei. */
const PROVOCARE=[
  `Pune căștile de pe masa ta (nu băga și nu scoate cabluri).`,
  `Clipchamp e deja deschis de la pași, cu filmul tău (sus scrie numele lui, cu <code>munte</code> la capăt)? Rămâi în el: al cui e contul ai verificat când l-ai pornit. Sari la pasul 8. E deschis alt proiect? Întoarce-te la pagina de pornire: butonul cu trei linii (≡) › <b>Înapoi la pagina de pornire (Back to home)</b>. Nu găsești butonul? Închide Clipchamp cu ✕ și pornește-l din nou. Nu e deschis? Pornește-l: <b>Start</b>, scrii <b>Clipchamp</b>, clic. Nu apare sau îți cere să-l instalezi din <b>Microsoft Store</b>? Nu-l instala: sari la ultimul pas.`,
  `Îți cere să te conectezi? Te conectezi doar cu contul TĂU, primit de la profesor. Dacă Windows te întreabă dacă să-ți țină minte contul pe calculatorul ăsta, pentru toate aplicațiile, nu accepta: alege să te conectezi doar la aplicația asta. Nu știi ce să alegi? Nu te conecta: sari la ultimul pas. N-ai unul? <b>Nu-ți face cont</b> și nu scrie parola nimănui: sari la ultimul pas.`,
  `Înainte să lucrezi, uită-te <b>al cui e contul</b>: pe pagina de pornire, apasă <b>pictograma de utilizator</b>, sus în dreapta; îți arată contul conectat. Lucrezi doar dacă e contul TĂU. E al altcuiva (al unui coleg, al profesorului) sau nu știi al cui e? Nu deschide nimic în el: închide Clipchamp cu ✕, sari la ultimul pas și spune-i profesorului.`,
  `Pe pagina de pornire, clic pe proiectul tău din lecția 14 (cel cu <code>munte</code> la capăt). S-a deschis, cu scenele și muzica? Sari la pasul 8. Nu e acolo, sau Clipchamp îți cere să găsești fișierele? Nu le căuta singur: întoarce-te la pagina de pornire (din editor: ≡ › <b>Înapoi la pagina de pornire</b>) și fă proiectul din nou, la pașii 6 și 7.`,
  `Proiectul din nou, partea 1. Descarcă fotografiile și muzica: ${DESC_TOATE}. Pe pagina de pornire apasă <b>Creați un videoclip nou (Create a new video)</b> sau <b>Videoclip necompletat (Blank video)</b>. Sus, apasă pe numele proiectului; dacă numele vechi nu dispare, șterge-l. Scrie numele TĂU după regula din lecția 3, cu <code>munte</code> la capăt, apoi ${K('Enter')}.`,
  `Proiectul din nou, partea 2. În stânga, <b>Importați conținutul media</b>; în fereastra <b>Deschidere</b>: <b>Descărcări</b>, clic pe prima fotografie, ${K('Ctrl')} + clic pe celelalte trei și pe <b>muzica-fundal</b> (pe cele fără (1) la capăt), apoi <b>Deschidere</b>. Trage fotografiile pe linia de timp, în ordine: dimineața, pădurea, lacul, seara. Seara: mânerul din dreapta până la ${CEAS('0:18')}. Muzica: sub scene, la ${CEAS('0:00')}, cu mânerul din dreapta tot până la ${CEAS('0:18')}.`,
  `Titlul: l-ai pus la pași? Nu mai pune altul. Clic pe el și uită-te: începe la ${CEAS('0:00')} și se termină la ${CEAS('0:04')}? Dacă nu, trage-l de mijloc sau de mâner. Nu e pus? În stânga, fila <b>Text</b>, apoi <b>+</b> pe <b>Text simplu</b> (nu-l vezi? ține mouse-ul pe el). Clic pe clipul de text; în dreapta, la fila <b>Text</b>, în căsuța <b>Text</b>, scrie titlul filmului (2-5 cuvinte). Trage-l de mijloc la ${CEAS('0:00')}, apoi mânerul din dreapta până la ${CEAS('0:04')}.`,
  `Titlul se citește? Clic pe el; în dreapta schimbi, dacă trebuie, <b>Poziție (Position)</b>, <b>Culoare (Color)</b>, <b>Dimensiune (Size)</b>. La tine pot avea alt nume sau pot sta într-un mic meniu, deasupra textului. Apoi privește de departe: dă căștile jos, lasă-le pe masă și ridică-te lângă scaun (nu pleca de lângă masă). Îl citești fără efort? Dacă nu, repară și privește din nou.`,
  `Genericul de final: l-ai pus la pași? Nu mai pune altul: clic pe el și citește-l în căsuța Text. Are aceste patru rânduri, cu numele tău? ${GEN_RANDURI('numele tău')} Lipsește un rând? Scrie-l, cu ${K('Enter')} între rânduri. Nu e pus deloc? Un <b>Text simplu</b>, tras după seara, la ${CEAS('0:18')} (sau unde se termină seara la tine), cu cele patru rânduri.`,
  `Numără cuvintele genericului: la fiecare 3 cuvinte, cel puțin 2 secunde. Cu un nume din două cuvinte are 15, deci 10 secunde. Clic pe el și trage-i mânerul din dreapta până la ${CEAS('0:28')} (mai departe, dacă numele tău e mai lung). Apoi clic pe muzică și trage-i mânerul din dreapta până la capătul ei, ${CEAS('0:24')}: mai departe nu merge, fișierul are 24 de secunde.`,
  `Apasă ${S('|◀')}, apoi ${S('▶')} (sau bara de spațiu) și privește tot filmul, până la capăt. Apuci să citești titlul și genericul de două ori? Se văd două texte unul peste altul? Dacă da, mută-le trăgând de mijloc, unul după altul (mânerele schimbă doar cât stau pe ecran), și privește din nou.`,
  `Exportul: l-ai făcut la pași și de atunci n-ai mai schimbat nimic? Nu mai exporta: sari la pasul 15. Altfel, uită-te întâi sus, la numele proiectului: e numele tău, cu <code>munte</code> la capăt? Dacă nu, apasă pe el și scrie-l, apoi ${K('Enter')}. La unele conturi, exportul pornește imediat ce alegi calitatea, fără căsuță pentru nume.`,
  `Apasă <b>Exportați (Export)</b>, sus, în dreapta. Vezi căsuța <b>Numele fișierului</b>? Scrie în ea numele tău, ca al proiectului. Abia apoi, la <b>Calitate</b>, alege <b>1080 p</b>. Dacă vezi comutatorul <i>Store in the cloud</i> („păstrează în nor”: filmul ar urca și pe internet, în contul tău), lasă-l oprit: noi îl vrem doar pe calculator. Apasă <b>Exportați</b>, dacă butonul e acolo, și așteaptă să se termine. A rămas deschisă fereastra exportului? Închide-o (✕), ca să vezi iar editorul.`,
  `Deschide <b>Explorer</b>, apoi <b>Descărcări (Downloads)</b>: e acolo fișierul tău <code>.mp4</code>? Vezi numele tău de două ori, unul cu <b>(1)</b> la capăt? Ai exportat de două ori: de obicei, cel cu (1) e cel nou. Dublu clic pe el, privește-l, apoi închide fereastra filmului. Nu e acolo? Scrie în caiet ce ți-a arătat Clipchamp la sfârșitul exportului și spune-i profesorului.`,
  `Clipchamp salvează singur proiectul, cât e conectat la internet: așteaptă să se termine salvarea și încărcarea fotografiilor și a muzicii (cu internet, de obicei câteva secunde; nu te grăbi). Apoi te <b>deconectezi</b>, ca următorul elev să nu lucreze în contul tău: butonul cu trei linii (≡) › <b>Înapoi la pagina de pornire (Back to home)</b>; acolo, <b>pictograma de utilizator</b>, sus în dreapta › <b>Deconectare (Sign out)</b>. Nu găsești butonul ≡ sau Deconectare? Nu pleca: închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta că ai rămas conectat.`,
  `Închide Clipchamp cu ✕. Fotografiile, muzica și filmul <code>.mp4</code> le lași în Descărcări: proiectul are nevoie de ele data viitoare, la calculatorul ăsta. Dacă altă dată Clipchamp îți cere fișierele, nu le căuta singur: spune-i profesorului.`,
  `<b>Dacă oricând nu poți merge mai departe</b> (Clipchamp nu apare sau nu pornește, n-are internet, cere un cont pe care nu-l ai, e deschis în contul altcuiva, nu merge importul sau exportul): te-ai conectat cu contul tău? Deconectează-te întâi, ca la pasul 16 (nu poți? închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta). Apoi fă din nou atelierul din pagină, până la capăt, și scrie în caiet, rând cu rând, genericul de final al filmului tău. Spune-i profesorului încă din ora asta (dacă e cu cealaltă clasă, la sfârșitul orei) ce s-a întâmplat, mai ales dacă Clipchamp era deschis în contul altcuiva.`
];

JocMotor.porneste({
  cheie:'lectie_vii_m2_l15',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/vii/, „Lecția 15”, pasul din laborator înainte de verificare
  titlu:'Generice: suprapunerea textului peste scene',
  marca:'Lecția 15 · <b>Titlul și genericul</b>',
  h1:'Generice: <em>suprapunerea textului peste scene</em>',
  clasa:'a VII-a', unitate:'VII-U2', unitateTitlu:'Aplicații audio și audio-video',
  competente:['CS.1.2','CS.3.2'], lectii:'15',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.2, CS.3.2 · unitatea VII-U2 „Aplicații audio și audio-video” · lecția 15 din modulul 2 · conținutul: „Generice – suprapunerea textului peste scene”',
  banda:'<span class="tit">O ZI LA MUNTE</span><span class="gen"><i></i><i></i><i></i></span>',
  intro:`<p>Filmul tău „O zi la munte”, din lecția 14, primește un titlu peste prima scenă și un generic de final, cu numele tău, cu autorii fotografiilor și ai muzicii și cu sursele lor. Le faci să se citească, apoi exporți filmul: un fișier pe care îl poate vedea oricine. Exersezi întâi în pagină, apoi în Clipchamp-ul adevărat, la calculator.</p>
<p><b>Ai nevoie de:</b> lecția 14 (proiectul „munte”: scenele pe linia de timp, mânerele, muzica sub scene, previzualizarea cu ${S('|◀')} și ${S('▶')}). Lecția 12: proiectul se deschide doar în aplicația lui. Lecția 3: <b>Descărcări</b> și regula numelui. Lecția 13: muzica CC0. Din clasa a V-a: extensia unui fișier și lecția 15, „Drepturile de autor” (licențele libere: domeniu public, Creative Commons; autorul se scrie mereu).</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, faci exercițiul „Încearcă tu” și gestul scurt din Clipchamp-ul adevărat. Sub previzualizarea din pagină, rândul <b>„Text pe ecran”</b> îți spune ce text se vede la capul de redare, cu culoarea, mărimea și locul lui. Pe telefon, apasă întâi <b>+ Mărește</b> la linia de timp, ca un clip de text să fie destul de lat pentru deget; ca să muți un clip departe, apasă întâi <b>Potrivește</b> (tot filmul încape pe ecran); un mâner de dus mai departe decât se vede îl tragi până la margine, apeși <b>Potrivește</b> și tragi din nou. Un clip ales are mânere la capete: dacă e îngust și-l prinzi mereu de mâner, apasă întâi pe un loc gol al pistei, apoi trage-l de mijloc.</p>`,
  nivele:[
{t:'Generice: suprapunerea textului peste scene',lectii:[15],continuturi:[PROG],final:true,
 obiectiv:'pui peste scene un titlu și un generic de final care se citesc, cu numele tău, autorii și sursele materialelor, și exporți filmul ca fișier .mp4.',
 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Orice film începe cu un titlu și se termină cu un generic: cine l-a făcut și ce a folosit. La filmul clasei, la reportajul de la excursie sau la prezentarea unei cărți faci la fel: scrii text peste imagini.</p>
<p>Azi îi pui filmului tău „O zi la munte” un titlu și un generic de final cu sursele, apoi îl faci fișier, ca să-l poți arăta oricui.</p>
${fig('img/generic-inceput.webp',960,405,'Începutul unui film de animație: titlul mare FOSSILS peste un desen cu fosile, iar dedesubt numele autorului','Un titlu peste o scenă, cu autorul dedesubt („Fossils”, 2021). Imagine: Piti Yindee, <a href="https://commons.wikimedia.org/wiki/File:Piti_Yindee_-_Fossils_(2021)_-_Title_Card.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a>.')}
${fig('img/generic-final.webp',960,540,'Un generic de final pe negru: în stânga rolurile, în dreapta numele oamenilor, cu litere albe','Un generic de final (exemplu, în finlandeză): în stânga rolul, în dreapta numele. Imagine: Zunter, <a href="https://commons.wikimedia.org/wiki/File:Esimerkki_lopputekstit.png" target="_blank" rel="noopener">Wikimedia Commons</a>, domeniu public.')}`},
  /* ---------- pasul 1 ---------- */
  {t:'Titlul: text peste prima scenă',
   text:`<p>Un <mark>generic</mark> e text scris peste imaginile filmului. <b>Genericul de început</b> spune titlul; <b>genericul de final</b>, cine a făcut filmul și de unde sunt imaginile și muzica.</p>
<p>Cum pui titlul:</p>
<ol><li>în stânga apeși fila <b>Text</b>;</li>
<li>la <b>Text simplu</b> apeși <b>+</b> (nu-l vezi? ține mouse-ul pe el) sau îl tragi pe linia de timp: apare un clip de text pe <b>pista Text</b>, deasupra scenelor;</li>
<li>dai clic pe el; în dreapta, la fila <b>Text</b>, în căsuța <b>Text</b>, ștergi ce scrie și scrii titlul.</li></ol>
${fig(J+'clipchamp-text.webp',910,498,'Clipchamp: în stânga panoul Text, cu Text simplu și stilurile de text; în dreapta, în previzualizare, textul Interviu la bibliotecă scris peste imagine','Fila <b>Text</b>, cu <b>Text simplu</b>; în previzualizare, titlul.')}
<p class="gest"><b>La calculator, acum:</b> pornește Clipchamp; te conectezi doar cu contul TĂU (n-ai? nu-ți face; Windows vrea să-l țină minte? nu accepta). Pictograma de utilizator, sus, în dreapta, îți arată al cui e. Al tău? Deschide proiectul din lecția 14 (cel cu „munte” la capăt) și pune titlul. Nu? Închide cu ✕ și lucrează în pagină. Când pleci, chiar dacă n-ai terminat, te deconectezi: ≡ › <b>Înapoi la pagina de pornire (Back to home)</b> › pictograma de utilizator › <b>Deconectare (Sign out)</b>; nu găsești? Închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta.</p>`,
   exemplu:`<p>Titlul filmului tău: „O zi la munte”. Clipul de text stă pe pista Text, deasupra scenelor, deci se vede peste ele cât ține. Pe pista lui nu strică scenele: dacă îl ștergi (clic pe el, apoi ${K('Delete')}), scenele rămân neatinse.</p>`,
   altfel:`<p>E ca un bilețel autocolant lipit pe o fotografie din album: se vede peste poză, dar îl poți dezlipi fără s-o strici.</p>`,
   incearca:V({start:P14(),
    q:`Pune titlul peste prima scenă: fila <b>Text</b>, apoi <b>+</b> pe <b>Text simplu</b> (sau trage-l pe linia de timp, deasupra scenelor). Clic pe clipul de text și, în dreapta, în căsuța Text, scrie <b>${TITLU}</b>. Dacă textul nu începe la 0:00, trage-l de mijloc, cât mai la stânga.`,
    teste:[{ce:'Titlul „O zi la munte” e scris',textScris:TITLU,cum:'Clic pe clipul de text; în dreapta, în căsuța Text, șterge „Text” și scrie O zi la munte, apoi dă clic în altă parte.'},
           {ce:'Titlul începe la 0:00',textLa:{text:TITLU,de:[0,0.15]},cum:'Trage clipul de text de mijloc spre stânga: se lipește de 0:00.'},
           {ce:'În film e un singur text',nrTexte:1,cum:'Un text pus în plus se scoate: clic pe el, apoi Delete.'}],
    solutie:[{fila:'text'},{textNou:['simplu',0]},{textScrie:[0,TITLU]}],gresit:[{fila:'text'},{textNou:['simplu',10]},{textScrie:[0,TITLU]}],
    ajutor:'Fila Text › + pe Text simplu › clic pe clipul de text › căsuța Text din dreapta.',
    why:'Textul stă pe pista lui, deasupra scenelor, și se vede peste ele cât ține clipul de text.'}),
   inca:[
    {t:'classify',q:'Filmul „O zi la munte”: în ce generic pui fiecare rând?',cats:['Genericul de început','Genericul de final'],
     items:[['O zi la munte',0],['Montaj: Ana Pop',1],['Foto: Anderson, Gilmore, Gugalcrom123, deSousa',1],['Mulțumim profesorului de geografie',1]],
     ajutor:'Începutul spune ce film vezi; finalul spune cine l-a făcut și cu ce.',why:'La început stă titlul; la final, cine a lucrat, autorii materialelor și mulțumirile.'},
    V({start:P14({text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48},{text:'Text',start:8,durata:5}]}),
     q:'Colegul a uitat pe pista Text un clip pe care scrie doar „Text”, la 0:08. Scoate-l: clic pe el, apoi tasta Delete (sau butonul 🗑 Ștergeți). Titlul rămâne.',
     teste:[{ce:'Clipul „Text” uitat a dispărut',nrTexte:1,cum:'Clic pe clipul „Text” de pe pista Text, apoi Delete.'},
            {ce:'Titlul „O zi la munte” e tot acolo',textScris:TITLU,cum:'Ai șters titlul? ↶ Anulare (Ctrl+Z) îl aduce înapoi.'}],
     solutie:[{textSterge:1}],gresit:[{textSterge:0}],
     ajutor:'Clipul uitat e cel din dreapta, de la 0:08.',why:'Un text ales se șterge cu Delete; scenele de dedesubt rămân neatinse.'})
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Când apare și cât stă pe ecran',
   text:`<p>Pe pista Text, clipul de text arată <b>când</b> apare textul și <b>cât</b> stă pe ecran. Îl tragi de mijloc ca să-l muți. Dai clic pe el și tragi de <b>mânere</b>, ca la scene: spre dreapta stă mai mult, spre stânga mai puțin.</p>
<p>Cât să stea? Cât îl poate citi oricine <b>de două ori</b>. Ca să citești fără grabă, socotești cam <b>3 cuvinte pe secundă</b> (așa se socotesc subtitrările la televizor): la fiecare 3 cuvinte lași cel puțin 2 secunde. Și cât mai puține cuvinte: un titlu bun are 2-5.</p>
<p class="gest"><b>La calculator, acum:</b> trage titlul la ${CEAS('0:00')} și, cu mânerul din dreapta, potrivește-l până la ${CEAS('0:04')}, cât prima scenă. Apasă ${S('|◀')}, apoi ${S('▶')}: apuci să-l citești de două ori?</p>`,
   exemplu:`<p>„O zi la munte” are 4 cuvinte: o citire ține cam o secundă și jumătate, două citiri cam 3 secunde. Îl lași 4 secunde, cât prima scenă, de la ${CEAS('0:00')} la ${CEAS('0:04')}.</p>
<p>Un titlu de 9 cuvinte cere cel puțin 6 secunde: 9 : 3 = 3 secunde pentru o citire, de două ori, 6.</p>
<p>Două texte care stau pe ecran în același timp se văd unul peste altul și nu se mai citesc: le pui unul după altul.</p>`,
   altfel:`<p>E ca tabla din clasă: dacă profesorul o șterge prea repede, nu apuci să copiezi. Cu cât a scris mai mult, cu atât trebuie s-o lase mai mult timp.</p>`,
   incearca:V({start:P14({text:[{text:TITLU,start:2,durata:2,poz:'jos',marime:48}]}),
    q:'Titlul apare abia la 0:02 și stă doar 2 secunde. Fă-l să înceapă la <b>0:00</b> (trage-l de mijloc) și să țină până la <b>0:04</b>, cât prima scenă (clic pe el, apoi mânerul din dreapta).',
    teste:[{ce:'Titlul începe la 0:00',textLa:{text:TITLU,de:[0,0.15]},cum:'Trage clipul de text de mijloc spre stânga, până la 0:00.'},
           {ce:'Titlul se termină la 0:04',textPanaLa:{text:TITLU,de:[3.85,4.15]},cum:'Clic pe titlu, apoi trage mânerul din dreapta până la 0:04 (pe telefon, apasă întâi + Mărește).'}],
    solutie:[{textMuta:[0,0]},{textCapat:[0,4]}],gresit:[{textMuta:[0,0]}],
    ajutor:'Întâi îl muți (de mijloc), apoi îl lungești (mânerul din dreapta).',
    why:'Mutarea schimbă când apare textul; mânerul schimbă cât stă pe ecran.'}),
   inca:[
    {t:'choice',q:'Titlul „Toamna în pădurea de lângă școală” are 6 cuvinte. Cât trebuie să stea pe ecran, cel puțin, ca să fie citit de două ori?',
     o:['4 secunde','2 secunde','1 secundă','12 secunde'],ok:0,
     ajutor:'Câte cuvinte citești într-o secundă? Și de câte ori trebuie citit?',why:'6 cuvinte : 3 = 2 secunde pentru o citire; de două ori, 4 secunde.'},
    V({start:P14({text:[{text:'O zi la munte, de dimineața până seara târziu',start:0,durata:2,poz:'jos',marime:40}]}),
     q:'Titlul are 9 cuvinte, dar stă doar 2 secunde. Lungește-l cu mânerul din dreapta, cât să poată fi citit de două ori.',
     teste:[{ce:'Titlul stă destul cât să fie citit de două ori',textDurataMin:{contine:['seara tarziu'],min:6},cum:'9 cuvinte : 3 = 3 secunde pentru o citire; de două ori, 6. Trage mânerul din dreapta până la 0:06 sau mai departe.'},
            {ce:'Titlul începe tot la 0:00',textLa:{contine:['seara tarziu'],de:[0,0.15]},cum:'Trage doar mânerul din dreapta, nu tot clipul.'}],
     solutie:[{textCapat:[0,6]}],gresit:[{textCapat:[0,4]}],
     ajutor:'Socotește întâi: 9 : 3, apoi de două ori.',why:'9 cuvinte cer cel puțin 6 secunde: 3 pentru o citire, de două ori.'})
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Textul se citește: contrast, mărime, loc',
   text:`<p>Un generic bun se citește ușor. Verifici trei lucruri:</p>
<ol><li><mark>contrastul</mark>, cât de tare se deosebește textul de imaginea de sub el: text deschis pe o parte întunecată, text închis pe o parte luminoasă;</li>
<li><b>mărimea</b>: litere mari, care se citesc și din fundul clasei;</li>
<li><b>locul</b>: o parte a imaginii fără multe amănunte, de o singură culoare (cerul, apa, pădurea).</li></ol>
<p>Le schimbi în dreapta, în panoul textului: <b>Culoare (Color)</b>, <b>Dimensiune (Size)</b>, <b>Poziție (Position)</b>: sus, la mijloc, jos (la tine, numele pot fi altele). Unele texte au și <b>Culoare de fundal (Background color)</b>, o bandă sub litere; dacă textul tău n-o are, îl muți sau îi schimbi culoarea.</p>
<p class="gest"><b>La calculator, acum:</b> alege pentru titlu locul, culoarea și mărimea. Privește de departe: căștile jos, pe masă, și ridică-te lângă scaun (nu pleca de lângă masă). Îl citești fără efort? Dacă nu, repară.</p>`,
   exemplu:`<p>Pe scena de dimineață, sus e cerul aproape alb, iar jos pădurea e aproape neagră. Un titlu alb se citește jos, pe pădure; sus, pe cer, dispare. Dacă vrei titlul sus, îl faci negru.</p>
<p>Verificarea de departe: dacă îl citești fără efort și în picioare, lângă scaun, e bun.</p>`,
   altfel:`<p>E ca atunci când scrii cu creta: pe tabla neagră se vede, pe peretele alb nu. Pe un afiș cu multe culori, scrii pe o bandă de hârtie albă.</p>`,
   incearca:V({start:P14({text:[{text:TITLU,start:0,durata:4,poz:'sus',culoare:'alb',marime:16}]}),
    q:'Titlul e alb, mic și stă sus, peste cerul aproape alb al dimineții: nu se citește. Fă-l să se citească: mută-l pe pădurea întunecată (clic pe el; în dreapta, Poziție: <b>Jos</b>) sau fă-l negru, și pune <b>Dimensiunea</b> cel puțin <b>48</b>. Apoi apasă „Privește ca de departe”, sub fereastră.',
    teste:[{ce:'Titlul se deosebește bine de imaginea de sub el',textCitet:{text:TITLU},cum:'Alb pe cer alb nu se vede: mută-l jos, pe pădure (Poziție: Jos), sau alege Culoare: negru.'},
           {ce:'Dimensiunea titlului e cel puțin 48',textMarime:{text:TITLU,min:48},cum:'Clic pe titlu; în dreapta, la Dimensiune, alege 48 sau mai mult.'}],
    solutie:[{textPoz:[0,'jos']},{textMarime:[0,48]}],gresit:[{textMarime:[0,48]}],
    ajutor:'Jos, pădurea e întunecată: acolo albul se vede.',
    why:'Textul alb se citește pe o parte întunecată a imaginii, iar literele mari se văd și de departe.'}),
   inca:[
    {t:'choice',q:`Care titlu se citește cel mai bine?<div class="trei">${MINI('scena-1-dimineata','O zi la munte','#FFFFFF','top:8%','A')}${MINI('scena-1-dimineata','O zi la munte','#FFD400','bottom:10%','B')}${MINI('scena-1-dimineata','O zi la munte','#9AA0A6','top:44%','C')}</div>`,
     o:['A','B','C'],ok:1,amesteca:false,
     ajutor:'Unde e imaginea întunecată și unde e luminoasă?',why:'B: galben pe pădurea întunecată, jos. A e alb pe cerul alb, C e gri pe ceața gri: se pierd în imagine.'},
    V({start:P14({text:[{text:'Seara pe munte',start:12,durata:6,poz:'sus',culoare:'galben',marime:48}]}),
     q:'Ana vrea titlul „Seara pe munte” <b>galben</b> și <b>sus</b>, peste cerul portocaliu deschis al serii. Așa nu se citește. Fă-l să se citească fără să-l muți și fără să-i schimbi culoarea: dă-i o <b>Culoare de fundal</b> (aici o are; în Clipchamp, doar unele texte).',
     teste:[{ce:'Titlul „Seara pe munte” se citește',textCitet:{text:'Seara pe munte'},cum:'Clic pe titlu; în dreapta, Culoare de fundal: negru.'},
            {ce:'Titlul e tot galben',textCuloareEste:{text:'Seara pe munte',culoare:'galben'},cum:'Culoarea literelor rămâne galbenă: schimbi doar Culoarea de fundal.'},
            {ce:'Titlul e tot sus',textPozEste:{text:'Seara pe munte',poz:'sus'},cum:'Nu-l muta: în dreapta, Poziție: Sus îl pune la loc.'}],
     solutie:[{textFundal:[0,'negru']}],gresit:[{textCuloare:[0,'negru']}],
     ajutor:'Galbenul se vede bine pe negru.',why:'Pe o bandă neagră, textul galben se citește oriunde l-ai pune.'})
   ]},
  /* ---------- pasul 4 ---------- */
  {t:'Genericul de final: cine și de unde',
   text:`<p>Genericul de final spune <b>cine</b> a făcut filmul, rolul și numele („Montaj: Ana Pop”), și <b>de unde</b> sunt imaginile și muzica: autorul, licența, locul. Ce te obligă licența:</p>
<ul><li><b>CC0</b>: folosești fără să ceri voie, iar licența nu te obligă la nimic. La școală scrii totuși autorul, licența și de unde e, ca la domeniul public din clasa a V-a;</li>
<li><b>CC BY</b>: autorul și licența sunt obligatorii; scrii și de unde e, iar dacă ai schimbat imaginea, spui.</li></ul>
<p>Îl pui după ultima scenă, pe locul gol: acolo, Clipchamp arată negru. Rândul nou: ${K('Enter')}.</p>
<p class="gest"><b>La calculator, acum:</b> pune un Text simplu la ${CEAS('0:18')}, după seara, și scrie genericul din „Uite cum”, cu numele tău după „Montaj:”, cu ${K('Enter')} între rânduri. Lungește-l până la ${CEAS('0:28')}, apoi trage mânerul muzicii până la capătul ei, ${CEAS('0:24')}.</p>`,
   exemplu:`<p>Genericul tău, pe negru, de la ${CEAS('0:18')} la ${CEAS('0:28')}:</p><p>${GEN_RANDURI('Ana Pop')}</p>
<p>Autorii, de pe paginile fișierelor: Anderson (dimineața), Gilmore (pădurea), Gugalcrom123 (lacul), deSousa (seara); muzica, de Erik Satie, cântată de Teknopazzo. 15 cuvinte: 5 secunde pentru o citire, 10 pentru două. Muzica are 24 de secunde: o lungești până la capătul ei, ${CEAS('0:24')}; ultimele 4 secunde ale genericului trec în liniște.</p>`,
   altfel:`<p>E ca bilețelul de sub un desen dintr-o expoziție: cine l-a făcut și de unde a luat modelul. La CC BY, autorul cere să-i scrii numele; la CC0 nu cere nimic, dar la școală îl scrii oricum.</p>`,
   incearca:V({start:CUTITLU({fila:'text'}),
    q:'Fă genericul de final: pune un <b>Text simplu</b> după seara, la <b>0:18</b> (trage-l pe linia de timp, după ultima scenă). În căsuța Text scrie cele patru rânduri, cu Enter între ele: <b>Montaj:</b> și numele tău; <b>Foto: Anderson, Gilmore, Gugalcrom123, deSousa</b>; <b>Muzica: Erik Satie, Teknopazzo</b>; <b>CC0, Wikimedia Commons</b>. Fă-l să țină cât să fie citit de două ori (cu un nume din două cuvinte, până la 0:28). Apoi trage mânerul din dreapta al muzicii până la capătul ei, 0:24.',
    teste:[T_AUTORI_FOTO,T_AUTORI_MUZ,T_RANDURI,
           {ce:'Genericul începe după ultima scenă (pe negru)',textDupaFilm:{contine:['Montaj']},cum:'Trage clipul de text de mijloc până la 0:18, după seara.'},
           T_DOUA_ORI,T_MUZ_INTREAGA],
    solutie:[{textNou:['simplu',18]},{textScrie:[1,GEN]},{textCapat:[1,28]},{capat:[MU,24]}],gresit:[{textNou:['simplu',18]},{textScrie:[1,GEN_VECHI]},{textCapat:[1,24]},{capat:[MU,24]}],
    ajutor:'Textul după seara; cele patru rânduri; mânerul textului până la 0:28, apoi al muzicii până la 0:24.',
    why:'Genericul de final stă pe negru, după ultima scenă, cu rolul, autorii, licența și locul de unde sunt materialele; muzica merge până la capătul ei.'}),
   inca:[
    {t:'choice',q:'Fotografia „Pădure de brazi”, de Ion Pop, de pe Wikimedia Commons, are licența CC BY 4.0. Ce scrii în genericul de final?',
     o:['Foto: „Pădure de brazi”, Ion Pop, CC BY 4.0, Wikimedia Commons','Foto: „Pădure de brazi”, de pe internet, descărcată gratuit','Foto: „Pădure de brazi”, de pe Wikimedia Commons, fără licență','Foto: „Pădure de brazi”, Ion Pop, gratuită, de pe internet'],ok:0,
     ajutor:'Ce cere CC BY?',why:'CC BY cere autorul și licența; scrii și titlul fotografiei și de unde e.'},
    {t:'choice',q:'Fotografia „Lac de munte”, de Maria Ene, de pe Wikimedia Commons, are licența CC0. Ce scrii în genericul filmului tău de la școală?',
     o:['Foto: „Lac de munte”, Maria Ene, CC0, Wikimedia Commons','Nimic: la o fotografie CC0 nu scrii nimic în generic','Foto: „Lac de munte”, de pe internet, descărcată gratis','Foto: „Lac de munte”, Wikimedia Commons, fără autor'],ok:0,
     ajutor:'La școală, ce scrii mereu, chiar dacă licența nu te obligă?',why:'CC0 nu te obligă la nimic, dar la școală scrii mereu autorul, licența și de unde e, ca la domeniul public.'},
    {t:'tf',q:'Pentru o fotografie CC0 de pe Wikimedia Commons trebuie să-i ceri voie autorului înainte s-o pui în film.',ok:false,

  /* ---------- pasul 5 ---------- */
  {t:'Exportul: filmul devine un fișier .mp4',
   text:`<p>Proiectul din Clipchamp se deschide doar în Clipchamp, ca proiectul Audacity din lecția 12. Ca să-ți arăți filmul oricui, faci <mark>exportul</mark>: Clipchamp face din proiect un fișier video, cu extensia <b>.mp4</b>.</p>
<ol><li>sus, în dreapta, apeși <b>Exportați (Export)</b>;</li>
<li>la <b>Numele fișierului</b> scrii numele, dacă vezi căsuța;</li>
<li>la <b>Calitate</b> alegi <b>1080 p</b>: calitate înaltă, bună pentru videoproiector (<b>720 p</b> face un fișier mai mic);</li>
<li>apeși <b>Exportați</b> și aștepți până se termină.</li></ol>
<p>La unele conturi, exportul pornește chiar când alegi calitatea, fără căsuță pentru nume: de aceea dai întâi proiectului numele tău, ca în lecția 14. Fișierul ajunge, de obicei, în <b>Descărcări</b>.</p>
${fig(J+'clipchamp-export.webp',850,485,'Fereastra Exportați videoclipul din Clipchamp: la Calitate e aleasă 1080 p, în dreapta Numele fișierului, cu .mp4 la capăt, și butonul Exportați','Fereastra <b>Exportați videoclipul</b>: <b>Calitate</b> 1080 p (încadrată) și <b>Numele fișierului</b>, cu <b>.mp4</b> la capăt.')}
<p class="gest"><b>La calculator, acum:</b> exportă filmul: întâi numele tău după regula din lecția 3, cu <code>munte</code> la capăt, apoi 1080 p. Apoi deschide <b>Descărcări</b> și caută fișierul <code>.mp4</code>.</p>`,
   exemplu:`<p>În fișierul .mp4 totul e lipit: scenele, titlul, genericul, muzica. Nu-l mai poți desface pe piste. De aceea păstrezi proiectul: o greșeală o corectezi în proiect, apoi exporți din nou.</p>`,
   altfel:`<p>E ca la o prăjitură: rețeta o păstrezi, ca s-o mai poți face o dată, și altfel; prăjitura gata o dai celorlalți. Din prăjitură nu mai scoți ouăle.</p>`,
   incearca:V({export:true,start:CUTITLU({nume:'Videoclip fără titlu',text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48},{text:GEN,start:18,durata:10}],audio:[{m:MU,start:0,durata:24,vol:70}]}),
    q:'Filmul e gata. Exportă-l: sus, în dreapta, <b>Exportați</b>; la Numele fișierului scrie <b>Pop_Mihai_7A_munte</b> (filmul e al lui Pop Mihai, din a VII-a A); la Calitate, <b>1080 p</b>; apoi <b>Exportați</b> și așteaptă să se termine.',

    solutie:[{exporta:{calitate:'1080p',nume:'Pop_Mihai_7A_munte'}}],gresit:[{exporta:{calitate:'720p',nume:'Pop_Mihai_7A_munte'}}],
    ajutor:'Butonul Exportați e sus, în dreapta, deasupra previzualizării.',

    {t:'classify',q:'Proiectul din Clipchamp sau fișierul .mp4 exportat?',cats:['Proiectul din Clipchamp','Fișierul .mp4'],
     items:[['Îl deschizi în Clipchamp și mai muți titlul',0],['Îl trimiți bunicii și îl vede pe telefon',1],['Are scenele, textele și muzica pe piste separate',0],['Totul e lipit într-un singur film',1]],
     ajutor:'Care se mai poate schimba pe piste?',why:'Proiectul are pistele, deci se mai schimbă. Fișierul .mp4 e filmul gata, lipit, pe care îl vede oricine.'},
    {t:'choice',q:'Ai exportat filmul, apoi ai văzut o greșeală în genericul de final. Ce faci?',

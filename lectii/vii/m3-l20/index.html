<style>
:root{
  --desk:#EEF3F8; --paper:#FFFFFF; --paper2:#F2F6FA; --line:#D2DCE7;
  --ink:#17222E; --ink2:#4F5D6E; --accent:#1A5FB4; --accentInk:#FFFFFF; --sel:#DCE8F7;
  --mark:#FFE7A0; --markInk:#17222E; --ok:#1C7A47; --okbg:#E1F2E7; --bad:#B42318; --badbg:#FBE5E2;
  --fd:"Albert Sans","Segoe UI",system-ui,sans-serif; --fb:"Albert Sans","Segoe UI",system-ui,sans-serif; --fm:"Azeret Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0E141C; --paper:#16202B; --paper2:#1C2836; --line:#33435A;
  --ink:#E7EEF7; --ink2:#A9B7C8; --accent:#8DB8F2; --accentInk:#0E141C; --sel:#25384F;
  --mark:#E8C45A; --markInk:#17222E; --ok:#6CD39A; --okbg:#163024; --bad:#FF8C82; --badbg:#3A1C1A;
}}
:root[data-theme="dark"]{
  --desk:#0E141C; --paper:#16202B; --paper2:#1C2836; --line:#33435A;
  --ink:#E7EEF7; --ink2:#A9B7C8; --accent:#8DB8F2; --accentInk:#0E141C; --sel:#25384F;
  --mark:#E8C45A; --markInk:#17222E; --ok:#6CD39A; --okbg:#163024; --bad:#FF8C82; --badbg:#3A1C1A;
}
/* banda de sus: o foaie cu rânduri în trei culori (trei autori) și un ceas cu săgeată (istoricul) — doar CSS */
.banda{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:38px;padding:4px 12px;overflow:hidden;
  background:linear-gradient(180deg,#DCE8F7 0,#F2F6FA 100%)}
.banda .b-foaie{display:flex;flex-direction:column;gap:3px;width:62px;padding:5px 6px;border:1.5px solid #1A5FB4;border-radius:2px;background:#fff}
.banda .b-foaie i{display:block;height:3px;border-radius:2px}
.banda .b-foaie i:nth-child(1){background:#137333;width:90%}
.banda .b-foaie i:nth-child(2){background:#B3261E;width:70%}
.banda .b-foaie i:nth-child(3){background:#7B1FA2;width:80%}
.banda .b-ceas{width:20px;height:20px;border:2px solid #1A5FB4;border-radius:50%;position:relative;background:#fff}
.banda .b-ceas::before{content:"";position:absolute;left:8px;top:3px;width:2px;height:7px;background:#1A5FB4}
.banda .b-ceas::after{content:"";position:absolute;left:8px;top:9px;width:6px;height:2px;background:#1A5FB4}
h1{font-size:clamp(1.4rem,5.2vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:480px}
figure.captura figcaption a{display:inline-block;padding:7px 2px;margin:-7px 0}
details.tel{margin:.6em 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
details.tel summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;box-sizing:border-box}
details.tel p{margin:0;padding:0 12px 10px}
details.tel a{display:inline-block;padding:6px 0}
.reading ol li,.reading ul li{margin:.2em 0}
.cod{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:0 4px;word-break:break-all}
/* „Acum în Google, adevărat” (regula 10): gesturi mici, reale, imediat după pas (ca în VII/18) */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:800;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum .acum-tel{margin:.35em 0 0;font-size:.92em;color:var(--ink2)}
/* reparația P (24.10.2026, judecata 2): legătura „atelierul lecției” din laborator are cel puțin 32 px pe telefon (regula 20) */
ol.aplicatie-reala a{display:inline-block;padding:6px 0}
.vers-l{margin:.3em 0 .3em 1.1em;padding:0}
.vers-l li{margin:.15em 0}

<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/colab-google.js"></script>
<script src="../../_sim/colab-google-istoric.js"></script>
<script>
/* ======================================================================================================
   Lecția VII · M3 · nr. 20 — „Publicare și modificare de conținut. Istoricul editării și contribuția fiecăruia”
   (VII-U3, CS.1.3). Aplicația = Google (Documente Google), cu contul Google de la școală (decizia dirijorului,
   23.10.2026, m3_noapte_23_10/prompturi/_noapte.md §1), ca VII/18-19.
   Simulatorul: lectii/_sim/colab-google.js (al lecției 18) + extensia MEA lectii/_sim/colab-google-istoric.js
   (modul Sugerare, sugestiile, istoricul versiunilor, Permite accesul, Fișier → Descarcă / Publică pe web) — tipul colabIstoric.
   SIGURANȚA: persoanele, adresele și documentele sunt INVENTATE (domeniul .test e rezervat pentru exemple); ce tastează
   elevul nu se salvează și nu pleacă nicăieri (proba: _proba/proba_lectie.py, în surse.md).
   Numele din interfață: ajutorul Google în română (surse.md); cele NESIGURE trecute acolo și în capturi_lipsa.json.
   Granița: partajarea cu echipa, rolurile, comentariile = lecția 19; etica = 21; conectarea = 18.
   ====================================================================================================== */
const CONT=['Operații permise în aplicație: publicare, modificare conținuturi în aplicația colaborativă'];
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;
/* reparația O (24.10.2026, judecata 2): rândul de telefon în FIECARE bloc „Acum…”, ca la VII/18-19 (istoricul nu e în aplicația de telefon) */
const TEL='<b>Pe telefon:</b> sari peste; pașii tăi sunt la laborator.';
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în documentul adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol><p class="acum-tel">${TEL}</p></div>`;
/* reparația D (24.10.2026): contul e deschis de la P1 până la pasul 13 al laboratorului → rândul lui VII/18 (PAUZA) în fiecare bloc „Acum…” */
const PAUZA='Sună de pauză? Întâi <b>Profil</b> → <b>Deconectează-te</b>.';
const D=SimColabGoogle.DOMENIU;                       // scoala-exemplu.test (inventat)
const PROF='profesor.tic@'+D;                         // adresa INVENTATĂ a profesorului din exerciții
const CI_=o=>Object.assign({t:'colabIstoric'},o);
const ANA=SimColabGoogle.CONTURI.ana, RADU=SimColabGoogle.CONTURI.radu;

/* ---------- documentul echipei Anei: „Ghidul școlii - echipa 2” (4 paragrafe, 4 versiuni) ---------- */
const G1='Școala noastră are trei etaje și o curte mare, cu un tei bătrân.';
const G2='Biblioteca este la etajul întâi. Acolo găsești cărți de aventuri și enciclopedii.';
const G3='Laboratorul de informatică are douăzeci de calculatoare. La plecare, fiecare elev se deconectează.';
const G4='Vă așteptăm cu drag în școala noastră!';
/* ghid({p1:'…',p3:'…'}) = aceleași versiuni, cu alt text în paragrafele date (din versiunea în care apar) */
function ghid(t){t=t||{};const T=k=>t[k]!=null?t[k]:{p1:G1,p2:G2,p3:G3,p4:G4}[k];
  const P=(id,aut)=>({id,autor:aut,text:T(id)});
  return [
    {id:'v1',cand:'joi, 11 februarie, 17:05',autori:['ana'],par:[P('p1','ana')]},
    {id:'v2',cand:'joi, 11 februarie, 18:20',autori:['radu'],par:[P('p1','ana'),P('p2','radu')]},
    {id:'v3',cand:'vineri, 12 februarie, 9:10',autori:['ioana'],par:[P('p1','ana'),P('p2','radu'),P('p3','ioana')]},
    {id:'v4',cand:'vineri, 12 februarie, 9:35',autori:['ana'],par:[P('p1','ana'),P('p2','radu'),P('p3','ioana'),P('p4','ana')]}]}
const DOC=(titlu,v)=>[{id:'ghid',titlu,tip:'doc',loc:'meu',modificat:'12 feb.',text:v[v.length-1].par.map(p=>p.text).join('\n')}].concat(SimColabGoogle.FISIERE_ANA);
const SIM_GHID=(ist,titlu)=>{const v=ist.versiuni;return {start:'doc',cont:ANA,fisiere:DOC(titlu||'Ghidul școlii - echipa 2',v),deschis:'ghid',istoric:Object.assign({eu:'ana',profesor:{adresa:PROF,nume:'Profesorul de TIC'},
  acces:[{adresa:'radu.ene@'+D,nume:'Radu Ene',rol:'editor'},{adresa:'ioana.rusu@'+D,nume:'Ioana Rusu',rol:'editor'}]},ist)}};

/* ---------- revista clasei, pagina 3 (proprietar: Mihai) ---------- */
const R1='Pagina 3 a revistei e despre ce a făcut clasa noastră în ianuarie.';
const R2='Pe 15 ianuarie am vizitat Muzeul de Științe Naturale.';
const R3='La meciul de fotbal cu clasa a VII-a B am câștigat cu 3 la 2.';
const R4='La cercul de lectură am citit o carte despre un băiat care crește un pui de vulpe.';
function revista(t){t=t||{};const T=k=>t[k]!=null?t[k]:{r1:R1,r2:R2,r3:R3,r4:R4}[k];const P=(id,aut)=>({id,autor:aut,text:T(id)});
  return [
    {id:'v1',cand:'marți, 2 februarie, 16:40',autori:['mihai'],par:[P('r1','mihai')]},
    {id:'v2',cand:'marți, 2 februarie, 17:15',autori:['radu'],par:[P('r1','mihai'),P('r2','radu')]},
    {id:'v3',cand:'miercuri, 3 februarie, 15:30',autori:['maria'],par:[P('r1','mihai'),P('r2','radu'),P('r3','maria')]},
    {id:'v4',cand:'miercuri, 3 februarie, 18:05',autori:['ioana'],par:[P('r1','mihai'),P('r2','radu'),P('r3','maria'),P('r4','ioana')]}]}
const SIM_REV=(eu,cont,ist)=>{const v=ist.versiuni;return {start:'doc',cont,fisiere:[{id:'rev',titlu:'Revista clasei - pagina 3',tip:'doc',loc:'distribuite',modificat:'3 feb.',
  text:v[v.length-1].par.map(p=>p.text).join('\n')}],deschis:'rev',
  istoric:Object.assign({eu,proprietar:'mihai',profesor:{adresa:PROF,nume:'Profesorul de TIC'},acces:[{adresa:'mihai.stan@'+D,nume:'Mihai Stan',rol:'editor'}]},ist)}};

/* ---------- afișul clubului de șah (pentru verificare) ---------- */
const S1='Clubul de șah se întâlnește marțea, în sala 12.';
const S2='În martie facem un turneu cu premii pentru toate clasele.';
const S3='Aduceți-vă tabla de șah, dacă aveți una.';
function sah(t){t=t||{};const T=k=>t[k]!=null?t[k]:{a1:S1,a2:S2,a3:S3}[k];const P=(id,aut)=>({id,autor:aut,text:T(id)});
  return [
    {id:'v1',cand:'luni, 8 februarie, 14:10',autori:['ana'],par:[P('a1','ana')]},
    {id:'v2',cand:'luni, 8 februarie, 19:30',autori:['ioana'],par:[P('a1','ana'),P('a2','ioana')]},
    {id:'v3',cand:'marți, 9 februarie, 8:05',autori:['ana'],par:[P('a1','ana'),P('a2','ioana'),P('a3','ana')]}]}
const SIM_SAH=ist=>{const v=ist.versiuni;return {start:'doc',cont:ANA,fisiere:[{id:'sah',titlu:'Afișul clubului de șah',tip:'doc',loc:'meu',modificat:'9 feb.',text:v[v.length-1].par.map(p=>p.text).join('\n')}],deschis:'sah',
  istoric:Object.assign({eu:'ana',profesor:{adresa:PROF,nume:'Profesorul de TIC'}},ist)}};

/* NOTA_DESEN (scoasă la reparația 2): simulatorul spune singur „Atinge un paragraf ca să-l schimbi” și, în casetă, „Enter sau „Gata” = gata.
   În Documentele adevărate scrii direct în pagină, fără casetă.” */

const LECTIA={
 t:'Publicare și modificare de conținut. Istoricul editării și contribuția fiecăruia',lectii:[20],continuturi:CONT,final:true,
 obiectiv:'propui schimbări cu modul Sugerare fără să strici munca altuia, hotărăști sugestiile, afli din istoricul versiunilor cine a scris fiecare parte, numești versiunea gata și publici lucrarea în siguranță.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Într-o lucrare de echipă, fiecare scrie partea lui. Vezi o greșeală în paragraful unui coleg: dacă o schimbi direct, el nici nu află. Și cum vede profesorul ce a scris fiecare?</p>
${fig('../m3-l20/img/corecturi.webp',800,490,'O foaie cu text tipărit în engleză, corectată de mână cu pixul: rânduri tăiate și cuvinte noi scrise deasupra și pe margine','Un text tipărit, corectat de alt om: ce ar trebui scos e tăiat, ce ar trebui adăugat e scris deasupra. Autorul hotărăște ce păstrează. Fotografie: „Example of copyedited manuscript”, Phoebe, <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Example_of_copyedited_manuscript.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> lecția 18 (contul Google de la școală, fereastra privată, Drive-ul, deconectarea), lecția 19 (documentul echipei, butonul <b>Permite accesul</b>, rolurile Editor, Comentator și Cititor, comentariul) și lecția 3 (copia PDF a unui document).</p>`},
  /* ---------- pasul 1: modul Sugerare ---------- */
  {t:'Modifici fără să strici: modul Sugerare',
   text:`<p>Pe <b>Editare</b> (Editing), ce scrii intră direct în text, chiar și în paragraful unui coleg, fără să-l întrebe.</p>
<p>De aceea treci pe <mark>Sugerare</mark> (Suggesting): în dreapta sus apeși butonul <b>Editare</b>, cu creionul, și alegi <b>Sugerare</b>. Ce scrii apare colorat, iar ce ștergi apare tăiat. Textul colegului rămâne până hotărăște autorul. Schimbarea propusă așa e o <mark>sugestie</mark>.</p>
<p>Sugestii fac cei cu rolul Editor sau Comentator. Cititorul doar citește.</p>
${ACUM('Ca la lecția 18: fereastra privată, '+C_('drive.google.com')+', conectarea; deschide documentul echipei. N-ai cont? Sari peste.','Dreapta sus: <b>Editare</b>, apoi <b>Sugerare</b>. Apoi revii la <b>Editare</b>.',PAUZA)}`,
   exemplu:`<p>Ana vede în paragraful lui Radu „la etajul.”, fără un cuvânt. Pe Sugerare, scrie „întâi” după „etajul”: cuvântul apare colorat, cu culoarea ei. Radu hotărăște dacă îl păstrează.</p>`,
   altfel:`<p>E ca atunci când corectezi cu creionul în caietul unui prieten: el vede corectura și hotărăște dacă o trece cu pixul sau o șterge cu guma.</p>`,
   incearca:CI_({q:`Ești Ana, Editor. În paragraful despre bibliotecă (nu e al tău) propune, ca sugestie, „întâi” după „la etajul”.`,
     sim:SIM_GHID({versiuni:ghid({p2:'Biblioteca este la etajul. Acolo găsești cărți de aventuri și enciclopedii.'})}),
     teste:[{c:'mod',v:'sugerare'},{c:'sugerat',v:{par:'p2',contine:['etajul intai','etajul întâi'],exact:G2},ce:'Ai propus ca sugestie doar „întâi”, în paragraful despre bibliotecă'},{c:'neatins',v:['p2'],d:'colegului'}],
     solutie:{text:G2},gresit:{direct:{par:'p2',text:G2}},
     ajutor:'Sus, în dreapta paginii: butonul Editare, apoi Sugerare. Apoi apeși pe paragraful despre bibliotecă, scrii „întâi” după „etajul” și apeși Enter (sau „Gata”).',
     arata:'Editare → Sugerare; clic pe paragraful despre bibliotecă; „Biblioteca este la etajul întâi. …”; Enter. Cuvântul „întâi” apare colorat.',
     why:'Cuvântul tău e o sugestie, colorată. Textul colegului a rămas; hotărăște autorul dacă îl păstrează.'}),
   inca:[
    {t:'classify',q:'Cine poate face o sugestie în documentul echipei?',cats:['Poate face o sugestie','Nu poate face o sugestie'],
     items:[['Ioana, care are rolul Comentator',0],['Radu, care are rolul Editor',0],['Bunica Anei, care are rolul Cititor',1],['Un elev din altă școală, căruia nu i s-a permis accesul',1]],
     ajutor:'Ultimul paragraf al pasului: cine poate face sugestii?',
     why:'Sugestii fac cei cu rolul Editor sau Comentator. Cititorul doar citește, iar cine n-are acces nici nu deschide documentul.'},
    CI_({q:`În paragraful despre laborator (nu e al tău) scrie de două ori „foarte foarte”. Propune ștergerea unui „foarte”, ca sugestie.`,
     sim:SIM_GHID({versiuni:ghid({p3:'Laboratorul de informatică este foarte foarte luminos. La plecare, fiecare elev se deconectează.'})}),
     teste:[{c:'mod',v:'sugerare'},{c:'sugerat',v:{par:'p3',contine:'foarte luminos',lipseste:'foarte foarte',exact:'Laboratorul de informatică este foarte luminos. La plecare, fiecare elev se deconectează.'},ce:'Ai propus ca sugestie doar ștergerea unui „foarte”, în paragraful despre laborator'},{c:'neatins',v:['p3'],d:'colegului'}],
     solutie:{text:'Laboratorul de informatică este foarte luminos. La plecare, fiecare elev se deconectează.'},gresit:{direct:{par:'p3',text:'Laboratorul de informatică este foarte luminos. La plecare, fiecare elev se deconectează.'}},
     ajutor:'Întâi Sugerare (dreapta sus). Apoi apeși pe paragraful despre laborator, ștergi un „foarte” și apeși Enter.',
     arata:'Editare → Sugerare; clic pe paragraful despre laborator; ștergi un „foarte”; Enter. Cuvântul șters apare tăiat.',
     why:'Pe Sugerare, ce ștergi apare tăiat, nu dispare. Colegul vede ce propui și hotărăște.'})
   ]},
  /* ---------- pasul 2: accepți sau respingi ---------- */
  {t:'Accepți sau respingi o sugestie',
   text:`<p>Sugestia apare și în dreapta paginii, într-o casetă cu numele celui care a propus-o și două butoane: <b>✓ Acceptă</b> (Accept) și <b>✕ Respinge</b> (Reject).</p>
<ul><li>Accepți ce îndreaptă o greșeală sau adaugă ceva bun: schimbarea intră în text.</li>
<li>Respingi ce strică: șterge munca cuiva fără motiv, adaugă o greșeală sau ceva fără loc în lucrare. Textul rămâne cum era.</li></ul>
<p>Hotărăște autorul paragrafului; Comentatorul nu poate accepta. Pe sugestia ta din paragraful altuia nu apeși tu ✓ sau ✕: decizia e a celui care a scris textul.</p>
${ACUM(PAUZA)}`,
   exemplu:`<p>Radu propune în paragraful Anei „în mijloc”, după „un tei bătrân”: e un detaliu bun, deci Ana apasă ✓. Ioana a propus, din greșeală, ștergerea încheierii Anei: Ana apasă ✕ și îi lasă un comentariu, „Păstrăm încheierea?”</p>`,
   altfel:`<p>E ca la redacția revistei școlii: colegii aduc propuneri, iar autorul articolului spune „da” sau „nu” la fiecare.</p>`,
   incearca:CI_({q:'Ești Ana, Editor. Hotărăște cele două sugestii din paragrafele tale (casetele din dreapta; pe telefon, sub pagină): acceptă ce îmbunătățește textul, respinge ce îl strică.',
     sim:SIM_GHID({versiuni:ghid(),sugestii:[{id:'s1',par:'p1',de:'radu',nou:'Școala noastră are trei etaje și o curte mare, cu un tei bătrân în mijloc.'},{id:'s2',par:'p4',de:'ioana',nou:''}]}),
     teste:[{c:'decis',v:{s1:'accepta',s2:'respinge'}}],gresit:{decizii:{s1:'respinge',s2:'accepta'}},
     ajutor:'Întreabă-te la fiecare: face textul mai bun sau strică munca cuiva? Un detaliu bun: ✓. Un paragraf întreg șters fără motiv: ✕.',
     arata:'✓ Acceptă la sugestia lui Radu („în mijloc”); ✕ Respinge la sugestia Ioanei (ștergea tot ultimul paragraf).',
     why:'Detaliul lui Radu a intrat în text; încheierea ta a rămas, pentru că ștergerea n-avea motiv.'}),
   inca:[

  'Treci pe Sugerare: în dreapta sus, butonul <b>Editare</b> (Editing), cu creionul, apoi <b>Sugerare</b> (Suggesting). Butonul arată acum Sugerare (poate scrie și Sugestii).',
  'În paragraful unui coleg, propune o schimbare mică: un cuvânt adăugat sau o greșeală îndreptată. Nu atinge alt text. Spune-i colegului: „Ți-am lăsat o sugestie.” Nu apăsa tu ✓ pe sugestia ta: hotărăște autorul.',

/* Telefonul elevului (Izvoare / Dumbrava: telefoanele elevilor). Reparația F (24.10.2026, judecata 1: opus M4 + m4, sonnet J2):
   blocul spune ce pași ai laboratorului faci pe telefon și care nu; „un coleg de la calculator” a ieșit (la Izvoare nu e
   laborator); cuvintele lui VII/18 publicate (pagina, TELEFON): „nu te deconectezi”, „atingi Editează (creionul)”, scoaterea
   contului pe Android și pe iPhone. Sugestiile pe Android = ajutorul Google docs/answer/6033474, varianta Android (S7, doar în
   engleză: „Tap More. Turn on Suggest changes… tap Done”; „tap Suggestion. Tap Accept or Reject”); istoricul = S8 (nu e în
   aplicație). „Accesibile pentru mine” = VII/19 (docs/answer/49114, Android). Nevăzut pe un telefon real: NESIGUR (afirmatii A16, A17, A23; A24-A25 = lecțiile 18-19). */
const TELEFON=`<details class="tel"><summary>Lucrezi pe telefonul tău?</summary>
<p>Pe telefonul tău nu ai nevoie de fereastra privată (nici de <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>) și nu te deconectezi: pașii 2, 6 și 13 nu sunt pentru telefon. Lucrezi în aplicația <b>Documente Google</b>, cu contul de la școală pus pe telefon. Ghidurile cu poze: <a href="../../../jocuri/ghiduri/#cont-drive">contul de Google pe telefon</a>, <a href="../../../jocuri/ghiduri/#instalare">cum instalezi aplicația</a>, <a href="../../../jocuri/ghiduri/#docs">un document pe telefon</a>.</p>
<p>Aplicația nu arată ca pe calculator. Pe Android faci așa:</p>
<ol><li>Pasul 3: documentul echipei e în listă (dacă e al tău) sau la <b>Accesibile pentru mine</b> (dacă e al unui coleg). Îl deschizi cu o atingere și atingi <b>Editează</b> (creionul).</li>
<li>Pașii 4-5: atingi cele trei puncte (Mai multe), sus în dreapta, și pornești opțiunea de sugestii (în engleză: <i>Suggest changes</i>). Scrii schimbarea, apoi atingi bifa (Gata).</li>
<li>Pasul 7: atingi textul colorat al colegului, apoi sugestia (<i>Suggestion</i>), apoi <b>Acceptă</b> sau <b>Respinge</b> (Accept / Reject).</li>
<li>Pașii 8-11, istoricul: nu există în aplicația de pe telefon (ajutorul Google: îl deschizi la docs.google.com, pe un calculator). Îl faci în ${ATELIER} și îi spui profesorului că istoricul adevărat nu l-ai văzut. Versiunea rămâne fără nume dacă nimeni din echipă nu e la un calculator.</li>
<li>Pasul 12: profesorul e deja în listă, de la lecția 19? Nu schimbi nimic. Nu e? Lucrarea rămâne în Drive: proprietarul îi dă acces de la un calculator.</li></ol>
<p>Pe iPhone, butoanele pot sta în alt loc.</p>
<p>Telefonul e al altcuiva (al unui coleg, al părinților)? La final scoți contul de pe el. Pe Android: <b>Setări</b>, <b>Parole și conturi</b> (pe unele telefoane, „Utilizatori și conturi” sau „Gestionează conturile”), contul tău, <b>Elimină contul</b>, apoi confirmi (<b>Elimină contul</b> sau <b>Șterge</b>). Pe iPhone, contul nu e în Setări, ci în aplicație: atingi poza de profil, sus în dreapta, apoi <b>Gestionează conturile de pe acest dispozitiv</b> și <b>Elimină de pe acest dispozitiv</b>. Nu găsești sau îți cere codul telefonului? Îl rogi pe cel al cărui e telefonul să te ajute.</p></details>`;

/* LECȚIA 14, clasa a VII-a, modulul 2 (revizuirea LearningHub, standardul din 27.09.2026 + regula 10 din 08.10.2026),
   scrisă 12.10.2026. Un nivel pe pași: pasul 0, 5 pași cu „Încearcă” și cu un gest scurt în Clipchamp-ul adevărat,
   atelierul, pasul din laborator, 5 întrebări.
   Simulatorul: lectii/_sim/video-clipchamp.js (NOU, proprietar VII/14). Clipchamp NU a fost pornit (aplicație din Magazin,
   cere cont): faptele vin din documentația oficială Microsoft (_proba/docs/citate_clipchamp.md) și din capturile Clipchamp
   în română ale jocului audio-video-vii. Afirmațiile: afirmatii.json. Imaginile: img/SURSE.json. Muzica: surse.md §5. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/audio-video-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const S=x=>`<span class="simb">${x}</span>`;
const CEAS=t=>`<span class="ceas">${t}</span>`;
const PROG1='Efecte de tranziție între scene';
const PROG2='Suprapunere coloană sonoră peste scene';
/* setul de scene-suport: patru fotografii (domeniu public / CC0, img/SURSE.json) + muzica din lecția 13 (CC0) */
const S1='scena-1-dimineata.jpg',S2='scena-2-padure.jpg',S3='scena-3-lac.jpg',S4='scena-4-seara.jpg',MU='muzica-fundal.wav';
const SCENE=[S1,S2,S3,S4],TOATE=[S1,S2,S3,S4,MU];
const CAT={
  [S1]:{tip:'imagine',src:'img/scena-1-dimineata.webp',titlu:'dimineața'},
  [S2]:{tip:'imagine',src:'img/scena-2-padure.webp',titlu:'pădurea'},
  [S3]:{tip:'imagine',src:'img/scena-3-lac.webp',titlu:'lacul'},
  [S4]:{tip:'imagine',src:'img/scena-4-seara.webp',titlu:'seara'},
  [MU]:{tip:'audio',durata:24,fis:MU,unda:UNDE_L14.muzica,titlu:'muzica'},
  'batai-in-usa.wav':{tip:'audio',durata:6.24,titlu:'bătăile în ușă'},
  'voce-de-curatat.wav':{tip:'audio',durata:20.1,titlu:'vocea'}};
const DESCARCARI=['batai-in-usa.wav',MU,S1,S2,S3,S4,'voce-de-curatat.wav'];   /* Descărcări, cum le arată fereastra Deschidere (după nume) */
const ED=o=>Object.assign({ecran:'editor',media:TOATE.slice(),descarcari:DESCARCARI},o||{});   /* editorul, cu cele cinci fișiere importate */
const LINIE=(d4,o)=>ED(Object.assign({video:[[S1,4],[S2,4],[S3,4],[S4,d4||4]]},o||{}));          /* scenele pe linia de timp, lipite */
const MUZ=sf=>[{m:MU,start:0,durata:sf}];                                                          /* muzica, de la 0:00 până la sf */
const V=o=>Object.assign({t:'videoclipchamp',catalog:CAT,sunet:true},o);                           /* exercițiu în Clipchamp-ul simulat */
const dl=n=>`<a href="${n}" download>${n}</a>`;
const DESC_TOATE=`<span class="desc">${TOATE.map(dl).join(', ')}</span>`;
/* Laboratorul. Reparația J1 (12.10.2026): contul — lucrezi DOAR în contul tău (te uiți al cui e, la pictograma de utilizator)
   și la final te deconectezi (≡ › Înapoi la pagina de pornire › pictograma de utilizator › Deconectare: documentația Microsoft,
   _proba/docs/text/account_*.corp.txt, windows_app_*.corp.txt, close_delete_*.corp.txt); Microsoft Store; copiile „(1)”;
   drumul de rezervă oricând; ordinea și butoanele care apar când ții mouse-ul acolo. Pașii 12 și 13 sunt numiți în ultimul. */
const PROVOCARE=[
  `Pune căștile de pe masa ta (nu băga și nu scoate cabluri). Descarcă, dacă n-ai făcut-o la pași, cele patru fotografii și muzica: ${DESC_TOATE}. Ajung în <b>Descărcări (Downloads)</b>. Vezi acolo același nume de două ori, unul cu <b>(1)</b> sau <b>(2)</b> la capăt? E același fișier, descărcat de mai multe ori: folosești unul singur, pe cel fără număr.`,
  `Clipchamp e deja deschis de la pași, cu proiectul în care ai exersat? Întoarce-te la pagina de pornire: butonul cu trei linii (≡) › <b>Înapoi la pagina de pornire (Back to home)</b>. Proiectul de exersare se salvează singur și rămâne în listă: nu-l redenumi și nu adăuga scene în el. Nu găsești butonul? Închide Clipchamp cu ✕ și pornește-l din nou. Nu e deschis? Pornește-l: <b>Start</b>, scrii <b>Clipchamp</b>, clic. Nu apare sau îți cere să-l instalezi din <b>Microsoft Store</b>? Nu-l instala: sari la ultimul pas.`,
  `Îți cere să te conectezi? Te conectezi doar cu contul TĂU, primit de la profesor. Dacă Windows te întreabă dacă să-ți țină minte contul pe calculatorul ăsta, pentru toate aplicațiile, nu accepta: alege să te conectezi doar la aplicația asta. Nu știi ce să alegi? Nu te conecta: sari la ultimul pas. N-ai unul? <b>Nu-ți face cont</b> și nu scrie parola nimănui: sari la ultimul pas.`,
  `Înainte să lucrezi, uită-te <b>al cui e contul</b>: pe pagina de pornire, apasă <b>pictograma de utilizator</b>, sus în dreapta; îți arată contul conectat. Lucrezi doar dacă e contul TĂU. E al altcuiva (al unui coleg, al profesorului) sau nu știi al cui e? Nu deschide nimic în el: închide Clipchamp cu ✕, sari la ultimul pas și spune-i profesorului.`,
  `Apasă butonul pentru un videoclip nou: <b>Creați un videoclip nou (Create a new video)</b> sau <b>Videoclip necompletat (Blank video)</b>, ori butonul <b>+</b> de lângă el, de pe pagina de pornire (nu un + din editor). Sus, apasă pe numele proiectului; dacă numele vechi nu dispare, șterge-l. Scrie numele TĂU după regula din lecția 3, cu <code>munte</code> la capăt, apoi ${K('Enter')}. Verifică: sus scrie numele tău.`,
  `În stânga, la <b>Conținutul meu media</b>, apasă <b>Importați conținutul media</b>. În fereastra <b>Deschidere</b>: <b>Descărcări</b>, clic pe prima fotografie, ${K('Ctrl')} + clic pe celelalte trei și pe <b>muzica-fundal</b>, apoi <b>Deschidere</b>. Așteaptă să apară toate cinci în stânga.`,
  `Trage fotografiile pe linia de timp, jos, una după alta, în ordinea poveștii: dimineața, pădurea, lacul, seara (sau apasă <b>+</b> pe fiecare, în ordinea asta). Fiecare primește 4 secunde. Uită-te apoi la ordine: o scenă ajunsă în alt loc o tragi la locul ei.`,
  `Clic pe <b>seara</b> și trage mânerul ei din dreapta până pe la ${CEAS('0:18')}. A apărut un gol între scene? Ține mouse-ul pe gol: apare butonul coș de gunoi; apasă-l.`,
  `Între <b>lacul</b> și <b>seara</b> pune <b>Estompare încrucișată</b>: din fila <b>Tranziții</b>, trasă pe locul unde se ating cele două scene, sau cu butonul <b>+</b> dintre ele (nu-l vezi? ține mouse-ul acolo). Clic pe tranziție; în dreapta, trage glisorul <b>Durată</b> spre dreapta, ca trecerea să fie mai lentă.`,
  `Trage <b>muzica-fundal</b> pe linia de timp, sub scene, la ${CEAS('0:00')}. Clic pe ea și trage mânerul din dreapta spre stânga, până la capătul serii. În dreapta, la fila <b>Audio</b>, coboară <b>Volumul</b> până când muzica e plăcută în căști.`,
  `Apasă ${S('|◀')}, apoi ${S('▶')} (sau bara de spațiu) și privește tot filmul. Trecerea de la lac la seară e lină? Ce se vede și ce se aude la capăt: muzica se oprește odată cu ultima scenă? Dacă nu, repară și privește din nou.`,
  `Compară: clic pe tranziție, în dreapta alege <b>Fără (None)</b> și privește trecerea, acum o tăietură simplă. Apoi ↶ <b>Anulare</b> (${K('Ctrl+Z')}), ca s-o aduci înapoi. Scrie în caiet, într-o propoziție, care variantă e mai potrivită aici și de ce.`,
  `Clipchamp salvează singur proiectul, cât e conectat la internet: așteaptă să se termine salvarea și încărcarea fotografiilor și a muzicii (cu internet, de obicei câteva secunde; nu te grăbi). Apoi te <b>deconectezi</b>, ca următorul elev să nu lucreze în contul tău: butonul cu trei linii (≡) › <b>Înapoi la pagina de pornire (Back to home)</b>; acolo, <b>pictograma de utilizator</b>, sus în dreapta › <b>Deconectare (Sign out)</b>. Nu găsești butonul ≡ sau Deconectare? Nu pleca: închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta că ai rămas conectat.`,
  `Închide Clipchamp cu ✕. Fotografiile și muzica le lași în Descărcări: proiectul are nevoie de ele data viitoare, la calculatorul ăsta. Dacă altă dată Clipchamp îți cere fișierele, nu le căuta singur: spune-i profesorului.`,
  `<b>Dacă oricând nu poți merge mai departe</b> (Clipchamp nu apare sau nu pornește, n-are internet, cere un cont pe care nu-l ai, e deschis în contul altcuiva, nu merge importul): te-ai conectat cu contul tău? Deconectează-te întâi, ca la pasul 13 (nu poți? închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta). Apoi fă din nou atelierul din pagină, până la capăt, și scrie în caiet propoziția de la pasul 12. Spune-i profesorului încă din ora asta (dacă e cu cealaltă clasă, la sfârșitul orei) ce s-a întâmplat, mai ales dacă Clipchamp era deschis în contul altcuiva.`
];

  titlu:'Efecte de tranziție între scene. Coloană sonoră peste scene',
  marca:'Lecția 14 · <b>Montajul cu muzică</b>',
  h1:'Efecte de tranziție între scene. <em>Coloană sonoră peste scene</em>',
  clasa:'a VII-a', unitate:'VII-U2', unitateTitlu:'Aplicații audio și audio-video',
  competente:['CS.1.2','CS.3.2'], lectii:'14',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.2, CS.3.2 · unitatea VII-U2 „Aplicații audio și audio-video” · lecția 14 din modulul 2 · conținuturile: „Efecte de tranziție între scene”, „Suprapunere coloană sonoră peste scene”',
  banda:'<span class="film"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></span>',
  intro:`<p>Faci un film scurt, „O zi la munte”, din patru fotografii și muzica din lecția 13. Le aduci în Clipchamp, le așezi pe linia de timp, pui o trecere lină acolo unde are rost și pui muzica dedesubt, cât filmul. Exersezi întâi în pagină, apoi în Clipchamp-ul adevărat, la calculator.</p>
<p><b>Ai nevoie de:</b> lecția 11 (zonele lui Clipchamp: <b>Conținutul meu media</b>, previzualizarea, linia de timp cu pistele, clipul, capul de redare, ${S('|◀')} și ${S('▶')}). Lecția 13: muzica de fundal și volumul ei. Lecția 3: <b>Descărcări</b>, fereastra de deschidere, regula numelui. Din clasa a V-a: ${K('Ctrl')} + clic, ca să alegi mai multe fișiere deodată.</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, faci exercițiul „Încearcă tu” și gestul scurt din Clipchamp-ul adevărat. Sub previzualizarea din pagină, rândul <b>„Acum, la …”</b> îți spune ce se vede și ce se aude la capul de redare; cu <b>„Sunet: pornit”</b> auzi chiar muzica (în laborator, doar în căști). Pe telefon, apasă întâi <b>+</b> (Mărește) la linia de timp, ca scenele să fie destul de late pentru deget, iar un material îl pui pe linia de timp cu butonul verde <b>+</b> de pe el. Panoul unei tranziții sau al muzicii stă în Clipchamp în dreapta; în pagină, sub linia de timp.</p>
<p><b>Contul, în Clipchamp-ul adevărat:</b> lucrezi doar în contul TĂU și, când pleci, te deconectezi. Cum vezi al cui e contul și cum te deconectezi: în laborator, la final.</p>`,

{t:'Efecte de tranziție între scene. Coloană sonoră peste scene',lectii:[14],continuturi:[PROG1,PROG2],final:true,

 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Un film de la excursie, prezentarea clasei la serbare sau reclama unei cărți se fac la fel: bucăți de imagine puse una după alta, cu muzică dedesubt. O bucată cu același loc sau același moment e o <mark>scenă</mark>. Trecerea de la o scenă la alta poate fi bruscă sau lină, iar muzica le leagă. Asta e <mark>montajul</mark>.</p>
<p>Azi faci în Clipchamp un film de câteva secunde, „O zi la munte”, din patru fotografii (patru scene) și muzica din lecția 13.</p>

<li>în fereastra <b>Deschidere</b> alegi <b>Descărcări</b>, clic pe prima fotografie, ${K('Ctrl')} + clic pe celelalte și pe muzică, apoi <b>Deschidere</b>.</li></ol>
${fig(J+'clipchamp-zone.webp',1000,584,'Editorul video Clipchamp: în stânga panoul Conținutul meu media, cu butonul mov Importați conținutul media, sus previzualizarea, jos linia de timp','Sus, în stânga: <b>Conținutul meu media</b>, cu butonul mov <b>Importați conținutul media</b>.')}
<p class="gest"><b>La calculator, acum:</b> descarcă cele cinci fișiere (${DESC_TOATE}) și pornește Clipchamp. Îți cere să te conectezi? Doar cu contul TĂU, fără cont nou; dacă Windows vrea să-ți țină minte contul pentru toate aplicațiile, nu accepta: alege doar aplicația asta (nu știi? nu te conecta). <b>Pictograma de utilizator</b>, sus în dreapta, îți arată al cui e contul: doar în contul tău faci un videoclip nou și imporți fișierele; altfel rămâi în pagină. Când pleci, te deconectezi (laboratorul, pasul 13).</p>`,
   exemplu:`<p>După import, cele cinci fișiere stau în stânga, în <b>Conținutul meu media</b>. În film nu sunt încă: filmul e ce pui pe linia de timp.</p>`,
   altfel:`<p>E ca atunci când faci un album: întâi aduci pozele pe masă (biblioteca), abia apoi le lipești pe pagină, în ordine (linia de timp).</p>`,
   incearca:V({start:{ecran:'acasa',descarcari:DESCARCARI},
    q:'Fă un videoclip nou și adu în <b>Conținutul meu media</b> cele patru fotografii (scena-1 … scena-4) și <b>muzica-fundal.wav</b>: clic pe prima, apoi Ctrl + clic pe celelalte (pe telefon, atinge-le pe rând). Nu aduce alte fișiere.',
    teste:[{ce:'Ai făcut un videoclip nou',proiectNou:true,cum:'Pe pagina de pornire apasă „Creați un videoclip nou”.'},
           {ce:'În Conținutul meu media sunt cele patru fotografii și muzica',importate:TOATE,cum:'Apasă „Importați conținutul media”, alege cele cinci fișiere (Ctrl + clic) și apasă Deschidere.'},
           {ce:'N-ai adus alte fișiere (bătăile, vocea)',doarImportate:TOATE,cum:'Doar scena-1 … scena-4 și muzica-fundal. Dacă ai adus altceva, apasă „Ia-o de la capăt”, sub fereastră.'}],
    solutie:[{nou:1},{importa:TOATE}],gresit:[{nou:1},{importa:[S1]}],
    ajutor:'Creați un videoclip nou › Importați conținutul media › Ctrl + clic pe cele cinci › Deschidere.',
    why:'Proiectul nou e gol; tot ce folosești în film aduci întâi în Conținutul meu media.'}),
   inca:[
    V({start:{ecran:'editor',descarcari:DESCARCARI},
     q:'Încă unul: proiectul e deja deschis. Adu în Conținutul meu media <b>doar</b> fotografiile cu <b>pădurea</b> și cu <b>lacul</b> (scena-2 și scena-3), deodată.',
     teste:[{ce:'Sunt doar scena-2 și scena-3',doarImportate:[S2,S3],cum:'Importați conținutul media › clic pe scena-2 › Ctrl + clic pe scena-3 › Deschidere.'}],
     solutie:[{importa:[S2,S3]}],gresit:[{importa:[S2]}],
     ajutor:'Ctrl + clic adaugă al doilea fișier la alegere.',why:'Cu Ctrl + clic alegi mai multe fișiere deodată, ca în Explorer.'}),
    {t:'choice',q:'Ai importat cele patru fotografii, dar n-ai pus nimic pe linia de timp. Ce e acum în filmul tău?',
     o:['Nimic: filmul e ce pui pe linia de timp','Toate patru, una după alta','Doar prima fotografie','Doar muzica, fără imagini'],ok:0,
     ajutor:'Ce e în film: ce e în bibliotecă sau ce e pe linia de timp?',why:'Filmul e ce stă pe linia de timp. Fotografiile importate stau deocamdată doar în bibliotecă.'}
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Așezi scenele pe linia de timp, cu durata lor',
   text:`<p>Pe <strong>linia de timp</strong> (în Clipchamp în română îi spune <b>cronologie</b>) tragi fiecare fotografie cu mouse-ul, jos, chiar după cea dinainte. Sau apeși butonul verde <b>+</b> de pe ea (<b>Adaugă la cronologie</b>). Le pui în ordinea poveștii: dimineața, pădurea, lacul, seara. Apoi te uiți la ordine: o scenă ajunsă în alt loc o tragi la locul ei.</p>
<p>Fiecare fotografie primește <b>4 secunde</b>. Ca o scenă să țină mai mult, dai clic pe ea: la capete apar două <mark>mânere</mark>. Tragi mânerul din dreapta spre dreapta. Spre stânga, scena se scurtează.</p>
${fig(J+'clipchamp-scurtare.webp',726,342,'Același clip pe linia de timp din Clipchamp, de două ori: sus întreg, cu mânerele de la capete încadrate cu roșu, jos după ce mânerele au fost trase spre interior','<b>Mânerele</b> de la capetele unui clip ales (sus, încadrate). Jos, trase spre interior: clipul s-a scurtat.')}
<p class="gest"><b>La calculator, acum:</b> pune cele patru scene pe linia de timp, în ordine, apoi lungește <b>seara</b> până pe la ${CEAS('0:18')}.</p>`,
   exemplu:`<p>Patru fotografii a câte 4 secunde: filmul ține 16 secunde (${CEAS('0:16')}). Lungești seara la 6 secunde: filmul ține 4 + 4 + 4 + 6 = 18 secunde.</p>
<p>Dacă scurtezi o scenă din mijloc, după ea rămâne un <b>gol</b>: un loc liber pe linia de timp; în film, acolo nu e nicio scenă (în pagină vezi ecran negru). Ține mouse-ul pe gol: apare un buton coș de gunoi, <b>Ștergeți acest spațiu liber</b> (în pagină stă mereu la vedere). Îl apeși și scenele de după gol vin spre stânga.</p>`,
   incearca:V({start:ED(),
    q:'Pune pe linia de timp cele patru scene, în ordinea poveștii: dimineața, pădurea, lacul, seara (trage-le pe rând sau apasă + pe fiecare). Apoi fă ca <b>seara</b> să țină cam 6 secunde: clic pe ea și trage mânerul din dreapta până pe la 0:18.',
    teste:[{ce:'Scenele sunt pe linia de timp în ordinea poveștii',ordine:SCENE,cum:'Ordinea, de la stânga: scena-1 (dimineața), scena-2 (pădurea), scena-3 (lacul), scena-4 (seara). O scenă pusă greșit o tragi la locul ei (sau Ctrl+Z, Anulare, și o pui din nou).'},
           {ce:'Între scene nu e niciun gol',faraGoluri:true,cum:'Un gol se închide cu butonul coș de gunoi de pe el.'},
           {ce:'Seara ține cam 6 secunde (între 5,5 și 6,5)',durata:{m:S4,de:[5.5,6.5]},cum:'Clic pe seara, apoi trage mânerul ei din dreapta până pe la 0:18 (pe telefon, apasă întâi + la Mărește).'}],
    solutie:[{adauga:S1},{adauga:S2},{adauga:S3},{adauga:S4},{durata:[S4,6]}],gresit:[{adauga:S1},{adauga:S3},{adauga:S2},{adauga:S4},{durata:[S4,6]}],
    ajutor:'+ pe scena-1, scena-2, scena-3, scena-4, în ordinea asta; apoi mânerul din dreapta al serii.',
    why:'Ordinea spune povestea, iar durata spune cât stă privitorul pe fiecare scenă.'}),
   inca:[
    V({start:ED({video:[{m:S1,start:0,durata:4},{m:S2,start:4,durata:2},{m:S3,start:8,durata:4},{m:S4,start:12,durata:4}]}),
     q:'Colegul a scurtat pădurea și a rămas un gol (loc liber pe linia de timp) înaintea lacului. Închide golul, apoi uită-te: unde se termină acum filmul?',
     teste:[{ce:'Nu mai e niciun gol',faraGoluri:true,cum:'Apasă butonul coș de gunoi de pe gol (Ștergeți acest spațiu liber).'},
            {ce:'Filmul se termină la 0:14',sfarsitVideo:[13.9,14.1],cum:'După ce închizi golul, scenele de după el vin spre stânga.'}],
     solutie:[{gol:S3}],gresit:[{rigla:2}],
     ajutor:'Golul e zona hașurată dintre pădure și lac.',why:'Golul de 2 secunde a dispărut, deci filmul s-a scurtat cu 2 secunde: de la 0:16 la 0:14.'}),
    {t:'choice',q:'Pui pe linia de timp cinci fotografii, una după alta, fără să le schimbi durata. Cât ține filmul?',
     o:['20 de secunde','5 secunde','4 secunde','25 de secunde'],ok:0,
     ajutor:'Cât primește fiecare fotografie?',why:'Fiecare fotografie primește 4 secunde: 5 × 4 = 20 de secunde.'}
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Tranziția: o trecere lină între două scene',
   text:`<p>Două scene lipite se schimbă dintr-odată: asta e o <mark>tăietură simplă</mark>. O <mark>tranziție</mark> e un efect de trecere: prima scenă dispare încet, iar a doua apare încet. Cea mai folosită e <b>Estompare încrucișată (Cross fade)</b>.</p>
<p>În stânga apeși fila <b>Tranziții</b> și tragi tranziția pe linia de timp, chiar pe locul unde se ating două scene. Sau apeși butonul <b>+</b> dintre ele (nu-l vezi? ține mouse-ul pe locul unde se ating): pune singur Estompare încrucișată. Tranziția se pune doar între două scene lipite, fără gol între ele.</p>
${fig(J+'clipchamp-tranzitii.webp',320,840,'Panoul Tranziții din Clipchamp: sus scrie Glisați o tranziție între două clipuri în cronologie, dedesubt grupul Estompări și încețoșări, cu Estompare încrucișată prima','Fila <b>Tranziții</b>: „Glisați o tranziție între două clipuri în cronologie”. Prima din grup e <b>Estompare încrucișată</b>.')}
<p class="gest"><b>La calculator, acum:</b> pune Estompare încrucișată între lacul și seara, mărește-i durata și privește trecerea: clic pe riglă puțin înainte, apoi ${S('▶')}.</p>`,
   exemplu:`<p>Clic pe semnul tranziției, dintre cele două scene: în dreapta apare panoul ei (în pagină, sub linia de timp). Acolo poți alege alt fel de tranziție sau <b>Fără (None)</b>, care o scoate. Tot acolo e <b>Durata</b>, în secunde: tragi glisorul spre dreapta și trecerea devine mai lentă.</p>
<p>Te-ai răzgândit? Săgeata ↶ (<b>Anulare</b>), sus în stânga, sau ${K('Ctrl+Z')} anulează ultima schimbare.</p>`,
   altfel:`<p>Ai mai văzut asta la prezentări, în clasa a VI-a: între două diapozitive puteai pune o tranziție, ca unul să treacă încet în celălalt. Fără ea, diapozitivul următor apărea dintr-odată. În film e la fel, doar că între scene.</p>`,
   incearca:V({start:LINIE(6,{fila:'tranzitii'}),
    q:'Pune <b>Estompare încrucișată</b> între <b>lacul</b> și <b>seara</b> (trage-o din fila Tranziții pe locul unde se ating, sau apasă + dintre ele). Apoi fă trecerea mai lentă: clic pe tranziție și trage glisorul <b>Durată</b> spre dreapta.',
    teste:[{ce:'Estompare încrucișată între lacul și seara',tranzitie:{intre:[S3,S4],nume:'Estompare încrucișată'},cum:'Butonul + dintre lacul și seara pune Estompare încrucișată.'},
           {ce:'Trecerea e mai lentă decât o pune butonul (Durata mai mare)',tranzitie:{intre:[S3,S4],durata:[1.1,3]},cum:'Clic pe semnul tranziției; glisorul Durată spre dreapta.'},
           {ce:'Nicio altă tranziție în film',nrTranzitii:1,cum:'O tranziție pusă greșit se scoate: clic pe ea, apoi „Fără”.'}],
    solutie:[{tranzitie:['Estompare încrucișată',S3]},{durataTranzitie:[S3,2]}],gresit:[{tranzitie:['Estompare încrucișată',S2]},{durataTranzitie:[S2,2]}],
    ajutor:'Locul dintre lacul (a treia scenă) și seara (a patra).',
    why:'Tranziția stă între două scene, iar durata ei spune cât de încet trece una în cealaltă.'}),
   inca:[
    V({start:LINIE(6,{tranz:[{intre:[S1,S2],nume:'Ardere',durata:1}]}),
     q:'Colegul a pus tranziția <b>Ardere</b> între dimineața și pădurea. Scoate-o (clic pe ea, apoi în dreapta „Fără”), apoi privește locul acela: clic pe riglă la 0:03, apoi ▶ până după 0:05.',
     teste:[{ce:'Între dimineața și pădurea nu mai e nicio tranziție',faraTranzitie:[S1,S2],cum:'Clic pe semnul dintre ele; în dreapta, alege „Fără”.'},
            {ce:'Ai privit locul unde se ating (0:03 – 0:05)',vazut:[3.2,4.8],cum:'Clic pe riglă la 0:03, apoi ▶ și lasă până după 0:05.'}],
     solutie:[{farTranzitie:S1},{rigla:3},{reda:1},{asteapta:2.2},{pauza:1}],gresit:[{rigla:3},{reda:1},{asteapta:2.2},{pauza:1}],
     ajutor:'Semnul tranziției e între prima și a doua scenă.',why:'Fără tranziție, la 0:04 dimineața e înlocuită dintr-odată de pădure: o tăietură simplă.'}),
    {t:'tf',q:'Între pădure și lac e un gol de o secundă. Poți pune direct o tranziție peste gol.',ok:false,
     ajutor:'Ultima propoziție a pasului.',why:'Fals. Tranziția leagă două scene lipite; întâi închizi golul (coșul de gunoi de pe el), apoi pui tranziția.'}
   ]},
  /* ---------- pasul 4 ---------- */
  {t:'Coloana sonoră, peste toate scenele',
   text:`<p><mark>Coloana sonoră</mark> e sunetul care curge sub imagini, peste mai multe scene la rând: aici, muzica din lecția 13. O tragi din <b>Conținutul meu media</b> pe linia de timp, <b>sub scene</b>, la ${CEAS('0:00')}. Muzica e un clip separat, pe pista ei.</p>
<p>Muzica ține 24 de secunde, filmul tău mai puțin. O scurtezi ca pe o scenă: clic pe ea și tragi mânerul din dreapta spre stânga, până la capătul ultimei scene.</p>
<p class="gest"><b>La calculator, acum:</b> pune muzica sub scene, scurteaz-o până la capătul serii și coboară-i volumul, în căști.</p>`,
   exemplu:`<p>Filmul: 4 + 4 + 4 + 6 = 18 secunde. Muzica, pusă de la ${CEAS('0:00')}, ține până la ${CEAS('0:24')}, mai mult decât seara. Tragi capătul ei până la ${CEAS('0:18')}: se oprește odată cu seara. (În pagină, dacă n-o scurtezi, după seară vezi ecran negru cu muzică. În Clipchamp te uiți chiar tu, la laborator.)</p>
<p>Volumul: clic pe muzică; în panoul din dreapta, fila <b>Audio</b>, glisorul <b>Volum</b>: 100 % e cât e fișierul, 0 % e fără sunet.</p>`,
   altfel:`<p>E ca muzica de la o serbare: cântă tot timpul cât urcă pe scenă copiii, unul după altul. Când urcă alt copil, muzica nu se oprește. Se oprește odată cu ultimul copil, nu mai târziu, pe scena goală.</p>`,
   incearca:V({start:LINIE(6),
    q:'Pune coloana sonoră: trage <b>muzica-fundal.wav</b> din stânga pe linia de timp, sub scene, la 0:00. Fă-o cât filmul: clic pe ea și trage mânerul din dreapta până la capătul serii (0:18). Apoi, în dreapta, coboară <b>Volumul</b> pe la 70 % (între 50 și 90 %).',
    teste:[{ce:'Muzica e sub scene și începe la 0:00',muzicaDeLa0:MU,cum:'Trage muzica pe pista de sub scene, cât mai la stânga: se lipește de 0:00.'},
           {ce:'Muzica se termină odată cu filmul (0:18)',muzicaPanaLaCapat:MU,cum:'Clic pe muzică, apoi trage mânerul ei din dreapta spre stânga: se lipește de capătul serii.'},
           {ce:'Volumul muzicii e între 50 și 90 %',volum:{m:MU,de:[50,90]},cum:'Clic pe muzică; în dreapta, la Audio, glisorul Volum spre stânga.'}],
    solutie:[{trage:[MU,0]},{capat:[MU,18]},{volum:[MU,70]}],gresit:[{trage:[MU,0]},{volum:[MU,70]}],
    ajutor:'Tragere sub scene; mânerul din dreapta până la 0:18; glisorul Volum.',
    why:'Muzica stă pe pista ei, de la începutul până la capătul filmului, ceva mai încet decât fișierul.'}),
   inca:[
    {t:'choice',q:'Filmul are cinci scene a câte 4 secunde. Muzica, pusă de la 0:00, are 24 de secunde. Ce faci ca muzica să se termine odată cu filmul?',
     o:['Tragi mânerul din dreapta al muzicii până la 0:20','Tragi mânerul din dreapta al muzicii până la 0:24','Muți toată muzica, să înceapă de la 0:04','Mărești volumul muzicii la 200 %'],ok:0,
     ajutor:'Cât ține fiecare scenă? Unde se termină ultima?',why:'Cinci scene a câte 4 secunde: filmul se termină la 0:20. Capătul muzicii îl tragi până acolo, cu mânerul din dreapta.'},
    V({start:LINIE(6,{audio:[{m:MU,start:3}]}),
     q:'Muzica a fost lăsată la 0:03, deci filmul începe în liniște. Trage-o de mijloc până la 0:00, apoi scurteaz-o până la capătul serii.',
     teste:[{ce:'Muzica începe la 0:00',muzicaDeLa0:MU,cum:'Trage clipul muzicii (de mijlocul lui) spre stânga, până la 0:00.'},
            {ce:'Muzica se termină odată cu filmul (0:18)',muzicaPanaLaCapat:MU,cum:'Clic pe muzică, apoi mânerul din dreapta până la capătul serii.'}],
     solutie:[{inceputAudio:[MU,0]},{capat:[MU,18]}],gresit:[{capat:[MU,18]}],
     ajutor:'Întâi muți, apoi scurtezi.',why:'Coloana sonoră curge de la prima până la ultima scenă.'})
   ]},
  /* ---------- pasul 5 ---------- */
  {t:'Previzualizezi și alegi: tăietură sau tranziție?',
   text:`<p>La final privești tot filmul în <b>previzualizare</b>: ${S('|◀')} (la început), apoi ${S('▶')} sau bara de spațiu. Urmărești trecerile dintre scene și asculți dacă muzica se termină odată cu imaginea.</p>
<p>Apoi alegi, cu un motiv. O tranziție are rost acolo unde <b>trece timpul</b> sau <b>se schimbă locul</b>: de exemplu, de la școală, dimineața, la masa de acasă, seara. Între două scene din același loc și același moment, tăietura simplă e mai bună. Una-două tranziții alese cu rost ajung; zece la rând obosesc privitorul. Dacă ar avea rost în mai multe locuri, o păstrezi unde se schimbă cel mai mult (de exemplu, unde trec cele mai multe ore).</p>
<p class="gest"><b>La calculator, acum:</b> ${S('|◀')}, ${S('▶')} și privește tot filmul; apoi pune tranziția pe „Fără”, privește iar trecerea și adu-o înapoi cu ↶ Anulare.</p>`,
   exemplu:`<p>Un motiv bun se spune într-o propoziție: „Între scena de la școală și cea de acasă am pus o estompare lentă, pentru că a trecut o zi întreagă.” Sau: „Între cele două scene din clasă am lăsat tăietura simplă: e același moment, doar alt unghi.”</p>`,
   incearca:V({start:LINIE(6,{audio:MUZ(18),tranz:[{intre:[S1,S2]},{intre:[S2,S3]},{intre:[S3,S4]}]}),
    q:'Filmul colegului are tranziții la toate cele trei tăieturi. Scenele lui: răsăritul pe la ora 6, pădurea pe la ora 9, lacul pe la ora 12, apusul pe la ora 20. Lasă o singură tranziție, acolo unde trec cele mai multe ore, și scoate-le pe celelalte (clic pe tranziție, apoi „Fără”). La final, privește tot filmul: |◀, apoi ▶, până la capăt.',
    teste:[{ce:'A rămas o singură tranziție',nrTranzitii:1,cum:'Clic pe fiecare tranziție de prisos; în dreapta, „Fără”.'},
           {ce:'Tranziția rămasă e acolo unde trec cele mai multe ore',tranzitie:{intre:[S3,S4]},cum:'Câte ore trec: de la 6 la 9? de la 9 la 12? de la 12 la 20?'},
           {ce:'Ai privit tot filmul după ultima schimbare',vazutTot:true,cum:'Apasă |◀, apoi ▶, și lasă filmul să meargă până la capăt.'}],
    solutie:[{farTranzitie:S1},{farTranzitie:S2},{inceput:1},{reda:1},{asteapta:19}],gresit:[{farTranzitie:S2},{farTranzitie:S3},{inceput:1},{reda:1},{asteapta:19}],
    ajutor:'Dimineața e la răsărit, pădurea și lacul sunt ziua, seara e la apus. Între care două scene trec cele mai multe ore?',
    why:'La fiecare tăietură se schimbă locul, deci o tranziție n-ar fi greșită nicăieri. Dar una-două ajung, așa că o păstrezi unde se schimbă cel mai mult: de la lac (ora 12) la seară (ora 20) trec 8 ore; la celelalte, câte 3.'}),
   inca:[
    {t:'choice',q:'Filmul Anei: „la poarta școlii, dimineața”, „în clasă, la ora 8”, „tot în clasă, la ora 8, din alt colț”, „acasă, seara”. Unde are cel mai mult rost o tranziție lentă?',
     o:['Între „în clasă, din alt colț” și „acasă, seara”','Între cele două scene din clasă, de la ora 8','Câte una între toate scenele','Nicăieri: o tranziție nu are rost niciodată'],ok:0,
     ajutor:'Unde trece timpul și se schimbă locul?',why:'Și de la poartă la clasă se schimbă locul, dar trec doar câteva minute. De la clasă la acasă, seara, trec ore și se schimbă locul: acolo se schimbă cel mai mult. Cele două scene din clasă sunt din același moment: acolo merge tăietura simplă.'},

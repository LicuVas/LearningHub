const LECTIA={
 t:'Etică în mediul colaborativ: hacker și cracker. Protecția împotriva fraudei online',lectii:[21],continuturi:CONT,final:true,
 obiectiv:'respecți munca colegilor în documentul echipei, deosebești un hacker etic de un cracker și te aperi de phishing: recunoști mesajul-capcană și pagina falsă de conectare, iar parola o știi doar tu și părinții tăi.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Echipa voastră scrie într-un document partajat, în Documente Google, cu contul de la școală. Fiecare are partea lui. Azi afli trei lucruri: cum te porți corect cu munca colegilor, cine sunt hackerii și crackerii și cum recunoști un mesaj-capcană care vrea parola contului tău.</p>
${fig('../m3-l21/img/momeala.webp',500,448,'Două mâini pun o râmă pe cârligul unei undițe, ascuns între degete; se vede firul de pescuit','Pescarul pune momeala în cârlig. Un mesaj-capcană e tot o momeală: pare ceva bun sau urgent, ca să „muște” cineva. Fotografie: „Baiting the worm on the hook Claytor Lake State Park”, de vastateparksstaff (Virginia State Parks), <a href="https://creativecommons.org/licenses/by/2.0" target="_blank" rel="noopener">CC BY 2.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Baiting_the_worm_on_the_hook_Claytor_Lake_State_Park_(16264592740).jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> lecția 18 (contul Google de la școală, conectarea, fereastra privată, Profil → Deconectează-te), lecția 19 (documentul partajat, rolurile, comentariul), lecția 20 (istoricul versiunilor, contribuția fiecăruia); din clasa a VI-a, parola puternică și mesajul care îți cere parola; din clasa a V-a, bara de adrese a browserului și sursa unei informații.</p>`},
  /* ---------- pasul: etica în documentul echipei ---------- */
  {t:'Etica: munca colegului rămâne a lui',
   text:`<p><mark>Etica</mark> înseamnă regulile purtării corecte față de ceilalți. În documentul echipei:</p>
<ol><li><strong>Nu ștergi și nu schimbi ce a scris un coleg</strong> fără acordul lui. Ai văzut o greșeală? Îi lași un comentariu politicos sau întrebi echipa.</li>
<li><strong>Numele autorilor rămân</strong>: nu treci munca altuia pe numele tău.</li>
<li><strong>Treci sursa</strong> textelor și pozelor luate de la alții: munca lor e protejată de drepturile de autor.</li>
<li><strong>Documentul rămâne al echipei</strong>: nu-l partajezi cu oameni din afara ei. Nici cu „Oricine are linkul”, care îl deschide oricui primește adresa lui.</li></ol>`,
   exemplu:`<p>Radu a scris în capitolul lui că turnul cu ceas are 120 de ani. Mihai a citit pe placa de lângă turn că are 102. Nu schimbă cifra lui Radu. Selectează „120 de ani”, apasă <b>Adaugă un comentariu</b> (Add comment), scrie „Radu, pe placa de lângă turn scrie 102 ani. Verifici?” și apasă <b>Comentează</b> (Comment). Radu verifică și își corectează singur textul.</p>`,
   altfel:`<p>E ca la caietul colegului de bancă. Dacă vezi o greșeală, nu scrii tu peste ce a scris el: îi arăți locul și îi spui. Caietul e al lui, iar corectura o face el.</p>`,
   incearca:{t:'docEchipa',doc:DOC_PARC,tinta:'ioana',selectie:'300 de copaci',ancora:'300',gresit:{tip:'schimba',din:'300',in:'30'},
     variante:[
      {text:'Ștergi tot capitolul acesta, e greșit.',ok:false,dece:'cere ștergerea muncii Ioanei'},
      {text:'Am schimbat eu cifra în 30, nu te supăra.',ok:false,dece:'spune că ai schimbat textul Ioanei fără acordul ei'},
      {text:'Ioana, la biologie am numărat 30 de copaci, nu 300. Poți verifica?',ok:true,dece:'spune politicos ce ai observat, iar corectura o face Ioana'},
      {text:'Ai greșit iar! Nu știi să numeri?',ok:false,dece:'o ceartă și nu-i spune ce să verifice'}],
     q:'Ești Mihai și lucrezi în documentul echipei. La ora de biologie ați numărat împreună copacii din parc: erau 30. În partea Ioanei scrie însă „300 de copaci”. Fă ce e corect față de Ioana, apoi apasă <b>Verifică</b>.',
     ajutor:'Nu schimbi cifra Ioanei. Selectezi „300 de copaci” (tragi peste cuvinte), apeși „Adaugă un comentariu”, alegi comentariul politicos care spune ce ai observat și apeși „Comentează”.',
     why:'Comentariul spune politicos ce ai observat. Ioana îl vede și își corectează singură textul. Munca ei rămâne a ei, iar greșeala se repară.'},
   inca:[
    {t:'docEchipa',doc:DOC_DELTA,tinta:'ana',selectie:'luată de pe un site',gresit:{tip:'sterge'},
     variante:[
      {text:'Scot eu poza, că n-are sursă.',ok:false,dece:'strici munca Anei fără acordul ei'},
      {text:'Bună poza!',ok:false,dece:'e politicos, dar nu-i spune ce lipsește: sursa'},
      {text:'Poza asta e furată!',ok:false,dece:'o acuză și nu-i spune ce are de făcut'},
      {text:'Ana, te rog scrie sub poză de pe ce site ai luat-o.',ok:true,dece:'îi spune politicos ce lipsește, iar sursa o trece ea'}],
     q:'Alt document al echipei. Ești tot Mihai. Ana a pus o poză luată de pe un site, dar n-a scris sursa. Fă ce e corect față de Ana, apoi apasă <b>Verifică</b>.',
     ajutor:'Poza și textul sunt ale Anei: nu le ștergi. Îi lași un comentariu la „luată de pe un site”: alegi pe cel care îi cere politicos sursa.',
     why:'Sursa o trece Ana, care știe de unde a luat poza. Tu doar i-ai amintit, politicos, fără să-i strici munca.'},
    {t:'classify',q:'Ce e corect față de echipă și ce nu?',cats:['Corect','Nu e corect'],
     items:[['Îi trimiți linkul documentului unui prieten din altă școală, ca să scrie și el în el',1],['Întrebi echipa înainte să muți capitolul lui Radu la sfârșit',0],['Scoți numele Sarei de pe capitolul ei și scrii numele tău',1],['Treci sub un citat cartea din care l-ai luat',0],['Ștergi capitolul colegei pentru că ți se pare prea lung',1]],
     ajutor:'La fiecare, caută regula din pas: munca colegului, numele autorilor, sursa, cine are documentul.',
     why:'Prietenul din altă școală nu e din echipă. Numele Sarei rămâne pe munca ei. Capitolul colegei nu-l ștergi: îi lași un comentariu. Întrebarea către echipă și sursa trecută respectă munca altora.'}
   ]},
  /* ---------- pasul: hacker, hacker etic, cracker ---------- */
  {t:'Hacker, hacker etic, cracker',
   text:`<p>Un <mark>hacker</mark>, la început, era un pasionat care înțelege în profunzime calculatoarele și rețelele.</p>
<p>Un <mark>hacker etic</mark> caută punctele slabe ale unui site sau ale unei rețele <strong>cu permisiunea proprietarului</strong> și îi spune ce a găsit.</p>
<p>Un <mark>cracker</mark> intră <strong>fără drept</strong> în calculatorul, telefonul sau contul altcuiva, chiar dacă „doar se uită”. Codul penal pedepsește intrarea fără drept (articolul 360). Tot cracker e cine sparge protecția unui program, de exemplu codul de activare al unui joc. Fapta aceasta o pedepsește legea dreptului de autor.</p>
<p>Atenție: în știri, „hacker” înseamnă des „cracker”, iar dicționarul (DEX) îi dă doar sensul rău. De aceea spunem „hacker etic” sau „cracker”.</p>
${fig('../../../jocuri/colaborare-vii/img/lege-art360.webp',870,320,'Portalul legislativ oficial legislatie.just.ro: Codul penal, Articolul 360, Accesul ilegal la un sistem informatic, pedepsit cu închisoare de la 3 luni la 3 ani sau cu amendă','Textul legii, pe portalul oficial <b>legislatie.just.ro</b>: Codul penal, articolul 360, „Accesul, fără drept, la un sistem informatic se pedepsește…”. Un <b>sistem informatic</b> e orice aparat care lucrează cu date printr-un program: calculator, telefon, tabletă (articolul 181).')}`,
   exemplu:`<p>Aceeași pricepere, două fapte. Elena verifică site-ul școlii <b>la cererea directorului</b> și îi scrie ce a găsit: hacker etic. Victor intră în contul unui coleg <b>ghicindu-i parola</b>: cracker, chiar dacă „doar s-a uitat”.</p>`,
   altfel:`<p>Un lăcătuș chemat de proprietar încearcă încuietoarea și îi spune ce să schimbe: are voie. Același lăcătuș, dacă deschide noaptea ușa vecinului fără să-l întrebe, face o faptă pedepsită de lege, chiar dacă nu ia nimic.</p>`,
   incearca:{t:'classify',q:'Hacker etic sau cracker?',cats:['Hacker etic','Cracker'],
     items:[['Încearcă parola rețelei de internet a bibliotecii, la rugămintea bibliotecarei, și îi spune că e prea scurtă',0],['Citește mesajele surorii lui pe tableta ei, deblocată cu un cod văzut pe furiș',1],['Găsește o problemă pe site-ul unui magazin, într-un concurs organizat chiar de magazin, și o raportează',0],['Face un program care trece de codul de activare al unui joc și îl împarte gratis prietenilor',1],['Intră în catalogul electronic cu datele profesorului ca să-și schimbe nota',1]],
     ajutor:'La fiecare, întreabă-te: are permisiunea proprietarului? Repară sau ia ce nu e al lui?',
     why:'Bibliotecara și magazinul au cerut verificarea: hacker etic. Tableta surorii și catalogul profesorului: intrare fără drept (Codul penal). Codul jocului: protecție spartă (legea dreptului de autor). Toate trei sunt fapte de cracker. Un cod văzut pe furiș nu e o permisiune.'},
   inca:[
    {t:'choice',q:'Ai văzut din întâmplare parola unui coleg când a scris-o. Ce faci?',
     o:['Îi spui că ai văzut-o, ca s-o schimbe, și n-o folosești','Intri o singură dată în contul lui, doar să te uiți','O spui altor colegi, ca să râdeți','O păstrezi, poate îți trebuie cândva'],ok:0,
     ajutor:'Primele două propoziții din al treilea paragraf: ce face un cracker, chiar dacă „doar se uită”?',
     why:'Să intri în contul lui fără voia lui e intrare fără drept, chiar dacă „doar te uiți”. Îl ajuți dacă îi spui s-o schimbe.'}
   ]},
  /* ---------- pasul: phishingul ---------- */
  {t:'Phishingul: mesajul-capcană',
   text:`<p><mark>Phishingul</mark> (se citește „fișing”, de la „pescuit” în engleză) e o înșelătorie: un mesaj se dă drept cineva de încredere (școala, Google) ca să-ți ia parola.</p>
<p>Semnele:</p>
<ul><li><strong>te grăbește sau te amenință</strong>: „Contul se închide azi!”;</li>
<li><strong>îți promite un premiu</strong>: „Ai câștigat o tabletă!”;</li>
<li><strong>adresa expeditorului</strong> nu e una pe care o știi sigur, ca a școlii tale. Citește ce e după @ literă cu literă: cifra 0 în loc de litera o e semn. Numele afișat îl poate scrie oricine;</li>
<li><strong>îți cere parola</strong> sau te trimite, printr-un link, pe o pagină unde s-o scrii.</li></ul>
<p>Un singur semn ajunge: nu apeși pe linkuri și arăți mesajul profesorului sau părinților.</p>`,
   exemplu:`<p>Bianca primește „Scrie-ți parola aici, altfel contul se închide azi!”, de la o adresă pe care n-o știe. Două semne: graba și cererea parolei. Nu apasă pe link. În Gmail, cu mesajul deschis, apasă <b>⋮ Mai multe</b> (More), lângă <b>Răspunde</b> (Reply), apoi <b>Raportează ca phishing</b> (Report phishing). La oră îi arată profesorului.</p>`,
   altfel:`<p>Gândește-te la pescar: momeala arată ca mâncare, dar în ea e cârligul. Mesajul-capcană arată ca un mesaj de la școală, dar în el e cererea parolei.</p>`,
   incearca:{t:'hunt',q:'Mesajul de mai jos a sosit în contul de la școală. Are 4 locuri cu semne de phishing. Apasă pe ele.',
     src:'De la: Concursul Elevilor, [[premii@concurs-elevi-castiga.test|adresa nu e a școlii și nici a unui concurs pe care îl știi]] · Subiect: [[Ai câștigat o tabletă!|premiul nesperat e momeala]] · Bună, Bianca! Ai fost aleasă dintre toți elevii școlii. [[Premiul expiră în 30 de minute.|te grăbește, ca să nu apuci să întrebi pe cineva]] [[Ca să-l primești, conectează-te aici cu adresa și parola contului de la școală.|nimeni nu-ți cere parola printr-un mesaj: o scrii doar când te conectezi tu]] Felicitări!',
     indiciu:'Patru întrebări: cine trimite? îți promite ceva? te grăbește? îți cere parola?',
     ajutor:'Ia lista din pas pe rând: adresa expeditorului, premiul, graba, cererea parolei.',
     why:'Patru locuri: adresa necunoscută, premiul, graba și cererea parolei. Salutul cu numele tău nu face mesajul sigur.'},
   inca:[
    {t:'classify',q:'E semn de phishing sau nu?',cats:['Semn de phishing','Nu e semn'],
     items:[['Mesajul te amenință că mâine pierzi toate documentele',0],['Profesorul a spus la oră că vă trimite tema pe e-mail, iar mesajul vine de la adresa lui',1],['Expeditorul se numește „Echipa Google”, dar adresa lui este ajutor@g00gle-conturi.test',0],['Îți cere să-i trimiți parola „ca să-ți verifice contul”',0],['Colega din echipă îți scrie că a terminat partea ei din document',1]],
     ajutor:'Caută semnele din pas: graba sau amenințarea, premiul, adresa expeditorului, cererea parolei.',
     why:'Amenințarea, adresa cu cifra 0 în loc de litera o și cererea parolei sunt semne. Un mesaj așteptat, de la cineva cunoscut, care nu-ți cere nimic, nu e semn.'}
   ]},
  /* ---------- pasul: pagina de conectare ---------- */
  {t:'Pagina de conectare: citești adresa',
   text:`<p>Linkul dintr-un mesaj-capcană duce la o <mark>pagină falsă de conectare</mark>. Arată ca pagina Google, cu „Conectează-te” și „Înainte”. Deosebirea e în <b>bara de adrese</b>.</p>
<p>Google spune că parola contului se scrie numai la ${A('accounts.google.com')}. Ca să verifici, citești adresa de la început <strong>până la primul semn /</strong>. Dacă adresa începe cu https://, treci peste această parte. Până la primul / trebuie să scrie exact ${A('accounts.google.com')}: nimic în față, nimic după.</p>
<p>Nu scrie exact așa? Nu scrii nimic, închizi fila cu × și îi spui profesorului.</p>`,
   exemplu:`<ul class="ex-adr"><li>${A('accounts.google.com/v3/signin/identifier?continue=https://drive.google.com/')}: până la primul / scrie ${A('accounts.google.com')}, deci e pagina Google adevărată. Așa arată când intri în Drive.</li>
<li>${A('accounts.google.com.verificare-cont-elev.com/signin')}: până la primul / are ceva după „.com”. Începe la fel, dar e falsă.</li>
<li>${A('conturi-scoala.ro/login?continue=accounts.google.com')}: „accounts.google.com” apare abia după /. E falsă.</li></ul>`,
   altfel:`<p>E ca la un magazin: oricine își poate face o firmă care seamănă cu a unui magazin cunoscut, dar nu se poate muta la adresa lui. Te uiți la stradă și la număr, nu la firmă. O pagină falsă poate copia desenul paginii Google, dar nu poate avea adresa ei.</p>`,
   incearca:{t:'pagini',
     file:[
      {id:'f1',adresa:'accounts.google.com.verifica-contul-elevului.com/signin/v3',adevarata:false},
      {id:'f2',adresa:'accounts.google.com/v3/signin/identifier?continue=https://accounts.google.com/&flowName=GlifWebSignIn',adevarata:true},
      {id:'f3',adresa:'conectare-elevi.ro/login?continue=https://accounts.google.com/',adevarata:false},
      {id:'f4',adresa:'google-conturi-scoala.com/accounts.google.com/signin',adevarata:false}],
     q:'În browser sunt deschise patru file, fiecare cu o pagină „Conectează-te”. Apasă pe fiecare filă (nu pe ×) și citește bara de adrese. Închide cu × filele false și lasă deschisă doar pagina adevărată. Nu scrie nimic. Apoi apasă <b>Verifică</b>.',
     ajutor:'La fiecare filă citești adresa până la primul semn /. Rămâne doar fila la care acolo scrie exact accounts.google.com.',
     why:'Rămâne doar fila cu accounts.google.com până la primul /. Celelalte copiau doar desenul paginii.'},
   inca:[
    {t:'classify',q:'Pe ce pagină poți scrie parola contului Google de la școală?',cats:['Aici pot scrie parola','Nu scriu parola aici'],
     items:[['accounts.google.com/v3/signin/identifier?continue=https://mail.google.com/',0],['https://accounts.google.com/v3/signin/identifier?flowName=GlifWebSignIn',0],['accounts-google-conectare.com/signin',1],['accounts.google.com.com-securitate.net/login',1],['docs.google.com/forms/d/…/viewform, un formular care îți cere parola',1]],
     ajutor:'Citește fiecare adresă până la primul semn / (după https://, dacă apare). Scrie acolo exact accounts.google.com?',
     why:'Primele două au exact accounts.google.com până la primul /. A treia are cratime în loc de puncte („accounts-google-conectare”), iar a patra continuă după .com. Formularul e o pagină Google, dar nu e pagina de conectare: parola se scrie numai la accounts.google.com.'}
   ]},
  /* ---------- pasul: parola rămâne a ta ---------- */
  {t:'Parola rămâne a ta',
   text:`<p>Parola contului de la școală o știi doar tu și părinții tăi. N-o spui <strong>nimănui altcuiva</strong>: nici colegului care „te ajută”, nici cuiva care scrie că e profesorul. Google spune că nu-ți cere niciodată parola prin e-mail sau prin mesaj.</p>
<p>Ai scris-o totuși pe o pagină falsă sau ai spus-o cuiva? <strong>Spui imediat</strong> profesorului sau părinților. Profesorul și cel care administrează conturile școlii te ajută să schimbi parola.</p>
<p>Unele conturi au și <mark>verificarea în doi pași</mark>: după parolă, Google cere un al doilea pas, de exemplu o confirmare pe telefon. Așa, parola furată nu ajunge singură. La contul de la școală, întrebi profesorul dacă se poate.</p>`,
   exemplu:`<p>Matei a scris din greșeală parola pe o pagină falsă. Nu ascunde: îi spune chiar atunci profesorului, care îl ajută să schimbe parola. Apoi scrie în bara de adrese ${A('google.com/devices')}: vede calculatoarele și telefoanele pe care e deschis contul lui. Vede și un telefon pe care nu-l are, așa că îi arată profesorului lista, fără să schimbe nimic.</p>`,
   altfel:`<p>Parola e ca cheia de la casă: o ai tu și o au părinții tăi, dar n-o dai nimănui altcuiva, nici celui mai bun prieten. Dacă a luat-o cineva, spui imediat acasă, iar cei mari schimbă încuietoarea. La fel cu parola: spui imediat profesorului sau părinților, iar ei te ajută s-o schimbi.</p>`,
   incearca:{t:'classify',q:'Ce faci și ce nu faci cu parola?',cats:['Așa faci','Așa nu faci'],
     items:[['Îi dai parola colegului care vrea să-ți termine el partea din document',1],['Primești pe e-mail „Sunt profesorul, trimite-mi parola ca să-ți verific tema”: nu răspunzi și îi spui profesorului la oră',0],['Ai scris parola pe o pagină falsă și nu spui nimănui, ca să nu te cerți',1],['Îi spui imediat profesorului că ai scris parola pe o pagină cu adresa greșită',0],['Îți faci singur un cont nou, ca să scapi de cel cu parola furată',1]],
     ajutor:'Treci prin pas: cui spui parola? Cine îți cere parola prin mesaj? Ce faci imediat dacă ai greșit?',
     why:'Parola o știi doar tu și părinții tăi: n-o dai nimănui altcuiva și nu se trimite prin mesaj. Dacă ai greșit, spui imediat: profesorul te ajută să schimbi parola. Un cont nou nu repară nimic, iar contul vechi rămâne în mâna altuia.'},
   inca:[
    {t:'choice',q:'Colegul de bancă îți spune: „Dă-mi parola, îți pun eu poza în documentul echipei.” Ce faci?',
     o:['Nu-i dai parola; pui singur poza sau ceri ajutorul echipei la oră','I-o dai, că e prieten bun','I-o scrii pe un bilet, iar el îl aruncă după','I-o dai, apoi o schimbi peste o lună'],ok:0,
     ajutor:'Primul paragraf al pasului: cui spui parola?',
     why:'Parola o știi doar tu și părinții tăi, oricât de bun ar fi prietenul. Cu parola ta, colegul ar putea face orice în contul tău.'}
   ]}
 ],
 atelier:{t:'casuta',titlu:'Căsuța Biancăi: găsește capcanele',...CASUTA_BIANCA,
  intro:`<p>Ești Bianca. În contul ei de la școală au sosit 4 mesaje. Adresele de la școala ei se termină cu <b>@scoala-exemplu.test</b>. <strong>Sarcina:</strong></p>
<ol><li>Deschide-le pe toate și citește-le.</li>
<li>Deschide mesajul „Contul tău de elev se închide azi!”. Apasă sus <b>Marchez semnele</b> și atinge fiecare loc cu un semn de phishing. Apoi apasă <b>Citesc</b>.</li>
<li>Raportează mesajele-capcană: cu mesajul deschis, <b>⋮ Mai multe</b>, apoi <b>Raportează ca phishing</b>.</li>
<li>Mesajele adevărate rămân în Mesaje primite. În nicio pagină de conectare nu scrii nimic.</li></ol>
<p>Testele de jos se bifează singure. La final apeși <b>Verifică</b>. Ai greșit? „Ia-o de la capăt”.</p>`,
  q:'Găsește capcanele din căsuța Biancăi.',
  ajutor:'Semnele sunt cele din pasul despre phishing: adresa expeditorului, graba sau amenințarea, premiul, cererea parolei sau butonul spre o pagină unde s-o scrii.',
  why:'Căsuța Biancăi e în siguranță. <b>Ce am învățat:</b> în documentul echipei nu ștergi și nu schimbi munca colegilor, ci lași un comentariu; numele autorilor și sursele rămân; documentul nu-l partajezi cu străini. Hackerul etic lucrează cu permisiune; crackerul intră fără drept (pedepsit de Codul penal, articolul 360) sau sparge protecția unui program (pedepsit de legea dreptului de autor). Phishingul te grăbește, te amenință sau îți promite un premiu, vine de la o adresă necunoscută și îți cere parola. Parola o scrii numai când, până la primul /, adresa e exact accounts.google.com. Parola o știi doar tu și părinții tăi și n-o spui nimănui altcuiva; dacă ai greșit, spui imediat profesorului sau părinților.',
  inca:[
   {t:'casuta',...CASUTA_MIHAI,
    q:`Încă o căsuță: ești Mihai și ai 3 mesaje. Deschide-le pe toate. În mesajul „Documentul echipei va fi șters în 2 ore” marchează fiecare loc cu un semn de phishing (apasă sus <b>Marchez semnele</b>, apoi <b>Citesc</b>). Raportează capcana ca phishing. Mesajele adevărate rămân în Mesaje primite.`,
    ajutor:'Cine trimite, de fapt? Te grăbește? Îți cere parola sau te trimite pe o pagină unde s-o scrii?',
    why:'Capcana vine de la o adresă cu cifra 0 în loc de litera o, te grăbește și îți cere parola, chiar de două ori. Mesajul profesoarei îți cere tocmai să nu-i spui parola nici ei: o știi doar tu și părinții tăi și n-o spui nimănui altcuiva.'}
  ]},
 qs:[

/* ---------- „Acum în Google, cu contul tău de la școală” (regula 10: gesturi mici, reale, fără profesor) ---------- */
const PASI_REAL=[
  'Pe calculatorul din laborator deschide browserul și apasă <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>: se deschide o fereastră privată, ca la lecția 18. Lucrezi doar în ea.',
  'În bara de adrese scrie <code>drive.google.com</code> și apasă <kbd>Enter</kbd>. Apare pagina „Conectează-te”. <b>Înainte să scrii ceva</b>, citește bara de adrese până la primul semn /: trebuie să scrie exact <code>accounts.google.com</code>. Scrie altceva? Închide fereastra și spune-i profesorului.',
  'Conectează-te cu contul de la școală: adresa, <b>Înainte</b> (Next), parola, <b>Înainte</b>. Dacă browserul te întreabă de parolă, apeși <b>✕</b>, ca la lecția 18. N-ai cont sau nu-ți știi parola? Nu-ți face cont nou: închide fereastra privată cu <b>×</b>, sari la ultimul pas și spune-i profesorului la oră.',
  'Dacă îți mai rămâne timp, vezi unde e deschis contul tău: în bara de adrese scrie <code>google.com/devices</code> și apasă <kbd>Enter</kbd>. Apare o pagină a Contului Google cu aparatele pe care ești conectat. Calculatoarele din laborator apar și ele, unele cu „Deconectat”. Uită-te la felul aparatului (telefon sau calculator) și, dacă apare, la loc. Vezi un telefon pe care nu-l ai sau un loc foarte departe de școală și de casă? <b>Nu schimba nimic</b>: notează-l pe o foaie și spune-i profesorului. Pagina nu se deschide sau n-ai timp? Treci la pasul următor.',
  'Ai o întrebare adevărată pentru un coleg din echipă (documentul de la lecția 19)? Dacă ai făcut pasul 4, întoarce-te întâi în Drive: scrie din nou <code>drive.google.com</code> în bara de adrese și apasă <kbd>Enter</kbd>. În Drive, în stânga, deschide <b>Distribuite cu mine</b> (Shared with me) și dă dublu clic pe documentul echipei. Selectează cuvintele la care te referi, apasă <b>Adaugă un comentariu</b> (Add comment) și scrie întrebarea. Înainte de <b>Comentează</b> (Comment) întreabă-te: spune ce am observat? e politicos? nu cere ștergerea muncii colegului? Textul colegului nu-l schimbi. N-ai o întrebare adevărată sau un document al echipei? Sari peste acest pas: un comentariu „de probă” rămâne în documentul echipei, la vedere.',
  'Ai trimis un comentariu din greșeală? Pe comentariul tău apasă <b>⋮</b> Mai multe (More), apoi <b>Șterge</b> (Delete). Un comentariu adevărat îl lași: după ce colegul l-a citit și și-a corectat textul, îl închide cu <b>Rezolvă</b> (Resolve), sus pe comentariu. N-ai lăsat niciun comentariu? Treci mai departe.',
  'Te deconectezi: <b>Profil</b> (cerculețul cu inițiala ta, sus în dreapta), apoi <b>Deconectează-te</b> (Sign out). Scrie „Deconectează-te de la toate conturile” (Sign out of all accounts)? Pe acela îl apeși.',
  'Verifici: scrie din nou <code>drive.google.com</code> și apasă <kbd>Enter</kbd>. Trebuie să apară „Conectează-te” sau o listă de conturi în care contul tău apare ca deconectat, nu fișierele tale. Apoi închide fereastra privată cu <b>✕</b> din colțul ei de sus (nu fereastra lecției).',
  'Înapoi pe pagina lecției: apasă <b>La verificare →</b>, jos pe pagină, și răspunde la cele 5 întrebări.'

   contului; pașii din aplicația Documente pe Android = ajutorul Google 65129 (Android), citit 24.10.2026; bara de adrese
   „sus sau jos” = Safari pe iPhone (Apple: aspectul Compact / Bottom / Top); ce nu s-a putut vedea pe un telefon real e spus prudent */
const TELEFON=`<details class="tel"><summary>Lucrezi pe telefonul tău?</summary><p>Pe telefonul tău nu ai nevoie de fereastra privată (nici de <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>) și nu te deconectezi. Lucrezi cu contul de la școală pus pe telefon. Ghidurile cu poze: <a href="../../../jocuri/ghiduri/#cont-drive">contul de Google pe telefon</a>, <a href="../../../jocuri/ghiduri/#instalare">cum instalezi aplicația</a>, <a href="../../../jocuri/ghiduri/#docs">un document pe telefon</a>. Ce faci în loc:</p><ul>
<li><b>Adresa paginii de conectare (pașii 2-3).</b> În browserul telefonului scrii <code>drive.google.com</code> în bara de adrese (sus sau jos, depinde de telefon). Îți cere să te conectezi? Citești adresa la fel: până la primul / trebuie să scrie exact <code>accounts.google.com</code>.</li>
<li><b>Aparatele (pasul 4).</b> <code>google.com/devices</code> o scrii la fel, în bara de adrese a browserului.</li>
<li><b>Comentariul (pașii 5-6).</b> Îl lași în aplicația <b>Documente Google</b> (n-o ai pe telefon? ghidul „cum instalezi aplicația”, de mai sus). Pe Android: îl cauți în listă, îl deschizi cu o atingere, atingi <b>Editează</b> (creionul), apoi selectezi cuvintele, atingi <b>⋮</b> Mai multe, apoi <b>Adaugă un comentariu</b>, scrii și atingi <b>Trimite</b>. Ștergi un comentariu al tău: îl atingi, apoi <b>⋮</b> Mai multe și <b>Șterge</b>. Pe iPhone, butoanele pot sta în alt loc.</li>
<li><b>Deconectarea (pașii 7-8).</b> Telefonul e al altcuiva (al unui coleg, al părinților)? La final scoți contul de pe el. Pe Android: <b>Setări</b>, <b>Parole și conturi</b> (pe unele telefoane, „Utilizatori și conturi” sau „Gestionează conturile”), contul tău, <b>Elimină contul</b>, apoi confirmi (<b>Elimină contul</b> sau <b>Șterge</b>). Pe iPhone, contul nu e în Setări, ci în aplicație: atingi poza de profil, sus în dreapta, apoi <b>Gestionează conturile de pe acest dispozitiv</b> și <b>Elimină de pe acest dispozitiv</b>. Nu găsești sau îți cere codul telefonului? Îl rogi pe cel al cărui e telefonul să te ajute. Te-ai conectat și în browserul lui? Te deconectezi și acolo, cu <b>Deconectează-te</b>, ca la pasul 7.</li></ul></details>`;

<!doctype html>
<html lang="ro">
<head>

<title>Interfața aplicației de realizare a documentelor. Instrumente de bază</title>
<meta name="description" content="Lecția 2, clasa a VII-a: fereastra Word (panglica, filele, grupurile, riglele, bara de stare, bara Acces rapid) și primele instrumente: tastarea, Enter, semnele ¶, Backspace și Delete, Ctrl+Z și Ctrl+Y. Cu Word simulat în pagină.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Mono:wght@400;500&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
/* TEMA: fereastra Word văzută de sus — bara de titlu albastră, filele, pagina albă cu semnul ¶ */
:root{
  --desk:#E8EDF4; --paper:#FFFFFF; --paper2:#F0F3F8; --line:#C7D0DD;
  --ink:#172233; --ink2:#4B586B; --accent:#2B579A; --accentInk:#FFFFFF; --sel:#DCE6F5;
  --mark:#FFE58A; --markInk:#172233; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Literata",Georgia,"Times New Roman",serif; --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif; --fm:"Fira Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F151E; --paper:#172030; --paper2:#1E2939; --line:#344357; --ink:#E4EBF5; --ink2:#A5B2C4;
  --accent:#8DB2EE; --accentInk:#0F151E; --sel:#24385A; --mark:#E9C46A; --markInk:#172233;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#0F151E; --paper:#172030; --paper2:#1E2939; --line:#344357; --ink:#E4EBF5; --ink2:#A5B2C4;
  --accent:#8DB2EE; --accentInk:#0F151E; --sel:#24385A; --mark:#E9C46A; --markInk:#172233;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
body{background:var(--desk)}
/* banda: o bară de titlu, trei file, o pagină cu ¶ */
.banda{min-height:32px;padding:4px 10px;display:flex;align-items:center;gap:10px;background:var(--paper)}
.banda .bw{flex:none;width:22px;height:22px;border-radius:4px;background:#2B579A;color:#fff;font:700 .75rem/22px var(--fb);text-align:center}
.banda .bf{flex:1 1 40%;display:flex;gap:6px}
.banda .bf i{flex:1;height:6px;border-radius:2px;background:var(--ink2);opacity:.35}
.banda .bf i:nth-child(2){background:#2B579A;opacity:.8}
.banda .bp{flex:0 0 64px;height:24px;border:1px solid var(--line);background:#fff;color:#4A7FC1;font:600 .8rem/22px var(--fb);text-align:right;padding-right:6px}
h1{font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:600}
.tasta{font-family:var(--fm);font-size:.85em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--paper2);white-space:nowrap}
.sageata{font-family:var(--fm);font-size:.85rem;color:var(--ink2);margin:2px 0}
.pm{color:#4A7FC1}
.sursa-poza{font-size:.8rem;color:var(--ink2)}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/ui-panglica.js"></script>
<script src="../../../jocuri/_motor/panglica-word.js"></script>
<script src="../../_sim/wordobj.js"></script>
<script src="../../_sim/wordobj-interfata.js"></script>
<script>
/* LECȚIA 2, clasa a VII-a, modulul 1 (revizuirea LearningHub, standardul din 27.09.2026; refăcută după judecător, 28.09).
   Un nivel pe pași: pasul 0 „La ce folosește”, 5 pași cu „Încearcă”, atelierul în fereastra Word simulată, pasul
   „Acum la calculatorul din laborator”, 5 întrebări. Zoomul îl predă lecția 3, selectarea lecția 5 (decizia dirijorului).
   Simulatorul: lectii/_sim/wordobj-interfata.js (fereastra: bara Acces rapid, panglica reală, riglele, bara de defilare,
   bara de stare, semnele ¶, Ctrl+Z / Ctrl+Y ca în Word), în jurul documentului din lectii/_sim/wordobj.js (lecția 5).
   Afirmațiile „dacă faci X, apare Y” și proba lor în Word-ul real: afirmatii.json + _proba/. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/word-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const CAR='<span class="wo-car" aria-hidden="true"></span>';
const PM='<span class="pm">¶</span>';
const mini=(...p)=>`<div class="wo-mini">${p.map(x=>`<p>${x}</p>`).join('')}</div>`;
const BS='<span class="tasta">⌫</span>';
const PROG1='Interfaţa unei aplicaţii de realizare a documentelor';
const PROG2='Instrumente de bază ale unei aplicații de realizare a documentelor';
const FARA=[];                        // exerciții doar cu fereastra: fără tastele de pe ecran
const JOS_CLIC='Un clic (o atingere) în text pune cursorul acolo.';
const ZOOM3='Zoomul îl înveți în lecția 3.';
const IMG_TEXT=cap=>fig('img/text-doua-randuri.webp',800,102,'Pagina din Word: titlul Planul de luni, apoi un text pe două linii',cap);
const PROVOCARE=[
  `Pornește Word (butonul <b>Start</b> din Windows, scrii <b>Word</b>, clic pe Word) și dă clic pe <b>Document necompletat (Blank document)</b>. Dacă Word deschide direct pagina albă, treci mai departe.`,
  `Găsește pe ecran panglica, pagina, bara de defilare și bara de stare, cu „Page 1 of 1” și „0 words”. Nu vezi riglele? Fila <b>Vizualizare (View)</b>, bifa <b>Riglă (Ruler)</b>.`,
  `Pe fila <b>Pornire (Home)</b>, în grupul <b>Paragraf (Paragraph)</b>, apasă butonul <b>¶</b>.`,
  `Tastează <b>Planul de luni</b> și apasă <kbd>Enter</kbd>. Apoi tastează, cu greșeala cu tot: <b>Maria merge la filmm luni seara cu doi colegi.</b> Bara de stare arată <b>12 words</b>.`,
  `Corectează „filmm”: dă clic între cei doi m și apasă o dată <kbd>Delete</kbd>.`,
  `Dă clic după punctul de la capăt, apasă bara de spațiu și tastează: <b>Filmul e despre un robot mic, cu ochi mari, care vrea un prieten.</b> Nu apăsa Enter: Word trece singur pe rândul următor.`,
  `Apasă ${K('Ctrl+Z')}: dispare propoziția tastată la pasul 6 (dacă ai corectat ceva în timp ce o tastai, dispare doar ce ai scris după corectură). Apasă ${K('Ctrl+Y')}: revine.`,
  `Verifică: vezi doar două ¶ (după titlu și după „prieten.”), iar bara de stare arată <b>25 words</b>. Ceva nu e bine? Apasă ${K('Ctrl+Z')} o dată și uită-te ce s-a schimbat; repetă până dispare greșeala, apoi reia pasul la care ai greșit.`,
  `Apasă din nou <b>¶</b>: semnele dispar, textul rămâne. Nu salva și nu închide documentul: le înveți în lecția 3.`
];

JocMotor.porneste({
  cheie:'lectie_vii_m1_l02',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/vii/, „Lecția 2”, pasul din laborator înainte de verificare
  titlu:'Interfața aplicației de realizare a documentelor. Instrumente de bază',
  marca:'Lecția 2 · <b>Fereastra Word</b>',
  h1:'Interfața aplicației de realizare a documentelor. <em>Instrumente de bază</em>',
  clasa:'a VII-a', unitate:'VII-U1', unitateTitlu:'Tehnoredactare: editorul de texte',
  competente:['CS.1.1','CS.3.1'], lectii:'2',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.1, CS.3.1 · unitatea VII-U1 „Tehnoredactare: editorul de texte” · lecția 2 din modulul 1 · conținuturile: „Interfaţa unei aplicaţii de realizare a documentelor” și „Instrumente de bază ale unei aplicații de realizare a documentelor”',
  banda:'<span class="bw">W</span><span class="bf"><i></i><i></i><i></i><i></i></span><span class="bp">¶</span>',
  intro:`<p>Înveți părțile ferestrei <b>Word</b> (panglica, pagina, bara de stare) și primele instrumente: tastezi, treci la un paragraf nou cu ${K('Enter')}, vezi semnele ¶, ștergi cu ${BS} și <kbd>Delete</kbd>, anulezi cu ${K('Ctrl+Z')} și refaci cu ${K('Ctrl+Y')}. Exersezi în Word-ul simulat din pagină, apoi la calculatorul din laborator.</p>
<p><b>Ai nevoie de:</b> din clasa a V-a, clicul, dublu-clicul, tastarea literelor, fereastra unei aplicații și meniul <b>Start</b>.</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, faci exercițiul „Încearcă tu”; după o greșeală apare un indiciu, după două poți cere răspunsul. Urmează atelierul, pasul din laborator și 5 întrebări. Pe telefon, tastele Ctrl și săgețile sunt butoane sub fereastra simulată.</p>`,
  nivele:[
{t:'Interfața aplicației de realizare a documentelor. Instrumente de bază',lectii:[2],continuturi:[PROG1,PROG2],final:true,
 obiectiv:'găsești părțile ferestrei Word și folosești panglica, tastezi un text cu Enter doar la paragraf nou, vezi semnele ¶, corectezi cu Backspace și Delete, anulezi cu Ctrl+Z și refaci cu Ctrl+Y.',
 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Ai de scris o compunere, o invitație sau un referat. Pe caiet, o greșeală rămâne tăiată. Înainte de calculatoare, textele curate se scriau la <strong>mașina de scris</strong>, iar o greșeală se acoperea cu pastă corectoare.</p>
<p><strong>Word</strong> este o <mark>aplicație de realizare a documentelor</mark> (un procesor de text). Ce scrii în el se numește <mark>document</mark>. Corectezi oricând, fără să rescrii nimic. Documentul se păstrează într-un fișier .docx; salvarea o înveți în lecția 3.</p>
${fig('img/masina-de-scris.webp',960,640,'O mașină de scris galbenă, văzută de sus, cu tastele și cu rola pe care se punea foaia','O mașină de scris. Foto: PantheraLeo1359531, <a href="https://commons.wikimedia.org/wiki/File:Erika-Schreibmaschine_27102018.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, licența <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>.')}`},
  /* ---------- pasul 1 ---------- */
  {t:'Fereastra Word, de sus în jos',
   text:`<ul><li><strong>Bara de titlu</strong>, cu numele documentului („Document1”).</li>
<li><strong>Panglica (Ribbon)</strong>, cu butoanele.</li>
<li><strong>Pagina</strong>, albă: aici scrii. Deasupra ei și în stânga pot fi <strong>riglele (Ruler)</strong>, în centimetri.</li>
<li>În dreapta, <strong>bara de defilare</strong>: mută documentul în sus și în jos.</li>
<li>Jos, <strong>bara de stare (Status bar)</strong>: <strong>Page 1 of 1</strong> (pagina 1 din 1: pe ce pagină ești și câte are documentul) și <strong>25 words</strong> (25 de cuvinte). Numărul crește când tastezi. În Word-ul în română scrie la fel, în română.</li></ul>
${fig('img/fereastra-word.webp',1000,504,'Fereastra Word cu cinci zone încadrate cu roșu: panglica sus, rigla de deasupra paginii, rigla din stânga, pagina albă la mijloc și bara de stare jos','Word, fără bara de titlu. Încadrate: panglica, riglele, pagina, bara de stare.')}`,
   exemplu:`${fig('img/bara-stare.webp',510,42,'Bucata din stânga a barei de stare din Word: Page 1 of 1 și 25 words, încadrate cu roșu','Bara de stare: <b>Page 1 of 1</b> și <b>25 words</b>.')}
<p>Documentul e mai lung decât fereastra? Îl <mark>derulezi</mark>: rotița mouse-ului sau săgețile ▲ ▼ ale barei de defilare.</p>`,
   altfel:`<p>Fereastra e ca banca ta de lucru: sus, cutia cu unelte (panglica); la mijloc, foaia; jos, un bilețel cu numărul paginilor și al cuvintelor.</p>`,
   incearca:{t:'wordui',unelte:['selectare'],taste:FARA,jos:'',
    q:'Unde e <b>bara de stare</b>? Dă un clic pe ea (pe telefon: atinge-o).',
    start:['Planul de luni','Maria merge la film.'],
    teste:[{ce:'Ai dat clic pe bara de stare',zona:'stare'}],solutie:{zona:'stare'},
    ajutor:'E fâșia îngustă de la baza ferestrei, cu „Page 1 of 1” și numărul de cuvinte.',
    why:'Bara de stare e jos: pagina și numărul de cuvinte.'},
   inca:[
    {t:'wordui',unelte:['selectare'],taste:FARA,jos:'',ui:{inaltime:170},zoomLectie:ZOOM3,
     q:'Documentul e lung. Derulează până jos (rotița mouse-ului sau ▼ din bara de defilare) și dă un clic chiar după ultimul cuvânt, <b>Sfârșit.</b>',
     start:['Ce iau în excursie:','o sticlă cu apă','un sandviș','două mere','o pelerină','o șapcă','un caiet mic','un pix','o lanternă','o hartă','un fluier','Sfârșit.'],
     teste:[{ce:'Ai dat clic chiar după „Sfârșit.”',cursorFinal:true}],solutie:{cursor:'fin'},
     ajutor:'Apasă ▼ din dreapta până vezi „Sfârșit.”, apoi dă un clic chiar după punct.',
     why:'Bara de defilare a adus capătul documentului în fereastră.'},
    {t:'choice',q:'Pe bara de stare scrie „Page 2 of 3”. Ce înseamnă?',
     o:['Ești pe pagina 2; documentul are 3 pagini','Documentul are 2 pagini și 3 cuvinte','Ai scris 2 cuvinte din cele 3','Documentul are 2 pagini și 3 rigle'],ok:0,
     ajutor:'„of” înseamnă „din”.',why:'„Page 2 of 3” = pagina 2 din 3.'}
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Panglica: file, grupuri, butoane',
   text:`<p><strong>Panglica</strong> are mai multe <mark>file</mark>: <strong>Fișier (File)</strong>, <strong>Pornire (Home)</strong>, <strong>Inserare (Insert)</strong>, <strong>Vizualizare</strong> (View) și altele. Un clic pe numele unei file îi arată butoanele.</p>
<p>Pe o filă, butoanele stau în <mark>grupuri</mark>, cu numele dedesubt, de exemplu <strong>Clipboard</strong> și <strong>Font</strong>. Ține mouse-ul pe un buton: îi apare numele. Un buton cu ▾ deschide o listă. Săgeata mică ↘ din colțul unui grup, <mark>lansatorul casetei de dialog</mark>, deschide o fereastră cu toate opțiunile grupului.</p>
<p>Deasupra filelor, în stânga, poate fi <strong>bara Acces rapid (Quick Access Toolbar)</strong>, cu butoane folosite des; în Word-ul nou e ascunsă.</p>
${fig('img/panglica-grupuri.webp',1000,174,'Panglica Word pe fila Home, cu grupurile Clipboard, Font și Paragraph; încadrate cu roșu: fila Home, grupul Font și săgeata mică din colțul lui','Fila <b>Pornire (Home)</b>. Încadrate: numele filei, grupul <b>Font</b> și săgeata mică ↘.')}`,
   exemplu:`<p>Fila <strong>Fișier (File)</strong> e altfel: deschide o pagină cu comenzile pentru tot documentul (Nou, Deschidere, Salvare ca), din lecția 3. Fereastra deschisă de ↘ o închizi cu <strong>OK</strong> (păstrezi ce ai ales) sau <strong>Cancel (Anulare)</strong> (renunți).</p>`,
   altfel:`<p>Panglica e ca un dulap: filele sunt sertarele, grupurile despărțiturile din sertar, butoanele uneltele. Săgeata ↘ e ca atunci când scoți sertarul de tot, ca să vezi și ce e în fund.</p>`,
   incearca:{t:'wordui',unelte:['selectare'],taste:FARA,jos:'',zoomLectie:ZOOM3,
    q:'Deschide fereastra grupului <b>Font</b>: pe fila Pornire (Home), dă clic pe săgeata mică ↘ din colțul din dreapta-jos al grupului.',
    start:['Planul de luni'],
    teste:[{ce:'Ai deschis fereastra Font',lans:'FontDialog'}],solutie:{lans:['FontDialog']},
    ajutor:'Grupul Font e al doilea din stânga; săgeata ↘ e în colțul lui din dreapta, lângă nume. Pe telefon, dacă nu-l vezi, trage panglica spre stânga.',
    why:'Săgeata ↘ (lansatorul casetei de dialog) a deschis fereastra cu toate opțiunile grupului.'},
   inca:[
    {t:'wordui',unelte:['selectare'],taste:FARA,jos:'',ui:{rigle:false},zoomLectie:ZOOM3,
     q:'Riglele sunt ascunse. Afișează-le: fila <b>Vizualizare (View)</b>, apoi bifa <b>Riglă (Ruler)</b>.',
     start:['Planul de luni'],teste:[{ce:'Riglele se văd',rigle:true}],solutie:{rigle:true},
     ajutor:'View e sus, pe panglică, spre dreapta. Bifa Riglă (Ruler) e în grupul Afișare (Show).',
     why:'Bifa Riglă (Ruler) arată sau ascunde riglele.'},
    {t:'choice',q:'Dai clic pe numele filei <b>Inserare (Insert)</b>. Ce se schimbă?',
     o:['Panglica arată butoanele filei Inserare','Se deschide o fereastră cu opțiuni','Pagina se vede mai mare','Documentul primește o pagină nouă'],ok:0,
     ajutor:'Ce face un clic pe numele unei file?',why:'Clicul pe nume arată butoanele filei. Documentul nu se schimbă.'}
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Cursorul și indicatorul mouse-ului',
   text:`<p>Pe pagină clipește o linie verticală: <mark>cursorul</mark>. Ce tastezi apare acolo, iar literele de după el se mută la dreapta, ca să le facă loc.</p>
<p><mark>Indicatorul mouse-ului</mark> e altceva: se mișcă odată cu mouse-ul, pe tot ecranul. Deasupra paginii arată ca un I subțire; deasupra panglicii e o săgeată. Cursorul nu se mută după el.</p>
<p>Ca să muți cursorul, dai un <strong>clic</strong> în text, acolo unde îl vrei, sau apeși săgețile: <kbd>←</kbd> <kbd>→</kbd> cu câte o literă, <kbd>↑</kbd> <kbd>↓</kbd> mai sus sau mai jos.</p>`,
   exemplu:`<p>Cursorul stă înaintea lui „mere”:</p>${mini(`Ana ${CAR}mere.`)}<p class="sageata">↓ tastezi „are” și un spațiu</p>${mini(`Ana are ${CAR}mere.`)}`,
   altfel:`<p>Cursorul e vârful creionului pus pe foaie: acolo scrii. Indicatorul mouse-ului e degetul cu care arăți unde vrei să muți creionul; clicul îl mută acolo.</p>`,
   incearca:{t:'wordui',unelte:['text'],taste:['sageti'],jos:JOS_CLIC,zoomLectie:ZOOM3,
    q:'Adaugă cuvântul <b>are</b> între „Ana” și „mere”: dă un clic chiar înaintea lui „mere” și tastează <b>are</b>, apoi un spațiu. (Pe telefon scrii în caseta „Tastatura”.)',
    start:['Ana mere.'],tinta:['Ana are mere.'],tintaCe:'Textul este „Ana are mere.”',tipic:['Anaare mere.'],
    ajutor:'Clicul trebuie să cadă între spațiu și „m”. Ai tastat în alt loc? Șterge cu ⌫ și încearcă din nou.',
    why:'Literele au apărut la cursor, iar „mere.” s-a mutat la dreapta.'},
   inca:[
    {t:'wordui',unelte:['text'],taste:['sageti'],jos:JOS_CLIC,zoomLectie:ZOOM3,
     q:'Dă un clic chiar înaintea lui „P”. Apoi du cursorul după punctul de la capăt <b>doar cu săgeata →</b> (pe telefon: butonul →).',
     start:['Plecăm la ora 8.'],
     teste:[{ce:'Cursorul e după punct',cursorFinal:true},{ce:'Ai mutat cursorul cu săgețile',foloseste:'sageti'}],solutie:{cursor:'fin',log:['sageti']},
     ajutor:'Fiecare → trece peste o literă, un spațiu sau un semn.',
     why:'Fiecare → a mutat cursorul cu un semn, până după punct.'},
    {t:'choice',q:'Muți mouse-ul peste pagină, fără să dai clic. Ce face cursorul (linia care clipește)?',
     o:['Rămâne pe loc; se mută abia la clic','Se mută odată cu mouse-ul','Dispare până când dai clic','Sare la începutul paginii'],ok:0,
     ajutor:'Recitește ce face indicatorul mouse-ului.',why:'Indicatorul se mișcă singur; cursorul se mută abia la clic sau la săgeți.'}
   ]},
  /* ---------- pasul 4 ---------- */
  {t:'Enter și semnele ¶',
   text:`<p>Un <strong>rând</strong> e o linie de text. Când se umple, Word trece <strong>singur</strong> pe rândul următor. Tasta <kbd>Enter</kbd> o apeși doar când vrei un <mark>paragraf</mark> nou: după un titlu sau la o idee nouă. Paragraful e textul scris până la Enter, pe unul sau mai multe rânduri.</p>
<p>Pe fila <strong>Pornire (Home)</strong>, în grupul <strong>Paragraf (Paragraph)</strong>, butonul <strong>¶</strong>, <strong>Afișare/Ascundere ¶</strong> (în engleză „Show All”), arată <mark>semnele</mark> ascunse: ¶ unde s-a apăsat Enter și un punct · pentru fiecare spațiu. Nu se tipăresc; încă un clic și dispar.</p>
${fig(J+'buton-pilcrow.webp',74,36,'Butonul pe care e desenat semnul ¶, din grupul Paragraph al Word-ului, încadrat cu roșu','Butonul <b>¶</b>.')}`,
   exemplu:`${fig('img/text-cu-semne.webp',800,102,'Pagina din Word cu semnele pornite: puncte între cuvinte și semnul ¶ după titlu și la capătul paragrafului lung','Două ¶: după titlu și după „prieten.”. Primul rând al paragrafului lung se termină fără ¶: acolo Word a trecut singur mai jos.')}`,

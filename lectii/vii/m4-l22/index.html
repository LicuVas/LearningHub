/* banda de sus: literele părților și documentul echipei, cu trei culori (trei autori) — doar CSS */
.banda{display:flex;align-items:center;justify-content:center;gap:10px;min-height:38px;padding:4px 12px;overflow:hidden}
.banda .lit{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);font-family:var(--fd);font-weight:800;color:var(--accent)}
.banda .b-foaie{display:flex;flex-direction:column;gap:3px;width:58px;padding:5px 6px;border:1.5px solid var(--accent);border-radius:2px;background:var(--paper)}
.banda .b-foaie i{display:block;height:3px;border-radius:2px}
.banda .b-foaie i:nth-child(1){background:#137333;width:90%}
.banda .b-foaie i:nth-child(2){background:#B3261E;width:70%}
.banda .b-foaie i:nth-child(3){background:#7B1FA2;width:80%}
h1{font-size:clamp(1.3rem,5vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:480px}
figure.captura figcaption a{display:inline-block;padding:7px 2px;margin:-7px 0}
.reading ol li,.reading ul li{margin:.2em 0}
.cod{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere;word-break:break-all}
/* tabelul lucrării */
.tab-lucr{border-collapse:collapse;margin:.4em 0;max-width:100%}
.tab-lucr td,.tab-lucr th{border:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:top}
.tab-lucr td.nr{text-align:right;font-weight:700}
.tab-lucr tr.tot td{font-weight:800}
.tab-lucr .mic{font-size:.88em;color:var(--ink2)}
/* criteriile grilei la documentul echipei */
.crit-l{margin:.3em 0 .3em 1.2em;padding:0}
.crit-l li{margin:.25em 0}
/* tipul „numar” (copiat din lecția VII/17, care l-a luat din VII/10) */

.nr-in{font:inherit;min-height:40px;width:7em;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
/* grila profesorului, cu autoevaluarea (forma din lecțiile VII/9 și VII/17) */
.fl-grila{display:grid;gap:8px;margin:6px 0}
.fl-crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.fl-crit ul{margin:4px 0 6px;padding-left:1.1em}
.fl-crit .doc{color:var(--ink2);font-size:.92em;margin:2px 0 6px}
.fl-niv{display:flex;flex-wrap:wrap;gap:6px}
.fl-niv button{min-height:36px;min-width:36px;padding:4px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper2);color:var(--ink);font:inherit;cursor:pointer}
.fl-niv button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:700}
.fl-calc{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--paper);margin:8px 0}
.fl-calc p{margin:4px 0}
.fl-nou{margin:8px 0}
.fl-cap{margin:10px 0 4px}
/* blocul „Lucrezi pe telefonul tău?” — ca la VII/18-21 */
details.tel{margin:.6em 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}

<script>
/* ======================================================================================================
   Lecția VII · M4 · nr. 22 — „Evaluare sumativă: lucrul colaborativ (produs de echipă + contribuție individuală)”
   (VII-U3 „Aplicații colaborative”, CS.1.3; evaluare sumativă, 05.03.2027). Aplicația unității: Google (Drive, Documente
   Google), cu contul de la școală (decizia dirijorului, m3_noapte_23_10/prompturi/_noapte.md §1; m4_26_10/prompturi/_m4.md §3).
   NU predă nimic nou: trimite la lecțiile 18-21 (și la lecția 1, pentru notă), pe numele pasului.
   Testul unității VII-U3 („test_unitate, barem” în Proiectul_unitatii_VII-U3.md) NU există în documentele profesorului →
   „probă de antrenament” pe părțile C / B / A, cu punctele ei (_m4.md §2; ghidul IV.2 §6-7); întrebarea „Pentru profesor”
   e în surse.md. Grila de produs = Info_Gimnaziu_2026/instrumente/Grila_produs.md, întocmai (laboratorul, pasul 9).
   Simulatoarele, încărcate AȘA CUM SUNT: colab-google.js (VII/18), colab-google-echipa.js (VII/19), colab-google-istoric.js
   (VII/20), etica-colab.js (VII/21). Extensia lecției: lectii/_sim/eval-colab-vii.js (punctele probei, la prima verificare).
   SIGURANȚA: persoanele, adresele, parolele și documentele sunt INVENTATE (domeniul .test e rezervat pentru exemple).
   Ce tastează elevul nu se salvează și nu pleacă nicăieri; proba stă doar în memoria paginii.
   ====================================================================================================== */
const CONT=['Noțiunea de aplicație colaborativă','Accesare/conectare în aplicația colaborativă','Facilități ale aplicațiilor de tip colaborativ','Interfaţa aplicaţiei colaborative','Instrumente de lucru: documente, prezentări','Operații permise în aplicație: publicare, modificare conținuturi în aplicația colaborativă','Noțiuni de etică într-un mediu colaborativ; hacker și cracker','Protecția împotriva fraudei în mediul colaborativ online'];
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;
const K=SimColabGoogle.CONTURI;                      // ana, radu, ioana (adresă, nume, parolă inventată)
const P=SimColabEchipa.PERSOANE;                     // agenda școlii, inventată (cu un Radu Enescu și o a doua Ioana Rusu)
const D=SimColabGoogle.DOMENIU;                      // scoala-exemplu.test (inventat)
const PROF='profesor.tic@'+D;                        // adresa INVENTATĂ a profesorului din exerciții
/* trimiterile, pe numele pasului (ghidul T51), cu legătura „doar de citit” (?vezi=pK; P1 = „La ce folosește”) */
const R_=(l,p,nume,nr,din)=>`lecția ${l}, pasul <a href="../../vii/${l===18||l===19||l===20||l===21?'m3':l<=7?'m1':'m2'}-l${String(l).padStart(2,'0')}/?vezi=p${nr}" target="_blank" rel="noopener"><i>${nume}</i></a> (pasul ${nr} din ${din})`;
const L1_NOTA=`lecția 1, pasul <a href="../../vii/m1-l01/?vezi=p7" target="_blank" rel="noopener"><i>Din puncte, nota</i></a> (pasul 7 din 9)`;
const L1_SITE=`lecția 1, pasul <a href="../../vii/m1-l01/?vezi=p8" target="_blank" rel="noopener"><i>Din lucrare și LearningHub, nota din catalog</i></a> (pasul 8 din 9)`;
const L18_CON=R_(18,'p3','Accesarea și conectarea',3,6), L18_PC=R_(18,'p4','Pe calculatorul comun: contul tău rămâne doar al tău',4,6),
      L18_DOC=R_(18,'p5','Un document nou în Drive: numele și salvarea automată',5,6);
const L19_PART=R_(19,'p2','Partajarea: dai acces colegilor',2,6), L19_ROL=R_(19,'p3','Rolurile: Editor, Comentator, Cititor',3,6);
const L20_IST=R_(20,'p4','Istoricul versiunilor: cine a scris ce',4,6), L20_NUME=R_(20,'p5','Ce faci cu o versiune din istoric: nume sau restabilire',5,6),
      L20_PUBL=R_(20,'p6','Publicarea: dai lucrarea gata mai departe',6,6);
const L21_ETICA=R_(21,'p2','Etica: munca colegului rămâne a lui',2,6);
const L22_P4=`lecția de azi, pasul <a href="?vezi=p4" target="_blank" rel="noopener"><i>Contribuția ta: o arată istoricul versiunilor</i></a> (pasul 4 din 5)`;

/* ---------- grila profesorului (instrumente/Grila_produs.md, întocmai): de citit în P3 (pliată) și, cu autoevaluarea, în laborator ---------- */
const GRILA=[
  ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
  ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']];
const NIV=['De bază (cu sprijin, model)','Consolidat (independent)','Avansat (context nou, justificat)'];   // capetele de coloană din Grila_produs.md
const REP=[10,14,18];
/* J1-F (registru_j1.md, F): grila întreagă, doar de citit, în pasul 3 — elevul o vede înainte de laborator;
   J2-S: titlul o spune OPȚIONALĂ (nu cere citirea), ca drumul să rămână ≤ 50 min */
const GRILA_CITIT=`<details class="tel grila-citit"><summary>Dacă vrei să vezi grila întreagă a profesorului (o ai și la laborator, pasul 9)</summary><div class="fl-grila">${GRILA.map((c,i)=>`<div class="fl-crit"><b>${i+1}. ${c[0]}</b><ul>${NIV.map((n,j)=>`<li><i>${n} · ${REP[j]} p:</i> ${c[j+1]}</li>`).join('')}</ul></div>`).join('')}</div><p>0 p dacă lipsește cu totul; profesorul poate da și între repere (12, 16).</p></details>`;

/* ---------- tipul „numar” (copiat din lecția VII/17, care l-a luat din VII/10 și VII/1): elevul scrie nota pe care o obține ---------- */
const citesteNr=s=>{s=String(s||'').trim().toLowerCase().replace(/(\d)[\s ]+(?=\d)/g,'$1').replace(',','.');
  const m=s.match(/^(-?\d+(?:\.\d+)?)(?:\s*[a-zăâîșşțţ]+(?:\s+[a-zăâîșşțţ]+)*)?\s*\.?$/);return m?parseFloat(m[1]):null};
const fmtNr=v=>String(v).replace('.',',');
const TipNumar={
  render(Q,body,api){
    body.innerHTML=`<div class="nr-rand"><label>${api.esc(Q.eticheta||'Răspunsul tău')}: <input class="nr-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></label></div>`;
    const inp=body.querySelector('.nr-in');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=document.getElementById('chk');if(b)b.click()}});
    const nav=api.checkButton(()=>{
      const v=citesteNr(inp.value.replace(/^\s*[a-zăâîșşțţ]+:?\s+(?=-?\d)/i,''));
      if(v===null){api.feedback('bad','<strong>Scrie doar numărul</strong>, cu cifre (de exemplu 10).');inp.focus({preventScroll:true});return}
      if(Math.abs(v-Q.ok)<1e-9){inp.disabled=true;nav.innerHTML='';api.resolve(true);return}
      const cap=(Q.capcane||{})[String(v)];
      api.resolve(false,cap||`${fmtNr(v)} nu e răspunsul. Refă socoteala: adună punctele și cele 10 din oficiu, împarte la 10, rotunjește.`);
      inp.focus({preventScroll:true});inp.select();
      api.revealButton(()=>{inp.value=fmtNr(Q.ok);inp.disabled=true;nav.innerHTML='';api.giveUp(`<b>${fmtNr(Q.ok)}</b>`)});
    });
  },
  rezolva(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.ok);return true},
  gresit(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.tipic);return true}
};

/* ---------- documentele inventate ---------- */
/* B1 și P4: „Orașul nostru - echipa 4” (proprietara: Ioana; patru paragrafe, patru versiuni) — colab-google-istoric.js */
const O1='Orașul nostru are un parc mare, cu un lac și o pistă pentru biciclete.';
const O2='La muzeul orașului sunt pești fosili, vechi de milioane de ani.';
const O3='Biblioteca orașului are o sală de lectură numai pentru copii.';
const O4='Duminica, în piața centrală, e un târg de cărți vechi.';
const ORAS=[
  {id:'v1',cand:'luni, 22 februarie, 16:10',autori:['ioana'],par:[{id:'o1',autor:'ioana',text:O1}]},
  {id:'v2',cand:'luni, 22 februarie, 17:45',autori:['radu'],par:[{id:'o1',autor:'ioana',text:O1},{id:'o2',autor:'radu',text:O2}]},
  {id:'v3',cand:'marți, 23 februarie, 15:20',autori:['maria'],par:[{id:'o1',autor:'ioana',text:O1},{id:'o2',autor:'radu',text:O2},{id:'o3',autor:'maria',text:O3}]},
  {id:'v4',cand:'marți, 23 februarie, 18:30',autori:['mihai'],par:[{id:'o1',autor:'ioana',text:O1},{id:'o2',autor:'radu',text:O2},{id:'o3',autor:'maria',text:O3},{id:'o4',autor:'mihai',text:O4}]}];
const SIM_ORAS=(ist)=>({start:'doc',cont:K.ioana,deschis:'oras',
  fisiere:[{id:'oras',titlu:'Orașul nostru - echipa 4',tip:'doc',loc:'meu',modificat:'23 feb.',text:[O1,O2,O3,O4].join('\n')}],
  istoric:Object.assign({eu:'ioana',profesor:{adresa:PROF,nume:'Profesorul de TIC'},
    acces:[{adresa:'radu.ene@'+D,nume:'Radu Ene',rol:'editor'},{adresa:'maria.lazar@'+D,nume:'Maria Lazăr',rol:'editor'},{adresa:'mihai.stan@'+D,nume:'Mihai Stan',rol:'editor'}]},{versiuni:ORAS},ist||{})});
/* P4 (Încearcă): ghidul taberei — proprietar Mihai; Ana e Editor — colab-google-istoric.js */
const T1='Tabăra are loc la munte, la Durău, între 5 și 9 iulie.';
const T2='Dormim în căsuțe de lemn, câte patru copii într-o căsuță.';
const T3='În fiecare seară facem un foc de tabără și cântăm.';
const TABARA=[
  {id:'v1',cand:'joi, 18 februarie, 15:00',autori:['mihai'],par:[{id:'t1',autor:'mihai',text:T1}]},
  {id:'v2',cand:'joi, 18 februarie, 19:10',autori:['maria'],par:[{id:'t1',autor:'mihai',text:T1},{id:'t2',autor:'maria',text:T2}]},
  {id:'v3',cand:'vineri, 19 februarie, 14:25',autori:['ana'],par:[{id:'t1',autor:'mihai',text:T1},{id:'t2',autor:'maria',text:T2},{id:'t3',autor:'ana',text:T3}]}];
const SIM_TABARA={start:'doc',cont:K.ana,deschis:'tabara',
  fisiere:[{id:'tabara',titlu:'Ghidul taberei - echipa 1',tip:'doc',loc:'distribuite',modificat:'19 feb.',text:[T1,T2,T3].join('\n')}],

    acces:[{adresa:'mihai.stan@'+D,nume:'Mihai Stan',rol:'editor'},{adresa:'maria.lazar@'+D,nume:'Maria Lazăr',rol:'editor'}]}};
/* C2 și A1: documentul Anei („Pop_Ana_7A_colaborare”) — colab-google-echipa.js */
const NUME_ANA='Pop_Ana_7A_colaborare', NUME_IOANA='Rusu_Ioana_7B_colaborare';
const DOC_ANA=(extra)=>Object.assign({id:'a-oras',titlu:NUME_ANA,tip:'doc',loc:'meu',modificat:'acum',
  paragrafe:[{autor:'eu',text:'Orașul nostru, documentul echipei 2.'},{autor:'eu',text:'Partea Anei: parcul și lacul.'}]},extra||{});
/* B2: documentul echipei, desenat — etica-colab.js (tipul docEchipa) */

  {id:'radu',autor:'Radu',titlu:'1. Muzeul (scrie Radu)',text:'Muzeul are trei săli. Intrarea costă 5 lei pentru elevi.'},

/* ---------- PROBA DE ANTRENAMENT (atelierul): 5 cerințe; punctele după structura lucrării (SISTEM_EVALUARE.md §4.1:
   C 40, B 30, A 20, 10 din oficiu); punctele pe cerințe sunt ale paginii. C: cu pașii dați (lecțiile 18-19);
   B: singur, situație cunoscută (lecțiile 20-21); A: situație nouă (lecțiile 19 + 20 legate) + explicația. Socotite la
   PRIMA verificare, doar în memoria paginii (lectii/_sim/eval-colab-vii.js). ---------- */
EvalColabVII.configureaza({titlu:'Proba de antrenament',oficiu:10,
  parti:{C:{nume:'De bază',max:40},B:{nume:'Consolidat',max:30},A:{nume:'Avansat',max:20}},

         {id:'A1',parte:'A',puncte:12},{id:'A2',parte:'A',puncte:8}]});
/* Reparația după judecata 1 (registru_j1.md, A): testele de PAZĂ (străin în listă, „Oricine are linkul”, Restabilește, Publică pe
   web) au puncte, socotite doar împreună cu lucrul cerut (`paza`); ce strici pierde punctele și apare la „Unde ai pierdut puncte”.
   B: la B2, textul Mariei schimbat anulează cerința (`obligatorii`), iar comentariul se punctează doar dacă e cel potrivit. */

const LECTIA={
 t:'Evaluare sumativă: lucrul colaborativ (produs de echipă + contribuție individuală)',lectii:[18,19,20,21,22],continuturi:CONT,final:true,
 obiectiv:'știi cum se notează lucrarea și produsul echipei, îți găsești contribuția în istoricul versiunilor, spui ce ai învățat de la echipă și afli, pe o probă de antrenament, ce mai ai de recitit.',
 pasi:[
  /* ---------- pasul 0: la ce folosește (fără acțiuni) ---------- */
  {t:'La ce folosește',
   text:`<p>La lecțiile 18-21 ați scris documentul echipei, în Google, fiecare cu paragraful lui.</p>
<p>Ora 22 e <mark>evaluarea</mark> unității. Profesorul se uită la <b>produsul echipei</b> și, separat, la <b>contribuția fiecăruia</b>, care se vede în <mark>istoricul versiunilor</mark> (lista cu variantele vechi ale documentului, de la lecția 20). Fiecare spune și ce a învățat de la echipă.</p>
${fig('../m3-l19/img/echipa-laptopuri.webp',800,315,'O masă cu trei laptopuri deschise; doi oameni, văzuți din spate și din profil, lucrează fiecare pe laptopul lui','Voluntari scriu la Wikipedia, fiecare de pe laptopul lui. Fotografie: Avery Jensen, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Art_Students_League_Archive_Edit-a-thon_9483.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> lecțiile 18-21 și lecția 1 (părțile lucrării și nota).</p>`},
  /* ---------- pasul 1: părțile lucrării și nota (DOAR ce spune lecția 1, pașii 6-9; ca la VII/10) ---------- */
  {t:'Lucrarea: părțile C, B, A și nota',
   text:`<p>O lucrare are trei părți, de la ușor la greu, cu literele nivelurilor:</p>
<table class="tab-lucr"><thead><tr><th>Partea</th><th>Puncte</th></tr></thead><tbody>
<tr><td><b>C · De bază</b><br><span class="mic">după pașii dați</span></td><td class="nr">40</td></tr>
<tr><td><b>B · Consolidat</b><br><span class="mic">singur, ca la exercițiile de la clasă</span></td><td class="nr">30</td></tr>
<tr><td><b>A · Avansat</b><br><span class="mic">o situație nouă și explicația ta</span></td><td class="nr">20</td></tr>
<tr><td>din oficiu</td><td class="nr">10</td></tr>
<tr class="tot"><td>Total</td><td class="nr">100</td></tr></tbody></table>
<p><mark>Nota = punctaj : 10</mark>, rotunjită la cel mai apropiat întreg; la ,5, în favoarea ta (${L1_NOTA}). Nivelul se citește din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate.</p>`,
   exemplu:`<p>C 35 + B 18 + A 9 + 10 din oficiu = 72 de puncte; 72 : 10 = 7,2: nota 7, Consolidat. Părțile arată unde ai pierdut puncte.</p>
<p>La lucrarea de modul se adaugă munca pe LearningHub (${L1_SITE}).</p>`,
   altfel:`<p>E ca la un concurs de gimnastică: fiecare aparat aduce puncte, iar clasamentul se face după total. Punctele de la fiecare aparat îți arată unde mai ai de lucrat.</p>`,
   incearca:{t:'numar',q:'Bianca are la lucrare C 36, B 23 și A 6 puncte, plus cele 10 din oficiu. Ce notă are?',eticheta:'Nota',ok:8,tipic:7,
     capcane:{'7':'36 + 23 + 6 + 10 = 75, iar 75 : 10 = 7,5. La ,5 exact rotunjești în favoarea ta, în sus.','7.5':'Nota e un număr întreg: la ,5 exact rotunjești în sus, în favoarea ta.','75':'75 e punctajul. Îl împarți la 10, apoi rotunjești.','6.5':'Ai uitat cele 10 puncte din oficiu? 36 + 23 + 6 + 10 = 75.','65':'Ai uitat cele 10 puncte din oficiu? 36 + 23 + 6 + 10 = 75.'},
     ajutor:'Adună cele trei părți și cele 10 din oficiu, apoi împarte la 10. La ,5 în ce parte rotunjești?',
     why:'36 + 23 + 6 + 10 = 75; 75 : 10 = 7,5, la jumătate: nota 8, Consolidat.'},
   inca:[
    {t:'tf',q:'Radu are la lucrare C 40, B 12 și A 2 puncte, plus oficiul. Fiindcă a luat toate punctele la partea C, nivelul lui e Consolidat.',ok:false,
     ajutor:'Socotește întâi nota: 40 + 12 + 2 + 10. Apoi citește nivelul din notă.',
     why:'Fals. 40 + 12 + 2 + 10 = 64 de puncte; 64 : 10 = 6,4, deci nota 6 și nivelul De bază. Nivelul se citește din notă, nu dintr-o parte.'},
    {t:'choice',q:'O cerință a lucrării spune: „Deschide Permite accesul, scrie adresa lui Radu, alege rolul Editor și apasă Trimite.” În ce parte e?',
     o:['C · De bază: îți dă pașii, unul câte unul','B · Consolidat: lucrezi singur, fără pași','A · Avansat: o situație nouă, cu explicație','În nicio parte: e doar un sfat'],ok:0,
     ajutor:'Cerința îți spune pașii, unul câte unul?',
     why:'Cerința îți dă pașii, deci e la nivelul De bază, adică partea C.'}
   ]},
  /* ---------- pasul 2: produsul echipei, grila de produs ---------- */
  {t:'Produsul echipei: grila de produs',
   text:`<p>Documentul echipei se notează cu <mark>grila de produs</mark> a profesorului (lecția 9): 5 criterii, la fiecare <b>0 – 18 puncte</b>; reperele: De bază 10, Consolidat 14, Avansat 18. Se adună criteriile și <b>10 din oficiu</b>; nota = punctaj : 10, ca la lucrare.</p>
<p>Cum pune profesorul împreună produsul, contribuția ta și lucrarea îți spune el.</p>`,
   exemplu:`<p>Criteriile la documentul echipei (citirea lecției):</p>
<ol class="crit-l"><li><b>Respectarea cerinței</b>: câte un paragraf de la fiecare;</li><li><b>Corectitudinea tehnică</b>: partajat corect, versiunea numită, comentariile rezolvate de autorii lor;</li><li><b>Organizarea</b>: paragrafele în ordine, sub un titlu;</li><li><b>Explicația</b>: ce ai învățat de la echipă;</li><li><b>Munca proprie / sursele</b>: fiecare scrie, de pe contul lui, doar partea lui.</li></ol>${GRILA_CITIT}`,
   altfel:`<p>E ca la o expoziție a clasei: juriul se uită întâi la lucrarea întreagă (e completă? e îngrijită?), apoi întreabă fiecare autor ce a făcut el și ce a învățat.</p>`,
   incearca:{t:'numar',q:'Documentul echipei lui Tudor: 14, 14, 10, 10 și 14 puncte la cele 5 criterii. Ce notă are?',eticheta:'Nota',ok:7,tipic:6,
     capcane:{'6':'14 + 14 + 10 + 10 + 14 = 62, plus 10 din oficiu = 72; 72 : 10 = 7,2, rotunjit: 7.','6.2':'Ai uitat cele 10 puncte din oficiu? 62 + 10 = 72.','62':'62 e suma criteriilor: adaugă cele 10 din oficiu, apoi împarte la 10.','72':'72 e punctajul. Îl împarți la 10, apoi rotunjești.','7.2':'Nota e un număr întreg: 7,2 se rotunjește la cel mai apropiat întreg.','8':'14 + 14 + 10 + 10 + 14 = 62, plus 10 din oficiu = 72; 72 : 10 = 7,2, care se rotunjește la 7, nu la 8.'},
     ajutor:'Adună cele 5 criterii și cele 10 din oficiu, apoi împarte la 10 și rotunjește la cel mai apropiat întreg.',
     why:'14 + 14 + 10 + 10 + 14 = 62; cu oficiul, 72; 72 : 10 = 7,2: nota 7, Consolidat.'},
   inca:[
    {t:'numar',q:'Documentul echipei Elenei: 18, 14, 10, 10 și 13 puncte. Ce notă are?',eticheta:'Nota',ok:8,tipic:7,
     capcane:{'7':'18 + 14 + 10 + 10 + 13 = 65, plus 10 din oficiu = 75; 75 : 10 = 7,5. La ,5 rotunjirea e în favoarea ta: 8.','7.5':'Nota e un număr întreg: la ,5 rotunjești în favoarea ta, la 8.','75':'75 e punctajul. Îl împarți la 10, apoi rotunjești.','65':'65 e suma criteriilor: adaugă cele 10 din oficiu.','6.5':'Ai uitat cele 10 puncte din oficiu? 65 + 10 = 75.'},
     ajutor:'Adună, adaugă 10, împarte la 10. La ,5 în ce parte rotunjești?',why:'18 + 14 + 10 + 10 + 13 = 65; cu 10 din oficiu, 75; 75 : 10 = 7,5, la jumătate, deci nota 8, Consolidat.'},
    {t:'classify',q:'La ce criteriu al grilei se vede fiecare lucru din documentul echipei?',cats:['1. Respectarea cerinței','2. Corectitudinea tehnică','5. Munca proprie / sursele'],
     items:[['Lipsește paragraful lui Mihai, deși tema cerea câte unul de la fiecare',0],['Documentul a rămas pe „Oricine are linkul”',1],['Radu a mutat în partea lui paragraful scris de Maria, ca pe al lui',2],['Ana și-a scris paragraful de pe contul lui Radu',2]],
     ajutor:'Citește lista din „Uite cum”: ce scrie la criteriile 1, 2 și 5?',
     why:'Paragraful lipsă: tema nu e respectată (1). Partajarea greșită: corectitudinea tehnică (2). Paragraful Mariei luat ca al lui și munca scrisă de pe alt cont: munca proprie (5); istoricul arată cine a scris.'}
   ]},
  /* ---------- pasul 3: contribuția fiecăruia, în istoric (reluare VII/20) + gestul „rolul cuiva din listă” pe fereastra VII/19
     (reparația 1, registru J1 C: îl cer A1 și laboratorul, pasul 7; ajutorul RO drive/answer/2494893, afirmatii A24-A25) ---------- */
  {t:'Contribuția ta: o arată istoricul versiunilor',
   text:`<p>Contribuția ta se vede în <b>istoricul versiunilor</b> (Version history), ca la ${L20_IST}: dreapta sus, ceasul cu săgeată (Ultima modificare / Last edit). Lângă fiecare versiune scrie cine a lucrat, cu o culoare; partea lui din text are aceeași culoare.</p>
<p>Istoricul arată <b>contul</b> cu care s-a scris: fiecare scrie de pe contul lui. Îl văd doar Editorii și proprietarul.</p>
<p>Rolul cuiva din listă îl schimbă proprietarul, în <b>Permite accesul</b> (lecția 19): în dreptul numelui, săgeata în jos, rolul nou, <b>Salvează</b> (Save; în desenul din pagină, <b>Gata</b>).</p>`,
   exemplu:`<p>Ana apasă pe versiuni, pe rând. La versiunea de marți, 15:20 scrie Maria Lazăr, iar paragraful despre bibliotecă are culoarea ei: l-a scris Maria.</p>`,
   altfel:`<p>E ca un album cu poze ale documentului, făcute după fiecare schimbare. Sub fiecare poză scrie cine a schimbat și când, iar partea nouă e colorată cu culoarea lui.</p>`,
   incearca:{t:'colabIstoric',q:'Ești Ana, Editor în ghidul taberei al lui Mihai. În istoric, găsește cine a scris paragraful despre căsuțe (răspunsul, sub simulator), apoi ieși cu Înapoi.',
     sim:SIM_TABARA,
     intrebare:{q:'Cine a scris paragraful despre căsuțe?',o:['Mihai Stan','Maria Lazăr','Ana Pop','Radu Ene'],ok:1},
     teste:[{c:'vazut',v:'v2',d:'Ai ales versiunea cu paragraful despre căsuțe'},{c:'raspuns'},{c:'inapoi'}],gresit:{raspuns:0},
     ajutor:'Ceasul cu săgeată, sus în dreapta. Apasă pe versiuni, pe rând, până vezi paragraful despre căsuțe colorat. Numele cu aceeași culoare e răspunsul. Apoi ← Înapoi.',
     arata:'ceasul cu săgeată → versiunea de joi, 19:10 → paragraful despre căsuțe e colorat cu culoarea Mariei Lazăr → ← Înapoi.',
     why:'În versiunea de joi, 19:10, paragraful despre căsuțe are culoarea Mariei Lazăr.'},
   inca:[
    {t:'choice',q:'Profesorul are, în documentul echipei, rolul Comentator. Ce poate vedea?',
     o:['Textul documentului, nu și istoricul versiunilor','Istoricul versiunilor, cu numele fiecăruia','Parolele conturilor din echipă','Nimic: un Comentator nu deschide documentul'],ok:0,
     ajutor:'Ultima propoziție a pasului: cine vede istoricul?',
     why:'Istoricul îl văd doar Editorii și proprietarul. Comentatorul citește textul și lasă comentarii, dar nu vede cine ce a scris.'}
   ]},
  /* ---------- pasul 4: ce ai învățat de la echipă (activitatea profesorului) ---------- */
  {t:'Ce ai învățat de la echipă: explicația ta',
   text:`<p>La evaluare, fiecare spune <b>ce a învățat de la echipă</b>. Pe grilă, cel mai aproape e criteriul 4, <i>Explicația (ce am făcut și de ce)</i>: e citirea noastră; cum o notează îți spune profesorul.</p>
<p>O explicație bună spune <b>ce</b> ai învățat, cu un exemplu din documentul vostru, și <b>de ce</b> contează: „Am învățat de la … să …, pentru că …”.</p>`,
   exemplu:`<p>Radu: „Am învățat de la Ioana să las un comentariu, nu să-i schimb textul, pentru că ea hotărăște ce rămâne în paragraful ei.” Are ce, exemplul și de ce.</p>`,
   altfel:`<p>Gândește-te că îi povestești unui prieten din altă școală. Dacă îi spui doar „a fost frumos”, nu află nimic. Dacă îi spui ce ai făcut și de ce, înțelege.</p>`,
   incearca:{t:'classify',q:'E o explicație bună sau nu ajunge?',cats:['Explicație bună','Nu ajunge'],
     items:[['„Am învățat de la Maria să caut în istoric cine a scris, pentru că așa se vede munca fiecăruia.”',0],['„Am învățat multe lucruri noi.”',1],['„Am învățat de la Mihai să las Restricționat, pentru că altfel intră oricine are linkul.”',0],['„Mi-a plăcut să lucrez cu ei.”',1]],
     ajutor:'Caută la fiecare: spune CE a învățat, cu un exemplu? Spune DE CE contează?',
     why:'Prima și a treia spun ce, de la cine și de ce. Celelalte nu spun nici ce, nici de ce.'},
   inca:[
    {t:'choice',q:'Ce îi lipsește explicației lui Victor: „Am învățat de la Ana să propun schimbări cu Sugerare.”?',
     o:['De ce contează: de exemplu, „pentru că așa hotărăște autorul paragrafului”','Numele exact al documentului echipei, cu clasa și cu numele proprietarului','Ziua și ora la care a scris paragraful, ca să le vadă profesorul în istoric','Nimic: spune de la cine a învățat și ce a învățat, deci e completă'],ok:0,
     ajutor:'Forma din pas: „Am învățat de la … să …, pentru că …”. Care parte lipsește?',
     why:'Victor spune ce a învățat și de la cine, dar nu și de ce contează. Cu „pentru că așa hotărăște autorul” explicația e completă.'}
   ]}
 ],
 /* ---------- ATELIERUL = proba de antrenament (C1 și, în „Încă un exercițiu”, C2…A2) ---------- */
 atelier:{t:'probacolab',proba:'C1',titlu:'Atelier: proba de antrenament',
  intro:`<p><b>Întâi spune cine ești</b>, în caseta de jos. <strong>Proba de antrenament</strong> (nu e lucrarea profesorului; totul e inventat): punctele se dau la <b>prima</b> verificare, iar ce strici te costă puncte. Apoi <b>Încă un exercițiu</b>. Sună clopoțelul? Data viitoare reiei de la C1.</p>`,

   {t:'probaechipa',proba:'C2',titlu:'Atelier: proba de antrenament, C2',

    sim:{start:'doc',cont:K.ana,fisiere:[DOC_ANA()].concat(SimColabGoogle.FISIERE_ANA),deschis:'a-oras'},

      {c:'restrictionat',d:'Acces general: Restricționat',puncte:4,paza:true,lectia:L19_PART}],

    arata:`Permite accesul → Radu Ene (${P.radu.adresa}) → Editor → Trimite; Ioana Rusu (${P.ioana.adresa}) → Editor → Trimite; ${PROF} → Comentator → Trimite. Acces general: Restricționat.`,

/* ---------- autoevaluarea pe grila profesorului (GRILA, NIV, REP: mai sus, înainte de LECTIA) ---------- */
const ALEG=[[0,'Lipsește · 0 p'],[10,'De bază · 10 p'],[14,'Consolidat · 14 p'],[18,'Avansat · 18 p']];
const notaDin=p=>Math.floor((p+5)/10);
const nivelDin=n=>n>=9?'Avansat':n>=7?'Consolidat':n>=5?'De bază':n>=3?'În formare':'În dificultate';
/* autoevaluarea stă DOAR în memoria paginii (nu se salvează nicăieri; regula 23: butonul „Sunt alt elev” o golește) */
const LAB={niv:{}};
function calculGrila(){
  const v=GRILA.map((c,i)=>LAB.niv[i]),alese=v.filter(x=>x!=null).length;
  const rand=(s,p,n,nv)=>`<p><b>Punctaj:</b> ${s} + 10 din oficiu = ${p} · <b>Nota</b> (punctaj : 10): ${n} · <b>Nivelul</b> (din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate): ${nv}</p>`;
  if(alese<GRILA.length)return rand('____','____','______','______')+`<p>${alese?`Ai ales la ${alese} din ${GRILA.length} criterii. Alege la toate ca să vezi punctajul, nota și nivelul.`:'Alege la fiecare criteriu ca să vezi punctajul, nota și nivelul.'}</p>`;
  const s=v.reduce((a,b)=>a+b,0),p=s+10,n=notaDin(p);
  const imp=p%10?`${p} : 10 = ${String(p/10).replace('.',',')}, rotunjit: ${n}`:`${p} : 10 = ${n}`;
  const lipsa=v.map(x=>18-x),max=Math.max(...lipsa),unde=lipsa.map((x,i)=>x===max?i:-1).filter(i=>i>=0);
  const insir=a=>a.length>1?a.slice(0,-1).join(', ')+' și '+a[a.length-1]:a[0];
  const nume=insir(unde.map(i=>`„${i+1}. ${GRILA[i][0]}”`));
  const castig=max===0?'Ai ales Avansat la toate criteriile: 100 de puncte, cât se poate.'
    :unde.length===GRILA.length?`La toate criteriile mai sunt câte ${max} p până la 18 p. Alege unul și citește ce cere coloana următoare.`
    :`Cel mai mult e de câștigat la ${unde.length>1?'criteriile':'criteriul'} ${nume}: ${unde.length>1?'la fiecare ':''}mai sunt ${max} p până la 18 p. Citește acolo ce cere coloana următoare.`;
  return rand(s,p,n,nivelDin(n))+`<p>Adunarea: ${v.join(' + ')} = ${s}, plus 10 din oficiu = ${p}. Nota: ${imp}.</p><p>${castig} E părerea ta, ca să știi ce mai reparați; nota o dă profesorul.</p>`;
}
function grilaHtml(){
  return `<p class="fl-cap"><b>Autoevaluarea ta, pe grila profesorului</b> (nu se salvează și nu se trimite nicăieri; nota o dă profesorul)</p>
<p>La fiecare criteriu alege reperul cel mai apropiat de documentul echipei (profesorul poate da și între repere; 0 dacă lipsește cu totul).</p>
<div class="fl-grila">${GRILA.map((c,i)=>`<div class="fl-crit"><b>${i+1}. ${c[0]}</b><ul>${NIV.map((n,j)=>`<li><i>${n} · ${REP[j]} p:</i> ${c[j+1]}</li>`).join('')}</ul><div class="fl-niv" role="group" aria-label="Punctele mele la criteriul ${i+1}">${ALEG.map(([p,t])=>`<button type="button" data-fl-niv="${i}:${p}" aria-pressed="${LAB.niv[i]===p}">${t}</button>`).join('')}</div></div>`).join('')}</div>
<div class="fl-calc" aria-live="polite">${calculGrila()}</div>
<p class="fl-nou"><button class="btn" type="button" data-fl-nou>Sunt alt elev: golește alegerile</button></p>`;
}
function umpleGrila(){document.querySelectorAll('[data-grila-lab]').forEach(el=>{el.innerHTML=grilaHtml()})}
function puneGrila(i){
  document.querySelectorAll(`[data-fl-niv^="${i}:"]`).forEach(b=>b.setAttribute('aria-pressed',String(LAB.niv[i]===+b.dataset.flNiv.split(':')[1])));
  document.querySelectorAll('.fl-calc').forEach(c=>{c.innerHTML=calculGrila()});
}
/* Grila stă ÎN pasul 9 al laboratorului: motorul copiază lista pașilor în fereastra mică și trimite clicurile de acolo pe
   butonul-pereche din pagină (motor.js, OGLINDA). Orice [data-grila-lab] nou (pe pagina laboratorului și pe diplomă) se umple aici. */
new MutationObserver(()=>{if(document.querySelector('[data-grila-lab]:not([data-umplut])')){document.querySelectorAll('[data-grila-lab]').forEach(el=>el.setAttribute('data-umplut','1'));umpleGrila()}})
  .observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('click',e=>{
  const n=e.target.closest&&e.target.closest('[data-fl-niv]');
  if(n){const [i,p]=n.dataset.flNiv.split(':').map(Number);LAB.niv[i]=p;puneGrila(i);return}
  const z=e.target.closest&&e.target.closest('[data-fl-nou]');
  if(z){LAB.niv={};umpleGrila();const b=document.querySelector('[data-fl-niv]');if(b)b.focus({preventScroll:true})}
});
/* elevul se schimbă în caseta de jos (prezenta.js) → autoevaluarea de pe ecran nu mai e a lui (regula 23) */
addEventListener('prezenta',()=>{if(Object.keys(LAB.niv).length){LAB.niv={};umpleGrila()}});

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluare sumativă: material audio-video</title>
<meta name="description" content="Lecția 17, clasa a VII-a: filmul tău de la lecția 16 se notează cu grila de produs. Afli ce poate însemna fiecare criteriu la un film (scenariul, sunetul, montajul, genericul cu surse, explicația), repari în pagină un film de antrenament, îți verifici filmul în Clipchamp, scrii explicația unei decizii de montaj și te notezi singur pe grilă.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* TEMA: sala de proiecție a juriului — ecranul negru, iar dedesubt fișa de notare cu cele 5 criterii */
:root{
  --desk:#EFF0EC; --paper:#FFFFFF; --paper2:#F5F6F1; --line:#D6D9CF;
  --ink:#1B1E19; --ink2:#575D52; --accent:#2F5D3A; --accentInk:#FFFFFF; --sel:#DCEBDD;
  --mark:#FFE38A; --markInk:#1B1E19; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Fraunces",Georgia,serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"DM Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#131512; --paper:#1C1F1A; --paper2:#252922; --line:#3B4136; --ink:#EEF0EA; --ink2:#BCC2B4;
  --accent:#8FD19E; --accentInk:#0F1F13; --sel:#22392A; --mark:#E9C46A; --markInk:#1B1E19;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#131512; --paper:#1C1F1A; --paper2:#252922; --line:#3B4136; --ink:#EEF0EA; --ink2:#BCC2B4;
  --accent:#8FD19E; --accentInk:#0F1F13; --sel:#22392A; --mark:#E9C46A; --markInk:#1B1E19;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
body{background:var(--desk)}
/* banda: ecranul negru al proiecției și, lângă el, cele 5 criterii ale fișei de notare */
.banda{min-height:34px;padding:4px 10px;display:flex;align-items:center;gap:10px;background:#0E0F0D;overflow:hidden}
.banda .ecr{flex:0 0 auto;width:54px;height:24px;border:2px solid #8C9286;border-radius:3px;background:#000}
.banda .crit{display:flex;gap:5px}
.banda .crit i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid #9FB79F}
.banda .crit i.pl{background:#9FB79F}
.banda .tit{font:700 12px/1 var(--fd);letter-spacing:.14em;color:#E6EFE1;white-space:nowrap}
h1{font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:600}
.gest{border-left:4px solid var(--accent);background:var(--paper2);padding:6px 10px;border-radius:0 6px 6px 0;margin:.6em 0 0}
.simb{font-family:"Segoe UI Symbol","Segoe UI",system-ui,sans-serif;font-weight:700}
.ceas{font-family:var(--fm);font-size:.92em;background:#201E2B;color:#F5F4FF;padding:1px 5px;border-radius:4px;white-space:nowrap}
.rand-gen{display:block;font-family:var(--fm);font-size:.92em;background:#111;color:#fff;padding:4px 8px;border-radius:4px;margin:2px 0;width:max-content;max-width:100%;white-space:normal}
.scenariu{border:1px dashed var(--line);border-radius:8px;padding:6px 12px;background:var(--paper);margin:.5em 0}
.scenariu ol{margin:4px 0;padding-left:1.3em}
.trei-niv{list-style:none;padding:0;margin:.4em 0;display:grid;gap:6px}
.trei-niv li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
.trei-niv li i{font-style:normal;font-weight:700;color:var(--accent)}
/* tipul „numar” (copiat din lecția VII/10) */
.nr-rand label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.nr-in{font:inherit;min-height:40px;width:7em;padding:4px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
/* grila profesorului, cu autoevaluarea (forma din lecția VII/9) */
.fl-grila{display:grid;gap:8px;margin:6px 0}
.fl-crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.fl-crit ul{margin:4px 0 6px;padding-left:1.1em}
.fl-crit .film{color:var(--ink2);font-size:.92em;margin:2px 0 6px}
.fl-niv{display:flex;flex-wrap:wrap;gap:6px}
.fl-niv button{min-height:36px;min-width:36px;padding:4px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper2);color:var(--ink);font:inherit;cursor:pointer}
.fl-niv button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:700}
.fl-calc{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--paper);margin:8px 0}
.fl-calc p{margin:4px 0}
.fl-nou{margin:8px 0}
.fl-cap{margin:10px 0 4px}
.gest ol{margin:4px 0 0;padding-left:1.3em}
.gest ol li{margin:2px 0}

<script>
/* LECȚIA 17, clasa a VII-a, modulul 3 — „Evaluare sumativă: material audio-video” (revizuirea LearningHub, standardul din
   27.09.2026 + regula 10 din 08.10.2026), scrisă 19.10.2026. Un nivel pe pași: pasul 0, 5 pași cu „Încearcă” (și, la
   pașii 3-6, câte un gest în Clipchamp-ul adevărat, pe filmul copilului), atelierul (un film de antrenament de reparat pe
   criterii), pasul din laborator (verificarea și repararea filmului propriu, exportul, explicația, autoevaluarea pe grilă,
   deconectarea), 5 întrebări.
   CE SE EVALUEAZĂ (documentele profesorului): activitatea lecției 17 (Info_Gimnaziu_2026/data/activitati_lectii_VII_VIII.json):
   „Evaluarea produsului după grilă (respectarea scenariului, calitatea sunetului, montaj, generic cu surse) plus explicarea
   unei decizii de montaj.” Resurse: „produsele elevilor, grila de produs”. Grila = instrumente/Grila_produs.md (5 criterii ×
   0-18 p, repere 10/14/18, + 10 din oficiu, nota = punctaj : 10, nivelul din notă). Produsul = filmul de la VII/16
   („O zi de iarnă”, Nume_Prenume_clasa_iarna.mp4; granița: _campaign/.../m3_19_10/granite/vii_l16.md și vii_l17.md).
   Ce cade la ce criteriu (scenariul → 1, sunetul și montajul curat → 2, ordinea / trecerile / titlul → 3, explicația → 4,
   genericul cu surse → 5) e o CITIRE a autorului, de confirmat de profesor (surse.md, „Pentru profesor”).
   Simulatorul: lectii/_sim/video-clipchamp.js (VII/14) + video-clipchamp-text.js (VII/15), NEATINSE, folosite ca atare.
   Fotografiile, muzica, unde.js și lum.js sunt ale lecției VII/15 (CC0; autorii în ../m2-l15/img/SURSE.json).
   Clipchamp NU a fost pornit (aplicație din Magazin, cere cont): faptele sunt cele probate/documentate în VII/14-15
   (afirmatii.json le preia cu id-ul lor). */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/audio-video-vii/img/';
const L15='../m2-l15/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const S=x=>`<span class="simb">${x}</span>`;
const CEAS=t=>`<span class="ceas">${t}</span>`;
const PROG={sel:'Selecţia unor secvențe audio, audio-video pentru ștergere, copiere şi mutare',mix:'Mixarea semnalului audio din mai multe surse',
  tr:'Efecte de tranziție între scene',col:'Suprapunere coloană sonoră peste scene',gen:'Generice – suprapunerea textului peste scene'};

/* filmul de antrenament „O zi la munte” (materialele lecțiilor 14-15; CC0, Wikimedia Commons) */
const S1='scena-1-dimineata.jpg',S2='scena-2-padure.jpg',S3='scena-3-lac.jpg',S4='scena-4-seara.jpg',MU='muzica-fundal.wav';
const TOATE=[S1,S2,S3,S4,MU];
const CAT={
  [S1]:{tip:'imagine',src:L15+'img/scena-1-dimineata.webp',titlu:'dimineața',lum:LUM_L15[S1]},
  [S2]:{tip:'imagine',src:L15+'img/scena-2-padure.webp',titlu:'pădurea',lum:LUM_L15[S2]},
  [S3]:{tip:'imagine',src:L15+'img/scena-3-lac.webp',titlu:'lacul',lum:LUM_L15[S3]},
  [S4]:{tip:'imagine',src:L15+'img/scena-4-seara.webp',titlu:'seara',lum:LUM_L15[S4]},
  [MU]:{tip:'audio',durata:24,fis:L15+'muzica-fundal.wav',unda:UNDE_L15.muzica,titlu:'muzica'}};
const TITLU='O zi la munte';
const G_FOTO='Foto: Anderson, Gilmore, Gugalcrom123, deSousa',G_MUZ='Muzica: Erik Satie, Teknopazzo',G_LIC='CC0, Wikimedia Commons';
const GEN=n=>'Montaj: '+n+'\n'+G_FOTO+'\n'+G_MUZ+'\n'+G_LIC;
const GEN_MATEI='Montaj: Matei Ilie\n'+G_FOTO;                       /* fără autorii muzicii, fără licență și loc */
const GEN_SARA='Montaj: Sara Ene\n'+G_MUZ+'\n'+G_LIC;                 /* fără autorii fotografiilor */
const RG=s=>`<span class="rand-gen">${s}</span>`;
const GEN_RANDURI=n=>RG('Montaj: '+n)+RG(G_FOTO)+RG(G_MUZ)+RG(G_LIC);
/* filmul „bun”: 4 scene (seara 6 s), Estompare încrucișată lac → seară, titlul jos 48, genericul 0:18-0:28, muzica 0:00-0:24 la 70 % */
const BUN=o=>Object.assign({ecran:'editor',nume:'Ilie_Matei_7B_munte',media:TOATE.slice(),descarcari:[],
  video:[[S1,4],[S2,4],[S3,4],[S4,6]],audio:[{m:MU,start:0,durata:24,vol:70}],tranz:[{intre:[S3,S4],nume:'Estompare încrucișată',durata:2}],
  text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48},{text:GEN('Matei Ilie'),start:18,durata:10}]},o||{});
/* filmul lui Matei, cu greșelile de antrenament (atelierul) */
const MATEI=()=>BUN({video:[{m:S1,start:0,durata:4},{m:S3,start:4,durata:4},{m:S2,start:8,durata:4},{m:S4,start:13,durata:6}],
  audio:[{m:MU,start:3,durata:16,vol:180}],tranz:[{intre:[S1,S3],nume:'Ardere',durata:1}],
  text:[{text:TITLU,start:0,durata:4,poz:'sus',culoare:'alb',marime:24},{text:GEN_MATEI,start:18,durata:4}]});
const V=o=>Object.assign({t:'videoclipchamptext',catalog:CAT,sunet:true},o);
/* testele comune, cu numărul criteriului din grilă */
const T={
  ordine:{ce:'Criteriul 1 · Scenele sunt în ordinea scenariului: dimineața, pădurea, lacul, seara',ordine:[S1,S2,S3,S4],cum:'Trage o scenă de mijloc la locul ei. Ordinea, de la stânga: dimineața, pădurea, lacul, seara.'},
  gol:{ce:'Criteriul 2 · Între scene nu e niciun gol',faraGoluri:true,cum:'Golul se închide cu butonul coș de gunoi de pe el (Ștergeți acest spațiu liber).'},
  la0:{ce:'Criteriul 2 · Muzica începe la 0:00',muzicaDeLa0:MU,cum:'Trage muzica de mijloc spre stânga, până la 0:00.'},
  vol:{ce:'Criteriul 2 · Volumul muzicii e potrivit: între 50 și 90 %',volum:{m:MU,de:[50,90]},cum:'Clic pe muzică; în dreapta, la Audio, glisorul Volum spre stânga, pe la 70 %.'},
  intreaga:{ce:'Criteriul 2 · Muzica merge până la capătul ei (0:24)',muzicaIntreaga:MU,cum:'Clic pe muzică, apoi mânerul ei din dreapta până la 0:24: mai departe nu merge, fișierul are 24 de secunde. Pe telefon, dacă 0:24 nu încape pe ecran: trage mânerul până la margine, apasă Potrivește și trage din nou.'},
  unaTr:{ce:'Criteriul 3 · O singură tranziție în film',nrTranzitii:1,cum:'O tranziție de prisos: clic pe ea, apoi, în dreapta, „Fără”. Nu mai e niciuna (în pagină, o tranziție dispare când cele două scene ale ei nu mai stau lipite)? Pune una cu + între lacul și seara.'},
  undeTr:{ce:'Criteriul 3 · Tranziția e Estompare încrucișată, acolo unde trec cele mai multe ore (lacul → seara)',tranzitie:{intre:[S3,S4],nume:'Estompare încrucișată'},cum:'Întâi închizi golul; apoi butonul + dintre lacul și seara.'},
  titlu:{ce:'Criteriul 3 · Titlul se citește: contrast bun, Dimensiunea cel puțin 48',textCitet:{text:TITLU,marimeMin:48},cum:'Alb pe cerul alb nu se vede: Poziție Jos (pe dealurile întunecate ale dimineții) sau Culoare negru; Dimensiune 48 sau mai mult.'},
  surse:{ce:'Criteriul 5 · Genericul are autorii muzicii, licența și de unde sunt',textContine:['Montaj:','Satie','Teknopazzo','CC0','Wikimedia Commons'],cum:'În căsuța Text a genericului adaugă, cu Enter între rânduri: Muzica: Erik Satie, Teknopazzo și CC0, Wikimedia Commons. Apoi dă clic în altă parte: abia atunci se bifează testul.'},
  foto:{ce:'Criteriul 5 · Genericul are autorii fotografiilor',textContine:['Montaj:','Anderson','Gilmore','Gugalcrom123','deSousa'],cum:'Adaugă rândul Foto: Anderson, Gilmore, Gugalcrom123, deSousa, apoi dă clic în altă parte.'},
  douaOri:{ce:'Criteriul 5 · Genericul stă cât să fie citit de două ori',textDeDouaOri:{contine:['Montaj']},cum:'La fiecare 3 cuvinte, cel puțin 2 secunde: 15 cuvinte cer 10 secunde. Mânerul din dreapta al genericului până la 0:28. Pe telefon, dacă 0:28 nu încape pe ecran: trage mânerul până la margine, apasă Potrivește și trage din nou.'},
  vazut:{ce:'Ai privit tot filmul după ultima schimbare',vazutTot:true,cum:'|◀, apoi ▶, până la capăt.'},
  export:{ce:'Filmul e exportat din nou, în 1080 p, după ultima schimbare',exportat:{calitate:'1080p'},cum:'Exportați (sus, în dreapta) › 1080 p › Exportați. Ai schimbat ceva după export? Exportă din nou.'}
};

/* ---------- tipul „numar” (copiat din lecția VII/10, care l-a luat din VII/1): elevul scrie nota pe care o obține aplicând regula ---------- */
const citesteNr=s=>{s=String(s||'').trim().toLowerCase().replace(/(\d)[\s ]+(?=\d)/g,'$1').replace(',','.');
  const m=s.match(/^(-?\d+(?:\.\d+)?)(?:\s*[a-zăâîșşțţ]+(?:\s+[a-zăâîșşțţ]+)*)?\s*\.?$/);return m?parseFloat(m[1]):null};
const fmtNr=v=>String(v).replace('.',',');
const TipNumar={
  render(Q,body,api){
    body.innerHTML=`<div class="nr-rand"><label>${api.esc(Q.eticheta||'Răspunsul tău')}: <input class="nr-in" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"></label></div>`;
    const inp=body.querySelector('.nr-in');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=document.getElementById('chk');if(b)b.click()}});
    const nav=api.checkButton(()=>{
      const v=citesteNr(inp.value.replace(/^\s*[a-zăâîșşțţ]+:?\s+(?=-?\d)/i,''));
      if(v===null){api.feedback('bad','<strong>Scrie doar numărul</strong>, cu cifre (de exemplu 10).');inp.focus({preventScroll:true});return}
      if(Math.abs(v-Q.ok)<1e-9){inp.disabled=true;nav.innerHTML='';api.resolve(true);return}
      const cap=(Q.capcane||{})[String(v)];
      api.resolve(false,cap||`${fmtNr(v)} nu e răspunsul. Refă socoteala: adună criteriile și cele 10 din oficiu, împarte la 10, rotunjește.`);
      inp.focus({preventScroll:true});inp.select();
      api.revealButton(()=>{inp.value=fmtNr(Q.ok);inp.disabled=true;nav.innerHTML='';api.giveUp(`<b>${fmtNr(Q.ok)}</b>`)});
    });
  },
  rezolva(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.ok);return true},
  gresit(Q,body){body.querySelector('.nr-in').value=fmtNr(Q.tipic);return true}
};

/* ---------- grila profesorului (instrumente/Grila_produs.md, întocmai) + ce înseamnă la film (citirea autorului) ---------- */
const GRILA=[
  ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
  ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']];
const LA_FILM=['filmul are tot ce scrie în scenariul tău, în ordinea lui: titlul, scenele, genericul.',
  'montajul e curat: niciun gol între scene; muzica începe la 0:00 și ține cel puțin până la capătul ultimei scene; volumul e potrivit (o voce, dacă e, se înțelege clar).',
  'scenele în ordinea poveștii, una-două tranziții acolo unde trece timpul sau se schimbă locul, titlul care se citește, niciun text peste alt text.',
  'explicația unei decizii de montaj, scrisă în caiet.',
  'genericul de final: rolul și numele tău (la echipă, rolul fiecăruia), autorii fotografiilor și ai muzicii, licența și de unde sunt.'];
const NIV=['De bază (cu sprijin, model)','Consolidat (independent)','Avansat (context nou, justificat)'];   // capetele de coloană din Grila_produs.md
const REP=[10,14,18];
const ALEG=[[0,'Lipsește · 0 p'],[10,'De bază · 10 p'],[14,'Consolidat · 14 p'],[18,'Avansat · 18 p']];
/* nota = punctaj : 10, rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului (punctajul e un număr întreg) */
const notaDin=p=>Math.floor((p+5)/10);
const nivelDin=n=>n>=9?'Avansat':n>=7?'Consolidat':n>=5?'De bază':n>=3?'În formare, cu plan de recuperare':'În dificultate, cu plan de recuperare';
/* autoevaluarea stă DOAR în memoria paginii (nu se salvează nicăieri; regula 23: butonul „Sunt alt elev” o golește) */
const LAB={niv:{}};
function calculGrila(){
  const v=GRILA.map((c,i)=>LAB.niv[i]),alese=v.filter(x=>x!=null).length;
  const rand=(s,p,n,nv)=>`<p><b>Punctaj:</b> ${s} + 10 din oficiu = ${p} · <b>Nota</b> (punctaj : 10): ${n} · <b>Nivelul</b> (din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate): ${nv}</p>`;
  if(alese<GRILA.length)return rand('____','____','______','______')+`<p>${alese?`Ai ales la ${alese} din ${GRILA.length} criterii. Alege la toate ca să vezi punctajul, nota și nivelul.`:'Alege la fiecare criteriu ca să vezi punctajul, nota și nivelul.'}</p>`;
  const s=v.reduce((a,b)=>a+b,0),p=s+10,n=notaDin(p);
  const imp=p%10?`${p} : 10 = ${String(p/10).replace('.',',')}, rotunjit: ${n}`:`${p} : 10 = ${n}`;
  const lipsa=v.map(x=>18-x),max=Math.max(...lipsa),unde=lipsa.map((x,i)=>x===max?i:-1).filter(i=>i>=0);
  const insir=a=>a.length>1?a.slice(0,-1).join(', ')+' și '+a[a.length-1]:a[0];
  const nume=insir(unde.map(i=>`„${i+1}. ${GRILA[i][0]}”`));
  const castig=max===0?'Ai ales Avansat la toate criteriile: 100 de puncte, cât se poate.'
    :unde.length===GRILA.length?`La toate criteriile mai ai câte ${max} p până la 18 p. Alege unul și citește ce cere coloana următoare.`
    :`Cel mai mult ai de câștigat la ${unde.length>1?'criteriile':'criteriul'} ${nume}: ${unde.length>1?'la fiecare ':''}mai sunt ${max} p până la 18 p. Citește acolo ce cere coloana următoare.`;
  /* m7 (J1): următoarea coloană e Avansat → ce înseamnă la film nu e scris în documente; spunem doar ce cere descriptorul */
  const spreAv=max>0&&18-max>=14?' La Avansat, grila cere ceva ales de tine, cu un motiv (citește descriptorul): la film, motivul îl poți spune în explicația din caiet (criteriul 4). Nu știi ce ar fi Avansat la filmul tău? Întreabă-l pe profesor.':'';
  return rand(s,p,n,nivelDin(n))+`<p>Adunarea: ${v.join(' + ')} = ${s}, plus 10 din oficiu = ${p}. Nota: ${imp}.</p><p>${castig}${spreAv} E părerea ta, ca să știi ce mai repari; nota o dă profesorul.</p>`;
}
function grilaHtml(){
  return `<p class="fl-cap"><b>Autoevaluarea ta, pe grila profesorului</b> (nu se salvează și nu se trimite nicăieri; nota o dă profesorul)</p>
<p>La fiecare criteriu, 0 – 18 puncte: De bază = 10 p, Consolidat = 14 p, Avansat = 18 p (se poate și între repere; 0 dacă lipsește cu totul). Punctajul = criteriile 1-5 + 10 din oficiu. Alege la fiecare criteriu unde crezi că e filmul tău; aici alegi reperul cel mai apropiat. Rândul „La film” e citirea lecției, ca să te pregătești; dacă profesorul cere altceva, îți spune la oră.</p>
<div class="fl-grila">${GRILA.map((c,i)=>`<div class="fl-crit"><b>${i+1}. ${c[0]}</b><p class="film">La film (citirea lecției): ${LA_FILM[i]}</p><ul>${NIV.map((n,j)=>`<li><i>${n} · ${REP[j]} p:</i> ${c[j+1]}</li>`).join('')}</ul><div class="fl-niv" role="group" aria-label="Punctele mele la criteriul ${i+1}">${ALEG.map(([p,t])=>`<button type="button" data-fl-niv="${i}:${p}" aria-pressed="${LAB.niv[i]===p}">${t}</button>`).join('')}</div></div>`).join('')}</div>
<div class="fl-calc" aria-live="polite">${calculGrila()}</div>
<p class="fl-nou"><button class="btn" type="button" data-fl-nou>Sunt alt elev: golește alegerile</button></p>`;
}
function umpleGrila(){document.querySelectorAll('[data-grila-lab]').forEach(el=>{el.innerHTML=grilaHtml()})}
function puneGrila(i){
  document.querySelectorAll(`[data-fl-niv^="${i}:"]`).forEach(b=>b.setAttribute('aria-pressed',String(LAB.niv[i]===+b.dataset.flNiv.split(':')[1])));
  document.querySelectorAll('.fl-calc').forEach(c=>{c.innerHTML=calculGrila()});
}
/* Grila stă ÎN pasul 15 al laboratorului (14 înainte de reparația 2) (reparația J1, 19.10.2026: sonnet M1 / opus m2, m10): motorul copiază lista pașilor
   în fereastra mică și trimite clicurile de acolo pe butonul-pereche din pagină (motor.js, OGLINDA), deci grila e și lângă
   Clipchamp. Pe diplomă stă tot în pasul 15, în „Pașii, încă o dată” (pliat), nu sub „Trimite-o profesorului”.
   Orice [data-grila-lab] nou (pasul 15, pe pagina laboratorului și pe diplomă) se umple aici. */
new MutationObserver(()=>{if(document.querySelector('[data-grila-lab]:not([data-umplut])')){document.querySelectorAll('[data-grila-lab]').forEach(el=>el.setAttribute('data-umplut','1'));umpleGrila()}})
  .observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener('click',e=>{
  const n=e.target.closest&&e.target.closest('[data-fl-niv]');
  if(n){const [i,p]=n.dataset.flNiv.split(':').map(Number);LAB.niv[i]=p;puneGrila(i);return}
  const z=e.target.closest&&e.target.closest('[data-fl-nou]');
  if(z){LAB.niv={};umpleGrila();const b=document.querySelector('[data-fl-niv]');if(b)b.focus({preventScroll:true})}
});

  `<b>Ați făcut filmul în echipă?</b> La lecția 16, profesorul v-a spus în contul cui lucrați și cum se cheamă fișierul. Dacă profesorul nu vă spune altfel, azi lucrați din nou împreună, la calculatorul celui în contul căruia e filmul: doar el pornește Clipchamp și se conectează, cu contul lui; ceilalți stau lângă el. Unde scrie mai jos „numele tău”, la voi e numele fișierului spus de profesor. Fiecare își scrie în caietul lui explicația unei decizii de montaj la care a lucrat el (pasul 14) și se notează singur pe grilă, pe rând (pasul 15). La plecare, cine s-a conectat se deconectează (pasul 17). Ai lucrat singur? Mergi la pasul următor.`,

  `Îți cere să te conectezi? Te conectezi doar cu contul TĂU, primit de la profesor. Dacă Windows te întreabă dacă să-ți țină minte contul pe calculatorul ăsta, pentru toate aplicațiile, nu accepta: alege să te conectezi doar la aplicația asta. Nu știi ce să alegi? Nu te conecta: sari la ultimul pas. N-ai unul? <b>Nu-ți face cont</b> și nu scrie parola nimănui: sari la ultimul pas.`,

  `Pe pagina de pornire, clic pe proiectul tău de la lecția 16 (cel cu <code>iarna</code> la capăt). S-a deschis? Mergi la pasul următor. Nu e acolo, sau Clipchamp îți cere să găsești fișierele? Nu le căuta singur: sari la ultimul pas.`,
  `<b>Filmul e gata și exportat de la lecția 16?</b> Mergi la pasul următor. Nu e gata (lipsește ceva din scenariu) sau nu l-ai exportat? Dacă profesorul nu vă spune altfel, lecția îți propune: întâi îl termini, cât mai simplu. Pui doar ce n-ai bifat în caiet: scenele, trecerea, muzica, titlul, genericul; ce e deja pus doar verifici (nu mai știi cum? lecția 16, laboratorul, pașii 7-13). Apoi mergi mai departe, iar la pasul 12 îl exporți, chiar dacă azi nu mai schimbi nimic. Nu știi dacă l-ai exportat la lecția 16? Exportă-l oricum, la pasul 12.`,
  `<b>Criteriul 1.</b> Ai privit filmul cu scenariul lângă tine la pași și ai reparat ce lipsea? Sari la pasul următor. Altfel: pune scenariul din caiet lângă tine, apasă ${S('|◀')}, apoi ${S('▶')} (sau bara de spațiu) și privește tot filmul. Bifează în caiet fiecare rând din scenariu pe care îl vezi pe ecran, la locul lui. O scenă e în alt loc? Trage-o de mijloc la locul ei.`,
  `<b>Criteriul 2.</b> Ai verificat golurile și muzica la pași? Sari la pasul următor. Altfel: e vreun gol între scene? Ține mouse-ul pe el și apasă coșul de gunoi (<b>Ștergeți acest spațiu liber</b>). Clic pe muzică: începe la ${CEAS('0:00')}? Dacă nu, trage-o de mijloc până acolo. Ține cel puțin până la capătul ultimei scene? Dacă nu, trage-i mânerul din dreapta. Ascultă în căști: e prea tare (sau acoperă o voce)? În dreapta, la <b>Audio</b>, coboară <b>Volumul</b>.`,
  `<b>Criteriul 3.</b> Tranzițiile: sunt una-două, acolo unde trece timpul sau se schimbă locul? Una de prisos: clic pe ea, apoi, în dreapta, „Fără”. Titlul: dă căștile jos, lasă-le pe masă și ridică-te lângă scaun (nu pleca de lângă masă). Îl citești fără efort? Dacă nu, clic pe el și schimbă, în dreapta, <b>Poziție (Position)</b>, <b>Culoare (Color)</b> sau <b>Dimensiune (Size)</b>; la tine pot avea alt nume sau pot sta într-un mic meniu, deasupra textului. Două texte stau pe ecran în același timp? Mută-le, unul după altul, trăgând de mijloc.`,

  `Deschide <b>Explorer</b>, apoi <b>Descărcări (Downloads)</b>: e acolo fișierul tău <code>.mp4</code>? Vezi numele tău de două ori, unul cu <b>(1)</b> la capăt? Ai exportat de două ori: de obicei, cel cu (1) e cel nou. Dublu clic pe el și privește-l: are reparațiile de azi? Apoi închide fereastra filmului. N-are reparațiile? Exportă din nou (pasul 12). Nu e acolo? Scrie în caiet ce ți-a arătat Clipchamp la sfârșitul exportului și spune-i profesorului.`,
  `<b>Criteriul 4.</b> Ai scris explicația la pași? Citește-o încă o dată. Nu? În caiet, sub scenariu (sau sub propozițiile de la lecția 16, dacă le-ai scris), scrie explicația unei decizii de montaj din filmul tău, în 3-4 propoziții: ce ai făcut, de ce, ce altceva ai fi putut face și de ce n-ai ales asta.`,

     text:`<p>Profesorul notează filmul cu <mark>grila de produs</mark> (lecția 9): 5 criterii, la fiecare <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul.</p>

       capcane:{'7':'14 + 10 + 14 + 10 + 18 = 66, plus 10 din oficiu = 76; 76 : 10 = 7,6, care se rotunjește la cel mai apropiat întreg: 8.','7.6':'Nota e un număr întreg: 7,6 se rotunjește la 8.','76':'76 e punctajul. Îl împarți la 10, apoi rotunjești.','66':'66 e suma criteriilor: adaugă cele 10 din oficiu, apoi împarte la 10.','6.6':'Ai uitat cele 10 puncte din oficiu? 66 + 10 = 76.','7.0':'14 + 10 + 14 + 10 + 18 = 66, plus 10 din oficiu = 76; 76 : 10 = 7,6, rotunjit: 8.'},

    /* ---------- pasul 2: scenariul și organizarea ---------- */
    {t:'Scenariul și ordinea: criteriile 1 și 3',
     text:`<p>Pentru criteriul 1, <b>Respectarea cerinței</b>, pune filmul lângă scenariul tău: are tot ce scrie acolo, în aceeași ordine (titlul, scenele, genericul)?</p>
<p>La criteriul 3, <b>Organizarea</b>, uită-te cum e așezat filmul: scenele în ordinea poveștii, una-două tranziții doar unde trece timpul sau se schimbă locul, un titlu care se citește, niciun text peste alt text.</p>
${fig(J+'clipchamp-zone.webp',1000,584,'Editorul video Clipchamp: în stânga panoul Conținutul meu media, cu butonul mov Importați conținutul media, sus previzualizarea, jos linia de timp','Zonele editorului. Jos, linia de timp: aici, cu două texte; în filmul tău, cu scenele, una după alta.')}
<div class="gest"><b>La calculator, acum:</b>${CONT}</div>`,
     exemplu:`<p>Scenariul lui Matei: <span class="scenariu">1. Titlul „O zi la munte”. 2. Dimineața. 3. Pădurea. 4. Lacul. 5. Seara. 6. Genericul.</span> În filmul lui, lacul vine înaintea pădurii: filmul nu urmează scenariul, deci pierde puncte la criteriul 1. Repararea: trage pădurea de mijloc, înaintea lacului.</p>`,
     altfel:`<p>E ca la o rețetă: ai toate ingredientele, dar dacă le pui în altă ordine decât scrie, nu iese prăjitura din rețetă. Scenariul e rețeta filmului.</p>`,
     incearca:V({start:BUN({video:[[S1,4],[S3,4],[S2,4],[S4,6]],tranz:[],text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48}],audio:[{m:MU,start:0,durata:18,vol:70}]}),
       q:'Scenariul lui Matei cere scenele în ordinea: dimineața, pădurea, lacul, seara. În filmul lui, lacul e înaintea pădurii. Pune-le în ordinea scenariului: trage «pădurea» de mijloc, înaintea lacului.',
       teste:[T.ordine,T.gol],
       solutie:[{muta:[S2,3]}],gresit:[{alege:S2}],
       ajutor:'Pădurea e a treia de la stânga; locul ei e al doilea, imediat după dimineața.',
       why:'Ordinea scenelor e cea din scenariu, deci filmul spune povestea pe care ai promis-o.'}),
     inca:[
      {t:'choice',q:'Scenariul Anei: „1. poarta școlii, 2. clasa, 3. curtea, 4. genericul”. În filmul ei: poarta, curtea, clasa, iar genericul lipsește. La ce criteriu pierde puncte, mai întâi?',
       o:['1. Respectarea cerinței: filmul nu urmează scenariul','4. Explicația: n-a spus de ce a ales ordinea asta','2. Corectitudinea tehnică: muzica e prea tare','Niciunul: la film, ordinea scenelor nu contează'],ok:0,
       ajutor:'Cu ce pui filmul alături la criteriul 1?',why:'La criteriul 1 îți pui filmul lângă scenariu: lipsește genericul, iar curtea și clasa sunt inversate.'},
      V({start:BUN({audio:[{m:MU,start:0,durata:24,vol:70}],tranz:[{intre:[S1,S2],nume:'Estompare încrucișată',durata:1},{intre:[S2,S3],nume:'Ardere',durata:1},{intre:[S3,S4],nume:'Estompare încrucișată',durata:2}]}),
       q:'Filmul lui Matei are tranziții la toate cele trei tăieturi. Orele scenelor: dimineața pe la 6, pădurea pe la 9, lacul pe la 12, seara pe la 20. Lasă doar tranziția dintre lacul și seara, unde trec cele mai multe ore (clic pe celelalte, apoi „Fără”).',
       teste:[T.unaTr,{ce:'Tranziția rămasă e între lacul și seara',tranzitie:{intre:[S3,S4]},cum:'Câte ore trec: de la 6 la 9? de la 9 la 12? de la 12 la 20?'}],
       solutie:[{farTranzitie:S1},{farTranzitie:S2}],gresit:[{farTranzitie:S2},{farTranzitie:S3}],
       ajutor:'Semnele tranzițiilor stau între scene. Între care două trec cele mai multe ore?',why:'Una-două tranziții ajung; o păstrezi unde se schimbă cel mai mult: de la 12 la 20 trec 8 ore.'})
     ]},

    /* ---------- pasul 3: sunetul și montajul curat ---------- */
    {t:'Sunetul și montajul curat: criteriul 2',
     text:`<p>La criteriul 2, <b>Corectitudinea tehnică</b>, contează dacă operațiile de montaj sunt făcute corect. Ca să te pregătești, la film uită-te mai ales la sunet și la trecerile curate:</p>
<ul><li>între scene nu e niciun gol (în pagină, ecran negru);</li>
<li>muzica începe la ${CEAS('0:00')} și ține cel puțin până la capătul ultimei scene (nu se oprește în mijlocul filmului);</li>
<li>volumul e potrivit: muzica se aude, dar nu acoperă nimic; dacă în film vorbește cineva, vocea se înțelege clar, iar muzica stă în fundal, ca la lecția 13.</li></ul>
${fig('../m2-l13/img/doua-piste.webp',1000,370,'Audacity 4: pista cu vocea și, sub ea, pista cu muzica importată, de la 0:00; în panoul din stânga, glisoarele de volum încadrate, al muzicii tras spre stânga','De la lecția 13: glisorul de volum al muzicii, tras spre stânga.')}
<p class="gest"><b>La calculator, acum:</b> în filmul tău, închide golurile dintre scene. Muzica începe la ${CEAS('0:00')} și ține până la capătul ultimei scene? Ascultă în căști: e prea tare? Clic pe ea; în dreapta, <b>Audio</b> › <b>Volum</b>.</p>`,
     exemplu:`<p>În filmul lui Matei, muzica pornește la ${CEAS('0:03')}: primele 3 secunde sunt în liniște. Volumul ei e 180 %: acoperă tot. Între lac și seară e un gol de o secundă. Repararea: coșul de gunoi de pe gol; muzica trasă de mijloc la ${CEAS('0:00')}; clic pe muzică, <b>Audio</b>, <b>Volum</b> pe la 70 %.</p>`,
     altfel:`<p>E ca la o serbare: dacă muzica e dată prea tare, nu se mai aude cine recită; dacă pornește abia după ce a urcat primul copil pe scenă, începutul rămâne în liniște.</p>`,
     incearca:V({start:BUN({video:[{m:S1,start:0,durata:4},{m:S2,start:4,durata:4},{m:S3,start:8,durata:4},{m:S4,start:13,durata:6}],tranz:[],
         text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48}],audio:[{m:MU,start:3,durata:16,vol:180}]}),
       q:'Repară sunetul și golul din filmul lui Matei: închide golul dintre lacul și seara (coșul de gunoi de pe el), trage muzica de mijloc până la 0:00, apoi coboară-i «Volumul» între 50 și 90 % (clic pe muzică; în dreapta, Audio).',
       teste:[T.gol,T.la0,T.vol],
       solutie:[{gol:S4},{inceputAudio:[MU,0]},{volum:[MU,70]}],gresit:[{gol:S4},{volum:[MU,70]}],
       ajutor:'Golul e zona hașurată dintre lacul și seara. Muzica e clipul de pe pista de sub scene.',
       why:'Fără goluri, cu muzica de la început și la un volum potrivit, montajul e curat.'}),
     inca:[
      {t:'choice',q:'În filmul lui Andrei vorbește un coleg (un mic interviu), iar sub voce e muzica. La previzualizare, muzica acoperă vocea. Ce face Andrei?',
       o:['Clic pe muzică și coboară Volumul ei, până vocea se înțelege clar','Mărește volumul muzicii la 200 %, ca să se audă mai bine amândouă','Scoate genericul de final','Pune o tranziție între scene'],ok:0,
       ajutor:'Ce trebuie să se înțeleagă clar, vocea sau muzica?',why:'Vocea trebuie să se înțeleagă clar, iar muzica să stea în fundal: muzica se dă mai încet, nu mai tare.'},
      {t:'tf',q:'Între pădure și lac a rămas un gol de o secundă. Pentru criteriul 2 nu contează: în film nu se vede nimic acolo.',ok:false,
       ajutor:'Ce se vede în film pe locul unui gol?',why:'Fals. Pe locul golului nu e nicio scenă (în pagină, ecran negru): e o greșeală de montaj. O închizi cu coșul de gunoi de pe gol.'}
     ]},

    /* ---------- pasul 4: genericul cu surse ---------- */
    {t:'Genericul cu surse: criteriul 5',
     text:`<p>Pentru criteriul 5, <b>Munca proprie / sursele</b>, citește genericul de final. Grila urcă așa: „folosește materialele date” (De bază), „citează sursele imaginilor/textelor” (Consolidat), „respectă drepturile de autor și explică de ce contează” (Avansat).</p>
<p>La film, „citează sursele” înseamnă genericul din lecția 15: rolul și numele tău (la echipă, rolul fiecăruia), autorii fotografiilor și ai muzicii, licența și de unde sunt. Genericul stă pe ecran cât să fie citit de două ori. La CC0 licența nu te obligă, dar la școală scrii autorul oricum.</p>
${fig(L15+'img/generic-final.webp',960,540,'Un generic de final pe negru: în stânga rolurile, în dreapta numele oamenilor, cu litere albe','Un generic de final adevărat (exemplu, în finlandeză): în stânga rolul, în dreapta numele. Imagine: Zunter, <a href="https://commons.wikimedia.org/wiki/File:Esimerkki_lopputekstit.png" target="_blank" rel="noopener">Wikimedia Commons</a>, domeniu public (din lecția 15).')}
<p class="gest"><b>La calculator, acum:</b> clic pe genericul filmului tău și citește-l în căsuța <b>Text</b>: are toate rândurile de mai sus? Scrie rândul care lipsește, cu ${K('Enter')} între rânduri. Numără cuvintele și, dacă trebuie, trage-i mânerul din dreapta.</p>`,
     exemplu:`<p>Genericul lui Matei are doar două rânduri: „Montaj: Matei Ilie” și autorii fotografiilor. Lipsesc autorii muzicii, licența și locul, iar textul stă doar 4 secunde. Bun, pe patru rânduri: ${GEN_RANDURI('Matei Ilie')} 15 cuvinte: 10 secunde, de la ${CEAS('0:18')} la ${CEAS('0:28')}.</p>`,
     altfel:`<p>E ca bilețelul de sub un desen dintr-o expoziție: cine l-a făcut și de unde a luat modelul. Fără el, vizitatorul crede că totul e al tău.</p>`,
     incearca:V({export:false,start:BUN({text:[{text:TITLU,start:0,durata:4,poz:'jos',marime:48},{text:GEN_MATEI,start:18,durata:4}]}),
       q:'Completează genericul lui Matei: clic pe el; în căsuța Text, la capătul rândului cu fotografiile, apasă Enter și scrie «Muzica: Erik Satie, Teknopazzo», apoi Enter și «CC0, Wikimedia Commons», și dă clic în altă parte. La final, trage-i mânerul din dreapta până la 0:28, cât să fie citit de două ori.',
       teste:[T.surse,T.foto,T.douaOri],
       solutie:[{textScrie:[1,GEN('Matei Ilie')]},{textCapat:[1,28]}],gresit:[{textScrie:[1,GEN('Matei Ilie')]}],
       ajutor:'Genericul e clipul de pe pista Text, după seara. Rândurile noi le pui cu Enter.',
       why:'Genericul spune acum de unde sunt și fotografiile, și muzica, cu licența și locul, și stă destul cât să fie citit.'}),
     inca:[
      {t:'choice',q:'Fotografia „Cabana”, de Ilie Rusu, de pe Wikimedia Commons, are licența CC BY 4.0. Care rând din generic e complet?',
       o:['Foto: „Cabana”, Ilie Rusu, CC BY 4.0, Wikimedia Commons','Foto: „Cabana”, de pe internet, gratuită','Foto: „Cabana”, Wikimedia Commons, fără autor','Foto: „Cabana”, Ilie Rusu, luată de pe un site'],ok:0,
       ajutor:'Ce cere CC BY? Ce scrii mereu la școală?',why:'CC BY cere autorul și licența; scrii și titlul și de unde e.'},
      {t:'tf',q:'Toate fotografiile și muzica filmului sunt CC0, deci genericul de final poate lipsi: licența nu te obligă la nimic.',ok:false,
       ajutor:'Ce scrii la școală, chiar dacă licența nu te obligă?',why:'Fals. CC0 nu te obligă, dar la școală scrii mereu autorul, licența și de unde e; fără generic pierzi puncte la criteriul 5.'}
     ]},

    /* ---------- pasul 5: explicația ---------- */
    {t:'Explicația unei decizii de montaj: criteriul 4',
     text:`<p>O <mark>decizie de montaj</mark> e o alegere din filmul tău: ordinea scenelor, locul tranziției, cât stă o scenă, unde e titlul, volumul muzicii.</p>
<p>La criteriul 4, <b>Explicația</b>, grila urcă așa: „răspunde la întrebări” (De bază), „explică pașii” (Consolidat), „justifică alegerile și propune alternative” (Avansat).</p>
<p>Cum le deosebești în lecția asta (citirea lecției; la oră, profesorul îți poate pune și întrebări): De bază spune doar <b>ce</b> e în film (răspunde la „ce ai făcut?”); Consolidat spune și pașii, adică ce ai apăsat și ce ai tras în Clipchamp, pe rând; Avansat spune <b>de ce</b> și ce altceva ai fi putut face (o <b>alternativă</b>), cu de ce n-ai ales-o.</p>
${fig(J+'clipchamp-cursor.webp',760,264,'Linia de timp din Clipchamp, cu capul de redare (linie verticală) la secunda 9,30 și două clipuri de text unul după altul, pe aceeași pistă','Capul de redare (în poză, „cursorul de redare”). Îl duci puțin înaintea locului despre care scrii.')}
<p class="gest"><b>La calculator, acum:</b> alege o decizie din filmul tău (de exemplu, locul tranziției). Privește locul acela (clic pe riglă puțin înainte, apoi ${S('▶')}) și scrie explicația în caiet, sub scenariu: 3-4 propoziții, cu cele patru părți.</p>`,
     exemplu:`<ul class="trei-niv"><li><i>De bază (doar ce e în film):</i> „Am pus o tranziție.”</li>
<li><i>Consolidat (și pașii, pe rând):</i> „Am pus Estompare încrucișată între lac și seară: am apăsat + dintre ele și am mărit Durata.”</li>
<li><i>Avansat (de ce + o alternativă):</i> „Am pus Estompare încrucișată doar între lac și seară, pentru că acolo trec cele mai multe ore. Aș fi putut pune tranziții la toate tăieturile, dar prea multe obosesc privitorul.”</li></ul>`,
     altfel:`<p>E ca atunci când îi explici unui prieten de ce ai ales un traseu prin oraș: „Am luat-o pe lângă parc, pentru că e mai scurt; puteam merge pe bulevard, dar acolo sunt trei semafoare.”</p>`,
     incearca:{t:'classify',q:'La ce nivel al criteriului 4 e fiecare explicație?',cats:['De bază: răspunde la întrebări','Consolidat: explică pașii','Avansat: justifică alegerile și propune alternative'],
       items:[['„Titlul e jos.”',0],['„Am dat clic pe titlu și, la Poziție, am ales Jos; apoi am pus Dimensiunea 48.”',1],['„Am pus titlul jos, pe dealurile întunecate, pentru că acolo albul se citește. Puteam să-l las sus și să-l fac negru, dar voiam să se vadă cerul liber.”',2],['„Filmul are muzică de la început până la sfârșit.”',0],['„Am dat clic pe muzică, apoi am tras mânerul ei din dreapta până la 0:24.”',1],['„Am lăsat muzica la 70 %, ca să se audă colegul care vorbește; am încercat 100 %, dar acoperea vocea.”',2]],
       ajutor:'Caută în fiecare: spune doar ce e în film? Spune și pașii din Clipchamp, pe rând (ce a apăsat, ce a tras)? Spune de ce și ce altceva ar fi putut face?',
       why:'Doar ce e în film = De bază; și pașii, pe rând (clic pe…, apoi trag…) = Consolidat; motivul plus o altă variantă, cu de ce n-ai ales-o = Avansat.'},
     inca:[
      {t:'choice',q:'Explicația lui Tudor: „Am lăsat seara 6 secunde, pentru că e ultima scenă și vreau să rămână mai mult pe ecran.” Ce îi lipsește ca să fie de nivel Avansat?',
       o:['O altă variantă pe care ar fi putut-o alege și de ce n-a ales-o','Pașii, unul câte unul, cu mânerul din dreapta','Numele lui în generic','Nimic: e deja de nivel Avansat'],ok:0,
       ajutor:'Ce cere grila la Avansat, pe lângă „de ce”?',why:'Tudor spune ce a făcut și de ce; la Avansat se cere și o alternativă: „Puteam s-o las 4 secunde, dar filmul s-ar fi terminat prea brusc.”'}
     ]}
   ],
   atelier:V({titlu:'Atelier: repari filmul de antrenament al lui Matei',export:true,start:MATEI(),
     intro:`<p>Matei a făcut filmul „O zi la munte” după scenariul de mai jos, dar a greșit la mai multe criterii. Tu îl repari, ca să treacă la toate. Sub fereastră vezi <strong>testele</strong>, cu numărul criteriului: fiecare se bifează ✔ singur când partea lui e bună. Nu e notat: e un antrenament.</p>
<div class="scenariu"><b>Scenariul lui Matei</b><ol><li>Titlul „O zi la munte”, peste dimineața, de la 0:00 la 0:04, să se citească.</li><li>Scenele: dimineața (pe la ora 6), pădurea (9), lacul (12), seara (20).</li><li>O singură tranziție, Estompare încrucișată, unde trec cele mai multe ore.</li><li>Muzica de fundal de la 0:00 până la capătul ei, la volum potrivit.</li><li>Genericul de final, după seara: Montaj, autorii fotografiilor și ai muzicii, licența și de unde sunt, cât să fie citit de două ori.</li></ol></div>
<p class="hint">Fotografiile și muzica sunt cele din lecțiile 14-15: CC0, Wikimedia Commons; autorii stau chiar în genericul filmului.</p>`,

<script>
/* LECȚIA 16, clasa a VII-a, modulul 3 (revizuirea LearningHub, standardul din 27.09.2026 + regula 10 din 08.10.2026),
   scrisă 19.10.2026. Consolidare — mini-proiect: NU predă nimic nou, ghidează proiectul cu trimiteri la lecțiile 11-15.
   Un nivel pe pași, numerotați ca pe ecran (motorul: „pasul N din 6”): pasul 1 „La ce folosește”, pașii 2-6 cu „Încearcă”
   (și, unde e gest de aplicație, caseta „La calculator, acum”), atelierul (montajul după scenariul Anei, din editor, cu
   proiectul numit și fișierele importate cum le lasă „Încearcă” de la pasul 5, până la export), pasul din laborator (filmul
   elevului, după scenariul lui), 5 întrebări. Reparat după judecata 1 (19.10.2026): _verificare/registru_j1.md; după judecata 2
   (19.10.2026, ora ușurată: caietul = titlul + rândurile 1-5 cu pătrățel, explicația la lecția 17 sau „Dacă mai ai timp”,
   atelierul sărit la oră): _verificare/registru_j1.md, „Reparația 2”; socoteala orei în _proba/r2_durata.py.
   Simulatoarele: lectii/_sim/video-clipchamp.js (VII/14) + extensia lectii/_sim/video-clipchamp-text.js (VII/15), folosite
   ca atare, prin API-ul lor public (nicio extensie nouă). Clipchamp NU a fost pornit (aplicație din Magazin, cere cont):
   faptele sunt cele ale lecțiilor 14-15 (afirmatii.json le numește). Cerințele și grila: documentele profesorului
   (activitatea VII/16, Grila_produs.md), surse.md §1. Fotografiile: Wikimedia Commons, CC0, img/SURSE.json.
   Nimic nu se păstrează în browser (calculatorul din laborator e comun): pagina nu ține nicio stare a elevului. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/audio-video-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const S=x=>`<span class="simb">${x}</span>`;
const CEAS=t=>`<span class="ceas">${t}</span>`;
const PROG1='Operații pentru gestionarea unei aplicații audio, audio-video: creare, deschidere, vizualizare, salvare, închidere';
const PROG2='Efecte de tranziție între scene';
const PROG3='Suprapunere coloană sonoră peste scene';
const PROG4='Generice – suprapunerea textului peste scene';
/* materialele proiectului: șase fotografii CC0 (img/SURSE.json) și muzica din lecțiile 13-15 (CC0, 24 s) */
const F1='iarna-1-satul.jpg',F2='iarna-2-padurea.jpg',F3='iarna-3-drumul.jpg',F4='iarna-4-lacul.jpg',F5='iarna-5-omul-de-zapada.jpg',F6='iarna-6-seara.jpg',MU='muzica-fundal.wav';
const FOTO=[
  {f:F1,nume:'satul',autor:'Dirk Schmidt',gen:'Schmidt',pag:'https://commons.wikimedia.org/wiki/File:Leutasch_winter_im_ortsteil_Moos_an_der_Kapelle_mit_hohe_munde.jpg',alt:'Un sat de munte sub zăpadă: o capelă albă, case, brazi și un munte, sub cerul albastru'},
  {f:F2,nume:'pădurea',autor:'Elisa Coluccia',gen:'Coluccia',pag:'https://commons.wikimedia.org/wiki/File:Sunshine_and_snowy_trees_(Unsplash).jpg',alt:'O pădure de brazi cu zăpadă; soarele trece în raze printre trunchiuri'},
  {f:F3,nume:'drumul',autor:'Tyson Dudley',gen:'Dudley',pag:'https://commons.wikimedia.org/wiki/File:Road_in_snowy_forest_(Unsplash).jpg',alt:'Un drum cu două linii galbene printr-o pădure de brazi plini de zăpadă; ninge'},
  {f:F4,nume:'lacul',autor:'Iurie Nistor',gen:'Nistor',pag:'https://commons.wikimedia.org/wiki/File:Frozen_lake_and_trees.jpg',alt:'Malul unui lac, iarna: zăpadă, trestii uscate și copaci fără frunze lângă apă; fotografie alb-negru'},
  {f:F5,nume:'omul de zăpadă',autor:'Terry.grignon',gen:'Terry.grignon',pag:'https://commons.wikimedia.org/wiki/File:Snowman_on_a_foggy_day.jpg',alt:'Un om de zăpadă mic, singur pe un câmp alb, într-o zi cu ceață'},
  {f:F6,nume:'seara',autor:'Robert von Oliva',gen:'von Oliva',pag:'https://commons.wikimedia.org/wiki/File:Small_snowmans_in_the_Nowa_Huta_district_in_Krak%C3%B3w_at_night.jpg',alt:'Doi oameni de zăpadă mici, noaptea, pe o alee pavată, lângă iarbă'}];
const TOATE=[F1,F2,F3,F4,F5,F6,MU];
const CAT={};FOTO.forEach(x=>{CAT[x.f]={tip:'imagine',src:'img/'+x.f.replace('.jpg','.webp'),titlu:x.nume,lum:LUM_L16[x.f]}});
CAT[MU]={tip:'audio',durata:24,fis:MU,unda:UNDE_L16.muzica,titlu:'muzica'};
const CC0='<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.ro" target="_blank" rel="noopener">CC0</a>';
/* fișa: în generic scrii partea îngroșată a numelui autorului (x.gen) */
const autorGen=x=>x.autor.endsWith(x.gen)?x.autor.slice(0,x.autor.length-x.gen.length)+'<b>'+x.gen+'</b>':'<b>'+x.autor+'</b>';
const GALERIE=`<div class="galerie">${FOTO.map((x,i)=>`<figure><a href="img/${x.f.replace('.jpg','.webp')}" target="_blank"><img src="img/${x.f.replace('.jpg','.webp')}" alt="${x.alt}" width="960" height="540" loading="lazy"></a><figcaption><b class="nm">${i+1}. ${x.nume}</b>Foto: <a href="${x.pag}" target="_blank" rel="noopener">${autorGen(x)}</a>, ${CC0}<br><a href="${x.f}" download>Descarcă</a></figcaption></figure>`).join('')}</div>`;
const MUZICA_DL=`<a href="${MU}" download>Descarcă muzica</a> (Erik Satie, cântată de Teknopazzo, ${CC0}, Wikimedia Commons; aceeași ca în lecțiile 13-15)`;
/* scenariul-model al Anei (pasul 3 „Scenariul”, atelierul): satul → pădurea → lacul → seara, câte 4 s; trecerea lac → seară;
   titlul 0:00-0:04; genericul 0:16-0:27 (16 cuvinte → cel puțin 10,7 s); muzica 0:00-0:24 (capătul fișierului) */
const ANA=[F1,F2,F4,F6],DAN=[F3,F2,F5,F6],MARIA=[F1,F5,F4,F6];
const TITLU='O zi de iarnă';
const G_MUZ='Muzica: Erik Satie, Teknopazzo',G_LIC='CC0, Wikimedia Commons';
const fotoGen=L=>'Foto: '+L.map(f=>FOTO.find(x=>x.f===f).gen).join(', ');
const GEN='Montaj: Ana Pop\n'+fotoGen(ANA)+'\n'+G_MUZ+'\n'+G_LIC;
const GEN_DAN='Montaj: Dan Rusu\n'+fotoGen(DAN)+'\n'+G_MUZ+'\n'+G_LIC;
const RG=s=>`<span class="rand-gen">${s}</span>`;
const GEN_RANDURI=(nume,L)=>RG('Montaj: '+nume)+RG(fotoGen(L))+RG(G_MUZ)+RG(G_LIC);
const NUME_ANA='Pop_Ana_7A_iarna';
const V=o=>Object.assign({t:'videoclipchamptext',catalog:CAT,sunet:true},o);
const ED=o=>Object.assign({ecran:'editor',media:TOATE.slice(),descarcari:TOATE.slice()},o||{});   /* editorul, cu toate fișierele importate */
const LIPITE=(L,o)=>ED(Object.assign({video:L.map(f=>[f,4])},o||{}));                               /* scenele lipite, câte 4 s */
const dl=n=>`<a href="${n}" download>${n}</a>`;
/* grila de produs a profesorului (Info_Gimnaziu_2026/instrumente/Grila_produs.md), întocmai */
const GRILA=[
  ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
  ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']];
const GRILA_TABEL=`<div class="tabel-lat"><table class="grila-t"><tr><th>Criteriul</th><th>De bază (cu sprijin, model) · 10 p</th><th>Consolidat (independent) · 14 p</th><th>Avansat (context nou, justificat) · 18 p</th></tr>${GRILA.map((c,i)=>`<tr><td><b>${i+1}. ${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td></tr>`).join('')}</table></div>
<p class="hint">La fiecare criteriu: 0-18 puncte (se poate da și între repere; 0 dacă lipsește cu totul). Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). Nota = punctaj : 10. Grila: a profesorului, ca la lecția 9.</p>`;
</script>
<script>
/* ---------- laboratorul: filmul elevului, după scenariul LUI, în Clipchamp-ul adevărat ----------
   Formulările pentru cont, import, tranziție, muzică, export și deconectare = lecțiile 14 și 15 (publicate), întocmai unde
   se poate. Elevul poate veni de la caseta „La calculator, acum” a pasului 5 (proiectul început) sau nu: pașii 2 și 5 ai
   listei îl trimit unde trebuie. Numerele pașilor DIN LISTĂ numiți în text: 6, 17, 18, 19, 21 și „pașii 1-5” (pasul 20, reluarea);
   în afara listei, „Cum lucrezi” numește pasul 20 și atelierul pasul 17 — de verificat la orice schimbare a listei (21 de pași).
   Reparația 2 (19.10.2026): pașii de pe drumul obișnuit, scurtați; pasul 17 = „Dacă mai ai timp” (explicația, grila,
   atelierul); reluarea în altă oră (20) + „e deja? doar verifici” la 7-10 și 12 (O); atelierul din pasul 21 (P); echipa la 4-5
   (Q). Pașii LECȚIEI nu se numerotează aici, iar fișele (fotografiile, grila) se caută „în pagina lecției, deasupra listei de
   pași”: în fereastra mică (doar lista) ele nu sunt. */
const PROVOCARE=[
  `Pune căștile de pe masa ta (n-ai? dă volumul mic; nu băga și nu scoate cabluri). Ai lângă tine caietul cu scenariul. Fotografiile alese și muzica sunt în <b>Descărcări (Downloads)</b>? Dacă nu, descarcă-le din fișa proiectului, în pagina lecției, deasupra listei de pași.`,
  `Clipchamp e deschis de la pașii lecției, cu proiectul tău (sus, numele tău)? Sari la pasul 6. E deschis alt proiect? ≡ › <b>Înapoi la pagina de pornire (Back to home)</b> (nu găsești butonul? închide Clipchamp cu ✕ și pornește-l din nou). Nu e deschis? <b>Start</b>, scrii <b>Clipchamp</b>, clic. Nu apare sau cere instalare din <b>Microsoft Store</b>? Nu-l instala: sari la pasul 21.`,
  `Îți cere să te conectezi? Te conectezi doar cu contul TĂU, primit de la profesor. Dacă Windows te întreabă dacă să-ți țină minte contul pe calculatorul ăsta, pentru toate aplicațiile, nu accepta: alege să te conectezi doar la aplicația asta. Nu știi ce să alegi? Nu te conecta: sari la pasul 21. N-ai unul? <b>Nu-ți face cont</b> și nu scrie parola nimănui: sari la pasul 21.`,
  `Înainte să lucrezi, uită-te <b>al cui e contul</b>: pe pagina de pornire, apasă <b>pictograma de utilizator</b>, sus în dreapta; îți arată contul conectat. Lucrezi doar dacă e contul TĂU (la echipă: al colegului spus de profesor, cu el lângă tine). E al altcuiva (al unui coleg, al profesorului) sau nu știi al cui e? Nu deschide nimic în el: închide Clipchamp cu ✕, sari la pasul 21 și spune-i profesorului.`,
  `Pe pagina de pornire e proiectul tău cu <code>iarna</code> la capăt (l-ai început la pași sau într-o oră trecută)? Clic pe el și sari la pasul 6. Nu e? Apasă <b>Creați un videoclip nou (Create a new video)</b> sau <b>Videoclip necompletat (Blank video)</b>. Sus, apasă pe numele proiectului; dacă numele vechi nu dispare, șterge-l. Scrie numele TĂU (la echipă: numele spus de profesor) după regula din lecția 3, cu <code>iarna</code> la capăt, apoi ${K('Enter')}. Verifică: sus scrie numele ăsta.`,
  `În stânga, la <b>Conținutul meu media</b>, sunt cele 4 fotografii alese și muzica? Dacă nu, apasă <b>Importați conținutul media</b>; în fereastra <b>Deschidere</b>: <b>Descărcări</b>, clic pe prima fotografie, ${K('Ctrl')} + clic pe celelalte trei și pe <b>muzica-fundal</b> (cele fără (1) la capăt), apoi <b>Deschidere</b>. Așteaptă să apară toate cinci.`,
  `Scenele: sunt deja pe linia de timp? Doar verifici ordinea. Altfel, trage fotografiile pe linia de timp în ordinea din scenariu (sau <b>+</b> pe fiecare); fiecare primește 4 secunde. O scenă în alt loc o tragi la locul ei; la un gol între scene, ține mouse-ul pe el și apasă butonul coș de gunoi. Bifează rândul 2.`,
  `Trecerea: e deja? Doar o privești. Altfel pune <b>Estompare încrucișată</b> (sau altă tranziție) unde scrie în scenariu: cu butonul <b>+</b> dintre cele două scene (nu-l vezi? ține mouse-ul acolo) sau trasă din fila <b>Tranziții</b>. Apasă ${S('|◀')}, apoi ${S('▶')} și privește trecerea. Bifează rândul 3.`,
  `Muzica: e deja sub scene? Doar verifici. Altfel trage <b>muzica-fundal</b> sub scene, la ${CEAS('0:00')}. Clic pe ea: mânerul din dreapta stă la capătul ei, ${CEAS('0:24')} (fișierul are 24 de secunde). E prea tare în căști? În dreapta, la fila <b>Audio</b>, coboară <b>Volumul</b>. Bifează rândul 4.`,
  `Titlul: e deja, de data trecută? Nu mai pune altul: verifică doar locul. Altfel: în stânga, fila <b>Text</b>, apoi <b>+</b> pe <b>Text simplu</b> (nu-l vezi? ține mouse-ul pe el); clic pe clipul de text și scrie titlul în căsuța <b>Text</b>, în dreapta. Trage-l de mijloc la ${CEAS('0:00')}, apoi mânerul din dreapta până la ${CEAS('0:04')}.`,
  `Titlul se citește? Dacă nu, clic pe el și schimbă în dreapta <b>Poziție (Position)</b>, <b>Culoare (Color)</b> sau <b>Dimensiune (Size)</b>: text deschis pe o parte întunecată, închis pe una luminoasă (numele pot sta și într-un mic meniu, deasupra textului). Bifează rândul 1.`,
  `Genericul: e deja? Doar îl citești. Altfel, un <b>Text simplu</b> tras după ultima scenă, la ${CEAS('0:16')}. În căsuța Text scrie, cu ${K('Enter')} între rânduri: <b>Montaj:</b> și numele tău; <b>Foto:</b> și autorii din rândul 5 al scenariului (partea îngroșată a numelui); <b>Muzica: Erik Satie, Teknopazzo</b>; <b>CC0, Wikimedia Commons</b>. La echipă: rolul fiecăruia (<b>Scenariu:</b>, <b>Montaj:</b>).`,
  `Durata genericului: clic pe el și trage-i mânerul din dreapta până la secunda din scenariu (la fiecare 3 cuvinte, cel puțin 2 secunde; 16 cuvinte: de la ${CEAS('0:16')} la ${CEAS('0:27')}). După ${CEAS('0:24')} e liniște: e în regulă. Bifează rândul 5.`,
  `Apasă ${S('|◀')}, apoi ${S('▶')} (sau bara de spațiu) și privește tot filmul, cu scenariul în față. E totul cum ai scris? Se văd două texte unul peste altul, sau o scenă de două ori? Repară și privește din nou.`,
  `Exportul: sus, numele proiectului e al tău, cu <code>iarna</code> la capăt? Dacă nu, apasă pe el, scrie-l, apoi ${K('Enter')}. Apasă <b>Exportați (Export)</b>, sus, în dreapta. Vezi căsuța <b>Numele fișierului</b>? Scrie același nume. Abia apoi, la <b>Calitate</b>, alege <b>1080 p</b> (la unele conturi exportul pornește chiar atunci). <i>Store in the cloud</i>, dacă îl vezi, rămâne oprit. Apasă <b>Exportați</b>, dacă butonul e acolo, și așteaptă.`,
  `Deschide <b>Explorer</b>, apoi <b>Descărcări (Downloads)</b>: e acolo filmul tău <code>.mp4</code>? (Două cu numele tău? Cel cu <b>(1)</b> la capăt e de obicei cel nou.) Dublu clic pe el, privește-l, apoi închide fereastra filmului. Nu e acolo? Scrie în caiet ce ți-a arătat Clipchamp la sfârșitul exportului și spune-i profesorului.`,
  `<b>Dacă mai ai timp</b> (filmul e exportat): scrie <b>explicația</b> în caiet, sub scenariu, 2-3 propoziții: o alegere a ta și de ce („Am pus trecerea între … și …, pentru că …”), apoi „Mai greu a fost …”. Citește grila de produs (în pagina lecției, deasupra listei de pași) și uită-te la filmul tău: ce mai poți face ca să urci o coloană? Nu ajungi aici? Explicația o scrii la lecția 17. Mai ai timp și după asta? Fă pașii 18 și 19, apoi atelierul din pagină (jos, butonul «← Înapoi la atelier»).`,
  `Clipchamp salvează singur proiectul, cât are internet: așteaptă câteva secunde. Apoi te <b>deconectezi</b>, ca următorul elev să nu lucreze în contul tău: ≡ › <b>Înapoi la pagina de pornire (Back to home)</b> › <b>pictograma de utilizator</b>, sus în dreapta › <b>Deconectare (Sign out)</b>. Nu găsești ≡ sau Deconectare? Nu pleca: închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta.`,
  `Închide Clipchamp cu ✕. Fotografiile, muzica și filmul <code>.mp4</code> le lași în Descărcări: proiectul are nevoie de ele data viitoare, la calculatorul ăsta. Dacă altă dată Clipchamp îți cere fișierele, nu le căuta singur: spune-i profesorului.`,
  `<b>Dacă se termină ora și n-ai terminat:</b> nu exporta în grabă. Bifele din caiet arată unde ai rămas (ai lăsat o parte la jumătate? scrie un cuvânt lângă rândul ei). Fă pașii 18 și 19: proiectul rămâne în contul tău, fișierele în Descărcări. Data viitoare, când îți spune profesorul, deschizi proiectul (pașii 1-5 din lista asta) și continui de unde ai rămas: ce e bifat nu mai pui încă o dată, doar verifici că e acolo.`,
  `<b>Dacă oricând nu poți merge mai departe</b> (Clipchamp nu apare sau nu pornește, n-are internet, cere un cont pe care nu-l ai, e deschis în contul altcuiva, nu merge importul sau exportul): te-ai conectat cu contul tău? Deconectează-te întâi, ca la pasul 18 (nu poți? închide Clipchamp cu ✕ și spune-i profesorului încă din ora asta). Apoi fă atelierul din pagină, până la capăt (în pagina lecției, jos, butonul «← Înapoi la atelier»), și scrie în caiet scenariul tău și explicația (ca la pasul 17). Spune-i profesorului încă din ora asta (dacă e cu cealaltă clasă, la sfârșitul orei) ce s-a întâmplat, mai ales dacă Clipchamp era deschis în contul altcuiva.`
];

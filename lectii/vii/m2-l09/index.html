<style>
/* TEMA: fișa de specificații — hârtie crem, riglă în centimetri, o carte de vizită de 9 × 5 cm și o bifă */
:root{
  --desk:#EFEBE3; --paper:#FFFDF8; --paper2:#F5F0E6; --line:#D6CDBD;
  --ink:#1F2433; --ink2:#535A6B; --accent:#8C1C2C; --accentInk:#FFFFFF; --sel:#F3DCDF;
  --mark:#FFE08A; --markInk:#1F2433; --ok:#1B7A4A; --okbg:#E2F4EA; --bad:#B42318; --badbg:#FBE7E4;
  --fd:"Playfair Display",Georgia,"Times New Roman",serif; --fb:"Karla","Segoe UI",system-ui,sans-serif; --fm:"Ubuntu Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#15171D; --paper:#1D2029; --paper2:#252935; --line:#3A3F4E; --ink:#ECE7DD; --ink2:#B4B0A6;
  --accent:#F08A97; --accentInk:#15171D; --sel:#4A2A31; --mark:#F2C94C; --markInk:#1F2433;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}}
:root[data-theme="dark"]{
  --desk:#15171D; --paper:#1D2029; --paper2:#252935; --line:#3A3F4E; --ink:#ECE7DD; --ink2:#B4B0A6;
  --accent:#F08A97; --accentInk:#15171D; --sel:#4A2A31; --mark:#F2C94C; --markInk:#1F2433;
  --ok:#6FD19A; --okbg:#163324; --bad:#FF8A80; --badbg:#3B1D1B;
}
/* banda: o riglă cu centimetri, o carte de vizită de 9 × 5 și o bifă */
.banda{min-height:34px;padding:4px 10px;display:flex;align-items:center;gap:12px;background:var(--paper)}
.banda .rg{flex:1 1 60%;height:22px;border:1px solid var(--line);border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 24px) bottom/100% 9px no-repeat,
             repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 12px) bottom/100% 5px no-repeat;opacity:.75}
.banda .cv{flex:0 0 54px;height:30px;border:1.5px solid var(--accent);border-radius:2px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 6px}
.banda .cv i{display:block;height:3px;border-radius:2px;background:var(--ink2)}
.banda .cv i:first-child{background:var(--accent);height:4px}
.banda .bf{flex:0 0 22px;height:22px;border:2px solid var(--ok);border-radius:3px;position:relative}
.banda .bf::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid var(--ok);border-width:0 3px 3px 0;transform:rotate(45deg)}
h1{font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-style:normal}
h2{font-weight:600}
.doua{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.doua{grid-template-columns:1.4fr 1fr;align-items:end}}
.doua .et{font-weight:700;font-size:.88rem;color:var(--ink2)}
.descarca{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
/* lista de specificații (în atelier și la laborator) */
.fl-spec{margin:6px 0 10px;padding-left:1.2em}
.fl-spec li{margin:3px 0}
.fl-spec .u{display:block;color:var(--ink2);font-size:.9em}
/* laboratorul: alegerea fișei, lista de autoverificare, grila profesorului */
.fl-alege{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin:8px 0 12px}
@media (min-width:640px){.fl-alege{grid-template-columns:repeat(4,1fr)}}
.fl-alege button{min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fl-alege button b{display:block;font-family:var(--fd)}
.fl-alege button small{display:block;color:var(--ink2);font-size:.82rem;line-height:1.25}
.fl-alege button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.fl-fisa{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper2);margin:8px 0}
.fl-fisa h3{margin:2px 0 6px;font-family:var(--fd)}
.fl-lista{list-style:none;padding:0;margin:6px 0}
.fl-lista li{margin:4px 0}
.fl-lista label{display:flex;gap:10px;align-items:flex-start;min-height:32px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer}
.fl-lista input{flex:0 0 auto;width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.fl-lista label>span{min-width:0;overflow-wrap:anywhere}
.fl-lista .g{font-weight:700}
.fl-lista .u{display:block;color:var(--ink2);font-size:.88rem;margin-top:2px}
.fl-lista label.bifat{border-color:var(--ok);background:var(--okbg)}
.fl-scor{font-weight:700;margin:6px 0}
.fl-fisa details>summary{min-height:44px;padding:11px 4px;box-sizing:border-box;cursor:pointer}
.fl-diploma{margin:14px 0}
.fl-text{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
.fl-text p{margin:4px 0}
.fl-text table{border-collapse:collapse;margin:4px 0}
.fl-text td{border:1px solid var(--line);padding:2px 8px}
.fl-grila{display:grid;gap:8px;margin:6px 0}
.fl-crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.fl-crit ul{margin:4px 0 6px;padding-left:1.1em}
.fl-niv{display:flex;flex-wrap:wrap;gap:6px}
.fl-niv button{min-height:36px;min-width:36px;padding:4px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper2);color:var(--ink);font:inherit;cursor:pointer}
.fl-niv button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:700}
.fl-nivel{font-weight:700;margin:8px 0}
.fl-calc{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--paper);font-weight:400}
.fl-calc p{margin:4px 0}
.fl-ex{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);margin:8px 0}
.fl-ex p{margin:4px 0}
.fl-ex .fl-var{display:grid;gap:6px;margin:6px 0}
.fl-ex .fl-var button{min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper2);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.fl-ex .fl-var button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.fl-ex .fl-var button.ok{border-color:var(--ok);background:var(--okbg)}
.fl-ex .fl-var button.bad{border-color:var(--bad);background:var(--badbg)}
.fl-ex .fl-exr.ok{color:var(--ok)}
.fl-ex .fl-exr.bad{color:var(--bad)}
.fl-nou{margin-top:8px}
</style>

<script>
/* LECȚIA 9, clasa a VII-a, modulul 2 (consolidare, mini-proiect; revizuirea LearningHub, standardul din 27.09.2026).
   Un singur nivel pe pași: pasul 0 „La ce folosește”, 5 pași cu „Încearcă”, atelierul (verificarea încrucișată, în Word-ul
   simulat), pasul „Acum la calculatorul din laborator” (alegi fișa, descarci textul și poza, lista de autoverificare cu bife,
   grila profesorului), 5 întrebări.
   Simulatoarele: lectii/_sim/wordobj-formatare.js (`wordfmt`) și lectii/_sim/wordobj-pagina.js (`wordpag`), nemodificate;
   lectii/_sim/wordobj-hartie.js (`wordhartie`, al acestei lecții: mărimea foii, orientarea, marginile; plus numele
   vizibile pe Margins / Orientation / Size, Size în `wordpag` și casetele Font / Font Size mari pe telefon).
   Fișele: constanta FISE, scrisă de _proba/scrie_fise_js.py din _proba/fise.json (aceeași sursă din care _proba/proba_com.py
   a făcut documentele în Word-ul real). Faptele „dacă faci X, apare Y”: afirmatii.json. */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J7='../../../jocuri/word-obiecte-vii/img/';
const K=s=>s.split('+').map(k=>`<kbd>${k}</kbd>`).join('+');
const CR_CREIOANE='Poza creioanelor: MichaelMaggs, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Colouring_pencils.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.';
const PROG='Reguli de lucru în realizarea unui document conform unor specificații (dimensiune pagină, dimensiune font, dimensiune imagine, format tabel)';
/*FISE:START*/const FISE={"diploma":{"nume":"Diploma","scurt":"diploma","cui":"o diplomă pentru câștigătoarea concursului de desen al școlii","fisier_text":"diploma-text.docx","poza":{"fisier":"creioane-colorate.jpg","alt":"creioane colorate","sursa":"MichaelMaggs, CC BY-SA 3.0, Wikimedia Commons","pagina":"https://commons.wikimedia.org/wiki/File:Colouring_pencils.jpg","dupa":3,"w":6,"wmin":5.5,"wmax":6.5,"licenta":"CC BY-SA 3.0","licenta_url":"https://creativecommons.org/licenses/by-sa/3.0/"},"pagina":{"hartie":"A4","lat":29.7,"inalt":21,"or":"vedere","m":[2,2,2,2]},"par":[{"text":"DIPLOMĂ","font":"Georgia","sz":48,"b":1,"col":"C00000","al":"center"},{"text":"se acordă elevei","font":"Georgia","sz":16,"al":"center"},{"text":"Ioana Marin, clasa a VII-a B","font":"Georgia","sz":28,"b":1,"al":"center"},{"text":"pentru locul I la Concursul de desen „Toamna în satul meu”","font":"Georgia","sz":16,"i":1,"al":"center"},{"text":"Data: 20 noiembrie 2026","font":"Georgia","sz":14,"al":"left"},{"text":"Profesorul coordonator,","font":"Georgia","sz":14,"al":"right"},{"text":"Imaginea: MichaelMaggs, CC BY-SA 3.0, Wikimedia Commons","font":"Georgia","sz":8,"al":"right"}]},"felicitare":{"nume":"Felicitarea","scurt":"felicitare","cui":"o felicitare de 1 Decembrie pentru familiile elevilor","fisier_text":"felicitare-text.docx","poza":{"fisier":"steagul-romaniei.png","alt":"steagul României","sursa":"Wikimedia Commons, domeniu public","pagina":"https://commons.wikimedia.org/wiki/File:Flag_of_Romania.svg","dupa":1,"w":8,"wmin":7.5,"wmax":8.5,"licenta":"domeniu public"},"pagina":{"hartie":"A5","lat":14.8,"inalt":21,"or":"portret","m":[1.5,1.5,1.5,1.5]},"par":[{"text":"La mulți ani, România!","font":"Comic Sans MS","sz":28,"b":1,"col":"0070C0","al":"center"},{"text":"1 Decembrie, Ziua Națională a României","font":"Comic Sans MS","sz":16,"b":1,"al":"center"},{"text":"Vă dorim o zi de sărbătoare frumoasă, alături de cei dragi!","font":"Comic Sans MS","sz":14,"i":1,"al":"center"},{"text":"Elevii clasei a VII-a","font":"Comic Sans MS","sz":14,"al":"right"},{"text":"Imaginea: Wikimedia Commons, domeniu public","font":"Comic Sans MS","sz":8,"al":"right"}]},"scrisoare":{"nume":"Scrisoarea","scurt":"scrisoare","cui":"o scrisoare prin care diriginta invită părinții la serbarea de iarnă","fisier_text":"scrisoare-text.docx","pagina":{"hartie":"A4","lat":21,"inalt":29.7,"or":"portret","m":[2,2,3,2]},"tot":{"font":"Times New Roman","sz":12},"par":[{"text":"10 noiembrie 2026","al":"right"},{"text":"Dragi părinți,","b":1,"al":"left"},{"text":"Vă invităm vineri, 18 decembrie 2026, de la ora 17:00, la serbarea de iarnă a clasei a VII-a. Serbarea are loc în sala de festivități a școlii și durează cam o oră și jumătate.","al":"justify","prim":1.25,"rand":1.5},{"text":"Programul serbării:","b":1,"al":"left"},{"tabel":[["Ora","Ce urmează"],["17:00","Colinde"],["17:30","Scenete"],["18:00","Tombola cu premii"]],"stil":"Grid Table 4 - Accent 1","antet":1,"gol_dupa":1},{"text":"Vă rugăm să ne spuneți până luni, 14 decembrie, dacă veniți. Vă așteptăm cu drag!","al":"justify","prim":1.25,"rand":1.5},{"text":"Cu stimă,","al":"right"},{"text":"Diriginta clasei a VII-a","al":"right"}]},"carte":{"nume":"Cartea de vizită","scurt":"carte_vizita","cui":"cartea de vizită a clubului de lectură al școlii","fisier_text":"carte-de-vizita-text.docx","pagina":{"hartie":"9 × 5 cm","lat":9,"inalt":5,"or":null,"m":[0.5,0.5,0.5,0.5]},"par":[{"text":"Clubul de lectură","font":"Georgia","sz":14,"b":1,"col":"0070C0","al":"center"},{"text":"Citim, povestim, ne împrietenim cu cărțile.","font":"Georgia","sz":9,"i":1,"al":"center"},{"text":"Întâlniri: joia, ora 14:00","font":"Georgia","sz":10,"al":"center"},{"text":"Biblioteca școlii, etajul 1","font":"Georgia","sz":10,"al":"center"}]}};/*FISE:END*/

/* ---------- lista de specificații a unei fișe (aceeași în atelier și la laborator) ---------- */
const COL={'C00000':'roșu închis (Dark Red, primul pătrățel din Standard Colors)','0070C0':'albastru (Blue, al optulea pătrățel din Standard Colors)'};
const ALN={left:'la stânga (Align Left)',center:'centrat (Center)',right:'la dreapta (Align Right)',justify:'stânga-dreapta (Justify)'};
const nr=v=>String(v).replace('.',',');
const scurtT=t=>{const w=String(t).split(' ');return w.length>5?w.slice(0,4).join(' ')+'…':t};
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function specs(k){
  const F=FISE[k];if(!F)return [];
  const P=F.pagina,L=[],PS='Aspect (Layout) › Margini (Margins) › Margini particularizate (Custom Margins...)';
  const cul=P.lat>P.inalt,W=nr(P.lat),H=nr(P.inalt);
  L.push({g:'Foaia',t:P.hartie==='A4'?'mărimea A4 (21 × 29,7 cm)':P.hartie==='A5'?'mărimea A5 (14,8 × 21 cm)':`mărimea ${W} × ${H} cm`,
    u:`${PS}: în fereastra Inițializare pagină (Page Setup), fila Hârtie (Paper), Width (lățimea) arată ${W} cm și Height (înălțimea) ${H} cm${cul&&P.hartie==='A4'?' (foaia culcată)':''}; închizi cu Cancel (Anulare). Dacă nu arată așa, refă foaia din Aspect (Layout) › Dimensiune (Size)`});
  if(P.or)L.push({g:'Foaia',t:P.or==='vedere'?'culcată: Vedere (Landscape)':'în picioare: Portret (Portrait)',u:`aceeași fereastră, fila Margini (Margins): la Orientare (Orientation) e ales ${P.or==='vedere'?'Vedere (Landscape)':'Portret (Portrait)'}`});
  const m=P.m;
  L.push({g:'Foaia',t:m.every(v=>v===m[0])?`marginile: ${nr(m[0])} cm sus, jos, stânga și dreapta`:`marginile: sus ${nr(m[0])} cm, jos ${nr(m[1])} cm, stânga ${nr(m[2])} cm, dreapta ${nr(m[3])} cm`,
    u:`${PS}, fila Margini (Margins): Top (sus), Bottom (jos), Left (stânga), Right (dreapta)`});
  if(F.tot)L.push({g:'Textul',t:`tot textul: ${F.tot.font}, ${F.tot.sz} pt`,u:'selectezi tot textul, trăgând de la primul la ultimul rând; pe Pornire (Home): caseta Font și caseta de mărime (Font Size); goale = nu e peste tot la fel'});
  F.par.forEach(p=>{
    if(p.tabel){L.push({g:'Tabelul',t:`stilul ${p.stil} (antet albastru, rânduri în dungi), cu bifa Rând antet (Header Row) pusă${p.gol_dupa?'; după tabel, un singur rând gol (excepția de sub fișă)':''}`,u:'clic în tabel: fila Proiectare tabel (Table Design), bifa Rând antet (Header Row); compari tabelul cu poza lucrării bune'});return}
    const x=[];if(p.font)x.push(p.font);if(p.sz)x.push(`${p.sz} pt`);if(p.b)x.push('aldin');if(p.i)x.push('cursiv');if(p.col)x.push(COL[p.col]);x.push(ALN[p.al||'left']);
    if(p.prim)x.push(`alineat de ${nr(p.prim)} cm (Special: First line)`);if(p.rand)x.push('spațiere 1,5 rânduri (Line spacing: 1.5 lines)');
    let u='selectezi rândul; pe Pornire (Home): caseta Font, caseta de mărime (Font Size), B sau I aprins, butonul de aliniere aprins';
    if(p.col)u+='; culoarea o compari cu ochii';
    if(p.prim||p.rand)u='clic în paragraf: butonul de aliniere aprins; fereastra Paragraf (Paragraph), cu săgeata mică ↘ a grupului Paragraf: Special, By, Line spacing';
    L.push({g:'Rândul',t:`„${scurtT(p.text)}”: ${x.join(', ')}`,u})});
  if(F.poza){const z=F.poza,h=nr(Math.round(z.w*2/3*100)/100);L.push({g:'Poza',t:`${z.alt}: pe rândul ei, sub „${scurtT(F.par[z.dupa-1].text)}”, lată de ${nr(z.w)} cm (se acceptă ${nr(z.wmin)}–${nr(z.wmax)} cm), la mijloc, nedeformată`,
    u:`clic pe poză: fila Format imagine (Picture Format), grupul Dimensiune (Size): caseta de jos (↔) = lățimea; caseta de sus = înălțimea, două treimi din lățime (${nr(z.w)} cm → ${h} cm) = nedeformată; tot cu poza selectată, pe Pornire (Home) e aprins centrat (Center) = la mijloc`})}
  L.push({g:'Tot',t:'totul încape pe o singură pagină',u:'bara de stare, jos în stânga: Page 1 of 1 (pagina 1 din 1)'});
  L.push({g:'Salvarea',t:`numele fișierului: Nume_Prenume_clasa_${F.scurt}, în Documente (Documents) sau în folderul scris pe tablă`,u:'bara de titlu, sus: numele fișierului'});
  return L.map((s,i)=>Object.assign(s,{id:k+'_'+i}));
}
const listaSpec=(k,filtru)=>`<ol class="fl-spec">${specs(k).filter(s=>!filtru||filtru(s)).map(s=>`<li><b>${s.g}</b>: ${escH(s.t)}<span class="u">Unde o vezi: ${escH(s.u)}.</span></li>`).join('')}</ol>`;
function textFisa(k){const F=FISE[k];
  return `<div class="fl-text">${F.par.map(p=>p.tabel?`<table>${p.tabel.map(r=>`<tr>${r.map(c=>`<td>${escH(c)}</td>`).join('')}</tr>`).join('')}</table>${p.gol_dupa?'<p><i>(un singur rând gol după tabel: un Enter; excepția e explicată sub fișă)</i></p>':''}`:`<p>${escH(p.text)}</p>`).join('')}</div>`}

/* ---------- laboratorul: alegerea fișei, bifele, grila profesorului ----------
   Nimic nu se păstrează în browser (regula 23: calculatorul din laborator e comun): alegerea și bifele stau doar în
   memoria paginii deschise. Butonul „Sunt alt elev” le golește; o pagină reîncărcată pornește goală. */
const LAB={ales:null,bife:new Set(),niv:{},ex:{}};
const DESC={diploma:'Foaie A4 culcată, o poză',felicitare:'Foaie A5, un steag',scrisoare:'Foaie A4, un tabel',carte:'Foaie de 9 × 5 cm'};
const BUNA={diploma:['img/diploma-buna.webp',620,439],felicitare:['img/felicitare-buna.webp',400,567],scrisoare:['img/scrisoare-buna.webp',520,735],carte:['img/carte-vizita-buna.webp',540,300]};
const CREDIT={diploma:` ${CR_CREIOANE}`,felicitare:' Steagul: <a href="https://commons.wikimedia.org/wiki/File:Flag_of_Romania.svg" target="_blank" rel="noopener">Wikimedia Commons</a>, domeniu public.'};
const GRILA=[
  ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],

const insir=a=>a.length>1?a.slice(0,-1).join(', ')+' și '+a[a.length-1]:a[0];
function calculGrila(){
  const v=GRILA.map((c,i)=>LAB.niv[i]),alese=v.filter(x=>x!=null).length;
  const rand=(s,p,n,nv)=>`<p><b>Punctaj:</b> ${s} + 10 din oficiu = ${p} · <b>Nota</b> (punctaj : 10): ${n} · <b>Nivelul</b> (din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază): ${nv}</p>`;
  if(alese<GRILA.length)return rand('____','____','______','______')+`<p>${alese?`Ai ales la ${alese} din ${GRILA.length} criterii. Alege la toate ca să vezi punctajul, nota și nivelul.`:'Alege la fiecare criteriu ca să vezi punctajul, nota și nivelul.'}</p>`;
  const s=v.reduce((a,b)=>a+b,0),p=s+10,n=notaDin(p);
  const imp=p%10?`${p} : 10 = ${nr(p/10)}, rotunjit: ${n}`:`${p} : 10 = ${n}`;
  const lipsa=v.map(x=>18-x),max=Math.max(...lipsa),unde=lipsa.map((x,i)=>x===max?i:-1).filter(i=>i>=0);
  const nume=insir(unde.map(i=>`„${i+1}. ${GRILA[i][0]}”`));
  const castig=max===0?'Ai ales Avansat la toate criteriile: 100 de puncte, cât se poate.'
    :unde.length===GRILA.length?`La toate criteriile mai ai câte ${max} p până la 18 p. Alege unul și citește ce cere coloana următoare.`
    :unde.length>1?`Cel mai mult ai de câștigat la criteriile ${nume}: la fiecare mai sunt ${max} p până la 18 p. Citește acolo ce cere coloana următoare.`
    :`Cel mai mult ai de câștigat la criteriul ${nume}: de la ${18-max} p până la 18 p mai sunt ${max} p. Citește acolo ce cere coloana următoare.`;
  return rand(s,p,n,nivelDin(n))+`<p>Adunarea: ${v.join(' + ')} = ${s}, plus 10 din oficiu = ${p}. Nota: ${imp}.</p><p>${castig}</p>`;
}

  `<b>Verificarea încrucișată.</b> Dacă lângă tine lucrează un coleg de clasă, schimbați locurile: verifică-i documentul cu lista lui, de pe ecranul lui, și spune-i ce n-ai putut bifa. Apoi alege, în grila profesorului de sub listă, unde crezi că ești la fiecare criteriu: pagina adună punctele, cu 10 din oficiu, și îți arată nota (punctaj : 10) și nivelul.`
];

  cheie:'lectie_vii_m2_l09',

  h1:'Document după <em>specificații</em>: scrisoare, carte de vizită, diplomă, felicitare',
  clasa:'a VII-a', unitate:'VII-U1', unitateTitlu:'Tehnoredactare: editorul de texte',
  competente:['CS.1.1','CS.3.1'], lectii:'9',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  ancoraText:'Programa (OMEN 3393/2017): CS.1.1, CS.3.1 · unitatea VII-U1 „Tehnoredactare: editorul de texte” · lecția 9, din modulul 2: consolidare, mini-proiect · conținutul: „Reguli de lucru în realizarea unui document conform unor specificații (dimensiune pagină, dimensiune font, dimensiune imagine, format tabel)”',
  banda:'<span class="rg"></span><span class="cv"><i></i><i style="width:80%"></i><i style="width:60%"></i></span><span class="bf"></span>',
  intro:`<p>Faci singur un document adevărat, după o <b>fișă de specificații</b>: o diplomă, o felicitare, o scrisoare sau o carte de vizită. Înveți să citești fișa, să găsești în Word locul fiecărei cerințe și să verifici, rând cu rând, că documentul tău o respectă. Singurul lucru nou e mărimea foii.</p>
<p><b>Ai nevoie de:</b> lecția 2 (panglica și bara de stare, cu <b>Page 1 of 1</b>), lecția 3 (salvezi cu numele tău, cu <kbd>F12</kbd>), lecția 4 (pui o poză din calculator și un tabel), lecția 5 (selectezi textul trăgând peste el, anulezi cu ${K('Ctrl+Z')}, apeși <b>Activare editare (Enable Editing)</b>), lecția 6 (fontul, mărimea, aldinul, cursivul, culoarea, alinierea, fereastra <b>Paragraph</b>), lecția 7 (mărești poza din colț, stilul tabelului, orientarea foii și <b>Custom Margins...</b>) și lecția 8 (regulile unei pagini îngrijite).</p>`,
  cum:`<p><b>Poți lucra singur, fără profesor.</b> Citești un pas, te uiți la „Uite cum”, faci exercițiul „Încearcă tu”. În exerciții, după o greșeală apare singur un indiciu, iar după două poți cere răspunsul. În atelier verifici și repari cartea de vizită a unui coleg, în Word-ul simulat. Apoi urmează proiectul tău, la calculatorul din laborator: alegi o fișă, faci documentul în Word și îl verifici cu lista din pagină. La final ai 5 întrebări de verificare; indiciul îl ceri cu „Am nevoie de un indiciu”, iar după a doua greșeală vezi răspunsul.</p>`,
  nivele:[
{t:'Document după specificații date: scrisoare, carte de vizită, diplomă, felicitare',lectii:[9],continuturi:[PROG],final:true,
 obiectiv:'citești o fișă de specificații, faci în Word un document întocmai după ea (mărimea foii, marginile, fonturile și mărimile, alinierile, poza, tabelul) și verifici singur fiecare cerință, cu valoarea citită în Word.',
 pasi:[
  /* ---------- pasul 0 ---------- */
  {t:'La ce folosește',
   text:`<p>Școala are nevoie de documente adevărate: o diplomă pentru concursul de desen, o felicitare de 1 Decembrie, o scrisoare către părinți, o carte de vizită pentru clubul de lectură.</p>
<p>Cine le cere nu spune „fă-o frumos”. Îți dă o <strong>fișă de specificații</strong>: mărimea foii, marginile, fontul și mărimea fiecărui rând, lățimea pozei. Azi alegi una dintre cele patru fișe, faci documentul singur, în Word, și îl verifici tot singur. Uneltele le știi din lecțiile 2-8; nouă e doar mărimea foii.</p>
<div class="doua"><div><span class="et">După fișă</span>${fig('img/diploma-buna.webp',620,439,'Diploma în Word, pe foaia culcată: DIPLOMĂ mare, roșu închis, numele aldin, poza cu creioane colorate la mijloc, data la stânga și semnătura la dreapta','<b>După fișă</b>: fiecare rând are exact fontul, mărimea și alinierea cerute. '+CR_CREIOANE)}</div>
<div><span class="et">După ochi</span>${fig('img/diploma-rea.webp',440,622,'Aceeași diplomă în Word, pe foaia în picioare: titlul mai mic, numele fără aldin, poza deformată (lungită), data centrată','<b>După ochi</b>: „pare bine”, dar foaia, titlul, numele, poza și data nu sunt cum cere fișa. '+CR_CREIOANE)}</div></div>`},
  /* ---------- pasul 1 ---------- */
  {t:'Ce este o specificație',
   text:`<p>O <mark>specificație</mark> este o cerință pe care o poți <strong>măsura</strong>. Are trei părți:</p>
<ul><li><strong>ce</strong>: foaia, un rând de text, poza, tabelul;</li>
<li><strong>ce setare</strong>: mărimea, marginile, fontul, alinierea…;</li>
<li><strong>cât</strong>: un număr cu unitatea lui sau un nume.</li></ul>
<p>Unitățile: <strong>cm</strong> pentru foaie, margini și poză; <strong>pt</strong> (puncte) pentru mărimea literelor. „Titlul mare” nu e o specificație: mare cât? „Titlul: 48 pt” este. O specificație e respectată sau nu, iar asta o spune valoarea din Word, nu ochiul.</p>`,
   exemplu:`<p>Rândul din fișă: <b>„DIPLOMĂ”: Georgia, 48 pt, aldin, centrat</b>.</p><ul><li>ce: primul rând, „DIPLOMĂ”;</li><li>setările: fontul, mărimea, aldinul, alinierea;</li><li>cât: Georgia, 48 pt, aldin, centrat.</li></ul><p>Patru lucruri de verificat, într-un singur rând al fișei.</p>`,
   altfel:`<p>E ca o rețetă de prăjitură. „Puțin zahăr” nu te ajută; „100 de grame de zahăr” da, și le verifici pe cântar. În Word, cântarul sunt casetele cu numere de pe panglică.</p>`,
   incearca:{t:'classify',q:'Care cerințe sunt specificații (le verifici cu un număr sau cu un nume din Word) și care sunt doar dorințe? Alege pe fiecare rând, apoi apasă „Verifică”.',
    cats:['Specificație','Doar o dorință'],
    items:[['Numele elevei: 28 pt, aldin',0],['Numele să se vadă bine',1],['Marginile: 2 cm pe fiecare parte',0],['Poza să nu fie prea mare',1],['Data: aliniată la stânga',0],['Culori vesele',1]],
    ajutor:'Întreabă-te la fiecare rând: pot citi în Word un număr sau un nume care să-mi spună „da” sau „nu”?',
    why:'Specificațiile au o valoare pe care o citești în Word: 28 pt, 2 cm, la stânga. „Să se vadă bine” sau „vesele” nu se pot măsura: doi colegi ar răspunde diferit.'},
   inca:[
    {t:'choice',q:'În fișa colegului scrie: „titlul să fie mare”. Cum o scrii ca specificație?',
     o:['Titlul: 36 pt','Titlul: foarte mare','Titlul: mai mare decât restul','Titlul: cât mai mare'],ok:0,
     ajutor:'Care variantă are un număr și o unitate?',why:'Doar „36 pt” se poate verifica în caseta de mărime. „Foarte mare”, „mai mare” și „cât mai mare” înseamnă altceva pentru fiecare om.'},
    {t:'choice',q:'Fișa spune: „Marginile: 1,5”. Ce lipsește ca să fie o specificație întreagă?',
     o:['Unitatea: cm','Fontul','Culoarea','Nimic, e întreagă'],ok:0,
     ajutor:'Recitește partea „cât” din pas.',why:'Fără unitate, „1,5” poate fi orice. Marginile se dau în centimetri: 1,5 cm.'}
   ]},
  /* ---------- pasul 2 ---------- */
  {t:'Unde se face fiecare specificație',
   text:`<p>Fiecare specificație are locul ei în Word, și pe toate le-ai folosit deja:</p>
<ul><li><strong>foaia</strong>: fila <strong>Aspect (Layout)</strong>: <strong>Orientare (Orientation)</strong>, <strong>Margini (Margins) › Margini particularizate (Custom Margins...)</strong> (lecția 7) și <strong>Dimensiune (Size)</strong> (pasul 3);</li>
<li><strong>literele</strong> unui rând: fila <strong>Pornire (Home)</strong>, grupul <strong>Font</strong>: fontul, mărimea, <b>B</b>, <i>I</i>, culoarea (lecția 6);</li>
<li><strong>rândul</strong>: grupul <strong>Paragraf (Paragraph)</strong>: alinierea; fereastra <strong>Paragraph</strong>: alineatul și spațierea (lecția 6);</li>
<li><strong>poza</strong>: fila <strong>Format imagine (Picture Format)</strong>; <strong>tabelul</strong>: fila <strong>Proiectare tabel (Table Design)</strong> (lecția 7).</li></ul>
<p>Regula: întâi selectezi ce schimbi (textul, poza, tabelul), apoi cauți setarea.</p>`,
   exemplu:`<p>Primele rânduri din fișa diplomei:</p><ul><li>„Foaia: culcată” → Aspect (Layout) › Orientare (Orientation) › Vedere (Landscape);</li><li>„Marginile: 2 cm” → Aspect (Layout) › Margini (Margins) › Margini particularizate (Custom Margins...), apoi 2 la Top, Bottom, Left, Right;</li><li>„DIPLOMĂ: 48 pt” → selectezi „DIPLOMĂ”, apoi caseta de mărime din grupul Font.</li></ul>
${fig(J7+'margini.webp',610,580,'Fila Layout din Word cu butonul Margins deschis: lista de margini gata făcute și Custom Margins jos','Aspect (Layout) › <b>Margini (Margins)</b>: jos, <b>Margini particularizate (Custom Margins...)</b>.')}`,
   altfel:`<p>E ca într-o bucătărie: fiecare lucru are sertarul lui, iar tacâmurile nu le cauți în frigider. În Word, ce ține de foaie e în Aspect (Layout), ce ține de litere e în Pornire (Home).</p>`,
   incearca:{t:'wordhartie',
    q:'Fișa diplomei cere: <b>foaia culcată</b> și <b>marginile de 2 cm</b> pe fiecare parte. Fă-le în Word-ul simulat: fila <b>Aspect (Layout)</b> › <b>Orientare (Orientation)</b> › <b>Vedere (Landscape)</b>; apoi <b>Margini (Margins)</b> › <b>Margini particularizate (Custom Margins...)</b>. În fiecare casetă (Top, Bottom, Left, Right): clic în ea, șterge tot ce scrie acolo, scrie 2; la urmă OK.',
    start:{bl:DIPLOMA_BL},
    verif:[{ce:'Foaia e culcată (Landscape)',pagina:{or:'vedere'}},{ce:'Marginile au 2 cm pe fiecare parte',pagina:{m:{sus:2,jos:2,st:2,dr:2}}}],
    tipic:{or:'vedere'},
    ajutor:'Fila Aspect (Layout) (pe telefon, derulează filele): butonul Orientare (Orientation) › Vedere (Landscape). Apoi butonul Margini (Margins) › Margini particularizate (Custom Margins...) În fereastra Page Setup, la fiecare dintre Top, Bottom, Left și Right șterge tot ce scrie (și „cm”) și scrie 2, apoi OK.',
    why:'Foaia e culcată, iar marginile au 2 cm pe fiecare parte, cum cere fișa.'},
   inca:[
    {t:'wordfmt',unelte:['paragraf'],q:'Fișa diplomei cere: rândul <b>Data: 20 noiembrie 2026</b> la stânga, iar rândul <b>Profesorul coordonator,</b> la dreapta. Colegul le-a centrat pe amândouă. Repară-le.',
     start:[G('Data: 20 noiembrie 2026',14,{al:'center'}),G('Profesorul coordonator,',14,{al:'center'})],
     verif:[{ce:'Data e la stânga',par:1,al:'left'},{ce:'„Profesorul coordonator,” e la dreapta',par:2,al:'right'}],
     tipic:[{par:2,al:'right'}],
     ajutor:'Clic în rândul cu data, apoi Align Left (Ctrl+L). Clic în „Profesorul coordonator,”, apoi Align Right (Ctrl+R).',
     why:'Alinierea e a rândului întreg: un clic în el și butonul potrivit.'},
    {t:'choice',q:'Fișa cere: „Poza: lată de 6 cm”. Unde cauți?',
     o:['Fila Format imagine (Picture Format), după clic pe poză','Fila Pornire (Home), grupul Font','Fila Aspect (Layout), butonul Dimensiune (Size)','Fila Proiectare tabel (Table Design)'],ok:0,
     ajutor:'Lățimea e a pozei. Pe ce filă sunt setările pozei?',why:'Setările pozei sunt pe fila Format imagine (Picture Format), care apare doar când poza e selectată.'}
   ]},
  /* ---------- pasul 3 ---------- */
  {t:'Mărimea foii: Dimensiune (Size)',
   text:`<p>Foaia nouă din Word e <strong>A4</strong> (21 × 29,7 cm). Altă mărime alegi din fila <strong>Aspect (Layout)</strong>, butonul <mark>Dimensiune (Size)</mark>: de exemplu <strong>A5</strong>, 14,8 × 21 cm. Lista vine de la imprimantă, deci pe alt calculator poate diferi.</p>
<p>Pentru 9 × 5 cm: jos, <strong>More Paper Sizes...</strong> (mai multe mărimi de hârtie). Se deschide fereastra <strong>Page Setup</strong> (Inițializare pagină), la fila <strong>Hârtie (Paper)</strong>. Dai clic în caseta <strong>Width</strong> (lățime), <strong>ștergi tot</strong> ce scrie acolo, cu Backspace și Delete, și scrii 9. La <strong>Height</strong> (înălțime), la fel: 5. <strong>Paper size</strong> trece singur pe <strong>Custom size</strong>.</p>
<div class="doua">${fig('img/marime-lista.webp',269,643,'Lista butonului Size din Word: Letter, Legal, A4 21 cm x 29,7 cm, A5 14,8 cm x 21 cm și altele; jos, More Paper Sizes încadrat cu roșu','Aspect (Layout) › <b>Dimensiune (Size)</b>: A4, A5… Jos: <b>More Paper Sizes...</b>')}${fig('img/hartie-9x5.webp',521,205,'Fereastra Page Setup, fila Paper: Paper size Custom size, Width 9 și Height 5, încadrate cu roșu','Fila <b>Hârtie (Paper)</b>: Width 9, Height 5, iar Paper size a trecut pe <b>Custom size</b>.')}</div>`,
   exemplu:`<p>Clicul nu șterge ce scrie în casetă: fără ștergere iese „21 cm9”, iar Word spune „This is not a valid measurement.” (nu e o măsură bună). Iar la 9 × 5 cm marginile de 2,5 cm nu încap: sus și jos fac 5 cm, cât foaia. La OK, Word spune:</p>
${fig('img/mesaj-margini.webp',451,219,'Mesajul Microsoft Word: The top/bottom margins are too large for the page height in some sections, cu butonul OK','Mesajul lui Word: marginile de sus și de jos sunt prea mari pentru înălțimea foii.')}
<p><b>OK</b> pe mesaj; fereastra rămâne deschisă. Pe fila <b>Margini (Margins)</b>, în fiecare casetă ștergi tot și scrii 0,5, apoi <b>OK</b>.</p>
${fig('img/margini-05.webp',521,320,'Fereastra Page Setup, fila Margins: Top, Bottom, Left și Right au 0,5, încadrate cu roșu; la Orientation e ales Landscape','Fila <b>Margini (Margins)</b>: 0,5 peste tot. Foaia e mai lată decât înaltă, deci e aleasă <b>Vedere (Landscape)</b>.')}`,
   altfel:`<p>E ca atunci când faci o felicitare din carton: întâi tai cartonul cât trebuie, apoi lași un chenar alb pe margini. Dacă chenarul e mai lat decât cartonul, nu mai ai unde să scrii.</p>`,
   incearca:{t:'wordhartie',
    q:'Fă foaia cărții de vizită: <b>9 × 5 cm</b>, cu marginile de <b>0,5 cm</b>. Fila <b>Aspect (Layout)</b> › <b>Dimensiune (Size)</b> › <b>More Paper Sizes...</b>; în Width șterge tot și scrie 9, în Height șterge tot și scrie 5. Fără OK, treci pe fila <b>Margini (Margins)</b>: în fiecare casetă șterge tot și scrie 0,5. Abia apoi OK.',
    start:{bl:CARTE_BL},
    verif:[{ce:'Foaia are 9 cm lățime (Width)',pagina:{lat:9}},{ce:'Foaia are 5 cm înălțime (Height)',pagina:{inalt:5}},{ce:'Marginile au 0,5 cm pe fiecare parte',pagina:{m:{sus:0.5,jos:0.5,st:0.5,dr:0.5}}}],
    tipic:{lat:9,inalt:29.7},
    ajutor:'Aspect (Layout) › Dimensiune (Size) › More Paper Sizes... (jos în listă). În fila Hârtie (Paper): clic în Width, șterge tot (și „cm”), scrie 9; la fel Height: 5. Fila Margini (Margins): în Top, Bottom, Left și Right șterge tot și scrie 0,5. Apoi OK. Dacă apare un mesaj, apasă OK pe el și repară caseta.',
    why:'Foaia are 9 × 5 cm, iar marginile de 0,5 cm lasă loc de rânduri: 8 × 4 cm.'},
   inca:[
    {t:'wordhartie',q:'Felicitarea: foaia <b>A5</b>, cu marginile de <b>1,5 cm</b> pe fiecare parte. Fila <b>Aspect (Layout)</b> › <b>Dimensiune (Size)</b> › <b>A5</b>; apoi <b>Margini (Margins)</b> › <b>Margini particularizate (Custom Margins...)</b>: în fiecare casetă șterge tot și scrie 1,5; OK.',
     start:{bl:FELICITARE_BL},
     verif:[{ce:'Foaia e A5: 14,8 × 21 cm',pagina:{lat:14.8,inalt:21}},{ce:'Marginile au 1,5 cm pe fiecare parte',pagina:{m:{sus:1.5,jos:1.5,st:1.5,dr:1.5}}}],
     tipic:{lat:14.8,inalt:21},
     ajutor:'Aspect (Layout) › Dimensiune (Size): în listă, A5 (14,8 cm x 21 cm). Apoi Aspect (Layout) › Margini (Margins) › Margini particularizate (Custom Margins...), 1,5 în Top, Bottom, Left și Right (după ce ștergi ce scrie), OK.',
     why:'A5 e jumătate de A4, iar marginile de 1,5 cm lasă 11,8 cm pentru rânduri.'},
    {t:'choice',q:'Felicitarea e pe o foaie A5, lată de 14,8 cm. Marginile din stânga și din dreapta au câte 1,5 cm. Cât loc rămâne pentru rânduri, în lățime?',
     o:['11,8 cm','13,3 cm','14,8 cm','16,3 cm'],ok:0,
     ajutor:'Din lățimea foii scazi ambele margini: și pe cea din stânga, și pe cea din dreapta.',
     why:'14,8 − 1,5 − 1,5 = 11,8 cm. Cu 13,3 cm ai fi scăzut o singură margine.'},
    {t:'choice',q:'Ai scris Width 9 și Height 5, dar marginile au rămas de 2,5 cm, și apeși OK. Ce se întâmplă?',
     o:['Word spune că marginile sunt prea mari','Word face singur marginile mai mici','Foaia rămâne A4 și nu apare nimic','Word șterge rândurile care nu încap'],ok:0,
     ajutor:'Cât fac marginile de sus și de jos, împreună?',why:'Sus și jos fac 2,5 + 2,5 = 5 cm, cât toată foaia. Word arată mesajul; după OK, fereastra Page Setup rămâne deschisă și schimbi marginile.'}
   ]},
  /* ---------- pasul 4 ---------- */
  {t:'Cum verifici în Word',
   text:`<p>O specificație o verifici <strong>citind</strong> Word-ul, nu cu ochii:</p>
<ul><li><strong>literele</strong>: selectezi rândul (tragi peste el). Pe <strong>Pornire (Home)</strong>, caseta <strong>Font</strong> arată fontul, caseta de mărime arată mărimea, iar <b>B</b> și butonul de aliniere sunt aprinse dacă rândul e aldin și aliniat așa;</li>
<li>ai selectat rânduri cu mărimi diferite? Caseta de mărime rămâne <strong>goală</strong>: verifică rând cu rând;</li>
<li><strong>culoarea</strong> nu are casetă: bara de sub <b>A</b> arată ultima culoare folosită, nu pe a textului. O compari cu ochii.</li></ul>
${fig('img/verifici-font.webp',647,322,'Grupurile Font și Paragraph din Word, de două ori: cu titlul selectat, casetele arată Georgia și 48, iar B și Center sunt aprinse; cu două rânduri selectate, caseta de mărime e goală','Sus: titlul selectat, <b>Georgia</b>, <b>48</b>, <b>B</b> și <b>Center</b> aprinse. Jos: două rânduri cu mărimi diferite, caseta de mărime goală.')}`,
   exemplu:`<p><b>Poza:</b> clic pe ea, fila <b>Format imagine (Picture Format)</b>, grupul <b>Dimensiune (Size)</b>: sus înălțimea, jos, cu săgeata ↔, lățimea.</p>
${fig('img/verifici-poza.webp',390,165,'Fila Picture Format din Word, grupul Size: înălțimea 4 cm sus și lățimea 6 cm jos, încadrată cu roșu','Grupul <b>Dimensiune (Size)</b>: jos, lățimea pozei, <b>6 cm</b>.')}
<p><b>Foaia:</b> Aspect (Layout) › Margini (Margins) › Margini particularizate (Custom Margins...): fila Margini (Margins) arată marginile și orientarea, fila Hârtie (Paper) arată Width și Height. Închizi cu <b>Cancel</b> (Anulare): nu schimbi nimic.</p>`,

  {t:'Ordinea de lucru și bifele',
   text:`<p>Faci documentul pe rând, după fișă:</p>
<ol><li><strong>textul</strong>: deschizi documentul descărcat (sau îl scrii);</li>
<li><strong>foaia</strong>: mărimea, orientarea, marginile;</li>
<li><strong>literele și rândurile</strong>, rând cu rând;</li>
<li><strong>poza</strong> sau <strong>tabelul</strong>;</li>
<li><mark>autoverificarea</mark>: iei fiecare rând al fișei, cauți valoarea în Word și bifezi <strong>doar ce ai văzut</strong>. Ce nu se potrivește, repari și verifici din nou;</li>
<li><strong>salvarea</strong>, cu numele tău.</li></ol>
<p>Foaia vine înaintea literelor și a pozei: de ea depinde cât loc au rândurile și poza.</p>`,

 atelier:{t:'wordfmt',unelte:['caractere','paragraf'],titlu:'Atelier: verifici cartea de vizită a colegului',
  intro:`<p>Colegul tău a făcut textul cărții de vizită a clubului de lectură, dar nu l-a verificat. Tu faci <strong>verificarea încrucișată</strong>: verifici lucrarea lui după fișă, rând cu rând, și repari ce nu se potrivește. Rândurile de text din fișa cărții de vizită:</p>
<div data-spec-atelier></div>
<p><b>Cum lucrezi aici:</b> selectezi un rând trăgând peste el (pe telefon, cu degetul) și citești casetele din grupul Font și butoanele de aliniere. Înainte de o selecție nouă, dă un clic în afara celei vechi. Pe telefon nu ai tasta Ctrl: folosești butoanele de sub document; panglica se derulează în lateral. Sub sarcină vezi testele, câte două pe rând (literele, alinierea): fiecare se bifează ✔ când partea lui e gata. Ce anume e greșit afli tu, din casete.</p>
<p>După atelier urmează proiectul tău, la calculatorul din laborator, apoi 5 întrebări de verificare.</p>`,

<style>

  --desk:#F1F4F2; --paper:#FFFFFF; --paper2:#F3F6F4; --line:#D3DCD6;
  --ink:#1A2420; --ink2:#52615A; --accent:#1F6F4A; --accentInk:#FFFFFF; --sel:#DCEDE3;
  --mark:#FFE7A0; --markInk:#1A2420; --ok:#1C7A47; --okbg:#E1F2E7; --bad:#B42318; --badbg:#FBE5E2;
  --fd:"Lexend","Segoe UI",system-ui,sans-serif; --fb:"Lexend","Segoe UI",system-ui,sans-serif; --fm:"Martian Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1613; --paper:#17211C; --paper2:#1D2A24; --line:#33463C;

}}

  --desk:#0F1613; --paper:#17211C; --paper2:#1D2A24; --line:#33463C;

}
/* banda de sus: un rând de text pe care scriu trei colegi deodată — trei cursoare colorate, cu stegulețul lor (doar CSS) */
.banda{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:42px;min-height:38px;padding:6px 12px 6px;overflow:hidden;
  background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(31,111,74,.18) 13px 14px),#F7FAF8}
.banda .b-c{position:relative;width:2px;height:18px;background:var(--cc)}
.banda .b-c::before{content:"";position:absolute;left:0;bottom:100%;width:16px;height:7px;border-radius:2px 2px 2px 0;background:var(--cc)}
h1{font-size:clamp(1.45rem,5.4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h1 .acc{color:var(--accent)}
h2{font-weight:700}
.nevoie{border-left:4px solid var(--accent);padding:6px 10px;background:var(--paper2);border-radius:0 6px 6px 0}
figure.captura.mica img{max-width:440px}
figure.captura figcaption a{display:inline-block;padding:7px 2px;margin:-7px 0}
details.tel{margin:.6em 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
details.tel summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;box-sizing:border-box}
details.tel p{margin:0;padding:0 12px 10px}
details.tel a{display:inline-block;padding:6px 0}
/* trecerea 3 (AH): legătura „atelierul lecției” din laborator, țintă de atingere ≥ 32 px (ca la VII/20, punctul P) */
ol.aplicatie-reala a{display:inline-block;padding:6px 0}
.reading ol li,.reading ul li{margin:.2em 0}
.cod{font-family:var(--fm);font-size:.9em;background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:0 4px;word-break:break-all}
/* „Acum în browserul tău adevărat” (regula 10): gesturi mici, reale, imediat după pas (ca la VII/18) */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:700;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum .acum-tel{margin:.35em 0 0;font-size:.92em;color:var(--ink2)}

<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/colab-google.js"></script>
<script src="../../_sim/colab-google-echipa.js"></script>
<script>
/* ======================================================================================================
   Lecția VII · M3 · nr. 19 — „Instrumente de lucru: documente și prezentări în colaborare” (VII-U3, CS.1.3).
   Aplicația = Google (Drive, Documente Google, Prezentări Google), cu contul Google de la școală (decizia
   dirijorului, 23.10.2026, m3_noapte_23_10/prompturi/_noapte.md §1), ca la VII/18.
   Simulatoarele: lectii/_sim/colab-google.js (VII/18, neschimbat) + extensia lectii/_sim/colab-google-echipa.js
   (proprietar: lecția aceasta) — tipul `echipa`.
   SIGURANȚA: conturile, adresele, persoanele și fișierele sunt INVENTATE (domeniul .test e rezervat pentru exemple);
   ce tastează elevul nu se salvează și nu pleacă nicăieri (proba: _proba/proba_lectie.py, în surse.md).
   Numele din interfață: ajutorul Google în română (surse.md); NESIGURE trecute acolo și în capturi_lipsa.json.
   Granița: conectarea = 18; modul Sugerare, istoricul, publicarea = 20; etica, frauda = 21.
   Reparațiile după judecata 1 (24.10.2026): _verificare/registru_j1.md (literele A…), proba _proba/proba_reparatii.py.
   Trecerea 3 (24.10.2026, după judecata 2): literele AA-AG, în același registru și în aceeași probă.
   ====================================================================================================== */
const CONT=['Facilități ale aplicațiilor de tip colaborativ','Interfaţa aplicaţiei colaborative','Instrumente de lucru: documente, prezentări'];
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;
/* ca la VII/18 (pagina publicată): fiecare bloc „Acum…” are rândul de telefon; unde elevul rămâne conectat, și rândul de pauză */
const TEL='<b>Pe telefon:</b> sari peste; pașii tăi sunt la laborator.';
const PAUZA='Sună de pauză? Întâi <b>Profil</b> → <b>Deconectează-te</b>.';
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol><p class="acum-tel">${TEL}</p></div>`;
const K=SimColabGoogle.CONTURI;                      // ana, radu, ioana (adresă, nume, parolă inventată)
const P=SimColabEchipa.PERSOANE;                     // agenda școlii, inventată (cu un Radu Enescu și o a doua Ioana Rusu)
const NUME_ANA='Pop_Ana_7A_colaborare', PREZ_ANA='Pop_Ana_7A_prezentare';
const E_=o=>Object.assign({t:'echipa'},o);
const RADU={nume:'Radu Ene',adresa:K.radu.adresa}, IOANA={nume:'Ioana Rusu',adresa:K.ioana.adresa};
/* documentul Anei de la lecția 18 (două rânduri) */
const DOC_ANA=(extra)=>Object.assign({id:'a-colab',titlu:NUME_ANA,tip:'doc',loc:'meu',modificat:'acum',
  paragrafe:[{autor:'eu',text:'Ana Pop, clasa a VII-a A.'},{autor:'eu',text:'Azi am învățat să intru în Drive.'}]},extra||{});
const FIS_ANA=(extra)=>[DOC_ANA(extra)].concat(SimColabGoogle.FISIERE_ANA);
/* documentul lui Radu, dat Anei ca Editor (pasul 3): Radu e înăuntru și scrie */
const DOC_RADU={id:'r-plan',titlu:'Ene_Radu_7A_colaborare',tip:'doc',loc:'distribuite',modificat:'acum',proprietar:RADU,rolMeu:'editor',
  paragrafe:[{autor:'radu',text:'Radu Ene, clasa a VII-a A. Planul excursiei la Cetatea Neamțului.'}],acces:[{cine:'ana',rol:'editor'}],
  scenariu:[{cine:'radu',cand:'deschis',fa:'intra',pauza:300},{cine:'radu',cand:'deschis',fa:'scrie',nou:true,text:'Plecăm vineri la ora 8, de la poarta școlii.',pauza:900}]};
/* același plan, mai târziu: a scris și Ioana (pasul 4) */
const DOC_PLAN={id:'r-plan2',titlu:'Ene_Radu_7A_colaborare',tip:'doc',loc:'distribuite',modificat:'acum',proprietar:RADU,rolMeu:'editor',
  paragrafe:[{autor:'radu',text:'Radu Ene, clasa a VII-a A. Planul excursiei la Cetatea Neamțului.'},{autor:'radu',text:'Plecăm vineri la ora 8, de la poarta școlii.'},
    {autor:'ioana',text:'Ce luăm: apă și o gustare.'}],acces:[{cine:'ana',rol:'editor'},{cine:'ioana',rol:'editor'}],
  scenariu:[{cine:'ioana',cand:'deschis',fa:'intra',pauza:400},{cine:'ioana',cand:'comentat',fa:'raspunde',text:'Bună idee, o adaug.',textNepotrivit:'Nu înțeleg ce vrei să schimb.',pauza:1500}]};
/* prezentarea lui Radu, dată Anei ca Editor (pasul 5) */
const PREZ_RADU={id:'r-prez',titlu:'Ene_Radu_7A_prezentare',tip:'prez',loc:'distribuite',modificat:'acum',proprietar:RADU,rolMeu:'editor',
  slides:[{autor:'radu',titlu:'Excursia la Cetatea Neamțului',text:'Echipa: Radu, Ioana și Ana, clasa a VII-a A.'},{autor:'ioana',titlu:'Ce luăm',text:'Apă, o gustare și pelerina.'}],
  acces:[{cine:'ana',rol:'editor'},{cine:'ioana',rol:'editor'}],scenariu:[{cine:'ioana',cand:'deschis',fa:'intra',pauza:500}]};
/* prezentarea Ioanei (întrebarea 5) */
const PREZ_IOANA={id:'i-prez',titlu:'Rusu_Ioana_7A_prezentare',tip:'prez',loc:'distribuite',modificat:'acum',proprietar:IOANA,rolMeu:'editor',
  slides:[{autor:'ioana',titlu:'Ziua sportului',text:'Echipa: Ioana, Radu și Ana.'},{autor:'radu',titlu:'Ce probe avem',text:'Alergare, ștafetă și sărituri.'}],
  acces:[{cine:'ana',rol:'editor'},{cine:'radu',rol:'editor'}],scenariu:[{cine:'radu',cand:'deschis',fa:'intra',pauza:500}]};
/* comentariile din simulator = PE ALEGERE, cu motivul (regula campaniei, ca la VI/16 și VII/21): sfatul nepoliticos, cel gol și cel
   care schimbă textul colegului nu primesc niciodată „Corect”; în laborator, în Google adevărat, elevul scrie el comentariul */
const V_IOANA=[
  {text:'Nu-mi place deloc, e prost scris!',ok:false,dece:'e nepoliticos și nu-i spune Ioanei ce să schimbe'},
  {text:'Adăugăm și o pungă pentru gunoi? Lăsăm locul curat.',ok:true,dece:'spune politicos ce ai adăuga și de ce'},
  {text:'Bine.',ok:false,dece:'e politicos, dar nu spune ce ai schimba'},
  {text:'Am șters eu gustarea, nu ne trebuie.',ok:false,dece:'spune că i-ai schimbat textul, fără acordul ei'}];
const V_ATELIER=[
  {text:'Ok.',ok:false,dece:'nu-i spune Ioanei nimic de schimbat'},
  {text:'Ce prostie, iar ai uitat ceva!',ok:false,dece:'e nepoliticos și nu spune ce lipsește'},
  {text:'Ți-am șters pelerina, n-o să plouă.',ok:false,dece:'spune că i-ai schimbat textul, fără acordul ei'},
  {text:'Luăm și o hartă a traseului? Ca să nu ne rătăcim.',ok:true,dece:'spune politicos ce ai adăuga și de ce'}];
const V_REFERAT=[
  {text:'Super!',ok:false,dece:'e politicos, dar nu-i spune lui Radu ce să adauge'},
  {text:'Poți scrie și câți zimbri ați văzut? E interesant.',ok:true,dece:'spune politicos ce ar putea adăuga'},
  {text:'Referatul tău e plictisitor.',ok:false,dece:'e nepoliticos și nu-l ajută'},
  {text:'Îl scriu eu pe tot, e mai bine.',ok:false,dece:'îi iei munca, în loc să-l ajuți'}];

const LECTIA={
 t:'Instrumente de lucru: documente și prezentări în colaborare',lectii:[19],continuturi:CONT,final:true,
 obiectiv:'dai acces colegilor la documentul tău, cu rolul potrivit, și lucrați în el în același timp, cu comentarii. Faceți împreună o prezentare Google, fiecare cu diapozitivul lui.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>La lecția 18 ai făcut în Drive un document al tău. Azi îl faci al echipei.</p>
<p>Ana, Radu și Ioana pregătesc excursia clasei. Fiecare scrie partea lui, din contul lui, în același document. Își lasă observații pe margine, fără să schimbe textul altuia. Apoi fac împreună o prezentare, cu câte un diapozitiv de la fiecare.</p>
<p>Le înveți aici, apoi le faci cu colegii de bancă, în Google adevărat.</p>
${fig('../m3-l19/img/echipa-laptopuri.webp',800,315,'O masă cu trei laptopuri deschise; doi oameni, văzuți din spate și din profil, lucrează fiecare pe laptopul lui','La o întâlnire de voluntari, fiecare scrie de pe laptopul lui la aceeași enciclopedie, Wikipedia. Fotografie: Avery Jensen, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Art_Students_League_Archive_Edit-a-thon_9483.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> din lecția 18, conectarea în fereastra privată, Drive-ul meu, documentul tău <span class="cod">Nume_Prenume_clasa_colaborare</span> și deconectarea; din clasa a VI-a, prezentarea: diapozitivul, cu titlu și text.</p>`},
  /* ---------- pasul 1: partajarea ---------- */
  {t:'Partajarea: dai acces colegilor',
   text:`<p>A <mark>partaja</mark> înseamnă să dai altor persoane acces la documentul tău. El rămâne al tău: ești <b>Proprietar</b> (Owner).</p>
<p>Sus în dreapta, apeși <b>Permite accesul</b> (Share), scrii adresa colegului de la școală și alegi din listă persoana cu adresa bună. Rolul: <b>Editor</b>. Apoi apeși <b>Trimite</b> (Send).</p>
<p>Regula lecției: acces doar echipei și profesorului. La <b>Acces general</b> (General access) rămâne <b>Restricționat</b> (Restricted), nu „Oricine are linkul” (Anyone with the link).</p>
${ACUM('Fereastra privată, '+C_('drive.google.com')+', conectarea; <b>✕</b> dacă te întreabă de parolă. N-ai cont? Sari peste.','Deschide documentul tău de la lecția 18.',PAUZA)}`,
   exemplu:`<p>Ana apasă Permite accesul, scrie „radu” și vede doi: Radu Ene (${C_(P.radu.adresa)}) și Radu Enescu (${C_(P.radu2.adresa)}). Alege colegul, Radu Ene, ca Editor, și apasă Trimite. Radu primește un e-mail și găsește documentul la Distribuite cu mine.</p>`,
   altfel:`<p>E ca atunci când îi dai unui coleg o cheie de la dulapul echipei. Dulapul rămâne al tău și tu hotărăști cui dai cheie. Nu lași cheia pe hol, pentru oricine o găsește: asta ar fi „Oricine are linkul”.</p>`,
   incearca:E_({q:`Documentul Anei e deschis. Dă-i acces ca Editor lui Radu Ene, colegul ei de echipă; adresa lui, de pe tablă: ${C_(P.radu.adresa)}. La Acces general rămâne Restricționat.`,
     sim:{start:'doc',cont:K.ana,fisiere:FIS_ANA(),deschis:'a-colab'},
     teste:[{c:'partajat',v:{cine:'radu',rol:'editor'}},{c:'doarEchipa',v:['radu']},{c:'restrictionat'}],gresit:{adresa:P.radu2.adresa},
     ajutor:'Permite accesul, sus în dreapta. Scrie „radu” și alege din listă persoana cu adresa de pe tablă (uită-te la adresă, nu doar la nume). Rolul: Editor. Trimite.',
     arata:`Permite accesul; „radu” → Radu Ene (${P.radu.adresa}); rolul Editor; Trimite. Acces general: Restricționat.`,
     why:'Doar Radu are acces, ca Editor: ai ales adresa bună și ai lăsat Restricționat.'}),
   inca:[
    {t:'tf',q:'După ce Ana îi dă acces lui Radu, documentul trece în contul lui Radu și nu mai e al Anei.',ok:false,
     ajutor:'Cine rămâne Proprietar?',
     why:'Fals. Documentul rămâne al Anei: ea e Proprietar. Radu primește doar acces la el, din contul lui.'},
    E_({q:`În clasă sunt două Ioane Rusu. Colega Anei de echipă are adresa ${C_(P.ioana.adresa)}. Dă-i acces ca Editor la documentul Anei.`,
     sim:{start:'doc',cont:K.ana,fisiere:FIS_ANA(),deschis:'a-colab'},
     teste:[{c:'partajat',v:{cine:'ioana',rol:'editor'}},{c:'doarEchipa',v:['ioana']},{c:'restrictionat'}],gresit:{adresa:P.ioana2.adresa},
     ajutor:'Scrie „ioana” și compară adresele din listă cu adresa din exercițiu, semn cu semn.',
     arata:`Permite accesul; „ioana” → Ioana Rusu cu adresa ${P.ioana.adresa}; Editor; Trimite.`,
     why:'Același nume poate avea două adrese. Adresa e cea care spune exact cine primește documentul.'})
   ]},
  /* ---------- pasul 2: rolurile ---------- */
  {t:'Rolurile: Editor, Comentator, Cititor',
   text:`<p>Când dai acces, alegi și <mark>rolul</mark>: ce are voie să facă persoana în document.</p>
<ul><li><b>Editor</b>: scrie și schimbă textul, comentează, poate da acces altora;</li>
<li><b>Comentator</b> (Commenter): citește și comentează; textul nu-l schimbă (ce mai poate, afli la lecția 20);</li>
<li><b>Cititor</b> (Viewer): doar citește.</li></ul>
<p>Colegilor care scriu cu tine: Editor. Profesorului, ca să vă lase observații: Comentator. Rolul se alege din lista de lângă adresă; pentru fiecare rol nou, partajezi încă o dată.</p>
${ACUM('<b>Permite accesul</b>, apoi <b>Gata</b> (Done): fereastra se închide, fără să dai acces cuiva.',PAUZA)}`,
   exemplu:`<p>Ana partajează planul excursiei de trei ori, cu roluri diferite: lui Radu, care scrie cu ea, <b>Editor</b>; profesorului, care lasă observații pe margine, <b>Comentator</b>; Marei, din echipă, bolnavă acasă, care doar citește, <b>Cititor</b>.</p>`,
   altfel:`<p>Gândește-te la caietul de proiect al echipei. Cine scrie în el are pix (Editor). Cine doar lipește bilețele cu sfaturi are bilețele, nu pix (Comentator). Cine doar se uită primește caietul de citit (Cititor).</p>`,
   incearca:E_({q:`Ana dă acces la documentul ei: profesorului (${C_(P.profesor.adresa)}), care vrea să-i lase observații pe margine, fără să-i schimbe textul, și lui Radu Ene (${C_(P.radu.adresa)}), care scrie cu ea. Alege pentru fiecare rolul potrivit.`,
     sim:{start:'doc',cont:K.ana,fisiere:FIS_ANA(),deschis:'a-colab'},
     teste:[{c:'partajat',v:{cine:'profesor',rol:'comentator'}},{c:'partajat',v:{cine:'radu',rol:'editor'}},{c:'doarEchipa',v:['radu','profesor']},{c:'restrictionat'}],gresit:{rol:'editor'},
     ajutor:'Două partajări: întâi profesorul, cu rolul pentru observații pe margine; apoi Radu, cu rolul pentru cine scrie. Rolul îl alegi din lista de lângă adresă, înainte de Trimite.',
     arata:`Permite accesul → ${P.profesor.adresa} → Comentator → Trimite; apoi Permite accesul → Radu Ene → Editor → Trimite.`,
     why:'Profesorul lasă observații fără să schimbe textul, iar Radu scrie: fiecare are cât îi trebuie.'}),
   inca:[
    {t:'classify',q:'Ce rol îi dai fiecăruia?',cats:['Editor','Comentator','Cititor'],
     items:[['Mara scrie cu tine capitolul despre zimbri',0],['Profesorul vrea să-ți lase observații pe margine, fără să-ți schimbe textul',1],['Ioana, din echipă, e plecată la un concurs și vrea doar să citească proiectul',2],['Radu face cu tine partea despre traseu',0]],
     ajutor:'Cine scrie? Cine doar lasă observații? Cine doar citește?',
     why:'Cine scrie are nevoie de Editor. Pentru observații pe margine ajunge Comentator. Pentru citit, Cititor.'},
    {t:'choice',q:'Ai dat acces colegei care îți corectează textul ca Editor, iar ea ți-a schimbat din greșeală o propoziție. Ce rol trebuia să-i dai, ca să-ți arate greșelile fără să-ți schimbe textul?',
     o:['Comentator','Editor','Cititor','Proprietar'],ok:0,
     ajutor:'Care rol lasă comentarii, dar nu schimbă textul?',
     why:'Comentatorul lasă observații pe margine, iar textul rămâne neatins. Cititorul n-ar fi putut nici să comenteze.'}
   ]},
  /* ---------- pasul 3: Distribuite cu mine și lucrul în același timp ---------- */
  {t:'Scrieți în același timp, fiecare în paragraful lui',
   text:`<p>Documentul primit, colegul îl găsește în Drive, în stânga, la <b>Distribuite cu mine</b> (Shared with me).</p>
<p>Când sunteți amândoi în document, sus, lângă Permite accesul, apare cercul lui, cu fotografia sau cu inițiala. În text vezi un <mark>cursor colorat</mark>, cu numele lui: acolo scrie el acum. Ce scrie apare și la tine, pe loc.</p>

/* „Acum la calculatorul din laborator”: Google adevărat, cu conturile școlii, în echipă de 2-3 colegi din bancă; fără profesor.
   Cine nu are cont, nu-și știe parola sau rămâne fără coleg face atelierul și îi spune profesorului la final. */

   (pașii 10-11), fiindcă slide-ul nou e făcut în pagină (pasul 5, Î5) și în browser (Acum de la pasul 5). Pașii 2 și 13 = cuvintele
   lui VII/18 (publicată): fereastra privată sau „filă obișnuită”, verificarea deconectării.
   Trecerea 3 (24.10.2026, judecata 2): rândul de pauză e PRIMUL în pasul 2 (AA), ca să-l citească și cine e deja conectat;
   „Verificați…” stă la capătul pasului 9 (AE); trimiterea din pasul 10 numește pasul lecției (AD). */

const TELEFON=`<details class="tel"><summary>Lucrezi pe telefonul tău?</summary>
<p>Pe telefonul tău nu ai nevoie de fereastra privată (nici de <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>) și nu te deconectezi. Lucrezi în aplicațiile <b>Documente Google</b> și <b>Prezentări Google</b>, cu contul de la școală pus pe telefon. Ghidurile cu poze: <a href="../../../jocuri/ghiduri/#cont-drive">contul de Google pe telefon</a>, <a href="../../../jocuri/ghiduri/#instalare">cum instalezi aplicația</a>, <a href="../../../jocuri/ghiduri/#docs">un document pe telefon</a>, <a href="../../../jocuri/ghiduri/#slides">o prezentare pe telefon</a>.</p>
<p>Documentul primit de la un coleg e, în aplicație, la <b>Accesibile pentru mine</b>. Îl deschizi cu o atingere, apoi atingi <b>Editează</b> (creionul), ca să poți scrie în el. Partajarea, comentariile și slide-ul nou există și în aplicații, dar butoanele arată altfel decât pe calculator. Nu găsești un buton? Faci partea aceea pe calculatorul din laborator sau în atelier.</p>
<p>Telefonul e al altcuiva (al unui coleg, al părinților)? La final scoți contul de pe el. Pe Android: <b>Setări</b>, <b>Parole și conturi</b> (pe unele telefoane, „Utilizatori și conturi” sau „Gestionează conturile”), contul tău, <b>Elimină contul</b>, apoi confirmi (<b>Elimină contul</b> sau <b>Șterge</b>). Pe iPhone, contul nu e în Setări, ci în aplicație: atingi poza de profil, sus în dreapta, apoi <b>Gestionează conturile de pe acest dispozitiv</b> și <b>Elimină de pe acest dispozitiv</b>. Nu găsești sau îți cere codul telefonului? Îl rogi pe cel al cărui e telefonul să te ajute.</p></details>`;

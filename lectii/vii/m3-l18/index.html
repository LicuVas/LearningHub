<style>
:root{

/* banda de sus: cerul cu un nor, iar dedesubt trei foi (trei calculatoare) legate la același nor — doar CSS */
.banda{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:34px;min-height:38px;padding:4px 12px 3px;overflow:hidden;
  background:linear-gradient(180deg,#BFD9F5 0,#E6F1FC 100%)}
.banda .b-nor{position:absolute;left:50%;top:3px;width:46px;height:16px;margin-left:-23px;border-radius:10px;background:#fff;box-shadow:12px -6px 0 -2px #fff,-10px -4px 0 -3px #fff}
.banda .b-foaie{position:relative;width:14px;height:17px;border:1.5px solid #1A5FB4;border-radius:2px;background:#fff}

details.tel{margin:.6em 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
details.tel summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;box-sizing:border-box}
details.tel p{margin:0;padding:0 12px 10px}
details.tel a{display:inline-block;padding:6px 0}
details.tel ol{margin:0;padding:0 12px 8px 32px}

/* 24.10.2026 (dirijorul): legătura „atelierul lecției” din laborator, țintă de atingere ≥ 32 px (ca la VII/19-20) */

<script>
/* ======================================================================================================
   Lecția VII · M3 · nr. 18 — „Ce este o aplicație colaborativă. Accesare și conectare” (VII-U3, CS.1.3).
   Aplicația = Google (Drive, Documente Google), cu contul Google de la școală (decizia dirijorului, 23.10.2026,
   m3_noapte_23_10/prompturi/_noapte.md §1).
   Simulatorul: lectii/_sim/colab-google.js (proprietar: lecția aceasta; îl extind VII/19, VII/20) — tipul colab.
   SIGURANȚA: conturile, adresele, persoanele și fișierele sunt INVENTATE (domeniul .test e rezervat pentru exemple);
   ce tastează elevul nu se salvează și nu pleacă nicăieri (proba: _proba/proba_lectie.py, în surse.md).
   Numele din interfață: pagina publică de conectare + ajutorul Google în română (surse.md); NESIGURE trecute acolo.
   Granița: partajarea, rolurile, comentariile, lucrul în același timp = lecția 19; publicarea, istoricul = 20; etica = 21.
   ====================================================================================================== */
const CONT=['Noțiunea de aplicație colaborativă','Accesare/conectare în aplicația colaborativă'];
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const C_=s=>`<span class="cod">${s}</span>`;
/* reparația J1 (24.10.2026): fiecare bloc spune ce face elevul de pe TELEFON (Izvoare: telefoanele elevilor), iar unde
   elevul rămâne conectat, rândul PAUZA spune ce face dacă sună de pauză (calculatorul e comun) */
const TEL='<b>Pe telefon:</b> sari peste; pașii tăi sunt la laborator.';
const PAUZA='Sună de pauză? Întâi <b>Profil</b> → <b>Deconectează-te</b>.';
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol><p class="acum-tel">${TEL}</p></div>`;
const K=SimColabGoogle.CONTURI;                      // ana, radu, ioana (adresă, nume, parolă inventată)
const D=SimColabGoogle.DOMENIU;                      // scoala-exemplu.test
const NUME_ANA='Pop_Ana_7A_colaborare', NUME_RADU='Ene_Radu_7A_colaborare';
const CP_=o=>Object.assign({t:'colab'},o);
/* reparația 2 (24.10.2026, judecata 2, D — durata): la Încearcă P3, Ana e DEJA conectată (s-a conectat la pasul 2) și
   întrebarea browserului despre parolă e deschisă, ca elevul să nu mai tasteze a doua oară adresa și parola. Extensie a
   LECȚIEI, prin API-ul public (SimColabGoogle.extensie + inst.conecteaza); simulatorul comun rămâne neatins. Testele „bara”
   și „conectat” rămân în listă (bifate de la început), ca „Arată-mi” (reset + soluție) să refacă singur conectarea. */
SimColabGoogle.extensie('vii18-deja-conectat',(inst,O)=>{inst.conecteaza(O.cont.adresa,O.cont.parola)});
/* fișierele lui Radu (contul lui rămas deschis pe calculator, în exercițiul de la pasul 3) */
const FIS_RADU=[{id:'r-tema',titlu:'Tema la istorie - Radu',tip:'doc',loc:'meu',modificat:'13 ian.',text:'Ștefan cel Mare a domnit 47 de ani.'},
  {id:'r-fotbal',titlu:'Echipa de fotbal a clasei',tip:'foaie',loc:'meu',modificat:'10 ian.'}];
const ID_RADU=FIS_RADU.map(f=>f.id);
/* documentul nou al lui Radu, încă fără nume (întrebarea 4) */
const FIS_RADU_NOU=[{id:'r-nou',titlu:'Document fără titlu',tip:'doc',loc:'meu',modificat:'acum',text:'Ce am învățat azi: cum intru în Drive.'}].concat(FIS_RADU);
/* documentul Anei, gata făcut (pasul 5) */
const FIS_ANA_DOC=[{id:'a-colab',titlu:NUME_ANA,tip:'doc',loc:'meu',modificat:'acum',text:'Ana Pop, clasa a VII-a A.\nAzi am învățat să intru în Drive.'}].concat(SimColabGoogle.FISIERE_ANA);

const LECTIA={
 t:'Ce este o aplicație colaborativă. Accesare și conectare',lectii:[18],continuturi:CONT,final:true,
 obiectiv:'știi ce este o aplicație colaborativă și intri în Google Drive cu contul de la școală. Faci un document nou cu numele cerut, îl regăsești și te deconectezi corect.',
 pasi:[
  /* ---------- pasul 0: la ce folosește ---------- */
  {t:'La ce folosește',
   text:`<p>Până acum ai scris documente în Word, pe calculatorul tău. Dar dacă un proiect îl fac patru colegi, fiecare de acasă? Cine are fișierul? Cine scrie ultimul?</p>
<p>Pentru asta există aplicațiile colaborative. Azi afli ce sunt și intri într-una, cu contul de la școală. Faci în ea un document nou și ieși corect de pe calculatorul din laborator.</p>
${fig('../m3-l18/img/scriem-impreuna.webp',800,480,'Oameni la o masă lungă, fiecare cu laptopul lui deschis; un bărbat, cu spatele, scrie un text pe laptop','La o întâlnire de voluntari, fiecare scrie de pe laptopul lui în aceeași enciclopedie, Wikipedia. Aici stau în aceeași sală, dar ar putea lucra la fel de bine din orașe diferite. Fotografie: Davidpar, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Edit-a-thon_in_Cardona_2014_03.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).','mica')}
<p class="nevoie"><b>Ai nevoie de:</b> din clasa a V-a, browserul, fila și bara de adrese; din clasa a VI-a, contul și parola (le reluăm aici pe scurt); din lecția 3, documentul: îl creezi, îi dai nume, îl salvezi.</p>`},
  /* ---------- pasul 1: ce este o aplicație colaborativă ---------- */
  {t:'Un document, mai mulți oameni: aplicația colaborativă',
   text:`<p>O <mark>aplicație colaborativă</mark> este o aplicație în care mai mulți oameni lucrează la același document, fiecare de pe dispozitivul lui. Nu-și trimit copii: toți deschid același document.</p>
<p>Documentul nu stă pe calculatorul tău. Stă pe calculatoarele firmei care face aplicația, legate la internet. Spunem că stă <mark>în cloud</mark> (în engleză, „nor”). De aceea îl deschizi de oriunde: ai nevoie de internet și de contul tău.</p>
<p>Exemple: Documente Google, Prezentări Google, Foi de calcul Google. Și Microsoft are aplicații de acest fel, în Microsoft 365.</p>
${fig('../../../jocuri/colaborare-vii/img/colab-doi.webp',1000,445,'Același document deschis de doi oameni în aplicația CryptPad; în dreapta, lista cu cei doi, iar sub titlu scrie Salvat','Același document, deschis deodată de doi oameni, în CryptPad (altă aplicație colaborativă). Uită-te în dreapta: lista celor doi care lucrează acum în el. Celelalte butoane nu ne trebuie azi.')}`,
   exemplu:`<p>Ana și Radu fac un afiș despre pădure. <b>Fără</b> aplicație colaborativă: Ana scrie în Word și îi trimite fișierul lui Radu, care adaugă ceva și i-l trimite înapoi. Între timp, Ana și-a schimbat copia: două variante.</p><p><b>Cu</b> Documente Google: amândoi deschid același document, din cloud. O singură variantă.</p>`,
   altfel:`<p>Gândește-te la tabla din clasă: toți pot scrie pe ea și toți văd același lucru. Caietul tău îl vezi doar tu. Aplicația colaborativă e ca o tablă comună, la care ajungi prin internet.</p>`,
   incearca:{t:'classify',q:'Ce le trebuie în fiecare situație: o aplicație colaborativă sau un program folosit de unul singur, pe calculatorul lui?',cats:['Aplicație colaborativă','De unul singur'],
     items:[['Patru colegi scriu, fiecare de acasă, un referat despre râul Bistrița',0],['Îți faci pe calculator lista de lucruri pentru excursie, doar pentru tine',1],['Echipa face o prezentare pe care o completează toți, până vineri',0],['Desenezi în Paint o felicitare pentru bunica',1]],
     ajutor:'Întrebarea din pas: lucrează mai mulți oameni la același document?',
     why:'Când mai mulți lucrează la același document, aplicația colaborativă ține o singură variantă, în cloud.'},
   inca:[
    {t:'tf',q:'Ana n-a pregătit nimic dinainte. Pe un calculator fără internet, ea poate deschide afișul din Documente Google.',ok:false,
     ajutor:'Unde stă afișul? Cum ajungi la el?',
     why:'Fals. Afișul stă în cloud, pe calculatoarele firmei, iar la ele ajungi prin internet. Google are și un lucru fără internet (offline), dar el se pornește dinainte, cu internet. Ana n-a făcut asta.'},
    {t:'choice',q:'Ana a început afișul pe calculatorul din laborator, în Documente Google. Seara vrea să-l continue de pe laptopul de acasă. De ce are nevoie?',
     o:['De internet și de contul ei','De un stick pe care a copiat afișul','De același calculator din laborator','De un e-mail de la profesor, cu afișul'],ok:0,
     ajutor:'Unde stă documentul? Ce îți trebuie ca să ajungi la el?',
     why:'Afișul stă în cloud, nu pe calculatorul din laborator. Ajunge la el de pe orice dispozitiv, cu internet și cu contul ei.'}
   ]},
  /* ---------- pasul 2: accesarea și conectarea ---------- */
  {t:'Accesarea și conectarea',
   text:`<p><mark>Accesarea</mark> unei aplicații înseamnă să ajungi la ea. Aplicațiile Google le deschizi în browser. În bara de adrese scrii adresa exact, semn cu semn: ${C_('drive.google.com')} deschide <mark>Google Drive</mark>, locul unde stau documentele tale.</p>
<p>Apare „Conectează-te” (Sign in)? Te <mark>conectezi</mark> cu contul de la școală: adresa de e-mail, <b>Înainte</b> (Next), parola, <b>Înainte</b>. Ai uitat parola? Nu-ți faci cont nou: îi spui profesorului.</p>
${ACUM(`Filă nouă (<b>+</b>), ${C_('drive.google.com')}, <kbd>Enter</kbd>. Vezi „Conectează-te” sau o listă de conturi? Nu alegi nimic; închizi fila (<b>×</b>).`,'Vezi Drive-ul cuiva? Nu te uiți: Profil (cerculețul din dreapta sus), <b>Deconectează-te</b>, închizi fila.')}`,
   exemplu:`<p>Radu scrie ${C_('drive.google.com')} și apasă <kbd>Enter</kbd>. Apare „Conectează-te”, cu „Accesează Google Drive” dedesubt. Scrie ${C_(K.radu.adresa)}, apasă Înainte, apoi parola și Înainte. Greșește o literă din parolă: o scrie din nou, atent. Acum vede Drive-ul lui. Dacă ar fi uitat parola, profesorul sau administratorul conturilor școlii i-ar fi dat una nouă.</p>`,
   altfel:`<p>E ca la intrarea în biblioteca școlii: întâi spui cine ești (adresa), apoi arăți permisul, pe care îl ai doar tu (parola). Ți-ai pierdut permisul? Nu-ți faci singur altul: îi spui bibliotecarei, iar școala îți dă unul nou.</p>`,
   incearca:CP_({q:`Intră în Drive cu contul inventat al Anei. Adresa: ${C_(K.ana.adresa)}. Parola (inventată): ${C_(K.ana.parola)}. Pornești de la o filă nouă.`,
     sim:{start:'fila',cont:K.ana},
     teste:[{c:'bara',ce:'Drive deschis din bara de adrese'},{c:'conectat',v:'Anei',ce:'Ai intrat în contul Anei'}],gresit:{adresa:K.ana.adresa.replace('.',' ')},
     ajutor:'Sus, în bara de adrese: drive.google.com și Enter. Apoi adresa Anei, Înainte, parola, Înainte. Copiază-le semn cu semn.',
     arata:'bara de adrese: drive.google.com și Enter; adresa Anei, Înainte; parola, Înainte.',
     why:'Ai ajuns în Drive: adresa aplicației, apoi contul. La fel intri și cu contul tău.'}),
   inca:[
    {t:'choice',q:`Profesorul a scris pe tablă adresa ${C_('drive.google.com')}. Care adresă e scrisă exact ca a lui?`,
     o:['drive.google.com','drive.gogle.com','drive-google.com','drive.google.co'],ok:0,
     ajutor:'Compară semn cu semn: litere, puncte, liniuțe, sfârșitul.',
     why:'Doar prima are toate semnele la fel. O literă lipsă, o liniuță în loc de punct sau un sfârșit tăiat te duc în altă parte, nu în Drive.'},
    {t:'choice',q:'Mara apasă Înainte după parolă, dar nu intră: a uitat parola contului de la școală. Ce e bine să facă?',
     o:['Îi spune profesorului, ca să primească o parolă nouă','Apasă „Creează un cont” și își face alt cont','Intră azi în contul colegei de bancă','Încearcă parole până nimerește'],ok:0,
     ajutor:'Ultimul paragraf al pasului.',
     why:'La contul de la școală, parola nouă o dă profesorul sau administratorul conturilor. Un cont nou sau contul altcuiva nu-i aduce documentele ei.'}
   ]},
  /* ---------- pasul 3: pe calculatorul comun ---------- */
  {t:'Pe calculatorul comun: contul tău rămâne doar al tău',
   text:`<p>În laborator, trei obiceiuri țin contul tău doar al tău:</p>
<ul><li>lucrezi într-o <mark>fereastră privată</mark>: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> (Chrome: „incognito”; Edge: „InPrivate”);</li>
<li>nu salvezi parola: dacă browserul te întreabă, apeși <b>✕</b>;</li>
<li>la final te <mark>deconectezi</mark>: <b>Profil</b>, <b>Deconectează-te</b> (Sign out). Închiderea unei file nu te deconectează: contul rămâne deschis în celelalte file. Apoi închizi fereastra privată.</li></ul>
${ACUM('<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> (nu merge? filă nouă, <b>+</b>). Fereastra privată acoperă lecția: revii la lecție din bara de activități.',C_('drive.google.com')+', conectarea; <b>✕</b> dacă te întreabă de parolă. Rămâi conectat: pasul 4 continuă. N-ai cont? Sari peste.',PAUZA)}`,
   exemplu:`<p>Ana apasă <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>. Pe pagina de conectare scrie „…folosește modul pentru invitați”? E tot o fereastră care nu păstrează nimic, ca a ei. Se conectează și apasă ✕ când browserul o întreabă de parolă. La sfârșitul orei: Profil, Deconectează-te, deși apoi închide fereastra: poate a rămas deschisă și alta, cu contul în ea. Verifică: ${C_('drive.google.com')} cere iar conectarea. Apoi închide fereastra privată.</p>`,
   altfel:`<p>Fereastra privată e ca o foaie de ciornă pe care o arunci la plecare: documentul tău nu e pe ea, e în Drive. Deconectarea e ca atunci când încui dulăpiorul de la sala de sport și iei cheia cu tine.</p>`,
   incearca:CP_({q:'Ana s-a conectat la Drive într-o fereastră privată, ca la pasul 2, iar browserul o întreabă de parolă. Nu salva parola, apoi deconectează-te și închide fereastra privată.',
     sim:{start:'fila',cont:K.ana,fereastra:'privata',intreabaParola:true,extensii:['vii18-deja-conectat']},
     teste:[{c:'bara',ce:'Drive deschis, ca la pasul 2'},{c:'conectat',v:'Anei',ce:'Ana e în cont, ca la pasul 2'},{c:'nesalvata',ce:'N-ai salvat parola (✕ la întrebare)'},{c:'iesit',ce:'Te-ai deconectat (Profil, Deconectează-te)'},{c:'fereastra',ce:'Ai închis fereastra privată (✕)'}],gresit:{salveaza:true},
     ajutor:'✕ la întrebarea browserului; Profil (cerculețul din dreapta sus), Deconectează-te; ✕-ul ferestrei private (sus, pe fâșia închisă la culoare).',
     arata:'✕ la întrebarea browserului despre parolă; Profil → Deconectează-te; ✕ pe fereastra privată.',
     why:'Parola n-a rămas în browser, iar contul e închis: următorul elev nu poate intra în contul Anei.'}),
   inca:[
    CP_({q:'Te așezi la calculator și vezi că a rămas deschis Drive-ul lui Radu, un coleg de la ora trecută. Fă ce scrie în pas, fără să te uiți în documentele lui.',
     sim:{start:'drive',cont:K.ana,contDeschis:{nume:K.radu.nume,adresa:K.radu.adresa},fisiereContDeschis:FIS_RADU},
     teste:[{c:'necitit',v:ID_RADU,d:'al lui Radu'},{c:'iesit',d:'Ai închis contul lui Radu (Profil, apoi Deconectează-te)'}],gresit:{deschide:'r-tema',sari:'iesit'},
     ajutor:'Nu deschizi niciun fișier. Apeși cerculețul din dreapta sus (Profil), apoi Deconectează-te.',
     arata:'fără să deschizi vreun fișier: Profil, apoi Deconectează-te.',
     why:'Contul lui Radu e închis și n-ai citit nimic din el: așa ai vrea să facă și colegii cu contul tău.'}),
    {t:'classify',q:'Pe calculatorul din laborator: e bine sau e o greșeală?',cats:['E bine','Greșeală'],

  `Ai nevoie de adresa și parola contului de la școală. Nu le știi sau n-ai cont? Nu încerca la întâmplare și nu-ți face cont: faci ${ATELIER} și, la final, îi spui profesorului. Drive-ul e în engleză? Numele sunt cele din paranteze.`,
  'Deschide o fereastră privată: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> (Chrome: incognito; Edge: InPrivate). Ea acoperă lecția: la lecție treci din bara de activități, jos, și tot de acolo revii. Nu se deschide? Lucrezi într-o filă nouă (<b>+</b>); la pasul 13 urmezi drumul „filă obișnuită”.',
  `În bara de adrese scrie ${C_('drive.google.com')} și apasă <kbd>Enter</kbd>. Se deschide direct Drive-ul cuiva? Nu te uiți la fișiere: Profil (cerculețul din dreapta sus), apoi <b>Deconectează-te</b> (Sign out).`,
  `Pe pagina „Conectează-te” (Sign in): adresa ta de la școală, semn cu semn, <b>Înainte</b> (Next); parola, <b>Înainte</b>. Apare o listă cu conturi? Nu alegi contul altcuiva: alegi rândul pentru alt cont și scrii adresa ta. Parola greșită? Mai scrie-o o dată, atent. Nici a doua oară? Nu apăsa „Creează un cont” (Create account): închizi fereastra privată (într-o filă obișnuită: doar fila, cu <b>×</b>), faci ${ATELIER} și îi spui profesorului. Ai intrat? Dacă sună de pauză, mergi direct la pasul 12.`,
  'Browserul te întreabă dacă salvează parola (sau altceva despre cont)? Refuzi: <b>✕</b>, „Nu acum” sau „Niciodată”, nu <b>Salvează</b> (Save). Nu te întreabă nimic? Treci mai departe. Ai apăsat din greșeală? La final îi spui profesorului: el șterge parola din browser.',
  'Apare o fereastră pe care n-o știi (condiții, numărul de telefon)? Nu apeși la întâmplare: ridici mâna și îl aștepți pe profesor. Nu apare? Treci mai departe.',
  `Ai făcut documentul la pasul 4 al lecției? <b>Drive-ul meu</b> (My Drive), apoi dublu clic pe el. Nu l-ai făcut? <b>Nou</b> (New), <b>Documente Google</b> (Google Docs); dacă apare alături o listă mică, alegi documentul gol (Blank document). Clic pe „Document fără titlu”, numele tău după modelul ${C_(NUME_ANA)}, <kbd>Enter</kbd>.`,
  'Scrie două rânduri: pe primul, numele tău și clasa; pe al doilea, într-o propoziție, ce ai învățat azi. Ai scris primul rând la pasul 4? Adaugi doar al doilea.',
  'Lângă numele documentului: „Se salvează…” (Saving…), apoi norul cu bifă. Ține mouse-ul pe nor: „Salvat în Drive” (Saved to Drive). Nu e nevoie de <kbd>Ctrl</kbd>+<kbd>S</kbd>.',
  `Dacă mai ai timp: închide fila documentului cu <b>×</b> de pe ea (nu fereastra). Documentul s-a deschis în aceeași filă cu Drive-ul (ai o singură filă)? N-o închide: scrie în bara de adrese ${C_('drive.google.com')} și <kbd>Enter</kbd>. În Drive apasă <b>Drive-ul meu</b> (My Drive) și deschide documentul cu dublu clic: cele două rânduri sunt acolo. Apoi închide fila lui.`,
  'Dacă mai ai timp, drumul prin grilă: în Drive, apasă pătratul din 9 puncte, sus în dreapta (Google apps), apoi <b>Documente</b> (Docs). Nu vezi Documente? Derulează în grilă; tot nu apare? Sari peste acest pas. Documentul tău e și acolo, în listă: nu-l deschide acum. Documente s-a deschis într-o filă nouă? Închide-o cu <b>×</b>. S-a deschis în aceeași filă? Rămâi în ea: pasul următor merge și de aici.',

  `Verifici: din nou ${C_('drive.google.com')}, <kbd>Enter</kbd>. Trebuie să apară „Conectează-te” sau o listă cu contul tău deconectat, nu fișierele tale. Ai lucrat în fereastra privată? Închide-o cu <b>✕</b> din colțul ei (nu fereastra lecției): pe calculator n-a rămas nimic de-al tău, iar documentul e în Drive. Ai lucrat într-o filă obișnuită? Închizi doar filele tale, cu <b>×</b>, și îi spui profesorului: în browser pot rămâne istoricul și adresa ta. Apoi, pe lecție, apasă <b>La verificare →</b>.`

/* Telefonul elevului (Izvoare / Dumbrava: telefoanele elevilor). Reparația J1 (24.10.2026): pașii NU sunt „aceiași” ca la
   calculator. Android = ghidul de pe sit (jocuri/_ghiduri/docs, capturi reale pe Android 14 emulat, în română, 22.09.2026:
   „Document nou”, „Mai multe”, „Redenumește documentul”, OK, „Gata”, „Modificări salvate”, „Înapoi”) + ajutorul Google RO
   docs/answer/49114 (Android: „În dreapta jos, atinge Creează”; iPhone: numele se scrie la creare). Scoaterea contului =
   ajutorul Google RO android/answer/7664951 („Parole și conturi” sau, după telefon, „Utilizatori și conturi”, „Gestionează
   conturile”; contul → „Elimină contul”, confirmi „Elimină contul”). Ce n-a fost văzut pe un telefon real e spus prudent.
   Reparația 2 (24.10.2026, judecata 2): Z — documentul deschis din listă se citește, nu se scrie: „Atinge Editează” (ajutorul
   Google RO docs/answer/7068618, Android și iOS); AA — pașii din Setări sunt doar pentru Android (confirmarea: „Elimină contul”
   sau „Șterge”, 7664951 RO); pe iPhone contul Google se scoate din aplicație, nu din Setări: Profil → „Gestionează conturile de
   pe acest dispozitiv” → „Elimină de pe acest dispozitiv” (ajutorul Gmail RO mail/answer/8154, iPhone; Drive EN 2424384, iPhone). */
const TELEFON=`<details class="tel"><summary>Lucrezi pe telefonul tău?</summary>
<p>Pe telefonul tău nu ai nevoie de fereastra privată (nici de <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>) și nu te deconectezi. Lucrezi în aplicația <b>Documente Google</b>, cu contul de la școală pus pe telefon. Ghidurile cu poze: <a href="../../../jocuri/ghiduri/#cont-drive">contul de Google pe telefon</a>, <a href="../../../jocuri/ghiduri/#instalare">cum instalezi aplicația</a>, <a href="../../../jocuri/ghiduri/#docs">un document pe telefon</a>.</p>
<p>Aplicația nu arată ca Drive-ul de pe calculator. Pe Android faci așa:</p>
<ol><li>Deschizi aplicația <b>Documente Google</b>. Ai făcut documentul la calculator, cu același cont? Îl cauți în listă, îl deschizi cu o atingere, atingi <b>Editează</b> (creionul) și adaugi al doilea rând; apoi faci doar ultimii doi pași de aici.</li>
<li>Nu l-ai făcut? Atingi <b>+</b> (Creează), jos în dreapta, apoi <b>Document nou</b>, și scrii cele două rânduri.</li>
<li>Numele: atingi cele trei puncte (Mai multe), sus în dreapta, apoi numele documentului, sus în listă. Scrii numele tău după modelul ${C_(NUME_ANA)} și atingi <b>OK</b>.</li>
<li>Atingi bifa (Gata), sus în stânga. Sub nume scrie „Modificări salvate” (All changes saved): asta e salvarea ta. Norul cu „Salvat în Drive” e doar pe calculator.</li>
<li>Atingi săgeata Înapoi: documentul e în listă, cu numele tău.</li></ol>
<p>Pe iPhone, butoanele pot sta în alt loc, iar numele îl scrii chiar când creezi documentul.</p>
<p>Telefonul e al altcuiva (al unui coleg, al părinților)? La final scoți contul de pe el. Pe Android: <b>Setări</b>, <b>Parole și conturi</b> (pe unele telefoane, „Utilizatori și conturi” sau „Gestionează conturile”), contul tău, <b>Elimină contul</b>, apoi confirmi (<b>Elimină contul</b> sau <b>Șterge</b>). Pe iPhone, contul nu e în Setări, ci în aplicație: atingi poza de profil, sus în dreapta, apoi <b>Gestionează conturile de pe acest dispozitiv</b> și <b>Elimină de pe acest dispozitiv</b>. Nu găsești sau îți cere codul telefonului? Îl rogi pe cel al cărui e telefonul să te ajute.</p></details>`;

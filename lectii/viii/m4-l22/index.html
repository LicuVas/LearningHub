<style>
:root{
  --desk:#EEF0EB; --paper:#FFFFFF; --paper2:#F2F4EF; --line:#CDD5CB;
  --ink:#1A211C; --ink2:#4D5A51; --accent:#1F6448; --accentInk:#FFFFFF; --sel:#D4EADF;
  --mark:#FFE08A; --markInk:#1A211C; --ok:#1E6B3A; --okbg:#E1F1E6; --bad:#A8322A; --badbg:#F8E2DF;
  --fd:"Fraunces",Georgia,serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"Martian Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101512; --paper:#18201B; --paper2:#1F2922; --line:#36463B;
  --ink:#E7EFE9; --ink2:#AEBDB3; --accent:#63CC9F; --accentInk:#0E1411; --sel:#1F3A31;
  --mark:#EBCB55; --markInk:#17201B; --ok:#62C98A; --okbg:#16301F; --bad:#FF8A7F; --badbg:#3C201D;
}}
:root[data-theme="dark"]{
  --desk:#101512; --paper:#18201B; --paper2:#1F2922; --line:#36463B;
  --ink:#E7EFE9; --ink2:#AEBDB3; --accent:#63CC9F; --accentInk:#0E1411; --sel:#1F3A31;
  --mark:#EBCB55; --markInk:#17201B; --ok:#62C98A; --okbg:#16301F; --bad:#FF8A7F; --badbg:#3C201D;
}
/* tema: fâșia de sus e tabela de scor a probei — părțile, oficiul, totalul și nota (ca la lecția 13) */
.banda{display:flex;flex-wrap:wrap;gap:0;font-family:var(--fm);font-size:.72rem;color:var(--ink2);border-bottom:1px dashed var(--line)}
.banda span{padding:2px 8px;border-left:1px dashed var(--line);white-space:nowrap}
.banda span:first-child{border-left:0}
.banda b{color:var(--accent)}
h1,h2{letter-spacing:-.01em}
pre.rand{font-family:var(--fm);font-size:.8rem;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:.4em 0;white-space:pre;overflow-x:auto;tab-size:8;-moz-tab-size:8;line-height:1.4}
.pasi-met{margin:.3em 0 .6em 1.2em;padding:0}
.pasi-met li{margin:.3em 0}
.niv{display:inline-block;font-size:.78rem;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);color:var(--ink2);margin-right:4px}
.niv.b{border-color:var(--accent)}
.niv.a{border-color:var(--accent);background:var(--sel);color:var(--ink)}
.parti{margin:.3em 0 .5em;padding:0;list-style:none}
.parti li{margin:.3em 0}
ol.lista-v{margin:.4em 0 .6em;padding-left:1.6em}
ol.lista-v li{margin:.15em 0}
details.verif,details.rezerva{margin:.5em 0;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--paper2)}
details.verif summary,details.rezerva summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
details.verif[open],details.rezerva[open]{padding-bottom:8px}
/* regula 20: legăturile din sursa fotografiei și din „unde ai pierdut puncte” au zonă de atins de 32 px */
.captura figcaption a{display:inline-block;padding:6px 0}
/* reparația după judecata 1 (m3): legătura de descărcare din laborator avea 22-24 px înălțime → zonă de atins ≥ 32 px */
a.descarca{display:inline-block;padding:6px 0}
/* drumul de rezervă al laboratorului (M4): pagina de pornire într-o casetă din care o copiezi (clic, Ctrl+A, Ctrl+C) */
textarea.cod-copiat{display:block;width:100%;box-sizing:border-box;margin:.4em 0;font-family:var(--fm);font-size:.78rem;line-height:1.4;tab-size:8;-moz-tab-size:8;white-space:pre;overflow:auto;background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical}
#body .ew .lv .br-corp{min-height:15em}
@media (max-width:480px){pre.rand,textarea.cod-copiat{tab-size:2;-moz-tab-size:2;font-size:.66rem;padding:6px}}   /* pe telefon Tab-ul se arată îngust și litera mai mică, ca rândurile laboratorului să încapă la 390 px (ca la VIII/16, VIII/21) */
</style>

<body>

<!-- simulatorul „Notepad + browser” (proprietar: lecția VIII/14) + extensiile lecțiilor 15 (scheletul), 16 (fișierele-imagine),
     17 (listele, doar citire), 20 (datele care nu se publică), 19 (stilurile citite de browser), 21 (cerințele proiectului,
     doar citire), toate NEATINSE, și extensia NOUĂ a lecției 22: proba de antrenament cu punctaj (editorweb-proba.js).
     editorweb-legaturi.js (VIII/18) NU e încărcat: cu editorweb-continut.js rescriu amândouă desenul browserului (capul lui),
     deci legăturile nu se apasă în pagină, iar testul citește numele din href (ca la VIII/21). -->
<script src="../../_sim/editorweb.js"></script>
<script src="../../_sim/editorweb-schelet.js"></script>
<script src="../../_sim/editorweb-continut.js"></script>
<script src="../../_sim/editorweb-tabele.js"></script>
<script src="../../_sim/editorweb-verificare.js"></script>

<script>
/* Lecția 22, clasa a VIII-a (M4): „Evaluare sumativă: pagini web” (tip: evaluare sumativă). NU se predă nimic nou: ce se cere
   la proba practică (activitatea profesorului, data/activitati_lectii_VII_VIII.json), cum se socotește nota, ce se verifică
   la fiecare parte, o probă de antrenament CU PUNCTAJ (atelierul) și o pagină după cerințe în Notepad-ul real (laboratorul).
   Notarea: Info_Gimnaziu_2026\SISTEM_EVALUARE.md + _campaign\notare_punctaj_2026_09_29\REGULA_NOUA.md (C = De bază 40,
   B = Consolidat 30, A = Avansat 20, 10 din oficiu; nota = punctaj : 10; nivelul se citește din notă). Testul profesorului
   pentru unitatea VIII-U2 NU există în Info_Gimnaziu_2026: pagina nu-l copiază și nu-l inventează (surse.md, „Pentru profesor”).
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. */
/* conținuturile programei (OMEN 3393/2017), textul exact din curriculum.json, ca la lecțiile 14-21 (ţ cu sedilă în „interfaţă”,
   cum e în programă: aceleași șiruri ca în paginile lecțiilor 14 și 15) */
const P={interfata:'Elemente de interfaţă ale unui editor de pagini web',instrumente:'Instrumente de bază ale editorului de pagini web',
  structura:'Elemente de structură ale unei pagini web: antet, titlu, corp',
  editare:'Operații de editare a elementelor de conținut (paragraf, imagini, tabele, liste, legături): inserare, ștergere, mutare, copiere',
  formatare:'Operații de formatare la nivel de text, paragraf, fundal',securitate:'Securitate cibernetică'};

const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const J=a=>a.join('\n');
const PRE=s=>`<pre class="rand">${X(s)}</pre>`;
const ES=window.EditorWebSchelet, EWC=window.EditorWebContinut, EWT=window.EditorWebTabele, EV=window.EditorWebVerificare,
  EWS=window.EditorWebStil, PR=window.EditorWebProiect, EWP=window.EditorWebProba;
EWC.inregistreaza('bucura',window.IMAGINI_L22.bucura);
const LV=S=>S.live.text;
/* eticheta părții (literele oficiale ale nivelurilor) și a nivelului întrebării, ca la lecția 13 */
const PARTE={C:'<span class="niv">C · De bază</span>',B:'<span class="niv b">B · Consolidat</span>',A:'<span class="niv a">A · Avansat</span>'};
const NIV={C:'<span class="niv">De bază</span>',B:'<span class="niv b">Consolidat</span>',A:'<span class="niv a">Avansat</span>'};
/* trimiterea la pasul unei lecții publicate: legătură de citit (?vezi=pK; P1 = „La ce folosește”), titlul EXACT al pasului */
const L=(n,titlu,k)=>`<a href="../${n<=15?'m2':'m3'}-l${n}/?vezi=p${k}" target="_blank" rel="noopener">lecția ${n}, pasul „${X(titlu)}”</a>`;
const L1=(titlu,k)=>`<a href="../m1-l01/?vezi=p${k}" target="_blank" rel="noopener">lecția 1, pasul „${X(titlu)}”</a>`;

/* paginile exercițiilor, scrise ca în lecțiile 15-21 (scheletul, Tab-urile, imaginea cu alt pe rândul următor) */
const DT='<!DOCTYPE html>', HL='<html lang="ro">', H='\t\t', R3='\t\t\t';
const SCH=(titlu,corp,bodyStil)=>J([DT,HL,'\t<head>','\t\t<meta charset="utf-8">',...(titlu==null?[]:['\t\t<title>'+titlu+'</title>']),'\t</head>','\t<body'+(bodyStil?' style="'+bodyStil+'"':'')+'>',...corp,'\t</body>','</html>']);
const IA=(src,alt)=>alt==null?[H+'<img src="'+src+'">']:[H+'<img src="'+src+'"',R3+'alt="'+alt+'">'];
const A3=(href,...text)=>[H+'<p><a',R3+'href="'+href+'">',...text.map((t,i)=>R3+t+(i===text.length-1?'</a></p>':''))];
const LI=(tip,items)=>[H+'<'+tip+'>',...items.map(x=>R3+'<li>'+x+'</li>'),H+'</'+tip+'>'];
const P_=t=>H+'<p>'+t+'</p>';
const H1=(t,st)=>H+'<h1'+(st?' style="'+st+'"':'')+'>'+t+'</h1>';
const SURSA='Foto: Gugalcrom123, CC0', ALT='Lacul Bucura, între munți';
const FOTO={n:'bucura.jpg',imagine:'bucura'};
const IMG_URI={'bucura.jpg':window.IMAGINI_L22.bucura.uri};
const pag=t=>({n:t[0],t:SCH(t[1],[H1(t[1]),P_(t[2])]).replace(/\n/g,'\r\n')+'\r\n'});   // o pagină din dosar, ca de Notepad

/* textul comparat ca un om: fără diacritice, fără litere mari, fără semne de punctuație și spații în plus (regula 23) */
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[„”"'.,!?:;]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
/* corpul paginii citit ca de browser, DOAR din ce e scris între <body> și </body> (ca la lecțiile 16, 18, 21) */
const CORP=s=>{const b=ES.corp(s);return b==null?null:new DOMParser().parseFromString('<body>'+b+'</body>','text/html').body};
const texte=(s,sel)=>{const d=CORP(s);return d?[...d.querySelectorAll(sel)].map(e=>e.textContent):[]};

const CLUB='Clubul de drumeții', MERGEM='Mergem pe munte o dată pe lună.', ALT2='Lacul Bucura';
const PASI_INSCRIERE=['Citești regulile.','Întrebi părinții.','Te înscrii.'];
const NAVY='color: navy; text-align: center;', FUNDAL='background-color: lightyellow;';
const DOSAR_A=[Object.assign({},FOTO),pag(['program.html','Programul drumețiilor','Plecăm sâmbăta, la ora 8.']),pag(['reguli.html','Regulile clubului','Mergem doar cu grupul.'])];
const CORP_A=href=>[H1(CLUB,NAVY),P_(MERGEM),...IA('bucura.jpg',null),P_(SURSA),...A3('program.html','Programul drumețiilor'),...A3(href,'Regulile clubului')];
const CERC='Cercul de fotografie', JOIA='Ne întâlnim joia, după ore.';

const COD={
  /* P3 „Uite cum”: modelul și pagina lui (cercul de fotografie, inventat) */
  p3_model:J(['<img src="bucura.jpg"','\talt="'+ALT+'">','<p>'+SURSA+'</p>']),
  p3_pagina:SCH(CERC,[H1(CERC),P_('Fotografia lunii:'),...IA('bucura.jpg',ALT),P_(SURSA)]),
  /* P3 „Încearcă” (reparația după judecata 1, M3): rândul cu <title> fără </title> → pagina goală; elevul îl închide
     (înainte: scria tot rândul, la fel ca la C1, imediat după) */
  p3_rez:SCH('Cercul de șah',[H1('Cercul de șah'),P_('Ne întâlnim marțea, după ore.')]),
  /* P4 „Uite cum”: cerința „programul cercului: ziua și ora” → un tabel cu capul lui */
  p4_tabel:J(['<table>','\t<tr><th>Ziua</th><th>Ora</th></tr>','\t<tr><td>Marți</td><td>14:00</td></tr>','\t<tr><td>Joi</td><td>15:00</td></tr>','</table>']),
  p4_pagina:SCH('Cercul de șah',[H1('Cercul de șah'),H+'<table>',R3+'<tr><th>Ziua</th><th>Ora</th></tr>',R3+'<tr><td>Marți</td><td>14:00</td></tr>',R3+'<tr><td>Joi</td><td>15:00</td></tr>',H+'</table>']),
  /* P4 „Încearcă”: paragraful roșu, la mijloc — fără model */
  p4_start:SCH('Excursia de toamnă',[H1('Excursia de toamnă'),P_('Atenție: plecăm la ora 7!')]),
  p4_rez:SCH('Excursia de toamnă',[H1('Excursia de toamnă'),H+'<p style="color: red; text-align: center;">Atenție: plecăm la ora 7!</p>']),
  p4_gresit:SCH('Excursia de toamnă',[H1('Excursia de toamnă'),H+'<p style="color: red;">Atenție: plecăm la ora 7!</p>']),
  /* P5 „Uite cum”: fotografia cu numele greșit în src (în dosar e bucura.jpg) → pictograma și textul din alt */
  p5_pagina:SCH(CERC,[H1(CERC),...IA('bucura.png',ALT),P_(SURSA)]),
  /* P5 „Încearcă”: legătura cu un dosar în față */
  p5_start:SCH(CERC,[H1(CERC),P_('Fotografiile noastre:'),...A3('Documente/galerie.html','Galeria cercului')]),
  p5_rez:SCH(CERC,[H1(CERC),P_('Fotografiile noastre:'),...A3('galerie.html','Galeria cercului')]),
  p5_gresit:SCH(CERC,[H1(CERC),P_('Fotografiile noastre:'),...A3('galerie','Galeria cercului')]),
  /* PROBA (atelierul): pagina Clubului de drumeții (inventat) */
  c1_start:SCH(null,[]),
  c1_rez:SCH(CLUB,[H1(CLUB)]),
  c1_gresit:SCH(null,[H+'<title>'+CLUB+'</title>',H1(CLUB)]),
  c2_model:J(['<img src="cabana.jpg"','\talt="Cabana de lemn">','<p>Foto: Clubul de drumeții, CC BY 4.0</p>']),
  /* C2 (reparația după judecata 1, M3): sursa e deja pe pagină; elevul pune fotografia, cu alt, deasupra ei */
  c2_start:SCH(CLUB,[H1(CLUB),P_(MERGEM),P_(SURSA)]),
  c2_rez:SCH(CLUB,[H1(CLUB),P_(MERGEM),...IA('bucura.jpg',ALT2),P_(SURSA)]),
  c2_gresit:SCH(CLUB,[H1(CLUB),P_(MERGEM),...IA('bucura.png','bucura.jpg'),P_(SURSA)]),
  b1_start:SCH(CLUB,[H1(CLUB),P_(MERGEM),P_('Cum te înscrii:'),...PASI_INSCRIERE.map(P_)]),
  b1_rez:SCH(CLUB,[H1(CLUB),P_(MERGEM),P_('Cum te înscrii:'),...LI('ol',PASI_INSCRIERE)]),
  b1_gresit:SCH(CLUB,[H1(CLUB),P_(MERGEM),P_('Cum te înscrii:'),...LI('ul',PASI_INSCRIERE)]),
  b2_start:SCH(CLUB,[H1(CLUB),P_(MERGEM),P_('Cum te înscrii:'),...LI('ol',PASI_INSCRIERE)]),
  /* B2 (reparația după judecata 1, M3): titlul bleumarin + fundalul paginii; „la mijloc” rămâne la laborator și la pasul 3 */
  b2_rez:SCH(CLUB,[H1(CLUB,'color: navy;'),P_(MERGEM),P_('Cum te înscrii:'),...LI('ol',PASI_INSCRIERE)],FUNDAL),
  b2_gresit:SCH(CLUB,[H1(CLUB,'color: navy;'),H+'<p style="'+FUNDAL+'">'+MERGEM+'</p>',P_('Cum te înscrii:'),...LI('ol',PASI_INSCRIERE)]),
  a1_start:SCH(CLUB,CORP_A('Regulile.html'),FUNDAL),
  /* textul alternativ al rezolvării: două cuvinte, ca la C2 (ALT2) — un răspuns bun tipic; testul primește orice text bun */
  a1_rez:SCH(CLUB,CORP_A('reguli.html'),FUNDAL).replace('<img src="bucura.jpg">','<img src="bucura.jpg"\n'+R3+'alt="'+ALT2+'">'),
  a1_gresit:SCH(CLUB,CORP_A('Regulile.html'),FUNDAL).replace('<img src="bucura.jpg">','<img src="bucura.jpg"\n'+R3+'alt="'+ALT2+'">'),
  /* întrebările (Î2 e alegere de la reparația după judecata 1, M3: fundalul se scrie în probă, la B2) */
  q3_start:SCH('Cercul de robotică',[H1('Cercul de robotică'),P_('Construim un robot care urmează o linie.'),...A3('Documente\\orar.html','Orarul cercului')]),
  q3_rez:SCH('Cercul de robotică',[H1('Cercul de robotică'),P_('Construim un robot care urmează o linie.'),...A3('orar.html','Orarul cercului')]),
  q3_gresit:SCH('Cercul de robotică',[H1('Cercul de robotică'),P_('Construim un robot care urmează o linie.'),...A3('orar','Orarul cercului')]),
  /* laboratorul: pagina de pornire (descărcarea; fișierul pagina_de_pornire_l22.html e EXACT textul acesta, cu CRLF, ca de
     Notepad: îl scrie _proba/proba_laborator_l22.py) și rândurile pe care le scrie elevul.
     Trecerea după judecata 2 (T, decizia dirijorului): pornirea NU mai are rândul sursei; elevul îl scrie la pasul C, în Notepad */
  lab_pornire:SCH(null,[H1(CERC),P_(JOIA),...IA('bucura.jpg',null)]),
  lab_title:'\t\t<title>'+CERC+'</title>',
  lab_img:J(['\t\t<img src="Popescu_Ana_bucura.jpg"','\t\t\talt="'+ALT2+'">']),
  lab_sursa:P_(SURSA),
  lab_h1:'<h1 style="color: navy; text-align: center;">',
  lab_body:'<body style="background-color: lightyellow;">',
  /* pagina elevului la sfârșitul laboratorului (proba ei în Chromium: _proba/proba_laborator_l22.py) */
  lab_final:SCH(CERC,[H1(CERC,NAVY),P_(JOIA),...IA('Popescu_Ana_bucura.jpg',ALT2),P_(SURSA)])
};
COD.p3_start=COD.p3_rez.replace('</title>','');
COD.p3_gresit=COD.p3_rez.replace('</title>','<title>');
window.COD_L22=COD;

/* testul cu mesaj calculat la verificare (ca T() din VIII/21); `extra` = puncte, lectia, ceInainte (pentru proba) */
const T=(ce,fn,msg,extra)=>{let d='';const o=Object.assign({ce,fn(S,U){const ok=!!fn(S,U);d=ok?'':(msg(S,U)||'');return ok}},extra||{});Object.defineProperty(o,'msg',{enumerable:true,get(){return d}});return o};
/* scheletul întreg: bifă fără puncte (pază), la fiecare exercițiu. ES.ordine verifică și că fiecare etichetă e închisă
   (EditorWebUtil.corecteaza), deci o etichetă neînchisă o face roșie: în probă rămâne bifă FĂRĂ puncte luate, ca o scăpare
   (de ex. </li> lipsă, deja socotit la B1) să nu fie pedepsită de două ori (ghidul IV.2 §7). */
/* trecerea după judecata 2 (T, timpul): eticheta bifei, mai scurtă (apare la 8 exerciții); verificarea și mesajul, neschimbate */
const ORD={ce:'Scheletul întreg, etichetele închise',fn:S=>ES.ordine(LV(S)),msg:'Nu șterge rândurile scheletului (&lt;head&gt;, &lt;/head&gt;, &lt;body&gt;, &lt;/body&gt;, &lt;/html&gt;) și închide fiecare etichetă pe care o deschizi, cu bara /.'};
/* reparația după judecata 1 (M1, sonnet J1-3): ce stă între <!-- și --> browserul nu-l citește (nici neînchis: până la capăt) */
const FC=s=>String(s==null?'':s).replace(/<!--(?:-?>|[\s\S]*?(?:--!?>|$))/g,'');
const TITLU=s=>ES.titlu(FC(s));
/* pagina întreagă citită ca de browser (DOMParser = parserul HTML al lui Chromium): ce SE VEDE */
const DOC=s=>new DOMParser().parseFromString(String(s==null?'':s),'text/html');
const vedeH1=(s,txt)=>[...DOC(s).body.querySelectorAll('h1')].some(e=>norm(e.textContent)===norm(txt));
const pDoc=s=>[...DOC(s).body.querySelectorAll('p')].map(e=>e.textContent);
/* mesajele, din ce e în pagină: spun doar ce e sigur adevărat — și în browserul din pagină, și în cel adevărat (regula 28) */
function msgTitlu(s,cerut){const f=FC(s),t=ES.titlu(f);
  if(t!=null)return `Pe filă scrie acum „${X(t)}”. Între &lt;title&gt; și &lt;/title&gt; trebuie să fie ${cerut}.`;
  if(/<title\b/i.test(f)&&!/<title\b[^>]*>[^<]*<\/title\s*>/i.test(f))return 'Rândul cu &lt;title&gt; nu e închis: lipsește &lt;/title&gt;. De aceea browserul pune pe filă tot restul fișierului, iar pagina rămâne goală (lecția 15).';
  if(/<title\b/i.test(ES.corp(f)||''))return 'Pe filă se vede, pentru că browserul iartă greșeala, dar rândul cu &lt;title&gt; stă în corp. Locul lui e în antet, între &lt;head&gt; și &lt;/head&gt; (lecția 15): mută-l acolo.';
  if(/<title\b/i.test(s)&&!/<title\b/i.test(f))return 'Rândul cu &lt;title&gt; stă între &lt;!-- și --&gt;: browserul sare peste tot ce e acolo. Scrie-l în antet, fără semnele acestea.';
  if(/<title\b/i.test(f))return 'Rândul cu &lt;title&gt; nu stă în antet. Locul lui e între &lt;head&gt; și &lt;/head&gt;, sub rândul cu meta.';
  return 'În antet, între &lt;head&gt; și &lt;/head&gt;, nu e încă rândul &lt;title&gt;…&lt;/title&gt;.'}
/* trecerea după judecata 2 (R): în corp (fără comentarii) sunt mai multe <h1…> decât </h1> */
const h1Deschis=s=>{const c=ES.corp(FC(s))||'';return (c.match(/<h1\b[^>]*>/gi)||[]).length>(c.match(/<\/h1\s*>/gi)||[]).length};
function msgH1(s,cerut){const f=FC(s);
  if(h1Deschis(s))return 'Rândul cu &lt;h1&gt; nu e închis: lipsește &lt;/h1&gt; (lecția 15).';
  if(/<h1\b/i.test(ES.corp(f)||''))return `Titlul mare se scrie între &lt;h1&gt; și &lt;/h1&gt;, cu textul ${cerut}.`;
  if(/<h1\b/i.test(ES.antet(f)||''))return 'Browserul arată titlul mare în pagină, pentru că iartă greșeala, dar rândul &lt;h1&gt; stă în antet. Locul lui e în corp, între &lt;body&gt; și &lt;/body&gt; (lecția 15): mută-l acolo.';
  return 'În corp, între &lt;body&gt; și &lt;/body&gt;, nu e încă rândul &lt;h1&gt;…&lt;/h1&gt;.'}
function msgVede(s,cerut){const f=FC(s);
  if(/<title\b/i.test(f)&&!/<title\b[^>]*>[^<]*<\/title\s*>/i.test(f))return 'Pagina e goală: rândul cu &lt;title&gt; nu e închis, iar browserul ia tot restul fișierului drept titlu. Pune &lt;/title&gt;.';
  return `În pagină nu se vede încă titlul mare ${cerut}.`}
function msgLeg(S,nume,text){
  const l=PR.legaturi(S,null,null),g=l.find(x=>norm(x.text).includes(norm(text)));
  if(!g)return `Nu mai găsesc în corp legătura „${X(text)}”: n-o șterge, repar-o.`;
  return `Legătura „${X(text)}” are <code>href="${X(g.href)}"</code>: ${g.exista?'duce la '+X(String(g.cale).replace(/^Documente\//,'')):'în dosar nu e un fișier cu exact numele acesta, deci browserul ar arăta pagina de eroare'}. În dosar, pagina se numește <code>${X(nume)}</code>.`}
const duceLa=(S,nume,text)=>PR.legaturi(S,null,null).some(x=>x.exista&&String(x.cale).toLowerCase()==='documente/'+nume&&norm(x.text).includes(norm(text)));
/* reparația după judecata 1 (m8): ghilimelele curbe ale unor tastaturi de telefon strică src și alt (Chromium: src=“bucura.jpg”
   caută fișierul „“bucura.jpg””) — mesajul spune cauza adevărată, înaintea celorlalte */
const CURBE=s=>/<img\b[^>]*[“”„]/i.test(FC(s));
function msgImg(S){const s=LV(S),im=EWC.imagini(s);
  if(CURBE(s))return 'În eticheta &lt;img&gt; sunt ghilimele curbe (“ ” sau „): browserul nu le înțelege. Scrie ghilimele drepte ("); dacă tastatura ta nu le are, copiază-le din rândul cu meta.';
  if(!im.length)return 'În corp nu e încă nicio etichetă &lt;img src="…"&gt;.';
  if(!EWC.seVede(S))return `În <code>src</code> scrie „${X(im[0].src)}”, dar în dosar fotografia se numește <code>bucura.jpg</code>: browserul pune o pictogramă în locul ei.`;
  return ''}
function msgAlt(s){const im=EWC.imagini(s);
  if(CURBE(s))return 'În eticheta &lt;img&gt; sunt ghilimele curbe (“ ” sau „): browserul nu le înțelege. Scrie ghilimele drepte (").';
  if(!im.length)return 'În corp nu e încă nicio fotografie.';
  if(im.some(x=>x.alt==null))return 'Eticheta &lt;img&gt; nu are încă atributul alt="…".';
  return 'Textul alternativ trebuie să spună ce e în fotografie, în cel puțin două cuvinte, nu numele fișierului.'}
function msgSursa(s){const r=PR.sursa(s);
  if(!r.length||!r[0].text){const g=pDoc(s).find(t=>/gugalcrom/i.test(t));
    /* sursa scrisă, dar nerecunoscută (ca la VIII/21: rândul începe cu „Foto”, „Sursa”…, după fotografie) */
    if(g&&EWC.imagini(s).length&&/^\s*(foto|fotografie|sursa|sursă)/i.test(g))return 'Rândul cu sursa stă deasupra fotografiei. Locul fotografiei e între paragraf și sursă: sursa vine chiar sub ea.';
    if(g)return 'Rândul cu sursa începe cu <b>Foto:</b>, ca în model, apoi autorul și licența.';
    return 'Sub fotografie, pe un rând nou, după rândul cu alt="…"&gt;, scrie sursa: <code>&lt;p&gt;Foto: …&lt;/p&gt;</code>, cu autorul și licența.'}
  return `Sub fotografie scrie „${X(r[0].text)}”: sursa are nevoie de autorul Gugalcrom123 și de licența CC0.`}
function msgStilTest(s,cum){return EWS.mesajText(s)||cum}
/* reparația după judecata 1 (m2): pe <html>, fundalul umple fereastra în browserul adevărat (Chromium: fundalul rădăcinii
   acoperă toată fereastra), iar în browserul din pagină se vede doar o margine, pentru că acolo <body> are fundal alb
   (editorweb.js, previewDoc — scris la „Pentru componenta comună”). Mesajul le spune pe amândouă și regula lecției 19. */
function msgFundal(s,culoare){
  const d=(EWS.declaratii(s)||[]).find(x=>/background/i.test(x.prop)&&x.tag!=='body');
  if(d&&d.tag==='html')return `Fundalul e pus pe &lt;html&gt;. În browserul adevărat umple fereastra, iar aici se vede doar pe margine; regula de la lecția 19 e alta: fundalul paginii stă în eticheta &lt;body&gt;. Mută style-ul acolo.`;
  if(d)return `Fundalul e pus pe &lt;${X(d.tag)}&gt;: colorează doar elementul acela. Pentru toată pagina, style-ul stă în eticheta &lt;body&gt;.`;
  return EWS.mesajText(s)||`Pagina nu are încă fundalul ${culoare}: style-ul cu background-color stă în eticheta &lt;body&gt;.`}

     text:`<p>La partea B nu ai model: eticheta o alegi singur, după cuvintele cerinței:</p>

     exemplu:`<p>De exemplu, „programul cercului: ziua și ora”:</p>${PRE(COD.p4_tabel)}${PR.randare(COD.p4_pagina,150,'Pagina, în browser:')}`,

       ajutor:'Câte informații are fiecare drumeție? Unde stau ele, una lângă alta?',why:'Trei informații pe fiecare drumeție, pe coloane: un tabel cu capul lui (lecția 17).'},

      {t:'editorweb',mod:'live',

        T('Paragraful e la mijloc',S=>EWS.are(LV(S),'p',{'text-align':'center'}),S=>msgStilTest(LV(S),'Paragraful nu e încă la mijloc: în același style, text-align: center;.')),
        {ce:'Textele au rămas: titlul mare și paragraful',fn:S=>{const s=LV(S);return texte(s,'h1').some(t=>norm(t)==='excursia de toamna')&&texte(s,'p').some(t=>norm(t).includes('atentie plecam la ora 7'))},msg:'Nu schimba textele: pui doar style-ul în eticheta &lt;p&gt;.'},

    /* ---------- PASUL 4: partea A ---------- */
    {t:'Partea A: verifici legăturile și textul alternativ, apoi explici',
     text:`<p>La partea A ai o situație nouă: de obicei, o pagină de verificat și o explicație. Verifici așa:</p>
<ol class="pasi-met"><li><b>Legăturile:</b> apeși pe fiecare; la pagina de eroare compari numele din <code>href</code>, literă cu literă, cu cel din Explorer (lecția 18).</li>
<li><b>Fotografiile:</b> se vede fiecare și are în cod un <code>alt</code> care spune ce se vede (lecția 16)?</li>
<li>Repari, <kbd>Ctrl</kbd>+<kbd>S</kbd>, <kbd>F5</kbd>, verifici din nou.</li>
<li><b>Explici</b> cu regula: „în href era alt nume decât al fișierului”, nu „așa mi-a ieșit”.</li></ol>`,
     exemplu:`<p>În dosar, fotografia se numește bucura.jpg, dar în <code>src</code> scrie bucura.png. Browserul nu găsește fișierul: pune o pictogramă și textul din <code>alt</code>.</p>${PR.randare(COD.p5_pagina,170,'Pagina, în browser:',IMG_URI)}`,
     altfel:`<p>E ca la controlul unei biciclete înainte de drum: nu te uiți doar dacă arată bine, ci încerci pe rând frâna, lumina și claxonul.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Legătura „Galeria cercului” duce la pagina de eroare, deși în dosar e <b>galerie.html</b>. Repară <code>href</code> (aici legătura nu se apasă).',
       start:{text:COD.p5_start,fisier:'cercul_de_fotografie.html',fisiere:{Documente:[pag(['galerie.html','Galeria cercului','Fotografiile din toamnă.'])]}},
       teste:[
        T('Legătura „Galeria cercului” duce la galerie.html, din același dosar',S=>duceLa(S,'galerie.html','Galeria cercului'),S=>msgLeg(S,'galerie.html','Galeria cercului')),
        ORD],
       rezolvare:[['scrie',COD.p5_rez]],gresit:[['scrie',COD.p5_gresit]],
       ajutor:'Pagina stă în același dosar cu galerie.html. Ce scrii în href în cazul acesta (lecția 18)?',
       why:'Paginile stau în același dosar, deci în href scrii doar numele fișierului, întreg: href="galerie.html".'},
     inca:[
      {t:'choice',q:'În browser, în locul fotografiei se vede o pictogramă mică și textul „Cabana de lemn”. Ce faci întâi?',o:['Compari numele din src cu numele fotografiei din dosar, literă cu literă','Ștergi textul alternativ: din cauza lui nu se vede fotografia','Pui fotografia într-un dosar nou, numit imagini, lângă pagină','Scrii numele fotografiei și între etichetele &lt;img&gt; și &lt;/img&gt;'],ok:0,
       ajutor:'Ce arată browserul când nu găsește fișierul cu numele din src?',why:'Pictograma și textul din alt apar când browserul nu găsește fișierul cu numele din src. Compari numele, cu tot cu extensie (.jpg, .png). Textul alternativ nu strică nimic: spune ce trebuia să fie acolo.'},
      {t:'choice',q:'Care e o explicație bună la partea A?',o:['Legătura dădea eroare pentru că în href scria orar.htm, iar fișierul se numește orar.html.','Am reparat legătura, iar acum, când apăs pe ea, merge cum trebuie.','Legătura nu mergea, așa că am scris-o din nou, până când a mers.','Am schimbat câteva litere în href și, după F5, a mers.'],ok:0,
       ajutor:'O explicație bună spune DE CE: ce regulă a fost încălcată.',why:'Explicația bună spune cauza, cu regula: numele din href trebuie să fie exact numele fișierului. Celelalte spun doar că a mers.'}
     ]}
   ],

   /* ---------- ATELIERUL: proba de antrenament, cu punctaj ---------- */
   atelier:{t:'probaew',mod:'live',proba:'C1',titlu:'Atelier: proba de antrenament, cu punctaj',
    intro:`<p><strong>Proba de antrenament:</strong> 6 exerciții pe pagina Clubului de drumeții (inventat), plus 10 puncte din oficiu. Punctele pe cerințe sunt ale paginii; la lucrare, ale profesorului.</p>
<p>Punctele se socotesc la <b>prima</b> apăsare pe <b>Verifică</b>; dacă strici ce era bun în pagină, pierzi și din ele. La sfârșit, nota: scrie-o în caiet. Sună în mijlocul probei? Data viitoare o iei de la C1.</p>
<p>Întâi numele în caseta de jos: la schimbarea elevului, proba se golește.</p>`,
    q:`${PARTE.C} <b>C1.</b> Pagina clubului e abia începută.<ol><li>În antet, sub rândul cu meta, scrie <code>&lt;title&gt;Clubul de drumeții&lt;/title&gt;</code>.</li><li>În corp, sub <code>&lt;body&gt;</code>, scrie <code>&lt;h1&gt;Clubul de drumeții&lt;/h1&gt;</code>.</li></ol>Fără ț? Scrie drumetii.`,
    start:{text:COD.c1_start,fisier:'clubul_de_drumetii.html'},
    /* reparația după judecata 1 (M1): testele spun LOCUL (ca la lecția 15), iar al treilea, ce SE VEDE în browser */
    teste:[
     T('În antet, între &lt;head&gt; și &lt;/head&gt;: &lt;title&gt;Clubul de drumeții&lt;/title&gt;',S=>norm(TITLU(LV(S)))===norm(CLUB),S=>msgTitlu(LV(S),'Clubul de drumeții'),{puncte:10,lectia:L(15,'Titlul de pe filă: <title>',3)}),
     /* trecerea după judecata 2 (R): testul cere și închiderea, </h1> (fără ea: 14/20, ca </li> lipsă la B1) */
     T('În corp, între &lt;body&gt; și &lt;/body&gt;: &lt;h1&gt;Clubul de drumeții&lt;/h1&gt;',S=>texte(FC(LV(S)),'h1').some(t=>norm(t)===norm(CLUB))&&!h1Deschis(LV(S)),S=>msgH1(LV(S),'Clubul de drumeții'),{puncte:6,lectia:L(15,'Scheletul: antetul și corpul',2)}),
     T('În browser se vede titlul mare',S=>vedeH1(LV(S),CLUB),S=>msgVede(LV(S),'„Clubul de drumeții”'),{puncte:4,lectia:L(15,'Fiecare etichetă se închide, în ordine inversă',5)}),
     ORD],
    rezolvare:[['scrie',COD.c1_rez]],gresit:[['scrie',COD.c1_gresit]],
    ajutor:'Antetul e între &lt;head&gt; și &lt;/head&gt;; corpul, între &lt;body&gt; și &lt;/body&gt;. Fiecare rând se închide cu eticheta lui, cu bara /.',
    why:'Titlul pe filă, titlul mare în pagină.',
    inca:[
     {t:'probaew',mod:'live',proba:'C2',titlu:'Atelier: proba, exercițiul C2',
      q:`${PARTE.C} <b>C2.</b> Pune fotografia lacului (<b>bucura.jpg</b>) sub paragraf, deasupra sursei ei, după model:${PRE(COD.c2_model)}La <code>alt</code>, ce se vede.`,
      start:{text:COD.c2_start,fisier:'clubul_de_drumetii.html',fisiere:{Documente:[Object.assign({},FOTO)]}},
      /* reparația după judecata 1 (M3): sursa e deja scrisă (Foto: Gugalcrom123, CC0); testul 3 judecă locul ei, sub fotografie */
      teste:[
       T('Fotografia lacului se vede în pagină',S=>EWC.seVede(S),S=>msgImg(S),{puncte:8,lectia:L(16,'Imaginea: <img src="…">',5)}),
       T('Fotografia are un text alternativ care spune ce se vede',S=>{const s=LV(S);return EWC.imagini(s).length>0&&EWC.altBun(s)},S=>msgAlt(LV(S)),{puncte:8,lectia:L(16,'Textul alternativ: alt',6)}),
       T('Sursa stă chiar sub fotografie',S=>{const r=PR.sursa(LV(S));return r.length>0&&r.every(x=>PR.sursaBuna(x.text,{autor:'Gugalcrom123',licenta:'CC0'}))},S=>msgSursa(LV(S)),{puncte:4,lectia:L(21,'Tema și cele 8 cerințe',2)}),
       {ce:'Titlul mare și paragraful au rămas',fn:S=>{const s=LV(S);return vedeH1(s,CLUB)&&pDoc(s).some(t=>norm(t)===norm(MERGEM))},msg:'Nu șterge titlul mare și paragraful: fotografia vine între paragraf și sursă.',pazaDupa:5},
       ORD],
      rezolvare:[['scrie',COD.c2_rez]],gresit:[['scrie',COD.c2_gresit]],
      ajutor:'Copiezi primele două rânduri ale modelului și schimbi ce e al paginii tale: numele fișierului (bucura.jpg) și ce se vede în fotografie.',
      why:'Fotografia se vede, cu text alternativ și cu sursa dedesubt.'},
     {t:'probaew',mod:'live',proba:'B1',titlu:'Atelier: proba, exercițiul B1',
      q:`${PARTE.B} <b>B1.</b> Sub „Cum te înscrii:”, cei trei pași sunt acum paragrafe. Fă din ei o listă, <b>în aceeași ordine</b>. Alege singur eticheta potrivită.`,
      start:{text:COD.b1_start,fisier:'clubul_de_drumetii.html'},
      /* reparația după judecata 1 (M2): testul cu tipul listei are ceInainte — până la prima verificare nu spune „numerotată” */
      teste:[
       T('Pașii sunt o listă, în ordinea lor',S=>(EWT.liste(LV(S))||[]).some(l=>l.elemente.length===3&&PASI_INSCRIERE.every((p,i)=>norm(l.elemente[i])===norm(p))),S=>{const l=EWT.liste(LV(S))||[];return l.length?`Lista are acum ${l[0].elemente.length===1?'un singur rând':l[0].elemente.length+' rânduri'} &lt;li&gt;. Trebuie să fie cei trei pași, fiecare în &lt;li&gt;…&lt;/li&gt;, în ordinea din cerință.`:'În corp nu e încă nicio listă: rândurile &lt;li&gt; stau între eticheta listei și închiderea ei.'},{puncte:5,lectia:L(17,'Lista cu buline: <ul> și <li>',2)}),
       T('Lista e numerotată: ordinea contează',S=>(EWT.liste(LV(S))||[]).some(l=>l.tip==='ol'&&l.elemente.length>=3),S=>(EWT.liste(LV(S))||[]).some(l=>l.tip==='ul')?'Lista e cu buline (&lt;ul&gt;). Când ordinea contează, lista e numerotată: &lt;ol&gt; … &lt;/ol&gt;.':'În corp nu e încă o listă numerotată, &lt;ol&gt; … &lt;/ol&gt;, cu trei rânduri &lt;li&gt;.',{puncte:5,ceInainte:'Lista are tipul potrivit pentru pași',lectia:L(17,'Lista numerotată: <ol>',3)}),
       T('Fiecare &lt;li&gt; și lista sunt închise',S=>{const s=LV(S);return (EWT.liste(s)||[]).length>0&&EWT.inchise(s,['ul','ol','li'])},S=>EWT.mesajText(LV(S))||'Fiecare &lt;li&gt; se închide cu &lt;/li&gt;, iar lista cu &lt;/ol&gt;.',{puncte:5,lectia:L(17,'Greșeli în tabele și liste: cum le găsești',6)}),
       T('Pașii nu mai apar și ca paragrafe',S=>!pasiCaParagrafe(LV(S)),S=>pasiInLista(LV(S))?'Pașii apar acum de două ori: și în listă, și ca paragrafe. Șterge paragrafele vechi, de la &lt;p&gt; la &lt;/p&gt;.':'Pașii sunt încă paragrafe: fă din ei rândurile listei, fiecare între &lt;li&gt; și &lt;/li&gt;.',{pazaDupa:5}),
       {ce:'Titlul și paragrafele de sus au rămas',fn:S=>{const s=LV(S),p=pDoc(s).map(norm);return vedeH1(s,CLUB)&&p.includes(norm(MERGEM))&&p.includes(norm('Cum te înscrii:'))},msg:'Nu șterge titlul mare și paragrafele de deasupra pașilor: doar pașii devin listă.',pazaDupa:7},
       ORD],
      rezolvare:[['scrie',COD.b1_rez]],gresit:[['scrie',COD.b1_gresit]],
      ajutor:'Ordinea contează: ce fel de listă pune numerele singură (lecția 17)? Fiecare pas stă între &lt;li&gt; și &lt;/li&gt;.',
      why:'Ordinea pașilor contează, deci listă numerotată, &lt;ol&gt;: browserul pune singur 1., 2., 3.'},
     {t:'probaew',mod:'live',proba:'B2',titlu:'Atelier: proba, exercițiul B2',
      q:`${PARTE.B} <b>B2.</b> Formatează pagina singur, cu <code>style</code>: titlul mare <b>bleumarin</b> (navy); fundalul întregii pagini <b>galben-deschis</b> (lightyellow).`,
      start:{text:COD.b2_start,fisier:'clubul_de_drumetii.html'},
      /* reparația după judecata 1 (M3): fără „la mijloc” (îl scrii în laborator, pasul B, și la pasul 3, „Încă un exercițiu”) */
      teste:[
       T('Titlul mare e bleumarin',S=>EWS.are(LV(S),'h1',{color:'navy'}),S=>msgStilTest(LV(S),'Titlul mare nu e încă bleumarin: în eticheta &lt;h1&gt;, un style cu color: navy;.'),{puncte:7,lectia:L(19,'Atributul style: culoarea literelor',2)}),
       /* trecerea după judecata 2 (Q): până la prima verificare, textul nu spune LOCUL fundalului (ceInainte, ca la B1 și A1) */
       T('Fundalul paginii, pus în &lt;body&gt;, e galben-deschis',S=>EWS.aceeasiCuloare(EWS.fundalPagina(LV(S)),'lightyellow'),S=>msgFundal(LV(S),'galben-deschis'),{puncte:8,ceInainte:'Fundalul întregii pagini e galben-deschis',lectia:L(19,'Fundalul și contrastul',5)}),
       {ce:'Textele și lista au rămas',fn:S=>{const s=LV(S);return vedeH1(s,CLUB)&&pDoc(s).length>=2&&DOC(s).body.querySelectorAll('li').length>=3},msg:'Nu schimba textele: pui doar style-urile.',pazaDupa:7},
       ORD],
      rezolvare:[['scrie',COD.b2_rez]],gresit:[['scrie',COD.b2_gresit]],
      ajutor:'Titlul: un style în &lt;h1&gt;, cu color. Fundalul întregii pagini: un style în &lt;body&gt;, cu background-color.',
      why:'<code>&lt;h1 style="color: navy;"&gt;</code> și <code>&lt;body style="background-color: lightyellow;"&gt;</code>.'},
     {t:'probaew',mod:'live',proba:'A1',titlu:'Atelier: proba, exercițiul A1',
      q:`${PARTE.A} <b>A1.</b> Situație nouă: verifică pagina clubului. Fiecare legătură trebuie să ducă la pagina ei din dosar (dosarul e sub zona de scris), iar fotografia, să se vadă și să aibă text alternativ. Repară ce nu e bun. Legăturile nu se apasă aici.`,
      start:{text:COD.a1_start,fisier:'clubul_de_drumetii.html',fisiere:{Documente:DOSAR_A.map(f=>Object.assign({},f))}},
      teste:[
       T('Fiecare legătură duce la pagina ei din dosar',S=>{const l=PR.legaturi(S,null,null);return l.length>=2&&l.every(x=>x.exista)&&duceLa(S,'program.html','Programul')&&duceLa(S,'reguli.html','Regulile')},S=>{const l=PR.legaturi(S,null,null);if(l.length<2)return 'Pe pagină erau două legături, spre program.html și spre reguli.html: nu le șterge, repară-le.';const g=l.find(x=>!x.exista);if(g)return `Legătura „${X(g.text.trim())}” are <code>href="${X(g.href)}"</code>, dar în dosar nu e un fișier cu exact numele acesta: browserul ar arăta pagina de eroare.`;return 'Fiecare legătură duce la o pagină din dosar, dar nu la a ei: Programul drumețiilor → program.html, Regulile clubului → reguli.html.'},{puncte:6,ceInainte:'Legăturile duc la paginile din dosar',lectia:L(18,'Spre pagina ta: doar numele fișierului',3)}),
       T('Fotografia se vede și are un text alternativ care spune ce se vede',S=>{const s=LV(S);return EWC.imagini(s).length>0&&EWC.toateSeVad(S)&&EWC.altBun(s)},S=>msgImg(S)||msgAlt(LV(S)),{puncte:6,ceInainte:'Fotografia se vede și are text alternativ',lectia:L(16,'Textul alternativ: alt',6)}),
       {ce:'Restul paginii a rămas: titlul, paragraful, sursa, legăturile',fn:S=>{const s=LV(S),p=pDoc(s);return vedeH1(s,CLUB)&&p.some(t=>norm(t)===norm(MERGEM))&&p.some(t=>PR.sursaBuna(t,{autor:'Gugalcrom123',licenta:'CC0'}))&&DOC(s).body.querySelectorAll('a').length>=2},msg:'Repari doar ce nu e bun: titlul, paragraful, sursa și legăturile rămân.',pazaDupa:6},
       ORD],
      rezolvare:[['scrie',COD.a1_rez]],gresit:[['scrie',COD.a1_gresit]],
      ajutor:'Ia pe rând fiecare href și compară-l cu numele din dosar, literă cu literă. Apoi uită-te la eticheta &lt;img&gt;: ce atribut îi lipsește?',
      why:'Acum legătura duce la reguli.html, iar fotografia are text alternativ.'},
     {t:'probaalege',proba:'A2',titlu:'Atelier: proba, exercițiul A2',
      q:`${PARTE.A} <b>A2.</b> Explică: de ce ducea legătura „Regulile clubului” la pagina de eroare? La lucrare o scrii cu cuvintele tale; aici o alegi.`,

      mesaje:{1:'target="_blank" doar deschide pagina într-o filă nouă (lecția 18). Fără el, legătura merge, în aceeași filă.',2:'Textul legăturii spune unde duce; nu el caută fișierul. Uită-te la href.',3:'Pe Windows, literele mari și mici nu contează în nume (lecția 18). Compară tot numele: Regulile.html și reguli.html.'},

/* ===================== PRINCIPIUL VERIFICĂRILOR (reparația 4, 24.10.2026, decizia dirijorului) =====================
   Un mesaj de verificare spune NUMAI ce e sigur adevărat. Când nu poate fi sigur, spune mai puțin (ce rând s-a schimbat)
   și cum te întorci: Ctrl+Z până revine, sau butonul „Ia de la capăt” (sursa de început a exercițiului).
   De ce: judecățile 2, 3 și 4 au găsit de fiecare dată alt fel de selecție imprecisă (mouse, deget) pentru care mesajul
   spunea ceva FALS (N, R, T, U, V, W). Nu mai adăugăm cazuri. În P4 (mutare, ștergere, copiere), P5 și Î3 PRIMUL test e
   NEATINS: restul paginii (titlurile, celelalte paragrafe, scheletul, <body>, </body>) e cum era la început. Abia după el
   vin testele zonei exercițiului (resturi de etichetă, PERECHI_P, ordinea, COPIA_SUS…), iar ultimul test (DIFERIT) spune
   ce e diferit față de rezolvare tot numai cu lucruri sigure.
   Reparația 5 (judecata 5): principiul se aplică ȘI mesajelor vechi — niciun mesaj nu spune ce taste a apăsat elevul sau
   ce a făcut („l-ai copiat”, „l-ai decupat”, „ai luat doar textul”), doar starea paginii — și capetelor scheletului:
   NEATINS cere și ca înainte de <body> și după </body> să fie doar scheletul de la început. La calculator, drumul înapoi
   e unul singur: Ctrl+Z „până pagina e iar cum era la început”. */
/* bucățile unei surse, pentru comparații: etichetele întregi (cu spațiile din ele strânse) și textele (spațiile strânse,
   fără capete). Spațiile, Tab-urile și Enter-urile DINTRE ele nu contează; un „<” care nu începe o etichetă întreagă e o
   bucată singură (așa, în „<h2>Drumul</h” nu mai e eticheta </h2>). */
const BUC=s=>{const o=[],re=/<[^<>]*>|[^<]+|</g,t=String(s||'').replace(/\r\n?/g,'\n');let m;
  while((m=re.exec(t))){const x=m[0].length>1&&m[0][0]==='<'?m[0].replace(/\s+/g,' '):m[0].replace(/\s+/g,' ').trim();if(x)o.push(x)}return o};
/* aceleași bucăți, cu locul lor în sursă (k = primul semn care nu e spațiu), pentru mesajul X (reparația 5) */
const BUCP=s=>{const o=[],re=/<[^<>]*>|[^<]+|</g,t=String(s||'').replace(/\r\n?/g,'\n');let m;
  while((m=re.exec(t))){const e=m[0].length>1&&m[0][0]==='<',x=e?m[0].replace(/\s+/g,' '):m[0].replace(/\s+/g,' ').trim();if(x)o.push({x,k:m.index+(e?0:m[0].length-m[0].trimStart().length)})}return o};
const NR_ORI=['','o dată','de două ori','de trei ori','de patru ori','de cinci ori'];
/* reparația 5, punctul Z: la calculator, Ctrl+Z „până pagina e iar cum era la început” (nu „până rândul revine”): oprit
   la rând, Ctrl+Z anula doar lipirea, iar paragraful decupat rămânea în afara paginii. */
const CAPAT_INAPOI=()=>ES.tactil()?'apasă butonul <b>Ia de la capăt</b>, de lângă <b>Verifică</b>: pagina revine cum era la început.'
  :'apasă <kbd>Ctrl</kbd>+<kbd>Z</kbd> de câte ori trebuie, până pagina e iar cum era la început, sau butonul <b>Ia de la capăt</b>, de lângă <b>Verifică</b>, care pune pagina de la început.';
/* NEATINS(start, zona, refa): testul „restul paginii e cum era”. start = sursa de început a exercițiului; zona = cuvinte
   din rândurile care țin de exercițiu (ele pot pleca, veni sau apărea de două ori); refa = ce face elevul după ce s-a întors.
   Fiecare ALT rând nevid al sursei de început trebuie să apară ÎNTREG (aceleași bucăți, una după alta), în aceeași ordine
   față de celelalte (cea mai lungă subsecvență comună) și de câte ori era. Ce poate spune, sigur: rândul s-a șters (nici
   el, nici textul lui nu mai sunt, iar eticheta lui apare mai rar), s-a schimbat, nu mai e la locul lui (e întreg, în alt
   loc) sau apare de mai multe ori decât la început. Lângă un rând întreg poate sta lipit altceva: acela ține de zonă. */
const NEATINS=(start,zona,refa)=>{
  const F=String(start).replace(/\r\n?/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l&&!zona.some(z=>l.includes(z)))
    .map(l=>{const b=BUC(l);return {l,b,k:b.join('\u0001'),txt:b.filter(x=>x[0]!=='<'||x.length===1).join(' ')}});
  const L0=BUC(start),cate=(t,s)=>s.filter(x=>x===t).length;let r=null;
  const cauta=src=>{
    const T=BUC(src),fel=[...new Map(F.map(f=>[f.k,f])).values()].sort((a,b)=>b.b.length-a.b.length),O=[];
    for(let i=0;i<T.length;){const f=fel.find(f=>f.b.every((x,j)=>T[i+j]===x));if(f){O.push(f.k);i+=f.b.length}else i++}
    const n=F.length,m=O.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0)),pus=new Array(n).fill(false);
    for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=F[i].k===O[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
    for(let i=0,j=0;i<n&&j<m;){if(F[i].k===O[j]){pus[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
    const acum=k=>cate(k,O),la_inceput=k=>F.filter(f=>f.k===k).length,ns=N(src),o={sterse:[],schimbate:[],mutate:[],plus:[]};
    F.forEach((f,i)=>{if(pus[i])return;
      if(acum(f.k)>=la_inceput(f.k))o.mutate.push(f.l);
      else if(f.txt&&!ns.includes(N(f.txt))&&cate(f.b[0],T)<cate(f.b[0],L0))o.sterse.push(f.l);
      else o.schimbate.push(f.l)});
    for(const f of fel)if(acum(f.k)>la_inceput(f.k))o.plus.push({l:f.l,n:acum(f.k),n0:la_inceput(f.k)});
    o.plus.sort((a,b)=>F.findIndex(f=>f.l===a.l)-F.findIndex(f=>f.l===b.l));
    return o};
  /* reparația 5, punctul X: „restul paginii e cum era” cuprinde și capetele scheletului. Înainte de <body> și după </body>
     trebuie să fie exact bucățile de la început (DOCTYPE, <html>, <head>…</head>; </html>); orice altceva acolo stă în
     afara corpului paginii, chiar dacă browserul îl mută singur în corp (A27) și testele pe DOM nu-l mai văd. */
  const S0=BUC(start),b0=S0.indexOf('<body>'),e0=S0.indexOf('</body>');
  const afara=src=>{const T=BUCP(src),b=T.findIndex(t=>/^<body\b/i.test(t.x)),e=T.findIndex(t=>/^<\/body\s*>$/i.test(t.x));
    if(b<0||e<0||b0<0||e0<0)return null;
    const plus=(A,B)=>{const o=[];let j=0;for(const t of A){if(j<B.length&&t.x===B[j])j++;else o.push(t)}return o};

  if(b.fel==='p_singur')return singur('<p>')&&sus()?`Sub rândul ${C(sus())} a rămas un rând cu doar <code>&lt;p&gt;</code>: șterge-l.`:`Pe rândul ${C(r)} e un <code>&lt;p&gt;</code> în plus, fără text și fără <code>&lt;/p&gt;</code> după el: șterge-l.`;
  if(b.fel==='gol')return singur('<p></p>')&&sus()?`Sub rândul ${C(sus())} a rămas un paragraf gol, <code>&lt;p&gt;&lt;/p&gt;</code>: doar etichetele, fără text. Șterge rândul acela.`:`Pe rândul ${C(r)} a rămas un paragraf gol, <code>&lt;p&gt;&lt;/p&gt;</code>: doar etichetele, fără text. Șterge-l.`;
  if(b.fel==='fara_inchidere')return b.text?`${q(b.text)} are <code>&lt;p&gt;</code> în față, dar nu are <code>&lt;/p&gt;</code> la sfârșit: scrie <code>&lt;/p&gt;</code> după el.`:`Paragraful de pe rândul ${C(r)} nu are <code>&lt;/p&gt;</code>: scrie-l la sfârșitul lui.`;
  if(b.fel==='fara_deschidere')return `${q(b.text)} are <code>&lt;/p&gt;</code> după el, dar nu are <code>&lt;p&gt;</code> în față: scrie <code>&lt;p&gt;</code> înainte de el.`;
  return `${q(b.text)} stă fără <code>&lt;p&gt;</code> și <code>&lt;/p&gt;</code>: scrie <code>&lt;p&gt;</code> înainte de el și <code>&lt;/p&gt;</code> după el.`;
};
/* reparația 3, punctul R: resturile de etichetă, câte o propoziție pe rând (toate resturile unui rând odată, ca rândul citat
   să fie încă acolo când elevul ajunge la el). Singur pe rând: „Sub rândul X”; lipit: „Pe rândul X, la început / la sfârșit /
   înainte de …”. Rândul de deasupra se caută pe sursa fără resturi (cum arată după ce elevul le-a șters pe cele de mai sus). */
const spuneResturi=(src,curat,lista)=>{
  const L=String(src||'').replace(/\r\n?/g,'\n').split('\n'),LC=String(curat||'').split('\n'),C=t=>`<code>${X(t.replace(/\s+/g,' ').trim().slice(0,70))}</code>`;
  const inc=k=>{let n=0;for(let j=0;j<k;j++)n+=L[j].length+1;return n};
  const sus=r=>{for(let j=r-1;j>=0;j--)if(LC[j].trim())return LC[j];return ''};
  const randuri=[...new Set(lista.map(b=>b.rand))].sort((a,b)=>a-b),NR=['','o','două','trei','patru'];
  return randuri.map(r=>{
    const lin=L[r]||'',bs=lista.filter(b=>b.rand===r).sort((a,b)=>a.k-b.k),o=inc(r);
    /* eticheta de titlu tăiată la sfârșitul rândului („<h2>Drumul</h2”): nu e de șters, îi lipsește doar „>” */
    const h=bs.find(b=>/^h[1-6]$/.test(b.nume)&&!lin.slice(b.k-o+b.text.length).trim());
    if(h&&bs.length===1)return `Pe rândul ${C(lin)}, la sfârșit, eticheta ${C(h.text)} a rămas fără ${C('>')}: scrie ${C('>')} după ea.`;
    if(!(LC[r]||'').trim()&&sus(r))return bs.length===1?`Sub rândul ${C(sus(r))} a rămas, singură pe rând, o bucată de etichetă: ${C(bs[0].text)}. Șterge-o.`
      :`Sub rândul ${C(sus(r))} a rămas un rând doar cu bucăți de etichetă: ${C(lin)}. Șterge-l.`;
    const poz=b=>{const a=b.k-o,inainte=lin.slice(0,a),dupa=lin.slice(a+b.text.length);
      if(!inainte.trim())return 'la început';if(!dupa.trim())return 'la sfârșit';
      return `înainte de ${C(dupa.trim().split(/\s+/)[0].slice(0,15))}`};
    if(bs.length===1)return `Pe rândul ${C(lin)}, ${poz(bs[0])}, a rămas o bucată de etichetă: ${C(bs[0].text)}. Șterge-o.`;
    return `Pe rândul ${C(lin)} au rămas ${NR[bs.length]||bs.length} bucăți de etichetă: ${bs.map(b=>`${C(b.text)} ${poz(b)}`).join(' și ')}. Șterge-le.`;
  });
};
/* testul perechilor de paragraf (reparația 2, punctul N): pică dacă a rămas o etichetă de paragraf fără pereche sau un
   paragraf gol; mesajul numește FIECARE bucată rămasă, în ordinea rândurilor (și textul liber, dacă e), ca elevul să le
   repare pe toate odată. Stă înaintea testelor de loc și de ordine: ele ar trimite elevul să mute ce e deja la locul lui.
   Reparația 3 (punctul R): pică și la o bucată de etichetă rămasă; mesajul spune întâi resturile (de șters), apoi celelalte
   bucăți, socotite pe sursa fără resturi. */
/* reparația 5 (AA): faraDiagnostic — mesajul îl spune lecția, nu diagnosticul lecției 15. Pentru o copie care a luat și
   „</body” (fără „>”), diagnosticul spunea „După </body trebuie semnul >”: urmat, făcea al doilea </body>. */
const PERECHI_P=(sfat,start)=>{let sursa='',lista=[];const orig=start?textele(start,'p'):null;return {ce:'Fiecare paragraf e întreg: &lt;p&gt;, textul și &lt;/p&gt;',faraDiagnostic:true,
  fn:S=>{sursa=LV(S);lista=bucati(sursa);return !lista.some(b=>b.fel!=='liber')},
  get msg(){const R=lista.filter(b=>b.fel==='rest'),alte=lista.filter(b=>b.fel!=='rest'),fr=alte.some(b=>FRAGM(b,orig));
    return [...spuneResturi(sursa,lista.curat,R),...alte.map(b=>FRAGM(b,orig)?spuneFragment(b):spuneBucata(lista.curat,b))].join(' ')+(fr?' Ca să pornești din nou curat, '+CAPAT_INAPOI():'')+' '+(sfat||'Data viitoare selectezi elementul întreg, de la <code>&lt;p&gt;</code> până după <code>&lt;/p&gt;</code>.')}}};
/* testul „niciun text fără etichete”; mesajul citează textul rămas liber (reparare J1, punctul A) și spune doar ce lipsește
   (reparația 2, punctul N: dacă după text vine </p>, lipsește doar <p>) */
const FARA_LIBER=(start)=>{let t='',b=null;const orig=start?textele(start,'p'):null;return {ce:'Tot textul stă în etichete: niciun rând fără &lt;p&gt; și &lt;/p&gt;',fn:S=>{t=liber(LV(S));b=t?bucati(LV(S)).find(x=>x.fel==='fara_deschidere'||x.fel==='liber'):null;return !t},
  get msg(){const f=b&&FRAGM(b,orig)?b:(!b&&t&&FRAGM({fel:'liber',text:t},orig)?{fel:'liber',text:t}:null);   /* reparația 4: bucată de text → doar ce e sigur + drumul înapoi */
    if(f)return spuneFragment(f)+' Ca să pornești din nou curat, '+CAPAT_INAPOI();
    return b&&b.fel==='fara_deschidere'?`Textul „${X(b.text.slice(0,60))}” are <code>&lt;/p&gt;</code> după el, dar nu are <code>&lt;p&gt;</code> în față: scrie <code>&lt;p&gt;</code> înainte de el.`
    :`Textul „${X(t.slice(0,60))}” stă în pagină fără <code>&lt;p&gt;</code> și <code>&lt;/p&gt;</code>: scrie <code>&lt;p&gt;</code> înainte de el și <code>&lt;/p&gt;</code> după el.`}}};   /* reparația 5 (Y): fără „ai luat doar textul” — lecția nu știe cum a ajuns textul așa */
/* P5: imaginea sub paragraf (reparare J1, punctul M). Reparația 2, punctul P: când <img> e ÎNĂUNTRUL paragrafului, mesajul
   spune și de ce nu e bine, deși în browserul îngust de aici pare tot sub text (A23: într-o fereastră lată stă lângă text). */
/* Reparația 3, punctul S: mesajul după locul REAL al lui <img> în <p> (textul de dinainte / de după el): după text = mesajul
   lung de la P; înainte de text = deasupra textului; între cuvinte = rupe textul; fără text în <p> = un paragraf al fotografiei. */
const locImg=im=>{const p=im.closest('p'),w=p.ownerDocument.createTreeWalker(p,NodeFilter.SHOW_TEXT);let ina=false,dupa=false,n;
  while((n=w.nextNode()))if(n.textContent.trim()){if(im.compareDocumentPosition(n)&Node.DOCUMENT_POSITION_PRECEDING)ina=true;else dupa=true}
  return ina&&dupa?'mijloc':ina?'dupa_text':dupa?'inainte_text':'singura'};
/* Reparația 4: și când <img> NU e în <p>, mesajul spune doar ce e sigur (câte imagini sunt, dacă stă deasupra paragrafului). */
const IMG_SUB_P=()=>{let loc='',cate=0,sus=false;return {ce:'Pagina are o imagine, sub paragraf',
  fn:S=>{const o=ordine(LV(S)),i=o.findIndex(x=>x.startsWith('img:')),iP=o.findIndex(x=>x.startsWith('p:')),im=corp(LV(S)).querySelector('p img');loc=im?locImg(im):'';
    cate=o.filter(x=>x.startsWith('img:')).length;sus=i>=0&&iP>=0&&i<iP;return i>0&&o[i-1].startsWith('p:')&&!im&&cate===1},
  get msg(){const MUTA='mută <code>&lt;img src="…"&gt;</code> pe un rând nou, după <code>&lt;/p&gt;</code>.';
    if(loc==='dupa_text')return 'Fotografia stă înăuntrul paragrafului, înainte de <code>&lt;/p&gt;</code>. Aici, în browserul îngust, pare tot sub text, doar lipită de el; într-o fereastră lată stă chiar lângă text, pe același rând. Exercițiul o vrea sub paragraf în orice fereastră: '+MUTA;
    /* reparația 4, punctul S: și ce se întâmplă într-o fereastră lată (probat în Chromium la 1280, pagina singură: textul stă
       pe același rând cu fotografia) — ca la mesajul pentru „după text” */
    if(loc==='inainte_text')return 'Fotografia stă la începutul paragrafului, înainte de text: aici, în browserul îngust, apare deasupra textului (într-o fereastră lată, fotografia poate sta chiar pe același rând cu textul). Exercițiul o vrea sub paragraf în orice fereastră: '+MUTA;
    if(loc==='mijloc')return 'Fotografia stă în mijlocul paragrafului, între cuvinte: aici, în browserul îngust, rupe textul în două, o parte deasupra ei și restul dedesubt (într-o fereastră lată, fotografia poate sta chiar pe același rând cu textul). Exercițiul o vrea sub paragraf în orice fereastră: '+MUTA;
    if(loc==='singura')return 'Fotografia stă singură între <code>&lt;p&gt;</code> și <code>&lt;/p&gt;</code>, ca un paragraf fără text. Exercițiul o vrea fără ele: șterge <code>&lt;p&gt;</code> și <code>&lt;/p&gt;</code> din jurul ei, ca <code>&lt;img src="…"&gt;</code> să stea singur pe rândul lui, după <code>&lt;/p&gt;</code>-ul paragrafului cu text.';
    if(cate>1)return `În pagină sunt ${cate} imagini, iar exercițiul vrea una singură: păstrează doar una, pe un rând nou, după <code>&lt;/p&gt;</code>, și șterge-le pe celelalte.`;

    return 'Scrie <code>&lt;img src="…"&gt;</code> pe un rând nou, după <code>&lt;/p&gt;</code>, nu înăuntrul paragrafului.'}}};

const COPIA_SUS=()=>{let n=0,sus=false,jos=false;const k='p:pagina clasei a viii-a a',AM='<code>&lt;p&gt;Am urcat trei ore pe munte.&lt;/p&gt;</code>',H='<code>&lt;h1&gt;</code>';
  /* reparația 5: `ce` nu mai începe cu „Paragraful …” (antetul „Testul care nu trece încă: …” era citit ca o propoziție) */
  return {ce:'Copia stă imediat sub &lt;h1&gt;, iar paragraful „Pagina clasei a VIII-a A” a rămas și jos, la sfârșit',
  fn:S=>{const o=ordine(LV(S));n=o.filter(x=>x===k).length;sus=o[1]===k;jos=o.length>2&&o[o.length-1]===k;return sus&&jos&&n===2},
  get msg(){
    if(!n)return `Paragraful „Pagina clasei a VIII-a A” nu mai e în pagină. Scrie-l din nou jos, pe un rând nou, după ${AM}: <code>&lt;p&gt;Pagina clasei a VIII-a A&lt;/p&gt;</code>; apoi copiază-l sub ${H}.`;
    /* reparația 5, punctul Y: starea paginii, nu ce taste s-au apăsat („l-ai decupat (Ctrl+X)” era fals după Ctrl+C și un

    if(!jos)return `Paragraful „Pagina clasei a VIII-a A” trebuie să rămână și jos, ultimul, după ${AM}. ${n>1?'Mută acolo unul dintre ele, întreg (Ctrl+X, apoi Ctrl+V pe un rând nou).':'Copiază-l întreg (Ctrl+C) și lipește copia pe un rând nou, după '+AM+'.'}`;
    if(n>2)return `Paragraful „Pagina clasei a VIII-a A” apare de ${n} ori, dar trebuie doar de două ori: imediat sub ${H} și jos. Șterge copiile în plus, întregi, de la <code>&lt;p&gt;</code> până după <code>&lt;/p&gt;</code>.`;

    /* ---------- PASUL 4: imaginea: <img src> ---------- */
    {t:'Imaginea: <img src="…">',
     text:`<p>O imagine se pune cu eticheta <code>&lt;img&gt;</code>, iar fișierul ei îl spui cu <code>src</code>: <code>&lt;img src="bucura.jpg"&gt;</code>. <code>src</code> e un <mark>atribut</mark>: o informație scrisă în eticheta care deschide, cu semnul <code>=</code> și valoarea între ghilimele, ca <code>lang="ro"</code> de la lecția 15. Reguli:</p>
<ul><li>fișierul imaginii stă în <b>același dosar</b> cu pagina, iar în <code>src</code> scrii doar numele lui, fără dosar: <code>bucura.jpg</code>, nu <code>Documente/bucura.jpg</code>;</li>
<li>scrii numele lui <b>exact</b>, cu extensia: <code>bucura.jpg</code>, nu <code>bucura</code>. În Explorer extensia nu se vede: la Tip scrie ceva cu <b>JPG</b>, de exemplu „Fișier JPG”, deci numele se termină cu .jpg;</li>
<li><code>&lt;img&gt;</code> nu are închidere.</li></ul>`,
     exemplu:`${PRE(CORP(COD.p4_rez))}
${fig(IMG+'br-imagine.webp',664,653,'Pagina Excursia în Retezat în browser: titlul mare, titlul de secțiune Lacul Bucura, paragraful Apa era rece și limpede., iar dedesubt fotografia lacului dintre munți','Fotografia apare acolo unde ai scris <code>&lt;img&gt;</code>, sub paragraf.')}`,
     altfel:`<p>E ca un bilet pentru colegul de bancă: „caietul verde cu spirală”. Colegul caută doar pe banca voastră, așa că pe bilet nu scrii unde e: banca e dosarul paginii. Îl găsește doar dacă îl numești întreg. Un bilet fără „cu spirală” (ca un nume fără extensie) sau cu „albastru” în loc de „verde” nu-l duce la caiet.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Fotografia lacului stă în același dosar cu pagina: sub zona de scris vezi dosarul, ca în Explorer. Pune fotografia în pagină, pe un rând nou, sub paragraf.',
       start:{text:COD.p4_start,fisier:ANA,fisiere:DOSAR()},capat:true,
       teste:EWC.cuDiagnostic([
        NEATINS(COD.p4_start,['Apa era'],'scrie din nou imaginea, pe un rând nou, sub paragraf.'),
        PERECHI_P('Data viitoare, înainte de <kbd>Enter</kbd>, pui cursorul la sfârșitul rândului, după <code>&lt;/p&gt;</code>.',COD.p4_start),
        IMG_SUB_P(),
        {ce:'Imaginea se vede: în src e numele fișierului din dosar, cu extensia',fn:S=>EWC.seVede(S),msg:'Numele din <code>src</code> trebuie să fie exact numele fotografiei, cu extensia.'},
        {ce:'&lt;img&gt; e scris fără închidere',fn:S=>fara(LV(S),/<\/img\s*>/i),msg:'<code>&lt;img&gt;</code> nu are închidere: șterge <code>&lt;/img&gt;</code>.'},
        ORD]),
       rezolvare:[['scrie',COD.p4_rez]],gresit:[['scrie',COD.p4_gresit]],
       ajutor:'În dosar fotografia apare ca „bucura”, cu Tip „Fișier JPG”. Numele întreg: bucura.jpg.',
       why:'<code>src="bucura.jpg"</code> e numele exact al fișierului din același dosar, deci browserul îl găsește și desenează fotografia.'},
     inca:[
      {t:'choice',q:'În Documente sunt pagina Mariei și o fotografie care în Explorer apare ca <b>munte</b>, cu Tip „Fișier PNG”. Ce rând scrie Maria în pagină?',o:['<img src="munte.png">','<img src="munte">','<img src="munte.jpg">','<img src="Documente/munte.png">'],ok:0,
       ajutor:'Ce extensie arată coloana Tip? Și unde stă fotografia?',why:'Tip „Fișier PNG” înseamnă că numele se termină cu .png. Fotografia stă în același dosar cu pagina, deci scrii doar numele: <code>munte.png</code>.'},

    /* ---------- PASUL 5: alt și imaginea care lipsește ---------- */
    {t:'Textul alternativ: alt',
     text:`<p><code>alt</code> e al doilea atribut al imaginii. În el scrii, în câteva cuvinte, ce se vede în fotografie: <code>alt="Lacul Bucura, între munți"</code>. La ce folosește:</p>
<ul><li>dacă imaginea nu se poate arăta, de exemplu pentru că numele din <code>src</code> e greșit, browserul pune o pictogramă mică de imagine lipsă și, lângă ea, textul din <code>alt</code>. Fără <code>alt</code> rămâne doar pictograma;</li>
<li>un elev nevăzător ascultă pagina cu un program care citește cu voce tare. În locul imaginii aude textul din <code>alt</code>.</li></ul>
<p>Între atribute pui un spațiu: <code>&lt;img src="bucura.jpg" alt="Lacul Bucura"&gt;</code>. Dacă rândul e prea lung, treci cu <kbd>Enter</kbd> pe rândul următor: browserul ia Enter-ul drept spațiu.</p>`,
     exemplu:`${PRE(J(IA('bucura.png')))}
${fig(IMG+'br-imagine-lipsa.webp',480,195,'Pagina Excursia în Retezat în browser: titlul, secțiunea Lacul Bucura și paragraful; în locul fotografiei, o pictogramă mică de imagine ruptă și textul Lacul Bucura, între munți','Fișierul din dosar se numește <code>bucura.jpg</code>, nu <code>bucura.png</code>: în locul fotografiei, pictograma și textul din <code>alt</code>. Cu numele corect, după <kbd>Ctrl</kbd>+<kbd>S</kbd> și <kbd>F5</kbd>, fotografia revine.')}`,
     altfel:`<p>Gândește-te că îi povestești la telefon unui prieten ce e într-o fotografie, pe care el n-o vede. Nu-i spui „poză” sau numele fișierului, ci ce e în ea: „un lac între munți, cu stânci în față”. Asta scrii în <code>alt</code>.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'În pagină se vede doar o pictogramă mică. <b>1.</b> Dă imaginii un text alternativ care spune ce e în fotografie: după <code>src="…"</code>, un spațiu și <code>alt="…"</code>. <b>2.</b> Repară numele din <code>src</code>: uită-te în dosarul de sub zona de scris, la Tip.',
       start:{text:COD.p5_start,fisier:ANA,fisiere:DOSAR()},
       teste:EWC.cuDiagnostic([
        ALT_LAC('Imaginea are un text alternativ care spune ce se vede'),
        {ce:'Imaginea se vede: numele din src e cel din dosar',fn:S=>EWC.seVede(S),msg:'Fișierul din dosar are Tip „Fișier JPG”: numele lui se termină cu .jpg.'},
        ORD]),
       rezolvare:[['scrie',COD.p5_rez]],gresit:[['scrie',COD.p5_gresit]],
       ajutor:'Întâi alt: textul tău apare lângă pictogramă. Apoi src: .jpg în loc de .png.',
       why:'Cât timp numele era greșit, se vedeau pictograma și textul din <code>alt</code>. Cu <code>src="bucura.jpg"</code>, fotografia a apărut.'},
     inca:[
      {t:'classify',q:'Care texte alternative sunt bune pentru fotografia lacului?',cats:['Bun: spune ce se vede','Slab: nu spune ce se vede'],
       items:[['Lacul Bucura, cu stânci și munți în jur',0],['bucura.jpg',1],['poză',1],['Un lac de munte, cu apă liniștită',0]],
       ajutor:'Un nevăzător ar afla ce e în fotografie?',why:'Un text alternativ bun spune ce se vede. Numele fișierului sau „poză” nu-i spun nimic celui care nu vede imaginea.'},
      {t:'choice',q:'În eticheta <code>&lt;img&gt;</code>, Ana scrie la <code>src</code> numele <b>Lac.jpg</b>, iar la <code>alt</code> „Lacul Bucura”. În dosar, fotografia se numește <b>bucura.jpg</b>. Ce vede în browser?',o:['Pictograma de imagine lipsă și „Lacul Bucura”','Fotografia lacului, în mărimea ei','Textul „Lac.jpg”, fără nicio pictogramă','Nimic: în locul imaginii rămâne gol'],ok:0,
       ajutor:'Există un fișier Lac.jpg în dosar?',why:'În dosar nu e niciun fișier Lac.jpg, deci browserul nu are ce desena: pune pictograma de imagine lipsă și textul din <code>alt</code>.'}
     ]}
   ],
   atelier:{t:'editorweb',mod:'notepad',titlu:'Atelier: pagina despre excursie',
    intro:`<p>Mai jos ai un Notepad, folderul Documente și un browser, simulate. Deasupra lor sunt <strong>testele</strong>: se bifează singure când faci ce cer. La final apasă <b>Verifică</b>. Pe un ecran mic, treci de la o fereastră la alta cu butoanele de sub ele.</p>`,
    q:`În Notepad e o filă goală. În Documente sunt pagina ta de la lecția 15 și fotografia lacului. <b>1.</b> Deschide pagina de la lecția 15. Comanda <b>Fișier › Deschideți</b> (Open), sau <kbd>Ctrl</kbd>+<kbd>O</kbd>, aduce în Notepad un fișier salvat, ca să-l schimbi. În fereastra <b>Deschidere</b>: în stânga, <b>Documente</b>; dacă pagina ta nu apare în listă, alege jos, la tip, <b>Toate fișierele (*.*)</b>; clic pe pagina ta, apoi butonul <b>Deschidere</b> (Open). <b>2.</b> Salvează pagina cu nume nou, ca cea de la lecția 15 să rămână neschimbată: <b>Fișier › Salvați ca</b> (<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>), în Documente, cu numele tău după modelul <code>Popescu_Ana_8A_lectia16.html</code>. <b>3.</b> Fă din ea pagina de mai jos: pe filă și în titlul mare <b>Excursia în Retezat</b>, apoi secțiunea, două paragrafe și fotografia, cu text alternativ. <b>4.</b> Salvează și deschide pagina în browser (în Documente, dublu-clic pe ea; pe telefon, două atingeri repezi).${PRE(COD.atelier)}`,

     {ce:'O pagină .html în Documente, cu numele, prenumele, clasa ta și lectia16, salvată în UTF-8',fisier:Object.assign({cod:'UTF-8'},AT),msg:'Fișier › Salvați ca: Documente, numele tău cu lectia16 și .html, Toate fișierele, UTF-8, Salvare.'},
     {ce:'Pe filă și în titlul mare scrie „Excursia în Retezat”',fn:(S,U)=>{const s=ES.src(S,U,AT);return !!s&&N(ES.titlu(s))==='excursia in retezat'&&JSON.stringify(textele(s,'h1'))===JSON.stringify(['excursia in retezat'])},faraOraData:true,msg:'Schimbă textul și în <code>&lt;title&gt;</code>, și în <code>&lt;h1&gt;</code>, apoi Ctrl+S.'},

     {ce:'Cel puțin două paragrafe cu text',fn:(S,U)=>{const s=ES.src(S,U,AT);return !!s&&EWC.paragrafe(s).length>=2},msg:'Fiecare paragraf stă între <code>&lt;p&gt;</code> și <code>&lt;/p&gt;</code>.'},

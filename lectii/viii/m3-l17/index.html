/* tema: fâșia de sus e un mic tabel (cap + un rând) lângă o listă cu buline, scrise cu etichetele lor */
.banda{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-family:var(--fm);font-size:.72rem;color:var(--ink2);padding:3px 8px;border-bottom:1px dashed var(--line)}
.banda .grila{display:inline-grid;grid-template-columns:auto auto auto;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.banda .grila span{padding:0 6px;border-right:1px solid var(--line)}
.banda .grila span:nth-child(3n){border-right:0}
.banda .grila b{font-weight:600;color:var(--ink)}
.banda .tg{color:var(--accent)}
h1,h2{letter-spacing:-.01em}
pre.rand{font-family:var(--fm);background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:.4em 0;white-space:pre;overflow-x:auto;tab-size:8;-moz-tab-size:8;line-height:1.35}
.captura figcaption a{display:inline-block;padding:6px 0}
#body .ew .lv .br-corp{min-height:15em}   /* pagina desenată alături de cod: titlul și tot tabelul (4 rânduri) se văd fără derulare, și pe telefon */

const P={editare:'Operații de editare a elementelor de conținut (paragraf, imagini, tabele, liste, legături): inserare, ștergere, mutare, copiere'};

/* imagini refolosite de pe sit: fotografia din lecția 10 (Wikimedia Commons, CC BY-SA 2.0) și captura din jocul web-viii (Chrome) */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const J=a=>a.join('\n');
const PRE=s=>`<pre class="rand">${X(s)}</pre>`;
const ES=window.EditorWebSchelet, TB=window.EditorWebTabele;
const LV=S=>S.live.text;
const DT='<!DOCTYPE html>', HL='<html lang="ro">';
/* scheletul de la lecția 15, indentat, cu titlul de pe filă și rândurile din corp */
const SCH=(titlu,corp)=>J([DT,HL,'\t<head>','\t\t<meta charset="utf-8">','\t\t<title>'+titlu+'</title>','\t</head>','\t<body>',...corp,'\t</body>','</html>']);
/* scheletul în ordine (fără etichetele de listă și de tabel, pe care le judecă testul „inchise”) */
const fara=s=>String(s).replace(/<\/?(ul|ol|li|table|tr|td|th)\b[^>]*>/gi,'');
const ORD={ce:'Scheletul paginii a rămas întreg și în ordine',fn:S=>ES.ordine(fara(LV(S))),msg:'Nu șterge și nu muta rândurile scheletului: &lt;head&gt;, &lt;/head&gt;, &lt;body&gt;, &lt;/body&gt;, &lt;/html&gt;.'};
const INCH={ce:'Fiecare etichetă de listă și de tabel are perechea ei',fn:S=>TB.inchise(LV(S)),msg:'Caută perechea fiecărei etichete: &lt;ul&gt; cu &lt;/ul&gt;, &lt;li&gt; cu &lt;/li&gt;, &lt;tr&gt; cu &lt;/tr&gt;, &lt;td&gt; cu &lt;/td&gt;.'};
const H='\t\t', R3='\t\t\t', R4='\t\t\t\t';
/* un rând de tabel: <tr>, fiecare celulă pe rândul ei (mai la dreapta), </tr> — rândurile scurte încap și în fereastra îngustă a pașilor */
const tr=(tag,a,i)=>{i=i==null?R3:i;return J([i+'<tr>',...a.map(x=>`${i}\t<${tag}>${x}</${tag}>`),i+'</tr>'])};
const trb=(tag,a)=>tr(tag,a,'\t');   /* pentru casetele „Uite cum”, cu <table> la margine */

  `Scrie pagina de mai jos: scheletul de la lecția 15, titlul mare și un tabel mic, cu capul tabelului și rândul cu 8:00. Fiecare celulă stă pe rândul ei. La începutul rândurilor mutate la dreapta apasă <kbd>Tab</kbd> de câte ori vezi. Ghilimelele și semnele <code>&lt;</code>, <code>&gt;</code> le scrii ca la lecțiile 14 și 15. Literele ă, â și ț sunt pe tastatura românească (ț e tasta de lângă <kbd>Enter</kbd>). Dacă nu-ți ies, scrie fără ele: tabelul se desenează la fel.${PRE(COD.lab1)}`,
  'Apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>. În fereastra <b>Salvare ca</b> (Save As): în stânga, <b>Documente</b> (Documents); la <b>Nume fișier</b> (File name), numele, prenumele, clasa și lectia17, cu <b>.html</b> la sfârșit, de exemplu <code>Popescu_Ana_8A_lectia17.html</code>; la <b>Salvare cu tipul</b> (Save as type), <b>Toate fișierele (*.*)</b> (All files); la <b>Codificare</b> (Encoding), <b>UTF-8</b>; apoi <b>Salvare</b> (Save). Dacă apare „… există deja. Îl înlocuiți?”, apasă <b>Nu</b> (No) și pune o cifră la sfârșitul numelui: <code>Popescu_Ana_8A_lectia17_2.html</code>.',
  'Deschide <b>Explorer</b> (File Explorer): tasta Windows + <kbd>E</kbd>. Clic pe <b>Documente</b> în stânga, apoi dublu-clic pe fișierul tău. În browser trebuie să vezi titlul mare <b>Orarul meu</b> și, sub el, tabelul cu trei coloane: sus <b>Ora</b>, <b>Luni</b>, <b>Marți</b>, îngroșate; dedesubt <b>8:00</b>, <b>Română</b>, <b>Engleză</b>, fiecare sub capul coloanei ei. Linii între celule nu apar: e normal. Dacă ceva nu e la locul lui, numără celulele pe fiecare rând și caută perechea fiecărei etichete; apoi <kbd>Ctrl</kbd>+<kbd>S</kbd> în Notepad și <kbd>F5</kbd> în browser.',
  `Rândul cu 9:00 îl faci prin copiere. În Notepad, selectează cu mouse-ul <b>rândul tabelului</b> cu 8:00: cele cinci rânduri din Notepad, de la începutul rândului <code>&lt;tr&gt;</code> până după <code>&lt;/tr&gt;</code>. Apasă <kbd>Ctrl</kbd>+<kbd>C</kbd>, dă clic la sfârșitul acelui <code>&lt;/tr&gt;</code>, apasă <kbd>Enter</kbd>, apoi <kbd>Ctrl</kbd>+<kbd>V</kbd>. În rândul lipit schimbă cele trei texte: <b>9:00</b>, <b>Matematică</b>, <b>Istorie</b>. Rândul nou arată așa:${PRE(COD.lab_rand2)}<kbd>Ctrl</kbd>+<kbd>S</kbd> în Notepad, <kbd>F5</kbd> în browser: tabelul are acum trei rânduri, cu fiecare materie sub ziua ei.`,
  'Experimentul: în Notepad, la rândul tabelului cu 8:00, selectează cu mouse-ul rândul din Notepad de sub <code>&lt;td&gt;8:00&lt;/td&gt;</code>, adică <code>&lt;td&gt;Română&lt;/td&gt;</code>, și apasă <kbd>Delete</kbd>. <kbd>Ctrl</kbd>+<kbd>S</kbd>, apoi <kbd>F5</kbd> în browser: pe rândul cu 8:00, materia de marți a trecut sub <b>Luni</b>. Așa arată o celulă lipsă.',
  'Pune celula la loc. Dacă a rămas un rând gol, scrie pe el <code>&lt;td&gt;Română&lt;/td&gt;</code>. Dacă rândul a dispărut, dă clic la sfârșitul rândului <code>&lt;td&gt;8:00&lt;/td&gt;</code>, apasă <kbd>Enter</kbd>, de patru ori <kbd>Tab</kbd>, apoi scrie celula. <kbd>Ctrl</kbd>+<kbd>S</kbd> în Notepad, <kbd>F5</kbd> în browser: fiecare materie e iar sub ziua ei. Apoi <kbd>Ctrl</kbd>+<kbd>U</kbd> în browser: vezi rândurile tale, cu tabelul. Închide fila sursei cu × de pe ea.',
  `<b>Dacă mai ai timp</b> (altfel treci la pasul următor): o listă sub tabel. În Notepad, dă clic la sfârșitul rândului <code>&lt;/table&gt;</code>, apasă <kbd>Enter</kbd> și scrie rândurile de mai jos, cu Tab-urile lor:${PRE(COD.lab_lista)}<kbd>Ctrl</kbd>+<kbd>S</kbd> în Notepad, <kbd>F5</kbd> în browser: sub tabel apar propoziția și trei rânduri, fiecare cu o bulină în față. Dacă bulinele lipsesc, verifică <code>&lt;ul&gt;</code> și <code>&lt;/ul&gt;</code>.`,
  'La sfârșit, calculatorul rămâne curat pentru colegul următor: în Notepad închide pe rând <b>toate</b> filele, din meniu: <b>Fișier › Închideți fila</b>, până se închide Notepad. Dacă la fila unui coleg te întreabă „Salvați modificările…?”, apasă <b>Nu salvați</b>: ce a salvat el în Documente rămâne neatins. Nu închide Notepad cu X-ul ferestrei: îi redeschide colegului filele. Dacă Notepad nu are file (Windows 10), după ce ai salvat îl închizi cu X. În browser închide fila paginii. Fișierul tău rămâne în Documente.'
];

  ancoraText:'Programa (OMEN 3393/2017): CS.1.2, CS.3.2 · unitatea VIII-U2 „Pagini web” · lecția 17 · conținutul: „Operații de editare a elementelor de conținut (paragraf, imagini, tabele, liste, legături): inserare, ștergere, mutare, copiere” (aici: liste și tabele)',
  intro:`<p>Lecția 17. Afli cum pui în pagină o listă, cu buline sau numerotată, și un tabel, cu rânduri și coloane, ca un orar. Le scrii în Notepad și le vezi în browser.</p>

<li>lecția 16, „Conținutul paginii…”: paragraful <code>&lt;p&gt;</code> (îl folosești gata scris); <kbd>Enter</kbd> din Notepad nu trece textul pe alt rând în browser;</li>
<li>lecția 4, „Adresa de celulă. Selectare, copiere, mutare, ștergere”: <kbd>Ctrl</kbd>+<kbd>C</kbd>, <kbd>Ctrl</kbd>+<kbd>X</kbd>, <kbd>Ctrl</kbd>+<kbd>V</kbd>;</li>
<li>lecția 2, „Interfața aplicației de calcul tabelar…”: rândurile, coloanele și celula din Excel.</li></ul>`,
  cum:`<p><b>Cum lucrezi:</b> după „La ce folosește” urmează 5 pași scurți, fiecare cu „Încearcă tu”, într-un Notepad și un browser simulate în pagină. Apoi atelierul, apoi același lucru la calculatorul din laborator, iar la sfârșit 5 întrebări.</p>
<p><b>Obligatoriu:</b> primul „Încearcă tu” din fiecare pas, primul atelier, laboratorul (fără pasul „Dacă mai ai timp”) și cele 5 întrebări. Butoanele „Încă un exercițiu” și al doilea atelier sunt pentru cine termină mai repede.</p>
<p><b>Când mai sunt 10 minute din oră</b> și n-ai terminat laboratorul: salvează (<kbd>Ctrl</kbd>+<kbd>S</kbd>), închide filele din Notepad ca la ultimul pas al laboratorului și treci la cele 5 întrebări.</p>`,

  tipuri:{editorweb:EditorWeb},

   pasi:[
    /* ---------- PASUL 0: la ce folosește (fără acțiuni) ---------- */
    {t:'La ce folosește',
     text:`<p>În gară, plecările trenurilor stau pe un panou mare. Fiecare tren are rândul lui. Pe coloane stau ora, numărul trenului și orașul în care merge. Deasupra coloanelor scrie ce e în ele, de exemplu ORA. Panoul e un <b>tabel</b>.</p>
<p>O listă de cumpărături e mai simplă: lucrurile, scrise unul sub altul. Paginile web au și ele liste și tabele. Azi le faci pe amândouă.</p>
${fig('../m2-l10/img/mersul-trenurilor.webp',576,488,'Panoul Mersul trenurilor de călători din Gara de Nord: coloane de trenuri, fiecare tren pe rândul lui, cu ora în stânga; deasupra coloanelor scrie ORA','Mersul trenurilor în Gara de Nord, București: un tabel, cu un tren pe fiecare rând. Fotografie: Dave Collier, <a href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noopener">CC BY-SA 2.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Plecari_Sosiri_(40494416311).jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată, aceeași licență).')}`},

<ul><li><code>&lt;ul&gt;</code> … <code>&lt;/ul&gt;</code> cuprind toată lista;</li>

<p>Numele vin din engleză: „unordered list” și „list item”. Bulinele le pune browserul singur: tu scrii doar textul. Ca la lecția 15, muți rândurile listei la dreapta cu <kbd>Tab</kbd>.</p>`,
     exemplu:`${PRE(COD.p1_bloc)}${TB.randare(COD.p1_ex,150)}<p>Trei <code>&lt;li&gt;</code> în <code>&lt;ul&gt;</code>: trei rânduri, fiecare cu bulina lui.</p>`,

     incearca:{t:'editorweb',mod:'live',

    {t:'Lista numerotată: <ol>',
     text:`<p>Când ordinea contează, de exemplu pașii unei rețete, folosești <mark>lista numerotată</mark>, numită și listă ordonată: <code>&lt;ol&gt;</code> … <code>&lt;/ol&gt;</code>, de la „ordered list”. Fiecare pas stă tot între <code>&lt;li&gt;</code> și <code>&lt;/li&gt;</code>.</p>

      {t:'editorweb',mod:'live',

    /* ---------- PASUL 3: tabelul ---------- */
    {t:'Tabelul: <table>, <tr>, <td>',
     text:`<p>Un <mark>tabel</mark> așază datele pe rânduri și coloane, ca foaia din Excel de la lecția 2. În pagina web îl scrii rând cu rând:</p>
<ul><li><code>&lt;table&gt;</code> … <code>&lt;/table&gt;</code> cuprind tot tabelul;</li>
<li><code>&lt;tr&gt;</code> … <code>&lt;/tr&gt;</code> e un <mark>rând</mark>;</li>
<li>în rând, fiecare <code>&lt;td&gt;</code> … <code>&lt;/td&gt;</code> e o <mark>celulă</mark>.</li></ul>
<p>Coloanele nu se scriu separat: câte celule are fiecare rând, atâtea coloane are tabelul. Browserul nu desenează linii între celule: vezi textul așezat în coloane.</p>
<p>Alegi tabelul când despre fiecare lucru ai mai multe date, ca ora și materia. Pentru lucruri simple, unul sub altul, ajunge o listă.</p>`,
     exemplu:`${PRE(COD.p3_bloc)}${TB.randare(COD.p3_ex,70)}<p>Două <code>&lt;tr&gt;</code>, deci două rânduri. Câte trei celule în fiecare, deci trei coloane. În Notepad, fiecare celulă stă pe rândul ei, mai la dreapta decât <code>&lt;tr&gt;</code>: între <code>&lt;tr&gt;</code> și <code>&lt;/tr&gt;</code> numeri ușor celulele.</p>`,
     altfel:`<p>Gândește-te la panoul din gară, de la început. <code>&lt;table&gt;</code> e tot panoul. Fiecare <code>&lt;tr&gt;</code> e rândul unui tren: primul scris e sus, următorul sub el. În rând, celulele sunt ora, trenul și orașul, de la stânga la dreapta. Orele, scrise una sub alta pe toate rândurile, formează o coloană.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Adaugă în orar un al treilea rând: <b>10:00</b>, <b>TIC</b>, <b>Sport</b>. Dă clic la sfârșitul ultimului rând <code>&lt;/tr&gt;</code> și apasă <kbd>Enter</kbd> (pe telefon, tasta ↵). Scrie <code>&lt;tr&gt;</code>, apoi, fiecare pe rândul ei, cele trei celule, între <code>&lt;td&gt;</code> și <code>&lt;/td&gt;</code>, apoi <code>&lt;/tr&gt;</code>.',
       start:{text:COD.p3_start,fisier:ANA},

    /* ---------- PASUL 4: capul tabelului ---------- */
    {t:'Capul tabelului: <th>',
     text:`<p>Primul rând al unui tabel spune ce e în fiecare coloană, ca ORA pe panoul din gară. El e <mark>capul tabelului</mark>.</p>
<p>Celulele lui le scrii cu <code>&lt;th&gt;</code> … <code>&lt;/th&gt;</code> în loc de <code>&lt;td&gt;</code> … <code>&lt;/td&gt;</code>, de la „table header”. Browserul le scrie îngroșat, la mijlocul coloanei. Celelalte rânduri rămân cu <code>&lt;td&gt;</code>.</p>
<p>Nu-l confunda cu antetul paginii de la lecția 15, <code>&lt;head&gt;</code>. Capul tabelului stă în corp, în tabel, și se vede în pagină.</p>`,
     exemplu:`<p>Primul rând al orarului, scris ca cap de tabel:</p>${PRE(COD.p4_bloc)}${TB.randare(COD.p4_ex,90)}<p>Sus, <b>Ora</b>, <b>Luni</b> și <b>Marți</b> sunt îngroșate și așezate la mijlocul coloanei.</p>`,
     altfel:`<p>La un concurs, foaia cu rezultatele are sus Nume, Clasa, Punctaj. Fără rândul acesta, n-ai ști ce înseamnă numerele de dedesubt. Rândul de sus e capul tabelului.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Fă din primul rând al orarului capul tabelului: la celulele cu Ora, Luni și Marți, schimbă fiecare <code>&lt;td&gt;</code> în <code>&lt;th&gt;</code> și fiecare <code>&lt;/td&gt;</code> în <code>&lt;/th&gt;</code>. Celelalte rânduri ale tabelului rămân cum sunt.',
       start:{text:COD.p4_start,fisier:ANA},
       teste:TB.cuDiagnostic([{ce:'Primul rând are trei celule &lt;th&gt;: Ora, Luni, Marți',fn:S=>TB.tabel(LV(S),{randuri:3,coloane:3,cap:true,rand:{0:['Ora','Luni','Marți']}}),msg:'Pe primul rând, toate trei celulele cu &lt;th&gt;; pe celelalte, &lt;td&gt;.'},
        INCH,ORD]),
       rezolvare:[['scrie',COD.p4_rez]],gresit:[['scrie',COD.p4_gresit]],
       ajutor:'În primul rând al tabelului sunt șase etichete de schimbat: trei care deschid și trei care închid.',
       why:'Acum primul rând e capul tabelului: browserul îl scrie îngroșat și la mijloc.'},

       ajutor:'Unde se vede capul tabelului?',why:'Fals. Capul tabelului e primul rând al tabelului, deci stă în corp, în <code>&lt;table&gt;</code>. Antetul <code>&lt;head&gt;</code> are doar informații despre pagină.'},
      {t:'editorweb',mod:'live',

       start:{text:COD.p4b_start,fisier:ANA},

       rezolvare:[['scrie',COD.p4b_rez]],gresit:[['scrie',COD.p4b_gresit]],
       ajutor:'Rândul nou intră imediat după &lt;table&gt;, înaintea rândului cu Moldoveanu.',
       why:'Rândul de sus, cu <code>&lt;th&gt;</code>, spune ce e în fiecare coloană.'}
     ]},

    /* ---------- PASUL 5: greșelile care se văd ---------- */
    {t:'Greșeli în tabele și liste: cum le găsești',
     text:`<p>Browserul iartă unele greșeli: fără <code>&lt;/li&gt;</code>, <code>&lt;/td&gt;</code> sau <code>&lt;/tr&gt;</code>, pagina arată la fel. Tu scrii totuși fiecare pereche: așa vezi ușor unde se termină fiecare element, iar pagina ta nu depinde de cât iartă browserul. Alte greșeli se văd:</p>
<ul><li><b>o celulă lipsă</b>: celulele din dreapta ei trec în coloana din stânga;</li>
<li><b>o celulă în plus</b>: iese în dreapta tabelului;</li>
<li><b>fără <code>&lt;/table&gt;</code></b>: ce ai scris după tabel urcă deasupra lui;</li>
<li><b>fără <code>&lt;/ul&gt;</code></b>: ce ai scris după listă intră în ea, mutat la dreapta.</li></ul>
<p>Metoda: 1. numeri celulele pe fiecare rând; 2. cauți perechea fiecărei etichete; 3. salvezi, reîmprospătezi și te uiți din nou.</p>`,
     exemplu:`<p>Rândul cu 9:00 din orar are doar două celule:</p>${PRE(COD.p5_bloc)}${TB.randare(COD.p5_ex,90)}<p><b>Istorie</b> a ajuns sub <b>Luni</b>, deși e marți. Celula de luni lipsește.</p>`,
     altfel:`<p>La cinema, pe un rând de scaune, fiecare spectator are locul lui, numărat de la stânga. Dacă un loc rămâne neocupat și toți din dreapta lui se mută un scaun spre stânga, fiecare ajunge pe locul altuia.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Luni la 9:00 e <b>Matematică</b>, iar marți e <b>Istorie</b>. În pagină, Istorie a ajuns sub Luni. Adaugă celula care lipsește, ca Istorie să ajungă sub Marți.',
       start:{text:COD.p5_start,fisier:ANA},
       teste:TB.cuDiagnostic([{ce:'Fiecare rând are trei celule',fn:S=>TB.tabel(LV(S),{randuri:3,coloane:3}),msg:'Numără celulele pe rândul cu 9:00: trebuie să fie trei, ca pe celelalte.'},
        {ce:'Pe rândul cu 9:00: 9:00, Matematică, Istorie',fn:S=>TB.tabel(LV(S),{rand:{2:['9:00','Matematică','Istorie']}}),msg:'Celula nouă intră între 9:00 și Istorie: &lt;td&gt;Matematică&lt;/td&gt;.'},
        INCH,ORD]),
       rezolvare:[['scrie',COD.p5_rez]],gresit:[['scrie',COD.p5_gresit]],
       ajutor:'Celula lipsă e cea de luni. Ea stă între celula cu 9:00 și cea cu Istorie.',
       why:'Cu trei celule pe rând, fiecare materie stă iar sub ziua ei.'},
     inca:[
      {t:'editorweb',mod:'live',
       q:'Propoziția „Orarul e valabil din ianuarie.” e scrisă după tabel, dar în pagină a urcat deasupra lui. Repară.',
       start:{text:COD.p5b_start,fisier:ANA},
       teste:TB.cuDiagnostic([{ce:'Propoziția apare sub tabel',fn:S=>TB.dupaTabel(LV(S),'Orarul e valabil din ianuarie'),msg:'Ce lipsește la sfârșitul tabelului?'},INCH,ORD]),
       rezolvare:[['scrie',COD.p5b_rez]],gresit:[['scrie',COD.p5b_start]],
       ajutor:'Tabelul se deschide cu &lt;table&gt;. Se și închide?',
       why:'Lipsea <code>&lt;/table&gt;</code>. Fără el, browserul a mutat propoziția deasupra tabelului.'},
      {t:'editorweb',mod:'live',
       q:'Pe rândul cu 8:00, <b>Sport</b> iese în dreapta tabelului: e o celulă în plus. Șterge-o, cu tot cu <code>&lt;td&gt;</code> și <code>&lt;/td&gt;</code>.',
       start:{text:COD.p5c_start,fisier:ANA},
       teste:TB.cuDiagnostic([{ce:'Fiecare rând are trei celule, fără Sport',fn:S=>TB.tabel(LV(S),{randuri:3,coloane:3,cap:true})&&!/sport/i.test(LV(S)),msg:'Șterge toată celula &lt;td&gt;Sport&lt;/td&gt;.'},INCH,ORD]),
       rezolvare:[['scrie',COD.p5c_rez]],gresit:[['scrie',COD.p5c_start]],
       ajutor:'Celula în plus e ultima de pe rândul cu 8:00.',
       why:'Toate rândurile au acum câte trei celule, deci tabelul are trei coloane.'},
      {t:'editorweb',mod:'live',
       q:'Propoziția „Ne vedem la ora 8, la școală.” a intrat în listă și e mutată la dreapta. Repară lista.',
       start:{text:COD.p5d_start,fisier:ANA},

       rezolvare:[['scrie',COD.p5d_rez]],gresit:[['scrie',COD.p5d_start]],
       ajutor:'Lista s-a deschis cu &lt;ul&gt;. Unde e &lt;/ul&gt;?',

   atelier:{t:'editorweb',mod:'notepad',titlu:'Atelier: lista și programul excursiei',
    intro:`<p>Mai jos ai un Notepad, folderul Documente și un browser, simulate. Deasupra lor sunt <strong>testele</strong>: se bifează singure când faci ce cer. La final apasă <b>Verifică</b>. Pe un ecran mic, treci de la o fereastră la alta cu butoanele de sub ele.</p>`,
    q:`<b>1.</b> Pagina ta, <code>${ANA}</code>, e deschisă în Notepad. După titlul mare, adaugă o listă cu buline, cu cel puțin trei lucruri pe care le iei în excursie (scrii tu ce). <b>2.</b> Sub listă, adaugă programul excursiei: un tabel cu 3 rânduri și 3 coloane. Pe primul rând, capul tabelului: <b>Ora</b>, <b>Ce facem</b>, <b>Unde</b>. Pe celelalte două rânduri, ce vrei tu. <b>3.</b> Mută rândurile noi la dreapta, ca pe celelalte din corp. <b>4.</b> Salvează (<kbd>Ctrl</kbd>+<kbd>S</kbd>). <b>5.</b> Deschide pagina în browser: în Documente, dublu-clic pe ea (pe telefon, atinge-o de două ori, repede).`,
    start:{fisiere:{Documente:[{n:ANA,t:COD.at_start.replace(/\n/g,'\r\n')+'\r\n'}]},notepad:{file:[{n:ANA,dosar:'Documente'}]},dreapta:'explorer'},
    teste:TB.cuDiagnostic([
     {ce:'Pagina salvată are o listă cu buline, cu cel puțin trei lucruri',fn:(S,U)=>{const s=SRC(S,U);return !!s&&TB.lista(s,{tip:'ul',min:3})},faraOraData:true,msg:'După titlu: &lt;ul&gt;, cel puțin trei rânduri &lt;li&gt;…&lt;/li&gt;, apoi &lt;/ul&gt;. Apoi Ctrl+S.'},
     {ce:'Tabelul are 3 rânduri, fiecare cu 3 celule cu text',fn:(S,U)=>{const s=SRC(S,U);return !!s&&TB.tabel(s,{randuri:3,coloane:3})},msg:'Trei rânduri &lt;tr&gt;…&lt;/tr&gt;, fiecare cu trei celule. Apoi Ctrl+S.'},
     {ce:'Primul rând e capul tabelului: Ora, Ce facem, Unde, în celule &lt;th&gt;',fn:(S,U)=>{const s=SRC(S,U);return !!s&&TB.tabel(s,{randuri:3,coloane:3,cap:true,rand:{0:['Ora','Ce facem','Unde']}})},msg:'Pe primul rând al tabelului: &lt;th&gt;Ora&lt;/th&gt;&lt;th&gt;Ce facem&lt;/th&gt;&lt;th&gt;Unde&lt;/th&gt;; pe celelalte, &lt;td&gt;.'},
     /* J1-m3: testele 4 și 5 se bifează doar după ce există lista și tabelul (altfel erau bifate la pornire) */
     {ce:'Fiecare etichetă are perechea ei, iar scheletul a rămas întreg',fn:(S,U)=>{const s=SRC(S,U);return !!s&&TB.liste(s).length>0&&TB.tabele(s).length>0&&TB.inchise(s)&&ES.ordine(s)},faraOraData:true,msg:'Caută perechea fiecărei etichete și nu șterge rândurile scheletului.'},
     {ce:'Rândurile din corp stau mai la dreapta decât &lt;body&gt;',fn:(S,U)=>{const s=SRC(S,U);return !!s&&TB.liste(s).length>0&&TB.tabele(s).length>0&&ES.indentat(s)},msg:'La începutul rândurilor noi apasă Tab: de două ori pentru &lt;ul&gt; și &lt;table&gt;, de trei ori pentru &lt;li&gt; și &lt;tr&gt;, de patru ori pentru celule.',msgTactil:'Pe telefon nu ai Tab: la începutul rândurilor noi pune câte două spații pentru fiecare Tab.'},
     {ce:'Browserul arată pagina ta, cu tabelul',browser:{fisier:AT},el:'table',msg:'Deschide pagina din Documente (dublu-clic). Dacă ai schimbat ceva după, Ctrl+S în Notepad și F5 în browser.'},
     {ce:'Pagina din browser e cea salvată acum',laZi:AT,msg:'Ai schimbat fișierul după ce l-ai deschis: F5 în browser.'}],{spec:AT}),
    rezolvare:[['scrie',COD.at_rez],['salveaza'],['deschide','Documente/'+ANA]],
    gresit:[['scrie',COD.at_gresit],['salveaza'],['deschide','Documente/'+ANA]],
    ajutor:'Pe rând: lista (&lt;ul&gt;, trei &lt;li&gt;, &lt;/ul&gt;); tabelul (&lt;table&gt;, rândul cu &lt;th&gt;, două rânduri cu &lt;td&gt;, &lt;/table&gt;); '+(ES.tactil()?'spații la început':'Tab-uri la început')+'; Ctrl+S; în Documente, dublu-clic pe fișier.',
    why:'Pagina ta are o listă cu buline și un tabel cu cap, salvate și deschise în browser.',
    solutieText:'pagina Popescu_Ana_8A_lectia17.html are lista (apă, pelerină, sandviș) și programul (Ora, Ce facem, Unde; 9:00 Plecăm Școala; 12:00 Masa Cabana), salvată și deschisă în browser.',
    inca:[
     {t:'editorweb',mod:'notepad',titlu:'Atelier: repară pagina și lasă calculatorul curat',
      q:'Pagina ta s-a stricat: în browser, tabelul a intrat în listă, mutat la dreapta, iar pe ultimul rând Cabana a ajuns sub Ce facem. La 12:00 facem <b>Masa</b>, la <b>Cabana</b>. <b>1.</b> Repară pagina în Notepad. <b>2.</b> Fă ca browserul să arate pagina reparată. <b>3.</b> La final, închide fila din Notepad cu <b>Fișier › Închideți fila</b>, nu cu X-ul ferestrei.',

       {ce:'Pe ultimul rând: 12:00, Masa, Cabana',fn:(S,U)=>{const s=ES.src(S,U,{exact:ANA});return !!s&&TB.tabel(s,{randuri:3,coloane:3,cap:true,rand:{2:['12:00','Masa','Cabana']}})},msg:'Numără celulele pe ultimul rând. Apoi Ctrl+S.'},
       {ce:'Fiecare etichetă are perechea ei',fn:(S,U)=>{const s=ES.src(S,U,{exact:ANA});return !!s&&TB.inchise(s)&&ES.ordine(s)},faraOraData:true,msg:'Caută perechea fiecărei etichete.'},
       {ce:'Pagina din browser e cea salvată acum',laZi:{exact:ANA},msg:'După Ctrl+S în Notepad: clic pe pagină, apoi F5.'},
       {ce:'Notepad e închis și nu-ți mai redeschide fila',npCurat:true,faraDiagnostic:true,msg:'Fișier › Închideți fila. X-ul ferestrei păstrează fila pentru data viitoare.'}],{spec:{exact:ANA}}),
      rezolvare:[['scrie',COD.at_rez],['salveaza'],['f5'],['inchideFila']],
      gresit:[['scrie',COD.at_rez],['salveaza'],['f5'],['inchideFereastra']],
      ajutor:'Două lucruri lipsesc: închiderea listei și o celulă pe ultimul rând. Apoi: Ctrl+S, F5, Fișier › Închideți fila.',
      why:'Lista închisă la locul ei lasă tabelul în afara ei, iar celula Masa pune Cabana sub Unde. Notepad, închis din filă, pornește curat pentru colegul următor.'}
    ]},

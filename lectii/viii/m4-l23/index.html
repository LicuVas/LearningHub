<script>
/* conținutul programei (OMEN 3393/2017), textul exact din curriculum.json */
const P={sir:'Șir de valori (noțiuni introductive)'};
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG='../m4-l23/img/';
const S=(v,o)=>SirValori.html(v,o);
/* șirul-exemplu al pașilor (inventat): temperaturile de dimineață dintr-o săptămână de martie, de luni până duminică.
   Ales ca nicio valoare să nu fie egală cu poziția ei; valoarea 4 stă pe poziția 7, iar pe poziția 4 e 5. */
const ZILE=['luni','marți','miercuri','joi','vineri','sâmbătă','duminică'];
const T=[3,-1,0,5,2,-2,4];
const PATRU=['Câte…?','Cât fac împreună…?','Cel mai mare / cel mai mic…?','Toate…? / Măcar unul…?'];

const PROVOCARE=[
  'Deschide Excel și alege <b>Registru de lucru necompletat (Blank workbook)</b>. Dacă Excel e deja deschis, apasă <kbd>Ctrl</kbd>+<kbd>N</kbd>. Vezi: o foaie goală; caseta de nume, în stânga, arată <b>A1</b>.',
  'Salvează de la început: apasă <kbd>F12</kbd> (pe unele laptopuri <kbd>Fn</kbd>+<kbd>F12</kbd>), adică Salvare ca (Save As). În stânga alege <b>Documente (Documents)</b>. La <b>Nume fișier (File name)</b> scrie numele, prenumele și clasa ta, apoi lectia23, de exemplu <code>Popescu_Ana_8A_lectia23</code> (în locul lui 8A scrii clasa ta), și apasă <b>Salvare (Save)</b>. Dacă Excel spune că numele există deja (fereastra <i>Confirm Save As</i>: „… already exists. Do you want to replace it?”), fișierul e al unui coleg: apasă <b>Nu (No)</b> (sau <b>Anulare</b>) și pune o cifră la sfârșitul numelui tău, de exemplu <code>Popescu_Ana_8A_lectia23_2</code>. Vezi: sus, pe bara de titlu, numele fișierului tău. Dacă profesorul vă spune alt loc sau alt nume, faci cum spune el.',
  'Pozițiile: clic pe <b>A1</b> și scrie <b>Poziția</b>. Apasă <kbd>Tab</kbd>, scrie <b>1</b>, apasă <kbd>Tab</kbd>, scrie <b>2</b> și tot așa, până la <b>7</b>. După 7 apasă <kbd>Enter</kbd>. Vezi: numerele de la 1 la 7 în celulele de la B1 la H1, la dreapta în celule, iar caseta de nume arată <b>A2</b>.',
  `Valorile: în <b>A2</b> scrie <b>Grade</b>. Apoi, cu <kbd>Tab</kbd> după fiecare, scrie temperaturile de dimineață ale săptămânii: <b>3</b>, <b>-1</b>, <b>0</b>, <b>5</b>, <b>2</b>, <b>-2</b>, <b>4</b>. Minusul e tasta cu liniuța. După ultima apasă <kbd>Enter</kbd>. Scrie doar numărul, fără cuvântul „grade”. Vezi: fiecare temperatură stă sub poziția ei, la dreapta în celulă, ca mai jos. Un număr lipit de stânga a fost luat drept text (lecția 5): alege celula și scrie din nou doar numărul.${fig(IMG+'excel-sir.webp',760,136,'Excel: în A1 Poziția și în B1-H1 numerele 1-7; în A2 Grade și în B2-H2 temperaturile 3, -1, 0, 5, 2, -2, 4, la dreapta în celule; celula activă A3','Așa arată foaia după pașii 3 și 4 (Excel-ul din imagine e în engleză).')}`,
  `Citește șirul din foaie și scrie în caiet, sub titlul <b>Lecția 23</b>: (a) lungimea șirului, adică ultima poziție de pe rândul 1; (b) valoarea elementului de pe poziția 4, din celula de sub numărul 4; (c) pe ce poziție stă valoarea 4.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>(a) 7; (b) 5, în celula E2; (c) poziția 7, în celula H2. Valoarea 4 și poziția 4 sunt lucruri diferite.</details>`,
  'Clic pe <b>A4</b> și scrie <b>Lungimea</b>, apasă <kbd>Tab</kbd>, scrie <b>7</b> și apasă <kbd>Enter</kbd>. Vezi: <b>Lungimea</b> în A4 și 7 în B4. Apoi apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>: registrul se salvează cu numele de la pasul 2, fără nicio fereastră.',
  '<b>Dacă mai ai timp</b> (altfel treci la ultimul pas): un șir al tău. Pe rândul 7 scrie un șir din viața ta, de exemplu câte pagini ai citit în fiecare zi a săptămânii trecute: în <b>A7</b> numele lui (de exemplu <b>Pagini</b>), apoi valorile, cu <kbd>Tab</kbd> după fiecare, doar numere întregi. Un număr scris cu punct, ca 7.5, Excel îl face dată (lecția 5). Pe rândul 6, deasupra valorilor, scrie pozițiile 1, 2, 3… Apasă <kbd>Ctrl</kbd>+<kbd>S</kbd>.',
  'Ultimul pas, oricum: închide registrul cu <kbd>Ctrl</kbd>+<kbd>W</kbd>. Dacă Excel întreabă dacă salvezi schimbările („Save your changes to this file?”), apasă <b>Salvare (Save)</b>. Excel rămâne deschis, gol: închide-l cu ✕ din colțul din dreapta-sus. Registrul tău rămâne în Documente, cu numele tău.'
];

JocMotor.porneste({
  cheie:'lectie_viii_m4_l23',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/viii/, „Lecția 23”, laboratorul înainte de verificare
  titlu:'Ce este un șir de valori. Unde apar șiruri în viața reală',
  marca:'Lecția <b>23</b> · Șiruri de valori · a VIII-a',
  h1:'Ce este un șir de valori. Unde apar șiruri în viața reală',
  eticheta:'Lecții TIC', acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a VIII-a', unitate:'VIII-U3', unitateTitlu:'Șiruri de valori. De la algoritm la program',
  competente:['CS.2.1'], lectii:'23',
  ancoraText:'Programa (OMEN 3393/2017): CS.2.1 · unitatea VIII-U3 „Șiruri de valori. De la algoritm la program” · lecția 23, prima a unității · conținutul: „Șir de valori (noțiuni introductive)”',
  intro:`<p>Lecția 23, prima din unitatea „Șiruri de valori”. Afli ce este un șir de valori, ce sunt elementul, poziția și lungimea lui, unde apar șiruri în viața ta și ce întrebări se pun despre ele. Programele care lucrează cu șiruri vin în lecțiile următoare.</p>
<p><b>Ai nevoie de:</b></p>
<ul><li>lecția 1, „Ce facem anul acesta…”: un șir de valori e o listă de valori de același fel;</li>
<li>lecția 2, „Interfața aplicației de calcul tabelar…”: rândurile, coloanele, celula, caseta de nume, scrisul cu <kbd>Tab</kbd> și <kbd>Enter</kbd>;</li>
<li>lecția 3, „Operații cu registrul și cu foile de calcul”: registru nou, Salvare ca (<kbd>F12</kbd>) cu numele tău, <i>Confirm Save As</i> → Nu (No), închiderea cu <kbd>Ctrl</kbd>+<kbd>W</kbd>;</li>
<li>lecția 5, „Tipuri de date…”: numărul stă la dreapta în celulă, textul la stânga.</li></ul>`,
  cum:`<p><b>Cum lucrezi:</b> după „La ce folosește” urmează 5 pași scurți, fiecare cu „Încearcă tu”, pe un șir desenat ca un rând de căsuțe. Apoi atelierul, apoi laboratorul, în Excel, iar la sfârșit 5 întrebări.</p>
<p><b>Obligatoriu:</b> primul „Încearcă tu” din fiecare pas, primul atelier, laboratorul (fără pasul „Dacă mai ai timp”) și cele 5 întrebări. Butoanele „Încă un exercițiu” sunt pentru cine termină mai repede.</p>
<p><b>Când mai sunt 10 minute din oră</b> și n-ai terminat laboratorul: apasă <kbd>Ctrl</kbd>+<kbd>S</kbd> în Excel și fă ultimul pas al laboratorului (închizi registrul și Excel). Cele 5 întrebări le faci după aceea, dacă mai e timp, sau ora viitoare: pe pagina lecției apeși <b>Continuă de unde ai rămas</b>.</p>
<p>Toate persoanele și numerele din exerciții sunt inventate.</p>`,
  banda:'<span class="b-n">un șir</span><span>3</span><span>−1</span><span>0</span><span>5</span><span>2</span><span>−2</span><span>4</span>',
  tipuri:{sir:SirValori,excelx:ExcelX},
  nivele:[
  {t:'Ce este un șir de valori. Unde apar șiruri în viața reală', final:true, lectii:[23], continuturi:[P.sir],
   obiectiv:'recunoști un șir de valori într-o situație din viața reală, spui ce element stă pe o poziție, câte elemente are șirul și ce fel de întrebare se pune despre el.',
   pasi:[
    /* ---------- PASUL 0: la ce folosește (fără acțiuni) ---------- */
    {t:'La ce folosește',
     text:`<p>Într-un vestiar, dulapurile stau unul lângă altul și fiecare ușiță are un număr. Spui numărul și găsești imediat ușița, fără să le deschizi pe toate.</p>
<p>Multe lucruri din viața ta arată la fel: temperatura din fiecare zi a săptămânii, notele tale la o materie, golurile unei echipe, meci după meci. Sunt mai multe valori de același fel, una după alta, fiecare la locul ei.</p>
<p>Azi înveți să le privești ca pe un șir de valori: ce stă pe fiecare loc, câte valori sunt și ce te poți întreba despre ele.</p>
${fig(IMG+'vestiar.webp',800,532,'Fotografie: dulapuri de lemn într-un vestiar gol, cu plăcuțe numerotate 193 și 194 în prim-plan și alte ușițe numerotate mai departe','Dulapuri numerotate într-un vestiar: fiecare ușiță are numărul ei. Foto: PattayaPatrol, <a href="https://commons.wikimedia.org/wiki/File:DSC_6896_Rows_of_numbered_wooden_lockers_with_metal_handles_in_a_quiet_changing_room_-_locker_193_and_194_in_focus.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">CC BY-SA 4.0</a>, micșorată.')}`},

    /* ---------- PASUL 1: ce este un șir de valori; elementul ---------- */
    {t:'Ce este un șir de valori',
     text:`<p>La lecția 1 ai aflat că un șir de valori e o listă de valori de același fel. Mai exact, un <mark>șir de valori</mark> are:</p>
<ul><li>valori de același fel: toate temperaturi, toate note sau toate scoruri;</li><li>puse în ordine, una după alta;</li><li>de obicei, mai multe: câte una pe zi, pe meci, pe test.</li></ul>
<p>Fiecare valoare din șir se numește <mark>element</mark>. Ordinea contează: dacă amesteci temperaturile, nu mai știi în ce zi a fost frig.</p>
<p>Vârsta ta e o valoare singură, nu o listă de valori luate una după alta. Nici fișa unui elev, cu numele, vârsta și clasa, nu e un șir: are valori de feluri diferite.</p>`,
     exemplu:`<p>Temperaturile de dimineață dintr-o săptămână de martie, de luni până duminică, în grade:</p>
${S(T,{pozitii:false,etichete:ZILE,nume:'Temperaturile de dimineață (°C)'})}
<p>Sunt 7 valori de același fel, temperaturi, în ordinea zilelor. Fiecare căsuță e un element al șirului.</p>`,
     altfel:`<p>Gândește-te la vagoanele unui tren: toate sunt vagoane, sunt prinse unul după altul, iar ordinea lor nu se schimbă pe drum. Un șir de valori e la fel: valori de același fel, una după alta.</p>`,
     incearca:{t:'sir',mod:'construieste',pozitiiVizibile:false,start:1,
       q:'Ionuț are 13 ani. Semestrul acesta, la matematică, a luat notele 8, 10, 7 și 9, în ordinea asta. Scrie în căsuțe șirul notelor lui Ionuț, câte o notă în fiecare căsuță. Pentru încă o căsuță, apasă „+ Adaugă o căsuță”. La final apasă „Verifică”.',
       corect:[8,10,7,9],capcane:[{valoare:13,mesaj:'13 e vârsta lui Ionuț: nu e o notă, deci nu intră în șirul notelor.'}],
       mesajLipsa:'Fiecare notă e un element: scrie-le pe toate.',gresit:[13,8,10,7,9],
       ajutor:'Un șir are valori de același fel. Aici: doar notele, în ordinea în care le-a luat.',
       why:'Șirul notelor lui Ionuț are 4 elemente: 8, 10, 7 și 9, în ordinea asta. Vârsta, 13, e o valoare de alt fel, deci nu intră în șir.'},
     inca:[
      {t:'classify',q:'Care dintre ele e un șir de valori?',cats:['Șir de valori','Nu e un șir de valori'],
       items:[['Câți kilometri a pedalat Irina în fiecare zi a săptămânii',0],['Înălțimea ta de azi, în centimetri',1],['Timpii alergătorilor dintr-o cursă, în ordinea sosirii',0],['Numele, vârsta și orașul unui prieten',1],['Prețurile produselor de pe un bon, de sus în jos',0]],
       ajutor:'Întreabă-te: e o listă de valori, una după alta? Sunt de același fel? Au o ordine?',
       why:'Kilometrii, timpii și prețurile sunt liste de valori de același fel, în ordine. Înălțimea de azi e o valoare singură, nu o listă, iar numele, vârsta și orașul sunt valori de feluri diferite.'},
      {t:'sir',mod:'construieste',pozitiiVizibile:false,start:1,
       q:'Andrei e în clasa a 8-a. În 5 zile la rând a rezolvat la matematică 4 probleme, apoi 6, apoi niciuna, apoi 3 și, în ultima zi, 5. Scrie în căsuțe șirul problemelor rezolvate, în ordinea zilelor.',
       corect:[4,6,0,3,5],capcane:[{valoare:8,mesaj:'8 vine din „clasa a 8-a”: nu e un număr de probleme.'}],
       mesajLipsa:'„Niciuna” înseamnă 0 probleme: și ziua aceea e un element.',gresit:[4,6,3,5],
       ajutor:'Câte o căsuță pentru fiecare zi, chiar și pentru ziua fără probleme rezolvate.',
       why:'Șirul are 5 elemente, câte unul pe zi: 4, 6, 0, 3, 5. Ziua cu „niciuna” are valoarea 0. Clasa a 8-a nu e un număr de probleme.'}
     ]},

    /* ---------- PASUL 2: poziția (indicele) ---------- */
    {t:'Poziția unui element (indicele)',
     text:`<p>Fiecare element stă pe un loc numerotat, ca ușițele din vestiar. Numărul locului se numește <mark>poziția</mark> elementului sau <mark>indicele</mark> lui.</p>
<p>Numărăm de la stânga, ca în viața de zi cu zi: primul element e pe poziția 1, al doilea pe poziția 2 și așa mai departe.</p>
<p>Atenție: poziția spune UNDE stă elementul, iar valoarea spune CE scrie în căsuță. Sunt două numere diferite.</p>
<p>Pe tablă, profesorul poate scrie poziția mic, jos, lângă litera șirului: t₄ se citește „t indice 4” și înseamnă elementul de pe poziția 4 al șirului t.</p>`,
     exemplu:`${S(T,{pozitii:true,etichete:ZILE,indice:'t',nume:'Șirul t: temperaturile de dimineață (°C)',evidentiaza:[4]})}
<p>Pozițiile sunt numerele mici de deasupra căsuțelor. Elementul de pe poziția 4, joi, are valoarea 5: t₄ este 5. Valoarea 4 stă pe altă poziție, pe ultima: pe poziția 7.</p>`,
     altfel:`<p>La cinematograf, pe bilet scrie „locul 4”. Locul 4 e un scaun, iar pe el stă un om. Poziția e ca numărul scaunului; valoarea e ca omul care stă pe el.</p>`,
     incearca:{t:'sir',mod:'atinge',nume:'Punctele echipei la 6 concursuri',sir:[5,8,2,6,4,9],cauta:{pozitie:4},
       q:'Atinge elementul de pe poziția 4. Apoi apasă „Verifică”.',
       ajutor:'Poziția e numărul mic de deasupra căsuței, nu numărul din ea.',
       why:'Pe poziția 4 stă elementul cu valoarea 6. Valoarea 4 stă pe poziția 5: poziția și valoarea sunt numere diferite.'},
     inca:[
      {t:'sir',mod:'raspuns',nume:'Notele Ioanei la geografie',sir:[9,7,10,8,6],
       q:'Răspunde în casete, apoi apasă „Verifică”.',
       intrebari:[{id:'v2',ce:'Valoarea elementului de pe poziția 2',text:'Ce valoare are elementul de pe poziția 2?',cere:{tip:'valoare',pozitie:2},gresit:'2'},
                  {id:'p10',ce:'Poziția pe care stă nota 10',text:'Pe ce poziție stă nota 10?',cere:{tip:'pozitii',valoare:10},gresit:'10'}],
       ajutor:'Valoarea e în căsuță; poziția e numărul de deasupra ei.',
       why:'Pe poziția 2 stă nota 7. Nota 10 stă pe poziția 3.'},
      {t:'sir',mod:'raspuns',nume:'Șirul g: golurile echipei în 5 meciuri',sir:[1,0,4,2,3],indice:'g',
       q:'Sub căsuțe, fiecare element e scris și cu indicele lui. Răspunde, apoi apasă „Verifică”.',
       intrebari:[{id:'g3',ce:'Valoarea lui g₃',text:'Cât este g₃?',cere:{tip:'valoare',pozitie:3},gresit:'3'}],
       ajutor:'g₃ e elementul de pe poziția 3 al șirului g.',
       why:'g₃ e elementul de pe poziția 3: 4 goluri, în al treilea meci. 3 e poziția, nu valoarea.'}
     ]},

    /* ---------- PASUL 3: lungimea ---------- */
    {t:'Lungimea șirului',
     text:`<p><mark>Lungimea</mark> unui șir înseamnă câte elemente are. Șirul temperaturilor din săptămâna de martie are lungimea 7: câte o temperatură pe zi.</p>
<p>Când numeri pozițiile de la 1, ultima poziție are chiar numărul lungimii: în șirul cu 7 elemente, ultimul element e pe poziția 7.</p>
<p>O poziție mai mare decât lungimea nu există. Săptămâna nu are o a 8-a zi, deci în șirul temperaturilor nu e niciun element pe poziția 8.</p>`,
     exemplu:`<p>Același șir, în Excel-ul adevărat, într-un registru nou: pe rândul 2 valorile, iar deasupra fiecăreia, pe rândul 1, poziția ei. Ultima poziție de pe rândul 1, 7, e lungimea șirului.</p>
${fig(IMG+'excel-sir.webp',760,136,'Excel: în A1 Poziția și în B1-H1 numerele 1-7; în A2 Grade și în B2-H2 temperaturile 3, -1, 0, 5, 2, -2, 4; celula activă A3','Șirul temperaturilor pe rândul 2, cu pozițiile pe rândul 1. Excel-ul din imagine e în engleză.')}`,
     altfel:`<p>Lungimea e ca numărul de vagoane ale trenului. Dacă trenul are 7 vagoane, vagonul 8 nu există, oricât l-ai căuta pe peron.</p>`,

       ajutor:'Prima căsuță din stânga e pe poziția 1. Ultima poziție e chiar lungimea.',
       why:`Pozițiile merg de la 1 la 8, deci șirul are lungimea 8: ultima poziție e chiar lungimea.<div class="lacalc"><b>Acum, dacă ești la calculatorul din laborator:</b> deschide Excel și alege <b>Registru de lucru necompletat (Blank workbook)</b>. Lasă-l deschis: îl folosești la laborator. (Pe telefon: sari peste; pașii tăi sunt la laborator.)</div>`},
     inca:[
      {t:'excelx',cols:7,rows:3,cells:{A1:'Poziția',A2:'Secunde',B2:15,C2:14,D2:16,E2:13,F2:14},
       q:'Pe rândul 2 sunt timpii lui Radu la 5 alergări, în secunde. Scrie pe rândul 1, deasupra fiecărui timp, poziția lui: clic pe <b>B1</b>, scrie <b>1</b>, apasă <kbd>Tab</kbd>, scrie <b>2</b> și tot așa, până la <b>F1</b>, apoi <kbd>Enter</kbd>. (Pe telefon: atingi <b>B1</b>, apoi bara de formule, scrii <b>1</b> și apeși Enter (↵) pe tastatura telefonului; apoi atingi <b>C1</b> și tot așa, până la <b>F1</b>. <b>E1</b> și <b>F1</b> sunt mai la dreapta: ca să le vezi, tragi cu degetul spre stânga pe literele coloanelor (A, B, C…), nu pe celule. Pe celule, tragerea selectează. Tab nu există pe telefon.)',

    /* ---------- PASUL 4: șirul dintr-o situație din viața reală ---------- */
    {t:'Găsești șirul într-o poveste',
     text:`<p>În viața reală, un șir nu vine desenat în căsuțe: îl găsești într-o poveste, printre alte numere. Ca să-l scoți:</p>
<ol><li>afli ce se repetă: temperatura fiecărei zile, golurile fiecărui meci;</li>
<li>iei valorile în ordinea în care s-au întâmplat;</li>
<li>nu sari peste niciuna, nici peste 0: un meci fără gol are tot un rezultat;</li>
<li>lași deoparte numerele de alt fel: vârsta, data, câți jucători sunt.</li></ol>`,
     exemplu:`<p>„Maria are 14 ani. Luni a citit 25 de minute, marți 30, miercuri deloc, joi 20.”</p>
${S([25,30,0,20],{pozitii:true,etichete:['luni','marți','miercuri','joi'],nume:'Minutele de citit ale Mariei'})}
<p>Se repetă minutele de citit, câte o valoare pe zi. „Deloc” înseamnă 0 și e tot un element. 14 e vârsta Mariei: nu intră în șir.</p>`,
     altfel:`<p>E ca atunci când copiezi de pe tablă doar temele: printre anunțuri, date și nume, alegi numai rândurile care sunt teme, în ordinea în care le-a scris profesorul.</p>`,
     incearca:{t:'sir',mod:'marcheaza',
       text:'Echipa de fotbal a școlii are {11} jucători. În campionatul școlilor a jucat {5} meciuri, primul pe {3} martie. A marcat, pe rând: {2|s} goluri în primul meci, {0|s} în al doilea, {3|s} în al treilea, {1|s} în al patrulea și {4|s} în ultimul.',
       mesaje:{'0':'11 e numărul jucătorilor, nu golurile dintr-un meci.','1':'5 e numărul meciurilor, adică lungimea șirului, nu golurile dintr-un meci.','2':'3 martie e o dată din calendar, nu golurile dintr-un meci.'},
       mesajLipsa:'Lipsește meciul cu 0 goluri: și el are un rezultat, deci e un element al șirului.',
       q:'Atinge în poveste numerele care fac parte din șirul golurilor, apoi apasă „Verifică”.',
       ajutor:'Ce se repetă? Golurile, câte o valoare pe meci. Nu uita meciul fără gol.',
       why:'Șirul golurilor are 5 elemente: 2, 0, 3, 1, 4. Numărul jucătorilor, data și numărul meciurilor sunt numere de alt fel.'},
     inca:[

    /* ---------- PASUL 5: ce întrebări pui despre un șir ---------- */
    {t:'Ce întrebări pui despre un șir',
     text:`<p>Când ai un șir, apar întrebări. Aproape toate sunt de patru feluri, după ce cere răspunsul (nu după primul cuvânt):</p>
<ul class="patru"><li><b>Câte…?</b> cere câte elemente se potrivesc: <i>În câte zile a plouat?</i></li>
<li><b>Cât fac împreună…?</b> cere valorile elementelor, puse la un loc: <i>Câți bani a strâns în toate săptămânile?</i></li>
<li><b>Care e cel mai mare / cel mai mic…?</b> cere cea mai mare sau cea mai mică valoare: <i>Care a fost cea mai rece dimineață?</i></li>
<li><b>Toate…? Măcar unul…?</b> cere un da sau un nu: <i>Au fost toate notele peste 5? A fost măcar un meci fără gol?</i></li></ul>
<p>Azi doar recunoști felul întrebării. Cum afli răspunsul înveți în lecțiile următoare.</p>`,
     exemplu:`<p>Trei întrebări despre șirul t, al temperaturilor de dimineață:</p>
${S(T,{pozitii:true,etichete:ZILE,nume:'Șirul t (°C)'})}
<ul><li>„În câte dimineți a fost sub 0 grade?” e de felul <b>Câte…?</b>;</li>
<li>„Care a fost cea mai caldă dimineață?” e de felul <b>Cel mai mare…?</b>;</li>
<li>„A fost măcar o dimineață sub 0 grade?” e de felul <b>Măcar unul…?</b>.</li></ul>
<p>Atenție la cuvinte: „Câte goluri a marcat în total?” începe cu „Câte”, dar cere totalul, deci e de felul <b>Cât fac împreună…?</b>.</p>`,
     altfel:`<p>După un sezon, antrenorul se întreabă: câte meciuri am câștigat, câte goluri am dat în total, care a fost cel mai bun meci, dacă am marcat în toate meciurile. Același șir de rezultate, patru întrebări diferite.</p>`,
     incearca:{t:'classify',q:'De ce fel e fiecare întrebare?',cats:PATRU,
       items:[['În câte zile din vacanță a plouat?',0],['Câți kilometri a pedalat Irina în toată săptămâna?',1],['Care a fost cel mai scump produs de pe bon?',2],['A primit Ionuț măcar o notă de 10?',3],['Câte meciuri a câștigat echipa?',0],['Au trecut toți elevii proba de alergare?',3]],
       ajutor:'Nu te uita doar la primul cuvânt: „Câți kilometri… în toată săptămâna” cere un total.',
       why:'„În câte zile” și „Câte meciuri” numără. Kilometrii din toată săptămâna se adună. Cel mai scump produs e cel mai mare preț. „Măcar o notă de 10” și „toți elevii” sunt întrebări Toate…? / Măcar unul…?.'},
     inca:[
      {t:'choice',q:'Ana vrea să afle dacă și-a făcut temele în fiecare zi a săptămânii. Ce fel de întrebare își pune?',
       o:['Toate…? / Măcar unul…?','Câte…?','Cât fac împreună…?','Cel mai mare / cel mai mic…?'],ok:0,
       ajutor:'„În fiecare zi” înseamnă în toate zilele.',why:'„În fiecare zi” înseamnă „în toate zilele”: e o întrebare Toate…?.'},
      {t:'match',q:'Potrivește fiecare întrebare cu felul ei.',
       pairs:[['Câți lei a cheltuit clasa în toată excursia?','Cât fac împreună…?'],['Care a fost cea mai mică notă la test?','Cel mai mare / cel mai mic…?'],['În câte zile a fost peste 30 de grade?','Câte…?'],['A ratat Mihai măcar un antrenament?','Toate…? / Măcar unul…?']],
       ajutor:'Caută ce vrea să afle omul: câte zile, un total, cea mai mare sau cea mai mică valoare, ori un da sau un nu.',
       why:'Cheltuiala din toată excursia e un total; cea mai mică notă e cea mai mică valoare din șir; „în câte zile” numără zilele; „măcar un antrenament” cere un da sau un nu.'}
     ]}
   ],
   atelier:{t:'sir',mod:'construieste',titlu:'Atelier: pușculița lui Tudor',start:1,
    intro:`<p>Mai jos scrii un șir în căsuțe, din poveste, apoi răspunzi la trei întrebări despre el. Deasupra căsuțelor apar singure pozițiile. Sub căsuțe sunt <strong>testele</strong>: se bifează când apeși <b>Verifică</b>.</p>`,

  aplicatieReala:{aplicatie:'Excel-ul adevărat',titlu:'Acum la calculatorul din laborator',scurt:'Laborator',
    intro:`<p>Scrii în Excel-ul adevărat un șir, cu pozițiile lui, și îl salvezi cu numele tău. La fiecare pas scrie ce trebuie să vezi, ca să te verifici singur. Numele din Excel sunt scrise în ambele limbi, româna întâi, engleza în paranteză: caută-l pe cel pe care îl vezi pe ecran. Dacă ai deschis deja Excel la pasul <i>Lungimea șirului</i> (pasul 4 din 6), începi cu pasul 2.</p>
<p>Când mai sunt 10 minute din oră: apasă <kbd>Ctrl</kbd>+<kbd>S</kbd> și fă ultimul pas (închizi registrul și Excel). Cele 5 întrebări le faci după aceea, dacă mai e timp, sau ora viitoare.</p>
<p><b>Nu merge Excel sau lucrezi pe telefon?</b> Scrie în caiet: pe un rând pozițiile de la 1 la 7, dedesubt temperaturile de la pasul 4, apoi răspunde la pasul 5. Atelierul din pagină ține loc de laborator. Dacă Excel nu pornește la calculatorul din laborator, spune-i profesorului.</p>`,
    pasi:PROVOCARE},

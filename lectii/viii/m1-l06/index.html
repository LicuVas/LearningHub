<script src="../../../jocuri/_motor/motor.js"></script>

<!-- foaia „excelx” comună clasei a VIII-a (lecțiile 4-5), plus stratul de FORMATARE scris pentru lecția 6 -->
<script src="../../_sim/excelx.js"></script>
<script src="../../_sim/excelx-formatare.js"></script>
<script>
/* conținuturile programei (OMEN 3393/2017), textul exact din curriculum.json */
const P={randuri:'Operații de formatare a rândurilor/coloanelor',celule:'Operații de formatare a celulelor (aliniere conținut, borduri, culori de umplere, stiluri predefinite)'};
/* captura reală: toate imaginile sunt din Excel-ul adevărat (vezi img/SURSE.json) */
const fig=(f,w,h,alt,cap)=>{const src='../m1-l06/img/'+f;return `<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`};

const LISTA={A1:'Excursia clasei a VIII-a la Cheile Bicazului',A2:'Elev',B2:'Suma',C2:'Data plății',D2:'Cod bilet',
  A3:'Ana Popescu',B3:150,C3:'28.09.2026',D3:"'001",A4:'Bogdan Ionescu',B4:75.5,C4:'01.10.2026',D4:"'002",
  A5:'Cristina Munteanu',B5:120,C5:'05.10.2026',D5:"'003",A6:'Dan Vasilescu',B6:150,C6:'06.10.2026',D6:"'004"};
const ATELIER_TESTE=[
  {ce:'Titlul e îmbinat și centrat peste A1:D1',forma:{imbinat:'A1:D1',centrat:true}},
  {ce:'Capul de tabel A2:D2 e aldin și colorat',forma:{b:{'A2:D2':true},fill:{'A2:D2':true}}},
  {ce:'Tot tabelul A2:D6 are borduri pe toate laturile',forma:{borduri:{'A2:D6':'toate'}}},
  {ce:'Sumele din B3:B6 se văd cu două zecimale',forma:{format:{'B3:B6':{zecimale:2}}}},
  {ce:'Numele din coloana A se văd întregi',forma:{vizibil:'A3:A6'}},
  {ce:'Datele din coloana C se văd, fără ####',forma:{faraDiez:'C3:C6'}}];
const CONCURS=[
  {ce:'Titlul e îmbinat și centrat peste A1:C1',forma:{imbinat:'A1:C1',centrat:true}},
  {ce:'Capul de tabel A2:C2 e aldin și colorat',forma:{b:{'A2:C2':true},fill:{'A2:C2':true}}},
  {ce:'Tabelul A2:C5 are borduri pe toate laturile',forma:{borduri:{'A2:C5':'toate'}}},
  {ce:'Reușita din C3:C5 se vede ca procent',forma:{format:{'C3:C5':{procent:0}}}},
  {ce:'Numele echipelor se văd întregi',forma:{vizibil:'A3:A5'}}];
const unit=T=>Object.assign({valori:true},...T.map(t=>t.forma));

const PROVOCARE=[
  'Descarcă fișierul <a href="excursia_clasei.xlsx" download>excursia_clasei.xlsx</a> și deschide-l în Excel. Dacă sus apare o bandă galbenă cu butonul <b>Enable Editing</b> (Activare editare), apasă pe el: fișierele descărcate se deschid întâi doar pentru citit.',
  'Uită-te la tabel: numele din coloana A sunt tăiate, iar datele din coloana C se văd ca <code>####</code>.',
  'Îmbină titlul: selectează <b>A1:D1</b> și apasă <b>Merge &amp; Center</b> (Îmbinare și centrare), în fila <b>Home</b> (Pornire).',
  'Selectează capul de tabel <b>A2:D2</b>, apasă <b>B</b> (Bold) și găleata <b>Fill Color</b> (Culoare de umplere).',
  'Selectează tot tabelul, <b>A2:D6</b>, apoi săgeata ▾ de lângă <b>Borders</b> (Borduri) › <b>All Borders</b> (Toate bordurile).',
  'Selectează sumele <b>B3:B6</b> și apasă <b>Increase Decimal</b> (Mărire zecimale; săgeata albastră spre stânga, cu .00) până se văd două zecimale: <b>150,00</b>.',
  'La urmă, potrivește coloanele: dă dublu-clic pe linia dintre literele <b>A</b> și <b>B</b>, sus, apoi pe linia dintre <b>C</b> și <b>D</b>. Acum numele și datele se văd întregi.',
  'Verifică singur valoarea din spate: clic pe <b>B4</b>. Celula arată <b>75,50</b>, iar bara de formule arată <b>75,5</b>. Formatarea n-a schimbat numărul.',
  'Salvează o copie cu numele tău: <b>File</b> (Fișier) › <b>Save As</b> (Salvare ca), cu numele <code>Nume_Prenume_lectia6.xlsx</code>.'
];

JocMotor.porneste({
  cheie:'lectie_viii_m1_l06',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/viii/, „Lecția 6”, „Acum în Excel-ul adevărat” înainte de verificare
  titlu:'Formatarea rândurilor, a coloanelor și a celulelor',
  marca:'Lecția <b>6</b> · Excel · a VIII-a',
  h1:'Formatarea rândurilor, a coloanelor și a celulelor',
  eticheta:'Lecții TIC', acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a VIII-a', unitate:'VIII-U1', unitateTitlu:'Calcul tabelar',
  competente:['CS.1.1','CS.3.1'], lectii:'6',
  ancoraText:'Programa (OMEN 3393/2017): CS.1.1, CS.3.1 · unitatea VIII-U1 „Calcul tabelar” · lecția 6 · conținuturile: „Operații de formatare a rândurilor/coloanelor” și „Operații de formatare a celulelor (aliniere conținut, borduri, culori de umplere, stiluri predefinite)”',
  intro:`<p>Lecția 6 din modulul 1. Faci un tabel ușor de citit: coloane cât trebuie, conținut așezat bine în celule, un titlu deasupra tabelului, linii, culori și numere în forma potrivită.</p>
<p><b>Ai nevoie de:</b> lecția 2, „Interfața aplicației de calcul tabelar. Structura unui registru” (celula și adresa ei, literele coloanelor, numerele rândurilor, bara de formule, fila Pornire (Home) a panglicii), lecția 3, „Operații cu registrul și cu foile de calcul” (deschidere, salvare, Salvare ca (Save As)), lecția 4, „Adresa de celulă. Selectare, copiere, mutare, ștergere” (selectezi o zonă trăgând, de exemplu A2:D6; <kbd>Ctrl</kbd>+<kbd>Z</kbd> sau butonul <b>Anulare (Undo)</b> ↶ anulează ultima operație) și lecția 5, „Tipuri de date: numeric, text, dată calendaristică” (numerele și datele stau singure la dreapta, textul la stânga; zecimalele se scriu cu virgulă, datele cu puncte).</p>`,
  cum:`<p><b>Cum lucrezi:</b> după pagina „La ce folosește” urmează 5 pași scurți, fiecare cu „Încearcă tu”. Apoi atelierul, într-o foaie care se poartă ca Excel-ul, apoi aceleași lucruri în Excel-ul adevărat, iar la sfârșit 5 întrebări.</p>`,
  banda:'<span>Excursia clasei</span><span class="h">Elev</span><span class="h">Suma</span><span class="r">150,00</span><span class="d">####</span><span class="r">25%</span>',
  tipuri:{excelx:ExcelXF},
  nivele:[
  {t:'Formatarea rândurilor, a coloanelor și a celulelor', final:true, lectii:[6], continuturi:[P.randuri,P.celule],
   obiectiv:'faci un tabel ușor de citit: coloane potrivite, conținut aliniat, titlu îmbinat, borduri, culori, stiluri și numere în forma potrivită, fără să schimbi valorile.',
   pasi:[
    /* ---------- PASUL 0: la ce folosește (fără acțiuni) ---------- */
    {t:'La ce folosește',
     text:`<p>Diriginta pune la avizier lista pentru excursie. În Excel, lista arată ca în prima imagine: numele sunt tăiate, datele se văd ca <code>######</code>, iar titlul stă în A1, lipit de stânga, nu deasupra tabelului. Nimic nu s-a pierdut: Excel are toate datele, doar că tabelul se citește greu.</p>
<p><mark>Formatarea</mark> schimbă cum arată tabelul, nu ce conține: cât de late sunt coloanele, locul textului în celulă, liniile, culorile și forma numerelor. Azi faci din prima imagine a doua.</p>
<div class="doua-imagini">${fig('lista-inainte.webp',415,191,'Lista excursiei în Excel, neformatată: nume tăiate în coloana A, datele din coloana C afișate ca ######, titlul în A1','Înainte: nume tăiate, date ascunse sub ######.')}${fig('lista-dupa.webp',435,191,'Aceeași listă în Excel, formatată: titlu centrat deasupra, cap de tabel galben și aldin, linii pe tot tabelul, sume cu două zecimale, coloane potrivite','După: aceleași date, ușor de citit.')}</div>`},

    /* ---------- PASUL 1: lățimea coloanei și înălțimea rândului ---------- */
    {t:'Lățimea coloanei și înălțimea rândului',
     text:`<p>Fiecare coloană are o <mark>lățime</mark> și fiecare rând o <mark>înălțime</mark>. Dacă o dată nu încape, Excel arată <code>####</code>: valoarea e acolo, doar că nu are loc. Un număr se rotunjește întâi (75,5 poate apărea 76; bara de formule arată tot 75,5) și arată <code>####</code> abia când nici așa nu încape. Un text prea lung se taie când celula din dreapta e plină.</p>
<p>Ca să lățești coloana C, duci mouse-ul sus, pe linia dintre literele C și D, până apare săgeata dublă ↔, și tragi spre dreapta. Dacă dai <strong>dublu-clic</strong> pe linie, coloana se potrivește singură după cel mai lung conținut al ei.</p>`,
     exemplu:`${fig('coloana-c-latita.webp',430,191,'Excel: după dublu-clic pe linia dintre C și D, datele din coloana C se văd întregi; numele din A sunt încă tăiate','Dublu-clic pe linia dintre C și D: datele se văd. Numele din A așteaptă același gest, pe linia dintre A și B.')}
<p>Înălțimea rândului o schimbi la fel: tragi în jos de linia de sub numărul lui.</p>
<p>Din panglică: clic pe litera coloanei (o selectezi toată), apoi <b>Pornire (Home)</b> › grupul <b>Celule (Cells)</b> › <b>Format</b> › <b>AutoFit Column Width</b> (Potrivire automată). Excel potrivește după celulele selectate; de aceea selectezi toată coloana. <b>Column Width…</b> (Lățime coloană…) îți cere un număr.</p>
<div class="doua-imagini">${fig('grup-celule.webp',181,120,'Grupul Cells din fila Home, cu butonul Format încadrat','Butonul <b>Format</b>, în grupul Celule (Cells).')}${fig('meniu-format.webp',225,235,'Meniul Format din Excel: Row Height, AutoFit Row Height, Column Width, AutoFit Column Width încadrate, Default Width','Lista lui: înălțimea rândului și lățimea coloanei.')}</div>`,
     altfel:`<p>Gândește-te la o poză prea mare pentru ramă: poza e întreagă, doar rama e mică și o ascunde. Nu refaci poza, mărești rama. La fel, nu rescrii data: lățești coloana.</p>`,
     incearca:{t:'excelx',q:'Datele din coloana <b>C</b> se văd ca ####. Lățește coloana C, ca să se vadă datele: trage spre dreapta de linia dintre literele <b>C</b> și <b>D</b>, sau dă dublu-clic pe ea.',
       cols:4,rows:5,panglica:false,latimi:{C:6},
       cells:{A1:'Elev',B1:'Suma',C1:'Data plății',A2:'Ana',B2:150,C2:'28.09.2026',A3:'Bogdan',B3:75.5,C3:'01.10.2026',A4:'Cristi',B4:120,C4:'05.10.2026'},
       verifica:{forma:{faraDiez:'C2:C4',valori:true}},
       ajutor:'Linia e sus, între literele C și D. Pe telefon: atingi litera C, apoi tragi de cercul verde ⇔ de pe marginea ei (sau îl atingi de două ori, repede).',
       why:'Coloana e acum destul de lată: datele se văd, iar valorile au rămas aceleași.'},
     inca:[
      {t:'excelx',q:'Numele din coloana <b>A</b> sunt tăiate. Potrivește coloana A după cel mai lung nume: dublu-clic pe linia dintre literele <b>A</b> și <b>B</b>.',
       cols:3,rows:5,panglica:false,
       cells:{A1:'Elev',B1:'Clasa',A2:'Alexandra Popescu',B2:'8A',A3:'Bogdan Ionescu',B3:'8B',A4:'Cristina Munteanu',B4:'8A'},
       verifica:{forma:{vizibil:'A2:A4',valori:true}},
       ajutor:'Dublu-clic pe linia de sus dintre A și B. Pe telefon: atingi litera A, apoi atingi de două ori cercul verde ⇔.',why:'Coloana A s-a potrivit după „Cristina Munteanu”, cel mai lung nume. Acum niciun nume nu mai e tăiat.'},
      {t:'excelx',q:'Fă rândul <b>1</b> mai înalt, cam de două ori: trage în jos de linia de sub numărul <b>1</b>, din stânga foii (ca la coloane, dar pe numerele rândurilor).',
       cols:3,rows:4,panglica:false,cells:{A1:'Elev',B1:'Nota',A2:'Ana',B2:9,A3:'Dan',B3:10},
       verifica:{forma:{inaltime:{'1':{min:25}}}},
       ajutor:'Linia e între numerele 1 și 2, în stânga foii. Pe telefon: atingi numărul 1, apoi tragi în jos cercul verde ⇕.',why:'Rândul 1 e mai înalt. Capul de tabel are acum loc, iar restul rândurilor au rămas la fel.'},
      {t:'choice',q:'În celula C3 vezi ######. Ce înseamnă?',o:['Data e acolo, dar coloana e prea îngustă','Data s-a șters din celulă','Data a fost scrisă greșit','Excel nu știe ce e în celulă'],ok:0,
       ajutor:'Recitește ce spune pasul despre ####.',why:'####: valoarea e în celulă, dar nu încape. Lățești coloana și o vezi.'}
     ]},

    /* ---------- PASUL 2: alinierea ---------- */
    {t:'Alinierea: unde stă conținutul în celulă',
     text:`<p><mark>Alinierea conținutului</mark> este locul în care stă conținutul în celulă. De la lecția 5 știi că Excel pune singur numerele la dreapta și textul la stânga. Tu îl muți cu butoanele din fila <strong>Pornire (Home)</strong>, grupul <strong>Aliniere (Alignment)</strong>. Pe ele sunt liniuțe așezate cum va sta textul:</p>
<ul><li>rândul de jos: <strong>Aliniere la stânga (Align Left)</strong>, <strong>Centrare (Center)</strong>, <strong>Aliniere la dreapta (Align Right)</strong>;</li>
<li>rândul de sus: sus, <strong>la mijloc (Middle Align)</strong>, jos. Se vede când rândul e înalt.</li></ul>
<p>Întâi selectezi celulele, apoi apeși butonul. Al doilea clic pe același buton scoate alinierea.</p>
${fig('grup-aliniere.webp',416,120,'Grupul Alignment din fila Home: sus, butoanele Top Align, Middle Align, Bottom Align; jos, Align Left, Center, Align Right; în dreapta Wrap Text și Merge and Center','Grupul <b>Aliniere (Alignment)</b>: sus-jos în rândul de sus, stânga-centru-dreapta în rândul de jos.')}`,
     exemplu:`${fig('aliniere-verticala.webp',595,120,'Excel: rândul 1 înalt, cu „Sus” lipit de marginea de sus în D1, „La mijloc” la mijloc în E1 și „Jos” jos în F1','Într-un rând înalt: „Sus” (Top Align), „La mijloc” (Middle Align), „Jos” (cum pune Excel singur).')}`,
     altfel:`<p>E ca atunci când scrii pe o etichetă: poți scrie lipit de marginea din stânga, la mijloc sau spre dreapta. Eticheta e aceeași, doar locul scrisului se schimbă.</p>`,
     incearca:{t:'excelx',q:'Centrează codurile biletelor din <b>B2:B4</b>: selectează zona, apoi <b>Pornire (Home)</b> › <b>Centrare (Center)</b>.',
       cols:3,rows:5,cells:{A1:'Elev',B1:'Cod bilet',A2:'Ana',B2:"'001",A3:'Bogdan',B3:"'002",A4:'Cristi',B4:"'003"},
       verifica:{forma:{al:{'B2:B4':'center'}}},
       ajutor:'Tragi de la B2 la B4, apoi butonul din mijloc, rândul de jos al grupului Aliniere (Alignment).',why:'Codurile stau acum la mijlocul celulelor, pe toată zona B2:B4.'},
     inca:[
      {t:'excelx',q:'Capul de tabel <b>B1:C1</b> stă la stânga, iar sumele de sub el stau la dreapta. Aliniază <b>B1:C1</b> la dreapta, deasupra numerelor.',
       cols:3,rows:4,cells:{A1:'Elev',B1:'Suma',C1:'Rest',A2:'Ana',B2:150,C2:0,A3:'Bogdan',B3:75.5,C3:74.5},
       verifica:{forma:{al:{'B1:C1':'right'}}},
       ajutor:'Selectezi B1:C1, apoi Aliniere la dreapta (Align Right), ultimul buton din rândul de jos.',why:'„Suma” și „Rest” stau acum deasupra numerelor lor, la dreapta.'},
      {t:'excelx',q:'Rândul 1 e înalt, iar titlul din <b>A1</b> stă jos, lipit de linie. Mută-l la mijlocul rândului: <b>Aliniere la mijloc (Middle Align)</b>.',
       cols:3,rows:3,inaltimi:{1:40},cells:{A1:'Note',A2:'Ana',B2:9},
       verifica:{forma:{va:{'A1':'middle'}}},
       ajutor:'E butonul din mijloc, pe rândul de sus al grupului Aliniere (Alignment).',why:'Titlul stă acum la jumătatea înălțimii rândului.'},
      {t:'tf',q:'Apeși o dată pe Centrare (Center) și celula se centrează. Dacă mai apeși o dată pe același buton, celula rămâne centrată.',ok:false,
       ajutor:'Recitește ultima propoziție a pasului.',why:'Fals. Al doilea clic scoate alinierea: celula revine la cea pusă de Excel (numărul la dreapta, textul la stânga).'}
     ]},

    /* ---------- PASUL 3: îmbinarea și încadrarea textului ---------- */
    {t:'Titlul peste tabel și textul lung',
     text:`<p>Titlul stă în A1, dar trebuie să fie deasupra întregului tabel. Selectezi A1:D1 și apeși <strong>Îmbinare și centrare (Merge &amp; Center)</strong>: cele patru celule devin una, cu titlul la mijloc. Dacă zona are mai multe valori, Excel păstrează doar prima, cea din stânga-sus, și le șterge pe celelalte, după ce te avertizează.</p>
<p>Un text lung îl așezi pe mai multe rânduri, în aceeași celulă, cu <strong>Încadrare text (Wrap Text)</strong>: rândul crește singur.</p>
<p>Îmbină titlul înainte să potrivești coloana A: dublu-clicul ține cont de tot ce e în coloană, deci și de titlul lung din A1.</p>`,
     exemplu:`<div class="doua-imagini">${fig('titlu-imbinat.webp',415,191,'Excel: titlul din A1 îmbinat și centrat peste A1:D1; celula îmbinată e selectată, cu chenarul verde pe toată lățimea A1:D1','Merge &amp; Center pe A1:D1: o singură celulă, cât tot tabelul (chenarul verde), cu titlul la mijloc.')}${fig('avertisment-imbinare.webp',469,229,'Fereastra Microsoft Excel: Merging cells only keeps the upper-left value and discards other values, cu butoanele OK și Cancel','Avertismentul: „îmbinarea păstrează doar valoarea din stânga-sus”. Cancel (Revocare) = nu se îmbină nimic.')}</div>
${fig('incadrare-text.webp',435,120,'Excel: observația din A15 așezată pe trei rânduri cu Wrap Text; rândul 15 e mai înalt','Wrap Text pe A15: observația stă pe trei rânduri, în aceeași celulă.')}`,
     altfel:`<p>E ca la un afiș făcut din patru foi lipite una lângă alta: titlul se scrie o singură dată, pe mijlocul tuturor. Pe afiș nu mai rămâne loc pentru alt text, de aceea Excel șterge ce mai era în celelalte celule.</p>`,
     incearca:{t:'excelx',q:'Pune titlul deasupra întregului tabel: selectează <b>A1:D1</b>, apoi <b>Merge &amp; Center</b> (Îmbinare și centrare).',
       cols:4,rows:4,cells:{A1:'Excursia clasei a VIII-a',A2:'Elev',B2:'Suma',C2:'Data plății',D2:'Cod bilet',A3:'Ana',B3:150,C3:'28.09.2026',D3:"'001"},
       verifica:{forma:{imbinat:'A1:D1',centrat:true,valori:true}},
       ajutor:'Tragi de la A1 la D1 (tot rândul tabelului), apoi butonul Merge & Center din grupul Aliniere (Alignment).',why:'A1:D1 e acum o singură celulă, cu titlul la mijloc, deasupra celor patru coloane.'},
     inca:[
      {t:'excelx',q:'În <b>B2</b> e o observație lungă, care trece peste celula din dreapta. Așaz-o pe mai multe rânduri, în aceeași celulă: selectează B2 și apasă <b>Wrap Text</b> (Încadrare text).',
       cols:3,rows:4,cells:{A1:'Elev',B1:'Observație',A2:'Ana',B2:'Plătește restul în octombrie, la dirigintă',A3:'Bogdan',B3:'Plătit'},
       verifica:{forma:{wrap:{'B2':true}}},
       ajutor:'Butonul Wrap Text e în grupul Aliniere (Alignment), sus, în dreapta.',why:'Observația stă acum pe mai multe rânduri în B2, iar rândul 2 s-a înălțat singur.'},
      {t:'excelx',q:'În <b>A1</b> e titlul, iar în <b>C1</b> a rămas din greșeală un x. Îmbină <b>A1:C1</b> cu <b>Merge &amp; Center</b>. Ce se întâmplă cu x?',
       cols:3,rows:3,cells:{A1:'Excursia clasei',C1:'x',A2:'Elev',B2:'Suma',C2:'Data'},
       o:['Excel te avertizează, iar după OK x dispare','x se mută în rândul 2, sub titlu','Excel nu te lasă să îmbini celulele','x rămâne lângă titlu, în celula îmbinată'],ok:0,
       ajutor:'Încearcă în foaie și citește fereastra care apare.',why:'Zona are două valori. Excel te avertizează că păstrează doar valoarea din stânga-sus; după OK, x se șterge. Cu Ctrl+Z (↶) îl aduci înapoi.'},
      {t:'choice',q:'Selectezi A1:C1. Doar A1 are ceva scris: titlul. Apeși Merge & Center. Apare avertismentul?',
       o:['Nu: e o singură valoare, deci nu se pierde nimic','Da: apare la orice îmbinare de celule','Da, dar doar dacă titlul e foarte lung','Nu, fiindcă Excel nu îmbină celule goale'],ok:0,
       ajutor:'Când te avertizează Excel? Ce s-ar pierde aici?',why:'Avertismentul apare doar când zona are mai multe valori. Aici e numai titlul, deci Excel îmbină fără să întrebe.'}
     ]},

    /* ---------- PASUL 4: borduri, umplere, stiluri ---------- */
    {t:'Borduri, culoare de umplere și stiluri',
     text:`<p>Liniile gri ale foii nu apar la tipărire. Liniile tabelului le pui tu, cu <strong>Borduri (Borders)</strong>: butonul cu un pătrățel punctat, în grupul Font, rândul de jos. Săgeata ▾ din dreapta lui deschide lista, iar <strong>Toate bordurile (All Borders)</strong> trage o linie în jurul fiecărei celule selectate. Un clic pe pictogramă pune o singură bordură: la început, pe cea de jos.</p>
<p><strong>Culoare de umplere (Fill Color)</strong>, butonul cu găleată de lângă el, colorează fundalul celulei. <strong>B</strong> (Bold, aldin) îngroașă literele. Împreună scot în evidență capul de tabel.</p>
${fig('grup-font.webp',292,120,'Grupul Font din fila Home, cu butoanele Borders și Fill Color încadrate','În grupul <b>Font</b>: Borders (Borduri) și Fill Color (Culoare de umplere). Săgeata ▾ din dreapta fiecăruia deschide lista.')}`,
     exemplu:`${fig('meniu-borduri.webp',289,516,'Lista Borders din Excel: Bottom, Top, Left, Right Border, No Border, All Borders încadrat, Outside Borders, Thick Outside Borders și altele','Lista <b>Borders</b>: <b>All Borders</b> pune linii pe toate laturile fiecărei celule.')}
<p>Capul de tabel: selectezi A2:D2, apeși B și găleata. Tot tabelul: selectezi A2:D6, apoi Borders ▾ › All Borders.</p>
<p>Un <mark>stil predefinit</mark> e o formatare gata făcută, pusă dintr-un clic: Pornire (Home) › <strong>Stiluri celule (Cell Styles)</strong>, de exemplu <strong>Title</strong> pentru un titlu sau <strong>Good</strong> (verde) pentru un rezultat bun.</p>
${fig('galerie-stiluri.webp',823,488,'Galeria Cell Styles din Excel: Normal, Bad, Good, Neutral, stilurile de date, Heading 1-4, Title, Total și stilurile colorate Accent','Galeria <b>Cell Styles</b>: stiluri gata făcute, între ele <b>Title</b> și <b>Good</b>.')}`,
     incearca:{t:'excelx',q:'Pune linii pe tot tabelul <b>A1:C4</b>: selectează-l, apoi săgeata ▾ de lângă <b>Borders</b> (Borduri) › <b>All Borders</b> (Toate bordurile).',
       cols:4,rows:5,cells:{A1:'Elev',B1:'Suma',C1:'Cod',A2:'Ana',B2:150,C2:"'001",A3:'Bogdan',B3:75.5,C3:"'002",A4:'Cristi',B4:120,C4:"'003"},
       verifica:{forma:{borduri:{'A1:C4':'toate'}}},
       ajutor:'Tragi de la A1 la C4. Butonul Borders e în grupul Font; lista se deschide de la săgeata lui.',why:'Fiecare celulă din A1:C4 are acum linii pe toate laturile, iar pe hârtie tabelul arată ca un tabel.'},
     inca:[
      {t:'excelx',q:'Scoate în evidență capul de tabel <b>A1:C1</b>: fă-l aldin (<b>B</b>) și pune-i o culoare de umplere (găleata <b>Fill Color</b>).',
       cols:3,rows:4,cells:{A1:'Echipa',B1:'Puncte',C1:'Loc',A2:'Roboții',B2:87,C2:1,A3:'Inventatorii',B3:79,C3:2},
       verifica:{forma:{b:{'A1:C1':true},fill:{'A1:C1':true}}},
       ajutor:'Selectezi A1:C1, apoi B și găleata. Săgeata ▾ de lângă găleată deschide celelalte culori.',why:'Capul de tabel e aldin și colorat: se deosebește dintr-o privire de date.'},
      {t:'excelx',q:'Pune pe titlul din <b>A1</b> stilul <b>Title</b>: <b>Pornire (Home)</b> › <b>Cell Styles</b> (Stiluri celule) › Title.',
       cols:3,rows:4,cells:{A1:'Rezultatele concursului',A2:'Echipa',B2:'Puncte',A3:'Roboții',B3:87},
       verifica:{forma:{stil:{'A1':'Title'}}},
       ajutor:'Cell Styles e în grupul Stiluri (Styles). Title e în partea „Titles and Headings”.',why:'Stilul Title a pus dintr-un clic literele mari și culoarea titlului. Rândul 1 s-a înălțat singur.'},
      {t:'tf',q:'Liniile gri pe care le vezi pe foaie apar și pe hârtie, când tipărești tabelul.',ok:false,
       ajutor:'Recitește prima propoziție a pasului.',why:'Fals. Liniile gri ale foii nu se tipăresc. Pe hârtie apar doar bordurile, puse de tine.'}
     ]},

    /* ---------- PASUL 5: forma numerelor ---------- */
    {t:'Forma numerelor: zecimale, procent, dată',
     text:`<p>Grupul <strong>Număr (Number)</strong> schimbă forma în care se vede un număr, nu numărul:</p>
<ul><li><strong>Mărire zecimale (Increase Decimal)</strong> și <strong>Micșorare zecimale (Decrease Decimal)</strong>: 7,5 se vede 7,50 sau 8;</li>
<li><strong>%</strong> (Percent Style): 0,25 se vede 25%;</li>
<li>lista <strong>Format număr (Number Format)</strong> › <strong>Long Date</strong>: data 05.10.2026 se vede „luni, 5 octombrie 2026”.</li></ul>
<p>Valoarea din spate rămâne aceeași și o vezi în bara de formule. Dacă celula arată 7,13, iar bara de formule arată 7,125, Excel calculează cu 7,125. Un număr căruia i-ai ales zecimalele nu se mai rotunjește ca să încapă: dacă nu are loc, arată ####.</p>
${fig('grup-numar.webp',200,120,'Grupul Number din fila Home: lista Number Format sus; jos butoanele Accounting, procent, Comma Style, Increase Decimal și Decrease Decimal','Grupul <b>Număr (Number)</b>: lista de formate sus; jos %, apoi Increase Decimal (săgeata albastră spre stânga, cu .00) și Decrease Decimal (săgeata spre dreapta, cu .0).')}`,
     exemplu:`<div class="doua-imagini">${fig('valoare-spate.webp',430,160,'Excel: celula B1 arată 7,13, iar bara de formule arată 7,125','B1 arată 7,13, dar bara de formule arată valoarea: 7,125.')}${fig('procent-bara.webp',430,160,'Excel: celula B2 arată 13%, iar bara de formule arată 12,5%','B2 arată 13%, dar valoarea e 12,5%, adică 0,125.')}</div>
${fig('lista-formate.webp',258,643,'Lista Number Format deschisă în Excel: General, Number, Currency, Accounting, Short Date, Long Date, Time, Percentage, Fraction, fiecare cu un exemplu','Lista <b>Number Format</b> îți arată dinainte cum va arăta numărul.')}`,
     altfel:`<p>E ca ora de pe ceas: „14:30” și „două și jumătate” spun aceeași oră, scrisă altfel. Formatul schimbă doar cum e scris numărul, nu cât e.</p>`,
     incearca:{t:'excelx',q:'Sumele din <b>B2:B4</b> trebuie să se vadă cu două zecimale, ca 150,00. Selectează B2:B4 și apasă <b>Increase Decimal</b> (Mărire zecimale) până se văd două zecimale.',
       cols:3,rows:5,cells:{A1:'Elev',B1:'Suma',A2:'Ana',B2:150,A3:'Bogdan',B3:75.5,A4:'Cristi',B4:120},
       verifica:{forma:{format:{'B2:B4':{zecimale:2}},valori:true}},
       ajutor:'Increase Decimal e în grupul Număr (Number), rândul de jos, al patrulea buton: săgeata albastră spre stânga, cu 0 deasupra și .00 dedesubt. Merge și lista Number Format › Number.',why:'Sumele se văd acum 150,00, 75,50 și 120,00. În bara de formule, valorile sunt tot 150, 75,5 și 120.'},
     inca:[
      {t:'excelx',q:'În <b>C2:C4</b> sunt reducerile de preț: 0,1, 0,25 și 0,5. Arată-le ca procente, cu butonul <b>%</b> (Percent Style).',
       cols:3,rows:5,cells:{A1:'Produs',B1:'Preț',C1:'Reducere',A2:'Caiet',B2:8,C2:0.1,A3:'Stilou',B3:25,C3:0.25,A4:'Rucsac',B4:120,C4:0.5},
       verifica:{forma:{format:{'C2:C4':{procent:0}},valori:true}},
       ajutor:'Selectezi C2:C4, apoi butonul % din grupul Număr (Number).',why:'Reducerile se văd acum 10%, 25% și 50%. Valorile din spate sunt tot 0,1, 0,25 și 0,5.'},
      {t:'excelx',q:'Data excursiei din <b>B1</b> să se vadă lung, cu ziua săptămânii: lista <b>Number Format</b> (Format număr) › <b>Long Date</b>.',
       cols:3,rows:3,cells:{A1:'Excursia',B1:'09.10.2026'},
       verifica:{forma:{format:{'B1':{data:'lunga'}},faraDiez:'B1',valori:true}},
       ajutor:'Clic pe B1, apoi lista de sus din grupul Număr (Number). Long Date e a șasea în listă.',why:'B1 arată acum „vineri, 9 octombrie 2026”, iar Excel a lățit singur coloana ca să încapă.'},
      {t:'choice',q:'Celula arată 8, iar bara de formule arată 7,5. Cu ce număr face Excel calculele?',o:['Cu 7,5','Cu 8','Cu 7,50','Cu 7'],ok:0,
       ajutor:'Ce vezi în bara de formule?',why:'Cu 7,5. Celula doar arată numărul rotunjit (Decrease Decimal); valoarea din spate e 7,5.'}
     ]}
   ],
   atelier:{t:'excelx',titlu:'Atelier: lista excursiei, gata de pus la avizier',
    intro:`<p>Foaia de mai jos se poartă ca Excel-ul, cu fila <b>Pornire (Home)</b> a panglicii. Deasupra ei sunt <strong>testele</strong>: fiecare se bifează singur când partea lui e gata. Ai greșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> sau ↶. La final apasă <b>Verifică</b>.</p>
<p>Coloanele le potrivești la urmă: după ce se lățesc, tabelul nu mai încape pe ecranul unui telefon și trebuie să derulezi foaia.</p>
${fig('capcana-titlu.webp',510,191,'Excel: coloana A lățită mult după titlul lung din A1, pentru că titlul nu fusese îmbinat','Așa iese dacă potrivești coloana A înainte să îmbini titlul: A se lățește după titlu. Îmbină întâi titlul.')}`,
    q:'Fă din lista brută tabelul din imaginea „După”. <b>1.</b> Îmbină și centrează titlul peste <b>A1:D1</b>. <b>2.</b> Capul de tabel <b>A2:D2</b>: aldin și o culoare de umplere. <b>3.</b> Borduri pe toate laturile, pe <b>A2:D6</b>. <b>4.</b> Sumele <b>B3:B6</b> cu două zecimale. <b>5.</b> La urmă, potrivește coloanele <b>A</b> și <b>C</b>, ca numele și datele să se vadă întregi.',
    cols:5,rows:7,latimi:{C:6},cells:LISTA,
    verifica:{forma:unit(ATELIER_TESTE)},
    teste:ATELIER_TESTE,
    ajutor:'Titlul întâi (altfel dublu-clicul pe coloana A o lățește după titlu). Apoi A2:D2 → B și găleata. A2:D6 → Borders ▾ › All Borders. B3:B6 → Increase Decimal de două ori. La urmă, dublu-clic pe liniile dintre A și B, C și D (pe telefon: atingi litera, apoi de două ori cercul verde ⇔).',
    why:'Lista se citește acum dintr-o privire: titlul deasupra, numele și datele întregi, capul de tabel evidențiat, linii pe tot tabelul, sumele cu două zecimale. Valorile au rămas aceleași.',
    inca:[
     {t:'excelx',q:'Rezultatele concursului de robotică. <b>1.</b> Îmbină și centrează titlul peste <b>A1:C1</b>. <b>2.</b> Capul de tabel <b>A2:C2</b>: aldin și colorat. <b>3.</b> Borduri pe toate laturile, pe <b>A2:C5</b>. <b>4.</b> Reușita din <b>C3:C5</b> ca procent, cu butonul <b>%</b>. <b>5.</b> La urmă, potrivește coloana <b>A</b>.',
      cols:4,rows:6,cells:{A1:'Concursul de robotică: rezultate',A2:'Echipa',B2:'Puncte',C2:'Reușită',A3:'Roboții din Bicaz',B3:87,C3:0.87,A4:'Inventatorii',B4:79,C4:0.79,A5:'Mecanicii veseli',B5:92,C5:0.92},
      verifica:{forma:unit(CONCURS)},teste:CONCURS,
      ajutor:'Aceeași ordine ca la listă: titlul, capul de tabel, bordurile, procentul, iar la urmă coloana A.',
      why:'Tabelul concursului e gata: titlu deasupra, nume întregi, cap de tabel evidențiat, linii și procente.'}
    ]},
   qs:[
    {t:'choice',q:'Celula C4 arată 4%, iar bara de formule arată 3,6%. Cu ce valoare calculează Excel?',o:['Cu 3,6%, adică 0,036','Cu 4%, adică 0,04','Cu 3%, fără zecimale','Cu 36%, fără virgulă'],ok:0,
     ajutor:'Unde vezi valoarea din spate?',why:'Bara de formule arată valoarea: 3,6%, adică 0,036. Celula doar o arată rotunjită, 4%.'},
    {t:'excelx',q:'Punctajele din coloana <b>B</b> se văd ca ####. Fă-le să se vadă, fără să le schimbi.',
     cols:3,rows:5,latimi:{B:5},forme:{'B2:B4':{nfx:'#.##0,00'}},cells:{A1:'Echipa',B1:'Punctaj',A2:'Roboții',B2:1234.5,A3:'Mecanicii',B3:987.25,A4:'Inventatorii',B4:1502},
     verifica:{forma:{faraDiez:'B2:B4',format:{'B2:B4':{zecimale:2}},valori:true}},
     ajutor:'Coloana e prea îngustă. Linia ei e sus, între literele B și C.',why:'Coloana B e acum destul de lată: punctajele se văd întregi, cu cele două zecimale, iar valorile sunt aceleași.'},
    {t:'excelx',q:'Titlul din <b>A1</b> trebuie să stea deasupra întregului orar: îmbină și centrează <b>A1:C1</b>.',
     cols:3,rows:4,cells:{A1:'Orarul clubului de robotică',A2:'Ziua',B2:'Sala',C2:'Ora',A3:'Marți',B3:'Laboratorul TIC',C3:'14'},
     verifica:{forma:{imbinat:'A1:C1',centrat:true,valori:true}},
     ajutor:'Selectezi A1:C1, apoi Merge & Center.',why:'A1:C1 e o singură celulă, cu titlul la mijlocul orarului.'},
    {t:'excelx',q:'Tabelul notelor: fă capul de tabel <b>A1:C1</b> aldin (<b>B</b>) și pune borduri pe toate laturile, pe tot tabelul <b>A1:C4</b>.',
     cols:3,rows:5,cells:{A1:'Elev',B1:'Nota 1',C1:'Nota 2',A2:'Ioana',B2:9,C2:10,A3:'Mihai',B3:7,C3:8,A4:'Radu',B4:10,C4:9},
     verifica:{forma:{b:{'A1:C1':true},borduri:{'A1:C4':'toate'}}},
     ajutor:'Două selecții: A1:C1 → B; A1:C4 → Borders ▾ › All Borders.',why:'Capul de tabel e aldin, iar toate celulele au linii pe toate laturile.'},
    {t:'excelx',q:'Prezența la cercul de lectură, în <b>B2:B4</b>, e scrisă ca 0,8, 0,95 și 1. Arat-o ca procent: 80%, 95%, 100%.',
     cols:3,rows:5,cells:{A1:'Săptămâna',B1:'Prezență',A2:'1',B2:0.8,A3:'2',B3:0.95,A4:'3',B4:1},
     verifica:{forma:{format:{'B2:B4':{procent:0}},valori:true}},
     ajutor:'Butonul % din grupul Număr (Number).',why:'Prezența se vede acum 80%, 95% și 100%; valorile din spate au rămas 0,8, 0,95 și 1.'}
   ]}
  ],
  aplicatieReala:{aplicatie:'Excel-ul adevărat',titlu:'Acum în Excel-ul adevărat',
    intro:'<p>Faci lista excursiei în Excel, pe calculator, cu fișierul de mai jos. Pașii sunt aceiași ca în atelier.</p>',
    pasi:PROVOCARE},

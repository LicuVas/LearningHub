<!doctype html>

<meta name="description" content="Clasa a VIII-a, lecția 21: mini-proiectul unității Pagini web. Două pagini despre un proiect al clasei, după 8 cerințe (structură, paragrafe, fotografia cu sursa ei, listă sau tabel, legături care merg, formatare cu style, lista de verificare a lecției 20), cu grila profesorului și verificarea încrucișată între colegi, în Notepad și în browser.">

<style>
:root{
  --desk:#EDF1EC; --paper:#FFFFFF; --paper2:#F1F5F0; --line:#CBD6CC;
  --ink:#17201B; --ink2:#4C5A51; --accent:#0D6A56; --accentInk:#FFFFFF; --sel:#D2ECE3;
  --mark:#FFE08A; --markInk:#17201B; --ok:#1E6B3A; --okbg:#E1F1E6; --bad:#A8322A; --badbg:#F8E2DF;
  --fd:"Fraunces",Georgia,serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif; --fm:"Martian Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#101512; --paper:#18201B; --paper2:#1F2922; --line:#36463B;
  --ink:#E7EFE9; --ink2:#AEBDB3; --accent:#5FD0B4; --accentInk:#0E1411; --sel:#1F3A31;
  --mark:#EBCB55; --markInk:#17201B; --ok:#62C98A; --okbg:#16301F; --bad:#FF8A7F; --badbg:#3C201D;
}}
:root[data-theme="dark"]{
  --desk:#101512; --paper:#18201B; --paper2:#1F2922; --line:#36463B;
  --ink:#E7EFE9; --ink2:#AEBDB3; --accent:#5FD0B4; --accentInk:#0E1411; --sel:#1F3A31;
  --mark:#EBCB55; --markInk:#17201B; --ok:#62C98A; --okbg:#16301F; --bad:#FF8A7F; --badbg:#3C201D;
}
/* tema: fâșia de sus e fișa proiectului, cu cele 8 cerințe și căsuțele lor */
.banda{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;font-family:var(--fm);font-size:.68rem;color:var(--ink2);padding:3px 8px;border-bottom:1px dashed var(--line)}
.banda b{color:var(--accent);font-weight:600}
.banda .cs{display:inline-block;width:.8em;height:.8em;border:1.5px solid var(--ink2);border-radius:2px;margin-right:4px;vertical-align:-1px}
h1,h2{letter-spacing:-.01em}
pre.rand{font-family:var(--fm);font-size:.8rem;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:.4em 0;white-space:pre;overflow-x:auto;tab-size:8;-moz-tab-size:8;line-height:1.4}
ol.cerinte{margin:.4em 0 .6em;padding-left:1.6em}
ol.cerinte li{margin:.18em 0}
ol.lista-v{margin:.4em 0 .6em;padding-left:1.6em}
ol.lista-v li{margin:.15em 0}
.pasi-met{margin:.3em 0 .6em 1.2em;padding:0}
.pasi-met li{margin:.3em 0}
table.puncte{border-collapse:collapse;margin:.4em 0 .6em;font-size:.92rem;width:100%;max-width:30em}
table.puncte th,table.puncte td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.puncte td.n{text-align:center;white-space:nowrap;font-family:var(--fm);font-size:.82rem}
table.puncte thead th{background:var(--paper2)}
/* grila profesorului, ca tabel compact (reparația O, judecata 1 m10): capul coloanelor și criteriile întocmai */
table.grila{border-collapse:collapse;margin:.4em 0 .6em;font-size:.8rem;width:100%;table-layout:fixed;line-height:1.3}
table.grila th,table.grila td{border:1px solid var(--line);padding:3px 5px;text-align:left;vertical-align:top;overflow-wrap:break-word;hyphens:manual}
table.grila thead th{background:var(--paper2);font-weight:600}
table.grila tbody th{font-weight:600}
table.grila col.c1{width:25%}
.captura figcaption a{display:inline-block;padding:6px 0}
a.descarca{display:inline-block;padding:6px 0;font-weight:700}
@media (max-width:480px){pre.rand{tab-size:2;-moz-tab-size:2;font-size:.66rem;padding:6px}   /* pe telefon Tab-ul se arată îngust și litera mai mică, ca rândurile laboratorului să încapă la 390 px și în fereastra îngustă a pașilor (ca la VIII/16, VIII/20) */
  table.grila{font-size:.68rem}table.grila th,table.grila td{padding:2px 3px}}

<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<!-- simulatorul „Notepad + browser” (proprietar: lecția VIII/14) + extensiile lecțiilor 15 (Tab, scheletul), 16 (fișierele-imagine),
     20 (datele care nu se publică), 19 (stilurile citite de browser) și extensia NOUĂ a lecției 21 (cerințele proiectului, doar citire).
     editorweb-legaturi.js (VIII/18) NU e încărcat: cu editorweb-continut.js rescriu amândouă desenul browserului (capul lui). -->
<script src="../../_sim/editorweb.js"></script>
<script src="../../_sim/editorweb-schelet.js"></script>
<script src="../../_sim/editorweb-continut.js"></script>
<script src="../../_sim/editorweb-verificare.js"></script>
<script src="../../_sim/editorweb-stil.js"></script>
<script src="../../_sim/editorweb-proiect.js"></script>
<script src="img/imagini-sim.js"></script>
<script>
/* conținuturile programei (OMEN 3393/2017), textul exact din curriculum.json, clasa a VIII-a, „Pagini web” */
const P={editare:'Operații de editare a elementelor de conținut (paragraf, imagini, tabele, liste, legături): inserare, ștergere, mutare, copiere',
  formatare:'Operații de formatare la nivel de text, paragraf, fundal',securitate:'Securitate cibernetică'};

/* fotografia lacului (Gugalcrom123, CC0), aceeași ca la lecția VIII/16; proveniența în img/SURSE.json */
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const J=a=>a.join('\n');
const PRE=s=>`<pre class="rand">${X(s)}</pre>`;
const ES=window.EditorWebSchelet, EWC=window.EditorWebContinut, EV=window.EditorWebVerificare, EWS=window.EditorWebStil, PR=window.EditorWebProiect;
EWC.inregistreaza('bucura',window.IMAGINI_L21.bucura);
const LV=S=>S.live.text;
const DT='<!DOCTYPE html>', HL='<html lang="ro">', H='\t\t', R3='\t\t\t';
/* scheletul de la lecția 15, indentat; bodyStil = atributul style al lui <body> (lecția 19) */
const SCH=(titlu,corp,bodyStil)=>J([DT,HL,'\t<head>','\t\t<meta charset="utf-8">','\t\t<title>'+titlu+'</title>','\t</head>','\t<body'+(bodyStil?' style="'+bodyStil+'"':'')+'>',...corp,'\t</body>','</html>']);
/* imaginea ca la lecția 16 (alt pe rândul următor) și legătura ca la lecția 18 (pe 3-4 rânduri, ca să încapă pe telefon) */
const IA=(src,alt)=>[H+'<img src="'+src+'"',R3+'alt="'+alt+'">'];
const A3=(href,...text)=>[H+'<p><a',R3+'href="'+href+'">',...text.map((t,i)=>R3+t+(i===text.length-1?'</a></p>':''))];
const UL=(intro,items)=>[H+'<p>'+intro+'</p>',H+'<ul>',...items.map(x=>R3+'<li>'+x+'</li>'),H+'</ul>'];
const P_=t=>H+'<p>'+t+'</p>';
const EX='Excursia în Retezat', LB='Lacul Bucura', ALT='Lacul Bucura, între munți';
const FUNDAL='background-color: lightyellow;', H1S='color: navy; text-align: center;';
const H1=(t,st)=>H+'<h1'+(st?' style="'+st+'"':'')+'>'+t+'</h1>';
const SURSA='Foto: Gugalcrom123, CC0';
/* fișierele Anei (atelierul și exemplele de laborator): ca la lecțiile 16 și 18, cu lectia21 în nume */
const ANA1='Popescu_Ana_8A_lectia21.html', ANA2='Popescu_Ana_8A_lectia21_pagina2.html', ANA_FOTO='Popescu_Ana_bucura.jpg', ANA_VECHE='Popescu_Ana_8A_pagina2.html';
const AT1={exact:ANA1}, AT2={exact:ANA2};
const FOTO_ANA={n:ANA_FOTO,imagine:'bucura'}, FOTO={n:'bucura.jpg',imagine:'bucura'};
const IMG_URI={'bucura.jpg':window.IMAGINI_L21.bucura.uri,[ANA_FOTO]:window.IMAGINI_L21.bucura.uri};
const RUCSAC=['apă','o geacă de ploaie','un sandviș'];
/* prima pagină a Anei la sfârșitul laboratorului (pașii 4-7); pagina a doua se face DIN EA, cu Salvați ca (pasul 8, ca la
   lecția 18), apoi i se schimbă titlul și legătura (pasul 9): fotografia, sursa, lista și culorile vin cu ea (reparațiile B, C) */
const LAB_CORP=[H+'<h2>'+LB+'</h2>',P_('Am urcat trei ore pe munte.'),P_('Apa era rece și limpede.'),...IA(ANA_FOTO,ALT),P_(SURSA),...UL('În rucsac am luat:',RUCSAC)];

const COD={
  /* pagina Irinei (exemplul bun, P1 și P3): toate cerințele + un tabel ales de ea (3 rânduri, 2 coloane) */
  irina1:SCH(EX,[H1(EX,H1S),H+'<h2>'+LB+'</h2>',P_('Am urcat trei ore pe munte.'),P_('Apa era rece și limpede.'),...IA('bucura.jpg',ALT),P_(SURSA),
    ...UL('În rucsac am luat:',RUCSAC),H+'<table>',R3+'<tr><th>Ziua</th><th>Ce am văzut</th></tr>',R3+'<tr><td>Prima</td><td>Lacul Bucura</td></tr>',R3+'<tr><td>A doua</td><td>Cabana</td></tr>',H+'</table>',
    ...A3('irina_pagina2.html',LB)],FUNDAL),
  /* P1 Încă un exercițiu (era „Încearcă”, mutat la reparația D): pagina lui Radu, fără cerința 5 */
  p1_start:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),P_(SURSA)],FUNDAL),
  p1_rez:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),P_(SURSA),...UL('Pe drum am văzut:',['un lac','stânci mari','nori jos'])],FUNDAL),
  p1_gresit:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),P_(SURSA),...UL('Pe drum am văzut:',['un lac','stânci mari'])],FUNDAL),
  /* P1 „Încearcă” (obligatoriu; era „Încă un exercițiu”): fotografia fără textul alternativ — 1 minut de tastat, nu 3 */
  p1b_start:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Seara am dormit la cabană.'),H+'<img src="bucura.jpg">',P_(SURSA),...UL('În rucsac am luat:',RUCSAC)],FUNDAL),
  p1b_rez:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Seara am dormit la cabană.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),P_(SURSA),...UL('În rucsac am luat:',RUCSAC)],FUNDAL),
  p1b_gresit:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Seara am dormit la cabană.'),...IA('bucura.jpg','bucura.jpg'),P_(SURSA),...UL('În rucsac am luat:',RUCSAC)],FUNDAL),
  /* P3: pagina lui Radu (exemplul mai puțin bun): titlul galben pe alb, fără sursa fotografiei */
  radu:SCH(EX,[H1(EX,'color: yellow;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),...UL('Pe drum am văzut:',['un lac','stânci mari','nori jos'])]),
  p3_rez:SCH(EX,[H1(EX,'color: navy;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),...UL('Pe drum am văzut:',['un lac','stânci mari','nori jos'])]),
  p3_gresit:SCH(EX,[H1(EX,'color: gold;'),P_('Am mers cu clasa în Munții Retezat.'),P_('Am văzut Lacul Bucura de aproape.'),...IA('bucura.jpg','Lacul Bucura, cu munți în spate'),...UL('Pe drum am văzut:',['un lac','stânci mari','nori jos'])]),
  /* atelierul: proiectul Anei, aproape gata (pagina 1); pagina 2 e gata: fotografia cu sursa ei și legătura înapoi */
  at_start:SCH(EX,[H1(EX,H1S),H+'<h2>'+LB+'</h2>',P_('Am urcat trei ore pe munte.'),P_('Apa era rece și limpede.'),P_('Am plecat cu clasa de la Școala Gimnazială nr. 99 din Brașov.'),...IA(ANA_FOTO,ALT),...UL('În rucsac am luat:',RUCSAC.slice(0,2)),...A3(ANA_VECHE,LB)],FUNDAL),
  at_rez:SCH(EX,[H1(EX,H1S),...LAB_CORP,...A3(ANA2,LB)],FUNDAL),
  at_gresit:SCH(EX,[H1(EX,H1S),...LAB_CORP,...A3(ANA_VECHE,LB)],FUNDAL),
  at_p2:SCH(LB,[H1(LB,H1S),P_('Am stat o oră pe malul lacului.'),P_('Seara am dormit la cabană.'),...IA(ANA_FOTO,ALT),P_(SURSA),...A3(ANA1,'Înapoi la Excursia','în Retezat')],FUNDAL),
  /* atelierul 2: pagina a doua a lui Tudor — legătura înapoi spre un fișier care nu e în Documente, titlul alb pe galben-deschis */
  at2_start:SCH(LB,[H1(LB,'color: white;'),P_('Am stat o oră pe malul lacului.'),P_('Apa era rece și limpede.'),...A3('tudor.html','Înapoi la Excursia','în Retezat')],FUNDAL),
  at2_rez:SCH(LB,[H1(LB,'color: navy;'),P_('Am stat o oră pe malul lacului.'),P_('Apa era rece și limpede.'),...A3('tudor_excursia.html','Înapoi la Excursia','în Retezat')],FUNDAL),
  at2_gresit:SCH(LB,[H1(LB,'color: navy;'),P_('Am stat o oră pe malul lacului.'),P_('Apa era rece și limpede.'),...A3('tudor.html','Înapoi la Excursia','în Retezat')],FUNDAL),
  at2_p1:SCH(EX,[H1(EX,'color: navy;'),P_('Am urcat trei ore pe munte.'),P_('Apa era rece și limpede.'),...A3('tudor_pagina2.html',LB)],FUNDAL),
  /* întrebarea 2: legătura lui Matei, fără .html */
  q1_start:SCH(EX,[H1(EX,'color: navy;'),P_('Am urcat la Lacul Bucura.'),P_('Am dormit o noapte la cabană.'),...A3('Pop_Matei_8A_lectia21_pagina2',LB)],FUNDAL),
  q1_rez:SCH(EX,[H1(EX,'color: navy;'),P_('Am urcat la Lacul Bucura.'),P_('Am dormit o noapte la cabană.'),...A3('Pop_Matei_8A_lectia21_pagina2.html',LB)],FUNDAL),
  q1_gresit:SCH(EX,[H1(EX,'color: navy;'),P_('Am urcat la Lacul Bucura.'),P_('Am dormit o noapte la cabană.'),...A3('Pop_Matei_8A_lectia21_pagina2.htm',LB)],FUNDAL),
  q1_p2:SCH(LB,[H1(LB,'color: navy;'),P_('Lacul e între munți.'),...A3('Pop_Matei_8A_lectia21.html','Înapoi la Excursia','în Retezat')],FUNDAL),
  /* laboratorul: rândurile de scris (ca la lecțiile 17, 19 și 20) */
  lab_sursa_lista:J([P_(SURSA),...UL('În rucsac am luat:',RUCSAC)]),
  lab_h1:'<h1 style="color: navy; text-align: center;">',
  lab_body:'<body style="background-color: lightyellow;">',
  /* pasul 9: legătura înapoi, în pagina a doua (textul pe două rânduri, ca la lecția 18, ca să încapă pe telefon) */
  lab2:J(A3(ANA1,'Înapoi la Excursia','în Retezat')),
  /* paginile Anei la sfârșitul laboratorului (proba lor în Chromium: _proba/proba_coduri_l21.py, _proba/proba_reparatii.py) */
  lab_p1:SCH(EX,[H1(EX,H1S),...LAB_CORP,...A3(ANA2,LB)],FUNDAL),
  lab_p2:SCH(LB,[H1(LB,H1S),...LAB_CORP,...A3(ANA1,'Înapoi la Excursia','în Retezat')],FUNDAL)
};
window.COD_L21=COD;

/* cele 8 cerințe (aceleași în P1, în atelier și în laborator); textul vine din extensie, ca testele să aibă aceleași cuvinte.
   Fiecare spune pagina pe care se cere (reparația B, judecata 1: M1 + sonnet S1) */
const CER=PR.CERINTE, PAGINA={'prima':'prima pagină','amândouă':'amândouă paginile'};
const CER_HTML=`<ol class="cerinte">${CER.map((c,i)=>`<li>${c.ce} <span style="color:var(--ink2)">(lecția ${c.lectia}; ${PAGINA[c.pagina]})</span>${i===CER.length-1?'.':';'}</li>`).join('')}</ol>`;
const CER_SCURT=`<ol class="cerinte">${CER.map((c,i)=>`<li>${c.scurt}${c.pagina==='amândouă'?' (amândouă paginile)':''}${i===CER.length-1?'.':';'}</li>`).join('')}</ol>`;
/* lista de verificare a lecției 20, întocmai (LISTA din lectii/viii/m3-l20/index.html, după reparația j1) */
const LISTA=['Apare numele meu complet sau numele unui coleg?','Apare numele școlii mele?','Am fotografii cu oameni, cu ceva care arată cine sunt și unde stau, sau cu locul ascuns în fișier?','Am adresa, telefonul, e-mailul, data nașterii, CNP-ul sau programul meu (când plec, unde sunt la o anumită oră, unde sunt acum)?','Am parole, coduri sau documente (carnet, buletin, bilete)?','Numele fișierelor din cod, la <code>src</code> și la <code>href</code>, spun cine sunt?'];
const LISTA_HTML=`<ol class="lista-v">${LISTA.map(x=>`<li>${x}</li>`).join('')}</ol>`;
/* grila profesorului, întocmai (Info_Gimnaziu_2026/instrumente/Grila_produs.md), ca tabel compact (reparația O) */
const GRILA=[['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
  ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']];
/* pe telefon, cuvintele lungi se rup doar în locuri bune (cratimă moale, după „/”); textul rămâne întocmai */
const RUP=s=>s.replace('Corectitudinea','Corecti&shy;tudinea').replace('/textelor','/<wbr>textelor');
const GRILA_HTML=`<table class="grila"><colgroup><col class="c1"><col><col><col></colgroup><thead><tr><th>Criteriul</th><th>De bază (cu sprijin, model) · 10 p</th><th>Consolidat (indepen&shy;dent) · 14 p</th><th>Avansat (context nou, justificat) · 18 p</th></tr></thead><tbody>${GRILA.map((g,i)=>`<tr><th>${i+1}. ${RUP(g[0])}</th><td>${RUP(g[1])}</td><td>${RUP(g[2])}</td><td>${RUP(g[3])}</td></tr>`).join('')}</tbody></table>`;

/* testele comune ale exercițiilor într-o singură pagină (mod live): scheletul întreg */
const ORD={ce:'Scheletul paginii e întreg, cu fiecare etichetă închisă',fn:S=>ES.ordine(LV(S)),msg:'Nu șterge rândurile scheletului (&lt;head&gt;, &lt;/head&gt;, &lt;body&gt;, &lt;/body&gt;, &lt;/html&gt;) și închide fiecare etichetă pe care o deschizi (&lt;ul&gt; cu &lt;/ul&gt;, &lt;li&gt; cu &lt;/li&gt;).'};
/* mesajul cerinței 5, din ce e în pagină: spune doar ce e sigur adevărat — rândurile listei, rândurile și coloanele tabelului
   (reparația E, judecata 1 M4: „niciun tabel” doar când nu e niciun <table>) */
const cate=(n,unu,multe,zero)=>n===0?zero:n===1?unu:n+' '+multe;
const msgLista=s=>{if(s==null)return '';const r=PR.listaSauTabel(s),m=[];
  if(r.li>0)m.push(`Lista din corp are acum ${cate(r.li,'un singur rând','rânduri')} &lt;li&gt;; cerința 5 cere cel puțin 3: adaugă ${r.li===1?'încă două rânduri':'încă un rând'} &lt;li&gt;…&lt;/li&gt; înainte de &lt;/ul&gt;.`);
  /* (trecerea 3, punctul V: tabelul fără rânduri cu celule are propoziția lui, nu „are acum niciun rând”) */
  if(r.tabel>0)m.push(r.tr===0?'Tabelul din corp nu are încă niciun rând &lt;tr&gt; cu celule &lt;td&gt;; un tabel îndeplinește cerința 5 cu cel puțin 3 rânduri și 2 coloane.':`Tabelul din corp are acum ${cate(r.tr,'un singur rând','rânduri')} &lt;tr&gt; și ${cate(r.col,'o singură coloană (o celulă pe rând)','coloane','nicio coloană')}; un tabel îndeplinește cerința 5 cu cel puțin 3 rânduri și 2 coloane.`);
  return m.length?m.join(' '):'În corp (între &lt;body&gt; și &lt;/body&gt;) nu e încă nicio listă &lt;ul&gt; cu rânduri &lt;li&gt; și niciun tabel &lt;table&gt;.'};
/* mesajul legăturii, din ce e în pagină: ce scrie la href, unde duce de fapt și cum se numește pagina din Documente
   (reparația F, judecata 1 m1: „pagina de eroare” doar când browserul chiar o arată) */
function msgLeg(S,U,spec,laSpec,care){
  const l=PR.legaturi(S,U,spec),f=U.fisierElev(S,laSpec);
  const nume=f?f.n:(laSpec.exact||'');
  if(!l.length)return `În ${care} nu e nicio legătură &lt;a href="…"&gt; în corp, înainte de &lt;/body&gt;.`;
  const bun=l.find(x=>x.exista&&x.cale==='Documente/'+nume);
  if(bun&&!PR.textBun(bun.text))return `Legătura din ${care} duce unde trebuie, dar textul ei („${X(bun.text)}”) nu spune unde duce. Scrie, de exemplu, numele paginii.`;
  const g=l.find(x=>!x.exista)||l[0];
  let de;
  if(g.tip==='extern')de='duce la un site de pe Internet, nu la pagina ta';
  else if(g.gasit&&!g.exista)de=`duce la fișierul ${X(g.gasit)}, care nu e o pagină: browserul ar arăta acel fișier`;
  else if(g.exista)de=`duce la ${X(String(g.cale).replace(/^Documente\//,''))}`;
  else de='nu duce la niciun fișier din Documente: în browser ar apărea pagina de eroare';
  return `În ${care}, legătura are <code>href="${X(g.href)}"</code>: ${de}. Pagina la care trebuie să ducă se numește <code>${X(nume)}</code>.`;
}

  return u?`Textul „${X(u.text).slice(0,40)}” abia se vede pe fundal: alege o culoare închisă pe fundal deschis (sau invers), ca la lecția 19.`:''}
/* mesajul cerinței 7 */
function msgStil(s){if(s==null)return '';const f=PR.formatari(s);

  const r=EWS.lizibil(s);const u=r.rau&&r.rau[0];
  return u?`Textul „${X(u.text).slice(0,40)}” abia se vede pe fundal: alege o culoare închisă pe fundal deschis (sau invers), ca la lecția 19.`:''}
/* testul cu mesaj calculat la verificare */
const T=(ce,fn,msg)=>{let d='';const o={ce,fn(S,U){const ok=!!fn(S,U);d=ok?'':(msg(S,U)||'');return ok}};Object.defineProperty(o,'msg',{enumerable:true,get(){return d}});return o};

    /* ---------- PASUL 2: grila profesorului ---------- */
    {t:'Cum se notează: grila profesorului',
     text:`<p>Profesorul notează proiectul cu <mark>grila</mark> lui: 5 <mark>criterii</mark>, adică lucrurile după care judecă un produs, fiecare cu 0-18 puncte (se poate da și între repere, iar 0 dacă lipsește cu totul). Punctajul = criteriile + 10 din oficiu, cel mult 100. Nota = punctaj : 10, rotunjită; la ,5, în favoarea ta.</p>
<p>Bifele testelor din pagină nu sunt nota: nota o dă profesorul, pe grilă.</p>`,
     exemplu:`<p>Grila profesorului, întocmai:</p>${GRILA_HTML}<p>Nivelul, din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate. Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8. Dacă proiectul e nota modulului 3: nota din catalog = (80% din punctaj + punctele de pe LearningHub) : 10, ca la lecția 1.</p>`,
     altfel:`<p>Gândește-te la juriul unui concurs de dans. Nu dă o singură notă „din ochi”: are puncte separate pentru ritm, pentru costume și pentru coregrafie, apoi le adună. Grila e foaia juriului, pe care o știi dinainte.</p>`,
     incearca:{t:'classify',q:'Ce notă iese din grilă? Lângă fiecare proiect sunt punctele de la cele 5 criterii (fără cele 10 din oficiu).',cats:['Nota 6','Nota 7','Nota 8','Nota 9'],
       items:[['10, 10, 10, 10, 10',0],['14, 14, 10, 10, 14',1],['14, 14, 14, 10, 13',2],['18, 18, 14, 14, 18',3],['14, 10, 14, 14, 14',2]],
       ajutor:'Adună cele 5 numere, apoi adaugă 10 din oficiu. Împarte la 10 și rotunjește; la ,5, în sus.',
       why:'50 + 10 = 60 → 6. 62 + 10 = 72 → 7,2 → 7. 65 + 10 = 75 → 7,5 → 8 (la ,5, în favoarea elevului). 82 + 10 = 92 → 9,2 → 9. 66 + 10 = 76 → 7,6 → 8.'},
     inca:[
      {t:'tf',q:'Ana are toate bifele verzi în atelier. Deci are sigur nota 10 la proiect.',ok:false,
       ajutor:'Cine dă nota și după ce?',why:'Fals. Bifele arată doar că cerințele sunt în pagină. Nota o dă profesorul pe grilă, iar explicația ta și munca proprie nu le poate bifa un test.'}
     ]},

    /* ---------- PASUL 3: o pagină bună și una mai puțin bună (exemplu inventat, cu grila aplicată) ---------- */
    {t:'O pagină bună și una mai puțin bună',
     text:`<p>Două pagini inventate. Irina a lucrat singură și a făcut toate cerințele. În plus, a pus un tabel cu zilele excursiei, „ca să se vadă ce am văzut în fiecare zi”, iar culorile, „ca titlul să se vadă bine pe fundalul deschis”.</p>
<p>Radu a lucrat cu ajutorul unui coleg. Titlul lui, galben pe alb, abia se vede, legătura înapoi dă eroare, iar sub fotografie lipsește sursa.</p>`,
     exemplu:`<table class="puncte"><thead><tr><th>Criteriul</th><th>Irina</th><th>Radu</th></tr></thead><tbody>
<tr><td>Respectarea cerinței</td><td class="n">18</td><td class="n">8</td></tr>
<tr><td>Corectitudinea tehnică</td><td class="n">14</td><td class="n">10</td></tr>
<tr><td>Organizarea</td><td class="n">14</td><td class="n">10</td></tr>
<tr><td>Explicația</td><td class="n">14</td><td class="n">10</td></tr>
<tr><td>Munca proprie / sursele</td><td class="n">14</td><td class="n">10</td></tr></tbody></table>
<p>Irina: 74 + 10 = 84 → nota 8 (18 la cerință: tabelul în plus, ales motivat). Radu: 48 + 10 = 58 → nota 6 (8 la cerință, sub reperul de 10: îi lipsește sursa). E doar un exemplu: nota adevărată o dă profesorul.</p>`,
     altfel:`<p>Două prăjituri după aceeași rețetă: una cu toate ingredientele, coaptă bine, cu ceva în plus ales de bucătar; alta cu un ingredient uitat și arsă pe o parte. Juriul le notează pe aceeași foaie, criteriu cu criteriu.</p>`,
     incearca:{t:'editorweb',mod:'live',
       q:'Fă titlul lui Radu să se citească: în <code>style</code>, schimbă culoarea galbenă (<code>yellow</code>) cu una închisă, de exemplu <code>navy</code>, ca la lecția 19. Restul paginii rămâne cum e.',
       start:{text:COD.radu,fisier:'pagina_lui_radu.html',fisiere:{Documente:[Object.assign({},FOTO)]}},
       teste:[
        T('Titlul mare se citește ușor pe fundal',S=>{const s=LV(S);return /<h1\b[^>]*\bstyle\s*=/i.test(s)&&!/yellow/i.test(s)&&PR.seCiteste(s)},S=>{const s=LV(S);if(!/<h1\b[^>]*\bstyle\s*=/i.test(s))return 'Culoarea o schimbi în style-ul lui &lt;h1&gt;: nu șterge atributul style.';if(/yellow/i.test(s))return 'În style e încă <code>yellow</code>: scrie în locul lui o culoare închisă, de exemplu <code>navy</code>.';return msgCiteste(s)||'Alege o culoare închisă pe fundal alb, de exemplu navy, black sau darkgreen.'}),
        {ce:'Restul paginii e neschimbat: paragrafele, fotografia, lista',fn:S=>{const s=LV(S);return PR.paragrafe(s).length>=2&&EWC.seVede(S)&&PR.listaSauTabel(s).ok},msg:'Schimbi doar culoarea din style-ul titlului.'},
        ORD],
       rezolvare:[['scrie',COD.p3_rez]],gresit:[['scrie',COD.p3_gresit]],
       ajutor:'Rândul cu &lt;h1 style="color: yellow;"&gt;: în locul lui yellow scrii navy.',
       why:'Bleumarinul pe alb se citește ușor (contrast mare); galbenul și auriul pe alb abia se văd. E criteriul „Corectitudinea tehnică”: formatarea aleasă potrivit.'},
     inca:[
      {t:'classify',q:'Radu își repară pagina. La ce criteriu al grilei ajută fiecare schimbare?',cats:['Corectitudinea tehnică','Explicația','Munca proprie / sursele'],
       items:[['Repară legătura înapoi, ca să nu mai dea eroare',0],['Scrie sub fotografie autorul și licența',2],['Spune de ce a ales culorile paginii',1],['Face titlul să se citească pe fundal',0]],
       ajutor:'Recitește grila: ce spune fiecare criteriu la 14 puncte?',
       why:'Legătura care merge și titlul care se citește țin de operații făcute corect. Sursa sub fotografie ține de surse. „De ce am ales…” e explicația.'}
     ]},

    /* ---------- PASUL 4: metoda și verificarea încrucișată ---------- */
    {t:'Cum lucrezi: cerință cu cerință, apoi un coleg verifică',
     text:`<p>La laborator lucrezi așa:</p>
<ol><li>Faci cerințele una câte una: scrii în Notepad, apeși <kbd>Ctrl</kbd>+<kbd>S</kbd>, apoi <kbd>F5</kbd> în browser și te uiți dacă a ieșit.</li>
<li>Treci amândouă paginile prin lista de verificare a lecției 20, și în cod (<kbd>Ctrl</kbd>+<kbd>U</kbd>).</li>
<li>Faci <mark>verificarea încrucișată</mark>: un coleg îți ia paginile cerință cu cerință, în browser și în cod (<kbd>Ctrl</kbd>+<kbd>U</kbd>), iar tu pe ale lui. Vă spuneți ce lipsește; fiecare repară doar în paginile lui.</li>
<li>Scrii în caiet trei propoziții: ce ai făcut și de ce.</li></ol>`,
     altfel:`<p>Ca la cumpărături, cu lista în mână: iei un produs, îl bifezi, treci la următorul. La ieșire, un prieten se mai uită o dată în coș, cu lista ta, și îți spune dacă ai uitat ceva. Produsul uitat îl iei tu, nu el.</p>`,
     incearca:{t:'choice',q:'La verificarea încrucișată, Matei apasă în browser pe legătura ta spre pagina a doua și apare o pagină de eroare, cu ERR_FILE_NOT_FOUND. Ce faci?',
       o:['Compari numele din href, literă cu literă, cu cel din Explorer, apoi repari în Notepad și salvezi','Îl rogi pe Matei să scrie el legătura cea bună, în Notepad-ul tău','Ștergi legătura: fără legături, pagina nu mai dă nicio eroare','Apeși F5 de câteva ori, până se deschide singură pagina a doua'],ok:0,
       ajutor:'Ce ai învățat la lecția 18 despre pagina de eroare a unei legături?',
       why:'Pagina de eroare înseamnă că browserul nu găsește fișierul cu numele din href. Compari numele cu cel din Explorer, îl repari în pagina ta, Ctrl+S, apoi încerci din nou. Legătura e o cerință: nu o ștergi.'},
     inca:[
      {t:'choice',q:'Lista din pagina Elenei are doar două rânduri. La verificarea încrucișată, Radu observă. Ce urmează?',
       o:['Radu îi spune Elenei, iar Elena adaugă un rând în pagina ei','Radu adaugă rândul, în Notepad-ul Elenei','Radu nu spune nimic, ca să nu o supere','Elena șterge lista, ca să nu mai fie greșită'],ok:0,
       ajutor:'Cine repară în pagina cui?',why:'La verificarea încrucișată, colegul doar spune ce lipsește. Fiecare repară în paginile lui; cerința 5 cere cel puțin trei rânduri, deci Elena adaugă unul.'}
     ]}
   ],
   atelier:{t:'editorweb',mod:'notepad',titlu:'Atelier: proiectul Anei, cerință cu cerință',
    intro:`<p><b>Atelierul e pentru cine are timp:</b> o repetiție a laboratorului, în pagină. Fă întâi proiectul: treci la laborator cu butonul de jos „Acum la calculatorul din laborator: proiectul tău →”. Atelierul îl faci la sfârșit, dacă mai ai timp, din bara de jos (Atelier).</p>
<p>Mai jos ai un Notepad, folderul Documente și un browser, simulate. Deasupra lor sunt <strong>testele</strong>, câte unul pe cerință: se bifează singure când cerința e îndeplinită, dar nu sunt nota. Legăturile de aici nu se apasă: testul citește numele din <code>href</code> și caută fișierul în Documente, cum face browserul când apeși. Pe un ecran mic, treci de la o fereastră la alta cu butoanele de sub ele.</p>`,
    q:`Proiectul Anei (inventat) e aproape gata: prima pagină e deschisă în Notepad, iar a doua pagină și fotografia stau în Documente. <b>1.</b> Deschide prima pagină în browser: în Documente, dublu-clic pe ea (pe telefon, atinge-o de două ori, repede). <b>2.</b> Uită-te la testele care nu sunt bifate. <b>3.</b> Repară-le pe rând, în Notepad, în prima pagină. <b>4.</b> Salvează (<kbd>Ctrl</kbd>+<kbd>S</kbd>) și reîmprospătează browserul (<kbd>F5</kbd>).`,
    start:{fisiere:{Documente:[{n:ANA1,t:COD.at_start.replace(/\n/g,'\r\n')+'\r\n'},{n:ANA2,t:COD.at_p2.replace(/\n/g,'\r\n')+'\r\n'},Object.assign({},FOTO_ANA)]},notepad:{file:[{n:ANA1,dosar:'Documente'}]},dreapta:'explorer'},
    teste:EV.cuDiagnostic([
     {ce:'Cerința 1, pe amândouă paginile: scheletul întreg, cu titlul de pe filă și titlul mare',fn:(S,U)=>SCHELET(SRC1(S,U))&&SCHELET(SRC2(S,U)),faraOraData:true,msg:'Pe amândouă paginile: nu șterge rândurile scheletului, &lt;title&gt; și &lt;h1&gt;; închide fiecare etichetă pe care o deschizi.'},
     T('Cerința 2 (prima pagină): cel puțin două paragrafe despre temă',(S,U)=>{const s=SRC1(S,U);return !!s&&PR.paragrafe(s).length>=2},(S,U)=>'Lasă în pagină cele două paragrafe despre excursie: „Am urcat trei ore pe munte.” și „Apa era rece și limpede.”'),
     {ce:'Cerința 3 (prima pagină): fotografia se vede și are textul alternativ',fn:(S,U)=>{const s=SRC1(S,U);return !!s&&EWC.seVede(S,U,AT1)&&EWC.altBun(s)},msg:'Nu atinge rândurile cu &lt;img src="…"&gt; și alt="…": fotografia rămâne.'},
     T('Cerința 4, pe amândouă paginile: sub fiecare fotografie, sursa ei (Foto: Gugalcrom123, CC0)',(S,U)=>SURSE(SRC1(S,U),true)&&SURSE(SRC2(S,U),false),(S,U)=>SURSE(SRC1(S,U),true)?`Pe pagina a doua, sub fotografie, pe un rând nou, aceeași sursă: <code>&lt;p&gt;${SURSA}&lt;/p&gt;</code>.`:`Sub fotografie, pe un rând nou, după rândul cu alt="…"&gt;: <code>&lt;p&gt;${SURSA}&lt;/p&gt;</code>. Apoi <kbd>Ctrl</kbd>+<kbd>S</kbd>.`),
     T('Cerința 5 (prima pagină): lista are cel puțin 3 rânduri',(S,U)=>{const s=SRC1(S,U);return !!s&&PR.listaSauTabel(s).ok},(S,U)=>msgLista(SRC1(S,U))),
     T('Cerința 6: legătura spre pagina a doua și legătura înapoi duc la fișiere din Documente',(S,U)=>PR.duce(S,U,AT1,AT2)&&PR.duce(S,U,AT2,AT1),(S,U)=>PR.duce(S,U,AT1,AT2)?msgLeg(S,U,AT2,AT1,'pagina a doua'):msgLeg(S,U,AT1,AT2,'prima pagină')),
     T('Cerința 7 (prima pagină): cel puțin două formatări cu style, iar textul se citește ușor',(S,U)=>{const s=SRC1(S,U);return !!s&&PR.formatari(s).length>=2&&PR.seCiteste(s)},(S,U)=>msgStil(SRC1(S,U))),
     {ce:'Cerința 8: amândouă paginile trec lista de verificare a lecției 20',fn:(S,U)=>{const a=SRC1(S,U),b=SRC2(S,U);return !!a&&!!b&&PR.sigur(a)&&PR.sigur(b)},date:{tipuri:Object.keys(EV.TIPURI)},msg:'Ia lista lecției 20 rând cu rând, în amândouă paginile. Numele școlii nu se publică.'},
     {ce:'Browserul arată prima pagină, salvată acum',fn:(S,U)=>{const b=ES.src(S,U,{browser:AT1});return !!b&&U.test(S,{laZi:AT1})},msg:'În Documente, dublu-clic pe prima pagină. Dacă ai schimbat ceva după, <kbd>Ctrl</kbd>+<kbd>S</kbd> în Notepad și <kbd>F5</kbd> în browser.'}],{spec:AT1}),

    why:'Proiectul Anei are acum toate cele 8 cerințe: sursa sub fotografie, lista cu trei rânduri, legătura spre pagina a doua cu numele ei exact și nicio școală în pagină.',
    solutieText:'prima pagină a Anei are sursa „Foto: Gugalcrom123, CC0” sub fotografie, lista cu trei rânduri, legătura spre Popescu_Ana_8A_lectia21_pagina2.html și nu mai are propoziția cu școala; salvată și deschisă în browser.',
    inca:[
     {t:'editorweb',mod:'live',titlu:'Atelier: pagina a doua a lui Tudor',
      q:'Pagina a doua a lui Tudor (inventat) are două probleme: titlul alb nu se vede pe fundalul galben-deschis, iar legătura înapoi duce la un fișier care nu e în Documente. Repară-le: culoarea titlului, una închisă; la <code>href</code>, numele primei pagini, așa cum e în Documente. Legătura nu se apasă aici: testul citește numele din <code>href</code>.',
      start:{text:COD.at2_start,fisier:'tudor_pagina2.html',fisiere:{Documente:[{n:'tudor_excursia.html',t:COD.at2_p1.replace(/\n/g,'\r\n')+'\r\n'},Object.assign({},FOTO)]}},

       T('Legătura înapoi duce la prima pagină a lui Tudor, din Documente',S=>PR.legaturi(S,null,null).some(l=>l.exista&&/tudor_excursia\.html$/i.test(l.cale)&&PR.textBun(l.text)),S=>{const l=PR.legaturi(S,null,null),g=l.find(x=>!x.exista);return g?`Legătura are <code>href="${X(g.href)}"</code>, dar în Documente nu e o pagină cu numele acesta. Prima pagină a lui Tudor se numește <code>tudor_excursia.html</code>.`:'Pune legătura înapoi, &lt;a href="…"&gt;…&lt;/a&gt;, în corp.'}),
       ORD],
      rezolvare:[['scrie',COD.at2_rez]],gresit:[['scrie',COD.at2_gresit]],
      ajutor:'Sub zona de scris e dosarul Documente, ca în Explorer: prima pagină e tudor_excursia (Tip: Microsoft Edge HTML Document), deci numele ei întreg e tudor_excursia.html. Titlul: în locul lui white, navy.',
      why:'Titlul bleumarin se vede pe fundalul deschis, iar href are acum numele exact al primei pagini.'}

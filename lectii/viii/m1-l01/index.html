<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ce facem anul acesta. Criteriile de evaluare și cele trei niveluri. Evaluare inițială</title>
<meta name="description" content="Clasa a VIII-a, lecția 1: ce facem anul acesta la TIC (calcul tabelar, pagini web, șiruri de valori), cele trei niveluri De bază, Consolidat și Avansat, cum devine o lucrare notă și o evaluare inițială în care te verifici singur, fără notă.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Overpass+Mono:wght@400;600&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EFEDE6; --paper:#FFFFFF; --paper2:#F4F1E8; --line:#D8D2C2;
  --ink:#1F2320; --ink2:#5A5F57; --accent:#1D4F91; --accentInk:#FFFFFF; --sel:#DCE7F5;
  --mark:#FFE58A; --markInk:#1F2320; --ok:#2E6B30; --okbg:#E3F1E1; --bad:#B3261E; --badbg:#FBE4E1;
  --fd:"Alegreya",Georgia,serif; --fb:"Alegreya Sans","Segoe UI",system-ui,sans-serif; --fm:"Overpass Mono",Consolas,monospace;
  --m1:#D7261E; --m2:#1E5FB3; --m3:#E2B400;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#141612; --paper:#1D201B; --paper2:#262A23; --line:#3A3F36;
  --ink:#E8E6DE; --ink2:#A7AA9F; --accent:#8DB8F2; --accentInk:#141612; --sel:#22324A;
  --mark:#EFD25A; --markInk:#1F2320; --ok:#8FD18C; --okbg:#1E3320; --bad:#FF8A7E; --badbg:#3D1F1C;
  --m1:#FF6B5F; --m2:#6FA6F0; --m3:#F2CF4A;
}}
:root[data-theme="dark"]{
  --desk:#141612; --paper:#1D201B; --paper2:#262A23; --line:#3A3F36;
  --ink:#E8E6DE; --ink2:#A7AA9F; --accent:#8DB8F2; --accentInk:#141612; --sel:#22324A;
  --mark:#EFD25A; --markInk:#1F2320; --ok:#8FD18C; --okbg:#1E3320; --bad:#FF8A7E; --badbg:#3D1F1C;
  --m1:#FF6B5F; --m2:#6FA6F0; --m3:#F2CF4A;
}
/* tema: drumul anului, cu marcaje de traseu turistic (punct, bandă, triunghi) pentru cele trei unități */
.banda{display:grid;grid-template-columns:repeat(4,1fr);font-family:var(--fm);font-size:.68rem;color:var(--ink2);border-bottom:1px dashed var(--line)}
.banda span{display:flex;align-items:center;gap:5px;padding:3px 5px;border-left:1px dashed var(--line);white-space:nowrap;overflow:hidden}
.banda span:first-child{border-left:0}
.banda i{flex:none;display:inline-block;width:14px;height:14px;background:#fff;border:1px solid var(--line);position:relative}
.banda i::after{content:"";position:absolute}
.banda .p0 i::after{left:3px;top:3px;width:6px;height:6px;background:var(--ink2);border-radius:50%}
.banda .p1 i::after{left:3px;top:3px;width:6px;height:6px;background:var(--m1);border-radius:50%}
.banda .p2 i::after{left:0;top:4px;width:12px;height:4px;background:var(--m2)}
.banda .p3 i::after{left:2px;top:2px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:8px solid var(--m3)}
@media (max-width:420px){.banda .lung{display:none}}
h1,h2{letter-spacing:-.005em}
/* „Uite cum”: drumul anului pe lecții */
.drum{width:100%;border-collapse:collapse;font-size:.95rem}
.drum td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.drum td:first-child{font-family:var(--fm);font-size:.85rem;white-space:nowrap;color:var(--ink2)}
/* atelierul: evaluarea inițială (autoverificare), ținte de atingere de cel puțin 40 px */
.av-parte{margin:14px 0 6px;font-family:var(--fd);font-weight:800;font-size:1.02rem}
.av-parte small{font-family:var(--fb);font-weight:500;color:var(--ink2)}
.av-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;background:var(--paper)}
.av-item.ok{border-color:var(--ok);background:var(--okbg)}
.av-item.rau{border-color:var(--bad);background:var(--badbg)}
.av-q{margin:0 0 8px;line-height:1.4}
.av-nr{display:inline-block;min-width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:50%;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:.8rem;margin-right:6px}
.av-zona{display:block;font-size:.82rem;color:var(--ink2);margin-top:2px}
.av-opts{display:grid;gap:6px}
@media (min-width:700px){.av-opts.doua{grid-template-columns:1fr 1fr}}
.av-opts .opt{min-height:40px}
.av-opts .opt{display:flex;gap:8px;align-items:flex-start}
.av-opts .opt::before{content:"○";flex:none;font-weight:700;color:var(--ink2)}
.av-opts .opt.on::before{content:"●";color:var(--accent)}
.av-opts .opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--sel)}
.nw{white-space:nowrap}
.av-cod{display:block;font-family:var(--fm);font-size:.82rem;line-height:1.45;letter-spacing:0}
.av-cod .l{display:block}
.av-m{margin:6px 0 0;font-size:.9rem;color:var(--bad)}
.av-teste,.av-prima{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.av-teste ol,.av-prima ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.av-teste li,.av-prima li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.av-teste li .s,.av-prima li .s{flex:none;width:1.4em;text-align:center;font-weight:800}
.av-teste li.ok .s,.av-prima li.ok .s{color:var(--ok)}
.av-teste li.rau .s,.av-prima li.rau .s{color:var(--bad)}
.av-teste li .m,.av-prima li .m{display:block;font-size:.9rem;color:var(--ink2)}
.av-teste a,.av-prima a{color:var(--accent);font-weight:700;display:inline-block;min-height:32px;padding:6px 2px}
.av-sus{justify-content:space-between;align-items:center;gap:6px 10px;margin:8px 0 0}
.av-cine{border:2px solid var(--accent);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--paper)}
.av-cine ul{margin:6px 0 8px;padding-left:1.2em;display:grid;gap:4px}
.av-cine .captura{margin:8px 0 0;max-width:430px}
.av-alt{min-height:40px}
.av-caiet{margin:6px 0 0;font-size:.95rem}
.av-astept{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;background:var(--sel)}
.av-prima-lab{margin-top:8px}
/* pe telefon, butoanele categoriilor din exerciții au cel puțin 36 px */
@media (pointer:coarse),(max-width:760px){.seg button{min-height:38px}}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/rezultat-elev.js"></script>
<script>
/* Lecția 1 (organizare + evaluare inițială). Sursele, toate ale profesorului:
   Info_Gimnaziu_2026/data/unitati.json (unitățile și lecțiile anului), planificari/Calendar_ore_8A_8M.md și
   Calendar_ore_VIII.md (datele), SISTEM_EVALUARE.md §3-4 și instrumente/Fisa_criterii_elev_clasa_VIII.md (nivelurile,
   părțile lucrării, nota din punctaj, nivelul din notă, câte note), materiale/continut/teste_initiale.json (testul inițial al clasei a VIII-a).
   Detaliile și contradicțiile găsite: surse.md. */
const IMG='../m1-l01/img/';
const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const J='../../../jocuri/';
/* „Recitește”: legătura DOAR DE RECITIRE a motorului (…/<joc>/?recitire=N, N = numărul nivelului de pe ecran):
   deschide pașii nivelului N fără să-l deblocheze și fără să noteze (judecătorul, G2). Filă nouă: lecția rămâne. */
const REC=(slug,joc,niv)=>niv.map(([n,t],i)=>`<a href="${J}${slug}/?recitire=${n}" target="_blank" rel="noopener">${i?'':joc+', '}nivelul ${n}, „${t}”</a>`).join(' și ');
const ZONE=[
 {id:'tehno',ce:'Tehnoredactare (clasa a VII-a)',reciteste:REC('word-vii','Misiunea Tehnoredactor',[[6,'Vânătoarea de greșeli']])},
 {id:'fisiere',ce:'Fișierele și extensia lor (clasa a V-a)',reciteste:REC('fisiere-v','Misiunea Ordine',[[3,'Fișiere și foldere']])},
 {id:'algoritmi',ce:'Algoritmi cu repetiție (clasele a VI-a și a VII-a)',reciteste:REC('algoritmi-vi','Misiunea Buclă',[[3,'Repetiția cu contor'],[8,'Sume, numărări, cifre']])},
 {id:'program',ce:'Programul: date de intrare și depanare (clasa a VII-a)',reciteste:REC('program-vii','Misiunea Compilator',[[1,'De la enunț la program'],[7,'Găsesc și repar erorile']])},
 {id:'echipa',ce:'Lucrul în echipă, online (clasa a VII-a)',reciteste:REC('colaborare-vii','Misiunea Echipa',[[4,'Modific, urmăresc, public'],[7,'Povestea cu autor colectiv']])}
];
/* AL CUI E REZULTATUL (regula 23, calculatorul din laborator e COMUN): componenta comună lectii/_sim/rezultat-elev.js
   (window.RezultatElev). Lecția NU mai ține nimic singură: la „Verifică” salvează {zone, ales}; desenează din
   RezultatElev.citeste(K) (`rezultat` = PRIMA încercare, diagnosticul; ultima încercare dă răspunsurile de pe ecran)
   și redesenează la evenimentul `rezultat-elev`. Întrebările („Ești X?”, „… e a ta?”, „Ai dat-o tu?”) și rândul
   „Se salvează pe numele: X” le pune componenta (v2). Butonul „Sunt alt elev / Încep din nou” (componenta îl
   numește „Sunt alt elev” pentru elevul înscris) = RezultatElev.golesteAlElevuluiDeAcum(K); nu șterge nimic. */
const K_REZ='viii-m1-l01-initiala';
const REZ=()=>{try{return window.RezultatElev?window.RezultatElev.citeste(K_REZ):null}catch(x){return null}};
REZ();   // la încărcare: componenta află cheia paginii, ca să poată întreba „e a ta?” imediat după o înscriere, oriunde în lecție
const primaZone=r=>r&&r.rezultat&&r.rezultat.zone?r.rezultat.zone:null;
/* v3: citeste(K) e null și când fișa elevului înscris așteaptă „Ești X?” (încărcare nouă, 8 minute fără atingeri).
   Atunci lecția NU spune „nu e păstrată nicio verificare”, ci unde e fișa și ce apeși (judecata 4). */
const ASTEAPTA=()=>{try{return window.RezultatElev&&window.RezultatElev.asteaptaConfirmare?window.RezultatElev.asteaptaConfirmare(K_REZ):null}catch(x){return null}};
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mesajAsteapta=a=>`Pe calculator e verificarea lui <b>${escH(a.elev)}</b>, de la ora <b>${escH(a.ora)}</b>. Dacă ești ${escH(a.elev)}, apasă sus „Da” ca s-o vezi.`;
const ultimeleAlese=r=>{const x=r&&(r.reincercare||r.rezultat);return x&&x.ales?Object.assign({},x.ales):{}};
const ceH=z=>z.ce.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\s\(([^)]*)\)$/,' <span class="nw">($1)</span>');
const listaPrima=p=>ZONE.map(z=>`<li class="${p[z.id]?'ok':'rau'}"><span class="s">${p[z.id]?'✓':'✗'}</span><span>${ceH(z)}${p[z.id]?'':`<span class="m">de recitit: ${z.reciteste}</span>`}</span></li>`).join('');
/* Laboratorul (pasul 6) și diploma arată lista: locul ei e <div class="av-prima-lab">, umplut când apare și la fiecare
   eveniment `rezultat-elev` (alt elev, „e a ta?”, alt elev în altă filă, expirare). */
/* m14 (judecata 4): cât stă sus o întrebare a componentei fără răspuns (#lh-rez-q, de ex. „Pe calculator lucrează
   Ana Pop. Ești Ana Pop?”), verificarea elevului poate fi încă în filă: lecția NU spune „nu e păstrată… fă verificarea”,
   ci îl trimite întâi la întrebare. Criteriul e chiar întrebarea de pe ecran (adevărat literal: „Sus e o întrebare”). */
const intrebareSus=()=>{const q=document.getElementById('lh-rez-q');return q?(q.getAttribute('data-tip')||'?'):''};
const mesajSus=t=>t==='cine-esti'||t==='esti'
  ?'Sus e o întrebare despre cine ești: răspunde întâi la ea. Verificarea ta poate fi încă aici.'
  :'Sus e o întrebare despre o verificare făcută în fila asta: răspunde întâi la ea. Dacă nu e a ta, apasă „Nu” și fă verificarea ta în atelier.';
/* nota de deasupra întrebărilor din atelier: fișa așteaptă „Ești X?” sau sus e o întrebare fără răspuns */
function umpleNota(el){const arePrima=el.dataset.arePrima==='1',a=arePrima?null:ASTEAPTA(),q=arePrima?'':intrebareSus(),t=a?mesajAsteapta(a):(q?mesajSus(q):'');
  el.hidden=!t;if(el.innerHTML!==t)el.innerHTML=t}
function umpleLab(el){
  const p=primaZone(REZ()),a=p?null:ASTEAPTA();
  el.innerHTML=p
    ?`<b>Lista ta de la atelier (prima verificare):</b><ul>${listaPrima(p)}</ul><button type="button" class="btn ghost sm av-alt">Sunt alt elev / Încep din nou</button>`
    :a?`<p class="av-astept">${mesajAsteapta(a)}</p>`
    :intrebareSus()?`<p class="av-astept">${mesajSus(intrebareSus())}</p>`
    :'<b>În fila asta nu e păstrată nicio verificare a ta.</b> Apasă butonul „Atelier” din bara de sus a lecției și fă verificarea; lista apare apoi și aici.';
  const b=el.querySelector('.av-alt');if(b)b.onclick=()=>{window.RezultatElev&&window.RezultatElev.golesteAlElevuluiDeAcum(K_REZ);umpleLab(el)};
}
/* întrebarea componentei apare/dispare fără eveniment `rezultat-elev`: când se schimbă, laboratorul și nota se refac */
let qSus=null;
new MutationObserver(()=>{
  document.querySelectorAll('.av-prima-lab:not([data-umplut])').forEach(el=>{el.dataset.umplut='1';umpleLab(el)});
  const q=intrebareSus();
  if(q!==qSus){qSus=q;document.querySelectorAll('.av-prima-lab[data-umplut]').forEach(umpleLab);document.querySelectorAll('.av-nota').forEach(umpleNota)}
}).observe(document.documentElement,{childList:true,subtree:true});
addEventListener('rezultat-elev',()=>document.querySelectorAll('.av-prima-lab').forEach(umpleLab));
const LAB=[
  `Deschide o <b>filă nouă</b> în browser (apasă <b>+</b>, lângă fila de sus), ca lecția să rămână deschisă în fila ei. Clic în bara de adrese, sus, scrie <b>learninghub-8z6.pages.dev/lectii/viii/</b> și apasă <kbd>Enter</kbd>. Se deschide pagina „Lecțiile clasei a VIII-a”.
   ${fig(IMG+'pagina-clasei.webp',840,362,'Pagina Lecțiile clasei a VIII-a de pe LearningHub: firimiturile, titlul mare, banda Jocurile TIC și capul listei Modulul 1','Pagina „Lecțiile clasei a VIII-a”. Lecțiile stau în listă, sub „Modulul 1”.')}`,
  'Uită-te jos pe pagină, la caseta profesorului: trebuie să scrie numele tău, ca în atelier. Dacă scrie alt nume sau niciun nume, nu te înscrie aici: întoarce-te la fila lecției și fă ce scrie la începutul atelierului.',
  'Sub „Modulul 1”, primul rând e <b>L01</b>: lecția de azi. Apasă pe titlul ei și verifică: se deschide lecția de azi. Apoi întoarce-te la fila în care ai lucrat lecția.',
  'Deschide caietul de TIC. Scrie titlul <b>Ce facem anul acesta</b>. Dedesubt scrie cele trei unități, în ordine, fiecare cu o propoziție: la ce îți folosește.',
  'Scrie cele trei niveluri, fiecare cu cuvintele lui: <b>De bază</b> — cu model sau cu pașii dați; <b>Consolidat</b> — singur; <b>Avansat</b> — singur, într-o situație nouă.',
  'Scrie <b>Ce am de recitit</b> și, dedesubt, testele cu ✗ din prima ta verificare de la atelier, cu jocul și nivelul lor. Dacă toate au avut ✓, scrie „nimic”. Lista ta e și aici:<div class="av-prima av-prima-lab"></div>',
  'Verifică-te singur: în caiet ai trei unități, trei niveluri și lista „Ce am de recitit”. Dacă lipsește ceva, întoarce-te la pasul lui.'
];

/* atelierul se redeschide gol: prin butonul ultimului pas din bara lecției, apoi „La atelier” */
function reiaAtelier(){const ps=[...document.querySelectorAll('button[data-pas^="p"]')],ult=ps[ps.length-1];if(ult){ult.click();const nx=document.getElementById('pas-next');if(nx)nx.click()}}
/* ATELIERUL: evaluarea inițială ca autoverificare (fără notă, fără puncte: atelierul motorului nu punctează).
   Itemii sunt variante-soră ale testului inițial al profesorului (teste_initiale.json, clasa a VIII-a) + un item din
   clasa a V-a (extensia, fisiere-v); fiecare test = o zonă de materie, cu locul unde se recitește. */
const AUTOVERIFICARE={
  render(Q,body,api){
    const Z=Q.zone,I=Q.itemi,st={ales:{},prima:null};
    const r0=REZ();   // „← Înapoi la atelier”, reîncărcarea filei: prima verificare și ultimele răspunsuri verificate revin
    st.prima=primaZone(r0);Object.assign(st.ales,ultimeleAlese(r0));
    const ord={};I.forEach(it=>{ord[it.id]=it.tf?[0,1]:api.shuffle(it.o.map((_,k)=>k))});
    const PARTI={C:'Partea C <small>· ca la clasă, cu model (De bază)</small>',B:'Partea B <small>· singur, situație cunoscută (Consolidat)</small>',A:'Partea A <small>· situație nouă (Avansat)</small>'};
    /* CINE EȘTI se stabilește AICI, la începutul atelierului, în fila lecției, înainte de verificare (judecata 2, G1n):
       o schimbare de elev făcută în altă filă poate fi rescrisă de fila lecției (prezenta.js; se repară acolo). */
    let h=`<div class="av-cine"><b>Întâi spune cine ești, apoi răspunzi.</b> Jos pe pagină e caseta profesorului. Uită-te ce scrie în ea:<ul>
      <li>„Lucrezi pentru ora de informatică?”, eticheta „Spune cine ești” sau „Sunt elev — mă înscriu”: apasă pe <b>Spune cine ești</b> (sau pe etichetă). Alege școala și clasa, scrie-ți numele întreg, ca în catalog, și un cod de 4 cifre, pe care îl scrii în caiet. Apoi <b>Gata</b>.</li>
      <li>„Cine lucrează acum?”: apasă pe numele tău. Dacă nu ești în listă, apasă <b>Nu sunt în listă</b> și completezi ca mai sus.</li>
      <li>Eticheta cu numele altui elev, de exemplu „Profesorul vede activitatea ta · Pop A.” sau, strânsă, „Pop A. · Schimbă”: apasă pe ea, apoi <b>Nu ești tu? Schimbă elevul</b>. Apare „Cine lucrează acum?” sau formularul: te alegi ca mai sus.</li>
      <li>„Ești tot Ana Pop (8 A)?” cu numele altui elev: apasă <b>Nu, sunt alt elev</b>, apoi te alegi ca mai sus. Cu numele tău: <b>Da, sunt eu</b>.</li>
      <li>Eticheta cu numele tău: poți începe.</li>
      <li>Sus pot apărea întrebări despre verificare: „Pe calculator lucrează …. Ești …?”, „Pe calculator e verificarea lui …, de la ora …. Ești …?”, „Verificarea se scrie pe numele …. Ești …?”, „Verificarea de la ora … e a ta?”, „Ai dat-o tu pe cea de la ora …?” sau „Ai deja verificarea de la ora …. Și cea de la ora … e tot a ta?” (la asta, de obicei „Nu”). Apasă <b>Da</b> doar dacă e numele tău și verificarea ai făcut-o tu.</li></ul>
      ${fig(IMG+'spune-cine-esti.webp',420,166,'Caseta de jos a paginii: întrebarea Lucrezi pentru ora de informatică?, cu butoanele Spune cine ești și Nu, doar vizitez','Caseta de jos a paginii, pe un calculator pe care nu s-a înscris încă nimeni.')}
      <div class="row av-sus"><span class="hint">Ai venit după alt elev la calculatorul ăsta? Apasă butonul „Sunt alt elev”. Dacă jos apare „Cine lucrează acum?”, te alegi din listă.</span><button type="button" class="btn ghost sm av-alt">Sunt alt elev / Încep din nou</button></div></div>
      <p class="av-astept av-nota" hidden></p>`,n=0,p='';
    I.forEach(it=>{
      if(it.parte!==p){p=it.parte;h+=`<div class="av-parte">${PARTI[p]}</div>`}
      n++;const o=it.tf?['Adevărat','Fals']:it.o,z=Z.find(x=>x.id===it.zona);
      h+=`<div class="av-item" data-id="${it.id}"><p class="av-q"><span class="av-nr">${n}</span>${it.q}<span class="av-zona">${api.esc(z.ce)}</span></p>

    });
    h+=`<div class="av-teste"><b>Testele</b> <span class="hint">· se bifează când apeși „Verifică”</span><ol>${Z.map(z=>`<li data-z="${z.id}"><span class="s">○</span><span>${ceH(z)}<span class="m"></span></span></li>`).join('')}</ol></div>

    body.innerHTML=h;
    const arataPrima=()=>{const pr=body.querySelector('.av-prima');pr.hidden=!st.prima;if(st.prima)pr.querySelector('ul').innerHTML=listaPrima(st.prima);
      const as=body.querySelector('.av-nota');as.dataset.arePrima=st.prima?'1':'0';umpleNota(as)};   // v3: fișa așteaptă „Ești X?” / m14: întrebare sus

       deschide lista „Cine lucrează acum?”; atelierul se redeschide gol */
    body.querySelectorAll('.av-alt').forEach(b=>b.onclick=()=>{if(window.RezultatElev)window.RezultatElev.golesteAlElevuluiDeAcum(K_REZ);reiaAtelier()});
    const bun=it=>{const a=st.ales[it.id];return a!==undefined&&(it.tf?(a===0)===it.ok:a===it.ok)};
    const deseneaza=()=>{I.forEach(it=>{body.querySelectorAll(`.av-item[data-id="${it.id}"] .opt`).forEach(b=>{const on=+b.dataset.k===st.ales[it.id];b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))})})};
    body.querySelectorAll('.av-item').forEach(el=>{
      const it=I.find(x=>x.id===el.dataset.id);
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(api.done())return;st.ales[it.id]=+b.dataset.k;el.classList.remove('ok','rau');el.querySelector('.av-m').hidden=true;deseneaza()});
    });
    deseneaza();arataPrima();
    const curata=()=>{body.querySelectorAll('.av-item').forEach(el=>{el.classList.remove('ok','rau');el.querySelector('.av-m').hidden=true});
      body.querySelectorAll('.av-teste li').forEach(li=>{li.classList.remove('ok','rau');li.querySelector('.s').textContent='○';li.querySelector('.m').innerHTML=''})};
    /* s-a schimbat elevul, „e a ta?”, altă filă, expirare: ecranul arată ce e al elevului de acum (componenta) */
    const laEveniment=e=>{
      if(!body.isConnected){removeEventListener('rezultat-elev',laEveniment);return}
      if(e.detail&&e.detail.motiv==='salvat')return;
      const r=REZ(),p=primaZone(r);
      if(api.done()){if(JSON.stringify(p)!==JSON.stringify(st.prima))reiaAtelier();return}
      st.prima=p;Object.keys(st.ales).forEach(k=>delete st.ales[k]);Object.assign(st.ales,ultimeleAlese(r));
      curata();deseneaza();arataPrima()};

      const rez={};
      Z.forEach(z=>{const ok=I.filter(it=>it.zona===z.id).every(bun),li=body.querySelector(`.av-teste li[data-z="${z.id}"]`);rez[z.id]=ok;
        li.classList.toggle('ok',ok);li.classList.toggle('rau',!ok);li.querySelector('.s').textContent=ok?'✓':'✗';
        li.querySelector('.m').innerHTML=ok?'':`Recitește: ${z.reciteste}`});
      // componenta ține PRIMA încercare (diagnosticul) și pune numele doar pentru elevul confirmat
      const v=window.RezultatElev?window.RezultatElev.salveaza(K_REZ,{zone:rez,ales:Object.assign({},st.ales)}):null;
      st.prima=v?primaZone(v):(st.prima||rez);arataPrima();
      return Z.filter(z=>rez[z.id]).length;
    }
    const nav=api.checkButton(()=>{
      const lipsa=I.filter(it=>st.ales[it.id]===undefined).length;
      if(lipsa){api.feedback('bad',`<strong>Mai ai ${lipsa===1?'o întrebare':lipsa+' întrebări'} fără răspuns.</strong> Alege câte un răspuns la fiecare, apoi apasă din nou „Verifică”.`);return}

      if(ok===Z.length){nav.innerHTML='';api.resolve(true)}

        api.revealButton(()=>{I.forEach(it=>{st.ales[it.id]=it.tf?(it.ok?0:1):it.ok});deseneaza();marcheaza();nav.innerHTML='';api.giveUp('răspunsurile bune sunt alese acum, iar întrebările sunt verzi. Lista „Prima ta verificare” a rămas: acolo scrie ce ai de recitit.')})}

  },
  rezolva(Q,body){body._av.pune(body._av.corecte())},
  gresit(Q,body){body._av.pune(Object.assign(body._av.corecte(),Q.gresit))}
};

     text:`<p><mark>LearningHub</mark> e situl acesta, cu lecțiile și jocurile clasei. La lucrarea (sau proiectul) dintr-un <mark>modul</mark> (perioada dintre două vacanțe), <b>nota din catalog</b> = (80% din punctajul lucrării + punctele de pe LearningHub) : 10, rotunjită ca nota lucrării.</p>
<p>Pe LearningHub ai <b>cel mult 20 de puncte</b>:</p>
<ul><li>2 din oficiu;</li>
<li>până la 8 dacă termini ce s-a dat clasei;</li>
<li>până la 6 dacă lucrezi fără „Arată-mi răspunsul” (apare după două greșeli) și nimerești din prima;</li>
<li>până la 4 pentru jocurile în plus.</li></ul>
<p>Contează ce termini, nu minutele. Regula se aplică de la ora în care o anunță profesorul; ce ai făcut înainte te poate doar ajuta.</p>`,
     exemplu:`<p>Ana: 100 de puncte la lucrare și nimic pe LearningHub. (80 + 2) : 10 = 8,2, deci <b>8</b>.</p>
<p>Bogdan: 60 de puncte și tot pe LearningHub. 80% din 60 = 48; (48 + 20) : 10 = 6,8, deci <b>7</b>.</p>
<p>Fără calculator sau internet acasă, faci aceeași muncă la oră, la calculatorul școlii, sau pe foaie. Lecția din ziua în care ai lipsit motivat nu se numără. Copiatul și lucrarea nepredată rămân nota 1.</p>`,

    /* ---------- PASUL 5 (până pe 07.10.2026: PASUL 4): din notă, nivelul ---------- */
    {t:'Din notă, nivelul',
     text:`<p>Niciun document oficial nu leagă nivelul de notă. Regula profesorului tău: nivelul se citește din notă.</p>
<ul><li>9 sau 10: <b>Avansat</b>;</li>
<li>7 sau 8: <b>Consolidat</b>;</li>
<li>5 sau 6: <b>De bază</b>;</li>
<li>3 sau 4: <b>În formare</b>;</li>
<li>1 sau 2: <b>În dificultate</b>.</li></ul>
<p>Ministerul numește cinci niveluri. Ultimele două, sub De bază, arată ce sprijin îți trebuie: ajutor doar pentru tine, care se poate da la oră (În formare), sau ajutor special, în afara orei (În dificultate).</p>
<p>Fiecare elev primește, pe an, cel puțin un <mark>plan individualizat de învățare</mark>: pașii lui următori. Sub nota 5, pașii te duc la De bază.</p>
<p>Părțile arată ce ai de lucrat.</p>`,
     exemplu:`<p>Radu are C 25 din 40, B 28 din 30, A 19 din 20. Nota 8, deci nivelul <b>Consolidat</b>.</p>
<p>A pierdut 15 puncte la C, 2 la B și 1 la A. Are de lucrat mai ales la partea C: exercițiile cu model.</p>
<p>Lângă notă primești scris <b>unde ești</b> și <b>care e pasul următor</b>.</p>`,
     altfel:`<p>Nota e cifra, iar, după regula profesorului, nivelul e numele ei: 9 și 10 se numesc Avansat, 7 și 8 Consolidat, 5 și 6 De bază. Părțile C, B și A sunt ca rândurile unui bon de la magazin: totalul e suma lor, iar fiecare rând îți arată pe ce s-au dus banii. Din ele vezi unde ai pierdut puncte.</p>`,
     incearca:{t:'classify',q:'Ce nivel arată fiecare lucrare? (punctele de la părțile C, B și A; cele 10 din oficiu le adaugi tu)',cats:['În formare','De bază','Consolidat','Avansat'],
       items:[['C 38, B 27, A 15',3],['C 18, B 14, A 20',1],['C 36, B 20, A 3',2],['C 22, B 6, A 2',0],['C 25, B 9, A 1',1]],

       why:'C 38, B 27, A 15: 90 de puncte, nota 9, Avansat. C 18, B 14, A 20: 62, nota 6, De bază, chiar dacă A e plin. C 36, B 20, A 3: 69, nota 7, Consolidat. C 22, B 6, A 2: 40, nota 4, În formare. C 25, B 9, A 1: 45, adică 4,5, rotunjit în favoarea elevului: nota 5, De bază.'},

       pe LearningHub intră în nota din catalog de la lucrarea de modul (pasul 4): textul, „altfel” și explicația clasificării. ---------- */
    {t:'Câte note primești și media anuală',
     text:`<p>Anul școlar are 5 <mark>module</mark>: perioade de cursuri, despărțite de vacanțe. Nu le confunda cu unitățile de învățare, care sunt temele anului.</p>
<p>Profesorul tău îți dă cel puțin o notă în fiecare modul, deci cel puțin 5 pe an. Nota vine dintr-o lucrare, la sfârșitul unei unități, sau dintr-un proiect făcut la oră.</p>
<p>La final se face o singură <mark>medie anuală</mark>: media notelor, rotunjită; la ,50 rotunjirea e în favoarea ta.</p>
<p><b>Testul de la început nu se notează.</b> Nici exercițiile de la fiecare oră: munca de pe LearningHub nu are notă separată, ci intră în nota din catalog de la lucrarea de modul.</p>`,
     exemplu:`<p>Notele lui Vlad pe an: 7, 9, 8, 6 și 9. Suma lor e 39. Împarți la 5, câte note sunt: 7,8. Rotunjit, media anuală e <b>8</b>.</p>`,

<meta name="description" content="Clasa a VIII-a, lecția 12 (Excel, mini-proiect): faci singur, cu date reale culese de tine, registrul cerut de profesor: tabel, cel puțin trei formule, o funcție de decizie, un grafic și o concluzie scrisă; pagina îți propune și o sortare. Te verifici cu grila profesorului.">

<style>
:root{
  --desk:#EEF3F0; --paper:#FFFFFF; --paper2:#EDF4EF; --line:#CBD8CF;
  --ink:#17241C; --ink2:#4F6156; --accent:#1D6B44; --accentInk:#FFFFFF; --sel:#D9EEE1;
  --mark:#FFE08A; --markInk:#17241C; --ok:#1F6F3F; --okbg:#E1F2E7; --bad:#B3302A; --badbg:#FAE3E1;
  --fd:"Archivo","Segoe UI",system-ui,sans-serif; --fb:"Public Sans","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1512; --paper:#17201B; --paper2:#1F2B24; --line:#334539;
  --ink:#E3EEE7; --ink2:#9CB3A5; --accent:#7FD3A5; --accentInk:#0F1512; --sel:#1F3D2C;
  --mark:#EBCB55; --markInk:#17241C; --ok:#5CCB8E; --okbg:#14301F; --bad:#FF7F75; --badbg:#3B1F1D;
}}
:root[data-theme="dark"]{
  --desk:#0F1512; --paper:#17201B; --paper2:#1F2B24; --line:#334539;
  --ink:#E3EEE7; --ink2:#9CB3A5; --accent:#7FD3A5; --accentInk:#0F1512; --sel:#1F3D2C;
  --mark:#EBCB55; --markInk:#17241C; --ok:#5CCB8E; --okbg:#14301F; --bad:#FF7F75; --badbg:#3B1F1D;
}
/* tema: fâșia de sus e un tabel mic urmat de un grafic cu coloane (tabel → formule → grafic) */
.banda{display:flex;align-items:flex-end;gap:3px;height:14px;padding:0 8px;border-bottom:1px solid var(--line);overflow:hidden}
.banda b{display:block;width:16px;height:12px;border:1px solid var(--accent);border-radius:1px;opacity:.55}
.banda i{display:block;width:9px;border-radius:1px 1px 0 0;background:var(--accent)}
.banda i:nth-child(even){opacity:.6}
h1,h2{letter-spacing:-.01em}
.descarca{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.mic{font-size:.9rem;color:var(--ink2)}
/* laboratorul: tema, varianta, produsul-exemplu, grila profesorului (copiată întocmai) */
.pl-teme{display:grid;gap:8px;grid-template-columns:1fr;margin:8px 0 12px}
@media (min-width:700px){.pl-teme{grid-template-columns:repeat(3,1fr)}}
.pl-tema{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper2)}
.pl-tema h4{margin:2px 0 4px;font-family:var(--fd)}
.pl-tema ul{margin:4px 0;padding-left:1.1em}
.pl-tema li{margin:2px 0}
.pl-var{border:1.5px solid var(--accent);border-radius:10px;padding:8px 12px;background:var(--paper);margin:8px 0}
.pl-var p{margin:4px 0}
.pl-grila{display:grid;gap:8px;margin:6px 0}
.pl-crit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.pl-crit ul{margin:4px 0 6px;padding-left:1.1em}
.pl-niv{display:flex;flex-wrap:wrap;gap:6px}
.pl-niv button{min-height:36px;min-width:36px;padding:4px 10px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper2);color:var(--ink);font:inherit;cursor:pointer}
.pl-niv button[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.pl-calc{border:1.5px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--paper);margin:8px 0}
.pl-calc p{margin:4px 0}
.pl-ex{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);margin:8px 0}
.pl-ex p{margin:4px 0}
.pl-ex .pl-v{display:grid;gap:6px;margin:6px 0}
.pl-ex .pl-v button{min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper2);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pl-ex .pl-v button.ok{border-color:var(--ok);background:var(--okbg)}
.pl-ex .pl-v button.bad{border-color:var(--bad);background:var(--badbg)}
.pl-ex .pl-r.ok{color:var(--ok)}
.pl-ex .pl-r.bad{color:var(--bad)}
.pl-diploma{margin:14px 0}
.pl-nou{margin-top:8px}
/* în pașii laboratorului: adresele variantei scurte, sub cele ale variantei întregi (registrul j1, punctul A) */
.pl-vs{display:block;margin-top:5px;padding:2px 0 2px 8px;border-left:3px solid var(--accent)}
.pl-prop{font-size:.85em;font-weight:600;color:var(--ink2)}
/* regula 20: pe ecranele cu atingere, orice zonă de atins are cel puțin 32 px (legăturile din explicațiile capturilor,
   filele și antetele foilor din exerciții; panglica mărită de 1,75 ori, ca în excelx-formatare.js; pătrățelul de umplere

  .rb .tabs button{min-height:32px}
  #body .pg .pg-banda{zoom:1.75}
  #body thead th,#body tbody th{min-width:32px;height:32px}
  td:has(> .fh){overflow:visible}
  .fh::after{content:"";position:absolute;left:-12px;top:-12px;width:32px;height:32px}
}

<!-- foaia „excelx” comună clasei a VIII-a și extensiile lecțiilor 7-11, NEMODIFICATE; plus extensia lecției 12:
     atelierul în trei etape (excelx-proiect.js), care le folosește pe toate -->

<script>
/* LECȚIA 12, clasa a VIII-a, modulul 2 (consolidare, mini-proiect; revizuirea LearningHub, standardul din 27.09.2026).
   Nu predă nimic nou din Excel: îl duce pe elev prin produsul lui, pas cu pas, cu trimiteri la lecțiile 3-11.
   Nou e doar grila după care se notează proiectul (Info_Gimnaziu_2026/instrumente/Grila_produs.md, copiată întocmai).
   Faptele „dacă faci X, apare Y”: afirmatii.json (probele în Excel real: _proba/proba_excel*.json). */

/* conținuturile programei (OMEN 3393/2017), textul exact din curriculum.json */
const P={formule:'Formule de calcul care utilizează operatori aritmetici (+, -,*, /)',functii:'Funcții specifice aplicaţiei de calcul tabelar pentru sumă, maxim, minim, medie aritmetică şi decizie',
  sortare:'Sortarea crescătoare/descrescătoare a datelor dintr-un tabel după unul sau mai multe criterii',grafice:'Grafice: tipuri de grafice'};

const fig=(src,w,h,alt,cap)=>`<figure class="captura"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG='../m2-l12/img/';
const IMG3='../m1-l03/img/';
const CR_TARG='Fotografie: Jmpatel95, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:2017-02-18_Elementary_Science_Fair_1.jpg" target="_blank" rel="noopener">Wikimedia Commons</a> (decupată).';

/* ---------- grila profesorului: Info_Gimnaziu_2026/instrumente/Grila_produs.md, ÎNTOCMAI ---------- */
const GRILA=[
  ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
  ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
  ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
  ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
  ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']];
const NIV=['De bază (cu sprijin, model)','Consolidat (independent)','Avansat (context nou, justificat)'];   // capetele de coloană, întocmai
const REP=[10,14,18];   // reperele în puncte ale celor trei coloane: „· 10 p”, „· 14 p”, „· 18 p”
const ALEG=[[0,'Lipsește cu totul · 0 p'],[10,'De bază · 10 p'],[14,'Consolidat · 14 p'],[18,'Avansat · 18 p']];
/* nota = punctaj : 10, rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului (punctajul e un număr întreg) */
const notaDin=p=>Math.floor((p+5)/10);
const nivelDin=n=>n>=9?'Avansat':n>=7?'Consolidat':n>=5?'De bază':n>=3?'În formare, cu plan de recuperare':'În dificultate, cu plan de recuperare';
const nr=v=>String(v).replace('.',',');
/* exercițiile de notare din laborator: [varianta, 1 = corectă, explicația]; fiecare variantă greșită are O singură greșeală
   a regulii de azi (fără oficiu, patru criterii, rotunjire în jos, nivel citit greșit) */
const EX=[
  {nume:'Bianca',q:'Bianca a primit la cele 5 criterii: 18, 14, 18, 14 și 18 puncte. Ce notă și ce nivel are proiectul ei?',o:[
    ['82 de puncte → nota 8, Consolidat',0,'Ai adunat criteriile, dar ai uitat cele 10 puncte din oficiu.'],
    ['74 de puncte → nota 7, Consolidat',0,'Ai adunat doar primele 4 criterii. Se adună toate cele 5, plus 10 din oficiu.'],
    ['92 de puncte → nota 9, Consolidat',0,'Nota 9 e bună, dar nivelul se citește din notă: 9 sau 10 înseamnă Avansat.'],
    ['92 de puncte → nota 9, Avansat',1,'18 + 14 + 18 + 14 + 18 = 82, plus 10 din oficiu = 92. Nota: 92 : 10 = 9,2, rotunjit: 9. Nivelul, din notă: Avansat.']]},
  {nume:'Tudor',q:'Tudor a primit și puncte între repere: 11, 15, 12, 16 și 11. Ce notă și ce nivel are proiectul lui?',o:[
    ['65 de puncte → nota 7, Consolidat',0,'Ai uitat cele 10 puncte din oficiu.'],
    ['75 de puncte → nota 8, Consolidat',1,'11 + 15 + 12 + 16 + 11 = 65, plus 10 din oficiu = 75. Nota: 75 : 10 = 7,5; la ,5 rotunjirea e în favoarea elevului, deci 8. Nivelul, din notă: Consolidat.'],
    ['75 de puncte → nota 7, Consolidat',0,'Totalul e bun, dar 7,5 se rotunjește în favoarea elevului: 8.'],
    ['64 de puncte → nota 6, De bază',0,'Ai adunat doar primele 4 criterii: 11 + 15 + 12 + 16 = 54, plus 10 din oficiu = 64. Lipsește al cincilea criteriu, cu 11 puncte.']]}];

/* ---------- laboratorul: nimic nu se păstrează în browser (regula 23: calculatorul din laborator e comun).
   Alegerile din grilă și răspunsurile la exerciții stau doar în memoria paginii deschise; „Sunt alt elev” le golește. ---------- */
const LAB={niv:{},ex:{}};
const insir=a=>a.length>1?a.slice(0,-1).join(', ')+' și '+a[a.length-1]:a[0];
function calculGrila(){
  const v=GRILA.map((c,i)=>LAB.niv[i]),alese=v.filter(x=>x!=null).length;
  const rand=(s,p,n,nv)=>`<p><b>Punctaj:</b> ${s} + 10 din oficiu = ${p} · <b>Nota</b> (punctaj : 10): ${n} · <b>Nivelul</b> (din notă): ${nv}</p>`;
  if(alese<GRILA.length)return rand('____','____','______','______')+`<p>${alese?`Ai ales la ${alese} din ${GRILA.length} criterii. Alege la toate ca să vezi punctajul, nota și nivelul.`:'Alege la fiecare criteriu ca să vezi punctajul, nota și nivelul.'}</p>`;
  const s=v.reduce((a,b)=>a+b,0),p=s+10,n=notaDin(p);
  const imp=p%10?`${p} : 10 = ${nr(p/10)}, rotunjit: ${n}`:`${p} : 10 = ${n}`;
  const lipsa=v.map(x=>18-x),max=Math.max(...lipsa),unde=lipsa.map((x,i)=>x===max?i:-1).filter(i=>i>=0);
  const castig=max===0?'Ai ales Avansat la toate criteriile: 100 de puncte, cât se poate.'
    :unde.length===GRILA.length?(max===18?'Ai ales 0 la toate criteriile: la fiecare poți câștiga până la 18 p. Citește întâi ce cere coloana De bază.':`La toate criteriile mai ai câte ${max} p până la 18 p.`)
    :`Cel mai mult ai de câștigat la ${unde.length>1?'criteriile':'criteriul'} ${insir(unde.map(i=>`„${i+1}. ${GRILA[i][0]}”`))}: mai sunt ${max} p până la 18 p. Citește acolo ce cere coloana următoare.`;
  return rand(s,p,n,nivelDin(n))+`<p>Adunarea: ${v.join(' + ')} = ${s}, plus 10 din oficiu = ${p}. Nota: ${imp}.</p><p>${castig}</p>`;
}
function exRez(i){const j=LAB.ex[i],x=j!=null?EX[i].o[j]:null;return x?{c:x[1]?'ok':'bad',t:x[1]?`✔ Corect. ${x[2]}`:`✘ ${x[2]} Mai încearcă.`}:{c:'',t:''}}
function exHtml(e,i){const j=LAB.ex[i],r=exRez(i);
  return `<div class="pl-ex"><p><b>Încearcă:</b> ${e.q}</p><div class="pl-v" role="group" aria-label="Variantele pentru ${e.nume}">${e.o.map((o,k)=>`<button type="button" data-pl-ex="${i}:${k}" aria-pressed="${j===k}"${j===k&&r.c?` class="${r.c}"`:''}>${o[0]}</button>`).join('')}</div><p class="pl-r${r.c?' '+r.c:''}" data-pl-r="${i}" aria-live="polite">${r.t}</p></div>`}
/* după o atingere se schimbă doar butoanele și rezultatul, nu tot laboratorul (pagina nu sare) */
function puneEx(i){const j=LAB.ex[i],r=exRez(i);
  document.querySelectorAll(`[data-pl-ex^="${i}:"]`).forEach(b=>{const k=+b.dataset.plEx.split(':')[1];b.setAttribute('aria-pressed',String(j===k));b.classList.toggle('ok',j===k&&r.c==='ok');b.classList.toggle('bad',j===k&&r.c==='bad')});
  document.querySelectorAll(`[data-pl-r="${i}"]`).forEach(p=>{p.className='pl-r'+(r.c?' '+r.c:'');p.textContent=r.t})}
function puneGrila(i){
  document.querySelectorAll(`[data-pl-niv^="${i}:"]`).forEach(b=>b.setAttribute('aria-pressed',String(LAB.niv[i]===+b.dataset.plNiv.split(':')[1])));
  document.querySelectorAll('.pl-calc').forEach(c=>{c.innerHTML=calculGrila()})}
/* temele: primele două vin din exemplele activității profesorului (bugetul unei excursii, un sondaj în clasă);
   coloanele, formulele și pragurile de pe carduri sunt ale PAGINII (registrul j1, punctul D), scrise în propoziții (U),
   cu decizia în ambele forme, cu ; și cu , (J) */
const TEME=[
  {t:'Sondaj în clasă',ex:'exemplul profesorului',d:'Întrebi colegii cum vin la școală dimineața și cum pleacă acasă, apoi numeri răspunsurile (doar numere, fără nume).',
   col:['În coloana A pui felul drumului: pe jos, cu autobuzul, cu mașina, cu bicicleta, altfel.','În B scrii câți colegi vin așa dimineața, iar în C câți pleacă așa acasă.','În D aduni drumurile: <code>=B2+C2</code>.','În E pui o decizie, de exemplu <code>=IF(D2&gt;=10;"des";"rar")</code>, pe setări englezești <code>=IF(D2&gt;=10,"des","rar")</code>.'],
   g:'Graficul: cu coloane, din A1:C6 (varianta scurtă: A1:C5).',s:'Sursa: „sondajul meu în clasa a VIII-a, data …”.'},
  {t:'Bugetul unei excursii',ex:'exemplul profesorului',d:'O excursie de o zi pe care ai vrea s-o faci cu clasa: prețuri reale, găsite pe internet sau aflate acasă.',
   col:['În coloana A pui cheltuielile: transport, masă, intrări, ghid, suveniruri.','În B scrii câți lei costă fiecare de persoană, iar în C câte persoane merg.','În D calculezi costul total: <code>=B2*C2</code>.','În E pui o decizie, de exemplu <code>=IF(B2&gt;=50;"scump";"ok")</code>, pe setări englezești <code>=IF(B2&gt;=50,"scump","ok")</code>.'],
   g:'Graficul: radial, ca să arăți ce parte din bani merge pe fiecare cheltuială, din A1:B6 (varianta scurtă: A1:B5); sau cu coloane, din aceeași zonă.',s:'Sursa: scrii exact de unde ai luat prețurile.'},
  {t:'Timpul meu',ex:'propunerea paginii',d:'Activitățile tale dintr-o zi: teme, citit, sport, ecran, ajutor în casă. Datele le ai chiar tu.',
   col:['În coloana A pui activitățile.','În B scrii câte ore îi dai fiecăreia într-o zi de școală (Luni-vineri), iar în C câte ore într-o zi de weekend.','În D calculezi orele pe săptămână: <code>=B2*5+C2*2</code>.','În E pui o decizie, de exemplu <code>=IF(D2&gt;=10;"mult";"puțin")</code>, pe setări englezești <code>=IF(D2&gt;=10,"mult","puțin")</code>.'],
   g:'Graficul: cu coloane, din A1:C6 (varianta scurtă: A1:C5).',s:'Sursa: „datele mele, adunate de mine”.'}];
function labHtml(){
  const teme=`<div class="pl-teme">${TEME.map(x=>`<div class="pl-tema"><h4>${x.t} <span class="pl-prop">(${x.ex})</span></h4><p class="mic">${x.d}</p><ul>${x.col.map(c=>`<li>${c}</li>`).join('')}</ul><p class="mic">${x.g} ${x.s}</p></div>`).join('')}</div>`;
  const varianta=`<div class="pl-var"><p><b>Varianta întreagă</b> (o oră întreagă): toți pașii de mai jos, cu 5 rânduri de date.</p>
<p><b>Varianta scurtă</b> (dacă ai doar o parte din oră). E <b>propunerea paginii</b>, nu a profesorului: el hotărăște dacă ajunge pentru nota lui. Ai 4 rânduri de date, pe rândurile 2-5, iar rândul 6 rămâne gol. Pe fiecare rând pui formula din D și decizia din E. Sub rândul gol pui totalul (în D7) și media (în D8). Așa ai trei formule fără IF (formula din D, SUM și AVERAGE) și, pe lângă ele, funcția de decizie, oricum le-ar număra profesorul. Urmează sortarea, graficul, sursa, concluzia, o explicație scurtă și salvarea. Fiecare pas de mai jos îți dă, la sfârșit, adresele pentru varianta scurtă.</p>
<p><b>Dacă alegi varianta scurtă:</b> datele le aduni înainte de oră, acasă sau în pauză, și le aduci scrise pe o foaie; un sondaj nu încape în oră. În pagină faci „Încearcă tu” de la fiecare pas și primul atelier; „Încă un exercițiu” și al doilea atelier le poți lăsa pentru altă dată. Ce rămâne din proiect adaugi când ai din nou timp la calculator.</p></div>`;
  const exemplu=`<p><b>Așa arată un produs bun</b> (altă temă decât ale tale: colecta de maculatură pe clase, cu date inventate):</p>${fig(IMG+'produs-exemplu.webp',1000,314,'Excel: tabelul Clasa, Septembrie, Octombrie, Total, Diplomă, sortat după total (7A 115, 6A 105, 8A 77, 8B 58, 7B 56), sub el Total 411, Media 82,2, Maxim 115, Minim 56, rândul cu sursa datelor, două rânduri de concluzie și, în dreapta, graficul cu coloane Maculatura strânsă pe clase (kg)','Produsul-exemplu: tabelul sortat, sumarul după rândul gol, sursa datelor, concluzia și graficul cu titlu.')}
<p class="descarca"><a class="btn" href="exemplu_colecta.xlsx" download>Descarcă produsul-exemplu (exemplu_colecta.xlsx)</a> <span class="mic">În Excel, clic pe o celulă din D sau E: formula apare în bara de formule. Sub grafic e și explicația.</span></p>`;
  const grila=`<h3>Grila profesorului</h3>
<p>Profesorul notează produsul cu grila de produs: 5 criterii. La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100).</p>
<p><b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8. Nivelul se citește din notă: 9-10 Avansat, 7-8 Consolidat, 5-6 De bază, 3-4 În formare, 1-2 În dificultate.</p>
${EX.map(exHtml).join('')}

     incearca:{t:'excelfn',q:'Începi tabelul temei „Timpul meu”. În <b>A1</b> scrie Activitatea, în <b>B1</b> Luni-vineri, în <b>C1</b> Weekend. Pe rândul 2: în <b>A2</b> scrie citit, în <b>B2</b> numărul 0,5, iar în <b>C2</b> numărul 1,5 (orele de citit într-o zi). După fiecare apasă Enter.',
       cols:3,rows:3,cells:{},panglica:false,
       verifica:{tip:{A1:{text:'Activitatea'},B1:{text:'Luni-vineri'},C1:{text:'Weekend'},A2:{text:'citit'},B2:{numar:0.5},C2:{numar:1.5}}},
       ajutor:'Zecimalele se scriu cu virgulă: 0,5 și 1,5. Cu punct, Excel ia 1.5 drept dată.',
       why:'Antetul e pe rândul 1, iar numerele cu virgulă stau la dreapta: sunt numere, bune de calcul.'},
     inca:[
      {t:'classify',q:'Ce scrii în celula cu ore, ca Excel să poată calcula cu ea?',cats:['Număr bun de calcul','Nu e număr bun: e text sau dată'],items:[['1,5',0],['1.5',1],['2 ore',1],['3',0]],
       ajutor:'Lecția 5: virgula e zecimală; cu punct, Excel face o dată; cuvântul „ore” face din număr text.',why:'1,5 și 3 sunt numere. 1.5 devine dată, iar „2 ore” e text: formulele nu merg cu ele.'},
      {t:'choice',q:'În A ai activitățile, în B și C orele. Vrei un grafic cu orele din B și C. Unde pui coloana cu formula orelor pe săptămână?',o:['În D, după coloanele cu numere','În B, între nume și numere','În A, înaintea numelor','Pe rândul 1, deasupra antetului'],ok:0,
       ajutor:'Graficul ia o zonă fără goluri: numele și numerele de desenat trebuie să stea alături.',why:'A, B și C rămân alăturate pentru grafic (A1:C6), iar formula vine după ele, în D.'},
      {t:'choice',q:'Ai scris la File name <code>Popescu_Ana_8A_proiect</code> și apeși Save. Apare Confirm Save As: „… already exists. Do you want to replace it?”. Ce faci?',o:['No, apoi adaug o cifră la sfârșitul numelui','Yes, ca fișierul meu să-l înlocuiască pe cel vechi','Scriu numele colegului în locul numelui meu','Închid Excel și nu mai salvez proiectul'],ok:0,
       ajutor:'Al cui e fișierul care există deja?',why:'Fișierul e al unui coleg: Yes l-ar înlocui. No te lasă în fereastra Save As, unde adaugi o cifră, de exemplu Popescu_Ana_8A_proiect_2.'}
     ]},

    /* ---------- PASUL 3: formulele ---------- */
    {t:'Formulele: pe fiecare rând și sub tabel',
     text:`<p>Formulele fac din tabel un produs care calculează singur. Pe fiecare rând pui o formulă cu operatori (lecția 7), de exemplu în D2 <code>=B2*5+C2*2</code>, și o copiezi în jos cu mânerul de umplere (lecția 8). Tot pe rând, o decizie cu IF (lecția 9), de exemplu în E2 <code>=IF(D2&gt;=10;"mult";"puțin")</code>.</p>
<p>Sub tabel lași UN rând gol, apoi pui totalul, media, maximul și minimul coloanei D: <code>=SUM(D2:D6)</code>, <code>=AVERAGE(D2:D6)</code>, <code>=MAX(D2:D6)</code>, <code>=MIN(D2:D6)</code>. Rândul gol desparte tabelul de aceste rânduri, numite <mark>sumar</mark>: sortarea și graficul iau doar tabelul.</p>`,
     exemplu:`${fig(IMG+'formula-total.webp',628,238,'Excel: D2 aleasă, bara de formule arată =B2+C2; în tabel 7A are 55 și 60, iar totalul 115','D2 adună cele două luni: =B2+C2.')}
${fig(IMG+'formula-diploma.webp',628,238,'Excel: E2 aleasă, bara de formule arată =IF(D2>=100;"da";"nu"); în E2 scrie da','E2 decide diploma: da, de la 100 kg în sus.')}
${fig(IMG+'formula-suma.webp',628,358,'Excel: D8 aleasă, bara de formule arată =SUM(D2:D6); rândul 7 e gol, iar în D8 e 411','D8 adună coloana D. Rândul 7 e gol.')}
<p>Pe un calculator cu setări englezești: <code>=IF(D2&gt;=100,"da","nu")</code>. Cu 4 rânduri de date (2-5), rândul gol e rândul 6, iar sub el, în D7, totalul e <code>=SUM(D2:D5)</code>.</p>`,
     altfel:`<p>Rândul gol e ca linia trasă sub o adunare în caiet: deasupra sunt numerele, dedesubt rezultatul. Nimeni nu amestecă rezultatul printre numere.</p>`,
     incearca:{t:'exceld',q:'Tema „Timpul meu”. În <b>D2</b> calculează orele pe săptămână: cele din B pentru cele 5 zile de luni până vineri, plus cele din C pentru cele 2 zile de weekend. În <b>E2</b> scrie decizia: mult, dacă D2 are cel puțin 10 ore; altfel, puțin.',
       cols:5,rows:2,cells:{A1:'Activitatea',B1:'Luni-vineri',C1:'Weekend',D1:'Pe săptămână',E1:'Cât',A2:'citit',B2:0.5,C2:1.5},
       verifica:{formule:{D2:'=B2*5+C2*2',E2:'=IF(D2>=10;"mult";"puțin")'}},variants:[{B2:1.6,C2:1},{B2:1,C2:2}],
       ajutor:'În D2: =B2*5+C2*2. În E2: =IF(D2>=10;"mult";"puțin"), cu ghilimele drepte (pe setări englezești, virgule între părți).',
       why:'0,5 × 5 + 1,5 × 2 = 5,5 ore pe săptămână: mai puțin de 10, deci „puțin”.'},
     inca:[
      {t:'excelfn',q:'Sub tabel, după rândul 7 lăsat gol, pune în <b>D8</b> totalul orelor din D2:D6, în <b>D9</b> media, în <b>D10</b> cea mai mare valoare, iar în <b>D11</b> cea mai mică.',
       cols:4,rows:11,cells:{A1:'Activitatea',D1:'Pe săptămână',A2:'citit',D2:5.5,A3:'teme',D3:12,A4:'sport',D4:6,A5:'ecran',D5:14,A6:'ajutor',D6:4,A8:'Total',A9:'Media',A10:'Maxim',A11:'Minim'},
       verifica:{formule:{D8:'=SUM(D2:D6)',D9:'=AVERAGE(D2:D6)',D10:'=MAX(D2:D6)',D11:'=MIN(D2:D6)'},functie:{D8:'SUM',D9:'AVERAGE',D10:'MAX',D11:'MIN'}},
       ajutor:'D8: =SUM(D2:D6), D9: =AVERAGE(D2:D6), D10: =MAX(D2:D6), D11: =MIN(D2:D6). Dacă folosești Σ, citește zona propusă înainte de Enter: sub un total ea poate fi greșită, iar atunci scrii D2:D6 peste ea (lecția 8).',
       why:'Totalul e 41,5 ore, media 8,3, cel mai mult 14 (ecran), cel mai puțin 4 (ajutor).'}
     ]},

    /* ---------- PASUL 4: clasamentul (sortarea), propunerea paginii (registrul j1: D, I, S) ---------- */
    {t:'Clasamentul: tabelul sortat',
     text:`<p>Sortarea nu e în cerința profesorului: e <b>propunerea paginii</b>, pentru că un tabel ordonat se citește mai ușor și dă un grafic ordonat. O faci ca la lecția 10: clic pe o singură celulă din coloana după care ordonezi, de exemplu D2, apoi fila Date (Data) › Sortare de la cel mai mare la cel mai mic (Sort Largest to Smallest).</p>
<p>Rândurile se mută întregi, cu formulele lor. Sumarul de sub rândul gol rămâne pe loc, cu aceleași rezultate. Fără rândul gol, Excel ia și sumarul drept parte din tabel și îl amestecă printre rânduri.</p>`,
     exemplu:`${fig(IMG+'sumar-lipit-gresit.webp',628,270,'Excel, după sortare: rândurile Total, Maxim, Media și Minim au intrat printre clase, cu 0 și 38,33333333 în coloana D','Greșit: sumarul era lipit de tabel, fără rând gol. Sortarea l-a amestecat printre clase, iar formulele lui dau 0.')}
${fig(IMG+'produs-exemplu.webp',1000,314,'Excel: tabelul sortat după total, cu 7A primul, sumarul sub rândul gol, rândurile cu sursa datelor și concluzia, graficul cu coloane Maculatura strânsă pe clase (kg)','Bine: rândul 7 e gol, deci sortarea a mutat doar clasele.')}`,
     altfel:`<p>Clasamentul e ca lista rezultatelor de la un concurs: primul sus, ultimul jos, iar fiecare concurent își ia punctele cu el. Linia trasă sub listă o desparte de ce scrii dedesubt, așa cum rândul gol desparte tabelul de sumar.</p>`,
     incearca:{t:'excels',q:'Fă clasamentul: sortează tabelul după coloana <b>D</b>, de la cel mai mare la cel mai mic. Sumarul de sub rândul gol trebuie să rămână pe loc.',
       cols:5,rows:9,cells:{A1:'Activitatea',B1:'Luni-vineri',C1:'Weekend',D1:'Pe săptămână',E1:'Cât',
         A2:'citit',B2:0.5,C2:1.5,D2:'=B2*5+C2*2',E2:'=IF(D2>=10;"mult";"puțin")',
         A3:'teme',B3:2,C3:1,D3:'=B3*5+C3*2',E3:'=IF(D3>=10;"mult";"puțin")',
         A4:'sport',B4:1,C4:0.5,D4:'=B4*5+C4*2',E4:'=IF(D4>=10;"mult";"puțin")',
         A5:'ecran',B5:2,C5:2,D5:'=B5*5+C5*2',E5:'=IF(D5>=10;"mult";"puțin")',
         A6:'ajutor',B6:0.5,C6:0.75,D6:'=B6*5+C6*2',E6:'=IF(D6>=10;"mult";"puțin")',
         A8:'Total',D8:'=SUM(D2:D6)',A9:'Maxim',D9:'=MAX(D2:D6)'},
       verifica:{sortat:{zona:'A1:E6',dupa:[{col:'D',ord:'desc'}]}},
       ajutor:'Clic pe D2 (o singură celulă). Fila Date (Data) › butonul mic de jos, Sortare de la cel mai mare la cel mai mic (Sort Largest to Smallest).',
       why:'Sus e ecranul (14 ore), jos ajutorul în casă (4 ore). Fiecare rând și-a păstrat numerele, iar totalul și maximul au rămas sub rândul gol.'},
     inca:[
      {t:'tf',q:'Rândurile cu Total, Media, Maxim și Minim stau lipite de tabel, fără rând gol între ele. Sortezi tabelul după coloana D: rândurile de sumar rămân pe loc, sub tabel.',ok:false,
       ajutor:'Ce desparte tabelul de sumar?',why:'Fals. Fără rând gol, Excel ia sumarul drept parte din tabel și îl sortează printre celelalte rânduri; formulele lui se strică. Rândul gol le desparte.'}
     ]},

    /* ---------- PASUL 5: graficul și concluzia (registrul j1: O, S, V) ---------- */
    {t:'Graficul și concluzia',
     text:GRAFIC_PAS,
     exemplu:`${fig(IMG+'produs-exemplu.webp',1000,314,'Excel: tabelul Clasa, Septembrie, Octombrie, Total, Diplomă, sortat după total, sumarul, rândul cu sursa datelor, două rânduri de concluzie și, în dreapta, graficul cu coloane Maculatura strânsă pe clase (kg)','Produsul-exemplu: graficul cu coloane din A1:C6, cu titlu; sub tabel, sursa și concluzia.')}
<p>Concluzia produsului-exemplu: „7A și 6A au strâns peste 100 kg și primesc diplomă. Trei clase din cinci au strâns mai mult în octombrie decât în septembrie.” Explicația de sub grafic (criteriul 4): „Am ales coloane, pentru că compar clasele. Un grafic radial n-ar merge: desenează o singură serie.”</p>`,
     altfel:`<p>Graficul e ca o fotografie a tabelului. Concluzia e ce i-ai spune despre fotografie cuiva care n-are timp s-o privească.</p>`,
     incearca:{t:'excelg',q:'Fă graficul cu coloane al orelor din B și C: selectează <b>A1:C6</b>, apoi <b>Inserare (Insert)</b> › butonul cu coloane ▾ › <b>Coloană grupată (Clustered Column)</b>. Titlul: <b>Ore pe zi</b>.',
       cols:4,rows:6,cuGrafic:true,cells:{A1:'Activitatea',B1:'Luni-vineri',C1:'Weekend',D1:'Pe săptămână',A2:'ecran',B2:2,C2:2,D2:'=B2*5+C2*2',A3:'teme',B3:2,C3:1,D3:'=B3*5+C3*2',A4:'sport',B4:1,C4:0.5,D4:'=B4*5+C4*2',A5:'citit',B5:0.5,C5:1.5,D5:'=B5*5+C5*2',A6:'ajutor',B6:0.5,C6:0.75,D6:'=B6*5+C6*2'},
       grafic:{zona:'A1:C6',tip:'column',titlu:'Ore pe zi',mesajTip:'Aici se cere graficul cu coloane: butonul cu coloane ▾, prima din listă.'},
       ajutor:'Trage de la A1 la C6. Inserare (Insert) › butonul cu coloane ▾ › prima din listă. Apoi clic pe titlu, scrie Ore pe zi și apasă Enter.',
       why:'Două serii, Luni-vineri și Weekend, pentru fiecare activitate: compari dintr-o privire.'},
     inca:[
      {t:'choice',q:'În A sunt activitățile, în B și C orele, în D totalul pe săptămână. Vrei graficul orelor din B și C, cu numele activităților jos. Ce zonă selectezi?',o:['A1:C6','B1:C6','A2:C6','A1:D6'],ok:0,

      {t:'classify',q:'La ce criteriu din grilă ajută fiecare lucru?',cats:['2. Corectitudinea tehnică','4. Explicația','5. Munca proprie / sursele'],
       items:[['Formulele iau numerele prin adresele lor, nu scrise de mână',0],['Spui de ce ai ales graficul cu coloane',1],['Scrii de unde e o imagine sau un text luat de altundeva',2],['Spui ce altceva ai fi putut face',1]],
       ajutor:'Corectitudinea = operațiile făcute bine; explicația = ce ai făcut și de ce; la sursele, grila cere „citează sursele imaginilor/textelor”.',why:'Formulele bune țin de corectitudine; „de ce” și „ce altfel” țin de explicație; sursa unei imagini sau a unui text ține de munca proprie și surse.'}
     ]}
   ],
   atelier:{t:'proiect',titlu:'Atelier: târgul de felicitări',
    intro:`<p>Faci un produs întreg, în trei etape, într-o foaie care se poartă ca Excel-ul pe setări românești. Deasupra ei sunt <strong>testele</strong>: fiecare se bifează singur când partea lui e gata, chiar dacă se schimbă numerele din tabel. Treci de la o etapă la alta cu butoanele 1, 2, 3. La final apasă <b>Verifică</b>.</p>`,
    q:'Clasele au vândut felicitări la târgul școlii. În B e câte felicitări a vândut fiecare clasă, în C prețul unei felicitări, în lei. <b>Etapa 1.</b> În D2:D6 calculează încasările fiecărei clase: felicitările înmulțite cu prețul. În E2:E6 scrie premiul: da, dacă încasările sunt de cel puțin 150 de lei; altfel nu. Sub tabel, după rândul 7 gol, în D8:D11: totalul, media, maximul și minimul încasărilor. <b>Etapa 2.</b> Sortează tabelul după încasări, de la cel mai mare la cel mai mic. <b>Etapa 3.</b> Fă graficul cu coloane al felicitărilor vândute (A1:B6), cu titlul <b>Felicitări vândute</b>.',
    cols:5,rows:11,
    cells:{A1:'Clasa',B1:'Felicitări',C1:'Preț',D1:'Încasări',E1:'Premiu',A2:'5A',B2:30,C2:4,A3:'5B',B3:45,C3:3,A4:'6A',B4:25,C4:5,A5:'6B',B5:52,C5:3,A6:'7A',B6:38,C6:4,
      A8:'Total',A9:'Media',A10:'Maxim',A11:'Minim'},
    teste:[
     {ce:'D2:D6: încasările, cu o formulă cu adrese (felicitările înmulțite cu prețul)',etapa:1,formule:{D2:'=B2*C2',D3:'=B3*C3',D4:'=B4*C4',D5:'=B5*C5',D6:'=B6*C6'},sfat:'În D2 scrii =B2*C2, apoi tragi mânerul de umplere până la D6.'},
     {ce:'E2:E6: premiul, cu IF: da de la 150 de lei în sus',etapa:1,formule:{E2:'=IF(D2>=150;"da";"nu")',E3:'=IF(D3>=150;"da";"nu")',E4:'=IF(D4>=150;"da";"nu")',E5:'=IF(D5>=150;"da";"nu")',E6:'=IF(D6>=150;"da";"nu")'},variante:[{B2:50,C2:3},{B2:49,C2:3}],sfat:'În E2: =IF(D2>=150;"da";"nu"), cu ghilimele drepte; la exact 150 trebuie „da”.'},
     {ce:'D8:D11: totalul, media, maximul și minimul încasărilor (SUM, AVERAGE, MAX, MIN)',etapa:1,formule:{D8:'=SUM(D2:D6)',D9:'=AVERAGE(D2:D6)',D10:'=MAX(D2:D6)',D11:'=MIN(D2:D6)'},functii:{D8:'SUM',D9:'AVERAGE',D10:'MAX',D11:'MIN'},sfat:'D8: =SUM(D2:D6), D9: =AVERAGE(D2:D6), D10: =MAX(D2:D6), D11: =MIN(D2:D6).'},
     {ce:'Tabelul e sortat după încasări, de la mare la mic, cu rândurile întregi',etapa:2,sortat:{zona:'A1:E6',dupa:{col:'D',ord:'desc'},legate:['A','B','C']},sfat:'În etapa 2: clic pe D2, fila Date (Data) › Sortare de la cel mai mare la cel mai mic (Sort Largest to Smallest).'},
     {ce:'Graficul cu coloane ia felicitările vândute: A1:B6',etapa:3,grafic:{zona:'A1:B6',tip:'column'},sfat:'În etapa 3: selectează A1:B6, apoi Inserare (Insert) › butonul cu coloane ▾ › prima din listă.'},
     {ce:'Titlul graficului: „Felicitări vândute”',etapa:3,grafic:{titlu:'Felicitări vândute'},sfat:'Clic pe titlul graficului, scrie Felicitări vândute și apasă Enter.'}],
    solutie:{zona:'A1:E6',rand:{D:'=B{r}*C{r}',E:'=IF(D{r}>=150;"da";"nu")'},celule:{D8:'=SUM(D2:D6)',D9:'=AVERAGE(D2:D6)',D10:'=MAX(D2:D6)',D11:'=MIN(D2:D6)'},dupa:{col:'D',ord:'desc'}},
    ajutor:'Etapa 1: D2 =B2*C2 și E2 =IF(D2>=150;"da";"nu"), trase până la rândul 6; D8:D11 cu SUM, AVERAGE, MAX, MIN pe D2:D6. Etapa 2: clic pe D2, Date (Data) › Sort Largest to Smallest. Etapa 3: A1:B6, Inserare (Insert) › coloane › prima; titlul Felicitări vândute.',
    solutieText:'produsul corect e acum în foaie: formulele, tabelul sortat și graficul cu titlu. Treci prin etapele 1, 2, 3 și uită-te la fiecare.',

       {ce:'Tabelul e sortat după puncte, de la mare la mic, cu rândurile întregi',etapa:2,sortat:{zona:'A1:E6',dupa:{col:'D',ord:'desc'},legate:['A','B','C']}},

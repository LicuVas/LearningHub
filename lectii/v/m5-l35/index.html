<script>
/* Lecția 35, clasa a V-a (M5, evaluare sumativă): „Evaluare sumativă: joc digital (produs + explicație)”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md (I, II.1 G, IV.2 §5, §8). Sursele și probele: surse.md, _proba\.
   Activitatea profesorului (scheletul): „Prezentarea jocului realizat, cu explicarea unei secvențe de cod la alegerea profesorului. Notare după grila de produs, cu punct separat pentru explicație.”
   Nu predă nimic nou (S69, S70). Pagina NU dă nota jocului. Toate răspunsurile la „ce se întâmplă” sunt PROBATE în editorul viu: _proba\live_v35.py → live_v35.json.
   Simulatorul: lectii/_sim/scratch.js, scratch-conditie.js, scratch-interfata.js, scratch-evenimente.js, doar FOLOSITE (tipul `eveniment`); `tipExplica` stă în pagină.
   Granița: NU recapitularea și fișa de niveluri (V/36). Fișierele jocului NU se șterg. */
SimScratchEvenimente.stil();
const fig = (f, w, h, alt, cap, cls) => `<figure class="captura${cls ? ' ' + cls : ''}"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la jocul tău</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol><p style="margin:.3em 0 0"><b>Pe telefon sau fără Scratch:</b> sari peste.</p></div>`;

const A = SimScratch.ajutor, E = SimScratchEvenimente;
const NOTA = 'În pagină sunt doar blocurile de azi, iar pisica e desenată mai simplu. Mingea o poți trage; în Scratch, după ce o tragi, zona de cod arată programul ei (apeși Sprite1, sub scenă). Bolovanul e doar în Scratch-ul adevărat.';
const NOTA0 = 'În pagină sunt doar blocurile de azi, iar pisica e desenată mai simplu.';
const m = n => ['mergi', n], M0 = ['mergi_la_xy', 0, 0];
const MARG = ['atinge_ob', 'marginea'], MING = ['atinge_ob', 'Minge'];
const DACA = (c, ...g) => ['daca', Object.assign(c ? {s: {0: c}} : {}, {guri: [g]})];
const SP = t => ['spune_sec', t, 2];
const STEAG = (b, y) => ({x: 14, y: y || 420, b: [['steag'], b || ['roteste_dr', 90]]});
const CLIC = (...b) => ({x: 14, y: 14, b: [['cand_personaj']].concat(b)});
const LINK = '<a class="descarca" href="pornire-34.sb3" download="pornire-34.sb3">Descarcă proiectul de pornire</a>';
const PAL = ['mergi', 'mergi_la_xy', 'spune_sec', 'daca', 'atinge_ob'];
const TOT = ['steag', 'cand_personaj', 'mergi', 'roteste_dr', 'roteste_st', 'mergi_la_xy', 'spune_sec', 'daca', 'atinge_ob'];

/* ---- jocul, fără ecran: testele judecă ce face programul la apăsări și la steag, nu blocurile (regula 29); aceleași ca la V/34 ---- */
const laSteag = (P, p) => { const U = SimScratch.urma((P || []).filter(sc => sc.b[0] && sc.b[0][0] === 'steag'), p); return {x: U.x, y: U.y, directie: U.directie}; };
/* caută un drum de câștig: apăsări pe pisică și steaguri, de la start. Plafonul e cel de la V/34 (6000; timpul, la procesor ×4: _proba/plafon_r1.py).
   R1 (opus S, sonnet 9): cu pas mic sau rotire mică, căutarea ajunge la plafon fără să fi încercat tot. Atunci pune pisica la un pas de minge, din direcția
   de start, și apasă o dată: dacă vorbește din cauza mingii, programul se poate câștiga. Respinge doar ce nu vorbește nici așa (ex. rotire 180, mingea în afara dreptei: căutarea se termină). */
const PLAFON = 6000;
let memoC = null;
function cauta(P, minge) {
  const cheie = JSON.stringify([P, minge]);
  if (memoC && memoC.k === cheie) return memoC.v;
  /* mesajul trebuie să vină de la minge: fără minge, de pe același loc, nu e același */
  const vine = (p, s) => { if (!s.spuse.length) return false; const s0 = E.serie(P, 1, {x: p.x, y: p.y, directie: p.directie, minge: null})[0]; return s0.spuse.length !== s.spuse.length || s0.spuse.join('|') !== s.spuse.join('|'); };
  const vazut = new Set(), coada = [[{x: 0, y: 0, directie: 90}, '']];
  let n = 0, i = 0, v = {castig: null};
  while (i < coada.length && n < PLAFON) {
    const [p, d] = coada[i++];
    const k = Math.round(p.x) + '|' + Math.round(p.y) + '|' + Math.round(p.directie);
    if (vazut.has(k)) continue;
    vazut.add(k); n++;
    const s = E.serie(P, 1, {x: p.x, y: p.y, directie: p.directie, minge})[0];
    if (vine(p, s)) { v = {castig: d + 'a', dupa: s, inainte: p}; break; }
    coada.push([{x: s.x, y: s.y, directie: s.directie}, d + 'a']);
    coada.push([laSteag(P, p), d + 'f']);
  }
  if (!v.castig && i < coada.length && minge) {
    const u = E.serie(P, 1, {x: 0, y: 0, directie: 90, minge: null})[0];
    for (const d of [0, 25, 45]) {   /* ținta: mingea, apoi mingea mutată spre mijloc (lângă margine, regula de margine pusă deasupra ar sări întâi) */
      const p = {x: minge.x - Math.sign(minge.x) * d - u.x, y: minge.y - Math.sign(minge.y) * d - u.y, directie: 90};
      const s = E.serie(P, 1, {x: p.x, y: p.y, directie: p.directie, minge})[0];
      if (vine(p, s)) { v = {castig: 'aproape', dupa: s, inainte: p}; break; }
    }
  }
  memoC = {k: cheie, v};
  return v;
}
const LIPIT = {ce: 'Niciun bloc nu e lăsat deoparte', msg: 'Un bloc stă deoparte, nelipit: nicio apăsare nu-l pornește. Lipește-l unde trebuie sau trage-l în paletă.', ok: (U, P) => A.libere(P).length === 0};
const MERGE = {ce: 'La apăsare, pisica merge', msg: 'La prima apăsare, pisica rămâne la x 0. Verifică: „mergi” stă sub „când se dă click pe acest personaj”; „mergi la” stă în gura lui „dacă”, nu sub el. „mergi” are 0 sau nimic în locul numărului? Scrie 50.', ok: (U, P) => { const s = E.serie(P, 1, {minge: null})[0]; return s.x !== 0 || s.y !== 0; }};
const INTOARCE = {ce: 'Steagul o întoarce', msg: 'Steagul nu întoarce pisica. Sub „când se dă click pe ⚑” trebuie să stea „rotește-te”, cu 90.', ok: (U, P) => { const f = laSteag(P, {x: 0, y: 0, directie: 90}); return f.directie !== 90 && f.x === 0 && f.y === 0; }};
const TACE = {ce: 'Departe de minge, pisica nu vorbește', msg: 'Pisica vorbește și departe de minge. „spune” trebuie să stea în gura lui „dacă”, nu sub el.', ok: (U, P) => E.serie(P, 1, {minge: null})[0].spuse.length === 0};
const CASTIG = {ce: 'Se poate câștiga: la minge, pisica spune ceva', msg: 'Pagina n-a găsit niciun drum până la un mesaj lângă minge. Sub „mergi”: „dacă”, cu „atinge Minge?” în locaș și „spune …”, cu cuvintele tale, în gură. O ai deja? Stă în gura altui „dacă”? Trage-o afară, sub „mergi”. Mingea e chiar în colț? Trage-o puțin spre mijloc. Altfel, scrie 50 la „mergi” și 90 la „rotește-te”.', ok: (U, P, S) => !!cauta(P, S.minge).castig};
const MESAJ = {ce: 'Mesajul are cuvinte', msg: 'Balonul pisicii e gol. La „spune”, apasă pe câmp și scrie cuvintele tale.', ok: (U, P) => !/\["spune_sec","\s*"/.test(JSON.stringify(P))};
const START = {ce: 'După ce vorbește, pisica sare la start', msg: 'După mesaj, pisica nu ajunge la x 0, y 0. În gură, sub „spune”, pune „mergi la x … y: …” și scrie 0 și 0. Îl ai deja, cu 0 și 0? Atunci „dacă” stă deasupra lui „mergi”: trage „mergi” deasupra lui „dacă”.', ok: (U, P, S) => { const r = cauta(P, S.minge); return !!r.castig && r.dupa.x === 0 && r.dupa.y === 0; }};
/* rezultatul, nu textul (ca la V/34): pasul de câștig, rejucat cu „spune” înlocuit de un salt la 77, 77; dacă pisica rămâne la 77, 77, saltul la start s-a făcut înainte de mesaj */
const ORDINE = {ce: 'Întâi vorbește, apoi sare la start', msg: 'Pisica nu face, în aceeași gură, întâi „spune”, apoi „mergi la”. În gura regulii de câștig, „spune” stă chiar sub rândul lui „dacă”, iar „mergi la” sub „spune”: trage-le acolo.', ok: (U, P, S) => { const r = cauta(P, S.minge); if (!r.castig) return false; const Pm = JSON.parse(JSON.stringify(P), (k, v) => (Array.isArray(v) && (v[0] === 'spune_sec' || v[0] === 'spune') ? ['mergi_la_xy', 77, 77] : v)); const s = E.serie(Pm, 1, {x: r.inainte.x, y: r.inainte.y, directie: r.inainte.directie, minge: S.minge})[0]; return !(s.x === 77 && s.y === 77); }};
const DEPARTE = {ce: 'Mingea nu e lipită de pisică', msg: 'Mingea atinge pisica de la început. Trage-o mai departe.', ok: (U, P, S) => S.minge && !E.atingeMinge({x: 0, y: 0, directie: 90}, S.minge)};
const APASAT = n => ({ce: `Ai apăsat pe pisică de cel puțin ${n} ori`, msg: `Apasă pe pisică, pe scenă (pe telefon, atinge-o), de ${n} ori. Mingea o acoperă? Apasă pe partea care se vede. Dacă schimbi programul, numărătoarea începe din nou.`, ok: (U, P, S) => S.clicuri >= n});
const ALES = (bun, msg) => ({ce: 'Răspunsul se potrivește cu ce s-a întâmplat', msg, ok: (U, P, S) => S.ales === bun});

/* ---- atelierul: tipul `eveniment` (jocul se poate juca și strica), cu mai multe alegeri sub el; stă în pagină, nu e extensie. Variantele se amestecă. Nimic nu se salvează. ---- */
const amesteca = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const tipExplica = {
  render(Q, body, api) {
    E.tipuri.eveniment.render(Q, body, api);
    const nume = 'ex' + Math.random().toString(36).slice(2, 9);
    const box = document.createElement('div');
    box.className = 'ex-q';
    box.innerHTML = Q.intrebari.map((I, k) => `<fieldset><legend>${k + 1}. ${I.q}</legend>${amesteca(I.o).map(t => `<label><input type="radio" name="${nume}_${k}"><span>${t}</span></label>`).join('')}</fieldset>`).join('');
    const tst = body.querySelector('.ss-tst');
    if (tst) tst.parentNode.insertBefore(box, tst); else body.appendChild(box);
    const alese = () => Q.intrebari.map((I, k) => { const i = box.querySelector(`input[name="${nume}_${k}"]:checked`); return i ? i.parentNode.querySelector('span').innerHTML : null; });
    const st0 = body._ss.stare.bind(body._ss);
    body._ss.stare = () => Object.assign(st0(), {alese: alese()});
    body._exAlege = () => Q.intrebari.forEach((I, k) => box.querySelectorAll(`input[name="${nume}_${k}"]`).forEach(i => { if (i.parentNode.querySelector('span').innerHTML === I.o[I.ok]) i.checked = true; }));
  },
  rezolva(Q, body) { E.tipuri.eveniment.rezolva(Q, body); body._exAlege(); },
  gresit(Q, body) { E.tipuri.eveniment.gresit(Q, body); }
};

/* ---- grila profesorului: Info_Gimnaziu_2026\instrumente\Grila_produs.md, întocmai (fără antetul fișei și nota de subsol, ca la V/22 și V/34; proba: _proba\proba_grila.py) ---- */
const GRILA_TEXT = `<p>La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). <b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8.</p>
${[
 ['Respectarea cerinței', 'conține elementele cerute, cu ajutor', 'conține tot ce s-a cerut, fără ajutor', 'depășește cerința cu elemente potrivite, alese motivat'],
 ['Corectitudinea tehnică', 'operațiile de bază, cu îndrumare', 'operațiile cerute, corect, singur', 'operații diverse, alese potrivit situației'],
 ['Organizarea', 'structură dată de profesor', 'structură proprie, clară', 'organizare gândită pentru scopul și publicul produsului'],
 ['Explicația (ce am făcut și de ce)', 'răspunde la întrebări', 'explică pașii', 'justifică alegerile și propune alternative'],
 ['Munca proprie / sursele', 'folosește materialele date', 'citează sursele imaginilor/textelor', 'respectă drepturile de autor și explică de ce contează']
].map((r, i) => `<p class="grila-c"><b>${i + 1}. ${r[0]}</b><br>De bază (cu sprijin, model) · 10 p: ${r[1]}<br>Consolidat (independent) · 14 p: ${r[2]}<br>Avansat (context nou, justificat) · 18 p: ${r[3]}</p>`).join('\n')}
<p>Cuvinte din grilă: <b>din oficiu</b> = puncte pe care le primește oricine; <b>alternative</b> = alte variante, alte idei; <b>justifică</b> = spune de ce a ales așa.</p>
<p><b>Așa citim noi grila, la jocul tău:</b> 1. are cele două programe și regula de câștig; 2. merg, puse de tine; 3. programe ordonate, fișierul cu numele cerut; 4. explici o secvență; 5. spui de unde sunt personajele (proiectul de pornire) și decorul (Scratch). Dacă profesorul spune altfel, ține-te de ce spune el.</p>`;
const GRILA = (titlu) => `<details class="verif"><summary>${titlu}</summary>${GRILA_TEXT}</details>`;

const FISA = `<div class="fisa"><p><b>Fișa „Ce spun la prezentare”</b> (o scrii în caiet, în cuvinte-cheie):</p><p><b>1.</b> Scopul jocului; ce face apăsarea, ce face steagul.</p><p><b>2.</b> Secvența, bloc cu bloc: ce o pornește, „dacă”, locașul, gura.</p><p><b>3.</b> De ce am pus startul.</p><p><b>4.</b> Ce s-a întâmplat când am scos un bloc.</p><p><b>5.</b> De unde sunt personajele și decorul.</p><p><b>6.</b> <span class="mai-ai-timp"><b>Dacă mai ai timp:</b> ce am ales eu și de ce; ce aș putea face altfel.</span></p></div>`;

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun; fără cont. Drumul: _proba/live_v35.py → live_v35.json (a1, a2, a4). Explorer: cuvintele lecțiilor 9-11 și 34. ---- */
const LAB = [
  '<b>Jocul tău, deschis.</b> L-ai deschis la casetă? Rămâi în fila lui. Nu? Deschide-l ca la pasul <i>Jocul tău: îl găsești sau îl refaci</i> (pasul 2 din 6). Nu merge internetul sau Scratch? Jos, <b>← Înapoi la atelier</b>: exersezi acolo și îi spui profesorului.',
  '<b>Joacă-l o dată.</b> Pisica nu e la start? E unde ai lăsat-o; după primul câștig sare acolo. Câștigi? Ai pus bolovanul? Lovește-l o dată. Repară o singură problemă, cea mai mare (lista: lecția 34, la Scratch, punctul <b>Nu iese?</b>).',

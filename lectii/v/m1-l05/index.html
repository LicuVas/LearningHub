<script>
/* Lecția 5, clasa a V-a (M1): „Dispozitive de intrare, de ieșire și de intrare-ieșire”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele: surse.md.
   Simulatorul „fotografie” (etichete / categorii pe fotografii reale) e fișierul comun lectii/_sim/fotografie.js. */
const LIC={
  pd:'domeniu public',
  cc0:'<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.ro" target="_blank" rel="noopener">CC0</a>',
  by2:'<a href="https://creativecommons.org/licenses/by/2.0/deed.ro" target="_blank" rel="noopener">CC BY 2.0</a>',
  by4:'<a href="https://creativecommons.org/licenses/by/4.0/deed.ro" target="_blank" rel="noopener">CC BY 4.0</a>',
  bysa2:'<a href="https://creativecommons.org/licenses/by-sa/2.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 2.0</a>',
  bysa3:'<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 3.0</a>',
  bysa4:'<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 4.0</a>'
};
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* dispozitivele: fotografia, mărimea reală, descrierea (alt) și sursa de pe Commons [fișier, autor, licență] */
const D={
  tastatura:['tastatura.webp',310,206,'O tastatură neagră, văzută de aproape',['QWERTY_keyboard.jpg','MichaelMaggs',LIC.bysa3]],
  mouse:['mouse.webp',287,214,'Un mouse negru cu fir, pe un covor',['Computer_mouse_1_2015-02-28.JPG','FASTILY',LIC.bysa4]],
  camera:['camera-web.webp',310,174,'O cameră web mică, neagră, cu un ochi de sticlă, pe un picior',['USB_webcam_for_PC.jpg','WrS.tm.pl',LIC.cc0]],
  microfon:['microfon.webp',420,325,'Un microfon negru, de ținut în mână, cu fir',['USB-Microphone.jpg','Evan-Amos',LIC.pd]],
  scaner:['scaner.webp',300,461,'Un scaner cu capacul ridicat: dedesubt, geamul pe care pui foaia',['Trust_Flat_Scan_USB_19200.jpg','Bultro',LIC.bysa4]],
  monitor:['monitor.webp',194,213,'Un monitor subțire, negru, pe un picior',['Computer_monitor.jpg','Zzubnik',LIC.pd]],
  boxe:['boxe.webp',310,208,'Două boxe mici, gri, una lângă alta',['Bose_Computer_MusicMonitor.jpg','Ben Stassen’s',LIC.by2]],
  casti:['casti.webp',400,415,'Niște căști negre, mari, fără microfon, puse pe un suport',['AudioQuest_NightHawk_Carbon_headphones_(33582571334).jpg','david falkner',LIC.by2]],
  imprimanta:['imprimanta.webp',278,215,'O imprimantă albă cu negru, cu o foaie albă în spate',['Epson-inkjet-printer.jpg','„Somebody in the WWW”',LIC.bysa3]],
  proiector:['videoproiector.webp',420,291,'Un videoproiector negru cu argintiu, cu obiectivul rotund în față',['InFocus_IN34.jpg','Dave Pape',LIC.pd]],
  tactil:['ecran-tactil.webp',480,320,'Două mâini țin un telefon culcat; un deget atinge ecranul',['Livraria_do_Senado_(22622160063).jpg','Senado Federal',LIC.by2]],
  castiMic:['casti-microfon.webp',640,642,'Căști negre cu microfon: în stânga, un braț subțire cu microfonul la capăt',['Computerhardware_und_Peripherie_20240203_HOF07007_RAW-Export.png','PantheraLeo1359531',LIC.by4]],
  multi:['multifunctionala.webp',480,567,'O imprimantă multifuncțională albă, cu capacul de sus ridicat: dedesubt, geamul scanerului',['HP_Deskjet_F380_Printer_and_Scanner.jpg','Alexander Whillas',LIC.bysa2]]
};
/* o galerie de fotografii mici: sub fiecare, doar numele; dedesubt, sursele */
const galerie=lista=>`<div class="galerie">${lista.map(([k,nume])=>{const [f,w,h,alt]=D[k];
  return `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${nume}</figcaption></figure>`}).join('')}</div>
<p class="galerie-credit">Foto, Wikimedia Commons: ${lista.map(([k])=>{const s=D[k][4];return `${wc(s[0],s[1])} (${s[2]})`}).join(', ')}; decupate.</p>`;
const CR={
  dell:`<small>Foto: Ente75, ${wc('Dell_Desktop_Computer_in_school_classroom.jpg','Wikimedia Commons')}, ${LIC.pd}.</small>`,
  coduri:`<small>Foto: Raimond Spekking, ${wc('Honeywell_4600g-8665.jpg','Wikimedia Commons')}, ${LIC.bysa4}.</small>`,
  print3d:`<small>Foto: MukhtaromST, ${wc('3D_Printing.jpg','Wikimedia Commons')}, ${LIC.cc0}; decupată jos.</small>`,
  touchpad:`<small>Foto: Rich Farmbrough, ${wc('Hewlett-Packard_Pavilion_dm1_laptop_keyboard_and_touchpad.jpg','Wikimedia Commons')}, ${LIC.bysa4}.</small>`,
  laptop:`<small>Foto: Intel Free Press, ${wc('Touch_on_Clamshell_Devices.jpg','Wikimedia Commons')}, ${LIC.by2}.</small>`,
  casti:`Foto: PantheraLeo1359531, ${wc('Computerhardware_und_Peripherie_20240203_HOF07007_RAW-Export.png','Wikimedia Commons')}, ${LIC.by4}.`,
  masaMuzica:`Foto: Tim Walker, ${wc('Tawalker%27s_home_studio_gear_(2007).jpg','Wikimedia Commons')}, ${LIC.by2}; decupată.`,
  masaBirou:`Foto: Martinultima, ${wc('Martin_Ultima%27s_Dell.jpg','Wikimedia Commons')}, ${LIC.bysa3}; decupată, mai luminoasă.`
};
const IMG={
  clasa:fig('calculator-clasa.webp',800,600,'Un calculator pe o masă dintr-o sală de clasă: în stânga o cutie înaltă, în mijloc un ecran, în față o tastatură, în dreapta un mouse',`Calculatorul de birou de la lecția 4: unitatea centrală (cutia din stânga), monitorul, tastatura și mouse-ul. ${CR.dell}`),
  intrare:galerie([['tastatura','Tastatura'],['mouse','Mouse-ul'],['camera','Camera web'],['microfon','Microfonul'],['scaner','Scanerul']]),
  iesire:galerie([['monitor','Monitorul'],['boxe','Boxele'],['casti','Căștile'],['imprimanta','Imprimanta'],['proiector','Videoproiectorul']]),
  io:galerie([['tactil','Ecranul tactil'],['castiMic','Căștile cu microfon'],['multi','Imprimanta multifuncțională']]),
  sunet:galerie([['microfon','Microfonul: intrare'],['boxe','Boxele: ieșire']]),
  apel:galerie([['camera','Intră: camera web'],['microfon','Intră: microfonul'],['monitor','Iese: monitorul'],['boxe','Ies: boxele']])
};
/* fotografii mici în enunțul exercițiilor */
const QI={
  coduri:fig('cititor-coduri.webp',600,449,'Un aparat alb cu gri, cu mâner, ca o lanternă mare, legat cu un cablu','Cititorul de coduri de bare. '+CR.coduri),
  print3d:fig('imprimanta-3d.webp',480,593,'O imprimantă 3D: o cutie cu pereți de sticlă; înăuntru, pe o placă, un obiect albastru din plastic, iar deasupra lui, capul care pune plasticul','Imprimanta 3D. '+CR.print3d),
  touchpad:fig('touchpad.webp',600,450,'Tastatura unui laptop, văzută de sus; sub ea, o suprafață dreptunghiulară, netedă: touchpad-ul','Tastatura unui laptop și, sub ea, touchpad-ul. '+CR.touchpad),
  laptop:fig('laptop-ecran-tactil.webp',600,400,'Un deget atinge ecranul unui laptop deschis','Un laptop cu ecran tactil. '+CR.laptop)
};
/* schema „Ce am învățat”: drumul datelor din lecția 4, cu dispozitivele de azi */
const SCHEMA=`<div class="schema" role="img" aria-label="Schema: prin dispozitivele de intrare datele intră în unitatea centrală; ea le prelucrează și le memorează; prin dispozitivele de ieșire rezultatul iese; dispozitivele de intrare-ieșire lucrează în ambele sensuri">
  <div class="sc-box"><b>Dispozitive de intrare</b><span>datele intră: tastatura, mouse-ul, touchpad-ul, microfonul, camera web, scanerul, cititorul de coduri de bare</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Unitatea centrală</b><span>prelucrează și memorează datele: procesorul, memoria RAM</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Dispozitive de ieșire</b><span>rezultatul iese: monitorul, boxele, căștile, imprimanta, videoproiectorul</span></div>
  <div class="sc-box sc-io"><b>Dispozitive de intrare-ieșire</b><span>datele merg în ambele sensuri: ecranul tactil, căștile cu microfon, imprimanta multifuncțională</span></div>
</div>`;
const GRUPE=[{id:'in',et:'Intrare'},{id:'ies',et:'Ieșire'},{id:'io',et:'Intrare-ieșire'}];

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).
   Totul se face DE PE SCAUN, fără cabluri, prize sau aplecat sub masă, și FĂRĂ profesor (la ora simultană e la cealaltă clasă). */
const LABORATOR=[
  'Stai pe scaun, la locul tău. <b>Nu atingi cablurile și prizele și nu te apleci sub masă</b> (regula din lecția 2). Azi te uiți, miști mouse-ul și scrii în caiet.',
  'În caiet, scrie trei titluri, unul sub altul, cu câteva rânduri libere sub fiecare: <b>Intrare</b>, <b>Ieșire</b>, <b>Intrare-ieșire</b>.',
  'Privește dispozitivele de pe masa ta, fără să le muți. Pentru fiecare, folosește metoda: <b>ce faci cu el și încotro merg datele?</b> Scrie-i numele sub titlul potrivit. Unitatea centrală nu o scrii: în ea se prelucrează datele, iar dispozitivele sunt legate de ea.',
  'Caută din ochi și dispozitivele mici: o cameră web deasupra monitorului, un microfon, căști, boxe. Scrie doar ce ai la locul tău. Dacă lucrezi pe un laptop, tastatura, touchpad-ul și ecranul sunt prinse chiar în el: scrie-le și pe ele. Dacă nu știi că ecranul e tactil, nu-l încerca: scrie-l la Ieșire. Dacă vezi un stick USB, nu-l scrie: despre el înveți data viitoare.',
  'Dacă monitorul e aprins, mișcă încet mouse-ul (sau degetul pe touchpad) și uită-te la săgeata de pe ecran. Scrie o propoziție: prin ce dispozitiv au intrat datele și prin ce dispozitiv a ieșit rezultatul. Dacă monitorul e stins, nu porni nimic: treci la punctul următor.',
  'Scrie ce dispozitive ți-ar mai trebui la locul tău ca să vorbești cu bunica într-un apel video, iar ea să te vadă și să te audă. Lângă fiecare, scrie grupa lui.',
  'Compară caietul tău cu al colegului de bancă. Unde nu sunteți de acord, recitiți pasul „Metoda: încotro merg datele?” și hotărâți împreună.'
];

JocMotor.porneste({
  cheie:'lectie_v_m1_l05',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 5”, „Acum în aplicația adevărată” înainte de verificare
  titlu:'Dispozitive de intrare, de ieșire și de intrare-ieșire',
  marca:'Lecția <b>5</b> · clasa a V-a',
  h1:'Dispozitive de intrare, de ieșire și de intrare-ieșire',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U1', unitateTitlu:'Sisteme de calcul. Lucrez corect și în siguranță',
  competente:['CS.1.1'], lectii:'5',
  ancoraText:'Din programă (CS.1.1, unitatea V-U1, lecția 5): Dispozitive de intrare: exemple, rol, mod de utilizare · Dispozitive de ieșire: exemple, rol, mod de utilizare · Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare',
  intro:`<p>Afli prin ce aparate intră datele în calculator și prin ce aparate iese rezultatul spre tine. Înveți pe pași, cu fotografii adevărate. La atelier pui etichete pe aparatele de pe fotografia unei mese de lucru, apoi faci la fel la calculatorul tău din laborator. La sfârșit verifici ce știi, cu 5 întrebări.</p>
<p><b>La final știi:</b> să spui dacă un dispozitiv e de intrare, de ieșire sau de intrare-ieșire și să alegi dispozitivul potrivit pentru o treabă.</p>
<p><b>Ai nevoie de:</b> lecția 4 — drumul datelor prin calculator: datele <b>intră</b>, sunt <b>prelucrate</b> și <b>memorate</b> în unitatea centrală, apoi <b>iese</b> rezultatul; părțile mari ale calculatorului: unitatea centrală, monitorul, tastatura, mouse-ul; lecția 2 — în laborator nu atingi cablurile și prizele.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 6 pași scurți. După fiecare, un exercițiu mic, fără puncte.</li><li>La atelier pui etichete pe dispozitivele de pe fotografia unei mese de lucru.</li><li>Acum la calculatorul din laborator: sortezi în caiet dispozitivele de la locul tău, fără să atingi cablurile.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,
  banda:'<span><i class="usb"></i><i class="usb"></i>USB</span><span><i class="jack roz"></i>MIC</span><span><i class="jack verde"></i>AUDIO</span><span><i class="hdmi"></i>HDMI</span><span><i class="usb"></i><i class="usb"></i>USB</span>',
  nivele:[
{t:'Dispozitive de intrare, de ieșire și de intrare-ieșire',final:true,lectii:[5],
 continuturi:['Dispozitive de intrare: exemple, rol, mod de utilizare','Dispozitive de ieșire: exemple, rol, mod de utilizare','Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare'],
 obiectiv:'spui, pentru orice dispozitiv, încotro merg datele prin el (intră în calculator, ies din el sau amândouă) și alegi dispozitivul potrivit pentru o treabă.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: cum „vorbești” cu calculatorul',
   text:`<p>Uită-te la calculatorul din fotografie. L-ai văzut la lecția 4: are unitatea centrală, monitorul, tastatura și mouse-ul.</p>
<p>Unitatea centrală prelucrează datele. Dar datele trebuie întâi să intre în ea, iar rezultatul trebuie să iasă spre tine. De aceea, de unitatea centrală sunt legate aparate: prin tastatură îi dai litere, pe monitor vezi ce a făcut cu ele.</p>
<p>Azi afli încotro merg datele prin fiecare aparat. Apoi alegi singur aparatul potrivit ca să înregistrezi o poezie, să tipărești o fișă sau să vorbești cu bunica într-un apel video.</p>
${IMG.clasa}`},
  /* ---- pasul 1: dispozitiv + dispozitivele de intrare ---- */
  {t:'Dispozitivele de intrare',
   text:`<p>Aparatele legate de unitatea centrală, prin cablu sau fără fir, se numesc <mark>dispozitive</mark> (sau <strong>periferice</strong>). La laptop și la telefon, multe sunt prinse chiar în aparat.</p>
<p>Printr-un <mark>dispozitiv de intrare</mark>, datele <strong>intră</strong> în calculator, de la tine sau din jur:</p>
<ul><li><strong>tastatura</strong>: apeși taste;</li>
<li><strong>mouse-ul</strong>: îl miști și faci clic;</li>
<li><strong>microfonul</strong>: vorbești lângă el, iar el prinde vocea;</li>
<li><strong>camera web</strong>: stai în fața ei, iar ea prinde imaginea ta;</li>
<li><strong>scanerul</strong>: pui foaia pe geamul lui, cu desenul în jos, și închizi capacul; când scanezi, desenul intră în calculator ca imagine.</li></ul>
${IMG.intrare}`,
   exemplu:`<p>Scrii un mesaj. Fiecare tastă apăsată trimite o literă <b>în</b> calculator: tastatura e un dispozitiv de intrare.</p><p>Faci clic pe un desen de pe ecran. Clicul intră în calculator prin mouse: și mouse-ul e un dispozitiv de intrare.</p>`,
   altfel:`<p>E ca atunci când îi dai profesorului tema: caietul pleacă de la tine și ajunge la el. Printr-un dispozitiv de intrare, datele pleacă de la tine și ajung în calculator.</p>`,
   incearca:{t:'choice',q:`${QI.coduri}La casa magazinului, casiera apropie acest aparat de codul de bare al fiecărui produs (dungile negre de pe ambalaj). Apoi, pe ecranul casei apar numele produsului și prețul. Aparatul se numește <strong>cititor de coduri de bare</strong>. E un dispozitiv de intrare?`,
    o:['Da: prin el, codul produsului intră în calculatorul casei','Nu: prețul apare pe ecran, deci datele ies','Nu: e doar un bec care luminează dungile','Da: pentru că îl ții în mână când lucrezi'],ok:0,
    ajutor:'Întreabă-te ce face aparatul: duce ceva în calculator sau îți arată ceva ție?',
    why:'Da. Aparatul citește dungile și trimite codul produsului în calculatorul casei: datele intră. Prețul apare pe ecran, dar ecranul e alt dispozitiv. Cum ții aparatul nu contează.'},
   inca:[
    {t:'choice',q:'Vrei să înregistrezi pe calculator cum cânți un cântec. Prin ce dispozitiv intră vocea ta în calculator?',o:['Microfonul','Tastatura','Scanerul','Mouse-ul'],ok:0,ajutor:'Care dispozitiv de intrare prinde sunetul?',why:'Microfonul prinde vocea și o trimite în calculator. Tastatura trimite litere, scanerul trimite imaginea unei foi, iar mouse-ul trimite mișcarea mâinii.'},
    {t:'tf',q:'Tastatura, mouse-ul și microfonul se mai numesc periferice.',ok:true,ajutor:'Recitește prima propoziție din pas.',why:'Adevărat. Sunt dispozitive legate de unitatea centrală, iar dispozitivele se mai numesc periferice.'}
   ]},
  /* ---- pasul 2: dispozitivele de ieșire ---- */
  {t:'Dispozitivele de ieșire',
   text:`<p>Printr-un <mark>dispozitiv de ieșire</mark>, rezultatul <strong>iese</strong> din calculator spre tine: îl vezi, îl auzi sau îl ții în mână.</p>
<ul><li><strong>monitorul</strong>: te uiți la el;</li>
<li><strong>boxele</strong>: asculți sunetul din ele, și îl aud toți din cameră;</li>
<li><strong>căștile</strong> (fără microfon): le pui pe urechi, iar sunetul îl auzi doar tu;</li>
<li><strong>imprimanta</strong>: îi trimiți din calculator o fișă, iar ea o tipărește pe hârtie;</li>
<li><strong>videoproiectorul</strong>: arată imaginea din calculator mare, pe perete sau pe o pânză, ca s-o vadă toată clasa.</li></ul>
${IMG.iesire}`,
   exemplu:`<p>Termini un desen pe calculator. Îl vezi pe <b>monitor</b>: rezultatul a ieșit spre ochii tăi. Îl tipărești la <b>imprimantă</b>: acum îl ții și în mână, pe hârtie. Și monitorul, și imprimanta sunt dispozitive de ieșire.</p>`,
   altfel:`<p>E ca atunci când profesorul îți dă înapoi lucrarea corectată: foaia pleacă de la el și ajunge la tine. Printr-un dispozitiv de ieșire, rezultatul pleacă din calculator și ajunge la tine.</p>`,
   incearca:{t:'choice',q:`${QI.print3d}Aparatul din fotografie este o <strong>imprimantă 3D</strong>. Primește din calculator desenul unui obiect și îl face din plastic, strat cu strat. Pe placa ei stă un obiect albastru, din plastic. E un dispozitiv de intrare sau de ieșire?`,
    o:['De ieșire: desenul iese din calculator ca obiect','De intrare: plasticul intră în imprimantă','De intrare: e legată de calculator'],ok:0,
    ajutor:'Nu te uita la plastic. Întreabă-te încotro merg datele: spre calculator sau dinspre el?',
    why:'De ieșire. Desenul pleacă din calculator și iese ca obiect pe care îl ții în mână. Plasticul intră în imprimantă, nu în calculator. Și dispozitivele de intrare sunt legate de calculator, deci asta nu spune grupa.'},
   inca:[
    {t:'classify',q:'Folosește regula: datele intră în calculator sau ies din el? Sortează.',cats:['Intră: dispozitiv de intrare','Iese: dispozitiv de ieșire'],items:[['Imprimanta mică ce scoate bonul la magazin',1],['Cititorul de amprentă: pui degetul pe el, iar laptopul te recunoaște',0],['Videoproiectorul din clasă',1],['Camera laptopului, cu care îți faci o poză',0]],ajutor:'Întreabă-te pentru fiecare: pleacă ceva de la om spre calculator sau de la calculator spre om?',why:'Amprenta și imaginea ta pleacă de la tine și intră în calculator. Bonul și imaginea de pe perete ies din calculator spre oameni.'},
    {t:'tf',q:'Căștile fără microfon sunt un dispozitiv de ieșire: prin ele, sunetul iese din calculator spre urechile tale.',ok:true,ajutor:'Căștile fără microfon: le pui pe urechi. Tu dai ceva calculatorului sau primești?',why:'Adevărat. Prin căștile fără microfon doar asculți: sunetul vine dinspre calculator spre tine.'}
   ]},
  /* ---- pasul 3: dispozitivele de intrare-ieșire ---- */
  {t:'Dispozitivele de intrare-ieșire',
   text:`<p>Unele dispozitive lucrează <strong>în ambele sensuri</strong>: prin același dispozitiv, datele și intră în calculator, și ies din el. Se numesc <mark>dispozitive de intrare-ieșire</mark>.</p>
<ul><li><strong>ecranul tactil</strong>, ca la telefon sau la tabletă: îți arată imaginea (iese) și simte atingerea degetului tău (intră);</li>
<li><strong>căștile cu microfon</strong>: prin căști auzi sunetul (iese), în microfon vorbești (intră);</li>
<li><strong>imprimanta multifuncțională</strong>: sus are un scaner, care scanează foaia (intră), iar jos o imprimantă, care tipărește (iese).</li></ul>
${IMG.io}`,
   exemplu:`<p>Pe telefon, atingi cu degetul un joc: atingerea ta <b>intră</b>. Imediat, pe același ecran, jocul pornește: imaginea <b>iese</b>. Datele au mers în ambele sensuri, prin același ecran.</p>`,
   altfel:`<p>E ca ușa clasei. Dimineața intri pe ea, iar în pauză ieși tot pe ea. Printr-un dispozitiv de intrare-ieșire, datele trec în ambele sensuri, prin același loc.</p>`,
   incearca:{t:'fotografie',q:'Căștile din fotografie au microfon. Pune cele 2 etichete pe părțile potrivite. Pe telefon, apasă întâi „Mărește fotografia”.',
    img:'casti-microfon.webp',w:640,h:642,
    alt:'Căști negre cu microfon, văzute de sus: banda de pus pe cap, două căști rotunde cu burete și, în stânga, un braț subțire cu microfonul la capăt; la mijloc, cablul strâns',
    credit:CR.casti,
    tinte:[{id:'mic',et:'Pe aici intră vocea ta',test:'Eticheta 1 stă pe partea potrivită'},{id:'casca',et:'Pe aici iese sunetul spre tine',test:'Eticheta 2 stă pe partea potrivită'}],
    zone:[{id:'mic',r:[[1,10,10.8,29],[2.5,29,9,38]]},{id:'brat',r:[[2.5,38,10.8,61]]},{id:'casca',r:[[14,51,46,87],[55.5,51,86,86]]},{id:'banda',r:[[14,7,86,21],[10.9,20,17,62],[84,20,92,65]]}],
    nume:{mic:'microfon',brat:'brațul microfonului; microfonul e capătul lui de sus',casca:'o cască',banda:'banda de pus pe cap'},
    nimic:'Acum nu stă pe microfon și nici pe o cască: acolo e cablul sau fundalul.',
    punct:{mic:[7,20],casca:[30,70]},
    gresit:{mic:[30,70],casca:[7,20]},
    ajutor:'Vocea intră pe unde vorbești. Sunetul iese pe unde asculți.',
    why:'Microfonul, la capătul brațului subțire, prinde vocea: pe acolo datele intră. Căștile rotunde stau pe urechi: pe acolo sunetul iese spre tine. De aceea, căștile cu microfon sunt de intrare-ieșire.'},
   inca:[
    {t:'choice',q:`${QI.laptop}Pe laptopul din fotografie, ecranul e tactil: îl atingi cu degetul, ca pe un telefon. Ce fel de dispozitiv este ecranul acestui laptop?`,o:['De intrare-ieșire','Doar de intrare','Doar de ieșire'],ok:0,ajutor:'Ecranul îți arată ceva? Simte degetul? Dacă face amândouă, datele merg în ambele sensuri.',why:'Ecranul îți arată imaginea: datele ies. Simte degetul: datele intră. Ambele sensuri, prin același ecran: intrare-ieșire.'},
    {t:'tf',q:'Ecranul tactil e de intrare-ieșire pentru că e mai mare decât un monitor.',ok:false,ajutor:'Recitește ce face ecranul tactil în pas.',why:'Fals. Mărimea nu contează: ecranul unui telefon e mic. E de intrare-ieșire pentru că îți arată imaginea (iese) și simte degetul (intră).'}
   ]},
  /* ---- pasul 4: metoda + capcana cablului ---- */
  {t:'Metoda: încotro merg datele?',
   text:`<p>Când nu știi în ce grupă e un dispozitiv, răspunde pe rând la trei întrebări:</p>
<ol><li><strong>Ce faci</strong> cu el?</li>
<li>Datele merg <strong>spre calculator</strong>, <strong>dinspre calculator</strong> sau <strong>în ambele sensuri</strong>?</li>
<li>Spre calculator: <strong>intrare</strong>. Dinspre calculator: <strong>ieșire</strong>. În ambele sensuri: <strong>intrare-ieșire</strong>.</li></ol>
<p><strong>Capcana cablului:</strong> și monitorul are un cablu care intră în unitatea centrală. Dar contează drumul <strong>datelor</strong>, nu al cablului. Prin monitor, rezultatul iese spre tine, deci monitorul e de ieșire.</p>
<p>La fel <strong>cititorul de coduri de bare</strong> de la casa magazinului: prin el, codul produsului intră în calculator, deci e de intrare, chiar dacă prețul apare apoi pe ecran.</p>`,
   exemplu:`<p><b>Microfonul și boxele</b> au amândouă de-a face cu sunetul. Le desparți cu metoda:</p><ul><li>în microfon <b>vorbești</b>: sunetul merge spre calculator, deci microfonul e de <b>intrare</b>;</li><li>din boxe <b>asculți</b>: sunetul vine dinspre calculator, deci boxele sunt de <b>ieșire</b>.</li></ul><p>Nu contează ce trece (sunet, imagine, litere), ci încotro merge.</p>${IMG.sunet}`,
   altfel:`<p>Gândește-te la un magazin cu două uși: pe una scrie „Intrare”, pe cealaltă „Ieșire”. Calculatorul e magazinul, iar datele sunt oamenii. Pe ușa de intrare, oamenii vin înăuntru, ca datele prin tastatură. Pe ușa de ieșire pleacă afară, ca rezultatul prin monitor.</p><p>Ca să afli ce ușă e, nu te uiți la trotuarul din fața ei: el duce la amândouă ușile. Te uiți încotro merg oamenii. Cablul e ca trotuarul: îl au și tastatura, și monitorul. Contează încotro merg datele.</p>`,
   incearca:{t:'choice',q:`${QI.touchpad}Sub tastatura laptopului e o suprafață netedă, numită <strong>touchpad</strong> (se citește „taci-ped”). Miști degetul pe ea, iar săgeata de pe ecran se mișcă. Pe touchpad nu apare nicio imagine. În ce grupă e touchpad-ul?`,
    o:['De intrare: prin el, datele doar intră','De intrare-ieșire: îl atingi, ca pe ecranul tactil','De ieșire: săgeata se mișcă pe ecran'],ok:0,
    ajutor:'Folosește metoda: ce faci cu el? Datele merg spre calculator, dinspre el sau în ambele sensuri? Pe touchpad apare vreo imagine?',
    why:'De intrare. Mișcarea degetului intră în calculator. Săgeata apare pe ecran, adică iese prin alt dispozitiv. Pe touchpad nu apare nimic, deci prin el datele doar intră. Un ecran tactil, în schimb, și arată imagini.'},
   inca:[
    {t:'tf',q:'Și imprimanta are un cablu care intră în unitatea centrală. Deci imprimanta e un dispozitiv de intrare.',ok:false,ajutor:'Capcana cablului: contează drumul cablului sau drumul datelor?',why:'Fals. Cablul nu spune nimic despre grupă. Prin imprimantă, fișa iese din calculator pe hârtie: imprimanta e de ieșire.'},
    {t:'classify',q:'Toate au de-a face cu sunetul. Sortează-le cu metoda.',cats:['Intrare','Ieșire','Intrare-ieșire'],items:[['Microfonul',0],['Boxele',1],['Căștile fără microfon',1],['Căștile cu microfon',2]],ajutor:'Vorbești în el? Asculți din el? Sau faci amândouă?',why:'În microfon vorbești: sunetul intră. Din boxe și din căști asculți: sunetul iese. La căștile cu microfon faci amândouă.'}
   ]},
  /* ---- pasul 5: toate împreună + ce am învățat ---- */
  {t:'Toate împreună: alegi dispozitivele pentru o treabă',
   text:`<p>Acum poți alege singur dispozitivele pentru o treabă. Te întrebi: <strong>ce trebuie să intre</strong> în calculator și <strong>ce trebuie să iasă</strong> din el?</p>
<p><strong>Apelul video cu bunica</strong>, de pe un calculator de birou:</p>
<ul><li>intră imaginea ta, prin <strong>camera web</strong>, și vocea ta, prin <strong>microfon</strong>;</li>
<li>ies imaginea bunicii, pe <strong>monitor</strong>, și vocea ei, prin <strong>boxe</strong> sau prin <strong>căști</strong>.</li></ul>
<p>În unitatea centrală, între intrare și ieșire, procesorul prelucrează datele, iar memoria RAM le ține minte cât vorbiți, ca la lecția 4.</p>
<p>Pe un laptop fără mouse, săgeata o muți cu degetul pe <strong>touchpad</strong>, un dispozitiv de intrare.</p>
${IMG.apel}`,
   exemplu:`<p><b>Ce am învățat, pe scurt:</b></p>${SCHEMA}<p class="hint"><b>Data viitoare:</b> unele aparate păstrează date, de exemplu stick-ul USB. Despre ele afli în lecția 6. Azi nu le sortezi.</p>`,
   incearca:{t:'match',q:'Ce dispozitiv folosești ca să faci fiecare treabă? Leagă.',pairs:[['Bunica să te vadă în apelul video','camera web'],['Asculți o melodie fără să-i deranjezi pe ceilalți','căștile'],['Pui în calculator un desen făcut pe hârtie','scanerul'],['Scoți pe hârtie diploma de la un joc','imprimanta']],
    ajutor:'Întâi: trebuie ca ceva să intre în calculator sau să iasă din el? Apoi alegi dispozitivul care face asta.',
    why:'Imaginea ta și desenul de pe hârtie trebuie să intre: camera web și scanerul. Melodia și diploma trebuie să iasă: prin căști și la imprimantă.'},
   inca:[
    {t:'choice',q:'Calculatorul tău are monitor, boxe, tastatură și mouse. Vrei să vorbești cu bunica într-un apel video, iar ea să te vadă și să te audă. Ce dispozitive îți mai trebuie?',o:['Camera web și microfonul','Imprimanta și scanerul','Videoproiectorul și căștile','Încă un monitor și alte boxe'],ok:0,ajutor:'Tu o vezi și o auzi deja, prin monitor și boxe. Ce trebuie să intre în calculator, ca ea să te vadă și să te audă?',why:'Ca bunica să te vadă, imaginea ta trebuie să intre în calculator: camera web. Ca să te audă, vocea ta trebuie să intre: microfonul. Pentru ieșire ai deja monitorul și boxele.'},
    {t:'order',q:'Înregistrezi o poezie pe calculator, apoi o asculți. Pune în ordine ce se întâmplă.',items:['Vorbești în microfon','Unitatea centrală prelucrează sunetul și îl ține minte','Asculți poezia din boxe'],ajutor:'Întâi datele intră, apoi sunt prelucrate, apoi iese rezultatul.',why:'Vocea intră prin microfon. Unitatea centrală o prelucrează și o ține minte. Apoi sunetul iese prin boxe.'}
   ]}
 ],
 atelier:{t:'fotografie',titlu:'Atelier: pune etichete pe dispozitivele unei mese de lucru',
  intro:`<p><strong>Sarcina:</strong> fotografia arată masa de lucru a unui om care face muzică la calculator. N-ai mai văzut-o. Pune pe fiecare dispozitiv din lista testelor eticheta grupei lui.</p>
<ol><li>Apasă o etichetă de deasupra fotografiei: <b>1 Intrare</b>, <b>2 Ieșire</b> sau <b>3 Intrare-ieșire</b>. Prima e deja aleasă.</li>
<li>Atinge pe fotografie un dispozitiv din lista testelor. Pe el apare un cerc cu numărul etichetei. Eticheta rămâne aleasă, așa că poți atinge și alt dispozitiv din aceeași grupă.</li>
<li>Vrei să schimbi o etichetă? Apasă altă etichetă și atinge din nou dispozitivul.</li>
<li>Când toate cele 6 dispozitive au o etichetă, apasă <b>Verifică etichetele</b>. Fiecare test se bifează dacă eticheta e potrivită.</li></ol>
<p>Pe telefon, lucrurile mici se ating greu: apasă <b>Mărește fotografia</b>.</p>`,
  q:'Pune pe fiecare dispozitiv din lista testelor eticheta grupei lui: intrare, ieșire sau intrare-ieșire. Pe telefon, apasă întâi „Mărește fotografia”.',

  why:'Prin tastatură, prin mouse și prin camera web, datele intră în calculator: sunt de intrare. Prin monitor și prin cele două boxe, rezultatul iese spre om: sunt de ieșire. Printre dispozitivele din lista testelor nu e niciunul de intrare-ieșire: fiecare face ori una, ori alta. Aparatele pentru muzică de pe masă nu le-am sortat azi.',

 qs:[
  {t:'choice',q:'La bancomat, alegi suma atingând cu degetul butoanele desenate pe ecran. Pe același ecran apar apoi mesajele bancomatului. Ce fel de dispozitiv este acest ecran?',o:['Intrare-ieșire: îți arată mesajele și simte degetul','Doar intrare: pe el apeși cu degetul','Doar ieșire: pe el citești mesajele'],ok:0,ajutor:'Ecranul acesta îți arată ceva? Simte degetul?',why:'Ecranul îți arată mesajele: datele ies. Simte atingerea degetului: datele intră. Datele merg în ambele sensuri, prin același ecran: e un ecran tactil, de intrare-ieșire.'},
  {t:'classify',q:'La gară, multe aparate sunt legate de calculatoare. Sortează-le după drumul datelor.',cats:['Intrare','Ieșire','Intrare-ieșire'],items:[['Microfonul în care se anunță trenurile',0],['Difuzoarele de pe peron, din care se aud anunțurile',1],['Panoul mare pe care scrie ora trenurilor',1],['Camera care filmează peronul',0],['Ecranul tactil al automatului de bilete, pe care alegi orașul',2],['Imprimanta automatului, care scoate biletul',1]],ajutor:'Pentru fiecare: datele merg spre calculator, dinspre el sau în ambele sensuri? Difuzoarele sunt boxele gării.',why:'Microfonul și camera duc sunetul și imaginea în calculator: intrare. Difuzoarele, panoul cu ora trenurilor și imprimanta de bilete scot rezultatul spre oameni: ieșire. Ecranul tactil al automatului îți arată orașele și simte degetul: intrare-ieșire.'},

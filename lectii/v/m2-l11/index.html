/* tema: rafturi cu dosare etichetate, câte unul pentru fiecare criteriu */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent)}
.banda .dos{flex:none;position:relative;display:inline-block;width:20px;height:14px;background:var(--dosar);border-radius:1px 3px 3px 3px;margin-top:3px}
.banda .dos::before{content:"";position:absolute;left:0;top:-4px;width:9px;height:5px;background:var(--dosar2);border-radius:2px 2px 0 0}
.banda .et{flex:none;font-size:.74rem;color:var(--ink);border-bottom:2px solid var(--accent);padding:0 2px 1px;margin-right:6px}
h1,h2{font-weight:800;letter-spacing:0}
pre.arbore{font-family:var(--fm);font-size:.88rem;line-height:1.5;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:.5em 0;white-space:pre;overflow-x:auto}
.doua{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.doua pre.arbore{margin:.2em 0}
.doua b{display:block;font-size:.9rem}
code{font-family:var(--fm)}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:32px}
.lacalc{border-left:4px solid var(--accent);background:var(--paper2);padding:6px 10px;margin:.6em 0 0;border-radius:0 6px 6px 0}
ul.lista-control{margin:.3em 0;padding-left:1.2em}
ul.lista-control li{margin:.15em 0}
/* schema „Ce am învățat” (HTML, nu imagine) */
.schema{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:10px 0 12px}
.sc-box{border:2px solid var(--accent);border-radius:10px;background:var(--paper);padding:6px 10px;line-height:1.3}
.sc-box b{display:block;font-family:var(--fd);font-size:1rem}
.sc-box span{display:block;font-size:.86rem;color:var(--ink2)}
.doua span{display:block;font-size:.86rem;color:var(--ink2)}
/* laboratorul: o căsuță de bifat la fiecare punct, ca la lecția 10 (nu se păstrează nicăieri: e doar pentru elevul de acum) */
.bifez{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;vertical-align:middle;margin:-4px 2px -4px -6px;cursor:pointer}
.bifez input{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
li:has(> .bifez input:checked){opacity:.62}

/* Lecția 11, clasa a V-a (M2): „Îmi organizez resursele digitale personale (aplicație practică)” — consolidare.

   loc) sunt probate pe Windows 11 25H2 în română, pe desktopul ascuns, doar în _proba\sandbox*. Restul vine din lecția 10.

const IMG={
  piese:fig('piese-amestecate.webp',640,428,'O grămadă de piese de construcție de toate culorile, amestecate','Amestec. <small>Foto: Alan Chia, <a href="https://commons.wikimedia.org/wiki/File:Lego_Color_Bricks.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0" target="_blank" rel="noopener">CC BY-SA 2.0</a>; micșorată.</small>'),
  cutii:fig('cutii-etichetate.webp',480,468,'Rafturi cu multe cutii transparente, fiecare cu o etichetă pe ea, într-o cameră','Ordine: cutii cu etichete. <small>Foto: Joe Miserendino, <a href="https://commons.wikimedia.org/wiki/File:Lego_Room_-_(1).jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, <a href="https://creativecommons.org/licenses/by-sa/2.0" target="_blank" rel="noopener">CC BY-SA 2.0</a>; decupată și micșorată.</small>'),
  ctrl:fig('ctrl-clic-trei.webp',900,251,'Lista de fișiere din Explorer: Alarm01, img100 și Ring01 au rândul colorat, adică sunt selectate; Alarm02 și img101 nu sunt; lângă rânduri scrie cu roșu 1. clic, 2. Ctrl + clic, 3. Ctrl + clic','Trei fișiere selectate: clic pe primul, Ctrl + clic pe celelalte două. Aici extensiile se văd. Gri: fereastra nu era cea activă; de obicei e albastru. Pictograma pozelor depinde de programul care le deschide: la tine poate arăta altfel. '+CAPT),
  conflict:fig('inlocuire-mai-multe.webp',463,292,'Fereastra Înlocuire sau omitere fișiere: Se copiază 3 elemente de la Amestec la Colegul; Destinația are 2 fișiere cu același nume; prima variantă, Înlocuire fișiere de la destinație, are chenar; a doua, Se omit aceste fișiere, e încadrată cu roșu','Prima variantă e deja aleasă. '+CAPT)
};

const D='C:/Users/Elev/Documents/', EX=D+'Ex Pop Ana/', AM=EX+'Amestec/', PROBA=EX+'Proba/', MEDIA='C:/Windows/Media/';
const UNITATI={'C:':{nume:'Disc local'}};
const MEDIA_FS=[['Alarm01.wav','480 KB'],['Alarm02.wav','324 KB'],['Alarm03.wav','348 KB'],['Ring01.wav','487 KB'],['Ring02.wav','308 KB'],['chimes.wav','212 KB'],['ding.wav','69 KB'],['tada.wav','357 KB']]

   Reparația J1 (G2): datele sunt alese așa încât tip, subiect, an și lună să dea ORDINI DIFERITE: Ziua mea are fișiere în
   februarie și în martie, Temele în octombrie 2025, martie 2026 și noiembrie 2026, iar martie are și Ziua mea, și o temă.
   Atelierul folosește 16 dintre ele (ATELIER); celelalte sunt pentru exercițiile mici. */
const ANA=[
 ['bicaz 1.jpg','16.05.2026 10:12','2.310 KB','Imagini','Excursia'],['bicaz 2.jpg','16.05.2026 10:15','2.284 KB','Imagini','Excursia'],
 ['barajul.jpg','16.05.2026 11:02','2.197 KB','Imagini','Excursia'],['lacul rosu.jpg','16.05.2026 13:40','2.402 KB','Imagini','Excursia'],
 ['bicaz filmulet.mp4','16.05.2026 14:20','18.420 KB','Filme','Excursia'],['cantec excursie.mp3','16.05.2026 17:30','3.120 KB','Sunete','Excursia'],
 ['jurnal excursie.docx','18.05.2026 19:10','24 KB','Documente','Excursia'],
 ['serbare 1.jpg','19.12.2025 12:05','2.105 KB','Imagini','Serbarea'],['serbare 2.jpg','19.12.2025 12:07','2.230 KB','Imagini','Serbarea'],
 ['colind.mp3','15.12.2025 18:20','2.840 KB','Sunete','Serbarea'],['colind 2.mp3','15.12.2025 18:25','3.010 KB','Sunete','Serbarea'],
 ['serbare film.mp4','19.12.2025 12:30','25.600 KB','Filme','Serbarea'],['poezie serbare.docx','10.12.2025 17:45','18 KB','Documente','Serbarea'],
 ['tort.jpg','14.03.2026 16:30','1.980 KB','Imagini','Ziua mea'],['prieteni ziua mea.jpg','14.03.2026 16:42','2.150 KB','Imagini','Ziua mea'],
 ['felicitare ziua mea.png','12.03.2026 18:00','512 KB','Imagini','Ziua mea'],['la multi ani.mp3','14.03.2026 16:35','2.560 KB','Sunete','Ziua mea'],
 ['invitati ziua mea.docx','20.02.2026 19:20','15 KB','Documente','Ziua mea'],['ziua mea.mp4','14.03.2026 17:05','21.300 KB','Filme','Ziua mea'],
 ['rezumat basm.docx','25.10.2025 17:40','14 KB','Documente','Teme'],['pronuntie engleza.mp3','10.03.2026 18:10','1.450 KB','Sunete','Teme'],
 ['compunere toamna.docx','05.11.2026 18:02','16 KB','Documente','Teme'],['desen planete.png','15.11.2026 17:20','860 KB','Imagini','Teme'],
 ['exercitii fractii.docx','12.11.2026 18:30','13 KB','Documente','Teme'],['harta romania.png','03.11.2026 16:50','1.120 KB','Imagini','Teme']];
const LUNA=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
const ATR={};ANA.forEach(([n,d,,tip,sub])=>{ATR[n]={tip,subiect:sub,an:d.slice(6,10),luna:LUNA[+d.slice(3,5)-1]+' '+d.slice(6,10)}});
const CRITERII={tip:'după tip',subiect:'după subiect',an:'după dată (anul)',luna:'după dată (luna)'};
/* atelierul: 16 fișiere — după tip 4 foldere, după subiect 4, după an 2 (2025, 2026), după lună 6 (octombrie 2025 … noiembrie 2026) */
const ATELIER=['bicaz 1.jpg','barajul.jpg','bicaz filmulet.mp4','jurnal excursie.docx','serbare 1.jpg','colind.mp3','serbare film.mp4','poezie serbare.docx',
 'tort.jpg','la multi ani.mp3','ziua mea.mp4','invitati ziua mea.docx','rezumat basm.docx','pronuntie engleza.mp3','compunere toamna.docx','desen planete.png'];
const fsAna=(folder,nume)=>ANA.filter(x=>!nume||nume.includes(x[0])).map(x=>[folder+x[0],x[1],x[2]]);
const deTip=t=>ANA.filter(x=>x[3]===t&&ATELIER.includes(x[0])).map(x=>x[0]), deSubiect=t=>ANA.filter(x=>x[4]===t&&ATELIER.includes(x[0])).map(x=>x[0]);
const OG=o=>Object.assign({t:'explororg',unitati:UNITATI,doc:D,afisat:{'C:/Users/Elev/Desktop/':'Desktop','C:/Users/Elev/Downloads/':'Descărcări'},
  blocat:[MEDIA+'Afternoon/',MEDIA+'Calligraphy/','C:/Program Files/','C:/Users/Public/'],doarCitire:['C:/Windows/'],extensii:false,acum:'27.11.2026 09:20',
  atribute:ATR,criterii:CRITERII},o,{fs:['C:/Program Files/','C:/Users/Public/','C:/Users/Elev/Desktop/','C:/Users/Elev/Downloads/'].concat(o.fs||[])});
/* soluțiile „Arată-mi răspunsul”: după tip și după subiect (doar fișierele atelierului) */
const muta=(lista,folder)=>[['cut',lista],['cd',AM+folder+'/'],['paste'],['cd',AM]];
const DUPA_TIP=[['nou','Imagini'],['nou','Sunete'],['nou','Filme'],['nou','Documente']]
  .concat(muta(deTip('Imagini'),'Imagini'),muta(deTip('Sunete'),'Sunete'),muta(deTip('Filme'),'Filme'),muta(deTip('Documente'),'Documente'));
const DUPA_SUBIECT=[['nou','Excursia la Bicaz'],['nou','Serbarea de Crăciun'],['nou','Ziua mea'],['nou','Teme']]
  .concat(muta(deSubiect('Excursia'),'Excursia la Bicaz'),muta(deSubiect('Serbarea'),'Serbarea de Crăciun'),muta(deSubiect('Ziua mea'),'Ziua mea'),muta(deSubiect('Teme'),'Teme'));

const SCHEMA=`<div class="schema" role="img" aria-label="Schema lecției: criteriul, Ctrl și clic, folderele cu nume bune, planul, lista de control, două soluții">
  <div class="sc-box"><b>Criteriul</b><span>regula: după tip, subiect sau dată</span></div>
  <div class="sc-box"><b>Ctrl + clic</b><span>mai multe fișiere deodată</span></div>
  <div class="sc-box"><b>Foldere</b><span>nume care spun ce e în ele; un criteriu pe nivel</span></div>
  <div class="sc-box"><b>Planul</b><span>criteriul, folderele, mutarea pe grupe, verificarea</span></div>
  <div class="sc-box"><b>Lista de control</b><span>nimic rătăcit, nume bune, un singur fel, nimic pierdut</span></div>
  <div class="sc-box"><b>Două soluții</b><span>copia folderului; alegi după ce cauți des</span></div>
</div>`;
const LISTA=`<ul class="lista-control"><li>În folderul mare sunt doar foldere: niciun fișier pe dinafară.</li><li>Fiecare folder are un nume care spune ce e în el.</li><li>În fiecare folder, fișiere de un singur fel, după criteriul tău.</li><li>Niciun folder nu e gol.</li><li>Același număr de fișiere ca la început: nimic pierdut.</li></ul>`;

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă) = fișa de aplicație.
   Fără profesor, fără descărcări. Elevul își face singur dezordinea din fișiere care sunt pe orice Windows (doar COPIATE din
   C:\Windows\Media și C:\Windows\Web), lucrează DOAR în folderul lui, iar la final îl șterge (ajunge în Coș) și NU golește
   Coșul: calculatorul rămâne cum l-a găsit (regulile 23 și 25, surse.md). */
/* Reparațiile J1: Windows 10 (Pornire, Folder nou), căsuțe de bifat și „Vezi:” ca la lecția 10; Anulare la „Acces refuzat”;
   sunetele în trei tranșe (Alarm, Ring, cele 4 scurte), cu derularea fără rotiță cât ții Ctrl; fără img0 (un drum mai puțin:
   24 de sunete + 6 imagini = 30); „după dată” nu merge aici (toate fișierele au aceeași dată); soluția 2 după subiect, fără
   amestec de criterii; comparația întreabă de „toate sunetele” (după subiect, imaginile stau tot într-un singur folder). */
/* Reparațiile J2 (12.10.2026, _verificare\registru_j1.md, „Judecata 2”): J2-M2 — laboratorul scurtat (723 → sub 500 de

   profesorului: „Se compară două soluții diferite”). J2-m2 — „Vezi:” de la punctul 6 ține cont de Proba - Copie. */
/* Reparațiile J3 (12.10.2026, registrul, „Judecata 3”): J3-M2 — gesturile de la pași care se repetau aici (folderul Ex +
   Proba, Sunete în Proba, folderul gol șters, copia Probei) nu se mai fac de două ori: la pași rămâne doar Ctrl + clic
   (pasul 3), deci punctul 2 face folderul de la zero, iar „Vezi:” de la punctul 6 nu mai pomenește de Proba. */
const LABORATOR=[
  'Lucrezi <b>doar în folderul tău</b>, din Documente; din folderele lui Windows (Media, Web) doar <b>copiezi</b>. Apare fereastra „Acces refuzat”? Apasă <b>Anulare</b> (ai ales Decupare sau ai lipit acolo), alege din nou fișierele, <b>Copiere</b>, și lipește în folderul tău.',
  'Explorer, <b>Documente</b>. Fă-ți folderul de lucru: <b>Nou</b>, apoi <b>Folder</b> (pe Windows 10: <b>Pornire</b>, apoi <b>Folder nou</b>); scrie <b>Ex</b>, numele și prenumele, <kbd>Enter</kbd> (există deja? adaugă o cifră). În el fă folderul <b>Amestec</b>. <i>Vezi:</i> în folderul tău e Amestec.',
  'Dezordinea, tranșa 1: Media (Acest PC, Disc local (C:), Windows, Media). Clic pe <b>Alarm01</b>, <kbd>Ctrl</kbd> + clic pe Alarm02 … <b>Alarm10</b>. <i>Vezi:</i> jos scrie 10 elemente selectate. <b>Copiere</b>; folderul tău, Amestec, <b>Lipire</b>. Ai dat un clic fără Ctrl? Reia de la Alarm01.',
  'Tranșa 2: <b>Înapoi</b>, până în Media. Clic pe <b>Ring01</b>, <kbd>Ctrl</kbd> + clic pe Ring02 … <b>Ring10</b>. Ca să derulezi, dă drumul la Ctrl (rămân alese); cu Ctrl ținut, rotița schimbă mărimea pictogramelor. <i>Vezi:</i> 10 elemente selectate. <b>Copiere</b>; în Amestec, <b>Lipire</b>. Tranșa 3, la fel: <b>chimes</b>, <b>chord</b>, <b>ding</b>, <b>tada</b> (lipsește unul? altul).',
  'Tranșa 4: Acest PC, Disc local (C:), Windows, <b>Web</b>, <b>Screen</b>. Clic pe prima imagine, <kbd>Ctrl</kbd> + clic pe celelalte, <b>Copiere</b>; în Amestec, <b>Lipire</b>. La „Înlocuire sau omitere fișiere”, alege <b>Se omit aceste fișiere</b>. <i>Vezi:</i> jos, în jur de 30 de elemente. Scrie numărul în caiet.',
  'Copia pentru soluția 2: <b>Înapoi</b>, în folderul tău; clic pe <b>Amestec</b>, <b>Copiere</b>, <b>Lipire</b>. Cu <kbd>F2</kbd>, Amestec devine <b>Solutia 1</b>, iar Amestec - Copie, <b>Solutia 2</b> (fără diacritice). <i>Vezi:</i> în folderul tău sunt Solutia 1 și Solutia 2.',
  'Soluția 1, în <b>Solutia 1</b>: toate fișierele au <b>aceeași dată</b>, deci după dată nu merge. Alege <b>după tip</b> (sunete, imagini) sau <b>după subiect</b>: la ce folosesc (alarmă, sonerie, semnal, fundal). Nu vezi coloana Tip? Uită-te la pictograme. Scrie în caiet: „Soluția 1: după …, pentru că …”.',
  'Fă folderele, cu nume bune, și mută fișierele pe grupe: <kbd>Ctrl</kbd> + clic, <b>Decupare</b>, dublu-clic pe folder, <b>Lipire</b>, <b>Înapoi</b>. <i>Vezi:</i> în Solutia 1 sunt doar foldere.',
  `Verifică Soluția 1 cu lista de control.<details class="verif"><summary>Lista de control</summary>${LISTA} Numărul: adună ce scrie jos în fiecare folder.</details>`,
  '<b>Dacă mai ai timp</b>, soluția 2: în <b>Solutia 2</b>, după celălalt criteriu. Soluția 1 a fost după tip? Acum după subiect: <b>Alarme</b>, <b>Sonerii</b>, <b>Semnale</b> (chimes, chord, ding, tada), <b>Fundaluri</b>. Altfel, după tip. Verific-o cu lista.',
  'Compară în caiet două soluții: ale tale sau, dacă n-ai ajuns la a doua, ale Anei (pasul 6). 1) În care găsești mai repede toate sunetele? 2) Ce criteriu ai alege acasă, și de ce?',
  'Lasă calculatorul cum l-ai găsit: în Documente, clic pe <b>folderul tău</b>, <kbd>Delete</kbd>; dacă Windows întreabă, apasă <b>Da</b>. <i>Vezi:</i> folderul tău nu mai e în Documente. <b>Nu goli Coșul</b>: acolo pot fi fișierele colegilor. Închide Explorer cu X.'
];
const LAB_BIFE=LABORATOR.map((x,i)=>`<label class="bifez"><input type="checkbox" aria-label="Am făcut punctul ${i+1}"></label>${x}`);

JocMotor.porneste({
  cheie:'lectie_v_m2_l11',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 11”, pasul „Acum la calculatorul din laborator” înainte de verificare

  competente:['CS.1.2'], lectii:'11',
  ancoraText:'Din programă (CS.1.2, unitatea V-U2, lecția 11): Organizarea datelor pe suport extern; Operații cu fișiere și directoare',
  intro:`<p>Azi faci ordine în fișiere, cu operațiile din lecția 10. Un singur gest e nou: Ctrl + clic, ca să alegi mai multe fișiere deodată. Exersezi întâi în Explorer-ul din pagină, cu fișierele Anei. Partea principală e la calculatorul din laborator: ordonezi un folder cu 30 de fișiere amestecate.</p>
<p><b>Ai nevoie de:</b> lecția 10 — folder nou (Nou, apoi Folder), redenumirea (F2), Copiere, Decupare, Lipire, fereastra „Înlocuire sau omitere fișiere”, Coșul, săgeata Înapoi, folderul tău „Ex” din Documente; lecția 9 — fișierul (extensie, tip, pictogramă), folderul, arborele, Explorer (clic, dublu-clic, panoul din stânga, Acest PC), coloanele Tip și Data modificării, <code>C:\\Windows\\Media</code>; lecția 8 — fereastra.</p>`,
  /* J3-M2 (12.10.2026, decizia 2 a dirijorului): la pași rămâne un singur gest real (pasul 3, Ctrl + clic), restul se fac în
     laborator; ceasul: după 20 de minute din oră, la laborator, chiar dacă atelierul nu e gata; întrebările merg și acasă */
  cum:`<b>Cum lucrezi</b><ol><li>6 pași scurți, cu exerciții mici, fără puncte.</li><li>La atelier faci ordine în 16 fișiere, în Explorer-ul din pagină.</li><li>Acum la calculatorul din laborator: partea principală, cam 25 de minute. Au trecut 20 de minute din oră? Treci la ea, chiar dacă n-ai terminat.</li><li>5 întrebări de verificare, pentru stele; le poți face și acasă.</li></ol>`,
  banda:'<span class="dos" aria-hidden="true"></span><span class="et">după tip</span><span class="dos" aria-hidden="true"></span><span class="et">după subiect</span><span class="dos" aria-hidden="true"></span><span class="et">după dată</span>',
  nivele:[
{t:'Îmi organizez resursele digitale personale (aplicație practică)',final:true,lectii:[11],

 obiectiv:'faci ordine într-un folder cu fișiere amestecate, după un criteriu ales și argumentat de tine, și compari două soluții.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  /* J2-M2 (12.10.2026): toți pașii scurtați — explicațiile repetate, „altfel”-urile și indiciile; gesturile au rămas */
  {t:'La ce folosește: găsești repede ce e al tău',
   text:`<p>Într-o grămadă de piese amestecate cauți mult o piesă anume. În cutii cu etichete o găsești imediat. Alt copil le pune pe forme: și așa e ordine.</p>
<p>La fel în calculator: pozele, cântecele și temele se strâng repede într-un folder. Azi le pui în ordine: alegi o regulă, faci foldere și muți fișierele în ele.</p>
${IMG.piese}${IMG.cutii}`},
  /* ---- pasul 1: criteriul ---- */
  {t:'Criteriul: regula după care așezi fișierele',
   text:`<p>Un <mark>criteriu de organizare</mark> este regula după care hotărăști în ce folder merge fiecare fișier. Fiecare grupă primește un folder. Trei criterii folosite des:</p>
<ul><li><b>după tip</b>: imagine, sunet, film, document. Îl vezi după pictogramă, în coloana Tip sau după extensie;</li>
<li><b>după subiect</b>: despre ce e (excursia, serbarea, temele);</li>
<li><b>după dată</b>: anul sau luna, din coloana Data modificării (ziua în care fișierul a fost schimbat ultima oară).</li></ul>
<p>Folderele așezate unul lângă altul urmează un singur criteriu.</p>`,
   exemplu:`<p>Aceleași patru fișiere, ordonate în două feluri:</p><div class="doua"><div><b>După tip</b><pre class="arbore">Imagini
  bicaz 1
  tort
Sunete
  colind
Documente
  compunere toamna</pre></div><div><b>După subiect</b><pre class="arbore">Excursia
  bicaz 1
Ziua mea
  tort
Serbarea
  colind
Teme
  compunere toamna</pre></div></div>`,
   altfel:`<p>La bibliotecă, cărțile stau după fel (povești, poezii) sau după autor: o singură regulă pe toate rafturile.</p>`,
   incearca:{t:'classify',q:'Criteriul Anei este <b>după tip</b>. În ce folder pune fiecare fișier? Aici extensiile se văd.',cats:['Imagini','Sunete','Documente'],
    items:[['munte.jpg',0],['desen pisica.png',0],['colind.mp3',1],['vocea mea.wav',1],['tema romana.docx',2],['referat apa.docx',2]],
    ajutor:'Extensia, de după punct, spune tipul (lecția 9).',
    why:'Tipul se vede după extensie: .jpg și .png sunt imagini, .mp3 și .wav sunt sunete, .docx e document.'},
   inca:[
    {t:'choice',q:'Dan face trei foldere pentru pozele lui: <em>Excursia</em>, <em>Serbarea</em>, <em>Ziua mea</em>. Ce criteriu a ales?',o:['După subiect','După tip','După dată','După mărime'],ok:0,
     ajutor:'Numele folderelor spun despre ce sunt pozele.',why:'Toate sunt poze, deci nu le-a despărțit după tip. Le-a despărțit după ce s-a întâmplat: după subiect.'}
   ]},
  /* ---- pasul 2: Ctrl + clic (singurul gest nou) ---- */
  {t:'Mai multe fișiere deodată: Ctrl + clic',
   text:`<p>Ca să muți zece fișiere, nu le iei pe rând: le <mark>selectezi pe toate</mark>, apoi faci o singură Decupare și o singură Lipire.</p>
<p>Un clic pe primul fișier. Apoi ții apăsată tasta <kbd>Ctrl</kbd>, jos în stânga, și dai câte un clic pe celelalte. Toate rămân colorate. Jos, în Explorer, scrie de obicei câte ai ales: <em>3 elemente selectate</em>.</p>
<p>Unul e greșit? Tot cu <kbd>Ctrl</kbd>, un clic pe el: iese din selecție. Un clic fără Ctrl alege doar fișierul acela.</p>
${IMG.ctrl}`,
   exemplu:`<p>Lipești mai multe fișiere unde unele au deja același nume? Apare aceeași fereastră ca în lecția 10, dar pentru mai multe fișiere. Alegi <b>Se omit aceste fișiere</b>: celelalte se lipesc, iar cele de acolo rămân neatinse. Enter ar înlocui.</p>${IMG.conflict}`,
   altfel:`<p>Ca atunci când duci mai multe caiete odată la dulap, nu câte unul.</p>`,
   incearca:OG({q:'Ești în <code>C:\\Windows\\Media</code>. Copiază <b>deodată</b> Alarm01, Alarm02 și Ring01 în folderul <b>Proba</b>, din folderul tău. Pe telefon: atinge numele lui Alarm01, apoi căsuța din stânga lui Alarm02 și a lui Ring01.',start:MEDIA,fs:MEDIA_FS.concat([PROBA]),
    checks:[{toate:[{are:PROBA+'Alarm01.wav'},{are:PROBA+'Alarm02.wav'},{are:PROBA+'Ring01.wav'}],ce:'În Proba sunt Alarm01, Alarm02 și Ring01'},
     {grupMinim:3,ce:'Le-ai lipit pe toate trei deodată, după Ctrl + clic'},
     {nu:PROBA+'Ring02.wav',ce:'Ring02 nu a intrat (nu era cerut)'}],
    solutie:[['copy',['Alarm01.wav','Alarm02.wav','Ring01.wav']],['cd',PROBA],['paste']],gresit:[['copy','Alarm01.wav'],['cd',PROBA],['paste']],
    ajutor:'Clic, Ctrl + clic, Ctrl + clic, Copiere; apoi Documente, Ex Pop Ana, Proba, Lipire.',
    why:'Trei sunete, o singură Copiere și o singură Lipire. <div class="lacalc"><b>Acum, dacă ești la calculatorul din laborator:</b> deschide Media (Acest PC, Disc local (C:), Windows, Media). Clic pe Alarm01, <kbd>Ctrl</kbd> + clic pe Alarm02 și Ring01. Derulezi? Dă drumul la Ctrl (rămân alese); cu Ctrl ținut, rotița schimbă mărimea pictogramelor. Jos scrie 3 elemente selectate. <kbd>Ctrl</kbd> + clic din nou pe Ring01: iese din selecție. Un clic pe Ring02, fără Ctrl: rămâne ales doar el. Deocamdată doar alegi; copiezi în laborator.</div>'}),
   inca:[
    {t:'choice',q:'Ai selectat cu Ctrl + clic Alarm01, Alarm02 și Ring01. Dai un clic pe Ring02, <b>fără</b> Ctrl. Ce rămâne selectat?',o:['Doar Ring02','Toate patru','Doar Alarm01, Alarm02 și Ring01','Nimic'],ok:0,
     ajutor:'Recitește ultima propoziție a pasului.',why:'Un clic fără Ctrl alege doar fișierul pe care ai dat clic: celelalte se deselectează.'}
   ]},
  /* ---- pasul 3: foldere cu nume bune, pe niveluri ---- */
  {t:'Folderele: nume bune, pe niveluri',
   text:`<p>Fiecare grupă primește un folder cu un nume care spune ce e înăuntru: <em>Imagini</em>, <em>Excursia la Bicaz</em>, <em>Teme</em>. Nu lași <em>Folder nou</em> și nu scrii <em>diverse</em>: nu spun nimic.</p>
<p>Folderele pot sta pe <mark>niveluri</mark>, ca ramurile arborelui din lecția 9: în <em>Imagini</em> poți face <em>Excursia</em> și <em>Serbarea</em>. Pe fiecare nivel, un singur criteriu.</p>
<p>Numele să fie scurte, scrise la fel, fără semnele interzise din lecția 9.</p>`,
   exemplu:`<p>Pe primul nivel, criteriul e tipul. În Imagini, pe al doilea nivel, criteriul e subiectul:</p><pre class="arbore">Amestec
  Documente
  Imagini
    Excursia
    Serbarea
  Sunete</pre>`,
   altfel:`<p>Ca un dulap cu sertare: în sertarul cu haine, cutii mai mici pentru șosete și fulare.</p>`,
   incearca:OG({q:'În Amestec sunt două foldere cu nume care nu spun nimic: <em>Folder nou</em> și <em>aaa</em>. Intră în fiecare, vezi ce fișiere are și redenumește-le: unul <b>Imagini</b>, celălalt <b>Sunete</b>.',start:AM,
    fs:fsAna(AM+'Folder nou/',['tort.jpg','barajul.jpg']).concat(fsAna(AM+'aaa/',['colind.mp3','la multi ani.mp3'])),
    checks:[{are:AM+'Imagini/tort.jpg',ce:'Folderul cu poze se numește <b>Imagini</b>'},{are:AM+'Sunete/colind.mp3',ce:'Folderul cu sunete se numește <b>Sunete</b>'},
     {numeBune:AM,ce:'Niciun folder nu mai are un nume care nu spune nimic'}],
    solutie:[['ren','Folder nou','Imagini'],['ren','aaa','Sunete']],gresit:[['ren','Folder nou','Sunete'],['ren','aaa','Imagini']],
    ajutor:'Dublu-clic pe folder: ce pictograme vezi? Înapoi, clic pe folder, F2, numele, Enter.',
    why:'Acum numele spun ce e în foldere.'}),
   inca:[
    {t:'classify',q:'Ce nume de folder spune ce e în el?',cats:['Nume bun','Nu spune nimic'],
     items:[['Excursia la Bicaz',0],['Teme de română',0],['Imagini',0],['Folder nou',1],['diverse',1],['aaa',1]],
     ajutor:'Un nume bun te lasă să ghicești ce e în folder fără să-l deschizi.',why:'Excursia la Bicaz, Teme de română și Imagini spun ce e înăuntru. Folder nou, diverse și aaa nu spun nimic.'}
   ]},
  /* ---- pasul 4: planul și lista de control ---- */
  {t:'Planul în 4 pași și lista de control',
   text:`<p>Ordinea într-un folder plin se face după un plan:</p>
<ol><li>Alegi criteriul și îl scrii în caiet.</li><li>Faci câte un folder pentru fiecare grupă, cu nume bun.</li><li>Pentru fiecare grupă: Ctrl + clic pe fișierele ei, Decupare, dublu-clic pe folder, Lipire, Înapoi.</li><li>Verifici cu lista de control:</li></ol>
${LISTA}`,
   exemplu:`<p>Dan are 3 fișiere de la excursie și 3 de la serbare. Alege criteriul după subiect și face folderele Excursia și Serbarea. Clic pe primul de la excursie, Ctrl + clic pe celelalte două, Decupare, dublu-clic pe Excursia, Lipire, Înapoi. La fel cu serbarea.</p>`,
   altfel:`<p>Ca la ghiozdan: hotărăști ce merge în fiecare buzunar, pui lucrurile, apoi verifici că n-a rămas nimic pe bancă.</p>`,
   incearca:OG({q:'Fă ordine în Amestec după tip: folderele <b>Imagini</b> și <b>Sunete</b>; mută fiecare grupă deodată. Sub teste vezi ce observ în ordinea ta.',start:AM,analiza:AM,
    fs:fsAna(AM,['bicaz 1.jpg','tort.jpg','desen planete.png','serbare 1.jpg','colind.mp3','la multi ani.mp3','cantec excursie.mp3','pronuntie engleza.mp3']),
    checks:[{faraRataciti:AM,ce:'În Amestec nu a rămas niciun fișier pe dinafară'},{organizat:AM,criterii:['tip'],ce:'Imaginile sunt împreună, sunetele împreună, în foldere cu nume bune'},
     {total:AM,n:8,ce:'Toate cele 8 fișiere sunt încă în Amestec, în foldere'},{grupMinim:4,ce:'Ai mutat cel puțin o dată 4 fișiere deodată'}],
    /* exemplul pasului (Dan, 6 fișiere, după subiect) NU e exercițiul (J1, sonnet M5): aici 8 fișiere ale Anei, după tip */
    solutie:[['nou','Imagini'],['nou','Sunete'],['cut',['bicaz 1.jpg','tort.jpg','desen planete.png','serbare 1.jpg']],['cd',AM+'Imagini/'],['paste'],['cd',AM],['cut',['colind.mp3','la multi ani.mp3','cantec excursie.mp3','pronuntie engleza.mp3']],['cd',AM+'Sunete/'],['paste']],
    gresit:[['nou','Imagini'],['nou','Sunete'],['cut',['bicaz 1.jpg','tort.jpg','desen planete.png','serbare 1.jpg']],['cd',AM+'Imagini/'],['paste']],
    ajutor:'Cele două foldere; apoi, pe grupe: Ctrl + clic, Decupare, dublu-clic pe folder, Lipire, Înapoi.',
    why:'Folderul mare are acum doar foldere, iar fiecare folder are un singur fel de fișiere.'}),
   inca:[
    {t:'tf',q:'Dan a terminat: în Amestec sunt folderele Imagini și Sunete, plus fișierul <em>tort</em>, rămas pe dinafară. Ordinea lui trece lista de control.',ok:false,
     ajutor:'Citește primul punct din lista de control.',why:'Fals. Primul punct cere ca în folderul mare să fie doar foldere. Tort trebuie mutat în Imagini.'}
   ]},
  /* ---- pasul 5: două soluții + ce am învățat ---- */
  /* J1 m5: copia folderului are acum exercițiul ei în simulator (Încearcă); alegerea și argumentul sunt la „Încă un exercițiu” */
  {t:'Două soluții: copia folderului, apoi alegi',
   text:`<p>Același amestec se poate ordona bine în mai multe feluri. Ca să compari două soluții, faci întâi o copie a folderului, chiar lângă el: clic pe folder, <b>Copiere</b>, <b>Lipire</b>. Apare <em>Amestec - Copie</em>, cu tot ce era în el. Ordonezi fiecare după alt criteriu.</p>
<p>Apoi alegi soluția care te ajută la ce cauți cel mai des și o <mark>argumentezi</mark>, adică spui de ce: „Am ales după subiect, ca să găsesc repede tot ce am de la o întâmplare.”</p>`,
   exemplu:`<div class="doua"><div><b>Amestec, după tip</b><pre class="arbore">Imagini

<p><b>Ce am învățat, pe scurt:</b></p>${SCHEMA}<p>Lecția 12 e evaluarea unității.</p>`,
   altfel:`<p>Doi colegi își aranjează cărțile: unul pe materii, altul pe mărimi. Amândoi au ordine.</p>`,
   incearca:OG({q:'Ești în <b>Ex Pop Ana</b>. Fă o copie a folderului <b>Amestec</b>, chiar lângă el.',start:EX,

    {t:'choice',q:'Care e un argument bun pentru criteriul după tip?',o:['Așa găsesc repede toate pozele pentru afiș','Așa mi-a venit, fără un motiv anume','Pentru că folderele arată mai frumos','Pentru că am foarte multe fișiere'],ok:0,
     ajutor:'Un argument spune ce vei căuta mai ușor.',why:'Argumentul bun spune la ce te ajută ordinea: aici, să găsești toate pozele într-un loc.'}

 atelier:OG({titlu:'Atelier: ordine în fișierele Anei',
  intro:`<p><strong>Sarcina:</strong> în <b>Amestec</b>, din Ex Pop Ana, sunt 16 fișiere ale Anei, amestecate.</p>
<ol><li>Uită-te la pictograme și la coloanele Tip și Data modificării (pe telefon, data e sub nume).</li>
<li>Alege un criteriu și scrie-l în caiet, cu argumentul: „După …, pentru că …”.</li>
<li>Fă folderele, cu nume bune. După dată, numele pot fi anii (2025, 2026) sau lunile (Martie, Mai…).</li>
<li>Mută fișierele pe grupe: Ctrl + clic, Decupare, dublu-clic pe folder, Lipire, Înapoi.</li>
<li>Citește testele și rândul „Ce văd în ordinea ta”, apoi apasă <b>Verifică</b>.</li></ol>
<p>Criteriul îl alegi tu; pe un nivel, unul singur. „Încă un exercițiu” e a doua soluție, pentru cine termină repede. Au trecut 20 de minute din oră? Apasă jos <b>Acum la calculatorul din laborator</b>.</p>`,
  q:'Ordine în 16 fișiere, după un criteriu ales de tine.',
  start:AM,analiza:AM,fs:fsAna(AM,ATELIER),
  checks:[
   {faraRataciti:AM,ce:'În Amestec nu a rămas niciun fișier pe dinafară: doar foldere'},
   {numeBune:AM,ce:'Fiecare folder are un nume care spune ce e în el (nu „Folder nou”)'},
   {organizat:AM,ce:'Fiecare folder are doar fișiere de același fel, după un singur criteriu'},

  why:'Ai făcut ordine în 16 fișiere: un criteriu, foldere cu nume bune, mutare pe grupe, nimic pierdut. Același lucru îl faci acum la calculatorul din laborator, cu 30 de fișiere.',

    why:'Acum ai două soluții bune pentru același amestec. Una te ajută să găsești toate pozele, cealaltă tot ce ține de o întâmplare.'})
  ]}),

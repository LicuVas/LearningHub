<script>
/* Lecția 21, clasa a V-a (M3): „Culori și stiluri de umplere. Culori personalizate” — a patra lecție din V-U4.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Simulatorul: lectii/_sim/paint.js (V/18) + paint-selectie.js (V/19), neschimbate, + extensia NOUĂ lectii/_sim/paint-culori.js
   (proprietar lecția aceasta): grupul Culori (Culoare 1 / 2, paleta, Editare culori), Umplere (umplere pe pixeli a zonei închise),
   Selector de culoare, Contur formă / Umplere formă. Tipul paintw = SimPaintCul.
   Paint (aplicație din Magazin) NU a fost pornit: faptele vin din capturile reale din jocuri/grafica-v (Paint RO), din resursele
   pachetului Paint citite ca fișier (lecția 18) și din documentația Microsoft (microsoft.com/windows/paint; Windows Insider Blog,
   30.11.2021). Ce nu e probat stă în surse.md („Nesigur”) și în capturi_lipsa.json și e scris prudent, cu un drum de rezervă.
   Activitatea profesorului (activitati_lectii_V_VI.json, V/21): recolorarea aceluiași desen în trei variante (calde, reci, două culori)
   + discuția despre contrast: casetele fac varianta caldă (salvată în laborator ca „calde”), atelierul pe cea rece (în pagină); în
   laborator, varianta rece și cea în „două culori” sunt „Dacă mai ai timp” (timpul: _proba/timp.py).
   Regula 10: casetele reiau Pensule, Dimensiune, Radiera (lăsate de V/19), Forme, Salvați ca, Ctrl+S, X, folderul și Coșul.
   Trimiterile la pași se fac după numărul din bara de jos (P1 = „La ce folosește”).
   Reparațiile după judecata 1 (24.10.2026): _verificare/registru_j1.md (literele A-X); după judecata 2 (reparația 2, 24.10.2026):
   K, Y, Z, AA, AB, în același registru. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CAPT='<small>Capturi din Paint (Windows 11); chenarele roșii sunt de la noi.</small>';
const IMG={
  creioane:fig('creioane.webp',800,533,'Creioane colorate puse în cerc, cu vârfurile spre mijloc: pe o parte roz, roșu, portocaliu și galben, pe cealaltă verde, albastru și violet','Roz, roșu, portocaliu, galben: culori <b>calde</b>. Verde, albastru, violet: culori <b>reci</b>. <small>Foto: MichaelMaggs, CC BY-SA 3.0, <a href="https://commons.wikimedia.org/wiki/File:Colouring_pencils.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.</small>'),
  culori:fig('culoare-1-2.webp',380,120,'Grupul Culori din Paint: în stânga, un cerc verde-gălbui sus și unul alb jos, încadrate; la mijloc, paleta cu două rânduri de cercuri colorate și un rând de cercuri goale, încadrată; în dreapta, cercul curcubeu cu plus, încadrat','Sus <b>Culoare 1</b> (cu inel: aleasă), jos <b>Culoare 2</b>; paleta; <b>Editare culori</b>. '+CAPT),
  umplere:fig('instrumente-umplere.webp',150,122,'Grupul Instrumente din Paint: Creion, găleata Umplere (cu fond albastru, aleasă), litera A, Radieră, pipeta și lupa; Creionul și Radiera sunt încadrate cu roșu','<b>Umplere</b>: găleata, sus, a doua (aleasă: fond albastru). <small>Chenarele roșii sunt de la noi.</small>'),
  desen:fig('desen-forme.webp',700,450,'Desen făcut în Paint din forme și colorat: cer albastru deschis, casă cu peretele galben pal și acoperișul roșu, soare galben, o fâșie de iarbă verde','Fiecare zonă închisă: un clic cu <b>Umplere</b>.'),
  pipeta:fig('pipeta.webp',140,120,'Grupul Instrumente din Paint, cu pipeta (Selector de culoare) încadrată, jos, la mijloc','<b>Selector de culoare</b> (pipeta).'),
  stil:fig('contur-umplere.webp',270,120,'Galeria Forme din Paint și, în dreapta ei, două butoane gri cu săgeată, încadrate: sus Contur formă, jos Umplere formă','<b>Contur formă</b> (sus) și <b>Umplere formă</b> (jos). Sunt gri: nu era aleasă nicio formă.'),
  editare:fig('editare-culori.webp',690,670,'Fereastra Editare culori din Paint: un pătrat cu toate culorile, un dreptunghi plin cu culoarea aleasă, o bară subțire verticală de la verde-gălbui la negru, cu un buton rotund sus, codul #B5E61D, câmpurile Roșu 181, Verde 230 și Albastru 29 încadrate, Culori de bază, Culori particularizate cu plus, butoanele OK și Anulare','<b>Editare culori</b>: pătratul colorat, dreptunghiul cu culoarea aleasă, bara luminozității, codul; încadrate, <b>Roșu</b>, <b>Verde</b>, <b>Albastru</b>.')
};
/* '!…' = punctul de la sfârșitul orei; '?…' = „Dacă mai ai timp” (nu intră în timpul obligatoriu) */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculator, în Paint-ul adevărat</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:x.startsWith('?')?`<li class="mai-ai-timp"><b>Dacă mai ai timp:</b> ${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;

/* lumea simulatorului: contul Elev din laborator, folderul de lucru al Anei e Documente › Ex Pop Ana; desenele pc_* sunt în
   PaintCulori.DESENE (lectii/_sim/paint-culori.js): casa (perete 120-380 × 330-560, acoperiș 100-400 × 190-330), ușa 220-280 × 450-560,
   copacul (coroana 545-685 × 330-470), soarele 820-940 × 60-180; în pc_casa_gaura latura din dreapta a acoperișului are o gaură de
   ~65 de unități (de la (305,241) la (352,285)); pc_atelier n-are gaură (24.10, timpul: registru_j1.md, K). */
const P=o=>Object.assign({t:'paintw'},o);
const CASA='Documente/Ex Pop Ana/casa.png';
const PERETE=[160,420],ACOPERIS=[250,290],CER=[500,40];   /* pc_cer (P4) n-are ușă (24.10, registrul M) */
/* închiderea găurii din acoperiș: o linie groasă (Pensule, Dimensiune 40) pe toată latura din dreapta, de la vârf la colț.
   Proba pe telefon (_proba/proba_gaura.py, 390 px, degetul greșind cu ±6 px): Creion de-a lungul găurii 0/16; Pensule 30 → 12/16;
   Pensule 40 → 16/16; Pensule 50 → 15/16. */
const INCHIDE=[['pensula','pensula'],['dim','pensula',40],['trage',[[250,190],[325,260],[400,330]]]];

/* ---- „Acum la calculator” (după atelier, înainte de verificare). FĂRĂ profesor, pe calculatorul comun. Casetele P2-P6 au făcut
   varianta caldă (Paint rămâne deschis); aici o salvezi cu NUME NOU („calde”, regulile 23, 26); varianta rece și cea în două culori
   sunt „Dacă mai ai timp”; apoi ordinea (Culoare 1 / 2 și Umplere formă la loc, X, folderul în Coș). Timpul: _proba/timp.py. ---- */
const LAB=[
  '<b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine PNG</b>; scrie <code>calde</code>, apoi <b>Documente</b>, dublu-clic pe folderul tău, <b>Salvare</b> (scrie că există deja? <b>Nu</b> și adaugă o cifră).',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> varianta rece (<b>Salvați ca</b>, <code>reci</code>) sau cea în două culori (<b>Salvați ca</b>, <code>doua</code>: doar două culori din paletă, peste tot). Cu <b>Umplere</b>, culorile noi peste cele vechi; clic pe bara de titlu, <kbd>Ctrl</kbd>+<kbd>S</kbd>. Care variantă se vede mai bine de departe? Aceea are contrastul mai bun.</span>',
  'Pentru colegul de după tine: negru în <b>Culoare 1</b>, alb în <b>Culoare 2</b>; <b>Forme</b> › <b>Oval</b> › <b>Umplere formă</b> › <b>Fără umplere</b>. Închide Paint cu X.',
  'Explorer (clic pe el în bara de activități): <b>Documente</b>, clic pe folderul tău, <kbd>Delete</kbd> (ajunge în Coș; <b>nu goli Coșul</b>). Un desen salvat în alt folder din greșeală: clic pe el, <kbd>Delete</kbd>. Închide Explorer. <details class="verif"><summary>Verifică-te, după ce ai terminat</summary>Ai salvat <b>calde</b>; Culoare 1 neagră, Culoare 2 albă; Paint și Explorer închise; folderul în Coș. Culorile tale din Editare culori pot rămâne în Paint: nu strică nimic.</details>'
];

JocMotor.porneste({
  cheie:'lectie_v_m3_l21',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 21”, pasul real înainte de verificare
  titlu:'Culori și stiluri de umplere. Culori personalizate',
  marca:'Lecția <b>21</b> · clasa a V-a',
  h1:'Culori și stiluri de umplere. Culori personalizate',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U4', unitateTitlu:'Editoare grafice. Fac materiale digitale',
  competente:['CS.3.1'], lectii:'21',
  ancoraText:'Din programă (CS.3.1, unitatea V-U4, lecția 21): Utilizarea culorilor în prelucrarea imaginilor; crearea culorilor personalizate; Stiluri de umplere',
  intro:`<p><b>Ai nevoie de:</b> lecțiile 19 (Pensule, Dimensiune, Radieră; Forme; <kbd>Ctrl</kbd>+<kbd>Z</kbd>), 18 (Paint: Start, <code>pai</code>; <b>Salvați ca</b> › <b>Imagine PNG</b>; <kbd>Ctrl</kbd>+<kbd>S</kbd> după un clic pe bara de titlu; X), 10 (folderul tău din Documente, <kbd>Delete</kbd>, Coșul) și 8 (bara de activități).</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>P1 de citit, apoi 5 pași, fiecare cu un exercițiu și gesturi în Paint-ul adevărat.</li><li>Atelierul: un desen în culori reci.</li><li>La calculator: salvezi, faci ordine.</li><li>5 întrebări, pentru stele.</li></ol><p><b>Se apropie sfârșitul orei?</b> Bara de jos › <b>P2</b>: ultimul punct din casetă.</p>`,
  banda:'<span class="bd-t">calde - Paint</span><span class="bd-c" aria-hidden="true"><i style="background:#ed1c24"></i><i style="background:#ff7f27"></i><i style="background:#fff200"></i><i style="background:#22b14c"></i><i style="background:#00a2e8"></i><i style="background:#a349a4"></i></span><span class="bd-z">Culoare 1 · Culoare 2</span>',
  nivele:[
{t:'Culori și stiluri de umplere. Culori personalizate',final:true,lectii:[21],
 continuturi:['Utilizarea culorilor în prelucrarea imaginilor; crearea culorilor personalizate','Stiluri de umplere'],
 obiectiv:'alegi Culoare 1 și Culoare 2 din paletă, colorezi zone închise cu Umplere, iei o culoare din desen cu Selector de culoare, dai formelor contur și umplere și îți faci o culoare a ta în Editare culori.',
 pasi:[
  /* ---- pasul 1: la ce folosește (fără acțiuni): culori calde / reci, contrastul (activitatea profesorului) ---- */
  {t:'La ce folosește: culorile spun ceva',
   text:`<p>Același desen spune altceva, după culorile lui:</p>
<ul><li><mark>culorile calde</mark> (roșu, portocaliu, galben) amintesc de foc și de soare: desenul pare vesel;</li><li><mark>culorile reci</mark> (albastru, verde, violet) amintesc de apă și de gheață: desenul pare liniștit.</li></ul>
<p>Contează și <mark>contrastul</mark>: o culoare închisă lângă una deschisă se vede de departe. Galben pe alb abia se vede; negru pe galben, foarte bine.</p>
${IMG.creioane}`},
  /* ---- pasul 2: grupul Culori — Culoare 1 / Culoare 2 (captura culoare-1-2), paleta; Pensule, Dimensiune, Radieră reluate (regula 10).
     Culoare 2 pentru interiorul formelor la Umplere solidă: PRESUPUS (L4), deci „de obicei” și drumul de rezervă la P5 (registrul: B, C) ---- */
  {t:'Culoare 1, Culoare 2 și paleta',
   text:`<p>În grupul <b>Culori</b> sunt două cercuri:</p>
<ul><li>sus, <mark>Culoare 1</mark>: cu ea desenezi și colorezi aproape tot (Creion, Pensule, marginea formelor);</li><li>jos, <mark>Culoare 2</mark>: de obicei, pentru interiorul unor forme (la P5).</li></ul>
<p>Cercul ales are un inel în jur. Un clic pe o culoare din <mark>paletă</mark> o pune în cercul ales. Vrei Culoare 2? Clic pe cercul de jos, apoi pe culoare; după aceea, clic iar pe cercul de sus. Ecran îngust? Întâi clic pe <b>Culori</b> (pe telefon, în pagină: trage bara cu instrumente spre stânga).</p>
${IMG.culori}`,
   exemplu:`${ACUM('Fă-ți folderul (lecția 10): Explorer, <b>Documente</b>, <b>Nou</b> › <b>Folder</b> (Windows 10: <b>Pornire</b> › <b>Folder nou</b>), scrie Ex, numele și prenumele tău (<code>Ex Pop Ana</code>), <kbd>Enter</kbd>; dacă există, adaugă o cifră. Apoi <b>Minimizare</b>.','Pornește Paint (Start, <code>pai</code>). Roșu în <b>Culoare 1</b>; <b>Pensule</b> › ⌄ › <b>Marker</b>: o linie cu <b>Dimensiune</b> mare, apoi una cu Dimensiune mică. <b>Radieră</b> peste o bucată.','!<b>La sfârșitul orei</b> (chiar dacă n-ai terminat), nu acum: revii aici (<b>P2</b>). Paint: negru în <b>Culoare 1</b>, alb în <b>Culoare 2</b>; dacă ai ajuns la P5, <b>Forme</b> › <b>Oval</b> › <b>Umplere formă</b> › <b>Fără umplere</b>; X (<b>Nu salvați</b>). Explorer: <b>Documente</b>, folderul tău, <kbd>Delete</kbd>. Nu goli Coșul.')}`,
   altfel:`<p>E ca la ora de desen cu două pensule: cu una faci aproape tot (Culoare 1); pe cealaltă o păstrezi pentru interiorul unor forme (Culoare 2). Paleta e cutia cu acuarele: întâi iei pensula (cercul), apoi o înmoi în culoare.</p>`,
   incearca:P({q:'Pune roșu în <b>Culoare 1</b>, apoi trage o linie lungă cu <b>Pensule</b>.',start:{desen:'gol',unealta:'creion'},
    checks:[{k:'culoare',nr:1,fam:'rosu',ce:'Culoare 1 e roșu',msg:'Butonul Culori (sau grupul Culori): clic pe cercul Culoare 1, apoi pe roșu.'},
     {k:'linieCul',fam:'rosu',ce:'Pe pânză e o linie roșie de Pensule',msg:'Alege Pensule (grupul Pensule), apoi trage o linie lungă pe pânză.'}],
    sol:[['culoare','#ed1c24',1],['unealta','pensula'],['trage',[[200,320],[500,322],[820,330]]]],
    gresit:[['unealta','pensula'],['trage',[[200,320],[500,322],[820,330]]]],
    ajutor:'Întâi culoarea: Culori › cercul Culoare 1 › roșu. Apoi Pensule și o linie pe pânză.',
    why:'Linia a ieșit roșie, pentru că Pensulele desenează cu Culoare 1.'}),
   inca:[
    P({q:'Pune galben în <b>Culoare 2</b>. În <b>Culoare 1</b> trebuie să rămână negru.',start:{desen:'gol',unealta:'creion'},
     checks:[{k:'culoare',nr:2,fam:'galben',ce:'Culoare 2 e galben',msg:'Clic pe cercul de jos (Culoare 2), apoi pe galben.'},{k:'culoare',nr:1,hex:'#000000',ce:'Culoare 1 a rămas negru',msg:'Ai schimbat Culoare 1. Clic pe cercul de sus, apoi pe negru; apoi clic pe cercul de jos și pe galben.'}],
     sol:[['activ',2],['culoare','#fff200']],gresit:[['culoare','#fff200']],
     ajutor:'Întâi clic pe cercul de jos (Culoare 2), abia apoi pe galben.',why:'Culoarea din paletă a mers în cercul ales, Culoare 2. Culoare 1 a rămas neagră.'}),
    {t:'choice',q:'Scrii un titlu pe o foaie albă. Ce culoare a literelor se vede cel mai greu de departe?',o:['Galben deschis','Negru','Albastru închis','Roșu închis'],ok:0,
     ajutor:'Contrastul: o culoare închisă lângă una deschisă se vede bine.',why:'Galbenul deschis e tot o culoare deschisă, ca albul: contrastul e slab. Negru, albastru închis și roșu închis sunt culori închise, deci se văd bine pe alb.'}
   ]},
  /* ---- pasul 3: Umplere (găleata) — zona închisă; gaura → culoarea „curge” (microsoft.com/windows/paint: „fill closed areas”).
     Caseta: Umplere ÎNTÂI, apoi culoarea (soarele abia desenat nu-și mai schimbă conturul; L10); gaura în Paint-ul real = „Dacă mai ai
     timp” (registrul: N) ---- */
  {t:'Umplere: găleata colorează o zonă închisă',
   text:`<p><mark>Umplere</mark> (găleata, în grupul Instrumente) colorează dintr-un clic o zonă: o umple cu <b>Culoare 1</b> până dă de margini.</p>
<p>Merge doar într-o <mark>zonă închisă</mark>: una fără nicio gaură în margine. Dacă are o gaură, culoarea „curge” prin ea și umple tot ce e afară, de exemplu cerul.</p>
<p>Culoarea a curs? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (sau săgeata ↶ de sus), închizi gaura cu o linie groasă (Pensule, Dimensiune mare) pe toată latura cu gaura, apoi umpli din nou.</p>
${IMG.umplere}`,
   exemplu:`${IMG.desen}

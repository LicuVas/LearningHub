<style>

/* tema: bara unui browser cu o pagină verificată — fila, adresa și cele trei întrebări */
.banda{display:flex;align-items:center;gap:8px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent)}
.banda .bd-tab{flex:none;font-size:.76rem;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;padding:2px 10px}
.banda .bd-adr{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.78rem;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 11px}
.banda .bd-adr b{color:var(--ink);font-weight:700}
.banda .bd-q{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.76rem;font-weight:700;color:var(--accent);background:var(--paper);border:1.5px solid var(--accent);border-radius:999px;padding:2px 11px}

.fals-ex b.t{display:block;color:#B00020;font-size:1.02rem}

.fals-ex .b{display:inline-block;margin-top:5px;background:#C8102E;color:#fff;border-radius:7px;padding:3px 14px;font-weight:800}

<script>
/* Lecția 16, clasa a V-a (M3): „Siguranța pe Internet: pericole, reguli, credibilitatea surselor” (predare + consolidare).
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Documentele profesorului: activitatea orei (trei pagini: una serioasă, una reclamă deghizată, una falsă; regulile clasei)
   și fișa de pregătire „Evaluarea surselor. Motor de căutare vs. autor” (orașul cu biblioteci și afișe pe stâlp; motorul e
   ghidul, nu autorul; ordinea rezultatelor nu e ordinea adevărului; cine scrie? când? de unde știe?).
   Simulatorul: lectii/_sim/browser-siguranta.js (extensie NOUĂ, proprietar lecția aceasta) peste browser-web.js (V/14, nemodificat).
   Faptele despre Edge: documentația oficială Microsoft în română + șirurile din resursele Edge (ro.pak, citite ca fișier, fără
   să pornim Edge) + capturile lecțiilor 14-15. Procedura cu fereastra falsă e cea a lecției VI/11 (aceeași regulă, mai devreme).
   Toate gesturile reale se fac într-o FILĂ NOUĂ (lecția rămâne în fila ei); nimic descărcat, niciun cont, nimic tastat în pagini. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  stalp:fig('stalp-afise.webp',800,600,'Un stâlp rotund pentru afișe, într-un parc, cu afișe lipite și rupte, unele peste altele','Un stâlp cu afișe: oricine lipește ce vrea, iar nimeni nu verifică ce scrie pe ele. <small>Foto: Profpcde, <a href="https://commons.wikimedia.org/wiki/File:Advertising_column_with_torn_up_posters.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC0 (domeniu public); micșorată.</small>'),
  file:fig('edge-doua-file.webp',751,50,'Două file deschise în Edge, Lupul și Ariciul, fiecare cu un x; în dreapta lor, butonul plus','Sus, fiecare filă are <b>×</b>: cu el închizi fila și tot ce e în ea. <small>Captură din Microsoft Edge, în română (lecția 14).</small>'),
  data:fig('data-si-sursa.webp',337,150,'Subsolul unei pagini Wikipedia: Ultima editare a paginii a fost efectuată la 23 mai 2025, cu data încadrată și mărită','La Wikipedia, data e jos de tot: „Ultima editare…”. <small>Captură din Google Chrome, din jocurile LearningHub.</small>')
};
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
const L16='learninghub-8z6.pages.dev/lectii/v/m3-l16';
/* caseta de cookie-uri a site-urilor reale (judecata 1: opus M2 + sonnet J1; arbitrajul dirijorului): e a site-ului, nu o capcană;
   butonul care refuză (Bing: „Respingeți”, văzut pe capturile _verificare/j1_cookie_www_bing_com_*.png și ab_sonnet/bing_barza.png);
   fără el: × pe filă. O singură idee; „cookie-uri” = o propoziție. */
const COOKIE='Jos apare o casetă despre <b>cookie-uri</b> (informații pe care site-ul le lasă în browserul tău)? E a site-ului, nu o capcană: apasă butonul care refuză (la Bing, <b>Respingeți</b>), nu pe cel care acceptă. Nu are buton care refuză? Închide fila cu <b>×</b>, apoi, într-o filă nouă, caută din nou și alege alt rezultat.';

const SCHEMA=`<div class="schema" role="img" aria-label="Schema: cauți cu 2-3 cuvinte-cheie; alegi un rezultat, sari peste Sponsorizat; verifici pagina: cine a scris, când, de unde știe, compari 2-3 surse; păstrezi în folderul tău, cu sursa; pe tot drumul: nu apeși pe capcane, nu dai date personale">
  <div class="sc-box"><b>Cauți</b><span>în browser, cu 2-3 cuvinte-cheie (lecția 14)</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Alegi un rezultat</b><span>după titlu și descriere; sari peste Sponsorizat (lecția 14)</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Verifici pagina</b><span>cine a scris? când? de unde știe? compari 2-3 surse (lecția 16)</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Păstrezi, cu sursa</b><span>în folderul tău; scrii titlul, adresa, autorul, data (lecția 15)</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Pe tot drumul</b><span>nu apeși pe capcane: închizi fila cu × și spui unui adult; nu dai date personale</span></div>
</div>`;

/* ---- „Acum în browserul tău adevărat” (modul lecție: după atelier, înainte de verificare). FĂRĂ profesor, pe calculatorul
   comun: o filă nouă, închisă la sfârșit; nimic descărcat, niciun cont, nimic scris în casetele paginilor. ---- */
/* Laboratorul scurtat (judecata 1, opus M3: ~55 de minute): o singură căutare; prima pagină = articolul Wikipedia (unde stă
   data a văzut la pasul 4), din care scrie doar unde iernează barza; Pagina 2 = trei rubrici; o propoziție. */
const LAB=[
  'Lecția rămâne în fila ei. În caiet scrie titlul <b>Pot avea încredere?</b> și, dedesubt, două rânduri: <b>Wikipedia:</b> și <b>Pagina 2:</b>. Pe tot drumul nu apeși pe reclame, pe butoane „Descarcă” sau pe ferestre care te sperie ori îți promit ceva și nu scrii nimic în pagini. Apare ceva ciudat? Închizi fila cu <b>×</b> și spui unui adult.<details class="verif"><summary>Ai închis din greșeală lecția?</summary><ol><li>Ai închis doar fila lecției: ține apăsate <kbd>Ctrl</kbd> (jos, în stânga) și <kbd>Shift</kbd> (deasupra lui) și apasă o dată <kbd>T</kbd>. Fila lecției reapare.</li><li>Ai închis toată fereastra browserului: pornește-l din Start, ca la lecția 13 (scrie <b>edge</b> și dă clic pe <b>Microsoft Edge</b>), apoi <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd>. Închide cu X fereastra în care nu e lecția (dacă sunt două, pe amândouă).</li><li>În lecție, apasă <b>Continuă de unde ai rămas</b>, dacă apare.</li></ol></details>',
  'Filă nouă (<b>+</b>). Caută <code>barza albă iarna</code> și apasă <kbd>Enter</kbd> (merge și fără ă). '+COOKIE,
  'Deschide rezultatul <b>Wikipedia</b>, cu un clic pe titlu (de obicei e primul; dacă lipsește, ia alt rezultat cu text). În primul paragraf găsește cuvântul <i>iernează</i> și scrie la <b>Wikipedia:</b> unde iernează barza. Apoi <b>←</b> Înapoi.',
  'Deschide un rezultat cu text, de pe alt site. Sari peste ce e marcat <b>Sponsorizat</b> și peste rezultatele cu poze, clipuri sau fișiere (în titlu scrie Instagram, YouTube, TikTok, Videoclipuri sau PDF). La <b>Pagina 2:</b> scrie cine a scris (un om, un muzeu, o enciclopedie sau „nu scrie”), data (sub titlu sau jos de tot; ori „nu scrie”) și unde iernează barza.',
  'Cele două pagini spun la fel? Încercuiește pagina în care ai mai multă încredere și scrie de ce, într-o propoziție (de exemplu: „are autor și dată”). La sfârșit, închide fila ta cu <b>×</b>; fila lecției rămâne. <details class="verif"><summary>Verifică-te, după ce ai scris</summary> La Wikipedia, autorii sunt voluntarii ei, iar data e jos de tot, ca pe pagina principală a Wikipediei, la pasul „Pot avea încredere? Cine a scris și când”. Barza albă iernează în Africa: dacă cele două pagini spun la fel, ai mai multă încredere. Ai încercuit pagina cu autor, cu dată și care spune de unde știe? Ai ales bine.</details>'
];

/* lumea simulatorului: pornește din fila lecției 16 (paginile inventate sunt în browser-siguranta.js) */
const B=o=>Object.assign({t:'browserSigur'},o);

JocMotor.porneste({
  cheie:'lectie_v_m3_l16',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 16”, pasul real înainte de verificare
  titlu:'Siguranța pe Internet: pericole, reguli, credibilitatea surselor',
  marca:'Lecția <b>16</b> · clasa a V-a',
  h1:'Siguranța pe Internet: pericole, reguli, credibilitatea surselor',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U3', unitateTitlu:'Internetul ca sursă de documentare',
  competente:['CS.1.3'], lectii:'16',
  ancoraText:'Din programă (CS.1.3, unitatea V-U3, lecția 16): Siguranța pe Internet; activitatea de învățare: stabilirea unor reguli pentru o navigare sigură și eficientă pe Internet și discutarea credibilității resurselor Web',
  intro:`<p><b>Ai nevoie de:</b> lecția 13 — web-ul, site-ul, adresa web. Lecția 14 — browserul, filele (<b>+</b> și <b>×</b>), bara de adrese, motorul de căutare, rezultatele, <b>Sponsorizat</b>, <b>←</b> Înapoi. Lecția 15 — sursa unei pagini (titlul, adresa, autorul, data), folderul tău. Lecția 9 — rotița mouse-ului.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 7 pași scurți. După fiecare (în afară de primul) faci un exercițiu mic, fără puncte, și, unde se poate, un gest în browserul tău adevărat, într-o filă nouă.</li><li>La atelier cercetezi trei pagini într-un browser din pagină.</li><li>În browserul tău adevărat compari două pagini adevărate.</li><li>Răspunzi la 5 întrebări: pentru ele primești stele.</li></ol><p><b>Doar dacă mai ai timp:</b> „Încă un exercițiu”, după pași și la atelier.</p>`,
  banda:'<span class="bd-tab">Lecția 16</span><span class="bd-adr"><b>www.muzeu-exemplu.ro</b>/barza-alba</span><span class="bd-q">Cine a scris? Când? De unde știe?</span>',
  nivele:[
{t:'Siguranța pe Internet: pericole, reguli, credibilitatea surselor',final:true,lectii:[16],
 continuturi:['Siguranța pe Internet'],
 obiectiv:'recunoști capcanele de pe web și știi ce faci când apar, îți păstrezi datele personale și alegi o pagină în care poți avea încredere, după cine a scris-o, când și de unde știe.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: Internetul e ca un oraș',
   text:`<p>Internetul e ca un oraș mare. Are biblioteci și muzee: acolo, cineva verifică o carte înainte s-o pună pe raft. Dar are și stâlpi cu afișe, pe care oricine lipește orice, fără să verifice nimeni.</p>
<p>Pe web e la fel. Lângă paginile bune sunt pagini care greșesc, reclame care se ascund și <strong>capcane</strong>.</p>
<p>Azi înveți să recunoști capcanele, ce faci când apar și cum alegi o pagină în care poți avea încredere. La sfârșit recapitulezi lecțiile 13-16, înainte de evaluare.</p>
${IMG.stalp}`},
  /* ---- pasul 1: capcanele ---- */
  {t:'Capcanele de pe web: cum le recunoști',
   text:`<p>Pe unele pagini apar <mark>capcane</mark>: lucruri făcute ca să te păcălească să apeși.</p>
<ul><li><b>Fereastra falsă:</b> o casetă care îți promite un premiu („Ai câștigat!”) sau te sperie („Calculatorul tău e infectat!” sau „…are viruși!”, adică are un program care îl strică).</li>
<li><b>Reclama care arată ca un buton:</b> „DESCARCĂ”, „Continuă”, mare și colorat, deși tu n-ai cerut nimic.</li>
<li><b>Legătura sau descărcarea necunoscută:</b> un program „gratis”, de pe un site pe care nu-l știi.</li></ul>
<p><b>Semnele unei capcane:</b> te grăbește, te sperie sau îți promite ceva prea frumos.</p>`,
   exemplu:`<div class="fals-ex" role="img" aria-label="Exemplu de fereastră falsă: Ai fost ales! Primești un telefon nou! Mai ai 30 de secunde. Apasă OK. În colț, un x desenat."><span class="x" aria-hidden="true">✕</span><b class="t">Ai fost ales! Primești un telefon nou!</b>Mai ai doar 30 de secunde. Apasă OK ca să-l primești.<br><span class="b">OK</span></div>
<p>O fereastră falsă, desenată de noi. <span class="semn">Te grăbește</span> („30 de secunde”) <span class="semn">și îți promite ceva prea frumos</span> (un telefon, deși n-ai participat la niciun concurs). E o capcană.</p>`,
   incearca:{t:'classify',q:'Capcană sau pagină obișnuită? Sortează.',cats:['Capcană','Pagină obișnuită'],
    items:[['„Bicicleta e a ta! Apasă AICI, mai ai doar 10 secunde!”',0],['Un buton mare, verde, „DESCARCĂ ACUM”, lângă un joc, pe un site pe care nu-l știi',0],['„Tableta ta are 3 viruși! Apasă REPARĂ, altfel pierzi toate pozele!”',0],['Pagina unui muzeu: titlul, cine a scris-o, data și textul',1],['Pe pagina enciclopediei, legătura „Lupul”, care duce la pagina despre lup',1]],
    ajutor:'La fiecare: te grăbește, te sperie sau îți promite ceva prea frumos?',
    why:'Bicicleta „câștigată” și grăbirea, butonul „DESCARCĂ” de pe un site necunoscut și sperietura cu virușii sunt capcane. Pagina muzeului și legătura enciclopediei nu te grăbesc și nu-ți promit nimic.'},
   inca:[
    {t:'tf',q:'Un mesaj spune că ai câștigat un premiu, deși n-ai participat la niciun concurs. E o capcană.',ok:true,ajutor:'Ce semn al capcanelor are mesajul?',
     why:'Adevărat. Un premiu fără concurs e „ceva prea frumos”: un semn de capcană.'}
   ]},
  /* ---- pasul 2: ce faci ---- */
  {t:'Ce faci: nu apeși, închizi fila, spui unui adult',
   text:`<p>Când vezi o capcană, ai o regulă în trei pași:</p>
<ol><li><b>Nu apeși nimic în ea:</b> nici „OK”, nici butonul ei, nici ✕ desenat în casetă (și el e al paginii false).</li>
<li><b>Închizi fila</b>, sus, cu <b>×</b> de pe ea (lecția 14).</li>
<li><b>Spui unui adult:</b> profesorului sau unui părinte.</li></ol>
<p>Fereastra nu se închide sau acoperă tot ecranul? Nu apăsa nimic și cheamă un adult.</p>
<p>Uneori chiar Edge te oprește, cu o pagină care te avertizează că site-ul e nesigur. Nu mergi mai departe: închizi fila.</p>
${IMG.file}
${ACUM('Deschide o filă nouă cu <b>+</b>. Apoi închide-o cu <b>×</b> de pe ea: așa scapi de o capcană.')}`,
   exemplu:`<p>Radu se uită la un desen animat pe un site. Deodată apare: „Eroare Windows! Sună urgent la 07xx xxx xxx, altfel pierzi toate jocurile.” Radu știe că avertismentele adevărate de la Microsoft nu au niciodată număr de telefon. Nu sună și nu apasă nimic. Închide fila, sus, cu ×, și îi spune profesorului ce a văzut.</p>`,
   altfel:`<p>E ca un bilet găsit pe jos, pe care scrie: „Sună acum la numărul ăsta și primești un premiu!”. Nu suni și nu-l păstrezi: îl lași acolo și le spui părinților.</p>`,
   incearca:B({q:'În browserul din pagină, lecția e în prima filă. În a doua filă s-a deschis o pagină cu o fereastră care te sperie. Fă ce ai învățat, cu mouse-ul (pe telefon, cu degetul).',start:[L16,'www.jocuri-gratis-exemplu.ro'],activa:1,

    checks:[{k:'filaLectiei',ce:'Fila lecției e tot deschisă',msg:'Fila lecției nu mai arată lecția: ai închis-o sau ai plecat din ea. Apasă „Ia-o de la capăt” și închide doar fila paginii false.'},

    sol:[['inchideFalsa']],gresit:[['capcana']],
    ajutor:'Nu apăsa nimic în caseta roșie, nici ✕ din colțul ei, nici butonul verde. Sus, pe fila „Jocuri GRATIS…”, apasă ×.',
    why:'Ai închis fila de sus, cu ×, fără să apeși nimic în pagina falsă. Așa nu poate porni nicio descărcare.',
    solText:'am închis pentru tine fila paginii false, cu × de pe ea, fără să apăs nimic în pagină.'}),
   inca:[
    {t:'choice',q:'Pe pagina unui joc, pe un site pe care nu-l cunoști, apare un buton uriaș: „DESCARCĂ GRATUIT”. Ce faci?',o:['Nu apăs și îi spun unui adult','Apăs repede, e gratis','Apăs o singură dată, ca să văd ce e','Îl descarc, iar dacă nu-mi place, îl șterg'],ok:0,
     ajutor:'E o descărcare necunoscută. Ce spune regula?',why:'O descărcare de pe un site necunoscut e o capcană. Nu apeși și ceri ajutorul unui adult.'}

  /* ---- pasul 3: datele personale și necunoscuții ---- */
  {t:'Datele tale și persoanele necunoscute',
   text:`<p><mark>Datele personale</mark> sunt informațiile după care cineva poate afla cine ești sau unde te găsește: numele complet, adresa de acasă, numărul de telefon, școala și clasa, pozele cu tine.</p>
<p><b>Regulile:</b></p>
<ol><li>Nu le scrii pe site-uri, în jocuri sau în mesaje, nici pentru un premiu (în afară de site-urile date de profesor, ca LearningHub).</li>
<li>Unui necunoscut de pe Internet nu-i trimiți poze și nu te întâlnești cu el, oricât de prietenos pare.</li>
<li>Dacă cineva îți cere date, poze sau o întâlnire, spui unui adult.</li></ol>
<p>Și parola e secretă: o știi doar tu și părinții tăi. Despre ea înveți în clasa a VI-a.</p>`,
   exemplu:`<p>În jocul ei preferat, Ioana primește un mesaj: „Ești super! Spune-mi la ce școală ești și hai să ne vedem sâmbătă în parc.” Ioana nu răspunde și le arată mesajul părinților. Școala e o dată personală, iar întâlnirea cu un necunoscut de pe Internet e periculoasă.</p>`,
   altfel:`<p>Pe stradă nu-i spui unui străin unde locuiești și nu pleci cu el, chiar dacă îți promite o înghețată. Pe Internet, străinul nici nu se vede: poza lui poate fi a altcuiva.</p>`,
   incearca:{t:'classify',q:'Dată personală, pe care n-o dai, sau informație care nu spune cine ești?',cats:['Dată personală: n-o dai','Nu spune cine ești'],
    items:[['numărul blocului și al apartamentului tău',0],['numele tău împreună cu numele școlii',0],['o poză cu tine în fața școlii',0],['animalul tău preferat',1],['culoarea care îți place',1],['numărul de telefon al tatălui tău',0]],
    ajutor:'La fiecare: un necunoscut ar afla din asta cine ești sau unde te găsește?',
    why:'Blocul și apartamentul sunt adresa ta; numele cu școala și poza în fața școlii spun unde te găsește cineva; telefonul tatălui duce la familia ta. Animalul și culoarea preferate nu spun singure cine ești.'},
   inca:[
    {t:'choice',q:'Un jucător pe care nu-l cunoști îți scrie: „Hai să ne vedem sâmbătă în parc, îți dau o carte rară.” Ce faci?',o:['Nu mă duc și le arăt mesajul părinților','Mă duc, dar cu un prieten','Mă duc, pare să fie de vârsta mea','Îi dau numărul meu, ca să vorbim întâi'],ok:0,
     ajutor:'Regulile 2 și 3 din pas.',why:'Cu un necunoscut de pe Internet nu te întâlnești. Le arăți mesajul părinților: ei știu ce e de făcut.'}
   ]},
  /* ---- pasul 4: sursa de încredere — cine, când, de unde știe ---- */
  {t:'Pot avea încredere? Cine a scris și când',
   text:`<p>O pagină în care poți avea încredere e o <mark>sursă de încredere</mark> (sau <mark>credibilă</mark>). Înainte să crezi ce scrie, îi pui trei întrebări:</p>
<ol><li><b>Cine a scris?</b> Un om cu nume, un muzeu, o enciclopedie? Sau nimeni?</li>
<li><b>Când?</b> Are o dată? O pagină veche poate să nu mai fie adevărată.</li>
<li><b>De unde știe?</b> Spune de unde are informația?</li></ol>
<p>Autorul și data stau, de obicei, sub titlu sau jos de tot. La Wikipedia, autorii sunt voluntarii ei (lecția 15).</p>
${IMG.data}
${ACUM('Filă nouă (<b>+</b>). În bara de adrese scrie <code>ro.wikipedia.org</code> și apasă <kbd>Enter</kbd>.','Jos de tot (cu rotița) citești data. Închide fila cu <b>×</b>.')}`,
   exemplu:`<div class="pag-ex"><div class="st">Parcul Natural Exemplu</div><div class="ti">Ursul brun în pădurile parcului</div><div class="me">Scris de Ion Vasilescu, pădurar · 4 februarie 2026 <span class="eti">Cine? Când?</span></div><div>Vara, ursul se hrănește cu fructe de pădure, iarbă și rădăcini.</div><div class="de">De unde știm: pădurarii parcului urmăresc urșii în fiecare an. <span class="eti">De unde știe?</span></div></div>
<p>Pagina are răspuns la toate trei întrebările: o poți crede mai ușor decât o pagină fără autor și fără dată.</p>`,
   incearca:B({q:'În a doua filă e o pagină despre veverițe. Află cine a scris-o și când, apoi scrie-le mai jos, în casetă.',start:[L16,'www.parc-exemplu.ro/veverita'],activa:1,
    raspuns:{eticheta:'Cine a scris pagina și când:',id:'veverita'},
    checks:[{k:'fisa',parte:'autor',ce:'Ai scris cine a scris pagina',msg:'Uită-te sub titlu: după „Scris de” e numele autorului.'},
     {k:'fisa',parte:'data',ce:'Ai scris data paginii',msg:'Data e pe același rând cu autorul, după punct. Scrie-o întreagă: ziua, luna și anul.'}],
    sol:[['raspuns','Mihai Pop, 12 septembrie 2026']],gresit:[['raspuns','Veverița, vecina din pădurea parcului']],
    ajutor:'Sub titlu scrie „Scris de …”, iar după punct e data.',
    why:'Autorul e Mihai Pop, pădurar, iar data e 12 septembrie 2026. Și jos scrie de unde știe.',
    solText:'am scris în casetă autorul și data paginii: <b>Mihai Pop, 12 septembrie 2026</b>.'}),
   inca:[
    {t:'choice',q:'Pe o pagină despre dinozauri nu găsești nici autorul, nici data. Ce înseamnă?',o:['Verifici informația și în altă sursă','Pagina e sigur adevărată, nu mai verifici','Pagina sigur minte, o închizi imediat','O salvezi, ca să afli cine a scris-o'],ok:0,
     ajutor:'Lipsa autorului spune ceva sigur despre adevăr?',why:'Fără autor și fără dată nu poți răspunde la „Cine?” și „Când?”. Nu e sigur că minte, dar o verifici în altă sursă.'}
   ]},
  /* ---- pasul 5: compari surse; semnele unei pagini neserioase ---- */
  {t:'Compari 2-3 surse și recunoști pagina neserioasă',
   text:`<p>Chiar și o pagină bună poate greși. De aceea, pentru ce e important, <mark>compari 2-3 surse</mark>: dacă spun la fel, ai mai multă încredere.</p>
<p><b>Semnele unei pagini neserioase:</b></p>
<ul><li>titlul strigă: „INCREDIBIL!!!”, „Nu o să crezi!”;</li><li>nu are autor, nici dată;</li><li>de fapt vrea să-ți vândă ceva, deși arată ca un articol;</li><li>are multe greșeli și e scrisă fără diacritice.</li></ul>
<p>Atenție: primul rezultat al motorului de căutare nu e neapărat cel mai adevărat. Motorul te duce la pagini, dar nu le scrie el și nu le verifică.</p>`,
   exemplu:`<p>Întrebarea: <i>Ce mănâncă ursul brun?</i></p>
<ul><li>Un forum, fără nume: „ursul mănâncă doar miere”.</li><li>Enciclopedia pentru copii: fructe de pădure, rădăcini, miere, insecte.</li><li>Parcul natural: fructe de pădure, iarbă, rădăcini.</li></ul>
<p>Două surse de încredere spun la fel: ursul mănâncă de toate. Forumul greșește.</p>
<p>Și adresa contează: îți spune pe ce site ești. În stânga ei, Edge are un semn mic: când vede o problemă de siguranță la site, semnul te avertizează. Dar nu-ți spune dacă ce scrie pe pagină e adevărat.</p>`,
   altfel:`<p>Dacă un singur coleg spune că mâine nu e școală, nu-l crezi pe loc. Întrebi diriginta sau te uiți pe site-ul școlii. Când mai multe surse de încredere spun la fel, e mai probabil să fie adevărat.</p>`,
   incearca:{t:'classify',q:'Ai căutat „câți ani trăiește un elefant”. Ce faci cu fiecare pagină?',cats:['Am încredere','Verific în altă sursă','Sar peste: vrea să-mi vândă'],
    items:[['Grădina Zoologică Exemplu: scrisă de un medic veterinar, cu dată',0],['„ȘOCANT!!! Elefantul care a trăit 200 de ani”, fără autor',1],['„Tot despre elefanți”, iar la sfârșit: „Cumpără acum elefantul de pluș!”',2],['un comentariu fără nume: „cred ca vreo 500 de ani”',1],['Enciclopedia pentru copii, cu dată, spune la fel ca grădina zoologică',0]],
    ajutor:'La fiecare: cine a scris? când? vrea să-ți vândă ceva? spune la fel ca altă sursă?',
    why:'Grădina zoologică și enciclopedia au autor, dată și spun la fel. Titlul care strigă și comentariul fără nume le verifici în altă sursă. Pagina cu elefantul de pluș e o reclamă ascunsă.'},
   inca:[
    {t:'choice',q:'Două pagini spun lucruri diferite despre câte picioare are un păianjen. Ce faci?',o:['Caut o a treia sursă de încredere','Aleg pagina care are mai multe poze','Aleg pagina care e prima în rezultate','Scriu varianta care îmi place mai mult'],ok:0,
     ajutor:'Recitește începutul pasului.',why:'Când sursele nu se potrivesc, o a treia sursă de încredere te lămurește. Ordinea rezultatelor nu spune cine are dreptate.'}
   ]},
  /* ---- pasul 6: consolidare — recapitularea lecțiilor 13-16 + ce am învățat ---- */
  {t:'Recapitulare: drumul unei documentări (lecțiile 13-16)',
   text:`<p>O <mark>documentare</mark> înseamnă să afli ceva pentru o temă. La lecțiile 13-16 ai învățat tot drumul ei, pe web: <b>cauți</b>, <b>alegi</b> un rezultat, <b>verifici</b> pagina și <b>păstrezi</b> ce ai găsit, cu sursa. Schema de mai jos îți arată fiecare pas.</p>
<p>Pe tot drumul nu apeși pe capcane și nu dai date personale. La lecția 17, evaluarea, faci singur acest drum.</p>`,
   exemplu:`<p><b>Ce am învățat, pe scurt:</b></p>${SCHEMA}`,

    ajutor:'Întâi caută, apoi alege, apoi verifică, apoi păstrează.',why:'Cauți, alegi un rezultat, verifici pagina și abia apoi păstrezi ce ai găsit, cu sursa.'},

     ajutor:'Amintește-ți lecția 15: din ce părți e făcută sursa?',why:'Sursa are titlul, adresa, autorul și data, ca oricine să poată ajunge la aceeași pagină. Motorul de căutare nu e sursa.'}

 atelier:B({titlu:'Atelier: trei pagini, în care ai încredere?',
  intro:`<p><strong>Sarcina:</strong> la științe afli <b>unde pleacă barza albă iarna</b>. Motorul îți dă pagini bune, dar și o pagină falsă și o reclamă ascunsă. Lecția e în prima filă.</p>

<li>Deschide pagina care începe cu <b>INCREDIBIL!!!</b>. Când apare fereastra, fă ce ai învățat: nu apeși nimic în ea și îi închizi fila. Apoi filă nouă și cauți din nou.</li>
<li>Deschide și pagina <b>Tot ce trebuie să știi despre berze</b> și citește-o până la capăt. Ce vrea de fapt?</li>

<li>Când trec toate testele, apasă <b>Verifică</b>.</li></ol>`,

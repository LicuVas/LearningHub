/* Lecția 13, clasa a V-a (M2): „Servicii ale rețelei Internet. La ce folosește fiecare” (predare, 11.12.2026 la Brauner).
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele, deciziile și probele: surse.md.
   Documentele profesorului au prioritate: activitati_lectii_V_VI.json (V/13: bilețelele grupate pe tablă pe servicii:
   web, poștă, mesagerie, streaming, jocuri), Proiectul_unitatii_V-U3.md (CS.1.3), Calendar_ore_5AM_5M.md.
   Granița: browserul (bara de adresă, legăturile, filele) și căutarea sunt ale lecției 14; salvarea și drepturile de autor,
   ale lecției 15; siguranța pe Internet, ale orei 16; contul de e-mail și parolele, ale clasei a VI-a. Aici nu apar.
   Atelierul: simulatorul nou lectii/_sim/bilete-servicii.js (proprietar: lecția asta), tabla cu bilețelele profesorului. */
const LIC={
  by2:'<a href="https://creativecommons.org/licenses/by/2.0/deed.ro" target="_blank" rel="noopener">CC BY 2.0</a>',
  by4:'<a href="https://creativecommons.org/licenses/by/4.0/deed.ro" target="_blank" rel="noopener">CC BY 4.0</a>'
};
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  apel:fig('apel-video.webp',520,506,'Un copil, văzut din spate, ține în mână un desen pe o foaie roz, în fața unui telefon; pe ecranul telefonului, o femeie zâmbește și se uită la desen',`Un apel video: copilul îi arată desenul lui cuiva drag, care îl vede chiar atunci, pe ecranul telefonului. <small>Foto: Shixart1985, ${wc('Child_shows_drawing_to_family_member_on_video_call_at_home_during_day.jpg','Wikimedia Commons')}, ${LIC.by2}; decupată, micșorată.</small>`),
  wifi:fig('aparat-wifi.webp',340,340,'Un aparat de Wi-Fi alb, ca o cutie turtită, cu o antenă neagră și cu un șir de beculețe în față',`Un aparat de Wi-Fi, ca în multe case. Leagă fără fir telefoanele și calculatoarele casei, între ele și cu Internetul. <small>Foto: Hayden Schiff, ${wc('TP-Link_TL-WR740N_router_HS1_transparent.png','Wikimedia Commons')}, ${LIC.by4}; fundalul pus pe alb, micșorată.</small>`),
  pagina:fig('pagina-web.webp',1000,550,'Fereastra browserului Google Chrome, cu o pagină a enciclopediei Wikipedia despre lupul cenușiu; sus, adresa paginii; dedesubt, titlul Lup cenușiu, textul și o fotografie',`O <b>pagină web</b> deschisă în browserul Google Chrome: o pagină a site-ului Wikipedia, o enciclopedie. Sus, deasupra paginii, scrie adresa ei. Cum lucrezi cu browserul afli la lecția 14. <small>Captură din jocul „Misiunea Documentare” al sitului.</small>`),
  adresa:fig('adresa-email.webp',760,86,'O adresă de e-mail scrisă mare: ana.pop, apoi semnul @, apoi joc-mail.test, fiecare parte într-un chenar roșu',`O adresă de e-mail inventată: numele <b>ana.pop</b>, semnul <b>@</b> și numele serviciului de poștă, <b>joc-mail.test</b>. <small>Decupată din jocul „Misiunea Mesaj Sigur” al sitului; chenarele roșii le-a pus autorul jocului.</small>`)
};

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).
   FĂRĂ profesor (la ora simultană e la cealaltă clasă), fără nicio adresă scrisă, fără cont, fără parolă, fără clic în pagini web.
   Judecata 1 (G1): elevul citește lecția CHIAR într-un browser de pe calculatorul acela. Deci fereastra lecției nu se închide:
   browserul pornește într-o fereastră NOUĂ, din Start, și se închide doar ea; calea de întoarcere (Start, browserul lecției,
   Ctrl+Shift+T, „Continuă de unde ai rămas”) e scrisă în pagină. Probat în Edge și Chrome reale, pe un desktop ascuns, cu profil
   temporar: _proba/edge_ascuns_v13.py (surse.md §4). Fără întrebarea „Închideți toate filele?”: nu apare la o fereastră cu o pagină.
   Gesturile vin din lecția 8 (Start, numele de pe bara de activități, pornire, Minimizare, readucere, Închidere). */
const LABORATOR=[
  'Stai pe scaun, la locul tău. Azi <b>nu schimbi nimic</b> pe calculatorul comun: nu scrii nicio adresă și nicio parolă, nu intri în niciun cont și nu dai clic în nicio pagină web, <b>în afară de lecția asta</b>. Doar te uiți, deschizi o fereastră nouă de browser și o închizi. Scrie în caiet titlul <b>Serviciile Internetului</b>.',
  'Dacă ecranul e negru, mișcă puțin mouse-ul: de obicei se aprinde. Dacă rămâne negru sau îți cere o parolă, nu scrie nicio parolă și nu apăsa nimic. Scrie în caiet, în cuvinte, cum ai face pașii 3-7, apoi compară cu colegul de bancă.',
  'Și lecția asta e o pagină web, deschisă într-un browser. <b>Fereastra lecției n-o închizi:</b> la ea te întorci după laborator, la întrebări și la diplomă. Pe bara de activități, browserul lecției are o linie sub pictogramă, pentru că e pornit. Ține săgeata pe pictograma lui până îi vezi numele. Dacă apare titlul paginii, recunoști browserul după sigla lui: Edge are un val albastru-verde, Chrome un cerc roșu-galben-verde, cu albastru în mijloc. Scrie în caiet: „Lecția e în …”. Apoi ascunde lecția cu Minimizare (liniuța din dreapta sus) și readu-o cu un clic pe aceeași pictogramă. Dacă deasupra ei apar mai multe ferestre mici, alege-o pe cea cu lecția. Minimizarea ascunde fereastra, nu o închide. (Citești lecția pe telefon? Scrie „pe telefon” și treci la pasul 4.)',
  'Deschide meniul Start: clic pe butonul Start. Uită-te la aplicațiile din el, <b>fără să pornești vreuna</b>. Scrie în caiet numele a trei aplicații. Lângă fiecare, scrie serviciul Internetului pe care îl folosește sau „merge și fără Internet”. Apoi închide meniul Start: clic din nou pe butonul Start. <b>Scrie acum în caiet calea de întoarcere</b>, ca s-o ai și dacă fereastra lecției se închide: <b>Start → browserul lecției → Ctrl+Shift+T</b> (ții apăsate Ctrl, jos în stânga, și Shift, deasupra lui, și apeși o dată T).<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Microsoft Edge, Google Chrome, Firefox: sunt browsere, pentru web. Outlook: poștă electronică. Teams: mesagerie, cu apeluri video. Microsoft Store: folosește Internetul; din el se iau aplicații noi. Word, Excel, PowerPoint, Paint și Calculator: merg și fără Internet. O aplicație pe care n-o cunoști: scrie „nu știu” lângă ea; e bine și așa.</details>',
  'Pornește o fereastră <b>nouă</b> de browser, din Start, ca la lecția 8: clic pe butonul Start, scrie <b>edge</b> și dă clic pe <b>Microsoft Edge</b>, rândul cu sigla lui, nu pe rândurile cu lupă. Chiar dacă lecția e tot în Edge, se deschide o fereastră nouă, peste lecție; lecția rămâne dedesubt. Nu-l porni de pe bara de activități. Nu găsești Microsoft Edge? Scrie <b>chrome</b> și dă clic pe Google Chrome. Ca să citești pasul următor, adu lecția din nou deasupra: clic pe pictograma browserului lecției, ca la pasul 3. Dacă deasupra ei apar mai multe ferestre mici, alege-o pe cea cu lecția.',
  'În fereastra nouă e de obicei pagina de pornire a browserului. Pe ea pot fi reclame, știri, poze sau o fereastră care îți cere să alegi ceva ori să intri într-un cont. <b>Nu le citi, nu da clic pe ele și nu alege nimic.</b> Ai văzut-o la pasul 5: în fereastra nouă nu e lecția. Scrie în caiet numele browserului pe care l-ai pornit.',
  'Întâi adu fereastra <b>nouă</b> deasupra: clic pe pictograma browserului pornit de tine (cel din caiet) și, dacă apar mai multe ferestre mici, alege-o pe cea în care <b>nu</b> e lecția. Dacă vezi lecția, nu apăsa X. Abia apoi închide <b>doar fereastra nouă</b>, cu Închidere (X), din colțul ei din dreapta sus. După X, pe ecran rămâne lecția.<details class="verif"><summary>Ai închis din greșeală lecția? Așa o aduci înapoi</summary><ol><li>Pornește din Start browserul în care era lecția (l-ai scris în caiet la pasul 3): scrie <b>edge</b> sau <b>chrome</b> și dă clic pe el.</li><li>În fereastra care se deschide, ține apăsate tastele <kbd>Ctrl</kbd> (jos, în stânga) și <kbd>Shift</kbd> (deasupra lui) și apasă o dată tasta <kbd>T</kbd>. Lecția se deschide din nou.</li><li>Închide cu X fereastra în care nu e lecția (dacă sunt două, pe amândouă).</li><li>În lecție, apasă <b>Continuă de unde ai rămas</b>.</li></ol></details><details class="verif"><summary>Verifică-te, la final</summary>Pe ecran e fereastra cu lecția, iar fereastra nouă nu mai e. În caiet ai: browserul lecției, trei aplicații din Start, fiecare cu serviciul ei, și numele browserului pornit. Calea de întoarcere e scrisă în caiet. Dacă ecranul a rămas negru: pașii 3-7, scriși în cuvinte.</details>'
];

/* numele grupelor de pe tablă: cele cinci grupe ale profesorului */
const NUME=[{id:'web',et:'Web'},{id:'posta',et:'Poștă electronică'},{id:'mesagerie',et:'Mesagerie'},{id:'streaming',et:'Streaming'},{id:'jocuri',et:'Jocuri online'}];

JocMotor.porneste({
  cheie:'lectie_v_m2_l13',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 13”, pasul din laborator înainte de verificare
  titlu:'Servicii ale rețelei Internet. La ce folosește fiecare',
  marca:'Lecția <b>13</b> · clasa a V-a',
  h1:'Servicii ale rețelei Internet. La ce folosește fiecare',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U3', unitateTitlu:'Internetul ca sursă de documentare',
  competente:['CS.1.3'], lectii:'13',
  ancoraText:'Din programă (CS.1.3, unitatea V-U3, lecția 13): Servicii ale rețelei Internet · Serviciul World Wide Web',
  intro:`<p>Afli ce este Internetul și ce poți face prin el: citești pagini, trimiți scrisori, vorbești pe loc cu cineva, privești filme, te joci. Fiecare dintre ele e un alt fel de a folosi Internetul. Înveți pe pași, cu imagini. Apoi lipești pe o tablă, pe grupe, bilețelele unor colegi, iar la calculatorul din laborator pornești și închizi o aplicație care folosește Internetul. La sfârșit verifici ce știi, cu 5 întrebări.</p>
<p><b>La final știi:</b> să spui ce este Internetul, să recunoști serviciile lui (web, poștă electronică, mesagerie, streaming, jocuri online), să deosebești o adresă web de o adresă de e-mail și să alegi serviciul potrivit pentru ce vrei să faci.</p>
<p><b>Ai nevoie de:</b> lecția 3 — un sistem de comunicații duce date la distanță, adică departe; un aparat conectat e legat de alte aparate și schimbă date cu ele; telefoanele trimit și primesc prin antenele de telefonie; lecția 8 — meniul Start (îl deschizi cu butonul Start; o aplicație o găsești și scriindu-i primele litere), bara de activități (ții săgeata pe o pictogramă și îi vezi numele), Minimizare și Închidere (X); lecția 9 — un fișier păstrează un lucru: o temă, o poză, un cântec; lecția 2 — în laborator nu atingi cablurile și prizele.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 6 pași scurți. Primul îți arată la ce folosește lecția; după fiecare dintre ceilalți faci un exercițiu mic, fără puncte.</li><li>La atelier lipești pe tablă, pe grupe, bilețelele a zece colegi și dai nume grupelor.</li><li>Acum la calculatorul din laborator: găsești aplicațiile care folosesc Internetul, deschizi o fereastră nouă de browser și o închizi, singur, fără să închizi lecția.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,
  banda:'<span class="adr"><i></i>https://</span><span class="sv">web</span><span class="sv">@</span><span class="sv">chat</span><span class="sv">▶</span><span class="sv">joc</span>',
  nivele:[
{t:'Servicii ale rețelei Internet. La ce folosește fiecare',final:true,lectii:[13],
 continuturi:['Servicii ale rețelei Internet','Serviciul World Wide Web:'],
 obiectiv:'spui ce este Internetul, recunoști serviciile lui (web, poștă electronică, mesagerie, streaming, jocuri online), deosebești o adresă web de o adresă de e-mail și alegi serviciul potrivit pentru ce vrei să faci.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: o săptămână pe Internet',
   text:`<p>Gândește-te la săptămâna care a trecut. Poate ai privit desene animate pe tabletă, care veneau prin Internet. Poate i-ai arătat cuiva drag un desen, pe telefon, ca în fotografie. Poate ai jucat un joc cu un coleg, fiecare de acasă.</p>
<p>Toate acestea au folosit <strong>Internetul</strong>. Dar n-ai făcut același lucru de fiecare dată: o dată ai privit, o dată ai vorbit, o dată te-ai jucat.</p>
<p>Azi afli ce este Internetul, ce feluri de a-l folosi are și cum îl alegi pe cel potrivit pentru ce vrei să faci.</p>
${IMG.apel}`},
  /* ---- pasul 1: rețea, Internet, conexiune ---- */
  {t:'Internetul: o rețea de rețele',
   text:`<p>O <mark>rețea</mark> înseamnă mai multe calculatoare, telefoane și alte aparate legate între ele, ca să schimbe date. Le leagă un cablu sau o legătură fără fir. Acasă și la școală, legătura fără fir e de obicei <strong>Wi-Fi</strong> (se citește „uai-fai”).</p>
<p>Calculatoarele unei școli pot forma o rețea. Telefoanele și laptopul unei familii formează altă rețea, acasă.</p>
<p><mark>Internetul</mark> leagă între ele rețelele din toată lumea: este o rețea de rețele.</p>
<p>Un aparat intră pe Internet doar dacă are o <mark>conexiune</mark>: un cablu, Wi-Fi sau <strong>datele mobile</strong>, adică Internetul pe care telefonul îl primește prin antenele de telefonie: tot fără fir, dar nu e Wi-Fi.</p>
${IMG.wifi}`,
   exemplu:`<p>Îi trimiți verișoarei din alt oraș o poză de pe telefon:</p><ol><li>poza pleacă din telefonul tău spre aparatul de Wi-Fi al casei;</li><li>de acolo trece prin multe rețele legate între ele: asta e Internetul;</li><li>ajunge pe telefonul verișoarei, care are și el o conexiune.</li></ol><p>Ții minte de la lecția 3? Un sistem de comunicații duce date la distanță. Prin Internet, datele ajung chiar și în altă țară.</p>`,
   altfel:`<p>Gândește-te la drumuri. Ulițele unui sat leagă casele între ele: sunt ca o rețea mică. Șoselele leagă satele și orașele între ele, până în alte țări. Internetul e ca toate drumurile lumii la un loc. Ca să pleci la drum, casa ta are nevoie de o ieșire spre stradă: ea e ca o conexiune.</p>`,
   incearca:{t:'classify',q:'Acum, aparatul acesta poate intra pe Internet? Sortează: da sau nu.',cats:['Da','Nu'],
    items:[['Tableta din sufragerie, legată prin Wi-Fi la aparatul de Wi-Fi al casei, care merge',0],['Telefonul mamei, în parc, departe de orice Wi-Fi, cu datele mobile pornite',0],['Laptopul vechi din pod: fără cablu, cu Wi-Fi-ul oprit',1],['Calculatorul din laborator, legat cu un cablu de rețeaua școlii, care are Internet',0],['Telefonul vechi din sertar: fără cartelă de telefon și cu Wi-Fi-ul oprit',1]],
    ajutor:'La fiecare aparat, uită-te dacă are măcar una dintre cele trei conexiuni din pas: cablu, Wi-Fi sau date mobile.',
    why:'Tableta are Wi-Fi, telefonul mamei are datele mobile, iar calculatorul din laborator are un cablu spre o rețea legată de Internet. Laptopul din pod n-are nicio conexiune. Telefonul din sertar nici el: fără cartelă nu primește date mobile, iar Wi-Fi-ul e oprit.'},
   inca:[
    {t:'choice',q:'Ana spune: „Internetul e cablul care iese din calculatorul meu.” Ce îi spui?',
     o:['Cablul e doar conexiunea; Internetul leagă rețele din toată lumea','Are dreptate: Internetul e chiar cablul acela, nimic mai mult','Nu e cablul: Internetul e o aplicație din meniul Start'],ok:0,
     ajutor:'Recitește ce este Internetul și ce este o conexiune.',
     why:'Internetul e rețeaua de rețele care leagă aparate din toată lumea. Cablul doar leagă calculatorul Anei de o rețea: e conexiunea lui. Internetul nu e nici o aplicație.'}
   ]},
  /* ---- pasul 2: serviciu; web-ul (pagini, site, browser) + adresa web, doar recunoscută ---- */
  {t:'Serviciile Internetului. Primul: web-ul',
   text:`<p>Prin Internet poți face lucruri diferite: citești, scrii, vorbești, privești, te joci. Fiecare fel de a folosi Internetul, pentru o nevoie anume, se numește <mark>serviciu</mark>.</p>
<p>Primul e <mark>web-ul</mark> (se citește „ueb”; pe nume întreg, World Wide Web). El e făcut din <mark>pagini web</mark>: pagini cu text, imagini și filme, pe care le citești pe ecran. Paginile aceluiași proprietar formează un <mark>site</mark> (se citește „sait”): site-ul școlii, site-ul unui muzeu. Și LearningHub, unde citești lecția, e un site.</p>
<p>Paginile web le deschizi cu o aplicație numită <mark>browser</mark> (se citește „brauzăr”), de exemplu Microsoft Edge sau Google Chrome.</p>
${IMG.pagina}`,
   exemplu:`<p>Fiecare pagină web are o <mark>adresă web</mark>: după ea o găsește browserul, cum găsește poștașul o casă după adresa ei. În captură, sus: <code>https://ro.wikipedia.org/wiki/Lup_cenușiu</code>.</p><p>O adresă web e scrisă legat, fără spații, cu puncte între părți. De cele mai multe ori începe cu <code>https://</code> sau cu <code>www.</code>, ca <code>www.muzeu-exemplu.ro</code>. Adresele din lecție sunt inventate, în afară de cea din captură.</p>`,
   altfel:`<p>Gândește-te la o bibliotecă uriașă. Fiecare pagină web e ca o foaie dintr-o carte. Un site e ca o carte întreagă: toate foile ei sunt ale aceluiași proprietar, chiar dacă le-au scris mai mulți oameni. Browserul e ca ochelarii cu care citești foile. Adresa web e ca locul cărții pe raft: după ea o găsești.</p>`,
   incearca:{t:'classify',q:'Folosește web-ul? Sortează: da sau nu.',cats:['Da','Nu'],
    items:[['Ioana află de pe site-ul grădinii zoologice la ce oră primesc pinguinii mâncare',0],['Matei desenează un dinozaur în Paint, pe calculatorul de acasă',1],['Bunicul citește vremea de mâine pe pagina unei televiziuni, în browser',0],['Sara adună 125 și 79 cu aplicația Calculator',1],['Andrei se uită pe site-ul școlii în ce zi e serbarea',0]],
    ajutor:'La fiecare, întreabă-te: citește o pagină web, de pe un site? Sau lucrează doar într-o aplicație care nu deschide pagini?',
    why:'Ioana, bunicul și Andrei citesc pagini de pe un site: folosesc web-ul. Matei și Sara lucrează în aplicații care nu deschid pagini web: Paint și Calculatorul merg și fără Internet.'},
   inca:[
    {t:'choice',q:'Care dintre acestea este un serviciu al Internetului?',o:['Web-ul, cu paginile lui','Aparatul de Wi-Fi al casei','Cablul care leagă calculatorul de rețea','Aplicația Paint'],ok:0,
     ajutor:'Recitește primul paragraf al pasului: ce înseamnă un serviciu?',
     why:'Un serviciu e un fel de a folosi Internetul, pentru o nevoie anume: web-ul e unul, cu el citești pagini. Aparatul de Wi-Fi și cablul sunt conexiuni, nu servicii. Paint merge și fără Internet.'},
    {t:'choice',q:'Vrei să deschizi o pagină web. Ce aplicație pornești?',o:['Un browser, de exemplu Microsoft Edge','Paint, aplicația de desenat','Calculatorul, aplicația de socotit'],ok:0,
     ajutor:'Recitește ultimul paragraf al pasului.',
     why:'Paginile web se deschid cu un browser: Microsoft Edge, Google Chrome sau altul. Paint desenează, iar Calculatorul socotește: niciunul nu deschide pagini web.'}
   ]},
  /* ---- pasul 3: poșta electronică; adresa cu @; adresă web sau de e-mail (metoda) ---- */
  {t:'Poșta electronică: scrisori prin Internet',
   text:`<p><mark>Poșta electronică</mark>, pe scurt <mark>e-mail</mark> (se citește „i-meil”), e serviciul cu care trimiți scrisori prin Internet. Scrisoarea se numește tot e-mail sau mesaj.</p>
<p>O trimiți la o <mark>adresă de e-mail</mark>. Ea are mereu semnul <code>@</code> (îi spunem „a rond”): în stânga lui e numele ales de om, în dreapta, numele serviciului de poștă sau al școlii, al clubului care i-a dat adresa.</p>
<p>Mesajul ajunge repede și <strong>așteaptă</strong> în căsuța poștală a celuilalt, locul cu mesajele lui primite, până o deschide, chiar și a doua zi. De mesaj poți lipi și un fișier, de exemplu o poză.</p>
<p>Cum îți faci adresa ta și cum scrii un e-mail înveți în clasa a VI-a.</p>
${IMG.adresa}`,
   exemplu:`<p>Adresă web sau adresă de e-mail? Pune-ți întrebările în ordine:</p><ol><li>Începe cu <code>https://</code> sau cu <code>www.</code>? → adresă web.</li><li>Are un <code>@</code> între două nume, scrise legat? → adresă de e-mail.</li><li>N-are <code>@</code>, dar e scrisă legat, iar la sfârșit are un punct și o terminație de site, ca <code>.ro</code>, <code>.com</code>, <code>.org</code> sau <code>.eu</code>? → tot adresă web.</li><li>Are spații între cuvinte? → nu e o adresă.</li></ol><p><code>mihai.ionescu@posta-exemplu.ro</code>: la întrebarea 1, nu; la 2, da → adresă de e-mail.</p>`,
   altfel:`<p>E ca la poșta obișnuită. Scrii o scrisoare, pui pe plic adresa bunicii, iar poștașul i-o lasă în cutia poștală. Bunica o citește când ajunge acasă. La e-mail, plicul e adresa cu @, poștașul e serviciul de poștă, iar cutia e căsuța ei poștală, pe Internet.</p>`,
   incearca:{t:'classify',q:'Adresă web, adresă de e-mail sau nicio adresă? Sortează. (Adresele sunt inventate.)',cats:['Adresă web','Adresă de e-mail','Nu e o adresă'],
    items:[['www.biblioteca-exemplu.ro',0],['bunica.elena@posta-exemplu.ro',1],['https://zoo-exemplu.ro/pinguini',0],['clasa a cincea B',2],['echipa.sah@club-exemplu.ro',1],['muzeu-exemplu.ro',0]],
    ajutor:'Pune fiecăreia întrebările din „Uite cum”, în ordine: cum începe, are @, cum se termină, are spații.',
    why:'www.biblioteca-exemplu.ro și https://zoo-exemplu.ro/pinguini încep ca adresele web; muzeu-exemplu.ro n-are @ și se termină cu .ro: e tot adresă web. Cele cu @ între două nume scrise legat sunt adrese de e-mail: în dreapta e numele serviciului de poștă sau al clubului. „clasa a cincea B” are spații: nu e o adresă.'},
   inca:[
    {t:'choice',q:'Vrei să-i scrii doamnei învățătoare. Care dintre acestea poate fi adresa ei de e-mail? (Toate sunt inventate.)',o:['invatatoare.maria@scoala-exemplu.ro','www.scoala-exemplu.ro/invatatoare','https://scoala-exemplu.ro/maria','invatatoare maria scoala'],ok:0,
     ajutor:'Care are semnul @ între două nume, scrise legat?',
     why:'Doar invatatoare.maria@scoala-exemplu.ro are @ între două nume scrise legat: numele doamnei învățătoare și numele școlii. Cele care încep cu www. sau cu https:// sunt adrese web; cea cu spații nu e o adresă.'}
   ]},
  /* ---- pasul 4: servicii „pe loc”: mesageria (cu apelurile video), streamingul, jocurile online ---- */
  {t:'Pe loc: mesageria, streamingul, jocurile online',
   text:`<p>La alte servicii, totul se întâmplă pe loc, chiar în timp ce ești conectat:</p>
<ul><li><mark>mesageria</mark> sau chatul (se citește „ceat”): scrii mesaje scurte, iar celălalt, dacă e conectat, le vede imediat și îți răspunde. Tot aici sunt <mark>apelurile video</mark>: vă vedeți și vă auziți, ca în fotografia de la începutul lecției;</li>
<li><mark>streamingul</mark> (se citește „strimingul”): privești un film sau asculți muzică în timp ce vin prin Internet, bucată cu bucată, fără să aștepți să ajungă tot;</li>
<li><mark>jocurile online</mark>: te joci prin Internet cu alții, fiecare la aparatul lui. <strong>Online</strong> (se citește „onlain”) înseamnă „conectat la Internet”.</li></ul>`,
   exemplu:`<p>O seară a lui Mihai:</p><ul><li>îi scrie Anei pe chat „Ai terminat tema?”, iar ea îi răspunde imediat: mesagerie;</li><li>o sună pe video pe bunica, iar ea îi arată cozonacul: tot mesagerie, un apel video;</li><li>ascultă o melodie care vine prin Internet: streaming;</li><li>joacă șah cu un coleg, fiecare de acasă: joc online.</li></ul>`,
   altfel:`<p>Gândește-te la o scrisoare și la o convorbire. Scrisoarea stă în cutia poștală până o deschizi: așa e e-mailul. Convorbirea se întâmplă chiar acum, cât sunteți amândoi la telefon. Serviciile din pasul acesta seamănă cu convorbirea: le folosești pe loc, cât ești conectat.</p>`,
   incearca:{t:'bilete',q:'Pe tablă sunt trei grupe goale. Lipește bilețelele pe grupe, apoi alege numele fiecărei grupe. (În listă sunt și nume care nu-ți trebuie aici.)',
    nume:NUME,grupe:3,
    bilete:[
     {id:'p1',s:'mesagerie',text:'Eva și verișoara ei din Spania se văd și își vorbesc, pe tabletă.'},
     {id:'p2',s:'streaming',text:'Tata ascultă, pe telefon, un post de radio care vine prin Internet.'},
     {id:'p3',s:'jocuri',text:'Doi veri construiesc împreună un castel într-un joc, fiecare din casa lui.'},
     {id:'p4',s:'mesagerie',text:'Mama îi scrie colegei ei „Ajung în 5 minute”, iar colega îi răspunde imediat.'},
     {id:'p5',s:'streaming',text:'Bianca privește un documentar despre balene, în timp ce vine prin Internet.'},
     {id:'p6',s:'jocuri',text:'Sora mea a făcut un puzzle împreună cu o prietenă, fiecare de pe tableta ei, prin Internet.'}],
    gresit:{bilet:'p1',la:'p5'},
    solutieText:'mesagerie (Eva și verișoara, mama și colega), streaming (radioul tatei, documentarul Biancăi), jocuri online (castelul verilor, puzzle-ul surorii).',
    ajutor:'La fiecare bilețel, întreabă-te: vorbește cu cineva? Privește sau ascultă ceva care vine? Se joacă împreună cu alții?',
    why:'Eva și mama vorbesc pe loc cu cineva: mesagerie (Eva, printr-un apel video). Tata și Bianca ascultă și privesc ceva care vine prin Internet, bucată cu bucată: streaming. Verii și sora se joacă împreună cu alții, prin Internet: jocuri online.'},
   inca:[
    {t:'tf',q:'La streaming, aștepți întâi să ajungă tot filmul și abia apoi începi să-l privești.',ok:false,
     ajutor:'Recitește ce înseamnă „bucată cu bucată”.',
     why:'Fals. La streaming privești în timp ce filmul vine, bucată cu bucată; nu aștepți să ajungă tot.'}
   ]},
  /* ---- pasul 5: alegi serviciul potrivit (strategia, în ordine) ---- */
  {t:'Alegi serviciul potrivit',
   text:`<p>Înainte să alegi, spune în cuvinte ce vrei să faci. Apoi pune-ți întrebările de mai jos, <strong>în ordinea asta</strong>. Primul „da” îți arată serviciul.</p>
<ol><li>Vreau să mă joc cu alții, prin Internet? → <b>joc online</b></li>
<li>Vreau să privesc un film sau să ascult muzică, acum, prin Internet? → <b>streaming</b></li>
<li>Vreau să vorbesc sau să mă văd pe loc cu cineva, în scris sau pe video? → <b>mesagerie</b></li>
<li>Vreau să trimit o scrisoare la o adresă cu @? → <b>poștă electronică</b></li>
<li>Vreau să citesc pagini despre ceva, pe un site? → <b>web</b></li></ol>
<p>Niciun „da”? Poate nu-ți trebuie Internetul: Paint și Calculatorul merg și fără el.</p>`,
   exemplu:`<p>„Vreau să-i trimit bunicii poza cu pisica.” Spune mai exact cum:</p><ul><li>„…s-o vadă acum și să-mi răspundă pe loc.” Întrebările 1 și 2: nu. Întrebarea 3: da → <b>mesagerie</b>.</li><li>„…lipită de o scrisoare, la adresa ei de e-mail.” Întrebările 1, 2 și 3: nu. Întrebarea 4: da → <b>poștă electronică</b>.</li></ul><p>Aceeași dorință, două servicii: contează cum vrei s-o primească.</p>`,
   altfel:`<p>E ca atunci când alegi cum mergi la bunica. Întâi spui unde mergi și cât de repede vrei să ajungi. Abia apoi alegi: pe jos, cu bicicleta sau cu autobuzul. La fel, întâi spui ce vrei să faci, apoi alegi serviciul.</p>`,
   incearca:{t:'classify',q:'Ce serviciu alegi pentru fiecare dorință? Sortează.',cats:['Joc online','Streaming','Mesagerie','Poștă electronică','Web'],
    items:[['Vrei să asculți acum melodia ta preferată, care vine prin Internet',1],['Vrei ca verișoara să-ți vadă acum, pe video, cățelul cum aleargă prin curte',2],['Vrei să afli ce animale are grădina zoologică din oraș, citind despre ele',4],['Vrei să-i trimiți doamnei învățătoare desenul tău, la adresa ei cu @',3],['Vrei să faci o partidă de șah cu bunicul, fiecare de acasă',0]],
    ajutor:'Pune fiecărei dorințe cele cinci întrebări din pas, în ordine, și oprește-te la primul „da”.',
    why:'Melodia care vine prin Internet: streaming. Cățelul: la întrebarea 1, nu, nu te joci cu alții; la 2, nu, nu privești un film care vine prin Internet; la 3, da, tu și verișoara vă vedeți pe loc, pe video → mesagerie, cu un apel video. Ca să citești despre animale: web, pe site-ul grădinii. Scrisoarea cu desenul, la o adresă cu @: poștă electronică. Partida de șah cu bunicul, fiecare de acasă: joc online.'},
   inca:[
    {t:'choice',q:'Vrei să vezi pe tabletă meciul echipei tale, chiar în timp ce se joacă. Ce serviciu alegi?',o:['Streaming','Web','Poștă electronică','Joc online'],ok:0,
     ajutor:'Pune-ți întrebările din pas, în ordine. La care ai primul „da”?',
     why:'Întrebarea 1: nu, nu te joci tu. Întrebarea 2: da, privești acum, prin Internet → streaming.'}
   ]}
 ],
 /* ---- ATELIERUL: bilețelele profesorului, pe tablă (simulatorul nou lectii/_sim/bilete-servicii.js) ---- */
 atelier:{t:'bilete',titlu:'Atelier: bilețelele de pe tablă',
  intro:`<p><strong>Sarcina:</strong> zece colegi au scris pe bilețele ce au făcut pe Internet săptămâna trecută. Lipește bilețelele pe tablă, pe grupe, apoi dă un nume fiecărei grupe.</p>
<ol><li>Atinge un bilețel din teanc: îl iei.</li><li>Sub el apare rândul <b>Lipește-l la</b>, cu grupele tablei: atinge grupa în care îl pui. Bilețelele despre același serviciu stau în aceeași grupă.</li><li>Te-ai răzgândit? Atinge bilețelul de pe tablă și lipește-l în altă parte.</li><li>La fiecare grupă, alege din lista <b>Numele grupei</b> serviciul ei.</li><li>Apasă <b>Verifică tabla</b>: testele de dedesubt se bifează.</li></ol>
<p>La fiecare bilețel, pune-ți întrebările din pasul „Alegi serviciul potrivit”.</p>`,
  q:'Lipește cele zece bilețele pe tablă, pe grupe, și dă fiecărei grupe numele serviciului ei.',
  nume:NUME,
  bilete:[
   {id:'b1',s:'web',text:'Am citit despre rechinul-balenă pe o enciclopedie de pe Internet.'},
   {id:'b2',s:'web',text:'Am văzut pe pagina școlii în ce zi e serbarea.'},
   {id:'b3',s:'posta',text:'Cu mama, i-am trimis bunicului o scrisoare cu poze, la adresa lui cu @.'},
   {id:'b4',s:'posta',text:'Clubul de înot i-a trimis tatei programul într-o scrisoare care l-a așteptat până seara.'},
   {id:'b5',s:'mesagerie',text:'Am vorbit cu mătușa din Italia și ne-am văzut pe ecran.'},
   {id:'b6',s:'mesagerie',text:'Am întrebat-o pe colega mea, în scris, ce avem la mate, iar ea mi-a răspuns imediat.'},
   {id:'b7',s:'streaming',text:'Am privit desene animate care veneau prin Internet, fără să aștept tot filmul.'},
   {id:'b8',s:'streaming',text:'Am ascultat la tabletă melodii care veneau prin Internet.'},
   {id:'b9',s:'jocuri',text:'Am construit un oraș într-un joc, împreună cu un coleg, fiecare de acasă.'},
   {id:'b10',s:'jocuri',text:'Am jucat șah prin Internet cu bunicul, fiecare la calculatorul lui.'}
  ],
  gresit:{bilet:'b5',la:'b7'},
  solutieText:'cinci grupe, câte două bilețele: web (enciclopedia, pagina școlii), poștă electronică (scrisoarea către bunicul, programul de la clubul de înot), mesagerie (mătușa din Italia, colega), streaming (desenele animate, melodiile), jocuri online (orașul construit, șahul cu bunicul).',
  ajutor:'La fiecare bilețel întreabă-te, în ordine: se joacă cu alții? Privește sau ascultă ceva care vine prin Internet? Vorbește sau se vede pe loc cu cineva? Trimite o scrisoare la o adresă cu @? Citește pagini pe un site?',
  why:'Pe tablă sunt cinci grupe. Web: paginile citite pe un site sau pe o enciclopedie de pe Internet. Poștă electronică: scrisorile trimise la o adresă cu @, care așteaptă până sunt citite. Mesagerie: vorbitul pe loc, în scris sau pe video. Streaming: filmele și melodiile care vin prin Internet. Jocuri online: jocurile cu alții, fiecare de acasă.',
  inca:[
   {t:'bilete',q:'Altă tablă: șase bilețele, trei grupe. Lipește-le pe grupe și alege numele fiecărei grupe. (În listă sunt și nume care nu-ți trebuie.)',
    nume:NUME,grupe:3,
    bilete:[
     {id:'c1',s:'posta',text:'I-am scris unchiului o scrisoare la adresa lui cu @, iar el a citit-o a doua zi.'},
     {id:'c2',s:'mesagerie',text:'Am vorbit pe video cu vărul meu din Anglia.'},
     {id:'c3',s:'streaming',text:'Am ascultat o poveste citită de un actor, care venea prin Internet.'},
     {id:'c4',s:'mesagerie',text:'Bunica mi-a trimis pe chat o poză, iar eu i-am răspuns imediat.'},
     {id:'c5',s:'streaming',text:'Am privit un film cu dinozauri, în timp ce venea prin Internet.'},
     {id:'c6',s:'posta',text:'Școala le-a trimis părinților, la adresele lor cu @, programul serbării.'}
    ],
    gresit:{bilet:'c4',la:'c1'},
    solutieText:'trei grupe: poștă electronică (scrisoarea către unchiul, programul serbării), mesagerie (vărul din Anglia, bunica pe chat), streaming (povestea citită de actor, filmul cu dinozauri).',
    ajutor:'O poză se poate trimite în două feluri. Uită-te cum a primit-o celălalt: pe loc, pe chat, sau într-o scrisoare la o adresă cu @?',
    why:'Scrisorile la o adresă cu @ sunt poștă electronică. Vorbitul pe video și poza trimisă pe chat, cu răspuns imediat, sunt mesagerie. Povestea și filmul care vin prin Internet sunt streaming.'}
  ]},
 /* ---- VERIFICAREA: 5 întrebări, variante-soră ale exercițiilor (alte situații, alte adrese) ---- */
 qs:[
  {t:'choice',q:'Robert spune: „Internetul și web-ul sunt același lucru.” Ce îi răspunzi?',
   o:['Nu: Internetul e rețeaua de rețele, iar web-ul e un serviciu al ei','Are dreptate: sunt două nume pentru același lucru','Nu: web-ul e rețeaua, iar Internetul e o singură pagină','Nu: Internetul e chiar aplicația Microsoft Edge'],ok:0,
   ajutor:'Care dintre ele leagă rețelele lumii și care e un fel de a folosi Internetul?',
   why:'Internetul e rețeaua care leagă rețelele din toată lumea. Web-ul e unul dintre serviciile lui, alături de poșta electronică, mesagerie, streaming și jocurile online. Microsoft Edge e un browser: aplicația cu care deschizi paginile web.'},
  {t:'classify',q:'Teo a copiat niște rânduri de pe afișul clubului de șah. Ce este fiecare? Sortează. (Toate sunt inventate.)',cats:['Adresă web','Adresă de e-mail','Nu e o adresă'],
   items:[['atlas-animale-exemplu.com',0],['club.sah@posta-exemplu.com',1],['biblioteca orașului .ro',2],['https://muzeul-satului-exemplu.org',0],['teo.marin@scoala-exemplu.ro',1],['www.parc-exemplu.eu',0]],
   ajutor:'Pune fiecărui rând întrebările din „Uite cum”, în ordine: cum începe, are @ între două nume, cum se termină, are spații.',
   why:'https://muzeul-satului-exemplu.org și www.parc-exemplu.eu încep ca adresele web. atlas-animale-exemplu.com n-are @, e scrisă legat și se termină cu .com: tot adresă web. club.sah@posta-exemplu.com și teo.marin@scoala-exemplu.ro au @ între două nume scrise legat: sunt adrese de e-mail. „biblioteca orașului .ro” are spații: nu e o adresă, chiar dacă se termină cu .ro.'},
  {t:'match',q:'Ce serviciu se potrivește fiecărei dorințe? Leagă.',

   ajutor:'Pune fiecărei dorințe întrebările din pasul „Alegi serviciul potrivit”, în ordine.',
   why:'Concertul care vine prin Internet: streaming. Întrebarea pusă pe loc, în scris: mesagerie. Cititul pe o enciclopedie de pe Internet: web. Scrisoarea la o adresă cu @: poștă electronică. Cursa cu prietenul, fiecare la calculatorul lui: joc online.'},
  {t:'choice',q:'Ce îi trebuie tabletei tale ca să poți vorbi pe video cu bunica?',
   o:['O conexiune la Internet, de exemplu Wi-Fi','O imprimantă legată de tabletă','Aplicația Paint, pentru desene','Un stick pus în tabletă'],ok:0,
   ajutor:'Fără ce nu intră un aparat pe Internet?',
   why:'Apelul video e un serviciu al Internetului, deci tableta are nevoie de o conexiune: Wi-Fi, cablu sau date mobile. Imprimanta, Paint și stickul nu o leagă de Internet.'},
  {t:'choice',q:'Diana îi trimite Elenei un e-mail la prânz. Elena e la școală și își deschide căsuța poștală abia seara. Ce se întâmplă cu mesajul?',

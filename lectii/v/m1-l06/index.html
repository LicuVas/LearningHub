/* tema: aceeași placă ca la lecțiile 4-5 (unitatea V-U1); în bandă, un stick și bara de ocupare a unui disc */
.banda{display:flex;align-items:center;gap:14px;padding:7px 14px;white-space:nowrap;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--trace) 35%,transparent) 22px 23px),var(--pcb);
  border-bottom:2px solid var(--trace)}
.banda span{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:.62rem;letter-spacing:.06em;color:#D9CFC6}
.banda .stick{display:inline-block;width:30px;height:11px;border-radius:2px 5px 5px 2px;background:#4B5A57;border:2px solid #9AA3A0;position:relative;margin-left:9px}
.banda .stick::before{content:"";position:absolute;left:-10px;top:1px;width:8px;height:5px;background:#C9CFCD;border:1px solid #9AA3A0}
.banda .ocupat{display:inline-block;width:64px;height:8px;background:#56615E;border:1px solid #9AA3A0}
.banda .ocupat::before{content:"";display:block;width:58%;height:100%;background:var(--bara)}
h1,h2{font-weight:700;letter-spacing:0}
/* galeria cu dispozitive: fotografii reale, fiecare cu numele dedesubt (ca la lecția 5) */
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:.7em 0 .2em}
.galerie .captura{margin:0}
.galerie .captura img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.galerie .captura figcaption{text-align:center;font-weight:800;color:var(--ink);font-size:.93rem;margin-top:.25em}
.galerie.etichete{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.galerie.etichete .captura img{aspect-ratio:auto;width:auto;height:auto;max-width:100%;max-height:160px;margin:0 auto;background:none}
.galerie.etichete .captura figcaption{font-weight:600;font-size:.84rem}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:800;color:var(--accent)}
.galerie-credit{font-size:.78rem;color:var(--ink2);line-height:1.35;margin:.3em 0 .9em}
/* un byte scris ca opt cifre */
.biti{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.biti i{font-style:normal;font-family:var(--fm);font-weight:600;width:1.45em;text-align:center;border:1.5px solid var(--line);border-radius:4px;background:var(--paper2)}
/* scara unităților, în HTML (nu imagine): se așază pe mai multe rânduri pe telefon */
.scara{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 2px;margin:.6em 0 .5em}
.scara .gr{display:inline-flex;align-items:flex-end}
.scara .tr{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.scara .tr b{display:block;font-family:var(--fd);font-size:1rem;border:2px solid var(--accent);border-radius:7px;background:var(--paper);padding:3px 8px;min-width:44px;text-align:center}
.scara .tr.pb b{border-style:dashed}
.scara .tr small{font-size:.72rem;color:var(--ink2)}
.scara .sg{font-family:var(--fm);font-size:.72rem;color:var(--accent);padding:0 2px 10px;white-space:nowrap}
/* schema „Ce am învățat” (HTML, nu imagine), ca la lecțiile 4-5 */
.schema{display:grid;gap:6px;justify-items:center;margin:12px auto 14px;max-width:520px}
.sc-box{border:2px solid var(--accent);border-radius:10px;background:var(--paper);padding:6px 12px;text-align:center;width:100%;line-height:1.3}

<script>
/* Lecția 6, clasa a V-a (M1): „Dispozitive de stocare. Unități de măsură: bit, byte, KB, MB, GB, TB”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele: surse.md.
   Simulatorul „fotografie” (etichete / categorii pe fotografii reale) e fișierul comun lectii/_sim/fotografie.js (de pe 27.09 seara întreținut de autorul acestei lecții: zone rotunde, Q.marire).
   Unitățile: o treaptă = 1024 (programa și materialul profesorului; tot așa arată Windows mărimile). Fabricanții: 1000 (surse.md). */
const LIC={
  pd:'domeniu public',
  by2:'<a href="https://creativecommons.org/licenses/by/2.0/deed.ro" target="_blank" rel="noopener">CC BY 2.0</a>',
  bysa2:'<a href="https://creativecommons.org/licenses/by-sa/2.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 2.0</a>',
  bysa3:'<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 3.0</a>',
  bysa4:'<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 4.0</a>'
};
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
/* dispozitivele de stocare: fotografia, mărimea reală, descrierea (alt) și sursa de pe Commons [fișier, autor, licență] */
const D={
  hdd:['hdd-deschis.webp',520,453,'Un hard disk fără capac: înăuntru, un disc rotund, lucios ca oglinda, și un braț subțire deasupra lui',['Open_hard-drive.jpg','Zzubnik',LIC.pd]],
  ssd:['ssd.webp',304,225,'Un SSD: o cutie plată, gri închis, dreptunghiulară, cu o etichetă albă pe ea',['Crucial_CT256M4SSD2_rear_20120123.jpg','Djsumdog',LIC.bysa3]],
  stick:['stick.webp',420,236,'Un stick USB gri închis, cu capătul de metal în stânga; pe el scrie PNY și 16GB',['PNY_USB_flash_drive_%2816GB%29%2C_Hillegersberg%2C_Rotterdam_%282020%29_01.jpg','Donald Trung Quoc Don',LIC.bysa4]],
  card:['card.webp',420,324,'Un card de memorie mic, roșu cu gri, pe care scrie SanDisk Ultra și 32GB',['SanDisk_Ultra_microSDHC_card%2C_32GB.png','Paowee',LIC.bysa4]],
  extern:['disc-extern.webp',360,493,'Un hard disk extern: o cutie neagră, lucioasă, cât o palmă, pe care scrie SAMSUNG',['Samsung_S2_Portable_320GB_%281%29.jpg','Ryse93',LIC.bysa4]],
  cd:['cd.webp',420,420,'Un CD argintiu, rotund, cu gaură la mijloc; pe el scrie Verbatim, CD-R și 700MB',['Verbatim_CD-R_700MB_52x_Disc_%28Front%29.jpg','Dillan Payne',LIC.bysa4]]
};
const galerie=lista=>`<div class="galerie">${lista.map(([k,nume])=>{const [f,w,h,alt]=D[k];
  return `<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${nume}</figcaption></figure>`}).join('')}</div>
<p class="galerie-credit">Foto, Wikimedia Commons: ${lista.map(([k])=>{const s=D[k][4];return `${wc(s[0],s[1])} (${s[2]})`}).join(', ')}; prelucrate.</p>`;
/* etichetele de capacitate din fotografia atelierului, decupate mărite din original (judecătorul, m2): elevul chiar le citește */
const ETICHETE=`<div class="galerie etichete">${[['eticheta-stick.webp',483,360,'Stickul USB','De aproape, pe stick: 2 GB'],
  ['eticheta-card-mare.webp',446,360,'Cardul mare, albastru cu roșu','De aproape, pe cardul mare: 2.0 GB, CompactFlash'],
  ['eticheta-card-mic.webp',569,360,'Cardul mic, albastru','De aproape, pe cardul mic: 16GB'],
  ['eticheta-dvd.webp',439,360,'DVD-ul argintiu','De aproape, pe DVD: 4.7GB'],
  ['eticheta-cd.webp',610,360,'CD-ul albastru','De aproape, pe CD: 700MB']].map(([f,w,h,nume,alt])=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${nume}</figcaption></figure>`).join('')}</div>
<p class="galerie-credit">Foto: avaragado, ${wc('Forty_years_of_Removable_Storage.jpg','Wikimedia Commons')}, ${LIC.by2}; bucăți decupate și mărite.</p>`;
const CR={
  medii:`<small>Foto: Eivind N. Tangen, ${wc('Digitale_medier.jpg','Wikimedia Commons')}, ${LIC.bysa4}; micșorată.</small>`,
  mufe:`<small>Foto: William Hook, ${wc('Antec_P182_-_Front_Panel.jpg','Wikimedia Commons')}, ${LIC.bysa2}; decupată.</small>`,
  carduri:`Foto: Dillan Payne, ${wc('SanDisk_SD_Cards_128MB_and_32GB.jpg','Wikimedia Commons')}, ${LIC.bysa4}; micșorată.`,
  stocare40:`Foto: avaragado, ${wc('Forty_years_of_Removable_Storage.jpg','Wikimedia Commons')}, ${LIC.by2}; micșorată.`
};
const IMG={
  medii:fig('stocare-obiecte.webp',560,664,'Pe o masă: un stick USB prins de un breloc, un card de memorie negru și două discuri rotunde, lucioase, unul peste altul','Un stick USB prins de un breloc, un card de memorie și două discuri: toate păstrează date. '+CR.medii),
  stocare:galerie([['hdd','Hard diskul (desfăcut)'],['ssd','SSD-ul'],['stick','Stickul USB'],['card','Cardul de memorie'],['extern','Hard diskul extern'],['cd','CD-ul']]),
  mufe:fig('mufe-usb.webp',360,391,'Fața unei unități centrale, de aproape: sus, două mufe dreptunghiulare, una lângă alta; dedesubt, două mufe mici, rotunde','Pe fața unei unități centrale: sus, <b>două mufe USB</b>; dedesubt, două mufe rotunde, pentru microfon și pentru căști. '+CR.mufe),
  discC:fig('acest-pc-disc-c.webp',330,72,'Un rând de pe ecranul calculatorului: Disc local (C:), o bară albastră umplută cam pe jumătate și dedesubt textul 198 GB liber din 475 GB','Discul C: al unui calculator, pe ecran. Partea albastră a barei e locul ocupat. <small>Captură din Windows, în română.</small>'),
  stick16:fig('stick.webp',420,236,'Un stick USB gri închis, cu capătul de metal în stânga; pe el scrie PNY și 16GB','Pe stick scrie <b>16GB</b>: capacitatea lui. <small>Foto: Donald Trung Quoc Don, '+wc('PNY_USB_flash_drive_%2816GB%29%2C_Hillegersberg%2C_Rotterdam_%282020%29_01.jpg','Wikimedia Commons')+', '+LIC.bysa4+'; decupată.</small>')
};
/* fotografii mici în enunțul exercițiilor */
const QI={
  acestpc:fig('acest-pc-capacitati.webp',330,334,'Trei rânduri de pe ecranul calculatorului: Disc local (C:) 198 GB liber din 475 GB; Volum nou (W:) 3,37 GB liber din 5,00 GB; My Passport (P:) 858 GB liber din 1,81 TB; sub fiecare, capacitatea totală scrisă mare, cu roșu','Trei discuri pe ecranul unui calculator. Cifrele mari, roșii, le-am scris noi peste captură: Windows nu le arată. Ele sunt capacitatea totală. <small>Captură din Windows, în română.</small>')
};
/* scara unităților (HTML, nu imagine) */
const SCARA=`<div class="scara" role="img" aria-label="Scara unităților, de la mică la mare: bit, byte (8 biți), KB, MB, GB, TB, PB; de la byte în sus, fiecare treaptă e de 1024 de ori mai mare">
  <span class="gr"><span class="tr"><b>bit</b><small>0 sau 1</small></span></span>
  <span class="gr"><span class="sg">8 ×</span><span class="tr"><b>B</b><small>byte</small></span></span>
  <span class="gr"><span class="sg">1024 ×</span><span class="tr"><b>KB</b><small>kilobyte</small></span></span>
  <span class="gr"><span class="sg">1024 ×</span><span class="tr"><b>MB</b><small>megabyte</small></span></span>
  <span class="gr"><span class="sg">1024 ×</span><span class="tr"><b>GB</b><small>gigabyte</small></span></span>
  <span class="gr"><span class="sg">1024 ×</span><span class="tr"><b>TB</b><small>terabyte</small></span></span>
  <span class="gr"><span class="sg">1024 ×</span><span class="tr pb"><b>PB</b><small>petabyte</small></span></span>
</div>`;
const BITI_A=`<span class="biti" aria-label="0 1 0 0 0 0 0 1"><i>0</i><i>1</i><i>0</i><i>0</i><i>0</i><i>0</i><i>0</i><i>1</i></span>`;
/* schema „Ce am învățat” */
const SCHEMA=`<div class="schema" role="img" aria-label="Schema: dispozitivele de stocare păstrează datele după oprire; unitățile, de la bit la PB; comparăm întâi unitatea, apoi numărul">
  <div class="sc-box"><b>Dispozitive de stocare</b><span>păstrează datele și după oprire: hard diskul, SSD-ul, stickul USB, cardul de memorie, hard diskul extern, CD-ul, DVD-ul</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Unitățile de măsură</b><span>bit → byte (8 biți) → KB → MB → GB → TB → PB; de la byte în sus, fiecare treaptă e de 1024 de ori mai mare</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Încape sau nu?</b><span>întâi unitatea, apoi numărul; încape dacă e mai mic decât locul liber</span></div>
</div>`;
const GRUPE=[{id:'da',et:'Încape filmul'},{id:'nu',et:'Nu încape filmul'}];

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).
   Totul se face DE PE SCAUN, fără cabluri, prize, mufe sau aplecat sub masă, și FĂRĂ profesor (la ora simultană e la cealaltă clasă). */
const LABORATOR=[
  'Stai pe scaun, la locul tău. <b>Nu atingi cablurile și prizele, nu bagi nimic în mufe și nu te apleci sub masă</b> (regula din lecția 2). Azi te uiți și scrii în caiet.',
  'Scrie în caiet titlul <b>Stocarea la calculatorul meu</b>. Uită-te de pe scaun: calculatorul tău are o unitate centrală separată, e un laptop sau are totul în spatele ecranului? Scrie ce vezi și unde stă, deci, discul lui. Nu-l vezi: stă înăuntru, iar carcasa nu se deschide.',
  'Caută din ochi mufele USB: găuri mici, dreptunghiulare, ca în fotografia de la pasul „Dispozitivele de stocare”. La un calculator de birou, uită-te pe fața unității centrale; la un laptop, pe marginile lui. Scrie câte vezi. Dacă unitatea centrală e sub masă, nu te apleca: scrie „nu se vede de pe scaun”.',
  'Scrie scara unităților, de la cea mai mică la cea mai mare: bit, byte, KB, MB, GB, TB, PB. Lângă byte, KB, MB, GB și TB, scrie câte un lucru care ocupă cam atât, din lista de la pasul „Scara unităților”.',
  'Pozele tale din vacanță ocupă 6 GB. Scrie pe care dintre acestea încap: un CD de 700 MB, un DVD de 4,7 GB, un stick gol de 32 GB. Lângă fiecare, scrie de ce, cu regula: întâi unitatea, apoi numărul. <details class="verif"><summary>Verifică-te, după ce ai scris</summary> CD-ul de 700 MB: nu încap (700 MB nu ajunge nici la 1 GB). DVD-ul de 4,7 GB: nu încap (4,7 e mai mic decât 6). Stickul gol de 32 GB: încap (32 e mai mare decât 6).</details>',
  'Compară caietul tău cu al colegului de bancă. Unde nu sunteți de acord, recitiți pasul „Capacitatea: cum compari două mărimi” și hotărâți împreună.'
];

JocMotor.porneste({
  cheie:'lectie_v_m1_l06',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 6”, pasul „Acum la calculatorul din laborator” înainte de verificare
  titlu:'Dispozitive de stocare. Unități de măsură: bit, byte, KB, MB, GB, TB',
  marca:'Lecția <b>6</b> · clasa a V-a',
  h1:'Dispozitive de stocare. Unități de măsură: bit, byte, KB, MB, GB, TB',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U1', unitateTitlu:'Sisteme de calcul. Lucrez corect și în siguranță',
  competente:['CS.1.1'], lectii:'6',
  ancoraText:'Din programă (CS.1.1, unitatea V-U1, lecția 6): Dispozitive de stocare a datelor: exemple de dispozitive de stocare a datelor · unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.) · comparație între dispozitivele de stocare în funcție de capacitate',
  intro:`<p>Afli ce aparate păstrează datele și după ce oprești calculatorul și cum se măsoară cât încape în ele. Înveți pe pași, cu fotografii adevărate. La atelier citești ce scrie pe câteva dispozitive dintr-o fotografie și alegi pe care încape un film. Apoi cauți, de pe scaun, unde păstrează datele calculatorul tău din laborator. La sfârșit verifici ce știi, cu 5 întrebări.</p>
<p><b>La final știi:</b> să dai exemple de dispozitive de stocare, să ordonezi unitățile de la bit la PB și să spui pe care dispozitiv încape ceva, după capacitatea lui.</p>
<p><b>Ai nevoie de:</b> lecția 4 — memoria RAM ține datele doar cât lucrezi și se golește când oprești calculatorul; discul păstrează ce ai salvat, și după oprire; lecția 5 — aparatele legate de unitatea centrală se numesc dispozitive (periferice); lecția 2 — în laborator nu atingi cablurile și prizele.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 6 pași scurți. Primul îți arată la ce folosește lecția; după fiecare dintre ceilalți faci un exercițiu mic, fără puncte.</li><li>La atelier pui etichete pe dispozitivele de stocare dintr-o fotografie: încape filmul sau nu?</li><li>Acum la calculatorul din laborator: cauți, de pe scaun, unde păstrează datele calculatorul tău și scrii în caiet.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,
  banda:'<span><i class="stick"></i>USB</span><span>B › KB › MB › GB › TB</span><span><i class="ocupat"></i>198 GB liber din 475 GB</span><span><i class="stick"></i>16 GB</span>',
  nivele:[
{t:'Dispozitive de stocare. Unități de măsură: bit, byte, KB, MB, GB, TB',final:true,lectii:[6],
 continuturi:['Dispozitive de stocare a datelor:','- exemple de dispozitive de stocare a datelor','- unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.)','- comparație între dispozitivele de stocare în funcție de capacitate'],
 obiectiv:'dai exemple de dispozitive care păstrează datele, ordonezi unitățile de la bit la PB și compari două capacități, ca să afli pe ce încape ceva.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: unde păstrezi pozele din excursie',
   text:`<p>Ai făcut multe poze în excursia clasei. Vrei să le păstrezi și peste ani, să le duci la bunica și să le vedeți împreună pe calculatorul ei.</p>
<p>La lecția 4 ai aflat că memoria RAM se golește când oprești calculatorul, iar discul păstrează ce salvezi. Dar discul stă înăuntrul calculatorului: nu-l iei cu tine.</p>
<p>Azi afli ce alte aparate păstrează datele, cum se măsoară cât încape în ele și cum alegi unul în care încap pozele tale.</p>
${IMG.medii}`},
  /* ---- pasul 1: dispozitivele de stocare ---- */
  {t:'Dispozitivele de stocare',
   text:`<p><mark>Dispozitivele de stocare</mark> păstrează datele și după ce oprești aparatul. „A stoca” înseamnă „a păstra”.</p>
<ul><li>în calculator: <strong>hard diskul</strong> (HDD), cu un disc care se învârte, sau <strong>SSD-ul</strong>, fără piese care se mișcă;</li>
<li><strong>stickul USB</strong>: îl bagi într-o mufă USB și îl porți în buzunar;</li>
<li><strong>cardul de memorie</strong>: stă în telefon sau în aparatul foto;</li>
<li><strong>hard diskul extern</strong>: un disc într-o cutie, legat cu un cablu USB;</li>
<li><strong>CD-ul</strong> și <strong>DVD-ul</strong>: discuri citite cu o rază laser.</li></ul>
<p>Memoria RAM <strong>nu</strong> e dispozitiv de stocare: se golește la oprire.</p>
${IMG.stocare}`,
   exemplu:`<p>Faci o poză cu telefonul. Ea e păstrată în telefon sau pe cardul de memorie din el. Închizi telefonul, iar mâine poza e tot acolo.</p>
<p>Stickul se bagă într-o mufă USB. La calculatorul de birou, mufele USB sunt de obicei și pe fața unității centrale:</p>${IMG.mufe}
<p>Când salvezi, datele merg spre stick; când îl deschizi, vin de pe el. Treaba lui e să le păstreze: de aceea e un dispozitiv de stocare.</p>`,
   altfel:`<p>Ține minte lecția 4: memoria RAM e masa de lucru, iar discul e cămara, unde păstrezi ce vrei să ai și mâine. Toate dispozitivele de stocare sunt ca niște cămări. Unele stau în casă, ca discul din calculator. Pe altele le iei cu tine, ca stickul și cardul: ca o cutie cu mâncare pe care o duci la bunica.</p>`,
   incearca:{t:'choice',q:'Ai început un desen pe calculatorul din laborator. Vrei să-l termini acasă, pe calculatorul tău. Calculatorul din laborator rămâne la școală. Pe ce iei desenul?',
    o:['Pe un stick USB','În memoria RAM','Pe monitor','În procesor'],ok:0,
    ajutor:'Îți trebuie ceva care păstrează desenul și după oprire și pe care îl poți lua cu tine.',
    why:'Pe stick desenul rămâne și după ce îl scoți din calculator, iar stickul îl iei în buzunar. Memoria RAM se golește la oprire și stă în calculator. Pe monitor doar vezi desenul, iar procesorul îl prelucrează, dar nu-l păstrează.'},
   inca:[
    {t:'classify',q:'Păstrează datele după ce oprești aparatul? Sortează.',cats:['Le păstrează: e dispozitiv de stocare','Se golește la oprire'],items:[['SSD-ul din laptop',0],['Memoria RAM',1],['Cardul din aparatul foto',0],['DVD-ul cu filmul de la nunta mătușii',0],['Hard diskul extern',0]],ajutor:'Care dintre ele se golește când nu mai are curent? Recitește ultima propoziție din pas.',why:'SSD-ul, cardul, DVD-ul și hard diskul extern sunt dispozitive de stocare: păstrează datele și după oprire. Memoria RAM se golește.'},
    {t:'tf',q:'Hard diskul extern păstrează datele doar cât timp e legat de calculator.',ok:false,ajutor:'E hard diskul extern un dispozitiv de stocare?',why:'Fals. E un dispozitiv de stocare: îl scoți, îl pui în sertar, iar datele rămân pe el. Doar memoria RAM se golește la oprire.'}
   ]},
  /* ---- pasul 2: bitul și byte-ul ---- */
  {t:'Bitul și byte-ul',
   text:`<p>În calculator, toate datele sunt scrise doar cu două cifre: <strong>0</strong> și <strong>1</strong>. O astfel de cifră se numește <mark>bit</mark>. Bitul e cea mai mică unitate de măsură pentru date.</p>
<p>Opt biți, unul lângă altul, formează un <mark>byte</mark> (se citește „bait”; în română i se spune și <strong>octet</strong>). Byte se scrie prescurtat cu <strong>B</strong> mare. La plural spunem „byți” (se citește „baiți”).</p>
<p><strong>Text simplu</strong> înseamnă doar literele: fără culori, fără litere de mărimi diferite, fără poze. Într-un text simplu, o literă fără diacritice ocupă <strong>1 byte</strong>.</p>`,
   exemplu:`<p>Litera <b>A</b>, în calculator, e un byte: ${BITI_A}. Numără cifrele: sunt 8, deci 8 biți.</p>
<p>Cuvântul <b>MARE</b> are 4 litere fără diacritice, deci ocupă <b>4 B</b> (4 byți).</p>
<p>O literă cu diacritice (ă, î, ș) ocupă de obicei 2 byți. De aceea, azi numărăm doar cuvinte fără diacritice.</p>`,
   altfel:`<p>Gândește-te la un șir de 8 becuri. Fiecare bec e ori stins (0), ori aprins (1): un bec e ca un bit. Cele 8 becuri, la un loc, sunt ca un byte. Dacă aprinzi alte becuri, obții altă literă.</p>`,
   incearca:{t:'choice',q:'Câți byți ocupă cuvântul <b>SOARE</b>, scris într-un text simplu?',o:['1','5','8','10'],ok:1,amesteca:false,
    ajutor:'O literă fără diacritice ocupă 1 byte. Numără literele.',
    why:'SOARE are 5 litere fără diacritice, deci 5 byți. 8 e numărul de biți dintr-un singur byte, nu numărul de byți al cuvântului.'},
   inca:[
    {t:'choice',q:'Câți biți formează un byte?',o:['2','8','10','1024'],ok:1,amesteca:false,ajutor:'Numără cifrele 0 și 1 din „Uite cum”, la litera A.',why:'Opt biți formează un byte. 1024 apare mai târziu, la trecerea de la o unitate la următoarea.'},
    {t:'tf',q:'Bitul e mai mare decât byte-ul.',ok:false,ajutor:'Care e cea mai mică unitate?',why:'Fals. Bitul e cea mai mică unitate: o singură cifră, 0 sau 1. Un byte are 8 biți.'}
   ]},
  /* ---- pasul 3: scara unităților ---- */
  {t:'Scara unităților: KB, MB, GB, TB, PB',
   text:`<p>Un byte e foarte puțin. Pentru date mari folosim unități mai mari:</p>
<ul><li>un <mark>kilobyte</mark> (KB, se citește „kilobait”) are 1024 de byți;</li>
<li>un <mark>megabyte</mark> (MB, „megabait”) are 1024 KB;</li>
<li>un <mark>gigabyte</mark> (GB, „ghigabait”) are 1024 MB;</li>
<li>un <mark>terabyte</mark> (TB, „terabait”) are 1024 GB;</li>
<li>un <mark>petabyte</mark> (PB, „petabait”) are 1024 TB.</li></ul>
<p>Sunt ca treptele unei scări. De la byte în sus, fiecare treaptă e de <mark>1024 de ori</mark> mai mare:</p>${SCARA}
<p>Așa socotim la școală, și tot așa arată mărimile calculatoarele cu Windows, ca cele din laborator.</p>`,
   exemplu:`<p><b>Cât ocupă, cam</b>, lucruri din viața ta:</p>
<ul><li>o literă: 1 B;</li><li>o pagină plină de text simplu, fără poze: cam 2 KB;</li><li>o poză făcută cu telefonul: cam 2 MB;</li><li>un cântec: cam 4 MB;</li><li>un film întreg: câțiva GB;</li><li>discul unui calculator: sute de GB sau câțiva TB.</li></ul>
<p>Mărimile adevărate diferă de la un lucru la altul: de aceea spunem „cam”.</p>`,
   altfel:`<p>E ca la bani: 100 de bani fac 1 leu. Leul e treapta de deasupra banului. La date, treptele sunt mai mari: 1024 de byți fac 1 KB, 1024 KB fac 1 MB, și tot așa, până sus.</p>`,
   incearca:{t:'order',q:'Ordonează unitățile de la cea mai mică la cea mai mare.',items:['bit','byte','KB','MB','GB','TB','PB'],
    ajutor:'Bitul e o singură cifră. Opt biți fac un byte. Apoi urci scara: kilo, mega, giga, tera, peta.',
    why:'Bitul e cea mai mică unitate. Byte-ul are 8 biți. De la byte în sus, fiecare treaptă e de 1024 de ori mai mare: KB, MB, GB, TB, PB.'},
   inca:[
    {t:'choice',q:'Urci o treaptă, de la MB la GB. De câte ori e mai mare 1 GB decât 1 MB?',o:['De 1024 de ori','De 8 ori','De 100 de ori','De 2 ori'],ok:0,ajutor:'Uită-te pe scară: ce scrie între MB și GB?',why:'De la byte în sus, fiecare treaptă e de 1024 de ori mai mare: 1 GB = 1024 MB. De 8 ori e doar pasul de la bit la byte.'},
    {t:'tf',q:'1 PB e mai mic decât 1 TB.',ok:false,ajutor:'Uită-te pe scară: care treaptă e mai sus?',why:'Fals. PB (petabyte) e treapta de deasupra lui TB: 1 PB = 1024 TB.'}
   ]},
  /* ---- pasul 4: capacitatea și compararea ---- */
  {t:'Capacitatea: cum compari două mărimi',
   text:`<p><mark>Capacitatea</mark> unui dispozitiv de stocare înseamnă cât încape în el. De obicei scrie chiar pe el: pe stickul din fotografie scrie 16GB.</p>
<p>Ca să afli care e mai mare, te uiți întâi la <strong>unitate</strong>, apoi la <strong>număr</strong>:</p>
<ol><li><strong>Aceeași unitate?</strong> Compari numerele: 32 GB e mai mult decât 16 GB.</li>
<li><strong>Unități diferite?</strong> Amintește-ți: 1 GB = 1024 MB. Deci 500 MB e mai puțin decât 1 GB, pentru că 500 e mai mic decât 1024.</li></ol>
<p><strong>Capcana:</strong> 500 e mai mare decât 8, dar 500 MB e mult mai puțin decât 8 GB. Unitatea contează întâi!</p>
${IMG.stick16}`,
   exemplu:`<p><b>1500 MB sau 1 GB?</b> Unitățile diferă. 1 GB = 1024 MB. Compari 1500 cu 1024: 1500 e mai mare, deci <b>1500 MB e mai mult decât 1 GB</b>.</p>
<p><b>Stickul din fotografie</b> are 16 GB socotiți ca fabricantul, de 1000 de ori. Calculatoarele cu Windows, ca cele din laborator, socotesc de 1024 de ori, așa că îl arată ceva mai mic: sub 15 GB. Pe stick încap la fel de multe lucruri.</p>`,
   altfel:`<p>E ca la bani. Ce e mai mult: 150 de bani sau 1 leu? Un leu are 100 de bani. 150 e mai mare decât 100, deci 150 de bani sunt mai mult decât 1 leu. Dar 80 de bani sunt mai puțin decât 1 leu. La date, în loc de 100, pragul e 1024.</p>`,
   incearca:{t:'fotografie',q:'Pe care card încap mai multe poze? Pune eticheta pe el. Pe telefon, apasă întâi „Mărește fotografia”.',
    img:'carduri-128mb-32gb.webp',w:800,h:533,
    alt:'Două carduri de memorie pe o masă de lemn: în stânga, un card albastru pe care scrie 128MB; în dreapta, un card negru cu alb, pe care scrie 32 GB',
    credit:CR.carduri,
    tinte:[{id:'mare',et:'Aici încap mai multe poze',test:'Eticheta stă pe cardul cu capacitatea mai mare'}],
    zone:[{id:'mic',r:[[19.5,23,45,74.5]]},{id:'mare',r:[[55.5,24,81,75]]}],
    nume:{mic:'cardul de 128 MB',mare:'cardul de 32 GB'},
    nimic:'Acum nu stă pe niciun card: acolo e masa de lemn.',
    punct:{mare:[68,50]},
    gresit:{mare:[32,50]},
    ajutor:'Uită-te întâi la unitate: MB sau GB? Care e treapta mai de sus?',
    why:'Pe cardul din dreapta scrie 32 GB. Pe cel din stânga scrie 128 MB: nici măcar 1 GB, fiindcă 1 GB = 1024 MB. Deci pe cardul de 32 GB încap mult mai multe poze, deși 32 e mai mic decât 128.'},
   inca:[
    {t:'choice',q:'Care e mai mare: 700 MB sau 2 GB?',o:['2 GB','700 MB','Sunt egale'],ok:0,amesteca:false,ajutor:'1 GB = 1024 MB. Ajunge 700 MB măcar la 1 GB?',why:'700 e mai mic decât 1024, deci 700 MB nu ajunge nici la 1 GB. Iar 2 GB e mai mult decât 1 GB. Deci 2 GB e mai mare.'},
    {t:'choice',q:'Care e mai mare: 1100 MB sau 1 GB?',o:['1100 MB','1 GB','Sunt egale'],ok:0,amesteca:false,ajutor:'Compară 1100 cu 1024.',why:'1 GB = 1024 MB, iar 1100 e mai mare decât 1024. Deci 1100 MB e ceva mai mult decât 1 GB.'},
    {t:'tf',q:'256 KB e mai mult decât 2 MB, pentru că 256 e mai mare decât 2.',ok:false,ajutor:'Întâi unitatea: câți KB are 1 MB?',why:'Fals. 1 MB = 1024 KB, iar 256 KB nu ajunge nici la 1 MB. Deci 2 MB e mai mult.'},
    {t:'tf',q:'Un stick pe care scrie 16 GB apare pe un calculator cu Windows cu ceva mai puțin, pentru că fabricantul socotește treptele de 1000 de ori, iar Windows de 1024 de ori.',ok:true,ajutor:'Recitește „Uite cum”, la stickul din fotografie.',why:'Adevărat. Pe cutie, fabricantul socotește fiecare treaptă de 1000 de ori mai mare, iar calculatoarele cu Windows, ca cele din laborator, de 1024 de ori. Pe stick încap la fel de multe lucruri: doar numărul arătat e mai mic.'}
   ]},
  /* ---- pasul 5: locul liber, capacitățile obișnuite + ce am învățat ---- */
  {t:'Pe ce încape? Locul liber',
   text:`<p>Ceva încape pe un dispozitiv dacă e mai mic decât <strong>locul liber</strong> de pe el. Pe un stick pot fi deja alte lucruri, așa că nu contează doar capacitatea.</p>
<p>Pe ecranul unui calculator, discul arată așa:</p>${IMG.discC}
<p>Discul are <strong>475 GB</strong> în total, iar <strong>198 GB</strong> sunt încă liberi. Un film de 3 GB încape: aceeași unitate, iar 3 e mai mic decât 198.</p>
<p><strong>Capacități obișnuite:</strong> CD de 700 MB; DVD de 4,7 GB (ceva mai mult de 4 GB); stick sau card de 16, 32 sau 64 GB; hard disk de sute de GB sau câțiva TB.</p>`,
   exemplu:`<p><b>Pozele din tabără ocupă 5 GB.</b> CD-ul de 700 MB nu ajunge nici la 1 GB: <b>nu încap</b>. DVD-ul are 4,7 GB, mai puțin de 5: <b>nu încap</b>. Un stick de 16 GB, cu 10 GB liberi: 10 e mai mare decât 5, deci <b>încap</b>.</p>
<p><b>Ce am învățat, pe scurt:</b></p>${SCHEMA}`,
   incearca:{t:'choice',q:'Filmul serbării are 2 GB. Pe care dispozitiv gol NU încape?',
    o:['Pe un stick vechi, de 256 MB','Pe un DVD de 4,7 GB','Pe un card de 8 GB','Pe un hard disk extern de 500 GB'],ok:0,
    ajutor:'Întâi unitatea. Care dintre ele are capacitatea în MB? Ajunge ea măcar la 1 GB?',
    why:'256 MB nu ajunge nici la 1 GB, fiindcă 1 GB = 1024 MB; deci nici la 2 GB. DVD-ul și cardul sunt în GB, iar 4,7 și 8 sunt mai mari decât 2. Hard diskul are 500 GB, mult peste 2 GB.'},
   inca:[
    {t:'classify',q:'Muzica ta ocupă 3 GB, toate cântecele la un loc. Încape sau nu? Sortează.',cats:['Încape','Nu încape'],items:[['Un stick gol, de 32 GB',0],['Un CD de 700 MB',1],['Un card de 8 GB, pe care mai sunt liberi doar 2 GB',1],['Un hard disk extern gol, de 1 TB',0],['Un DVD gol, de 4,7 GB',0]],ajutor:'Pentru fiecare: întâi unitatea, apoi numărul. La card contează locul liber, nu capacitatea.',why:'Stickul de 32 GB, DVD-ul de 4,7 GB și hard diskul de 1 TB (treapta de deasupra lui GB) au loc. CD-ul de 700 MB nu ajunge nici la 1 GB. Pe card mai sunt liberi doar 2 GB, mai puțin decât 3 GB.'}
   ]}
 ],
 atelier:{t:'fotografie',titlu:'Atelier: încape filmul? Citește capacitatea fiecărui dispozitiv',
  intro:`<p><strong>Sarcina:</strong> filmul serbării clasei are <b>3 GB</b>. Fotografia, pe care n-ai mai văzut-o, arată dispozitive de stocare vechi și noi. Pune pe fiecare dispozitiv din lista testelor eticheta potrivită: filmul încape pe el sau nu. Socotim că dispozitivele sunt goale.</p>
<ol><li>Citește capacitatea fiecărui dispozitiv în pozele mărite de mai jos. Pe etichete, în loc de virgulă e punct: 4.7GB înseamnă 4,7 GB (ceva mai mult de 4 GB), iar 2.0 GB înseamnă tot 2 GB.</li>
<li>Apasă o etichetă de deasupra fotografiei: <b>1 Încape filmul</b> sau <b>2 Nu încape filmul</b>. Prima e deja aleasă.</li>
<li>Atinge pe fotografie dispozitivul. Pe el apare un cerc cu numărul etichetei.</li>
<li>Vrei să schimbi o etichetă? Apasă cealaltă etichetă și atinge din nou dispozitivul.</li>
<li>Când toate cele 5 dispozitive au o etichetă, apasă <b>Verifică etichetele</b>.</li></ol>
<p><b>Ce scrie pe ele, de aproape</b> (bucăți mărite din aceeași fotografie). <b>Apasă o poză ca s-o vezi mare:</b> se deschide separat, iar lecția rămâne deschisă în spate.</p>${ETICHETE}
<p>Pe telefon, lucrurile mici se ating greu: apasă <b>Mărește fotografia</b>.</p>`,

 qs:[

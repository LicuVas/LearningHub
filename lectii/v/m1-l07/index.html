/* Lecția 7, clasa a V-a (M1): „Evaluare sumativă: sisteme de calcul” (tip: evaluare sumativă).

const LABORATOR=[

  '<b>B · Consolidat.</b> Scrie drumul unei litere pe care ai apăsa-o acum, cu numele pieselor: pe unde intră, ce piesă o prelucrează, unde stă cât lucrezi, pe unde iese și unde rămâne după ce salvezi.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Intră prin tastatură. Procesorul o prelucrează. Cât lucrezi, stă în memoria RAM. Iese prin placa video și monitor. După ce salvezi, rămâne pe disc.</details>',

  intro:`<p>Lecția 7 e <b>evaluarea sumativă</b> a unității „Sisteme de calcul”: lucrarea pe care o dai la clasă. Pagina aceasta nu dă note. Te ajută să te pregătești și să te verifici singur: recitești pe scurt lecțiile 2-6, dai o probă de antrenament pe fotografii și răspunzi la 6 întrebări.</p>
<p><b>La final știi:</b> ce ai de recitit înainte de lucrare și la ce nivel ești pe antrenament.</p>
<p><b>Ai nevoie de:</b> lecția 1 — cele trei niveluri: De bază, Consolidat, Avansat; lecția 2 — regulile din laborator și poziția corectă la calculator; lecția 3 — ce este un sistem de calcul; lecția 4 — drumul datelor și piesele calculatorului; lecția 5 — dispozitivele de intrare, de ieșire și de intrare-ieșire; lecția 6 — dispozitivele de stocare și unitățile de la bit la TB.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 6 pași scurți. Primul îți spune ce se verifică. Ceilalți 5 recapitulează lecțiile 2, 3, 4, 5 și 6, fiecare cu un exercițiu mic, fără puncte.</li><li>La atelier dai proba de antrenament: 5 exerciții pe fotografii, pe nivelurile lucrării.</li><li>Acum la calculatorul din laborator: îți faci în caiet, de pe scaun, o fișă de pregătire pe cele trei niveluri.</li><li>Răspunzi la 6 întrebări de verificare, fiecare cu nivelul ei: pentru ele primești stele, nu note.</li></ol>`,
  banda:'<span><i class="lan"></i>L2</span><span><i class="usb"></i>L3</span><span><i class="usb"></i>L4</span><span><i class="hdmi"></i>L5</span><span><i class="jack"></i>L6</span><span class="lucrare">A · B · C</span>',
  nivele:[
{t:'Evaluare sumativă: sisteme de calcul',final:true,lectii:[2,3,4,5,6,7],
 continuturi:['Normele de securitate și protecție a muncii în laboratorul de informatică','Poziția corectă a corpului la stația de lucru','Sisteme de calcul și de comunicații întâlnite în viața cotidiană','Momente principale în evoluția sistemelor de calcul','Structura generală a unui sistem de calcul','Rolul componentelor hardware ale unui sistem de calcul','Dispozitive de intrare: exemple, rol, mod de utilizare','Dispozitive de ieșire: exemple, rol, mod de utilizare','Dispozitive de intrare-ieșire: exemple, rol, mod de utilizare','Dispozitive de stocare a datelor:','- exemple de dispozitive de stocare a datelor','- unități de măsură pentru capacitatea de stocare (bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte etc.)','- comparație între dispozitivele de stocare în funcție de capacitate'],
 obiectiv:'știi ce cere fiecare nivel al lucrării și rezolvi singur exerciții de felul lor, pe lecțiile 2-6.',
 pasi:[
  /* ---- pasul 0: ce verificăm (fără acțiuni) ---- */
  {t:'Ce verificăm la lucrare',
   text:`<p>La lecția 7, profesorul îți dă la clasă <mark>evaluarea sumativă</mark>: lucrarea de la sfârșitul unității, pentru care primești o notă. Nu înveți nimic nou. Lucrarea verifică ce ai învățat la lecțiile 2, 3, 4, 5 și 6.</p>
<p>Ea are trei părți, pe nivelurile de la lecția 1:</p>
<ul class="niveluri"><li>${PARTE.A} rezolvi cu un model sau cu pașii dați;</li><li>${PARTE.B} rezolvi singur, lucruri de felul celor exersate;</li><li>${PARTE.C} rezolvi singur o situație nouă și explici de ce.</li></ul>
<p>Lucrarea e pe foaie, iar cerințele ei pot arăta altfel decât exercițiile de aici. Pagina nu dă note: nota o dă profesorul.</p>
${IMG.clasa}`},
  /* ---- pasul 1: lecția 2 (judecătorul, G1: unitatea V-U1 și lucrarea cuprind și lecția 2). Sursa, ca la lecția 3:
     jocul calculator-v, nivelurile 1-2 (lecția 2 nu e încă pe /lectii/); fără „fișiere” și „sistem de operare” (M2). ---- */
  {t:'Lecția 2: lucrez corect și în siguranță',
   text:`<p>În laborator sunt cabluri și prize, deci <strong>curent electric</strong>. Regulile te apără: intri numai cu profesorul; nu atingi cablurile, prizele și spatele calculatorului; mâncarea și apa rămân în ghiozdan; când ceva miroase a ars sau nu merge, <strong>anunți profesorul</strong> și nu repari singur.</p>
<p><mark>Poziția corectă</mark>, verificată de sus în jos: ecranul la 50–70 cm de ochi, cam cât brațul întins; spatele drept, sprijinit de spătar; coatele îndoite ca litera L, încheieturile drepte; tălpile pe podea sau pe un suport.</p>
<p><strong>Regula 20–20–20:</strong> la fiecare 20 de minute, privești 20 de secunde ceva aflat la cel puțin 6 metri.</p>
<p class="recit">Dacă nu-ți amintești: jocul <a href="../../../jocuri/calculator-v/index.html">„Misiunea Tehnician”</a>, nivelurile 1 și 2.</p>
${IMG.pozitie}`,
   exemplu:`<p><b>Când ceva nu e în regulă</b> (miros de ars, fum, ecranul se stinge), faci pe rând:</p><ol><li>iei mâinile de pe tastatură și mouse;</li><li>te dai puțin înapoi de la masă;</li><li>ridici mâna și chemi profesorul;</li><li>îi spui ce ai văzut.</li></ol>`,
   altfel:`<p>E ca la piscină: acolo e apă adâncă, aici e curent electric. La piscină nu intri fără salvamar și nu alergi pe margine. În laborator nu intri fără profesor și nu umbli la cabluri.</p>`,
   incearca:{t:'choice',q:'Începi să lucrezi la calculator la ora 9:00. După regula 20–20–20, la ce oră faci prima pauză pentru ochi?',
    o:['La 9:20','La 9:06','La 9:40','La 10:00'],ok:0,
    ajutor:'Primul 20 din regulă înseamnă minute. Ce oră e la 20 de minute după 9:00?',
    why:'La fiecare 20 de minute: 9:00 și încă 20 de minute fac 9:20. Atunci privești 20 de secunde ceva aflat la cel puțin 6 metri, de exemplu pe geam. La 9:40 e a doua pauză, iar 6 sunt metrii, nu minutele.'},
   inca:[
    {t:'classify',q:'Este voie sau nu este voie în laborator? Sortează.',cats:['Este voie','Nu este voie'],items:[['Să ții gustarea în ghiozdan până în pauză',0],['Să bei ceai dintr-o cană, lângă tastatură',1],['Să împingi la loc un ștecher ieșit din priză',1],['Să-i spui profesorului că ecranul s-a stins',0]],ajutor:'Ce e aproape de curent sau de tastatură e periculos. O problemă se anunță.',why:'Gustarea stă în ghiozdan, iar o problemă i-o spui profesorului: asta e voie. Ceaiul lângă tastatură poate ajunge la curent, iar la priză și la ștecher nu umbli: te poți electrocuta.'}
   ]},
  /* ---- pasul 2: lecția 3 ---- */
  {t:'Lecția 3: ce este un sistem de calcul',
   text:`<p>Un <mark>sistem de calcul</mark> face trei lucruri: <strong>primește date</strong>, le <strong>prelucrează</strong> după un <strong>program</strong> și <strong>dă un rezultat</strong>. Nu are neapărat tastatură și monitor: telefonul, bancomatul, ceasul inteligent și casa de marcat sunt tot sisteme de calcul.</p>
<p><strong>Metoda detectivului</strong>, pentru orice obiect:</p>
<ol><li>Primește date?</li><li>Le prelucrează după un program?</li><li>Dă un rezultat?</li></ol>
<p>Trei de „da”: e sistem de calcul. Un întrerupător nu este: doar închide curentul, nu prelucrează nimic.</p>
<p class="recit">Dacă nu-ți amintești: jocul <a href="../../../jocuri/calculator-v/index.html">„Misiunea Tehnician”</a>, nivelul 3.</p>`,
   exemplu:`<p><b>Cum au evoluat:</b> întâi mașini mecanice, cu roți dințate; în anii 1940–1950, primele calculatoare electronice (ENIAC ocupa o cameră întreagă); în anii 1980–1990, calculatorul personal, pe birou; după 2007, telefonul inteligent, în buzunar.</p>
<p>Au ajuns <strong>mai mici, mai rapide și conectate</strong>. Partea de <strong>comunicații</strong> înseamnă că dispozitivele schimbă date între ele.</p>${IMG.sisteme}`,
   altfel:`<p>E ca la bucătărie. Pui ingredientele (datele). Bucătarul le gătește după rețetă (prelucrarea, după program). La final ai mâncarea (rezultatul). Un obiect care nu „gătește” nimic nu e sistem de calcul.</p>`,
   incearca:{t:'classify',q:'Folosește metoda detectivului. Este sau nu este sistem de calcul? Sortează.',cats:['Este sistem de calcul','Nu este'],
    items:[['Televizorul inteligent, pe care cauți un film cu telecomanda',0],['Lanterna: apeși butonul și se aprinde becul',1],['Robotul de aspirat, care ocolește singur mobila',0],['Umbrela',1]],
    ajutor:'Pune fiecăruia cele trei întrebări. Lanterna seamănă cu întrerupătorul: ce face butonul ei?',
    why:'Televizorul inteligent și robotul de aspirat primesc date (apăsările tale, ce simte robotul în jur), le prelucrează după un program și dau un rezultat (filmul ales, drumul pe lângă mobilă). Butonul lanternei doar închide curentul, ca întrerupătorul. Umbrela nu primește date.'},
   inca:[
    {t:'order',q:'Pune în ordine cum au arătat calculatoarele de-a lungul timpului, de la cel mai vechi.',items:['Cât o cameră întreagă, ca ENIAC','Pe un birou, acasă sau la școală','În buzunar, ca telefonul inteligent'],ajutor:'Au ajuns tot mai mici.',why:'ENIAC, din anii 1940–1950, ocupa o cameră întreagă. Calculatorul personal a ajuns pe birou în anii 1980–1990. Telefonul inteligent, un calculator de buzunar, s-a răspândit după 2007.'},
    {t:'choice',q:'Trimiți un mesaj de pe telefonul tău pe telefonul bunicii. De ce ajunge mesajul la ea?',o:['Telefoanele sunt conectate și schimbă date','Telefoanele sunt mai mici decât ENIAC','Telefoanele au ecran pe care îl atingi','Telefoanele sunt mai rapide decât PC-ul'],ok:0,ajutor:'Care cuvânt din „comunicații” vorbește despre legătura dintre dispozitive?',why:'Mesajul ajunge pentru că telefoanele sunt conectate și schimbă date între ele: asta e partea de comunicații. Mărimea, ecranul și viteza nu duc mesajul de la un telefon la altul.'}
   ]},
  /* ---- pasul 2: lecția 4 ---- */
  {t:'Lecția 4: drumul datelor și piesele',
   text:`<p>Datele fac mereu același drum: <strong>intră</strong>, sunt <strong>prelucrate</strong> și <strong>memorate</strong>, apoi <strong>iese</strong> rezultatul. Drumul acesta e <mark>structura generală</mark> a calculatorului.</p>
<p>Toate piesele, la un loc, sunt <strong>hardware-ul</strong>. Fiecare are treaba ei:</p>
<ul><li><strong>procesorul</strong> prelucrează datele; stă sub un ventilator;</li>
<li><strong>memoria RAM</strong> ține datele cât lucrezi și se golește la oprire;</li>
<li><strong>discul</strong> păstrează ce ai salvat, și după oprire;</li>
<li><strong>placa de bază</strong>: pe ea se prind piesele, iar prin ea circulă datele;</li>
<li><strong>sursa de alimentare</strong> dă curent pieselor din carcasă;</li>
<li><strong>placa video</strong> pregătește imaginea pentru monitor.</li></ul>
<p class="recit">Dacă nu-ți amintești: <a href="../m1-l04/index.html">lecția 4</a>.</p>
${IMG.unit}`,
   exemplu:`<p><b>Apeși tasta A:</b> tastatura trimite apăsarea (intră). Procesorul o prelucrează, iar textul stă în memoria RAM. Placa video și monitorul arată litera (iese). Când salvezi, textul e scris pe disc.</p>${SCHEMA}`,
   altfel:`<p>Procesorul e ca un bucătar: el face treaba. Memoria RAM e masa de lucru: pe ea stau lucrurile cât gătește. Discul e cămara: acolo păstrezi ce vrei să ai și mâine. Seara, masa se strânge; ce n-ai pus în cămară nu mai găsești.</p>`,
   incearca:{t:'choice',q:'Scrii o compunere pe calculatorul de birou din laborator. După primele 10 rânduri o salvezi. Mai scrii încă 5 rânduri și nu mai salvezi. Se ia curentul. Ce găsești mâine pe disc?',
    o:['Compunerea cu primele 10 rânduri','Toată compunerea, cu toate cele 15 rânduri','Doar cele 5 rânduri scrise la urmă','Nimic: la oprire, discul se golește'],ok:0,
    ajutor:'Ce ajunge pe disc: ce scrii sau ce salvezi? Ce se întâmplă cu memoria RAM fără curent?',
    why:'Pe disc a ajuns doar ce ai salvat: primele 10 rânduri. Cele 5 rânduri de după stăteau doar în memoria RAM, care s-a golit când s-a luat curentul. Discul nu se golește la oprire.'},
   inca:[
    {t:'classify',q:'Ce piesă face fiecare treabă? Sortează.',cats:['Procesorul','Memoria RAM','Discul','Sursa de alimentare'],items:[['Face adunarea 48 + 27 în aplicația Calculator',0],['Ține minte desenul la care lucrezi acum',1],['Păstrează pozele salvate acum doi ani',2],['Dă curent pieselor din carcasă',3],['Ține minte poezia pe care o scrii acum, înainte s-o salvezi',1]],ajutor:'Face calcule: procesorul. Ține minte acum, cât lucrezi: memoria RAM. Păstrează și după oprire: discul. Curentul: sursa.',why:'Procesorul face calculele. Memoria RAM ține minte ce folosești acum. Discul păstrează ce ai salvat, chiar și după oprire. Sursa dă curent pieselor din carcasă.'},
    {t:'tf',q:'Monitorul prelucrează datele, pentru că pe el vezi rezultatul.',ok:false,ajutor:'Ce face monitorul pe drumul datelor: prelucrează sau arată?',why:'Fals. Pe monitor doar iese rezultatul. Datele sunt prelucrate de procesor, în unitatea centrală.'}
   ]},
  /* ---- pasul 3: lecția 5 ---- */
  {t:'Lecția 5: încotro merg datele',
   text:`<p>Aparatele legate de unitatea centrală se numesc <mark>dispozitive</mark> (sau periferice). Le sortezi după drumul datelor:</p>
<ul><li><strong>de intrare</strong>: datele intră în calculator (tastatura, mouse-ul, microfonul, camera web, scanerul);</li>
<li><strong>de ieșire</strong>: rezultatul iese spre tine (monitorul, boxele, căștile, imprimanta, videoproiectorul);</li>
<li><strong>de intrare-ieșire</strong>: datele merg în ambele sensuri (ecranul tactil, căștile cu microfon, imprimanta multifuncțională).</li></ul>
<p><strong>Metoda:</strong> ce faci cu el? Datele merg spre calculator, dinspre el sau în ambele sensuri? <strong>Capcana cablului:</strong> contează drumul datelor, nu al cablului.</p>
<p class="recit">Dacă nu-ți amintești: <a href="../m1-l05/index.html">lecția 5</a>.</p>
${IMG.dispozitive}`,
   exemplu:`<p><b>Microfonul și boxele</b> au amândouă de-a face cu sunetul. În microfon <b>vorbești</b>: sunetul merge spre calculator, deci e de <b>intrare</b>. Din boxe <b>asculți</b>: sunetul vine dinspre calculator, deci sunt de <b>ieșire</b>. Nu contează ce trece, ci încotro merge.</p>`,
   altfel:`<p>E ca ușa clasei. Dimineața intri pe ea, iar în pauză ieși tot pe ea. Tastatura e o ușă doar de intrare, monitorul doar de ieșire. Ecranul tactil e ca ușa clasei: datele trec prin el în ambele sensuri.</p>`,
   incearca:{t:'classify',q:'Folosește metoda: încotro merg datele? Sortează.',cats:['Intrare','Ieșire','Intrare-ieșire'],
    items:[['Senzorul de temperatură: o piesă care simte cât de cald e în clasă și trimite asta în calculator',0],['Tabela din sala de sport, pe care apare scorul meciului',1],['Ecranul ceasului inteligent: pe el vezi ora și îl atingi cu degetul ca să pornești cronometrul',2],['Difuzorul din hol, prin care se aude clopoțelul',1]],
    ajutor:'Pentru fiecare: datele merg spre calculator, dinspre el sau în ambele sensuri? Un ecran pe care îl și citești, și îl atingi seamănă cu ecranul tactil.',
    why:'Senzorul trimite temperatura spre calculator: intrare. Tabela și difuzorul scot rezultatul spre oameni: ieșire. Ecranul ceasului inteligent îți arată ora (iese) și simte degetul (intră): intrare-ieșire, ca ecranul tactil al telefonului.'},
   inca:[
    {t:'tf',q:'Videoproiectorul din clasă are un cablu care intră în calculator. Deci e un dispozitiv de intrare.',ok:false,ajutor:'Capcana cablului: ce contează, drumul cablului sau drumul datelor?',why:'Fals. Contează drumul datelor, nu al cablului. Prin videoproiector, imaginea iese din calculator, pe perete: e un dispozitiv de ieșire.'},
    {t:'match',q:'Ce dispozitiv folosești ca să faci fiecare treabă? Leagă.',pairs:[['Îi dictezi calculatorului o compunere, cu vocea','microfonul'],['Toată clasa ascultă un cântec în pauză','boxele'],['Scoți pe hârtie orarul clasei','imprimanta'],['Pui în calculator o pagină din manual, ca imagine','scanerul']],ajutor:'Întâi: trebuie ca ceva să intre în calculator sau să iasă din el? Apoi alegi dispozitivul care face asta.',why:'Vocea ta și pagina din manual trebuie să intre: microfonul și scanerul. Cântecul pentru toată clasa și orarul pe hârtie trebuie să iasă: prin boxe și la imprimantă.'}
   ]},
  /* ---- pasul 4: lecția 6 ---- */
  {t:'Lecția 6: stocarea și unitățile de măsură',
   text:`<p><mark>Dispozitivele de stocare</mark> păstrează datele și după oprire: hard diskul, SSD-ul, stickul USB, cardul de memorie, hard diskul extern, CD-ul, DVD-ul. Memoria RAM nu e dispozitiv de stocare: se golește la oprire.</p>
<p>Datele se măsoară în unități: <strong>bit</strong> (o cifră, 0 sau 1), <strong>byte</strong> (8 biți), apoi KB, MB, GB, TB și PB. De la byte în sus, fiecare treaptă e de <strong>1024 de ori</strong> mai mare: 1 GB = 1024 MB.</p>${SCARA}
<p><strong>Încape sau nu?</strong> Întâi unitatea, apoi numărul. Încape dacă e mai mic decât <strong>locul liber</strong>.</p>
<p class="recit">Dacă nu-ți amintești: <a href="../m1-l06/index.html">lecția 6</a>.</p>
${IMG.stick}`,
   exemplu:`<p><b>Cântecele tale ocupă 3 GB, toate la un loc.</b></p>
<ul><li>Un CD de 700 MB: 700 MB nu ajunge nici la 1 GB, deci <b>nu încap</b>.</li>
<li>Un DVD gol, de 4,7 GB: aceeași unitate, iar 4,7 e mai mare decât 3, deci <b>încap</b>.</li>
<li>Un stick de 8 GB, pe care mai sunt liberi doar 2 GB: 2 e mai mic decât 3, deci <b>nu încap</b>.</li></ul>`,
   altfel:`<p>E ca la bani: 100 de bani fac 1 leu. Ce e mai mult, 150 de bani sau 2 lei? Nu compari doar 150 cu 2: întâi te uiți la unitate. La date, în loc de 100, treapta e 1024.</p>`,
   incearca:{t:'order',q:'Ordonează aceste mărimi, de la cea mai mică la cea mai mare.',items:['800 KB','1 MB','500 MB','3 GB','2 TB'],
    ajutor:'Întâi unitatea. Unde unitățile diferă, compari cu 1024: o treaptă are 1024 din treapta de dedesubt.',
    why:'800 KB nu ajunge nici la 1 MB, fiindcă 1 MB = 1024 KB. 1 MB e mai puțin decât 500 MB: aceeași unitate. 500 MB nu ajunge nici la 1 GB (1024 MB), deci e mai puțin decât 3 GB. TB e treapta de deasupra lui GB: 1 TB = 1024 GB, deci 2 TB e cel mai mult.'},
   inca:[
    {t:'choice',q:'Scrise într-un text simplu, care dintre aceste cuvinte ocupă cei mai mulți byți?',o:['TASTATURA','MONITOR','MOUSE','DISC'],ok:0,ajutor:'O literă fără diacritice ocupă 1 byte. Numără literele fiecărui cuvânt.',why:'TASTATURA are 9 litere fără diacritice, deci 9 byți. MONITOR are 7, MOUSE are 5, DISC are 4. Cuvântul cu cele mai multe litere ocupă cei mai mulți byți.'},
    {t:'tf',q:'Un film de 3 GB încape pe un stick de 64 GB pe care mai sunt liberi doar 2 GB, pentru că 64 e mai mare decât 3.',ok:false,ajutor:'Ce contează: capacitatea stickului sau locul liber de pe el?',why:'Fals. Contează locul liber, nu capacitatea: pe stick mai sunt liberi doar 2 GB, mai puțin decât 3 GB.'}
   ]}
 ],
 /* ---- ATELIERUL: proba de antrenament pe fotografii, pe nivelurile lucrării (A, B, B, B, C) ---- */
 atelier:{t:'fotografie',titlu:'Atelier: proba de antrenament, pe fotografii',
  /* Runda 2 (judecătorul, n3): intro-ul scurtat; regula nivelului stă într-un <details>, cu aceleași condiții (M3). */
  intro:`<p><strong>Proba de antrenament:</strong> 5 exerciții pe fotografii, pe nivelurile lucrării: unul <b>A · De bază</b>, trei <b>B · Consolidat</b>, unul <b>C · Avansat</b>. Nu primești puncte.</p>
<ol><li>Apasă o etichetă, apoi atinge pe fotografie locul ei.</li>
<li>Ca s-o schimbi, apeși din nou eticheta și atingi alt loc. La etichetele-grupă („Intrare”, „Încape filmul”), alegi altă etichetă și atingi din nou dispozitivul.</li>
<li>Apasă <b>Verifică etichetele</b>, apoi <b>Încă un exercițiu</b>.</li></ol>
<details class="verif"><summary>Cum îți afli nivelul</summary>Nivelul tău e cea mai grea parte trecută de la <b>prima</b> verificare, fără indiciu, după ce le-ai trecut așa și pe cele de dinainte. O greșeală deschide singură indiciul: atunci partea nu se socotește; o reiei mai târziu. Nota o dă profesorul.</details>`,
  /* Partea A · De bază: calculatorul cunoscut (lecțiile 4-5), cu pașii dați */
  q:`${PARTE.A} Calculatorul din fotografie e cel de la lecțiile 4 și 5. Pune cele 4 etichete pe părțile lui. Pașii:<ol><li>Apasă o etichetă.</li><li>Întreabă-te: pe unde intră asta, pe unde iese, unde se prelucrează?</li><li>Atinge acea parte pe fotografie.</li></ol>Pe telefon, apasă întâi „Mărește fotografia”.`,
  img:'calculator-clasa.webp',w:800,h:600,
  alt:'Un calculator pe o masă dintr-o sală de clasă: în stânga o cutie înaltă, în mijloc un ecran, în față o tastatură, în dreapta un mouse; în dreapta, marginea altui calculator',
  credit:CR.dellSim,

   /* Partea B · Consolidat (3): casa de marcat fără casier. Judecătorul (M2): seamănă cu exercițiul casei de marcat de la

   {t:'fotografie',q:`${PARTE.B} O <strong>casă de marcat fără casier</strong>, la care plătești singur. Seamănă cu casa de marcat de la lecția 5. Așa se folosește: atingi pe ecranul mare butonul „Start”. Treci fiecare produs prin fața geamului cu lumină roșie; produsele mari le treci prin fața cititorului de mână, din dreapta. Pe ecranul mare vezi produsele și prețul. La aparatul pentru card tastezi codul PIN și vezi suma. Bonul îl iei din fanta de jos (o deschizătură îngustă, ca la pușculiță). Pune pe fiecare dispozitiv din lista testelor eticheta grupei lui. Pe telefon, apasă întâi „Mărește fotografia”.`,

     firma:'Aceea e o firmă luminoasă. Scrie în germană „Bargeldlos”, adică „fără bani gheață”: aici plătești doar cu cardul. Nu e în lista testelor.',

   /* Partea C · Avansat (judecătorul, M2): o situație chiar nouă — un telefon deschis, pe dinăuntru. Elevul aplică ce știe
      din lecțiile 4-6 prin asemănare: camera = camera web (intrare), difuzorul = boxele (ieșire), bateria = sursa (curentul),
      cardul de memorie = stickul (stocare). Verificat: GSMArena, Galaxy J7 (2015): „microSDHC (dedicated slot)”,
      „Li-Ion …, removable”; pe telefon, sub baterie, scrie „microSD SIM1” la locul din dreapta (fotografia-soră de pe Commons). */
   {t:'fotografie',q:`${PARTE.C} Situație nouă: un telefon cu capacul din spate scos. Și telefonul e un sistem de calcul: piesele lui fac aceleași treburi ca piesele unui calculator de birou. Pune pe fiecare parte a telefonului eticheta piesei de calculator care face aceeași treabă. Ca să găsești locul cardului: telefonul are două locuri pentru cartele mici; cel din stânga, cu contacte aurii, e pentru cartela SIM, cu care telefonul sună; cel din dreapta, cu capac de metal, e pentru cardul de memorie. La final, spune-i colegului, pentru o etichetă, de ce ai pus-o acolo. Pe telefon, apasă întâi „Mărește fotografia”.`,
    img:'telefon-deschis.webp',w:640,h:692,
    alt:'Spatele unui telefon, fără capac: sus, o cameră rotundă, în stânga ei un bec mic, în dreapta ei o grilă albă cu găurele; la mijloc, două locuri mici pentru cartele, unul cu contacte aurii și unul cu capac de metal; jos, o baterie mare, neagră, pe care scrie SAMSUNG',

    zone:[{id:'camera',r:[[40,17,55,31]]},{id:'blit',r:[[26.5,20.5,35.5,29.5]]},{id:'difuzor',r:[[57.5,18,72,29]]},{id:'sim',r:[[44.5,46.5,61.2,59.5]]},{id:'card',r:[[61.2,38.5,78,59.5]]},{id:'baterie',r:[[14,59.5,82.5,100]]}],
    nume:{camera:'camera telefonului',blit:'blițul, o lumină mică pentru pozele pe întuneric',difuzor:'difuzorul telefonului',sim:'locul cartelei SIM, cu care telefonul sună',card:'locul cardului de memorie',baterie:'bateria telefonului'},
    nimic:'Acum nu stă pe nicio parte din listă: acolo e carcasa telefonului.',
    punct:{camera:[47.5,24],difuzor:[64.5,23.5],baterie:[45,80],card:[69.5,49]},
    gresit:{card:[52.5,53],difuzor:[31,25]},
    ajutor:'Pentru fiecare etichetă, întreabă-te ce face piesa de calculator: camera web prinde imaginea, boxele scot sunetul, sursa dă curent pieselor, stickul păstrează datele și după oprire. Apoi caută partea telefonului care face la fel.',
    why:'Camera telefonului prinde imaginea, ca o cameră web: intrare. Difuzorul, grila albă cu găurele, scoate sunetul, ca boxele: ieșire. Bateria dă curent pieselor, ca sursa de alimentare. În locul din dreapta intră cardul de memorie, care păstrează pozele și după oprire, ca un stick USB: e un dispozitiv de stocare.'}

 /* ---- VERIFICAREA: 6 întrebări, fiecare cu nivelul ei (3 De bază, 2 Consolidat, 1 Avansat, ca 40 / 30 / 20 pe lucrare).
    Întrebarea 2 (lecția 2) e nouă după judecător (G1); prima rămâne un choice, ca poarta să testeze și răspunsul greșit. ---- */
 qs:[
  {t:'choice',q:`${NIV.b} Folosește metoda detectivului, pe pași:<ol><li>Primește date?</li><li>Le prelucrează după un program?</li><li>Dă un rezultat?</li></ol>Care dintre acestea este un sistem de calcul?`,
   o:['Cântarul electronic care calculează singur prețul fructelor','Balanța cu două talere, pe care pui greutăți de metal','Întrerupătorul care aprinde becul din clasă','Rigla de 30 de centimetri din penar'],ok:0,
   ajutor:'Pune cele trei întrebări fiecărui obiect. Care dintre ele face și o socoteală?',
   why:'Cântarul electronic primește greutatea fructelor (date), calculează prețul după programul lui (prelucrare) și îl arată pe ecran (rezultat): trei de „da”. Balanța cu talere doar se înclină, nu prelucrează nimic. Întrerupătorul doar închide curentul, iar rigla nu primește date.'},
  {t:'classify',q:`${NIV.b} Ioana stă la calculator. Verifică-i poziția de sus în jos, pe pași:<ol><li>ochii și ecranul;</li><li>spatele;</li><li>brațele;</li><li>picioarele.</li></ol>Ce e bine și ce trebuie reparat?`,cats:['E bine','Trebuie reparat'],
   items:[['Ecranul e cam la un braț întins de ochii ei',0],['Stă pe marginea scaunului, aplecată spre ecran',1],['Coatele îi sunt îndoite ca litera L',0],['Picioarele îi atârnă, fiindcă scaunul e prea înalt',1],['După 20 de minute, se uită 20 de secunde pe geam, departe',0]],
   ajutor:'Ia pe rând cele patru părți. Pentru fiecare, amintește-ți regula din pasul „Lecția 2”.',
   why:'Ecranul la un braț distanță (50–70 cm), coatele ca litera L și pauza pentru ochi, după regula 20–20–20, sunt bune. Spatele trebuie să stea drept, sprijinit de spătar, nu aplecat spre ecran. Tălpile trebuie să stea pe podea sau pe un suport, nu să atârne.'},
  {t:'match',q:`${NIV.b} Scrii numele tău la calculator și îl vezi pe ecran. Leagă fiecare parte de treaba ei. Model: <i>boxele → prin ele iese sunetul</i>.`,
   pairs:[['Tastatura','prin ea intră literele'],['Mouse-ul','prin el intră clicurile'],['Procesorul','prelucrează datele, după program'],['Memoria RAM','ține minte numele cât scrii'],['Monitorul','pe el iese rezultatul']],
   ajutor:'Drumul datelor: intră, sunt prelucrate și memorate, iese rezultatul. Fiecare parte are locul ei pe drumul acesta.',
   why:'Prin tastatură și prin mouse intră datele. Procesorul le prelucrează, iar memoria RAM le ține minte cât lucrezi. Pe monitor iese rezultatul: vezi numele scris.'},
  {t:'classify',q:`${NIV.c} La calculatorul profesorului, în laborator, sunt legate mai multe dispozitive. Sortează-le după drumul datelor.`,cats:['Intrare','Ieșire','Intrare-ieșire'],
   items:[['Videoproiectorul, care arată lecția pe perete',1],['Camera web, cu care profesorul filmează un experiment',0],['Căștile cu microfon',2],['Scanerul, pe care pune o fișă ca s-o aibă în calculator',0],['Imprimanta, care scoate fișele pe hârtie',1],['Monitorul cu ecran tactil, pe care alege cu degetul',2]],
   ajutor:'Metoda: ce face profesorul cu dispozitivul? Datele merg spre calculator, dinspre el sau în ambele sensuri?',
   why:'Camera web și scanerul duc imaginea în calculator: intrare. Videoproiectorul și imprimanta scot rezultatul spre voi: ieșire. Căștile cu microfon (auzi și vorbești) și ecranul tactil (arată și simte degetul) lucrează în ambele sensuri: intrare-ieșire.'},
  {t:'choice',q:`${NIV.c} După excursie, fotografiile făcute de colegi au în total <b>7 GB</b>. Pe care dispozitiv le poți pune pe toate?`,
   o:['Pe un card gol, de 16 GB','Pe un stick de 64 GB, pe care mai sunt liberi doar 6 GB','Pe un DVD gol, de 4,7 GB','Pe un CD gol, de 700 MB'],ok:0,
   ajutor:'Întâi unitatea, apoi numărul. La stick contează locul liber, nu capacitatea.',
   why:'Pe cardul gol de 16 GB încap: aceeași unitate, iar 16 e mai mare decât 7. Stickul are 64 GB, dar mai sunt liberi doar 6 GB, mai puțin decât 7 GB. DVD-ul are 4,7 GB, tot mai puțin decât 7. CD-ul de 700 MB nu ajunge nici la 1 GB.'},
  {t:'classify',q:`${NIV.a} Situație nouă: școala are o <strong>stație meteo</strong>, un mic sistem de calcul care urmărește vremea. Are senzori: piese care simt căldura sau ploaia și trimit în calculator ce simt. Ce parte din drumul datelor este fiecare?`,cats:['Intră','Prelucrare','Memorare','Iese'],
   items:[['Senzorul simte cât de cald e afară',0],['Programul caută cea mai mare temperatură din ziua aceea',1],['Temperaturile fiecărei zile rămân păstrate pe un card de memorie',2],['Pe ecranul de la intrarea în școală apare: 18 grade',3],['Senzorul de ploaie simte picăturile',0],['Difuzorul anunță: „Luați umbrela!”',3]],
   ajutor:'Ce vine din afară intră. Ce se socotește sau se caută e prelucrare. Ce rămâne ținut minte e memorare. Ce vezi sau auzi la final iese.',
   why:'Ce simt senzorii (căldura, picăturile) intră în calculator. Căutarea celei mai mari temperaturi e o prelucrare, după program. Temperaturile păstrate pe card sunt memorate, și după oprire: cardul e un dispozitiv de stocare. Ecranul și difuzorul scot rezultatul spre oameni: iese.'}

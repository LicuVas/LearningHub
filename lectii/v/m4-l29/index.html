<script>
/* Lecția 29, clasa a V-a (M4): „Structura alternativă (decizia). Urmăresc algoritmul pas cu pas” — predare + consolidare,
   a șasea lecție din V-U5 „Algoritmi. Gândesc pas cu pas” (CS.2.3). Legea: LearningHub\_campaign\revizuire_completa_2026_09\00_GHID_LECTII.md.
   Sursele și probele: surse.md, _proba\. Forma deciziei: manualele de clasa a V-a (Intuitext: „Dacă condiție atunci
   Instrucțiuni1 Altfel Instrucțiuni2”; Art Klett, Sigma, CD Press, Corint — citatele în surse.md) și testul inițial al
   profesorului („Dacă a > b atunci afișez a, altfel afișez b.”). Forma pașilor (Citește / Calculează … și pune rezultatul
   în cutia / Afișează) și tabelul de urmărire: presupuse de la V/28 (granița m4_seara_02_11\granite\v_l28.md).
   Activitatea profesorului (activitati_lectii_V_VI.json): „Tabel de urmărire completat împreună pentru un algoritm cu
   decizie, apoi individual pentru alte două seturi de date de intrare. Se compară traseele obținute.” Resursa: „fișă cu
   tabel de urmărire, exemple cu date diferite” — P3 („împreună”: biletul, cu explicația fiecărui rând), atelierul (același
   algoritm, două seturi care merg pe ramuri diferite, apoi compararea traseelor).
   Simulatorul: lectii/_sim/urmarire-decizie.js (NOU, proprietar lecția aceasta); evaluare-expresii.js (V/27) și
   cutii-variabile.js (V/26) sunt încărcate nemodificate, pentru condiții / calcule și pentru citirea numerelor.
   Granița: NU predă repetiția, Scratch, evaluarea sumativă (30); nu redefinește structura secvențială (28). Laboratorul:
   Explorer, Acest PC (lecția 9), doar citire — nimic creat, nimic șters. Trimiterile la pași se fac pe NUMELE pasului. */
const UD=UrmarireDecizie;
const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  semafor:fig('img/semafor-rosu.webp',600,402,'Un semafor pentru pietoni pe un stâlp: lumina de sus e aprinsă roșu','Semaforul pentru pietoni: e roșu, deci aștepți. <small>Foto: R1717, <a class="lic" href="https://commons.wikimedia.org/wiki/File:Fu%C3%9Fg%C3%A4ngerampel_Landau_Pfalz_rot.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC0; micșorată.</small>'),
  pc:fig('img/acest-pc-liber.webp',330,334,'Trei unități în Acest PC, fiecare cu o bară albastră; sub Disc local (C:) scrie 198 GB liber din 475 GB, iar „198 GB liber” e într-un chenar roșu','<b>Acest PC</b> (Windows 11). Chenarul roșu, pus de noi: 198 GB liberi. Cifrele roșii mari (tot ale noastre): totalul, nu cât e liber.','mica'),
  pcLab:fig('img/acest-pc-liber.webp',330,334,'Trei unități în Acest PC; sub Disc local (C:), „198 GB liber” e într-un chenar roșu','În chenarul roșu (pus de noi): «liber», 198. Cifrele roșii mari arată totalul, nu ce e liber.','mica')
};
/* '!…' = punctul de la sfârșitul orei */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculatorul din laborator, în Explorer</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;

/*ALG-START (sursa unică: pagina și probele din _proba citesc blocul acesta) */
const ALG_NIVEL={cutii:['puncte'],pasi:[
  {citeste:'puncte'},
  {daca:'«puncte» ≥ 50',atunci:[{afisText:'Nivel trecut'}],altfel:[{afisText:'Mai încearcă'}]},
  {afis:'puncte'}]};
const ALG_BILET={cutii:['vârsta','bani','rest'],pasi:[
  {citeste:'vârsta'},{citeste:'bani'},
  {daca:'«vârsta» < 14',atunci:[{calc:'«bani» − 5',in:'rest'}],altfel:[{calc:'«bani» − 10',in:'rest'}]},
  {afis:'rest'}]};
const ALG_CAIETE={cutii:['bani','caiete','cost'],pasi:[
  {citeste:'bani'},{citeste:'caiete'},
  {calc:'«caiete» * 4',in:'cost'},
  {daca:'«cost» ≤ «bani»',atunci:[{afisText:'Cumpăr caietele'}],altfel:[{afisText:'Nu ajung banii'}]},
  {afis:'cost'}]};
const ALG_LIBER={cutii:['liber'],pasi:[
  {citeste:'liber'},
  {daca:'«liber» ≥ 100',atunci:[{afisText:'Loc destul'}],altfel:[{afisText:'Loc puțin'}]},
  {afis:'liber'}]};
/*ALG-END*/
const TU=o=>Object.assign({t:'tabel-urmarire'},o);

/* „Acum la calculator” — FĂRĂ profesor, pe calculatorul comun. Doar citire în Acest PC: nimic creat, mutat sau șters.
   „… liber din …” = resursa ro-RO a Windows (propsys.dll.mui: „%1!ls! liber din %2!ls!”) + captura din lecția 9;
   vederea Detalii are coloana „Spațiu liber” (Shell.Application, citit, _proba\sonda_liber_din.json). */
const LAB=[
  '<b>Explorer, la Acest PC.</b> E deschis de la pasul <i>Decizia: condiția și cele două ramuri</i>? Treci la punctul 2. Nu? Clic pe dosarul galben din bara de activități (lecția 9) sau ține apăsată tasta cu sigla Windows și apasă <kbd>E</kbd>. Apoi, în stânga, clic pe <b>Acest PC</b> (<i>This PC</i>).',
  '<b>Datele de intrare.</b> Caută discul cu (C:) la sfârșitul numelui: <b>Disc local (C:)</b> sau alt nume, de exemplu Windows (C:). Sub el scrie, de exemplu, „198 GB liber din 475 GB”. Numărul dinaintea cuvântului „liber” (sau „liberi”) e «liber». Scrie-l în caiet, cu virgulă dacă are. Scrie TB în loc de GB? Sunt mult peste 100 GB: lucrează cu 1000 pentru «liber». Nu găsești discul C: sau nu scrie nimic sub el? Lucrează cu 198 pentru «liber», din poză.'+IMG.pcLab,
  '<b>Algoritmul, cu tine ca executant</b> („Afișează” înseamnă: scrii în caiet):'+UD.algoritmHtml(ALG_LIBER)+'Desenează în caiet tabelul de urmărire, cu coloanele Pasul, «liber», Condiția, Se afișează, și completează-l rând cu rând.',
  '<b>Alt set de date, alt traseu.</b> Scrie sub tabel traseul tău (coloana Pasul). Ai ajuns la „Loc destul”? Gândește-te la 40 pentru «liber». Ai ajuns la „Loc puțin”? La 150. Scrie noul traseu, apoi o propoziție: de la ce rând diferă de al tău și de ce.',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> la colegul de lângă tine, Explorer arată alt număr? Cu numărul lui, pe ce ramură merge algoritmul?</span>',
  '<b>La sfârșitul orei</b> (chiar dacă n-ai terminat): X pe Explorer (colțul din dreapta sus). N-ai creat niciun fișier: n-ai nimic de șters.'
];

JocMotor.porneste({
  cheie:'lectie_v_m4_l29',
  mod:'lectie',
  titlu:'Structura alternativă (decizia). Urmăresc algoritmul pas cu pas',
  marca:'Lecția <b>29</b> · clasa a V-a',
  h1:'Structura alternativă (decizia). Urmăresc algoritmul pas cu pas',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U5', unitateTitlu:'Algoritmi. Gândesc pas cu pas',
  competente:['CS.2.3'], lectii:'29',
  ancoraText:'Din programă (CS.2.3, unitatea V-U5, lecția 29): Structura alternativă (decizională) — urmărirea pas cu pas a unor algoritmi cu secvențe de operații și decizii',
  intro:`<p><b>Ai nevoie de:</b> lecția 28: pașii <b>Citește</b>, <b>Calculează … și pune rezultatul în cutia …</b>, <b>Afișează</b> și <b>tabelul de urmărire</b>. Lecția 27: comparațiile <code>= ≠ &lt; &gt; ≤ ≥</code>, cu valoarea <b>adevărat</b> sau <b>fals</b>. Lecția 26: cutia cu etichetă. Pentru laborator: <b>Explorer</b> și <b>Acest PC</b> (lecția 9).</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>P1 de citit, apoi 4 pași scurți, cu exerciții.</li><li>Atelierul: algoritmul biletului, pe două seturi de date; apoi compari drumurile.</li><li>La calculator: o decizie cu datele calculatorului tău, în Explorer (pe telefon, în caiet).</li><li>5 întrebări.</li></ol><p><b>Când mai sunt 10 minute din oră:</b> treci la întrebări; la calculator, ultimul punct.</p>`,
  banda:'<span class="bd-t">Dacă condiție atunci … altfel …</span><span class="bd-z">adevărat → ramura „atunci” · fals → ramura „altfel” · se face o singură ramură</span>',
  nivele:[
{t:'Structura alternativă (decizia). Urmăresc algoritmul pas cu pas',final:true,lectii:[29],
 /* textul EXACT din programă (curriculum.json): acolo, conținutul „Structura alternativă (decizională)” e lipit de „Medii grafice
    interactive …” (V-U6); poarta cere textul întreg — lecția acoperă doar prima parte (surse.md, „Contradicții găsite”) */
 continuturi:['Structura alternativă (decizională)Medii grafice interactive - elemente de interfață specifice mediului grafic interactiv'],
 obiectiv:'urmărești pas cu pas, într-un tabel, un algoritm cu o decizie, pe date diferite, și explici de ce algoritmul a mers pe un drum sau pe celălalt.',
 pasi:[
  /* ---- pasul 1: la ce folosește (fără acțiuni). Semaforul = Art Klett („Dacă semaforul pietonilor este roșu. Atunci aștept.
     Altfel traversez.”). „Structura alternativă sau decizională” = Art Klett, CD Press, Sigma, Litera. ---- */
  {t:'La ce folosește: decizia',
   text:`<p>La lecția 28, pașii unui algoritm se făceau toți, unul după altul. La semafor însă nu faci mereu același lucru: dacă e roșu, aștepți; altfel, traversezi. Alegi după ce vezi acum.</p>
<p>Într-un algoritm, o alegere ca asta se numește <mark>decizie</mark>. Un algoritm cu o decizie are <mark>structura alternativă</mark>, numită și <b>decizională</b>: are două drumuri (<b>ramuri</b>), iar datele de acum hotărăsc pe care merge.</p>
<p>Azi citești decizii, urmărești pas cu pas ce face un algoritm pe date diferite și compari drumurile.</p>
${IMG.semafor}`},
  /* ---- pasul 2: condiția și ramurile (Intuitext: „Dacă condiție este adevărată, atunci se execută Instrucțiuni1, altfel
     se execută Instrucțiuni2”; Sigma: „Nu se pot executa ambele … ramuri diferite … se iese din structura alternativă și
     se continuă algoritmul”). Ramurile mai la dreapta: VI/17 și jocul algoritmi-v. Afișează „text”: Intuitext „scriu
     „Promovat””, jocul algoritmi-v „afișează „Promovat””. ---- */
  {t:'Decizia: condiția și cele două ramuri',
   text:`<p>O decizie se scrie așa:</p>
<pre class="forma">Dacă condiție atunci
    pașii ramurii „atunci”
altfel
    pașii ramurii „altfel”</pre>
<p><mark>Condiția</mark> e o comparație (lecția 27), socotită cu valorile de acum din cutii. Adevărată: se fac pașii ramurii „atunci”. Falsă: pașii ramurii „altfel”. Se face o singură <mark>ramură</mark>, niciodată amândouă. Pașii unei ramuri stau mai la dreapta; „altfel” nu e un pas: n-are număr și nu apare în tabel. După decizie, algoritmul merge la pasul de sub ea.</p>
<p class="atentie">În unele manuale, decizia se încheie cu rândul „Sfârșit dacă”. Unele decizii n-au „altfel”: dacă condiția e falsă, din decizie nu se face nimic. Azi, fiecare decizie are ambele ramuri.</p>`,
   exemplu:`${UD.algoritmHtml(ALG_NIVEL,{titlu:'Algoritmul nivelului dintr-un joc:'})}<p>Cu 65 pentru «puncte»: condiția 65 ≥ 50 e adevărată, deci se fac pașii 1, 2, 3 și 5. Pasul 4 se sare. Se afișează „Nivel trecut” (exact textul dintre ghilimele), apoi 65.</p>
${ACUM('Deschide Explorer (dosarul galben din bara de activități); în stânga, clic pe <b>Acest PC</b>. Sub discul cu (C:) la sfârșitul numelui (de obicei <b>Disc local (C:)</b>), primul număr arată câți GB sunt liberi (poza de mai jos). Scrie TB? Atunci sunt peste 100 GB.','Scrie în caiet: numărul acesta ≥ 100 e adevărat sau fals? Lasă Explorer deschis. Pe telefon: cu 198 din poză.')}
${IMG.pc}`,
   altfel:`<p>Dimineața: „Dacă plouă, atunci iau umbrela, altfel iau șapca.” Condiția e „plouă”. Nu iei amândouă: doar una, după cum e vremea acum. Apoi, oricum ar fi, pleci la școală: acesta e pasul de după decizie.</p>`,
   incearca:{t:'choice',q:`${UD.algoritmHtml(ALG_NIVEL)}Algoritmul nivelului primește 40 pentru «puncte». Ce afișează?`,
    o:['„Mai încearcă”, apoi 40','„Nivel trecut”, apoi 40','„Nivel trecut”, „Mai încearcă”, apoi 40','doar 40'],ok:0,
    ajutor:'Întâi condiția: e 40 ≥ 50 adevărat sau fals? Care ramură se face atunci? Pasul 5 e sub decizie.',
    why:'40 ≥ 50 e fals, deci se face ramura „altfel”: pasul 4 afișează „Mai încearcă”. Pasul 5, de sub decizie, afișează 40.'},
   inca:[
    {t:'choice',q:`${UD.algoritmHtml(ALG_NIVEL)}Acum se dă 50 pentru «puncte». Ce afișează algoritmul?`,
     o:['„Nivel trecut”, apoi 50','„Mai încearcă”, apoi 50','„Nivel trecut”, „Mai încearcă”, apoi 50','doar „Nivel trecut”'],ok:0,
     ajutor:'Semnul ≥ înseamnă „mai mare sau egal”. E 50 ≥ 50 adevărat?',
     why:'50 ≥ 50 e adevărat (50 e egal cu 50), deci ramura „atunci”: „Nivel trecut”. Apoi pasul 5 afișează 50.'}
   ]},
  /* ---- pasul 3: tabelul de urmărire, „împreună” (activitatea profesorului). Forma tabelului = granița V/28 (un rând pe pas
     făcut; în cutii ce e DUPĂ pas; „–” = goală), cu coloana Condiția (V/29). ---- */
  {t:'Tabelul de urmărire, completat împreună',
   text:`<p>Un algoritm pe niște date se urmărește pas cu pas în <b>tabelul de urmărire</b>, ca la lecția 28. Are în plus coloana <b>Condiția</b>.</p>
<p>Fiecare rând e un pas făcut, în ordinea în care se face. În tabel e ce are fiecare cutie DUPĂ pas; cutia încă goală are căsuța goală („–” în tabelul gata făcut). La rândul deciziei scrii la Condiția adevărat sau fals. Rândul următor e primul pas al ramurii alese: pașii celeilalte ramuri nu apar în tabel.</p>
<p>În exerciții, ce nu schimbă pasul (valoarea din rândul de deasupra) e scris deja, cu gri înclinat; tu scrii doar ce pune pasul.</p>`,
   exemplu:`<p>Biletul la muzeu costă 5 lei sub 14 ani și 10 lei de la 14 ani în sus. Algoritmul află restul:</p>${UD.algoritmHtml(ALG_BILET)}
${UD.tabelHtml(ALG_BILET,{'vârsta':11,bani:20},{explica:['Citește vârsta: 11.','Citește banii: 20. «vârsta» rămâne 11 (gri).','Decizia: 11 &lt; 14 e adevărat.','Ramura „atunci”: 20 − 5 dă 15. Pasul 5 se sare.','Pasul 6 e sub decizie: se face oricum.'],traseu:false})}`,
   altfel:`<p>E ca un jurnal de drum: scrii, rând cu rând, pe unde ai trecut și ce ai în rucsac după fiecare oprire. La o răscruce (decizia) notezi ce ai văzut, apoi doar drumul ales.</p>`,
   incearca:TU({q:'Completează tabelul de urmărire al algoritmului nivelului cu 40 pentru «puncte»: atinge numărul pasului care se face, apoi răspunde sub tabel. La sfârșit, <b>Verifică</b>.',
    alg:ALG_NIVEL,seturi:[{intrari:{puncte:40}}],
    ajutor:'Rândul 1 e pasul 1. După decizie, condiția hotărăște: adevărată, urmează pasul 3; falsă, pasul 4. Pasul 5 se face oricum.',
    why:'Pașii făcuți: 1, 2, 4, 5. 40 ≥ 50 e fals, deci ramura „altfel” (pasul 4: „Mai încearcă”); pasul 5 afișează 40.'}),
   inca:[
    TU({q:'Același algoritm, cu 50 pentru «puncte».',alg:ALG_NIVEL,seturi:[{intrari:{puncte:50}}],
     ajutor:'E 50 ≥ 50 adevărat? „≥” primește și „egal”.',why:'50 ≥ 50 e adevărat: pașii 1, 2, 3, 5; se afișează „Nivel trecut”, apoi 50.'})
   ]},
  /* ---- pasul 4: traseul și compararea (activitatea profesorului: „Se compară traseele obținute”). ---- */
  {t:'Date diferite, trasee diferite',
   text:`<p><mark>Traseul</mark> algoritmului pe un set de date e lista pașilor făcuți, în ordine: coloana Pasul, citită de sus în jos.</p>
<p>Cu alte date, condiția poate avea altă valoare, deci algoritmul merge pe cealaltă ramură: traseul e altul. Când compari două trasee, cauți primul rând unde diferă și spui de ce: ce valoare a avut condiția la fiecare set.</p>`,

/* tema: bara de sus a unui browser — o filă, bara de adrese și o căutare cu ghilimele */
.banda{display:flex;align-items:center;gap:8px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent)}
.banda .bd-tab{flex:none;font-size:.74rem;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;padding:2px 10px}
.banda .bd-adr{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.76rem;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 11px}
.banda .bd-adr b{color:var(--ink);font-weight:600}
.banda .bd-q{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--fm);font-size:.72rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:999px;padding:2px 11px}

/* „Acum în browserul tău” (regula 10): gesturi mici, reale, imediat după pas */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:800;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum code{white-space:nowrap;font-size:.8em}   /* adresa nu se rupe la cratimă: elevul ar crede că e un rând nou */
/* un rezultat desenat în text (exemple) */
.rez-ex{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:7px 11px;margin:6px 0}
.rez-ex .st{font-size:.78rem;color:var(--ink2)}
.rez-ex .ti{color:var(--accent);font-weight:600}
.rez-ex .ds{font-size:.85rem;color:var(--ink2)}
.rez-ex .sp{font-size:.72rem;font-weight:700;color:var(--ink2)}
/* schema „Ce am învățat” (HTML, nu imagine) */
.schema{display:grid;gap:6px;justify-items:center;margin:12px auto 14px;max-width:520px}
.sc-box{border:2px solid var(--accent);border-radius:10px;background:var(--paper);padding:6px 12px;text-align:center;width:100%;line-height:1.3;box-sizing:border-box}
.sc-box b{display:block;font-family:var(--fd);font-size:1.02rem}
.sc-box span{display:block;font-size:.88rem;color:var(--ink2)}
.sc-sag{font-size:1.35rem;line-height:1;color:var(--accent);font-weight:700}

<script>
/* Lecția 14, clasa a V-a (M2): „Navigarea pe web. Căutarea informațiilor cu motoare de căutare”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Simulatorul: lectii/_sim/browser-web.js (extensie NOUĂ, proprietar lecția aceasta; lecția 15 îl extinde).
   Faptele despre Edge sunt probate în Edge-ul real (română), pe desktopul ascuns, cu profil temporar și rețeaua blocată;
   cele despre motor, pe Bing, în Chromium headless, fără cont (surse.md). Lecția e deschisă CHIAR în browser: toate gesturile
   reale se fac într-o FILĂ NOUĂ, închisă la sfârșit cu ×, ca lecția să rămână în fila ei. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CAPT='<small>Captură din Microsoft Edge, în română; chenarele roșii sunt puse de noi.</small>';
const CAPT0='<small>Captură din Microsoft Edge, în română.</small>';
const ADR_LH='learninghub-8z6.pages.dev/lectii/v/';
const IMG={
  fisier:fig('fisier-biblioteca.webp',800,533,'Un sertar lung dintr-un fișier de bibliotecă, plin de cartonașe așezate în rând, pe o masă de lemn','Un sertar din fișierul unei biblioteci: cartonașe așezate după cuvinte. <small>Foto: Michael Holley, <a href="https://commons.wikimedia.org/wiki/File:Copyright_Card_Catalog_Drawer.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, domeniu public; micșorată.</small>'),
  fereastra:fig('edge-fereastra.webp',1000,297,'Fereastra Microsoft Edge: sus fila Biblioteca de probă și butonul plus; dedesubt săgeata Înapoi, butonul Reîmprospătare și bara de adrese cu www.biblioteca-exemplu.ro/index.html; jos pagina cu legăturile Ariciul și Lupul','Edge: sus <b>fila</b>, dedesubt <b>bara de adrese</b> (în chenare), jos o pagină de probă, făcută de noi. „Nesigur” apare doar la pagina noastră de probă. '+CAPT),
  douaFile:fig('edge-doua-file.webp',751,104,'Două file deschise în Edge, Lupul și Ariciul, fiecare cu un x; în dreapta lor, butonul plus','Două file: <b>Lupul</b> (aleasă) și <b>Ariciul</b>, fiecare cu <b>×</b>. În dreapta lor, <b>+</b>. '+CAPT0),
  adresa:fig('edge-adresa-scrisa.webp',631,104,'Bara de adrese din Edge, cu adresa www.biblioteca-exemplu.ro/lup.html scrisă, înainte de Enter','Adresa e scrisă în bara de adrese (chenarul roșu). Urmează tasta Enter. '+CAPT),
  sageti:fig('edge-sageti.webp',751,104,'Colțul din stânga sus al lui Edge: săgeata Înapoi, săgeata Înainte, butonul Reîmprospătare și bara de adrese cu pagina Lupul','De la stânga: <b>←</b> Înapoi, <b>→</b> Înainte (apare după ce ai apăsat Înapoi), <b>↻</b> Reîmprospătare. '+CAPT0),
  cuvinte:fig('edge-cuvinte-bara.webp',691,226,'Filă nouă în Edge; în bara de adrese sunt scrise cuvintele arici hrana, iar dedesubt sugestia arici hrana - Căutare','Cuvinte, nu o adresă: Edge propune „arici hrana - Căutare”. '+CAPT0),
  caseta:fig('bing-caseta.webp',920,122,'Caseta de căutare Bing cu cuvintele arici hrană și, dedesubt, butoanele Toate, Mod de inteligență artificială, Cumpărături, Imagini, Videoclipuri, Hărți, Știri','Bing, în română: două cuvinte-cheie în casetă. Dedesubt sunt butoanele lui: cu ele alegi felul rezultatelor. <small>Captură din Bing, în română.</small>'),
  rezultat:fig('bing-rezultat.webp',878,160,'Un rezultat Bing: sus numele site-ului explicativ.ro și adresa, dedesubt titlul violet Ce mănâncă ariciul, apoi două rânduri de descriere','Un rezultat adevărat, din Bing: sus <b>site-ul și adresa</b>, apoi <b>titlul</b>, colorat (la Bing, violet): e legătura; apoi <b>descrierea</b>. <small>Captură din Bing, în română; rezultatul e de pe site-ul explicativ.ro.</small>')
};
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;

const SCHEMA=`<div class="schema" role="img" aria-label="Schema: browserul cu filele lui; o adresă în bara de adrese duce la o pagină; dacă nu știi adresa, cauți cu cuvinte-cheie; din rezultate alegi după titlu, adresă și descriere">
  <div class="sc-box"><b>Browserul (Edge) și filele</b><span>lucrezi într-o filă nouă (+), o închizi cu ×</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Știi adresa?</b><span>o scrii în bara de adrese și apeși Enter; ← Înapoi, → Înainte, ↻ Reîmprospătare</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Nu știi adresa? Cauți</b><span>2-3 cuvinte-cheie; <code>"expresie exactă"</code> între ghilimele drepte</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Alegi un rezultat</b><span>sari peste Sponsorizat; citești titlul, adresa, descrierea</span></div>
</div>`;

/* ---- „Acum în browserul tău adevărat” (modul lecție: după atelier, înainte de verificare). FĂRĂ profesor, pe calculatorul
   comun: doar file noi, închise la sfârșit; fereastra browserului rămâne deschisă (în ea e lecția); nimic de salvat, niciun cont. ---- */
const LAB=[
  'Lecția rămâne deschisă în fila ei. Lucrezi doar în file noi și le închizi la sfârșit cu ×. Nu închide fereastra browserului cu X: s-ar închide și lecția. Scrie în caiet titlul <b>Concurs de căutare</b>, întrebarea <i>Ce mănâncă lupul cenușiu?</i> și cele trei căutări de la rândurile 3, 4 și 5: în fila nouă nu le mai vezi. Ai uitat ceva? Clic pe fila lecției, citește, apoi clic pe fila ta.<details class="verif"><summary>Ai închis din greșeală lecția?</summary><ol><li>Ai închis doar fila lecției: ține apăsate <kbd>Ctrl</kbd> (jos, în stânga) și <kbd>Shift</kbd> (deasupra lui) și apasă o dată <kbd>T</kbd>. Fila lecției reapare.</li><li>Ai închis toată fereastra browserului: pornește-l din Start, ca la lecția 13 (scrie <b>edge</b> și dă clic pe <b>Microsoft Edge</b>), apoi <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd>. Închide cu X fereastra în care nu e lecția (dacă sunt două, pe amândouă).</li><li>În lecție, apasă <b>Continuă de unde ai rămas</b>, dacă apare.</li></ol></details>',
  'Deschide o filă nouă: clic pe <b>+</b>, în dreapta filei lecției. Cursorul e deja în bara de adrese.',
  '<b>Formularea 1, propoziția întreagă.</b> Scrie <code>bună ziua vreau să știu ce mănâncă lupul cenușiu</code> și apasă <kbd>Enter</kbd>. (Nu știi încă să scrii ă, â, î, ș, ț? Scrie a, a, i, s, t: de obicei motorul găsește paginile și așa.) Citește primele 3 titluri de rezultate. Scrie în caiet câte dintre ele răspund la întrebare.',
  '<b>Formularea 2, cuvinte-cheie.</b> Fă clic în bara de adrese: tot ce era scris se selectează. Scrie <code>lupul cenușiu hrană</code>, fără ghilimele, și apasă <kbd>Enter</kbd>. Câte dintre primele 3 titluri răspund acum? Scrie în caiet.',
  '<b>Formularea 3, cu ghilimele.</b> Clic din nou în bara de adrese și scrie <code>"lupul cenușiu" hrană</code>. Ghilimelele drepte: <kbd>Shift</kbd> și tasta de lângă <kbd>Enter</kbd>; dacă apare Ț, șterge-l cu <kbd>Backspace</kbd> și apasă <kbd>Shift</kbd> + <kbd>AltGr</kbd> + aceeași tastă. Dacă după ghilimea nu apare nimic, apasă o dată bara de spațiu: apare ghilimeaua. Apoi scrie mai departe. La ghilimeaua de după <i>cenușiu</i> fă la fel, apoi încă un spațiu și scrie <i>hrană</i>. Apasă <kbd>Enter</kbd> și scrie în caiet ce s-a schimbat.',
  '<b>Formularea 4, altă limbă</b> (dacă ai timp): caută în engleză <code>gray wolf food</code>. Vin pagini în engleză.',
  'Alege un rezultat: sari peste ce e marcat <b>Sponsorizat</b>, citește titlul și descrierea. Deschide-l cu un clic pe titlu. Scrie în caiet două lucruri pe care le mănâncă lupul cenușiu.',
  'Apasă <b>←</b> (Înapoi): ești din nou la rezultate. Apasă <b>→</b> (Înainte): din nou pe pagină. Apasă <b>↻</b> (Reîmprospătare): pagina se încarcă din nou.',
  'Închide fila ta cu <b>×</b> de pe ea. Fila lecției rămâne. <details class="verif"><summary>Verifică-te, după ce ai scris</summary> De obicei, cu propoziția întreagă apar sus și pagini care nu răspund. Cu cuvintele-cheie, mai multe titluri sunt despre hrana lupului. Cu ghilimele, rezultatele au expresia „lupul cenușiu” cu cuvintele lipite. Lupul cenușiu mănâncă mai ales carne: iepuri, cerbi, mistreți și alte animale; la nevoie, și fructe. Dacă rezultatele au venit de la alt motor decât Bing (de exemplu Google), browserul tău e pus așa: e în regulă.</details>'
];

/* lumea simulatorului: pornește din fila lecției sau dintr-o filă nouă */
const B=o=>Object.assign({t:'browser'},o);

JocMotor.porneste({
  cheie:'lectie_v_m2_l14',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 14”, pasul real înainte de verificare
  titlu:'Navigarea pe web. Căutarea informațiilor cu motoare de căutare',
  marca:'Lecția <b>14</b> · clasa a V-a',
  h1:'Navigarea pe web. Căutarea informațiilor cu motoare de căutare',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U3', unitateTitlu:'Internetul ca sursă de documentare',
  competente:['CS.1.3'], lectii:'14',
  ancoraText:'Din programă (CS.1.3, unitatea V-U3, lecția 14): Serviciul World Wide Web — navigarea pe Internet; căutarea informațiilor pe Internet utilizând motoare de căutare',
  intro:`<p>Înveți să lucrezi cu browserul: filele, bara de adrese, legăturile și săgețile lui. Apoi înveți să cauți cu un motor de căutare. Afli ce cuvinte scrii, când pui ghilimele și cum alegi un rezultat. La atelier faci un concurs de căutare într-un browser din pagină. Apoi faci același concurs în browserul tău adevărat, într-o filă nouă. La sfârșit verifici ce știi, cu 5 întrebări.</p>
<p><b>La final știi:</b> să deschizi o pagină după adresa ei și să mergi pe legături. Știi să lucrezi cu mai multe file. Știi să găsești o informație cu un motor de căutare.</p>
<p><b>Ai nevoie de:</b> lecția 13 — Internetul și serviciile lui. Web-ul înseamnă pagini și site-uri. Paginile le deschizi cu un browser. Fiecare pagină are o adresă, de exemplu <code>www.exemplu.ro</code>. Lecția 8 — ferestrele, cu butonul X, bara de activități și butonul Start. Lecția 9 — în Explorer, bara de adresă arată calea unui folder.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 9 pași scurți. Primul îți arată la ce folosește lecția. După fiecare dintre ceilalți faci un exercițiu mic, fără puncte, și câteva gesturi în browserul tău adevărat, într-o filă nouă. „Încă un exercițiu” îl faci dacă ai timp.</li><li>La atelier faci un concurs de căutare într-un browser din pagină.</li><li>Acum în browserul tău adevărat: același concurs, pe Internet, într-o filă nouă pe care o închizi la sfârșit.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,
  banda:'<span class="bd-tab">Lecția 14</span><span class="bd-adr"><b>www.biblioteca-exemplu.ro</b>/lup.html</span><span class="bd-q">"lupul cenușiu" hrană</span>',
  nivele:[
{t:'Navigarea pe web. Căutarea informațiilor cu motoare de căutare',final:true,lectii:[14],
 continuturi:['Serviciul World Wide Web:','- navigarea pe Internet;','- căutarea informațiilor pe Internet utilizând motoare de căutare;'],
 obiectiv:'deschizi o pagină după adresa ei, mergi pe legături și înapoi, lucrezi cu file și găsești o informație cu un motor de căutare, cu cuvinte-cheie și ghilimele.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: găsești ce cauți pe web',
   text:`<p>Ai de făcut un referat despre arici. Pe vremuri mergeai la bibliotecă și căutai în fișierul ei: sertare cu cartonașe, așezate după cuvinte. Cartonașul îți spunea unde e cartea.</p>
<p>Azi, pe web sunt mai multe pagini decât cărți în toate bibliotecile. Le deschizi cu un program, <strong>browserul</strong>. Le găsești cu un <strong>motor de căutare</strong>, tot după cuvinte.</p>
<p>Azi înveți amândouă: să mergi din pagină în pagină și să cauți bine.</p>
${IMG.fisier}`},
  /* ---- pasul 1: browserul ---- */
  {t:'Browserul: programul cu care deschizi pagini web',
   text:`<p>Paginile web le deschizi cu un program numit <mark>browser</mark> (se citește „brauzăr”), cum ai aflat la lecția 13. Pe calculatoarele cu Windows e, de obicei, <strong>Microsoft Edge</strong>. Pictograma lui e un val albastru cu verde, încolăcit ca litera e. Alte browsere: <strong>Google Chrome</strong>, <strong>Mozilla Firefox</strong>.</p>
<p>Toate arată la fel: sus <strong>filele</strong> (fiecare ține o pagină), apoi butoanele și <strong>bara de adrese</strong> (cu adresa paginii), dedesubt pagina.</p>
<p>Chiar acum citești lecția într-un browser.</p>
${IMG.fereastra}
${ACUM('Uită-te sus, deasupra lecției. Găsește fila lecției și bara de adrese.','Citește adresa lecției din bara de adrese: în ea scrie <code>learninghub</code>. Nu scrie nimic acolo deocamdată.')}`,
   altfel:`<p>Browserul e ca un televizor, iar paginile web sunt ca emisiunile. Televizorul e unul singur; emisiunile pe care le vezi în el sunt foarte multe.</p>`,
   incearca:{t:'choice',q:'Care dintre acestea este un browser?',o:['Microsoft Edge','Explorer','Paint','Windows'],ok:0,
    ajutor:'Browserul e programul cu care deschizi pagini web. Care dintre ele face asta?',
    why:'Edge e browserul. Explorer arată fișierele și folderele (lecția 9), Paint e pentru desene, iar Windows e sistemul de operare (lecția 8).'},
   inca:[
    {t:'tf',q:'Pagina web și browserul sunt același lucru.',ok:false,ajutor:'Care e programul și care e ce deschizi în el?',
     why:'Fals. Browserul e programul. Pagina web e ce deschizi în el; într-un browser poți deschide foarte multe pagini.'}
   ]},
  /* ---- pasul 2: filele ---- */
  {t:'Filele: mai multe pagini în aceeași fereastră',
   text:`<p>Sus, în browser, stau <mark>filele</mark>. Fiecare filă ține o pagină și are scris pe ea titlul paginii.</p>
<ul><li><b>Filă nouă:</b> clic pe <b>+</b>, în dreapta filelor. În fila nouă, bara de adrese e goală, iar pagina din fila veche rămâne.</li>
<li><b>Treci la altă filă:</b> clic pe ea.</li>
<li><b>Închizi o filă:</b> clic pe <b>×</b> de pe ea.</li></ul>
<p>Lecția stă în fila ei. Ca s-o păstrezi deschisă, lucrezi mereu într-o filă nouă. Fila nouă acoperă lecția: <b>scrie întâi în caiet ce ai de tastat</b>, apoi apasă +.</p>
${IMG.douaFile}
${ACUM('Fă clic pe <b>+</b>, în dreapta filei lecției: se deschide o filă nouă.','Fă clic pe fila lecției: te-ai întors la lecție.','Fă clic pe <b>×</b> de pe fila nouă: s-a închis, lecția a rămas.')}`,
   exemplu:`<p>Ține mouse-ul pe <b>+</b>: Edge îți arată un sfat, „Filă nouă (Ctrl+T)”. Adică poți deschide o filă nouă și din tastatură: ții apăsată tasta <kbd>Ctrl</kbd>, din colțul din stânga jos, și apeși <kbd>T</kbd>.</p>
<p>Atenție: dacă închizi <b>fereastra</b> browserului cu X (lecția 8), se închid toate filele, deci și lecția.</p>
<p>Ai uitat ce aveai de scris? Clic pe fila lecției, citește, apoi clic pe fila ta.</p>
<p>Ai închis din greșeală fila lecției? Ții apăsate <kbd>Ctrl</kbd> și <kbd>Shift</kbd> (deasupra lui Ctrl) și apeși <kbd>T</kbd>: fila se deschide din nou.</p>`,
   altfel:`<p>Filele sunt ca separatoarele dintr-un dosar. Fiecare separator ține altă foaie. Cu un clic pe separator scoți în față foaia de care ai nevoie, iar celelalte rămân în dosar.</p>`,
   incearca:B({q:'Browserul din pagină are deschisă lecția. Deschide o filă nouă, apoi întoarce-te la fila lecției.',start:'lectie',
    checks:[{k:'filaNoua',ce:'Ai deschis o filă nouă (cu +)'},{k:'lectie',ce:'Fila lecției e tot deschisă',msg:'Ai închis fila lecției. Apasă „Ia-o de la capăt” și încearcă din nou: + deschide fila nouă, iar la lecție te întorci cu un clic pe fila ei.'},{k:'activaLectie',ce:'Ești din nou în fila lecției',msg:'Întoarce-te la lecție: clic pe fila ei, sus.'}],
    sol:[['tab'],['sel',0]],gresit:[['tab']],
    ajutor:'Butonul + e sus, în dreapta filelor. La lecție te întorci cu un clic pe fila ei.',
    why:'Fila nouă s-a deschis lângă lecție, iar lecția a rămas în fila ei: un clic pe fila lecției a scos-o din nou în față.'}),
   inca:[
    B({q:'Sunt deschise lecția și o filă nouă. Închide fila nouă cu × de pe ea. Lecția trebuie să rămână deschisă.',start:['lectie','nou'],
     checks:[{k:'inchise',min:1,ce:'Ai închis o filă'},{k:'lectie',ce:'Fila lecției e tot deschisă',msg:'Ai închis fila lecției. Apasă „Ia-o de la capăt” și închide doar fila nouă, cu × de pe ea.'},{k:'file',max:1,min:1,ce:'A rămas o singură filă'}],
     sol:[['close',1]],gresit:[['close',0]],
     ajutor:'Fila nouă e a doua, cu titlul „Filă nouă”. × e pe ea, în dreapta.',
     why:'Ai închis doar fila ta. Lecția a rămas, în fila ei.'}),
    {t:'tf',q:'Când deschizi o filă nouă, pagina din fila veche se închide.',ok:false,ajutor:'Uită-te la captura cu două file.',
     why:'Fals. Pagina veche rămâne în fila ei; te întorci la ea cu un clic pe filă.'}
   ]},
  /* ---- pasul 3: bara de adrese ---- */
  {t:'Bara de adrese: scrii adresa, apeși Enter',
   text:`<p>Fiecare pagină are adresa ei (lecția 13), de exemplu <code>www.biblioteca-exemplu.ro</code>. O scrii în <mark>bara de adrese</mark>, lungă, sus în browser. Edge o numește „Bara de adrese și de căutare” (<i>Address and search bar</i>).</p>
<ol><li>Într-o filă nouă, cursorul e deja în bara de adrese.</li><li>Scrii adresa literă cu literă, fără spații.</li><li>Apeși <kbd>Enter</kbd>: tasta mare din dreapta literelor, cu săgeata ↵.</li></ol>
<p>Într-o filă cu o pagină, un clic în bara de adrese selectează toată adresa veche: ce scrii o înlocuiește.</p>
${IMG.adresa}
${ACUM('Scrie în caiet adresa <code>'+ADR_LH+'</code>. Apoi clic pe <b>+</b> și, în fila nouă, scrie adresa din caiet și apasă <kbd>Enter</kbd>: se deschide pagina cu lecțiile clasei a V-a.','Închide fila cu <b>×</b>.')}`,
   exemplu:`<p>O literă greșită și ajungi pe altă pagină sau pe niciuna. Edge îți spune atunci „Hmm... nu se poate accesa această pagină” și „Verificați dacă există o eroare de ortografie…”. Corectezi adresa și apeși din nou <kbd>Enter</kbd>.</p>
<p>Și Explorer are o bară de adresă (lecția 9), dar ea arată calea unui folder. Aici e adresa unei pagini web.</p>
<p>În browserul din pagină, pe telefon, în locul tastei Enter apeși butonul <b>Enter ↵</b> de lângă bară.</p>`,
   altfel:`<p>Adresa web e ca adresa de pe un plic: dacă greșești o literă din numele străzii, scrisoarea ajunge la altă casă sau nicăieri.</p>`,
   incearca:B({q:'Lecția e în prima filă. În fila nouă, scrie adresa <code>'+ADR_LH+'</code> și apasă Enter.',start:['lectie','nou'],
    checks:[{k:'tastat',a:ADR_LH,ce:'Ai deschis pagina cu lecțiile clasei, scriindu-i adresa',msg:'Pagina cu lecțiile nu s-a deschis. Verifică adresa literă cu literă, apoi apasă Enter.'}],
    sol:[['go',ADR_LH]],gresit:[['go','learninghub-8z6.pages.de/lectii/v/']],
    ajutor:'Scrie în bara de adrese, sus, exact: '+ADR_LH+' și apasă Enter.',
    why:'Adresa scrisă exact, apoi Enter: browserul a adus pagina.'}),
   inca:[
    B({q:'Cineva a scris greșit o adresă și a primit o eroare. Corecteaz-o în bara de adrese: pagina bună e <code>www.biblioteca-exemplu.ro</code>.',start:['lectie','eroare:www.biblioteca-exmplu.ro'],
     checks:[{k:'tastat',a:'www.biblioteca-exemplu.ro',ce:'Pagina bibliotecii s-a deschis',msg:'Pagina nu s-a deschis. Compară literă cu literă: „exmplu” sau „exemplu”?'}],
     sol:[['go','www.biblioteca-exemplu.ro']],gresit:[['go','www.biblioteca-exmplu.ro']],
     ajutor:'Fă clic în bara de adrese: totul se selectează. Scrie adresa corectă și apasă Enter.',
     why:'O literă lipsă („exmplu”) ducea la eroare. Adresa se scrie exact.'}),
    {t:'choice',q:'Într-o filă cu o pagină faci un clic în bara de adrese. Ce se întâmplă cu adresa scrisă acolo?',o:['Se selectează toată: ce scrii o înlocuiește','Se șterge și se deschide o filă nouă','Pagina se încarcă din nou','Nu se întâmplă nimic'],ok:0,
     ajutor:'Recitește ultima propoziție din pas.',why:'Un clic în bara de adrese selectează toată adresa. Scrii direct pe ea.'}
   ]},
  /* ---- pasul 4: legătura și săgețile ---- */
  {t:'Legătura și săgețile: Înapoi, Înainte, Reîmprospătare',
   text:`<p>O <mark>legătură</mark> (în engleză, <i>link</i>) e un text sau o imagine pe care dai clic ca să ajungi la altă pagină. Textul legăturii e adesea albastru și subliniat. Când treci cu mouse-ul peste ea, săgeata se face mână.</p>
<p>În stânga barei de adrese sunt:</p>
<ul><li><b>←</b> <mark>Înapoi</mark>: la pagina de dinainte;</li><li><b>→</b> <mark>Înainte</mark>: din nou la pagina de unde te-ai întors. Apare abia după ce ai apăsat Înapoi;</li><li><b>↻</b> <mark>Reîmprospătare</mark>: încarcă din nou aceeași pagină.</li></ul>
${IMG.sageti}
${ACUM('Filă nouă (<b>+</b>), scrie adresa din caiet, <code>'+ADR_LH+'</code>, și <kbd>Enter</kbd>.','Clic pe o legătură: titlul lecției 8, „Ce face un sistem de operare…”.','Apasă <b>←</b>, apoi <b>→</b>, apoi <b>↻</b>. Închide fila cu <b>×</b>.')}`,
   exemplu:`<p>Pe pagina bibliotecii dai clic pe legătura <b>Lupul</b>: se deschide pagina lupului. Apeși <b>←</b> și ești din nou la bibliotecă. Abia acum apare <b>→</b>: îl apeși și ești iar la lup.</p>
<p>Ține mouse-ul pe o săgeată: Edge îți arată un sfat, de exemplu „Reîmprospătați (Ctrl+R)”.</p>`,
   altfel:`<p>E ca într-o carte cu trimiteri: „vezi pagina 40”. Mergi la pagina 40 (legătura), apoi dai înapoi la pagina de unde ai plecat (Înapoi). Dacă te răzgândești, sari iar la 40 (Înainte).</p>`,
   incearca:B({q:'Ești pe pagina bibliotecii. Mergi pe legătura <b>Lupul</b>, apoi întoarce-te la bibliotecă cu ← Înapoi.',start:'www.biblioteca-exemplu.ro',
    checks:[{k:'link',a:'www.biblioteca-exemplu.ro/lup.html',ce:'Ai deschis pagina lupului, din legătură'},{k:'inapoi',ce:'Ai folosit ← Înapoi'},{k:'pagina',a:'www.biblioteca-exemplu.ro',ce:'Acum ești din nou pe pagina bibliotecii'}],
    sol:[['link','www.biblioteca-exemplu.ro/lup.html'],['back']],gresit:[['link','www.biblioteca-exemplu.ro/lup.html']],
    ajutor:'Legătura Lupul e pe pagină, albastră și subliniată. ← e primul buton din stânga barei de adrese.',
    why:'Legătura te-a dus la lup, iar ← te-a întors exact de unde ai plecat.'}),
   inca:[
    B({q:'Ești pe pagina ariciului, venit de la bibliotecă. Întoarce-te la bibliotecă, apoi mergi din nou la arici fără să mai dai clic pe vreo legătură.',start:[['www.biblioteca-exemplu.ro','www.biblioteca-exemplu.ro/arici.html']],
     checks:[{k:'inapoi',ce:'Ai folosit ← Înapoi'},{k:'inainte',ce:'Ai folosit → Înainte',msg:'Nu ai folosit → Înainte. Apare lângă ← după ce te-ai întors.'},{k:'pagina',a:'www.biblioteca-exemplu.ro/arici.html',ce:'Ești din nou pe pagina ariciului'}],
     sol:[['back'],['fwd']],gresit:[['back'],['link','www.biblioteca-exemplu.ro/arici.html']],
     ajutor:'Întâi ←. Apoi caută săgeata → apărută lângă ea.',
     why:'Înainte te-a dus la pagina de unde te întorseseși, fără nicio legătură.'}),
    {t:'tf',q:'În Edge, săgeata → Înainte se vede de la început, pe orice pagină.',ok:false,ajutor:'Recitește ce scrie în pas despre →.',
     why:'Fals. Edge arată → abia după ce ai apăsat ← Înapoi: atunci ai unde să mergi înainte.'}
   ]},
  /* ---- pasul 5: motorul de căutare ---- */
  {t:'Motorul de căutare: când nu știi adresa',
   text:`<p>Adesea nu știi adresa paginii. Atunci folosești un <mark>motor de căutare</mark>: un site care găsește pagini după cuvintele tale. Exemple: <strong>Bing</strong>, <strong>Google</strong>.</p>
<p>Nu le încurca: Edge e <strong>programul</strong>, browserul. Bing e un <strong>site</strong>, pe care îl deschizi în browser.</p>
<p>Cel mai scurt drum: scrii cuvintele direct în bara de adrese și apeși <kbd>Enter</kbd>. Edge, cum vine pe calculator, le trimite la Bing. Primești o pagină cu <mark>rezultate</mark>: legături spre paginile găsite. Cele marcate <b>Sponsorizat</b> sunt reclame, plătite ca să stea sus: le sari.</p>
${IMG.cuvinte}
${ACUM('Filă nouă (<b>+</b>). Scrie în bara de adrese <code>planeta Marte</code> și apasă <kbd>Enter</kbd>.','Uită-te sus, în bara de adrese: ce motor de căutare a deschis browserul? Închide fila cu <b>×</b>.')}`,
   altfel:`<p>Gândește-te la bibliotecă. Browserul e ușa prin care intri. Motorul de căutare e fișierul cu cartonașe: îi spui un cuvânt și îți arată unde sunt paginile potrivite.</p>`,
   incearca:B({q:'În fila nouă, scrie în bara de adrese cuvintele <b>planeta Marte</b> și apasă Enter. Apoi deschide rezultatul despre planetă.',start:['lectie','nou'],
    checks:[{k:'cautare',are:[['marte']],fara:[],ce:'Ai căutat cuvintele planeta Marte'},{k:'dinRezultate',a:'www.astronomie-exemplu.ro/marte',ce:'Ai deschis din rezultate pagina despre planetă'}],
    sol:[['cauta','planeta Marte'],['rez','www.astronomie-exemplu.ro/marte']],gresit:[['go','www.planeta-marte.ro']],
    ajutor:'Scrie cele două cuvinte în bara de adrese, nu o adresă. Apoi clic pe titlul albastru „Planeta Marte, planeta roșie”.',
    why:'Cuvintele din bara de adrese au plecat la motorul de căutare, iar din rezultate ai deschis pagina potrivită.'}),
   inca:[
    {t:'classify',q:'Program sau site? Sortează.',cats:['Browser (program)','Motor de căutare (site)'],items:[['Microsoft Edge',0],['Bing',1],['Google Chrome',0],['Google (site-ul de căutare)',1],['Mozilla Firefox',0]],
     ajutor:'Cu care deschizi paginile? Care e o pagină pe care cauți?',
     why:'Edge, Chrome și Firefox sunt browsere, adică programe. Bing și Google sunt motoare de căutare, adică site-uri.'},
    {t:'choice',q:'Scrii în bara de adrese din Edge cuvintele <i>lupul carpatin</i> și apeși Enter. Ce se întâmplă?',o:['Edge le trimite la Bing și îți arată rezultatele','Edge deschide o pagină cu adresa „lupul carpatin”','Nu se întâmplă nimic: acolo merg doar adrese','Se închide fila'],ok:0,
     ajutor:'Recitește ultimul paragraf al pasului.',why:'Cuvintele care nu sunt o adresă pleacă la motorul de căutare. Edge, cum vine, le trimite la Bing.'}
   ]},
  /* ---- pasul 6: cuvintele-cheie ---- */
  {t:'Cuvintele-cheie: puține și importante',
   text:`<p>Motorul de căutare nu citește ca un om. Caută paginile în care apar cuvintele tale. De aceea scrii <mark>cuvinte-cheie</mark>: puține cuvinte, cele importante.</p>
<p><b>Metoda, în 4 pași:</b></p>
<ol><li>Te întrebi ce vrei să afli.</li><li>Alegi 2-3 cuvinte: despre cine e vorba și ce vrei să afli despre el.</li><li>Scoți politețurile și cuvintele de legătură: „bună ziua”, „vreau”, „te rog”, „și”, „despre”.</li><li>Cauți. Dacă rezultatele nu-ți răspund, <strong>reformulezi</strong>: schimbi un cuvânt, adaugi unul sau încerci în engleză.</li></ol>
${IMG.caseta}
${ACUM('Filă nouă (<b>+</b>). Caută <code>arici hrană</code>: scrie în bara de adrese și apasă <kbd>Enter</kbd>. Nu știi încă să scrii ă? Scrie <code>arici hrana</code>: de obicei merge și așa.','Citește primele două titluri. Închide fila cu <b>×</b>.')}`,
   exemplu:`<p>Întrebarea: „Ce mănâncă ursul brun?”. Despre cine: <b>ursul brun</b>. Ce vreau să aflu: <b>hrana</b>. Caut: <code>urs brun hrană</code>.</p>
<p>Propoziția „Bună ziua, vreau să știu ce mănâncă ursul brun” aduce adesea, sus, pagini care au doar „bună ziua” sau „vreau să știu”.</p>
<p>Deasupra rezultatelor sunt butoanele motorului: Imagini, Videoclipuri, Știri. Cu ele păstrezi un singur fel de rezultate.</p>`,
   altfel:`<p>Fiecare cuvânt pe care îl scrii îl trage pe motor spre paginile care îl au. „Bună ziua” îl trage spre pagini cu saluturi, nu spre arici: doar încurcă.</p>`,
   incearca:{t:'cautare',q:'Vrei să afli ce mănâncă ariciul. Scrie 2-3 cuvinte-cheie.',ok:'arici hrană',tipic:'bună ziua vreau să știu ce mănâncă ariciul',
    are:[['arici'],['hrana','mananca','hraneste','mancare']],max:4,ghilimele:false,
    ajutor:'Despre cine e vorba? Ce vrei să afli despre el? Câte un cuvânt pentru fiecare.',
    why:'Două cuvinte-cheie spun exact ce cauți: <code>arici hrană</code> (merge și <code>arici mănâncă</code> sau <code>arici mâncare</code>).'},
   inca:[
    B({q:'Caută ce mănâncă ursul brun, cu 2-4 cuvinte-cheie, și deschide un rezultat care îți răspunde.',start:['lectie','nou'],
     checks:[{k:'cautare',are:[['urs'],['hrana','mananca','hraneste','mancare']],max:4,ce:'Ai căutat cu 2-4 cuvinte-cheie: ursul și hrana'},{k:'dinRezultate',a:['www.enciclopedie-exemplu.ro/urs','www.parc-exemplu.ro/ursul-brun'],ce:'Ai deschis o pagină care răspunde',msg:'Deschide o pagină despre hrana ursului, nu reclama de sus.'}],
     sol:[['cauta','urs brun hrană'],['rez','www.enciclopedie-exemplu.ro/urs']],gresit:[['cauta','urs brun hrană'],['rez','www.magazin-exemplu.ro/urs-plus']],
     ajutor:'Scrie în bara de adrese: urs brun hrană. Apoi clic pe un titlu despre urs, nu pe cel de sus, care vinde ceva.',
     why:'Cuvintele-cheie au adus pagini despre hrana ursului. Ai deschis una care răspunde.'}),
    {t:'choice',q:'Ai căutat <i>hrana ariciului din grădina noastră în nopțile de vară</i> și n-ai găsit ce vrei. Ce faci?',o:['Păstrez doar cuvintele importante: arici hrană','Adaug și mai multe cuvinte','Scriu aceeași căutare din nou','Renunț: nu există pagini despre asta'],ok:0,
     ajutor:'Recitește pasul 4 al metodei: ce faci când rezultatele nu-ți răspund?',why:'Reformulezi: păstrezi cuvintele care contează. Mai multe cuvinte, puse ca o poveste, încurcă motorul.'}
   ]},
  /* ---- pasul 7: ghilimelele ---- */
  {t:'Ghilimelele: expresia exactă',
   text:`<p>Uneori cauți cuvinte care trebuie să stea <strong>exact</strong> așa, lipite, în aceeași ordine: un titlu de carte sau un vers.</p>
<p>Atunci scrii expresia între <mark>ghilimele</mark> drepte: <code>"capra cu trei iezi"</code>. Motorul păstrează doar paginile în care apare toată expresia, cu cuvintele lipite.</p>
<p>Fără ghilimele, motorul aduce și pagini în care cuvintele sunt împrăștiate sau în altă ordine.</p>
${ACUM('Citește întâi mai jos, la „Uite cum”, cum scrii ghilimelele. Apoi: filă nouă (<b>+</b>), caută <code>"capra cu trei iezi" poveste</code>, cu ghilimele drepte, și apasă <kbd>Enter</kbd>.','Uită-te în caseta motorului: ghilimelele sunt acolo? Închide fila cu <b>×</b>.')}`,
   exemplu:`<p><b>Cum scrii ghilimelele drepte <code>"</code>:</b> ții apăsată tasta <kbd>Shift</kbd> (⇧, mare, în stânga rândului cu Z) și apeși tasta de lângă <kbd>Enter</kbd> pe care e desenat semnul <code>"</code>. Dacă apare Ț, tastatura e pe română: șterge-l cu <kbd>Backspace</kbd> (tasta lungă de deasupra lui Enter, cu săgeata ←), apoi ține apăsate <kbd>Shift</kbd> și <kbd>AltGr</kbd> (în dreapta barei de spațiu) și apasă aceeași tastă.</p>
<p>Pe unele calculatoare, după ghilimea <b>nu apare nimic</b>. E normal: nu o apăsa din nou (ai avea două). Apasă o dată bara de spațiu: apare ghilimeaua. Apoi scrie mai departe. La ghilimeaua de la sfârșit fă la fel; dacă urmează alt cuvânt, mai apasă o dată bara de spațiu.</p>
<p>Ghilimelele românești „ ” nu merg la Bing: atunci el caută cuvintele oriunde. Pe telefon, <code>"</code> e pe tastatura cu semne și cifre.</p>`,
   altfel:`<p>Ghilimelele sunt ca o sfoară care leagă cuvintele între ele: motorul nu mai are voie să le despartă sau să le schimbe locul.</p>`,
   incearca:{t:'cautare',q:'Cauți exact titlul cărții <b>Micul prinț</b>. Ce scrii în caseta de căutare?',ok:'"Micul prinț"',tipic:'Micul prinț',
    fraza:'micul print',fara:[],
    ajutor:'Tot titlul, între ghilimele drepte: una la început, una la sfârșit.',
    why:'Ghilimelele drepte cer expresia exactă: <code>"Micul prinț"</code>.'},
   inca:[
    B({q:'Caută povestea cu titlul exact <b>Capra cu trei iezi</b>, cu ghilimele drepte, și deschide pagina poveștii.',start:['lectie','nou'],ghilimele:true,
     checks:[{k:'cautare',fraza:'capra cu trei iezi',fara:[],ce:'Ai căutat expresia exactă, între ghilimele drepte',msg:'Căutarea nu are expresia între ghilimele drepte: "capra cu trei iezi".'},{k:'dinRezultate',a:'www.povesti-exemplu.ro/capra-cu-trei-iezi',ce:'Ai deschis pagina poveștii'}],
     sol:[['cauta','"capra cu trei iezi"'],['rez','www.povesti-exemplu.ro/capra-cu-trei-iezi']],gresit:[['cauta','„capra cu trei iezi”'],['rez','www.ferma-exemplu.ro/capre']],
     ajutor:'Scrie în bara de adrese "capra cu trei iezi", cu ghilimelele drepte. Butonul Scrie " te ajută pe telefon.',
     why:'Cu ghilimele au rămas doar paginile cu tot titlul. Pagina fermei, cu „trei capre” și „iezi” împrăștiate, a dispărut.'}),
    {t:'tf',q:'La Bing, ghilimelele românești „ ” merg la fel ca ghilimelele drepte " ".',ok:false,ajutor:'Recitește „Uite cum”.',
     why:'Fals. Bing nu le ia pe cele românești drept ghilimele: caută cuvintele oriunde. Folosește ghilimelele drepte.'}
   ]},
  /* ---- pasul 8: rezultatul + ce am învățat ---- */
  {t:'Citești un rezultat și îl alegi',
   text:`<p>Un <mark>rezultat</mark> are trei părți:</p>
<ul><li>sus, numele site-ului și <strong>adresa</strong>: îți spun pe ce site e pagina;</li><li><strong>titlul</strong>, colorat (albastru sau violet): e legătura spre pagină;</li><li><strong>descrierea</strong>: câteva rânduri din pagină.</li></ul>
<p><b>Cum alegi:</b></p>

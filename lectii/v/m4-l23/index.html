<style>

/* tema: bara de titlu a lui Paint și bara de stare cu mărimea pânzei */

.banda .bd-t{flex:none;font-size:.76rem;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 9px}

.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}

/* legăturile din legende și trimiterile la pași: ținte de atins ≥ 32 px și pe telefon (regula 20) */

<script>
/* Lecția 23, clasa a V-a (M4): „Evaluare sumativă: editor grafic (produs digital)” — evaluare sumativă, ultima lecție din V-U4.
   Legea: LearningHub\_campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele, deciziile și probele: surse.md, _proba\.
   Nu predă nimic nou: pregătește proba practică (ce cere fiecare specificație, cum arată o lucrare bună, autoverificarea).
   Activitatea profesorului (Info_Gimnaziu_2026\data\activitati_lectii_V_VI.json, întocmai): „Probă practică: realizarea unui produs
   grafic după specificații date (dimensiune, text, cel puțin două obiecte, salvare într-un format cerut). Notare după grila de
   produs.” Resursa: „test practic de unitate, grila de produs”. Testul unității V-U4 NU există în documentele profesorului
   (teste_sumative.json are doar V-U1) → probă de antrenament pe părți C/B/A, cu punctele paginii (ghidul IV.2 §6-7, regula 37);
   grila de produs (instrumente\Grila_produs.md) copiată întocmai, pentru autoverificare; întrebările „Pentru profesor” în surse.md.
   Simulatorul: paint.js (V/18), paint-selectie.js (V/19), paint-imagine.js (V/20), paint-culori.js (V/21), paint-text.js (V/22),
   neschimbate, + extensia NOUĂ lectii/_sim/paint-proba.js (proprietar lecția aceasta): punctele probei, testele ppFisier și ppSub
   (versiunea 2, după judecata 1: ppText, ppSingur, ppColorat, ppFundal și afișul de la sfârșit, tipul afisproba; versiunea 3, după
   judecata 2: ppColorat judecă interiorul formei, ppText{titlu}, cele cinci niveluri în rezumat; versiunea 4, după judecata 3:
   ppSub{sauCaseta}; versiunea 5, după judecata 4: caseta judecată după literele văzute, formele acoperite de Umplere fundal).
   Paint (aplicație din Magazin) NU a fost pornit: faptele vin din lecțiile 18-22 (afirmatii.json ale lor). Ce nu e probat e scris
   prudent și stă în surse.md și capturi_lipsa.json. Trimiterile la pași: P1 = „La ce folosește”, ca în bara de jos. */
const figL=(cale,w,h,alt,cap)=>`<figure class="captura"><a href="${cale}" target="_blank"><img src="${cale}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  tableta:figL('../m3-l18/img/desen-tableta.webp',800,450,'O mână desenează cu un creion special direct pe ecranul unei tablete grafice; pe ecran se văd schițe cu personaje','<small>Foto: David Revoy, CC BY 4.0, <a href="https://commons.wikimedia.org/wiki/File:Penciling_on_Wacom_Cintiq_13HD_by_David_Revoy.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>; micșorată. De la lecția 18.</small>'),
  redim:figL('../m3-l20/img/redimensionare.webp',350,460,'Fereastra Redimensionare și înclinare din Paint: Procent ales, Pixeli; Orizontal 100, butonul-lanț albastru, Vertical 100; Oblic 0°; OK și Anulare','Fereastra <b>Redimensionare și înclinare</b>, cu lanțul albastru; aici e ales <b>Procent</b>, tu alegi <b>Pixeli</b>. <small>Captură din Paint (Windows 11), de la lecția 20; chenarele roșii sunt de la noi.</small>'),
  formate:figL('../m3-l18/img/formate-salvare.webp',430,190,'Submeniul Salvați ca din Paint, cu formatele Imagine PNG, Imagine JPG, Imagine BMP, Imagine GIF și Alt format','Lista de formate de la <b>Salvați ca</b>. <small>Captură din Paint (Windows 11), de la lecția 18; chenarele sunt de la noi.</small>')
};
/* '!…' = punctul de la sfârșitul orei; '?…' = „Dacă mai ai timp” (nu intră în timpul obligatoriu) */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum, în Paint-ul adevărat</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:x.startsWith('?')?`<li class="mai-ai-timp"><b>Dacă mai ai timp:</b> ${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;
/* trimiterile la pașii lecțiilor publicate (?vezi=pN: pasul N din bara lor, P1 = „La ce folosește”; se deschid doar de citit, în filă nouă) */
const LP=(m,l,p,t)=>`<a class="lp" href="../${m}-l${l}/?vezi=p${p}" target="_blank" rel="noopener">lecția ${l}, pasul <i>${t}</i> (P${p})</a>`;
const L18_BARA=LP('m3',18,2,'Pornești Paint: părțile ferestrei'),L18_SALV=LP('m3',18,4,'Salvați ca: numele, folderul, PNG sau JPG');
const L19_FORME=LP('m3',19,3,'Forme gata făcute; Ctrl+Z dacă n-a ieșit'),L20_REDIM=LP('m3',20,4,'Redimensionarea: mai mică sau mai mare');
const L21_UMPL=LP('m3',21,3,'Umplere: găleata colorează o zonă închisă'),L22_TEXT=LP('m4',22,2,'Text: caseta în care scrii'),L22_BARA=LP('m4',22,3,'Bara casetei: mărimea, fontul, Aldin, culoarea');
const L1_LUCR=LP('m1','01',8,'Lucrarea: trei părți și nota ta').replace('lecția 01','lecția 1');

/* lumea simulatorului: pânza de 1038 × 648 (pornirea Paint-ului din pagină) sau 800 × 499 (după Pixeli · Orizontal 800 cu lanțul
   albastru, ca la lecția 20: 648 × 800 : 1038 ≈ 499); pp_afis = fundal crem, cartea (dreptunghi albastru, 110-330 × 270-450) și
   soarele (oval galben, 540-700 × 280-440), în PaintProba.DESENE (lectii/_sim/paint-proba.js) */
const P=o=>Object.assign({t:'paintw',folderElev:'Documente'},o);       // Paint-ul lecției 22 (+ testele lecției 23), fără puncte
const PIm=o=>Object.assign({t:'paintimg'},o);                          // Paint-ul lecției 20 (Redimensionați și înclinați), fără puncte
const PR=o=>Object.assign({t:'probapaint',folderElev:'Documente'},o);  // proba, cu puncte, pe Paint-ul lecției 22
const PRI=o=>Object.assign({t:'probaimg'},o);                          // proba, cu puncte, pe Paint-ul lecției 20
const AFIS={desen:'pp_afis',w:800,h:499,unealta:'pensula'},GOL800={desen:'gol',w:800,h:499,unealta:'pensula'};
const PA=o=>Object.assign({t:'afisproba',folderElev:'Documente'},o);  // R1 (J1-E): afișul întreg, pe o singură pânză, fără puncte
const CULORI_SFAT={inchise:[['negru','#000000'],['albastru închis','#3f48cc'],['roșu închis','#880015']],deschise:[['alb','#ffffff'],['galben','#fff200']]};
/* R1 (J1-C, sonnet M-3): „colorată pe dinăuntru” = ppColorat (paint-proba.js v2): o formă ÎNCHISĂ, cu orice culoare în afară de alb
   și de fundalul din jurul ei (Lavandă #c8bfe7 trece; liniile nu) — înlocuiește formaCul cu lista COLORAT (familie() o socotea „alb”) */
const MSG_COLORAT='Nicio formă nu e încă colorată pe dinăuntru. O culoare din paletă în Culoare 1 (alta decât albul și decât culoarea din jurul formei), Umplere (grupul Instrumente), apoi un clic în mijlocul unei forme.';
const MSG_LINII='Liniile n-au „dinăuntru”. Din Forme, desenează un Dreptunghi sau un Oval, apoi colorează-l: o culoare în Culoare 1, Umplere, clic în mijlocul lui.';

/* ---- proba de antrenament: 7 cerințe, 90 de puncte + 10 din oficiu (punctele sunt ale PAGINII; testul profesorului nu există) ---- */
PaintProba.configureaza({titlu:'Proba de antrenament',oficiu:10,
  parti:{C:{nume:'De bază',max:40},B:{nume:'Consolidat',max:30},A:{nume:'Avansat',max:20}},
  itemi:[{id:'C1',parte:'C',puncte:12},{id:'C2',parte:'C',puncte:14},{id:'C3',parte:'C',puncte:14},
         {id:'B1',parte:'B',puncte:15},{id:'B2',parte:'B',puncte:15},{id:'A1',parte:'A',puncte:12},{id:'A2',parte:'A',puncte:8}],
  /* R1 (J1-E, J1-J): după rezumat, ce urmează pe fiecare drum */
  dupaFinal:'<p><b>Mai departe:</b> pe telefon, <b>Încă un exercițiu</b>: afișul întreg, pe o singură pânză. La calculator: <b>Acum la calculatorul din laborator</b>, afișul în Paint-ul adevărat.</p>'});

/* ---- grila profesorului (Grila_produs.md), întocmai: paragraful despre puncte și notă și tabelul (un criteriu = un paragraf, ca să
   se citească și pe telefon); lăsate deoparte antetul fișei, rândurile de completat și nota de subsol (ghidul IV.2 §5).
   R1 (J1-L, sonnet M-8): paragraful cuvintelor e spus „al paginii”, iar cuvintele criteriilor 1-3 sunt explicate ---- */
const GRILA=`<details class="verif"><summary>Grila profesorului, întocmai (5 criterii)</summary>
<p>Cuvinte din grilă, explicate de pagină (nu sunt din grilă): <b>din oficiu</b> = puncte pe care le primește oricine; <b>cu sprijin, model</b> = cu ajutor sau după un exemplu; <b>structură</b> = cum sunt așezate lucrurile pe afiș; <b>publicul</b> = cine se uită la afiș; <b>context nou</b> = o situație pe care n-ai mai văzut-o; <b>alternative</b> = alte variante, alte idei; <b>justifică</b> = spune de ce a ales așa.</p>
<p>La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). <b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8.</p>
${[
 ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
 ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
 ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
 ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
 ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']
].map((r,i)=>`<p class="grila-c"><b>${i+1}. ${r[0]}</b><br>De bază (cu sprijin, model) · 10 p: ${r[1]}<br>Consolidat (independent) · 14 p: ${r[2]}<br>Avansat (context nou, justificat) · 18 p: ${r[3]}</p>`).join('\n')}</details>`;

/* ---- „Acum la calculatorul din laborator”: afișul după fișa de antrenament, în Paint-ul adevărat, FĂRĂ profesor, pe calculatorul
   comun; casetele „Acum la calculator” din pași l-au început (regula 10), laboratorul verifică și completează. Timpul:
   _proba/durata_r1.py (metoda judecătorului J1). R1 (J1-D): grila în caiet (punctul 5) e „Dacă mai ai timp”. T2 (durata, după
   W-Z): punctul 2 fără „(bara de jos › P4)” (ca punctele 1, 3, 4); în intro, „(pasul P2)” ---- */
const LAB=[
  '<b>Dimensiunea:</b> în bara de stare scrie <b>800 ×</b> …? Treci mai departe. Nu: ca în caseta de la P3 (alt desen pe pânză? <b>Fișier</b> › <b>Nou</b>; te întreabă? <b>Nu salvați</b>).',
  '<b>Fundalul și două obiecte, colorate:</b> le ai de la P4? Treci mai departe. Nu: fă-le ca în caseta de la P4.',
  '<b>Titlul:</b> îl ai de la P4? Treci mai departe. Nu: ca în caseta de la P4.',
  '<b>Salvezi:</b> ai salvat la P5? Clic pe bara de titlu, <kbd>Ctrl</kbd>+<kbd>S</kbd>. Nu: ca în caseta de la P5. Există deja? <b>Nu</b> și o cifră.',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> <b>grila profesorului</b>, de mai jos: la criteriile 1, 2 și 3 scrie în caiet <b>De bază</b>, <b>Consolidat</b> sau <b>Avansat</b> și, într-un rând, de ce. Așa citim noi grila: ai urmat pașii din pagină? La criteriul 3 e <b>De bază</b>; scrie și ce ai fi făcut singur ca să urci un nivel. Nota o dă profesorul.</span>'+GRILA,
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> felicitarea de la lecția 22: <b>Fișier</b> › <b>Deschidere</b> › <b>Documente</b>, clic pe ea, <b>Deschidere</b> (te întreabă dacă salvezi afișul? <b>Salvați</b>). O verifici cu aceeași grilă.</span>',
  '<b>La sfârșitul orei</b> (chiar dacă n-ai terminat): clic pe bara de titlu a Paint-ului, <kbd>Ctrl</kbd>+<kbd>S</kbd> (n-ai salvat? punctul 4), X. Afișul rămâne în <b>Documente</b>; cum îl predai îți spune profesorul.'
];

/* R1 (J1-A, J1-B): mesajele titlului de la B1 (testul cuvintelor) — un titlu aproape bun e numit întocmai */
const B1_TITLU={msg:'Sus, în jumătatea de sus a afișului, nu e încă un titlu cu cuvintele Ziua cărții. Clic pe A (Text), apoi un clic sus pe pânză, unde e loc, și scrie Ziua cărții.',
  msgDouaOri:'Titlul apare de mai multe ori pe afiș. Apasă ↶ (Ctrl+Z) până dispar toate textele; apoi scrie titlul o singură dată, sus de tot.',
  msgJos:'Titlul e prea jos: literele lui încep sub mijlocul pânzei. Apasă ↶ (Ctrl+Z) până dispare, apoi scrie-l din nou, sus de tot.',
  msgRupt:'Titlul e rupt: o parte e sus, alta jos. Apasă ↶ (Ctrl+Z) până e iar întreg.',
  msgAscuns:'Titlul e pe afiș, dar nu se vede bine: e acoperit, șters sau are culoarea fundalului. Apasă ↶ (Ctrl+Z) până se vede iar.',
  msgCuloareFundal:'Literele titlului au culoarea fundalului, deci nu se văd. Apasă ↶ (Ctrl+Z) {ori} (titlul dispare{dupa}); apoi alege o culoare {tip} în Culoare 1 ({culori}) și scrie titlul din nou.',
  culori:CULORI_SFAT,aproape:1,aproapeLitere:2,msgAproape:'Sus scrie „{t}”, nu „Ziua cărții”.',
  refaUltim:'Apasă ↶ (Ctrl+Z) până dispare, apoi scrie din nou, sus de tot, Ziua cărții.',
  refaTot:'Apasă ↶ (Ctrl+Z) până dispar toate textele; apoi scrie titlul o singură dată, sus de tot.'};
const B1_SINGUR={k:'ppSingur',are:'ziua cartii',ce:'Pe afiș nu mai e alt text în afară de titlu',msg:'Pe afiș mai e un text: „{t}”; fișa cere doar titlul.',
  refaUltim:'Apasă ↶ (Ctrl+Z) până dispare; titlul bun rămâne.',refaTot:'Apasă ↶ (Ctrl+Z) până dispar toate textele; apoi scrie titlul o singură dată, sus de tot.'};

JocMotor.porneste({
  cheie:'lectie_v_m4_l23',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 23”, pasul real înainte de verificare
  titlu:'Evaluare sumativă: editor grafic (produs digital)',
  marca:'Lecția <b>23</b> · clasa a V-a',
  h1:'Evaluare sumativă: editor grafic (produs digital)',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U4', unitateTitlu:'Editoare grafice. Fac materiale digitale',
  competente:['CS.3.1'], lectii:'23',
  ancoraText:'Din programă (CS.3.1, unitatea V-U4, lecția 23): evaluarea unității — un produs grafic după specificații: salvarea fișierului grafic, instrumentele de desenare, redimensionarea, culorile și umplerile, inserarea și formatarea textului',
  intro:`<p><b>Ai nevoie de:</b> lecțiile 18-22 (Paint) și lecția 1 (părțile lucrării și nota).</p>`,
  cum:`<b>Cum lucrezi</b> (cam 50 de minute, toată ora)<ol><li>P1, apoi 5 pași scurți, cu gesturi în Paint-ul adevărat.</li><li>Atelierul: proba de antrenament, 7 cerințe, cu puncte și notă.</li><li>La calculator: afișul, în Paint-ul adevărat. Pe telefon: casetele „Acum, în Paint-ul adevărat” le sari; după probă, afișul din atelier.</li><li>5 întrebări, pentru stele.</li></ol><p><b>Când mai sunt 10 minute din oră:</b> bara de jos › <b>P3</b>, ultimul punct din casetă; pe telefon, treci la întrebări.</p>`,
  banda:'<span class="bd-t">Pop_Ana_5A_proba - Paint</span><span class="bd-z">800 × 499px · Forme · Text · Imagine PNG</span>',
  nivele:[
{t:'Evaluare sumativă: editor grafic (produs digital)',final:true,lectii:[18,19,20,21,22,23],
 continuturi:['Crearea, deschiderea şi salvarea fişierelor grafice','Instrumente de desenare','Redimensionarea, trunchierea, rotaţia unei imagini','Utilizarea culorilor în prelucrarea imaginilor; crearea culorilor personalizate','Stiluri de umplere','Inserarea şi formatarea textului'],
 obiectiv:'știi ce cere fiecare specificație a probei practice și faci în Paint un produs grafic după ele, pe care îl verifici cu grila profesorului.',
 pasi:[
  /* ---- pasul 1: la ce folosește (fără acțiuni): specificațiile = cerințele exacte; testul exact vine la oră ---- */
  {t:'La ce folosește: un produs după specificații',
   text:`<p>Un grafician face afișe după <mark>specificațiile</mark> clientului: cerințele exacte (cât de lată e imaginea, ce text are, ce desene, în ce format se salvează). Un afiș frumos, dar cu alt text sau altă mărime, nu e cel cerut.</p>
<p>La proba practică faci și tu în Paint un <b>produs grafic</b> după o fișă cu specificații. Testul exact îl primești la oră; azi te antrenezi pe o probă a paginii.</p>
${IMG.tableta}`},
  /* ---- pasul 2: activitatea profesorului, întocmai; „obiect” explicat (T12). R1 (J1-D): fără lista specificațiilor (repeta fișa) ---- */
  {t:'Proba: cele patru specificații',
   text:`<p>Un <mark>obiect</mark>, pe o fișă de Paint, e un lucru desenat pe pânză, de exemplu o formă din <b>Forme</b>. Cerința profesorului: <i>„Probă practică: realizarea unui produs grafic după specificații date (dimensiune, text, cel puțin două obiecte, salvare într-un format cerut). Notare după grila de produs.”</i> Grila de produs e grila profesorului, de la lecția 22.</p>`,
   exemplu:`<div class="fisa"><p><b>Fișa de antrenament</b> (a paginii, nu a profesorului):</p><ol><li>Pânza: 800 de pixeli pe lățime.</li><li>Sus, titlul <b>Ziua cărții</b>, mare și gros.</li><li>Cel puțin două obiecte: o carte și un soare, colorate.</li><li>Salvezi ca <b>Imagine PNG</b>, în <b>Documente</b>, cu numele, prenumele și clasa ta, apoi <code>_proba</code>.</li></ol></div>
<p>Ordinea sigură: întâi dimensiunea, pe pânza goală (redimensionarea schimbă tot desenul); apoi fundalul și obiectele; la urmă textul; salvezi.</p>`,
   altfel:`<p>E ca o comandă la cofetărie: tortul trebuie să aibă exact mărimea, scrisul și decorul cerute. Unul frumos, dar cu alt scris, nu e tortul comandat.</p>`,
   incearca:{t:'order',q:'Pune în ordine lucrul la afișul de pe fișă.',items:['Pânza: 800 de pixeli pe lățime','Fundalul și cele două obiecte','Titlul, cu Text','Salvarea, ca Imagine PNG'],
     ajutor:'Recitește ordinea sigură, de sub fișă.',why:'Dimensiunea vine prima, pe pânza goală: altfel se micșorează și desenul. Textul vine după desen, ca să nu-l acoperi; salvarea, la urmă.'}},
  /* ---- pasul 3: dimensiunea = lățimea pânzei (V/18 P2: bara de stare; V/20 P4: Redimensionați și înclinați › Pixeli, Orizontal,
     Backspace, lanțul albastru, OK — cuvintele lor). Lățime ȘI înălțime alese separat (lanțul stins) NU se predă: surse.md ---- */
  {t:'Dimensiunea: lățimea pânzei, în pixeli',
   text:`<p>Mărimea pânzei o citești jos, în <b>bara de stare</b>: <b>800 × 499px</b> înseamnă 800 de pixeli pe lățime și 499 pe înălțime. Fișa cere lățimea? Ca la lecția 20:</p>
<ol><li>grupul <b>Imagine</b> › <b>Redimensionați și înclinați</b>;</li><li><b>Pixeli</b>;</li><li>la <b>Orizontal</b>: clic după număr, <kbd>Backspace</kbd> până se golește caseta, scrii lățimea cerută;</li><li>lanțul rămâne albastru: înălțimea se potrivește de obicei singură;</li><li><b>OK</b>; te uiți în bara de stare.</li></ol>`,
   exemplu:`${IMG.redim}
${ACUM('Pornește Paint (Start, <code>pai</code>). Fă pânza lată de <code>800</code>, ca mai sus. În bara de stare scrie acum <b>800 ×</b> …? Lasă Paint deschis.','!<b>La sfârșitul orei</b> (nu acum): ai început afișul? Clic pe bara de titlu a Paint-ului, <kbd>Ctrl</kbd>+<kbd>S</kbd> (n-ai salvat? punctul 4 de la calculator), X. N-ai desenat nimic? X și <b>Nu salvați</b>.')}`,
   altfel:`<p>E ca la fotocopiator: ceri o copie de o anumită lățime, iar lanțul albastru are grijă ca desenul să nu iasă turtit sau lungit.</p>`,
   incearca:PIm({q:'Fișa cere o pânză lată de <b>640 de pixeli</b>. Fă-o în Paint-ul din pagină, apoi uită-te în bara de stare.',start:{desen:'gol',unealta:'pensula'},
    checks:[{k:'marime',w:640,tol:0,ce:'Pânza are 640 de pixeli pe lățime',msg:'Imagine › Redimensionați și înclinați › Pixeli. La Orizontal: clic după număr, Backspace până se golește caseta, scrie 640; lanțul albastru; OK. Jos, în bara de stare, trebuie să scrie 640 × …'}],
    sol:[['redim','pixeli',640,400]],gresit:[['redim','procent',64,64]],
    ajutor:'Pixeli, nu Procent: fișa spune câți pixeli, nu „jumătate” sau „dublu”. Orizontal = lățimea.',
    why:'Cu Pixeli și Orizontal 640, pânza are acum 640 de pixeli pe lățime; cu lanțul albastru, înălțimea s-a potrivit singură, ca desenul să nu se deformeze.'}),
   inca:[
    {t:'choice',q:'Jos, în bara de stare a Paint-ului, scrie <b>800 × 499px</b>. Ce înseamnă?',o:['Pânza are 800 de pixeli pe lățime și 499 pe înălțime','Pânza are 800 de pixeli pe înălțime și 499 pe lățime','Imaginea e mărită la 800 %, ca la panoramare','Pe pânză sunt 800 de obiecte desenate'],ok:0,
     ajutor:'Care număr vine întâi: lățimea sau înălțimea?',why:'Primul număr e lățimea, al doilea înălțimea, în pixeli (lecția 18). Panoramarea scrie procente, nu pixeli, iar obiectele nu se numără acolo.'}
   ]},
  /* ---- pasul 4: obiectele (Forme, V/19; Umplere / Umplere formă, V/21) și textul (Text, V/22). R1 (sonnet M-7): în casetă, o
     culoare închisă în Culoare 1 înainte de forme (conturul ia Culoare 1, lecția 21) și formele colorate; (sonnet M-2) „Încearcă”
     nu mai cere „deasupra lor” (testul nu judecă locul); (J1-D) fără rândul de trimiteri (lecțiile sunt numite în text).
     T2 (J2-Y): în casetă, formele se colorează ÎNAINTE de titlu — ordinea sigură din P2 (textul la urmă, ca să nu-l acoperi), ca
     la afișul E și în laborator (2, apoi 3); titlul cere iar negru în Culoare 1 ---- */
  {t:'Cel puțin două obiecte și textul',
   text:`<p>Obiectele le iei din <b>Forme</b> (lecția 19): alegi forma, apeși pe pânză, tragi, lași. Le colorezi pe dinăuntru cu <b>Umplere</b> sau cu <b>Umplere formă</b> (lecția 21).</p>
<p>Textul îl pui cu <b>Text</b> (lecția 22). Cuvintele de pe fișă le scrii exact; verifici, apoi clic în afara casetei.</p>`,
   exemplu:`${ACUM('Pe pânza de 800: o culoare deschisă în <b>Culoare 1</b>, <b>Umplere</b>, clic pe pânză. O culoare închisă în <b>Culoare 1</b> (conturul formelor); din <b>Forme</b>, jos, un dreptunghi și un oval. Altă culoare, <b>Umplere</b>, clic în fiecare formă. Negru în <b>Culoare 1</b>; <b>A</b>, clic sus; <b>Dimensiune font</b> 48 și <b>B</b>; scrie <code>Ziua cărții</code>; clic în afara casetei.')}`,
   altfel:`<p>E ca un panou în clasă: întâi hârtia colorată (fundalul), apoi desenele lipite pe ea (obiectele), la urmă titlul scris mare, deasupra.</p>`,
   incearca:P({q:'Pe pânza goală, desenează <b>două forme</b> din Forme. Apoi, cu <b>Text</b>, scrie <b>Serbare</b>. La sfârșit, clic pe pânză, în afara casetei.',start:GOL800,
    checks:[{k:'forma',min:2,ce:'Pe pânză sunt cel puțin două forme din Forme',msg:'Din Forme, alege o formă; apeși pe pânză, tragi, lași. Apoi încă una.'},
     {k:'text',are:'serbare',sauCaseta:true,ce:'Pe pânză scrie „Serbare”',msg:'Clic pe A (Text), un clic pe pânză, unde e loc, și scrie Serbare.'},
     {k:'casetaInchisa',ce:'Textul a rămas pe desen (caseta s-a închis)',msg:'Caseta e încă deschisă (chenarul punctat): un clic pe pânză, în afara ei.'}],
    sol:[['forma','dreptunghi'],['trage',[[100,280],[300,440]]],['forma','oval'],['trage',[[500,280],[680,440]]],['caseta',100,40,700,140],['scrie','Serbare'],['fixeaza']],
    gresit:[['forma','dreptunghi'],['trage',[[100,280],[300,440]]],['caseta',100,40,700,140],['scrie','Serbare'],['fixeaza']],
    ajutor:'Forme e grupul cu dreptunghiul, ovalul, steaua. Text e litera A, din grupul Instrumente.',
    why:'Două forme sunt două obiecte; textul scris cu Text și lipit de desen e al treilea lucru cerut de o fișă ca aceasta.'})},
  /* ---- pasul 5: formatul (V/18 P4: „Imagine PNG … păstrează exact fiecare pixel”, „Imagine JPG … pentru fotografii”; acolo JPG
     doar numit — aici exersat o dată, același gest); „există deja” cu cuvintele lecției 18 (regula 26). R1 (J1-K): terminația .jpg
     spusă prudent; (sonnet M-9) întrebarea spune ce format cere fișa ---- */
  {t:'Formatul cerut: Imagine PNG sau Imagine JPG',
   text:`<p>La lecția 18 ai văzut lista de la <b>Fișier</b> › <b>Salvați ca</b>: <b>Imagine PNG</b> păstrează exact fiecare pixel, deci e bună pentru desene; <b>Imagine JPG</b> e pentru fotografii.</p>
<p>La probă alegi formatul cerut de fișă. Fișa cere JPG? <b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine JPG</b>; fișierul primește terminația <code>.jpg</code> (o vezi doar dacă Windows arată terminațiile). Restul e ca la PNG.</p>
<p>„… există deja. Îl înlocuiți?”? Ca la lecția 18: <b>Nu</b> (fișierul vechi rămâne), scrii numele cu o cifră la sfârșit, <b>Salvare</b>.</p>`,
   exemplu:`${IMG.formate}
${ACUM('Afișul tău: <b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine PNG</b>; numele: numele, prenumele și clasa <b>ta</b>, legate cu liniuța de jos, apoi <code>_proba</code>; în stânga, <b>Documente</b>; <b>Salvare</b>. Există deja? <b>Nu</b> și o cifră.')}`,
   altfel:`<p>E ca atunci când predai o temă: dacă profesorul o cere pe foaie cu pătrățele, nu o aduci pe foaie dictando, oricât de frumos ar fi scrisă.</p>`,
   incearca:P({q:'Fișa cere formatul <b>JPG</b>. Salvează afișul ca <b>Imagine JPG</b>, în <b>Documente</b>, cu numele <code>Pop_Ana_5A_afis</code>.',start:AFIS,
    checks:[{k:'ppFisier',folder:'Documente',re:'^pop_ana_5a_afis\\s*\\(?\\d*\\)?$',ext:'jpg',ce:'În Documente e afișul, ca JPG, cu numele Pop_Ana_5A_afis',msg:'Fișier › Salvați ca › Imagine JPG (nu PNG). La Nume fișier: Pop_Ana_5A_afis (liniuța de jos: Shift și tasta cu minus; pe telefon, printre simboluri: tasta ?123 sau 123). În stânga, Documente; apoi Salvare.'}],
    sol:[['cmd','jpg'],['nume','Pop_Ana_5A_afis'],['nav','Documente'],['ok']],
    gresit:[['cmd','png'],['nume','Pop_Ana_5A_afis'],['nav','Documente'],['ok']],
    ajutor:'Ca la lecția 18, doar că alegi Imagine JPG în loc de Imagine PNG.',
    why:'Imagine JPG a pus fișierul cu numele cerut și terminația .jpg, în Documente: formatul cerut de fișă.'}),
   inca:[
    {t:'choice',q:'Fișa cere Imagine PNG. Salvezi afișul și apare: „Pop_Ana_5A_proba.png există deja. Îl înlocuiți?”. E pe calculatorul comun din laborator. Ce faci?',o:['Nu, apoi scrii numele cu o cifră la sfârșit și Salvare','Da: fișierul vechi nu mai trebuie nimănui','Închizi Paint fără să salvezi','Alegi Imagine JPG, ca să nu mai apară întrebarea'],ok:0,
     ajutor:'Al cui poate fi fișierul care există deja?',why:'Cu Nu, fișierul care era acolo rămâne neatins (poate e al unui coleg); cu o cifră la sfârșit, al tău are alt nume. Da l-ar înlocui; ieșirea fără salvare îți pierde munca; JPG nu e formatul cerut de fișă.'}
   ]},
  /* ---- pasul 6: notarea — părțile lucrării cu cuvintele lecției 1 (regula 37); grila de produs (lecția 22). R1 (J1-F, sonnet M-5):
     pagina nu mai afirmă cum notează profesorul; citează activitatea și lasă hotărârea lui (ca la VI/10). (J1-D) fără lista criteriilor
     (e întreagă la calculator, punctul 5) ---- */
  {t:'Cum se notează: părțile probei și grila profesorului',
   text:`<p>Proba de antrenament din atelier are părțile lucrării, ca la lecția 1: <b>C</b> · De bază (40 de puncte, cu pașii dați), <b>B</b> · Consolidat (30, singur), <b>A</b> · Avansat (20, o situație nouă și explicația ta), plus 10 din oficiu. <b>Nota = punctaj : 10</b>. Cerințele și punctele lor sunt ale paginii.</p>
<p>Activitatea profesorului spune: <i>„Notare după grila de produs”</i> (5 criterii); grila întreagă e la calculator, punctul 5. Cum notează proba adevărată îți spune profesorul.</p>`,
   exemplu:`<p>Exemplu (inventat), pe părți: C 34 + B 26 + A 15 + 10 din oficiu = 85 de puncte: 8 zeci, ultima cifră 5, deci nota 8 + 1 = 9. Regula rotunjirii: ${L1_LUCR}.</p>`,
   altfel:`<p>E ca la un concurs de desen: juriul are o listă de criterii (tema, curățenia, ideea). Proba din pagină e antrenamentul tău; lista juriului e grila profesorului.</p>`,
   incearca:{t:'choice',q:'Proba de antrenament a Irinei: partea C 31 de puncte, partea B 22, partea A 11. Ce notă are?',o:['nota 7','nota 8','nota 6','nota 9'],ok:0,
     ajutor:'Adună și cele 10 puncte din oficiu. Ultima cifră e sub 5 sau de la 5 la 9?',why:'31 + 22 + 11 + 10 = 74 de puncte: 7 zeci, iar ultima cifră, 4, e sub 5, deci nota 7. Fără oficiu (64) ar fi ieșit 6; rotunjit în sus, 8.'}}
 ],
 /* atelierul: PROBA DE ANTRENAMENT pe cerințe (ca la V/17): atelierul = C1, „Încă un exercițiu” = C2 … A2, apoi (R1, J1-E) afișul
    întreg, fără puncte. Punctele se socotesc la prima verificare a fiecărei cerințe (paint-proba.js). Rezultat, nu drum (regula 29):
    testele citesc pânza și discul de la sfârșit. R1 (J1-D): intro-ul scurtat; (J1-J) „Încă un exercițiu (butonul alb)” */
 atelier:PRI({titlu:'Atelier: proba de antrenament',proba:'C1',
  intro:`<p><strong>Proba de antrenament</strong> (nu e a profesorului): C1-C3 cu pașii dați, B1-B2 singur, A1-A2 o situație nouă.</p>
<p>Întâi spune cine ești, în caseta de jos. Punctele se dau la <b>prima</b> verificare; apoi repari, ca exercițiu. La cerința următoare treci cu <b>Încă un exercițiu</b> (butonul alb). Reîncarci pagina, te înscrii la mijloc sau sună clopoțelul? Proba se reia de la C1.</p>`,
  q:'<b>C1 · Dimensiunea</b> (12 p), cu pașii dați: pânza lată de 800 de pixeli. <b>Imagine</b> › <b>Redimensionați și înclinați</b> › <b>Pixeli</b>; la <b>Orizontal</b>, <kbd>Backspace</kbd>, apoi <code>800</code>; lanțul albastru; <b>OK</b>.',
  start:{desen:'gol',unealta:'pensula'},
  checks:[{k:'marime',w:800,tol:0,puncte:12,lectia:L20_REDIM,ce:'Pânza are 800 de pixeli pe lățime',msg:'Imagine › Redimensionați și înclinați › Pixeli. La Orizontal: clic după număr, Backspace până se golește caseta, scrie 800; lanțul albastru; OK. Jos, în bara de stare, trebuie să scrie 800 × …'}],
  sol:[['redim','pixeli',800,499]],gresit:[['redim','procent',80,80]],
  ajutor:'Pixeli, nu Procent. Orizontal = lățimea. Verifici în bara de stare.',
  why:'Pânza are acum 800 de pixeli pe lățime: prima specificație de pe fișă.',
  inca:[
   PR({proba:'C2',q:'<b>C2 · Două obiecte</b> (14 p), cu pașii dați. Pe pânză: 1. din <b>Forme</b>, un <b>Dreptunghi</b> (o carte): apeși, tragi, lași; 2. din <b>Forme</b>, un <b>Oval</b> (un soare); 3. colorează pe dinăuntru cel puțin o formă: o culoare în <b>Culoare 1</b> (oricare, în afară de alb), <b>Umplere</b>, clic în formă.',start:GOL800,
    checks:[{k:'forma',min:1,puncte:5,lectia:L19_FORME,ce:'Pe pânză e o formă din Forme',msg:'Din Forme, alege Dreptunghi; apeși pe pânză, tragi, lași.'},
     {k:'forma',min:2,puncte:5,lectia:L19_FORME,ce:'Pe pânză sunt cel puțin două forme',msg:'Mai e nevoie de o formă: din Forme, alege Oval; apeși pe pânză, tragi, lași.'},
     {k:'ppColorat',puncte:4,lectia:L21_UMPL,ce:'Cel puțin o formă e colorată pe dinăuntru',msg:MSG_COLORAT,msgLinii:MSG_LINII}],
    sol:[['forma','dreptunghi'],['trage',[[110,260],[330,440]]],['forma','oval'],['trage',[[520,260],[700,430]]],['culoare','#fff200',1],['umple',610,345]],
    gresit:[['forma','dreptunghi'],['trage',[[110,260],[330,440]]]],
    ajutor:'Forme e grupul cu dreptunghiul și ovalul. Umplere e găleata, din grupul Instrumente.',
    why:'Două forme din Forme sunt cele două obiecte cerute; găleata a colorat interiorul uneia.'}),
   PR({proba:'C3',q:'<b>C3 · Salvarea</b> (14 p), cu pașii dați. Afișul e gata. Salvează-l: <b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine PNG</b>; la <b>Nume fișier</b> scrie <code>Pop_Ana_5A_proba</code>; în stânga, <b>Documente</b>; <b>Salvare</b>.',start:AFIS,
    checks:[{k:'fisierNume',folder:'Documente',re:'.',ext:'png',puncte:7,lectia:L18_SALV,ce:'Afișul e salvat ca Imagine PNG, în Documente',msg:'Fișier › Salvați ca › Imagine PNG; în stânga, Documente; Salvare.'},
     {k:'ppFisier',re:'^pop_ana_5a_proba\\s*\\(?\\d*\\)?$',nou:true,puncte:7,lectia:L18_SALV,ce:'Numele fișierului e Pop_Ana_5A_proba',msg:'La Nume fișier scrie Pop_Ana_5A_proba (liniuța de jos: Shift și tasta cu minus; pe telefon, printre simboluri: tasta ?123 sau 123), apoi Salvare.'}],
    sol:[['cmd','png'],['nume','Pop_Ana_5A_proba'],['nav','Documente'],['ok']],
    gresit:[['cmd','png'],['nume','proba'],['nav','Imagini'],['ok']],
    ajutor:'Ca la lecția 18: formatul din Salvați ca, numele, folderul din stânga, Salvare.',
    why:'Fișierul e în Documente, cu numele cerut și formatul PNG: cum îl cere fișa.'}),
   /* R1 (J1-A): doar testul 1 judecă cuvintele; testele 2 și 3 judecă titlul (textul cel mai mare), oricum ar fi scris; „sus” îl
      judecă doar testul 1 (o scăpare se pedepsește o singură dată, IV.2 §7). (J1-B) „Ziua cărți” e numit; un text în plus oprește
      „Corect” (ppSingur). (sonnet M-1) enunțul numește culorile închise. T2 (J2-AB): testele 2-3 judecă TITLUL recunoscut după
      cuvinte (ppText{titlu}, paint-proba.js v3; și „Ziua cărți”, cu titluLitere:2); fără el, textul cel mai mare, ca înainte: un
      text în plus mai mare nu mai ia punctele titlului, iar ppSingur îl numește */
   PR({proba:'B1',q:'<b>B1 · Titlul</b> (15 p), singur. Pe afiș, sus, titlul <b>Ziua cărții</b>: <b>Dimensiune font</b> cel puțin 48, <b>Aldin</b>, într-o culoare închisă (de exemplu negru), ca să se vadă bine pe fundal. La sfârșit, lipit de desen. Scrie cuvintele exact; o literă greșită pierde doar punctele cuvântului.',start:AFIS,
    checks:[Object.assign({k:'ppText',are:'ziua cartii',unic:true,sus:true,sauCaseta:true,puncte:5,lectia:L22_TEXT,ce:'Sus e titlul „Ziua cărții”, o singură dată, cu cuvintele exact'},B1_TITLU),
     {k:'ppText',titlu:'ziua cartii',titluLitere:2,celMaiMare:true,marime:48,b:true,sauCaseta:true,puncte:5,lectia:L22_BARA,ce:'Titlul are Dimensiune font cel puțin 48 și e Aldin (B)',msg:'În bara casetei: Dimensiune font 48 (sau 72) și B. Titlul e deja lipit? ↶ (Ctrl+Z) până dispare, apoi scrie-l din nou.'},

<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/scratch.js"></script>
<script src="../../_sim/scratch-interfata.js"></script>

<script>
/* Lecția 32, clasa a V-a (M5, predare): „Implementez structura secvențială cu blocuri grafice”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online, în română, fără cont (decizia veche, ca la VI/18 și V/31). Faptele despre mișcare sunt
   PROBATE în editorul viu (Chromium headless, profil temporar, fără cont, 08.11.2026: _proba\live_v32.py → live_v32.json).
   Simulatorul: lectii/_sim/scratch.js (SimScratch 1.4), doar FOLOSIT; extensia mea: lectii/_sim/scratch-traseu.js; din lectii/_sim/scratch-interfata.js (V/31) folosesc doar pazaPaleta.
   Traseele stau în x ≥ 0, y ≥ 0: la a V-a numerele cu minus nu sunt predate.
   Granița: secvența cu blocuri de mișcare și readusul la start. NU blocul care repetă, NU decizia, NU alte evenimente decât steagul. */
SimScratch.stil();
ScratchTraseu.stil();
const fig = (f, w, h, alt, cap, cls) => `<figure class="captura${cls ? ' ' + cls : ''}"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la calculator</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol><p style="margin:.3em 0 0"><b>Pe telefon:</b> sari peste.</p></div>`;
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));

const A = SimScratch.ajutor, T = ScratchTraseu;
const PAL_M = ['steag', 'mergi', 'roteste_dr', 'roteste_st'];
const PAL = ['steag', 'mergi', 'roteste_dr', 'roteste_st', 'mergi_la_xy', 'orienteaza'];
const NOTA = 'În pagină sunt doar blocurile de azi, iar pisica e desenată mai simplu. În Scratch, fiecare categorie are mult mai multe blocuri.';
const S0 = [['mergi_la_xy', 0, 0], ['orienteaza', 90]];
const P = (...b) => [{x: 14, y: 14, b: [['steag']].concat(b)}];
const PS = (...b) => [{x: 14, y: 14, b: [['steag']].concat(S0, b)}];
const m = n => ['mergi', n], st = g => ['roteste_st', g], dr = g => ['roteste_dr', g];
const O0 = {x: 0, y: 0, directie: 90};
const LIPIT = {ce: 'Totul e lipit sub blocul galben', msg: 'Un singur program: toate blocurile, lipite sub blocul galben. Ce e lăsat deoparte nu pornește la steag: lipește-l sau trage-l în paletă.', ok: (U, Pr) => Pr.length === 1 && A.cuSteag(Pr).length === 1 && A.libere(Pr).length === 0};
/* un algoritm dat în cuvinte (fără traseu desenat): judecăm locurile prin care trece, nu blocurile */
let mU = '';
const DUPA = (tr, unde, fin) => [LIPIT,
  {ce: unde, o: O0, get msg() { return mU; }, ok: (U, Pr) => { mU = T.minus(Pr) + 'Pisica nu trece pe acolo. Citește pașii algoritmului și compară-i cu blocurile, de sus în jos: un număr sau săgeata rotirii.'; const j = T.judeca(tr, T.drum(U, O0)); return j.lipsa == null && !j.iesit; }},
  {ce: fin, o: O0, msg: 'La final, pisica e în alt loc. Mai lipsește un bloc sau un număr nu e cel din algoritm.', ok: U => T.judeca(tr, T.drum(U, O0)).capat},
  T.final(tr, {buton: true})];

/* traseele lecției (toate în x ≥ 0, y ≥ 0); programele-model sunt probate în Scratch-ul viu: _proba/live_lectie.py */
const TR_ORDINE = [[0, 0], [50, 0], [50, 100]];
const TR_START = [[0, 0], [150, 0], [150, 100]];
const TR_EX = [[0, 0], [100, 0], [100, 50], [200, 50]];
const TR_INCEARCA = [[0, 0], [50, 0], [50, 100], [150, 100]];
const TR_PUTINE = [[0, 0], [100, 0], [100, 150]];
const TR_ATELIER = [[0, 0], [100, 0], [100, 100], [200, 100], [200, 50]];
const TR_INCA = [[0, 0], [150, 0], [150, 50], [50, 50], [50, 150]];
const TR_LAB = [[0, 0], [100, 0], [100, 100]];
const TR_INTREBARE = [[0, 0], [50, 0], [50, 150]];

const FISA = T.desen(TR_LAB, {lat: 300, alt: 'Fișa cu traseul de reprodus, pe scena cu pătrățele de 50 de pași: de la S, în mijlocul scenei, 2 pătrățele spre dreapta până la punctul 1, apoi 2 pătrățele în sus până la C, capătul'});

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun; fără cont.
   Drumul literal, probat în editorul viu: _proba/live_lab.py → live_lab.json (blocuri trase, numere scrise, steagul, x și y citite, salvarea). */
const LAB = [
  '<b>Deschide Scratch.</b> Ai fila deschisă? Rămâi în ea. Nu? În bara de adrese: <code>scratch.mit.edu/projects/editor</code>, <kbd>Enter</kbd>. Meniul e în engleză? <b>Settings</b> › <b>Language</b>, derulezi până la litera R, <b>Română</b>. Nu se deschide sau nu merge internetul? Jos, sub puncte, apasă <b>← Înapoi la atelier</b>, fă traseul acolo și spune-i profesorului.',
  '<b>Începutul programului:</b> blocul galben „când se dă click pe ⚑” (<b>Evenimente</b>), sub el „mergi la x … y: …” cu 0 și 0, sub el „orientează-te în direcția 90” (<b>Mișcare</b>). Le ai deja? Nu mai pune altele.',
  `<b>Traseul de pe fișă:</b> un pătrățel = 50 de pași.${FISA}Citește-l de la S la C și spune-l în cuvinte. Sub program trebuie să vină primul „mergi”, cu numărul lui. Îl ai deja? Verifică numărul. Nu-l ai? Lipește-l.`,
  '<b>Proba, bloc cu bloc:</b> apasă steagul. Vezi doar unde ajunge pisica, nu drumul. Sub scenă trebuie să scrie x 100, y 0 (punctul 1). Apoi lipește rotirea (o ai deja? nu mai pune alta) și ultimul „mergi”, apasă steagul: x 100, y 100 (capătul).',
  '<b>Nu iese? Corectează.</b> Scrie y -100, cu minus în față? Ai pus ↻ în loc de ↺: clic dreapta pe el › <b>Șterge blocul</b>, apoi lasă ↺ peste marginea de jos a primului „mergi” și scrie 90. Alt număr? Scrie-l bine. Apoi steagul, de două ori: aceleași numere, x 100, y 100.',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> lungește traseul cu încă un colț: sub program, rotește-te ↻ 90, mergi 50. La final: x 150, y 100. Apoi unește: lipește la capăt încă un „mergi 50”; steagul: x 200, y 100. Scrie 100 în primul „mergi 50”, apoi scoate-l pe al doilea: clic dreapta pe el › <b>Șterge blocul</b>. Steagul: tot x 200, y 100.</span>',
  '<b>Salvează</b> (ca să nu pierzi programul până la sfârșit): <b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? <b>Descărcări</b>, numele tău (clasa ta, liniuță, prenumele fără diacritice, liniuță, traseu, ca <code>5A-Ana-traseu</code>, dar cu ale tale), <b>Salvare</b>. Nu întreabă? Explorer › <b>Descărcări</b> › <b>Proiect Scratch</b> (cel cu ora de acum; poate are (1) la sfârșit): <kbd>F2</kbd>, numele, <kbd>Enter</kbd>. Scrie că există deja? <b>Nu</b> (sau <b>Anulare</b>) și adaugi o cifră la sfârșitul numelui.',
  '<b>Închide fila Scratch</b> cu <b>×</b>, doar pe ea: lecția rămâne deschisă. Browserul întreabă dacă pleci? Pleci.',
  '<b>La sfârșitul orei (chiar dacă n-ai terminat):</b> fila Scratch e încă deschisă? Închide-o. Ai salvat? Explorer › <b>Descărcări</b>: clic pe fișierul tău de azi (cel cu numele tău, care se termină cu <code>traseu</code>, sau <b>Proiect Scratch</b> cu ora de acum), <kbd>Delete</kbd>. Nu atingi alte fișiere. Nu goli Coșul.'
];

JocMotor.porneste({
  cheie: 'lectie_v_m5_l32',
  mod: 'lectie',
  titlu: 'Implementez structura secvențială cu blocuri grafice',
  marca: 'Lecția <b>32</b> · clasa a V-a',
  h1: 'Implementez structura secvențială <span class="acc">cu blocuri grafice</span>',
  eticheta: 'Lecții TIC',
  acasa: {href: '../../../hub/index.html', text: 'LearningHub'},
  clasa: 'a V-a',
  unitate: 'V-U6',
  unitateTitlu: 'Din algoritm în joc: mediul grafic interactiv (Scratch)',
  competente: ['CS.3.2'],
  lectii: '32',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a V-a · unitatea V-U6 „Din algoritm în joc: mediul grafic interactiv (Scratch)” · lecția 32, predare · CS.3.2 „Implementarea unui algoritm care conţine structura secvenţială şi/sau alternativă într-un mediu grafic interactiv”, partea secvențială; structura alternativă e la lecția 33. Activitatea profesorului: reproducerea unui traseu dat al personajului, folosind numai blocuri de mișcare; varianta avansată: același traseu cu mai puține blocuri.',
  intro: '<p><b>Ai nevoie de:</b> lecția 28 (structura secvențială: pașii, în ordinea scrisă, fiecare o dată); lecția 19 (<kbd>Ctrl+Z</kbd>); lecția 31 (Scratch: tragi un bloc și îl lipești sub altul; salvezi proiectul). Pentru sfârșitul orei: Explorer (lecțiile 9-11).</p>',
  cum: '<b>Cum lucrezi</b><ol><li>Primul pas îl citești, apoi 5 pași cu exerciții în Scratch-ul din pagină.</li><li>Atelierul: reproduci un traseu.</li><li>La calculator: un traseu scurt în Scratch-ul adevărat (pe telefon, rămâi în pagină).</li><li>5 întrebări.</li></ol><p><b>Când mai sunt 10 minute din oră:</b> treci la întrebări; în Scratch-ul adevărat, ultimul punct (închizi fila, ștergi fișierul tău de azi).</p>',
  banda: '<span class="bk ev">când se dă click pe ⚑</span><span class="bk mv">mergi 100 pași</span><span class="bk mv">rotește-te ↺ 90</span><span class="bk mv">mergi 50 pași</span>',
  nivele: [
{t: 'Implementez structura secvențială cu blocuri grafice', final: true, lectii: [32],
 continuturi: ['Modalități de reprezentare a structurilor secvențiale și alternative prin blocuri grafice'],
 obiectiv: 'transformi pașii scriși în cuvinte în blocuri, în aceeași ordine, readuci pisica la start și reproduci un traseu dat, numai cu blocuri de mișcare.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: un drum, spus pas cu pas',
   text: `<p>La munte urmezi un <mark>traseu</mark>: un drum cu un început, cu locuri prin care treci, în ordine, și cu un capăt. Unde drumul se desparte, indicatorul îți spune încotro s-o iei. Dacă o iei altfel, ajungi în alt loc.</p>
<p>Azi îi spui pisicii din Scratch, cu blocuri, pe unde să meargă.</p>
${fig('indicator-traseu.webp', 340, 514, 'Un stâlp de lemn cu mai multe indicatoare de traseu, cu săgeți colorate spre stânga și spre dreapta, la munte', 'Un indicator de traseu la munte. <small>Foto: Krzysztof Popławski, <a href="https://commons.wikimedia.org/wiki/File:Drogowskaz_szlak%C3%B3w_turystycznych_na_Hali_Miziowej.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY 4.0; decupată.</small>', 'mica')}`},
  /* ---- pasul 1: pașii în cuvinte devin blocuri (puntea V/28 → blocuri); mergi, rotește-te ---- */
  {t: 'Pașii scriși devin blocuri',
   text: `<p>La lecția 28 ai scris algoritmi în cuvinte, cu structura secvențială: pașii se fac unul după altul, în ordinea scrisă, fiecare o dată. În Scratch, <b>fiecare pas devine un bloc</b>, în aceeași ordine, sub blocul galben. Pisica face blocurile de sus în jos.</p>
<p>Două blocuri din <b>Mișcare</b>, al doilea e nou:</p>
<ul><li><span class="blk mv">mergi 10 pași</span>: merge înainte, încotro privește;</li>
<li><span class="blk mv">rotește-te ↺ 15 grade</span>: rămâne pe loc și se întoarce spre stânga ei (↻ = spre dreapta ei). 90 de grade = un colț, ca al foii de caiet.</li></ul>`,
   exemplu: `<p>În cuvinte: <b>1.</b> Mergi 100 de pași. <b>2.</b> Rotește-te spre stânga 90 de grade. <b>3.</b> Mergi 50 de pași. În blocuri:</p>
${STIVA([['steag'], m(100), st(90), m(50)])}
${fig('program-rulat.webp', 690, 458, 'Editorul Scratch după steag: în zona de cod blocul galben, mergi 100 pași, rotește-te spre stânga 90 grade, mergi 50 pași; pisica cu capul în sus; sub scenă, încadrate, x 100 și y 50 (1) și Direcția 0 (2)', 'În Scratch, după steag (două decupaje lipite): 1. x și y spun unde e pisica; 2. Direcția, încotro privește (0 = în sus).')}
<p>Blocurile de mișcare sunt foarte repezi: nu vezi pisica mergând, o vezi direct la capăt. Numărul îl schimbi așa: clic pe el (pe telefon, atingi), scrii, <kbd>Enter</kbd> (pe telefon, atingi în altă parte).</p>
${ACUM('În bara de adrese, într-o filă nouă: <code>scratch.mit.edu/projects/editor</code>, <kbd>Enter</kbd>. Meniul e în engleză? <b>Settings</b> › <b>Language</b>, derulezi până la litera R, <b>Română</b>. Lasă fila deschisă.', 'Din <b>Evenimente</b>, „când se dă click pe ⚑”. Sub el, din <b>Mișcare</b>, „mergi 10 pași”. Scrie în el 100. Steagul: sub scenă, x 100.')}`,
   altfel: `<p>E ca atunci când îi spui drumul unui prieten legat la ochi: „Mergi 3 pași. Întoarce-te la stânga. Mergi 2 pași.” Fiecare propoziție e un bloc. Când se întoarce, rămâne pe loc; merge abia la propoziția următoare.</p>`,
   incearca: {t: 'traseu', q: 'Scrie în blocuri algoritmul: <b>1.</b> Mergi 150 de pași. <b>2.</b> Rotește-te spre stânga 90 de grade. <b>3.</b> Mergi 50 de pași. Trage blocurile sub cel galben, schimbă numerele, apasă steagul o dată și „Rulează testele”. Linia portocalie arată pe unde a trecut pisica; în Scratch nu rămâne nicio linie. Pe telefon: din paletă, tragi întâi puțin spre dreapta, apoi unde vrei.',
    paleta: PAL_M, nota: NOTA, pasCuPas: false, pune_mijloc: true,
    program: P(),
    teste: DUPA([[0, 0], [150, 0], [150, 50]], 'Merge întâi spre dreapta, apoi în sus', 'La final: x 150, y 50'),
    solutie: P(m(150), st(90), m(50)),
    gresit: P(m(150), dr(90), m(50)),
    ajutor: 'Trei pași, trei blocuri, în aceeași ordine: „mergi” cu 150, „rotește-te ↺” cu 90, „mergi” cu 50. Atenție la săgeată: ↺ e spre stânga. Pe telefon, paleta e tăiată: primul „rotește-te” e ↻, al doilea e ↺.',
    why: 'Fiecare pas a devenit un bloc, în aceeași ordine: 150 spre dreapta, o rotire pe loc, 50 în sus.'},
   inca: [
    {t: 'traseu', q: 'Încă unul, cu 5 pași: <b>1.</b> Mergi 50 de pași. <b>2.</b> Rotește-te spre stânga 90 de grade. <b>3.</b> Mergi 100 de pași. <b>4.</b> Rotește-te spre dreapta 90 de grade. <b>5.</b> Mergi 50 de pași.',
     paleta: PAL_M, nota: NOTA, pasCuPas: false, pune_mijloc: true,
     program: P(),
     teste: DUPA([[0, 0], [50, 0], [50, 100], [100, 100]], 'Trece prin x 50, y 0 și x 50, y 100', 'La final: x 100, y 100'),
     solutie: P(m(50), st(90), m(100), dr(90), m(50)),
     gresit: P(m(50), st(90), m(100), st(90), m(50)),
     ajutor: 'Pasul 2 e cu ↺, pasul 4 e cu ↻. Pisica se rotește de la locul unde e.',
     why: 'Cinci pași, cinci blocuri. Două rotiri în sensuri diferite: pisica merge iar spre dreapta.'}
   ]},
  /* ---- pasul 2: ordinea contează (aceleași blocuri, alt loc); mutarea unui bloc ---- */
  {t: 'Ordinea contează',
   text: `<p>Aceleași blocuri, în altă ordine, duc pisica în alt loc. Pisica nu alege: face blocurile de sus în jos, ca executantul de la lecția 28.</p>
<p>Ca să schimbi ordinea, tragi un bloc în alt loc. Trei lucruri de ținut minte:</p>
<ul><li>un bloc tras vine <b>împreună cu cele de sub el</b>;</li>
<li>lăsat peste marginea de jos a altui bloc, intră chiar sub el, între blocuri;</li>
<li>tras înapoi în paletă, dispare (și cele de sub el).</li></ul>`,

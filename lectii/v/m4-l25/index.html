<meta name="description" content="Lecția 25, clasa a V-a: cele trei proprietăți ale unui algoritm bun — claritatea (fiecare pas se face într-un singur fel), finitudinea (algoritmul se oprește) și generalitatea (merge pentru toate cazurile de același fel); repari patru algoritmi defecți cu un executant în pagină, apoi un algoritm de desen în Paint.">

<style>

  --desk:#EEF3F0; --paper:#FFFFFF; --paper2:#F2F7F4; --line:#CFDDD5;
  --ink:#15241D; --ink2:#4B5E55; --accent:#0F6B52; --accentInk:#FFFFFF; --sel:#D3EDE2;
  --mark:#FFE07A; --markInk:#15241D; --ok:#1E7A46; --okbg:#E0F2E6; --bad:#B8362E; --badbg:#FAE4E2;
  --fd:"Gabarito","Segoe UI",system-ui,sans-serif; --fb:"Commissioner","Segoe UI",system-ui,sans-serif; --fm:"Azeret Mono",Consolas,monospace;
}

  --desk:#0E1613; --paper:#16211C; --paper2:#1C2A24; --line:#30443B;
  --ink:#E6F0EA; --ink2:#A9BCB2; --accent:#6FD0AE; --accentInk:#0E1613; --sel:#21392F;

}}

  --ink:#E6F0EA; --ink2:#A9BCB2; --accent:#6FD0AE; --accentInk:#0E1613; --sel:#21392F;

/* tema: o tablă de clasă cu un algoritm scris cu creta și cele trei întrebări */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:#24443a;border-bottom:2px solid var(--accent)}
.banda .bd-t{flex:none;font-family:var(--fm);font-size:.76rem;color:#f4f1e6;border:1px dashed #9fc1b2;border-radius:4px;padding:1px 8px}
.banda .bd-z{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.76rem;color:#d9eadf}
h1,h2{font-weight:600;letter-spacing:0}
code{font-family:var(--fm);font-size:.9em}
/* „Acum la calculator” (regula 10): gesturi mici, reale, imediat după pas */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:600;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum li.tarziu{list-style:none;margin:.5em 0 .1em -1.2em;padding-top:5px;border-top:1px dashed var(--line)}
.acum li.mai-ai-timp,span.mai-ai-timp{color:var(--ink2)}
/* algoritmul lui Dan (laboratorul): pașii, ca pe o fișă */
.fisa{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:6px 10px;margin:6px 0}
.fisa ol{margin:.2em 0 .2em 1.3em;padding:0}
.fisa .fisa-t{font-weight:700}
.intrebari3{border-left:4px solid var(--accent);padding:2px 10px;margin:6px 0}
.captura figcaption a.lic{display:inline-block;padding:8px 0}
.ad-demo-t{font-weight:700;margin:10px 0 2px}

<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/algoritm-defect.js"></script>
<script>
/* Lecția 25, clasa a V-a (M4): „Proprietățile algoritmilor: claritate, finitudine, generalitate” — predare, a doua lecție din
   V-U5 „Algoritmi. Gândesc pas cu pas”. Legea: LearningHub\_campaign\revizuire_completa_2026_09\00_GHID_LECTII.md.
   Sursele și probele: surse.md, _proba\. Definițiile: manualele de clasa a V-a de pe manuale.edu.ro (Intuitext p. 63; Art Klett,
   Sigma, Corint, Litera, CD Press, EDP — citatele în surse.md) și programa (CS.2.1, exemplele „sau” / „numerele naturale pare”).
   Activitatea profesorului (activitati_lectii_V_VI.json): „Elevii primesc patru algoritmi defecți (ambiguu, fără sfârșit, valabil
   doar pentru un caz) și trebuie să spună ce lipsește la fiecare și să îl repare.” — atelierul (4 algoritmi; al patrulea: tot
   ambiguu, cu „sau”, felul din programă).
   Simulatorul: lectii/_sim/algoritm-defect.js (NOU, proprietar lecția aceasta): executantul face exact ce scrie; un pas neclar îl
   oprește nedumerit, un pas fără sfârșit e oprit de pagină după 40 de faceri (regula paginii; o spune PAGINA, sub bula
   executantului — reparația r1, ca la V/24), iar cazurile de același fel arată generalitatea. Testele judecă algoritmul
   REPARAT, EXECUTAT. „Pas” = un rând scris; „facere” = o dată când executantul face un pas (P3).
   Granița: NU predă ce e un algoritm (lecția 24, doar recapitulat), datele / constantele / variabilele (26), expresiile (27),
   structura secvențială ca denumire (28), decizia (29): niciun algoritm din pagină nu folosește „dacă” sau o literă în loc de număr.
   Paint (laboratorul) NU a fost pornit: faptele vin din lecțiile 18-22 (afirmatii.json ale lor).
   Trimiterile la pași se fac după numărul din bara de jos (P1 = „La ce folosește”). */
const AD=AlgoritmDefect, pune=AD.pune, scrie=AD.scrie, nr=AD.nr;
const V=(t,o)=>Object.assign({t},o||{});
const ori=k=>k===0?'o dată':`de ${nr(k+1,'ori')}`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  linguri:fig('linguri-masura.webp',760,577,'Două linguri de măsurat din plastic alb pe un prosop de hârtie: cea mică are scris 5 ml, cea mare 15 ml','Lingurița de măsurat (5 ml, TSP în engleză) și lingura (15 ml, TBS): la fel pentru toți. „Puțin” nu. <small>Foto: „Teaspoon &amp; tablespoon”, J.smith, <a class="lic" href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener">CC BY-SA 3.0</a>, micșorată (aceeași licență), <a class="lic" href="https://commons.wikimedia.org/wiki/File:Teaspoon_%26_tablespoon.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.</small>')
};
/* '!…' = punctul de la sfârșitul orei; '?…' = „Dacă mai ai timp” */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculator, în Paint-ul adevărat</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:x.startsWith('?')?`<li class="mai-ai-timp"><b>Dacă mai ai timp:</b> ${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;
/* trimiterile la pașii lecțiilor publicate (?vezi=pN: pasul N din bara lor, P1 = „La ce folosește”; doar de citit, în filă nouă) */
const LP=(cale,l,p,t)=>`<a href="../${cale}/?vezi=p${p}" target="_blank" rel="noopener">lecția ${l}, pasul <i>${t}</i> (P${p})</a>`;
/* algoritmul lui Dan (inventat): îl execuți pe bucăți în casetele pașilor 2-4, apoi îl repari și îl execuți în laborator */
const DAN=['Pornește Paint.','Alege în <b>Culoare 1</b> o culoare frumoasă.','Din <b>Forme</b>, desenează stele cu 5 colțuri una lângă alta și nu te opri.','Cu <b>Text</b>, scrie jos: <i>Dan, 5B</i>.'];

/* ===================== algoritmii (toți inventați; nicio „dacă”, nicio literă în loc de număr) ===================== */
/* P2 „Uite cum”: ceaiul (programa: „prepararea unui ceai”; Corint: pasul ambiguu al ceaiului) */
const CEAI={nume:'Ceaiul',masaTitlu:'Pe masă:',start:()=>({masa:[]}),
 pasi:[
  {v:[V('Fierbe 250 ml de apă.',{fa:s=>pune(s,'ibricul','250 ml de apă fiartă')})]},
  {v:[V('Pune un plic de ceai în cană.',{fa:s=>pune(s,'în cană','un plic de ceai')})]},
  {v:[V('Toarnă apa fiartă în cană.',{fa:s=>{pune(s,'ibricul','gol');pune(s,'în cană','ceai, 250 ml');}})]},
  {v:[V('Pune puțin zahăr.',{neclar:['o linguriță','două lingurițe','cinci lingurițe'],intrebare:'Cât înseamnă „puțin”:'}),
      V('Pune o linguriță de zahăr.',{fa:s=>pune(s,'zahăr','o linguriță')})]}],
 sol:[0,0,0,1],gresit:[0,0,0,0]};
/* P2 „Încearcă”: limonada (cuvinte vagi + „sau” ca variante greșite) */
const LIMONADA={nume:'Limonada',masaTitlu:'În pahar:',start:()=>({masa:[]}),
 pasi:[
  {v:[V('Pune 200 ml de apă rece în pahar.',{fa:s=>pune(s,'apă rece','200 ml')}),V('Pune puțină apă rece în pahar.',{neclar:['100 ml','200 ml','paharul plin'],intrebare:'Câtă apă:'})]},
  {v:[V('Stoarce o lămâie în pahar.',{fa:s=>pune(s,'zeamă de lămâie','o lămâie')}),V('Stoarce câteva lămâi în pahar.',{neclar:['una','două','cinci'],intrebare:'Câte lămâi:'})]},
  {v:[V('Pune zahăr cât trebuie.',{neclar:['o linguriță','trei lingurițe','zece lingurițe'],intrebare:'Cât înseamnă „cât trebuie”:'}),
      V('Pune zahăr după gust.',{neclar:['o linguriță','patru lingurițe','deloc'],intrebare:'Cât înseamnă „după gust”:'}),
      V('Pune două lingurițe de zahăr.',{fa:s=>pune(s,'zahăr','două lingurițe')}),
      V('Pune zahăr sau miere.',{neclar:['zahăr','miere'],intrebare:'Ce pun:'})]},
  {v:[V('Amestecă de 5 ori cu lingurița.',{de:5,fa:(s,c,k)=>pune(s,'amestecat',ori(k))}),V('Amestecă puțin.',{neclar:['o dată','de 5 ori','de 30 de ori'],intrebare:'Cât înseamnă „puțin”:'})]}],
 tinta:(c,s)=>{const are=k=>(s.masa||[]).some(m=>m[0]===k);const ok=are('apă rece')&&are('zeamă de lămâie')&&are('zahăr')&&are('amestecat');return {ok,are:ok?'a făcut limonada':'limonada nu e gata',astept:'apă, lămâie, zahăr, amestecat'};},
 sol:[0,0,2,0],gresit:[0,0,1,0]};
/* P2 „Încă un exercițiu”: ghiozdanul */
const GHIOZDAN={nume:'Ghiozdanul pentru ora de TIC',masaTitlu:'Ghiozdanul:',start:()=>({masa:[]}),
 pasi:[
  {v:[V('Deschide ghiozdanul.',{fa:s=>pune(s,'ghiozdanul','deschis')}),V('Deschide ceva.',{neclar:['ghiozdanul','penarul','fereastra'],intrebare:'Ce deschid:'})]},
  {v:[V('Pune în ghiozdan câteva caiete.',{neclar:['caietul de TIC','toate caietele de pe raft','două caiete oarecare'],intrebare:'Care caiete:'}),
      V('Pune în ghiozdan caietele care trebuie.',{neclar:['caietul de TIC','caietul de mate','toate caietele'],intrebare:'Care sunt „cele care trebuie”:'}),
      V('Pune în ghiozdan caietul de TIC și pe cel de română.',{fa:s=>pune(s,'înăuntru','caietul de TIC, caietul de română')})]},
  {v:[V('Pune penarul în ghiozdan.',{fa:s=>{const x=(s.masa||[]).find(m=>m[0]==='înăuntru');pune(s,'înăuntru',(x?x[1]+', ':'')+'penarul');}}),V('Pune și ce mai vrei.',{neclar:['penarul','mingea','nimic'],intrebare:'Ce pun:'})]},
  {v:[V('Închide ghiozdanul.',{fa:s=>pune(s,'ghiozdanul','închis')})]}],
 tinta:(c,s)=>{const x=(s.masa||[]).find(m=>m[0]==='înăuntru');const ok=!!x&&/TIC/.test(x[1])&&/penarul/.test(x[1]);return {ok,are:ok?'a pregătit ghiozdanul':'ghiozdanul nu e gata',astept:'caietele și penarul în ghiozdan'};},
 sol:[0,2,0,0],gresit:[0,1,0,0]};

/* P3 „Uite cum”: numerele pare (programa: „se afişează numerele naturale pare” e lipsită de finitudine; Art Klett, p. 55) */
const PARE={nume:'Numerele pare',tablaTitlu:'Pe tablă:',start:()=>({tabla:[],loc:'la tablă'}),
 pasi:[
  {v:[V('Ia o cretă.',{fa:s=>{s.loc='la tablă, cu creta în mână';}})]},
  {v:[V('Scrie pe tablă numerele pare: 0, 2, 4, 6 și tot așa.',{mereu:true,fa:(s,c,k)=>scrie(s,2*k)}),
      V('Scrie pe tablă numerele pare de la 0 la 20.',{de:11,fa:(s,c,k)=>scrie(s,2*k)})]},
  {v:[V('Pune creta jos.',{fa:s=>{s.loc='la tablă; a pus creta jos';}})]}],
 sol:[0,1,0],gresit:[0,0,0]};
/* P3 „Încearcă”: coarda */
const COARDA={nume:'Săritul corzii',tablaTitlu:'Săriturile, numărate:',start:()=>({masa:[['coarda','în dulap']],tabla:[]}),
 pasi:[
  {v:[V('Ia coarda din dulap.',{fa:s=>pune(s,'coarda','în mâna executantului')}),V('Ia o coardă de undeva.',{neclar:['din dulap','din sala de sport','de la un coleg'],intrebare:'De unde:'})]},
  {v:[V('Sari coarda și nu te opri.',{mereu:true,fa:(s,c,k)=>scrie(s,k+1)}),
      V('Sari coarda de multe ori.',{neclar:['de 5 ori','de 50 de ori','de 100 de ori'],intrebare:'Cât înseamnă „de multe ori”:'}),
      V('Sari coarda de 10 ori.',{de:10,fa:(s,c,k)=>scrie(s,k+1)}),
      V('Sari coarda mereu.',{mereu:true,fa:(s,c,k)=>scrie(s,k+1)})]},
  {v:[V('Pune coarda la loc, în dulap.',{fa:s=>pune(s,'coarda','la loc, în dulap')}),V('Pune coarda undeva.',{neclar:['în dulap','pe masă','pe jos'],intrebare:'Unde:'})]}],
 tinta:(c,s)=>{const x=(s.masa||[]).find(m=>m[0]==='coarda');const ok=!!x&&x[1]==='la loc, în dulap';return {ok,are:ok?'a pus coarda la loc':'coarda nu e la loc',astept:'coarda la loc, în dulap'};},
 sol:[0,2,0],gresit:[0,3,0]};
/* P3 „Încă un exercițiu”: din 5 în 5 */
const CINCI={nume:'Din 5 în 5',tablaTitlu:'Pe tablă:',start:()=>({tabla:[]}),
 pasi:[
  {v:[V('Scrie pe tablă: 5, 10, 15 și tot așa, din 5 în 5.',{mereu:true,fa:(s,c,k)=>scrie(s,5*(k+1))}),
      V('Scrie pe tablă din 5 în 5, de la 5 la 50.',{de:10,fa:(s,c,k)=>scrie(s,5*(k+1))}),
      V('Scrie pe tablă din 5 în 5, cât poți de mult.',{mereu:true,fa:(s,c,k)=>scrie(s,5*(k+1))})]},
  {v:[V('Spune ultimul număr scris.',{fa:s=>{s.spune=(s.tabla||[]).slice(-1)[0]||'';}})]}],
 tinta:(c,s)=>({ok:!!s.spune,are:s.spune?`a spus „${s.spune}”`:'n-a spus nimic',astept:'ultimul număr scris'}),
 sol:[1,0],gresit:[2,0]};

/* P4 „Uite cum”: găinile (Intuitext, ex. 8 C: „Adună pe 5 cu 7…” = un singur caz; Corint: „nu vom scrie un program care
   adună numerele 2, 5, 18 și 42”). Cazurile: trei curți inventate. */
const GAINI={nume:'Picioarele găinilor',masaTitlu:'Executantul ține minte:',
 cazuri:[{nume:'Curtea 1',g:5},{nume:'Curtea 2',g:3},{nume:'Curtea 3',g:7}],descrieCaz:c=>`${c.nume} (${nr(c.g,'găini')})`,
 start:c=>({gaini:c.g,masa:[]}),
 pasi:[
  {v:[V('Numără găinile din curte.',{fa:(s,c)=>{s.numarate=c.g;pune(s,'găini numărate',String(c.g));}})]},
  {v:[V('Spune: „Au 10 picioare.”',{fa:s=>{s.rasp=10;s.spune='Au 10 picioare.';}}),
      V('Înmulțește cu 2 numărul găinilor numărate și spune rezultatul.',{fa:s=>{s.rasp=2*s.numarate;s.spune=`Au ${nr(s.rasp,'picioare')}.`;}})]}],
 tinta:(c,s)=>({ok:s.rasp===2*c.g,are:`a spus „${s.spune}”`,astept:nr(2*c.g,'picioare')}),
 sol:[0,1],gresit:[0,0]};
/* P4 „Încearcă”: biletele la teatru (prețul e inventat: „să zicem 10 lei”) */
const BILETE={nume:'Biletele la teatru',cerinta:'Clasa merge la teatru. Să zicem că un bilet costă 10 lei. Algoritmul află câți lei plătește clasa.',masaTitlu:'Executantul ține minte:',
 cazuri:[{nume:'Clasa a V-a A',e:25},{nume:'Clasa a V-a B',e:18},{nume:'Clasa a V-a C',e:21}],descrieCaz:c=>`${c.nume} (${nr(c.e,'elevi')})`,
 start:c=>({masa:[['elevi care merg',String(c.e)]]}),
 pasi:[
  {v:[V('Numără elevii care merg la teatru.',{fa:(s,c)=>{s.numarati=c.e;pune(s,'elevi numărați',String(c.e));}}),
      V('Numără câțiva elevi.',{neclar:['trei elevi','zece elevi','toți elevii'],intrebare:'Câți:'})]},
  {v:[V('Spune: „Plătim 250 de lei.”',{fa:s=>{s.rasp=250;s.spune='Plătim 250 de lei.';}}),
      V('Spune: „Plătim 180 de lei.”',{fa:s=>{s.rasp=180;s.spune='Plătim 180 de lei.';}}),
      V('Înmulțește cu 10 numărul elevilor numărați și spune câți lei plătiți.',{fa:s=>{s.rasp=10*s.numarati;s.spune=`Plătim ${nr(s.rasp,'lei')}.`;}}),
      V('Spune: „Plătim mulți lei.”',{neclar:['100 de lei','250 de lei','1000 de lei'],intrebare:'Câți înseamnă „mulți”:'})]}],
 tinta:(c,s)=>({ok:s.rasp===10*c.e,are:`a spus „${s.spune}”`,astept:nr(10*c.e,'lei')}),
 sol:[0,2],gresit:[0,1]};
/* P4 „Încă un exercițiu”: ouăle din cofraje (6 într-un cofraj) */
const OUA={nume:'Ouăle din cofraje',cerinta:'În fiecare cofraj sunt 6 ouă. Algoritmul află câte ouă sunt pe masă.',masaTitlu:'Executantul ține minte:',
 cazuri:[{nume:'Masa 1',k:2},{nume:'Masa 2',k:3},{nume:'Masa 3',k:5}],descrieCaz:c=>`${c.nume} (${nr(c.k,'cofraje')})`,
 start:c=>({masa:[['cofraje pe masă',String(c.k)]]}),
 pasi:[
  {v:[V('Numără cofrajele de pe masă.',{fa:(s,c)=>{s.cof=c.k;pune(s,'cofraje numărate',String(c.k));}})]},
  {v:[V('Spune: „Sunt 12 ouă.”',{fa:s=>{s.rasp=12;s.spune='Sunt 12 ouă.';}}),
      V('Adună 6 cu 6 și spune rezultatul.',{fa:s=>{s.rasp=12;s.spune='Sunt 12 ouă.';}}),
      V('Înmulțește cu 6 numărul cofrajelor numărate și spune rezultatul.',{fa:s=>{s.rasp=6*s.cof;s.spune=`Sunt ${nr(s.rasp,'ouă')}.`;}})]}],
 tinta:(c,s)=>({ok:s.rasp===6*c.k,are:`a spus „${s.spune}”`,astept:nr(6*c.k,'ouă')}),
 sol:[0,2],gresit:[0,1]};

/* ===== atelierul: cei patru algoritmi defecți ai fișei profesorului ===== */
const SANDVIS={nume:'Sandvișul',cerinta:'Ce face: un sandviș cu unt și roșie.',masaTitlu:'Pe farfurie:',start:()=>({masa:[]}),
 pasi:[
  {v:[V('Pune o felie de pâine pe farfurie.',{fa:s=>pune(s,'pâine','o felie')}),V('Pune puțină pâine pe farfurie.',{neclar:['o felie','jumătate de pâine','o pâine întreagă'],intrebare:'Câtă pâine:'})]},
  {v:[V('Unge felia cu unt.',{fa:s=>pune(s,'unt','pe felie')}),V('Unge felia cu ceva bun.',{neclar:['unt','miere','gem'],intrebare:'Cu ce:'})]},
  {v:[V('Pune pe ea câteva felii de roșie.',{neclar:['una','trei','opt'],intrebare:'Câte felii:'}),
      V('Pune pe ea roșii cât vrei.',{neclar:['o felie','patru felii','toate roșiile'],intrebare:'Cât înseamnă „cât vrei”:'}),

  cum: '<b>Cum lucrezi</b> (recapitulare = reiei ce ai învățat; nimic nou, iar pagina nu dă notă)<ol><li>6 pași scurți.</li><li>Atelierul: fișa ta, apoi cel puțin un exercițiu, al unui rând la care nu ești sigur; celelalte, dacă mai ai timp.</li><li>La calculator: dovezile, în caiet. Pe telefon, totul în caiet.</li><li>5 întrebări.</li></ol><p><b>Când mai sunt 10 minute din oră:</b> te oprești. La rândurile la care n-ai ajuns scrie „încă nu”. Scrie propozițiile și obiectivul (la calculator, <b>Pentru discuție</b> și <b>Obiectivul tău</b>), apoi treci la întrebări. Ce nu termini poți face acasă, dacă vrei.</p>',
  nivele: [
{t: 'Recapitulare finală. Unde am ajuns pe cele trei niveluri și ce urmează', final: true, lectii: [36],
 /* S11: V-R n-are conținut propriu în programă, iar poarta cere unul. Declarate: cele reluate cu un exercițiu în atelier, câte unul pe unitate (surse.md, tabelul). */
 continuturi: ['Dispozitive de intrare: exemple, rol, mod de utilizare', 'Operații cu fișiere și directoare', 'Siguranța pe Internet', 'Stiluri de umplere', 'Structura alternativă (decizională)Medii grafice interactive - elemente de interfață specifice mediului grafic interactiv', 'Modalități de reprezentare a structurilor secvențiale și alternative prin blocuri grafice'],
 obiectiv: 'vezi unde ai ajuns la fiecare dintre cele nouă lucruri mari ale anului, îți pui singur o literă, îți pregătești discuția cu profesorul și îți scrii ce vrei mai departe.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: te uiți unde ai ajuns',
   text: `<p>Pe un drum lung, la munte, te oprești la un indicator: vezi unde ai ajuns și alegi încotro o iei.</p>
<p>La sfârșit de an, la informatică, faci la fel. Azi nu înveți nimic nou: te uiți la ce ai făcut în 35 de lecții, vezi unde ești și alegi ce vrei mai departe.</p>
<p>Ce bifezi aici nu ajunge în catalog.</p>
${fig('../m5-l32/img/indicator-traseu.webp', 340, 514, 'Un stâlp de lemn cu mai multe indicatoare de traseu, cu săgeți colorate spre stânga și spre dreapta, la munte', 'Un indicator de traseu la munte. <small>Foto: Krzysztof Popławski, <a href="https://commons.wikimedia.org/wiki/File:Drogowskaz_szlak%C3%B3w_turystycznych_na_Hali_Miziowej.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY 4.0; decupată.</small>', 'mica')}`},
  /* ---- pasul 1: fișa și harta anului („predat unde”) ---- */
  {t: 'Fișa: nouă lucruri, nouă rânduri',
   text: `<p>Profesorul ține o <mark>fișă de niveluri</mark>: un tabel cu un rând pentru fiecare elev și câte o coloană pentru fiecare <mark>competență</mark> (un lucru pe care trebuie să știi să-l faci), nouă în total. Codurile lor încep cu CS, de la „competență specifică”.</p>
<p>Fișa aceea, cu numele elevilor, o completează profesorul. Tu îți faci în caiet o fișă a ta, cu aceleași nouă competențe.</p>
<p>Mai jos e harta anului: rândurile și, sub fiecare, lecțiile lui. Un număr apăsat deschide lecția separat, doar de citit.</p>`,
   exemplu: `${FisaNiveluri.harta(RANDURI, '')}
<div class="acum" role="note"><div class="lbl">Acum în caiet, și pe telefon</div><p style="margin:.2em 0">Pe o pagină nouă, scrie titlul <b>Unde am ajuns</b>. Sub el, unul sub altul, cele nouă coduri, de la CS.1.1 la CS.3.3. Lasă loc lângă fiecare.</p></div>`,
   altfel: `<p>E ca o listă de lucruri de făcut pe un an întreg. Nu scrie pe ea fiecare lecție, ci nouă lucruri mari. Fiecare lecție te-a ajutat la unul sau la câteva dintre ele.</p>`,
   incearca: {t: 'match', q: 'La ce rând din fișă ține fiecare lucru făcut? Apasă un lucru, apoi rândul lui. La final, „Verifică”.',
    pairs: [['Ți-ai pus pozele din excursie în foldere, după ani', 'CS.1.2 · fișiere și foldere'], ['Ai notat cine a scris o pagină despre lup', 'CS.1.3 · informații de pe internet'], ['La o problemă cu bilete, ai spus ce se dă și ce se cere', 'CS.2.2 · datele unui algoritm'], ['Ai pus o regulă de câștig într-un joc, în Scratch', 'CS.3.3 · joc digital']],
    ajutor: 'Pentru fiecare, întreabă-te: e despre fișiere, despre internet, despre un algoritm sau despre un joc?',
    why: 'Pozele în foldere: CS.1.2. Sursa unei pagini: CS.1.3. Ce se dă și ce se cere: CS.2.2. Regula de câștig: CS.3.3.'},
   inca: [
    {t: 'choice', q: 'Ai urmărit pas cu pas un algoritm cu o decizie și ai spus în cuvinte ce face cu datele. La ce rând din fișă ține?',
     o: ['CS.2.3: descrii în cuvinte pașii și deciziile', 'CS.1.1: folosești calculatorul în siguranță', 'CS.3.1: faci un desen în editorul grafic', 'CS.1.3: cauți informații pe internet'], ok: 0,
     ajutor: 'Ce ai făcut: ai folosit un dispozitiv, un desen, internetul sau ai descris un algoritm?',
     why: 'Ai descris în cuvinte ce face un algoritm: CS.2.3.'}
   ]},
  /* ---- pasul 2: literele; definițiile din Fisa_criterii_elev_clasa_V.md §2, cu aceleași cuvinte ca la V/1 ---- */
  {t: 'Literele: C, B, A, D1, D2',
   text: `<p>Ce literă pui lângă un cod? De la prima oră știi trei niveluri:</p>
<ul><li><b>C · De bază:</b> rezolvi după un model sau după pașii dați, la lucruri pe care le-ai mai făcut;</li>
<li><b>B · Consolidat:</b> rezolvi <b>singur</b>, la lucruri de felul celor exersate;</li>
<li><b>A · Avansat:</b> rezolvi <b>singur</b>, după cerință, o situație <b>pe care n-ai mai văzut-o</b>.</li></ul>
<p>Sub De bază, ministerul mai numește două, după ajutorul de care ai nevoie: <b>D1 · În formare</b> (ajutor doar pentru tine, care se poate da la oră) și <b>D2 · În dificultate</b> (ajutor special, în afara orei).</p>
<p>O literă spune ce ajutor îți trebuie acum, nu cum ești tu.</p>`,
   exemplu: `<div class="fisa"><p><b>Mutarea unui fișier, pe trei litere:</b></p><p><b>C:</b> îl muți cu pașii lecției deschiși lângă tine.</p><p><b>B:</b> îl muți singur, cum ai exersat.</p><p><b>A:</b> primești un folder pe care nu l-ai mai văzut și îi faci singur ordine, după cerință.</p></div>
<p>Azi nu e lucrare: te gândești la ce ai făcut.</p>`,
   altfel: `<p>E ca la bicicletă, ca la lecția 1. Cineva ține de șa: De bază. Mergi singur, pe aleea știută: Consolidat. Mergi singur, pe un drum nou: Avansat. Îți trebuie cineva doar pentru tine, ca să înveți? Asta spune ce ajutor îți trebuie acum, nu cum ești tu.</p>`,
   incearca: {t: 'classify', q: 'Ce literă se potrivește? Alege pe fiecare rând, apoi apasă „Verifică”.', cats: ['C · De bază', 'B · Consolidat', 'A · Avansat'],
    items: [['Ai făcut afișul urmărind, pas cu pas, lecția deschisă lângă tine', 0], ['Ai salvat singur o imagine de pe web, cum ai exersat la lecție', 1], ['Ți s-a cerut un algoritm pentru ceva ce n-ai mai văzut și l-ai scris singur', 2], ['Ai pus blocurile programului după modelul din lecție', 0], ['Ai copiat singur fișiere dintr-un folder în altul, cum ai exersat', 1]],
    ajutor: 'La fiecare rând, întreabă-te: am avut un model sau pași dați? Am lucrat singur, la ceva exersat? Situația era nouă?',
    why: 'Cu lecția deschisă sau după model: C. Singur, la ce ai exersat: B. Singur, într-o situație nouă: A.'},
   inca: [
    {t: 'choice', q: 'Ce spune litera D1, în fișă?',
     o: ['Ai nevoie de ajutor doar pentru tine, iar ajutorul se poate da la oră', 'Ai nevoie de ajutor special, care se dă în afara orei', 'Rezolvi singur, la lucruri de felul celor exersate', 'Rezolvi după un model, la lucruri pe care le-ai mai făcut'], ok: 0,
     ajutor: 'D1 și D2 vorbesc despre ajutor. Care dintre ele se dă la oră?',
     why: 'D1 · În formare: ajutor doar pentru tine, care se poate da la oră. D2 · În dificultate: ajutor special, în afara orei.'}
   ]},
  /* ---- pasul 3: dovada; Portofoliu_elev.md + ce au scris/salvat elevii în lecțiile publicate (surse.md, tabelul dovezilor) ---- */
  {t: 'Dovada: ce poți arăta',
   text: `<p>Spui: „La fișiere cred că sunt la B.” Cum arăți? Cu o <mark>dovadă</mark>: ceva ce se poate vedea. Un <mark>portofoliu</mark> e locul în care strângi ce ai lucrat. Ai de la profesor o mapă? Acolo e. N-ai? Caietul e portofoliul tău, dacă profesorul nu vă spune altfel.</p>
<p>Unde cauți: în caiet, la titlurile lecțiilor; foile lucrărilor, dacă le ai; fișierele salvate pe calculator (pot dispărea); diplomele lecțiilor terminate pe numele tău.</p>
<p>Ce n-ai, nu inventezi. Nu găsești nimic la un rând? Scrii „fără dovadă” și faci, în atelier, exercițiul lui.</p>`,
   exemplu: `<div class="fisa"><p><b>Două dovezi, ca exemplu:</b></p><p>CS.1.2: în caiet, titlul „Traseul fișierelor”, de la lecția 10.</p><p>CS.3.3: în caiet, fișa jocului, de la lecția 34.</p></div>
<p><b>Diploma:</b> la începutul unei lecții terminate pe numele tău apare butonul <b>Vezi diploma</b>.</p>`,
   altfel: `<p>E ca atunci când îi spui mamei că ai făcut tema. Ea te crede mai ușor dacă îi arăți caietul. Dacă n-ai scris-o, nu poți arăta nimic: o faci acum și arăți ce ai făcut.</p>`,
   incearca: {t: 'classify', q: 'Care dintre acestea se pot arăta? Alege pe fiecare rând, apoi apasă „Verifică”.', cats: ['E dovadă', 'Nu e dovadă'],
    items: [['Tabelul de urmărire desenat în caiet', 0], ['„Mi se pare că mă descurc la algoritmi”', 1], ['Afișul tău, deschis din Documente', 0], ['„Colegul de bancă spune că sunt bun”', 1], ['Autorul și licența unei fotografii, scrise în caiet', 0], ['„Am fost atent la toate orele”', 1]],
    ajutor: 'Întreabă-te: pot să-i pun în față profesorului ce scrie pe rând?',
    why: 'Tabelul, afișul și ce ai scris despre fotografie se pot vedea. Celelalte sunt păreri: nu se pot arăta.'},
   inca: [
    {t: 'choice', q: 'Îți cauți jocul în Documente și nu mai e acolo. Ce faci?',
     o: ['Scrii că a dispărut și arăți fișa jocului din caiet', 'Faci repede alt joc și spui că acela e cel vechi', 'Iei de pe calculator jocul unui coleg și îl redenumești', 'Lași rândul gol și nu-i spui nimic profesorului'], ok: 0,
     ajutor: 'Calculatorul e comun, iar fișierele pot dispărea. Ce ai sigur la tine?',
     why: 'Pe un calculator comun, un fișier poate dispărea, și nu e vina ta. În caiet ai fișa jocului. Spui ce s-a întâmplat și arăți ce ai.'}
   ]},
  /* ---- pasul 4: discuția, fără profesor lângă tine (Tupilați: ora simultană) ---- */
  {t: 'Discuția: două-trei propoziții',
   text: `<p>Profesorul stă de vorbă pe scurt cu fiecare elev, dar poate fi la altă clasă. Tu scrii în caiet două-trei propoziții, gata pentru când ajunge la tine. Nu-l chemi și nu-l aștepți: lucrezi mai departe.</p>
<p>O propoziție bună are trei bucăți: <b>rândul</b> din fișă, <b>litera</b> ta și <b>dovada</b>. Mai spui ce ți-a ieșit cel mai bine și unde ai nevoie de ajutor.</p>
<p>Fișa oficială o completează profesorul: el hotărăște. Tu îi spui ce crezi și ce poți arăta.</p>`,
   exemplu: `<div class="fisa"><p><b>Forma:</b> „La <i>(rândul)</i> cred că sunt la <i>(litera)</i>, pentru că <i>(dovada)</i>.” „Cel mai bine mi-a ieșit <i>(ce)</i>. Am nevoie de ajutor la <i>(ce)</i>.”</p><p><b>Propoziția altcuiva:</b> „La CS.1.2 cred că sunt la C, pentru că am făcut «Traseul fișierelor» cu pașii deschiși lângă mine; îl am în caiet.”</p></div>`,
   altfel: `<p>E ca atunci când îi spui antrenorului: „La pase cred că sunt bine, pentru că le-am făcut pe toate la ultimul meci. Am nevoie de ajutor la șuturi.” El știe de unde să pornească. Hotărârea rămâne a lui.</p>`,
   incearca: {t: 'choice', q: 'Care propoziție are toate cele trei bucăți: rândul, litera și dovada?',
    o: ['La CS.3.1 cred că sunt la B: am făcut singur afișul din Documente.', 'La desen sunt foarte bun, mă pricep de când eram mic.', 'La CS.3.1 cred că sunt la B, pentru că așa mi se pare.', 'Cred că sunt la B, pentru că am făcut singur afișul din Documente.'], ok: 0,
    ajutor: 'Caută rândul (un cod), litera și ceva ce se poate vedea.',
    why: 'Are codul (CS.3.1), litera (B) și ceva ce se poate arăta (afișul). „La desen…” n-are cod și literă; „așa mi se pare” n-are dovadă; „Cred că…” n-are rândul.'}},
  /* ---- pasul 5: ce urmează (DOAR Planificare_calendaristica_clasa_VI.md, unitățile; fără aplicații) și obiectivul (formă, nu text) ---- */
  {t: 'Ce urmează: un obiectiv al tău',
   text: `<p>Ce urmează la clasa a VI-a? Planificarea are patru mari părți: vei face <b>prezentări digitale</b>, vei învăța să <b>comunici prin Internet, în siguranță</b>, vei scrie <b>algoritmi cu pași care se repetă</b> și vei lucra cu <b>animații grafice și modele 3D</b> (imagini care se mișcă, forme cu volum). Cu ce aplicații, vă spune profesorul atunci.</p>
<p>Un <mark>obiectiv</mark> e un lucru pe care ți-l propui și despre care poți spune, mai târziu, dacă l-ai făcut. Poate porni de la un rând din fișă sau de la ce vei învăța. Îl scrii tu, într-o propoziție.</p>
<p>Pe vară, pagina nu-ți cere nimic.</p>`,
   exemplu: `<div class="fisa"><p><b>Forma:</b> „Anul viitor vreau să <i>(ce)</i>. O să știu că am reușit când <i>(ce se vede)</i>.”</p><p><b>Tot așa, dar la înot:</b> „Anul viitor vreau să înot o lungime de bazin. O să știu că am reușit când o fac de două ori la rând.”</p></div>`,
   altfel: `<p>„Vreau să fiu mai bun” e o dorință: nu știi niciodată dacă ai ajuns. „Vreau să fac singur X” e un obiectiv: într-o zi vezi că l-ai făcut.</p>`,
   incearca: {t: 'choice', q: 'Care dintre acestea e un obiectiv pe care îl poți verifica?',
    o: ['Vreau să-mi țin temele în foldere; am reușit când găsesc orice temă într-un minut.', 'Vreau să fiu mai bun la calculator și să-mi placă mai mult informatica.', 'Vreau să știu tot ce se poate ști despre calculatoare până la anul.', 'Vreau ca anul viitor să fie mai bine la informatică decât anul acesta.'], ok: 0,
    ajutor: 'La care dintre ele poți spune, într-o zi: „Da, l-am făcut”?',
    why: 'Cel cu temele în foldere spune ce faci și cum vezi că ai reușit. Celelalte sunt dorințe. Al tău poate fi cu totul altul.'}}
 ],
 atelier: {t: 'fisa-niveluri', titlu: 'Atelier: fișa ta și un exercițiu din fiecare unitate',
  /* „Cum le citești”: un sfat al paginii, sprijinit pe Descriptori_clasa_V.md (C: „cu sprijin, … în pași ghidați”; B: „independent, …
     în contexte familiare”; A: „independent, …” în „contexte noi”); judecata 1, M. „Sari la exercițiul”: judecata 1, B. */
  intro: `<p><strong>Sarcina:</strong> exercițiul 1 e fișa ta: pui o literă la fiecare rând și le scrii în caiet. Exercițiile 2-7, câte unul din fiecare unitate, le încerci singur, fără lecția deschisă: întâi pe ale rândurilor la care nu ești sigur (cel puțin unul), apoi celelalte, dacă mai ai timp.</p>
${FisaNiveluri.sari()}
<p><b>Cum le citești (un sfat al paginii, nu o regulă a fișei):</b> un exercițiu e doar un exemplu din rând. Singur? Se potrivește cu B („independent”, „în contexte familiare”). Cu indiciu? Cu C („cu sprijin”). Nici așa? În caiet: „am nevoie de ajutor aici”. A cere o situație nouă, deci n-are exercițiu aici. La CS.2.1 și CS.3.3 dovada e algoritmul și jocul tău.</p>
<p>Au trecut 30 de minute din oră? Treci la calculator, chiar dacă n-ai terminat exercițiile.</p>`,
  q: 'Fișa ta: la fiecare rând, apasă litera la care crezi că ești. Pagina primește orice literă: alege-o pe cea adevărată pentru tine. Apoi „Verifică fișa”.',
  randuri: RANDURI,

  sens: {D1: 'ajutor doar pentru tine, care se poate da la oră. Scrie în caiet la ce ai nevoie de ajutor: asta îi spui profesorului.',

  neatins: {buton: 'Încă n-am lucrat la asta', text: '<b>Nu e o literă din fișă.</b> Se întâmplă: ai lipsit sau n-ai ajuns. Pasul tău: deschizi o lecție de pe rândul ăsta (la „Cum recunosc literele”, jos, la „Recitește”) și îi spui profesorului.'},
  caiet: 'Scrie în caiet, lângă coduri:',
  ajutor: 'Nu ești sigur la un rând? Deschide „Cum recunosc literele și ce pot arăta”, sub el. N-ai lucrat la el? Apasă „Încă n-am lucrat la asta”.',
  why: 'Scrie literele în caiet acum, dacă n-ai făcut-o: când treci la alt exercițiu, pagina le uită.',

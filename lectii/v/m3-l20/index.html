<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">

<title>Lecția 20, clasa a V-a: Redimensionare, trunchiere, rotație, panoramare</title>
<meta name="description" content="Lecția 20, clasa a V-a: în Paint (Windows 11) rotești și răstorni o imagine, îi tai marginile (Selectare, apoi Decupare din grupul Imagine), o faci mai mică sau mai mare (Redimensionați și înclinați: procente sau pixeli, cu proporțiile păstrate) și o privești de aproape, fără s-o schimbi (panoramarea, Zoom). Pregătești o fotografie pentru o poză de profil și pentru un afiș.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap&subset=latin-ext">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EEF3F0; --paper:#FFFFFF; --paper2:#F3F8F5; --line:#D0DDD6;
  --ink:#16231D; --ink2:#4B5E55; --accent:#0F6E5A; --accentInk:#FFFFFF; --sel:#D3ECE3;
  --mark:#FFE07A; --markInk:#16231D; --ok:#1E7A46; --okbg:#E0F2E6; --bad:#B8362E; --badbg:#FAE4E2;
  --fd:"Baloo 2","Segoe UI",system-ui,sans-serif; --fb:"Source Sans 3","Segoe UI",system-ui,sans-serif; --fm:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0F1714; --paper:#16211C; --paper2:#1C2A24; --line:#30443A;
  --ink:#E6F0EA; --ink2:#A9BDB2; --accent:#6FD0B4; --accentInk:#0F1714; --sel:#22392F;
  --mark:#EDCB63; --markInk:#16231D; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
}}
:root[data-theme="dark"]{
  --desk:#0F1714; --paper:#16211C; --paper2:#1C2A24; --line:#30443A;
  --ink:#E6F0EA; --ink2:#A9BDB2; --accent:#6FD0B4; --accentInk:#0F1714; --sel:#22392F;
  --mark:#EDCB63; --markInk:#16231D; --ok:#6CCB8F; --okbg:#18301F; --bad:#FF877B; --badbg:#3A1E1B;
}
/* tema: bara de titlu a lui Paint, o imagine care se întoarce și procentul zoomului */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent)}
.banda .bd-t{flex:none;font-size:.76rem;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.banda .bd-r{flex:none;font-size:1rem;color:var(--ink)}
.banda .bd-c{flex:none;width:34px;height:20px;border:1.5px dashed var(--ink2);border-radius:2px}
.banda .bd-z{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--fm);font-size:.72rem;color:var(--ink2)}
h1,h2{font-weight:600;letter-spacing:0}
code{font-family:var(--fm);font-size:.9em}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:32px}
/* „Acum la calculator” (regula 10): gesturi mici, reale, imediat după pas */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:600;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum li.tarziu{list-style:none;margin:.5em 0 .1em -1.2em;padding-top:5px;border-top:1px dashed var(--line)}
.acum li.mai-ai-timp,span.mai-ai-timp{color:var(--ink2)}
.acum code{white-space:nowrap;font-size:.8em}
/* fotografia de descărcat: mică pe ecran, întreagă în fișier */
figure.foto-mica img{max-width:170px;height:auto}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../_sim/paint.js"></script>
<script src="../../_sim/paint-selectie.js"></script>
<script src="../../_sim/paint-imagine.js"></script>
<script>
/* Lecția 20, clasa a V-a (M3): „Redimensionare, trunchiere, rotație, panoramare” — a treia lecție din V-U4.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Simulatorul: lectii/_sim/paint.js (V/18) + paint-selectie.js (V/19), neschimbate, + extensia NOUĂ lectii/_sim/paint-imagine.js
   (proprietar lecția aceasta): grupul Imagine (Decupare, Rotiți, Răsturnare, Redimensionați și înclinați), panoramarea din bara de stare.
   Paint (aplicație din Magazin) NU a fost pornit: faptele vin din capturile reale din jocuri/grafica-v (Paint RO), din probele
   judecătorului lecției V/8 pe Paint-ul real (UI Automation: grupul Imagine, meniul Rotiți, zoomul din bara de stare), din resursele
   pachetului Paint citite ca fișier și din pagina Microsoft despre Paint. Ce nu e probat stă în surse.md („Nesigur”) și în
   capturi_lipsa.json și e scris prudent („de obicei”).
   Activitatea profesorului (activitati_lectii_V_VI.json, V/20): „Elevii pregătesc o fotografie proprie pentru două destinații: poză de
   profil (pătrată, mică) și afiș (mare, orizontală). Se compară rezultatele și se discută pierderea de calitate.” Fotografia e a lecției
   (Wikimedia Commons, CC BY 4.0), pusă culcată intenționat; elevul o salvează din pagină (lecția 15). Casetele construiesc poza de
   profil; laboratorul face afișul și compară. Folderul de lucru: Ex Nume Prenume în Documente (lecția 10), făcut în caseta P2, unde
   stă și punctul „La sfârșitul orei”. Trimiterile la pași se fac după numărul din bara de jos (P1 = „La ce folosește”).
   Reparațiile după judecata 1 (24.10.2026): _verificare/registru_j1.md (literele A-U) și surse.md, „Reparațiile după judecata 1”.
   Reparația 2 (24.10.2026, după judecata 2): literele V-Z din același registru și surse.md, „Reparația 2”. */
const fig=(f,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CAPT='<small>Capturi din Paint (Windows 11); chenarele roșii sunt de la noi.</small>';
/* CC BY 4.0 cere legătura spre licență și mențiunea schimbărilor (judecata 1: m6 / sonnet M-10) */
const FOTO=ce=>`<small>Foto: Trougnouf, <a href="https://creativecommons.org/licenses/by/4.0/deed.ro" target="_blank" rel="noopener">CC BY 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Larry_the_cat_sitting_besides_a_wooden_lawn_chair_in_Auderghem,_Belgium_(DSCF2368).jpg" target="_blank" rel="noopener">Wikimedia Commons</a>; ${ce} de noi.</small>`;
const IMG={
  pisica:fig('pisica.webp',800,512,'O pisică bej stă în iarbă, lângă un scaun de grădină din fier, în fața unui zid de cărămidă','O fotografie, două locuri: poză de profil și afiș. '+FOTO('micșorată')),
  culcata:fig('pisica-culcata.jpg',410,640,'Aceeași pisică, dar culcată: iarba e în dreapta, iar capul pisicii e în stânga','Fotografia de salvat, culcată intenționat (<code>pisica-culcata</code>). '+FOTO('micșorată și rotită'),'foto-mica'),
  rotire:fig('rotire.webp',310,160,'Meniul butonului Rotiți din Paint, deschis cu săgeata ⌄: Rotire la dreapta 90°, Rotire la stânga 90° și Rotire cu 180° încadrate; dedesubt, Rotire personalizată','Săgeata ⌄ de lângă <b>Rotiți</b>, în grupul <b>Imagine</b>. '+CAPT),
  trunchiere:fig('trunchiere.webp',1000,607,'Paint: o casă selectată cu un chenar punctat, pe un desen cu cer albastru și un soare; sus, în grupul Imagine, butonul Decupare încadrat','Selecția cuprinde doar ce rămâne (casa); sus, <b>Decupare</b>, în grupul <b>Imagine</b>.'),
  redim:fig('redimensionare.webp',350,460,'Fereastra Redimensionare și înclinare din Paint: Procent ales, Pixeli; Orizontal 100, butonul-lanț albastru, Vertical 100; Oblic 0°; OK și Anulare','Fereastra <b>Redimensionare și înclinare</b>, cu butonul-lanț albastru.'),
  zoom:fig('panoramare.webp',410,44,'Colțul din dreapta al barei de stare din Paint: procentul 146 % cu o săgeată, lupa cu minus, o bară cu un buton și lupa cu plus','Colțul zoomului, în bara de stare (146 %).')
};
/* '!…' = punctul de la sfârșitul orei; '?…' = „Dacă mai ai timp” (nu intră în timpul obligatoriu) */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculator, în Paint-ul adevărat</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:x.startsWith('?')?`<li class="mai-ai-timp"><b>Dacă mai ai timp:</b> ${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;

/* lumea simulatorului: folderul Anei e Documente › Ex Pop Ana; desenele (casa, acoperis, usa, copac, trunchi, soare, iarba, deget)
   sunt în PaintImagine.DESENE (lectii/_sim/paint-imagine.js): pi_scena 1038 × 648, pi_culcat și pi_atelier 648 × 1038 */
const P=o=>Object.assign({t:'paintw'},o);
const DREAPTA=[['acoperis','sus','casa'],['casa','stanga','copac']];
const POZA='Documente/Ex Pop Ana/poza club.png';
/* judecata 3, AA: testul tăierii judecă NUMAI poza de la sfârșit, ca profesorul care se uită la poza salvată (testul taiere din
   paint-imagine.js): degetul nu se mai vede, casa (cu acoperiș), copacul și soarele sunt întregi și la locul lor, iar pânza are
   mărimea unei tăieri bune. Intervalul vine din desen (pi_deget, 1038 × 648): degetul ține până la x ≈ 47, acoperișul pornește de
   la x ≈ 243, soarele ține până la x ≈ 992 și pornește de la y ≈ 148, casa ține până la y ≈ 562 — deci lățimea 749-991 px și
   înălțimea 414-648 px. Cum a ajuns elevul acolo (Ctrl+X, Delete, degetul tras afară, o copie pusă la loc) nu contează. */
const TAI={k:'taiere',model:'pi_deget',scoate:'deget',pastreaza:['casa','acoperis','copac','soare'],w:[749,991],h:[414,648]};

/* laboratorul: întâi poza de profil (mică, clară), apoi afișul (mare, neclar) — comparația cerută de profesor (judecata 1, m8);
   numărul vechi din casetă se șterge întâi (M1); lanțul are drum de rezervă (m7 / sonnet M-5); derularea e predată la P5 (sonnet M-6).
   Judecata 2, X: mai scurt (fără paranteza de la punctul 1 — poza profil e încă în Paint, de la P4 —, fără „Verifică-te”, care repeta) */
const LAB=[
  'Privește întâi poza <b>profil</b> (de la P4) cu zoomul pe <b>100 %</b>: e mică, dar clară.',
  'Afișul, din aceeași fotografie: <b>Fișier</b> › <b>Deschidere</b>, <b>Documente</b>, dublu-clic pe folderul tău, apoi pe <b>pisica-culcata</b> (dreaptă și netăiată, de la P2).',
  '<b>Imagine</b> › <b>Redimensionați și înclinați</b>, <b>Procent</b>. Clic în caseta <b>Orizontal</b>, după 100; golește caseta cu <kbd>Backspace</kbd> și scrie <code>300</code>. Verifică: și la <b>Vertical</b> scrie 300 (dacă nu, scrie-l tu). <b>OK</b>.',
  'Zoomul pe <b>100 %</b>; mergi cu rotița până la pisică (P5) și privește-i marginile: sunt neclare. Poza de profil, mică, e clară; afișul, mare, e neclar. Asta e pierderea de calitate.',
  'Închide Paint cu X: <b>Nu salvați</b> (afișul nu-l păstrăm).',
  'Lasă calculatorul cum l-ai găsit: în Explorer, <b>Documente</b>, clic pe folderul tău, <kbd>Delete</kbd> (ajunge în Coș; <b>nu goli Coșul</b>). O fotografie rămasă în <b>Descărcări</b>: clic pe ea, <kbd>Delete</kbd>. Închide Explorer.'
];

JocMotor.porneste({
  cheie:'lectie_v_m3_l20',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 20”, pasul real înainte de verificare
  titlu:'Redimensionare, trunchiere, rotație, panoramare',
  marca:'Lecția <b>20</b> · clasa a V-a',
  h1:'Redimensionare, trunchiere, rotație, panoramare',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U4', unitateTitlu:'Editoare grafice. Fac materiale digitale',
  competente:['CS.3.1'], lectii:'20',
  ancoraText:'Din programă (CS.3.1, unitatea V-U4, lecția 20): Redimensionarea, trunchierea, rotaţia unei imagini; Panoramare imagine',
  intro:`<p><b>Ai nevoie de:</b> lecția 19 (<b>Selectare</b> › <b>Dreptunghi</b>, <kbd>Ctrl</kbd>+<kbd>Z</kbd>), lecția 18 (Paint: <b>Deschidere</b>, <b>Salvați ca</b>, <kbd>Ctrl</kbd>+<kbd>S</kbd> după un clic pe bara de titlu, X; pixelii și mărimea din bara de stare), lecția 15 (clic dreapta pe o imagine, <b>Salvați imaginea ca</b>), lecția 14 (<kbd>Backspace</kbd>), lecția 10 (folderul tău, Coșul) și lecția 9 (rotița mouse-ului).</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>5 pași, fiecare cu un exercițiu și cu gesturi în Paint-ul adevărat: faci o poză de profil.</li><li>Atelierul, în pagină; apoi afișul, la calculator.</li><li>5 întrebări, pentru stele.</li></ol><p><b>Sfârșitul orei?</b> Bara de jos › <b>P2</b>, ultimul punct.</p>`,
  banda:'<span class="bd-t">pisica - Paint</span><span class="bd-r" aria-hidden="true">↻ ⇋</span><span class="bd-c" aria-hidden="true"></span><span class="bd-z">⬚ 300 × 300px · 400 %</span>',
  nivele:[
{t:'Redimensionare, trunchiere, rotație, panoramare',final:true,lectii:[20],
 continuturi:['Redimensionarea, trunchierea, rotaţia unei imagini','Panoramare imagine'],
 obiectiv:'rotești și răstorni o imagine, îi tai marginile, o faci mai mică sau mai mare păstrând proporțiile și o privești de aproape cu zoomul, fără s-o schimbi.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: o fotografie, două locuri',
   text:`<p>O fotografie rar e bună așa cum ai făcut-o. A ieșit culcată? Are ceva în plus pe margine? E prea mare?</p>
<p>Un editor grafic o pregătește pentru locul în care o pui:</p>
<ul><li>pentru o <b>poză de profil</b> o vrei dreaptă, doar cu ce e important și mică;</li><li>pentru un <b>afiș</b> o vrei mare.</li></ul>
<p>Azi, în Paint, o <mark>rotești</mark>, îi <mark>tai</mark> marginile, o faci mai mică sau mai mare și te uiți la ea de aproape.</p>
${IMG.pisica}`},
  /* ---- pasul 1: Rotiți și Răsturnare (UI Automation la V/8; resursele: Răsturnare verticală / orizontală) ---- */
  {t:'Rotiți și răsturnați imaginea',
   text:`<p>În grupul <b>Imagine</b> din bara cu instrumente sunt butoanele care schimbă toată imaginea. În Paint-ul adevărat, ține mouse-ul pe un buton: îi apare numele. Săgeata ⌄ de lângă <b>Rotiți</b> (butonul cu o săgeată rotundă) dă:</p>
<ul><li><b>Rotire la dreapta 90°</b>: un sfert de tură, ca acele ceasului;</li><li><b>Rotire la stânga 90°</b>: un sfert de tură, invers;</li><li><b>Rotire cu 180°</b>: o întoarce cu susul în jos.</li></ul>
<p>A patra, <b>Rotire personalizată</b> (un unghi oarecare), n-o folosim azi.</p>
<p>Săgeata ⌄ de lângă <b>Răsturnare</b> (sub Rotiți) o oglindește: <b>Răsturnare orizontală</b> (stânga trece în dreapta) sau <b>Răsturnare verticală</b> (susul trece jos).</p>
<p>N-a ieșit cum voiai? <kbd>Ctrl</kbd>+<kbd>Z</kbd> (pe telefon, săgeata ↶ de sus).</p>
${IMG.rotire}`,
   exemplu:`${ACUM('Fă-ți folderul în <b>Documente</b> (lecția 10): Ex, numele și prenumele. Ascunde Explorer (<b>Minimizare</b>).',
     'Clic dreapta pe fotografia de mai jos, <b>Salvați imaginea ca</b>, <b>Documente</b>, dublu-clic pe folderul tău, <b>Salvare</b>.'+IMG.culcata,
     'Pornește Paint (Start, <code>pai</code>): <b>Fișier</b> › <b>Deschidere</b>, <b>Documente</b>, dublu-clic pe folderul tău, apoi pe <b>pisica-culcata</b>.',
     '<b>Imagine</b> › <b>Rotiți</b> › <b>Rotire la dreapta 90°</b>. Clic pe bara de titlu, <kbd>Ctrl</kbd>+<kbd>S</kbd>.',
     '!<b>La sfârșitul orei</b>: revii aici (<b>P2</b>), închizi Paint (<b>Nu salvați</b>) și ștergi folderul tău (Explorer, <kbd>Delete</kbd>; nu goli Coșul).')}`,
   altfel:`<p>Ia o carte de pe bancă. O învârți pe bancă, fără s-o ridici: asta e rotirea. Acum ține-o în fața unei oglinzi: în oglindă, stânga ei e în dreapta. Asta e răsturnarea.</p>`,
   incearca:P({q:'Poza e culcată: casa stă pe o parte. <b>Rotește-o</b> ca să stea dreaptă, cu acoperișul sus.',start:{desen:'pi_culcat',w:648,h:1038,unealta:'selectie'},
    checks:[{k:'pozitie',c:DREAPTA,ce:'Imaginea stă dreaptă: acoperișul e sus, copacul în dreapta casei',msg:'Imagine › Rotiți › Rotire la dreapta 90°. Ai rotit în partea greșită? Ctrl+Z (pe telefon, ↶) și încearcă la dreapta.'},
     {k:'marime',w:1038,h:648,ce:'Bara de stare arată 1038 × 648 px (lată, nu înaltă)'}],
    sol:[['rot','d']],gresit:[['rot','s']],
    ajutor:'Acoperișul e acum în stânga. Ca să ajungă sus, imaginea se întoarce ca acele ceasului: Rotire la dreapta 90°. (Pe telefon: butonul Imagine, apoi Rotiți.)',
    why:'Rotire la dreapta 90°: un sfert de tură, ca acele ceasului. Stânga a ajuns sus, iar lățimea și înălțimea și-au schimbat locul.'}),
   inca:[
    P({q:'Poza e oglindită: copacul a ajuns în stânga casei. Adu-o cum era, cu copacul în dreapta.',start:{desen:'pi_oglinda',unealta:'selectie'},
     checks:[{k:'pozitie',c:DREAPTA,ce:'Copacul e din nou în dreapta casei, iar acoperișul sus',msg:'O imagine oglindită se îndreaptă tot cu o oglindire: Imagine › Răsturnare › Răsturnare orizontală.'}],
     sol:[['rast','o']],gresit:[['rot','180']],
     ajutor:'Stânga și dreapta și-au schimbat locul. Care răsturnare schimbă stânga cu dreapta?',
     why:'Răsturnarea orizontală a schimbat iar stânga cu dreapta, deci poza a revenit cum era. O rotire n-ar fi reparat oglindirea.'}),
    {t:'match',q:'Leagă fiecare comandă de ce face.',pairs:[['Rotire la dreapta 90°','un sfert de tură, ca acele ceasului'],['Rotire cu 180°','imaginea ajunge cu susul în jos'],['Răsturnare orizontală','stânga trece în dreapta, ca în oglindă'],['Răsturnare verticală','susul trece jos, ca o imagine în apă']],
     ajutor:'Rotirea învârte, răsturnarea oglindește.',why:'Rotirile învârt imaginea (90° = un sfert de tură, 180° = o jumătate). Răsturnările o oglindesc: orizontală, stânga cu dreapta; verticală, sus cu jos.'}
   ]},
  /* ---- pasul 2: trunchierea = Selectare › Dreptunghi + Decupare din grupul Imagine (UI Automation: CropButton; captura trunchiere) ---- */
  {t:'Trunchierea: tai marginile',
   text:`<p>A <mark>trunchia</mark> o imagine înseamnă a-i tăia marginile, ca să rămână doar ce e important.</p>
<ol><li><b>Selectare</b> › <b>Dreptunghi</b> (lecția 19): tragi chenarul punctat peste ce vrei să PĂSTREZI.</li><li>În grupul <b>Imagine</b> apeși <b>Decupare</b> (butonul cu două colțuri). Până selectezi ceva, el e gri.</li></ol>
<p>Tot ce era în afara chenarului dispare, iar imaginea se face mai mică: bara de stare arată mărimea nouă.</p>
<p>Atenție: în Paint sunt două „Decupare”. Cea din meniul <b>Editare</b> (sau <kbd>Ctrl</kbd>+<kbd>X</kbd>, lecția 19) e altceva: scoate doar bucata selectată și o pune în memorie.</p>
${IMG.trunchiere}`,
   exemplu:`<p>Poza de profil e pătrată: cât tragi, cele două numere de după ⬚, din bara de stare, să fie cam la fel.</p>
${ACUM('<b>Selectare</b> › <b>Dreptunghi</b>, un pătrat în jurul pisicii (doar ea și puțină iarbă).','<b>Imagine</b> › <b>Decupare</b>. N-a ieșit? <kbd>Ctrl</kbd>+<kbd>Z</kbd> și încă o dată.')}`,

  /* ---- pasul 3: redimensionarea (fereastra „Redimensionare și înclinare”; captura redimensionare) ---- */
  {t:'Redimensionarea: mai mică sau mai mare',
   text:`<p>A <mark>redimensiona</mark> înseamnă a schimba mărimea întregii imagini. În grupul <b>Imagine</b> apeși <b>Redimensionați și înclinați</b> (pătratul punctat cu o săgeată). În fereastră:</p>
<ol><li>alegi <b>Procent</b> (50 = jumătate, 200 = de două ori mai mare) sau <b>Pixeli</b>;</li><li><b>Orizontal</b> e lățimea, <b>Vertical</b> e înălțimea. În casetă e deja un număr: dai clic după el, apeși <kbd>Backspace</kbd> până se golește caseta și scrii numărul tău;</li><li>butonul-lanț (<b>Mențineți raportul de aspect</b>) să fie albastru: atunci, de obicei, cealaltă casetă se schimbă singură, iar imaginea nu se deformează;</li><li>lași <b>Oblic</b> (înclinarea) pe 0° și apeși <b>OK</b>.</li></ol>
<p>Micșorată, imaginea pierde pixeli, iar ei nu se mai întorc. Mărită, pixelii ei se întind: devine neclară.</p>
${IMG.redim}`,
   exemplu:`${ACUM('<b>Imagine</b> › <b>Redimensionați și înclinați</b>, <b>Pixeli</b>, lanțul albastru. La <b>Orizontal</b> ștergi numărul (<kbd>Backspace</kbd>) și scrii <code>150</code>. Verifică: și la <b>Vertical</b> scrie cam 150 (poza e aproape pătrată); dacă nu, scrie-l tu. <b>OK</b>.','<b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine PNG</b>: scrie <code>profil</code>, <b>Documente</b>, dublu-clic pe folderul tău, <b>Salvare</b> (există deja? <b>Nu</b> și o cifră).')}`,
   altfel:`<p>E ca la fotocopiator: poți cere o copie mai mică sau mai mare. Dacă micșorezi doar lățimea, oamenii din poză ies slabi și lungi. De aceea lași lanțul albastru.</p>`,
   incearca:P({q:'Fă imaginea <b>de două ori mai mică</b> (50 %), păstrând proporțiile.',start:{desen:'pi_scena',unealta:'selectie'},
    checks:[{k:'marime',w:519,h:324,ce:'Imaginea are 519 × 324 px: jumătate pe lățime și jumătate pe înălțime',msg:'Imagine › Redimensionați și înclinați › Procent. La Orizontal apeși Backspace până se golește caseta și scrii 50 (cu lanțul albastru, Vertical devine singur 50), apoi OK.'}],
    sol:[['redim','procent',50,50]],gresit:[['redim','procent',50,100]],
    ajutor:'Fereastra Redimensionare și înclinare: Procent. În caseta Orizontal e 100: dai clic după el, apeși Backspace până se golește caseta și scrii 50. Lanțul albastru pune singur 50 și la Vertical. OK.',
    why:'50 % la Orizontal și la Vertical: aceeași formă, de două ori mai mică.'}),
   inca:[
    {t:'choice',q:'Ai scris <code>50</code> la Orizontal, dar butonul-lanț era alb, iar Vertical a rămas 100. Cum iese imaginea?',o:['Deformată: îngustă, dar la fel de înaltă','De două ori mai mică, cu aceeași formă','La fel ca înainte','Răsturnată'],ok:0,
     ajutor:'Ce s-a schimbat: doar lățimea sau și înălțimea?',why:'Fără lanț, doar lățimea s-a făcut jumătate, iar înălțimea a rămas. Imaginea se deformează: casele ies înguste și lungi.'}

  /* ---- pasul 4: panoramarea (Zoom) din bara de stare (UI Automation: Potrivire la fereastră, Zoom, Micșorare, cursor, Mărire) ---- */
  {t:'Panoramarea: te uiți de aproape',
   text:`<p>Programa îi spune <mark>panoramare</mark>: schimbi cât de mare VEZI imaginea, ca printr-o lupă, și te plimbi prin ea. Imaginea nu se schimbă: bara de stare arată aceeași mărime.</p>
<p>În Paint nu scrie „panoramare”, ci <b>Zoom</b>. E în colțul din dreapta al barei de stare:</p>
<ul><li><b>Mărire</b> (lupa cu +) și <b>Micșorare</b> (lupa cu −), cu o bară între ele, al cărei buton îl tragi;</li><li>procentul, cu săgeata ⌄: <b>100 %</b> înseamnă mărimea adevărată.</li></ul>
<p>La 400 % sau mai mult vezi <b>pixelii</b> (lecția 18). Mărită mult, imaginea nu mai încape: te muți prin ea cu barele de pe marginea pânzei sau, de obicei, cu rotița mouse-ului (lecția 9).</p>
${IMG.zoom}`,
   exemplu:`${ACUM('Lupa cu + de câteva ori, până vezi pătrățelele.','Săgeata ⌄ de lângă procent › <b>100 %</b>.')}`,
   altfel:`<p>Ca atunci când te apropii de un afiș de pe perete: îl vezi mai mare, dar afișul a rămas la fel.</p>`,
   incearca:P({q:'<b>Mărește</b> până vezi pixelii (cel puțin 400 %), apoi întoarce-te la <b>100 %</b>. Imaginea rămâne cum era.',start:{desen:'pi_scena',unealta:'selectie'},
    checks:[{k:'zoom',min:400,ce:'Ai mărit cel puțin la 400 %',msg:'Lupa cu +, din colțul din dreapta al barei de stare, de mai multe ori (sau săgeata ⌄ de lângă procent › 400 %).'},
     {k:'zoom',acum:100,ce:'Acum zoomul e 100 %',msg:'Săgeata ⌄ de lângă procent › 100 % (sau scrie 100 în casetă și apasă Enter).'},
     {k:'marime',w:1038,h:648,ce:'Imaginea a rămas 1038 × 648 px (bara de stare)'}],
    sol:[['zoom',400],['zoom',100]],gresit:[['zoom',400]],
    ajutor:'Lupa cu + mărește, iar procentul arată cât de mare vezi. Înapoi: săgeata ⌄ de lângă procent › 100 %.',
    why:'Bara de stare a arătat tot timpul 1038 × 648 px: zoomul schimbă doar privirea, nu imaginea.'}),

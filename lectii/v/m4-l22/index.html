/* tema: bara de titlu a lui Paint și un titlu de afiș */
.banda{display:flex;align-items:center;gap:10px;padding:7px 12px;white-space:nowrap;overflow:hidden;background:var(--paper2);border-bottom:2px solid var(--accent)}
.banda .bd-t{flex:none;font-size:.76rem;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.banda .bd-a{flex:none;font-family:Georgia,serif;font-weight:700;font-size:1rem;color:var(--accent);border:1px dashed var(--ink2);padding:0 8px;border-radius:2px}
.banda .bd-z{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--fm);font-size:.72rem;color:var(--ink2)}

code{font-family:var(--fm);font-size:.9em}
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:32px}
/* „Acum la calculator” (regula 10): gesturi mici, reale, imediat după pas */
.acum{border:2px dashed var(--accent);border-radius:10px;background:var(--paper2);padding:8px 12px;margin:12px 0 4px}
.acum .lbl{font-family:var(--fd);font-weight:600;color:var(--accent);margin-bottom:2px}
.acum ol{margin:.2em 0 .2em 1.2em;padding:0}
.acum li{margin:.15em 0}
.acum li.tarziu{list-style:none;margin:.5em 0 .1em -1.2em;padding-top:5px;border-top:1px dashed var(--line)}   /* punctul „La sfârșitul orei”: ultimul, fără număr, despărțit */
.acum li.mai-ai-timp,span.mai-ai-timp{color:var(--ink2)}   /* „Dacă mai ai timp”: nu intră în timpul obligatoriu */
.acum code{white-space:nowrap;font-size:.8em}

.grila-c{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--paper)}

<script>
/* Lecția 22, clasa a V-a (M4): „Inserarea și formatarea textului. Realizez o felicitare / un afiș” — consolidare (mini-proiect),
   a cincea lecție din V-U4. Legea: LearningHub\_campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   O singură idee nouă: instrumentul Text (caseta, bara ei, culoarea literelor, clicul în afară, Ctrl+Z). Restul (fundalul, formele,
   culorile, salvarea) doar se GHIDEAZĂ, cu trimiteri la lecțiile 18, 19 și 21.
   Simulatorul: lectii/_sim/paint.js (V/18) + paint-selectie.js (V/19) + paint-culori.js (V/21), neschimbate, + extensia NOUĂ
   lectii/_sim/paint-text.js (proprietar lecția aceasta). Tipul paintw = SimPaintText.
   Paint (aplicație din Magazin) NU a fost pornit: faptele vin din FAQ-ul Microsoft (microsoft.com/windows/paint), din Windows Insider
   Blog (28.09.2021), din capturile reale din jocuri/grafica-v (Paint RO) și din resursele pachetului Paint citite ca fișier. Ce nu e
   probat stă în surse.md („Nesigur”) și în capturi_lipsa.json și e scris prudent, cu un drum care merge oricum.
   Activitatea profesorului (activitati_lectii_V_VI.json, V/22): „Mini-proiect individual: felicitare sau afiș pentru un eveniment real
   al școlii. Etape: schiță pe hârtie, realizare la calculator, prezentare de 1 minut. Colegii dau feedback după grila de produs.”
   Grila: Info_Gimnaziu_2026\instrumente\Grila_produs.md, copiată întocmai în laborator (fără notă: produsul se notează la lecția 23).
   Trimiterile la pași se fac după numărul din bara de jos (P1 = „La ce folosește”).
   Reparațiile după judecata 1 (26.10.2026, autor proaspăt): _verificare\registru_j1.md (literele A-V); proba _proba\proba_reparatii.py. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  afis:fig('afis-concert.webp',375,600,'Un afiș de concert: pe albastru închis, sus, cu litere albe foarte mari, MUSIC OF THE NATIONS; dedesubt, cu litere mai mici, cântecele, corurile, apoi ziua, locul și ora concertului','Un afiș adevărat: sus, titlul cu litere mari; dedesubt, mai mic, ce se cântă, ziua, locul și ora. Literele albe pe albastru închis se văd de departe. <small>Foto: „Aldeburgh High Street, Forthcoming concert poster”, Michael Garlick, <a class="lic" href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noopener">CC BY-SA 2.0</a>, decupată (aceeași licență), <a class="lic" href="https://commons.wikimedia.org/wiki/File:Aldeburgh_High_Street,_Forthcoming_concert_poster_-_geograph.org.uk_-_4879959.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.</small>'),
  textA:fig('instrumente-text.webp',248,158,'Grupul Instrumente din Paint: sus Creion, găleata Umplere și litera A, încadrată cu roșu; jos Radieră, pipeta și lupa','<b>Text</b>: litera A, în grupul Instrumente. <small>Captură din Paint (Windows 11); chenarul roșu e de la noi.</small>'),
  caseta:fig('caseta-text.webp',1000,373,'Paint: pe o pânză crem, o stea roșie și, în dreapta, o casetă cu chenar punctat în care scrie La mulți ani, școala noastră; deasupra pânzei, o bară cu Calibri, 36, butoanele B, I, U, S, trei butoane de aliniere și caseta de bifat Umplere fundal; bara și caseta sunt încadrate cu roșu','Caseta de text deschisă (chenarul punctat) și, deasupra pânzei, <b>bara casetei</b>. <small>Captură din Paint (Windows 11); chenarele roșii sunt de la noi.</small>'),
  bara:fig('bara-caseta-text.webp',328,92,'Bara casetei de text din Paint, tăiată în două bucăți puse una sub alta: Calibri, 36, B, I; dedesubt U, S, trei butoane de aliniere și caseta de bifat Umplere fundal','Bara casetei, tăiată în două ca să încapă pe telefon (săgeata roșie, de la noi: continuă dedesubt). <small>Captură din Paint (Windows 11).</small>'),
  model:fig('felicitare-model.webp',760,482,'Felicitare făcută în Paint: fundal crem, în stânga o stea roșie plină, în dreapta textul negru La mulți ani, școala noastră','O felicitare făcută în Paint: fundalul cu <b>Umplere</b>, steaua din <b>Forme</b>, urarea cu <b>Text</b>. Aici urarea e mică; pe a ta o faci mare și groasă (48 sau 72, <b>B</b>). <small>Captură din Paint (Windows 11).</small>')
};
/* '!…' = punctul de la sfârșitul orei; '?…' = „Dacă mai ai timp” (nu intră în timpul obligatoriu) */
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculator, în Paint-ul adevărat</div><ol>${p.map(x=>x.startsWith('!')?`<li class="tarziu">${x.slice(1)}</li>`:x.startsWith('?')?`<li class="mai-ai-timp"><b>Dacă mai ai timp:</b> ${x.slice(1)}</li>`:`<li>${x}</li>`).join('')}</ol></div>`;
/* trimiterile la pașii lecțiilor publicate (?vezi=pN: pasul N din bara lor, P1 = „La ce folosește”; se deschid doar de citit, în filă nouă) */
const LP=(l,p,t)=>`<a href="../m3-l${l}/?vezi=p${p}" target="_blank" rel="noopener">lecția ${l}, pasul <i>${t}</i> (P${p})</a>`;

/* lumea simulatorului: desenele ptx_* sunt în PaintText.DESENE (lectii/_sim/paint-text.js): ptx_afis = fundal galben deschis și o
   stea roșie în stânga (110-290 × 250-470); ptx_felicitare = fundal turcoaz deschis și o inimă roșie (760-960 × 360-560);
   ptx_greseala = fundal galben deschis, o stea portocalie și titlul „Concurs de desn” abia lipit (120-880 × 90-…). Pânza: 1038 × 648. */
const P=o=>Object.assign({t:'paintw'},o);
const FUNDAL_COLORAT=['negru','gri','rosu','roz','portocaliu','maro','galben','verde','albastru','violet'];
/* R4 (J4-AH): culorile pe care le poate numi un sfat; paint-text v5 le păstrează doar pe cele care trec (contrast ≥ 3) pe fundalul de acum */
const CULORI_SFAT={inchise:[['negru','#000000'],['albastru închis','#3f48cc'],['roșu închis','#880015']],deschise:[['alb','#ffffff'],['galben','#fff200']]};

/* ---- grila profesorului (Grila_produs.md), întocmai: paragraful despre puncte și notă (pus la loc întreg, J1-T) și tabelul (un
   criteriu = un paragraf, ca să se citească și pe telefon); lăsate deoparte antetul fișei, rândul de completat cu punctajul și nota
   și nota de subsol (surse.md). „Dacă mai ai timp” (J1-M, durata): cele 5 criterii, pe nume, sunt în P5 ---- */
const GRILA=`<details class="verif mai-ai-timp"><summary>Dacă mai ai timp: grila profesorului (cu ea se notează felicitarea sau afișul)</summary>
<p>La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). <b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8.</p>
${[
 ['Respectarea cerinței','conține elementele cerute, cu ajutor','conține tot ce s-a cerut, fără ajutor','depășește cerința cu elemente potrivite, alese motivat'],
 ['Corectitudinea tehnică','operațiile de bază, cu îndrumare','operațiile cerute, corect, singur','operații diverse, alese potrivit situației'],
 ['Organizarea','structură dată de profesor','structură proprie, clară','organizare gândită pentru scopul și publicul produsului'],
 ['Explicația (ce am făcut și de ce)','răspunde la întrebări','explică pașii','justifică alegerile și propune alternative'],
 ['Munca proprie / sursele','folosește materialele date','citează sursele imaginilor/textelor','respectă drepturile de autor și explică de ce contează']
].map((r,i)=>`<p class="grila-c"><b>${i+1}. ${r[0]}</b><br>De bază (cu sprijin, model) · 10 p: ${r[1]}<br>Consolidat (independent) · 14 p: ${r[2]}<br>Avansat (context nou, justificat) · 18 p: ${r[3]}</p>`).join('\n')}
<p>Cuvinte din grilă: <b>din oficiu</b> = puncte pe care le primește oricine; <b>alternative</b> = alte variante, alte idei; <b>justifică</b> = spune de ce a ales așa.</p>
<p>Azi doar o citești, ca să știi ce contează. Pagina nu-ți dă notă.</p></details>`;

/* ---- „Acum la calculator” (după atelier, înainte de întrebări). FĂRĂ profesor, pe calculatorul comun. Felicitarea / afișul rămâne
   pe calculator pentru lecția 23 (numele poartă numele, prenumele și clasa: regulile 23, 26, 38). Timpul: _proba/timp.py. ---- */
const LAB=[
  '<b>Pânza nouă și fundalul:</b> Paint (Start, <code>pai</code>) sau, dacă e deschis, <b>Fișier</b> › <b>Nou</b> › <b>Nu salvați</b>. O culoare deschisă în <b>Culoare 1</b>, <b>Umplere</b>, clic pe pânză ('+LP(21,3,'Umplere: găleata colorează o zonă închisă')+').',
  '<b>Desenul:</b> o formă sau două din <b>Forme</b> (stea, inimă sau un <b>Oval</b> galben pentru soare), colorate cu <b>Umplere</b> ('+LP(19,3,'Forme gata făcute; Ctrl+Z dacă n-a ieșit')+'). Greșeală? ↶ sau <kbd>Ctrl</kbd>+<kbd>Z</kbd>.',
  '<b>Titlul:</b> o culoare închisă (de obicei, literele iau <b>Culoare 1</b>); <b>A</b>, clic sus pe pânză; <b>Dimensiune font</b> 48 sau 72 și <b>B</b>; scrie. Literele au altă culoare? Cât caseta e deschisă, alege culoarea și în <b>Culoare 2</b>. Verifici tot, apoi clic pe pânză, în afara casetei. <span class="mai-ai-timp"><b>Dacă mai ai timp:</b> dedesubt, o casetă cu litere mai mici (ziua, ora sau urarea).</span>',
  '<b>Salvezi</b> ('+LP(18,4,'Salvați ca: numele, folderul, PNG sau JPG')+'): <b>Fișier</b> › <b>Salvați ca</b> › <b>Imagine PNG</b>; numele: numele, prenumele și clasa <b>ta</b>, legate cu liniuța de jos, apoi <code>_felicitare</code> (sau <code>_afis</code>), ca la pasul <i>Felicitarea sau afișul tău: planul</i> (P5); în stânga, <b>Documente</b>; <b>Salvare</b>. Scrie că există deja? <b>Nu</b> și adaugi o cifră la sfârșitul numelui.',
  '<b>În caiet</b>, lângă schiță: numele fișierului și calculatorul la care ai lucrat (numărul scris pe el sau rândul și locul), ca să-ți găsești felicitarea la lecția 23.',
  '<b>Pentru prezentarea de 1 minut:</b> în caiet, 2 rânduri: pentru ce eveniment e și de ce ai ales așa. O spui când îți cere profesorul.',
  '<b>La sfârșitul orei</b> (chiar dacă n-ai terminat): clic pe bara de titlu a Paint-ului, <kbd>Ctrl</kbd>+<kbd>S</kbd> (n-ai salvat încă? punctele 4 și 5), apoi X. <b>Nu șterge</b> felicitarea: îți trebuie la lecția 23.'
];

JocMotor.porneste({
  cheie:'lectie_v_m4_l22',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 22”, pasul real înainte de verificare
  titlu:'Inserarea și formatarea textului. Realizez o felicitare / un afiș',
  marca:'Lecția <b>22</b> · clasa a V-a',
  h1:'Inserarea și formatarea textului. Realizez o felicitare / un afiș',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U4', unitateTitlu:'Editoare grafice. Fac materiale digitale',
  competente:['CS.3.1'], lectii:'22',
  ancoraText:'Din programă (CS.3.1, unitatea V-U4, lecția 22): Inserarea și formatarea textului',
  intro:`<p><b>Ai nevoie de:</b> lecțiile 21 (Culoare 1, Umplere), 19 (Forme; <kbd>Ctrl</kbd>+<kbd>Z</kbd>, <kbd>Ctrl</kbd>+<kbd>A</kbd>) și 18 (Paint: Start, <code>pai</code>; <b>Salvați ca</b> › <b>Imagine PNG</b>; X).</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>P1 de citit, apoi 4 pași scurți despre <b>Text</b>, cu gesturi în Paint-ul adevărat.</li><li>Atelierul: titlurile unui afiș, în pagină.</li><li>La calculator: felicitarea sau afișul tău, salvat cu numele tău. Pe telefon: felicitarea, în atelier.</li><li>5 întrebări, pentru stele.</li></ol><p><b>Când mai sunt 10 minute din oră:</b> bara de jos › <b>P2</b>, ultimul punct din casetă.</p>`,
  banda:'<span class="bd-t">Pop_Ana_5A_afis - Paint</span><span class="bd-a" aria-hidden="true">A</span><span class="bd-z">Text · Dimensiune font · B I U</span>',
  nivele:[
{t:'Inserarea și formatarea textului. Realizez o felicitare / un afiș',final:true,lectii:[22],
 continuturi:['Inserarea şi formatarea textului'],
 obiectiv:'scrii pe un desen cu instrumentul Text, alegi mărimea, fontul, Aldin și culoarea literelor, lipești textul de desen și faci o felicitare sau un afiș pe care îl salvezi cu numele tău.',
 pasi:[
  /* ---- pasul 1: la ce folosește (fără acțiuni): afișul / felicitarea, titlul mare; cerința profesorului, pe scurt ---- */
  {t:'La ce folosește: un afiș se citește de departe',
   text:`<p>Un <mark>afiș</mark> anunță un eveniment: ce se întâmplă, când și unde. O <mark>felicitare</mark> trimite cuiva o urare. Amândouă au un <b>titlu mare</b>, care se citește de departe, dintr-o privire.</p>
<p>Azi faci una dintre ele în Paint, pentru un eveniment al școlii. Fundalul, formele și culorile le știi de la lecțiile 19-21. Nou e doar <b>textul</b>.</p>
${IMG.afis}`},
  /* ---- pasul 2: instrumentul Text (FAQ Microsoft: „Click on the canvas … a text box will appear. Type your text in the box”;
     Insider Blog 28.09.2021: iconița „A”); clicul în afară doar NUMIT aici (sensul lui: P4) ---- */
  {t:'Text: caseta în care scrii',
   text:`<p>Instrumentul <mark>Text</mark> e litera <b>A</b> din grupul <b>Instrumente</b>.</p>
<ol><li>Clic pe <b>A</b>. Vezi doar butonul <b>Instrumente</b>? Întâi clic pe el.</li><li>Clic pe pânză, acolo unde vrei textul: apare o <mark>casetă de text</mark>, un chenar punctat.</li><li>Scrii în ea. O literă mare: ții apăsat <kbd>Shift</kbd> (deasupra lui <kbd>Ctrl</kbd>) și apeși litera.</li><li>Ai terminat? Un clic pe pânză, în afara casetei: textul rămâne pe desen.</li></ol>
<p>Pe telefon, în pagină: atingi caseta, să-ți apară tastatura; casetele „Acum la calculator” din pași le sari.</p>
${IMG.textA}`,
   exemplu:`${IMG.caseta}
${ACUM('Pornește Paint (Start, <code>pai</code>). Clic pe <b>A</b> (Text), apoi clic sus pe pânză. Scrie prenumele tău. Apoi clic pe pânză, departe de casetă.','!<b>La sfârșitul orei</b> (chiar dacă n-ai terminat), nu acum: revii aici (<b>P2</b>). Ai început felicitarea în Paint? Salveaz-o (punctele 4 și 5 de la calculator), apoi X. N-ai început-o? X și <b>Nu salvați</b>.')}`,
   altfel:`<p>E ca o ștampilă cu litere: întâi alegi locul (clicul pe pânză) și potrivești literele (scrii). Când o apeși pe foaie (clicul în afara casetei), literele rămân pe hârtie și nu le mai muți.</p>`,
   incearca:P({q:'Pe afiș, scrie <b>Concurs de desen</b> cu instrumentul <b>Text</b>. La sfârșit, un clic pe pânză, în afara casetei.',start:{desen:'ptx_afis',unealta:'pensula'},
    checks:[{k:'text',are:'concurs de desen',sauCaseta:true,ce:'Pe afiș scrie „Concurs de desen”',msg:'Clic pe A (Text), apoi un clic sus pe pânză, unde e loc, și scrie Concurs de desen.'},
     {k:'casetaInchisa',ce:'Textul a rămas pe desen (caseta s-a închis)',msg:'Caseta e încă deschisă (chenarul punctat): un clic pe pânză, în afara ei.'}],
    sol:[['caseta',360,60,1000,150],['scrie','Concurs de desen'],['fixeaza']],
    gresit:[['caseta',360,60,1000,150],['scrie','Concurs de desen']],
    ajutor:'Litera A din grupul Instrumente, un clic sus pe pânză, scrii. La sfârșit, clic pe pânză, departe de casetă.',

   text:`<p>Cât caseta e deschisă, poți schimba orice: o literă, mărimea, culoarea. După clicul în afara casetei, Paint <mark>lipește textul de desen</mark>: caseta dispare, iar literele devin o parte din desen, ca o linie desenată. De obicei nu-l mai poți schimba ca text.</p>

   exemplu:`${ACUM('Clic pe bara de titlu a Paint-ului, apoi <kbd>Ctrl</kbd>+<kbd>Z</kbd>. <b>Bravo</b> a dispărut? Scrie-l din nou (<b>A</b>, clic pe pânză). A reapărut caseta cu Bravo în ea? Lasă-l așa. La sfârșit, clic în afara casetei.')}`,

/* tema: fișa documentării din caiet — trei informații, fiecare cu sursa ei, și literele părților */

<script>
/* Lecția 17, clasa a V-a (M3): „Evaluare sumativă: Internet și documentare” (evaluare sumativă, 22.01.2027 la Brauner).
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Nu se predă nimic nou: pagina pregătește proba practică a unității (activitatea profesorului, Info_Gimnaziu_2026\data\

   (teste_sumative.json are doar V-U1): pagina NU le inventează; proba din atelier e de ANTRENAMENT, cu cerințele și punctele
   paginii, pe C/B/A ca în SISTEM_EVALUARE.md §4.1 (decizia 4 a dirijorului, noaptea 23→24.10.2026).
   Simulatoarele (neschimbate): browser-web.js (V/14), browser-salvare.js (V/15), browser-siguranta.js (V/16); extensia NOUĂ
   a lecției: _sim/eval-internet-v.js (punctele probei, paginile lecției 17). Laboratorul: o documentare adevărată, în file
   noi, cu folderul elevului pus la sfârșit în Coș (ca la V/15); nimic descărcat altceva, niciun cont, nimic scris în pagini. */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="${f}" target="_blank"><img src="${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  fisier:fig('../m2-l14/img/fisier-biblioteca.webp',800,533,'Un sertar lung dintr-un fișier de bibliotecă, plin de cartonașe așezate în rând, pe o masă de lemn','Un sertar din fișierul unei biblioteci. <small>Foto: Michael Holley, <a href="https://commons.wikimedia.org/wiki/File:Copyright_Card_Catalog_Drawer.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, domeniu public; micșorată (din lecția 14).</small>'),
  salvareCa:fig('../m2-l15/img/edge-salvare-ca.webp',911,209,'Bucăți din fereastra Salvare ca: sus Descărcări în bara de adresă (încadrat), apoi Nume fișier cu lup-in-zapada.jpg (încadrat), jos butoanele Salvare și Anulare','Fereastra <b>Salvare ca</b>: sus, folderul (aici <b>Descărcări</b>; tu alegi <b>Documente</b> și folderul tău); jos, <b>Nume fișier</b> și <b>Salvare</b>. <small>Captură din Windows (lecția 15).</small>'),
  rezultat:fig('../m2-l14/img/bing-rezultat.webp',878,160,'Un rezultat Bing: sus numele site-ului explicativ.ro și adresa, dedesubt titlul violet Ce mănâncă ariciul, apoi două rânduri de descriere','Un rezultat: sus site-ul și adresa, apoi titlul (legătura), apoi descrierea. <small>Captură din Bing (lecția 14).</small>'),
  data:fig('../m3-l16/img/data-si-sursa.webp',337,150,'Subsolul unei pagini Wikipedia: Ultima editare a paginii a fost efectuată la 23 mai 2025, cu data încadrată și mărită','La Wikipedia, data e jos de tot: „Ultima editare…”. <small>Captură din Chrome (lecția 16).</small>')
};
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum în browserul tău adevărat</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
/* legături directe spre pașii lecțiilor 1 și 13-16 (?vezi=pN: N de la 1, ca P1…Pn din bara lor; titlurile citite pe 24.10.2026) */
const VEZI=(m,l,p,t)=>`<a href="../${m}-l${l}/?vezi=p${p}" target="_blank" rel="noopener">lecția ${+l}, pasul „${t}”</a>`;
const L1nota=VEZI('m1','01',8,'Lucrarea: trei părți și nota ta'), L1lh=VEZI('m1','01',9,'Munca ta pe LearningHub intră în notă');
const L13serv=VEZI('m2',13,6,'Alegi serviciul potrivit');
const L14file=VEZI('m2',14,3,'Filele: mai multe pagini în aceeași fereastră'), L14adr=VEZI('m2',14,4,'Bara de adrese: scrii adresa, apeși Enter'), L14leg=VEZI('m2',14,5,'Legătura și săgețile: Înapoi, Înainte, Reîmprospătare');
const L14cuv=VEZI('m2',14,7,'Cuvintele-cheie: puține și importante'), L14rez=VEZI('m2',14,9,'Citești un rezultat și îl alegi');
const L15fol=VEZI('m2',15,3,'Alegi tu folderul: Documente, apoi folderul tău'), L15np=VEZI('m2',15,4,'Copiezi un text în Notepad'), L15sursa=VEZI('m2',15,5,'Scrii sursa și salvezi fișierul text'), L15lic=VEZI('m2',15,8,'Licențele libere: autorul îți dă voie dinainte');
const L16ce=VEZI('m3',16,3,'Ce faci: nu apeși, închizi fila, spui unui adult'), L16incr=VEZI('m3',16,5,'Pot avea încredere? Cine a scris și când'), L16comp=VEZI('m3',16,6,'Compari 2-3 surse și recunoști pagina neserioasă');

/* caseta de cookie-uri (lecția 16, după arbitrajul din 19.10): e a site-ului; refuzi cu butonul scris; fără el, × pe filă */
const COOKIE_SCURT='Jos apare o casetă despre <b>cookie-uri</b>? Apasă butonul care refuză (la Bing, <b>Respingeți</b>); fără el, închizi fila cu <b>×</b> și cauți din nou într-o filă nouă.';
const INTOARCERE='<details class="verif"><summary>Ai închis din greșeală lecția?</summary><ol><li>Ai închis doar fila lecției: ține apăsate <kbd>Ctrl</kbd> (jos, în stânga) și <kbd>Shift</kbd> (deasupra lui) și apasă o dată <kbd>T</kbd>. Fila lecției reapare.</li><li>Ai închis toată fereastra browserului: pornește-l din Start, ca la lecția 13 (scrie <b>edge</b> și dă clic pe <b>Microsoft Edge</b>), apoi <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd>. Închide cu X fereastra în care nu e lecția (dacă sunt două, pe amândouă).</li><li>În lecție, apasă <b>Continuă de unde ai rămas</b>, dacă apare.</li></ol></details>';

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă). FĂRĂ profesor.
   Forma probei practice a profesorului: trei informații despre o temă, fiecare cu sursa, și explicația alegerii surselor.
   Tema: pinguinul imperial (sonda din 24.10.2026, _proba\sonda_lab.json: Wikipedia RO „Trăiește pe banchizele imense plutitoare
   ale Antarctidei”; Bing „pinguin imperial hrana” dă site-uri cu text; Commons „Aptenodytes forsteri” dă fotografii).
   Calculatorul rămâne cum era: file noi închise cu ×; folderul elevului pus la sfârșit în Coș, Coșul NEgolit (V/10-V/15). */
const LAB=[
  'Lecția rămâne în fila ei: lucrezi în file noi și le închizi la sfârșit cu <b>×</b>. În caiet scrie titlul <b>Pinguinul imperial</b> și rândurile <b>1. Unde trăiește:</b> și <b>2. Fotografia:</b>, cu loc pentru sursă sub fiecare. Nu apeși pe reclame și pe ferestre care te sperie ori îți promit ceva. Apare ceva ciudat? Închizi fila cu <b>×</b> și spui unui adult.'+INTOARCERE,
  'Explorer (dosarul galben), <b>Documente</b>: ai folderul tău (<b>Ex</b>, numele și prenumele, de la lecția 10)? Dacă nu, fă-l: <b>Nou</b>, apoi <b>Folder</b> (pe Windows 10: <b>Pornire</b>, apoi <b>Folder nou</b>), scrii <b>Ex</b>, numele și prenumele, <kbd>Enter</kbd>. Micșorează Explorer cu liniuța.',
  'Filă nouă (<b>+</b>). Caută <code>pinguin imperial</code> și apasă <kbd>Enter</kbd>. '+COOKIE_SCURT+' Deschide rezultatul <b>Wikipedia</b>, de obicei primul. Nu-l vezi? Filă nouă, <code>ro.wikipedia.org</code>, <kbd>Enter</kbd>; sus, în caseta <b>Căutare în Wikipedia</b>, scrie <code>pinguin imperial</code> și apasă <kbd>Enter</kbd>. În primul paragraf afli unde trăiește pinguinul imperial: scrie la <b>1.</b> Dedesubt, sursa: titlul (de pe filă), adresa (din bara de adrese), <b>autori: voluntarii Wikipedia</b> și data de jos de tot („Ultima editare…”).',
  'Filă nouă (<b>+</b>), <code>commons.wikimedia.org</code>, <kbd>Enter</kbd>. Caută numele științific, <code>Aptenodytes forsteri</code>, ca pe al lupului la lecția 15. Dă clic pe o fotografie cu un pinguin viu (nu un ou, nu un desen, nu un pinguin împăiat). În dreapta apar autorul (lângă omuleț) și licența: scrie-le la <b>2.</b> Apoi <i>More Details</i>, jos în panou (nu-l vezi? pune mouse-ul pe fotografia mare din dreapta și învârte spre tine rotița). Pe pagina fotografiei: clic dreapta pe ea, <b>Salvați imaginea ca</b>, <b>Documente</b>, dublu-clic pe folderul tău, te uiți sus, <b>Salvare</b>. Dacă Windows întreabă „… există deja. Îl înlocuiți?”: <b>Nu</b>, apoi adaugă o cifră la nume.',
  'Scrie în caiet de ce ai ales aceste surse, într-o propoziție: „Am ales … pentru că …” (cine a scris, când, de unde știe; la fotografie, licența). <b>Dacă mai ai timp</b>, rândul <b>3. Ce mănâncă:</b> caută <code>pinguin imperial hrana</code>, sari peste <b>Sponsorizat</b>, deschide un rezultat cu text de pe alt site și scrie ce mănâncă, cu sursa. <details class="verif"><summary>Verifică-te, după ce ai scris</summary>La 1.: pe banchizele (gheața) din jurul Antarctidei; sursa are titlul, adresa, autorii și data. La 2.: fotografia e în folderul tău, iar în caiet ai autorul și licența ei. Explicația spune ce ai ales și de ce: cine a scris, când, de unde știe; la fotografie, licența liberă. La 3., dacă ai ajuns: ce spune pagina ta (de obicei pești și raci mici), cu sursa.</details>',
  'Lasă calculatorul cum l-ai găsit. Închide filele tale din browser cu <b>×</b>; fila lecției rămâne. În Explorer, <b>Descărcări</b>: a rămas acolo o fotografie salvată de tine azi? Mut-o în folderul tău (Decupare, apoi Lipire). Apoi <b>Documente</b>, un clic pe folderul tău și <kbd>Delete</kbd>: ajunge în Coș. <b>Nu goli Coșul</b>: acolo pot fi fișierele colegilor. Închide Explorer cu X.'
];

/* lumea simulată: browserul lecției 17 (eval-internet-v.js) și browserul cu salvare al lecției 15 */
const L17=EvalInternetV.L17, LIB='www.imagini-libere-exemplu.ro', A_URS='www.natura-exemplu.ro/ursul-brun';
/* formele răspunsurilor scrise (reparația J1, 24.10.2026; eval-internet-v.js v2, `forme`): textul e normalizat (litere mici,
   fără diacritice, orice semn = spațiu, câte un spațiu la capete). Toate grupurile `toate` + nimic din `fara`.
   Proba: _proba/proba_reparatii.py, 20+ forme bune și 20+ greșite la fiecare (niciun răspuns fals primit).
   Reparația 2 (24.10.2026, judecata 2: Q, R, T + formele „discutabile” ale judecătorului): interzis e doar ce spune ALTCEVA
   decât pagina (iese / pleacă fără primăvară; un alt PRENUME lângă „Stan”), nu orice cuvânt în plus. Proba: listele
   autorilor și ale judecătorului (_verificare/j2_forme.py, j2_propuse.py) + 20 de răspunsuri noi bune și 20 greșite la B1
   și A1, scrise ca un copil (fără diacritice, greșeli mici de tastare, ordinea schimbată, propoziție întreagă).
   Reparația 3 (24.10.2026, judecata 3: W, X): B1 NU mai are formă liberă. A treia rundă la rând, lista lui B1 fie primea
   răspunsuri opuse paginii („doarme toata vara”), fie respingea răspunsuri corecte scrise firesc („Iarna doarme, vara caută
   hrană.”); o notă reală nu poate depinde de o listă care nu se termină. B1 = căutarea, ca înainte, + ALEGEREA dintre 4
   variante (B1_O, mai jos; eval-internet-v.js v4, `alege`), ca A2 și ca la VI/16. C2, A1, B2, C3 rămân pe forme (J3: 0 scăpări). */
const NUL='(?<!\\bnu )(?<!\\bnu in )(?<!\\bnu pe )(?<!\\bnu la )(?<!\\bnu prin )';   /* „nu” chiar înainte, cu sau fără prepoziție */
/* prenumele care NU sunt ale autoarei paginii muzeului (dr. Ioana Stan); la C3 fotograful e Ion Stan */
const PREN=['ion','ioan','maria','ana','dan','elena','mihai','andrei','george','gheorghe','vasile','victor','alexandru','cristina',
  'mihaela','adrian','stefan','daniel','radu','matei','eva','andra'];
const PRENUME=PREN.join('|'), PRENUME_C3=PREN.filter(x=>x!=='ion'&&x!=='ioan').concat(['ioana']).join('|');
const FORME={
  /* C2: unde trăiește ursul brun („în pădurile de munte”, pagina enciclopediei); „zona montană”, „Carpați” = tot munții (T);
     pădurea amazoniană / a Australiei și gheața = alte locuri */
  c2:{toate:[['\\bpadur','\\bmunt','\\bcodr','\\bmontan','\\bcarpat']],
      fara:['\\bnu (traieste |sta )?(in |la |pe |prin )?(zona |muntii |padurile )?(padur|munt|codr|montan|carpat)','tropical','\\bjungl','\\bdesert','\\bafrica','\\bla mare\\b','\\bin mare\\b','\\bocean','\\bpol(ul)? ','\\bsavan','\\bantarct','\\bzoo\\b','\\bcampi','\\boras',
            '\\bamazon','\\baustrali',NUL+'\\bgheat']},
  /* B1: fără formă liberă de la reparația 3 — e ALEGERE (B1_O, mai jos) */
  /* B2: autorul și data paginii (Ion Vasilescu, 04.02.2026), în orice formă obișnuită a datei (și 4.II.2026, „februarie anul 2026”) */
  b2:{toate:[['\\bvasilescu\\b'],['\\b0?4 0?2 (20)?26\\b','\\b0?4 feb[a-z]* (anul )?(20)?26\\b','\\b0?4 ii (anul )?(20)?26\\b','\\b2026 0?2 0?4\\b']]},
  /* A1: autorul și data paginii alese (testul „fisa” al lecției 16 caută doar numele de familie și data). R: interzis e doar
     un ALT PRENUME lângă „Stan” („Ion Stan”, fotograful de la C3, nu e dr. Ioana Stan); „în”, „la”, „cu data”, „dr. I.”,
     „cercetătoare” sunt voie */
  a1:{fara:['\\b('+PRENUME+') stan\\b','\\bstan ('+PRENUME+')\\b']},
  /* C3: autorul și licența fotografiei (Ion Stan, CC BY-SA 4.0 = Atribuire-Partajare în condiții identice); alt prenume lângă
     „Stan”, NC sau ND = alt autor, altă licență */
  c3:{toate:[['\\bstan\\b'],['\\bby ?sa(?![a-z])','\\bcc ?by ?sa(?![a-z])','\\batribuire (si )?partajare','\\bpartajare in conditii identice','\\battribution (si )?share ?alike','\\bshare ?alike']],
      fara:['\\bby nc\\b','\\bnc sa\\b','\\bnc\\b','\\bnd\\b','\\btoate drepturile','\\bcc0\\b','\\bdomeniu public',
            '\\b('+PRENUME_C3+') stan\\b','\\bstan ('+PRENUME_C3+')\\b']}
};
/* B1 (reparația 3): ce spune pagina despre ursul brun iarna — una adevărată, cu cuvintele paginii muzeului („Iarna, ursul
   brun doarme în bârlog … Se trezește primăvara.”; parcul: „până primăvara … dorm în bârloguri”), trei plauzibile, false:
   anotimpul pe dos, plecarea la cald (ce scrie forumul fără autor: „pleaca iarna la cald, ca berzele”), vânatul toată iarna.
   Varianta aleasă devine răspunsul browserului (S.rasp); testul `raspuns` cere textul variantei bune. */
const B1_O=['Iarna doarme în bârlog și se trezește primăvara.','Vara doarme în bârlog și se trezește iarna.',
  'Pleacă iarna în țările calde, ca berzele.','Stă treaz toată iarna și vânează prin pădure.'];
const B1_MOTIVE=['Așa scrie pagina muzeului: „Iarna, ursul brun doarme în bârlog … Se trezește primăvara.” Pagina parcului spune la fel.',

 atelier:{t:'probaclasa',proba:'C1',titlu:'Atelier: proba de antrenament',
  intro:`<p><b>Întâi spune cine ești</b> în caseta de jos, apoi începe. Dacă te înscrii la mijlocul probei sau reîncarci pagina, pagina pornește din nou și proba începe de la capăt.</p>
<p><strong>Proba de antrenament</strong>, ca la lucrare (nu e lucrarea adevărată): C1-C3 (40 de puncte), B1-B2 (30), A1-A2 (20), plus 10 din oficiu.</p>

  q:`<b>Partea C · C1 (8 puncte): serviciile.</b> Ce serviciu al Internetului folosește fiecare copil? Pune-ți întrebările din lecția 13, în ordine: se joacă cu alții, prin Internet? privește un film sau ascultă muzică, acum, prin Internet? vorbește sau se vede pe loc cu cineva, în scris sau pe video? trimite o scrisoare la o adresă cu @? citește pagini despre ceva, pe un site?`,
  cats:['Joc online','Streaming','Mesagerie','Poștă electronică','Web'],puncteRand:2,

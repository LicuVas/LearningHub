<script>
/* Lecția 34, clasa a V-a (M5, consolidare, mini-proiect): „Construiesc un joc digital simplu (mini-proiect, individual sau în echipă)”.
   Legea: _campaign\revizuire_completa_2026_09\00_GHID_LECTII.md. Sursele și probele: surse.md, _proba\.
   Aplicația = Scratch 3, editorul online, în română, fără cont (V/31-33). Jocurile sunt PROBATE în editorul viu (Chromium headless, profil temporar, fără cont, 09.11.2026):
   _proba\live_jocuri.py → live_jocuri.json (3 jocuri jucate), _proba\live_lab34.py → live_lab34.json (construit cu blocuri trase, jucat, salvat, reîncărcat).
   Simulatorul: lectii/_sim/scratch.js, scratch-conditie.js, scratch-interfata.js, scratch-evenimente.js, doar FOLOSITE (tipul `eveniment`).
   Decizia lecției (motivul în surse.md): jocul merge pe APĂSĂRI: pe pisică = un pas; steagul = o întoarcere. Fără repetiție, variabile, scor, tastă. Nu predă nimic nou (S71).
   Granița: NU nota (V/35), NU recapitularea (V/36). Lecția rămâne cu fișierul jocului: NU se șterge. */
SimScratchEvenimente.stil();
const fig = (f, w, h, alt, cap, cls) => `<figure class="captura${cls ? ' ' + cls : ''}"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const ACUM = (...p) => `<div class="acum" role="note"><div class="lbl">Acum în Scratch, la jocul tău</div><ol>${p.map(x => `<li>${x}</li>`).join('')}</ol><p style="margin:.3em 0 0"><b>Pe telefon sau dacă nu merge:</b> sari peste; lucrezi în pagină.</p></div>`;
const ACUM_S = (...p) => ACUM(...p).replace(/<\/div>$/, '<p style="margin:.3em 0 0"><b>La calculator, merge?</b> Exercițiul de mai jos e doar dacă mai ai timp: apasă <b>Pasul următor</b>.</p></div>');
const STIVA = (b, cap) => `<div class="ss ss-static" role="img" aria-label="Blocuri Scratch: ${b.map(x => SimScratch.text(x)).join(', ')}">${cap ? `<p class="ss-cap">${cap}</p>` : ''}<div class="ss-script" style="position:relative">${b.map(x => SimScratch.html(x)).join('')}</div></div>`;
const deseneazaStive = () => document.querySelectorAll('.ss-static:not([data-d])').forEach(e => { if (!e.offsetWidth) return; e.dataset.d = '1'; SimScratch.deseneaza(e); });
new MutationObserver(deseneazaStive).observe(document.documentElement, {childList: true, subtree: true});
window.addEventListener('lh-pas', () => setTimeout(deseneazaStive, 0));

const A = SimScratch.ajutor, E = SimScratchEvenimente;
const NOTA = 'În pagină sunt doar blocurile de azi, iar pisica e desenată mai simplu. Mingea o poți trage; în Scratch, după ce o tragi, zona de cod arată programul ei (apeși Sprite1, sub scenă). Aici, mingea poate acoperi balonul cu mesajul: trage-o într-o parte. Bolovanul e doar în Scratch-ul adevărat.';
const m = n => ['mergi', n], M0 = ['mergi_la_xy', 0, 0];
const MARG = ['atinge_ob', 'marginea'], MING = ['atinge_ob', 'Minge'];
const DACA = (c, ...g) => ['daca', Object.assign(c ? {s: {0: c}} : {}, {guri: [g]})];
const SP = t => ['spune_sec', t, 2];
/* programul de la apăsare stă sus (el crește); steagul, dedesubt, cât să nu se atingă */
const STEAG = (b, y) => ({x: 14, y: y || 420, b: [['steag'], b || ['roteste_dr', 90]]});
const JOS = 560;   /* atelierul și Î5: două reguli sus; 420 lăsa pălăria lipită de al doilea „dacă” (proba I din _proba/proba_r1.py) */
const CLIC = (...b) => ({x: 14, y: 14, b: [['cand_personaj']].concat(b)});
const LINK = '<a class="descarca" href="pornire-34.sb3" download="pornire-34.sb3">Descarcă proiectul de pornire</a>';
const LEPAD = ['steag', 'cand_personaj', 'mergi', 'roteste_dr', 'roteste_st'];
const PAL = ['mergi', 'mergi_la_xy', 'spune_sec', 'daca', 'atinge_ob'];

/* ---- jocul, fără ecran: testele judecă ce face programul la apăsări și la steag, nu blocurile (regula 29) ---- */
const laSteag = (P, p) => { const U = SimScratch.urma((P || []).filter(sc => sc.b[0] && sc.b[0][0] === 'steag'), p); return {x: U.x, y: U.y, directie: U.directie}; };
/* caută un drum de câștig: apăsări pe pisică și steaguri, de la start. Întoarce {castig: 'aafa', dupa: {x, y, spuse}} sau {castig: null}. */
const PLAFON = 6000;   /* măsurat: _proba/proba_r1.py, punctul M (cel mai rău caz, la procesor ×4); la plafon, mesajul nu spune „nu se poate”, ci „n-a găsit” */
let memoC = null;
function cauta(P, minge) {
  const cheie = JSON.stringify([P, minge]);
  if (memoC && memoC.k === cheie) return memoC.v;
  const vazut = new Set(), coada = [[{x: 0, y: 0, directie: 90}, '']];
  let n = 0, i = 0, v = {castig: null};
  while (i < coada.length && n < PLAFON) {
    const [p, d] = coada[i++];
    const k = Math.round(p.x) + '|' + Math.round(p.y) + '|' + Math.round(p.directie);
    if (vazut.has(k)) continue;
    vazut.add(k); n++;
    const s = E.serie(P, 1, {x: p.x, y: p.y, directie: p.directie, minge})[0];
    if (s.spuse.length) {
      /* mesajul trebuie să vină de la minge: fără minge, de pe același loc, nu e același */
      const s0 = E.serie(P, 1, {x: p.x, y: p.y, directie: p.directie, minge: null})[0];
      if (s0.spuse.length !== s.spuse.length || s0.spuse.join('|') !== s.spuse.join('|')) { v = {castig: d + 'a', dupa: s, inainte: p}; break; }
    }
    coada.push([{x: s.x, y: s.y, directie: s.directie}, d + 'a']);
    coada.push([laSteag(P, p), d + 'f']);
  }
  memoC = {k: cheie, v};
  return v;
}
const LIPIT = {ce: 'Niciun bloc nu e lăsat deoparte', msg: 'Un bloc stă deoparte, nelipit: nicio apăsare nu-l pornește. Lipește-l unde trebuie sau trage-l în paletă.', ok: (U, P) => A.libere(P).length === 0};
const MERGE = {ce: 'La apăsare, pisica merge', msg: 'La prima apăsare, pisica rămâne la x 0. Verifică: „mergi” stă sub „când se dă click pe acest personaj”; „mergi la” stă în gura lui „dacă”, nu sub el.', ok: (U, P) => { const s = E.serie(P, 1, {minge: null})[0]; return s.x !== 0 || s.y !== 0; }};
const INTOARCE = {ce: 'Steagul o întoarce', msg: 'Steagul nu întoarce pisica. Sub „când se dă click pe ⚑” trebuie să stea „rotește-te”, cu 90.', ok: (U, P) => { const f = laSteag(P, {x: 0, y: 0, directie: 90}); return f.directie !== 90 && f.x === 0 && f.y === 0; }};
const TACE = {ce: 'Departe de minge, pisica nu vorbește', msg: 'Pisica vorbește și departe de minge. „spune” trebuie să stea în gura lui „dacă”, nu sub el.', ok: (U, P) => E.serie(P, 1, {minge: null})[0].spuse.length === 0};
const CASTIG = {ce: 'Se poate câștiga: la minge, pisica spune ceva', msg: 'Pagina n-a găsit niciun drum până la un mesaj lângă minge. Sub „mergi”: „dacă”, cu „atinge Minge?” în locaș și „spune …”, cu cuvintele tale, în gură. O ai deja? Stă în gura altui „dacă”? Trage-o afară, sub „mergi”. Mingea e chiar în colț? Trage-o puțin spre mijloc. Altfel, scrie 50 la „mergi”.', ok: (U, P, S) => !!cauta(P, S.minge).castig};
const MESAJ = {ce: 'Mesajul are cuvinte', msg: 'Balonul pisicii e gol. La „spune”, apasă pe câmp și scrie cuvintele tale.', ok: (U, P, S) => { const r = cauta(P, S.minge); return !!r.castig && r.dupa.spuse.some(t => String(t).trim() !== ''); }};
const START = {ce: 'După ce vorbește, pisica sare la start', msg: 'După mesaj, pisica nu ajunge la x 0, y 0. În gură, sub „spune”, pune „mergi la x … y: …” și scrie 0 și 0. Îl ai deja, cu 0 și 0? Atunci „dacă” stă deasupra lui „mergi”: trage „mergi” deasupra lui „dacă”.', ok: (U, P, S) => { const r = cauta(P, S.minge); return !!r.castig && r.dupa.x === 0 && r.dupa.y === 0; }};
/* rezultatul, nu textul: pasul de câștig, rejucat cu „spune” înlocuit de un salt la 77, 77; dacă pisica rămâne la 77, 77, saltul la start s-a făcut înainte de mesaj */
const ORDINE = {ce: 'Întâi vorbește, apoi sare la start', msg: 'Pisica nu face, în aceeași gură, întâi „spune”, apoi „mergi la”. În gura regulii de câștig, „spune” stă chiar sub rândul lui „dacă”, iar „mergi la” sub „spune”: trage-le acolo.', ok: (U, P, S) => { const r = cauta(P, S.minge); if (!r.castig) return false; const Pm = JSON.parse(JSON.stringify(P), (k, v) => (Array.isArray(v) && (v[0] === 'spune_sec' || v[0] === 'spune') ? ['mergi_la_xy', 77, 77] : v)); const s = E.serie(Pm, 1, {x: r.inainte.x, y: r.inainte.y, directie: r.inainte.directie, minge: S.minge})[0]; return !(s.x === 77 && s.y === 77); }};
/* mingea mutată în mijlocul scenei: regula de câștig închisă în gura altei reguli nu mai poate da câștig */
const MIJLOC = {ce: 'Se câștigă și cu mingea în mijlocul scenei', msg: 'Se câștigă doar lângă margine: cele două reguli stau una în gura celeilalte. Trage-o pe cea din gură afară și las-o sub „mergi”.', ok: (U, P, S) => !!cauta(P, S.minge).castig && !!cauta(P, {x: 100, y: 0}).castig};
const MARGINE = {ce: 'La margine, pisica sare la start', msg: 'Pisica nu sare la start când atinge marginea. Sub primul „dacă” (nu în gura lui), alt „dacă”, cu „atinge marginea?” în locaș și „mergi la” cu 0 și 0 în gură.', ok: (U, P) => { const s = E.serie(P, 60, {minge: null}); return s.some((p, k) => k > 0 && p.x === 0 && p.y === 0 && (s[k - 1].x !== 0 || s[k - 1].y !== 0)); }};
const APASAT = n => ({ce: `Ai apăsat pe pisică de cel puțin ${n} ori, după ultima schimbare`, msg: `Apasă pe pisică, pe scenă (pe telefon, atinge-o), de ${n} ori. Dacă schimbi programul, numărătoarea începe din nou.`, ok: (U, P, S) => S.clicuri >= n});

const AP_STEAG = {ce: 'Ai apăsat și steagul, după ultima schimbare', msg: 'Apasă pe pisică, apoi steagul, apoi iar pe pisică. Dacă schimbi programul, steagul se apasă din nou.', ok: (U, P, S) => !!S.apasatSteag};
/* tipul de la etapa 3: la fel ca `eveniment`, iar rezolvarea automată apasă și steagul (testul AP_STEAG) */
const tipSteag = {
  render: (Q, body, api) => E.tipuri.eveniment.render(Q, body, api),
  gresit: (Q, body) => E.tipuri.eveniment.gresit(Q, body),
  rezolva(Q, body) { E.tipuri.eveniment.rezolva(Q, body); body._ss.steag(); body._ss.opreste(); }
};

/* tipul din etapa 2: mingea se pune trăgând-o; rezolvarea automată o trage cu evenimente de indicator (tipul `eveniment` e nemodificat) */
const tipLoc = {
  render: (Q, body, api) => E.tipuri.eveniment.render(Q, body, api),
  gresit: (Q, body) => E.tipuri.eveniment.gresit(Q, body),
  rezolva(Q, body) {
    E.tipuri.eveniment.rezolva(Q, body);
    const el = body.querySelector('.sse-minge'), sc = body.querySelector('.ss-scena');
    if (!el || !sc || !Q.locBun) return;
    const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect();
    const o = {pointerId: 7, bubbles: true, pointerType: 'mouse', button: 0};
    el.dispatchEvent(new PointerEvent('pointerdown', Object.assign({clientX: r.left + r.width / 2, clientY: r.top + r.height / 2}, o)));
    const c = {clientX: s.left + (Q.locBun.x + 240) / 480 * s.width, clientY: s.top + (180 - Q.locBun.y) / 360 * s.height};
    el.dispatchEvent(new PointerEvent('pointermove', Object.assign(c, o)));
    el.dispatchEvent(new PointerEvent('pointerup', Object.assign(c, o)));
  }
};

/* ---- grila profesorului: Info_Gimnaziu_2026\instrumente\Grila_produs.md, întocmai (fără antetul fișei și nota de subsol, ca la V/22; proba: _proba\proba_grila.py) ---- */
const GRILA = `<details class="verif mai-ai-timp"><summary>Dacă mai ai timp: grila profesorului (cu ea se notează jocul)</summary>
<p>La fiecare criteriu se dau <b>0 – 18 puncte</b>. Reperele: <b>De bază = 10 p</b>, <b>Consolidat = 14 p</b>, <b>Avansat = 18 p</b>; se poate da și între repere, iar 0 dacă lipsește cu totul. Punctajul = criteriile 1-5 + 10 din oficiu (cel mult 100). <b>Nota = punctaj : 10</b> (rotunjită la cel mai apropiat întreg; la ,5 în favoarea elevului). Exemplu: 14 + 18 + 14 + 10 + 14 + 10 = 80 → nota 8.</p>
${[
 ['Respectarea cerinței', 'conține elementele cerute, cu ajutor', 'conține tot ce s-a cerut, fără ajutor', 'depășește cerința cu elemente potrivite, alese motivat'],
 ['Corectitudinea tehnică', 'operațiile de bază, cu îndrumare', 'operațiile cerute, corect, singur', 'operații diverse, alese potrivit situației'],
 ['Organizarea', 'structură dată de profesor', 'structură proprie, clară', 'organizare gândită pentru scopul și publicul produsului'],
 ['Explicația (ce am făcut și de ce)', 'răspunde la întrebări', 'explică pașii', 'justifică alegerile și propune alternative'],
 ['Munca proprie / sursele', 'folosește materialele date', 'citează sursele imaginilor/textelor', 'respectă drepturile de autor și explică de ce contează']
].map((r, i) => `<p class="grila-c"><b>${i + 1}. ${r[0]}</b><br>De bază (cu sprijin, model) · 10 p: ${r[1]}<br>Consolidat (independent) · 14 p: ${r[2]}<br>Avansat (context nou, justificat) · 18 p: ${r[3]}</p>`).join('\n')}
<p>Cuvinte din grilă: <b>din oficiu</b> = puncte pe care le primește oricine; <b>alternative</b> = alte variante, alte idei; <b>justifică</b> = spune de ce a ales așa.</p>
<p>Azi doar o citești, ca să știi ce contează. Pagina nu-ți dă notă: bifele sunt doar pentru tine.</p></details>`;

/* ---- „Acum în Scratch, la calculator” (laboratorul, după atelier): FĂRĂ profesor, pe calculatorul comun; fără cont. Casetele construiesc jocul; laboratorul verifică, salvează, păstrează (S80, S81).
   Drumul literal, probat în editorul viu: _proba/live_lab34.py → live_lab34.json. Explorer: cuvintele lecțiilor 9-11. */
const LAB = [
  `<b>Jocul tău, în Scratch.</b> Ai fila deschisă, de la casete? Rămâi în ea. Nu? ${LINK} Apoi, ca la pasul <i>Etapa 2: personajele și scena</i> (pasul 3 din 6): o filă nouă cu Scratch, <b>Fișier</b> › <b>Load from your computer</b>. Nu se deschide sau nu merge internetul? Jos, sub puncte, apasă <b>← Înapoi la atelier</b>, joacă-te acolo și spune-i profesorului.`,
  '<b>Scena.</b> Ai ales un decor și ai mutat mingea și bolovanul? Treci mai departe. Nu? Fă-le ca la pasul <i>Etapa 2: personajele și scena</i> (pasul 3 din 6).',
  '<b>Mișcarea.</b> În zona de cod a pisicii sunt două programe: la apăsare, „mergi”; la steag, „rotește-te ↻ 90 grade”? Treci mai departe. Nu? Fă-le ca la pasul <i>Etapa 3: mișcarea</i> (pasul 4 din 6).',
  '<b>Câștigul.</b> Sub „mergi”, unul sub altul: „dacă atinge Minge?”, cu mesajul tău și „mergi la x 0 y: 0” în gură; „dacă atinge Bolovan?”, cu „mergi la x 0 y: 0” în gură? Nu? Fă-le ca la pasul <i>Etapa 4: condiția de câștig</i> (pasul 5 din 6). Nu mai ai timp de amândouă? Întâi Minge.',
  '<b>Testează</b> cu fișa de la pasul <i>Etapa 5: testarea</i> (pasul 6 din 6): dă-i locul unui coleg sau, dacă n-ai cu cine, parcurge singur lista.',
  '<b>Nu iese?</b> Pisica nu pleacă deloc? Uită-te la trei locuri. „mergi” a intrat în gura lui „dacă”? Un „dacă” gol, lăsat prea sus, înghite ce e sub el. Un bloc tras ia cu el și blocurile de sub el. Sub „mergi”, în gură, stă „spune” (cu „mergi la” sau fără)? Trage-le întâi într-un loc gol din zona de cod: le apuci de „spune”. Apoi trage „mergi” afară, deasupra lui „dacă”, și „spune” înapoi în gură, sub rândul lui „dacă”. „mergi la” stă sub „dacă”, nu în gură? Trage-l în gură, sub „spune”. Condiția stă în cerculețul lui „mergi”, în locul numărului? Trage-o în locaș.',
  '<b>Pisica pleacă, dar nu iese?</b> Nu spune nimic la minge? Citește locașul: ▾ <b>Minge</b>? Spune la fiecare apăsare? „spune” a rămas sub „dacă”: trage-l în gură. Sare înapoi la primul pas? Bolovanul e prea aproape: trage-l mai departe (apoi apasă <b>Sprite1</b>). Abia se mișcă, x crește cu 1? Condiția a căzut în cerculețul lui „mergi”: trage-o în locaș. Sare în alt loc, nu în mijloc? Scrie 0 și 0 în „mergi la”.',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> sub a doua regulă, una pentru <b>marginea</b>; în gurile cu „mergi la”, și „orientează-te în direcția 90”, ca jocul să înceapă mereu la fel.</span>',
  '<b>Salvează (chiar dacă n-ai terminat):</b> <b>Fișier</b> › <b>Salvează pe calculatorul tău</b>. Browserul întreabă unde? <b>Descărcări</b>, numele jocului (clasa ta, liniuță, prenumele, liniuță, <code>joc</code>, ca <code>5A-Ana-joc</code>; în echipă, ambele prenume), <b>Salvare</b>. Nu întreabă? Explorer › <b>Descărcări</b> › <b>pornire-34</b> cu ora de acum (poate are o cifră în paranteză): <kbd>F2</kbd>, numele, <kbd>Enter</kbd>. Scrie că există deja? <b>Nu</b> (sau <b>Anulare</b>) și adaugi o cifră la sfârșitul numelui. N-ai Scratch deschis cu jocul tău? N-ai ce salva: treci la punctul <b>În caiet</b>, scrii ce ai apucat și îi spui profesorului.',
  '<b>Păstrează-l: azi NU îl ștergi, îți trebuie la lecția 35.</b> Explorer › <b>Descărcări</b>, clic pe jocul tău, <b>Decupare</b>; în stânga, <b>Documente</b>; <b>Lipire</b>. Apare <b>Înlocuire sau omitere fișiere</b>? <b>Se omite acest fișier</b>, apoi îl redenumești cu o cifră la sfârșit și îl muți iar. Calculatorul e comun: fișierul poate dispărea (îl poate șterge cineva din greșeală). Ai un stick la tine? Pune și acolo o copie (<b>Copiere</b>, <b>Lipire</b>).',
  '<b>În caiet (fișa jocului):</b> numele fișierului, calculatorul la care ai lucrat (numărul scris pe el sau rândul și locul) și programele, pe scurt, în cuvinte. Dacă fișierul dispare, refaci jocul după fișă. Lucrați în echipă? Fiecare își scrie fișa.',
  '<b>Pregătește prezentarea:</b> în caiet, 2 rânduri: cum se joacă și ce face o regulă a ta. O spui când îți cere profesorul; dacă nu ți se cere azi, o păstrezi pentru lecția 35.',
  '<b>La sfârșitul orei (chiar dacă n-ai terminat):</b> n-ai salvat? Punctul <b>Salvează</b>. Închide fila Scratch cu <b>×</b>, doar pe ea: lecția rămâne deschisă. Browserul întreabă dacă pleci? Pleci. În <b>Descărcări</b> ștergi doar <b>pornire-34</b> descărcat de tine, cu ora de azi: clic, <kbd>Delete</kbd>. <b>Jocul tău din Documente rămâne.</b> Fișierele colegilor nu le atingi. Nu goli Coșul.'
];

  lectii: '34',
  ancoraText: 'Programa (OMEN 3393/2017), clasa a V-a · unitatea V-U6 „Din algoritm în joc: mediul grafic interactiv (Scratch)” · lecția 34, consolidare (mini-proiect) · CS.3.3 „Manifestarea creativă prin utilizarea unor aplicații simple de construire a unor jocuri digitale”, cu CS.3.2. Activitatea profesorului: mini-proiect pe etape anunțate: ideea și regula jocului pe hârtie, personajele și scena, mișcarea, condiția de câștig, testarea de către un coleg; fiecare echipă își prezintă jocul.',
  intro: '<p><b>Ai nevoie de:</b> lecția 31 (Scratch: paleta, zona de cod, scena, steagul, decorul; „spune”; salvezi proiectul); lecția 32 (mergi, rotește-te, schimbi numărul, „mergi la x 0 y: 0”); lecția 33 (apăsarea pe personaj, „dacă … atunci”, „atinge … ?”, proiectul de pornire). Pentru fișier: Explorer (lecțiile 9-11). Azi nu înveți nimic nou: folosești ce știi, la un joc al tău.</p>',
  cum: '<b>Cum lucrezi</b> (mini-proiect = o lucrare mică a ta, de la idee la produs; singur sau în echipă, cum spune profesorul; dacă nu spune nimic, singur)<ol><li>Primul pas îl citești. Apoi 5 etape, cu minutele lor: ideea, pe hârtie (5) · personajele și scena (6) · mișcarea (6) · câștigul (8) · testarea (5). În bara de jos, Etapa 1 e P2, Etapa 2 e P3 și tot așa. La calculator lucrezi la jocul tău, în Scratch-ul adevărat, după caseta fiecărei etape; la etapele 3 și 4, exercițiul din pagină e doar dacă mai ai timp. Pe telefon, rămâi în pagină.</li><li>Atelierul: termini un joc mic în pagină. Pe telefon, acesta e jocul tău. La calculator, cu casetele făcute, e doar dacă mai ai timp.</li><li>La calculator (11): verifici jocul, îl salvezi și <b>îl păstrezi</b> pentru lecția 35.</li><li>5 întrebări (5).</li></ol><p><b>Când mai sunt 10 minute din oră:</b> te oprești unde ai ajuns. <b>La calculator:</b> apeși <b>Pasul următor</b> până la atelier (ultimul se cheamă <b>La atelier</b>), apoi <b>Acum în Scratch, la jocul tău</b>; faci punctele de la <b>Salvează</b> până la capăt, fără prezentare (un joc neterminat se salvează la fel), apoi <b>La verificare</b>. N-ai Scratch deschis? N-ai ce salva: punctul <b>În caiet</b>, cu ce ai apucat, și îi spui profesorului. <b>Pe telefon:</b> scrii fișa jocului în caiet și apeși aceleași butoane, până la întrebări. Dacă a rămas neterminat, îl termini cât mai simplu la începutul lecției 35, dacă profesorul nu vă spune altfel.</p>',
  banda: '<span class="bk as">ideea</span><span class="bk dt">scena</span><span class="bk mv">mișcarea</span><span class="bk ct">câștigul</span><span class="bk ev">testul</span>',
  nivele: [
{t: 'Construiesc un joc digital simplu (mini-proiect, individual sau în echipă)', final: true, lectii: [34],
 continuturi: ['Modalități de reprezentare a structurilor secvențiale și alternative prin blocuri grafice'],
 obiectiv: 'construiești, pe etape, un joc al tău în Scratch, cu blocurile pe care le știi, îl dai la testat și îl păstrezi pentru lecția 35.',
 pasi: [
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t: 'La ce folosește: un joc are reguli',
   text: `<p>Șotronul n-are ecran, dar are ce are orice joc: un <b>scop</b> (ajungi la capăt), <b>reguli</b> (nu calci pe linie) și un semn clar când ai câștigat. Fără reguli știute, nimeni nu se poate juca.</p>
<p>Azi faci un joc al tău, în Scratch, cu blocurile pe care le știi deja. Îl faci pe etape: întâi ideea, apoi construcția, la sfârșit îl încearcă altcineva.</p>
${fig('sotron.webp', 420, 520, 'Un șotron pictat pe asfalt: pătrate colorate, cu numere de la 1 la 13', 'Un șotron, pe asfalt. <small>Foto: Gwasheya, <a href="https://commons.wikimedia.org/wiki/File:Hopscotch_game.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC0; decupată și micșorată.</small>', 'mica')}`},
  /* ---- etapa 1: ideea și regula, pe hârtie ---- */
  {t: 'Etapa 1: ideea și regula, pe hârtie',
   text: `<p><b>Cam 5 minute.</b> Un joc are patru lucruri. Le scrii în caiet <b>înainte</b> de blocuri: <b>scopul</b> (ce vrea personajul), <b>cum te joci</b> (ce apeși), <b>când câștigi</b> și <b>când o iei de la capăt</b>.</p>
<p>Alegi doar ce poți face cu blocurile tale. Pisica nu merge singură: face un pas când o apeși, ca la lecția 33. Ca să-și poată alege drumul, îi dăm și o întoarcere, pe steag.</p>
<p>Profesorul notează jocul la lecția 35, după 5 criterii: Respectarea cerinței, Corectitudinea tehnică, Organizarea, Explicația, Munca proprie / sursele. Azi, pagina nu dă notă: bifele sunt doar pentru tine.</p>`,
   exemplu: `<div class="fisa"><p><b>Exemplu: jocul din pagină, „Spre minge” (nu e al tău).</b></p><p><b>Scopul:</b> pisica ajunge la minge.</p><p><b>Cum te joci:</b> apăs pe pisică: un pas. Apăs pe steag: se întoarce.</p><p><b>Câștigi când:</b> atinge mingea; spune „Am ajuns!”.</p><p><b>O iei de la capăt când:</b> atinge marginea.</p></div>
<div class="acum" role="note"><div class="lbl">Acum în caiet, și pe telefon</div><p style="margin:.2em 0">Scrie cele patru rânduri pentru jocul tău. <b>La calculator</b>, al tău are și un <b>bolovan</b>: dacă îl atinge, pisica o ia de la capăt. <b>Pe telefon</b>, jocul tău e cel din atelier: mingea și marginea, fără bolovan. Hotărăște: ce e mingea în povestea ta? Dar bolovanul, dacă îl ai? Ce spune pisica la câștig? Lucrați în echipă? Scrieți împreună.</p></div>`,
   altfel: `<p>E ca atunci când îi explici unui prieten un joc nou, în curte: „Trebuie să ajungi acolo. Ai voie să faci așa. Dacă atingi aia, o iei de la capăt.” Dacă nu poți spune asta în patru fraze, jocul nu e gata.</p>`,
   incearca: {t: 'choice', q: 'Care joc îl poți face azi, cu blocurile tale?',
    o: ['Pisica face un pas la fiecare apăsare, steagul o întoarce, iar când atinge mingea spune că a câștigat', 'Pisica aleargă singură pe scenă, tot timpul, iar tu o oprești când vrei să se oprească', 'Pisica merge cu săgețile de pe tastatură și, la final, afișează câte mingi a strâns', 'Mingea vine singură spre pisică, iar pisica fuge de ea până când se oprește ceasul'], ok: 0,
    why: 'Blocurile tale pornesc la o apăsare și se fac o dată. Nimic nu merge singur, tastele și numărătoarea nu le-ai învățat încă.'},
   inca: [
    {t: 'choice', q: 'În fișa unui coleg scrie: „Scopul: pisica ajunge la minge. Cum te joci: apăs pe pisică.” Ce lipsește?',
     o: ['Când câștigi și când o iei de la capăt', 'Numele fișierului și unde îl salvezi', 'Câte puncte primești la fiecare pas', 'Nimic: scopul spune deja tot jocul'], ok: 0,
     why: 'Un joc are patru lucruri: scopul, cum te joci, când câștigi, când o iei de la capăt. Lipsesc ultimele două.'}

  /* ---- etapa 2: personajele și scena ---- */
  {t: 'Etapa 2: personajele și scena',
   text: `<p><b>Cam 6 minute.</b> Proiectul de pornire are trei personaje și niciun bloc: pisica (<b>Sprite1</b>), <b>Minge</b> și <b>Bolovan</b>. Îl încarci ca la lecția 33.</p>
<p>Decorul îl alegi ca la lecția 31, cu <b>Alege un Decor</b>. Mingea și bolovanul le tragi pe scenă, unde ți se potrivește povestea, ca la lecția 33. Pisica rămâne în mijloc, la x 0, y 0: acolo e startul.</p>
<p>Bolovanul stă pe drumul spre minge, dar departe de pisică: între ei să încapă încă o pisică. Dacă o atinge de la primul pas, ea nu mai pleacă.</p>`,
   exemplu: `${fig('pornire.webp', 690, 511, 'Proiectul de pornire în Scratch: zona de cod goală; pe scenă, pisica, mingea și bolovanul; sub scenă, dalele Sprite1, Minge și Bolovan, încadrate (1)', 'Proiectul de pornire (două decupaje lipite): 1. cele trei personaje.')}
${fig('scena-exemplu.webp', 480, 541, 'O scenă din Scratch cu un decor cu cer albastru și iarbă: pisica în mijloc, bolovanul în dreapta ei, departe de ea, mingea mai sus, în dreapta', 'O scenă de exemplu: a ta arată altfel.', 'mica')}
${ACUM(`Descarcă proiectul de azi: ${LINK} Se duce în <b>Descărcări</b>.`, 'Într-o filă nouă: <code>scratch.mit.edu/projects/editor</code>, <kbd>Enter</kbd>. Meniul e în engleză? <b>Settings</b> › <b>Language</b>, derulezi până la litera R, <b>Română</b>.', '<b>Fișier</b> › <b>Load from your computer</b>. În fereastra <b>Deschidere</b>: <b>Descărcări</b>, clic pe <b>pornire-34</b> (cel cu ora de acum), <b>Deschidere</b>. Întreabă „Replace contents…?” (înlocuiești proiectul)? <b>OK</b>.', '<b>Alege un Decor</b> (butonul rotund de jos, din dreapta) și alege-l pe cel potrivit poveștii tale.', 'Trage mingea și bolovanul la locul lor. Apoi apasă <b>Sprite1</b>, sub scenă: zona de cod trebuie să arate programul pisicii, gol deocamdată. Lasă fila deschisă.')}`,

    paleta: ['steag'], nota: NOTA, minge: {nume: 'Minge', x: 170, y: 110}, locBun: {x: 130, y: -110},

     {ce: 'Mergând drept, pisica n-ar atinge mingea', msg: 'Mingea e prea sus. Trage-o mai jos, până când pisica n-ar atinge-o mergând drept.', ok: (U, P, S) => { if (!S.minge || S.minge.y > 0) return false; for (let x = 0; x <= 240; x += 10) if (E.atingeMinge({x, y: 0, directie: 90}, S.minge)) return false; return true; }},

    why: 'Așa, pisica nu ajunge la minge doar mergând drept: trebuie să se întoarcă. Jocul are ce să te pună să alegi.'},
   inca: [
    {t: 'scena', q: 'Alege un alt decor pentru scenă (panoul <b>Scenă</b>, apoi <b>Alege un Decor</b>). Apoi „Rulează testele”.',
     paleta: ['steag', 'mergi'], nota: 'În pagină sunt doar câteva decoruri; în Scratch sunt mult mai multe.', solutieDecor: 'Forest',
     program: [],

     solutie: [],

  /* ---- etapa 3: mișcarea ---- */
  {t: 'Etapa 3: mișcarea',
   text: `<p><b>Cam 6 minute.</b> Jocul are două apăsări, deci două programe, în zona de cod a pisicii:</p>
<ul><li><b>Apăs pe pisică:</b> <span class="blk ev">când se dă click pe acest personaj</span>, cu <span class="blk mv">mergi … pași</span> sub el. Fiecare apăsare, un pas.</li>
<li><b>Apăs pe steag:</b> <span class="blk ev">când se dă click pe ⚑</span>, cu <span class="blk mv">rotește-te ↻ … grade</span> sub el. Cu 90, pisica face un colț.</li></ul>
<p>Steagul pornește doar ce stă sub el. La lecția 33, acolo era startul; azi e o întoarcere. Startul vine la etapa 4. Spre stânga, pisica stă cu capul în jos: așa o rotește Scratch.</p>`,
   exemplu: `${fig('miscare.webp', 690, 478, 'Două programe în Scratch: când se dă click pe acest personaj, mergi 40 pași (1); când se dă click pe steag, rotește-te spre stânga 90 grade (2); sub scenă, x 40, y 40, încadrate, și Direcția 0, încadrată (3); pisica privește în sus', 'Altă pereche, ca exemplu (două decupaje lipite): 1. la apăsare, 40 de pași; 2. la steag, ↺ 90. După apăsare, steag, apăsare: 3. x 40, y 40, Direcția 0 (privește în sus).')}
${ACUM_S('Din <b>Evenimente</b>, „când se dă click pe acest personaj”, pe un loc gol. Sub el, din <b>Mișcare</b>, „mergi 10 pași”. Scrie numărul tău: 40, 50 sau 60 (regula paginii, ca jocul să nu dureze prea mult).', 'Din <b>Evenimente</b>, „când se dă click pe ⚑”, pe alt loc gol. Sub el, „rotește-te ↻ 15 grade”; scrie 90.', 'Apasă pe pisică, apoi steagul, apoi iar pe pisică. Citește x, y și Direcția, sub scenă. Pisica s-a mutat? E bine: la etapa 4 sare singură la start.')}`,
   altfel: `<p>E ca la o mașinuță cu telecomandă cu două butoane: unul o duce înainte, celălalt o întoarce. Cu cele două alegi orice drum.</p>`,
   incearca: {t: 'steag', q: 'Fă cele două programe pentru jocul din pagină: la apăsarea pe pisică, 50 de pași; la steag, „rotește-te ↻ 90 grade”. Trage blocurile în zona de cod (pe telefon: tragi cu degetul, întâi puțin spre dreapta, apoi unde vrei; numele blocului nu încape în paletă: la apăsarea pe pisică e al doilea bloc galben, la steag e primul). Apoi apasă pe pisică, steagul, iar pe pisică, și „Rulează testele”.',
    paleta: LEPAD, nota: NOTA, minge: {nume: 'Minge', x: 170, y: 110}, clicuri: 2,
    program: [],
    teste: [LIPIT,
     {ce: 'La fiecare apăsare: 50 de pași', msg: 'Pisica nu face 50 de pași la o apăsare. Sub „când se dă click pe acest personaj” trebuie să stea „mergi”, cu 50.', ok: (U, P) => { const s = E.serie(P, 2, {minge: null}); return s[0].x === 50 && s[1].x === 100; }},
     {ce: 'La steag: un colț, spre dreapta', msg: 'La steag, pisica nu face un colț spre dreapta. Sub „când se dă click pe ⚑” trebuie să stea „rotește-te ↻”, cu 90. Dacă ai pus „mergi” sub steag, trage-l în paletă.', ok: (U, P) => { const f = laSteag(P, {x: 0, y: 0, directie: 90}); return f.directie === 180 && f.x === 0 && f.y === 0; }},
     APASAT(2), AP_STEAG],
    solutie: [STEAG(), CLIC(m(50))],
    gresit: [{x: 14, y: 14, b: [['steag'], m(50)]}],
    ajutor: 'Din Evenimente, cele două blocuri galbene, fiecare pe un loc gol. Sub „când se dă click pe acest personaj”, „mergi”; scrie 50. Sub steag, „rotește-te ↻”; scrie 90.',
    why: 'Două evenimente, două programe. Apăsarea pe pisică o duce înainte; steagul o întoarce. Cu ele, jucătorul alege drumul.'},
   inca: [
    {t: 'eveniment', q: 'Aici, steagul o întoarce spre dreapta. Fă-l s-o întoarcă spre stânga, tot cu 90: pune „rotește-te ↺” și trage în paletă blocul vechi. Apoi „Rulează testele”.',
     paleta: LEPAD, nota: NOTA, minge: {nume: 'Minge', x: 170, y: 110},

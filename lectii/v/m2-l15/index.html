/* Lecția 15, clasa a V-a (M2): „Salvarea informațiilor de pe Internet. Drepturile de autor”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele și probele: surse.md, _proba\.
   Simulatoarele: lectii/_sim/browser-salvare.js (proprietar lecția aceasta; extinde browser-web.js al lecției 14 prin
   BrowserWeb.creeaza) și lectii/_sim/explorer-operatii.js (lecția 10, folosit prin API-ul lui, nemodificat).
   Faptele despre Edge sunt probate în Edge-ul real (română), pe desktopul ascuns, cu profil temporar și rețeaua doar spre
   un server local; fereastra Salvare ca (dialogul comun Windows) pe desktopul ascuns, într-un dosar de probă; Wikimedia Commons
   în Chromium headless, fără cont; cele juridice din forma CONSOLIDATĂ de azi a Legii nr. 8/1996 (surse.md).
   Reparată după judecata 1 (12.10.2026): P0 + 8 pași, numele fișierului ÎNTÂI, apoi folderul; o singură regulă pentru
   „Toate drepturile rezervate”; Commons cu „Canis lupus”; Notepad pe Windows 10 (registrul: _verificare\registru_j1.md).
   Reparată după judecata 2 (12.10.2026, registrul, secțiunea „Judecata 2”): citatul scurt, cu autorul și sursa, are voie și pe
   site-ul școlii (art. 35 alin. (1) lit. b) + alin. (4)); opera întreagă doar pentru tine și la tema care rămâne la școală;
   o oră de 50 de minute: Notepad rămâne deschis după pasul „Scrii sursa…”, laboratorul doar termină fișa (3 puncte), atelierul
   pornește cu propoziția și sursa deja în Notepad; trimiterile la pași după TITLU (numerele de pe ecran le pune motorul).
   Toate gesturile reale se fac într-o FILĂ NOUĂ (lecția rămâne în fila ei), iar fișierele doar în folderul elevului din
   Documente, pus la sfârșit în Coș (ca la lecția 10). */
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CAPT='<small>Captură din Edge, în română, pe o pagină de probă; chenarele sunt de la noi.</small>';
const CAPTW='<small>Captură din Windows, deschisă din Edge; chenarele sunt de la noi.</small>';
const IMG={
  fotograf:fig('fotograf-apus.webp',800,533,'Silueta unui om care fotografiază apusul cu telefonul, pe o pajiște','Și fotografia făcută cu telefonul e o operă: cel care a făcut-o e autorul. <small>Foto: N. Lewis, Shenandoah National Park (NPS), <a href="https://commons.wikimedia.org/wiki/File:Photographer%27s_Sunset_Silhouette_(51834538595).jpg" target="_blank" rel="noopener">Wikimedia Commons</a>; micșorată.</small>'),
  meniuImg:fig('edge-meniu-imagine.webp',880,785,'Edge: pagina de probă cu fotografia unui lup în zăpadă; peste ea, meniul de clic dreapta, cu Salvați imaginea ca încadrat','Clic dreapta pe fotografie: în meniu, <b>Salvați imaginea ca</b>. <small>Fotografia lupului: Tracy Brooks, U.S. Fish and Wildlife Service.</small> '+CAPT),
  salvareCa:fig('edge-salvare-ca.webp',911,209,'Bucăți din fereastra Salvare ca: sus Descărcări în bara de adresă (încadrat), apoi Nume fișier cu lup-in-zapada.jpg (încadrat), jos butoanele Salvare și Anulare','<b>Salvare ca</b>: sus, folderul; jos, <b>Nume fișier</b> și <b>Salvare</b>. Mijlocul, cu folderele calculatorului, e tăiat. '+CAPTW),
  descarcari:fig('edge-descarcari.webp',480,190,'Panoul Descărcări din Edge cu un fișier salvat la probă, lup_ro.jpg, și legătura Deschideți fișierul','După Salvare, Edge arată panoul <b>Descărcări</b>. <small>Captură din Microsoft Edge, în română, după o salvare de probă: fișierul se numea lup_ro.jpg, iar pictograma roșie e a programului de imagini al calculatorului de probă. La tine apar numele fișierului tău și altă pictogramă.</small>'),
  meniuText:fig('edge-meniu-text.webp',606,577,'Edge: cuvântul Lupul selectat, colorat cu albastru; la clic dreapta, meniul cu Copiere Ctrl+C încadrat','Textul selectat se colorează. Clic dreapta pe el: <b>Copiere</b>, cu scurtătura <b>Ctrl+C</b>. '+CAPT),
  data:fig('data-si-sursa.webp',337,150,'Subsolul unei pagini Wikipedia: Ultima editare a paginii a fost efectuată la 23 mai 2025, cu data încadrată și mărită','Data unei pagini de Wikipedia stă jos de tot: „Ultima editare a paginii a fost efectuată la…”. <small>Captură din Google Chrome, din jocul „Documentarea”, verificată din nou pe 11.10.2026.</small>'),
  licenta:fig('commons-licenta.webp',732,332,'Caseta de licență a unei fotografii de pe Wikimedia Commons: semnele CC, un omuleț (BY) și o săgeată în cerc (SA); textul spune ce ai voie și în ce condiții','O licență Creative Commons: semnele <b>CC</b>, <b>BY</b> (omulețul) și <b>SA</b> (săgeata în cerc), apoi ce ai voie și în ce condiții. <small>Captură din Wikimedia Commons, cu interfața în română. La tine site-ul e în engleză (scrie <i>License</i>): caută semnele.</small>'),
  commons:fig('commons-fisier.webp',764,600,'Pagina unei fotografii pe Wikimedia Commons, în engleză: caseta Search Wikimedia Commons, titlul fișierului, butoanele Download all sizes și Use this file on the web, fotografia unui lup în zăpadă','Wikimedia Commons, pagina unei fotografii, cum o vezi fără cont: în engleză. Sus, caseta <i>Search Wikimedia Commons</i>; butonul <i>Use this file on the web</i> îți dă sursa gata scrisă. <small>Captură din Wikimedia Commons; fotografia: Tracy Brooks, U.S. Fish and Wildlife Service, domeniu public.</small>'),
  atribuire:fig('commons-atribuire.webp',618,347,'Fereastra Use this file on the web de pe Wikimedia Commons; la Attribution scrie Carlos Delgado, CC BY-SA 4.0, via Wikimedia Commons (încadrat)','<i>Use this file on the web</i>: la <i>Attribution</i> e sursa gata scrisă: autorul, licența, site-ul. <small>Captură din Wikimedia Commons; chenarul roșu e pus de noi.</small>'),
  panou:fig('commons-panou.webp',438,456,'Panoul din dreapta al căutării pe Wikimedia Commons: titlul fișierului, descrierea, autorul Wilfredor (încadrat), licența Creative Commons Zero, Public Domain Dedication (încadrat) și butonul More Details (încadrat)','Commons, după clic pe o fotografie din căutare: autorul (lângă omuleț), licența și <i>More Details</i>. <small>Captură din Wikimedia Commons; chenarele sunt de la noi.</small>')
};
const ACUM=(...p)=>`<div class="acum" role="note"><div class="lbl">Acum la calculator, în aplicațiile adevărate</div><ol>${p.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
const A_LUP='www.natura-exemplu.ro/lupul-cenusiu', A_URS='www.natura-exemplu.ro/ursul-brun', LIB='www.imagini-libere-exemplu.ro', L15='learninghub-8z6.pages.dev/lectii/v/m2-l15';
const SURSA_LUP={adresa:A_LUP,titlu:'Lupul cenușiu',autor:'Ana Munteanu',data:'12.03.2026'};
const SURSA_URS={adresa:A_URS,titlu:'Ursul brun',autor:'Ion Vasilescu',data:'04.02.2026'};

const SCHEMA=`<div class="schema" role="img" aria-label="Schema: salvezi o imagine cu clic dreapta în folderul tău; copiezi un text în Notepad și îl salvezi, întâi numele, apoi folderul; scrii sursa; un citat scurt cu autorul și sursa merge și pe site; opera întreagă: pentru tine și la temă, cu sursa; ca s-o publici îți trebuie voia autorului sau o licență liberă">
  <div class="sc-box"><b>Imaginea</b><span>clic dreapta, Salvați imaginea ca; Documente, dublu-clic pe folderul tău, Salvare</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Textul</b><span>selectezi, Ctrl+C; în Notepad, Ctrl+V; Ctrl+S: întâi numele, apoi folderul</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Sursa</b><span>titlul, adresa, autorul, data; la imagine, autorul și licența</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Drepturile de autor</b><span>citatul scurt, cu autorul și sursa: da, și pe site-ul școlii; opera întreagă: pentru tine și la tema de la școală, cu sursa; s-o publici, s-o dai mai departe, s-o dai drept a ta: nu, fără voie; licența liberă = voie dinainte</span></div>
</div>`;

/* ---- „Acum la calculator” (modul lecție: după atelier, înainte de verificare). FĂRĂ profesor, pe calculatorul comun:
   doar file noi, închise la sfârșit; fișierele doar în folderul tău din Documente, pus la sfârșit în Coș (ca la lecția 10).
   Scurtat după judecata 1 (7 puncte) și după judecata 2 (3 puncte, J2-2): laboratorul NU mai repetă casetele de la pași; termină
   fișa începută acolo: fotografia de lup aleasă în caseta de la „Cauți imagini…” se salvează în folderul tău, iar în fișierul lup
   (deschis în Notepad de la „Scrii sursa…”) se adaugă rândul Imaginea, cu Ctrl+S fără fereastră. Trimiterile la pași, după TITLU. ---- */
const LAB=[
  'În fila Commons, la lupul ales la pasul „Cauți imagini cu licență liberă” (ai închis-o? filă nouă, <code>commons.wikimedia.org</code>, <kbd>Enter</kbd>, fă din nou pasul „Cauți imagini cu licență liberă” și scrie din nou în caiet autorul și licența fotografiei pe care o salvezi acum): <i>More Details</i>, jos în panou (nu-l vezi? pune mouse-ul pe fotografia mare din dreapta și învârte spre tine rotița). Pe pagina fotografiei: clic dreapta pe ea, <b>Salvați imaginea ca</b>, <b>Documente</b>, dublu-clic pe folderul tău, te uiți sus, <b>Salvare</b>.',
  'În Notepad e încă fișierul <b>lup</b>, de la pasul „Scrii sursa și salvezi fișierul text” (l-ai închis? în folderul tău, dublu-clic pe lup). Pe un rând nou scrie <b>Imaginea:</b> autorul și licența, din caiet. Apoi <kbd>Ctrl</kbd>+<kbd>S</kbd>: lup are deja nume și folder, deci se salvează fără fereastră.',
  'Lasă calculatorul cum l-ai găsit. Notepad: pe Windows 11, <b>Fișier</b>, apoi <b>Închideți fila</b>; pe Windows 10 îl închizi cu <b>X</b>. Închide filele tale din browser cu <b>×</b>. În Explorer, <b>Descărcări</b>: a rămas o fotografie salvată de tine azi? Mut-o în folderul tău (Decupare, Lipire). Apoi <b>Documente</b>, un clic pe folderul tău și <kbd>Delete</kbd>: ajunge în Coș. <b>Nu goli Coșul</b>. Închide Explorer cu X. <details class="verif"><summary>Verifică-te, după ce ai terminat</summary> În folderul tău erau fotografiile salvate azi și fișierul text <b>lup</b>: propoziția, sursa ei (titlul „Lup cenușiu - Wikipedia”, adresa <code>https://ro.wikipedia.org/…</code>, autorii, data ultimei editări) și rândul <b>Imaginea</b>. Și la <i>Public domain</i> ai scris autorul: așa e cinstit.</details>'
];

  extensii:false,acum:'25.12.2026 09:20'},o,{fs:['C:/Users/Elev/Desktop/',DL,EX,D+'Ex Ionescu Dan/'].concat(o.fs||[])});

JocMotor.porneste({

  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U3', unitateTitlu:'Internetul ca sursă de documentare',
  competente:['CS.1.3'], lectii:'15',
  ancoraText:'Din programă (CS.1.3, unitatea V-U3, lecția 15): Serviciul World Wide Web — salvarea informațiilor de pe Internet; Drepturi de autor',
  intro:`<p><b>Ai nevoie de:</b> lecția 14 — browserul, filele (<b>+</b> și <b>×</b>), bara de adrese și <kbd>Enter</kbd>, legăturile, ← Înapoi, motorul de căutare. Lecția 10 — folderul tău din Documente (<b>Ex</b>, numele și prenumele), clic dreapta, Decupare, Copiere, Lipire (<kbd>Ctrl</kbd>+<kbd>X</kbd>, <kbd>C</kbd>, <kbd>V</kbd>), <kbd>Delete</kbd> și Coșul. Lecția 9 — Explorer, panoul din stânga, dublu-clic pe un folder, rotița mouse-ului, semnele interzise în nume. Lecția 8 — butonul Start și cum pornești o aplicație scriindu-i numele.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 9 pași scurți. Primul îți arată la ce folosește lecția. După fiecare dintre ceilalți faci un exercițiu mic, fără puncte, și, unde se poate, câteva gesturi la calculator: așa începi fișa ta despre lup.</li><li>La atelier exersezi, într-un browser din pagină, cum îi adaugi fișei o fotografie.</li><li>Acum la calculator: termini fișa ta, în folderul tău, și lași calculatorul cum l-ai găsit.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,

  nivele:[
{t:'Salvarea informațiilor de pe Internet. Drepturile de autor',final:true,lectii:[15],
 continuturi:['Serviciul World Wide Web:','- salvarea informațiilor de pe Internet','Drepturi de autor'],
 obiectiv:'salvezi o imagine și un text de pe o pagină în folderul tău, scrii sursa lor și alegi ce ai voie să folosești, după drepturile de autor și licență.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: păstrezi și folosești cinstit',
   text:`<p>Faci un proiect despre lup. Pe Internet găsești o fotografie frumoasă și câteva rânduri bune. Vrei să le păstrezi pe calculator, ca să le pui în proiect.</p>
<p>Dar fotografia a făcut-o cineva, cum face omul din imagine cu telefonul. Rândurile le-a scris cineva. Ei sunt <strong>autorii</strong>.</p>
<p>Azi înveți să salvezi o imagine și un text în folderul tău, să scrii de unde le-ai luat și ce ai voie să faci cu ele.</p>
${IMG.fotograf}`},
  /* ---- pasul 1: clic dreapta pe imagine, fereastra Salvare ca, Descărcări (P1 + P2 de dinainte, J1-3) ---- */
  {t:'Salvezi o imagine: clic dreapta, Salvați imaginea ca',
   text:`<p>O imagine de pe o pagină o poți păstra pe calculator, ca fișier:</p>
<ol><li>Faci <b>clic dreapta</b> pe imagine (lecția 10). În meniu alegi <mark>Salvați imaginea ca</mark> (în Chrome: „Salvează imaginea ca…”).</li>

<li>Jos, la <b>Nume fișier</b>, e deja numele imaginii, colorat. Apeși <b>Salvare</b>.</li></ol>
${IMG.meniuImg}`,
   exemplu:`${IMG.salvareCa}${IMG.descarcari}<p>A doua oară, fereastra pornește din <b>ultimul folder folosit</b>: pe calculatorul din laborator, poate fi folderul unui coleg. De aceea te uiți mereu sus, înainte de Salvare.</p>
<p>Dacă numele există deja, Windows întreabă „… există deja. Îl înlocuiți?”. Apeși <b>Nu</b>: fișierul colegului rămâne neatins, iar numele se colorează din nou. Dai clic în el chiar înainte de punct și scrii o cifră.</p>

   incearca:B({q:'Salvează fotografia lupului în zăpadă așa cum îți propune fereastra: clic dreapta pe ea (pe telefon, butonul <b>⋮ Meniul imaginii</b> de sub ea), <b>Salvați imaginea ca</b>, apoi <b>Salvare</b>, fără să schimbi folderul sau numele. Uită-te apoi în panoul de sub browser: în ce folder a ajuns?',start:LIB+'/lup-in-zapada',foldere:true,

  /* ---- pasul 2: alegi folderul tău (+ mutarea din Descărcări, ca exercițiu; J1-3) ---- */
  {t:'Alegi tu folderul: Documente, apoi folderul tău',
   text:`<p>În Descărcări se adună fișierele tuturor. Mai bine salvezi direct în <strong>folderul tău</strong> din Documente (lecția 10). În fereastra Salvare ca:</p>
<ol><li>în stânga, un clic pe <b>Documente</b>;</li><li>în dreapta, <b>dublu-clic</b> pe folderul tău, de exemplu <b>Ex Pop Ana</b>. Un singur clic doar îl alege: butonul de jos devine <b>Deschidere</b> și nu salvează;</li><li>te uiți sus: în bara de adresă e numele folderului tău;</li><li>apeși <b>Salvare</b>.</li></ol>`,
   exemplu:`<p>Ai salvat totuși în Descărcări? Muți fișierul, ca la lecția 10: în Explorer, <b>Descărcări</b>, un clic pe fișier, <b>Decupare</b>; apoi <b>Documente</b>, dublu-clic pe folderul tău, <b>Lipire</b>. În Descărcări nu mai rămâne nimic al tău. Exersezi la „Încă un exercițiu”.</p>
${ACUM('Explorer (dosarul galben), <b>Documente</b>. Fă-ți folderul: <b>Nou</b>, <b>Folder</b> (pe Windows 10: <b>Pornire</b>, <b>Folder nou</b>), <b>Ex</b>, numele și prenumele tău, <kbd>Enter</kbd>; dacă există, adaugă o cifră. Micșorează Explorer cu liniuța.','În fila Commons: clic dreapta pe o fotografie, <b>Salvați imaginea ca</b>. Ce folder scrie sus? <b>Descărcări</b> sau ultimul folder folosit. Alege <b>Documente</b>, dublu-clic pe folderul tău, te uiți sus, <b>Salvare</b>.')}`,
   altfel:`<p>E ca atunci când pui o foaie în dosar. Întâi deschizi dulapul (Documente), apoi dosarul tău (folderul tău), și abia apoi pui foaia înăuntru (Salvare).</p>`,
   incearca:B({q:'Salvează fotografia lupului de noapte direct în folderul tău: <b>Documente › Ex Pop Ana</b>. (În Documente e și folderul unui coleg: nu salva acolo.)',start:LIB+'/lup-cenusiu',foldere:true,fs:[['Documente/Ex Ionescu Dan/']],
    checks:[{k:'salvat',img:'lupCenusiu',folder:'elev',ce:'Fotografia e în Documente › Ex Pop Ana',msg:'Fotografia nu e în folderul tău. În fereastră: Documente, DUBLU-clic pe Ex Pop Ana, te uiți sus, apoi Salvare.'}],

    ajutor:'În fereastra Salvare ca: clic pe Documente în stânga, dublu-clic pe Ex Pop Ana în dreapta, apoi Salvare.',

  /* ---- pasul 3: copiezi un text în Notepad ---- */
  {t:'Copiezi un text în Notepad',
   text:`<p>Un text de pe o pagină îl pui într-un fișier text, cu <mark>Notepad</mark>: o aplicație din Windows pentru text simplu. O pornești ca pe Paint (lecția 8): Start, scrii <code>note</code>, clic pe <b>Notepad</b>.</p>
<ol><li><b>Selectezi</b> textul: ții apăsat butonul stâng al mouse-ului la începutul propoziției și tragi până la capăt. Textul se colorează.</li><li><kbd>Ctrl</kbd>+<kbd>C</kbd> (sau clic dreapta pe el, <b>Copiere</b>).</li><li>Clic în Notepad, <kbd>Ctrl</kbd>+<kbd>V</kbd>.</li></ol>`,
   exemplu:`${IMG.meniuText}<p>Pe telefon: de obicei ții degetul apăsat pe un cuvânt, tragi de marginile colorate până cuprinzi propoziția și alegi <b>Copiere</b>; în locul unde scrii, ții degetul apăsat și alegi <b>Lipire</b>.</p>
<p>Ce copiezi rămâne în memoria calculatorului până copiezi altceva. De aceea lipești imediat.</p>
${ACUM('Filă nouă, <code>ro.wikipedia.org/wiki/Lup</code>, <kbd>Enter</kbd>. Pornește Notepad. E deja textul altcuiva în el (fila unui coleg)? Apasă <b>+</b>, sus, lângă file: lucrezi în fila nouă, pe a lui n-o atingi.','Selectează prima propoziție, <kbd>Ctrl</kbd>+<kbd>C</kbd>, clic în Notepad, <kbd>Ctrl</kbd>+<kbd>V</kbd>. Lasă-le deschise pentru pasul următor.')}`,
   incearca:B({q:'Copiază în Notepad propoziția despre hrana lupului: selecteaz-o, <kbd>Ctrl</kbd>+<kbd>C</kbd>, clic în Notepad, <kbd>Ctrl</kbd>+<kbd>V</kbd>.',start:A_LUP,notepad:true,
    checks:[{k:'npPropozitie',din:A_LUP,ce:'În Notepad e o propoziție întreagă din pagină',msg:'În Notepad nu e încă o propoziție întreagă din pagină. Selecteaz-o de la prima literă până la punct.'},
     {k:'np',are:[['carne','iepuri','cerbi','mistreti']],ce:'E propoziția despre hrana lupului',msg:'Ai copiat altă propoziție. Caută rândul despre hrana lupului.'}],
    sol:[['np','Hrana lui e mai ales carnea: vânează iepuri, cerbi și mistreți.']],gresit:[['np','lupul mananca']],
    ajutor:'Propoziția care începe cu „Hrana lui”. Ține apăsat la „H” și trage până după „mistreți.”.',
    why:'Ai colorat propoziția trăgând peste ea, apoi Ctrl+C, clic în Notepad și Ctrl+V: textul e acum în Notepad, exact cum era pe pagină.'}),
   inca:[
    {t:'order',q:'Pune în ordine pașii, ca să copiezi o propoziție în Notepad.',items:['Selectezi propoziția, trăgând cu mouse-ul peste ea','Ctrl+C','Clic în Notepad','Ctrl+V'],
     ajutor:'Nu poți copia ce n-ai selectat și nu poți lipi înainte să copiezi.',why:'Selectezi, copiezi, alegi locul, lipești.'}
   ]},
  /* ---- pasul 4: sursa + salvarea fișierului text; NUMELE ÎNTÂI (J1-1) ---- */
  {t:'Scrii sursa și salvezi fișierul text',
   text:`<p>Sub textul copiat scrii <mark>sursa</mark>, ca să găsești pagina din nou. Fișa „cum citez o sursă”:</p>
<ol><li><b>titlul</b> paginii;</li><li><b>adresa</b>: clic în bara de adrese (se selectează toată), <kbd>Ctrl</kbd>+<kbd>C</kbd>, în Notepad <kbd>Ctrl</kbd>+<kbd>V</kbd>;</li><li><b>autorul</b>; la Wikipedia sunt mulți: „autori: voluntarii Wikipedia”;</li><li><b>data</b> de pe pagină sau ziua în care ai citit-o.</li></ol>
<p>Apoi <kbd>Ctrl</kbd>+<kbd>S</kbd>. În Salvare ca, numele propus e colorat: scrii direct <code>lup</code>. Abia apoi <b>Documente</b>, dublu-clic pe folderul tău, te uiți sus și apeși <b>Salvare</b>. Notepad adaugă singur <code>.txt</code>.</p>
<p>Ai salvat în alt folder sau cu alt nume? <kbd>Ctrl</kbd>+<kbd>S</kbd> nu mai deschide fereastra; o deschide meniul <b>Fișier</b> › <b>Salvați ca</b> (pe Windows 10: <b>Salvare ca</b>).</p>`,
   exemplu:`${IMG.data}<p>Așa arată în Notepad un citat cu sursa lui:</p>
<div class="np-ex">"Hrana lui e mai ales carnea: vânează iepuri, cerbi și mistreți."
Sursa: Lupul cenușiu – Natura Exemplu, https://www.natura-exemplu.ro/lupul-cenusiu, autor Ana Munteanu, 12.03.2026</div>
<p>Ghilimelele arată unde începe și unde se termină textul altcuiva.</p>
<p>La sfârșitul orei lași Notepad gol. În Windows 11, meniul <b>Fișier</b> are comanda <b>Închideți fila</b>; cu X, Notepad ține minte fila și i-o arată colegului de după. Pe Windows 10, Notepad n-are file: după ce ai salvat, îl închizi cu X.</p>
${ACUM('Sub propoziție: <b>Sursa:</b>, titlul (de pe filă), adresa (din bară), <b>autori: voluntarii Wikipedia</b>, data de jos de pe pagină.','<kbd>Ctrl</kbd>+<kbd>S</kbd>. Numele e colorat: scrie <code>lup</code>. Apoi <b>Documente</b>, dublu-clic pe folderul tău, <b>Salvare</b>. Închide fila Wikipedia cu <b>×</b>. Notepad rămâne deschis, cu lup: îl mai folosești la sfârșitul orei.')}`,
   incearca:B({q:'În Notepad e deja propoziția copiată. Scrie sub ea sursa (titlul, adresa, autorul și data paginii). Apoi <kbd>Ctrl</kbd>+<kbd>S</kbd> (pe telefon: Fișier › Salvați): cât numele e colorat, scrie <b>lup</b>; abia apoi <b>Documente</b>, dublu-clic pe <b>Ex Pop Ana</b> și Salvare.',start:A_LUP,foldere:true,
    notepad:{text:'"Lupul cenușiu trăiește în haite, în pădurile de munte."\n'},
    checks:[{k:'npSursa',adresa:A_LUP,titlu:'Lupul cenușiu',autor:'Ana Munteanu',data:'12.03.2026',ce:'Sursa are titlul, adresa, autorul și data',msg:'Sursei îi lipsește ceva: titlul, adresa (din bara de adrese), autorul (sub text) sau data.'},
     {k:'npSalvat',folder:'elev',nume:'lup',sursa:SURSA_LUP,ce:'Fișierul lup e salvat în Documente › Ex Pop Ana, cu sursa în el',msg:'Fișierul nu e încă lup, în Ex Pop Ana, cu sursa. Ctrl+S; cât numele e colorat, scrie lup; apoi Documente, dublu-clic pe Ex Pop Ana, Salvare. (Ai salvat deja, cu alt nume sau în alt folder? Ctrl+S nu mai deschide fereastra: Fișier › Salvați ca o deschide din nou.)'}],
    sol:[['npAdauga','Sursa: Lupul cenușiu – Natura Exemplu, https://www.natura-exemplu.ro/lupul-cenusiu, autor Ana Munteanu, 12.03.2026'],['npSalveaza','elev','lup']],
    gresit:[['npAdauga','Sursa: Internet'],['npSalveaza','elev','lup']],
    ajutor:'Titlul e pe filă. Adresa: clic în bara de adrese, Ctrl+C, apoi Ctrl+V în Notepad. Autorul și data sunt sub text. La salvare: întâi numele lup, apoi folderul.',
    why:'Cu titlul, adresa, autorul și data, oricine găsește pagina din nou. Ai scris numele cât era colorat, apoi ai ales folderul: fișierul lup e în folderul tău.'}),
   inca:[
    {t:'classify',q:'Ce scrii în sursa unui text copiat?',cats:['Scriu','Nu e nevoie'],items:[['Adresa paginii',0],['Titlul paginii',0],['Autorul, dacă apare',0],['Culoarea paginii',1],['Câte reclame avea pagina',1]],
     ajutor:'Ce te duce înapoi la pagină și la cel care a scris-o?',why:'Titlul, adresa, autorul și data duc la sursă. Culoarea sau reclamele nu ajută pe nimeni s-o găsească.'}
   ]},
  /* ---- pasul 5: drepturile de autor (J1-10, J1-11, J1-12) ---- */
  {t:'Drepturile de autor: cine a făcut opera',
   text:`<p>Un text, o fotografie, un desen, o melodie, un film pe care cineva le-a creat sunt <mark>opere</mark>. Cine le-a creat e <mark>autorul</mark>. Și desenul tău de la ora de desen e o operă.</p>
<p>Legea dreptului de autor (Legea nr. 8/1996) ocrotește opera din clipa în care e făcută, chiar neterminată. Nu e nevoie de semnul © (un C într-un cerc, care înseamnă „drepturi de autor”).</p>
<p>Autorul are <mark>drepturile de autor</mark>: el hotărăște dacă, cum și când e folosită opera lui. Simplele fapte nu sunt ale nimănui: că lupul trăiește în haite poți spune cu vorbele tale. Fraza autorului și fotografia lui, da: sunt opere.</p>`,
   altfel:`<p>La un concurs de desen, cineva aduce desenul altcuiva, cu numele lui pe el. Nimeni n-a rămas fără desen, și totuși toată lumea știe că e furt. Ce s-a luat nu e foaia, e <b>meritul</b>: lauda pentru munca altuia.</p>`,
   incearca:{t:'tf',q:'Desenul tău neterminat nu e ocrotit de lege, fiindcă n-ai pus semnul © pe el.',ok:false,ajutor:'Recitește al doilea paragraf: de când e ocrotită opera?',
    why:'Fals. Opera e ocrotită din clipa în care e făcută, chiar neterminată, și fără ©.'},
   inca:[
    {t:'choice',q:'Cine are drepturile de autor asupra unei fotografii găsite pe Internet?',o:['Cel care a făcut-o','Oricine o găsește','Motorul de căutare care o arată','Cel care a salvat-o'],ok:0,
     ajutor:'Cine e autorul unei opere?',why:'Autorul e cel care a creat opera, adică fotograful. Cine o găsește sau o salvează are doar o copie.'}
   ]},
  /* ---- pasul 6: O SINGURĂ regulă, cu „Toate drepturile rezervate” predat (decizia 2 a dirijorului; sonnet 1-2; J1-9) ---- */
  {t:'Ce ai voie și ce nu: pentru tine, la temă, pe Internet',
   text:`<p>Lângă multe opere scrie © sau <mark>Toate drepturile rezervate</mark>: autorul nu-ți dă altă voie decât cea din lege. Legea îți dă voie, fără să-l întrebi:</p>
<ul><li>cu <b>opera întreagă</b> (fotografia, articolul): s-o păstrezi <b>pentru tine</b> și s-o pui într-o <b>temă care rămâne la școală</b>, cu autorul și sursa;</li><li>să <b>citezi</b> în lucrarea ta o bucată scurtă: câteva rânduri, între ghilimele, cu autorul și sursa. Citatul îl poți pune și pe site-ul școlii.</li></ul>
<p>Fără voia autorului NU ai voie:</p>
<ul><li>să <b>publici</b> opera întreagă (pe Internet, pe site-ul școlii) sau s-o <b>dai mai departe</b> altora;</li><li>s-o dai drept a ta: asta e <mark>plagiat</mark>. Și dacă schimbi câteva cuvinte, textul rămâne al autorului.</li></ul>`,
   exemplu:`<p><b>Citat:</b> Ana Munteanu scrie: „Lupul cenușiu trăiește în haite, în pădurile de munte.” (Lupul cenușiu – Natura Exemplu, www.natura-exemplu.ro/lupul-cenusiu) Așa îl pui și într-o fișă de pe site-ul școlii.</p>
<p><b>Fotografia cu „Toate drepturile rezervate”:</b> o păstrezi pentru tine sau o pui în tema predată profesorului, cu autorul și sursa sub ea. Pe site-ul școlii n-o pui: e opera întreagă.</p>
<p><b>Plagiat:</b> copiezi tot articolul și îl predai cu numele tău.</p>`,
   incearca:{t:'classify',q:'Ai voie sau nu?',cats:['Ai voie','Nu ai voie'],
    items:[['Pui în tema pentru profesor două rânduri dintr-o carte, între ghilimele, cu autorul și titlul cărții',0],['Copiezi tot articolul și scrii numele tău sub el',1],['Pui în tema pentru profesor o fotografie cu „Toate drepturile rezervate” și scrii sub ea autorul și site-ul',0],['Pui aceeași fotografie pe site-ul școlii, fără voia autorului',1],['Pui pe site-ul școlii o propoziție dintr-un articol, între ghilimele, cu autorul și sursa',0],['Schimbi trei cuvinte într-un paragraf copiat și spui că l-ai scris tu',1]],
    ajutor:'E un citat scurt sau opera întreagă? Sursa e scrisă? E pentru tine și pentru școală, sau o publici? E munca ta sau a altcuiva?',
    why:'Un citat scurt, cu autorul și sursa: ai voie, și pe site-ul școlii. Opera întreagă: pentru tine și la tema care rămâne la școală, cu autorul și sursa. S-o publici, s-o dai mai departe sau s-o dai drept a ta: nu, fără voia autorului.'},
   inca:[
    {t:'tf',q:'Dacă schimbi câteva cuvinte într-un text copiat, textul devine al tău.',ok:false,ajutor:'Recitește a doua listă din pas.',
     why:'Fals. Textul rămâne al autorului. Scrii sursa, ca la orice citat.'}
   ]},
  /* ---- pasul 7: licențele libere (sonnet 5-6; decizia 2) ---- */
  {t:'Licențele libere: autorul îți dă voie dinainte',
   text:`<p>Unii autori îți dau voie dinainte și să publici opera, și s-o dai mai departe: printr-o <mark>licență liberă</mark>, lângă operă.</p>
<ul><li><mark>Domeniu public</mark>: opera e liberă pentru toți. Autorul a renunțat la drepturile de folosire (semnul <b>CC0</b>) sau, în România, de obicei au trecut 70 de ani de la moartea lui.</li>
<li><mark>Creative Commons</mark> (<b>CC</b>): licențe cu semne. <b>BY</b>: scrii autorul și licența. <b>SA</b>: o variantă schimbată o dai mai departe cu aceeași licență. <b>NC</b>: nu câștigi bani cu ea. <b>ND</b>: nu dai mai departe o variantă schimbată.</li></ul>
<p>Și la domeniu public scrii autorul: dreptul de a fi numit autor nu se termină.</p>`,
   exemplu:`${IMG.licenta}<p>Pentru o fișă pe care o puneți pe site-ul școlii alegi o imagine cu licență liberă și scrii sub ea autorul și licența, de exemplu: <i>Maria Ionescu, CC BY 4.0</i>. Dacă ai schimbat imaginea (ai tăiat-o, ai colorat-o), spui și asta.</p>`,
   incearca:{t:'choice',q:'Sub o fotografie scrie: <i>Autor: Ion Stan · CC BY-NC 4.0</i>. Vrei s-o pui în tema ta, fără să câștigi bani. Ce faci?',
    o:['O folosesc și scriu sub ea: Ion Stan, CC BY-NC 4.0','O folosesc fără să scriu nimic','N-o folosesc: NC nu dă voie la nimic','N-o folosesc: BY înseamnă că e numai a lui'],ok:0,
    ajutor:'Ce cere BY? Ce interzice NC?',why:'BY cere autorul și licența, iar NC interzice doar câștigul. La temă nu câștigi bani, deci o folosești și scrii autorul și licența.'},
   inca:[
    {t:'match',q:'Leagă fiecare semn de ce înseamnă.',pairs:[['BY','scrii autorul și licența'],['NC','nu câștigi bani cu ea'],['ND','nu dai mai departe o variantă schimbată'],['CC0','autorul a renunțat la drepturile de folosire: domeniu public']],
     ajutor:'Recitește lista din pas.',why:'Semnele spun, pe scurt, condițiile licenței. BY e în toate licențele CC: autorul se scrie mereu.'}
   ]},
  /* ---- pasul 8: Wikimedia Commons (Canis lupus, decizia 3); Bing într-o propoziție (decizia 1) + ce am învățat ---- */
  {t:'Cauți imagini cu licență liberă: Wikimedia Commons',
   text:`<p><b>Wikimedia Commons</b> (<code>commons.wikimedia.org</code>) e un site cu imagini libere. E în engleză:</p>

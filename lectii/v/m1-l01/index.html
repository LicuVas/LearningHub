<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecția 1, clasa a V-a: Ce facem anul acesta la Informatică și TIC</title>
<meta name="description" content="Lecția 1, clasa a V-a: prima oră de informatică. Afli ce faci anul acesta, cum lucrezi pe o lecție pe pași și cum se notează: cele trei niveluri (De bază, Consolidat, Avansat) și părțile A, B, C ale lucrării.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Andika:ital,wght@0,400;0,700;1,400&family=Victor+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
<style>
:root{
  --desk:#EDF1F6; --paper:#FFFFFF; --paper2:#F2F6FB; --line:#D3DBE6;
  --ink:#1C2332; --ink2:#566175; --accent:#1F4FA3; --accentInk:#FFFFFF; --sel:#DCE6F7;
  --mark:#FFE38A; --markInk:#1C2332; --ok:#2B7A4B; --okbg:#E2F2E7; --bad:#BF3A2E; --badbg:#FBE5E2;
  --fd:"Kalam","Segoe Print","Segoe UI",system-ui,sans-serif; --fb:"Andika","Segoe UI",system-ui,sans-serif; --fm:"Victor Mono",Consolas,monospace;
  --grila:#C7D6EC; --margine:#D9474F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#10141B; --paper:#191F29; --paper2:#212835; --line:#333D4E;
  --ink:#E7ECF4; --ink2:#A6B0C2; --accent:#86AEF2; --accentInk:#0D1320; --sel:#22375C;
  --mark:#E8CD5C; --markInk:#1C2332; --ok:#6CCB8F; --okbg:#16301F; --bad:#FF8B7B; --badbg:#3A1D1A;
  --grila:#2A3446; --margine:#C2464D;
}}
:root[data-theme="dark"]{
  --desk:#10141B; --paper:#191F29; --paper2:#212835; --line:#333D4E;
  --ink:#E7ECF4; --ink2:#A6B0C2; --accent:#86AEF2; --accentInk:#0D1320; --sel:#22375C;
  --mark:#E8CD5C; --markInk:#1C2332; --ok:#6CCB8F; --okbg:#16301F; --bad:#FF8B7B; --badbg:#3A1D1A;
  --grila:#2A3446; --margine:#C2464D;
}
/* tema: caietul de informatică (hârtie cu pătrățele și marginea roșie), unde se lipește fișa cu criteriile la prima oră */
.banda{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 30px;white-space:nowrap;overflow:hidden;position:relative;
  background:
    linear-gradient(90deg,transparent 18px,var(--margine) 18px 20px,transparent 20px),
    repeating-linear-gradient(0deg,transparent 0 11px,var(--grila) 11px 12px),
    repeating-linear-gradient(90deg,transparent 0 11px,var(--grila) 11px 12px),
    var(--paper);
  border-bottom:1px solid var(--line)}
.banda span{font-family:var(--fd);font-size:1rem;color:var(--ink);letter-spacing:.01em}
.banda b{font-weight:700;color:var(--accent)}
.banda .sag{color:var(--ink2)}
@media (max-width:600px){.banda .cls{display:none}}
h1,h2{font-weight:700;letter-spacing:0;line-height:1.15}
/* nivelurile, ca pe fișa lipită în caiet (la fel ca la lecția 7: A · De bază, B · Consolidat, C · Avansat) */
.niv{display:inline-block;font-family:var(--fm);font-size:.74rem;font-weight:600;letter-spacing:.03em;padding:1px 9px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:var(--paper);margin:0 6px 4px 0;vertical-align:.08em;white-space:nowrap}
.niv.c{border-style:double;border-width:3px}
.niv.a{background:var(--accent);color:var(--accentInk)}
.niveluri{list-style:none;margin:.5em 0 .7em;padding:0;display:grid;gap:6px}
.niveluri li{border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:6px 10px;line-height:1.4}
/* harta anului: cele șase părți, fiecare cu lecțiile ei */
.an{list-style:none;margin:.5em 0 .6em;padding:0;display:grid;gap:6px;counter-reset:parte}
.an li{counter-increment:parte;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--paper2);padding:5px 10px 5px 34px;position:relative;line-height:1.38}
.an li::before{content:counter(parte);position:absolute;left:9px;top:5px;font-family:var(--fd);font-size:1.15rem;color:var(--accent)}
.an .l{font-family:var(--fm);font-size:.78rem;color:var(--ink2);white-space:nowrap}
/* tabelul lucrării și scara notelor */
.tab-lucr{border-collapse:collapse;width:100%;margin:.5em 0 .7em;font-size:.95rem}
.tab-lucr th,.tab-lucr td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tab-lucr th{background:var(--paper2);font-weight:700}
.tab-lucr td.nr{text-align:right;font-family:var(--fm);white-space:nowrap}
.tab-lucr .mic{font-size:.88em;color:var(--ink2)}
@media (max-width:600px){.tab-lucr{font-size:.9rem}.tab-lucr th,.tab-lucr td{padding:4px 5px}}
.tab-lucr tr.tot td{font-weight:700}
/* „Verifică-te, după ce ai scris” la pașii din laborator (ca la lecția 7): ținta de atingere are cel puțin 44 px */
details.verif{margin-top:.4em;font-size:.93rem}
details.verif summary{cursor:pointer;font-weight:700;color:var(--accent);min-height:44px;padding:12px 0;line-height:1.35;box-sizing:border-box}
/* regula 20 (judecătorul, J06): butoanele mici ale motorului aveau 31 px; aici, cel puțin 34 px */
.btn.sm{min-height:34px}
/* casetele „Cine lucrează” din cuprins, numerotate ca în poza lor */
.lede ol.casete{margin:.3em 0 .6em;padding-left:1.4em}.lede ol.casete li{margin:.35em 0}
/* K01: avertismentul „Ești tot …?”, citit înainte de „Apoi începe” */
.lede p.atentie{border:2px solid var(--accent);border-left-width:6px;border-radius:8px;background:var(--sel);padding:8px 12px}
/* simulatorul „lucrare”: foaia corectată + rândurile de răspuns + testele */
.lu-foaie{border:1px solid var(--line);border-radius:6px;padding:10px 12px 8px 30px;margin:0 0 10px;position:relative;max-width:560px;
  background:linear-gradient(90deg,transparent 18px,var(--margine) 18px 20px,transparent 20px),repeating-linear-gradient(0deg,transparent 0 23px,var(--grila) 23px 24px),var(--paper)}
.lu-foaie .cap{font-family:var(--fd);font-size:1.2rem;line-height:1.2;margin:0 0 4px}
.lu-foaie table{border-collapse:collapse;width:100%;font-size:.97rem}
.lu-foaie td{padding:3px 4px;border-bottom:1px dashed var(--line)}
.lu-foaie td.p{text-align:right;font-family:var(--fm);white-space:nowrap}
.lu-foaie tr.tot td{border-bottom:0;font-weight:700}
.lu-rand{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.lu-rand .ce{flex:1 1 14em;line-height:1.35}
.lu-rand .ce b.nr{display:inline-block;min-width:1.4em;font-family:var(--fm);color:var(--accent)}
.lu-opt{display:inline-flex;flex-wrap:wrap;gap:6px}
.lu-opt button{font:inherit;font-size:.93rem;min-height:40px;min-width:44px;padding:6px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);cursor:pointer}
.lu-opt button:hover{border-color:var(--accent)}
.lu-opt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:700}
.lu-teste{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.lu-teste ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.lu-teste li{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;line-height:1.35}
.lu-teste li .s{flex:none;width:1.4em;text-align:center;font-weight:800}
.lu-teste li.ok .s{color:var(--ok)}.lu-teste li.rau .s{color:var(--bad)}
.lu-teste li .m{display:block;font-size:.86rem;color:var(--bad)}
</style>
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script>
/* Lecția 1, clasa a V-a (M1): „Ce facem anul acesta la Informatică și TIC. Criteriile de evaluare și cele trei niveluri”
   (tip: organizare + evaluare inițială; unitatea V-E0). E PRIMA oră de informatică: pagina nu presupune nimic, nici cum
   se folosește o lecție pe pași (pasul 2 o predă). Sursele (documentele profesorului au prioritate):
   Info_Gimnaziu_2026\instrumente\Fisa_criterii_elev_clasa_V.md (fișa lipită în caiet), SISTEM_EVALUARE.md §3-§4,
   data\unitati.json (cele șase părți ale anului), planificari\Calendar_ore_5AM_5M.md, Proiectul_unitatii_V-E0.md.
   Pagina nu dă note: stelele și XP de la verificare nu sunt note. Testul de la început (evaluarea inițială) se dă la clasă,
   pe foaie, și nu se notează; pagina îl descrie, nu-l copiază (vezi surse.md).
   Simulatorul „lucrare” (atelierul) e scris aici, în pagină: elevul aplică regula profesorului (SISTEM_EVALUARE §4.2-4.3)
   pe lucrări inventate. Standardul: _campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. */
const LIC={
  by25:'<a href="https://creativecommons.org/licenses/by/2.5/deed.ro" target="_blank" rel="noopener">CC BY 2.5</a>'
};
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const IMG={
  laborator:fig('laborator-scoala.webp',800,495,'O sală de informatică dintr-o școală: lângă pereți, mese cu calculatoare, fiecare cu ecran și tastatură; în mijloc, bănci și scaune obișnuite; pereții sunt pictați cu flăcări portocalii',
    `O sală de informatică într-o școală din Innsbruck, Austria: calculatoarele stau pe mesele de lângă perete. <small>Foto: Patrik Fimml, ${wc('Brgapp-edv-klasse.jpg','Wikimedia Commons')}, ${LIC.by25}.</small>`),
  incearca:fig('caseta-incearca.webp',760,939,'Două capturi ale casetei Încearcă tu din această lecție. Sus, înainte de răspuns: butoanele Am nevoie de un indiciu și Verifică sunt încercuite cu roșu. Jos, după o verificare greșită: indiciul galben a apărut singur, dedesubt scrie Nu încă, iar butonul Verifică a rămas',
    'Caseta <b>Încearcă tu</b> de mai jos. Sus: butonul pentru indiciu și butonul <b>Verifică</b>. Jos: după o greșeală scrie „Nu încă”, iar indiciul apare singur. Capturi din această lecție.'),
  casete:fig('casete-cine-lucreaza.webp',760,983,'Patru casete numerotate, capturi din această lecție: 1, caseta Spune cine ești, cu butonul Spune cine ești; 2, lista Cine lucrează acum?, cu numele elevilor de pe calculator și butonul Nu sunt în listă; 3, rândul Lucrezi ca, cu numele altui elev și butonul Nu ești tu? Alege-te din listă; 4, întrebarea Ești tot, cu butoanele Da, sunt eu și Nu, sunt alt elev',
    'Cele patru casete, cu numerele din listă. Numele elevilor din poză sunt inventate. Capturi din această lecție.'),
  bara:fig('bara-telefon.webp',760,242,'Bara lecției pe un telefon, de două ori: sus, la început, se văd P1 până la P7 și Atelier; jos, după ce bara a fost trasă cu degetul spre stânga, se văd Atelier, Laborator și Î1 până la Î5',
    'Bara lecției pe telefon. Sus: cum apare la început. Jos: după ce o tragi cu degetul spre stânga apar <b>Atelier</b> și <b>Laborator</b>. Capturi din această lecție.')
};
/* eticheta nivelului (ca la lecția 7) */
const NIV={b:'<span class="niv">De bază</span>',c:'<span class="niv c">Consolidat</span>',a:'<span class="niv a">Avansat</span>'};
const PARTE={A:'<span class="niv">A · De bază</span>',B:'<span class="niv c">B · Consolidat</span>',C:'<span class="niv a">C · Avansat</span>'};

/* ---------------- simulatorul „lucrare”: elevul, în locul profesorului, află nivelul și nota din punctele pe părți ----------------
   Regula (SISTEM_EVALUARE §4.2-4.3 + fișa din caiet): A ≥ 27 → De bază; și B ≥ 20 → Consolidat; și C ≥ 14 → Avansat.
   Sub De bază: A ≥ 14 → În formare (3-4), altfel În dificultate (1-2). Totalul NU decide nivelul.
   Q: {elev, gen, a, b, c, q, gresit:{A,B,C,nivel,nota}}  (gen = „Biancăi”, „lui Cristi”: genitivul numelui;
      gresit = răspunsul greșit tipic, pentru poartă) */
const NIVELURI=[['dificultate','În dificultate'],['formare','În formare'],['baza','De bază'],['consolidat','Consolidat'],['avansat','Avansat']];
const BENZI={dificultate:'1 sau 2',formare:'3 sau 4',baza:'5 sau 6',consolidat:'7 sau 8',avansat:'9 sau 10'};
const PRAG={A:27,B:20,C:14};
function nivelCorect(Q){if(Q.a<27)return Q.a>=14?'formare':'dificultate';if(Q.b<20)return 'baza';if(Q.c<14)return 'consolidat';return 'avansat'}
function raspunsCorect(Q){return {A:Q.a>=27?'da':'nu',B:Q.b>=20?'da':'nu',C:Q.c>=14?'da':'nu',nivel:nivelCorect(Q),nota:nivelCorect(Q)}}
const SimLucrare={
  render(Q,body,api){
    const st={A:null,B:null,C:null,nivel:null,nota:null};
    const pts={A:Q.a,B:Q.b,C:Q.c},total=Q.a+Q.b+Q.c+10;
    const rand=(k,nr,ce,opts)=>`<div class="lu-rand" data-r="${k}"><span class="ce"><b class="nr">${nr}.</b> ${ce}</span><span class="lu-opt" role="group" aria-label="${api.esc(ce.replace(/<[^>]+>/g,''))}">${opts.map(([v,t])=>`<button type="button" data-k="${k}" data-v="${v}" aria-pressed="false">${t}</button>`).join('')}</span></div>`;
    const DN=[['da','Da'],['nu','Nu']];
    const TESTE=[['A',`Rândul 1: ai judecat bine partea A (${Q.a} din 40)`],['B',`Rândul 2: ai judecat bine partea B (${Q.b} din 30)`],['C',`Rândul 3: ai judecat bine partea C (${Q.c} din 20)`],['nivel','Rândul 4: nivelul e cel potrivit'],['nota','Rândul 5: nota e cea care merge cu nivelul potrivit']];
    body.innerHTML=`<div class="lu-foaie" aria-label="Lucrarea corectată: ${api.esc(Q.elev)}">
        <p class="cap">Lucrarea ${api.esc(Q.gen)} · corectată</p>
        <table><tbody>
          <tr><td>Partea A · De bază</td><td class="p">${Q.a} din 40</td></tr>
          <tr><td>Partea B · Consolidat</td><td class="p">${Q.b} din 30</td></tr>
          <tr><td>Partea C · Avansat</td><td class="p">${Q.c} din 20</td></tr>
          <tr><td>Din oficiu</td><td class="p">10</td></tr>
          <tr class="tot"><td>Total</td><td class="p">${total} din 100</td></tr>
        </tbody></table></div>
      ${rand('A',1,'Partea A are <b>cel puțin 27</b> de puncte?',DN)}
      ${rand('B',2,'Partea B are <b>cel puțin 20</b> de puncte?',DN)}
      ${rand('C',3,'Partea C are <b>cel puțin 14</b> puncte?',DN)}
      ${rand('nivel',4,`Ce nivel a atins ${api.esc(Q.elev)}?`,NIVELURI)}
      ${rand('nota',5,`Nota ${api.esc(Q.gen)} va fi:`,NIVELURI.map(([v])=>[v,BENZI[v]]))}
      <div class="lu-teste"><b>Testele</b> <span class="hint">· se bifează când apeși „Verifică”</span><ol>${TESTE.map(([k,t])=>`<li data-t="${k}"><span class="s">○</span><span>${t}<span class="m"></span></span></li>`).join('')}</ol></div>`;
    const draw=()=>body.querySelectorAll('.lu-opt button').forEach(b=>b.setAttribute('aria-pressed',String(st[b.dataset.k]===b.dataset.v)));
    body.querySelectorAll('.lu-opt button').forEach(b=>b.onclick=()=>{if(api.done())return;st[b.dataset.k]=b.dataset.v;draw()});
    const bun=raspunsCorect(Q);
    const mesaj=k=>{
      if(k==='A'||k==='B'||k==='C')return `Compară ${pts[k]} cu ${PRAG[k]}. „Cel puțin ${PRAG[k]}” înseamnă ${PRAG[k]} sau mai mult.`;
      if(k==='nivel')return 'Urcă pe rând: A, apoi B, apoi C, și oprește-te la primul „Nu”. Dacă partea A n-are 27, uită-te dacă are măcar 14.';
      return st.nivel!==bun.nivel?'Nota merge cu nivelul potrivit. Găsește întâi nivelul bun (rândul 4).':'Fiecare nivel are două note: Avansat 9 sau 10, Consolidat 7 sau 8, De bază 5 sau 6, În formare 3 sau 4, În dificultate 1 sau 2.';
    };
    const marcheaza=()=>{let ok=0;TESTE.forEach(([k])=>{const li=body.querySelector(`.lu-teste li[data-t="${k}"]`),e=st[k]===bun[k];
      li.classList.toggle('ok',e);li.classList.toggle('rau',!e);li.querySelector('.s').textContent=e?'✓':'✗';li.querySelector('.m').textContent=e?'':mesaj(k);if(e)ok++});return ok};
    const pune=r=>{Object.assign(st,r);draw()};
    body._lucrare={pune,corect:()=>Object.assign({},bun)};
    const nav=api.checkButton(()=>{
      if(Object.values(st).some(v=>v===null)){api.feedback('bad','<strong>Mai ai rânduri fără răspuns.</strong> Alege câte un buton pe fiecare dintre cele 5 rânduri.');return}
      const ok=marcheaza();
      if(ok===TESTE.length){nav.innerHTML='';api.resolve(true)}
      else{api.resolve(false,`${ok} din ${TESTE.length} teste trecute. Schimbă răspunsul la rândurile cu ✗, apoi apasă din nou „Verifică”.`);
        api.revealButton(()=>{pune(bun);marcheaza();nav.innerHTML='';api.giveUp(`${api.esc(Q.elev)} a atins nivelul <b>${NIVELURI.find(x=>x[0]===bun.nivel)[1]}</b>, deci nota ${api.esc(Q.gen)} va fi ${BENZI[bun.nivel]}. Răspunsurile bune sunt acum alese pe fiecare rând.`)})}
    });
  },
  rezolva(Q,body){body._lucrare.pune(body._lucrare.corect())},
  gresit(Q,body){body._lucrare.pune(Object.assign(body._lucrare.corect(),Q.gresit))}
};

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).
   De pe scaun, fără cabluri și prize, FĂRĂ profesor (la ora simultană e la cealaltă clasă). */
const LABORATOR=[
  'Stai pe scaun, la locul tău, cu caietul de informatică și un pix în față. Nu atingi cablurile și prizele.',
  'Scrie sus, în caiet, titlul <b>Cum se învață și cum se notează la informatică</b>. Dacă ai primit de la profesor fișa cu criteriile, o lipești sub titlu. Pașii 3, 4 și 5 îi faci oricum: scrii din minte, apoi te verifici.',
  'Sub titlu, scrie cele trei niveluri, unul sub altul, începând cu primul: De bază, apoi Consolidat, apoi Avansat. Lângă fiecare, scrie cu cuvintele tale ce înseamnă.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>De bază: rezolvi dacă ai un model sau pașii dați, la lucruri pe care le-ai mai făcut. Consolidat: rezolvi singur lucruri de felul celor exersate. Avansat: rezolvi singur o situație pe care n-ai mai văzut-o și poți explica de ce ai făcut așa.</details>',
  'Scrie părțile lucrării: A, B și C. Lângă fiecare, scrie câte puncte are și pragul ei: de câte ai nevoie ca să treci de ea. Nu uita punctele din oficiu.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Partea A (De bază): 40 de puncte; pragul: cel puțin 27. Partea B (Consolidat): 30 de puncte; pragul: cel puțin 20. Partea C (Avansat): 20 de puncte; pragul: cel puțin 14. Din oficiu: 10 puncte. Total: 100.</details>',
  'Sub părțile lucrării, scrie ce notă dă fiecare nivel.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Avansat: 9 sau 10. Consolidat: 7 sau 8. De bază: 5 sau 6. În formare (partea A n-are 27, dar are cel puțin 14): 3 sau 4. În dificultate (partea A are sub 14): 1 sau 2. Sub De bază primești și un plan de recuperare.</details>',
  'De unde pleci? Scrie un lucru pe care îl faci deja pe un calculator sau pe un telefon, de exemplu să pornești un joc sau să faci o poză. Lângă el, scrie nivelul tău de azi la lucrul acela. Nu e o notă: doar afli de unde pleci.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>De bază: îl faci doar dacă cineva îți arată pașii. Consolidat: îl faci singur, cum l-ai mai făcut. Avansat: îl faci singur și pe un aparat pe care nu l-ai mai folosit, și poți explica cum.</details>',
  '<b>Dacă mai ai timp (opțional):</b> mergi jos de tot, pe bara lecției, și apasă <b>P5</b>: te întorci la pasul cu cele trei niveluri. Recitește-l. Apoi apasă, pe aceeași bară, <b>Laborator</b>: revii aici. Pe telefon, bara nu încape pe ecran: ca să vezi <b>Laborator</b>, trage bara cu degetul spre stânga.',
  '<b>Dacă mai ai timp (opțional):</b> compară caietul tău cu al colegului de bancă. Unde nu sunteți de acord, recitiți pasul potrivit și hotărâți împreună.'

  /* Cine lucrează (judecătorul, J01-J02; standardul, regula 23): calculatorul din laborator e COMUN. Casetele sunt
     ale lui assets/js/prezenta.js și ale cuprinsului din motor.js; toate patru, probate cu doi elevi pe același

  intro:`<p>E prima ta oră de <b>Informatică și TIC</b>. Afli ce faci anul acesta, cum lucrezi pe o pagină ca aceasta și după ce reguli se dau notele: cele <b>trei niveluri</b>. Nu trebuie să știi nimic dinainte.</p>
<p><b>Întâi, spune cine ești.</b> Pe un calculator din laborator lucrează, pe rând, mulți elevi. Uită-te deasupra căsuței „Numele tău, pentru diplomă” și jos de tot pe ecran. Vei vedea una dintre casetele de mai jos:</p>
<ol class="casete">
<li><b>„Spune cine ești”</b> sau <b>„Sunt elev — mă înscriu”</b>: apasă pe el. Alege școala și clasa, scrie numele și prenumele ca în catalog și un cod de 4 cifre, notat în caiet. Apasă <b>Gata</b>.</li>
<li><b>„Cine lucrează acum?”</b>: apasă pe numele tău (dacă vezi doar o etichetă mică, apasă întâi pe ea). Nu ești în listă? Apasă <b>Nu sunt în listă</b> și fă ca la 1.</li>
<li><b>„Lucrezi ca …”</b> sau <b>„Pe calculatorul ăsta a lucrat …”</b>, cu numele altui elev: apasă butonul de lângă, cu <b>Alege-te din listă</b>, apoi fă ca la 2.</li>
<li><b>„Ești tot …?”</b>: dacă e numele tău, apasă <b>Da, sunt eu</b>. Dacă nu, apasă <b>Nu, sunt alt elev</b> și fă ca la 2.</li>
</ol>
<p class="atentie"><b>Dacă jos scrie „Ești tot …?”, răspunde ÎNTÂI.</b> Nu începe lecția până nu ai răspuns. Dacă nu e numele tău, apasă <b>Nu, sunt alt elev</b>.</p>
${IMG.casete}
<p><b>Pe telefon</b>, după ce derulezi, caseta de jos se strânge într-o etichetă mică, jos în stânga. Când sub ea e o poză sau un buton, se face un buton rotund, jos în stânga sau în dreapta, ori se ascunde. Nu o vezi? Derulează puțin mai jos și reapare.</p>
<p>Gata? Jos trebuie să scrie <b>Profesorul vede activitatea ta</b>, cu numele tău. Uită-te și în căsuța <b>Numele tău, pentru diplomă</b>: dacă scrie alt nume, șterge-l și scrie-l pe al tău. Dacă lecția apare terminată, deși n-ai lucrat-o tu, apasă de două ori <b>Ia-o de la capăt</b>, mai jos.</p>
<p><b>Apoi începe:</b> apasă dreptunghiul mare pe care scrie <b>Lecția 1</b>. Pe calculator apeși cu un clic al mouse-ului, iar pe telefon atingi cu degetul.</p>
<p><b>Când pleci de la calculator:</b> apasă eticheta de jos, cu numele tău, apoi <b>Nu ești tu? Schimbă elevul</b>. Așa, următorul elev nu lucrează pe numele tău.</p>
<p><b>La final știi:</b> ce faci anul acesta, cum folosești butoanele unei lecții și cum se află nivelul și nota la o lucrare.</p>
<p><b>Ai nevoie de:</b> nimic din lecțiile de dinainte. Doar să citești, să miști mouse-ul și să faci clic.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 7 pași scurți. După fiecare, în afară de primul, faci un exercițiu mic, fără puncte.</li><li>La atelier ești în locul profesorului: afli nivelul unor elevi din lucrarea lor.</li><li>Acum la calculatorul din laborator: îți scrii regulile în caiet, de pe scaun.</li><li>Răspunzi la 5 întrebări de verificare. Pentru ele primești stele și puncte de joc (XP), nu note.</li></ol>`,
  banda:'<span class="cls">Informatică și TIC · clasa a V-a</span><span><b>De bază</b> <span class="sag">→</span> <b>Consolidat</b> <span class="sag">→</span> <b>Avansat</b></span>',

 pasi:[
  /* ---- pasul 1 (pasul 0 al standardului): la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: prima oră de informatică',
   text:`<p>Anul acesta ai o oră pe săptămână de <b>Informatică și TIC</b>. TIC înseamnă „tehnologia informației și a comunicațiilor”: calculatorul, telefonul și ce faci cu ele.</p>
<p>Înveți să le folosești cu cap: în siguranță, cu ordine, ca să afli lucruri adevărate și ca să faci lucruri ale tale, chiar și un joc.</p>
<p>Azi afli ce faci tot anul și după ce reguli se dau notele: <b>criteriile de evaluare</b>. Ele sunt aceleași pentru toată clasa. Le știi de la prima oră, nu abia după lucrare.</p>
<p>La prima oră dai la clasă și un <b>test de la început</b>. El nu se notează: îi arată profesorului de unde pleci.</p>
${IMG.laborator}`,

  {t:'Caseta „Încearcă tu”',
   text:`<p>Pagina aceasta e o <b>lecție pe pași</b>: o citești bucată cu bucată. Un <b>buton</b> e un dreptunghi cu text: pe calculator îl apeși cu un clic, pe telefon îl atingi cu degetul.</p>
<p>Sub pașii care te învață ceva e caseta <b>Încearcă tu</b>, cu un exercițiu mic, fără puncte. Răspunzi în patru feluri:</p>
<ul><li>apeși pe răspunsul bun;</li>

<p>La ultimele trei, la final apeși <b>Verifică</b>. Ai răspuns bine? Scrie <b>Corect</b>. Ai greșit? Scrie „Nu încă”.</p>`,
   exemplu:`${IMG.incearca}<p>Nu știi cum să începi? Apasă <b>Am nevoie de un indiciu</b>: primești un ajutor mic. Dacă greșești, indiciul apare singur. După două greșeli poți vedea răspunsul, cu explicația.</p>`,
   altfel:`<p>E ca într-o carte cu exerciții. Citești o lecție scurtă, apoi faci exercițiul de sub ea. Dacă te blochezi, cauți ajutorul din carte: aici, butonul „Am nevoie de un indiciu”. Ca să afli dacă ai răspuns bine, nu mai cauți la sfârșitul cărții: apeși „Verifică”.</p>`,
   incearca:{t:'classify',q:'Fiecare rând de mai jos e o situație. Alege pe fiecare rând numele butonului pe care l-ai apăsa. La final apasă butonul albastru „Verifică”, de sub rânduri.',cats:['„Verifică”','„Am nevoie de un indiciu”','„Golește”'],
    items:[['Ai ales ceva pe fiecare rând și vrei să afli dacă e bine',0],['Citești exercițiul și nu știi deloc cum să-l începi',1],['Ai apăsat bucățile în ordine greșită și vrei s-o iei de la capăt',2],['Ai legat toate perechile și vrei să afli dacă sunt bune',0]],
    ajutor:'„Verifică” îți spune dacă ai răspuns bine. Indiciul te ajută să începi. „Golește” scoate bucățile puse în ordine, ca s-o iei de la capăt.',
    why:'Când ai ales pe toate rândurile sau ai legat toate perechile, apeși „Verifică”: el îți spune dacă e bine. Când nu știi cum să începi, ceri indiciul. Când ai pus bucățile în ordine greșită, „Golește” le scoate și o iei de la capăt.'},

   text:`<p>Sub fiecare pas sunt butoanele cu care mergi prin lecție:</p>

  /* ---- pasul 4: planul anului pe unități (unitati.json); legătura cu cele cinci module ale paginii clasei (J03) ---- */

   text:`<p>Anul are șase <b>unități</b>, capitole mari. Ultima lecție din fiecare e o lucrare.</p>
<ol class="an">

<li><b>Ordine în calculator</b> <span class="l">lecțiile 8–12</span>: îți ordonezi pozele și temele, ca să le găsești repede.</li>
<li><b>Informații de pe internet</b> <span class="l">lecțiile 13–17</span>: vei învăța să cauți în siguranță lucruri adevărate.</li>
<li><b>Desene pe calculator</b> <span class="l">lecțiile 18–23</span>: faci singur felicitări și afișe.</li>

</ol>`,
   exemplu:`<p><b>Cum citești o unitate:</b> „Desene pe calculator, lecțiile 18–23”. La lecțiile 18–22 înveți și exersezi. Lecția 23, ultima, e lucrarea. Lecția de azi și lecția 36 stau deoparte: prima deschide anul, a doua îl încheie, cu unde ai ajuns.</p><p><b>Unitățile nu sunt modulele.</b> Pe pagina <b>Toate lecțiile clasei</b>, lecțiile sunt așezate pe cinci <b>module</b>, bucățile anului școlar dintre vacanțe. Modulul 2, de exemplu, are lecțiile 8–15: o unitate întreagă și începutul alteia. Lucrările vin la sfârșitul unităților.</p>`,
   altfel:`<p>E ca un manual cu șase capitole, într-un an școlar pe care vacanțele îl taie în cinci bucăți. Un capitol poate începe înainte de o vacanță și se poate termina după ea. Testul vine la sfârșitul capitolului, nu înainte de vacanță.</p>`,
   incearca:{t:'match',q:'În ce unitate înveți fiecare lucru? Apasă întâi un rând din lista „Apasă întâi aici…”, apoi perechea lui din lista „…apoi perechea”. La final apasă „Verifică”.',

    {t:'order',q:'Pune în ordine aceste unități, de la prima la ultima.',items:['Calculatorul, în siguranță','Ordine în calculator','Desene pe calculator','Primul tău joc'],

  /* ---- pasul 5: cele trei niveluri (fișa din caiet §2; aceleași cuvinte ca la lecția 7) ---- */
  {t:'Cele trei niveluri',
   text:`<p>La tot ce înveți, profesorul se uită la <b>ce știi să faci</b>, nu la cât ai scris. <mark>Nivelurile</mark> sunt trei, ca trei trepte:</p>
<ul class="niveluri"><li>${NIV.b} rezolvi dacă ai un model sau pașii dați, la lucruri pe care le-ai mai făcut;</li>
<li>${NIV.c} rezolvi <b>singur</b> lucruri de felul celor exersate;</li>
<li>${NIV.a} rezolvi <b>singur</b> o situație pe care n-ai mai văzut-o și poți explica de ce ai făcut așa.</li></ul>
<p>Urci pe rând: întâi De bază, apoi Consolidat, apoi Avansat. Între Consolidat și Avansat, diferența e <b>situația nouă</b>, nu cât de mult muncești.</p>`,
   exemplu:`<p><b>Înmulțirea, pe trei niveluri:</b></p><ul><li>${NIV.b} doamna îți arată pe tablă cum se face 7 × 8, pas cu pas, iar tu faci la fel 6 × 8: ai modelul în față.</li><li>${NIV.c} afli singur cât fac 6 × 9, ca la exercițiile din tema de ieri.</li><li>${NIV.a} afli singur cât costă 7 caiete de câte 8 lei, o problemă pe care n-ai mai văzut-o, și explici cum ai socotit.</li></ul>`,
   altfel:`<p>E ca atunci când înveți bicicleta. La început mergi doar cu cineva care ține de șa sau îți spune ce să faci: De bază. Apoi mergi singur, pe aleea pe care ai exersat: Consolidat. Apoi mergi singur pe un drum nou și îi poți explica fratelui mai mic cum ții echilibrul: Avansat.</p>`,

  /* ---- pasul 6: lucrarea, pe părți, și nivelul din puncte (fișa din caiet §3-§4; SISTEM_EVALUARE §4.1-4.2) ---- */
  {t:'Lucrarea: trei părți și nivelul tău',
   text:`<p>Ultima lecție din fiecare unitate e o <b>lucrare</b>, pe foaie sau la calculator. Are câte o parte pentru fiecare nivel. Fiecare parte are un <b>prag</b>: câte puncte îți trebuie ca s-o treci.</p>

<tr><td><b>A · De bază</b><br><span class="mic">ca la clasă, cu model</span></td><td class="nr">40</td><td class="nr">27</td></tr>
<tr><td><b>B · Consolidat</b><br><span class="mic">singur, o situație cunoscută</span></td><td class="nr">30</td><td class="nr">20</td></tr>
<tr><td><b>C · Avansat</b><br><span class="mic">o situație nouă și explicația ta</span></td><td class="nr">20</td><td class="nr">14</td></tr>
<tr><td>din oficiu<br><span class="mic">le primește oricine</span></td><td class="nr">10</td><td></td></tr>
<tr class="tot"><td>Total</td><td class="nr">100</td><td></td></tr></tbody></table>
<p>Nivelul îl afli urcând de la partea A: te oprești la prima parte care nu ajunge la prag. Pentru nivel, totalul nu contează. „Cel puțin 27” înseamnă 27 sau mai mult.</p>`,
   exemplu:`<p><b>Lucrarea Mariei:</b> A 31, B 21, C 6, din oficiu 10; total 68.</p><ol><li>A are 31, cel puțin 27: da, De bază.</li><li>B are 21, cel puțin 20: da, Consolidat.</li><li>C are 6, nu are 14: te oprești.</li></ol><p>Nivelul Mariei: <b>Consolidat</b>.</p>`,
   altfel:`<p>E ca la o scară. Urci treaptă cu treaptă și nu poți sări peste una. Chiar dacă partea C e bună, fără partea B nu ajungi la Avansat. Te oprești la prima treaptă care lipsește.</p>`,
   incearca:{t:'choice',q:'Tudor are la lucrare: partea A 30 de puncte, partea B 17, partea C 15. Câte puncte i-au lipsit la partea B ca să atingă nivelul Consolidat?',o:['3 puncte','13 puncte','2 puncte','Niciunul'],ok:0,
    ajutor:'Care e pragul părții B? Cât are Tudor? Scade.',
    why:'Pragul părții B e 20 de puncte. Tudor are 17, deci i-au lipsit 20 − 17 = 3 puncte. Așa, deși partea C are 15, Tudor rămâne la De bază.'},
   inca:[
    {t:'choice',q:'Ilinca are la lucrare: partea A 30 de puncte, partea B 25, partea C 9. Ce nivel a atins?',o:['Consolidat','Avansat','De bază','Niciun nivel'],ok:0,
     ajutor:'Urcă pe rând: A are cel puțin 27? B are cel puțin 20? C are cel puțin 14?',
     why:'A are 30, cel puțin 27: De bază. B are 25, cel puțin 20: Consolidat. C are 9, mai puțin de 14: aici te oprești. Nivelul Ilincăi e Consolidat.'},
    {t:'classify',q:'Cerințele de mai jos sunt dintr-o lucrare despre citirea orei. În ce parte a lucrării e fiecare? Alege pe fiecare rând, apoi apasă „Verifică”.',cats:['A · De bază','B · Consolidat','C · Avansat'],
     items:[['„Uite cum se citește ora pe acest ceas. Citește la fel ora pe ceasul de alături.”',0],['„Citește fără ajutor ora pe cinci ceasuri, ca pe fișa de la clasă.”',1],['„Ceasul din gară arată ora altfel decât ai învățat. Citește ora și scrie cum ți-ai dat seama.”',2],['„Ai o fișă cu instrucțiunile scrise una sub alta. Urmează-le și citește ora pe ceasul de pe perete.”',0]],
     ajutor:'Cerința îți dă un model sau pașii? Te lasă singur cu ceva exersat? Îți dă ceva nou și îți cere să explici?',
     why:'Cerințele care îți arată întâi cum se face sau îți dau instrucțiunile una sub alta sunt în partea A (De bază). Cele cinci ceasuri, ca pe fișa de la clasă, citite fără ajutor, sunt în partea B (Consolidat). Ceasul nou din gară, cu explicația ta scrisă, e în partea C (Avansat).'},
    {t:'choice',q:'Ioana are la lucrare 30 de puncte la partea A, 24 la partea B și 10 la partea C. Câte puncte are în total, cu cele din oficiu?',o:['74','64','84','100'],ok:0,

  /* ---- pasul 7: de la nivel la notă (fișa din caiet §4-§6; SISTEM_EVALUARE §3, §4.3; J16: procedura a doua are pasul ei;
     J04: foile generate de print_engine.py scriu „Nota = punctaj : 10” și literele B/C/A — spus cinstit, fără să schimbăm foile) ---- */
  {t:'De la nivel la notă',
   text:`<p>Nivelul îți dă nota. Fiecare nivel are două note:</p>
<table class="tab-lucr"><thead><tr><th>Nivelul</th><th>Nota</th></tr></thead><tbody>
<tr><td>Avansat</td><td class="nr">9 sau 10</td></tr>
<tr><td>Consolidat</td><td class="nr">7 sau 8</td></tr>
<tr><td>De bază</td><td class="nr">5 sau 6</td></tr>
<tr><td><b>În formare</b>: A n-are pragul, dar are cel puțin 14</td><td class="nr">3 sau 4</td></tr>
<tr><td><b>În dificultate</b>: A are sub 14</td><td class="nr">1 sau 2</td></tr></tbody></table>
<p>Care dintre cele două, alege profesorul după totalul punctelor. Sub De bază primești și un <b>plan de recuperare</b>: pașii prin care prinzi din urmă.</p>
<p>Pe an iei 9 note: 6 din lucrări, 2 din proiecte (lucruri făcute de tine la oră) și 1 din portofoliu (mapa cu fișele și temele). Copiatul la lucrare înseamnă nota 1.</p>`,
   exemplu:`<p><b>Paul:</b> A 20, B 26, C 12. A n-are pragul, dar are cel puțin 14: <b>În formare</b>, nota 3 sau 4.</p><p><b>Pe foile de lucru</b> poate scrie „Nota = punctaj : 10”. La noi, nota vine din nivel.</p><p><b>Litera din bulina de lângă o cerință</b> (ca în „B (15 p)”) nu e partea lucrării. Ea arată nivelul cerinței: B = De bază, C = Consolidat, A = Avansat. Deci cerințele din partea A au în bulină litera B.</p>`,
   altfel:`<p>Gândește-te la cinci cutii, câte una pentru fiecare treaptă. În fiecare cutie sunt două note. Întâi afli în ce cutie ești, după nivel. Abia apoi profesorul alege una dintre cele două note din cutie.</p>`,
   incearca:{t:'choice',q:'Sara are la lucrare: partea A 24 de puncte, partea B 28, partea C 18. Ce notă poate primi?',o:['nota 3 sau nota 4','nota 9 sau nota 10','nota 7 sau nota 8','nota 5 sau nota 6'],ok:0,
    ajutor:'Întâi nivelul: partea A are pragul de 27? Dacă nu, are măcar 14? Apoi caută nivelul în tabel.',
    why:'Partea A are 24, sub pragul de 27: Sara nu a atins De bază, deși B și C sunt bune. A are cel puțin 14, deci e În formare: nota 3 sau 4, plus un plan de recuperare.'},
   inca:[
    {t:'choice',q:'Victor a atins nivelul De bază. Ce notă poate primi?',o:['5 sau 6','7 sau 8','3 sau 4','9 sau 10'],ok:0,
     ajutor:'Fiecare nivel are două note. Care sunt ale nivelului De bază?',
     why:'Nivelul De bază dă nota 5 sau 6. Consolidat dă 7 sau 8, Avansat 9 sau 10, iar În formare 3 sau 4.'},
    {t:'tf',q:'Testul de la începutul anului îți aduce prima notă în catalog.',ok:false,

 /* ---- ATELIERUL: simulatorul „lucrare”, pe lucrări inventate, cu testele numite ---- */
 atelier:{t:'lucrare',titlu:'Atelier: afli nivelul din lucrare',
  intro:`<p><strong>Sarcina:</strong> acum ești în locul profesorului. Vezi lucrarea corectată a unui elev, cu punctele de la fiecare parte. Afli ce nivel a atins și ce notă poate primi.</p>
<ol><li>Citește punctele de pe foaie.</li>
<li>La rândurile 1, 2 și 3 apasă <b>Da</b> sau <b>Nu</b>: are partea cel puțin cât trebuie?</li>
<li>La rândul 4 alege nivelul. Te oprești la primul „Nu”. Dacă partea A n-are 27: <b>În formare</b>, dacă are măcar 14, altfel <b>În dificultate</b>.</li>
<li>La rândul 5 alege nota care merge cu nivelul.</li>
<li>Apasă <b>Verifică</b>. Testele de sub foaie se bifează.</li>
<li>După ce ai reușit, apasă <b>Încă un exercițiu</b>: vine lucrarea altui elev.</li></ol>
<p>Uită-te și la total: doi elevi cu același total pot avea niveluri diferite.</p>`,

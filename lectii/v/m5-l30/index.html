/* Lecția 30, clasa a V-a (M5, EVALUARE SUMATIVĂ): „Evaluare sumativă: algoritmi în limbaj natural”, ultima lecție din V-U5.
   Legea: LearningHub\_campaign\revizuire_completa_2026_09\00_GHID_LECTII.md (I, IV.2 §6-7). Sursele, deciziile, probele: surse.md, _proba\.

   Activitatea profesorului (Info_Gimnaziu_2026\data\activitati_lectii_V_VI.json, întocmai): „Probă scrisă: analiza datelor unei
   probleme, scrierea unui algoritm cu secvență și decizie, urmărirea lui pas cu pas pentru date date. Cerințe pe cele trei niveluri.”

   Simulatoarele: cutii-variabile.js (V/26), evaluare-expresii.js (V/27), secventa-liniara.js (V/28), urmarire-decizie.js (V/29),
   neschimbate; NOU, al lecției: lectii/_sim/eval-algoritmi-v.js (punctele la prima verificare, panoul, algoritmul din cartonașe, cu decizie).
   Scrierea LIBERĂ nu se notează automat: stă în laborator (Notepad / caiet), o verifică elevul și o arată profesorului; pagina o spune.
   Notepad NU a fost pornit: faptele vin din lecțiile publicate V/15 și V/28. Granița: m5_noapte_08_11\granite\v_l30.md.
   Trimiterile la pașii lecțiilor publicate: numele pasului + „pasul k din n”, ?vezi=pk (doar de citit). */

const fig=(src,w,h,alt,cap,cls)=>`<figure class="captura${cls?' '+cls:''}"><a href="${src}" target="_blank"><img src="${src}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;

const L1=VEZI(1,'m1-l01',8,10,'Lucrarea: trei părți și nota ta');

/*ALG-START*/
const C=x=>({citeste:x}),K=(e,x)=>({calc:e,in:x}),AF=x=>({afis:x}),AT=x=>({afisText:x}),D=(c,a,b)=>({daca:c,atunci:a||[],altfel:b||[]});

const ALG_TUR={cutii:['vârsta','bani','rest'],pasi:[C('vârsta'),C('bani'),D('«vârsta» < 10',[K('«bani» − 5','rest')],[K('«bani» − 8','rest')]),AF('rest')]};
/* P5 „Încearcă” */
const ALG_SCURT={cutii:['puncte'],pasi:[C('puncte'),D('«puncte» ≥ 5',[AT('Ai trecut')],[AT('Mai exersezi')])]};
/* B2: cărțile */
const ALG_CARTI={cutii:['bani','cărți','cost'],pasi:[C('bani'),C('cărți'),K('«cărți» * 9','cost'),D('«cost» ≤ «bani»',[AT('Cumpăr cărțile')],[AT('Nu ajung banii')])]};

const ALG_LIM={cutii:['bani','pahare','cost'],pasi:[C('bani'),C('pahare'),K('«pahare» * 3','cost'),D('«cost» ≤ «bani»',[K('«bani» − «cost»','bani')],[AT('Nu ajung banii')]),AF('bani')]};

const PRAJ=[C('bani')];
const PRAJ_SOL=[C('bani'),D('«bani» ≥ 4',[AT('Cumpăr')],[AT('Nu ajung banii')])];

const BUS_SOL=[C('elevi'),D('«elevi» ≤ 30',[AT('Un autobuz')],[AT('Două autobuze')])];
/* C2: biletele */
const C2_PUNE={pune:7,in:'preț'},C2_COST=K('«bilete» * «preț»','cost'),C2_REST=K('«bani» − «cost»','rest');
const C2_SOL=[C('bilete'),C2_PUNE,C('bani'),C2_COST,C2_REST,AF('rest')];
const C2_START=[C('bilete'),C('bani'),AF('rest'),C2_REST,C2_COST,C2_PUNE];
/* B1: patinoarul */
const B1_SOL=[C('vârsta'),C('bani'),D('«vârsta» < 12',[K('«bani» − 8','rest')],[K('«bani» − 12','rest')]),AF('rest')];
/* A1: bicicletele */
const A1_SOL=[C('grade'),D('(«grade» ≥ 10) și («grade» ≤ 30)',[AT('Plecăm')],[AT('Rămânem')])];
/*ALG-END*/
const TU=o=>Object.assign({t:'tabel-urmarire'},o);
const SCR=o=>Object.assign({t:'scrie'},o);
const PSC=o=>Object.assign({t:'probascrie'},o);
const CS=x=>({f:'citeste',c:x}),KS=(e,x)=>({f:'calc',e,c:x}),AS=x=>({f:'afiseaza',c:x});

  itemi:[{id:'C1',parte:'C',puncte:12},{id:'C2',parte:'C',puncte:14},{id:'C3',parte:'C',puncte:14},

  dupaFinal:'<p><b>Mai departe:</b> <b>Acum la calculator</b>, dacă mai ai timp: un algoritm scris de tine, în Notepad (pe telefon, în caiet); apoi cele 5 întrebări.</p>'});

/* „Acum la calculator” — FĂRĂ profesor, pe calculatorul comun. Notepad nu s-a pornit: faptele din V/15 (A17, A24, A27, A55) și V/28.
   Scrierea e LIBERĂ: n-o judecă nimic automat; elevul o verifică pe date și o arată profesorului. La sfârșit: doar fișierul de azi. */

  '<b>Notepad.</b> E deschis de la pasul <i>Urmărirea pas cu pas: tabelul</i>? Treci la punctul 2. Nu? <b>Start</b>, scrie <code>note</code>, clic pe <b>Notepad</b> (fila altcuiva? <b>+</b>, sus) și scrie <code>1. Citește gradele apei.</code>, apoi Enter.',
  '<b>Problema:</b> intri în apă doar dacă apa are cel puțin 24 de grade. Algoritmul citește gradele apei și afișează „Intru în apă” sau „Stau pe mal”. <b>Scrie restul:</b> <code>2. Dacă gradele sunt cel puțin 24 atunci</code>; dedesubt, pașii ramurilor, cu 4 spații în față (tasta lungă de jos); <code>altfel</code>, singur pe rând, fără număr. Nu-ți ies ghilimelele sau ș, î, â? Scrie fără ele.',
  '<b>Fii tu robotul.</b> În caiet, scrie traseul pentru 30 de grade, pentru 15 și pentru 24. Ce nu merge, repari în Notepad.',
  '<b>Salvează:</b> clic în Notepad, apoi Ctrl+S. În <b>Salvare ca</b>, cât numele propus e colorat, scrie <code>Nume_Prenume_&lt;clasa ta&gt;_algoritm</code> (ca <code>Pop_Ana_5A_algoritm</code>), alege în stânga <b>Documente</b>, apoi <b>Salvare</b>. Există deja? <b>Nu (sau Anulare)</b> și adaugă o cifră la sfârșit.',
  '<b>Arată-l profesorului.</b> E lângă tine? Arată-i ecranul. Nu e? Copiază algoritmul în caiet și îl arăți când poate.',
  '<span class="mai-ai-timp"><b>Dacă mai ai timp:</b> sub algoritm, scrie o propoziție: <code>Am ales condiția ... pentru că ...</code> Apoi clic în Notepad și Ctrl+S.</span>',
  '<b>La sfârșitul orei</b> (chiar dacă n-ai terminat): în Notepad, <b>Fișier</b> › <b>Închideți fila</b> (pe Windows 10: X); la întrebare, <b>Nu salvați</b> (sau <b>Nu salva</b>). Apoi, dacă l-ai salvat: Explorer, <b>Documente</b>, clic pe fișierul TĂU de azi (începe cu numele tău, conține <code>_algoritm</code>, poate și o cifră), tasta <b>Delete</b>. Felicitarea, afișul și stelele de la lecțiile 22, 23 și 25 nu le atingi. Nu goli Coșul.'

  ancoraText:'Din programă (CS.2.1-2.3, unitatea V-U5, lecția 30): evaluarea unității — datele cu care lucrează algoritmii, expresiile, structura secvențială (liniară) și structura alternativă (decizională), în limbaj natural',
  intro:`<p><b>Ai nevoie de:</b> lecțiile 25-29 (cele trei întrebări, datele, expresiile, pașii <b>Citește</b> / <b>Calculează</b> / <b>Afișează</b>, decizia, tabelul de urmărire) și lecția 1 (părțile lucrării și nota). Pentru laborator: <b>Notepad</b> (lecțiile 15 și 28).</p>`,
  cum:`<b>Cum lucrezi</b><ol><li><b>În oră:</b> 6 pași scurți (cam 17 minute), apoi proba de antrenament (cam 28 de minute).</li><li><b>La calculator, dacă mai ai timp</b> (altfel, ora viitoare): un algoritm în Notepad, cam 10 minute.</li><li>5 întrebări (cam 4 minute).</li></ol><p><b>Când mai sunt 10 minute din oră:</b> treci la întrebări; la calculator, ultimul punct (închizi Notepad; dacă l-ai salvat, ștergi fișierul de azi).</p>`,
  banda:'<span class="bd-t">Ce se dă → pașii → tabelul de urmărire</span><span class="bd-z">C 40 · B 30 · A 20 · 10 din oficiu · nota = punctaj : 10</span>',
  nivele:[
{t:'Evaluare sumativă: algoritmi în limbaj natural',final:true,lectii:[24,25,26,27,28,29,30],
 /* textele EXACTE din programă (curriculum.json); ultimul e lipit acolo de „Medii grafice interactive…” (V-U6), ca la V/29: poarta cere
    textul întreg, iar lecția evaluează doar prima parte (surse.md) */

 pasi:[

   text:`<p>La casa la care plătești singur, aparatul urmează un algoritm: citește prețurile, calculează totalul, apoi decide: s-a plătit tot? Îți dă bonul. Nu? Îți cere ce mai ai de plătit.</p>
<p>La sfârșitul unității arăți, la o probă scrisă, că știi și tu. Azi nu afli nimic nou: te antrenezi. Testul exact îl primești la oră.</p>
${IMG.casa}`},

   text:`<p>Cerința profesorului: <i>„Probă scrisă: analiza datelor unei probleme, scrierea unui algoritm cu secvență și decizie, urmărirea lui pas cu pas pentru date date. Cerințe pe cele trei niveluri.”</i> „Date date” sunt valori pe care le primești.</p>

   incearca:{t:'choice',q:'Proba de antrenament a Anei: partea C 28 de puncte, partea B 19, partea A 7. Ce notă are?',o:['nota 6','nota 5','nota 7','nota 8'],ok:0,

    why:'28 + 19 + 7 + 10 = 64 de puncte: 6 zeci, iar ultima cifră, 4, e sub 5, deci nota 6. Fără oficiu (54) ar fi ieșit 5.'}},
  /* ---- pasul 3: analiza datelor = tabelul de analiză de la V/26, aceleași coloane; simulatorul V/26 ---- */
  {t:'Analiza datelor: ce se dă, ce se cere, ce afli pe parcurs',
   text:`<p>La probă primești o problemă. Întâi îi afli datele, în <b>tabelul de analiză</b>:</p>
<ul class="feluri"><li><b>Ce se dă</b> = datele de intrare: sunt scrise în enunț;</li><li><b>Ce se cere</b> = datele de ieșire: e întrebarea problemei;</li><li><b>Ce se calculează pe parcurs</b> = datele de manevră: le află un pas, iar un pas de mai târziu le folosește.</li></ul>`,
   exemplu:`${CV.tabel(SUC,{pasi:false})}<p>„Cât costă sticlele” nu e în enunț și nu e răspunsul: un pas îl află, alt pas îl folosește.</p>`,
   altfel:`<p>Înainte să pleci la cumpărături, te uiți ce ai în buzunar și ce ai de luat (ce se dă), te întrebi cât îți rămâne (ce se cere) și socotești pe drum cât costă totul (pe parcurs). Recitește ${L26}.</p>`,
   incearca:{t:'choice',q:'Problema: „Un plic are 5 abțibilduri. Ioana cumpără 4 plicuri și îi dă fratelui ei 3 abțibilduri. Câte abțibilduri îi rămân?” Algoritmul află întâi câte abțibilduri a cumpărat. Ce fel de dată e aceasta?',
    o:['de manevră','de intrare','de ieșire','constantă'],ok:0,
    ajutor:'E scrisă în enunț? E întrebarea? O află un pas pentru alt pas?',

  /* ---- pasul 4: cum arată un algoritm bun + gestul cartonașelor (doar interfața e nouă; ideile sunt de la V/28-29) ---- */
  {t:'Scrierea algoritmului: secvență și decizie',
   text:`<p>Un algoritm bun are:</p>
<ol class="reguli"><li>pașii numerotați, câte o acțiune pe pas;</li><li><b>Citește</b> pentru fiecare dată de intrare, de obicei la început; apoi calculele, în ordine;</li><li>decizia: <b>Dacă</b> condiție <b>atunci</b> … <b>altfel</b> …, cu pașii ramurilor mai la dreapta; condiția poate fi și o expresie cu „și”, „sau”, ca la lecția 27;</li><li>la sfârșit, <b>Afișează</b> exact ce se cere.</li></ol>
<p>În pagină îl faci din cartonașe. „Dacă…” aduce decizia. Un pas intră în ramură cu ↑: de sub decizie urcă în „altfel”, apoi, rând cu rând, în „atunci”.</p>`,
   exemplu:`<p>Un tur de carusel costă 5 lei sub 10 ani și 8 lei de la 10 ani în sus. Algoritmul află restul:</p>${UD.algoritmHtml(ALG_TUR)}<p>Pașii 1, 2 și 6 se fac la orice date; decizia alege doar ramura.</p>
${ACUM('Pornește Notepad: <b>Start</b>, scrie <code>note</code>, clic pe <b>Notepad</b>. Textul altcuiva? <b>+</b>, sus. Lasă-l deschis. Pe telefon: nimic de făcut aici.')}
${IMG.notepad}`,
   altfel:`<p>E ca atunci când îi lași unui coleg un bilet: întâi ce are de aflat, apoi ce face într-un caz și în celălalt, la urmă ce îți spune. Robotul face exact ce scrie, deci biletul trebuie să fie complet. Recitește ${L29_DEC}.</p>`,
   incearca:SCR({q:'O prăjitură costă 4 lei. Algoritmul primește «bani» și afișează „Cumpăr” dacă banii ajung, altfel „Nu ajung banii”. Atinge „Dacă…”, apoi celelalte cartonașe; du-le în ramuri cu ↑.',
    cutii:['bani'],alg:PRAJ,cartonase:[AT('Nu ajung banii'),D('«bani» ≥ 4'),AT('Cumpăr')],
    cazuri:[{intrari:{bani:10},asteapta:['Cumpăr']},{intrari:{bani:4},asteapta:['Cumpăr']},{intrari:{bani:3},asteapta:['Nu ajung banii']}],
    teste:[{k:'afis',cazuri:[0,1],ce:'Când banii ajung, se afișează ce trebuie',sfat:'Pasul cu „Cumpăr” stă în ramura „atunci”: condiția e adevărată când banii ajung.'},
           {k:'afis',cazuri:[2],ce:'Când banii nu ajung, se afișează ce trebuie',sfat:'Pasul cu „Nu ajung banii” stă în ramura „altfel”.'}],

    why:'4 ≥ 4 e adevărat, deci și cu exact 4 lei cumperi. „Cumpăr” stă în ramura „atunci”, iar „Nu ajung banii” în ramura „altfel”.'}),

            {k:'afis',cazuri:[1],ce:'Cu exact 30 de elevi, se afișează ce trebuie',sfat:'În autobuz încap 30: ce semn primește și „egal”?'},

   text:`<p>Un algoritm dat îl urmărești în <b>tabelul de urmărire</b>:</p>

  {t:'Verifică-ți singur lucrarea',
   text:`<p>Pui cele trei întrebări: <b>Se înțelege fiecare pas într-un singur fel? Se oprește? Merge pentru toate cazurile de același fel?</b> (lecția 25).</p>

   exemplu:`<p>Caruselul scris cu „≤” în loc de „&lt;”: cu 8 și cu 12 pentru «vârsta» scade ce trebuie, deci pare bun. Cu 10, numărul din condiție, 10 ≤ 10 e adevărat, deci scade 5 în loc de 8.</p>`,
   altfel:`<p>E ca atunci când verifici dacă un scaun e bun: nu doar te uiți la el, ci te și așezi. Așa și algoritmul: îl încerci pe date, mai ales pe cele aflate chiar la graniță. Cele trei întrebări: ${L25}.</p>`,
   incearca:{t:'choice',q:'Condiția corectă e «vârsta» &lt; 14. Cineva a scris «vârsta» ≤ 14. Cu ce vârstă se vede greșeala?',o:['14 ani','8 ani','20 de ani','cu nicio vârstă'],ok:0,html:true,
    ajutor:'La care vârstă dau cele două condiții răspunsuri diferite?',why:'14 &lt; 14 e fals, dar 14 ≤ 14 e adevărat: la 14 ani algoritmul greșit merge pe altă ramură. La 8 și la 20 de ani, cele două condiții dau același răspuns.'}}

 atelier:{t:'probadate',titlu:'Atelier: proba de antrenament',proba:'C1',lectia:L26,
  intro:`<p><strong>Proba de antrenament</strong> (nu intră în catalog). Întâi spune cine ești, în caseta de jos.</p>

   {t:'probaurm',proba:'C3',lectia:L28_TAB,q:'<b>C3 · Tabelul de urmărire</b> (14 p), cu pașii dați. Mara află câte pagini mai are de citit.',

           {k:'rez',cazuri:[1],puncte:3,ce:'Când e prea frig, se afișează ce trebuie',sfat:'Prea frig: robotul trebuie să ajungă pe ramura cu „Rămânem”.'},

<p class="galerie-credit">${credit}</p>`;

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).

const LABORATOR=[
  'Stai pe scaun, la locul tău, cu caietul de informatică și un pix. <b>Nu atingi cablurile și prizele și nu desfaci nimic</b> (regula din lecția 2). Azi te uiți în jur de pe scaun și scrii în caiet.',
  'Scrie în caiet titlul <b>Sisteme de calcul în jurul meu</b>. Sub el vei scrie trei sisteme de calcul. Lângă fiecare scrii trei lucruri: <b>ce date primește</b>, <b>cum le prelucrează</b> și <b>ce rezultat dă</b>.',
  'Primul e chiar calculatorul tău. Gândește-te la atelierul de adineauri: ai pus etichetele, apoi ai apăsat „Verifică etichetele”. Scrie ce date a primit calculatorul, ce a făcut cu ele și ce rezultat ți-a dat.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Date: etichetele puse de tine pe fotografie și apăsarea pe „Verifică etichetele”. Prelucrare: programul paginii a comparat etichetele tale cu cele bune. Rezultat: pe ecran au apărut testele bifate și mesajul pentru tine.</details>',
  'Uită-te în jur, de pe scaun, fără să te ridici. Mai caută două sisteme de calcul în laborator, de exemplu imprimanta sau videoproiectorul, dacă sunt. Dacă nu găsești două, scrie unul de acasă: telefonul, televizorul inteligent (pe care alegi filme cu telecomanda) sau mașina de spălat cu programe. Scrie-le cu metoda detectivului: ce date primesc, cum le prelucrează, ce rezultat dau.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Imprimanta: primește textul trimis de la calculator, pregătește pagina după programul ei și scoate foaia tipărită. Videoproiectorul: primește imaginea de la calculator, o potrivește după programul lui și o arată mare pe perete. Mașina de spălat cu programe: primește programul ales de tine, hotărăște cât timp și cât de repede se învârte și, la final, rufele sunt spălate. Nu găsești programul după care lucrează? Poate nu e sistem de calcul.</details>',
  'Pune litera <b>C</b> lângă sistemele tale care sunt și de comunicații: trimit sau primesc date de la distanță, adică din altă cameră sau din alt oraș. Aparatul de lângă, legat cu un cablu, nu e departe.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>Calculatorul tău: dacă ai deschis lecția de pe internet, ea a venit la el de departe, de la alt calculator: C. Dacă lecția e o copie pusă chiar pe calculatorul tău, fără nicio legătură cu ceva departe: fără C. Oricare e bună, dacă ai scris de ce. Imprimanta și videoproiectorul legate cu un cablu de calculatorul de lângă: fără C; imprimanta care primește foi din altă cameră: C. Telefonul și televizorul inteligent: C. Mașina de spălat obișnuită: fără C.</details>',
  'Sub cele trei sisteme, scrie din minte, fără să te uiți în pagină și nici la banda de sus, cele șapte momente din evoluția calculatoarelor, în ordine. Apoi deschide „Verifică-te”.<details class="verif"><summary>Verifică-te, după ce ai scris</summary>1. abacul; 2. mașinile de calcul mecanice, cu roți dințate (Pascal, 1642); 3. primele calculatoare electronice, anii 1940–1950 (ENIAC); 4. circuitul integrat, anii 1960–1970; 5. calculatorul personal (PC), anii 1980–1990; 6. telefonul inteligent, după 2007; 7. azi, ceasurile și brățările inteligente.</details>',
  'Compară caietul tău cu al colegului de bancă. Unde nu sunteți de acord, recitiți pasul potrivit din pagina aceasta și hotărâți împreună.'

    {t:'choice',q:'Pe un calculator de buzunar apeși 7, apoi ×, apoi 6, apoi =. Pe ecran apare 42. Ce este 42?',o:['Rezultatul','Datele','Programul','Prelucrarea'],ok:0,
     ajutor:'Care din cele trei lucruri apare la final, după ce sistemul a lucrat?',
     why:'42 e rezultatul. Datele au fost 7, × și 6, apăsate de tine. Prelucrarea a fost înmulțirea, făcută după program.'}
   ]},
  /* ---- pasul 2: metoda detectivului; senzorul; întrerupătorul nu e ---- */
  {t:'Cum recunoști un sistem de calcul',
   text:`<p>Un sistem de calcul <strong>nu are neapărat</strong> tastatură sau ecran; unele n-au deloc ecran. Telefonul, bancomatul, ceasul inteligent și casa de marcat sunt tot sisteme de calcul.</p>
<p>Multe primesc datele de la un <mark>senzor</mark>: o piesă care simte ceva din jur, de exemplu greutatea sau căldura, și trimite mai departe ce a simțit.</p>
<p><strong>Metoda detectivului</strong>, pentru orice obiect:</p>
<ol><li>Primește date?</li><li>Le prelucrează după un program?</li><li>Dă un rezultat?</li></ol>
<p>Trei de „da”: este sistem de calcul. Un întrerupător nu este: doar închide și deschide curentul.</p>
${IMG.cantar}${IMG.intrerupator}`,
   exemplu:`<p>Cântarul de bucătărie din fotografie, cu metoda detectivului:</p><ol><li>Primește date? Da: în colțuri, patru senzori simt greutatea.</li><li>Le prelucrează după un program? Da: plăcuța verde transformă ce simt senzorii în grame.</li><li>Dă un rezultat? Da: numărul de pe ecran.</li></ol><p>Trei de „da”: cântarul este un sistem de calcul.</p>`,
   altfel:`<p>Un detectiv nu judecă după haine, ci după fapte. La fel faci tu: nu contează cum arată obiectul. Contează ce face: primește ceva, lucrează cu el după un program și dă ceva înapoi.</p>`,
   incearca:{t:'classify',q:'Folosește metoda detectivului. Este sau nu este sistem de calcul? Sortează.',cats:['Este sistem de calcul','Nu este'],
    items:[['Semaforul inteligent: un senzor simte mașinile care așteaptă, iar semaforul hotărăște singur când face verde',0],['Lampa de birou: apeși butonul și se aprinde becul',1],['Mașina de spălat cu programe: alegi un program, iar ea hotărăște singură cât timp se învârte',0],['Oglinda din baie: în ea vezi cum arăți',1]],
    ajutor:'Pune fiecăruia cele trei întrebări. Lampa seamănă cu întrerupătorul: ce face butonul ei? Oglinda lucrează după un program?',
    why:'Semaforul și mașina de spălat primesc date (ce simte senzorul, programul ales), le prelucrează după un program și dau un rezultat (lumina verde, spălarea cât trebuie). Butonul lămpii doar închide curentul, ca un întrerupător. Oglinda nu are program: nu prelucrează nimic.'},
   inca:[
    {t:'choice',q:'Aseară ai potrivit ceasul deșteptător cu cifre pe ecran să sune la 7:00. Azi-dimineață a sunat exact la 7:00. Ce date a primit ceasul?',o:['Ora aleasă de tine: 7:00','Sunetul de dimineață','Cifrele de pe ecran','Curentul de la baterie'],ok:0,
     ajutor:'Datele sunt ce îi dai tu sistemului, înainte să lucreze.',
     why:'Ora aleasă de tine sunt datele. Ceasul a comparat-o cu ora de acum, după programul lui: asta e prelucrarea. Sunetul de dimineață e rezultatul. Bateria îi dă curent, dar nu e o dată.'}
   ]},
  /* ---- pasul 3: sisteme de comunicații ---- */
  {t:'Sisteme de comunicații: date la distanță',
   text:`<p>Un <mark>sistem de comunicații</mark> duce date <strong>la distanță</strong>, adică departe: în altă cameră, în alt oraș. Aparatul de lângă el, legat cu un cablu, nu e departe. Un aparat poate trimite date, poate primi sau amândouă.</p>
<ul><li>Suni pe cineva: telefonul tău trimite vocea, iar telefonul lui o primește. Drumul trece pe la antene înalte.</li>
<li>GPS-ul din mașină primește semnale de la <strong>sateliți</strong>, aparate care se rotesc în jurul Pământului. Din ele socotește unde ești.</li>
<li>Bancomatul întreabă banca, departe, dacă ai bani în cont.</li></ul>
<p>Telefonul e și sistem de calcul, și sistem de comunicații.</p>
${IMG.comunicatii}`,
   exemplu:`<p>Plătești cu cardul la magazin:</p><ol><li>aparatul de plată citește ce e scris pe card și suma: sunt datele;</li><li>trimite datele la bancă, la distanță: aici lucrează comunicațiile;</li><li>banca le verifică și trimite înapoi răspunsul;</li><li>pe ecranul aparatului scrie că plata a reușit: e rezultatul.</li></ol><p>Ții minte de la lecția 1? TIC înseamnă „tehnologia informației și a comunicațiilor”.</p>`,
   altfel:`<p>Gândește-te la o scrisoare. Pleacă de la tine și ajunge la bunica, în alt oraș: poștașul o duce la distanță. Un sistem de comunicații face la fel cu datele, dar într-o clipă.</p>`,
   incearca:{t:'classify',q:'Aici, datele pleacă sau vin de la distanță? Sortează.',cats:['Da: e comunicație la distanță','Nu: totul se face pe loc'],
    items:[['Radioul din mașină prinde o melodie cântată la un post de radio din alt oraș',0],['Cuptorul electric se oprește singur după cele 30 de minute alese',1],['Bunica îți trimite de pe telefonul ei o poză cu pisica',0],['Mașina de spălat arată cât mai durează spălarea',1]],
    ajutor:'Întreabă-te: datele pleacă din aparat spre altul, departe? Vin de departe? Sau totul se întâmplă chiar în aparat?',
    why:'Melodia vine la radio de departe, iar poza pleacă de pe telefonul bunicii până la telefonul tău: acestea sunt comunicații. Cuptorul și mașina de spălat lucrează doar cu ce primesc chiar acolo, pe loc.'},
   inca:[
    {t:'order',q:'Îl suni pe vărul tău, care stă în alt oraș. Pune în ordine drumul vocii tale.',items:['Vorbești în telefonul tău','Telefonul tău trimite vocea spre o antenă','De la antenă, vocea pleacă departe, până la telefonul vărului','Vărul tău te aude'],
     ajutor:'Vocea pleacă de la tine și ajunge la el. Pe unde trece?',
     why:'Telefonul tău prinde vocea, o trimite spre o antenă, apoi e dusă la distanță până la telefonul vărului tău. Acolo, el o aude. Asta e comunicația.'}
   ]},
  /* ---- pasul 4: evoluția (1): abac, mașina lui Pascal, primele calculatoare electronice ---- */
  {t:'Momente din evoluție: de la abac la ENIAC',
   text:`<p>Oamenii au vrut mereu să socotească mai repede. Iată primele trei momente:</p>
<ol class="momente"><li><strong>Abacul</strong>: bile pe sârme, mutate cu mâna. Oamenii îl folosesc de mii de ani.</li>
<li>Mașinile de calcul <strong>mecanice</strong>, ca a lui Pascal: merg din piese care se mișcă, de exemplu roți dințate. Blaise Pascal a început-o în 1642, ca să-și ajute tatăl la socoteli. Mașina lui aduna și scădea, fără curent.</li>
<li>Primele calculatoare <strong>electronice</strong>, în anii 1940–1950. Mergeau cu curent electric și socoteau mult mai repede. ENIAC, unul dintre ele, lucra după un program și ocupa o cameră întreagă.</li></ol>
<p>Abacul și mașina lui Pascal nu au program: sunt unelte de socotit, strămoșii calculatoarelor.</p>
${IMG.vechi}`,
   exemplu:`<p>Aceeași adunare, 25 + 17, în trei feluri:</p><ul><li>pe abac, muți bilele cu mâna, iar socoteala o faci tu, în minte;</li><li>la mașina lui Pascal, învârți rotițele, iar roțile dințate țin singure „unul în minte”;</li><li>la ENIAC, oamenii îi dădeau programul, iar el socotea singur, cu curent electric.</li></ul>`,
   incearca:{t:'order',q:'Într-un muzeu au căzut etichetele. Pune obiectele în ordine, de la cel mai vechi.',items:['Rama de lemn cu bile pe sârme','Cutia de metal cu rotițe, care aduna și scădea fără curent','Șirul de dulapuri electrice care umplea o sală'],
    ajutor:'Care se folosea doar cu mâna? Care avea roți dințate? Care mergea cu curent electric?',
    why:'Rama cu bile e abacul, cel mai vechi. Cutia cu rotițe e o mașină mecanică, ca a lui Pascal, din 1642. Dulapurile electrice care umpleau o sală seamănă cu ENIAC, un calculator electronic din anii 1940–1950.'},
   inca:[
    {t:'choice',q:'Ce aveau în comun abacul și mașina lui Pascal?',o:['Mergeau fără curent electric','Socoteau singure, după un program','Ocupau o cameră întreagă','Aveau ecran'],ok:0,
     ajutor:'Dintre cele trei momente, care mergea cu curent electric?',
     why:'Abacul se mișcă din mână, iar mașina lui Pascal din rotițe: amândouă merg fără curent electric. Dintre cele trei momente, doar calculatoarele electronice, ca ENIAC, mergeau cu curent electric; ENIAC ocupa o cameră întreagă.'}
   ]},
  /* ---- pasul 5: evoluția (2): circuitul integrat, PC, telefonul inteligent, azi; „mai mici, mai rapide și conectate” ---- */
  {t:'Momente din evoluție: de la dulap la buzunar',
   text:`<p>Apoi calculatoarele s-au micșorat pas cu pas:</p>
<ol class="momente" start="4"><li>Anii 1960–1970: piesele electronice se micșorează, iar multe încap pe o singură plăcuță, numită <strong>circuit integrat</strong>. Multe calculatoare ajung cât un dulap.</li>
<li>Anii 1980–1990: <strong>calculatorul personal</strong> (PC) ajunge pe birou, acasă și la școală.</li>
<li>După 2007: se răspândește <strong>telefonul inteligent</strong>, un calculator de purtat în buzunar, mereu conectat: legat de alte aparate, cu care schimbă date.</li>
<li>Azi: ceasuri și brățări inteligente, la mână.</li></ol>
<p>Pe scurt, au ajuns <mark>mai mici, mai rapide și conectate</mark>.</p>
${IMG.sisteme}`,
   exemplu:`<p><b>Ce am învățat azi, pe scurt:</b></p><ul><li>Un sistem de calcul primește date, le prelucrează după un program și dă un rezultat.</li><li>Îl recunoști cu metoda detectivului, nu după cum arată.</li><li>Un sistem de comunicații duce datele la distanță.</li><li>Drumul calculatoarelor: cât o cameră, cât un dulap, pe birou, în buzunar, la mână.</li></ul>`,
   incearca:{t:'choice',q:'Bunicul a avut 20 de ani în 1985. Ce sistem de calcul putea folosi atunci la serviciu?',o:['Un calculator pe birou, cu monitor și tastatură','Un telefon inteligent în buzunar','Un ceas inteligent la mână','Niciunul: încă nu apăruseră calculatoare'],ok:0,
    ajutor:'În ce perioadă e anul 1985? Ce moment din evoluție ține de perioada aceea?',
    why:'1985 e în anii 1980–1990, când calculatorul personal a ajuns pe birouri. Telefonul inteligent s-a răspândit după 2007, iar ceasurile inteligente sunt de azi. Calculatoare electronice existau din anii 1940–1950.'},
   inca:[
    {t:'order',q:'Pune în ordine, de la cel mai mare la cel mai mic, cum au arătat calculatoarele de-a lungul timpului.',items:['Cât o cameră întreagă','Cât un dulap','Pe un birou','Într-un buzunar'],
     ajutor:'Au ajuns tot mai mici. Care a fost primul pas după camera întreagă?',
     why:'ENIAC ocupa o cameră întreagă. În anii 1960–1970, cu piese electronice tot mai mici, multe calculatoare au ajuns cât un dulap. Calculatorul personal a venit pe birou în anii 1980–1990, iar telefonul inteligent în buzunar, după 2007.'},
    {t:'tf',q:'Telefonul inteligent e „conectat”: e legat de alte aparate și schimbă date cu ele.',ok:true,
     ajutor:'Ce înseamnă „conectat”, în pas?',
     why:'Adevărat. Conectat înseamnă legat de alte aparate, cu care schimbă date. Așa poți suna, trimite o poză sau afla drumul pe hartă.'}
   ]}
 ],
 /* ---- ATELIERUL: simulatorul „fotografie”, modul CATEGORII, pe 9 fotografii reale (grila din img/atelier-obiecte.webp) ---- */
 atelier:{t:'fotografie',titlu:'Atelier: detectivul în fotografii',
  intro:`<p><strong>Sarcina:</strong> în fotografie sunt nouă obiecte. Pe unele nu le-ai mai văzut în lecție. Pune pe fiecare eticheta potrivită.</p>
<ol><li>Alege o etichetă de deasupra fotografiei: 1, 2 sau 3. Prima e deja aleasă.</li>
<li>Atinge pe fotografie obiectele care merg la ea. Pe fiecare apare un cerc cu numărul etichetei.</li>
<li>Ca să schimbi, alegi altă etichetă și atingi din nou obiectul.</li>
<li>Când toate au etichetă, apasă <b>Verifică etichetele</b>. Testele de sub fotografie se bifează.</li></ol>
<p>La fiecare obiect pune întâi cele trei întrebări ale detectivului. Nu te lua după ecran sau după butoane: contează ce face obiectul. Dacă e sistem de calcul, întreabă-te și dacă trimite sau primește date de departe.</p>`,

        {id:'telefon',r:[[0,33.7,32.8,66.3]]},{id:'gps',r:[[33.6,33.7,66.4,66.3]]},{id:'plata',r:[[67.2,33.7,100,66.3]]},
        {id:'bicicleta',r:[[0,67.4,32.8,100]]},{id:'foarfeca',r:[[33.6,67.4,66.4,100]]},{id:'ventilator',r:[[67.2,67.4,100,100]]}],

  gresit:{robot:'nu',ventilator:'calc',gps:'calc'},
  ajutor:'La fiecare obiect cu ✗, pune din nou cele trei întrebări. Are un program după care lucrează? Dacă da: primește sau trimite date de departe? Un sistem de calcul poate să n-aibă ecran, iar un aparat electric cu butoane poate să n-aibă program.',
  why:'Cuptorul primește timpul ales, termometrul simte căldura cu senzorul din vârf, iar robotul de aspirat simte cu senzorii lui când se lovește de mobilă. Toate trei prelucrează datele după un program și dau un rezultat, pe loc; robotul n-are nici măcar ecran. Roboții de aspirat mai noi, porniți de pe telefon, primesc și trimit date de departe: ei ar avea eticheta 2. Telefonul, GPS-ul, cu semnalele de la sateliți, și aparatul de plată, care vorbește cu banca, fac și ei asta, dar schimbă date și de departe. Bicicleta și foarfeca nu primesc date. Ventilatorul din fotografie are doar clapele 0, 1, 2, 3: ele aleg cât de repede se învârte, ca un întrerupător cu mai multe trepte, deci el n-are program. Alte ventilatoare, cu telecomandă și cu ceas de oprire electronic, au program.',

  ]},
 /* ---- VERIFICAREA: 5 întrebări, variante-soră ale exercițiilor (alte obiecte, alte situații) ---- */
 qs:[
  {t:'choice',q:'În autobuz, apropii cardul de călătorie de un aparat. Să zicem că aparatul scade prețul călătoriei din banii de pe card și îți arată pe ecran cât ți-a rămas. Este acest aparat un sistem de calcul?',
   o:['Da: primește date, le prelucrează, dă rezultat','Nu: nu are tastatură, mouse și monitor','Nu: e doar o cutie prinsă de o bară','Da, dar numai pentru că are un ecran'],ok:0,
   ajutor:'Pune-i cele trei întrebări ale detectivului.',
   why:'Aparatul primește date (ce e scris pe card), le prelucrează după un program (scade prețul) și dă un rezultat (suma rămasă, pe ecran). Tastatura, mouse-ul sau ecranul nu hotărăsc: contează ce face.'},
  {t:'classify',q:'La casa de marcat din magazin. Ce parte din lucrul casei de marcat este fiecare? Sortează.',cats:['Date primite','Prelucrare','Rezultat'],

   ajutor:'Ce primește casa de marcat? Ce socotește? Ce îți dă la final?',
   why:'Codurile produselor și suma dată de tine sunt datele. Adunarea prețurilor și calculul restului sunt prelucrarea, după program. Bonul tipărit e rezultatul.'},
  {t:'order',q:'Pune în ordine, de la cel mai vechi, aceste momente din evoluția calculatoarelor.',items:['Bile pe sârme, mutate cu mâna','Roți dințate care adună și scad','Un calculator electronic cât o cameră','Un calculator personal pe birou','Un telefon inteligent în buzunar'],
   ajutor:'Care se mișca doar din mână? Care avea roți dințate? Care umplea o cameră? Care stă pe birou? Care încape în buzunar? Apoi amintește-ți ordinea momentelor din pașii 5 și 6.',
   why:'Abacul (bile pe sârme) e cel mai vechi. Urmează mașinile mecanice cu roți dințate, ca a lui Pascal (1642), apoi calculatoarele electronice cât o cameră (anii 1940–1950), calculatorul personal (anii 1980–1990) și telefonul inteligent (după 2007).'},
  {t:'choice',q:'În care dintre aceste situații lucrează un sistem de comunicații?',o:['Doamna dirigintă trimite un mesaj pe telefoanele părinților','Socotești 12 + 30 cu calculatorul de buzunar','Cântărești făina pe cântarul de bucătărie','Cuptorul cu microunde încălzește ceaiul un minut'],ok:0,

  {t:'choice',q:'Mama ta avea 10 ani în anul 2000. Care dintre acestea s-a răspândit abia DUPĂ anul 2000?',o:['Telefonul inteligent','Calculatorul personal','Mașina de calcul cu roți dințate','Abacul'],ok:0,
   ajutor:'Care moment din evoluție vine după anul 2000?',

 ]}
  ],
  diploma:{titlu:'Detectiv de sisteme de calcul',
   rezumat:'a învățat ce face un sistem de calcul (primește date, le prelucrează după un program, dă un rezultat), cum îl recunoaște cu metoda detectivului, ce face un sistem de comunicații (duce datele la distanță) și momentele din evoluția calculatoarelor: abacul, mașina lui Pascal, primele calculatoare electronice, circuitul integrat, calculatorul personal, telefonul inteligent și ceasurile inteligente de azi',

<script>
/* Lecția 2, clasa a V-a (M1): „Norme de securitate în laboratorul de informatică. Poziția corectă la calculator”.
   Standardul: LearningHub\_campaign\revizuire_completa_2026_09\05_STANDARD_LECTIE.md. Sursele: surse.md.
   Conținutul vine din materialul profesorului (Info_Gimnaziu_2026\materiale\continut\clasa_V_M1.json, lecția 2) și din
   jocul calculator-v, nivelurile 1-2, verificat pe surse (AAO, AOA, CCOHS, HG 1028/2006, Electrical Safety First).
   Simulatorul „fotografie” e fișierul comun lectii/_sim/fotografie.js (nu îl modific); aici doar modul ETICHETE,
   pentru că textele lui sunt neutre (modul CATEGORII vorbește de „dispozitive”, iar aici etichetăm oameni și obiecte).
   Peste el, extensia mea lectii/_sim/fotografie-tastatura.js: fotografia merge și doar cu tastatura, iar „Mărește
   fotografia” are ≥ 36 px (judecătorul, m5-m6). Reparațiile după judecător (28.09.2026): surse.md, §9.
   Lecția 7 (recapitularea) folosește din lecția aceasta: regulile, cei 4 pași când ceva e stricat, poziția de sus în jos,
   regula 20–20–20 cu „cel puțin 6 metri” și desenul pozitia-corecta.webp. */
const LIC={
  pd:'domeniu public',
  cc0:'<a href="https://creativecommons.org/publicdomain/zero/1.0/deed.ro" target="_blank" rel="noopener">CC0</a>',
  by2:'<a href="https://creativecommons.org/licenses/by/2.0/deed.ro" target="_blank" rel="noopener">CC BY 2.0</a>',
  bysa2:'<a href="https://creativecommons.org/licenses/by-sa/2.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 2.0</a>',
  bysa4:'<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ro" target="_blank" rel="noopener">CC BY-SA 4.0</a>'
};
const wc=(file,nume)=>`<a href="https://commons.wikimedia.org/wiki/File:${file}" target="_blank" rel="noopener">${nume}</a>`;
const fig=(f,w,h,alt,cap)=>`<figure class="captura"><a href="img/${f}" target="_blank"><img src="img/${f}" alt="${alt}" width="${w}" height="${h}" loading="lazy"></a><figcaption>${cap}</figcaption></figure>`;
const CR={
  laborator:`Foto: Kiruthikapalani, ${wc('Computer_Laboratory.jpg','Wikimedia Commons')}, ${LIC.bysa4}; micșorată.`,
  masa:`Foto: Pixel.la, ${wc('Coffee-desk-laptop-notebook_(24244320481).jpg','Wikimedia Commons')}, ${LIC.cc0}; micșorată.`,
  birou:`Foto: Michael Coghlan, ${wc('Virtual_Community.jpg','Wikimedia Commons')}, ${LIC.bysa2}; decupată.`,
  femeie:`Foto: Shixart1985, ${wc('Woman_sits_at_a_desk_with_a_laptop_and_writes_notes.jpg','Wikimedia Commons')}, ${LIC.by2}; decupată, micșorată.`
};
const IMG={
  laborator:fig('laborator.webp',1000,750,'O sală mare, cu multe calculatoare pe mese de lemn, așezate pe rânduri, și scaune negre în fața lor; pe peretele din fund, ferestre cu perdele, un ceas rotund și o pânză albă','Un laborator de informatică. <small>'+CR.laborator+'</small>'),
  priza:`<div class="galerie">${fig('stecar-priza.webp',800,344,'În stânga, un ștecăr alb cu doi pini de metal; în dreapta, o priză albă, rotundă, cu două găuri','În stânga, <b>ștecărul</b>; în dreapta, <b>priza</b>.')}${fig('mufe-usb.webp',360,391,'Fața unui calculator, de aproape: sus, două găuri dreptunghiulare, una lângă alta; dedesubt, două găuri mici, rotunde','<b>Mufe</b> pe fața unui calculator.')}</div>
<p class="galerie-credit">Foto, Wikimedia Commons: ${wc('Schuko_plug_and_socket.png','ștecărul și priza')} (Chameleon, bran, plugwash, ${LIC.pd}); ${wc('Antec_P182_-_Front_Panel.jpg','mufele')} (William Hook, ${LIC.bysa2}; decupată).</p>`,
  arsa:fig('priza-arsa.webp',760,607,'O priză albă desfăcută, cu urme negre de ars înăuntru și la una dintre găuri, și lângă ea un ștecăr cu un pin înnegrit','O priză și un ștecăr <b>arse</b> (urmele negre), fotografiate după ce priza a fost scoasă din perete. Dacă vezi urme de ars, nu atingi și anunți. <small>Foto: Asurnipal, '+wc('Dornbirn-damaged_CEE_7-3_Schuko_socket_and_plug_(Schukosteckdose_und_stecker)-02ASD.jpg','Wikimedia Commons')+', '+LIC.bysa4+'.</small>'),
  pozitie:fig('pozitia-corecta.webp',1000,994,'Desen cu o persoană așezată corect la birou; etichetele stau pe marginile albe și arată cu săgeți: ochii la 50-70 cm de ecran, marginea de sus a ecranului cam la nivelul ochilor, spatele sprijinit de spătar, coatele și genunchii la aproximativ 90 de grade, masa la 60-70 cm și tălpile pe podea','„~90°” înseamnă „cam ca litera L”. Cana din desen, în laborator, ar sta în ghiozdan. <small>Desen: Yamavu, '+wc('Computer_Workstation_Variables_cleanup.png','Wikimedia Commons')+', '+LIC.cc0+'; etichete în română.</small>')
};
/* schema „Ce am învățat” */
const SCHEMA=`<div class="schema" role="img" aria-label="Schema: regulile de siguranță; ce faci când ceva e stricat; poziția corectă de sus în jos; regula 20–20–20 pentru ochi">
  <div class="sc-box"><b>În siguranță</b><span>nu atingi cablurile, prizele și ștecărele; nu bagi nimic în mufe; nu desfaci nimic; nu te apleci sub masă; mâncarea și băuturile, în ghiozdan</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Ceva e stricat?</b><span>mâinile jos de pe tastatură și mouse, puțin înapoi de la masă, chemi profesorul, îi spui ce ai văzut; la un pericol, fără profesor în sală: ieși și anunți primul adult pe care îl întâlnești; flacără sau fum mult în sală: faci ce spune profesorul, iar fără el ieși imediat, cu colegii</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Poziția corectă, de sus în jos</b><span>ecranul la 50–70 cm de ochi; spatele drept, pe spătar; coatele ca litera L; tălpile pe podea sau pe un suport</span></div>
  <div class="sc-sag" aria-hidden="true">↓</div>
  <div class="sc-box"><b>Regula 20–20–20</b><span>la fiecare 20 de minute, cel puțin 20 de secunde, privești la cel puțin 6 metri (cam 10 pași de-ai tăi): cel mai sigur, afară, pe geam</span></div>
</div>`;

/* „Acum la calculatorul din laborator” (modul lecție: după atelier, înainte de verificare; diploma îl repetă).
   Totul se face DE PE SCAUN: fără cabluri, prize, mufe, fără aplecat sub masă, fără mutat ecranul, și FĂRĂ profesor
   (la ora simultană poate fi la cealaltă clasă: pentru pericole, pasul 2 spune ce faci dacă nu e în sală — judecătorul, M1).
   Ieșiri pentru ce nu se poate repara de pe scaun: laptop, scaun fără spătar (M5), picioare care nu ajung la podea,
   ecran prea sus. Distanța de 6 m se apreciază fără metru (M4): afară, pe geam, sau peretele cel mai îndepărtat. */
const LABORATOR=[
  'Stai pe scaun, la locul tău. Tot ce faci acum faci <b>de pe scaun</b>: nu atingi cablurile și prizele, nu bagi nimic în mufe, nu desfaci nimic, nu te apleci sub masă și nu muți ecranul. Scrie în caiet titlul <b>Locul meu în laborator</b>.',
  '<b>Masa.</b> Uită-te pe masa ta. E pe ea mâncare sau o băutură de-a ta? Pune-o în ghiozdan. Vezi un pericol: un cablu rupt, urme de ars sau apă vărsată? Nu atingi nimic: ridici mâna și chemi profesorul. Profesorul nu e în sală? Ieși și anunți primul adult pe care îl întâlnești. Scrie în caiet „masa: în regulă” sau ce ai găsit.',
  '<b>Ochii.</b> Stai drept (cu spatele pe spătar, dacă scaunul are). Întinde încet un braț spre ecran. Brațul e întins, iar vârfurile degetelor sunt aproape de ecran? Distanța e bună. Degetele ajung la ecran înainte să-ți întinzi tot brațul? Ești prea aproape: dă-te înapoi cu tot cu scaunul. Cu brațul întins, până la ecran mai e cam o jumătate de braț? Ești prea departe: apropie-te. Scrie ce ai găsit.',
  '<b>Înălțimea ecranului.</b> Privește drept înainte. Marginea de sus a ecranului e cam la nivelul ochilor? Scrie „da” sau „nu”. Dacă e „nu”, nu muți tu ecranul: scrie-o și spune-i profesorului la sfârșitul orei. La un laptop, ecranul stă de obicei mai jos: atunci ai grijă doar să nu te apleci spre el.',
  '<b>Spatele.</b> Așază-te până în spatele scaunului, cu spatele drept, lipit de spătar, și cu umerii relaxați, nu ridicați spre urechi. Scrie „spatele: bine” după ce l-ai potrivit. Scaunul tău n-are spătar? Stai drept, pe tot scaunul, fără să te apleci spre ecran, și scrie „scaun fără spătar”; spune-i profesorului la sfârșitul orei.',
  '<b>Brațele.</b> Pune mâinile pe tastatură. Coatele sunt îndoite ca litera L? Încheieturile stau drepte? Dacă nu, apropie-te sau depărtează-te puțin, cu tot cu scaunul. Te-ai mutat? Întinde iar brațul spre ecran, ca la pasul „Ochii”: distanța trebuie să rămână bună. Scrie ce ai potrivit.',
  '<b>Picioarele.</b> Tălpile stau pe podea? Dacă picioarele atârnă, nu pune nimic sub masă: scrie „îmi trebuie un suport” și spune-i profesorului. Suportul îl aduce el.',
  '<b>Pauza pentru ochi.</b> Caută din ochi, de pe scaun, un loc departe. Cel mai sigur: ceva de afară, văzut pe geam (un copac, o casă, un deal), chiar dacă trebuie să întorci capul. Dacă din sală nu se vede afară, alege peretele cel mai îndepărtat: e bun doar dacă până la el ai face cel puțin 10 pași. Nici el nu e atât de departe? Scrie „n-am un loc destul de departe”. Ușa sau fereastra de lângă tine NU sunt destul de departe. Scrie locul în caiet.',
  '<b>Ora pauzei.</b> Scrie ora la care ai început să lucrezi și ora primei pauze. Ora o vezi pe ceasul din sală sau jos, în dreapta ecranului. <details class="verif"><summary>Verifică-te, după ce ai scris</summary>Prima pauză e la 20 de minute după ce ai început. De exemplu, dacă ai început la 9:05, pauza e la 9:25. Atunci privești locul ales cel puțin 20 de secunde.</details>',
  'Compară caietul tău cu al colegului de bancă. Verificați-vă unul altuia poziția, de sus în jos, doar uitându-vă, fără să vă atingeți. Unde nu sunteți de acord, recitiți pasul „Poziția corectă, de sus în jos”.'
];

JocMotor.porneste({
  cheie:'lectie_v_m1_l02',
  mod:'lectie',   // motorul în modul lecție: firimituri spre lectii/v/, „Lecția 2”, pasul „Acum la calculatorul din laborator” înainte de verificare
  titlu:'Norme de securitate în laboratorul de informatică. Poziția corectă la calculator',
  marca:'Lecția <b>2</b> · clasa a V-a',
  h1:'Norme de securitate în laboratorul de informatică. Poziția corectă la calculator',
  eticheta:'Lecții TIC',
  acasa:{href:'../../../hub/index.html',text:'LearningHub'},
  clasa:'a V-a', unitate:'V-U1', unitateTitlu:'Sisteme de calcul. Lucrez corect și în siguranță',
  competente:['CS.1.1'], lectii:'2',
  ancoraText:'Din programă (CS.1.1, unitatea V-U1, lecția 2): Normele de securitate și protecție a muncii în laboratorul de informatică · Poziția corectă a corpului la stația de lucru',
  intro:`<p>Afli regulile laboratorului de informatică și cum stai corect la calculator. Înveți pe pași, cu fotografii adevărate. La atelier cauți, într-o fotografie, ce nu e în regulă. Apoi îți potrivești singur poziția, la calculatorul din laborator. La sfârșit verifici ce știi, cu 5 întrebări.</p>
<p><b>La final știi:</b> ce ai voie și ce nu ai voie în laborator, ce faci când ceva e stricat, cum stai corect la calculator și cum îți odihnești ochii.</p>
<p><b>Ai nevoie de:</b> nimic din lecțiile de până acum. Doar să citești ora pe ceas.</p>`,
  cum:`<b>Cum lucrezi</b><ol><li>Citești 6 pași scurți. Primul îți arată la ce folosește lecția; după fiecare dintre ceilalți faci un exercițiu mic, fără puncte.</li><li>La atelier cauți, într-o fotografie nouă, ce nu e în regulă.</li><li>Acum la calculatorul din laborator: îți potrivești poziția, de pe scaun, și scrii în caiet ce ai găsit.</li><li>Răspunzi la 5 întrebări de verificare: pentru ele primești stele.</li></ol>`,
  banda:'<span><i class="priza"></i>nu atingi</span><span>50–70 cm</span><span><i class="spatar"></i>spătar</span><span>20 · 20 · 20</span><span><i class="priza"></i>anunți</span>',
  nivele:[
{t:'Norme de securitate în laboratorul de informatică. Poziția corectă la calculator',final:true,lectii:[2],
 continuturi:['Normele de securitate și protecție a muncii în laboratorul de informatică','Poziția corectă a corpului la stația de lucru'],
 obiectiv:'respecți regulile laboratorului, știi ce faci când ceva e stricat, îți verifici singur poziția la calculator, de sus în jos, și îți odihnești ochii după regula 20–20–20.',
 pasi:[
  /* ---- pasul 0: la ce folosește (fără acțiuni) ---- */
  {t:'La ce folosește: o oră pe săptămână în laborator',
   text:`<p>Ora de informatică se ține în <strong>laboratorul de informatică</strong>: sala cu calculatoare din școală. Acolo stai o oră întreagă pe scaun, cu ochii la ecran.</p>
<p>Calculatoarele merg cu <strong>curent electric</strong>. Curentul vine din <strong>priză</strong>, prin <strong>cablu</strong>. Capătul cablului care intră în priză se numește <strong>ștecăr</strong> (i se mai spune și ștecher). Găurile din calculator în care intră alte cabluri se numesc <strong>mufe</strong>.</p>
<p>Azi afli regulile care te apără pe tine, pe colegi și calculatoarele, și cum stai la calculator ca să nu te doară spatele și ochii.</p>
${IMG.laborator}${IMG.priza}`},
  /* ---- pasul 1: regulile laboratorului (cuvintele priză, cablu, ștecăr, mufe sunt în pasul 0: judecătorul, m11) ---- */
  {t:'Curentul electric: regulile laboratorului',
   text:`<p>Regulile laboratorului se numesc <mark>norme de securitate și protecție a muncii</mark>. Ele te apără mai ales să nu te <strong>electrocutezi</strong>: să-ți treacă curentul prin corp și să te rănească.</p>
<ul><li>intri numai cu profesorul și stai la locul tău;</li>
<li>nu atingi cablurile, prizele, ștecărele și spatele calculatorului;</li>
<li>nu bagi nimic în prize și în mufe;</li>
<li>nu desfaci nimic: nici calculatorul, nici tastatura, nici mouse-ul;</li>
<li>nu te apleci sub masă: acolo sunt cablurile și prizele;</li>
<li>nu stingi calculatorul din ștecăr sau de la butonul unui <strong>prelungitor</strong> (un șir de prize, cu cablul lui): îl oprește profesorul.</li></ul>`,
   exemplu:`<p><b>Primele minute ale orei:</b></p><ol><li>Aștepți profesorul la ușă.</li><li>Intri cu el și te așezi la locul tău.</li><li>Te uiți, fără să atingi: cablurile sunt întregi? Masa e uscată?</li><li>Vezi ceva stricat? Îi spui profesorului, înainte să începi lucrul.</li></ol>`,
   altfel:`<p>E ca la piscină: acolo e apă adâncă, aici e curent electric. La piscină nu intri fără salvamar și nu alergi pe margine. În laborator nu intri fără profesor și nu umbli la cabluri și la prize.</p>`,
   incearca:{t:'classify',q:'Ai voie sau nu ai voie în laborator? Sortează.',cats:['Ai voie','Nu ai voie'],
    items:[['Te uiți de pe scaun dacă firul mouse-ului e întreg',0],['Tragi de cablul tastaturii, ca s-o aduci mai aproape',1],['Bagi vârful creionului într-o mufă, să vezi cât e de adâncă',1],['Te apleci sub masă după guma care ți-a căzut',1],['Aștepți la ușă până vine profesorul',0],['La sfârșitul orei, stingi calculatorul de la butonul prelungitorului',1]],
    ajutor:'Pentru fiecare, întreabă-te: atingi un cablu, o priză, un prelungitor sau o mufă? Intri sub masă? Atunci nu ai voie.',

  /* ---- pasul 2: mâncarea și băuturile ---- */
  {t:'Mâncarea și băuturile rămân în ghiozdan',
   text:`<p>Apa și curentul electric sunt periculoase împreună. Un strop de suc sau de apă poate intra în tastatură sau poate ajunge la un cablu. Firimiturile intră între taste și le blochează.</p>
<p>De aceea, <mark>mâncarea și băuturile rămân în ghiozdan</mark>. Nici sticla cu dop nu stă pe masă: se poate răsturna și se poate deschide. Mănânci și bei în pauză, afară din laborator.</p>`,
   exemplu:`<p>Ana are în ghiozdan o sticlă cu apă și un măr. Ora începe: sticla și mărul rămân în ghiozdan, închis. În pauză, Ana iese din laborator, bea apă și mănâncă mărul.</p>`,
   altfel:`<p>Gândește-te la un uscător de păr lângă cada plină: nimeni nu-l folosește acolo. Apa și curentul nu se împacă nicăieri: nici la baie, nici lângă tastatură.</p>`,
   incearca:{t:'fotografie',q:'Pe masa din fotografie e un laptop: un calculator pe care îl poți lua cu tine. Pune fiecare etichetă pe lucrul potrivit. Pe telefon, apasă întâi „Mărește fotografia”.',

    zone:[{id:'pahar',r:[[7,30,19,57.5]]},{id:'vas',r:[[72.5,45,91.5,85],[83,30,96,55]]},{id:'ghiveci',r:[[64,17,83,46]]},{id:'flori',r:[[64,0,100,45]]},

    nume:{pahar:'paharul cu capac',vas:'un vas cu apă',ghiveci:'ghiveciul alb, cu o plantă',flori:'florile galbene: apa lor e mai jos, în vas',laptop:'laptop'},
    nimic:'Acum nu stă pe niciun lucru: acolo e masa albă.',
    punct:{pahar:[13,44],vas:[82,70]},
    gresit:{pahar:[45,40],vas:[72,30]},
    ajutor:'Caută pe masă tot ce ține lichid. Paharul are capac. Florile stau în vase: în unul vezi apa prin sticlă, în celălalt nu, dar tot are apă.',
    why:'Paharul cu capac e o băutură: se ține în ghiozdan, pentru că se poate răsturna și deschide. Eticheta 2 e bună și pe borcanul de sticlă, unde se vede apa, și pe vaza neagră: ține flori, deci are și ea, de obicei, apă. Dacă un vas se răstoarnă, apa ajunge la laptop.'},
   inca:[
    {t:'tf',q:'Dacă paharul are capac, îl poți ține pe masă, lângă tastatură.',ok:false,ajutor:'Recitește a doua propoziție din al doilea paragraf.',why:'Fals. Și un pahar cu capac se poate răsturna și deschide. Băuturile rămân în ghiozdan.'},
    {t:'choice',q:'Ai adus un măr pentru pauză. Unde stă mărul în ora de informatică?',o:['În ghiozdan, până în pauză','Pe masă, lângă mouse','Pe genunchi, ca să-l mănânci repede','Pe scaunul colegului'],ok:0,ajutor:'Unde rămân mâncarea și băuturile?',why:'Mâncarea rămâne în ghiozdan și o mănânci în pauză, afară din laborator. Pe masă sau lângă tine, firimiturile ajung între taste.'}

  /* ---- pasul 3: ce faci când ceva e stricat ---- */
  {t:'Ceva e stricat sau vărsat? Anunți profesorul',
   text:`<p>Uneori apare un <strong>pericol</strong>: miros de ars, fum, scântei, un cablu rupt, apă vărsată lângă calculator.</p>
<p>Atunci <mark>anunți imediat profesorul</mark>. Nu repari singur, nu ștergi, nu scoți ștecărul: te poți electrocuta. Pe rând:</p>
<ol><li>Iei mâinile de pe tastatură și de pe mouse.</li><li>Te dai puțin înapoi de la masă.</li><li>Ridici mâna și chemi profesorul.</li><li>Îi spui ce ai văzut.</li></ol>
<p><strong>Profesorul nu e în sală?</strong> Ieși și anunți primul adult pe care îl întâlnești.</p>
<p><strong>Flacără sau fum mult, în sală?</strong> Profesorul e acolo? Faci ce spune el. Nu e? Ieși imediat, cu colegii, fără ghiozdan, nu te întorci după nimic și anunți primul adult pe care îl întâlnești.</p>
${IMG.arsa}`,
   exemplu:`<p>Mouse-ul tău nu mai mișcă săgeata sau ecranul s-a stins, fără miros și fără fum. E o <b>problemă mică</b>, dar și ea se anunță: ridici mâna și îi spui profesorului. Profesorul nu e în sală? Pentru atât nu ieși: aștepți să vină și, până atunci, lucrezi în caiet. Nu scoți cablul mouse-ului și nu iei mouse-ul colegului.</p>`,
   altfel:`<p>La un accident de mașină, oamenii nu se apucă singuri să repare motorul: sună la 112 și spun ce au văzut. În laborator, „112” este profesorul.</p>`,
   incearca:{t:'choice',q:'Profesorul e la catedră. Colegul de bancă varsă apă pe masă, lângă tastatură. Ce faceți?',
    o:['Vă dați înapoi și îl chemi pe profesor','Ștergi repede tastatura cu mâneca ta','Scoți ștecărul din priză, să nu fie curent','Ridici tastatura, ca să se scurgă apa din ea'],ok:0,
    ajutor:'Apa poate ajunge la curent. Cine se ocupă de ea: voi sau profesorul?',
    why:'Apa lângă tastatură poate ajunge la curent. Nu atingeți nimic, vă îndepărtați de masă și îl chemi pe profesor. Să ștergi, să ridici tastatura sau să scoți ștecărul înseamnă să umbli lângă apă și curent: te poți electrocuta.'},
   inca:[
    {t:'choice',q:'Lucrezi în laborator, iar profesorul e în sala de alături. Ecranul tău se stinge și simți miros de ars. Ce faci?',o:['Ieși și anunți primul adult pe care îl întâlnești','Ridici mâna și aștepți să intre cineva în sală','Scoți ștecărul din priză, ca să nu ardă mai tare','Te muți la alt calculator și lucrezi mai departe'],ok:0,ajutor:'Mirosul de ars e un pericol. Recitește ce faci când profesorul nu e în sală.',why:'Mirosul de ars e un pericol, iar profesorul nu e în sală, deci nu are cine să te vadă cu mâna ridicată. Ieși și anunți primul adult pe care îl întâlnești. La ștecăr nu umbli, iar mirosul de ars nu se lasă nespus.'},
    {t:'classify',q:'Rezolvi singur sau anunți profesorul?',cats:['Fac eu','Anunț profesorul'],items:[['Cablul căștilor e rupt și se văd firele din el',1],['Ecranul s-a stins deodată',1],['Îmi pun sticla de apă în ghiozdan',0],['Simt un miros de ars',1],['Aștept profesorul la ușă',0]],ajutor:'Ce e stricat sau periculos se anunță. Regulile obișnuite le faci singur.',why:'Cablul rupt, ecranul stins și mirosul de ars sunt probleme: le rezolvă profesorul. Sticla în ghiozdan și așteptatul la ușă sunt reguli pe care le faci tu.'},
    {t:'tf',q:'Dacă ecranul scoate fum, îl oprești singur, scoțând ștecărul din priză.',ok:false,ajutor:'Ce nu faci niciodată, după pas?',why:'Fals. Nu scoți ștecărul: te poți electrocuta. Iei mâinile de pe tastatură, te dai înapoi și îl chemi pe profesor (dacă nu e în sală, ieși și anunți primul adult). El știe cum se oprește curentul în siguranță.'}
   ]},
  /* ---- pasul 4: poziția corectă ---- */
  {t:'Poziția corectă, de sus în jos',
   text:`<p>Locul unde lucrezi, cu masa, scaunul și calculatorul, se numește <mark>stația de lucru</mark>. Ca să nu te doară spatele și ochii, îți verifici <mark>poziția corectă</mark>, de sus în jos:</p>
<ol><li><strong>Ochii:</strong> ecranul stă la 50–70 cm de ei, cam cât brațul întins. Marginea lui de sus e cam la nivelul ochilor.</li>
<li><strong>Spatele:</strong> drept, sprijinit de spătar (pe un scaun fără spătar, doar drept). Umerii, relaxați, nu ridicați spre urechi.</li>
<li><strong>Brațele:</strong> coatele, îndoite ca litera L. Încheieturile (locul unde palma se prinde de braț) stau drepte.</li>
<li><strong>Picioarele:</strong> tălpile, pe podea sau pe un suport, pe care în laborator îl aduce profesorul: tu nu pui nimic sub masă.</li></ol>
${IMG.pozitie}`,
   exemplu:`<p><b>Distanța, fără riglă:</b> stai drept și întinzi încet brațul spre ecran.</p>
<ul><li>Brațul e întins, iar vârfurile degetelor sunt aproape de ecran? Distanța e bună; poți sta și puțin mai departe.</li>
<li>Degetele ajung la ecran înainte să-ți întinzi tot brațul? Ești prea aproape: te dai înapoi cu tot cu scaunul.</li>
<li>Cu brațul întins, până la ecran mai e cam o jumătate de braț? Ești prea departe: te apropii cu tot cu scaunul.</li></ul>
<p>Ecranul nu-l apeși și nu-l tragi: are cabluri.</p>`,
   altfel:`<p>Gândește-te la spătarul scaunului: e acolo ca să-l folosești. Dacă stai pe marginea scaunului, aplecat spre ecran, spatele ține singur tot corpul și obosește repede.</p>`,
   incearca:{t:'fotografie',q:'O femeie lucrează la calculator; o vezi din spate. Verifică-i spatele. Pune fiecare etichetă pe locul potrivit. Pe telefon, apasă întâi „Mărește fotografia”.',
    img:'birou-aplecata.webp',w:700,h:690,
    alt:'O femeie văzută din spate, la un birou cu calculator, cu căști pe cap: spatele ei nu atinge spătarul, iar capul și umerii îi vin puțin spre ecran; în stânga jos se vede spătarul negru al scaunului ei; pe birou, o tastatură neagră și un mouse',
    credit:CR.birou,
    /* judecătorul, m1: în fotografie se vede clar că spatele NU atinge spătarul; „aplecat în față” se vede slab */
    tinte:[{id:'spate',et:'Trebuie reparat: nu stă lipit de spătar',test:'Eticheta 1 stă pe locul potrivit'},{id:'spatar',et:'Aici trebuie să se sprijine',test:'Eticheta 2 stă pe locul potrivit'}],
    zone:[{id:'spatar',r:[[0,59,7,72],[0,72,11,87],[0,87,17,100]]},{id:'brat',r:[[52,58,66,77]]},{id:'telefon',r:[[2,40,13,52]]},{id:'spate',r:[[8,31,60,98]]},{id:'cap',r:[[20,9,50,33]]},{id:'ecran',r:[[53,9,90,46]]},{id:'tastatura',r:[[58,54,86,67]]},{id:'mouse',r:[[86,67,98,76]]},{id:'masa',r:[[60,67,100,82]]}],
    nume:{spatar:'spătarul scaunului',brat:'brațul ei',spate:'spatele ei',cap:'capul ei, cu căștile',ecran:'ecran',tastatura:'tastatură',mouse:'mouse',telefon:'telefonul de pe birou',masa:'masă'},
    nimic:'Acum nu stă pe niciun loc din listă: acolo e peretele sau umbra de sub masă.',
    punct:{spate:[30,60],spatar:[7,82]},
    gresit:{spate:[70,25],spatar:[30,60]},
    ajutor:'Eticheta 1: ce parte a corpului ei nu atinge spătarul? Eticheta 2: caută scaunul ei, în stânga jos.',
    why:'Spatele ei nu atinge spătarul, iar capul și umerii îi vin puțin spre ecran. Spătarul scaunului e chiar în spatele ei, în stânga jos: acolo trebuie să-și lipească spatele, stând drept.'},
   inca:[
    {t:'choice',q:'Picioarele tale nu ajung la podea. Ce e bine pentru ele, în laborator?',o:['Un suport sub tălpi, adus de profesor','Să atârne în aer, cum le ții de obicei','Să stea încrucișate, strânse sub scaun','Să stai pe marginea scaunului, să ajungi jos'],ok:0,ajutor:'Recitește ce scrie la picioare.',why:'Tălpile trebuie să stea sprijinite: pe podea sau pe un suport, pe care în laborator îl aduce profesorul. Picioarele care atârnă obosesc, iar pe marginea scaunului spatele nu mai stă pe spătar.'},
    {t:'tf',q:'Ecranul e bine să stea cât mai aproape de ochi, ca să vezi mai bine.',ok:false,ajutor:'Cât de departe stă ecranul?',why:'Fals. Ecranul stă la 50–70 cm de ochi, cam cât brațul întins. Prea aproape, ochii obosesc mai repede.'},
    {t:'match',q:'Leagă fiecare parte a corpului de poziția ei corectă.',pairs:[['Ochii','la 50–70 cm de ecran'],['Spatele','drept, sprijinit de spătar'],['Coatele','îndoite ca litera L'],['Tălpile','pe podea sau pe un suport']],ajutor:'Verificarea de sus în jos are patru părți: ochii, spatele, brațele, picioarele.',why:'Fiecare parte a corpului are poziția ei. Împreună, corpul nu obosește.'}
   ]},
  /* ---- pasul 5: regula 20–20–20 + ce am învățat ---- */
  {t:'Pauzele pentru ochi: regula 20–20–20',
   text:`<p>Când privești mult timp ceva aproape, ochii obosesc: te ustură, se usucă, vezi mai neclar. Au nevoie de pauze.</p>
<p><mark>Regula 20–20–20</mark>: la fiecare <strong>20 de minute</strong>, privești cel puțin <strong>20 de secunde</strong> ceva aflat departe, la cel puțin <strong>6 metri</strong>, adică cam 10 pași de-ai tăi. Cel mai sigur: ceva de afară, văzut pe geam. Peretele din fundul sălii e bun doar dacă până la el ai face cel puțin 10 pași.</p>
<p>Pe fișa tipărită de la profesor, regula spune „20 de pași”: e și mai departe, deci e tot bine. În engleză, regula spune „20 de picioare”, o unitate de măsură veche: tot cam 6 metri.</p>`,
   exemplu:`<p>Lucrezi la un desen de la 10:00. La 10:20 te uiți pe geam, la un copac din curte, și numeri în gând, rar, până la 20. Apoi lucrezi mai departe. La 10:40, din nou.</p>
<p><b>Ce am învățat, pe scurt:</b></p>${SCHEMA}`,
   altfel:`<p>E ca atunci când ții o sticlă strânsă în pumn: după un timp mâna obosește și trebuie s-o deschizi. Privitul departe e „mâna deschisă” a ochiului.</p>`,
   incearca:{t:'fotografie',q:'Imaginează-ți că lucrezi la calculatorul din dreapta, cel mai aproape de tine în fotografie. Au trecut 20 de minute. Pune fiecare etichetă pe un loc potrivit. Pe telefon, apasă întâi „Mărește fotografia”.',
    img:'laborator.webp',w:1000,h:750,
    alt:'O sală mare, cu multe calculatoare pe mese de lemn, așezate pe rânduri, și scaune negre în fața lor; pe peretele din fund, ferestre cu perdele, un ceas rotund și o pânză albă',
    credit:CR.laborator,
    tinte:[{id:'departe',et:'Aici mă uit în pauză: e la cel puțin 6 metri',test:'Eticheta 1 stă pe un loc potrivit'},{id:'aproape',et:'Aici e prea aproape pentru pauză',test:'Eticheta 2 stă pe un loc potrivit'}],
    zone:[{id:'tavan',r:[[0,0,100,14]]},{id:'departe',r:[[0,14,100,36]]},{id:'mijloc',r:[[0,36,100,44],[0,44,62,64]]},{id:'aproape',r:[[62,44,100,100],[0,64,100,100]]}],
    nume:{tavan:'tavan: caută un loc pe peretele din fund sau lângă tine',departe:'peretele din fund, departe de tine',mijloc:'calculatoarele din mijlocul sălii: nu știi sigur dacă sunt la 6 metri; alege ceva sigur departe sau sigur aproape',aproape:'lucrurile de lângă tine: calculatorul tău, scaunele, podeaua'},
    punct:{departe:[86,21],aproape:[94,50]},
    gresit:{departe:[94,50],aproape:[86,21]},
    ajutor:'Eticheta 1: caută ceva pe peretele din fundul sălii, de exemplu ceasul sau o fereastră. Eticheta 2: ce e chiar în fața ta?',
    why:'Peretele din fund, cu ferestrele, ceasul și pânza albă, e departe de tine, mult peste 6 metri: acolo te uiți în pauză. Calculatorul tău, scaunele și podeaua din fața ta sunt la mai puțin de 6 metri: privindu-le, ochii nu se odihnesc.'},
   inca:[
    {t:'choice',q:'Începi să lucrezi la 8:50. La ce oră faci prima pauză pentru ochi?',o:['La 9:10','La 9:00','La 9:30','La 8:56'],ok:0,ajutor:'Adaugă 20 de minute la 8:50. O oră are 60 de minute.',why:'8:50 și încă 10 minute fac 9:00; încă 10 minute fac 9:10. La 9:30 e a doua pauză, iar 6 sunt metrii, nu minutele.'},
    {t:'tf',q:'În pauza pentru ochi te uiți 20 de secunde la tastatură.',ok:false,ajutor:'Unde privești: aproape sau departe?',why:'Fals. Tastatura e aproape. În pauză privești ceva aflat la cel puțin 6 metri, de exemplu afară, pe geam.'},
    {t:'tf',q:'Ușa e la 3 pași de tine. E un loc bun pentru pauza ochilor.',ok:false,ajutor:'Cam câți pași de-ai tăi fac 6 metri?',why:'Fals. 6 metri sunt cam 10 pași de-ai tăi, iar ușa e doar la 3. Alege ceva de afară, văzut pe geam, sau peretele cel mai îndepărtat din sală.'}
   ]}
 ],
 atelier:{t:'fotografie',titlu:'Atelier: găsește ce nu e în regulă, într-o fotografie nouă',
  intro:`<p><strong>Sarcina:</strong> femeia din fotografie lucrează acasă, la laptop. Verifică-i locul de lucru cu regulile din lecție, de sus în jos. Pentru fiecare regulă de deasupra fotografiei, găsește locul unde ea NU o respectă.</p>
<ol><li>Apasă o etichetă de deasupra fotografiei. Prima e deja aleasă.</li>
<li>Atinge pe fotografie locul unde regula nu e respectată. Acolo apare un cerc roșu cu numărul etichetei, iar pagina trece singură la eticheta următoare.</li>
<li>Vrei să muți o etichetă? Apasă-i numele, apoi atinge alt loc.</li>
<li>Când toate cele 3 etichete sunt pe fotografie, apasă <b>Verifică etichetele</b>.</li></ol>
<p>Pe telefon, apasă întâi <b>Mărește fotografia</b>.</p>`,

  zone:[

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixtură: lecție curată</title>
<meta name="description" content="Fixtură a mașinii de verificat: o lecție fără defecte.">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/tip-foaie.js"></script>
<script src="../../../jocuri/_motor/tip-excel.js"></script>
<script>
/* FIXTURĂ de test pentru _masina (nu e lecție pentru elevi). Curată: fiecare termen, semn și tastă e explicat
   înainte de a fi cerut; nicio celulă nu are două roluri. */
JocMotor.porneste({
  cheie:'test_masina_curata', titlu:'Fixtură curată', marca:'Fixtură <b>curată</b>',
  clasa:'a VIII-a', unitate:'VIII-U1', unitateTitlu:'Fixtură', competente:[], lectii:'1',
  intro:'Fixtură pentru mașina de verificat lecții.',
  nivele:[{t:'Prima formulă', lectii:[1], continuturi:['fixtură'],
    obiectiv:'scrii un număr într-o celulă și faci o înmulțire cu o formulă.',
    pasi:[
      {t:'La ce folosește',
       text:`<p>Un tabel de calcul ține numere în pătrățele și face singur socotelile. La magazin, casiera află totalul fără să calculeze pe hârtie.</p>`},
      {t:'Scrii un număr într-o celulă',
       text:`<p>O <mark>celulă</mark> este pătrățelul de la întâlnirea unei coloane cu un rând. Numele ei, de exemplu B2, e format din litera coloanei și numărul rândului.</p>
<p>Tasta Enter confirmă ce ai scris și te mută în celula de dedesubt.</p>
<p>Acum tu: în B2 scrie doar numărul 7 și apasă Enter.</p>`,
       exemplu:`<p>Clic pe A1, scrii numele tău, apeși Enter: numele rămâne în A1.</p>`,
       incearca:{t:'choice', q:'Ce tastă confirmă ce ai scris în celulă?', o:['Enter','Esc','Shift','Alt'], ok:0,
                 ajutor:'Recitește a doua propoziție a pasului.', why:'Enter este tasta care confirmă scrierea și coboară un rând.'}},
      {t:'Prima formulă',
       text:`<p>O <mark>formulă</mark> este un calcul pe care îl face Excel. Formula începe cu semnul = (egal). Semnul * (steluța) înseamnă înmulțire.</p>
<p>Acum tu: în B1 scrie 3 și apasă Enter. În B2 scrie 4 și apasă Enter. În B3 scrie =B1*B2 și apasă Enter. În B3 apare 12.</p>`,
       exemplu:`<p>Dacă în B1 este 3 și în B2 este 4, formula =B1*B2 înmulțește cele două numere.</p>`,
       incearca:{t:'excel', q:'În <b>C1</b> calculează dublul numărului din B1 (B1 înmulțit cu 2), apoi apasă Enter.', cols:4, rows:3,
                 cells:{A1:'Numărul de caiete', B1:6}, verifica:{formule:{C1:'=B1*2'}},
                 ajutor:'Începe cu semnul egal, pui adresa din coloana B, steluța și cifra doi.', why:'Rezolvarea: egal, B1, steluța, doi; înmulțește numărul din B1 cu doi.'}}
    ],
    atelier:{t:'excel', titlu:'Atelier: casa de marcat', intro:'<p>Calculează totalul în D2: prețul înmulțit cu bucățile.</p>', q:'Totalul în D2.',
             cols:4, rows:3, cells:{A1:'Produs', B1:'Preț', C1:'Bucăți', D1:'Total', A2:'Caiet', B2:4, C2:3},
             verifica:{formule:{D2:'=B2*C2'}}, ajutor:'Adresa prețului, steluța, adresa bucăților, apoi Enter.', why:'Totalul se obține înmulțind prețul cu numărul de bucăți.'},
    qs:[
      {t:'choice', q:'Cu ce semn începe o formulă?', o:['=','*','+','#'], ok:0, why:'Orice formulă pornește cu semnul egal, ca Excel să știe că urmează un calcul.'},
      {t:'tf', q:'Semnul * înseamnă împărțire.', ok:false, why:'Steluța înseamnă înmulțire; împărțirea are alt semn.'}
    ]}],
  tipuri:{excel:JocExcel},
  diploma:{titlu:'Fixtură', rezumat:'o fixtură', aplicatie:'Excel-ul adevărat',
           provocare:['Deschide Excel și alege un registru gol.', 'În B2 scrie 7 și apasă Enter.']}
});
</script>
</body>
</html>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixtură: termen înainte de explicație</title>
<meta name="description" content="Fixtură a mașinii de verificat: un termen folosit înainte să fie explicat.">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/tip-foaie.js"></script>
<script src="../../../jocuri/_motor/tip-excel.js"></script>
<script>
/* FIXTURĂ de test pentru _masina. Defecte PUSE INTENȚIONAT:
   - „TVA” e folosit la pasul 1, explicat abia la pasul 2;
   - exercițiul pasului 1 cere =SUM(B2:B4), dar nici SUM, nici „:” nu sunt predate;
   - „fila Home” e scrisă doar în engleză (profilul RO n-o vede). */
JocMotor.porneste({
  cheie:'test_masina_termen', titlu:'Fixtură termen', marca:'Fixtură <b>termen</b>',
  clasa:'a VIII-a', unitate:'VIII-U1', unitateTitlu:'Fixtură', competente:[], lectii:'1',
  intro:'Fixtură pentru mașina de verificat lecții.',
  nivele:[{t:'Prețul cu taxă', lectii:[1], continuturi:['fixtură'],
    obiectiv:'calculezi un preț cu taxă folosind o formulă.',
    pasi:[
      {t:'Formule și semne',
       text:`<p>O <mark>formulă</mark> este un calcul făcut de Excel. Formula începe cu semnul = (egal). Semnul * (steluța) înseamnă înmulțire. Tasta Enter confirmă ce ai scris.</p>
<p>Fila Home are butoanele folosite cel mai des.</p>`},
      {t:'Prețul final',
       text:`<p>În B2 este prețul fără taxă. Acum tu: în C2 scrie =B2*1,21 ca să afli prețul cu TVA, apoi apasă Enter.</p>`,
       incearca:{t:'excel', q:'În <b>B5</b> scrie =SUM(B2:B4) și apasă Enter, ca să aduni prețurile.', cols:3, rows:5,
                 cells:{A1:'Produs', B1:'Preț', A2:'Caiet', B2:4, A3:'Pix', B3:2, A4:'Riglă', B4:6},
                 verifica:{formule:{B5:'=SUM(B2:B4)'}}, ajutor:'Copiază exact formula din enunț, apoi confirmă.', why:'Funcția adună toate prețurile din coloana de la rândul doi la patru.'}},
      {t:'Ce este TVA',
       text:`<p><mark>TVA</mark> este taxa pe valoarea adăugată: o parte din preț care merge la stat. Cota obișnuită e 21%, de aceea am înmulțit cu 1,21.</p>`}
    ],
    qs:[
      {t:'choice', q:'Ce înseamnă TVA?', o:['taxa pe valoarea adăugată','totalul vânzărilor anuale','tabelul valorilor adunate'], ok:0, why:'Taxa pe valoarea adăugată: partea din preț care ajunge la stat.'}
    ]}],
  tipuri:{excel:JocExcel},
  diploma:{titlu:'Fixtură', rezumat:'o fixtură', aplicatie:'Excel-ul adevărat', provocare:['Deschide Excel.']}
});
</script>
</body>
</html>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixtură: celulă cu două roluri</title>
<meta name="description" content="Fixtură a mașinii de verificat: o celulă folosită cu două roluri.">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script>
/* FIXTURĂ de test pentru _masina. Defect PUS INTENȚIONAT (constatarea 3 din 27.09):
   D1 e întâi capul de tabel „TVA”, apoi rezultatul 540, fără „foaie nouă” între.
   Pasul 2 începe corect pe o foaie nouă: acolo D1 poate primi alt rol. */
JocMotor.porneste({
  cheie:'test_masina_roluri', titlu:'Fixtură roluri', marca:'Fixtură <b>roluri</b>',
  clasa:'a VIII-a', unitate:'VIII-U1', unitateTitlu:'Fixtură', competente:[], lectii:'1',
  intro:'Fixtură pentru mașina de verificat lecții.',
  nivele:[{t:'Tabelul cu taxă', lectii:[1], continuturi:['fixtură'],
    obiectiv:'construiești un tabel mic cu un calcul.',
    pasi:[
      {t:'Capul de tabel',
       text:`<p>O <mark>celulă</mark> este pătrățelul de la întâlnirea unei coloane cu un rând. Tasta Enter confirmă ce ai scris. O <mark>formulă</mark> este un calcul; formula începe cu semnul = (egal). Semnul * (steluța) înseamnă înmulțire.</p>
<p>Acum tu: în A1 scrie Produs și apasă Enter. În D1 scrie TVA și apasă Enter.</p>`},
      {t:'Calculul',
       text:`<p>În B2 scrie 450 și apasă Enter. În C2 scrie 1,2 și apasă Enter. În D1 scrie =B2*C2 și apasă Enter. În D1 apare 540.</p>`},
      {t:'Alt tabel',
       text:`<p>Deschide o foaie nouă. În D1 scrie Total și apasă Enter.</p>`}
    ],
    qs:[
      {t:'tf', q:'Formula începe cu semnul egal.', ok:true, why:'Da: semnul egal pornește orice calcul din foaie.'}
    ]}],
  diploma:{titlu:'Fixtură', rezumat:'o fixtură', aplicatie:'Excel-ul adevărat', provocare:['Deschide Excel.']}
});
</script>
</body>
</html>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixtură: promisiune falsă</title>
<meta name="description" content="Fixtură a mașinii de verificat: lecția promite pe ecran ceva ce aplicația nu arată.">
<link rel="stylesheet" href="../../../jocuri/_motor/motor.css">
</head>
<body>
<script src="../../../jocuri/_motor/motor.js"></script>
<script src="../../../jocuri/_motor/tip-foaie.js"></script>
<script src="../../../jocuri/_motor/tip-excel.js"></script>
<script>
/* FIXTURĂ de test pentru _masina. Defect PUS INTENȚIONAT: pasul 1 promite că, după tragere, caseta de nume arată
   TOATĂ zona („A2:B4”). În Excel (și în simulator) caseta de nume arată doar celula activă, A2.
   Agentul care urmează lecția nu are cum să știe; EXECUTORUL trebuie să vadă nepotrivirea pe ecran. */
JocMotor.porneste({
  cheie:'test_masina_promisiune', titlu:'Fixtură promisiune', marca:'Fixtură <b>promisiune</b>',
  clasa:'a VIII-a', unitate:'VIII-U1', unitateTitlu:'Fixtură', competente:[], lectii:'1',
  intro:'Fixtură pentru mașina de verificat lecții.',
  nivele:[{t:'Zona', lectii:[1], continuturi:['fixtură'],
    obiectiv:'selectezi o zonă de celule trăgând cu mouse-ul.',
    pasi:[
      {t:'La ce folosește',
       text:`<p>Ca să lucrezi cu mai multe celule deodată, întâi le arăți aplicației pe care le vrei.</p>`},
      {t:'Selectezi o zonă',
       text:`<p>O <mark>zonă</mark> este un dreptunghi de celule. Ca s-o selectezi, apeși pe primul colț, ții apăsat butonul mouse-ului, tragi până la colțul opus și dai drumul.</p>
<p>După ce dai drumul, caseta de nume arată toată zona, de exemplu A2:B4.</p>`,
       incearca:{t:'excel', q:'Selectează zona <b>A2:B4</b>, trăgând de la A2 la B4.', cols:3, rows:5,
                 cells:{A1:'Elev', B1:'Nota', A2:'Ana', B2:9, A3:'Dan', B3:7, A4:'Ion', B4:8}, verifica:{zona:'A2:B4'},
                 ajutor:'Apasă pe A2, ține apăsat, du-te până la B4 și abia acolo dă drumul.', why:'Zona de la A2 până la B4 are 6 celule.'}}
    ],
    qs:[{t:'tf', q:'O zonă e un dreptunghi de celule.', ok:true, why:'Da: o zonă are două colțuri opuse.'}]}],
  tipuri:{excel:JocExcel},
  diploma:{titlu:'Fixtură', rezumat:'o fixtură', aplicatie:'Excel-ul adevărat', provocare:['Deschide Excel.']}
});
</script>
</body>
</html>
